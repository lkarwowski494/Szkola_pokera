    small: 0.3333333333333333
    actions:
      - { action: bet-small, explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, SPR {{w:spr}}: zakład {{w:rozmiar}}% puli nie wpłaci stacku." }
