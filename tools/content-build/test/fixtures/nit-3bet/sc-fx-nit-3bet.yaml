# Fixture testu HO (08-EX-8, SC-30): nit 3-betuje, pas ręką spoza górnych x%. Nie jest treścią aplikacji.
id: sc-fx-nit-3bet
module: m10
situation: "Fixture: nit z VPIP {{w:vpip}}% 3-betuje."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [fold], marginMin: 0.03 }
decisions:
  - street: preflop
    kind: nit-3bet
    rule: R-M10-007
    open: 2.5
    threeBet: 10
    vpips: [0.08, 0.1]
    actions:
      - { action: fold, explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, VPIP {{w:vpip}}%: pas." }
      - { action: call, explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, VPIP {{w:vpip}}%: sprawdzenie to niedokładność." }
