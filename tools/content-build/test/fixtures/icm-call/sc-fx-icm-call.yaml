# Fixture testu CA (F4): sprawdzenie all-inu przy ICM; equity z kart wobec zakresu push SB 10 bb. Nie jest treścią aplikacji.
id: sc-fx-icm-call
module: m11
situation: "Fixture: bańka, rywal wszedł all-in."
table: 6max
positions: { hero: BB, villain: SB }
stackBb: 10
levels: [latwy, sredni, trudny]
bounds:
