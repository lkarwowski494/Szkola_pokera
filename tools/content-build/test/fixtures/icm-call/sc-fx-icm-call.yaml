    kind: icm-call
    spot: push.sb-10
    rule: R-M11-009
    actions:
      - { action: fold, explanation: "Masz {{w:reka}} na {{w:pozycja}} na bańce, {{w:stol}}, rywal wszedł all-in. Pasujesz, bo przy ICM próg equity jest wyższy niż w grze o żetony." }
      - { action: call, explanation: "Masz {{w:reka}} na {{w:pozycja}} na bańce, {{w:stol}}, rywal wszedł all-in. Sprawdzasz, bo ręka ma wystarczające equity także przy ICM." }
