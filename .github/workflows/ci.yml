name: CI

# Rola 07 E3 (strategia.md §5.1): push także na gałęzie robocze agenta (claude/**) i integracyjne, żeby wynik był na tym
# samym SHA co lokalne `pnpm run ci` (zasada roli 07 nr 8). Repo publiczne: standardowe runnery bez opłat.
on:
  push:
    branches: [main, 'claude/**', 'integration/**']
  pull_request:
  # ręczne uruchomienie (Actions → CI → Run workflow); dostępne tylko dla osób z prawem zapisu
  workflow_dispatch:

# domyślny token tylko do odczytu (workflow niczego nie publikuje)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  # FZ (D-1520, KO-101): `pnpm run ci` podzielone na równoległe części, które łącznie wykonują dokładnie komendy skryptu `ci`
  # z package.json; `pnpm test` (`pnpm -r --if-present test`) rozpisane na pakiety. Zgodność pilnuje
  # tests/narzedzia/workflowy.test.mjs („ci.yml: części check…”). Lokalnie dalej `pnpm run ci` (jedna komenda).
  ci-kontrole:
    # typy, skrypty, kontrole, K-08 (informacyjnie), i18n, treść, rejestr (CI ac2ed2e3: ok. 2 min)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:skrypty
      - run: pnpm test:kontrole
      - run: pnpm k08
      - run: pnpm i18n:kod
      - run: pnpm content:check
      - run: pnpm tresci:rejestr
      - run: pnpm tresci:el-kontrola

  ci-testy-tresci:
    # najdłuższa część: testy budowania treści (CI ac2ed2e3: 382 s; rośnie z liczbą języków)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @szkola/content-build test

  ci-testy-silnik:
    # silnik i solver (CI ac2ed2e3: 135 s + 52 s)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @szkola/poker-core test
      - run: pnpm --filter @szkola/preflop-solver test

  ci-testy-aplikacja:
    # aplikacja i pakiety domeny (CI ac2ed2e3: 75 s + ok. 25 s)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @szkola/mobile test
      - run: pnpm --filter @szkola/domena test
      - run: pnpm --filter @szkola/postep test
      - run: pnpm --filter @szkola/srs test
      - run: pnpm --filter @szkola/jezyki test

  check:
    # Nazwa zachowana (może być wymaganym statusem). `if: always()`, bo zadanie pominięte po porażce części liczy się
    # w wymaganych statusach jak sukces; tu każda część musi mieć wynik success (porażka, anulowanie, pominięcie = czerwone).
    # Wzór agregacji przez needs + always(): Trening nightly.yml:141–142 (odczyt 2026-11-13).
    needs: [ci-kontrole, ci-testy-tresci, ci-testy-silnik, ci-testy-aplikacja]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wszystkie części CI zielone
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS_JSON" | jq -e 'length == 4 and (to_entries | all(.value.result == "success"))' > /dev/null

  rachunki:
    # D-173 (JAK-E1-02): 3 rachunki niezależne liczb z treści (167 sprawdzeń). Bramka od 2026-11-07: pierwszy przebieg
    # informacyjny zielony (run 42367067205, 32 s; zasada roli 07 nr 8).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Zależności z hashami (PyYAML, numpy)
        run: 'python -m pip install --require-hashes --only-binary=:all: -r docs/tresci/narzedzia/rachunki/requirements.txt'
      - name: Rachunki M0–M4, M5–M8, M12
        run: |
          python -I docs/tresci/narzedzia/rachunki/rachunek_m0_m4.py
          python -I docs/tresci/narzedzia/rachunki/rachunek_m5_m8.py
          python -I docs/tresci/narzedzia/rachunki/rachunek_m12.py

  akceptacja:
    # D-175: testy oczekujące (tests/akceptacja/) są czerwone z założenia, dopóki rola 08 ich nie zazieleni — informacja
    # na stałe (continue-on-error). Wynik: liczby w podsumowaniu przebiegu i log w artefakcie (bez danych osobowych).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testy oczekujące (domena + ekrany)
        run: |
          set -o pipefail
          pnpm test:akceptacja 2>&1 | tee akceptacja.log
      - name: Podsumowanie
        if: always()
        run: |
          touch akceptacja.log
          {
            echo "## Testy oczekujące (D-175, informacja)"
            echo
            if grep -qE "Tests +[0-9]|^Tests:" akceptacja.log; then grep -E "Tests +[0-9]|^Tests:" akceptacja.log | sed 's/^/- /'; else echo "- brak wyniku (log w artefakcie)"; fi
            echo
            echo "ID testów w logu (czerwone i strażniki):"
            grep -oE "AK-[A-Z0-9]+(-[A-Za-z0-9]+)*" akceptacja.log | sort -u | tr '\n' ' ' || true
            echo; echo
            echo "Powody czerwieni (znacznik):"
            grep -oE "NIEZAIMPLEMENTOWANE: [^\\\`'\"]+" akceptacja.log | sort | uniq -c | sort -rn | head -40 | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: akceptacja-log
          path: akceptacja.log
          retention-days: 7
          if-no-files-found: ignore
