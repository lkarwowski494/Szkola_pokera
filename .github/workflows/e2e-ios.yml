# Testy E2E (B-028; ADR-10 po zmianie z 5.10.2026): Maestro na symulatorze iOS w GitHub Actions, bez EAS Workflows.
# Repozytorium jest publiczne, więc standardowy runner macos-26 jest darmowy. Runnery „large” są płatne także dla
# publicznych repozytoriów: tu tylko standardowy.
#
# Build pod symulator bez podpisu i bez sekretów (expo prebuild + xcodebuild -sdk iphonesimulator, konfiguracja Release,
# więc JavaScript jest w paczce i Metro nie jest potrzebne). Flowy: apps/mobile/e2e/*.yaml (oczekujace/ poza bramką, D-189).
# Wyzwalacze (D-170, analogia Trening e2e-ios.yml): push na main i integration/** bez zmian samej dokumentacji, testów
# Node i ustawień agenta; ręcznie (wejścia: urządzenie, wygląd); workflow_call z nocny.yml (mały ekran, ciemny wygląd).
# Bez pull_request (25 min czekania na PR, D-170). Nieudany flow ponawiany RAZ osobno; zielony w ponowieniu wypisany
# w podsumowaniu, drugi czerwony = porażka (D-178). D-181: pierwszy przebieg na gałęzi po przeglądzie tego pliku.
# D-194 (2026-11-07): plik przeniesiony z e2e.yml (wyłączony ręcznie 20.10 — stan wyłączenia jest przypięty do pliku i zdjąć go
# może tylko administrator) pod nazwę z Treningu; nowy plik jest aktywny bez kroku właściciela. Push także na claude/**
# (odstępstwo od Treningu: gałąź agenta jest tu gałęzią integracyjną przebudowy, a workflow_dispatch nie widzi workflowu
# nieobecnego na main, zanim raz się uruchomi); informacyjnie, poprzedni przebieg tej gałęzi anulowany.
# DT (2026-11-11, zgoda właściciela „Zgoda na przyspieszenia”, D-1020…D-1023): zadanie `build` (raz, cache CocoaPods i DerivedData) →
# artefakt szkola-sim-app → zadanie `e2e` w macierzy `czesc` 1–2 (połowa flowów każda; podział: scripts/ci/e2e-podzial.mjs) →
# zadanie `e2e-razem` (wszystkie flowy wykonane i zielone). Te same flowy, progi i ponowienia (D-178). Wzór: Trening e2e-ios.yml:121–133.
name: E2E iOS (symulator)
# D-273: przebieg z aplikacją z innego przebiegu ma dopisek w tytule — bramka TestFlight (scripts/ci/bramka-e2e.mjs) go nie liczy.
# Bez wejścia tytuł jest stały (wzór Trening e2e-ios.yml:15, odczyt 2026-11-08); commit widać w kolumnie przebiegu.
run-name: ${{ inputs.aplikacja_z_przebiegu != '' && 'E2E iOS · aplikacja z innego przebiegu' || 'E2E iOS (symulator)' }}
on:
  push:
    branches: [main, 'integration/**', 'claude/**']
    paths-ignore: ['docs/**', '**/*.md', 'tests/**', '.claude/**', 'store/**'] # store/: tekst sklepu, nie wchodzi do aplikacji (D-327)
  workflow_dispatch:
    inputs:
      aplikacja_z_przebiegu:
        description: 'Numer przebiegu z gotową aplikacją (artefakt szkola-sim-app żyje 1 dzień); pusty = zbuduj od nowa. Tylko przy zmianie samych flowów (~24 min mniej); nie otwiera bramki TestFlight'
        required: false
        default: ''
      urzadzenie:
        description: 'Wzorzec nazwy symulatora (wyrażenie regularne JS), np. "iPhone SE|iPhone 16e" — mały ekran; pusty = najnowszy iPhone z obrazu'
        required: false
        default: ''
      wyglad:
        description: 'Wygląd systemu symulatora: light albo dark'
        type: choice
        options: [light, dark]
        default: light
  workflow_call:
    inputs:
      aplikacja_z_przebiegu: { type: string, required: false, default: '' }
      urzadzenie: { type: string, required: false, default: '' }
      wyglad: { type: string, required: false, default: 'light' }
permissions:
  contents: read
  actions: read  # D-273: pobranie artefaktu aplikacji z innego przebiegu (download-artifact z run-id)
env:
  # wersja zmierzona 5.10.2026 (4/4 flowy, przebieg 37304275812); instalator czyta MAESTRO_VERSION
  MAESTRO_VERSION: 2.11.0
  MAESTRO_CLI_NO_ANALYTICS: '1'
  # 08-F03 (D-233): sterownik XCTest po świeżym rozruchu symulatora startuje dłużej niż domyślny czas Maestro (2× „iOS driver
  # not ready in time” przed pierwszym flowem: 42415740308, 42422522419); wartość jak w Treningu (e2e-ios.yml:207)
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000'
  # build bez sekretów: bez wysyłania map źródeł i dSYM do Sentry (skrypty Xcode z pluginu @sentry/react-native)
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  build:
    if: github.repository == 'lkarwowski494/szkola_pokera' && inputs.aplikacja_z_przebiegu == ''
    # Expo SDK 57 wymaga Xcode 26.4+; obraz macos-26 ma domyślnie Xcode 26.4.1 (jak w iphone-local.yml)
    runs-on: macos-26
    # wzór (strategia.md §5.1): 30 + 3 × liczba flowów w apps/mobile/e2e/*.yaml + 10 (zapas); 9 flowów → 67 (08-drugi-jezyk, D-353)
    # (08 cz. 5b krok 7: 05, 06, 09 przeniesione z oczekujace/). Limit zostaje wzorem dla CAŁEGO przebiegu (build + część flowów):
    # po podziale (DT) build to ~30 min, a część ~10 min, więc 67 daje zapas także na zimny cache. Pilnuje tests/narzedzia/e2e-flowy.test.mjs.
    # D-258 (08-F14): stały składnik 20 → 30 — build SDK 58 28 min 46 s; limit 42 minął w sprzątaniu (42485850361).
    timeout-minutes: 67
    steps:
      - uses: actions/checkout@v5
        with:
          # pod install i expo prebuild uruchamiają kod zewnętrzny: token nie zostaje w .git/config (przegląd D-043 nr 9)
          persist-credentials: false
      - name: Start pomiaru
        run: echo "E2E_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Xcode
        run: |
          xcodebuild -version
          v=$(xcodebuild -version | head -1 | awk '{print $2}')
          [ "$(printf '%s\n' 26.4 "$v" | sort -V | head -1)" = "26.4" ] || { echo "::error::Xcode $v jest za stary dla Expo SDK 57 (wymagane 26.4+)"; exit 1; }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Treść aktualna
        run: pnpm content:check
      - name: Podział flowów (lista przed = po)
        run: node scripts/ci/e2e-podzial.mjs sprawdz 2 apps/mobile/e2e

      # D-1021/D-1022: klucz zależy od lockfile'a (pnpm-lock.yaml) i konfiguracji aplikacji; zapis pod kluczem z SHA, odczyt z przedrostka.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-v1-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}-${{ github.sha }}
          restore-keys: cocoapods-v1-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}-
      - name: Projekt iOS (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install --clean
      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      # D-1022 (po przebiegu 43080852450): ccache nie zadziałał (0,0 GB po buildzie), więc zamiast niego cache DerivedData (derivedDataPath
      # `build` w ios/); przywracany PO prebuild i pod install (prebuild --clean kasuje ios/), Xcode dobuduje tylko zmienione cele.
      - name: Cache DerivedData
        id: dd
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/build
          key: xcode-dd-v1-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}-${{ github.sha }}
          restore-keys: xcode-dd-v1-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}-
      - name: Kompilacja na symulator (bez podpisu)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          echo "Workspace: $WS, schemat: $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | { if command -v xcbeautify >/dev/null; then xcbeautify; else cat; fi; }
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          test -n "$APP" && test -f "$APP/main.jsbundle"
          echo "APP_PATH=$PWD/$APP" >> "$GITHUB_ENV"
      - name: Cache DerivedData — wynik
        if: always()
        run: |
          echo "- cache DerivedData: ${{ steps.dd.outputs.cache-hit == 'true' && 'trafienie (dokładny klucz)' || 'brak dokładnego klucza (odczyt z przedrostka albo zimny)' }}" >> "$GITHUB_STEP_SUMMARY"
          du -sh apps/mobile/ios/build 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Zapis aplikacji (do ponownego użycia, D-273)
        run: cd "$(dirname "$APP_PATH")" && zip -qry "$GITHUB_WORKSPACE/szkola-sim.zip" "$(basename "$APP_PATH")"
      - uses: actions/upload-artifact@v5
        with:
          name: szkola-sim-app
          path: szkola-sim.zip
          retention-days: 1
      - name: Czas buildu
        if: always()
        run: |
          b=$(( $(date +%s) - E2E_START ))
          { echo "## Build"; echo; echo "- build i zależności: $((b / 60)) min $((b % 60)) s"; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Czas buildu::$((b / 60)) min $((b % 60)) s"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: xcodebuild-log
          path: apps/mobile/ios/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e (część ${{ matrix.czesc }}/2)
    needs: build
    # build pominięty (wejście aplikacja_z_przebiegu) = aplikacja z innego przebiegu; build nieudany = części się nie uruchamiają
    if: ${{ !cancelled() && github.repository == 'lkarwowski494/szkola_pokera' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-26
    strategy:
      fail-fast: false  # porażka jednej części nie przerywa drugiej — wynik wszystkich flowów w jednym przebiegu
      matrix:
        czesc: [1, 2]  # liczba części = argument M w e2e-podzial.mjs (pilnuje tests/narzedzia/workflowy.test.mjs)
    # część to ok. połowa flowów: 3 min na flow (strategia.md §5.1) × 9 + 10 zapasu; pilnuje tests/narzedzia/workflowy.test.mjs
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Start pomiaru
        run: echo "E2E_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Treść aktualna
        run: pnpm content:check
      - name: Część flowów
        env:
          CZESC: ${{ matrix.czesc }}
        run: |
          node scripts/ci/e2e-podzial.mjs sprawdz 2 apps/mobile/e2e
          node scripts/ci/e2e-podzial.mjs czesc "$CZESC" 2 apps/mobile/e2e "$RUNNER_TEMP/e2e-czesc" | tee flowy-czesci.txt
          echo "E2E_CZESC_DIR=$RUNNER_TEMP/e2e-czesc" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v5
        if: inputs.aplikacja_z_przebiegu != ''
        with:
          name: szkola-sim-app
          run-id: ${{ inputs.aplikacja_z_przebiegu }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        if: inputs.aplikacja_z_przebiegu == ''
        with:
          name: szkola-sim-app
      - name: Rozpakowanie aplikacji
        env:
          Z_PRZEBIEGU: ${{ inputs.aplikacja_z_przebiegu }}
        run: |
          [ -z "$Z_PRZEBIEGU" ] || echo "::notice title=Aplikacja z innego przebiegu::#$Z_PRZEBIEGU — flowy na aplikacji z tamtego commitu; ten przebieg nie otwiera bramki TestFlight"
          mkdir -p "$RUNNER_TEMP/aplikacja" && unzip -q szkola-sim.zip -d "$RUNNER_TEMP/aplikacja"
          APP=$(ls -d "$RUNNER_TEMP"/aplikacja/*.app | head -1)
          test -n "$APP" && test -f "$APP/main.jsbundle"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Maestro
        # 42566410755 (2026-11-09): 2× `curl: (56) … 504` przy maestro.zip → flowy nieuruchomione. Do 3 prób z przerwą 20/40 s;
        # pipefail: bez niego kod potoku to kod `bash`, a nieudane pobranie instalatora wyglądałoby na sukces (sesja I, strażnik
        # w tests/narzedzia/workflowy.test.mjs). Trening (e2e-ios.yml:194–203) bez ponowienia — odstępstwo nazwane.
        run: |
          set -o pipefail
          for proba in 1 2 3; do
            if curl -fsSL https://get.maestro.mobile.dev | bash; then break; fi
            if [ "$proba" -eq 3 ]; then echo "::error::Instalacja Maestro nieudana 3 razy"; exit 1; fi
            echo "::warning::Instalacja Maestro: próba $proba nieudana, ponowienie za $((proba * 20)) s"
            rm -rf "$HOME/.maestro"
            sleep $((proba * 20))
          done
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Symulator
        env:
          WZORZEC: ${{ inputs.urzadzenie }}
          WYGLAD: ${{ inputs.wyglad || 'light' }}
        run: |
          # najnowszy dostępny iPhone z obrazu runnera albo pierwszy pasujący do wejścia `urzadzenie` (RegExp w Node, nocny: mały ekran)
          UDID=$(xcrun simctl list devices available --json | WZORZEC="$WZORZEC" node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const w = process.env.WZORZEC ? new RegExp(process.env.WZORZEC) : null;
            const rt = Object.keys(d).filter((k) => k.includes("iOS")).sort((a, b) => a.localeCompare(b, "en", { numeric: true })).reverse();
            for (const k of rt) { const p = w ? d[k].find((x) => w.test(x.name)) : (d[k].find((x) => /^iPhone \d+$/.test(x.name)) ?? d[k].find((x) => x.name.startsWith("iPhone"))); if (p) { console.error(k, p.name); console.log(p.udid); break; } }')
          test -n "$UDID" || { echo "::error::brak symulatora dla wzorca „$WZORZEC”"; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance "$WYGLAD"
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Flowy Maestro (pierwszy przebieg)
        id: flowy
        continue-on-error: true
        run: |
          set -o pipefail
          # teksty z treści (content/) dla flowów przez helplines-env.mjs; bash 3.2 na macOS nie ma mapfile
          ENV_ARGS=(); while IFS= read -r l; do ENV_ARGS+=("$l"); done < <(node apps/mobile/e2e/helplines-env.mjs)
          test "${#ENV_ARGS[@]}" -gt 0
          printf '%s\n' "${ENV_ARGS[@]}" > e2e-env.txt
          mkdir -p e2e-out
          maestro --device "$SIM_UDID" test "${ENV_ARGS[@]}" --format junit --output e2e-out/report.xml \
            --test-output-dir e2e-out "$E2E_CZESC_DIR" < /dev/null
      - name: Ponowienie nieudanych flowów (raz, D-178)
        if: steps.flowy.outcome == 'failure'
        run: |
          ENV_ARGS=(); while IFS= read -r l; do ENV_ARGS+=("$l"); done < e2e-env.txt
          # lista jak w Treningu (e2e-ios.yml:232–238): `for` po wyniku, nie `while read` z pliku — Maestro nie zje stdin;
          # nazwy plików flowów bez spacji (NN-nazwa.yaml)
          NIEUDANE=$(node scripts/ci/e2e-ponowienia.mjs nieudane e2e-out/report.xml "$E2E_CZESC_DIR" || true)
          i=0
          for flow in $NIEUDANE; do
            i=$((i + 1))
            echo "::warning title=Ponowienie E2E::$flow (jedno, osobno)"
            maestro --device "$SIM_UDID" test "${ENV_ARGS[@]}" --format junit --output "e2e-out/ponowienie-$i.xml" \
              --test-output-dir "e2e-out/ponowienie-$i" "$flow" < /dev/null || true
          done
      - name: Wynik E2E
        if: always()
        env:
          PIERWSZY: ${{ steps.flowy.outcome }}
        run: |
          set -o pipefail
          mkdir -p e2e-out
          # kod pierwszego przebiegu: porażka Maestro bez nieudanego flowu albo brak flowu CZĘŚCI w raporcie = porażka zadania
          [ "$PIERWSZY" = "success" ] && KOD=0 || KOD=1
          node scripts/ci/e2e-ponowienia.mjs podsumuj e2e-out/report.xml "$E2E_CZESC_DIR" "$KOD" e2e-out/ponowienie-*.xml | tee e2e-out/podsumowanie.md >> "$GITHUB_STEP_SUMMARY"
      - name: Czas części
        if: always()
        run: |
          b=$(( $(date +%s) - E2E_START ))
          { echo "## E2E część ${{ matrix.czesc }}/2"; echo; echo "- zależności, symulator i flowy: $((b / 60)) min $((b % 60)) s"; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Czas E2E (część ${{ matrix.czesc }})::$((b / 60)) min $((b % 60)) s"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-wyniki-${{ matrix.czesc }}
          path: e2e-out
          # zrzuty i logi w repo publicznym są publiczne: flowy bez danych osobowych (moduł e2e-mobilne)
          retention-days: 7
          if-no-files-found: ignore

  # DT: „wynik łączny = wszystkie flowy; część padnięta = przebieg czerwony”. Zadanie czerwone, gdy którakolwiek część (albo build)
  # nie jest zielona; zielone tylko, gdy raporty części razem zawierają KAŻDY flow bramki (lista przed = po).
  e2e-razem:
    name: e2e (razem)
    needs: [build, e2e]
    if: ${{ always() && github.repository == 'lkarwowski494/szkola_pokera' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        if: ${{ !cancelled() }}
        with:
          pattern: e2e-wyniki-*
          path: wyniki
        continue-on-error: true
      - name: Wszystkie flowy wykonane i zielone
        env:
          BUILD: ${{ needs.build.result }}
          CZESCI: ${{ needs.e2e.result }}
        run: |
          echo "build: $BUILD, części: $CZESCI"
          { [ "$BUILD" = success ] || [ "$BUILD" = skipped ]; } || { echo "::error::build: $BUILD"; exit 1; }
          [ "$CZESCI" = success ] || { echo "::error::części E2E: $CZESCI"; exit 1; }
          node scripts/ci/e2e-podzial.mjs sprawdz 2 apps/mobile/e2e
          node scripts/ci/e2e-podzial.mjs razem apps/mobile/e2e wyniki | tee -a "$GITHUB_STEP_SUMMARY"
