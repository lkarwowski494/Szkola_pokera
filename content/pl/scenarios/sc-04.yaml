# SC-04 (M3): UTG otwiera albo pasuje (F1, punkt range-spot rfi.utg), potem c-bet na suchym wysokim flopie (F2, cbet-case R-M5-007,
# jak SC-11, ręka bez pary i drawa). Rola 06, sesje DU (szkic) i EH (treść), 2026-11-11.
# Ocena preflop: rangeVerdict na częstościach solvera projektu (spot rfi.utg, walidacja: spots.yaml:1-5), reguła R-M3-002 (gto).
# Reguła c-betu mówi o agresorze z pozycją ogólnie, a jej źródło szczebla 4 nie wiąże rozmiaru z pozycją Buttona (D-1031); przypadki
# c-betu pochodzą z zadania Buttona wobec BB.
# Jeden poziom (D-1165): tekstura = cały przypadek R-M5-007 (wysoki, trzy kolory, rozłączony albo półpołączony bez OESD). Sam flop
# rozłączony (jak SC-11 łatwy) generator po punkcie range-spot trafia w ok. 0,06% losowań (flop nie jest dolosowywany do tekstury),
# więc szablon nie powstaje; poziom średni wraca po zadaniu 08-EH-1 (dolosowanie flopu po range-spot).
id: sc-04
module: m3
situation: "Jesteś na {{t:utg|UTG}}, nikt jeszcze nie wszedł do gry; jeśli {{t:open|otworzysz}}, {{t:big-blind}} {{t:call|sprawdzi}} i na flopie {{t:check|poczeka}}."
table: 6max
positions: { hero: UTG, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [high], suits: [rainbow], ranks: [disconnected, semi-connected], oesdPossible: false }
    holding: [air]
    expected: ["raise 2.5", bet-small]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.utg
    rule: R-M3-002
    actions:
      - action: "raise 2.5"
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, nikt jeszcze nie wszedł do gry. {{t:open|Otwierasz}}, bo ta ręka mieści się w ciasnym {{t:range|zakresie}} z {{t:utg|UTG}}: za tobą jest jeszcze pięciu graczy, więc ktoś częściej ma lepszą rękę, dlatego z {{t:utg|UTG}} {{t:open|otwierasz}} tylko ok. {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} rąk."
      - action: fold
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, nikt jeszcze nie wszedł do gry. {{t:fold|Pas}} jest za ostrożny: solver tę rękę zwykle {{t:open|otwiera}} także z {{t:utg|UTG}}. Za tobą jest jeszcze pięciu graczy, więc {{t:range|zakres}} z {{t:utg|UTG}} jest ciasny, ok. {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} rąk, ale ta ręka się w nim mieści."
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a {{t:big-blind}} {{t:check|czeka}}. {{t:bet|Stawiasz}} mało, ok. {{n:cbet.size.small}} {{t:pot|puli}}, bo masz {{t:range-advantage|przewagę zakresu}}, a słabe ręce rywala prawie nie mają szans: mały {{t:bet}} wystarczy, żeby je {{t:fold|spasował}}."
      - action: check
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a {{t:big-blind}} {{t:check|czeka}}. {{t:check|Czekanie}} jest dopuszczalne, ale rzadsze: na {{t:dry|suchym}} wysokim flopie {{t:c-bet|c-betujesz}} często i mało, bo masz {{t:range-advantage|przewagę zakresu}}, a słabe ręce rywala {{t:fold|spasowałyby}} już mały {{t:bet}}. {{t:check|Czekając}}, dajesz im darmową kartę."
      - action: bet-big
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a {{t:big-blind}} {{t:check|czeka}}. Duży {{t:bet}} to tu niedokładność: na {{t:dry|suchym}} wysokim flopie {{t:c-bet|c-betujesz}} zwykle mało, ok. {{n:cbet.size.small}} {{t:pot|puli}}, bo słabe ręce rywala {{t:fold|spasują}} już taki {{t:bet}}."
