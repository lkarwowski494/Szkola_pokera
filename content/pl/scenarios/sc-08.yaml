# SC-08 (M4): mały blind 3-betuje otwarcie Buttona, rozmiar 3-betu (F1 + F3: range-spot vs-open.sb-vs-btn, potem size-spot three-bet-size oop).
# Rola 06, sesje DU (szkic) i EH (treść), 2026-11-11. Zamiast Buttona wobec CO z planu (D-1030): w spocie vs-open.btn-vs-co
# podział 3-bet / sprawdzenie nie przeszedł walidacji (spots.yaml:51-53), a ekran ocenia każdą akcję węzła (D-866). SB wobec BTN: R-M4-003 (gto,
# „3-bet albo pas”), rozmiar R-M4-002 (oop, 4 × otwarcie = 10 bb, ta sama kwota co etykieta solvera „raise 10”).
# Jeden poziom (łatwy): rozkład solvera prawie czysty, więc poziomu średniego nie da się wyznaczyć częstością (D-1034).
# Pojemność: w spocie vs-open.sb-vs-btn 26 klas rąk ma 3-bet ≥ 97%, a odcisk szablonu bez flopu to sama ręka; próg pojemności
# bez flopu = liczba klas (KO-074, D-1040, wdrożone 88253858), więc 26 wariantów wystarcza.
id: sc-08
module: m4
situation: "Jesteś na {{t:small-blind|małym blindzie}}, a Button {{t:open|otworzył}} na {{n:pf.open-size}}."
table: 6max
positions: { hero: SB, villain: BTN }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { freqs: [{ min: 0.97, max: 1 }, null], expected: ["raise 10", raise] }
decisions:
  - street: preflop
    kind: range-spot
    spot: vs-open.sb-vs-btn
    rule: R-M4-003
    actions:
      - action: "raise 10"
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, Button {{t:open|otworzył}}. 3-betujesz, bo ta ręka jest w górze {{t:range|zakresu}}, którą z {{t:small-blind|małego blinda}} 3-betujesz: po {{t:call|sprawdzeniu}} grałbyś {{t:out-of-position}}, a {{t:big-blind}} za tobą może jeszcze {{t:raise|przebić}}; 3-bet daje {{t:initiative|inicjatywę}} i szansę wygrania {{t:pot|puli}} od razu."
      - action: "call 2.5"
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, Button {{t:open|otworzył}}. Z {{t:small-blind|małego blinda}} wobec Buttona prawie nie {{t:call|sprawdzasz}}: po {{t:call|sprawdzeniu}} grasz {{t:out-of-position}}, a {{t:big-blind}} za tobą może jeszcze {{t:raise|przebić}}. Tę rękę 3-betujesz, bo 3-bet daje {{t:initiative|inicjatywę}} i szansę wygrania {{t:pot|puli}} od razu."
      - action: fold
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, Button {{t:open|otworzył}}. {{t:fold|Pas}} jest za ostrożny: ta ręka jest w górze {{t:range|zakresu}}, którą z {{t:small-blind|małego blinda}} 3-betujesz (ok. {{n:pf.3bet-freq.sb-vs-btn}} rąk). 3-bet daje {{t:initiative|inicjatywę}} i szansę wygrania {{t:pot|puli}} od razu."
  - street: preflop
    kind: size-spot
    check: three-bet-size
    rule: R-M4-002
    openBb: 2.5
    actions:
      - action: raise
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, i 3-betujesz {{t:open|otwarcie}} Buttona. {{t:raise|Przebijasz}} do ok. {{n:pf.3bet.size-oop}} {{t:open|otwarcia}}, czyli do {{n:pf.3bet.oop-total}}, bo po flopie będziesz mówić pierwszy, więc większym {{t:raise|przebiciem}} odbierasz rywalowi tanie {{t:call}} {{t:in-position}}."
      - action: raise-small
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, i 3-betujesz {{t:open|otwarcie}} Buttona. Ten rozmiar to niedokładność: po flopie będziesz mówić pierwszy, więc {{t:raise|przebijasz}} do ok. {{n:pf.3bet.size-oop}} {{t:open|otwarcia}} ({{n:pf.3bet.oop-total}}); mniejsze {{t:raise|przebicie}} daje rywalowi tanie {{t:call}} {{t:in-position}}."
      - action: raise-big
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, i 3-betujesz {{t:open|otwarcie}} Buttona. Ten rozmiar to niedokładność: wystarczy ok. {{n:pf.3bet.size-oop}} {{t:open|otwarcia}} ({{n:pf.3bet.oop-total}}); już taki rozmiar odbiera rywalowi tanie {{t:call}} {{t:in-position}}, a większy ryzykuje więcej {{t:chips|żetonów}} tą samą ręką."
