# SC-01 (M2): draw do koloru wobec małych zakładów na flopie i turnie. Oceny: rachunek R-M2-005 (flop) i R-M7-007 (turn):
# sprawdzenie, gdy szansa na jedną kartę przewyższa cenę. Małe zakłady (do ok. 0,3 puli), bo pas drawem do koloru wobec
# średnich zakładów przy 100 bb przeczy rachunkowi na dwie karty i implied odds (D-630). Rola 06, sesja BS, 2026-11-10.
id: sc-01
module: m2
situation: "Po {{t:3-bet|3-becie}} masz {{t:flush-draw}}, a rywal na flopie i na turnie {{t:bet|stawia}} mało."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni, trudny]
bounds:
  latwy: { draws: [flush], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
  sredni: { draws: [flush], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
  trudny: { draws: [flush], marginMin: 0, marginMax: 0.02, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
decisions:
  - street: flop
    kind: draw-call
    pots: [18, 20, 22, 24]
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:bet|stawia}} mało w stosunku do {{t:pot|puli}}. {{t:call|Sprawdzasz}}, bo płacisz tylko za jedną kartę, a {{t:flush-draw}} trafia na niej częściej, niż wymaga tak niska cena. Masz {{n:outs.flush}} outów, więc {{t:flush|kolor}} wpada na turnie w ok. {{n:odds.flush.flop-turn}} przypadków, czyli mniej więcej co piątą kartę. To uproszczenie: liczysz tylko outy drawa.{{jesli:nadkarty}} Każda twoja karta wyższa od stołu daje jeszcze najwyżej {{n:pair.outs.per-rank}} niepewne outy na {{t:pair|parę}}, ale tu nie zmienia to odpowiedzi.{{/jesli}}"
      - action: fold
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:bet|stawia}} mało w stosunku do {{t:pot|puli}}. {{t:fold|Pas}} oddaje {{t:pot|pulę}}, na której {{t:call|sprawdzenie}} zarabia: przy tak małym {{t:bet|zakładzie}} {{t:flush-draw}} trafia częściej, niż wymaga cena. Pasuj, gdy cena jest wyższa niż szansa na trafienie, a nie dlatego, że jeszcze nie masz układu. To uproszczenie: liczysz tylko outy drawa.{{jesli:nadkarty}} Każda twoja karta wyższa od stołu daje jeszcze najwyżej {{n:pair.outs.per-rank}} niepewne outy na {{t:pair|parę}}, ale tu nie zmienia to odpowiedzi.{{/jesli}}"
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}: turn nie dał {{t:flush|koloru}}, a rywal z {{w:rywal}} znowu {{t:bet|stawia}} mało. {{t:call|Sprawdzasz}}, bo do rivera została jedna karta, a za tak niską cenę {{t:flush-draw}} nadal trafia wystarczająco często. {{t:flush|Kolor}} wpada na riverze w ok. {{n:odds.flush.turn-river}} przypadków, czyli mniej więcej co piątą kartę. To uproszczenie: liczysz tylko outy drawa.{{jesli:nadkarty}} Każda twoja karta wyższa od stołu daje jeszcze najwyżej {{n:pair.outs.per-rank}} niepewne outy na {{t:pair|parę}}, ale tu nie zmienia to odpowiedzi.{{/jesli}}"
      - action: fold
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}: turn nie dał {{t:flush|koloru}}, a rywal z {{w:rywal}} znowu {{t:bet|stawia}} mało. {{t:fold|Pas}} jest za ciasny: na turnie liczysz szansę na jedną kartę, a przy tak małym {{t:bet|zakładzie}} ta karta trafia częściej, niż wymaga cena, więc oddajesz {{t:pot|pulę}}, na której {{t:call|sprawdzenie}} zarabia. To uproszczenie: liczysz tylko outy drawa.{{jesli:nadkarty}} Każda twoja karta wyższa od stołu daje jeszcze najwyżej {{n:pair.outs.per-rank}} niepewne outy na {{t:pair|parę}}, ale tu nie zmienia to odpowiedzi.{{/jesli}}"
