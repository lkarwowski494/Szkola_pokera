        explanation: "Masz {{w:reka}} na {{w:pozycja}} na {{t:bubble|bańce}}, {{w:stol}}, a {{t:small-blind}} wszedł {{t:all-in}}. {{t:call|Sprawdzasz}}, bo ta ręka ma wobec {{t:range|zakresu}} {{t:all-in|all-inu}} więcej {{t:equity}}, niż wymaga próg z {{t:icm}}. Ten próg jest wyższy niż w grze o {{t:chips|żetony}}, bo w {{t:tournament|turnieju}} z {{t:payout|wypłatami}} przegrana kosztuje więcej pieniędzy, niż wygrana dodaje."
