# SC-09 (M4): izolacja limpera, rozmiar przebicia (punkt size-spot iso-size, 08-N3, D-1140). Ocena: isoSizeOptions z parametrów R-M4-012
# (standard = pf.iso.base + limperzy × pf.iso.per-limper, z SB i BB + pf.iso.oop-extra); inny rozmiar to niedokładność. Układ stołu: limperem jest ostatnie
# miejsce przed graczem (HX D-1800). Gracz tylko poza BB (HZ D-1824, recenzja HX P2): z BB limper z SB jest bez pozycji wobec gracza, a generator dolicza +1 bb
# (scenario-gen.ts:1214); rozstrzygnięcie dla BB otwarte (docs/tresci/rejestr-hz.md). R-M4-013 (którą ręką izolować) nie jest oceniane.
id: sc-09
module: m4
situation: "{{t:hijack|HJ}} tylko wyrównał {{t:big-blind|duży blind}} ({{t:limp}}), a {{t:utg|UTG}} {{t:fold|spasował}}. Masz rękę, którą {{t:raise|przebijasz}} ({{t:isolation|izolacja}}). Jaki rozmiar {{t:raise|przebicia}} wybierasz?"
table: 6max
positions: { hero: CO, villain: HJ }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [raise] }
decisions:
  - street: preflop
    kind: size-spot
    check: iso-size
    rule: R-M4-012
    limpers: 1
    actions:
      - action: raise
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, przed tobą jeden {{t:limp|limper}}. {{t:raise|Przebijasz}} do {{n:pf.iso.base}} plus {{n:pf.iso.per-limper}} za każdego limpera, bo mniejsze {{t:raise|przebicie}} daje limperowi zbyt dobrą cenę i nie odbiera mu rozdania."
      - action: raise-small
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, przed tobą jeden {{t:limp|limper}}. To {{t:raise|przebicie}} jest za małe: daje limperowi zbyt dobrą cenę i nie odbiera mu rozdania. Standard to {{n:pf.iso.base}} plus {{n:pf.iso.per-limper}} za każdego limpera."
      - action: raise-big
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, {{w:stol}}, przed tobą jeden {{t:limp|limper}}. Ten rozmiar odbiega od standardu: {{t:raise|przebijasz}} do {{n:pf.iso.base}} plus {{n:pf.iso.per-limper}} za każdego limpera, {{t:out-of-position}} o {{n:pf.iso.oop-extra}} więcej."
