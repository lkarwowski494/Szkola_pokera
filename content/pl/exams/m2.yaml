# Pula egzaminacyjna M2 (outy, szanse, pot odds): te same reguły co lekcje m2.l1 i m2.l2, inne rozdania i liczby.
module: m2
drills:
  - kind: choice
    id: m2.exam.q1
    family: m2.outs.flush
    rules: [R-M2-001]
    prompt: "Masz w ręce tylko jedną kartę w karo, ale na flopie leżą trzy. Ile masz outów do {{t:flush|koloru}}?"
    table: { hand: "Ad Tc", board: "Kd 8d 3d" }
    options:
      - { text: "{{n:outs.flush}}", correct: true, why: "Liczy się, ile kart w kolorze widzisz łącznie: 1 w ręce i 3 na {{t:board|stole}}, razem {{n:draw.flush.seen}}. Zostaje {{n:cards.per-suit}} − {{n:draw.flush.seen}} = {{n:outs.flush}} kart w karo." }
      - { text: "{{n:outs.oesd}}", why: "Tyle outów ma {{t:oesd|OESD}}. Do {{t:flush|koloru}} brakuje jednej z {{n:outs.flush}} pozostałych kart w karo." }
      - { text: "{{n:cards.per-suit}}", why: "{{n:cards.per-suit}} to wszystkie karty w karo w talii, ale {{n:draw.flush.seen}} z nich już widzisz." }
  - kind: choice
    id: m2.exam.q2
    family: m2.outs.gutshot
    rules: [R-M2-002]
    prompt: "Ile masz outów do {{t:straight|strita}}?"
    table: { hand: "Jc 9d", board: "Ts 7h 2c" }
    options:
      - { text: "{{n:outs.gutshot}}", correct: true, why: "Masz J-10-9 i 7, brakuje ósemki w środku (gutshot). {{t:straight|Strita}} daje tylko ósemka: {{n:draw.gutshot.ranks}} ranga × {{n:cards.suits}} kolory = {{n:outs.gutshot}} karty." }
      - { text: "{{n:outs.oesd}}", why: "Tyle byłoby przy czterech kartach po kolei, otwartych z obu stron. Tu {{t:straight}} domyka tylko ósemka." }
      - { text: "{{n:draw.oesd.ranks}}", why: "Domyka cię jedna ranga (ósemka), ale w czterech kolorach." }
  - kind: numeric
    id: m2.exam.n1
    family: m2.outs.oesd
    rules: [R-M2-002]
    prompt: "Turn. Ile masz outów do {{t:straight|strita}}? Wpisz liczbę."
    table: { hand: "Td 9d", board: "8c 7s 2h Ac" }
    answer: outs.oesd
    explanation: "Masz 10-9-8-7, cztery karty po kolei. {{t:straight|Strita}} daje każdy walet i każda szóstka: {{n:draw.oesd.ranks}} rangi × {{n:cards.suits}} kolory = {{n:outs.oesd}}."
  - kind: choice
    id: m2.exam.q3
    family: m2.odds
    rules: [R-M2-002]
    prompt: "Flop. Rywal jest all-in, a ty masz {{t:oesd|OESD}} ({{n:outs.oesd}} outów). Jeśli {{t:call|sprawdzisz}}, jaka jest szansa trafienia do rivera?"
    options:
      - { text: "Ok. {{n:odds.oesd.flop-river}}", correct: true, why: "Rywal jest all-in, więc zobaczysz turn i rivera bez dalszych {{t:bet|zakładów}}. Liczysz dwie karty: {{n:outs.oesd}} × 4 ≈ {{n:odds.oesd.flop-river}}." }
      - { text: "Ok. {{n:odds.oesd.flop-turn}}", why: "Tyle wynosi szansa na samym turnie. Przy all-inie zobaczysz też rivera." }
      - { text: "Ok. {{n:odds.flush.flop-river}}", why: "To szansa dla {{t:flush-draw|drawa do koloru}} z {{n:outs.flush}} outami. Ty masz {{n:outs.oesd}}." }
  - kind: choice
    id: m2.exam.q4
    family: m2.odds
    rules: [R-M2-002]
    prompt: "Flop. Masz {{t:oesd|OESD}}, a rywal {{t:bet|stawia}} pół {{t:pot|puli}}. Stacki są głębokie. Jaką szansę trafienia porównujesz z ceną?"
    table: { hand: "Qh Jc", board: "Td 9s 3c" }
    options:
      - { text: "Ok. {{n:odds.oesd.flop-turn}}, tylko na turnie", correct: true, why: "{{t:call|Sprawdzenie}} kupuje jedną kartę. Na turnie rywal może {{t:bet|postawić}} znowu, więc liczysz {{n:outs.oesd}} × 2: {{n:outs.oesd}} z {{n:cards.unseen.flop}}, czyli ok. {{n:odds.oesd.flop-turn}}." }
      - { text: "Ok. {{n:odds.oesd.flop-river}}, do rivera", why: "Szansę do rivera bierzesz tylko wtedy, gdy na pewno zobaczysz obie karty bez dalszych {{t:bet|zakładów}}, czyli przy all-inie." }
  - kind: numeric
    id: m2.exam.n2
    family: m2.odds
    rules: [R-M2-002]
    prompt: "Turn. Masz gutshot ({{n:outs.gutshot}} outy). Ile procent szans na trafienie na riverze daje reguła 2 i 4? Wpisz liczbę."
    answer: odds.gutshot.rule-turn
    explanation: "Została jedna karta, więc mnożysz przez 2: {{n:outs.gutshot}} × 2 = {{n:odds.gutshot.rule-turn}}. Dokładnie: {{n:outs.gutshot}} z {{n:cards.unseen.turn}}, czyli {{n:odds.gutshot.turn-river}}."
  - kind: choice
    id: m2.exam.q5
    family: m2.pot-odds
    rules: [R-M2-003]
    prompt: "W {{t:pot|puli}} jest {{n:exam.m2.half.pot}}. Rywal {{t:bet|stawia}} {{n:exam.m2.half.bet}}. Ile equity potrzebujesz do {{t:call|sprawdzenia}}?"
    options:
      - { text: "{{n:exam.m2.half.eq}}", correct: true, why: "Dopłacasz {{n:exam.m2.half.bet}}, a {{t:pot}} po twoim {{t:call|sprawdzeniu}} ma {{n:exam.m2.half.pot}} + {{n:exam.m2.half.bet}} + {{n:exam.m2.half.bet}} = {{n:exam.m2.half.total}}. {{n:exam.m2.half.bet}} ÷ {{n:exam.m2.half.total}} = {{n:exam.m2.half.eq}}. To {{t:bet}} pół {{t:pot|puli}}, więc wynik jest ten sam przy każdej wielkości {{t:pot|puli}}." }
      - { text: "{{n:exam.m2.half.wrong}}", why: "To {{n:exam.m2.half.bet}} ÷ {{n:exam.m2.half.after-bet}}, bez twojego {{t:call|sprawdzenia}}. Dopłatę dzielisz przez całą {{t:pot|pulę}} po {{t:call|sprawdzeniu}}: {{n:exam.m2.half.total}}." }
      - { text: "{{n:exam.m2.half.wrong-pot}}", why: "To {{n:exam.m2.half.bet}} ÷ {{n:exam.m2.half.pot}}: {{t:bet}} podzielony przez {{t:pot|pulę}} sprzed {{t:bet|zakładu}}. W mianowniku musi być cała {{t:pot}} po twoim {{t:call|sprawdzeniu}}." }
  - kind: numeric
    id: m2.exam.n3
    family: m2.pot-odds
    rules: [R-M2-004]
    prompt: "W {{t:pot|puli}} jest {{n:exam.m2.pot.pot}}. Rywal {{t:bet|stawia}} {{n:exam.m2.pot.bet}}. Ile procent equity potrzebujesz do {{t:call|sprawdzenia}}? Wpisz liczbę."
    answer: exam.m2.pot.eq
    explanation: "{{t:bet|Zakład}} wielkości {{t:pot|puli}}. Dopłacasz {{n:exam.m2.pot.bet}} do {{t:pot|puli}}, która po twoim {{t:call|sprawdzeniu}} ma {{n:exam.m2.pot.pot}} + {{n:exam.m2.pot.bet}} + {{n:exam.m2.pot.bet}} = {{n:exam.m2.pot.total}}. {{n:exam.m2.pot.bet}} ÷ {{n:exam.m2.pot.total}} = {{n:exam.m2.pot.eq}}, czyli jedna trzecia."
  - kind: choice
    id: m2.exam.q6
    family: m2.draw-call
    rules: [R-M2-004, R-M2-005]
    prompt: "Flop. Masz {{t:flush-draw|draw do koloru}}, stacki są głębokie, a rywal {{t:bet|stawia}} całą {{t:pot|pulę}}. Licz tylko cenę i szansę trafienia (bez implied odds). Co robisz?"
    table: { hand: "Js 6s", board: "Qs 4s 9d" }
    options:
      - { text: "{{t:fold|Pasuję}}", correct: true, why: "Potrzebujesz {{n:eq.bet-pot}}. {{t:call|Sprawdzenie}} kupuje tylko turn, a na nim trafisz z szansą ok. {{n:odds.flush.flop-turn}}. To wyraźnie za mało." }
      - { text: "{{t:call|Sprawdzam}}, bo do rivera mam ok. {{n:odds.flush.flop-river}}", why: "Szansę do rivera masz tylko wtedy, gdy zobaczysz obie karty bez dalszych {{t:bet|zakładów}}. Przy głębokich stackach rywal może {{t:bet|postawić}} znowu na turnie, więc za tę cenę kupujesz jedną kartę: ok. {{n:odds.flush.flop-turn}}." }
  - kind: choice
    id: m2.exam.q7
    family: m2.draw-call
    rules: [R-M2-005]
    prompt: "Turn. Masz {{t:oesd|OESD}}. W {{t:pot|puli}} jest {{n:exam.m2.third.pot}}, rywal {{t:bet|stawia}} {{n:exam.m2.third.bet}}. Licz tylko cenę i szansę trafienia. Co robisz?"
    table: { hand: "9h 8h", board: "Tc 7d 2s Kd" }
    options:
      - { text: "{{t:fold|Pasuję}}", correct: true, why: "Potrzebujesz {{n:exam.m2.third.bet}} ÷ {{n:exam.m2.third.total}} = {{n:exam.m2.third.eq}}. {{t:straight|Strit}} daje {{n:outs.oesd}} outów, czyli {{n:outs.oesd}} z {{n:cards.unseen.turn}}: ok. {{n:odds.oesd.turn-river}}. Nawet mały {{t:bet}} jest tu za drogi." }
      - { text: "{{t:call|Sprawdzam}}, bo {{t:bet}} jest mały", why: "Mały {{t:bet}} to nie to samo co dobra cena. Potrzebujesz {{n:exam.m2.third.eq}}, a masz ok. {{n:odds.oesd.turn-river}}." }
  - kind: choice
    id: m2.exam.q8
    family: m2.draw-call
    rules: [R-M2-003, R-M2-002]
    prompt: "Flop. Rywal wchodzi all-in za pół {{t:pot|puli}}, a ty masz {{t:flush-draw|draw do koloru}}. Załóż, że wygrywasz tylko wtedy, gdy trafisz {{t:flush|kolor}}. Co robisz?"
    table: { hand: "Kc Tc", board: "8c 3c Jd" }
    options:
      - { text: "{{t:call|Sprawdzam}}", correct: true, why: "Potrzebujesz {{n:eq.bet-half}}. Rywal jest all-in, więc zobaczysz turn i rivera bez dalszych {{t:bet|zakładów}}: {{n:outs.flush}} outów daje ok. {{n:odds.flush.flop-river}}. To więcej niż potrzebujesz." }
      - { text: "{{t:fold|Pasuję}}, bo na turnie mam tylko ok. {{n:odds.flush.flop-turn}}", why: "Szansę na jedną kartę liczysz, gdy rywal może jeszcze {{t:bet|postawić}}. Przy all-inie zobaczysz obie karty, więc liczysz do rivera: ok. {{n:odds.flush.flop-river}}." }
