royal-flush: "La jugada más alta del póker: as, rey, dama, jota y diez del mismo palo, p. ej., A♠ K♠ Q♠ J♠ T♠."
straight-flush: "Cinco cartas consecutivas del mismo palo, p. ej., 5♥ 6♥ 7♥ 8♥ 9♥. La versión más alta (del as al diez) tiene nombre propio y es la jugada más fuerte del juego."
four-of-a-kind: "Cuatro cartas del mismo valor, p. ej., cuatro sietes. Si hay dos pókeres del mismo valor, gana la quinta carta más alta (el kicker)."
full-house: "Un trío y una pareja en la misma jugada, p. ej., tres damas y dos cincos. Entre dos fulls, gana el del trío más alto."
flush: "Cinco cartas del mismo palo (♠, ♥, ♦ o ♣) que no van seguidas. Entre dos jugadas así, gana la de la carta más alta y, si es igual, la de la siguiente."
straight: "Cinco cartas consecutivas, no todas del mismo palo, p. ej., 5-6-7-8-9. El as puede ser la carta más alta (A-K-Q-J-T) o la más baja (A-2-3-4-5)."
three-of-a-kind: "Tres cartas del mismo valor y otras dos. En hold'em tiene dos variantes con nombre propio: set, cuando la pareja está en tu mano y la tercera carta en la mesa, y trips, cuando la pareja está en la mesa y la tercera carta en tu mano."
set: "Trío formado con una pareja en la mano y una carta de la mesa, p. ej., 7♣ 7♦ en un flop K-7-2."
two-pair: "Dos parejas distintas y una quinta carta, p. ej., K-K-8-8-3. El empate lo decide primero la pareja más alta, luego la más baja y, al final, la quinta carta."
pair: "Dos cartas del mismo valor y otras tres, p. ej., dos nueves. Solo la carta alta es más débil."
high-card: "Jugada sin pareja ni otra combinación mejor; su fuerza la decide la carta más alta y, si hay empate, las siguientes."
kicker: "La carta más alta fuera de la jugada, que deshace un empate. Ejemplo: una pareja de ases con rey gana a una pareja de ases con dama."
wheel: "La escalera más baja: A-2-3-4-5, en la que el as cuenta como la carta más baja."
check: "Seguir jugando sin poner fichas, solo posible cuando no tienes que añadir nada: en esta ronda de apuestas nadie ha apostado todavía (antes del flop puede hacerlo la ciega grande si nadie ha subido). No confundir con igualar, que es poner fichas para cubrir la apuesta del rival."
bet: "Las primeras fichas que se ponen en una ronda de apuestas en la que nadie ha apostado todavía (en sentido amplio, se llama apuesta a cualquier ficha que se mete en el bote)."
call: "Poner en el bote lo mismo que la apuesta o la subida del rival para seguir jugando. No confundir con pasar, que es seguir jugando sin apostar cuando nadie ha apostado."
raise: "Aumentar la cantidad por encima de la apuesta del rival; los demás tienen que poner la diferencia, volver a subir o retirarse."
fold: "Abandonar la mano: tiras tus cartas y pierdes lo que ya hayas metido en el bote."
check-raise: "Primero pasas y, cuando el rival apuesta, le subes en la misma ronda de apuestas."
all-in: "Apostar todas tus fichas. A cada rival puedes ganarle como máximo lo mismo que hayas metido tú; el resto se juega en un bote secundario."
pot: "Todas las fichas apostadas en la mano actual. Se las lleva el jugador con la mejor jugada en el showdown (si hay botes secundarios, cada bote se decide por separado) o el jugador que queda cuando todos los demás se retiran."
side-pot: "Bote aparte que se crea cuando alguien va all-in: solo lo juegan los jugadores que han metido más que el jugador all-in, así que este no puede ganarlo."
split-pot: "Situación en la que los jugadores con jugadas iguales se reparten el bote, p. ej., cuando ambos juegan la misma escalera que está en la mesa."
playing-the-board: "Situación en la que tu mejor jugada de cinco cartas la forman solo las cartas comunitarias; tus cartas propias no aportan nada, así que, como mucho, divides el bote."
board: "Las cartas comunitarias descubiertas en el centro (flop, turn, river), que usan todos los jugadores. En este sentido, «mesa» son las cartas, no el lugar de juego (sentarse a la mesa, mesa final)."
community-cards: "Cartas que se colocan descubiertas en el centro y que cualquier jugador puede usar para su jugada; en hold'em son cinco."
hole-cards: "Las dos cartas tapadas que recibes al principio de la mano en hold'em; solo las ves tú."
small-blind: "La apuesta obligatoria más pequeña, que pone antes del reparto el jugador a la izquierda del botón (entre dos jugadores, el propio botón); también se llama así ese asiento."
big-blind: "La apuesta obligatoria más grande, que pone antes del reparto el segundo jugador a la izquierda del botón (entre dos jugadores, el jugador que no es el botón); también se llama así ese asiento. Además, sirve de unidad para medir stacks y resultados."
chips: "Las piezas con las que se juega en la mesa; en las partidas de cash representan dinero y en los torneos, puntos del torneo."
stack: "Todas las fichas que un jugador tiene delante; normalmente se indican en ciegas grandes (p. ej., 100 ciegas grandes)."
street: "Nombre coloquial de una ronda de apuestas: preflop, flop, turn y river son las cuatro calles. Ejemplo: «valor en tres calles» son apuestas de valor en el flop, el turn y el river."
betting-round: "Fase de la mano en la que los jugadores, por turnos, pasan, apuestan, igualan, suben o se retiran; en hold'em hay cuatro: preflop, flop, turn y river."
preflop: "La primera ronda de apuestas: después de repartir las cartas propias y antes de que salga el flop."
flop: "Las tres primeras cartas comunitarias, que salen a la vez tras las apuestas preflop; también se llama así la segunda ronda de apuestas."
turn: "La cuarta carta comunitaria y la tercera ronda de apuestas."
river: "La quinta y última carta comunitaria, y la última ronda de apuestas antes del showdown."
showdown: "Mostrar las cartas tras la última ronda de apuestas cuando quedan al menos dos jugadores en la mano; la mejor jugada se lleva el bote."
position: "El asiento en la mesa respecto al botón, que marca el orden de actuación. Quien actúa más tarde ve más acciones de los rivales antes de decidir."
in-position: "Situación del jugador que actúa el último después del flop, así que ve la acción del rival antes de decidir."
out-of-position: "Situación del jugador que actúa antes que el rival después del flop, así que decide sin conocer su acción."
early-position: "Los primeros asientos en actuar antes del flop (p. ej., UTG); detrás de ti aún quedan muchos jugadores."
late-position: "Los asientos que actúan los últimos: el botón y los asientos justo antes de él, sobre todo el cutoff."
utg: "El primer jugador en actuar antes del flop, sentado justo a la izquierda de la ciega grande."
hijack: "El asiento justo antes del cutoff, es decir, el segundo a la derecha del botón."
cutoff: "El asiento justo a la derecha del botón, que actúa inmediatamente antes que él."
button: "El asiento del repartidor, marcado con una ficha de «dealer». Después del flop actúa el último en cada ronda de apuestas."
outs: "Carta que aún está en la baraja y que mejorará tu mano, normalmente completando un proyecto. Ejemplo: con un proyecto de color, tus outs son las cartas que quedan de tu palo."
draw: "Mano que todavía no es una jugada fuerte, pero puede llegar a serlo con las siguientes cartas comunitarias, p. ej., cuando te falta una carta para el color o la escalera."
flush-draw: "Cuatro cartas del mismo palo (sumando tu mano y la mesa); te falta una para tener color."
straight-draw: "Cuatro cartas a las que les falta una para la escalera. Tipos: OESD (falta una carta en cualquiera de los dos extremos) y gutshot (falta una carta en el medio)."
oesd: "Abreviatura de open-ended straight draw: proyecto de escalera de cuatro cartas consecutivas que se completa con una carta por cualquiera de los dos extremos, p. ej., 5-6-7-8 espera un cuatro o un nueve."
gutshot: "Proyecto de escalera al que le falta un valor concreto en el medio, p. ej., 5-6-8-9 solo espera un siete."
backdoor: "Proyecto en el flop que necesita dos cartas útiles seguidas, en el turn y en el river, p. ej., tres cartas del mismo palo tras el flop."
pot-odds: "La relación entre lo que tienes que poner y el bote que puedes ganar (incluida la apuesta del rival). Indica con qué frecuencia tienes que ganar para que igualar sea rentable."
implied-odds: "Las pot odds más las fichas que esperas ganar en las calles siguientes si ligas tu jugada."
equity: "Tu probabilidad de ganar el bote si se repartieran todas las cartas que faltan sin más apuestas; normalmente en porcentaje."
equity-realization: "En qué medida una mano convierte su equity en ganancias cuando siguen las apuestas (puede realizar menos o más que su equity); depende, entre otras cosas, de la posición y de lo fácil que sea jugar la mano."
expected-value: "El resultado medio de una jugada si la repitieras muchas veces. Una jugada que de media da beneficio gana dinero a largo plazo, aunque esta vez pierda."
combo: "Una combinación concreta de dos cartas con sus palos, p. ej., A♠ K♥. Contar estas combinaciones muestra cuántas manos de un tipo hay realmente en un rango."
range: "El conjunto de todas las manos que un jugador puede tener en una situación concreta, o de las manos con las que haría una jugada determinada."
mixed-hand: "Mano con la que la estrategia de equilibrio elige unas veces una jugada y otras veces otra (p. ej., a veces subir, a veces igualar); ambas jugadas son correctas. También se dice que esa mano se juega con una estrategia mixta."
open: "Entrar en el bote antes del flop subiendo, cuando todos los que actúan antes que tú se han retirado."
suited: "Dos cartas propias del mismo palo, p. ej., A♥ K♥ (se escribe AKs)."
offsuit: "Dos cartas propias de palos distintos, p. ej., A♥ K♣ (se escribe AKo)."
pocket-pair: "Pareja formada por tus dos cartas propias, p. ej., 8♣ 8♦ antes del flop."
connectors: "Cartas propias de valores contiguos, p. ej., 8-7 o 9-8; con ellas es más fácil formar escalera."
3-bet: "La primera subida a un open antes del flop; el nombre cuenta la ciega grande como la primera apuesta y el open como la segunda."
4-bet: "Una subida a un 3-bet, es decir, la cuarta apuesta de una ronda de apuestas."
limp: "Entrar en el bote antes del flop limitándose a igualar la ciega grande, cuando nadie ha subido todavía."
isolation: "Subida tras uno o varios limps para jugar contra el limper (a menudo un jugador más débil) uno contra uno."
texture: "El carácter de las cartas comunitarias: cuántos palos hay, si las cartas están cerca entre sí, si hay pareja. De ello depende qué jugadas y proyectos son posibles."
dry: "Mesa en la que son posibles pocos proyectos y pocas jugadas fuertes, p. ej., K♠ 7♦ 2♣."
wet: "Mesa en la que son posibles muchos proyectos y jugadas fuertes, p. ej., J♥ T♥ 8♣."
rainbow: "Flop con tres cartas de tres palos distintos, así que en el flop nadie tiene proyecto de color."
two-tone: "Flop en el que dos cartas son del mismo palo, así que hay proyectos de color posibles."
monotone: "Flop con las tres cartas del mismo palo, así que puede que ya haya un color hecho."
paired: "Mesa en la que hay una pareja (dos cartas del mismo valor), p. ej., 8-8-3."
connected: "Mesa en la que alguien puede tener ya escalera, p. ej., 9-8-7."
disconnected: "Mesa con cartas alejadas entre sí, con la que es difícil formar escalera o proyecto de escalera, p. ej., K-7-2."
semi-connected: "Mesa en la que hay proyectos de escalera, pero todavía no es posible la escalera, p. ej., T-8-3 (clasificación usada en el curso)."
wetness: "Grado en que una mesa favorece los proyectos y las jugadas fuertes: de seca a húmeda. También se habla de lo coordinada que está la mesa."
top-pair: "Pareja con la carta más alta de la mesa, p. ej., K♠ Q♦ en un flop K-7-2."
second-pair: "Pareja con la segunda carta más alta de la mesa, p. ej., 7♠ 6♠ en un flop K-7-2."
overpair: "Pareja de mano más alta que cualquier carta de la mesa, p. ej., Q-Q en un flop J-7-2."
c-bet: "Apuesta de continuación: apuesta del jugador que fue el agresor en la ronda anterior, p. ej., una apuesta en el flop tras hacer open preflop."
aggressor: "El jugador que apostó o subió el último en la ronda de apuestas anterior."
initiative: "El papel del último agresor: normalmente es él quien hace la siguiente apuesta."
range-advantage: "Situación en la que el rango de un jugador tiene, en una mesa concreta, más equity total que el rango del rival."
nuts-advantage: "Situación en la que un jugador tiene en su rango, proporcionalmente, más manos de las más fuertes que el rival."
nuts: "La mano más fuerte posible en una mesa concreta en un momento dado. Ejemplo: en la mesa K♥ 9♥ 4♥ 2♣ es el color al as de corazones."
polarized: "Dicho de un rango: formado sobre todo por manos muy fuertes y faroles, casi sin manos medias."
polarization: "Construir un rango con los extremos: manos fuertes para valor y faroles, sin manos medias."
linear: "Dicho de un rango: construido de arriba abajo, desde las manos más fuertes, sin un grupo aparte de faroles. También verás el término relacionado «merged range» (rango no polarizado); según análisis de solver publicados, merged es una forma intermedia entre este rango y uno polarizado."
condensed: "Dicho de un rango: sin las manos más fuertes (limitado por arriba) y formado sobre todo por manos medias; lo contrario de polarizado."
value: "Apostar con una mano fuerte para que el rival iguale con una mano peor."
value-bet: "Una apuesta concreta por valor: se hace con una mano fuerte para que la igualen manos peores."
bluff: "Apuesta con una mano débil que difícilmente ganará en el showdown, para que el rival se retire con una mano mejor."
semi-bluff: "Apuesta con una mano todavía débil, pero con opciones de mejorar (p. ej., con un proyecto): ganas si el rival se retira o si ligas."
blocker: "Carta de tu mano que reduce la probabilidad de que el rival tenga determinadas manos. Ejemplo: si tienes el as de corazones, el rival no puede tener el color al as de corazones."
bluff-catcher: "Mano que solo gana a los faroles del rival y pierde contra sus apuestas de valor."
barrel: "Otra apuesta en la siguiente ronda de apuestas después de tu propia apuesta en la ronda anterior."
second-barrel: "Segunda apuesta seguida: tras una c-bet en el flop, el jugador vuelve a apostar en el turn."
probe-bet: "Apuesta en el turn del jugador fuera de posición después de que el agresor preflop pasara en el flop en lugar de hacer c-bet."
donk-bet: "Apuesta de un jugador que apuesta antes de que el agresor de la ronda anterior haya podido actuar."
overbet: "Apuesta después del flop mayor que todo el bote."
effective-stack: "En una mano entre dos jugadores: el menor de sus stacks, es decir, lo máximo que se puede ganar o perder realmente. Con varios jugadores, se calcula por separado para cada pareja de jugadores."
spr: "El stack efectivo dividido entre el bote al inicio de una calle (para planificar la mano se calcula en el flop); indica lo profundos que son los stacks en relación con el bote (cuanto más bajo es el SPR, antes acaba todo en el bote)."
mdf: "La parte más pequeña del rango que hay que defender ante una apuesta para que un farol del rival con una mano sin opciones no sea rentable automáticamente."
alpha: "Con qué frecuencia tiene que retirarse el rival para que un farol con una mano sin opciones quede a cero; depende del tamaño de la apuesta respecto al bote."
variance: "La dispersión de los resultados alrededor del valor esperado: incluso jugando bien, las rachas cortas pueden ser muy negativas o muy positivas."
buy-in: "Lo que cuesta entrar en un torneo o sentarse en una partida de cash."
bankroll: "Toda la reserva destinada exclusivamente a jugar al póker; en esta app se cuenta en buy-ins, no en dinero."
tilt: "Estado en el que las emociones (enfado, frustración, euforia) empeoran tus decisiones en la mesa."
winrate: "El resultado medio de un jugador en una muestra larga; en las partidas de cash normalmente en bb/100, es decir, ciegas grandes por cada cien manos."
downswing: "Periodo de resultados claramente peores, normalmente con pérdidas mayores de lo que correspondería a la habilidad; lo contrario de un upswing."
session: "Un rato de póker, desde que empiezas a jugar hasta que lo dejas."
stakes: "El tamaño de las ciegas en una partida de cash o del buy-in en un torneo; los «microlímites» son los niveles más bajos."
standard-deviation: "Medida de la dispersión de los resultados (la raíz cuadrada de la varianza); en póker suele darse en bb/100."
risk-of-ruin: "La probabilidad de que llegues a perder todo tu bankroll si sigues jugando en los mismos límites."
mental-game: "La parte psicológica del póker: gestionar el tilt, las emociones y la concentración en la mesa."
tournament: "Formato en el que las ciegas suben cada cierto tiempo y se juega hasta que un jugador tiene todas las fichas; los premios son para los mejor clasificados."
push-fold: "Estrategia simplificada para short stacks: antes del flop, o vas all-in o te retiras."
shove: "Jugada de all-in, normalmente como subida antes del flop."
icm: "Modelo que convierte las fichas de torneo en valor en dinero teniendo en cuenta la estructura de pagos y los stacks de todos los jugadores."
bubble: "La fase del torneo justo antes de los puestos pagados, cuando faltan unas pocas eliminaciones para entrar en premios."
bubble-factor: "Indicador del ICM: cuánto más duele en un torneo perder una cantidad de fichas que lo que alegra ganar esa misma cantidad."
cover: "Tener al menos tantas fichas como el rival. Si el rival te cubre, perder un all-in contra él termina tu torneo."
risk-premium: "Equity extra, por encima de lo que exigen las pot odds, que necesitas en un torneo para arriesgar un all-in, porque perder cuesta más de lo que aporta ganar."
m-ratio: "Tu stack dividido entre la suma de ciegas y antes de una mano: para cuántas vueltas completas (órbitas) te llegan las fichas sin jugar."
red-zone: "La zona de M muy baja: te queda sobre todo ir all-in o retirarte."
green-zone: "La zona de M alta: tu stack te permite jugar con libertad, de forma conservadora o agresiva."
ante: "Pequeño pago obligatorio al bote antes del reparto que hacen todos los jugadores (sobre todo en torneos)."
bb-ante: "Formato de ante en el que, en lugar de todos los jugadores, el jugador de la ciega grande paga el ante de toda la mesa."
fold-equity: "La parte del valor de una jugada que viene de la posibilidad de que el rival se retire."
gap-concept: "Principio según el cual para igualar un open hace falta una mano más fuerte que para hacer el open tú."
chip-ev: "El valor esperado de una jugada calculado en fichas, sin convertirlas en dinero (sin ICM)."
tournament-equity: "Tu parte esperada de la bolsa de premios según la estructura de pagos y los stacks. También se llama «$EV»."
prize-pool: "El total de dinero que se reparte entre los jugadores premiados de un torneo."
payout: "El premio por un puesto concreto en un torneo; todos juntos forman la distribución de premios."
pay-jump: "La diferencia de pago entre puestos contiguos en un torneo; los saltos grandes aumentan el risk premium."
final-table: "La última mesa de un torneo, en la que se juegan los premios más altos."
short-stack: "Stack pequeño en relación con las ciegas; en torneos, normalmente uno al que le quedan pocas ciegas grandes."
nash-equilibrium: "Conjunto de estrategias en el que ningún jugador gana nada cambiando solo su propia estrategia."
overcall: "Igualar una apuesta que alguien antes que tú ya ha igualado."
heads-up: "Juego uno contra uno: en la mesa o en la mano solo quedan dos jugadores."
dead-money: "Fichas del bote de jugadores que ya no pueden ganarlo, p. ej., de los que se han retirado."
stack-off: "Meter todo el stack en el bote en una sola mano, es decir, ir all-in o igualar un all-in."
exploit: "Desviarse a propósito de la estrategia base para aprovechar un error concreto de un rival o de toda la población de jugadores."
hud: "Capa sobre la mesa en el juego online que muestra estadísticas de los rivales a partir de manos ya jugadas."
vpip: "Estadística del HUD: en qué porcentaje de manos un jugador mete dinero voluntariamente en el bote antes del flop (iguala o sube)."
pfr: "Estadística del HUD: en qué porcentaje de manos un jugador sube antes del flop."
wtsd: "Estadística del HUD: con qué frecuencia un jugador que ha visto el flop llega al showdown."
nit: "Jugador muy cerrado (tight) que entra en el bote casi solo con manos fuertes."
regular: "Jugador habitual de un límite concreto que juega muchas manos; en el curso se contrapone al jugador recreativo."
tag: "Estilo tight agresivo: pocas manos, pero jugadas de forma agresiva (apuestas y subidas)."
lag: "Estilo loose agresivo: muchas manos, jugadas de forma agresiva."
recreational: "Jugador que juega por diversión y normalmente peor que los habituales; en jerga, de forma despectiva, «fish»."
calling-station: "Término despectivo para un jugador que iguala muchísimo, incluso con manos débiles o proyectos."
maniac: "Término despectivo para un jugador muy suelto (loose) y agresivo que apuesta y sube con cualquier cosa."
rake: "La comisión que el casino o la sala online se queda del bote por organizar la partida."
rake-cap: "La cantidad máxima de rake que la sala puede cobrar en una sola mano."
