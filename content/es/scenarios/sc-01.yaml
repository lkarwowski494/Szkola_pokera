# sc-01: Spanish text of content/pl/scenarios/sc-01.yaml (role 06, session BS, 2026-11-10); machine translation in session, for review by role 09.
id: sc-01
module: m2
situation: "Tras un {{t:3-bet}} tienes un {{t:flush-draw}}, y tu rival {{t:bet|apuesta}} poco en el flop y en el turn."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni, trudny]
bounds:
  latwy: { draws: [flush], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
  sredni: { draws: [flush], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
  trudny: { draws: [flush], marginMin: 0, marginMax: 0.02, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
decisions:
  - street: flop
    kind: draw-call
    pots: [18, 20, 22, 24]
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "Tienes {{w:reka}} en el {{w:pozycja}}, en la {{t:board}} hay {{w:stol}}, y tu rival en el {{w:rywal}} {{t:bet|apuesta}} poco en relación con el {{t:pot}}. {{t:call|Igualas}}, porque solo pagas por una carta, y tu {{t:flush-draw}} liga con ella más a menudo de lo que exige un precio tan bajo. Tienes {{n:outs.flush}} outs, así que el {{t:flush}} llega en el turn en aproximadamente el {{n:odds.flush.flop-turn}} de los casos, más o menos una carta de cada cinco. Es una simplificación: cuentas solo los outs del proyecto. Cada carta tuya más alta que la mesa añade {{n:pair.outs.per-rank}} outs inciertos para una {{t:pair|pareja}}, pero aquí eso no cambia la respuesta."
      - action: fold
        explanation: "Tienes {{w:reka}} en el {{w:pozycja}}, en la {{t:board}} hay {{w:stol}}, y tu rival en el {{w:rywal}} {{t:bet|apuesta}} poco en relación con el {{t:pot}}. {{t:fold|Retirarte}} es renunciar a un {{t:pot}} en el que {{t:call|igualar}} da dinero: contra una {{t:bet}} tan pequeña, tu {{t:flush-draw}} liga más a menudo de lo que exige el precio. Retírate cuando el precio sea más alto que tu probabilidad de ligar, no porque todavía no tengas la mano hecha. Es una simplificación: cuentas solo los outs del proyecto. Cada carta tuya más alta que la mesa añade {{n:pair.outs.per-rank}} outs inciertos para una {{t:pair|pareja}}, pero aquí eso no cambia la respuesta."
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "Tienes {{w:reka}} en el {{w:pozycja}}, en la {{t:board}} hay {{w:stol}}: el turn no ha traído el {{t:flush}}, y tu rival en el {{w:rywal}} vuelve a {{t:bet|apostar}} poco. {{t:call|Igualas}}, porque queda una carta hasta el river, y a un precio tan bajo tu {{t:flush-draw}} sigue ligando con suficiente frecuencia. El {{t:flush}} llega en el river en aproximadamente el {{n:odds.flush.turn-river}} de los casos, más o menos una carta de cada cinco. Es una simplificación: cuentas solo los outs del proyecto. Cada carta tuya más alta que la mesa añade {{n:pair.outs.per-rank}} outs inciertos para una {{t:pair|pareja}}, pero aquí eso no cambia la respuesta."
      - action: fold
        explanation: "Tienes {{w:reka}} en el {{w:pozycja}}, en la {{t:board}} hay {{w:stol}}: el turn no ha traído el {{t:flush}}, y tu rival en el {{w:rywal}} vuelve a {{t:bet|apostar}} poco. {{t:fold|Retirarte}} es demasiado cerrado: en el turn cuentas la probabilidad para una carta, y contra una {{t:bet}} tan pequeña esa carta liga más a menudo de lo que exige el precio, así que renuncias a un {{t:pot}} en el que {{t:call|igualar}} da dinero. Es una simplificación: cuentas solo los outs del proyecto. Cada carta tuya más alta que la mesa añade {{n:pair.outs.per-rank}} outs inciertos para una {{t:pair|pareja}}, pero aquí eso no cambia la respuesta."
