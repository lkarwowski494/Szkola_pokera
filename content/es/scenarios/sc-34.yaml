        explanation: "Tienes {{w:reka}} en el {{w:pozycja}} en la {{t:bubble|burbuja}}, {{w:stol}}, y la {{t:small-blind}} ha ido {{t:all-in}}. {{t:call|Pagas}}, porque contra el {{t:range|rango}} de {{t:all-in}} esta mano tiene más {{t:equity}} de la que exige el umbral del {{t:icm}}. Ese umbral es más alto que en el juego por {{t:chips}}, porque en un {{t:tournament|torneo}} con {{t:payout|premios}} perder cuesta más dinero de lo que suma ganar."
