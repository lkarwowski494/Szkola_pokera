id: sc-02
module: m2
situation: "Con stacks cortos, tras un {{t:3-bet}} tienes un {{t:oesd|proyecto de escalera abierta}}; tu rival {{t:bet|apuesta}} poco en el flop y mucho en el turn."
table: 6max
positions: { hero: BTN, villain: BB }
