# sc-30: Spanish text of content/pl/scenarios/sc-30.yaml (role 06, session HZ, 2026-11-16; agent translation, for review by role 09); structure must match pl.
id: sc-30
module: m10
situation: "Un rival muy cerrado hace {{t:3-bet}}. Has {{t:open|abierto}} desde el botón y la {{t:big-blind}} hace {{t:3-bet}}. Supón que este rival tiene un {{t:vpip}} de entre {{n:hud.ex.nit3bet.vpip.low}} y {{n:hud.ex.nit3bet.vpip.high}} tras al menos unas {{n:hud.hands.vpip.low}} manos y que su {{t:3-bet}} está dentro de esas manos."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [fold], marginMin: 0.04 }
decisions:
  - street: preflop
    kind: nit-3bet
    rule: R-M2-005
    open: 2.5
    threeBet: 10
    vpips: [0.1]
    actions:
      - action: fold
        explanation: "Tienes {{w:reka}} en el {{w:pozycja}}, {{w:stol}}, y tu rival en el {{w:rywal}} hace {{t:3-bet}}. Te {{t:fold|retiras}}, porque si juega aproximadamente el {{n:hud.ex.nit3bet.vpip.low}}–{{n:hud.ex.nit3bet.vpip.high}} más fuerte de las manos, son sobre todo {{t:pair|parejas}} y los mejores ases, y contra ellas tu mano tiene menos equity de la que exige el precio del {{t:call|pago}} (simplificando, sin el juego después del flop). Por hipótesis, su {{t:3-bet}} está dentro de esas manos, así que contra el {{t:3-bet}} en sí tu mano no sale mejor parada."
      - action: call
        explanation: "Tienes {{w:reka}} en el {{w:pozycja}}, {{w:stol}}, y tu rival en el {{w:rywal}} hace {{t:3-bet}}. Simplificando, sin el juego después del flop, {{t:call|pagar}} pierde: incluso contra todas las manos que juega este rival, tu mano tiene menos equity de la que exige el precio del {{t:call|pago}}, y por hipótesis su {{t:3-bet}} está dentro de esas manos."
