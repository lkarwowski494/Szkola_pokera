# sc-28: Spanish text of content/pl/scenarios/sc-28.yaml (role 06, session HA, 2026-11-13; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-28
module: m9
situation: "Tienes una {{t:overpair|sobrepareja}}. Has {{t:bet|apostado}} en el flop y en el turn, y la {{t:big-blind}} ha {{t:call|pagado}} cada vez; en el river {{t:check|pasa}}. Supón que tu rival no {{t:raise|sube}}: {{t:call|pagará}} con todos los AK, AQ, AJ, KQ, KJ y QJ, y se {{t:fold|retirará}} con todos los JT. ¿Juegas una tercera {{t:street|calle}} {{t:value|de valor}} o {{t:check|pasas}}?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { marginMin: 0.2, expected: ["bet"] }
decisions:
  - street: river
    kind: river-value
    rule: R-M8-001
    calls: [AKs, AKo, AQs, AQo, AJs, AJo, KQs, KQo, KJs, KJo, QJs, QJo]
    folds: [JTs, JTo]
    pairKind: [overpair]
    dryBoard: true
    actions:
      - action: "bet"
        explanation: "Tienes {{w:reka}} en el {{w:pozycja}}, en la {{t:board}} hay {{w:stol}}, y tu rival en el {{w:rywal}} {{t:check|pasa}} en el river. {{t:bet|Apuestas}} por tercera vez, porque aquí tu rival paga con manos más débiles: entre las manos que {{t:call|pagarán}} hay más peores que la tuya que mejores (un empate divide el {{t:pot}} y no cambia el cálculo). Cada {{t:call|pago}} con una mano peor gana una {{t:bet|apuesta}}, y cada uno con una mejor pierde una; cuando tu rival se {{t:fold|retira}} con una mano peor, ganas el mismo {{t:pot}} que habrías ganado al {{t:check|pasar}}."
      - action: "check"
        explanation: "Tienes {{w:reka}} en el {{w:pozycja}}, en la {{t:board}} hay {{w:stol}}, y tu rival en el {{w:rywal}} {{t:check|pasa}} en el river. {{t:check|Pasar}} aquí renuncia a valor: entre las manos que {{t:call|pagarán}} hay más peores que la tuya que mejores (un empate divide el {{t:pot}} y no cambia el cálculo), así que una {{t:bet|apuesta}} les gana más de lo que pierde contra las mejores. Con una {{t:overpair|sobrepareja}} juegas una tercera {{t:street|calle}} {{t:value|de valor}} cuando tu rival paga con manos más débiles, y aquí es así."
