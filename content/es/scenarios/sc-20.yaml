id: sc-20
module: m7
situation: "En el turn tienes una mano fuerte: {{t:top-pair|pareja mayor}} con un buen {{t:kicker}} o algo mejor. En la {{t:board}} hay dos cartas del mismo palo, así que tu rival puede tener un {{t:flush-draw}}. ¿Qué tamaño de {{t:bet|apuesta}} eliges?"
table: 6max
positions: { hero: BTN, villain: BB }
