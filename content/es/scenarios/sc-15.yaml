module: m6
situation: "Estás en la {{t:big-blind}} y has {{t:call|pagado}} la {{t:open|apertura}} del Button. En el flop {{t:check|pasas}} y el Button {{t:bet|apuesta}} un {{t:c-bet}} pequeño."
table: 6max
