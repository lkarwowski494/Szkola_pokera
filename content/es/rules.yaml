# Reguły odruchowe „Jeśli X, to Y, bo Z”. Poziom: rules (zasady gry), math, gto, heuristic, exploit.
# Kryteria poziomów (S-05, audyt 4.10):
#   math      – twierdzenie, które samo jest rachunkiem (outy, szanse, cena sprawdzenia, znak EV, dominacja jednej akcji nad drugą);
#   heuristic – zalecenie wyprowadzone z rachunku albo z literatury, bez wyniku solvera;
#   gto       – opublikowany wynik solvera albo rozwiązania równowagi;
#   exploit   – dostosowanie do typu gracza; musi podać populację;
#   rules     – zasady gry i definicje.
# Reguła eksploatacyjna musi podać populację źródłową (walidacja w content-build).
# Pole source: pełny opis źródeł z adresami i cytatami najwyżej 2 zdania, bez nazw serwisów i marek (decyzja właściciela
# z 9.10.2026); zostaje w repozytorium. Pole sources: jedno niezależne źródło (organizacja albo autor) = jedna pozycja
# { kind, url? }; kind: math, rules, solver-pub, solver-app, book, study, reference, training, population (SourceKind
# w content-schema). Aplikacja pokazuje tylko rodzaj i liczbę źródeł, np. „serwisy szkoleniowe (3)”; jedno źródło inne
# niż rachunek dostaje dopisek „jedno źródło”.
# Pole check (tryb gry M13, dokument 14, 4.4.3 i 6.2 A): warunek sprawdzalny automatycznie w silniku oceny
# (packages/poker-core/src/grading.ts). kind = rodzaj sprawdzenia, players/stackBb = konfiguracje stołu, których
# dotyczy źródło reguły (5.5; brak = każda, reguły rachunkowe), streets, spots (spoty solvera), drill (przypadki
# c-betu), params (liczby jako n:klucz). Reguły-zakazy (free-check-fold, no-limp) oceniają tylko naruszenie.

- id: R-M0-001
  module: m0
  if: "dos jugadores tienen jugadas distintas"
  then: "gana la jugada más alta en el ranking, sin importar lo altas que sean las cartas"
  because: "el ranking de jugadas decide antes que la altura de las cartas; un {{t:flush|color}} siempre gana a una {{t:straight|escalera}}, un {{t:full-house|full}} siempre gana a un {{t:flush|color}}"
  level: rules
  source: "reglas de Texas Hold'em: reglamento de casino aprobado por el regulador del juego de California (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf), Card Values and Hand Rankings: «The ranking of hands for Texas Hold'em, in order from highest to lowest rank, shall be»; reglamento de póker de un casino de Perth aprobado por el regulador (RAG/551) (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf), 10.1; como apoyo: List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-002
  module: m0
  if: "ambos jugadores tienen el mismo núcleo de jugada: la misma {{t:pair|pareja}}, el mismo {{t:three-of-a-kind|trío}} o la misma {{t:two-pair|doble pareja}}"
  then: "deciden los kickers, comparados uno a uno desde el más alto, pero solo los que entran en las 5 mejores cartas; si las cinco cartas son idénticas, {{t:split-pot|el bote se divide}}"
  because: "primero cuenta la categoría de la jugada, luego su altura, y los kickers solo cuando el núcleo es idéntico; solo cuentan las cinco mejores de las 7 cartas"
  level: rules
  source: "reglas de Texas Hold'em: reglamento de póker de un casino de Perth aprobado por el regulador (RAG/551) (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf), 10.3–10.4: «all cards count, for example, Q:Q:7:7:9 shall lose to Q:Q:7:7:10»; Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), secciones 3 y 5; como apoyo, orden de comparación: List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-003
  module: m0
  if: "las 5 mejores cartas de ambos jugadores están en la {{t:board|mesa}}"
  then: "{{t:split-pot|el bote se divide}}"
  because: "ambos juegan las mismas cinco cartas («{{t:playing-the-board|jugar la mesa}}»)"
  level: rules
  source: "reglas de Texas Hold'em: Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), sección 5 («play the board»); reglamento de casino aprobado por el regulador del juego de California (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf): «the pot shall be split equally among all players with the winning hand»; como apoyo: Texas hold 'em (https://en.wikipedia.org/wiki/Texas_hold_%27em) (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/Texas_hold_%27em" }]

- id: R-M1-001
  module: m1
  if: "nadie antes que tú ha {{t:bet|apostado}} en esta ronda"
  then: "puedes {{t:check|pasar}} o {{t:bet|apostar}}"
  because: "solo se puede {{t:call|igualar}} y {{t:raise|subir}} una {{t:bet|apuesta}} que ya existe"
  level: rules
  source: "reglas de Texas Hold'em: Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), sección 3 («fold, check, bet, call, or raise») (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }]
- id: R-M1-002
  module: m1
  if: "puedes {{t:check|pasar}} gratis"
  then: "nunca te {{t:fold|retiras}}"
  because: "{{t:fold|retirarte}} entrega el {{t:pot|bote}} sin ningún beneficio, y {{t:check|pasar}} no cuesta nada"
  level: math
  check: { kind: free-check-fold }
  source: "cálculo: pasar cuesta 0 y conserva la opción de ganar el bote, así que nunca es peor que retirarse"
  sources: [{ kind: math }]
- id: R-M1-003
  module: m1
  if: "alguien ha {{t:bet|apostado}} y no quieres seguir jugando"
  then: "te {{t:fold|retiras}}"
  because: "solo pierdes lo que ya has puesto; cada vez que {{t:call|igualas}} sin motivo es una pérdida adicional"
  level: math
  source: "cálculo: retirarse termina tu participación sin más aportaciones, así que la pérdida es solo lo ya puesto; igualar con una mano con la que no vas a seguir aumenta la pérdida en lo que cuesta igualar"
  sources: [{ kind: math }]
- id: R-M1-004
  module: m1
  if: "la mano pasa a la siguiente {{t:betting-round|ronda de apuestas}}"
  then: "el flop son 3 {{t:community-cards|cartas comunitarias}}, el turn y el river, una cada uno; tras las apuestas del river, los jugadores que quedan (al menos dos) muestran sus cartas (showdown)"
  because: "así son las reglas del Texas Hold'em: cuatro {{t:betting-round|rondas de apuestas}}, y el river es la última"
  level: rules
  source: "reglas de Texas Hold'em: Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), sección 5 («Three boardcards are turned simultaneously … The next two boardcards are turned one at a time»); Wikipedia, Texas hold 'em (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules }]

- id: R-M2-001
  module: m2
  if: "en el flop tienes {{n:draw.flush.seen}} cartas para {{t:flush|color}}"
  then: "tienes {{n:outs.flush}} outs: aprox. {{n:odds.flush.flop-turn}} de probabilidad de {{t:flush|color}} en el turn, y aprox. {{n:odds.flush.flop-river}} hasta el river solo si ves ambas cartas sin más {{t:bet|apuestas}} (all-in)"
  because: "cada palo tiene {{n:cards.per-suit}} cartas y ves {{n:draw.flush.seen}}; {{t:call|igualar}} una {{t:bet|apuesta}} en el flop solo compra una carta"
  level: math
  source: "cálculo exacto"
  sources: [{ kind: math }]
- id: R-M2-002
  module: m2
  if: "has contado tus outs"
  then: "estimas la probabilidad de ligar: outs × 2 con una carta, outs × 4 con dos; ante una {{t:bet|apuesta}} en el flop cuentas una carta (× 2), y × 4 solo si ves el turn y el river sin más {{t:bet|apuestas}} (all-in)"
  because: "el rival puede hacerte pagar aparte por el river; la regla del 2 y el 4 se equivoca en aprox. {{n:rule24.error.max.pp}} puntos porcentuales con un máximo de {{n:rule24.outs.max}} outs"
  level: math
  source: "web de formación, Poker drawing odds & outs explained (https://upswingpoker.com/poker-drawing-odds-outs-explained/): «For anything 10 outs or less, however, its accurate within 2% for the turn and river calculation»; cálculo: error máximo de 1,7 pp con 10 outs (documento 12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/poker-drawing-odds-outs-explained/" }, { kind: math }]
- id: R-M2-003
  module: m2
  if: "el rival apuesta medio {{t:pot|bote}}"
  then: "para {{t:call|igualar}} necesitas {{n:eq.bet-half}} de equity"
  because: "pagas 1 parte, y el {{t:pot|bote}} después de que {{t:call|iguales}} tiene 4 partes ({{t:pot|bote}} 2, apuesta 1, lo que {{t:call|igualas}} 1), así que necesitas 1 de las 4 partes"
  level: math
  source: "cálculo: apuesta/(bote+2·apuesta)"
  sources: [{ kind: math }]
- id: R-M2-004
  module: m2
  if: "el rival apuesta todo el {{t:pot|bote}}"
  then: "para {{t:call|igualar}} necesitas {{n:eq.bet-pot}} de equity"
  because: "pagas 1 parte, y el {{t:pot|bote}} después de que {{t:call|iguales}} tiene 3 partes ({{t:pot|bote}} 1, apuesta 1, lo que {{t:call|igualas}} 1), así que necesitas 1 de las 3 partes"
  level: math
  source: "cálculo: apuesta/(bote+2·apuesta)"
  sources: [{ kind: math }]
- id: R-M2-005
  module: m2
  if: "tu equity es menor que la equity necesaria (con un {{t:draw|proyecto}}: la probabilidad de ligar en las cartas que verás a ese precio)"
  then: "te {{t:fold|retiras}} (sin argumentos adicionales, p. ej. implied odds)"
  because: "{{t:call|igualar}} solo compensa si ganas al menos tan a menudo como exige el precio; si ganas menos, en cada vez que {{t:call|igualas}} así pones de media más de lo que recuperas del {{t:pot|bote}}"
  level: math
  check: { kind: draw-price, streets: [flop] }
  source: "cálculo: EV = equity × (bote después de igualar) − lo que igualas; negativo cuando equity < lo que igualas ÷ bote después de igualar"
  sources: [{ kind: math }]

- id: R-M3-001
  module: m3
  if: "estás en el Button y todos antes que tú se han {{t:fold|retirado}}"
  then: "{{t:open|abres}} más amplio que desde cualquier otra {{t:position|posición}} anterior a las ciegas; solo la {{t:small-blind|ciega pequeña}} {{t:open|abre}} de forma parecida"
  because: "a partir del flop hablas el último y detrás de ti solo quedan las ciegas"
  level: gto
  source: "web con tablas de solver, 6-max 100bb NL500 (https://beyondgto.com/ranges/btn-open-6max-100bb, https://beyondgto.com/ranges/sb-open-6max-100bb): BTN 42%, SB 44%; web de formación, Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/): SB algo más amplio que el Button, 40–50%; web con tablas preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): BTN 40–45%, SB 39–47% (documento 12, D2)"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-002
  module: m3
  if: "todos se han {{t:fold|retirado}} hasta ti en {{t:utg|UTG}}"
  then: "{{t:open|abres}} aprox. {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} de las manos"
  because: "detrás de ti quedan aún cinco jugadores, así que es más frecuente que alguien tenga una mano mejor"
  level: gto
  check: { kind: solver-spot, players: [6], stackBb: [100], spots: [rfi.utg] }
  source: "web de un solver comercial, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/): UTG 17,6%; web con tablas de solver (NL500, https://beyondgto.com/ranges/lj-open-6max-100bb, …/hj-…, …/co-…, …/btn-open-6max-100bb): UTG 17%, HJ 22%, CO 28%, BTN 42%; web con tablas preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): 15–17 / 19–22 / 25–28 / 40–45% (documento 12 M0–M3, D6)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/lj-open-6max-100bb" }]
- id: R-M3-003
  module: m3
  if: "todos se han {{t:fold|retirado}} hasta ti en el Button"
  then: "{{t:open|abres}} aprox. {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} de las manos"
  because: "solo quedan las ciegas y después del flop tendrás {{t:position|posición}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.btn, nine.rfi.btn] }
  source: "web con tablas de solver, BTN open 6-max 100bb (https://beyondgto.com/ranges/btn-open-6max-100bb, NL500): aprox. 42%; web con tablas preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): 40–45% (documento 12 M0–M3, D6)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-004
  module: m3
  if: "eres el primero en entrar en la mano"
  then: "{{t:raise|subes}} o te {{t:fold|retiras}}; no completas solo la ciega (limp); desde la {{t:small-blind|ciega pequeña}} es una simplificación: algunas soluciones de solver completan con parte de las manos"
  because: "{{t:raise|subir}} puede ganar las ciegas al instante y te da la {{t:initiative|iniciativa}}; el limp renuncia a ambas cosas"
  level: heuristic
  check: { kind: no-limp, players: [6, 9], stackBb: [100] }
  source: "web de formación, Why limping is bad (https://upswingpoker.com/why-limping-in-poker-is-bad/): «If you make everyone fold preflop, you win 100% of the pot … You can't ever do that in a pot you've limped into»; web con tablas de solver, open 6-max 100bb (https://beyondgto.com/ranges/lj-open-6max-100bb, igual que HJ, CO, BTN): «raising rather than limping or jamming at this depth», SB (https://beyondgto.com/ranges/sb-open-6max-100bb): «At 100bb the whole range plays as raise-or-fold». Ciega pequeña: contradicción en el nivel 2, web de formación con tablas de solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics): «completes (limps) 20.5%»; raise-or-fold desde la SB es una simplificación declarada, porque el árbol del solver de la app no tiene limps (D-144; documento 12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/why-limping-in-poker-is-bad/" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]
- id: R-M3-005
  module: m3
  if: "puedes elegir entre las mismas cartas del mismo palo y de palos distintos"
  then: "la mano del mismo palo (suited) es más fuerte"
  because: "te da una vía adicional para ganar con un {{t:flush|color}}"
  level: math
  source: "cálculo de equity"
  sources: [{ kind: math }]
- id: R-M3-006
  module: m3
  if: "todos se han {{t:fold|retirado}} hasta ti en el {{t:hijack|HJ}} o el {{t:cutoff|CO}}"
  then: "{{t:open|abres}} más amplio que desde {{t:utg|UTG}} y más cerrado que desde el Button; desde el {{t:cutoff|CO}}, más amplio que desde el {{t:hijack|HJ}}"
  because: "cuantos menos jugadores quedan detrás de ti, menos a menudo alguien tiene una mano mejor y más a menudo tienes {{t:position|posición}} después del flop"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.hj, rfi.co, nine.rfi.hj, nine.rfi.co] }
  source: "web de un solver comercial, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/): UTG 17,6%; web con tablas de solver (NL500, https://beyondgto.com/ranges/hj-open-6max-100bb, https://beyondgto.com/ranges/co-open-6max-100bb): UTG 17%, HJ 22%, CO 28%, BTN 42%; web con tablas preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): 15–17 / 19–22 / 25–28 / 40–45% (documento 12 M0–M3, D6): el rango de apertura crece de UTG al Button"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/hj-open-6max-100bb" }]
- id: R-M3-007
  module: m3
  if: "eres el primero en entrar en la mano con una {{t:raise|subida}}"
  then: "{{t:raise|subes}} a {{n:pf.open-size}} desde cualquier {{t:position|posición}}, y desde la {{t:small-blind|ciega pequeña}} a {{n:pf.open-size-sb}} (simplificación)"
  because: "un solo tamaño desde todas las {{t:position|posiciones}} es sencillo y no revela la fuerza de tu mano; desde la {{t:small-blind|ciega pequeña}} juegas {{t:out-of-position|fuera de posición}}, así que {{t:raise|subes}} un poco más"
  level: heuristic
  check: { kind: open-size, players: [6, 9], stackBb: [100], params: { open: "n:pf.open-size", openSb: "n:pf.open-size-sb" } }
  source: "web con tablas preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): «the standard open size is 2.5bb from all positions … 3bb from the small blind»; web de un solver comercial, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/): UTG 2bb, CO 2,3bb, BTN 2,5bb, SB 3bb (simplificación, documento 12, D8)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }]
- id: R-M3-008
  module: m3
  if: "tienes una de las manos más fuertes (AA, KK, QQ, AK) y alguien antes que tú ha {{t:raise|subido}}"
  then: "normalmente vuelves a {{t:raise|subir}} (3-bet) {{t:value|por valor}} en lugar de solo {{t:call|igualar}}"
  because: "estas manos son favoritas frente a la mayoría de las manos con las que el rival {{t:open|abre}}; el 3-bet hace crecer el {{t:pot|bote}} y reduce el número de rivales"
  level: heuristic
  source: "web con tablas de 3-bet, 3-bet ranges (https://pokerpro.tools/preflop/3-bet-ranges): QQ+ y AK en la parte de valor frente a cualquier posición («Mostly 3-bet»); web con tablas preflop, UTG strategy (https://www.preflopwizard.app/blog/poker-utg-strategy): AA–JJ y AKs (documento 12, D9)"
  sources: [{ kind: training, url: "https://pokerpro.tools/preflop/3-bet-ranges" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-utg-strategy" }]
- id: R-M3-009
  module: m3
  if: "todos se han {{t:fold|retirado}} hasta ti en la {{t:small-blind|ciega pequeña}}"
  then: "{{t:open|abres}} amplio, aprox. {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}} de las manos, con una {{t:raise|subida}} a {{n:pf.open-size-sb}}, o te {{t:fold|retiras}} (simplificación: algunas soluciones de solver completan con parte de las manos desde la {{t:small-blind|ciega pequeña}})"
  because: "ya solo juegas contra la {{t:big-blind|ciega grande}}; después del flop hablas primero, así que {{t:open|abres}} más o menos tan amplio como desde el Button, no mucho más"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.sb, nine.rfi.sb] }
  source: "web con tablas de solver, SB open 6-max 100bb NL500 (https://beyondgto.com/ranges/sb-open-6max-100bb): aprox. 44%, raise-or-fold; web de formación, Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/): 40–50%; web con tablas preflop (https://www.preflopwizard.app/blog/6-max-preflop-charts): 39–47%; el intervalo 40–45% es la parte común de las estrategias sin limps (documento 12, D3). Simplificación raise-or-fold (D-144): web de formación con tablas de solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics): «The small blind raises (3bb) 33.1% : completes (limps) 20.5%»"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]

- id: R-M3-010
  module: m3
  if: "juegas en una mesa de 9 jugadores y todos antes que tú se han {{t:fold|retirado}}"
  then: "desde {{t:utg|UTG}}, {{t:utg|UTG}}+1 y {{t:utg|UTG}}+2 {{t:open|abres}} más cerrado que desde {{t:utg|UTG}} en una mesa de 6; desde LJ en adelante juegas como en una mesa de 6 (LJ como {{t:utg|UTG}})"
  because: "detrás de ti hay más jugadores que en una mesa de 6, así que más a menudo alguien tiene una mano mejor; cuando los primeros jugadores se {{t:fold|retiran}}, detrás de LJ quedan tantos jugadores como detrás de {{t:utg|UTG}} en una mesa de 6"
  level: heuristic
  check: { kind: solver-spot, players: [9], stackBb: [100], spots: [nine.rfi.utg, nine.rfi.utg1, nine.rfi.utg2, nine.rfi.lj] }
  source: "solver preflop del proyecto, mesa de 9 jugadores 100bb (ADR-20; documento 10, «Medición N9a final»: validación parcial N1–N4, NashConv 0,0094bb; la composición UTG–UTG+2 no está verificada y las frecuencias no tienen validación de nivel 2 (D-153), así que la regla solo da la dirección, sin cifras del solver; nivel heuristic, D-144). Coherente con la parte común de las tablas 9-max de nivel 4: UTG aprox. 9–13%, UTG+1 aprox. 11–14% (web con tablas preflop, 9-Max Preflop Chart, https://preflopwizard.app/blog/9-max-preflop-chart; segunda web con tablas preflop, https://about-poker.com/preflop-gto/preflop-range-chart-cash-game; documento 10, «Configuración 9-max 100bb»). El juego tras retirarse UTG–UTG+2 es exactamente el juego 6-max (prueba del árbol)"
  sources: [{ kind: training, url: "https://preflopwizard.app/blog/9-max-preflop-chart" }, { kind: training, url: "https://about-poker.com/preflop-gto/preflop-range-chart-cash-game" }, { kind: solver-app }]
- id: R-M3-011
  module: m3
  if: "tienes dos cartas distintas y miras si juntas pueden formar {{t:straight|escalera}}"
  then: "cuanto más cerca están, de más maneras: las cartas contiguas de 5-4 a J-T están en cuatro {{t:straight|escaleras}} distintas, las que tienen un hueco de 5-3 a Q-T en tres, y las que están a cinco o más rangos (p. ej. 7-2) en ninguna"
  because: "una {{t:straight|escalera}} son cinco rangos seguidos; cuanto mayor el hueco entre las cartas, menos quintetos así contienen a ambas (el as también cuenta como uno)"
  level: math
  source: "cálculo: las diez escaleras de A-2-3-4-5 a 10-J-Q-K-A revisadas para cada una de las 169 clases de manos; definición de escalera: reglamento aprobado por el regulador de California (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf)"
  sources: [{ kind: math }, { kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }]
- id: R-M3-012
  module: m3
  if: "tienes una carta alta con una segunda carta más débil (p. ej. K5 o A7), y un rival puede tener la misma carta alta con mejor {{t:kicker}}"
  then: "si los dos ligáis {{t:pair|pareja}} con esa carta, el rival con mejor {{t:kicker}} te gana (tu mano está dominada); dos cartas altas funcionan al revés: un {{t:kicker}} alto gana a las manos más débiles con la misma carta"
  because: "con la misma {{t:pair|pareja}} decide el {{t:kicker}}, así que antes del flop, cuando las dos manos son de palos distintos, una mano dominada gana menos que la mano que la domina; una mano dominada del mismo palo (suited) a veces está más o menos igualada con ella (p. ej., A2s contra A3o); por eso es difícil de jugar (simplificación: la fuente de formación lo dice sobre la defensa ante un 3-bet)"
  level: heuristic
  source: "reglas: el kicker decide con el mismo núcleo de mano (R-M0-002); cálculo: equity de la mano dominada por debajo de la mitad en cada emparejamiento; glosario de póker (https://www.pokerskill.com/poker-glossary/dominated-hand/); web de formación (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/)"
  sources: [{ kind: rules }, { kind: math }, { kind: reference, url: "https://www.pokerskill.com/poker-glossary/dominated-hand/" }, { kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }]
- id: R-M3-013
  module: m3
  if: "tus dos cartas son bajas (nueve o menos), también si es una {{t:pair|pareja}} baja"
  then: "en el flop suele salir al menos una carta más alta que las dos, y el rival que la ligue tendrá una {{t:pair|pareja}} más alta que una pareja con tus cartas"
  because: "el flop son tres cartas y en la baraja hay muchas cartas más altas que una mano baja: cuanto más baja tu carta alta, más a menudo sale alguna"
  level: math
  source: "cálculo: probabilidad = 1 − C(m, 3) ÷ C(50, 3), m = cartas no más altas que la carta alta de la mano, sin las dos cartas de la mano; comprobado con los 19 600 flops para cada una de las 169 clases"
  sources: [{ kind: math }]
- id: R-M3-014
  module: m3
  if: "tienes una {{t:pair|pareja}} en la mano antes del flop"
  then: "ya tienes una mano hecha: una mano sin {{t:pair|pareja}} necesita ayuda de las {{t:community-cards}} para ganarte"
  because: "la {{t:pair|pareja}} está por encima de la {{t:high-card}} en el ranking, y antes del flop una mano sin pareja solo tiene carta alta"
  level: rules
  source: "reglas de Texas Hold'em: reglamento aprobado por el regulador de California (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf), One Pair por encima de High Card"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }]
# M4: gra wobec akcji preflop. Reguły „heuristic” pochodzą z literatury, nie z solvera aplikacji (dokument 11).
- id: R-M4-001
  module: m4
  if: "alguien ha {{t:open|abierto}} y quieres {{t:raise|subir}} (3-bet) {{t:in-position|en posición}}"
  then: "{{t:raise|subes}} a aprox. {{n:pf.3bet.size-ip}} la {{t:open|apertura}}; con una {{t:open|apertura}} de {{n:pf.open-size}} son {{n:pf.3bet.ip-total}}"
  because: "este tamaño da una buena relación entre stack y {{t:pot|bote}} en el flop y no le da al rival un precio barato"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-ip", position: ip } }
  source: "web de formación, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide); árbol del solver de la app"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-002
  module: m4
  if: "{{t:raise|subes}} una {{t:open|apertura}} (3-bet) {{t:out-of-position|fuera de posición}}, p. ej. desde las ciegas frente a una {{t:open|apertura}} del {{t:cutoff|CO}} o del Button"
  then: "{{t:raise|subes}} a aprox. {{n:pf.3bet.size-oop}} la {{t:open|apertura}}; con una {{t:open|apertura}} de {{n:pf.open-size}} son {{n:pf.3bet.oop-total}}"
  because: "después del flop hablarás primero, así que con una {{t:raise|subida}} mayor le quitas al rival la opción de {{t:call|igualar}} barato {{t:in-position|en posición}}"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-oop", position: oop } }
  source: "web de formación, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide); árbol del solver de la app"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-003
  module: m4
  if: "estás en la {{t:small-blind|ciega pequeña}} y ha {{t:open|abierto}} el {{t:cutoff|CO}} o el Button"
  then: "casi nunca {{t:call|igualas}}: haces 3-bet o te {{t:fold|retiras}} (frente al {{t:cutoff|CO}} es una simplificación: la solución publicada calcula el spot frente al Button); frente al Button haces 3-bet con la parte alta del {{t:range|rango}} (aprox. {{n:pf.3bet-freq.sb-vs-btn}} de las manos, entre otras 77+ (55 y 66 a menudo), AJo+, KQo, A5s, A4s, T9s), y con el resto te {{t:fold|retiras}}"
  because: "tras {{t:call|igualar}} desde la {{t:small-blind|ciega pequeña}} juegas {{t:out-of-position|fuera de posición}}, y la {{t:big-blind|ciega grande}}, detrás de ti, aún puede {{t:raise|subir}}; el 3-bet te da la {{t:initiative|iniciativa}} y la opción de ganar el {{t:pot|bote}} al instante"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.sb-vs-btn, nine.vs-open.sb-vs-btn] }
  source: "web con tablas de solver, SB vs BTN (https://beyondgto.com/defense/sb-vs-btn), NL500, 100bb: «GTO defends the Small Blind with about 18% of hands - roughly 5% as a flat call and 13% as a 3-bet», 55 3-bet 57%, 66 62%; web de un solver comercial, Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/), NL500, SB vs BTN: «the SB barely calls anything. Instead, they almost exclusively 3-bet or fold», generalización a la ciega pequeña: «As a simplification, don’t cold-call from the SB: Play a 3-bet or fold strategy.»; web de formación, 3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/): «3-bet-or-fold strategies from every position except the Big Blind» (documento 10, resolución B-045: el contenido de R-M4-015 se integra en R-M4-003; la cifra del 14% del gráfico se sustituye por el texto leído, E1)"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/sb-vs-btn" }, { kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-004
  module: m4
  if: "estás en la {{t:big-blind|ciega grande}}, el Button ha {{t:open|abierto}} a {{n:pf.open-size}} y la {{t:small-blind|ciega pequeña}} se ha {{t:fold|retirado}}"
  then: "defiendes amplio, porque para {{t:call|igualar}} solo necesitas aprox. {{n:eq.bb-vs-btn-open}} de equity"
  because: "pones poco en un {{t:pot|bote}} grande; las soluciones de solver publicadas defienden aquí aprox. {{n:pf.bb-def.vs-btn.pub.low}}–{{n:pf.bb-def.vs-btn.pub.high}} de las manos"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-btn, nine.vs-open.bb-vs-btn] }
  source: "cálculo del precio; web con tablas de solver, BB vs BTN (https://beyondgto.com/defense/bb-vs-btn), NL500: «GTO defends the Big Blind with about 45% of hands»; escuela que publica resultados de solver (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), NL200: «3-bets 11.5% to 11bb and calls 29.0%»; solver preflop del proyecto (ADR-20) solo en la cuadrícula y en la evaluación jugar/retirarse, su defensa total sin validar (D-153)"
  sources: [{ kind: math }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-app }]
- id: R-M4-005
  module: m4
  if: "con {{t:position|posición}} {{t:raise|subes}} una {{t:open|apertura}} del {{t:cutoff|CO}}"
  then: "haces 3-bet sobre todo con las mejores manos desde arriba y añades algunos {{t:bluff|faroles}} con ases del mismo palo (A5s, A4s); las manos medias (p. ej. 77–99, AJs, ATs, {{t:connectors|conectores}} del mismo palo) las juegas de forma mixta: con parte haces 3-bet y con parte {{t:call|igualas}}. El Button frente al {{t:cutoff|CO}} suele hacer 3-bet con aprox. {{n:pf.3bet-freq.btn-vs-co.low}}–{{n:pf.3bet-freq.btn-vs-co.high}} de las manos e {{t:call|iguala}} aprox. {{n:pf.call-freq.btn-vs-co.low}}–{{n:pf.call-freq.btn-vs-co.high}}"
  because: "el rival {{t:call|iguala}} a menudo, así que quieres una mano que juegue bien en un {{t:pot|bote}} {{t:call|igualado}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.btn-vs-co, nine.vs-open.btn-vs-co] }
  source: "web de un solver comercial, Playing Calls From the Button in Cash Games (https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/), NL500, 100bb: «Against a CO open, BTN will 3-bet ~12% of hands, while calling only 5%.»; web con tablas de solver, BTN vs CO (https://beyondgto.com/defense/btn-vs-co), NL500, 100bb: «roughly 9% as a flat call and 10% as a 3-bet»; escuela que publica resultados de solver (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), NL200: «the solver 3-bets 12.5% of hands to 7.5bb and calls only 3.0%», «55–22 most of the time» retirada; los intervalos abarcan tres fuentes de nivel 2 y la composición es su parte común: arriba 3-bet, en medio mixto (D-144; antes decisión A2, documento 10). El solver de la app no reproduce este reparto (casi nunca iguala), así que la cuadrícula y la evaluación en el modo de juego solo comprueban «juego / me retiro»; web de formación, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide), tabla BTN vs CO: «QQ+, AKs, AKo, AQs (mixed), A5s, A4s…»; una web de formación (https://gtogecko.com/blog/gto-preflop-strategy) llama al rango lineal, y la web con tablas preflop, polarizado (documento 12 M4–M6, D-02)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/" }, { kind: solver-pub, url: "https://beyondgto.com/defense/btn-vs-co" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://gtogecko.com/blog/gto-preflop-strategy" }, { kind: training }]
- id: R-M4-006
  module: m4
  if: "desde la {{t:big-blind|ciega grande}} {{t:raise|subes}} la {{t:open|apertura}} del Button"
  then: "haces 3-bet con las manos más fuertes (TT+, AQ+, AJs+) más {{t:bluff|faroles}} de la parte baja de tu {{t:range|rango}} para {{t:call|igualar}}: A5s, a veces A4s, y {{t:connectors|conectores}} del mismo palo; las {{t:pair|parejas}} medias y pequeñas, KQo y los ases de palos distintos (AJo–A9o) normalmente los {{t:call|igualas}}"
  because: "desde la {{t:big-blind|ciega grande}} {{t:call|igualas}} barato y cierras la acción, así que las manos medias ganan más tras {{t:call|igualar}}, y el 3-bet lo reservas para las manos que quieren un {{t:pot|bote}} grande y para los {{t:bluff|faroles}} que juegan bien cuando les {{t:call|igualan}} (los ases del mismo palo bloquean AA y AK)"
  level: gto
  source: "web de un solver comercial, Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/), NL500, BB vs BTN: «TT+, AJs+, and AQo+ are 3-bet purely», faroles «near the bottom of our calling range»; web con tablas de solver, BB vs BTN (https://beyondgto.com/defense/bb-vs-btn): «A5s · 3-bet 100%». La regla solo se aplica a la apertura del Button (D-144): frente a la ciega pequeña, las fuentes de nivel 2 no coinciden sobre los faroles (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics: «A5s calls 96% of the time rather than turning into a three-bet bluff»; https://beyondgto.com/defense/bb-vs-sb: «A5s · 3-bet 4% · call 96%»; web de un solver comercial, Range Morphology, https://blog.gtowizard.com/preflop-range-morphology/: faroles de lo más bajo del rango), así que la lección solo dice que frente a la ciega pequeña haces 3-bet sobre todo por valor, y A5s y los conectores del mismo palo normalmente los igualas; escuela que publica resultados de solver, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide) y Big blind defence (https://poker.academy/blog/post/big-blind-basics-explained-useful-tips-for-poker-players), NL200 y NL50 GG; web de formación, Blind vs Blind Without a Solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics), tablas de esa web; web de formación, 3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/), tablas de solver de esa web. Simplificación: la composición depende del rake y del tamaño del 3-bet; 99, KQo y AJo a veces son mixtas (documento 10, resolución B-045)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-007
  module: m4
  if: "recibes un 3-bet de un jugador que tendrá {{t:position|posición}} después del flop"
  then: "te {{t:fold|retiras}} con aprox. {{n:pf.vs3bet.fold.low}}–{{n:pf.vs3bet.fold.high}} de tus {{t:open|aperturas}}, {{t:call|igualas}} aprox. {{n:pf.vs3bet.call.low}}–{{n:pf.vs3bet.call.high}}, y haces 4-bet con aprox. {{n:pf.vs3bet.4bet.low}}–{{n:pf.vs3bet.4bet.high}}"
  because: "si te retiras más a menudo que {{n:alpha.vs-3bet-ip-size}}, el rival gana haciendo 3-bet con cualquier mano, así que te {{t:fold|retiras}} justo por debajo de ese umbral"
  level: heuristic
  source: "intervalo cercano a las fuentes, con el límite superior de retiradas justo por debajo del umbral calculado (ADR-24): escuela que publica resultados de solver, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), solver NL200, CO frente a un 3-bet del Button a 7,5bb: retirada 63,7%, igualar 17,2%, 4-bet 19,1%; web con tablas de formación simplificadas, tablas de formación simplificadas (https://pailiku.com/charts/co-vs-btn-3bet), convertidas al rango de apertura del CO: aprox. 66/23/11; HUD aprox. 55% de retiradas; web de formación 50–55/30–40/5–8 (nivel 4, se aparta); umbral calculado (documento 12 M4–M6, D-04)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training }, { kind: math }]
- id: R-M4-008
  module: m4
  if: "recibes un 3-bet y después del flop estarás {{t:out-of-position|fuera de posición}}"
  then: "{{t:call|igualas}} sobre todo con cartas altas del mismo palo, ases fuertes del mismo palo, {{t:pair|parejas}} medias y altas y parte de los {{t:connectors|conectores}} del mismo palo; con las manos más débiles de palos distintos (KJo, ATo, QTo) te {{t:fold|retiras}}"
  because: "las manos de palos distintos están a menudo dominadas y {{t:equity-realization|realizan mal su equity}} {{t:out-of-position|fuera de posición}}"
  level: heuristic
  source: "web de formación, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide), CO vs BTN 3-bet: «Call QQ, JJ, TT, 99, 88, AQs, AJs, KQs, KJs, QJs, JTs, T9s, 77, 66 Fold Marginal offsuit broadways»; web con tablas de formación simplificadas (https://pailiku.com/charts/co-vs-btn-3bet): «Call JJ-77, AQs-ATs, AKs, KQs-KJs, QJs, JTs, T9s, 98s, 87s, 76s, 65s»; web de formación, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/): «calling with fewer suited connectors, suited gappers and offsuit broadway hands»"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }]
- id: R-M4-009
  module: m4
  if: "recibes un 3-bet y después del flop tendrás {{t:position|posición}}"
  then: "{{t:call|igualas}} más amplio: {{t:pair|parejas}} de 66 a TT, manos del mismo palo con cartas altas y {{t:connectors|conectores}} del mismo palo; con las {{t:pair|parejas}} más bajas te {{t:fold|retiras}}"
  because: "{{t:in-position|en posición}} es más fácil realizar la equity y ganar un {{t:pot|bote}} grande cuando ligas"
  level: heuristic
  source: "web de formación, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/): con las parejas más bajas, retirada «even with position»; una web de formación admite igualar con parejas pequeñas en posición (documento 12 M4–M6, D-05)"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training }]
- id: R-M4-010
  module: m4
  if: "recibes un 3-bet con AA, KK o AK"
  then: "normalmente haces 4-bet ({{t:value|por valor}}); con AK a veces también se {{t:call|iguala}}"
  because: "estas manos quieren meter todo el stack y dominan a la mayoría de las manos que {{t:call|igualarán}} el 4-bet"
  level: heuristic
  source: "web de formación, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/): AK «should be 4-bet with 100% frequency» (Button vs BB); web de formación, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide): «4-bet value KK+, AKs (mixed), AKo (mixed)»; web con tablas de formación simplificadas (https://pailiku.com/charts/co-vs-btn-3bet): «4-bet QQ+, AKo, A5s-A4s Call JJ-77, AQs-ATs, AKs»"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }]
- id: R-M4-011
  module: m4
  if: "haces 4-bet"
  then: "{{t:raise|subes}} a aprox. {{n:pf.4bet.size-ip.low}}–{{n:pf.4bet.size-ip.high}} el 3-bet {{t:in-position|en posición}} y {{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}} {{t:out-of-position|fuera de posición}}"
  because: "si {{t:call|igualan}} ese 4-bet, en los stacks quedan aprox. {{n:spr.4bet.high}}–{{n:spr.4bet.oop}} veces lo que hay en el {{t:pot|bote}} ({{t:in-position|en posición}}, p. ej. 4-bet desde el Button sobre un 3-bet de la {{t:small-blind|ciega pequeña}} a {{n:pf.3bet.oop-total}}: aprox. {{n:spr.4bet.high}}–{{n:spr.4bet}}; {{t:out-of-position|fuera de posición}}, p. ej. 4-bet desde el {{t:cutoff|CO}} sobre un 3-bet del Button a {{n:pf.3bet.ip-total}}: aprox. {{n:spr.4bet.oop}}), así que las buenas manos meten el resto con facilidad"
  level: heuristic
  source: "escuela que publica resultados de solver, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), solver NL200: el CO fuera de posición hace 4-bet a 17,2bb, es decir, 2,3 veces un 3-bet a 7,5bb; web de formación, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide): 2,2–2,5x en posición, 2,5–3x fuera de posición (2,4x en su ejemplo); SPR calculado (documento 12 M4–M6, D-06)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: math }]
- id: R-M4-012
  module: m4
  if: "antes que tú uno o varios jugadores solo han completado la {{t:big-blind|ciega grande}} (limp)"
  then: "{{t:raise|subes}} a {{n:pf.iso.base}} más {{n:pf.iso.per-limper}} por cada limper, y {{t:out-of-position|fuera de posición}}, {{n:pf.iso.oop-extra}} más"
  because: "una {{t:raise|subida}} menor da a los limpers un precio demasiado bueno y no les quita la mano"
  level: heuristic
  check: { kind: iso-size, players: [6, 9], stackBb: [100], params: { base: "n:pf.iso.base", perLimper: "n:pf.iso.per-limper", oopExtra: "n:pf.iso.oop-extra" } }
  source: "web de formación, 10 Tips for Crushing Limpers (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm): «Raise to 3bb+1bb per limper when playing online, and 4bb+1bb per limper when playing live»; web con tablas preflop, ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy): «Base open size (3bb) + 1 big blind per limper», «Add 1bb more from OOP positions». El tamaño se refiere al juego online"
  sources: [{ kind: training, url: "https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }]
- id: R-M4-013
  module: m4
  if: "antes que tú hacen limp varios jugadores"
  then: "{{t:raise|subes}} con un {{t:range|rango}} más estrecho, sobre todo {{t:value|por valor}}; las manos especulativas ({{t:pair|parejas}} pequeñas, {{t:connectors|conectores}} del mismo palo) puedes completarlas {{t:in-position|en posición}}"
  because: "cada limper adicional aumenta la probabilidad de que alguien {{t:call|iguale}}, así que el {{t:bluff|farol}} preflop pierde valor"
  level: heuristic
  source: "web con tablas preflop, ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy): «Against multiple limpers, tighten each range by roughly one tier», sobre completar detrás: «This is almost always wrong»; web de formación (https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm): «limp behind with those suited connectors, small pairs»; web de formación (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm): «over-limping, which can be fine». Contradicción en el nivel 4: ambas jugadas son correctas (ADR-04, D-144)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }, { kind: training, url: "https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm" }]
- id: R-M4-014
  module: m4
  if: "estás en la {{t:big-blind|ciega grande}} y la {{t:small-blind|ciega pequeña}} ha {{t:open|abierto}} a {{n:pf.open-size-sb}}"
  then: "defiendes amplio, más de la mitad de las manos, aunque para {{t:call|igualar}} necesitas aprox. {{n:eq.bb-vs-sb-open}} de equity; el 3-bet es de aprox. {{n:pf.3bet.size-ip}} la {{t:open|apertura}}"
  because: "después del flop tienes {{t:position|posición}}, así que realizas más equity; la solución de solver publicada defiende aquí aprox. {{n:pf.bb-def.vs-sb.pub}} de las manos"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-sb, nine.vs-open.bb-vs-sb] }
  source: "cálculo del precio; solver preflop del proyecto (ADR-20); árbol del solver (3-bet a 9bb); web con tablas de solver, BB vs SB (https://beyondgto.com/defense/bb-vs-sb), NL500, 100bb: «GTO defends the Big Blind with about 56% of hands»"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-sb" }, { kind: math }, { kind: solver-app }]

# M5: c-bet na flopie. Pula po otwarciu i jednym sprawdzeniu, 100bb. Definicje tekstur liczy poker-core (texture.ts),
# punkty i progi mokrości są w numbers.yaml (tex.*). Reguły strategiczne według rejestru decyzji D-01–D-21
# (dokument 12 M4–M6); bez częstotliwości w procentach.
- id: R-M5-001
  module: m5
  if: "el flop suma menos de {{n:tex.threshold.medium}} puntos de {{t:wetness|humedad}}: una {{t:straight|escalera}} posible de varias formas (con al menos dos combinaciones de dos valores) da {{n:tex.points.straight.made}} pts, una {{t:straight|escalera}} posible de una sola forma {{n:tex.points.straight.made-one}}, solo un {{t:straight-draw|proyecto de escalera}} {{n:tex.points.straight.draw}}, dos cartas del mismo palo {{n:tex.points.suits.two-tone}}, tres del mismo palo {{n:tex.points.suits.monotone}}"
  then: "es un flop {{t:dry|seco}}: hay pocos {{t:draw|proyectos}}, y nadie tiene aún una {{t:straight|escalera}} ni un {{t:flush|color}} hechos"
  because: "las siguientes cartas rara vez cambian quién va por delante, así que la mejor mano en el flop suele seguir siéndolo"
  level: rules
  source: "definición de textura de la app (poker-core, texture.ts: WETNESS_POINTS, WETNESS_THRESHOLDS); concepto de flop seco: web de formación, Sizing Your C-Bets; web de formación, What Is a Continuation Bet; ejemplos de flops secos: web de formación (K72r, A94r), web de formación (AA6r); el límite entre seco e intermedio es una convención de la app"
  sources: [{ kind: training }, { kind: training }]
- id: R-M5-002
  module: m5
  if: "el flop suma al menos {{n:tex.threshold.wet}} puntos de {{t:wetness|humedad}} (puntos como en la definición de flop {{t:dry|seco}})"
  then: "es un flop {{t:wet|húmedo}}: el rival a menudo tiene {{t:draw|proyectos}}, y a veces ya una {{t:straight|escalera}} o un {{t:flush|color}}"
  because: "las siguientes cartas cambian a menudo quién va por delante, así que la mano que ahora es la mejor está menos segura"
  level: rules
  source: "definición de textura de la app (poker-core, texture.ts: WETNESS_POINTS, WETNESS_THRESHOLDS); concepto de flop húmedo: web de formación, Sizing Your C-Bets; web de formación, What Is a Continuation Bet; ejemplos de flops húmedos: web de formación (987, QJT), web de formación, Bet Sizing Strategy: 8 Rules (T954, https://upswingpoker.com/bet-size-strategy-tips-rules/); el límite entre intermedio y húmedo es una convención de la app"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: training }]
- id: R-M5-003
  module: m5
  if: "has {{t:open|abierto}} antes del flop, la {{t:big-blind|ciega grande}} ha {{t:call|igualado}} y en el flop hay un as o un rey"
  then: "tienes {{t:range-advantage|ventaja de rango}}: de media tus manos son más fuertes que las del rival"
  because: "la {{t:big-blind|ciega grande}} {{t:raise|sube}} antes del flop con la mayoría de AA, KK y AK, así que tras solo {{t:call|igualar}} tiene pocas, y tú las tienes todas"
  level: heuristic
  source: "web de un solver comercial, Range advantage (glosario); web de un solver comercial, The Turn Probe Bet («BB lacks the stronger Ace-highs because they would have 3-bet with them preflop»)"
  sources: [{ kind: solver-pub }]
- id: R-M5-004
  module: m5
  if: "has {{t:open|abierto}} antes del flop y el flop es bajo y {{t:connected|conectado}} o {{t:semi-connected|semiconectado}}, p. ej. 7-6-5"
  then: "haces c-bet menos a menudo que en flops altos, y con muchas manos {{t:check|pasas}}"
  because: "la {{t:big-blind|ciega grande}} defiende muchos {{t:connectors|conectores}} y manos con cartas pequeñas, que ligan un flop bajo, y tus cartas altas han fallado; en un flop {{t:connected|conectado}} también tiene {{t:straight|escaleras}} y {{t:two-pair|dobles parejas}}, así que normalmente no tienes {{t:nuts-advantage|ventaja de nuts}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "web de un solver comercial, Flop Heuristics: IP C-Betting in Cash Games (https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/, BTN vs BB: «a large portion of their range consists of low-card holdings because of the preflop discount posed by the blinds. We connect better with high-card boards and get to bet more.»; «flopped straights often being in the BB’s range»; «Size down and bet less on flops that complete straights and flushes in your opponent’s range»); web de un solver comercial, Flop Heuristics: IP C-Betting in MTTs (https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-mtts/; otro spot: BTN vs SB, 40bb; en flops conectados «the raiser generally does not have a nuts advantage»; simplificación: trasladado en la misma dirección a BTN vs BB en cash game, de acuerdo con el artículo sobre cash game); web de un solver comercial, Bullying the Blinds (https://blog.gtowizard.com/bullying-the-blinds-with-continuation-bets/, 20bb, 654r: «BB’s advantage at the top end», el Button pasa con más de la mitad del rango); web de formación, 3 Concepts That Should Shape Your Postflop Strategy («the Big Blind will often have the nut advantage», https://upswingpoker.com/nut-range-positional-advantage/)"
  sources: [{ kind: solver-pub }, { kind: training, url: "https://upswingpoker.com/nut-range-positional-advantage/" }]
- id: R-M5-005
  module: m5
  if: "en tu {{t:range|rango}} hay muchas más manos muy fuertes que en el del rival ({{t:nuts-advantage|ventaja de nuts}})"
  then: "puedes apostar con un tamaño mayor; cuando solo tienes {{t:range-advantage|ventaja de rango}}, apuestas pequeño"
  because: "una {{t:bet|apuesta}} grande saca más de las manos medias del rival, y rara vez te toparás con una mano mejor que te {{t:raise|suba}}"
  level: heuristic
  source: "web de un solver comercial, The Mechanics of C-Bet Sizing; web de un solver comercial, Range advantage (glosario)"
  sources: [{ kind: solver-pub }]
- id: R-M5-006
  module: m5
  if: "el rival tiene una mano sin {{t:pair|pareja}}"
  then: "el flop no empareja ninguna de sus cartas en aprox. {{n:flop.miss.unpaired}} de los casos"
  because: "de las {{n:cards.unseen.preflop}} cartas desconocidas solo {{n:pair.outs.unpaired}} emparejan su mano, y el flop son solo {{n:cards.board.flop}} cartas"
  level: math
  source: "cálculo exacto (poker-core); coherente con una web de calculadoras de póker (28,96% + 2,02% + 1,45% = 32,4% de acierto)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M5-007
  module: m5
  if: "como {{t:aggressor|agresor}} preflop tienes {{t:position|posición}} y el flop es {{t:dry|seco}} y alto, p. ej. K-7-2 de tres palos"
  then: "haces c-bet a menudo y pequeño, aprox. {{n:cbet.size.small}} del {{t:pot|bote}} (simplificación: en estos flops el solver también usa el {{t:overbet|overbet}})"
  because: "tienes {{t:range-advantage|ventaja de rango}}, y las manos débiles del rival casi no tienen opciones: basta una {{t:bet|apuesta}} pequeña para que se {{t:fold|retiren}}, y las {{t:pair|parejas}} peores la seguirán {{t:call|igualando}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "web de un solver comercial, Flop Heuristics: IP C-Betting in Cash Games (33%); web de formación, Bet Sizing Strategy: 8 Rules («Bet small (25-35% pot) on dry, static board textures», https://upswingpoker.com/bet-size-strategy-tips-rules/); web de formación, What Is a Continuation Bet (K72r); web de formación, Picking the Proper C-Bet Sizing on Ace-High Boards (1/3 del bote)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M5-008
  module: m5
  if: "como {{t:aggressor|agresor}} preflop tienes {{t:position|posición}} y el flop da al rival muchos {{t:draw|proyectos}}, pero aún no es posible una {{t:straight|escalera}}, p. ej. K-J-7 {{t:two-tone|bicolor}}"
  then: "haces c-bet menos a menudo, pero con un tamaño mayor, p. ej. {{n:cbet.size.big}} del {{t:pot|bote}}; las manos medias sin {{t:draw|proyecto}} {{t:check|pasan}} más a menudo; cuando ya es posible una {{t:straight|escalera}}, p. ej. J-T-8, los solvers apuestan con un tamaño menor"
  because: "los {{t:draw|proyectos}} del rival tienen mucha equity, así que una {{t:bet|apuesta}} grande les hace pagar caro la siguiente carta"
  level: heuristic
  source: "web de un solver comercial, Flop Heuristics: IP C-Betting in Cash Games («increased use of the 66% pot bet size, but decreased overall betting frequency»); web de formación, Bet Sizing Strategy: 8 Rules (55–80%, https://upswingpoker.com/bet-size-strategy-tips-rules/); web de formación, Picking the Proper C-Bet Sizing on Ace-High Boards (2/3 del bote)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }]
- id: R-M5-009
  module: m5
  if: "como {{t:aggressor|agresor}} preflop tienes {{t:position|posición}} y el flop está {{t:paired|emparejado}}, p. ej. Q-Q-6"
  then: "haces c-bet a menudo y pequeño"
  because: "tienes {{t:range-advantage|ventaja de rango}}, y en un flop {{t:paired|emparejado}} es difícil tener {{t:draw|proyecto}}, así que un rival sin {{t:pair|pareja}} rara vez puede {{t:call|igualar}} ni siquiera una {{t:bet|apuesta}} pequeña; una {{t:bet|apuesta}} grande no compensa, porque cualquiera de los dos puede tener {{t:three-of-a-kind|trío}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "web de un solver comercial, Flop Heuristics: IP C-Betting in Cash Games («Paired flops are bet significantly more often… only be bet for small sizing… reduced nut advantage from trips being in both player's ranges»; «On paired boards, it's also much harder to have a draw»)"
  sources: [{ kind: solver-pub }]
- id: R-M5-010
  module: m5
  if: "como {{t:aggressor|agresor}} preflop tienes {{t:position|posición}} y el flop es {{t:monotone|monocolor}} (tres cartas del mismo palo)"
  then: "haces c-bet menos a menudo de lo habitual y pequeño"
  because: "cualquier jugador puede tener ya {{t:flush|color}}, así que la {{t:nuts-advantage|ventaja de nuts}} del {{t:aggressor|agresor}} se reduce, y en un {{t:pot|bote}} grande el {{t:flush|color}} del rival sale caro"
  level: heuristic
  source: "web de un solver comercial, Flop Heuristics: IP C-Betting in Cash Games («Monotone boards see a drastic decrease in betting frequency and sizing», BTN vs BB, https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/); web de un solver comercial, The Mechanics of C-Bet Sizing («when a very wet board like Q♦8♦7♦ is dealt, the bet sizing comes down again», https://blog.gtowizard.com/the-mechanics-of-c-bet-sizing/): un flop húmedo no implica una apuesta grande; web de formación, Monotone Flops (Kanu7, resultados de solver: «c-betting half the time for a 25-33% pot sizing», https://upswingpoker.com/monotone-flops-kanu7/); decisión D-39 (documento 12 M4–M6, informe 12a-22)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/monotone-flops-kanu7/" }]
- id: R-M5-011
  module: m5
  if: "haces c-bet sin ninguna mano, contando solo con que el rival se {{t:fold|retire}}"
  then: "con una {{t:bet|apuesta}} de {{n:cbet.size.small}} del {{t:pot|bote}}, el rival tiene que {{t:fold|retirarse}} más a menudo que en {{n:alpha.cbet.small}} de los casos, y con {{n:cbet.size.big}} del {{t:pot|bote}}, más a menudo que en {{n:alpha.cbet.big}}"
  because: "arriesgas la apuesta para ganar el {{t:pot|bote}}: el umbral es apuesta ÷ ({{t:pot|bote}} + apuesta)"
  level: math
  source: "cálculo: alpha = apuesta / (bote + apuesta)"
  sources: [{ kind: math }]
- id: R-M5-012
  module: m5
  if: "has {{t:open|abierto}} antes del flop y el rival ha {{t:call|igualado}} con {{t:position|posición}} (p. ej. el Button frente a tu {{t:open|apertura}} desde el {{t:cutoff|CO}})"
  then: "haces c-bet menos a menudo que {{t:in-position|en posición}} y {{t:check|pasas}} más a menudo, también con buenas manos"
  because: "el {{t:range|rango}} de quien {{t:call|iguala}} con {{t:position|posición}} es {{t:condensed|condensado}}: con las manos débiles se {{t:fold|retiró}} y con parte de las más fuertes {{t:raise|subió}}, así que le quedan sobre todo manos medias y buenas; además, después del flop tú hablas primero en cada {{t:street|calle}}"
  level: heuristic
  source: "web de un solver comercial, C-Betting As the OOP Preflop Raiser (UTG vs BTN c-bet 28%; «Even a hand like top pair top kicker is preferred to be played as a check-call»); web de formación, C-Betting On Ace-High Boards (CO vs BTN, A94r: «we will check over 96% of the time»)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M5-013
  module: m5
  if: "en el flop tienes dos o más rivales"
  then: "haces c-bet mucho menos a menudo, sobre todo con manos fuertes y {{t:draw|proyectos}} fuertes; {{t:bluff|faroleas}} poco, y cuando apuestas, apuestas pequeño"
  because: "cada rival adicional aumenta la probabilidad de que alguien haya ligado: dos manos sin {{t:pair|pareja}} fallan a la vez solo en aprox. {{n:flop.miss.two}} de los casos"
  level: heuristic
  source: "web de formación, Multiway Pots in Poker; web de formación, C-Betting in Multiway Pots («Check even pocket kings… the solver checks its entire range»; «around a quarter to a third of pot»); cálculo exacto: C(36,3)/C(48,3)"
  sources: [{ kind: training }, { kind: training }, { kind: math }]

# M6: obrona na flopie. Matematyka z formuł (numbers.yaml); zalecenia według rejestru decyzji D-22–D-38 (dokument 12
# M4–M6) i D1 (dokument 12 M7–M9).
- id: R-M6-001
  module: m6
  if: "el rival apuesta en el river 1/3 del {{t:pot|bote}}"
  then: "en teoría defiendes ({{t:call|igualas}} o {{t:raise|subes}}) aprox. {{n:mdf.bet-third}} de tu {{t:range|rango}}; eso es el {{t:mdf|MDF}}"
  because: "un {{t:bluff|farol}} sin opciones arriesga 1 parte para ganar 3; si te {{t:fold|retiras}} más a menudo que {{n:alpha.bet-third}}, el rival gana {{t:bluff|faroleando}} con cualquier carta"
  level: math
  source: "cálculo: MDF = bote/(bote+apuesta); web de formación, MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker: «The framework is a starting point, not a rule»)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }, { kind: math }]
- id: R-M6-002
  module: m6
  if: "{{t:bluff|faroleas}} con una mano sin opciones de ganar"
  then: "el {{t:bluff|farol}} es rentable cuando el rival se {{t:fold|retira}} más a menudo que alpha = apuesta/({{t:pot|bote}}+apuesta); con una apuesta de medio {{t:pot|bote}} es {{n:alpha.bet-half}}"
  because: "arriesgas la apuesta para ganar el {{t:pot|bote}}; cuanto mayor es la apuesta, más a menudo tiene que {{t:fold|retirarse}} el rival"
  level: math
  source: "cálculo: alpha = apuesta/(bote+apuesta); web de un solver comercial, MDF & Alpha (https://blog.gtowizard.com/mdf-alpha)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: math }]
- id: R-M6-003
  module: m6
  if: "recibes una apuesta en el flop {{t:out-of-position|fuera de posición}}"
  then: "puedes defender menos de lo que indica el {{t:mdf|MDF}} (en flops malos para el defensor, claramente menos); tomas el {{t:mdf|MDF}} como punto de referencia, no como obligación, pero ante c-bets pequeños no te {{t:fold|retiras}} en masa"
  because: "los {{t:bluff|faroles}} del rival aún tienen equity y pueden mejorar, y {{t:out-of-position|fuera de posición}} no realizarás toda la equity de tus manos débiles"
  level: heuristic
  source: "web de un solver comercial, MDF & Alpha (https://blog.gtowizard.com/mdf-alpha: «On average, BB is consistently over-folding to all bet sizes on the flop»; en posición «calls much closer to MDF on average»); en un ejemplo del turn el solver defendió de media cerca del MDF: web de formación, What the Best Poker Pros Already Know About Playing vs. Double Barrels (https://upswingpoker.com/vs-double-barrels-turn/); defensa ante c-bets pequeños: R-M6-006"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: training, url: "https://upswingpoker.com/vs-double-barrels-turn/" }]
- id: R-M6-004
  module: m6
  if: "{{t:bet|apuesta}} fuerte en el river un jugador que, por lo que has observado, rara vez {{t:bluff|farolea}}"
  then: "te {{t:fold|retiras}} más a menudo de lo que indica el {{t:mdf|MDF}}, también con {{t:pair|parejas}} medias"
  because: "el {{t:mdf|MDF}} supone que el rival {{t:bluff|farolea}} con suficiente frecuencia; cuando faltan {{t:bluff|faroles}}, {{t:call|igualar}} con una mano más débil paga sobre todo a manos mejores"
  level: exploit
  population: "un jugador concreto observado en la mesa; no hay datos de población (muestra, límites, sala), así que la regla no supone que todo un grupo de jugadores farolee poco; entrenadores de dos webs de formación describen así a los jugadores recreativos pasivos (que juegan por diversión, normalmente peor que los habituales) en límites bajos, sin cifras de una base de manos"
  source: "web de formación, Bluff Catching: When to Call and When to Let It Go (https://deepfold.co/en/blog/bluff-catching-principles: los jugadores recreativos pasivos no farolean con apuestas grandes en el river); web de formación, MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker: «In low-stakes games, most players will bluff way less»)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/bluff-catching-principles" }, { kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }]
- id: R-M6-005
  module: m6
  if: "el rival {{t:bet|apuesta}} más grande"
  then: "defiendes con un {{t:range|rango}} más estrecho: ante una apuesta de 1/3 del {{t:pot|bote}} el {{t:mdf|MDF}} es {{n:mdf.bet-third}}, y ante una apuesta del tamaño del {{t:pot|bote}}, {{n:mdf.bet-pot}}"
  because: "una apuesta mayor da un precio peor: la equity necesaria sube de {{n:eq.bet-third}} a {{n:eq.bet-pot}}"
  level: math
  source: "cálculo: MDF = bote/(bote+apuesta), equity necesaria = apuesta/(bote+2·apuesta)"
  sources: [{ kind: math }]
- id: R-M6-006
  module: m6
  if: "en la {{t:big-blind|ciega grande}} recibes un c-bet pequeño (aprox. 1/3 del {{t:pot|bote}})"
  then: "continúas con casi cualquier {{t:pair|pareja}}, con {{t:draw|proyectos}}, con cartas altas con un {{t:draw|proyecto}} adicional (backdoor) y normalmente también con as como carta más alta; te {{t:fold|retiras}} con las manos más débiles sin {{t:pair|pareja}} y sin {{t:draw|proyecto}}"
  because: "solo necesitas aprox. {{n:eq.bet-third}} de equity, y estas manos o ya ganan a los {{t:bluff|faroles}} o pueden mejorar"
  level: heuristic
  source: "web de formación, Defending the BB on High Card Boards (solver: «we will continue with pretty much all pairs including the underpairs and even A-high hands»)"
  sources: [{ kind: training }]
- id: R-M6-007
  module: m6
  if: "tienes dos cartas altas sin {{t:pair|pareja}} y sin {{t:draw|proyecto}}, y el c-bet es grande (3/4 del {{t:pot|bote}} o más)"
  then: "normalmente te {{t:fold|retiras}} (en flops {{t:dry|secos}} con rey, sin embargo, el solver {{t:call|iguala}} con muchas manos con as)"
  because: "{{t:out-of-position|fuera de posición}} una mano así rara vez llega al showdown, y una {{t:pair|pareja}} con la carta alta a menudo pierde igualmente; {{t:call|igualas}} más bien cuando tienes un {{t:draw|proyecto}} adicional, mejor aún al {{t:flush|color}} máximo"
  level: heuristic
  source: "web de formación, When to Call With Ace-High (J42, 66%: «the solver does not call with any Ace-high hand that doesn't have a significant backdoor draw»); web de formación, Defending the BB on High Card Boards (K84: el solver iguala con parte de los ases también ante 2/3 del bote)"
  sources: [{ kind: training }, { kind: training }]
- id: R-M6-008
  module: m6
  if: "quieres hacer check-raise en el flop"
  then: "lo haces sobre todo con las manos más fuertes ({{t:two-pair|doble pareja}}, sets) y con {{t:draw|proyectos}} ({{t:flush|color}}, {{t:oesd|OESD}}); con las {{t:pair|parejas}} medias normalmente {{t:call|igualas}} (simplificación: ante c-bets pequeños el solver también {{t:raise|sube}} con parte de las {{t:top-pair|parejas mayores}} y con {{t:pair|parejas}} débiles como protección)"
  because: "tras un check-raise, las manos peores suelen {{t:fold|retirarse}} y las mejores pagan, así que una {{t:pair|pareja}} media rara vez gana algo con él; un {{t:draw|proyecto}} tiene dos vías para ganar: que el rival se {{t:fold|retire}} o ligar"
  level: heuristic
  source: "web de formación, 5 Winning Check-Raising Strategies (los solvers «check-raise all sorts of top pairs versus small bets»); web de formación (tablas de solver) (sets y proyectos como check-raise; parejas débiles como protección)"
  sources: [{ kind: training }]
- id: R-M6-009
  module: m6
  if: "el c-bet es pequeño o el flop es bajo y {{t:connected|conectado}} (p. ej. 7-6-5)"
  then: "haces check-raise más a menudo; en flops altos buenos para quien subió (p. ej. K-J-T, A-A-K) y ante c-bets grandes, menos a menudo"
  because: "en flops bajos y {{t:connected|conectados}} la {{t:big-blind|ciega grande}} tiene en su {{t:range|rango}} {{t:straight|escaleras}} y {{t:two-pair|dobles parejas}}, y el Button normalmente no tiene {{t:nuts-advantage|ventaja de nuts}}; un c-bet pequeño da una ocasión barata para {{t:raise|subir}}"
  level: heuristic
  source: "web de formación, How to Check-Raise Like a High Stakes Juggernaut (flops en los que no subir: K♣J♥T♠, Q♥J♦T♠, A♥A♠K♥; check-raise 12,65% ante 33% y 8,66% ante 66% del bote); web de un solver comercial («The larger the BTN bets, the less BB raises»); web de un solver comercial, Flop Heuristics: IP C-Betting in Cash Games («flopped straights often being in the BB’s range»)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M6-010
  module: m6
  if: "haces check-raise en el flop"
  then: "{{t:raise|subes}} a aprox. {{n:xr.mult.low}}–{{n:xr.mult.example}} el c-bet, más cuanto menor sea el c-bet; nunca el mínimo"
  because: "con un check-raise a {{n:xr.mult.example}} el c-bet, el Button necesita aprox. {{n:eq.vs-xr.example}} de equity para {{t:call|igualar}}, y con {{n:xr.too-small.mult}} el c-bet solo {{n:eq.vs-xr.too-small}}; a ese precio pagará con cualquier {{t:draw|proyecto}}"
  level: heuristic
  source: "cálculo del precio: lo que hay que poner/(bote tras la subida + lo que hay que poner); web de formación, Level-Up Podcast ep. 1 (Blackwood): 4,5x ante c-bets pequeños, 3,2x ante c-bets grandes (https://upswingpoker.com/podcast/ep1-check-raise/); dirección coherente con una web de un solver comercial: cuanto menor la apuesta, mayor el múltiplo"
  sources: [{ kind: training, url: "https://upswingpoker.com/podcast/ep1-check-raise/" }, { kind: solver-pub }, { kind: math }]
- id: R-M6-011
  module: m6
  if: "te planteas un check-raise como {{t:bluff|farol}} o {{t:semi-bluff|semifarol}}"
  then: "eliges para ello sobre todo {{t:draw|proyectos}} fuertes; cuanto menos se {{t:fold|retire}} el rival, menos {{t:bluff|faroles}} de este tipo, y cuando casi nunca se {{t:fold|retira}}, haces check-raise sobre todo {{t:value|por valor}}"
  because: "un {{t:bluff|farol}} solo gana cuando el rival se {{t:fold|retira}} más a menudo que alpha (R-M6-002); un {{t:draw|proyecto}} fuerte también gana cuando liga, así que es lo que menos pierde cuando faltan {{t:fold|retiradas}}"
  level: heuristic
  source: "conclusión a partir de alpha (R-M6-002): el farol necesita que el rival se retire; web de formación, 5 Winning Check-Raising Strategies («tighten your bluffing range to include only strong draws»)"
  sources: [{ kind: training }, { kind: math }]

# M7: turn. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 „Weryfikacja źródeł — M7–M9” (decyzje D1–D9).
- id: R-M7-001
  module: m7
  if: "hiciste c-bet en el flop con {{t:position|posición}}, el rival {{t:call|igualó}} y en el turn cae una carta alta (as o rey) en una {{t:board|mesa}} más baja"
  then: "{{t:bet|apuestas}} un {{t:second-barrel|segundo barril}} más a menudo, también como {{t:bluff|farol}}"
  because: "esa carta suele ligar tu {{t:range|rango}} de {{t:open|apertura}} más a menudo que el {{t:range|rango}} del defensor, y cada {{t:pair|pareja}} del rival baja un puesto"
  level: heuristic
  source: "web de un solver comercial, The Worst Turn Card; web de formación, When to Fire a Second Barrel; web de formación, When to Double Barrel the Turn as a Bluff"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-002
  module: m7
  if: "{{t:bluff|faroleas}} con un {{t:second-barrel|segundo barril}} en el turn"
  then: "normalmente {{t:bluff|faroleas}} con manos con outs ({{t:flush-draw|proyecto de color}}, proyecto de {{t:straight|escalera}}, gutshot con carta alta) cuando el rival tiende a {{t:fold|retirarse}} o a {{t:call|igualar}}; cuando puede {{t:raise|subir}}, el solver también {{t:bluff|farolea}} con manos sin outs (simplificación: la elección depende de cómo vaya a responder el rival)"
  because: "el {{t:semi-bluff|semifarol}} gana de dos formas: cuando el rival se {{t:fold|retira}} o cuando ligas en el river; un {{t:bluff|farol}} sin outs solo tiene la primera (stacks de aprox. {{n:format.stack}})"
  level: heuristic
  source: "web de un solver comercial, From Gutshots to Airballs: Choosing Your Bluffs; entrenador con web de formación, The Double Barrel Checklist; web de formación, When to Double Barrel the Turn as a Bluff (con aprox. 100bb)"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-003
  module: m7
  if: "en el turn tienes una mano media (p. ej. {{t:second-pair|segunda pareja}} o {{t:top-pair|pareja mayor}} con kicker débil) y el rival ya ha {{t:call|igualado}} el c-bet"
  then: "{{t:check|pasas}} más a menudo en lugar de apostar por segunda vez"
  because: "tras {{t:call|igualar}} el flop, el rival tiene un {{t:range|rango}} más fuerte que antes: ante una apuesta se {{t:fold|retirará}} con las manos peores y pagará con las mejores; {{t:check|pasando}}, mantienes el {{t:pot|bote}} pequeño y llegas al showdown"
  level: heuristic
  source: "web de un solver comercial (Brokos), Principles of Turn Strategy; web de formación, Poker Basics: Polarised Ranges; web de un solver comercial, Poker: The Battle for Information"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M7-004
  module: m7
  if: "{{t:bluff|faroleas}} en el turn con una mano que por sí sola casi nunca ganará"
  then: "con una apuesta de 3/4 del {{t:pot|bote}}, el rival tiene que {{t:fold|retirarse}} más a menudo que en {{n:alpha.bet-three-quarters}} de los casos; con una apuesta de medio {{t:pot|bote}}, más a menudo que en {{n:alpha.bet-half}}"
  because: "arriesgas la apuesta para ganar el {{t:pot|bote}}: el umbral es apuesta ÷ ({{t:pot|bote}} + apuesta); los outs que tengas bajan ese umbral"
  level: math
  source: "cálculo: alpha = apuesta/(bote+apuesta)"
  sources: [{ kind: math }]
- id: R-M7-005
  module: m7
  if: "apuestas en el turn con un {{t:range|rango}} {{t:polarized|polarizado}} (manos muy fuertes y {{t:semi-bluff|semifaroles}} con {{t:draw|proyecto}}, sin manos medias)"
  then: "eliges un tamaño grande, p. ej. 3/4 del {{t:pot|bote}}, y las manos medias {{t:check|pasan}}"
  because: "las manos fuertes quieren hacer crecer el {{t:pot|bote}} antes del river, los {{t:bluff|faroles}} necesitan {{t:fold|retiradas}}, y las manos medias no ganan nada con un {{t:pot|bote}} grande"
  level: heuristic
  source: "web de formación, Polarized vs Merged Ranges (definiciones); web de formación, Polarised Ranges; web de un solver comercial, The Worst Turn Card"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-006
  module: m7
  if: "tienes una mano fuerte en el turn y el rival puede tener un {{t:flush-draw|proyecto de color}}"
  then: "apuestas fuerte: ante una apuesta de 3/4 del {{t:pot|bote}}, el {{t:draw|proyecto}} necesita {{n:eq.bet-three-quarters}} de equity, y tiene aprox. {{n:odds.flush.turn-river}}"
  because: "ante una apuesta de 1/4 del {{t:pot|bote}} le bastaría {{n:eq.bet-quarter}}, así que una apuesta pequeña le da al {{t:draw|proyecto}} un buen precio"
  level: math
  source: "cálculo: equity necesaria = apuesta/(bote+2·apuesta), probabilidad = outs ÷ cartas desconocidas; dirección (una mano fuerte y vulnerable apuesta fuerte): web de formación, How Much Should You Bet on Connected Boards?"
  sources: [{ kind: training }, { kind: math }]
- id: R-M7-007
  module: m7
  if: "tienes un {{t:draw|proyecto}} en el turn"
  then: "calculas la probabilidad para una carta: el {{t:flush|color}} es aprox. {{n:odds.flush.turn-river}}, no {{n:odds.flush.flop-river}} como del flop al river"
  because: "hasta el river queda una carta, así que la probabilidad es más o menos la mitad de la que se calcula desde el flop para dos cartas"
  level: math
  check: { kind: draw-price, streets: [turn] }
  source: "cálculo exacto (poker-core)"
  sources: [{ kind: math }]
- id: R-M7-008
  module: m7
  if: "en el turn el precio por el {{t:draw|proyecto}} es demasiado alto (tienes menos equity de la que necesitas)"
  then: "solo {{t:call|igualas}} si, al ligar, ganarás en total al menos lo que pones × (cartas que no ligan ÷ outs); lo que supera el {{t:pot|bote}} son las implied odds"
  because: "así lo que ganas cuando ligas cubre lo que pierdes cuando fallas; con proyecto de color y una apuesta de {{n:io.flush.bet}} en un {{t:pot|bote}} de {{n:ex.third.pot}}, son {{n:io.flush.extra}} por encima del {{t:pot|bote}}"
  level: math
  check: { kind: implied-odds, streets: [flop, turn], params: { sprMin: "n:spr.zone.mid" } }
  source: "cálculo del EV: equity × (bote + ganancia adicional) = (1 − equity) × lo que pones"
  sources: [{ kind: math }]
- id: R-M7-009
  module: m7
  if: "cuentas con las implied odds"
  then: "solo te fías de ellas cuando al rival le quedan suficientes {{t:chips|fichas}} (un {{t:spr|SPR}} alto), tu {{t:draw|proyecto}} es a la mejor mano y lo que ligas no salta a la vista"
  because: "las {{t:chips|fichas}} adicionales todavía te las tiene que pagar el rival; con un {{t:spr|SPR}} bajo no hay de dónde sacarlas, y un acierto visible (p. ej. un tercer corazón en la {{t:board|mesa}}) lo ahuyenta"
  level: heuristic
  source: "entrenador con web de formación, Implied Odds Calculator; web de formación, Implied Odds"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-010
  module: m7
  if: "tienes un {{t:draw|proyecto}} a {{t:flush|color}} bajo, o a {{t:straight|escalera}} cuando en la {{t:board|mesa}} puede entrar un {{t:flush|color}}"
  then: "{{t:call|igualas}} con más cautela y cuentas menos outs"
  because: "al ligar, a veces sigues perdiendo contra una mano mejor, y entonces es cuando más pagas (implied odds inversas)"
  level: heuristic
  source: "web de formación, Back to Basics (Part 2): Reverse Implied Odds; entrenador con web de formación, Implied Odds Calculator"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-011
  module: m7
  if: "defiendes la {{t:big-blind|ciega grande}} y el Button, tras {{t:open|abrir}}, no hizo c-bet en el flop ({{t:check|pasó}})"
  then: "en el turn apuestas tú más a menudo (probe bet), sobre todo en mesas bajas; en mesas con as o rey, menos a menudo"
  because: "el Button apostaría con muchas manos fuertes, así que tras {{t:check|pasar}} tiene menos; en mesas altas, sin embargo, la {{t:range-advantage|ventaja de rango}} sigue de su lado"
  level: heuristic
  source: "web de un solver comercial, The Turn Probe Bet; web de formación, Turn Probe (Kanu7); web de formación, Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-012
  module: m7
  if: "{{t:bet|apuestas}} una probe bet en el turn"
  then: "apuestas con {{t:pair|parejas}} que quieren cobrar y necesitan protección, y con {{t:draw|proyectos}} fuertes; las manos sin {{t:pair|pareja}} y sin outs {{t:check|pasan}}"
  because: "las {{t:pair|parejas}} ganan dinero de las manos peores del Button y no le dan carta gratis, los {{t:draw|proyectos}} ganan de dos formas, y las manos vacías no ganan nada"
  level: heuristic
  source: "web de un solver comercial, The Turn Probe Bet; web de formación, Turn Probe (Kanu7); web de formación, Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-013
  module: m7
  if: "has {{t:call|igualado}} un c-bet en el flop y el rival apuesta por segunda vez en el turn"
  then: "defiendes más estrecho que en el flop: los {{t:draw|proyectos}} {{t:call|igualan}} solo con buen precio o con implied odds, y las manos sin outs y las {{t:pair|parejas}} más débiles se {{t:fold|retiran}}"
  because: "el rival {{t:bet|apuesta}} el {{t:second-barrel|segundo barril}} con un {{t:range|rango}} más estrecho que el del c-bet y normalmente con un tamaño mayor, y a los {{t:draw|proyectos}} ya solo les queda una carta"
  level: heuristic
  source: "web de formación, What the Best Poker Pros Already Know About Playing vs. Double Barrels"
  sources: [{ kind: training }]

# M8: river. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D10–D17). Reguł eksploatacyjnych brak (R-M6-004: obserwacja konkretnego gracza, bez danych o populacji, D-149).
- id: R-M8-001
  module: m8
  if: "en el river {{t:in-position|en posición}} quieres apostar {{t:value|por valor}}, y el rival ya solo puede {{t:call|igualar}} o {{t:fold|retirarse}}"
  then: "apuestas cuando más de {{n:value.threshold}} de las manos que {{t:call|igualarán}} son peores que la tuya; cuentas solo las manos que pagarán, no todas las manos del rival"
  because: "cada vez que una mano peor {{t:call|iguala}} ganas una apuesta, y cada vez que {{t:call|iguala}} una mejor pierdes una apuesta; cuando el rival se {{t:fold|retira}} con una mano peor, ganas el mismo {{t:pot|bote}} que habrías ganado tras {{t:check|pasar}}"
  level: math
  source: "cálculo: valor esperado de apostar frente a pasar (programa del M8: un value bet gana más de la mitad de las veces cuando le igualan)"
  sources: [{ kind: math }]
- id: R-M8-002
  module: m8
  if: "en el river {{t:in-position|en posición}} tienes una mano media y las manos peores del rival no pagarán una apuesta"
  then: "{{t:check|pasas}} y vas al showdown gratis"
  because: "tras una apuesta, las manos peores se {{t:fold|retiran}} y pagan (o {{t:raise|suben}}) las mejores, así que la apuesta convierte una mano con valor de showdown en un {{t:bluff|farol}}"
  level: heuristic
  source: "conclusión a partir de R-M8-001; web de un solver comercial, Mastering Thin Value Bets in Checked-Down Pots; web de formación, River; web de formación, Polarized vs Merged Ranges"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M8-003
  module: m8
  if: "tu mano en el river gana a poco más de la mitad de las manos que pueden {{t:call|igualar}} (thin value)"
  then: "apuestas menos que con una mano fuerte, normalmente aprox. 1/4–1/2 del {{t:pot|bote}}, cuando el rival rara vez {{t:raise|sube}} (simplificación: con {{t:position|posición}} y riesgo de check-raise, rara vez bajas de 1/2 del {{t:pot|bote}})"
  because: "una apuesta pequeña la {{t:call|igualan}} también las manos más débiles del rival; una apuesta grande la {{t:call|igualan}} sobre todo las mejores, y entonces las manos peores que {{t:call|igualan}} dejan de superar en número a las mejores"
  level: heuristic
  source: "web de un solver comercial, River Refinements; web de un solver comercial, Mastering Thin Value Bets in Checked-Down Pots; web de formación, Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-004
  module: m8
  if: "en el river apuestas todo el {{t:pot|bote}} con un {{t:range|rango}} formado por manos muy fuertes y {{t:bluff|faroles}}"
  then: "en equilibrio aprox. {{n:bluff.share.bet-pot}} de tus apuestas son {{t:bluff|faroles}}; en general, la proporción de {{t:bluff|faroles}} = apuesta ÷ ({{t:pot|bote}} + 2·apuesta)"
  because: "así la mano del rival que solo gana a los {{t:bluff|faroles}} tiene exactamente la equity necesaria ({{n:eq.bet-pot}}): no gana nada ni {{t:call|igualando}} ni {{t:fold|retirándose}}, así que no se te puede explotar"
  level: math
  source: "cálculo: condición de indiferencia de la mano que caza faroles (modelo simplificado: rango polarizado contra un bluff-catcher); web de un solver comercial, How to Solve Toy Games"
  sources: [{ kind: solver-pub }, { kind: math }]
- id: R-M8-005
  module: m8
  if: "en el river cambias el tamaño de la apuesta con un {{t:range|rango}} {{t:polarized|polarizado}}"
  then: "con una apuesta mayor llevas en él más {{t:bluff|faroles}}, con una menor, menos: con 1/3 del {{t:pot|bote}} aprox. {{n:bluff.share.bet-third}}, con todo el {{t:pot|bote}} aprox. {{n:bluff.share.bet-pot}}"
  because: "una apuesta mayor da al rival un precio peor, así que para que le compense {{t:call|igualar}} necesita más {{t:bluff|faroles}} en tu {{t:range|rango}}"
  level: math
  source: "cálculo: proporción de faroles = apuesta/(bote+2·apuesta)"
  sources: [{ kind: math }]
- id: R-M8-006
  module: m8
  if: "eliges con qué manos {{t:bluff|farolear}} en el river"
  then: "{{t:bluff|faroleas}} con las manos más débiles, las que no ganarán en el showdown (p. ej. {{t:draw|proyectos}} de {{t:straight|escalera}} fallidos o cartas altas sin opciones); las manos con valor de showdown {{t:check|pasan}}"
  because: "un {{t:bluff|farol}} con una mano que a menudo gana tras {{t:check|pasar}} renuncia a esa ganancia; una mano sin opciones no pierde nada si el {{t:bluff|farol}} no sale"
  level: heuristic
  source: "web de un solver comercial, We're At The River. Our Hand Can't Win. Now What?; web de formación, Polarized vs Linear Ranges"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-007
  module: m8
  if: "eliges un {{t:bluff|farol}} entre las manos sin valor de showdown"
  then: "eliges una mano con una carta que bloquea las manos fuertes del rival, es decir, aquellas con las que pagará (p. ej. el as del palo cuando en la {{t:board|mesa}} hay tres cartas de ese palo)"
  because: "cuando tienes una carta de sus manos más fuertes, el rival tiene menos {{t:combo|combos}} de ellas, así que más a menudo le queda una mano con la que retirarse"
  level: heuristic
  source: "programa del M8; web de un solver comercial, Blockers & Unblockers: The Secret to Picking Great Bluffs; web de formación, What is Unblocking in Poker"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-008
  module: m8
  if: "el {{t:flush-draw|proyecto de color}} no ha entrado y tú eliges un {{t:bluff|farol}}"
  then: "cuando puedes elegir entre varios {{t:bluff|faroles}}, prefieres un {{t:bluff|farol}} sin cartas de ese palo"
  because: "con los {{t:draw|proyectos}} fallidos el rival se {{t:fold|retirará}}; una carta de su palo en tu mano reduce el número de manos con las que se retiraría"
  level: heuristic
  source: "web de formación, What is Unblocking in Poker; web de un solver comercial, Blockers & Unblockers: The Secret to Picking Great Bluffs"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-009
  module: m8
  if: "tienes una carta de un valor determinado"
  then: "el rival tiene menos {{t:combo|combos}} con ese valor: AK tiene {{n:combos.unpaired.one-blocked}} en lugar de {{n:combos.unpaired}}, y una {{t:pair|pareja}} de ases solo {{n:combos.pair.one-blocked}} en lugar de {{n:combos.pair}}"
  because: "una carta que está en tu mano no puede estar en la del rival: de las cuatro cartas de ese valor le quedan {{n:pair.outs.per-rank}}"
  level: math
  source: "combinatoria"
  sources: [{ kind: math }]
- id: R-M8-010
  module: m8
  if: "en el river tienes una mano que solo gana a los {{t:bluff|faroles}} del rival (bluff-catcher)"
  then: "{{t:call|igualas}} cuando los {{t:bluff|faroles}} superan la equity necesaria, p. ej. más de {{n:eq.bet-pot}} de las apuestas del tamaño del {{t:pot|bote}}; cuando hay menos {{t:bluff|faroles}}, te {{t:fold|retiras}}"
  because: "tu equity es la proporción de {{t:bluff|faroles}} en sus apuestas (ganas a cada {{t:bluff|farol}} y pierdes contra cada mano {{t:value|de valor}}); cuando el rival {{t:bluff|farolea}} en la proporción apuesta ÷ ({{t:pot|bote}} + 2·apuesta), {{t:call|igualar}} sale a cero"
  level: math
  source: "cálculo: equity necesaria = apuesta/(bote+2·apuesta)"
  sources: [{ kind: math }]
- id: R-M8-011
  module: m8
  if: "eliges con qué bluff-catchers {{t:call|igualar}} una apuesta en el river"
  then: "prefieres manos con cartas que bloquean las manos fuertes del rival y sin cartas que bloqueen sus {{t:bluff|faroles}} (p. ej. sin cartas del palo del {{t:draw|proyecto}} fallido)"
  because: "cuando bloqueas su valor, en su {{t:range|rango}} de apuestas quedan más {{t:bluff|faroles}}; cuando bloqueas sus {{t:bluff|faroles}}, queda más valor"
  level: heuristic
  source: "web de un solver comercial, Understanding Blockers; web de formación; web de formación, Bluff Catching Strategy"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M8-012
  module: m8
  if: "recibes una apuesta en el river y defiendes con un {{t:range|rango}}"
  then: "{{t:call|igualas}} con los mejores bluff-catchers: entre manos de fuerza parecida eliges las que tienen mejores {{t:blocker|bloqueadores}}; te {{t:fold|retiras}} con las manos que pierden incluso contra los {{t:bluff|faroles}}"
  because: "una mano que pierde contra todas las apuestas del rival no gana nada {{t:call|igualando}}, ni siquiera cuando el rival {{t:bluff|farolea}} mucho"
  level: heuristic
  source: "conclusión a partir del MDF (R-M6-001) y R-M8-010; web de un solver comercial, Principles of River Play; web de formación, Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]

# M9: plan rozdania. Matematyka z liczb (numbers.yaml); progi stref SPR i liczba ulic wartości jako heurystyki
# (uproszczenia nazwane w lekcjach). Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D18–D22).
- id: R-M9-001
  module: m9
  if: "calculas el {{t:spr|SPR}} en el flop"
  then: "divides el {{t:effective-stack|stack efectivo}} (el menor de los dos, sin lo que ya está en el {{t:pot|bote}}) entre el {{t:pot|bote}}; tras {{t:open|abrir}} y {{t:call|igualar}} es aprox. {{n:spr.srp}}, tras un 3-bet {{t:in-position|en posición}} aprox. {{n:spr.3bet-ip}}, tras un 4-bet aprox. {{n:spr.4bet}}"
  because: "cada {{t:raise|subida}} antes del flop multiplica varias veces el {{t:pot|bote}}, mientras que el stack que queda detrás disminuye mucho más despacio"
  level: math
  source: "cálculo: SPR = stack efectivo ÷ bote en el flop (stacks y botes de las cifras del M4)"
  sources: [{ kind: math }]
- id: R-M9-002
  module: m9
  if: "el rival va all-in en el flop con todo su stack"
  then: "para {{t:call|igualar}} necesitas una equity de stack ÷ ({{t:pot|bote}} + 2·stack): con un {{t:spr|SPR}} de {{n:spr.commit}} es {{n:eq.jam.spr2}}, con un {{t:spr|SPR}} de {{n:spr.srp}}, ya {{n:eq.jam.srp}}"
  because: "pones todo el stack para ganar el {{t:pot|bote}} y el stack del rival; cuanto más bajo es el {{t:spr|SPR}}, mejor precio recibes"
  level: math
  source: "cálculo: equity necesaria = lo que pones/(bote + 2·lo que pones)"
  sources: [{ kind: math }]
- id: R-M9-003
  module: m9
  if: "el {{t:spr|SPR}} en el flop es menor que aprox. {{n:spr.zone.low}} (p. ej. {{n:spr.commit}}) y tienes {{t:top-pair|pareja mayor}} o una mano mejor"
  then: "juegas por todo el stack: apuestas o {{t:call|igualas}} con el plan de meterlo todo, y normalmente no te {{t:fold|retiras}} ante un all-in"
  because: "con un {{t:spr|SPR}} de {{n:spr.commit}}, ante un all-in necesitas como mucho aprox. {{n:eq.jam.spr2}} de equity, y dos {{t:bet|apuestas}} de aprox. {{n:geo.spr2.2}} del {{t:pot|bote}} meten todo el stack; la {{t:top-pair|pareja mayor}} suele aguantar dos {{t:value|calles de valor}}"
  level: heuristic
  source: "web de un solver comercial, Stack-to-Pot Ratio; entrenador con web de formación, SPR Strategy; cálculo en la lección m9.l2"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-004
  module: m9
  if: "tras tu {{t:bet|apuesta}} te quedaría en el stack menos de lo que habrá en el {{t:pot|bote}} cuando el rival la {{t:call|iguale}}"
  then: "no planeas {{t:bet|apostar}} y luego {{t:fold|retirarte}} ante el all-in: o juegas por todo el stack, o {{t:check|pasas}}"
  because: "con un {{t:spr|SPR}} de {{n:spr.commit}}, tras una {{t:bet|apuesta}} del tamaño del {{t:pot|bote}} solo necesitas {{n:eq.commit.after-pot}} de equity ante el all-in, así que {{t:fold|retirarse}} normalmente no compensa"
  level: math
  source: "cálculo: lo que pones/(bote antes del excedente + 2·lo que pones)"
  sources: [{ kind: math }]
- id: R-M9-005
  module: m9
  if: "juegas un {{t:pot|bote}} con una sola subida y stacks completos ({{t:spr|SPR}} de aprox. {{n:spr.srp}}) y solo tienes una {{t:pair|pareja}}"
  then: "juegas por valor, pero normalmente no planeas meter todo el stack"
  because: "para meter todo el stack hasta el river hay que apostar más que el {{t:pot|bote}} en cada {{t:street|calle}}, y un rival que pone tanto dinero rara vez tiene una mano peor que una {{t:pair|pareja}}"
  level: heuristic
  source: "cálculo del tamaño geométrico (m9.l3); web de un solver comercial, Stack-to-Pot Ratio; web de formación, When to Check Top Pair"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-006
  module: m9
  if: "quieres meter todo el stack con {{t:bet|apuestas}} iguales hasta el river"
  then: "apuestas en cada {{t:street|calle}} la misma fracción f del {{t:pot|bote}}, tal que (1 + 2f) elevado al número de {{t:street|calles}} = 1 + 2·{{t:spr|SPR}}; en un {{t:pot|bote}} con 3-bet {{t:in-position|en posición}} es aprox. {{n:geo.3bet-ip.3}} del {{t:pot|bote}}"
  because: "una {{t:bet|apuesta}} de f y {{t:call|igualarla}} multiplican el {{t:pot|bote}} por (1 + 2f), y el all-in llega cuando el {{t:pot|bote}} crece hasta {{t:pot|bote}} + 2·stack"
  level: math
  source: "cálculo: tamaño geométrico; web de formación, Geometric Bet Sizing; web de un solver comercial, Pot Geometry"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-007
  module: m9
  if: "en un {{t:pot|bote}} con una sola subida y stacks de {{n:format.stack}} apuestas en tres {{t:street|calles}}"
  then: "recuerdas que tres {{t:bet|apuestas}} de medio {{t:pot|bote}} meten solo {{n:srp.half.total}}, y tres {{t:bet|apuestas}} del tamaño del {{t:pot|bote}}, {{n:srp.potbet.total}} de un stack de {{n:spr.srp.stack}}"
  because: "el {{t:pot|bote}} en el flop es pequeño respecto al stack; todo el stack entra solo con {{t:bet|apuestas}} de aprox. {{n:geo.srp.3}} del {{t:pot|bote}} en cada {{t:street|calle}}"
  level: math
  source: "cálculo: apostar e igualar multiplican el bote por (1 + 2f)"
  sources: [{ kind: math }]
- id: R-M9-008
  module: m9
  if: "antes de {{t:bet|apostar}} en el flop planificas la mano"
  then: "valoras cuántas {{t:value|calles de valor}} aguanta la mano (el número de {{t:street|calles}} es una simplificación): una muy fuerte (set, {{t:straight|escalera}}, {{t:two-pair|doble pareja}} alta), tres; {{t:top-pair|pareja mayor}} con buen kicker o {{t:overpair|sobrepareja}}, normalmente dos, y una tercera cuando el rival paga con manos más débiles; una {{t:pair|pareja}} más débil, una o ninguna"
  because: "con cada {{t:street|calle}} las manos peores del rival se {{t:fold|retiran}}, y en el {{t:pot|bote}} quedan sobre todo manos mejores que la tuya"
  level: heuristic
  source: "síntesis: web de formación, When to Check Top Pair (https://upswingpoker.com/when-to-check-top-pair/): «In single raised pots, the stack-to-pot ratio (SPR) is too high to comfortably get 3 streets of value with many top pair hands.»; web de un solver comercial, Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/): «All top pairs and all nut flush draws are now indifferent between calling and folding» (SPR 16); web de un solver comercial, Pot Geometry (https://blog.gtowizard.com/pot-geometry/): «Game theory optimal strategies typically use geometric bet sizes when they want to maximize value with a big nut advantage.»; número de calles por mano, incluida la pareja más débil: simplificación de la app (D-149)"
  sources: [{ kind: training, url: "https://upswingpoker.com/when-to-check-top-pair/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }]
- id: R-M9-009
  module: m9
  if: "tienes una mano para tres {{t:value|calles de valor}}, la zona de {{t:spr|SPR}} permite jugarla por todo el stack (R-M9-010) y quieres meter todo el stack"
  then: "ya en el flop apuestas un tamaño geométrico, no uno pequeño"
  because: "en un {{t:pot|bote}} con 3-bet, tres {{t:bet|apuestas}} de 1/3 del {{t:pot|bote}} meten solo aprox. {{n:g3b.third.total}} de un stack de {{n:spr.3bet-ip.stack}}, así que la mayor parte del stack se queda sin meter; con aprox. {{n:geo.3bet-ip.3}} del {{t:pot|bote}} en cada {{t:street|calle}}, entra entero"
  level: math
  source: "cálculo: cadena de apuestas y calls (numbers.yaml, claves g3b.third.* y geo.3bet-ip.*)"
  sources: [{ kind: math }]
- id: R-M9-010
  module: m9
  if: "decides si jugar por todo el stack con una mano concreta"
  then: "miras la zona de {{t:spr|SPR}} (simplificación): por debajo de aprox. {{n:spr.zone.low}} normalmente basta con {{t:top-pair|pareja mayor}}; de {{n:spr.zone.low}} a {{n:spr.zone.mid}}, la {{t:top-pair|pareja mayor}} es una mano límite; de {{n:spr.zone.mid}} a {{n:spr.zone.deep}} normalmente necesitas {{t:two-pair|doble pareja}} alta o algo mejor, y por encima de {{n:spr.zone.deep}}, un set, una {{t:straight|escalera}} o una mano mejor"
  because: "cuanto más alto es el {{t:spr|SPR}}, más {{t:bet|apuestas}} hacen falta para meter todo el stack, y hasta el final el rival paga sobre todo con manos fuertes; con un {{t:spr|SPR}} de {{n:spr.zone.deep}}, todo el stack entra solo tras tres {{t:bet|apuestas}} del tamaño del {{t:pot|bote}}"
  level: heuristic
  source: "entrenador con web de formación, SPR Strategy (https://www.splitsuit.com/spr-poker-strategy): «less than 3 is an auto-stack off with top pair or better, between 3-6 is situational and based upon villain/board texture, and more than 6 SPR isn't a default stack-off»; web de un solver comercial, Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/): «at this higher SPR, stacking off with top pair starts to get a bit dicey»; zona 6–13: parte común de dos webs de formación: SPR (https://www.thepokerbank.com/strategy/concepts/spr/): «Medium SPR = 7 - 16», «Good hands for medium SPRs.», «Top two pair. Sets.»; Poker SPR (https://pokercoaching.com/blog/poker-spr/): «High SPR (8+): Deep stacks favor hands that make nutted combinations (sets, straights, flushes) over one-pair holdings.»; umbral 13: cálculo (1+2·1)^3 = 1+2·13 y Flynn, Mehta, Miller, Professional No-Limit Hold'em a través de una web de noticias (https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm): «if you're heads-up and the stack-to-pot ratio is 13 going to the flop, you and your opponent can each make exactly three pot-sized bets»; límites de las zonas: simplificación de la app (D-149)"
  sources: [{ kind: training, url: "https://www.splitsuit.com/spr-poker-strategy" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }, { kind: training, url: "https://www.thepokerbank.com/strategy/concepts/spr/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-spr/" }, { kind: math }, { kind: book, url: "https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm" }]

# M10: eksploatacja mikrostawek. Każde dostosowanie to odejście od bazy z M3–M9 (ADR-03). Definicje statystyk: rules;
# błąd próby, próg blefu i wpływ rake'u na cenę: math; progi typów graczy i próby z serwisów szkoleniowych: heuristic;
# wynik solvera: gto; dostosowanie do typu gracza: exploit z populacją (dane z analizy bazy rąk populacji albo odczyt HUD rywala z próbą).
# Decyzje D-M10-01…14 w raporcie M10 (do dokumentu 12 „Weryfikacja źródeł — M10–M13”).
- id: R-M10-001
  module: m10
  if: "lees el {{t:vpip|VPIP}} y el {{t:pfr|PFR}} del rival"
  then: "el {{t:vpip|VPIP}} es el porcentaje de manos en las que mete {{t:chips|fichas}} voluntariamente antes del flop ({{t:call|iguala}} o {{t:raise|sube}}; las ciegas no cuentan), y el {{t:pfr|PFR}}, el porcentaje de manos en las que {{t:raise|sube}} antes del flop ({{t:open|apertura}}, 3-bet, 4-bet); el {{t:pfr|PFR}} nunca supera el {{t:vpip|VPIP}}"
  because: "cada {{t:raise|subida}} también es meter {{t:chips|fichas}} voluntariamente, así que la diferencia {{t:vpip|VPIP}} − {{t:pfr|PFR}} son las manos que el rival solo {{t:call|igualó}} o con las que hizo limp"
  level: rules
  source: "glosario de una web de un solver comercial (https://gtowizard.com/en/glossary/): «VPIP: … a statistic that measures the frequency with which a player voluntarily puts money into the pot preflop.»; web de formación, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «Anytime a player makes a call or a raise before the flop, their VPIP goes up», «a player’s PFR stat goes up anytime they make a raise before the flop, which includes all 3-bets and 4-bets as well as open raises»"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }]
- id: R-M10-002
  module: m10
  if: "la estadística del rival se basa en n ocasiones"
  then: "su error estándar es √(p × (1 − p) ÷ n): con un {{t:vpip|VPIP}} de {{n:hud.se.ex.p}} tras {{n:hud.se.ex.n}} manos, aprox. {{n:hud.se.ex}}, así que el {{t:vpip|VPIP}} real está, con aprox. {{n:var.conf95}} de confianza, entre {{n:hud.ci.ex.low}} y {{n:hud.ci.ex.high}}"
  because: "cada mano es una muestra aleatoria de su estrategia, y el error de esa media solo disminuye con la raíz cuadrada del número de ocasiones, igual que el error del winrate en el módulo 12"
  level: math
  source: "cálculo: error estándar de una proporción en la distribución binomial, √(p(1 − p) ÷ n), e intervalo de ±1,96 errores (numbers.yaml, claves hud.se.*, hud.ci.*)"
  sources: [{ kind: math }]
- id: R-M10-003
  module: m10
  if: "valoras a un rival por las estadísticas del {{t:hud|HUD}}"
  then: "por debajo de aprox. {{n:hud.hands.random}} manos las tratas como aleatorias y juegas contra él como contra un desconocido; el tipo de jugador se ve a grandes rasgos tras aprox. {{n:hud.hands.random}}–{{n:hud.hands.rough.high}} manos, el {{t:vpip|VPIP}} y el {{t:pfr|PFR}} se estabilizan tras aprox. {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}}, el 3-bet tras aprox. {{n:hud.hands.3bet.overall.low}}–{{n:hud.hands.3bet.high}}, y el fold to 3-bet tras aprox. {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}}"
  because: "el {{t:vpip|VPIP}} suma una ocasión en cada mano, y el fold to 3-bet solo cuando el rival ha {{t:open|abierto}} y ha recibido un 3-bet, así que con el mismo número de manos tiene muchas menos ocasiones y un error mayor"
  level: heuristic
  source: "web de formación, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «For VPIP and PFR, you need at least 100 to 200 hands before the numbers begin to stabilize.», «For 3-bet and fold to 3-bet, closer to 500 hands is the threshold.»; web de formación, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «Below 30 hands, treat the HUD numbers as random and use hand-observation reads only.», «VPIP / PFR 30-50 hands», «3-bet % (overall) 100+ hands», «Fold to 3-bet | 200+ hands»; para VPIP y PFR, dos umbrales: tipo aproximado tras 30–50 manos y estabilización tras 100–200 (contradicción en el mismo nivel, docs/tresci/e1-m9-m11.md §3.1); para 3-bet y fold to 3-bet, límites inferiores distintos de la misma tabla (100+ y 200+), con límite superior común (D-M10-04; E3 2026-11-04)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-004
  module: m10
  if: "el {{t:vpip|VPIP}} del rival supera su {{t:pfr|PFR}} en más de {{n:hud.gap.passive}} puntos porcentuales"
  then: "es un jugador pasivo: {{t:call|iguala}} y hace limp mucho, y {{t:raise|sube}} poco"
  because: "la mayoría de las manos que juega las mete en el {{t:pot|bote}} {{t:call|igualando}}; en los {{t:regular|regulares}} la diferencia es pequeña, porque empiezan casi todas las manos con una {{t:raise|subida}}"
  level: heuristic
  source: "web de formación, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «When a player’s PFR is more than 10 points below their VPIP, I immediately flag them as a passive player who calls too much and raises too little.»; web de formación, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «Gap > 10 → Passive player. Lots of cold-calls and limps.»; datos de control de un análisis de una base de manos de la población, gran sala online NL25 6-max: jugadores recreativos 42/18, regulares 23/18 (mda.rec.*, mda.reg.*)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-005
  module: m10
  if: "asignas un tipo al rival por su {{t:vpip|VPIP}} y su {{t:pfr|PFR}} (6-max, al menos aprox. {{n:hud.hands.vpip.low}} manos)"
  then: "un {{t:nit|nit}} juega hasta aprox. {{n:hud.vpip.nit-max}} de las manos; un {{t:regular|regular}}, aprox. {{n:hud.vpip.reg.low}}–{{n:hud.vpip.reg.high}} con poca diferencia {{t:vpip|VPIP}} − {{t:pfr|PFR}}; un jugador suelto, desde aprox. {{n:hud.vpip.loose}}: con una diferencia de más de {{n:hud.gap.passive}} puntos es un {{t:recreational|jugador recreativo}} pasivo ({{t:calling-station|calling station}}), y con una diferencia de hasta aprox. {{n:hud.gap.aggressive}} puntos, un {{t:maniac|maníaco}}"
  because: "el tipo te dice en qué dirección se aparta el rival de la base: juega demasiado pocas manos, demasiadas, {{t:call|iguala}} demasiado a menudo o {{t:raise|sube}} demasiado a menudo"
  level: heuristic
  source: "web de formación, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/), tabla 6-max cash: «22 to 28», «35+», «14 or below»; «a player playing a 45 VPIP is either a maniac or a calling station»; «When the gap is less than 3 points, I flag them as highly aggressive»; web de formación, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «10-15% | Very tight (nit)», «18-22% | Tight-aggressive (TAG)», «25-30% | Loose-aggressive (LAG)», «35%+ | Loose (likely recreational)», perfiles «Nit (15/12/3%)», «Whale / Recreational (45/8/2%)», «Maniac (38/35/15%+)»; análisis de una base de manos de la población: Regulars «VPIP = 18-32», Recreationals «VPIP > 40»; umbrales como parte común o como intervalo que abarca las fuentes (D-M10-03)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-006
  module: m10
  if: "juegas contra un {{t:recreational|jugador recreativo}} pasivo ({{t:vpip|VPIP}} desde aprox. {{n:hud.vpip.loose}}, diferencia {{t:vpip|VPIP}} − {{t:pfr|PFR}} de más de {{n:hud.gap.passive}} puntos)"
  then: "apuestas {{t:value|por valor}} con más manos, también más finas, y {{t:bluff|faroleas}} menos a menudo que en la base del módulo 8, sobre todo en el river"
  because: "un jugador así llega más a menudo al showdown y pierde allí más a menudo, es decir, {{t:call|iguala}} con manos más débiles: más de las manos con las que {{t:call|iguala}} son peores que la tuya (umbral del value bet del módulo 8), y un {{t:bluff|farol}} solo gana cuando el rival se {{t:fold|retira}} más a menudo que {{t:alpha|alpha}}"
  level: exploit
  population: "jugadores recreativos en una gran sala online, NL25–NL100 6-max (según la definición de la base: VPIP > 40, resultado < −20bb/100): WTSD 32% frente a 28% de los regulares, showdowns ganados 46% frente a 57%, resultado −47bb/100; todas las manos de los 12 meses anteriores al 5/10/2026 (análisis de una base de manos de la población, número de manos no indicado)"
  source: "web con análisis de una base de manos de la población (https://bluffaces.com/calculators/mda/), filtros: gran sala online NL25/NL50/NL100 6-max, Recreationals y Regulars (mda.rec.*, mda.reg.*), número de manos no indicado; web de formación, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): un WTSD alto «instantly tells you to bluff them less and value bet them more across all betting streets, especially on the river.»; web de formación, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «>30% → Calling station. Value bet thinly, never bluff river.» (este umbral de WTSD no lo enseñamos: la web de formación indica «In most cases, your WTSD% should be around 30», y en los datos del análisis de la base de manos los regulares tienen 28% y los jugadores recreativos 32%; D-M10-07); el umbral del value bet R-M8-001 y alpha del módulo 6, sin cambios (D-M10-06)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-007
  module: m10
  if: "un {{t:nit|nit}} ({{t:vpip|VPIP}} hasta aprox. {{n:hud.vpip.nit-max}} tras al menos aprox. {{n:hud.hands.vpip.low}} manos) {{t:raise|sube}} o hace 3-bet"
  then: "con las manos de la parte baja de tu {{t:range|rango}} para {{t:call|igualar}} te {{t:fold|retiras}} más a menudo que en la base del módulo 4, y le robas las ciegas más a menudo"
  because: "quien juega tan pocas manos {{t:raise|sube}} sobre todo con las más fuertes, así que tus manos medias están dominadas más a menudo; y como defiende sus ciegas con un rango estrecho, tu {{t:open|apertura}} gana al instante más a menudo"
  level: exploit
  population: "un único rival: lectura del HUD de al menos aprox. 100 manos (VPIP hasta 14%); umbrales de tipo de dos webs de formación (cash 6-max online); sin datos de toda la población, porque los nits son una minoría en la mesa (D-M10-02)"
  source: "web de formación, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «anyone significantly below is a nit whose raises you can nearly always fold to»; web de formación, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): nit «Plays only premium hands. Steal their blinds relentlessly, fold to their 3-bets without thought, bluff-catch sparingly.»; «10-15% | Very tight (nit) | Folds preflop too much; bluff their open ranges, fold to their 3-bets»"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-008
  module: m10
  if: "juegas contra un {{t:maniac|maníaco}} ({{t:vpip|VPIP}} desde aprox. {{n:hud.vpip.loose}}, {{t:pfr|PFR}} casi igual al {{t:vpip|VPIP}})"
  then: "no le {{t:bluff|faroleas}}, {{t:call|igualas}} más amplio con manos que cazan {{t:bluff|faroles}}, y con manos muy fuertes le dejas apostar"
  because: "sus apuestas y {{t:raise|subidas}} contienen más {{t:bluff|faroles}} que en la base, así que las manos que en la base están en el límite de {{t:call|igualar}} pasan a ganar dinero, y un {{t:bluff|farol}} contra alguien que rara vez se {{t:fold|retira}} pierde"
  level: exploit
  population: "un único rival: lectura del HUD de al menos aprox. 100 manos (VPIP desde 35%, VPIP − PFR por debajo de 3 puntos); umbrales de tipo de dos webs de formación (cash 6-max online); sin datos de toda la población (D-M10-02)"
  source: "web de formación, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): maníaco «Trap with premium hands by flat-calling preflop and letting them stack off. Don't try to out-bluff them; just let them hang themselves.»; web de formación, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «a player playing a 45 VPIP is either a maniac or a calling station»; principio de las manos mixtas: web de un solver comercial, Calling Down Over-Bluffed Lines in Lower Limits (R-M10-009)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: solver-pub }]
- id: R-M10-009
  module: m10
  if: "sabes que en una línea concreta el rival {{t:bluff|farolea}} más o menos a menudo que en equilibrio"
  then: "primero cambias la decisión con las manos que en la base mezclan {{t:call|igualar}} y {{t:fold|retirarse}}: si hay exceso de {{t:bluff|faroles}}, con ellas siempre {{t:call|igualas}}; si hay defecto, siempre te {{t:fold|retiras}}"
  because: "en equilibrio esas manos son indiferentes, porque el rival tiene exactamente los {{t:bluff|faroles}} necesarios; basta un pequeño exceso o defecto para empujarlas hacia un lado, mientras que el resto del {{t:range|rango}} solo cambia con una diferencia grande"
  level: gto
  source: "web de un solver comercial, Calling Down Over-Bluffed Lines in Lower Limits (https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/), análisis con nodelock: «Hands that mix calls and folds in theory do so because Villain’s bet size is strategically balanced, making them indifferent to calling and folding since no option is the best.»; «If they are bluffing just a single combo more than they should, all of our indifferent bluff catchers become profitable calls and vice versa (we always fold when they are under-bluffing even slightly).»; «I only changed Villain’s strategy to bluff ~31% instead of ~27% of the time for our strategy to shift completely to never folding.»"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/" }]
- id: R-M10-010
  module: m10
  if: "el rival se {{t:fold|retira}} ante el c-bet más a menudo de lo que marca el {{t:alpha|alpha}} de tu tamaño"
  then: "un c-bet sin ninguna mano gana dinero al instante: con un c-bet de 1/3 del {{t:pot|bote}} basta con más de {{n:alpha.cbet.small}} de {{t:fold|retiradas}}, y con un c-bet de 3/4 del {{t:pot|bote}}, con más de {{n:alpha.cbet.big}}"
  because: "el {{t:bluff|farol}} arriesga la apuesta para ganar el {{t:pot|bote}}; gana cuando el porcentaje de {{t:fold|retiradas}} supera apuesta ÷ ({{t:pot|bote}} + apuesta); el fold to c-bet del {{t:hud|HUD}} mezcla todos los tamaños y mesas, así que solo es una aproximación"
  level: math
  source: "cálculo: EV de un farol puro = retirada × bote − (1 − retirada) × apuesta > 0 ⇔ retirada > apuesta ÷ (bote + apuesta) (alpha, módulo 6; numbers.yaml alpha.cbet.*); glosario de una web de un solver comercial (https://gtowizard.com/en/glossary/): «Alpha (α): The minimum frequency your opponent needs to fold to a bet, in order to break even with a pure (0% equity) bluff.»"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M10-011
  module: m10
  if: "el rival rara vez se {{t:fold|retira}} ante un 3-bet (fold to 3-bet por debajo de aprox. {{n:hud.f3b.low}}), p. ej. un {{t:recreational|jugador recreativo}} típico"
  then: "le haces 3-bet con un {{t:range|rango}} {{t:linear|lineal}}: más manos fuertes {{t:value|por valor}}, casi sin {{t:bluff|faroles}}"
  because: "un 3-bet {{t:in-position|en posición}} a {{n:pf.3bet.ip-total}} sin ninguna mano solo gana con más de {{n:alpha.vs-3bet-ip-size}} de {{t:fold|retiradas}}; cuando el rival rara vez se {{t:fold|retira}}, los {{t:bluff|faroles}} acaban jugando un {{t:pot|bote}} grande con manos débiles, y a las manos fuertes les {{t:call|igualan}} más"
  level: exploit
  population: "gran sala online, NL25–NL100 6-max (análisis de una base de manos de la población, 12 meses anteriores al 5/10/2026, número de manos no indicado): fold to 3-bet de los jugadores recreativos 31% (NL50 30%, NL100 32%), de los regulares 55% (NL50 57%, NL100 55%)"
  source: "web con análisis de una base de manos de la población (https://bluffaces.com/calculators/mda/), Fold to 3bet (mda.rec.f3b, mda.reg.f3b), número de manos no indicado; web de formación, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «if a player has a low Fold to 3-Bet, you will want to adjust your 3-betting range against them and play a more linear range made up of almost solely value hands and very few bluffs.»; web de formación, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «<50% → They call 3-bets wide. Drop bluff 3-bets; value-bet thinner and exploit postflop.»; umbral alpha del módulo 4 (alpha.vs-3bet-ip-size)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-012
  module: m10
  if: "del rival tienes solo una muestra pequeña o solo un conocimiento general de la población"
  then: "te apartas de la base solo en la dirección que muestran las estadísticas, y solo con manos límite; una desviación grande, con todo tu {{t:range|rango}}, solo con una muestra grande y un error claro del rival"
  because: "con una muestra pequeña el error de la estadística es grande, y apartarse de la base (la estrategia menos explotable) es en sí explotable"
  level: heuristic
  source: "web de formación, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «The directional signal (very high VPIP, very low PFR) may still be useful even with small samples, but specific exploitation based on percentage points requires a much larger hand history.»; glosario de una web de un solver comercial (https://gtowizard.com/en/glossary/): «Exploit: To deviate from a baseline strategy in order to take advantage of a (future or prior) mistake in your opponent's strategy.», «Game Theory Optimal (GTO) The least exploitable fixed strategy»; error de muestra: R-M10-002"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://gtowizard.com/en/glossary/" }]
- id: R-M10-013
  module: m10
  if: "juegas cash 6-max en microlímites (NL2–NL25)"
  then: "cuentas tu resultado después del {{t:rake|rake}}: las grandes salas online cobran aprox. {{n:rake.micro.low}}–{{n:rake.micro.high}}, es decir, varias veces más que el winrate de un jugador ganador típico ({{n:var.wr.typical.low}}–{{n:var.wr.typical.high}})"
  because: "todos los jugadores pagan {{t:rake|rake}} de cada {{t:pot|bote}} que llega al flop; para ganar, tienes que superar a los rivales por más de lo que supone el {{t:rake|rake}}"
  level: heuristic
  source: "web de calculadoras de póker, Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/), NLH 6-max, dos grandes salas online NL2–NL25 (rake.micro.*); datos de control de la población: Tombos21, rake por jugador NL10 9,1bb/100, NL100 7,3bb/100 (rake.pop.*); web de noticias, How Many Winning Cash Games Players Are There? It Depends on Rake (https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players), Tombos21: «Reminder that your biggest villain is the house.», «Pre-rake winners 90% post-rake winners 53%»; entrenador con blog de formación (var.wr.typical.*, módulo 12)"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: population, url: "https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players" }, { kind: training }]
- id: R-M10-014
  module: m10
  if: "recibes una {{t:open|apertura}} en una partida con {{t:rake|rake}} cobrado solo de los {{t:pot|botes}} que llegan al flop"
  then: "{{t:call|igualas}} menos a menudo que en una partida sin {{t:rake|rake}}; con parte de las manos que sin {{t:rake|rake}} {{t:call|igualarían}} haces 3-bet, y con el resto te {{t:fold|retiras}}"
  because: "el {{t:rake|rake}} se lleva parte del {{t:pot|bote}} después del flop, mientras que un {{t:pot|bote}} que termina antes del flop está libre de él: {{t:call|igualar}} suele llevar al flop y paga {{t:rake|rake}}, el 3-bet a menudo termina la mano antes del flop, sin {{t:rake|rake}}, y {{t:fold|retirarse}} no cuesta nada (algunas salas cobran {{t:rake|rake}} también de los {{t:pot|botes}} con 3-bet sin flop, así que allí el 3-bet también paga)"
  level: gto
  source: "web de un solver comercial, Preflop Raise Sizing: Examining 2 Key Factors (https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/), soluciones 200bb 6-max con rake de NL100: «Facing a LJ raise, the HJ, CO, and BTN all VPIP 25%-35% fewer hands in the raked game.», «Rake makes calling raises considerably less appealing, leading to much lower VPIPs and somewhat higher 3-betting frequencies in “no flop, no drop” games.», «BB calls a min-raise in the raked game barely 60% as often as in the unraked game»; simplificación: resultado para 200bb, el autor: «many of the principles will generalize»; estructuras de rake de las salas: web de calculadoras de póker, API /network-rake-list, campo rule: segunda gran sala online «flop_drop», gran sala online «flop_or_3b_drop» (consultado el 5/10/2026)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/" }, { kind: training }]
- id: R-M10-015
  module: m10
  if: "calculas la equity necesaria en una partida con {{t:rake|rake}}"
  then: "divides lo que pones entre el {{t:pot|bote}} tras {{t:call|igualar}}, descontado el {{t:rake|rake}}: con una apuesta de medio {{t:pot|bote}} y un {{t:rake|rake}} de {{n:rake.ex.pct}}, necesitas {{n:eq.bet-half.rake}} en lugar de {{n:eq.bet-half}}"
  because: "ganas el {{t:pot|bote}} sin el {{t:rake|rake}}, pero pones la cantidad completa; en microlímites los {{t:pot|botes}} rara vez llegan al {{t:rake-cap|tope de rake}}, así que lo que cuenta es el porcentaje"
  level: math
  source: "cálculo: lo que pones ÷ (bote tras igualar × (1 − rake)) (numbers.yaml eq.bet-half.rake); web de calculadoras de póker, Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/): «At microstakes, percentage drives the cost because pots rarely hit the cap.»"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: math }]

# M12: mental game i bankroll. Poziomy według ADR-24: rachunek = math, zalecenie oparte na rachunku lub literaturze = heuristic.
- id: R-M12-001
  module: m12
  if: "valoras tu resultado o tu winrate a partir de una muestra de manos"
  then: "calculas un intervalo: winrate ± {{n:var.z95}} × SD ÷ √(número de manos ÷ 100)"
  because: "con una SD de {{n:var.sd}}, incluso tras {{n:var.hands.k}} mil manos el intervalo del {{n:var.conf95}} es de aprox. ± {{n:var.ci.wr}}, así que un resultado de {{n:var.wr.ex}} solo significa «entre aprox. {{n:var.wr.ci.low}} y {{n:var.wr.ci.high}}»"
  level: math
  source: "cálculo: error estándar de la media (distribución normal); SD de una web de calculadoras de póker, Examples and Impacts of Variance in Cash Games y Poker Variance Calculator"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-002
  module: m12
  if: "entras en un {{t:downswing|downswing}} de {{n:dd.bi.small}} {{t:buy-in|buy-ins}}"
  then: "no lo tomas como prueba de que juegas mal, sino que revisas las decisiones de las manos perdidas"
  because: "en {{n:var.hands.k}} mil manos, un {{t:downswing|downswing}} así desde el máximo le ocurre a aprox. {{n:dd.p.small.100k}} de los jugadores que ganan {{n:var.wr.ex}} (SD {{n:var.sd}})"
  level: heuristic
  source: "cálculo: simulación de Monte Carlo (numbers.yaml, claves dd.*); una web de calculadoras de póker, Examples and Impacts of Variance in Cash Games, da una cifra menor para este escenario (informe M12)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-003
  module: m12
  if: "quieres saber cuánto ganas realmente"
  then: "reúnes cientos de miles de manos: una precisión de ± {{n:var.target}} con {{n:var.conf95}} de confianza requiere aprox. {{n:var.need.hands.k}} mil manos"
  because: "el error de la estimación disminuye con la raíz cuadrada del número de manos: bloques de 100 manos necesarios = ({{n:var.z95}} × SD ÷ precisión)²"
  level: math
  source: "cálculo: (1,96 × 80 ÷ 2)² bloques; coherente con el orden de magnitud del documento 08 (aprox. 615 mil manos)"
  sources: [{ kind: math }]
- id: R-M12-004
  module: m12
  if: "valoras tu jugada después de la mano"
  then: "te preguntas por la decisión (el precio, la equity, la información que tenías), no por si ganaste"
  because: "una buena decisión pierde con regularidad: un all-in con AA contra KK pierde en aprox. {{n:res.kk-wins}} de los casos, y aun así la gente juzga las decisiones por el resultado, incluso sabiendo que no debería"
  level: heuristic
  source: "Baron y Hershey (1988), Outcome bias in decision evaluation, J Pers Soc Psychol 54(4); Annie Duke sobre el «resulting» (Masters in Business, Ritholtz 2018); equity AA–KK: cálculo exacto (documento 08)"
  sources: [{ kind: math }, { kind: book }, { kind: study }]
- id: R-M12-005
  module: m12
  if: "el resultado de unas pocas {{t:session|sesiones}} te tienta a cambiar de estrategia"
  then: "la cambias solo después de revisar las manos, no por el resultado en sí"
  because: "incluso el mejor {{n:skill.pct}} de los jugadores supera al peor {{n:skill.pct}} en aprox. {{n:skill.ahead}} de los casos solo tras aprox. {{n:skill.hands}} manos, y las diferencias de habilidad menores necesitan muchas más manos"
  level: heuristic
  source: "van Loon, van den Assem y van Dolder (2015), Beyond Chance? The Persistence of Performance in Online Poker, PLoS ONE 10(3)"
  sources: [{ kind: study }]
- id: R-M12-006
  module: m12
  if: "notas las primeras señales de tilt de tu perfil (p. ej. enfado tras un bad beat, ganas de castigar a un rival)"
  then: "reaccionas en el acto: respiras y te dices una frase preparada que te recuerda por qué esto es {{t:variance|varianza}} o un error del que aprender"
  because: "cuando el tilt crece, dejas de pensar con claridad, y entonces ya no se puede controlar"
  level: heuristic
  source: "Tendler, entrevista en una web de noticias (2014) («When tilt becomes too intense, it shuts down your ability to think», «you must begin correcting tilt when it's small»); Tendler y Carter, The Mental Game of Poker (2011), técnica «injecting logic»"
  sources: [{ kind: book }]
- id: R-M12-007
  module: m12
  if: "tras una serie de pérdidas ya no eres capaz de valorar las decisiones con calma (p. ej. solo piensas en recuperar lo perdido o juegas manos con las que normalmente te {{t:fold|retiras}})"
  then: "terminas la {{t:session|sesión}}"
  because: "seguir jugando en ese estado es jugar a tu peor nivel (C-game), y el objetivo es parar a tiempo, antes de perder la capacidad de pensar con claridad"
  level: heuristic
  source: "Tendler y Carter, The Mental Game of Poker (2011), fragmento «Inchworm» (fragmento publicado en línea): «quit sooner when it's no longer possible to recover a solid thought process»"
  sources: [{ kind: book }]
- id: R-M12-008
  module: m12
  if: "trabajas en tu juego"
  then: "empiezas por corregir tus peores jugadas (C-game), no por pulir las mejores"
  because: "mejorar tu peor juego da un progreso constante y libera atención para aprender cosas nuevas"
  level: heuristic
  source: "Tendler y Carter, The Mental Game of Poker (2011), fragmento «Inchworm» (fragmento publicado en línea); Tendler, The Inchworm Concept (jaredtendler.com)"
  sources: [{ kind: book }]
- id: R-M12-009
  module: m12
  if: "calculas el {{t:risk-of-ruin|riesgo de ruina}}, es decir, de perder todo el bankroll"
  then: "usas la fórmula RoR = e^(−2 × winrate × bankroll ÷ SD²), con el bankroll en bb; es una aproximación que supone winrate y SD constantes"
  because: "con {{n:var.wr.typical.high}} y SD {{n:var.sd}}, un bankroll de {{n:br.bi.base}} {{t:buy-in|buy-ins}} da aprox. {{n:ror.base}} de riesgo, y uno de {{n:br.bi.move-down}} {{t:buy-in|buy-ins}}, ya aprox. {{n:ror.half}}"
  level: math
  source: "web de calculadoras de póker, Risk of Ruin Formula for Poker Players («RoR = e^(-2 x WR x BR / SD^2)»); valores: cálculo (numbers.yaml, claves ror.*)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-011
  module: m12
  if: "el bankroll baja a la mitad del número de {{t:buy-in|buy-ins}} previsto (con {{n:br.bi.base}}, a {{n:br.bi.move-down}})"
  then: "bajas un {{t:stakes|límite}} como muy tarde en ese momento, y vuelves a subir como muy pronto cuando tengas el bankroll completo en {{t:buy-in|buy-ins}} del {{t:stakes|límite}} superior"
  because: "los {{t:downswing|downswings}} de {{n:dd.bi.small}} {{t:buy-in|buy-ins}} en {{n:var.hands.k}} mil manos le ocurren a casi todos los jugadores que ganan entre {{n:dd.wr-low}} y {{n:var.wr.ex}} (simulación con SD {{n:var.sd}}), algunas fuentes aconsejan bajar ya tras una pérdida así, y con {{n:br.bi.move-down}} {{t:buy-in|buy-ins}} el riesgo de perder el resto sube de aprox. {{n:ror.base}} a aprox. {{n:ror.half}} (con un winrate de {{n:var.wr.typical.high}} y SD {{n:var.sd}})"
  level: heuristic
  source: "web de formación, Bankroll Management («half the roll, which is the point to move down a stake»); web de formación, Poker Bankroll Management Strategy (con 3bb/100, bajar con 30 buy-ins, es decir, con el bankroll completo); web de calculadoras de póker, Risk of Ruin Formula for Poker Players («Losing 10 should trigger a move down»); cálculo del riesgo de ruina y simulación de downswings"
  sources: [{ kind: training }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M12-012
  module: m12
  if: "planificas tu tiempo de póker"
  then: "al principio dedicas aprox. {{n:study.beginner}} del tiempo a estudiar; cuando ya ganas en tu {{t:stakes|límite}}, aprox. {{n:study.winner}}, pero nunca menos de {{n:study.min}}"
  because: "al principio es cuando más tienes que recuperar, y cuando ya ganas en tu {{t:stakes|límite}}, puedes jugar más"
  level: heuristic
  source: "web de formación, What should your study-to-play ratio be (artículo de Dara O'Kearney): «New players have so much catching up to do»; «Once you are beating the games you are in you can start to reduce the study and increase the grinding»"
  sources: [{ kind: training }]

# M11: turnieje i short stacki (moduł opcjonalny). Zakresy push/fold z własnego solvera (pushfold.json, heads-up mały
# blind kontra duży blind, zwalidowany z równowagą Nasha, dokument 10); progi i pojęcia z przeczytanych źródeł (raport M11).
- id: R-M11-001
  module: m11
  if: "en un {{t:tournament|torneo}} tienes aprox. {{n:m11.thr.pushfold}} o menos, y todos antes que tú se han {{t:fold|retirado}}"
  then: "vas all-in o te {{t:fold|retiras}} (push/fold); entre {{n:m11.thr.pushfold}} y {{n:m11.thr.upper}}, el push/fold es el método principal para manos débiles y medias, y por encima de aprox. {{n:m11.thr.raise}} normalmente haces una subida normal"
  because: "con un {{t:short-stack|stack corto}}, subir y {{t:fold|retirarte}} ante una {{t:raise|subida}} regala demasiadas {{t:chips|fichas}}, mientras que el all-in le saca al rival el máximo de {{t:fold|retiradas}}; es una simplificación: los solvers con más opciones de acción hacen limp o subida mínima con parte de las manos"
  level: heuristic
  source: "web de formación, Short Stack Strategy (https://pokercoaching.com/blog/short-stack-strategy-2/): «At 10 big blinds or fewer, it is almost entirely push/fold», «This approach simplifies decision-making and maximizes fold equity», «At 15 big blinds, the landscape shifts significantly. Push/fold becomes your dominant framework for weak and medium holdings»; web de formación, Push/Fold Tournament Strategy (https://upswingpoker.com/push-fold-tournament-strategy-charts/): «around 15 big blinds (bb) or fewer», «larger than 20bb … Raising First In»; web de un solver comercial, Short-Stacked Play in MTTs (https://blog.gtowizard.com/short-stacked-play-in-mtts/): «The standard advice for a 10bb stack is to play an all-in or fold strategy»; simplificación: web de formación (la misma página): «the all-in or fold binary was grossly suboptimal»; escuela que publica resultados de solver, heads-up 10bb (https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments): «61.1% limp, 28.8% all-in, 10.1% fold»"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/short-stack-strategy-2/" }, { kind: training, url: "https://upswingpoker.com/push-fold-tournament-strategy-charts/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/short-stacked-play-in-mtts/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments" }]
- id: R-M11-002
  module: m11
  if: "juegas push/fold desde la {{t:small-blind|ciega pequeña}} contra la {{t:big-blind|ciega grande}}"
  then: "cuanto más corto es el stack, con más manos haces {{t:shove|push}} all-in: con {{n:m11.depth.15}}, aprox. {{n:m11.push.15}} de las manos; con {{n:m11.depth.10}}, aprox. {{n:m11.push.10}}; con {{n:m11.depth.5}}, aprox. {{n:m11.nash.push.5}}–{{n:m11.push.5}}"
  because: "con un stack más corto arriesgas menos en relación con las ciegas que te llevas cuando el rival se {{t:fold|retira}}, y el rival tiene que {{t:call|igualar}} más amplio"
  level: gto
  source: "solver push/fold del proyecto (content/ranges/pushfold.json; heads-up, sin ante, equilibrio de Nash del juego all-in o retirada, validado con 10bb en el documento 10; con 5bb, intervalo a partir de un equilibrio calculado de forma independiente, docs/tresci/e1b-solver.md, D-153); comparación: web de formación, Push/Fold Play: Nash Ranges (https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/), 10bb: «56.6%» de push"
  sources: [{ kind: training, url: "https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/" }, { kind: solver-app }]
- id: R-M11-003
  module: m11
  if: "en el {{t:pot|bote}} hay ante"
  then: "haces {{t:shove|push}} all-in con más manos que sin ante: con {{n:m11.depth.10}} y un {{t:bb-ante|ante de ciega grande}} de {{n:m11.ante}}, aprox. {{n:m11.nash.push.10-ante}}–{{n:m11.push.10-ante}} en lugar de {{n:m11.push.10}}"
  because: "el ante agranda el {{t:pot|bote}} que te llevas cuando el rival se {{t:fold|retira}}, y el riesgo del all-in sigue siendo el mismo"
  level: gto
  source: "solver push/fold del proyecto (pushfold.json, variante 10bb-ante: heads-up, big blind ante 1bb); validación: docs/tresci/e1b-solver.md (D-153), cálculo en el mismo modelo (equilibrio fictitious play 71,05%, límite inferior del intervalo en then); dirección coherente con la literatura: web de formación, Push Fold Charts (https://pokercoaching.com/push-fold-charts/): «When antes are in play, your preflop shoving range should be wider»"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: solver-app }]
- id: R-M11-004
  module: m11
  if: "vas all-in el primero"
  then: "ganas de dos formas: el rival se {{t:fold|retira}} y te llevas el {{t:pot|bote}}, o {{t:call|iguala}} y ganas en el showdown; aun así, una mano sin opciones necesitaría {{t:fold|retiradas}} en más de {{n:m11.push.10.alpha}} de los casos (con {{n:m11.depth.10}} sin ante)"
  because: "arriesgas {{n:m11.push.10.risk}} para ganar {{n:m11.push.10.win}} en ciegas; por eso cuentan tanto la fold equity como la equity de la mano cuando el rival {{t:call|iguala}}"
  level: math
  source: "cálculo: alpha = riesgo ÷ (bote + riesgo) (M6); fold equity: glosario de una web de un solver comercial (https://gtowizard.com/en/glossary/): «Fold equity The amount of value a player will win by making another player fold.»"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M11-005
  module: m11
  if: "la M (stack ÷ coste de una vuelta: ciegas y antes) baja a aprox. {{n:m11.m.red}} o menos"
  then: "ya solo vas all-in o te {{t:fold|retiras}}, e intentas entrar el primero en el {{t:pot|bote}}"
  because: "sin jugar, el stack dura unas pocas vueltas, y una subida normal regala demasiadas {{t:chips|fichas}}"
  level: heuristic
  source: "Harrington (a través de resúmenes): Wikipedia, M-ratio (https://en.wikipedia.org/wiki/M-ratio): «The M-ratio is calculated by the formula» (fórmula como fracción: stack ÷ (ciega pequeña + ciega grande + total de antes)), en la tabla de zonas «Your only move is to move all-in or fold»; web de formación, Dan Harrington M-Factor (https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/): «Red zone: 1 < = M < = 5», «your only and best option in this phase is to be the first to push in the pot»; un único límite en aprox. 5 (D-147)"
  sources: [{ kind: reference, url: "https://en.wikipedia.org/wiki/M-ratio" }, { kind: training, url: "https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/" }]
- id: R-M11-006
  module: m11
  if: "desde la {{t:big-blind|ciega grande}} {{t:call|igualas}} el all-in de la {{t:small-blind|ciega pequeña}} con un stack S (sin ante)"
  then: "necesitas una equity de (S − {{n:pf.blind.bb}}) ÷ 2S: con {{n:m11.depth.10}}, {{n:m11.call.10.eq}}; con {{n:m11.depth.5}}, {{n:m11.call.5.eq}}; con {{n:m11.depth.15}}, {{n:m11.call.15.eq}}"
  because: "tu ciega ya está en el {{t:pot|bote}}, así que pones S − {{n:pf.blind.bb}}, y el {{t:pot|bote}} tras {{t:call|igualar}} es 2S"
  level: math
  source: "cálculo: equity necesaria = lo que pones ÷ bote tras igualar (M2)"
  sources: [{ kind: math }]
- id: R-M11-007
  module: m11
  if: "el rival ha ido all-in y tú decides si {{t:call|igualar}}"
  then: "{{t:call|igualas}} con un {{t:range|rango}} más estrecho que el que usarías para hacer {{t:shove|push}} all-in: con {{n:m11.depth.10}}, la {{t:big-blind|BB}} {{t:call|iguala}} con aprox. {{n:m11.call.10}} de las manos, y la {{t:small-blind|SB}} hace {{t:shove|push}} con aprox. {{n:m11.push.10}}"
  because: "quien iguala solo gana en el showdown, y contra un {{t:range|rango}} que ya es más fuerte que uno aleatorio; quien hace {{t:shove|push}} también gana cuando el rival se {{t:fold|retira}}"
  level: gto
  source: "solver push/fold del proyecto (pushfold.json); web de formación, Push Fold Charts (https://pokercoaching.com/push-fold-charts/): «Calling ranges are tighter than shoving ranges»; web de formación, The Gap Concept (https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/): «you need a better hand to call a raise with than you would need to open a pot with a raise» (Sklansky)"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: training, url: "https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/" }, { kind: solver-app }]
- id: R-M11-008
  module: m11
  if: "quieres convertir los stacks del torneo en dinero ({{t:icm|ICM}})"
  then: "probabilidad del 1.er puesto = tu stack ÷ todas las {{t:chips|fichas}}; la del 2.º puesto la calculas igual entre los jugadores que quedan, para cada posible ganador; equity = suma de probabilidades × {{t:payout|premios}}"
  because: "este modelo supone jugadores de igual habilidad, así que el orden lo deciden solo los stacks"
  level: math
  source: "web de un solver comercial, ICM Basics (https://blog.gtowizard.com/icm-basics/): «The Independent Chip Model assumes all players are equally skilled, and therefore the probability of winning is purely a function of stack sizes», sección Limitations of ICM: «ICM doesn’t consider players’ positions.», «ICM ignores blinds increasing.» (consultado el 2026-11-09), «divide their chips by the total amount of chips in play», «Assume one of the other players wins, remove their chips from play, and divide our chips by the remaining chips in play»; cálculo con stacks de ejemplo (informe E1 M9–M11)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: math }]
- id: R-M11-009
  module: m11
  if: "en un {{t:tournament|torneo}} con {{t:icm|ICM}} {{t:call|igualas}} un all-in que puede eliminarte"
  then: "necesitas una equity de BF ÷ (BF + 1), donde el bubble factor BF = equity perdida si pierdes ÷ ganancia si ganas; en el ejemplo de la lección, {{n:m11.bf.req}} en lugar de los {{n:m11.bf.req-chips}} en {{t:chips|fichas}}"
  because: "en un {{t:tournament|torneo}} con {{t:payout|premios}}, perder cuesta más dinero del que añade ganar, así que al {{t:call|igualar}} tienes que ganar más a menudo que jugando por {{t:chips|fichas}}"
  level: math
  source: "cálculo ICM (numbers.yaml, claves m11.bf.*); web de un solver comercial, What Is the Bubble Factor (https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/): «$EV lost when you lose / $EV gained when you win = Bubble Factor», «Required Equity = Bubble Factor / (Bubble Factor + 1)»"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/" }, { kind: math }]
- id: R-M11-010
  module: m11
  if: "es la {{t:bubble|burbuja}} o la {{t:final-table|mesa final}} y tienes un stack medio"
  then: "{{t:call|igualas}} all-ins claramente más cerrado que jugando por {{t:chips|fichas}}, y un stack grande que te {{t:cover|cubre}} puede hacer {{t:shove|push}} más amplio"
  because: "{{t:risk-premium|prima de riesgo}}: las {{t:chips|fichas}} ganadas valen menos que las perdidas, y el stack grande arriesga además menos que tú"
  level: heuristic
  source: "web de un solver comercial, ICM Basics (https://blog.gtowizard.com/icm-basics/): «chips won are worth less than chips lost» (texto sin marcas de color), «Big stacks can threaten smaller stacks as they take on less risk when stacking off»; web de formación, ICM at Final Tables (https://upswingpoker.com/icm-final-tables/): «When it comes to calling versus shoves, you have to tighten up dramatically when big money is on the line»; web de formación, Big Stack Advantage (https://upswingpoker.com/big-stack-advantage-stone-bubble/): «Risk premiums are the additional equity needed to play for stacks. This means responding ranges tighten up considerably»; Ganzfried y Sandholm, AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf), tabla 2: la ciega grande tras dos all-ins iguala en el torneo «0.021», y en una mano aislada «0.197»"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: training, url: "https://upswingpoker.com/icm-final-tables/" }, { kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }]
- id: R-M11-011
  module: m11
  if: "juegas push/fold y detrás de ti quedan más jugadores que pueden {{t:call|igualar}}"
  then: "haces {{t:shove|push}} all-in más cerrado: con tres jugadores y {{n:m11.depth.3max}}, el Button con aprox. {{n:m11.3max.push.btn}} de las manos, y la {{t:small-blind|ciega pequeña}}, tras retirarse el Button, con aprox. {{n:m11.3max.push.sb}}"
  because: "cada jugador adicional es una posibilidad más de que alguien se despierte con una mano fuerte, así que es menos frecuente que todos se {{t:fold|retiren}}"
  level: gto
  source: "solver push/fold del proyecto (content/ranges/pushfold.json, tres jugadores); coherente con Ganzfried y Sandholm, AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf), tabla 2, single hand: «Button jam … 0.355», «SB jam after fold … 0.633» (las frecuencias de los nodos coinciden con un margen de 1,2 pp, informe M11)"
  sources: [{ kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }, { kind: solver-app }]
- id: R-M11-012
  module: m11
  if: "{{t:call|igualas}} un all-in y detrás de ti aún queda un jugador o alguien ya ha {{t:call|igualado}}"
  then: "{{t:call|igualas}} más cerrado: con tres jugadores y {{n:m11.depth.3max}}, la {{t:small-blind|ciega pequeña}} {{t:call|iguala}} el all-in del Button con aprox. {{n:m11.3max.call.sb}} de las manos, la {{t:big-blind|ciega grande}} (cuando la {{t:small-blind|SB}} se ha {{t:fold|retirado}}) con aprox. {{n:m11.3max.call.bb}}, y cuando ya hay dos jugadores all-in, solo con aprox. {{n:m11.3max.call.bb-two}}, aunque el precio baja a {{n:m11.3max.bb-two.eq}}"
  because: "el jugador que queda detrás de ti puede tener una mano fuerte y entrar, y contra dos {{t:range|rangos}} la equity de tu mano baja rápido; los precios de la {{t:small-blind|SB}} y de la {{t:big-blind|BB}} se diferencian poco, así que la diferencia viene sobre todo del jugador que queda detrás de ti"
  level: gto
  source: "solver push/fold del proyecto (pushfold.json, tres jugadores); coherente con Ganzfried y Sandholm, AAMAS 2008, tabla 2, single hand: «SB jam after jam … 0.234», «BB jam after jam/fold … 0.308», «BB jam after jam/jam … 0.197»"
  sources: [{ kind: solver-app }, { kind: study }]

- id: R-M11-013
  module: m11
  if: "todos los jugadores del {{t:pot|bote}} están all-in antes del flop"
  then: "ya no hay más {{t:bet|apuestas}}: la mano se decide al repartir las {{t:community-cards}}, y si nadie tiene {{t:pair|pareja}} o algo mejor, gana la carta más alta"
  because: "sin más {{t:bet|apuestas}} nadie puede {{t:fold|retirarse}}, así que solo cuenta el ranking de manos; con solo cartas altas decide la más alta"
  level: rules
  source: "reglas de Texas Hold'em: reglamento aprobado por el regulador de California (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf), High Card"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }]
# M13: analiza własnej gry (dokument 14, sekcja 8; decyzje D-M13-12…15 w dokumencie „12 Weryfikacja źródeł — M10–M13”).
# „Decyzja, nie wynik” uczy R-M12-004 (jedna reguła na jedno pojęcie); mechanika powtórek z gry to opis aplikacji,
# więc jest w tekście lekcji, a nie w księdze reguł.
- id: R-M13-001
  module: m13
  if: "has perdido un all-in teniendo más {{t:equity|equity}} que el rival"
  then: "no cambias de estrategia por esta mano: con una {{t:equity|equity}} e pierdes de media 1 − e de esas manos, p. ej. con {{n:m13.eq.example}}, aprox. {{n:m13.lose.example}}, es decir, {{n:m13.lose.of-ten}} de cada {{n:m13.ten}}"
  because: "la {{t:equity|equity}} es la proporción de victorias en muchas repeticiones de la misma situación; la derrota entra dentro de ese cálculo"
  level: math
  source: "cálculo: P(derrota) = 1 − equity (con bote dividido, proporcionalmente menos)"
  sources: [{ kind: math }]
- id: R-M13-002
  module: m13
  if: "el solver juega tu mano en un spot concreto de dos formas ({{t:mixed-hand|mano mixta}})"
  then: "cualquiera de esas jugadas es correcta; el informe marca la menos frecuente como aceptable cuando el solver la juega en al menos {{n:range.mixed.min}}, pero en menos de {{n:range.mixed.low}} de los casos"
  because: "en equilibrio, un jugador solo mezcla jugadas con el mismo {{t:expected-value|valor esperado}}"
  level: gto
  source: "web de un solver comercial, Principles of GTO (https://blog.gtowizard.com/principles-of-gto/): «Unexploitable play mixes between two or more options only when these options have the same EV.»; umbral de jugada rara: web de un solver comercial, Measure Performance (https://help.gtowizard.com/measure-performance/): «Inaccuracy – Moves that are taken less than 3.5% of the time in GTO, but don’t lose significant EV.» (ADR-26)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/principles-of-gto/" }]
- id: R-M13-003
  module: m13
  if: "cambias los palos de todas las cartas con una única permutación (p. ej. corazones por picas y picas por corazones)"
  then: "la decisión correcta no cambia"
  because: "la fuerza de las manos y de los {{t:draw|proyectos}} depende de si los palos coinciden, no de qué palos son; por eso el repaso de tus partidas muestra la misma situación con otros palos"
  level: math
  source: "cálculo: el ranking de jugadas no distingue palos (reglas de Texas Hold'em), y una permutación de palos conserva qué cartas comparten palo; comprobado en poker-core con un test de propiedades (documento 02, documento 14, 5.6)"
  sources: [{ kind: math }]
- id: R-M13-004
  module: m13
  if: "tras una sola {{t:session|sesión}} quieres valorar tus frecuencias (p. ej. con qué frecuencia entras en la mano o te {{t:fold|retiras}} ante un 3-bet)"
  then: "no sacas conclusiones: cuentas ocasiones, no manos; miras la estadística a partir de aprox. {{n:hud.opps.look}} ocasiones, y ganas seguridad con aprox. {{n:hud.opps.sure}}"
  because: "incluso el {{t:vpip|VPIP}} solo se puede leer tras aprox. {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}} manos (como en el M10), y una situación rara se da pocas veces en una {{t:session|sesión}}"
  level: heuristic
  source: "entrenador con blog de formación, Poker HUD Stats: The Sample Size You Need (https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html): «For me personally I usually want at least 5 to even bother looking, and 10 to be sure.»; muestras de manos como en R-M10-003 (web de formación, web de formación)"
  sources: [{ kind: training, url: "https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html" }, { kind: training }, { kind: training }]
- id: R-M13-005
  module: m13
  if: "durante la partida no sabes qué hacer, o una mano te ha parecido extraña"
  then: "solo la marcas, y la analizas después de la {{t:session|sesión}}, unas horas o días más tarde, con la cabeza despejada"
  because: "el análisis justo después de una gran pérdida o con cansancio está teñido de emociones"
  level: heuristic
  source: "blog de una app de análisis de manos, How to Review Your Poker Hands (https://blog.checkreplay.com/poker-hand-review/): «Mark hands that felt interesting, confusing, or off. Don’t analyze them yet.»; «The best time to review is hours or days after the session, with a clear head.»; «What doesn’t work is reviewing while you’re still steaming or while you’re tired.»"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }]
- id: R-M13-006
  module: m13
  if: "has perdido un {{t:pot|bote}} grande o en una mano no sabías qué hacer"
  then: "revisas esa mano; no dedicas mucho tiempo a un cooler (dos manos fuertes, ninguna de las cuales podía {{t:fold|retirarse}} razonablemente) ni a un bad beat"
  because: "los coolers y los bad beats le pasan a todo el mundo, y las manos con una decisión difícil están entre las que vale la pena revisar"
  level: heuristic
  source: "blog de una app de análisis de manos, How to Review Your Poker Hands (https://blog.checkreplay.com/poker-hand-review/): «Big pots, especially the ones you lost.»; «Hands where you weren’t sure what to do.»; entrenador con blog de formación, How to Effectively Conduct Poker Hand Reviews (https://www.blackrain79.com/2014/02/how-to-effectively-conduct-poker.html): «Coolers and bad beats happen to everybody. Learn how to differentiate them from the hands that matter and don't spend much time on them»"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }, { kind: training, url: "https://www.blackrain79.com/2014/02/how-to-effectively-conduct-poker.html" }]
- id: R-M13-007
  module: m13
  if: "revisas una decisión difícil"
  then: "primero anotas tu primera reacción (p. ej. «aquí es fácil {{t:call|igualar}}») y solo después haces los cálculos"
  because: "la diferencia entre tu primera reacción y el cálculo muestra dónde te engaña la intuición, y con el tiempo la mejora"
  level: heuristic
  source: "web de formación, 6 Steps to Analyze a Poker Hand (https://upswingpoker.com/analyze-poker-hand-techniques/): «Step 4: Take note of your gut reaction»; «be sure to take notes regarding the differences between your initial presumption––which is typically optimistic, in my experience––and the realistic result. This will help you improve your intuitive strategy over time.»"
  sources: [{ kind: training, url: "https://upswingpoker.com/analyze-poker-hand-techniques/" }]
- id: R-M13-008
  module: m13
  if: "no sabes cómo juega el rival y revisas una decisión frente a su {{t:bet|apuesta}}"
  then: "la valoras con una suposición optimista, una pesimista y una realista sobre su {{t:range|rango}}; si la decisión es buena incluso con la pesimista, no necesitas seguir calculando"
  because: "las suposiciones extremas marcan el intervalo en el que está la realidad, así que una decisión buena con ambas resiste un error de lectura"
  level: heuristic
  source: "web de formación, 6 Steps to Analyze a Poker Hand (https://upswingpoker.com/analyze-poker-hand-techniques/): «The Optimist The Pessimist The Realist»; «I pick the extremes first, because they shape the polar ends of the spectrum.»; «When the Pessimist gets such a favorable result, I don’t bother analyzing the hand through the Realist’s eyes, because it will also be favorable.»"
  sources: [{ kind: training, url: "https://upswingpoker.com/analyze-poker-hand-techniques/" }]
