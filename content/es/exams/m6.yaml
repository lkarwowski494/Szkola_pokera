# Pula pytań egzaminacyjnych modułu M6 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m6.*).
module: m6
drills:
  - kind: numeric
    id: m6.exam.q1
    family: m6.mdf
    rules: [R-M6-001, R-M6-005]
    prompt: "River. En el {{t:pot|bote}} hay {{n:exam.m6.pot}} y el rival {{t:bet|apuesta}} {{n:exam.m6.bet.three-quarters}}. ¿Cuánto es la {{t:mdf}}, es decir, qué parte mínima de tu {{t:range|rango}} defiendes? Escribe el número en porcentaje."
    answer: exam.m6.mdf.three-quarters
    explanation: "{{t:mdf}} = {{t:pot}} ÷ ({{t:pot}} + apuesta) = {{n:exam.m6.pot}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}}) = {{n:exam.m6.mdf.three-quarters}}. Si te {{t:fold|retiras}} más a menudo, un {{t:bluff|farol}} sin opciones gana automáticamente."
  - kind: choice
    id: m6.exam.q2
    family: m6.alpha
    rules: [R-M6-002]
    prompt: "River. En el {{t:pot|bote}} hay {{n:exam.m6.pot}}. {{t:bluff|Faroleas}} con una mano sin opciones apostando {{n:exam.m6.bet.quarter}}. ¿Con qué frecuencia debe {{t:fold|retirarse}} el rival para que este {{t:bluff|farol}} quede a cero?"
    options:
      - { text: "En más del {{n:exam.m6.alpha.quarter}} de los casos", correct: true, why: "Sí: alpha = apuesta ÷ ({{t:pot}} + apuesta) = {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}}) = {{n:exam.m6.alpha.quarter}}. Un {{t:bluff|farol}} pequeño arriesga poco, así que le bastan pocas {{t:fold|retiradas}}." }
      - { text: "En más del {{n:exam.m6.mdf.quarter}} de los casos", why: "Esa es la {{t:mdf}}: la parte del {{t:range|rango}} que el rival debería defender. Alpha es lo que falta hasta el total: {{n:exam.m6.alpha.quarter}}." }
      - { text: "En más del {{n:eq.bet-quarter}} de los casos", why: "Esa es la equity que el rival necesita para {{t:call|igualar}}; en el denominador también está su {{t:call|pago}}. El umbral para el {{t:bluff|farol}} es apuesta ÷ ({{t:pot}} + apuesta) = {{n:exam.m6.alpha.quarter}}." }
  - kind: choice
    id: m6.exam.q3
    family: m6.mdf-concept
    rules: [R-M6-003]
    prompt: "Defiendes la {{t:big-blind}} contra una {{t:open|apertura}} del Botón. El Botón {{t:bet|apuesta}} en el flop un c-bet de 1/4 del {{t:pot|bote}}. Un amigo se {{t:fold|retira}} aquí con más de la mitad de sus manos, porque «la {{t:mdf}} solo es un punto de referencia». ¿Qué falla?"
    table: { position: BB }
    options:
      - { text: "En el flop puedes defender algo menos que la {{t:mdf}}, pero contra c-bets pequeños no te {{t:fold|retiras}} en masa", correct: true, why: "Sí: contra un c-bet de 1/4 del {{t:pot|bote}}, la {{t:mdf}} es {{n:exam.m6.mdf.quarter}}. En el flop {{t:out-of-position}} puedes defender algo menos, porque los {{t:bluff|faroles}} del Botón aún tienen equity, pero {{t:fold|retirarte}} con más de la mitad de las manos le regala el {{t:pot|bote}}." }
      - { text: "Nada: en el flop la {{t:mdf}} no se aplica en absoluto", why: "En el flop la {{t:mdf}} es un punto de referencia: puedes defender algo menos, no todo lo menos que quieras. Contra un c-bet pequeño tienes de todos modos muchas manos con suficiente equity." }
      - { text: "En el flop hay que defender más que la {{t:mdf}}", why: "Al revés: en el flop {{t:out-of-position}} puedes defender algo menos, porque no realizarás toda la equity de las manos débiles. El error de tu amigo es que se {{t:fold|retira}} muchísimo más de la cuenta." }
  - kind: choice
    id: m6.exam.q4
    family: m6.exploit
    rules: [R-M6-004]
    prompt: "Microlímites. Un {{t:recreational|jugador recreativo}} pasivo que rara vez {{t:bluff|farolea}} {{t:bet|apuesta}} 3/4 del {{t:pot|bote}} en el river. Tienes una {{t:pair|pareja}} de damas y en la {{t:board|mesa}} hay un as y un rey. ¿Qué haces?"
    table: { hand: "Qd Qc", board: "Ah Jd 7c 4s Ks" }
    options:
      - { text: "{{t:fold|Me retiro}}", correct: true, why: "Sí: tu {{t:pair|pareja}} es más baja que el as y el rey de la {{t:board|mesa}}, así que gana sobre todo a {{t:bluff|faroles}}. Este jugador rara vez {{t:bluff|farolea}}, así que contra él te {{t:fold|retiras}} más a menudo de lo que indica la {{t:mdf}}." }
      - { text: "{{t:call|Igualo}}, porque la {{t:mdf}} manda defender aprox. {{n:exam.m6.mdf.three-quarters}}", why: "La {{t:mdf}} supone que el rival {{t:bluff|farolea}} con suficiente frecuencia. Este jugador no lo hace, así que al {{t:call|igualar}} pagas sobre todo a manos mejores." }
      - { text: "{{t:raise|Subo}}", why: "Tras la {{t:raise|subida}}, las manos peores se {{t:fold|retirarán}} y pagarán las mejores. Una {{t:pair|pareja}} más baja que dos cartas de la {{t:board|mesa}} no es una mano para {{t:raise|subir}}." }
  - kind: choice
    id: m6.exam.q5
    family: m6.flop.price
    rules: [R-M6-005]
    prompt: "Estás en la {{t:big-blind|ciega grande}} y es el flop. Antes de la {{t:bet|apuesta}}, en el {{t:pot|bote}} hay {{n:exam.m6.pot}} {{t:chips|fichas}}. El Botón {{t:bet|apuesta}} {{n:exam.m6.bet.quarter}} en una mano y {{n:exam.m6.bet.three-quarters}} en otra. ¿Qué probabilidad mínima de ganar el {{t:pot|bote}} ({{t:equity|equity}}) necesitas para {{t:call|igualar}} en cada una de esas manos?"
    table: { position: BB }
    options:
      - { text: "Aprox. {{n:eq.bet-quarter}} y {{n:eq.bet-three-quarters}}", correct: true, why: "Sí: apuesta ÷ ({{t:pot}} + 2·apuesta). {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}} + {{n:exam.m6.bet.quarter}}) = {{n:eq.bet-quarter}}, y {{n:exam.m6.bet.three-quarters}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}} + {{n:exam.m6.bet.three-quarters}}) = {{n:eq.bet-three-quarters}}. Contra una apuesta mayor defiendes con un {{t:range|rango}} más estrecho." }
      - { text: "Aprox. {{n:exam.m6.alpha.quarter}} y {{n:eq.bet-three-quarters}}", why: "El primer número es alpha (apuesta ÷ ({{t:pot}} + apuesta)), es decir, el umbral para el {{t:bluff|farol}} del Botón. Para el precio del {{t:call|pago}}, suma también tu {{t:call|pago}}: {{n:eq.bet-quarter}}." }
      - { text: "Lo mismo en ambos, porque es el mismo {{t:pot|bote}}", why: "No: el precio depende del tamaño de la apuesta. Una apuesta mayor es un precio peor: {{n:eq.bet-three-quarters}} en lugar de {{n:eq.bet-quarter}}." }
  - kind: choice
    id: m6.exam.q6
    family: m6.flop.call
    rules: [R-M6-006]
    prompt: "Defiendes la {{t:big-blind}} contra una {{t:open|apertura}} del Botón. En el flop {{t:check|pasas}} y el Botón {{t:bet|apuesta}} un c-bet de 1/3 del {{t:pot|bote}}. Tienes as como carta más alta, sin {{t:draw|proyecto}}. ¿Qué haces?"
    table: { hand: "Ac 6h", board: "Js 8d 3d", position: BB }
    options:
      - { text: "{{t:call|Igualo}}", correct: true, why: "Sí: contra un c-bet pequeño solo necesitas aprox. {{n:eq.bet-third}} de equity. El as como carta más alta gana a parte de los {{t:bluff|faroles}} del Botón y puede ligar una {{t:pair|pareja}}, así que normalmente lo defiendes. Te {{t:fold|retiras}} con las manos más débiles sin {{t:pair|pareja}} y sin {{t:draw|proyecto}}." }
      - { text: "{{t:fold|Me retiro}}", why: "Demasiado cerrado: contra un c-bet pequeño, el as como carta más alta normalmente se defiende. Te {{t:fold|retiras}} con manos más débiles sin {{t:pair|pareja}} y sin {{t:draw|proyecto}}." }
      - { text: "Check-raise", why: "El check-raise lo haces sobre todo con las manos más fuertes y con {{t:draw|proyectos}}. Esta mano no tiene ni valor ni un {{t:draw|proyecto}} que le dé una segunda forma de ganar." }
  - kind: choice
    id: m6.exam.q7
    family: m6.flop.fold
    rules: [R-M6-007]
    prompt: "Defiendes la {{t:big-blind}} contra una {{t:open|apertura}} del Botón. En el flop [[8c 4d 2h]] {{t:check|pasas}} y el Botón {{t:bet|apuesta}} un c-bet de 3/4 del {{t:pot|bote}}. ¿Con cuál de estas manos tiene más sentido {{t:call|igualar}}?"
    table: { board: "8c 4d 2h", position: BB }
    options:
      - { text: "[[Ad Jd]]", correct: true, why: "Sí: ambas manos son dos cartas altas sin {{t:pair|pareja}}, pero AJ de diamantes tiene además un {{t:flush-draw|proyecto de color}} (backdoor) al {{t:flush|color}} máximo: con un diamante en la {{t:board|mesa}}, aún necesita dos diamantes más. Contra un c-bet grande, {{t:call|igualas}} preferiblemente con una mano así." }
      - { text: "[[Ks Qs]]", why: "KQ de picas no tiene aquí ningún {{t:draw|proyecto}}: en la {{t:board|mesa}} no hay ninguna pica y la {{t:straight|escalera}} queda demasiado lejos. Con dos cartas altas sin {{t:draw|proyecto}}, contra un c-bet grande normalmente te {{t:fold|retiras}}." }
  - kind: choice
    id: m6.exam.q8
    family: m6.xr.semibluff
    rules: [R-M6-008]
    prompt: "Defiendes la {{t:big-blind}} contra una {{t:open|apertura}} del Botón. En el flop [[Jh 8c 4h]] {{t:check|pasas}} y el Botón {{t:bet|apuesta}} un c-bet de 1/3 del {{t:pot|bote}}. ¿Cuál de estas manos es mejor jugar con check-raise?"
    table: { board: "Jh 8c 4h", position: BB }
    options:
      - { text: "[[Qh Th]]", correct: true, why: "Sí: {{t:flush-draw|proyecto de color}} y gutshot (el nueve) es un {{t:draw|proyecto}} fuerte. El check-raise gana cuando el Botón se {{t:fold|retira}}, y si paga, aún tienes muchos outs." }
      - { text: "[[Jd 5d]]", why: "{{t:top-pair|Pareja mayor}} con kicker débil es una mano para {{t:call|igualar}}. Tras el check-raise, las manos peores normalmente se {{t:fold|retiran}} y las mejores pagan." }
      - { text: "[[As 3c]]", why: "El as como carta más alta sin {{t:draw|proyecto}} no tiene una segunda forma de ganar. El check-raise como {{t:bluff|farol}} lo haces sobre todo con {{t:draw|proyectos}}." }
  - kind: numeric
    id: m6.exam.q9
    family: m6.xr.size
    rules: [R-M6-010]
    prompt: "Flop. En el {{t:pot|bote}} hay {{n:exam.m6.pot}} y el Botón {{t:bet|apuesta}} un c-bet pequeño de {{n:exam.m6.bet.quarter}}. Haces check-raise a {{n:xr.mult.example}} el c-bet. ¿A cuánto {{t:raise|subes}}? Escribe el número de {{t:chips|fichas}}."
    table: { position: BB }
    answer: exam.m6.xr
    explanation: "{{n:exam.m6.bet.quarter}} × {{n:xr.mult.example}} = {{n:exam.m6.xr}}. Contra un c-bet pequeño {{t:raise|subes}} más cerca del límite superior del intervalo {{n:xr.mult.low}}–{{n:xr.mult.example}}: un check-raise mínimo le daría al Botón un precio muy bueno."
  - kind: choice
    id: m6.exam.q10
    family: m6.xr.when
    rules: [R-M6-009]
    prompt: "Defiendes la {{t:big-blind}} contra una {{t:open|apertura}} del Botón. ¿En qué flop haces check-raise con más frecuencia?"
    table: { position: BB }
    options:
      - { text: "[[8d 6c 5h]]", correct: true, why: "Sí: en un flop bajo y {{t:connected|conectado}}, la {{t:big-blind}} tiene más de las jugadas más fuertes ({{t:two-pair|dobles parejas}}, {{t:straight|escaleras}}) que el Botón, así que aquí hace check-raise más a menudo." }
      - { text: "[[Ks Qd Jh]]", why: "Un flop alto con cartas cercanas entre sí conecta bien con el {{t:range|rango}} del Botón (AK, AQ, KQ, {{t:pair|parejas}} altas). Aquí haces check-raise con menos frecuencia." }
      - { text: "[[Ah Ad Qc]]", why: "En un flop con {{t:pair|pareja}} de ases, las manos más fuertes las tiene más a menudo el Botón, que {{t:open|abría}} con muchos ases. Aquí rara vez haces check-raise." }
