# Pula egzaminacyjna M4 (gra wobec akcji preflop): reguły lekcji m4.l1–m4.l4, inne pozycje, ręce i rozmiary.
# Bez pytań o podział 3-bet/sprawdzenie w spotach BB vs SB i BTN vs CO (tam uczymy tylko gram/pas, ADR-26).
module: m4
drills:
  - kind: choice
    id: m4.exam.q1
    family: m4.3bet.size
    rules: [R-M4-002, R-M4-003]
    prompt: "El {{t:cutoff|CO}} {{t:open|abrió}} a {{n:pf.open-size}} y el Button {{t:fold|se retiró}}. Estás en la {{t:small-blind|ciega pequeña}} y quieres hacer 3-bet. ¿A cuánto?"
    table: { hand: "Ad Kd", position: SB }
    options:
      - { text: "A {{n:pf.3bet.oop-total}}", correct: true, why: "Después del flop hablarás primero, así que {{t:raise|subes}} a alrededor de {{n:pf.3bet.size-oop}} la {{t:open|apertura}}. Un tamaño mayor le impide al {{t:cutoff|CO}} {{t:call|igualar}} barato {{t:in-position}}." }
      - { text: "A {{n:pf.3bet.ip-total}}", sizeError: true, why: "Buena acción, pero ese es el tamaño para un jugador {{t:in-position}} ({{n:pf.3bet.size-ip}} la {{t:open|apertura}}). Desde la {{t:small-blind|ciega pequeña}} {{t:raise|subes}} a {{n:pf.3bet.oop-total}}." }
      - { text: "Solo {{t:call|pago}}", why: "Desde la {{t:small-blind|ciega pequeña}} contra el {{t:cutoff|CO}} casi nunca {{t:call|igualas}}: jugarías {{t:out-of-position}}, y la {{t:big-blind}} detrás de ti todavía puede {{t:raise|subir}}." }
  - kind: choice
    id: m4.exam.q2
    family: m4.sb.vs-open
    rules: [R-M4-003]
    prompt: "El Button {{t:open|abrió}} a {{n:pf.open-size}}. Estás en la {{t:small-blind|ciega pequeña}}. ¿Qué haces?"
    table: { hand: "8c 8d", position: SB }
    options:
      - { text: "3-bet", correct: true, why: "Contra el Button desde la {{t:small-blind|ciega pequeña}} haces 3-bet con la parte alta de tu {{t:range|rango}}, alrededor del {{n:pf.3bet-freq.sb-vs-btn}} de las manos, y las {{t:pair|parejas}} de 77 en adelante forman parte de ella." }
      - { text: "{{t:call|Igualo}}", why: "Desde la {{t:small-blind|ciega pequeña}} contra el Button casi nunca {{t:call|igualas}}: jugarías {{t:out-of-position}} con la {{t:big-blind|ciega grande}} a tu espalda. El 3-bet te da la {{t:initiative|iniciativa}} y la opción de ganar al momento." }
      - { text: "{{t:fold|Me retiro}}", why: "Demasiado cerrado: el 88 está en la parte alta del {{t:range|rango}} con el que haces 3-bet contra la amplia {{t:open|apertura}} del Button." }
  - kind: choice
    id: m4.exam.q3
    family: m4.3bet.shape
    rules: [R-M4-006]
    prompt: "Estás en la {{t:big-blind|ciega grande}}, el Button {{t:open|abrió}} y la {{t:small-blind}} {{t:fold|se retiró}}. ¿Cuál de estas manos es un 3-bet típico {{t:value|por valor}}?"
    table: { position: BB }
    options:
      - { text: "JJ", correct: true, why: "Desde la {{t:big-blind|ciega grande}} haces 3-bet con tus manos más fuertes (TT+, AQ+, AJs+). JJ quiere un {{t:pot|bote}} grande." }
      - { text: "A9 de distinto palo", why: "Los ases de distinto palo (AJo–A9o) en la {{t:big-blind|ciega grande}} normalmente solo los {{t:call|igualas}}: entras barato y cierras la acción." }
      - { text: "66", why: "Las {{t:pair|parejas}} medianas y pequeñas en la {{t:big-blind|ciega grande}} normalmente las {{t:call|igualas}}. Ganan dinero después del flop, y un 3-bet con ellas aguanta mal un 4-bet." }
  - kind: choice
    id: m4.exam.q4
    family: m4.bb.price
    rules: [R-M4-004]
    prompt: "El {{t:cutoff|CO}} {{t:open|abrió}} a {{n:pf.open-size}}; el Button y la {{t:small-blind}} {{t:fold|se retiraron}}. ¿Cuánta equity necesitas en la {{t:big-blind|ciega grande}} para {{t:call|igualar}} (sin contar el juego después del flop)?"
    table: { position: BB }
    options:
      - { text: "Aprox. {{n:eq.bb-vs-btn-open}}", correct: true, why: "El precio depende de las cantidades, no de quién {{t:open|abrió}}. Pones {{n:bb.call.vs-btn}} en un {{t:pot|bote}} que, tras el {{t:call|pago}}, tiene {{n:bb.pot-after.vs-btn}}, igual que contra el Button." }
      - { text: "Aprox. la mitad", why: "Necesitarías la mitad si en el {{t:pot|bote}} solo estuviera la {{t:bet|apuesta}} del rival. Las ciegas del {{t:pot|bote}} mejoran el precio." }
      - { text: "Aprox. {{n:eq.bb-vs-sb-open}}", why: "Ese es el precio contra una {{t:open|apertura}} de la {{t:small-blind|ciega pequeña}} a {{n:pf.open-size-sb}}. Aquí la {{t:open|apertura}} es menor." }
  - kind: choice
    id: m4.exam.q5
    family: m4.bb.3bet-size
    rules: [R-M4-014]
    prompt: "La {{t:small-blind|ciega pequeña}} {{t:open|abrió}} a {{n:pf.open-size-sb}}. Tienes AA en la {{t:big-blind|ciega grande}} y haces 3-bet. ¿A cuánto?"
    table: { hand: "Ah Ad", position: BB }
    options:
      - { text: "A {{n:exam.m4.bb-vs-sb.3bet}}", correct: true, why: "Contra la {{t:small-blind|ciega pequeña}} tienes {{t:position|posición}} después del flop, así que el 3-bet es de alrededor de {{n:pf.3bet.size-ip}} la {{t:open|apertura}}, y con una {{t:open|apertura}} a {{n:pf.open-size-sb}} eso son {{n:exam.m4.bb-vs-sb.3bet}}." }
      - { text: "A {{n:exam.m4.bb-vs-sb.3bet-oop-size}}", sizeError: true, why: "Buena acción, pero {{n:pf.3bet.size-oop}} la {{t:open|apertura}} es el tamaño para jugar {{t:out-of-position}}. Contra la {{t:small-blind|ciega pequeña}}, la {{t:big-blind}} tiene {{t:position|posición}}, así que {{t:raise|sube}} menos." }
      - { text: "A {{n:pf.3bet.ip-total}}", sizeError: true, why: "Buena acción, pero {{n:pf.3bet.ip-total}} es un 3-bet contra una {{t:open|apertura}} a {{n:pf.open-size}}. La {{t:small-blind|ciega pequeña}} {{t:open|abrió}} a {{n:pf.open-size-sb}}, así que {{n:pf.3bet.size-ip}} la {{t:open|apertura}} son {{n:exam.m4.bb-vs-sb.3bet}}." }
  - kind: choice
    id: m4.exam.q6
    family: m4.vs3bet.math
    rules: [R-M4-007]
    prompt: "Recibes un 3-bet de un jugador que tendrá {{t:position|posición}} después del flop. ¿Con qué parte de tus {{t:open|aperturas}} sueles {{t:fold|retirarte}}?"
    options:
      - { text: "Aprox. {{n:pf.vs3bet.fold.low}}–{{n:pf.vs3bet.fold.high}}", correct: true, why: "Más o menos con esa frecuencia se {{t:fold|retiran}} las soluciones de los solvers y las tablas; el límite superior queda justo por debajo del umbral de {{n:alpha.vs-3bet-ip-size}}: si te retiraras más a menudo, el 3-bet del rival ganaría con cualquier mano." }
      - { text: "Casi todas salvo AA y KK", why: "Entonces el rival gana haciendo 3-bet con dos cartas cualesquiera, porque te {{t:fold|retiras}} mucho más a menudo que {{n:alpha.vs-3bet-ip-size}}." }
      - { text: "Menos de una cuarta parte", why: "Te {{t:fold|retiras}} demasiado poco: pagarías 3-bets con manos que pierden contra el {{t:range|rango}} del rival y juegan mal después del flop." }
  - kind: choice
    id: m4.exam.q7
    family: m4.vs3bet.oop
    rules: [R-M4-008]
    prompt: "{{t:open|Abriste}} desde el {{t:hijack|HJ}} a {{n:pf.open-size}}, el Button {{t:raise|subió}} a {{n:pf.3bet.ip-total}} y el resto {{t:fold|se retiró}}. ¿Qué haces?"
    table: { hand: "Ah Tc", position: HJ }
    options:
      - { text: "{{t:fold|Me retiro}}", correct: true, why: "AT de distinto palo {{t:out-of-position}} a menudo está dominado por AJ, AQ y AK, y después del flop {{t:equity-realization|realiza mal su equity}}. Contra un 3-bet, con manos así te {{t:fold|retiras}}." }
      - { text: "{{t:call|Igualo}}", why: "El as tienta, pero {{t:out-of-position}} {{t:call|igualas}} con manos del mismo palo y {{t:pair|parejas}}. ATo liga demasiado a menudo un as con peor kicker." }
      - { text: "Hago 4-bet {{t:value|por valor}}", why: "Para un 4-bet {{t:value|por valor}} sueles jugar AA, KK y AK. ATo pierde contra la mayoría de las manos que lo {{t:call|igualarán}}." }
  - kind: choice
    id: m4.exam.q8
    family: m4.vs3bet.ip
    rules: [R-M4-009]
    prompt: "{{t:open|Abriste}} desde el Button a {{n:pf.open-size}}, la {{t:small-blind}} {{t:raise|subió}} a {{n:pf.3bet.oop-total}} y la {{t:big-blind}} {{t:fold|se retiró}}. ¿Qué haces?"
    table: { hand: "9s 9h", position: BTN }
    options:
      - { text: "{{t:call|Igualo}}", correct: true, why: "{{t:in-position|En posición}} {{t:call|igualas}} más amplio, entre otras con {{t:pair|parejas}} de 66 a TT. 99 juega bien después del flop y {{t:equity-realization|realiza su equity}} con facilidad." }
      - { text: "{{t:fold|Me retiro}}", why: "Demasiado cerrado: te {{t:fold|retiras}} con las {{t:pair|parejas}} más bajas, y 99 está en el {{t:range|rango}} de {{t:call|pago}} {{t:in-position}}." }
      - { text: "Hago 4-bet {{t:value|por valor}}", why: "Para un 4-bet {{t:value|por valor}} sueles jugar AA, KK y AK. 99 prefiere ver el flop." }
  - kind: choice
    id: m4.exam.q9
    family: m4.vs3bet.value
    rules: [R-M4-010, R-M4-011]
    prompt: "{{t:open|Abriste}} desde el {{t:hijack|HJ}} a {{n:pf.open-size}}, el {{t:cutoff|CO}} {{t:raise|subió}} a {{n:pf.3bet.ip-total}} y el resto {{t:fold|se retiró}}. ¿Qué haces?"
    table: { hand: "As Ac", position: HJ }
    options:
      - { text: "4-bet a unos {{n:pf.4bet.oop-example.low}}–{{n:exam.m4.4bet.oop.high}}", correct: true, why: "Con AA haces 4-bet {{t:value|por valor}}. {{t:out-of-position|Fuera de posición}} el 4-bet es de alrededor de {{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}} el 3-bet: {{n:pf.3bet.ip-total}} × {{n:pf.4bet.size-oop.low}} ≈ {{n:pf.4bet.oop-example.low}}, × {{n:pf.4bet.size-oop.high}} ≈ {{n:exam.m4.4bet.oop.high}}." }
      - { text: "{{t:call|Igualo}}", why: "AA quiere meter todo el stack. {{t:call|Igualar}} {{t:out-of-position}} regala {{t:value|valor}} y la {{t:initiative|iniciativa}}." }
      - { text: "All-in por {{n:format.stack}}", why: "El all-in echa a las manos más débiles con las que el rival pagaría un 4-bet normal. Tras un 4-bet de alrededor de {{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}} el 3-bet, meterás el resto del stack fácilmente de todos modos." }
  - kind: numeric
    id: m4.exam.n1
    family: m4.iso.size
    rules: [R-M4-012]
    prompt: "Dos jugadores hacen limp y el Button {{t:fold|se retira}}. Estás en la {{t:small-blind|ciega pequeña}} y quieres {{t:isolation|aislar}}. ¿A cuántas bb {{t:raise|subes}}? Escribe un número."
    table: { hand: "Qs Qc", position: SB }
    answer: exam.m4.iso.two-oop
    explanation: "Base de {{n:pf.iso.base}}, más {{n:pf.iso.per-limper}} por cada uno de los dos limpers, más {{n:pf.iso.oop-extra}} porque después del flop hablas primero: en total, {{n:exam.m4.iso.two-oop}}."
  - kind: choice
    id: m4.exam.q10
    family: m4.iso.many
    rules: [R-M4-013, R-M4-012]
    prompt: "Tres jugadores antes que tú se limitaron a igualar la {{t:big-blind}}. Estás en el {{t:cutoff|CO}}. ¿Qué haces?"
    table: { hand: "Ad Kh", position: CO }
    options:
      - { text: "{{t:raise|Subo}} a {{n:exam.m4.iso.three}}", correct: true, why: "Contra muchos limpers {{t:raise|subes}} sobre todo {{t:value|por valor}}, y AK es justo ese tipo de mano. Tamaño: {{n:pf.iso.base}} más {{n:pf.iso.per-limper}} por cada uno de los tres limpers." }
      - { text: "{{t:raise|Subo}} a {{n:pf.iso.one-limper}}", sizeError: true, why: "Buena acción, pero ese es el tamaño contra un solo limper. Cada limper adicional suma {{n:pf.iso.per-limper}}, así que aquí son {{n:exam.m4.iso.three}}." }
      - { text: "Hago limp detrás", why: "Hacer limp detrás encaja con manos especulativas. AK quiere hacer crecer el {{t:pot|bote}} y reducir el número de rivales." }
