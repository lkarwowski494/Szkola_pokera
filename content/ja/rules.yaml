# Reguły odruchowe „Jeśli X, to Y, bo Z”. Poziom: rules (zasady gry), math, gto, heuristic, exploit.
# Kryteria poziomów (S-05, audyt 4.10):
#   math      – twierdzenie, które samo jest rachunkiem (outy, szanse, cena sprawdzenia, znak EV, dominacja jednej akcji nad drugą);
#   heuristic – zalecenie wyprowadzone z rachunku albo z literatury, bez wyniku solvera;
#   gto       – opublikowany wynik solvera albo rozwiązania równowagi;
#   exploit   – dostosowanie do typu gracza; musi podać populację;
#   rules     – zasady gry i definicje.
# Reguła eksploatacyjna musi podać populację źródłową (walidacja w content-build).
# Pole source: pełny opis źródeł z adresami i cytatami najwyżej 2 zdania, bez nazw serwisów i marek (decyzja właściciela
# z 9.10.2026); zostaje w repozytorium. Pole sources: jedno niezależne źródło (organizacja albo autor) = jedna pozycja
# { kind, url? }; kind: math, rules, solver-pub, solver-app, book, study, reference, training, population (SourceKind
# w content-schema). Aplikacja pokazuje tylko rodzaj i liczbę źródeł, np. „serwisy szkoleniowe (3)”; jedno źródło inne
# niż rachunek dostaje dopisek „jedno źródło”.
# Pole check (tryb gry M13, dokument 14, 4.4.3 i 6.2 A): warunek sprawdzalny automatycznie w silniku oceny
# (packages/poker-core/src/grading.ts). kind = rodzaj sprawdzenia, players/stackBb = konfiguracje stołu, których
# dotyczy źródło reguły (5.5; brak = każda, reguły rachunkowe), streets, spots (spoty solvera), drill (przypadki
# c-betu), params (liczby jako n:klucz). Reguły-zakazy (free-check-fold, no-limp) oceniają tylko naruszenie.

- id: R-M0-001
  module: m0
  if: "2人のプレイヤーの役が異なる場合"
  then: "カードの高さに関係なく、ランキングが上の役が勝ちます"
  because: "役のランキングはカードの高さより優先されるからです。{{t:flush}}は常に{{t:straight|ストレート}}に勝ち、{{t:full-house}}は常に{{t:flush}}に勝ちます"
  level: rules
  source: "テキサスホールデムのルール：カリフォルニア州のギャンブル規制当局が承認したカジノのルール (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf)、Card Values and Hand Rankings：「The ranking of hands for Texas Hold'em, in order from highest to lowest rank, shall be」；規制当局 (RAG/551) が承認したパースのカジノのポーカールール (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf)、10.1；補足：List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (ドキュメント12 M0–M3)"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-002
  module: m0
  if: "両プレイヤーの役の核が同じ場合：同じ{{t:pair|ペア}}、同じ{{t:three-of-a-kind|スリーカード}}、または同じ{{t:two-pair}}"
  then: "キッカーで決まります。高いものから順に比べますが、比べるのはベスト5枚に入るものだけです。5枚がまったく同じなら{{t:split-pot|スプリットポット}}になります"
  because: "まず役の種類、次に役の高さを比べ、キッカーを比べるのは核が同じときだけだからです。数えるのは7枚のうちベスト5枚だけです"
  level: rules
  source: "テキサスホールデムのルール：規制当局 (RAG/551) が承認したパースのカジノのポーカールール (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf)、10.3–10.4：「all cards count, for example, Q:Q:7:7:9 shall lose to Q:Q:7:7:10」；Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm)、セクション3と5；補足として比較の順序：List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (ドキュメント12 M0–M3)"
  sources: [{ kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-003
  module: m0
  if: "両プレイヤーのベスト5枚がすべて{{t:board|ボード}}にある場合"
  then: "{{t:split-pot|スプリットポット}}になります"
  because: "2人とも同じ5枚でプレイするからです（「{{t:playing-the-board}}」）"
  level: rules
  source: "テキサスホールデムのルール：Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm)、セクション5 (「play the board」)；カリフォルニア州のギャンブル規制当局が承認したカジノのルール (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf)：「the pot shall be split equally among all players with the winning hand」；補足：Texas hold 'em (https://en.wikipedia.org/wiki/Texas_hold_%27em) (ドキュメント12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/Texas_hold_%27em" }]

- id: R-M1-001
  module: m1
  if: "このラウンドで、あなたより前に誰も{{t:bet|ベット}}していない場合"
  then: "{{t:check|チェック}}か{{t:bet|ベット}}ができます"
  because: "{{t:call|コール}}や{{t:raise|レイズ}}ができるのは、すでにある{{t:bet}}に対してだけだからです"
  level: rules
  source: "テキサスホールデムのルール：Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm)、セクション3 (「fold, check, bet, call, or raise」) (ドキュメント12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }]
- id: R-M1-002
  module: m1
  if: "無料で{{t:check|チェック}}できる場合"
  then: "決して{{t:fold|フォールド}}しません"
  because: "{{t:fold}}は何の得もなく{{t:pot|ポット}}を手放すことになり、{{t:check}}にはコストがかからないからです"
  level: math
  check: { kind: free-check-fold }
  source: "計算：チェックはコスト0でポットを獲得するチャンスを残すので、フォールドより悪くなることはない"
  sources: [{ kind: math }]
- id: R-M1-003
  module: m1
  if: "誰かが{{t:bet|ベット}}していて、あなたは続けたくない場合"
  then: "{{t:fold|フォールド}}します"
  because: "失うのはすでに入れた分だけだからです。理由のない{{t:call}}はすべて余計な損失になります"
  level: math
  source: "計算：フォールドすればそれ以上払わずに参加を終えるので、損失はすでに入れた分だけ；続ける気のないハンドでコールすると、コール額の分だけ損失が増える"
  sources: [{ kind: math }]
- id: R-M1-004
  module: m1
  if: "ハンドが次の{{t:betting-round|ベッティングラウンド}}に進む場合"
  then: "フロップは{{t:community-cards}}3枚、ターンとリバーは1枚ずつです。リバーのベッティングの後、残ったプレイヤー（2人以上）がカードを公開します（ショーダウン）"
  because: "テキサスホールデムのルールでは{{t:betting-round|ベッティングラウンド}}は4回あり、リバーが最後だからです"
  level: rules
  source: "テキサスホールデムのルール：Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm)、セクション5 (「Three boardcards are turned simultaneously … The next two boardcards are turned one at a time」)；Wikipedia、Texas hold 'em (ドキュメント12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules }]

- id: R-M2-001
  module: m2
  if: "フロップで{{t:flush|フラッシュ}}に向かうカードが{{n:draw.flush.seen}}枚ある場合"
  then: "アウツは{{n:outs.flush}}枚です。ターンで{{t:flush}}になる確率は約{{n:odds.flush.flop-turn}}で、リバーまでの約{{n:odds.flush.flop-river}}が当てはまるのは、それ以上の{{t:bet|ベット}}なしで2枚とも見られる場合（オールイン）だけです"
  because: "1つのスートは{{n:cards.per-suit}}枚で、そのうち{{n:draw.flush.seen}}枚が見えているからです。フロップで{{t:bet|ベット}}に{{t:call}}しても、買えるのは1枚だけです"
  level: math
  source: "正確な計算"
  sources: [{ kind: math }]
- id: R-M2-002
  module: m2
  if: "アウツを数えた場合"
  then: "当たる確率は、カード1枚ならアウツ×2、2枚ならアウツ×4で見積もります。フロップで{{t:bet|ベット}}を受けたら1枚分（×2）で数え、×4を使うのは、それ以上の{{t:bet|ベット}}なしでターンとリバーを見られる場合（オールイン）だけです"
  because: "リバーの分は、相手が別に払わせることができるからです。2と4のルールの誤差は、アウツ{{n:rule24.outs.max}}枚までで最大約{{n:rule24.error.max.pp}}パーセントポイントです"
  level: math
  source: "トレーニングサイト、Poker drawing odds & outs explained (https://upswingpoker.com/poker-drawing-odds-outs-explained/)：「For anything 10 outs or less, however, its accurate within 2% for the turn and river calculation」；計算：最大誤差は10アウツで1.7pp (ドキュメント12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/poker-drawing-odds-outs-explained/" }, { kind: math }]
- id: R-M2-003
  module: m2
  if: "相手が{{t:pot|ポット}}の半分をベットした場合"
  then: "{{t:call|コール}}するには{{n:eq.bet-half}}のエクイティが必要です"
  because: "あなたが払うのは1単位で、あなたの{{t:call|コール}}後の{{t:pot}}は4単位（{{t:pot}}2、ベット1、あなたの{{t:call}}1）なので、4単位のうち1単位が必要だからです"
  level: math
  source: "計算：ベット/(ポット+2·ベット)"
  sources: [{ kind: math }]
- id: R-M2-004
  module: m2
  if: "相手が{{t:pot|ポット}}全額をベットした場合"
  then: "{{t:call|コール}}するには{{n:eq.bet-pot}}のエクイティが必要です"
  because: "あなたが払うのは1単位で、あなたの{{t:call|コール}}後の{{t:pot}}は3単位（{{t:pot}}1、ベット1、あなたの{{t:call}}1）なので、3単位のうち1単位が必要だからです"
  level: math
  source: "計算：ベット/(ポット+2·ベット)"
  sources: [{ kind: math }]
- id: R-M2-005
  module: m2
  if: "あなたのエクイティが必要エクイティより小さい場合（{{t:draw|ドロー}}なら、この値段で見られるカードで当たる確率）"
  then: "{{t:fold|フォールド}}します（インプライドオッズなどの追加の根拠がない場合）"
  because: "そうした{{t:call}}はどれも長期的にお金を失うからです"
  level: math
  check: { kind: draw-price, streets: [flop] }
  source: "計算：EV = エクイティ × (あなたのコール後のポット) − コール額；エクイティ < コール額 ÷ あなたのコール後のポット のとき負になる"
  sources: [{ kind: math }]

- id: R-M3-001
  module: m3
  if: "ボタンにいて、前のプレイヤー全員が{{t:fold|フォールド}}した場合"
  then: "ブラインドより前のすべての{{t:position|ポジション}}の中で最も広く{{t:open|オープン}}します。同じくらい広く{{t:open|オープン}}するのは{{t:small-blind}}だけです"
  because: "フロップ以降は最後にアクションでき、後ろに残っているのはブラインドだけだからです"
  level: gto
  source: "ソルバーチャートのサイト、6-max 100bb NL500 (https://beyondgto.com/ranges/btn-open-6max-100bb, https://beyondgto.com/ranges/sb-open-6max-100bb)：BTN 42%、SB 44%；トレーニングサイト、Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/)：SBはボタンよりやや広く40–50%；プリフロップチャートのサイト、6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts)：BTN 40–45%、SB 39–47% (ドキュメント12、D2)"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-002
  module: m3
  if: "{{t:utg}}にいて、あなたまで全員が{{t:fold|フォールド}}した場合"
  then: "約{{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}}のハンドを{{t:open|オープン}}します"
  because: "後ろにまだ5人いるので、誰かがより強いハンドを持っていることが多いからです"
  level: gto
  check: { kind: solver-spot, players: [6], stackBb: [100], spots: [rfi.utg] }
  source: "商用ソルバーのサイト、Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/)：UTG 17.6%；ソルバーチャートのサイト (NL500, https://beyondgto.com/ranges/lj-open-6max-100bb, …/hj-…, …/co-…, …/btn-open-6max-100bb)：UTG 17%、HJ 22%、CO 28%、BTN 42%；プリフロップチャートのサイト、6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts)：15–17 / 19–22 / 25–28 / 40–45% (ドキュメント12 M0–M3、D6)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/lj-open-6max-100bb" }]
- id: R-M3-003
  module: m3
  if: "ボタンにいて、あなたまで全員が{{t:fold|フォールド}}した場合"
  then: "約{{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}}のハンドを{{t:open|オープン}}します"
  because: "残っているのはブラインドだけで、フロップ後は{{t:position|ポジション}}を持てるからです"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.btn, nine.rfi.btn] }
  source: "ソルバーチャートのサイト、BTN open 6-max 100bb (https://beyondgto.com/ranges/btn-open-6max-100bb, NL500)：約42%；プリフロップチャートのサイト、6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts)：40–45% (ドキュメント12 M0–M3、D6)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-004
  module: m3
  if: "最初にハンドに参加する場合"
  then: "{{t:raise|レイズ}}するか{{t:fold|フォールド}}し、ブラインド額だけを入れること（リンプ）はしません。{{t:small-blind|スモールブラインド}}からはこれは単純化で、一部のソルバー解では一部のハンドをリンプします"
  because: "{{t:raise}}はすぐにブラインドを獲得でき、{{t:initiative|イニシアチブ}}も得られますが、リンプはその両方を手放すからです"
  level: heuristic
  check: { kind: no-limp, players: [6, 9], stackBb: [100] }
  source: "トレーニングサイト、Why limping is bad (https://upswingpoker.com/why-limping-in-poker-is-bad/)：「If you make everyone fold preflop, you win 100% of the pot … You can't ever do that in a pot you've limped into」；ソルバーチャートのサイト、open 6-max 100bb (https://beyondgto.com/ranges/lj-open-6max-100bb, HJ、CO、BTNも同様)：「raising rather than limping or jamming at this depth」、SB (https://beyondgto.com/ranges/sb-open-6max-100bb)：「At 100bb the whole range plays as raise-or-fold」。スモールブラインド：第2段階での矛盾、ソルバーチャートのあるトレーニングサイト (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics)：「completes (limps) 20.5%」；SBからのレイズ・オア・フォールドは明示した単純化、アプリのソルバーツリーにはリンプがないため (D-144；ドキュメント12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/why-limping-in-poker-is-bad/" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]
- id: R-M3-005
  module: m3
  if: "同じランクのカードで、同じスートのものと異なるスートのものを選べる場合"
  then: "同じスートのハンド（スーテッド）のほうが強いです"
  because: "{{t:flush}}で勝つ道が1つ増えるからです"
  level: math
  source: "エクイティ計算"
  sources: [{ kind: math }]
- id: R-M3-006
  module: m3
  if: "{{t:hijack|HJ}}か{{t:cutoff|CO}}にいて、あなたまで全員が{{t:fold|フォールド}}した場合"
  then: "{{t:utg}}より広く、ボタンより狭く{{t:open|オープン}}します。{{t:cutoff|CO}}からは{{t:hijack|HJ}}より広くします"
  because: "後ろに残るプレイヤーが少ないほど、誰かがより強いハンドを持っていることは少なくなり、フロップ後に{{t:position|ポジション}}を持てることが多くなるからです"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.hj, rfi.co, nine.rfi.hj, nine.rfi.co] }
  source: "商用ソルバーのサイト、Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/)：UTG 17.6%；ソルバーチャートのサイト (NL500, https://beyondgto.com/ranges/hj-open-6max-100bb, https://beyondgto.com/ranges/co-open-6max-100bb)：UTG 17%、HJ 22%、CO 28%、BTN 42%；プリフロップチャートのサイト、6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts)：15–17 / 19–22 / 25–28 / 40–45% (ドキュメント12 M0–M3、D6)：オープンレンジはUTGからボタンに向かって広がる"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/hj-open-6max-100bb" }]
- id: R-M3-007
  module: m3
  if: "最初に{{t:raise|レイズ}}でハンドに参加する場合"
  then: "どの{{t:position|ポジション}}からも{{n:pf.open-size}}に{{t:raise|レイズ}}し、{{t:small-blind|スモールブラインド}}からは{{n:pf.open-size-sb}}にします（単純化）"
  because: "どの{{t:position|ポジション}}からも同じサイズなら簡単で、ハンドの強さも明かさないからです。{{t:small-blind|スモールブラインド}}からは{{t:out-of-position}}でプレイするので、少し多めに{{t:raise|レイズ}}します"
  level: heuristic
  check: { kind: open-size, players: [6, 9], stackBb: [100], params: { open: "n:pf.open-size", openSb: "n:pf.open-size-sb" } }
  source: "プリフロップチャートのサイト、6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts)：「the standard open size is 2.5bb from all positions … 3bb from the small blind」；商用ソルバーのサイト、Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/)：UTG 2bb、CO 2.3bb、BTN 2.5bb、SB 3bb (単純化、ドキュメント12、D8)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }]
- id: R-M3-008
  module: m3
  if: "最強グループのハンド（AA、KK、QQ、AK）を持っていて、前の誰かが{{t:raise|レイズ}}した場合"
  then: "ふつうは{{t:call|コール}}だけで済ませず、{{t:value|バリュー}}目的でもう一度{{t:raise|レイズ}}（3ベット）します"
  because: "これらのハンドは相手が{{t:open|オープン}}するほとんどのハンドに対して優位で、3ベットは{{t:pot|ポット}}を大きくし、相手の人数を減らすからです"
  level: heuristic
  source: "3ベットチャートのサイト、3-bet ranges (https://pokerpro.tools/preflop/3-bet-ranges)：どのポジションに対してもQQ+とAKはバリュー部分 (「Mostly 3-bet」)；プリフロップチャートのサイト、UTG strategy (https://www.preflopwizard.app/blog/poker-utg-strategy)：AA–JJとAKs (ドキュメント12、D9)"
  sources: [{ kind: training, url: "https://pokerpro.tools/preflop/3-bet-ranges" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-utg-strategy" }]
- id: R-M3-009
  module: m3
  if: "{{t:small-blind|スモールブラインド}}にいて、あなたまで全員が{{t:fold|フォールド}}した場合"
  then: "約{{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}}のハンドで広く{{t:open|オープン}}し、{{n:pf.open-size-sb}}への{{t:raise|レイズ}}か{{t:fold|フォールド}}にします（単純化：一部のソルバー解では{{t:small-blind|スモールブラインド}}から一部のハンドをリンプします）"
  because: "相手は{{t:big-blind|ビッグブラインド}}だけだからです。フロップ後は先にアクションするので、ボタンとほぼ同じくらいの広さで{{t:open|オープン}}し、それよりずっと広くはしません"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.sb, nine.rfi.sb] }
  source: "ソルバーチャートのサイト、SB open 6-max 100bb NL500 (https://beyondgto.com/ranges/sb-open-6max-100bb)：約44%、レイズ・オア・フォールド；トレーニングサイト、Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/)：40–50%；プリフロップチャートのサイト (https://www.preflopwizard.app/blog/6-max-preflop-charts)：39–47%；40–45%の範囲はリンプなしの戦略の共通部分 (ドキュメント12、D3)。レイズ・オア・フォールドの単純化 (D-144)：ソルバーチャートのあるトレーニングサイト (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics)：「The small blind raises (3bb) 33.1% : completes (limps) 20.5%」"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]

- id: R-M3-010
  module: m3
  if: "9人テーブルでプレイしていて、前の全員が{{t:fold|フォールド}}した場合"
  then: "{{t:utg}}、{{t:utg|UTG}}+1、{{t:utg|UTG}}+2からは、6人テーブルの{{t:utg}}より狭く{{t:open|オープン}}します。LJ以降は6人テーブルと同じようにプレイします（LJは{{t:utg}}と同じ）"
  because: "6人テーブルより後ろに座るプレイヤーが多いので、誰かがより強いハンドを持っていることが多いからです。前のプレイヤーが{{t:fold|フォールド}}すると、LJの後ろには6人テーブルの{{t:utg}}の後ろと同じ人数が残ります"
  level: heuristic
  check: { kind: solver-spot, players: [9], stackBb: [100], spots: [nine.rfi.utg, nine.rfi.utg1, nine.rfi.utg2, nine.rfi.lj] }
  source: "プロジェクトのプリフロップソルバー、9人テーブル100bb (ADR-20；ドキュメント10、「N9a最終測定」：N1–N4の部分的な検証、NashConv 0.0094bb；UTG–UTG+2の構成は未検証で、頻度は第2段階の検証がない (D-153) ため、このルールは方向だけを示し、ソルバーの数値は示さない；レベルheuristic、D-144)。第4段階の9-maxチャートの共通範囲と一致：UTG約9–13%、UTG+1約11–14% (プリフロップチャートのサイト、9-Max Preflop Chart、https://preflopwizard.app/blog/9-max-preflop-chart; 2つ目のプリフロップチャートのサイト、https://about-poker.com/preflop-gto/preflop-range-chart-cash-game; ドキュメント10、「9-max 100bbの構成」)。UTG–UTG+2がフォールドした後のプレイは6-maxのプレイとまったく同じ (ツリーのテスト)"
  sources: [{ kind: training, url: "https://preflopwizard.app/blog/9-max-preflop-chart" }, { kind: training, url: "https://about-poker.com/preflop-gto/preflop-range-chart-cash-game" }, { kind: solver-app }]
# M4: gra wobec akcji preflop. Reguły „heuristic” pochodzą z literatury, nie z solvera aplikacji (dokument 11).
- id: R-M4-001
  module: m4
  if: "誰かが{{t:open|オープン}}し、あなたが{{t:in-position}}で{{t:raise|レイズ}}（3ベット）したい場合"
  then: "{{t:open|オープン}}額の約{{n:pf.3bet.size-ip}}に{{t:raise|レイズ}}します。{{n:pf.open-size}}の{{t:open|オープン}}なら{{n:pf.3bet.ip-total}}です"
  because: "このサイズならフロップでのスタックと{{t:pot|ポット}}の比率がよくなり、相手に安い値段を与えないからです"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-ip", position: ip } }
  source: "トレーニングサイト、The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide)；アプリのソルバーツリー"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-002
  module: m4
  if: "{{t:out-of-position}}で{{t:open}}に{{t:raise|レイズ}}（3ベット）する場合。たとえばブラインドから、{{t:cutoff|CO}}やボタンの{{t:open|オープン}}に対して"
  then: "{{t:open|オープン}}額の約{{n:pf.3bet.size-oop}}に{{t:raise|レイズ}}します。{{n:pf.open-size}}の{{t:open|オープン}}なら{{n:pf.3bet.oop-total}}です"
  because: "フロップ後はあなたが先にアクションするので、大きめの{{t:raise|レイズ}}で、相手が{{t:in-position}}で安く{{t:call}}できないようにするからです"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-oop", position: oop } }
  source: "トレーニングサイト、The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide)；アプリのソルバーツリー"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-003
  module: m4
  if: "{{t:small-blind|スモールブラインド}}にいて、{{t:cutoff|CO}}かボタンが{{t:open|オープン}}した場合"
  then: "{{t:call|コール}}はほとんどせず、3ベットか{{t:fold|フォールド}}にします（{{t:cutoff|CO}}に対しては単純化：公開された解はボタンに対するスポットを計算しています）。ボタンに対しては{{t:range|レンジ}}の上位を3ベットし（約{{n:pf.3bet-freq.sb-vs-btn}}のハンド。77+（55と66も頻繁に）、AJo+、KQo、A5s、A4s、T9sなど）、残りは{{t:fold|フォールド}}します"
  because: "{{t:small-blind|スモールブラインド}}から{{t:call|コール}}すると{{t:out-of-position}}でプレイすることになり、後ろの{{t:big-blind}}がまだ{{t:raise|レイズ}}できるからです。3ベットは{{t:initiative|イニシアチブ}}と、すぐに{{t:pot|ポット}}を獲得するチャンスをくれます"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.sb-vs-btn, nine.vs-open.sb-vs-btn] }
  source: "ソルバーチャートのサイト、SB vs BTN (https://beyondgto.com/defense/sb-vs-btn)、NL500、100bb：「GTO defends the Small Blind with about 18% of hands - roughly 5% as a flat call and 13% as a 3-bet」、55の3ベット57%、66は62%；商用ソルバーのサイト、Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/)、NL500、SB vs BTN：「the SB barely calls anything. Instead, they almost exclusively 3-bet or fold」、スモールブラインド全般への一般化：「As a simplification, don’t cold-call from the SB: Play a 3-bet or fold strategy.」；トレーニングサイト、3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/)：「3-bet-or-fold strategies from every position except the Big Blind」 (ドキュメント10、決定B-045：R-M4-015の内容をR-M4-003に統合；グラフィックの14%という数値は読み取ったテキストに置き換え、E1)"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/sb-vs-btn" }, { kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-004
  module: m4
  if: "{{t:big-blind|ビッグブラインド}}にいて、ボタンが{{n:pf.open-size}}に{{t:open|オープン}}し、{{t:small-blind}}が{{t:fold|フォールド}}した場合"
  then: "広くディフェンスします。{{t:call|コール}}に必要なエクイティは約{{n:eq.bb-vs-btn-open}}だけだからです"
  because: "大きな{{t:pot|ポット}}に少し足すだけだからです。公開されたソルバー解は、ここで約{{n:pf.bb-def.vs-btn.pub.low}}–{{n:pf.bb-def.vs-btn.pub.high}}のハンドをディフェンスします"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-btn, nine.vs-open.bb-vs-btn] }
  source: "値段の計算；ソルバーチャートのサイト、BB vs BTN (https://beyondgto.com/defense/bb-vs-btn)、NL500：「GTO defends the Big Blind with about 45% of hands」；ソルバー結果を公開しているスクール (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide)、NL200：「3-bets 11.5% to 11bb and calls 29.0%」；プロジェクトのプリフロップソルバー (ADR-20) はグリッドとプレイ/フォールドの評価にのみ使用、その合計ディフェンス率は未検証 (D-153)"
  sources: [{ kind: math }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-app }]
- id: R-M4-005
  module: m4
  if: "{{t:position|ポジション}}がある状態で、{{t:cutoff|CO}}の{{t:open}}に{{t:raise|レイズ}}する場合"
  then: "主に上位の最強ハンドを3ベットし、スーテッドのエース（A5s、A4s）で{{t:bluff|ブラフ}}を少し加えます。中くらいのハンド（77–99、AJs、ATs、スーテッドの{{t:connectors|コネクター}}など）はミックスでプレイし、一部を3ベット、一部を{{t:call|コール}}します。ボタンは{{t:cutoff|CO}}に対して、ふつう約{{n:pf.3bet-freq.btn-vs-co.low}}–{{n:pf.3bet-freq.btn-vs-co.high}}のハンドを3ベットし、約{{n:pf.call-freq.btn-vs-co.low}}–{{n:pf.call-freq.btn-vs-co.high}}を{{t:call|コール}}します"
  because: "相手はよく{{t:call|コール}}するので、{{t:call|コール}}された後の{{t:pot|ポット}}でうまくプレイできるハンドが欲しいからです"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.btn-vs-co, nine.vs-open.btn-vs-co] }
  source: "商用ソルバーのサイト、Playing Calls From the Button in Cash Games (https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/)、NL500、100bb：「Against a CO open, BTN will 3-bet ~12% of hands, while calling only 5%.」；ソルバーチャートのサイト、BTN vs CO (https://beyondgto.com/defense/btn-vs-co)、NL500、100bb：「roughly 9% as a flat call and 10% as a 3-bet」；ソルバー結果を公開しているスクール (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide)、NL200：「the solver 3-bets 12.5% of hands to 7.5bb and calls only 3.0%」、「55–22 most of the time」フォールド；範囲は第2段階の3つの情報源をカバーし、構成はそれらの共通部分：上位は3ベット、中位はミックス (D-144；以前の決定A2、ドキュメント10)。アプリのソルバーはこの分け方を再現しない (ほとんどコールしない) ため、グリッドとプレイモードの評価は「プレイ / フォールド」だけを確認する；トレーニングサイト、The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide)、BTN vs COの表：「QQ+, AKs, AKo, AQs (mixed), A5s, A4s…」；トレーニングサイト (https://gtogecko.com/blog/gto-preflop-strategy) はこのレンジをリニアと呼び、プリフロップチャートのサイトはポラライズと呼ぶ (ドキュメント12 M4–M6、D-02)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/" }, { kind: solver-pub, url: "https://beyondgto.com/defense/btn-vs-co" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://gtogecko.com/blog/gto-preflop-strategy" }, { kind: training }]
- id: R-M4-006
  module: m4
  if: "{{t:big-blind|ビッグブラインド}}から、ボタンの{{t:open}}に{{t:raise|レイズ}}する場合"
  then: "最強ハンド（TT+、AQ+、AJs+）に加えて、{{t:call|コール}}する{{t:range|レンジ}}の下の方から{{t:bluff|ブラフ}}を3ベットします：A5s、ときにA4s、スーテッドの{{t:connectors|コネクター}}。中くらいと小さい{{t:pair|ペア}}、KQo、オフスートのエース（AJo–A9o）はふつう{{t:call|コール}}します"
  because: "{{t:big-blind|ビッグブラインド}}からは安く{{t:call|コール}}でき、アクションも締めくくれるので、中くらいのハンドは{{t:call|コール}}したほうが多く稼げるからです。3ベットは大きな{{t:pot|ポット}}を望むハンドと、{{t:call|コール}}されてもうまくプレイできる{{t:bluff|ブラフ}}に回します（スーテッドのエースはAAとAKをブロックします）"
  level: gto
  source: "商用ソルバーのサイト、Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/)、NL500、BB vs BTN：「TT+, AJs+, and AQo+ are 3-bet purely」、ブラフは「near the bottom of our calling range」；ソルバーチャートのサイト、BB vs BTN (https://beyondgto.com/defense/bb-vs-btn)：「A5s · 3-bet 100%」。このルールはボタンのオープンにだけ当てはまる (D-144)：スモールブラインドに対しては第2段階の情報源の間でブラフについて意見が分かれる (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics: 「A5s calls 96% of the time rather than turning into a three-bet bluff」；https://beyondgto.com/defense/bb-vs-sb: 「A5s · 3-bet 4% · call 96%」；商用ソルバーのサイト、Range Morphology、https://blog.gtowizard.com/preflop-range-morphology/: レンジの最下部からのブラフ) ため、レッスンではスモールブラインドに対しては主にバリューで3ベットし、A5sとスーテッドコネクターはふつうコールするとだけ述べる；ソルバー結果を公開しているスクール、What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide) と Big blind defence (https://poker.academy/blog/post/big-blind-basics-explained-useful-tips-for-poker-players)、NL200 と NL50 GG；トレーニングサイト、Blind vs Blind Without a Solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics)、同サイトのチャート；トレーニングサイト、3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/)、同サイトのソルバーチャート。単純化：構成はレーキと3ベットのサイズによって変わる；99、KQo、AJoはミックスになることがある (ドキュメント10、決定B-045)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-007
  module: m4
  if: "フロップ後に{{t:position|ポジション}}を持つプレイヤーから3ベットを受けた場合"
  then: "{{t:open|オープン}}したハンドの約{{n:pf.vs3bet.fold.low}}–{{n:pf.vs3bet.fold.high}}を{{t:fold|フォールド}}し、約{{n:pf.vs3bet.call.low}}–{{n:pf.vs3bet.call.high}}を{{t:call|コール}}し、約{{n:pf.vs3bet.4bet.low}}–{{n:pf.vs3bet.4bet.high}}を4ベットします"
  because: "{{n:alpha.vs-3bet-ip-size}}より多くフォールドすると、相手はどんなハンドで3ベットしても利益を出せるので、このしきい値のすぐ下まで{{t:fold|フォールド}}するからです"
  level: heuristic
  source: "情報源に近い範囲で、フォールドの上限を計算によるしきい値のすぐ下に置いたもの (ADR-24)：ソルバー結果を公開しているスクール、What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide)、ソルバーNL200、ボタンの7.5bbへの3ベットに対するCO：フォールド63.7%、コール17.2%、4ベット19.1%；簡易トレーニングチャートのサイト、簡易トレーニングチャート (https://pailiku.com/charts/co-vs-btn-3bet)、COのオープンレンジに換算して約66/23/11；HUDでは約55%がフォールド；トレーニングサイト 50–55/30–40/5–8 (第4段階、ずれあり)；しきい値は計算による (ドキュメント12 M4–M6、D-04)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training }, { kind: math }]
- id: R-M4-008
  module: m4
  if: "3ベットを受け、フロップ後は{{t:out-of-position}}になる場合"
  then: "主にスーテッドのハイカード、強いスーテッドのエース、中くらいと高い{{t:pair|ペア}}、一部のスーテッドの{{t:connectors|コネクター}}で{{t:call|コール}}します。弱いオフスートのハンド（KJo、ATo、QTo）は{{t:fold|フォールド}}します"
  because: "オフスートのハンドはドミネートされていることが多く、{{t:out-of-position}}では{{t:equity-realization|エクイティ実現}}の効率が悪いからです"
  level: heuristic
  source: "トレーニングサイト、The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide)、CO vs BTNの3ベット：「Call QQ, JJ, TT, 99, 88, AQs, AJs, KQs, KJs, QJs, JTs, T9s, 77, 66 Fold Marginal offsuit broadways」；簡易トレーニングチャートのサイト (https://pailiku.com/charts/co-vs-btn-3bet)：「Call JJ-77, AQs-ATs, AKs, KQs-KJs, QJs, JTs, T9s, 98s, 87s, 76s, 65s」；トレーニングサイト、How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/)：「calling with fewer suited connectors, suited gappers and offsuit broadway hands」"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }]
- id: R-M4-009
  module: m4
  if: "3ベットを受け、フロップ後は{{t:position|ポジション}}を持つ場合"
  then: "より広く{{t:call|コール}}します：66からTTまでの{{t:pair|ペア}}、ハイカードを含むスーテッドのハンド、スーテッドの{{t:connectors|コネクター}}。最も低い{{t:pair|ペア}}は{{t:fold|フォールド}}します"
  because: "{{t:in-position}}ではエクイティを実現しやすく、当たったときに大きな{{t:pot|ポット}}を獲得しやすいからです"
  level: heuristic
  source: "トレーニングサイト、How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/)：最も低いペアは「even with position」フォールド；あるトレーニングサイトはポジションがあれば小さいペアのコールも認めている (ドキュメント12 M4–M6、D-05)"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training }]
- id: R-M4-010
  module: m4
  if: "AA、KK、AKで3ベットを受けた場合"
  then: "ふつうは4ベットします（{{t:value|バリュー}}目的）。AKは{{t:call|コール}}することもあります"
  because: "これらのハンドはスタック全部を入れたいハンドで、4ベットに{{t:call|コール}}してくるほとんどのハンドをドミネートしているからです"
  level: heuristic
  source: "トレーニングサイト、How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/)：AKは「should be 4-bet with 100% frequency」 (ボタン vs BB)；トレーニングサイト、The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide)：「4-bet value KK+, AKs (mixed), AKo (mixed)」；簡易トレーニングチャートのサイト (https://pailiku.com/charts/co-vs-btn-3bet)：「4-bet QQ+, AKo, A5s-A4s Call JJ-77, AQs-ATs, AKs」"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }]
- id: R-M4-011
  module: m4
  if: "4ベットする場合"
  then: "{{t:in-position}}では3ベット額の約{{n:pf.4bet.size-ip.low}}–{{n:pf.4bet.size-ip.high}}、{{t:out-of-position}}では{{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}}に{{t:raise|レイズ}}します"
  because: "その4ベットが{{t:call|コール}}されると、スタックには{{t:pot|ポット}}の約{{n:spr.4bet.high}}–{{n:spr.4bet.oop}}倍が残るからです（{{t:in-position}}の例：{{t:small-blind|スモールブラインド}}の{{n:pf.3bet.oop-total}}への3ベットにボタンが4ベット：約{{n:spr.4bet.high}}–{{n:spr.4bet}}；{{t:out-of-position}}の例：ボタンの{{n:pf.3bet.ip-total}}への3ベットに{{t:cutoff|CO}}が4ベット：約{{n:spr.4bet.oop}}）。そのため、良いハンドは残りを楽に入れられます"
  level: heuristic
  source: "ソルバー結果を公開しているスクール、What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide)、ソルバーNL200：ポジションのないCOは17.2bbに4ベット、つまり7.5bbへの3ベットの2.3倍；トレーニングサイト、The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide)：ポジションありで2.2–2.5倍、ポジションなしで2.5–3倍 (同サイトの例では2.4倍)；SPRは計算による (ドキュメント12 M4–M6、D-06)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: math }]
- id: R-M4-012
  module: m4
  if: "前の1人以上のプレイヤーが{{t:big-blind}}と同額を入れただけ（リンプ）の場合"
  then: "{{n:pf.iso.base}}に、リンパー1人につき{{n:pf.iso.per-limper}}を足した額に{{t:raise|レイズ}}し、{{t:out-of-position}}ではさらに{{n:pf.iso.oop-extra}}増やします"
  because: "それより小さい{{t:raise}}ではリンパーに良すぎる値段を与え、ハンドから降ろせないからです"
  level: heuristic
  check: { kind: iso-size, players: [6, 9], stackBb: [100], params: { base: "n:pf.iso.base", perLimper: "n:pf.iso.per-limper", oopExtra: "n:pf.iso.oop-extra" } }
  source: "トレーニングサイト、10 Tips for Crushing Limpers (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm)：「Raise to 3bb+1bb per limper when playing online, and 4bb+1bb per limper when playing live」；プリフロップチャートのサイト、ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy)：「Base open size (3bb) + 1 big blind per limper」、「Add 1bb more from OOP positions」。このサイズはオンラインのプレイに当てはまる"
  sources: [{ kind: training, url: "https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }]
- id: R-M4-013
  module: m4
  if: "前で複数のプレイヤーがリンプした場合"
  then: "より狭い{{t:range|レンジ}}で、主に{{t:value|バリュー}}目的で{{t:raise|レイズ}}します。投機的なハンド（小さい{{t:pair|ペア}}、スーテッドの{{t:connectors|コネクター}}）は、{{t:in-position}}なら同額を入れるだけでもかまいません"
  because: "リンパーが1人増えるごとに誰かが{{t:call|コール}}する可能性が上がるので、プリフロップの{{t:bluff}}は価値を失うからです"
  level: heuristic
  source: "プリフロップチャートのサイト、ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy)：「Against multiple limpers, tighten each range by roughly one tier」、オーバーリンプについて：「This is almost always wrong」；トレーニングサイト (https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm)：「limp behind with those suited connectors, small pairs」；トレーニングサイト (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm)：「over-limping, which can be fine」。第4段階での矛盾：どちらのプレイも正解 (ADR-04、D-144)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }, { kind: training, url: "https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm" }]
- id: R-M4-014
  module: m4
  if: "{{t:big-blind|ビッグブラインド}}にいて、{{t:small-blind}}が{{n:pf.open-size-sb}}に{{t:open|オープン}}した場合"
  then: "{{t:call|コール}}に必要なエクイティは約{{n:eq.bb-vs-sb-open}}ですが、ハンドの半分以上で広くディフェンスします。3ベットは{{t:open|オープン}}額の約{{n:pf.3bet.size-ip}}です"
  because: "フロップ後は{{t:position|ポジション}}があるので、より多くのエクイティを実現できるからです。公開されたソルバー解は、ここで約{{n:pf.bb-def.vs-sb.pub}}のハンドをディフェンスします"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-sb, nine.vs-open.bb-vs-sb] }
  source: "値段の計算；プロジェクトのプリフロップソルバー (ADR-20)；ソルバーツリー (9bbへの3ベット)；ソルバーチャートのサイト、BB vs SB (https://beyondgto.com/defense/bb-vs-sb)、NL500、100bb：「GTO defends the Big Blind with about 56% of hands」"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-sb" }, { kind: math }, { kind: solver-app }]

# M5: c-bet na flopie. Pula po otwarciu i jednym sprawdzeniu, 100bb. Definicje tekstur liczy poker-core (texture.ts),
# punkty i progi mokrości są w numbers.yaml (tex.*). Reguły strategiczne według rejestru decyzji D-01–D-21
# (dokument 12 M4–M6); bez częstotliwości w procentach.
- id: R-M5-001
  module: m5
  if: "フロップの{{t:wetness|ウェット度}}が{{n:tex.threshold.medium}}点未満の場合：複数の形で可能な{{t:straight}}（2ランクの組み合わせが少なくとも2組）は{{n:tex.points.straight.made}}点、1つの形でだけ可能な{{t:straight}}は{{n:tex.points.straight.made-one}}点、{{t:straight-draw}}だけなら{{n:tex.points.straight.draw}}点、同じスート2枚は{{n:tex.points.suits.two-tone}}点、同じスート3枚は{{n:tex.points.suits.monotone}}点"
  then: "{{t:dry}}なフロップです：{{t:draw|ドロー}}は少なく、完成した{{t:straight|ストレート}}や{{t:flush|フラッシュ}}を持つ人はまだいません"
  because: "次のカードでリーダーが入れ替わることはまれなので、フロップで最強のハンドはふつう最強のままだからです"
  level: rules
  source: "アプリのテクスチャ定義 (poker-core, texture.ts: WETNESS_POINTS, WETNESS_THRESHOLDS)；ドライなフロップの概念：トレーニングサイト、Sizing Your C-Bets；トレーニングサイト、What Is a Continuation Bet；ドライなフロップの例：トレーニングサイト (K72r, A94r)、トレーニングサイト (AA6r)；ドライ/中間の境界はアプリの取り決め"
  sources: [{ kind: training }, { kind: training }]
- id: R-M5-002
  module: m5
  if: "フロップの{{t:wetness|ウェット度}}が{{n:tex.threshold.wet}}点以上の場合（点数は{{t:dry|ドライ}}なフロップの定義と同じ）"
  then: "{{t:wet}}なフロップです：相手は{{t:draw|ドロー}}を持っていることが多く、すでに{{t:straight|ストレート}}や{{t:flush}}を持っていることもあります"
  because: "次のカードでリーダーがよく入れ替わるので、いま最強のハンドもあまり安全ではないからです"
  level: rules
  source: "アプリのテクスチャ定義 (poker-core, texture.ts: WETNESS_POINTS, WETNESS_THRESHOLDS)；ウェットなフロップの概念：トレーニングサイト、Sizing Your C-Bets；トレーニングサイト、What Is a Continuation Bet；ウェットなフロップの例：トレーニングサイト (987, QJT)、トレーニングサイト、Bet Sizing Strategy: 8 Rules (T954, https://upswingpoker.com/bet-size-strategy-tips-rules/)；中間/ウェットの境界はアプリの取り決め"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: training }]
- id: R-M5-003
  module: m5
  if: "プリフロップで{{t:open|オープン}}し、{{t:big-blind}}が{{t:call|コール}}して、フロップにエースかキングがある場合"
  then: "あなたには{{t:range-advantage|レンジアドバンテージ}}があります：平均すると、あなたのハンドは相手のハンドより強いです"
  because: "{{t:big-blind}}はAA、KK、AKのほとんどをプリフロップで{{t:raise|レイズ}}するので、{{t:call|コール}}しただけの場合はそれらが少なく、あなたはすべて持っているからです"
  level: heuristic
  source: "商用ソルバーのサイト、Range advantage (用語集)；商用ソルバーのサイト、The Turn Probe Bet (「BB lacks the stronger Ace-highs because they would have 3-bet with them preflop」)"
  sources: [{ kind: solver-pub }]
- id: R-M5-004
  module: m5
  if: "プリフロップで{{t:open|オープン}}し、フロップが低くて{{t:connected|コネクテッド}}または{{t:semi-connected|セミコネクテッド}}である場合（例：7-6-5）"
  then: "高いフロップより低い頻度でCベットし、多くのハンドで{{t:check|チェック}}します"
  because: "{{t:big-blind}}は多くの{{t:connectors|コネクター}}や小さいカードのハンドでディフェンスし、それらは低いフロップに当たり、あなたの高いカードは外れているからです。{{t:connected|コネクテッド}}なフロップでは相手に{{t:straight|ストレート}}や{{t:two-pair|ツーペア}}もあるので、あなたにはたいてい{{t:nuts-advantage|ナッツアドバンテージ}}がありません"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "商用ソルバーのサイト、Flop Heuristics: IP C-Betting in Cash Games (https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/、BTN vs BB：「a large portion of their range consists of low-card holdings because of the preflop discount posed by the blinds. We connect better with high-card boards and get to bet more.」；「flopped straights often being in the BB’s range」；「Size down and bet less on flops that complete straights and flushes in your opponent’s range」)；商用ソルバーのサイト、Flop Heuristics: IP C-Betting in MTTs (https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-mtts/；別のスポット：BTN vs SB、40bb；コネクテッドなフロップでは「the raiser generally does not have a nuts advantage」；簡略化：キャッシュゲームの記事に沿って、キャッシュゲームのBTN vs BBに方向性として当てはめたもの)；商用ソルバーのサイト、Bullying the Blinds (https://blog.gtowizard.com/bullying-the-blinds-with-continuation-bets/、20bb、654r：「BB’s advantage at the top end」、ボタンはレンジの半分以上をチェック)；トレーニングサイト、3 Concepts That Should Shape Your Postflop Strategy (「the Big Blind will often have the nut advantage」、https://upswingpoker.com/nut-range-positional-advantage/)"
  sources: [{ kind: solver-pub }, { kind: training, url: "https://upswingpoker.com/nut-range-positional-advantage/" }]
- id: R-M5-005
  module: m5
  if: "あなたの{{t:range|レンジ}}に、相手よりずっと多くの最強ハンドがある場合（{{t:nuts-advantage}}）"
  then: "大きめのサイズでベットできます。{{t:range-advantage|レンジアドバンテージ}}しかないときは小さくベットします"
  because: "大きな{{t:bet}}は相手の中くらいのハンドからより多く引き出し、あなたを{{t:raise|レイズ}}してくるより強いハンドに当たることはまれだからです"
  level: heuristic
  source: "商用ソルバーのサイト、The Mechanics of C-Bet Sizing；商用ソルバーのサイト、Range advantage (用語集)"
  sources: [{ kind: solver-pub }]
- id: R-M5-006
  module: m5
  if: "相手が{{t:pair|ペア}}でないハンドを持っている場合"
  then: "フロップで相手のカードがどちらもペアにならないのは約{{n:flop.miss.unpaired}}の確率です"
  because: "見えていない{{n:cards.unseen.preflop}}枚のうち、相手のハンドをペアにするのは{{n:pair.outs.unpaired}}枚だけで、フロップは{{n:cards.board.flop}}枚だけだからです"
  level: math
  source: "正確な計算 (poker-core)；ポーカー計算ツールのサイトと一致 (28.96% + 2.02% + 1.45% = ヒット率32.4%)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M5-007
  module: m5
  if: "プリフロップの{{t:aggressor}}として{{t:position|ポジション}}があり、フロップが{{t:dry}}で高い場合（例：K-7-2レインボー）"
  then: "頻繁に、小さくCベットします。{{t:pot|ポット}}の約{{n:cbet.size.small}}です（単純化：このようなフロップでは、ソルバーは{{t:overbet|オーバーベット}}も使います）"
  because: "あなたには{{t:range-advantage|レンジアドバンテージ}}があり、相手の弱いハンドにはほとんどチャンスがないからです：それらを{{t:fold|フォールド}}させるには小さな{{t:bet}}で十分で、あなたより弱い{{t:pair|ペア}}はそれでも{{t:call|コール}}してきます"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "商用ソルバーのサイト、Flop Heuristics: IP C-Betting in Cash Games (33%)；トレーニングサイト、Bet Sizing Strategy: 8 Rules (「Bet small (25-35% pot) on dry, static board textures」、https://upswingpoker.com/bet-size-strategy-tips-rules/)；トレーニングサイト、What Is a Continuation Bet (K72r)；トレーニングサイト、Picking the Proper C-Bet Sizing on Ace-High Boards (1/3ポット)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M5-008
  module: m5
  if: "プリフロップの{{t:aggressor}}として{{t:position|ポジション}}があり、フロップが相手に多くの{{t:draw|ドロー}}を与えるが、{{t:straight}}はまだできない場合（例：{{t:two-tone}}のK-J-7）"
  then: "Cベットの頻度は下げますが、サイズは大きくします（例：{{t:pot|ポット}}の{{n:cbet.size.big}}）。{{t:draw|ドロー}}のない中くらいのハンドは、より多く{{t:check|チェック}}します。すでに{{t:straight}}ができうるとき（例：J-T-8）は、ソルバーは小さめのサイズでベットします"
  because: "相手の{{t:draw|ドロー}}はエクイティが多いので、大きな{{t:bet}}で次のカードに高い代金を払わせるからです"
  level: heuristic
  source: "商用ソルバーのサイト、Flop Heuristics: IP C-Betting in Cash Games (「increased use of the 66% pot bet size, but decreased overall betting frequency」)；トレーニングサイト、Bet Sizing Strategy: 8 Rules (55–80%、https://upswingpoker.com/bet-size-strategy-tips-rules/)；トレーニングサイト、Picking the Proper C-Bet Sizing on Ace-High Boards (2/3ポット)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }]
- id: R-M5-009
  module: m5
  if: "プリフロップの{{t:aggressor}}として{{t:position|ポジション}}があり、フロップが{{t:paired|ペアボード}}の場合（例：Q-Q-6）"
  then: "頻繁に、小さくCベットします"
  because: "あなたには{{t:range-advantage|レンジアドバンテージ}}があり、{{t:paired|ペアボード}}のフロップでは{{t:draw}}ができにくいので、{{t:pair|ペア}}のない相手は小さな{{t:bet}}にもめったに{{t:call|コール}}できないからです。大きな{{t:bet}}は割に合いません。{{t:three-of-a-kind|スリーカード}}はどちらも持ちうるからです"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "商用ソルバーのサイト、Flop Heuristics: IP C-Betting in Cash Games (「Paired flops are bet significantly more often… only be bet for small sizing… reduced nut advantage from trips being in both player's ranges」；「On paired boards, it's also much harder to have a draw」)"
  sources: [{ kind: solver-pub }]
- id: R-M5-010
  module: m5
  if: "プリフロップの{{t:aggressor}}として{{t:position|ポジション}}があり、フロップが{{t:monotone}}の場合（同じスートのカード3枚）"
  then: "いつもより低い頻度で、小さくCベットします"
  because: "どのプレイヤーもすでに{{t:flush}}を持っている可能性があるので{{t:aggressor|アグレッサー}}の{{t:nuts-advantage}}は小さくなり、大きな{{t:pot|ポット}}では相手の{{t:flush}}が高くつくからです"
  level: heuristic
  source: "商用ソルバーのサイト、Flop Heuristics: IP C-Betting in Cash Games (「Monotone boards see a drastic decrease in betting frequency and sizing」、BTN vs BB、https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/)；商用ソルバーのサイト、The Mechanics of C-Bet Sizing (「when a very wet board like Q♦8♦7♦ is dealt, the bet sizing comes down again」、https://blog.gtowizard.com/the-mechanics-of-c-bet-sizing/)：ウェットなフロップだから大きなベットとは限らない；トレーニングサイト、Monotone Flops (Kanu7、ソルバーの結果：「c-betting half the time for a 25-33% pot sizing」、https://upswingpoker.com/monotone-flops-kanu7/)；決定D-39 (ドキュメント12 M4–M6、レポート12a-22)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/monotone-flops-kanu7/" }]
- id: R-M5-011
  module: m5
  if: "ハンドがまったくない状態で、相手の{{t:fold}}だけを期待してCベットする場合"
  then: "{{t:pot|ポット}}の{{n:cbet.size.small}}の{{t:bet|ベット}}なら、相手が{{n:alpha.cbet.small}}より多く{{t:fold|フォールド}}する必要があり、{{t:pot|ポット}}の{{n:cbet.size.big}}なら{{n:alpha.cbet.big}}より多く必要です"
  because: "{{t:pot|ポット}}を獲得するためにベット額をリスクにさらすからです：しきい値はベット ÷ ({{t:pot}} + ベット)です"
  level: math
  source: "計算：アルファ = ベット / (ポット + ベット)"
  sources: [{ kind: math }]
- id: R-M5-012
  module: m5
  if: "プリフロップで{{t:open|オープン}}し、相手が{{t:position|ポジション}}のある状態で{{t:call|コール}}した場合（例：あなたの{{t:cutoff|CO}}からの{{t:open|オープン}}にボタンが）"
  then: "{{t:in-position}}のときより低い頻度でCベットし、良いハンドでも、より多く{{t:check|チェック}}します"
  because: "{{t:position|ポジション}}のある状態で{{t:call|コール}}したプレイヤーの{{t:range}}は{{t:condensed|コンデンスド}}だからです：弱いハンドは{{t:fold|フォールド}}し、最強ハンドの一部は{{t:raise|レイズ}}していたので、残っているのは主に中くらいのハンドと良いハンドです。さらに、フロップ後はどの{{t:street|ストリート}}でもあなたが先にアクションします"
  level: heuristic
  source: "商用ソルバーのサイト、C-Betting As the OOP Preflop Raiser (UTG vs BTNのCベット28%；「Even a hand like top pair top kicker is preferred to be played as a check-call」)；トレーニングサイト、C-Betting On Ace-High Boards (CO vs BTN、A94r：「we will check over 96% of the time」)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M5-013
  module: m5
  if: "フロップで相手が2人以上いる場合"
  then: "Cベットの頻度をかなり下げ、主に強いハンドと強い{{t:draw|ドロー}}でベットします。{{t:bluff|ブラフ}}は少なくし、ベットするときは小さくします"
  because: "相手が1人増えるごとに、誰かが当たっている可能性が上がるからです：{{t:pair|ペア}}のないハンド2つが同時に外れるのは約{{n:flop.miss.two}}の確率だけです"
  level: heuristic
  source: "トレーニングサイト、Multiway Pots in Poker；トレーニングサイト、C-Betting in Multiway Pots (「Check even pocket kings… the solver checks its entire range」；「around a quarter to a third of pot」)；正確な計算：C(36,3)/C(48,3)"
  sources: [{ kind: training }, { kind: training }, { kind: math }]

# M6: obrona na flopie. Matematyka z formuł (numbers.yaml); zalecenia według rejestru decyzji D-22–D-38 (dokument 12
# M4–M6) i D1 (dokument 12 M7–M9).
- id: R-M6-001
  module: m6
  if: "相手がリバーで{{t:pot|ポット}}の1/3をベットした場合"
  then: "理論上は{{t:range|レンジ}}の約{{n:mdf.bet-third}}でディフェンス（{{t:call|コール}}または{{t:raise|レイズ}}）します。これが{{t:mdf}}です"
  because: "勝ち目のない{{t:bluff}}は3を得るために1をリスクにさらすからです。あなたが{{n:alpha.bet-third}}より多く{{t:fold|フォールド}}すると、相手はどんなカードで{{t:bluff|ブラフ}}しても利益を出せます"
  level: math
  source: "計算：MDF = ポット/(ポット+ベット)；トレーニングサイト、MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker: 「The framework is a starting point, not a rule」)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }, { kind: math }]
- id: R-M6-002
  module: m6
  if: "勝つチャンスのないハンドで{{t:bluff|ブラフ}}する場合"
  then: "相手がアルファ = ベット/({{t:pot}}+ベット)より多く{{t:fold|フォールド}}すれば、{{t:bluff}}はプラスになります。{{t:pot|ポット}}の半分のベットなら{{n:alpha.bet-half}}です"
  because: "{{t:pot|ポット}}を獲得するためにベット額をリスクにさらすからです。ベットが大きいほど、相手はより多く{{t:fold|フォールド}}する必要があります"
  level: math
  source: "計算：アルファ = ベット/(ポット+ベット)；商用ソルバーのサイト、MDF & Alpha (https://blog.gtowizard.com/mdf-alpha)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: math }]
- id: R-M6-003
  module: m6
  if: "{{t:out-of-position}}でフロップのベットを受けた場合"
  then: "{{t:mdf}}が示すより少なくディフェンスしてもかまいません（ディフェンス側に不利なフロップでは、はっきり少なく）。{{t:mdf}}は義務ではなく目安として扱いますが、小さなCベットに対して大量に{{t:fold|フォールド}}はしません"
  because: "相手の{{t:bluff|ブラフ}}にもまだエクイティがあって改善しうるうえ、{{t:out-of-position}}では弱いハンドのエクイティをすべては実現できないからです"
  level: heuristic
  source: "商用ソルバーのサイト、MDF & Alpha (https://blog.gtowizard.com/mdf-alpha: 「On average, BB is consistently over-folding to all bet sizes on the flop」；ポジションがあると「calls much closer to MDF on average」)；ターンのある例ではソルバーは平均してMDF近くまでディフェンスした：トレーニングサイト、What the Best Poker Pros Already Know About Playing vs. Double Barrels (https://upswingpoker.com/vs-double-barrels-turn/)；小さなCベットへのディフェンス：R-M6-006"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: training, url: "https://upswingpoker.com/vs-double-barrels-turn/" }]
- id: R-M6-004
  module: m6
  if: "観察からめったに{{t:bluff|ブラフ}}しないとわかっているプレイヤーが、リバーで大きく{{t:bet|ベット}}した場合"
  then: "{{t:mdf}}が示すより多く{{t:fold|フォールド}}します。中くらいの{{t:pair|ペア}}でもそうします"
  because: "{{t:mdf}}は相手が十分な頻度で{{t:bluff|ブラフ}}することを前提にしているからです。{{t:bluff|ブラフ}}が足りないと、弱いハンドでの{{t:call}}は主に強いハンドに払うことになります"
  level: exploit
  population: "テーブルで観察した特定のプレイヤー；母集団のデータ (サンプル、ステークス、サイト) はないため、このルールはプレイヤー層全体がめったにブラフしないとは仮定しない；2つのトレーニングサイトのコーチが、低ステークスのパッシブなレクリエーショナルプレイヤー (娯楽でプレイし、ふつうは常連より弱い) をこのように説明しているが、ハンドデータベースの数値はない"
  source: "トレーニングサイト、Bluff Catching: When to Call and When to Let It Go (https://deepfold.co/en/blog/bluff-catching-principles: パッシブなレクリエーショナルプレイヤーはリバーの大きなベットでブラフしない)；トレーニングサイト、MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker: 「In low-stakes games, most players will bluff way less」)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/bluff-catching-principles" }, { kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }]
- id: R-M6-005
  module: m6
  if: "相手が大きめに{{t:bet|ベット}}した場合"
  then: "より狭い{{t:range|レンジ}}でディフェンスします：{{t:pot|ポット}}の1/3のベットなら{{t:mdf}}は{{n:mdf.bet-third}}、{{t:pot|ポット}}サイズのベットなら{{n:mdf.bet-pot}}です"
  because: "大きなベットほど値段が悪くなるからです：必要エクイティは{{n:eq.bet-third}}から{{n:eq.bet-pot}}に上がります"
  level: math
  source: "計算：MDF = ポット/(ポット+ベット)、必要エクイティ = ベット/(ポット+2·ベット)"
  sources: [{ kind: math }]
- id: R-M6-006
  module: m6
  if: "{{t:big-blind|ビッグブラインド}}で小さなCベット（{{t:pot|ポット}}の約1/3）を受けた場合"
  then: "ほぼすべての{{t:pair|ペア}}、{{t:draw|ドロー}}、追加の{{t:draw|ドロー}}（バックドア）があるハイカード、そしてふつうはエースハイでも続けます。{{t:pair|ペア}}も{{t:draw|ドロー}}もない最も弱いハンドは{{t:fold|フォールド}}します"
  because: "必要なエクイティは約{{n:eq.bet-third}}だけで、これらのハンドはすでに{{t:bluff|ブラフ}}に勝っているか、改善しうるからです"
  level: heuristic
  source: "トレーニングサイト、Defending the BB on High Card Boards (ソルバー：「we will continue with pretty much all pairs including the underpairs and even A-high hands」)"
  sources: [{ kind: training }]
- id: R-M6-007
  module: m6
  if: "{{t:pair|ペア}}も{{t:draw|ドロー}}もないハイカード2枚を持っていて、Cベットが大きい場合（{{t:pot|ポット}}の3/4以上）"
  then: "ふつうは{{t:fold|フォールド}}します（ただし{{t:dry|ドライ}}なキングハイのフロップでは、ソルバーはエースを含む多くのハンドで{{t:call|コール}}します）"
  because: "{{t:out-of-position}}では、こうしたハンドがショーダウンまで行くことはまれで、ハイカードで{{t:pair}}になってもしばしば負けるからです。{{t:call|コール}}するのはむしろ、追加の{{t:draw}}、できれば最も強い{{t:flush|フラッシュ}}への{{t:draw}}があるときです"
  level: heuristic
  source: "トレーニングサイト、When to Call With Ace-High (J42、66%：「the solver does not call with any Ace-high hand that doesn't have a significant backdoor draw」)；トレーニングサイト、Defending the BB on High Card Boards (K84：ソルバーは2/3ポットに対しても一部のエースでコールする)"
  sources: [{ kind: training }, { kind: training }]
- id: R-M6-008
  module: m6
  if: "フロップでチェックレイズしたい場合"
  then: "主に最強ハンド（{{t:two-pair}}、セット）と{{t:draw|ドロー}}（{{t:flush}}、{{t:oesd}}）で行います。中くらいの{{t:pair|ペア}}はふつう{{t:call|コール}}します（単純化：小さなCベットに対しては、ソルバーは一部の{{t:top-pair|トップペア}}や弱い{{t:pair|ペア}}もプロテクションのために{{t:raise|レイズ}}します）"
  because: "チェックレイズの後、弱いハンドはふつう{{t:fold|フォールド}}し、強いハンドは払ってくるので、中くらいの{{t:pair}}がそれで得をすることはまれだからです。{{t:draw}}には勝つ道が2つあります：相手の{{t:fold}}か、当たることです"
  level: heuristic
  source: "トレーニングサイト、5 Winning Check-Raising Strategies (ソルバーは「check-raise all sorts of top pairs versus small bets」)；トレーニングサイト (ソルバーチャート) (セットとドローをチェックレイズ；弱いペアはプロテクションのため)"
  sources: [{ kind: training }]
- id: R-M6-009
  module: m6
  if: "Cベットが小さい、またはフロップが低くて{{t:connected|コネクテッド}}である場合（例：7-6-5）"
  then: "チェックレイズの頻度を上げます。レイザーに有利な高いフロップ（例：K-J-T、A-A-K）や、大きなCベットに対しては頻度を下げます"
  because: "低くて{{t:connected|コネクテッド}}なフロップでは{{t:big-blind}}の{{t:range|レンジ}}に{{t:straight|ストレート}}と{{t:two-pair|ツーペア}}があってボタンにはたいてい{{t:nuts-advantage|ナッツアドバンテージ}}がなく、小さなCベットは安く{{t:raise|レイズ}}するチャンスになるからです"
  level: heuristic
  source: "トレーニングサイト、How to Check-Raise Like a High Stakes Juggernaut (レイズしないフロップ：K♣J♥T♠、Q♥J♦T♠、A♥A♠K♥；チェックレイズは33%ポットに対して12.65%、66%ポットに対して8.66%)；商用ソルバーのサイト (「The larger the BTN bets, the less BB raises」)；商用ソルバーのサイト、Flop Heuristics: IP C-Betting in Cash Games (「flopped straights often being in the BB’s range」)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M6-010
  module: m6
  if: "フロップでチェックレイズする場合"
  then: "Cベット額の約{{n:xr.mult.low}}–{{n:xr.mult.example}}に{{t:raise|レイズ}}し、Cベットが小さいほど倍率を大きくします。ミニマムにはしません"
  because: "Cベット額の{{n:xr.mult.example}}へのチェックレイズなら、ボタンが{{t:call|コール}}するには約{{n:eq.vs-xr.example}}のエクイティが必要ですが、Cベット額の{{n:xr.too-small.mult}}なら{{n:eq.vs-xr.too-small}}だけで済むからです。それほど安ければ、どんな{{t:draw|ドロー}}でも払ってきます"
  level: heuristic
  source: "値段の計算：コール額/(レイズ後のポット + コール額)；トレーニングサイト、Level-Up Podcast ep. 1 (Blackwood)：小さなCベットに対して4.5倍、大きなCベットに対して3.2倍 (https://upswingpoker.com/podcast/ep1-check-raise/)；方向性は商用ソルバーのサイトと一致：ベットが小さいほど倍率は大きい"
  sources: [{ kind: training, url: "https://upswingpoker.com/podcast/ep1-check-raise/" }, { kind: solver-pub }, { kind: math }]
- id: R-M6-011
  module: m6
  if: "{{t:bluff}}や{{t:semi-bluff}}としてチェックレイズを検討している場合"
  then: "主に強い{{t:draw|ドロー}}を選びます。相手の{{t:fold|フォールド}}が少ないほど、そうした{{t:bluff|ブラフ}}は減らし、相手がほとんど{{t:fold|フォールド}}しないなら、主に{{t:value|バリュー}}目的でチェックレイズします"
  because: "{{t:bluff}}が利益を出すのは、相手がアルファより多く{{t:fold|フォールド}}するときだけだからです（R-M6-002）。強い{{t:draw}}は当たっても勝てるので、{{t:fold|フォールド}}が足りないときの損失が最も小さくなります"
  level: heuristic
  source: "アルファ (R-M6-002) からの結論：ブラフには相手のフォールドが必要；トレーニングサイト、5 Winning Check-Raising Strategies (「tighten your bluffing range to include only strong draws」)"
  sources: [{ kind: training }, { kind: math }]

# M7: turn. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 „Weryfikacja źródeł — M7–M9” (decyzje D1–D9).
- id: R-M7-001
  module: m7
  if: "{{t:position|ポジション}}のある状態でフロップでCベットし、相手が{{t:call|コール}}して、低めの{{t:board|ボード}}のターンに高いカード（エースかキング）が落ちた場合"
  then: "{{t:second-barrel|セカンドバレル}}を打つ頻度を上げます。{{t:bluff}}としても打ちます"
  because: "このカードはふつう、ディフェンダーの{{t:range}}よりあなたの{{t:open|オープン}}の{{t:range}}に多く当たり、相手の{{t:pair}}はどれも1つ順位が下がるからです"
  level: heuristic
  source: "商用ソルバーのサイト、The Worst Turn Card；トレーニングサイト、When to Fire a Second Barrel；トレーニングサイト、When to Double Barrel the Turn as a Bluff"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-002
  module: m7
  if: "ターンで{{t:second-barrel|セカンドバレル}}で{{t:bluff|ブラフ}}する場合"
  then: "相手がどちらかといえば{{t:fold|フォールド}}か{{t:call|コール}}をするなら、ふつうはアウツのあるハンド（{{t:flush-draw}}、{{t:straight|ストレート}}ドロー、ハイカード付きのガットショット）で{{t:bluff|ブラフ}}します。相手が{{t:raise|レイズ}}しうるなら、ソルバーはアウツのないハンドでも{{t:bluff|ブラフ}}します（単純化：選択は相手の反応次第です）"
  because: "{{t:semi-bluff}}には勝ち方が2つあるからです：相手が{{t:fold|フォールド}}するか、リバーで当たるかです。アウツのない{{t:bluff}}には1つ目しかありません（スタックは約{{n:format.stack}}）"
  level: heuristic
  source: "商用ソルバーのサイト、From Gutshots to Airballs: Choosing Your Bluffs；トレーニングサイトを運営するコーチ、The Double Barrel Checklist；トレーニングサイト、When to Double Barrel the Turn as a Bluff (約100bbの場合)"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-003
  module: m7
  if: "ターンで中くらいのハンド（例：{{t:second-pair|セカンドペア}}や弱いキッカーの{{t:top-pair|トップペア}}）を持っていて、相手がすでにCベットに{{t:call|コール}}している場合"
  then: "2回目のベットをする代わりに、より多く{{t:check|チェック}}します"
  because: "フロップで{{t:call|コール}}した後の相手の{{t:range}}は、それ以前より強いからです：ベットすると弱いハンドは{{t:fold|フォールド}}し、強いハンドは払ってきます。{{t:check|チェック}}すれば{{t:pot|ポット}}を小さく保ってショーダウンまで行けます"
  level: heuristic
  source: "商用ソルバーのサイト (Brokos)、Principles of Turn Strategy；トレーニングサイト、Poker Basics: Polarised Ranges；商用ソルバーのサイト、Poker: The Battle for Information"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M7-004
  module: m7
  if: "ターンで、単独ではほとんど勝てないハンドで{{t:bluff|ブラフ}}する場合"
  then: "{{t:pot|ポット}}の3/4のベットなら相手は{{n:alpha.bet-three-quarters}}より多く、{{t:pot|ポット}}の半分のベットなら{{n:alpha.bet-half}}より多く{{t:fold|フォールド}}する必要があります"
  because: "{{t:pot|ポット}}を獲得するためにベット額をリスクにさらすからです：しきい値はベット ÷ ({{t:pot}} + ベット)です。持っているアウツは、このしきい値を下げます"
  level: math
  source: "計算：アルファ = ベット/(ポット+ベット)"
  sources: [{ kind: math }]
- id: R-M7-005
  module: m7
  if: "ターンで{{t:polarized|ポラライズ}}した{{t:range|レンジ}}でベットする場合（非常に強いハンドと、{{t:draw|ドロー}}のある{{t:semi-bluff|セミブラフ}}だけで、中くらいのハンドはなし）"
  then: "大きなサイズ（例：{{t:pot|ポット}}の3/4）を選び、中くらいのハンドは{{t:check|チェック}}します"
  because: "強いハンドはリバーの前に{{t:pot|ポット}}を大きくしたく、{{t:bluff|ブラフ}}には{{t:fold|フォールド}}が必要で、中くらいのハンドは大きな{{t:pot|ポット}}で得をしないからです"
  level: heuristic
  source: "トレーニングサイト、Polarized vs Merged Ranges (定義)；トレーニングサイト、Polarised Ranges；商用ソルバーのサイト、The Worst Turn Card"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-006
  module: m7
  if: "ターンで強いハンドを持っていて、相手が{{t:flush-draw}}を持っている可能性がある場合"
  then: "大きくベットします：{{t:pot|ポット}}の3/4のベットなら、{{t:draw}}に必要なエクイティは{{n:eq.bet-three-quarters}}で、実際に持っているのは約{{n:odds.flush.turn-river}}です"
  because: "{{t:pot|ポット}}の1/4のベットなら{{n:eq.bet-quarter}}で足りるので、小さなベットは{{t:draw|ドロー}}に良い値段を与えるからです"
  level: math
  source: "計算：必要エクイティ = ベット/(ポット+2·ベット)、確率 = アウツ ÷ 見えていないカード；方向性 (強いが脆弱なハンドは大きくベットする)：トレーニングサイト、How Much Should You Bet on Connected Boards?"
  sources: [{ kind: training }, { kind: math }]
- id: R-M7-007
  module: m7
  if: "ターンで{{t:draw}}を持っている場合"
  then: "カード1枚分の確率で数えます：{{t:flush}}は約{{n:odds.flush.turn-river}}で、フロップからリバーまでの{{n:odds.flush.flop-river}}ではありません"
  because: "リバーまで残りは1枚なので、確率はフロップで2枚分として数えたときのおよそ半分になるからです"
  level: math
  check: { kind: draw-price, streets: [turn] }
  source: "正確な計算 (poker-core)"
  sources: [{ kind: math }]
- id: R-M7-008
  module: m7
  if: "ターンで{{t:draw}}の値段が高すぎる場合（必要なエクイティより持っているエクイティが少ない）"
  then: "当たったときの合計の勝ち額が、少なくともコール額 ×（外れるカード ÷ アウツ）になる場合だけ{{t:call|コール}}します。{{t:pot|ポット}}を超える分がインプライドオッズです"
  because: "そうすれば、当たったときの勝ちが外れたときの負けを埋めるからです。フラッシュドローで、{{n:ex.third.pot}}の{{t:pot|ポット}}に{{n:io.flush.bet}}のベットなら、{{t:pot|ポット}}を超える分は{{n:io.flush.extra}}です"
  level: math
  check: { kind: implied-odds, streets: [flop, turn], params: { sprMin: "n:spr.zone.mid" } }
  source: "EVの計算：エクイティ × (ポット + 追加の勝ち額) = (1 − エクイティ) × コール額"
  sources: [{ kind: math }]
- id: R-M7-009
  module: m7
  if: "インプライドオッズを当てにしている場合"
  then: "当てにできるのは、相手の後ろに十分な{{t:chips|チップ}}が残っていて（高い{{t:spr}}）、あなたの{{t:draw}}が最強のハンドへのもので、当たっても目立たないときだけです"
  because: "追加の{{t:chips}}は、これから相手が払わなければならないからです。{{t:spr}}が低ければそのチップがなく、目立つ当たり（例：{{t:board|ボード}}に3枚目のハート）は相手を警戒させます"
  level: heuristic
  source: "トレーニングサイトを運営するコーチ、Implied Odds Calculator；トレーニングサイト、Implied Odds"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-010
  module: m7
  if: "低い{{t:flush|フラッシュ}}への{{t:draw}}を持っている場合、または{{t:board|ボード}}に{{t:flush}}ができうる状況で{{t:straight|ストレート}}への{{t:draw}}を持っている場合"
  then: "より慎重に{{t:call|コール}}し、アウツを少なめに数えます"
  because: "当たってもより強いハンドに負けることがあり、そのときに最も多く払うことになるからです（リバースインプライドオッズ）"
  level: heuristic
  source: "トレーニングサイト、Back to Basics (Part 2): Reverse Implied Odds；トレーニングサイトを運営するコーチ、Implied Odds Calculator"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-011
  module: m7
  if: "{{t:big-blind}}をディフェンスしていて、ボタンが{{t:open|オープン}}後にフロップでCベットしなかった（{{t:check|チェック}}した）場合"
  then: "ターンで自分からベットする（プローブベット）頻度を上げます。特に低いボードで。エースやキングのあるボードでは頻度を下げます"
  because: "ボタンは強いハンドの多くでベットするはずなので、{{t:check|チェック}}した後はそれらが少ないからです。ただし高いボードでは、{{t:range-advantage}}はボタン側に残ります"
  level: heuristic
  source: "商用ソルバーのサイト、The Turn Probe Bet；トレーニングサイト、Turn Probe (Kanu7)；トレーニングサイト、Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-012
  module: m7
  if: "ターンでプローブベットとして{{t:bet|ベット}}する場合"
  then: "支払いとプロテクションを求める{{t:pair|ペア}}と、強い{{t:draw|ドロー}}でベットします。{{t:pair|ペア}}もアウツもないハンドは{{t:check|チェック}}します"
  because: "{{t:pair|ペア}}はボタンの弱いハンドから稼ぎ、ボタンにフリーカードを与えず、{{t:draw|ドロー}}には勝ち方が2つあり、何もないハンドは何も得られないからです"
  level: heuristic
  source: "商用ソルバーのサイト、The Turn Probe Bet；トレーニングサイト、Turn Probe (Kanu7)；トレーニングサイト、Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-013
  module: m7
  if: "フロップでCベットに{{t:call|コール}}し、相手がターンで2回目のベットをした場合"
  then: "フロップより狭くディフェンスします：{{t:draw|ドロー}}は値段が良いかインプライドオッズがあるときだけ{{t:call|コール}}し、アウツのないハンドと最も弱い{{t:pair|ペア}}は{{t:fold|フォールド}}します"
  because: "相手は{{t:second-barrel|セカンドバレル}}を、Cベットより狭い{{t:range|レンジ}}で、ふつうはより大きなサイズで{{t:bet|ベット}}し、{{t:draw|ドロー}}にはもうカードが1枚しか残っていないからです"
  level: heuristic
  source: "トレーニングサイト、What the Best Poker Pros Already Know About Playing vs. Double Barrels"
  sources: [{ kind: training }]

# M8: river. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D10–D17). Reguł eksploatacyjnych brak (R-M6-004: obserwacja konkretnego gracza, bez danych o populacji, D-149).
- id: R-M8-001
  module: m8
  if: "リバーで{{t:in-position}}にいて{{t:value|バリュー}}目的でベットしたく、相手にはもう{{t:call|コール}}か{{t:fold|フォールド}}しかない場合"
  then: "{{t:call|コール}}してくるハンドの{{n:value.threshold}}超があなたより弱いハンドなら、ベットします。数えるのは払ってくるハンドだけで、相手のハンド全部ではありません"
  because: "弱いハンドからの{{t:call}}はそれぞれベット1つ分の勝ち、強いハンドからの{{t:call}}はそれぞれベット1つ分の負けになるからです。相手が弱いハンドで{{t:fold|フォールド}}すれば、{{t:check|チェック}}した場合と同じ{{t:pot|ポット}}を獲得します"
  level: math
  source: "計算：チェックと比べたベットの期待値 (M8のカリキュラム：バリューベットとは、コールされたときに半分を超えて勝つベット)"
  sources: [{ kind: math }]
- id: R-M8-002
  module: m8
  if: "リバーで{{t:in-position}}にいて中くらいのハンドを持っており、相手の弱いハンドはベットに払ってこない場合"
  then: "{{t:check|チェック}}して、無料でショーダウンに行きます"
  because: "ベットすると弱いハンドは{{t:fold|フォールド}}し、払ってくる（または{{t:raise|レイズ}}してくる）のは強いハンドなので、ベットはショーダウンバリューのあるハンドを{{t:bluff}}に変えてしまうからです"
  level: heuristic
  source: "R-M8-001からの結論；商用ソルバーのサイト、Mastering Thin Value Bets in Checked-Down Pots；トレーニングサイト、River；トレーニングサイト、Polarized vs Merged Ranges"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M8-003
  module: m8
  if: "リバーのあなたのハンドが、{{t:call|コール}}しうるハンドの半分を少し上回る程度にしか勝っていない場合（シンバリュー）"
  then: "相手がめったに{{t:raise|レイズ}}しないなら、強いハンドのときより小さく、ふつうは{{t:pot|ポット}}の約1/4–1/2をベットします（単純化：{{t:position|ポジション}}がある状態でチェックレイズのリスクがあるなら、{{t:pot|ポット}}の1/2を下回ることはまれです）"
  because: "小さなベットには相手の弱いハンドも{{t:call|コール}}してきますが、大きなベットに{{t:call|コール}}してくるのは主に強いハンドで、そうなると弱いハンドの{{t:call|コール}}が強いハンドの{{t:call|コール}}を上回らなくなるからです"
  level: heuristic
  source: "商用ソルバーのサイト、River Refinements；商用ソルバーのサイト、Mastering Thin Value Bets in Checked-Down Pots；トレーニングサイト、Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-004
  module: m8
  if: "リバーで、非常に強いハンドと{{t:bluff|ブラフ}}から成る{{t:range|レンジ}}で{{t:pot|ポット}}全額をベットする場合"
  then: "均衡では、あなたのベットの約{{n:bluff.share.bet-pot}}が{{t:bluff|ブラフ}}です。一般に、{{t:bluff|ブラフ}}の割合 = ベット ÷ ({{t:pot}} + 2·ベット)です"
  because: "そのとき、{{t:bluff|ブラフ}}にしか勝てない相手のハンドはちょうど必要なエクイティ（{{n:eq.bet-pot}}）を持つからです：{{t:call|コール}}しても{{t:fold|フォールド}}しても得をしないので、あなたはエクスプロイトされません"
  level: math
  source: "計算：ブラフキャッチするハンドの無差別条件 (簡易モデル：ブラフキャッチャーに対するポラライズしたレンジ)；商用ソルバーのサイト、How to Solve Toy Games"
  sources: [{ kind: solver-pub }, { kind: math }]
- id: R-M8-005
  module: m8
  if: "リバーで、{{t:polarized|ポラライズ}}した{{t:range|レンジ}}のままベットサイズを変える場合"
  then: "大きなベットほど{{t:bluff|ブラフ}}を多く、小さなベットほど少なく含めます：{{t:pot|ポット}}の1/3なら約{{n:bluff.share.bet-third}}、{{t:pot|ポット}}全額なら約{{n:bluff.share.bet-pot}}です"
  because: "大きなベットは相手に悪い値段を与えるので、相手の{{t:call}}が割に合うには、あなたの{{t:range|レンジ}}により多くの{{t:bluff|ブラフ}}が必要だからです"
  level: math
  source: "計算：ブラフの割合 = ベット/(ポット+2·ベット)"
  sources: [{ kind: math }]
- id: R-M8-006
  module: m8
  if: "リバーでどのハンドで{{t:bluff|ブラフ}}するか選ぶ場合"
  then: "ショーダウンで勝てない最も弱いハンド（例：外れた{{t:straight|ストレート}}への{{t:draw|ドロー}}や、勝ち目のないハイカード）で{{t:bluff|ブラフ}}します。ショーダウンバリューのあるハンドは{{t:check|チェック}}します"
  because: "{{t:check|チェック}}すればよく勝てるハンドで{{t:bluff}}すると、その勝ちを手放すからです。勝ち目のないハンドなら、{{t:bluff}}が失敗しても何も失いません"
  level: heuristic
  source: "商用ソルバーのサイト、We're At The River. Our Hand Can't Win. Now What?；トレーニングサイト、Polarized vs Linear Ranges"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-007
  module: m8
  if: "ショーダウンバリューのないハンドの中から{{t:bluff}}を選ぶ場合"
  then: "相手の強いハンド、つまり相手が払ってくるハンドをブロックするカードを持つハンドを選びます（例：{{t:board|ボード}}に同じスートが3枚あるとき、そのスートのエース）"
  because: "相手の最強ハンドに含まれるカードをあなたが持っていれば、相手のそれらの{{t:combo|コンボ}}は少なくなり、フォールドするハンドが残ることが多くなるからです"
  level: heuristic
  source: "M8のカリキュラム；商用ソルバーのサイト、Blockers & Unblockers: The Secret to Picking Great Bluffs；トレーニングサイト、What is Unblocking in Poker"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-008
  module: m8
  if: "{{t:flush-draw}}が外れ、あなたが{{t:bluff}}を選んでいる場合"
  then: "{{t:bluff|ブラフ}}の候補が選べるなら、そのスートのカードを持たない{{t:bluff}}を選びます"
  because: "外れた{{t:draw|ドロー}}を相手は{{t:fold|フォールド}}するからです。あなたの手にそのスートのカードがあると、相手のフォールドするハンドが減ります"
  level: heuristic
  source: "トレーニングサイト、What is Unblocking in Poker；商用ソルバーのサイト、Blockers & Unblockers: The Secret to Picking Great Bluffs"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-009
  module: m8
  if: "あるランクのカードを1枚持っている場合"
  then: "相手のそのランクを含む{{t:combo|コンボ}}は少なくなります：AKは{{n:combos.unpaired}}ではなく{{n:combos.unpaired.one-blocked}}、エースの{{t:pair|ペア}}は{{n:combos.pair}}ではなく{{n:combos.pair.one-blocked}}だけです"
  because: "あなたの手にあるカードは、相手の手にはありえないからです：そのランクの4枚のうち、相手に残るのは{{n:pair.outs.per-rank}}枚です"
  level: math
  source: "組み合わせ計算"
  sources: [{ kind: math }]
- id: R-M8-010
  module: m8
  if: "リバーで、相手の{{t:bluff|ブラフ}}にしか勝てないハンド（ブラフキャッチャー）を持っている場合"
  then: "{{t:bluff|ブラフ}}の割合が必要エクイティを上回るなら{{t:call|コール}}します（例：{{t:pot|ポット}}サイズのベットのうち{{n:eq.bet-pot}}超）。{{t:bluff|ブラフ}}がそれより少なければ{{t:fold|フォールド}}します"
  because: "あなたのエクイティは、相手のベットに占める{{t:bluff|ブラフ}}の割合だからです（すべての{{t:bluff|ブラフ}}に勝ち、すべての{{t:value|バリュー}}ハンドに負けます）。相手がベット ÷ ({{t:pot}} + 2·ベット)の割合で{{t:bluff|ブラフ}}すると、{{t:call}}は損益ゼロになります"
  level: math
  source: "計算：必要エクイティ = ベット/(ポット+2·ベット)"
  sources: [{ kind: math }]
- id: R-M8-011
  module: m8
  if: "どのブラフキャッチャーでリバーのベットに{{t:call|コール}}するか選ぶ場合"
  then: "相手の強いハンドをブロックするカードを持ち、相手の{{t:bluff|ブラフ}}をブロックするカードを持たないハンドを選びます（例：外れた{{t:draw|ドロー}}のスートのカードを持たない）"
  because: "相手のバリューをブロックすれば、相手のベットの{{t:range|レンジ}}に残る{{t:bluff|ブラフ}}が多くなり、相手の{{t:bluff|ブラフ}}をブロックすれば、残るバリューが多くなるからです"
  level: heuristic
  source: "商用ソルバーのサイト、Understanding Blockers；トレーニングサイト；トレーニングサイト、Bluff Catching Strategy"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M8-012
  module: m8
  if: "リバーでベットを受け、{{t:range|レンジ}}でディフェンスする場合"
  then: "最も良いブラフキャッチャーで{{t:call|コール}}します：同じくらいの強さのハンドなら、{{t:blocker|ブロッカー}}が良いほうを選びます。{{t:bluff|ブラフ}}にさえ負けるハンドは{{t:fold|フォールド}}します"
  because: "相手のすべてのベットに負けるハンドは、相手がたくさん{{t:bluff|ブラフ}}していても、{{t:call|コール}}で稼げないからです"
  level: heuristic
  source: "MDF (R-M6-001) とR-M8-010からの結論；商用ソルバーのサイト、Principles of River Play；トレーニングサイト、Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]

# M9: plan rozdania. Matematyka z liczb (numbers.yaml); progi stref SPR i liczba ulic wartości jako heurystyki
# (uproszczenia nazwane w lekcjach). Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D18–D22).
- id: R-M9-001
  module: m9
  if: "フロップで{{t:spr}}を計算する場合"
  then: "{{t:effective-stack}}（2人のうち小さいほう。すでに{{t:pot|ポット}}に入っている分は除く）を{{t:pot|ポット}}で割ります。{{t:open|オープン}}と{{t:call|コール}}の後なら約{{n:spr.srp}}、{{t:in-position}}での3ベットの後なら約{{n:spr.3bet-ip}}、4ベットの後なら約{{n:spr.4bet}}です"
  because: "プリフロップの{{t:raise}}は1回ごとに{{t:pot|ポット}}を数倍にしますが、後ろのスタックはずっとゆっくりしか減らないからです"
  level: math
  source: "計算：SPR = エフェクティブスタック ÷ フロップのポット (スタックとポットはM4の数値)"
  sources: [{ kind: math }]
- id: R-M9-002
  module: m9
  if: "相手がフロップでスタック全部をオールインした場合"
  then: "{{t:call|コール}}に必要なエクイティはスタック ÷ ({{t:pot}} + 2·スタック)です：{{t:spr}}が{{n:spr.commit}}なら{{n:eq.jam.spr2}}、{{t:spr}}が{{n:spr.srp}}ならもう{{n:eq.jam.srp}}です"
  because: "{{t:pot|ポット}}と相手のスタックを獲得するために、スタック全部を払うからです。{{t:spr}}が低いほど、良い値段になります"
  level: math
  source: "計算：必要エクイティ = コール額/(ポット + 2·コール額)"
  sources: [{ kind: math }]
- id: R-M9-003
  module: m9
  if: "フロップの{{t:spr}}が約{{n:spr.zone.low}}より低く（例：{{n:spr.commit}}）、{{t:top-pair|トップペア}}以上のハンドを持っている場合"
  then: "スタック全部をかけてプレイします：全部入れるつもりでベットまたは{{t:call|コール}}し、オールインにはふつう{{t:fold|フォールド}}しません"
  because: "{{t:spr}}が{{n:spr.commit}}なら、オールインに必要なエクイティは最大で約{{n:eq.jam.spr2}}で、{{t:pot|ポット}}の約{{n:geo.spr2.2}}の{{t:bet|ベット}}2回でスタック全部が入るからです。{{t:top-pair}}ならふつう2ストリート分の{{t:value|バリュー}}に耐えられます"
  level: heuristic
  source: "商用ソルバーのサイト、Stack-to-Pot Ratio；トレーニングサイトを運営するコーチ、SPR Strategy；レッスンm9.l2での計算"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-004
  module: m9
  if: "あなたが{{t:bet|ベット}}した後にスタックに残る額が、相手の{{t:call|コール}}後の{{t:pot}}より少なくなる場合"
  then: "{{t:bet|ベット}}してからオールインに{{t:fold|フォールド}}する、という計画は立てません：スタック全部をかけてプレイするか、{{t:check|チェック}}します"
  because: "{{t:spr}}が{{n:spr.commit}}なら、{{t:pot|ポット}}サイズの{{t:bet|ベット}}の後、オールインに必要なエクイティは{{n:eq.commit.after-pot}}だけなので、{{t:fold}}はふつう割に合わないからです"
  level: math
  source: "計算：コール額/(超過分の前のポット + 2·コール額)"
  sources: [{ kind: math }]
- id: R-M9-005
  module: m9
  if: "フルスタック（{{t:spr}}約{{n:spr.srp}}）のシングルレイズド{{t:pot|ポット}}で、{{t:pair|ペア}}1つしか持っていない場合"
  then: "バリュー目的でプレイしますが、ふつうはスタック全部を入れる計画は立てません"
  because: "リバーまでにスタック全部を入れるには、どの{{t:street|ストリート}}でも{{t:pot|ポット}}より多くベットしなければならず、それだけのお金を入れる相手が{{t:pair}}1つより弱いハンドを持っていることはまれだからです"
  level: heuristic
  source: "ジオメトリックサイズの計算 (m9.l3)；商用ソルバーのサイト、Stack-to-Pot Ratio；トレーニングサイト、When to Check Top Pair"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-006
  module: m9
  if: "リバーまでに同じ大きさの{{t:bet|ベット}}でスタック全部を入れたい場合"
  then: "どの{{t:street|ストリート}}でも{{t:pot|ポット}}の同じ割合fをベットします。fは、(1 + 2f)の{{t:street|ストリート}}数乗 = 1 + 2·{{t:spr}}となる値です。{{t:in-position}}の3ベット{{t:pot|ポット}}なら{{t:pot|ポット}}の約{{n:geo.3bet-ip.3}}です"
  because: "fの{{t:bet}}と{{t:call}}で{{t:pot|ポット}}は(1 + 2f)倍になり、{{t:pot}}が{{t:pot}} + 2·スタックまで大きくなったときにオールインになるからです"
  level: math
  source: "計算：ジオメトリックサイズ；トレーニングサイト、Geometric Bet Sizing；商用ソルバーのサイト、Pot Geometry"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-007
  module: m9
  if: "スタック{{n:format.stack}}のシングルレイズド{{t:pot|ポット}}で、3つの{{t:street|ストリート}}でベットする場合"
  then: "{{t:pot|ポット}}の半分の{{t:bet|ベット}}を3回しても、{{n:spr.srp.stack}}のスタックのうち入るのは{{n:srp.half.total}}だけで、{{t:pot|ポット}}サイズの{{t:bet|ベット}}3回でも{{n:srp.potbet.total}}だと覚えておきます"
  because: "フロップの{{t:pot}}はスタックに比べて小さいからです。スタック全部が入るのは、どの{{t:street|ストリート}}でも{{t:pot|ポット}}の約{{n:geo.srp.3}}の{{t:bet|ベット}}をしたときです"
  level: math
  source: "計算：ベットとコールでポットは(1 + 2f)倍になる"
  sources: [{ kind: math }]
- id: R-M9-008
  module: m9
  if: "フロップで{{t:bet|ベット}}する前に、ハンドの計画を立てる場合"
  then: "そのハンドが何ストリート分の{{t:value|バリュー}}に耐えられるかを見積もります（{{t:street|ストリート}}数は単純化）：非常に強いハンド（セット、{{t:straight}}、高い{{t:two-pair}}）は3、良いキッカーの{{t:top-pair}}や{{t:overpair}}はふつう2で、相手が弱いハンドで払ってくるなら3つ目も。弱い{{t:pair}}は1か0です"
  because: "{{t:street|ストリート}}が進むごとに相手の弱いハンドは{{t:fold|フォールド}}し、{{t:pot|ポット}}に残るのは主にあなたより強いハンドになるからです"
  level: heuristic
  source: "総合：トレーニングサイト、When to Check Top Pair (https://upswingpoker.com/when-to-check-top-pair/)：「In single raised pots, the stack-to-pot ratio (SPR) is too high to comfortably get 3 streets of value with many top pair hands.」；商用ソルバーのサイト、Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/)：「All top pairs and all nut flush draws are now indifferent between calling and folding」 (SPR 16)；商用ソルバーのサイト、Pot Geometry (https://blog.gtowizard.com/pot-geometry/)：「Game theory optimal strategies typically use geometric bet sizes when they want to maximize value with a big nut advantage.」；ハンドごとのストリート数 (弱いペアを含む)：アプリの単純化 (D-149)"
  sources: [{ kind: training, url: "https://upswingpoker.com/when-to-check-top-pair/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }]
- id: R-M9-009
  module: m9
  if: "3ストリート分の{{t:value|バリュー}}が取れるハンドを持ち、{{t:spr}}ゾーンがスタック全部をかけてプレイすることを許し（R-M9-010）、スタック全部を入れたい場合"
  then: "小さなサイズではなく、フロップからすでにジオメトリックサイズでベットします"
  because: "3ベット{{t:pot|ポット}}で{{t:pot|ポット}}の1/3の{{t:bet|ベット}}を3回しても、{{n:spr.3bet-ip.stack}}のスタックのうち入るのは約{{n:g3b.third.total}}だけで、スタックの大部分が残るからです。どの{{t:street|ストリート}}でも{{t:pot|ポット}}の約{{n:geo.3bet-ip.3}}なら、全部入ります"
  level: math
  source: "計算：ベットとコールの連鎖 (numbers.yaml、キー g3b.third.* と geo.3bet-ip.*)"
  sources: [{ kind: math }]
- id: R-M9-010
  module: m9
  if: "あるハンドでスタック全部をかけてプレイするかどうか計画する場合"
  then: "{{t:spr}}ゾーンを見ます（単純化）：約{{n:spr.zone.low}}未満ならふつう{{t:top-pair}}で十分、{{n:spr.zone.low}}から{{n:spr.zone.mid}}では{{t:top-pair}}はボーダーラインのハンド、{{n:spr.zone.mid}}から{{n:spr.zone.deep}}ではふつう高い{{t:two-pair|ツーペア}}以上が必要で、{{n:spr.zone.deep}}を超えるとセット、{{t:straight|ストレート}}、またはそれ以上のハンドが必要です"
  because: "{{t:spr}}が高いほど、スタック全部を入れるのに必要な{{t:bet|ベット}}の回数が増え、最後まで払ってくる相手は主に強いハンドを持っているからです。{{t:spr}}が{{n:spr.zone.deep}}なら、{{t:pot|ポット}}サイズの{{t:bet|ベット}}を3回して、ようやくスタック全部が入ります"
  level: heuristic
  source: "トレーニングサイトを運営するコーチ、SPR Strategy (https://www.splitsuit.com/spr-poker-strategy)：「less than 3 is an auto-stack off with top pair or better, between 3-6 is situational and based upon villain/board texture, and more than 6 SPR isn't a default stack-off」；商用ソルバーのサイト、Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/)：「at this higher SPR, stacking off with top pair starts to get a bit dicey」；ゾーン6–13：2つのトレーニングサイトの共通部分：SPR (https://www.thepokerbank.com/strategy/concepts/spr/)：「Medium SPR = 7 - 16」、「Good hands for medium SPRs.」、「Top two pair. Sets.」；Poker SPR (https://pokercoaching.com/blog/poker-spr/)：「High SPR (8+): Deep stacks favor hands that make nutted combinations (sets, straights, flushes) over one-pair holdings.」；しきい値13：計算 (1+2·1)^3 = 1+2·13、および Flynn、Mehta、Miller、Professional No-Limit Hold'em をニュースサイト経由で (https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm)：「if you're heads-up and the stack-to-pot ratio is 13 going to the flop, you and your opponent can each make exactly three pot-sized bets」；ゾーンの境界：アプリの単純化 (D-149)"
  sources: [{ kind: training, url: "https://www.splitsuit.com/spr-poker-strategy" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }, { kind: training, url: "https://www.thepokerbank.com/strategy/concepts/spr/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-spr/" }, { kind: math }, { kind: book, url: "https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm" }]

# M10: eksploatacja mikrostawek. Każde dostosowanie to odejście od bazy z M3–M9 (ADR-03). Definicje statystyk: rules;
# błąd próby, próg blefu i wpływ rake'u na cenę: math; progi typów graczy i próby z serwisów szkoleniowych: heuristic;
# wynik solvera: gto; dostosowanie do typu gracza: exploit z populacją (dane z analizy bazy rąk populacji albo odczyt HUD rywala z próbą).
# Decyzje D-M10-01…14 w raporcie M10 (do dokumentu 12 „Weryfikacja źródeł — M10–M13”).
- id: R-M10-001
  module: m10
  if: "相手の{{t:vpip}}と{{t:pfr}}を読む場合"
  then: "{{t:vpip}}は、相手がプリフロップで自発的に{{t:chips|チップ}}を入れる（{{t:call|コール}}または{{t:raise|レイズ}}する。ブラインドは数えない）ハンドの割合、{{t:pfr}}はプリフロップで{{t:raise|レイズ}}する（{{t:open|オープン}}、3ベット、4ベット）ハンドの割合です。{{t:pfr}}が{{t:vpip}}を超えることはありません"
  because: "どの{{t:raise|レイズ}}も自発的に{{t:chips|チップ}}を入れることでもあるので、{{t:vpip}} − {{t:pfr}}の差は、相手が{{t:call|コール}}かリンプしかしなかったハンドだからです"
  level: rules
  source: "商用ソルバーのサイトの用語集 (https://gtowizard.com/en/glossary/)：「VPIP: … a statistic that measures the frequency with which a player voluntarily puts money into the pot preflop.」；トレーニングサイト、How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/)：「Anytime a player makes a call or a raise before the flop, their VPIP goes up」、「a player’s PFR stat goes up anytime they make a raise before the flop, which includes all 3-bets and 4-bets as well as open raises」"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }]
- id: R-M10-002
  module: m10
  if: "相手のスタッツがn回の機会に基づいている場合"
  then: "その標準誤差は√(p × (1 − p) ÷ n)です：{{n:hud.se.ex.n}}ハンドで{{t:vpip}}が{{n:hud.se.ex.p}}なら約{{n:hud.se.ex}}なので、本当の{{t:vpip}}は約{{n:var.conf95}}の確からしさで{{n:hud.ci.ex.low}}から{{n:hud.ci.ex.high}}の間にあります"
  because: "各ハンドは相手の戦略からのランダムなサンプルで、その平均の誤差は、機会の数の平方根に反比例してしか小さくならないからです。モジュール12のウィンレートの誤差と同じです"
  level: math
  source: "計算：二項分布における割合の標準誤差 √(p(1 − p) ÷ n)、および±1.96誤差の区間 (numbers.yaml、キー hud.se.*、hud.ci.*)"
  sources: [{ kind: math }]
- id: R-M10-003
  module: m10
  if: "{{t:hud}}のスタッツで相手を判断する場合"
  then: "約{{n:hud.hands.random}}ハンド未満ではスタッツを偶然とみなし、未知の相手としてプレイします。プレイヤーのタイプは約{{n:hud.hands.random}}–{{n:hud.hands.rough.high}}ハンドでおおまかにわかり、{{t:vpip}}と{{t:pfr}}は約{{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}}ハンド、3ベットは約{{n:hud.hands.3bet.overall.low}}–{{n:hud.hands.3bet.high}}ハンド、フォールド・トゥ・3ベットは約{{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}}ハンドで安定します"
  because: "{{t:vpip}}は毎ハンド機会が1回増えますが、フォールド・トゥ・3ベットは相手が{{t:open|オープン}}して3ベットを受けたときだけなので、同じハンド数でも機会がずっと少なく、誤差が大きいからです"
  level: heuristic
  source: "トレーニングサイト、How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/)：「For VPIP and PFR, you need at least 100 to 200 hands before the numbers begin to stabilize.」、「For 3-bet and fold to 3-bet, closer to 500 hands is the threshold.」；トレーニングサイト、Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide)：「Below 30 hands, treat the HUD numbers as random and use hand-observation reads only.」、「VPIP / PFR 30-50 hands」、「3-bet % (overall) 100+ hands」、「Fold to 3-bet | 200+ hands」；VPIPとPFRには2つのしきい値：30–50ハンドでおおまかなタイプ、100–200ハンドで安定 (同じ段階での矛盾、docs/tresci/e1-m9-m11.md §3.1)；3ベットとフォールド・トゥ・3ベットには同じ表から別々の下限 (100+と200+)、上限は共通 (D-M10-04；E3 2026-11-04)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-004
  module: m10
  if: "相手の{{t:vpip}}が{{t:pfr}}より{{n:hud.gap.passive}}パーセントポイントを超えて高い場合"
  then: "パッシブなプレイヤーです：よく{{t:call|コール}}やリンプをし、あまり{{t:raise|レイズ}}しません"
  because: "プレイするハンドのほとんどを{{t:call|コール}}で{{t:pot|ポット}}に入れているからです。{{t:regular|レギュラー}}はほぼすべてのハンドを{{t:raise|レイズ}}で始めるので、差は小さくなります"
  level: heuristic
  source: "トレーニングサイト、How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/)：「When a player’s PFR is more than 10 points below their VPIP, I immediately flag them as a passive player who calls too much and raises too little.」；トレーニングサイト、Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide)：「Gap > 10 → Passive player. Lots of cold-calls and limps.」；母集団のハンドデータベース分析による検証データ、大手オンラインサイトNL25 6-max：レクリエーショナルプレイヤー42/18、レギュラー23/18 (mda.rec.*, mda.reg.*)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-005
  module: m10
  if: "{{t:vpip}}と{{t:pfr}}で相手のタイプを判定する場合（6-max、少なくとも約{{n:hud.hands.vpip.low}}ハンド）"
  then: "{{t:nit}}はハンドの約{{n:hud.vpip.nit-max}}までしかプレイしません。{{t:regular}}は約{{n:hud.vpip.reg.low}}–{{n:hud.vpip.reg.high}}で、{{t:vpip}} − {{t:pfr}}の差が小さいです。ルースなプレイヤーは約{{n:hud.vpip.loose}}からで、差が{{n:hud.gap.passive}}ポイントを超えればパッシブな{{t:recreational|レクリエーショナルプレイヤー}}（{{t:calling-station}}）、差が約{{n:hud.gap.aggressive}}ポイントまでなら{{t:maniac|マニアック}}です"
  because: "タイプは、相手がベースからどちらにずれているかを教えてくれるからです：プレイするハンドが少なすぎる、多すぎる、{{t:call|コール}}が多すぎる、{{t:raise|レイズ}}が多すぎる、のいずれかです"
  level: heuristic
  source: "トレーニングサイト、How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/)、6-maxキャッシュの表：「22 to 28」、「35+」、「14 or below」；「a player playing a 45 VPIP is either a maniac or a calling station」；「When the gap is less than 3 points, I flag them as highly aggressive」；トレーニングサイト、Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide)：「10-15% | Very tight (nit)」、「18-22% | Tight-aggressive (TAG)」、「25-30% | Loose-aggressive (LAG)」、「35%+ | Loose (likely recreational)」、プロファイル「Nit (15/12/3%)」、「Whale / Recreational (45/8/2%)」、「Maniac (38/35/15%+)」；母集団のハンドデータベース分析：Regulars「VPIP = 18-32」、Recreationals「VPIP > 40」；しきい値は共通部分、または情報源をカバーする範囲 (D-M10-03)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-006
  module: m10
  if: "パッシブな{{t:recreational|レクリエーショナルプレイヤー}}（{{t:vpip}}が約{{n:hud.vpip.loose}}以上、{{t:vpip}} − {{t:pfr}}の差が{{n:hud.gap.passive}}ポイント超）を相手にプレイする場合"
  then: "より多くのハンドで、薄いものも含めて{{t:value|バリュー}}目的でベットし、モジュール8のベースより{{t:bluff|ブラフ}}を減らします。特にリバーで"
  because: "このようなプレイヤーはショーダウンまで行くことが多く、そこで負けることも多い、つまり弱いハンドで{{t:call|コール}}しているからです：相手の{{t:call|コール}}のうち、あなたより弱いハンドが多くなり（モジュール8のバリューベットのしきい値）、{{t:bluff}}は相手が{{t:alpha}}より多く{{t:fold|フォールド}}するときだけ利益を出します"
  level: exploit
  population: "大手オンラインサイトのレクリエーショナルプレイヤー、NL25–NL100 6-max (データベースの定義：VPIP > 40、成績 < −20bb/100)：WTSDはレギュラーの28%に対して32%、ショーダウン勝率は57%に対して46%、成績は−47bb/100；2026年10月5日までの12か月間の全ハンド (母集団のハンドデータベース分析、ハンド数は非公開)"
  source: "母集団のハンドデータベース分析サイト (https://bluffaces.com/calculators/mda/)、フィルター：大手オンラインサイトNL25/NL50/NL100 6-max、Recreationals と Regulars (mda.rec.*, mda.reg.*)、ハンド数は非公開；トレーニングサイト、How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/)：高いWTSDは「instantly tells you to bluff them less and value bet them more across all betting streets, especially on the river.」；トレーニングサイト、Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide)：「>30% → Calling station. Value bet thinly, never bluff river.」 (このWTSDのしきい値は教えない：トレーニングサイトは「In most cases, your WTSD% should be around 30」としており、ハンドデータベース分析のデータではレギュラーが28%、レクリエーショナルプレイヤーが32%；D-M10-07)；バリューベットのしきい値R-M8-001とモジュール6のアルファは変更なし (D-M10-06)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-007
  module: m10
  if: "{{t:nit}}（少なくとも約{{n:hud.hands.vpip.low}}ハンドで{{t:vpip}}が約{{n:hud.vpip.nit-max}}まで）が{{t:raise|レイズ}}または3ベットした場合"
  then: "{{t:call|コール}}する{{t:range|レンジ}}の下の方のハンドを、モジュール4のベースより多く{{t:fold|フォールド}}し、相手のブラインドはより多くスチールします"
  because: "これほど少ないハンドしかプレイしない人は主に最強ハンドで{{t:raise|レイズ}}するので、あなたの中くらいのハンドはドミネートされていることが多くなるからです。また、相手がブラインドを狭くしかディフェンスしないなら、あなたの{{t:open|オープン}}はその場で勝つことが多くなります"
  level: exploit
  population: "単独の相手：少なくとも約100ハンドのHUDの読み (VPIP 14%まで)；タイプのしきい値は2つのトレーニングサイトから (6-maxオンラインキャッシュ)；ニットはテーブルの少数派なので、母集団全体のデータはない (D-M10-02)"
  source: "トレーニングサイト、How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/)：「anyone significantly below is a nit whose raises you can nearly always fold to」；トレーニングサイト、Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide)：ニット「Plays only premium hands. Steal their blinds relentlessly, fold to their 3-bets without thought, bluff-catch sparingly.」；「10-15% | Very tight (nit) | Folds preflop too much; bluff their open ranges, fold to their 3-bets」"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-008
  module: m10
  if: "{{t:maniac|マニアック}}（{{t:vpip}}が約{{n:hud.vpip.loose}}以上、{{t:pfr}}が{{t:vpip}}とほぼ同じ）を相手にプレイする場合"
  then: "{{t:bluff|ブラフ}}はせず、{{t:bluff|ブラフ}}をキャッチするハンドでより広く{{t:call|コール}}し、非常に強いハンドでは相手にベットさせます"
  because: "相手のベットや{{t:raise|レイズ}}にはベースより多くの{{t:bluff|ブラフ}}が含まれるので、ベースでは{{t:call|コール}}のボーダーラインにあるハンドが利益を出し、めったに{{t:fold|フォールド}}しない相手への{{t:bluff|ブラフ}}は損をするからです"
  level: exploit
  population: "単独の相手：少なくとも約100ハンドのHUDの読み (VPIP 35%以上、VPIP − PFRが3ポイント未満)；タイプのしきい値は2つのトレーニングサイトから (6-maxオンラインキャッシュ)；母集団全体のデータはない (D-M10-02)"
  source: "トレーニングサイト、Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide)：マニアック「Trap with premium hands by flat-calling preflop and letting them stack off. Don't try to out-bluff them; just let them hang themselves.」；トレーニングサイト、How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/)：「a player playing a 45 VPIP is either a maniac or a calling station」；ミックスハンドの原則：商用ソルバーのサイト、Calling Down Over-Bluffed Lines in Lower Limits (R-M10-009)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: solver-pub }]
- id: R-M10-009
  module: m10
  if: "特定のラインで、相手が均衡より多く、または少なく{{t:bluff|ブラフ}}するとわかっている場合"
  then: "まず、ベースで{{t:call}}と{{t:fold}}をミックスするハンドで判断を変えます：{{t:bluff|ブラフ}}が多すぎるならそれらで常に{{t:call|コール}}し、少なすぎるなら常に{{t:fold|フォールド}}します"
  because: "均衡ではこれらのハンドは無差別だからです。相手がちょうど必要な数の{{t:bluff|ブラフ}}を持っているためです。わずかな過剰や不足でもそれらは一方に傾きますが、{{t:range|レンジ}}の残りが変わるのは差が大きいときだけです"
  level: gto
  source: "商用ソルバーのサイト、Calling Down Over-Bluffed Lines in Lower Limits (https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/)、ノードロックによる分析：「Hands that mix calls and folds in theory do so because Villain’s bet size is strategically balanced, making them indifferent to calling and folding since no option is the best.」；「If they are bluffing just a single combo more than they should, all of our indifferent bluff catchers become profitable calls and vice versa (we always fold when they are under-bluffing even slightly).」；「I only changed Villain’s strategy to bluff ~31% instead of ~27% of the time for our strategy to shift completely to never folding.」"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/" }]
- id: R-M10-010
  module: m10
  if: "相手がCベットに、あなたのサイズの{{t:alpha}}より多く{{t:fold|フォールド}}する場合"
  then: "ハンドのないCベットでも、すぐに利益が出ます：{{t:pot|ポット}}の1/3のCベットなら{{n:alpha.cbet.small}}超の{{t:fold|フォールド}}、{{t:pot|ポット}}の3/4のCベットなら{{n:alpha.cbet.big}}超で十分です"
  because: "{{t:bluff}}は{{t:pot|ポット}}を獲得するためにベット額をリスクにさらし、{{t:fold|フォールド}}の割合がベット ÷ ({{t:pot}} + ベット)を超えれば利益が出るからです。{{t:hud}}のフォールド・トゥ・Cベットはすべてのサイズとボードをまとめているので、目安にすぎません"
  level: math
  source: "計算：純粋なブラフのEV = フォールド率 × ポット − (1 − フォールド率) × ベット > 0 ⇔ フォールド率 > ベット ÷ (ポット + ベット) (アルファ、モジュール6；numbers.yaml alpha.cbet.*)；商用ソルバーのサイトの用語集 (https://gtowizard.com/en/glossary/)：「Alpha (α): The minimum frequency your opponent needs to fold to a bet, in order to break even with a pure (0% equity) bluff.」"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M10-011
  module: m10
  if: "相手が3ベットにめったに{{t:fold|フォールド}}しない場合（フォールド・トゥ・3ベットが約{{n:hud.f3b.low}}未満）。例：典型的な{{t:recreational|レクリエーショナルプレイヤー}}"
  then: "{{t:linear|リニア}}な{{t:range|レンジ}}で3ベットします：{{t:value|バリュー}}目的の強いハンドを増やし、{{t:bluff|ブラフ}}はほとんど入れません"
  because: "{{t:in-position}}での{{n:pf.3bet.ip-total}}への3ベットがハンドなしで利益を出すのは、{{t:fold|フォールド}}が{{n:alpha.vs-3bet-ip-size}}を超えるときだけだからです。相手がめったに{{t:fold|フォールド}}しないと、{{t:bluff|ブラフ}}は弱いハンドで大きな{{t:pot|ポット}}をプレイすることになり、強いハンドはより多く{{t:call|コール}}されます"
  level: exploit
  population: "大手オンラインサイト、NL25–NL100 6-max (母集団のハンドデータベース分析、2026年10月5日までの12か月間、ハンド数は非公開)：フォールド・トゥ・3ベットはレクリエーショナルプレイヤー31% (NL50 30%、NL100 32%)、レギュラー55% (NL50 57%、NL100 55%)"
  source: "母集団のハンドデータベース分析サイト (https://bluffaces.com/calculators/mda/)、Fold to 3bet (mda.rec.f3b, mda.reg.f3b)、ハンド数は非公開；トレーニングサイト、How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/)：「if a player has a low Fold to 3-Bet, you will want to adjust your 3-betting range against them and play a more linear range made up of almost solely value hands and very few bluffs.」；トレーニングサイト、Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide)：「<50% → They call 3-bets wide. Drop bluff 3-bets; value-bet thinner and exploit postflop.」；モジュール4のアルファのしきい値 (alpha.vs-3bet-ip-size)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-012
  module: m10
  if: "相手について少ないサンプルしかない、または母集団についての一般的な知識しかない場合"
  then: "ベースから外れるのは、スタッツが示す方向にだけ、ボーダーラインのハンドでだけにします。{{t:range|レンジ}}全体での大きな逸脱は、大きなサンプルがあり、相手のミスがはっきりしているときだけです"
  because: "サンプルが少ないとスタッツの誤差が大きく、ベース（最もエクスプロイトされにくい戦略）から外れること自体がエクスプロイトされうるからです"
  level: heuristic
  source: "トレーニングサイト、How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/)：「The directional signal (very high VPIP, very low PFR) may still be useful even with small samples, but specific exploitation based on percentage points requires a much larger hand history.」；商用ソルバーのサイトの用語集 (https://gtowizard.com/en/glossary/)：「Exploit: To deviate from a baseline strategy in order to take advantage of a (future or prior) mistake in your opponent's strategy.」、「Game Theory Optimal (GTO) The least exploitable fixed strategy」；サンプルの誤差：R-M10-002"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://gtowizard.com/en/glossary/" }]
- id: R-M10-013
  module: m10
  if: "マイクロステークス（NL2–NL25）の6-maxキャッシュをプレイする場合"
  then: "成績は{{t:rake|レーキ}}を差し引いた後で数えます：大手オンラインサイトが取るのは約{{n:rake.micro.low}}–{{n:rake.micro.high}}で、典型的な勝ち組プレイヤーのウィンレート（{{n:var.wr.typical.low}}–{{n:var.wr.typical.high}}）の数倍です"
  because: "{{t:rake}}は、フロップまで進んだすべての{{t:pot|ポット}}から、すべてのプレイヤーが払うからです。勝つには、{{t:rake}}を上回る差で相手に勝たなければなりません"
  level: heuristic
  source: "ポーカー計算ツールのサイト、Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/)、NLH 6-max、2つの大手オンラインサイトのNL2–NL25 (rake.micro.*)；母集団の検証データ：Tombos21、プレイヤーあたりのレーキ NL10 9.1bb/100、NL100 7.3bb/100 (rake.pop.*)；ニュースサイト、How Many Winning Cash Games Players Are There? It Depends on Rake (https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players)、Tombos21：「Reminder that your biggest villain is the house.」、「Pre-rake winners 90% post-rake winners 53%」；トレーニングブログを持つコーチ (var.wr.typical.*、モジュール12)"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: population, url: "https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players" }, { kind: training }]
- id: R-M10-014
  module: m10
  if: "フロップまで進んだ{{t:pot|ポット}}からだけ{{t:rake|レーキ}}を取るゲームで、{{t:open|オープン}}を受けた場合"
  then: "{{t:rake|レーキ}}のないゲームより{{t:call|コール}}を減らします。{{t:rake|レーキ}}がなければ{{t:call|コール}}するはずのハンドの一部は3ベットし、残りは{{t:fold|フォールド}}します"
  because: "{{t:rake}}はフロップ以降の{{t:pot|ポット}}の一部を取りますが、プリフロップで終わった{{t:pot}}にはかからないからです：{{t:call|コール}}はふつうフロップにつながって{{t:rake}}を払い、3ベットはプリフロップでハンドを終わらせることが多く{{t:rake|レーキ}}がかからず、{{t:fold}}にはコストがかかりません（フロップなしの3ベット{{t:pot|ポット}}からも{{t:rake}}を取るサイトもあり、そこでは3ベットも払います）"
  level: gto
  source: "商用ソルバーのサイト、Preflop Raise Sizing: Examining 2 Key Factors (https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/)、NL100のレーキありの200bb 6-maxの解：「Facing a LJ raise, the HJ, CO, and BTN all VPIP 25%-35% fewer hands in the raked game.」、「Rake makes calling raises considerably less appealing, leading to much lower VPIPs and somewhat higher 3-betting frequencies in “no flop, no drop” games.」、「BB calls a min-raise in the raked game barely 60% as often as in the unraked game」；単純化：200bbでの結果、著者：「many of the principles will generalize」；ルームのレーキ構造：ポーカー計算ツールのサイト、API /network-rake-list、ruleフィールド：2つ目の大手オンラインサイト「flop_drop」、大手オンラインサイト「flop_or_3b_drop」 (2026年10月5日閲覧)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/" }, { kind: training }]
- id: R-M10-015
  module: m10
  if: "{{t:rake|レーキ}}のあるゲームで必要エクイティを計算する場合"
  then: "コール額を、{{t:call|コール}}後の{{t:pot|ポット}}から{{t:rake}}を引いた額で割ります：{{t:pot|ポット}}の半分のベットで{{t:rake|レーキ}}が{{n:rake.ex.pct}}なら、{{n:eq.bet-half}}ではなく{{n:eq.bet-half.rake}}が必要です"
  because: "獲得できるのは{{t:rake|レーキ}}を引いた{{t:pot|ポット}}ですが、払うのは全額だからです。マイクロステークスでは{{t:pot|ポット}}が{{t:rake-cap|レーキ上限}}に届くことはまれなので、割合が重要になります"
  level: math
  source: "計算：コール額 ÷ (コール後のポット × (1 − レーキ)) (numbers.yaml eq.bet-half.rake)；ポーカー計算ツールのサイト、Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/)：「At microstakes, percentage drives the cost because pots rarely hit the cap.」"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: math }]

# M12: mental game i bankroll. Poziomy według ADR-24: rachunek = math, zalecenie oparte na rachunku lub literaturze = heuristic.
- id: R-M12-001
  module: m12
  if: "ハンドのサンプルから自分の成績やウィンレートを評価する場合"
  then: "区間を計算します：ウィンレート ± {{n:var.z95}} × SD ÷ √(ハンド数 ÷ 100)"
  because: "SDが{{n:var.sd}}なら、{{n:var.hands.k}}kハンド後でも{{n:var.conf95}}区間は約±{{n:var.ci.wr}}あるので、{{n:var.wr.ex}}という成績は「約{{n:var.wr.ci.low}}から約{{n:var.wr.ci.high}}の間」という意味にすぎないからです"
  level: math
  source: "計算：平均の標準誤差 (正規分布)；SDはポーカー計算ツールのサイト、Examples and Impacts of Variance in Cash Games と Poker Variance Calculator から"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-002
  module: m12
  if: "{{n:dd.bi.small}}{{t:buy-in|バイイン}}の{{t:downswing}}に陥った場合"
  then: "それを下手なプレイの証拠とはみなさず、負けたハンドでの判断を見直します"
  because: "{{n:var.hands.k}}kハンドの間に、ピークからのこのような{{t:downswing}}は、{{n:var.wr.ex}}で勝っているプレイヤー（SD {{n:var.sd}}）の約{{n:dd.p.small.100k}}に起こるからです"
  level: heuristic
  source: "計算：モンテカルロシミュレーション (numbers.yaml、キー dd.*)；ポーカー計算ツールのサイト、Examples and Impacts of Variance in Cash Games は、このシナリオについてより低い数値を示している (M12レポート)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-003
  module: m12
  if: "本当はどれだけ勝っているのか知りたい場合"
  then: "数十万ハンドを集めます：{{n:var.conf95}}の確からしさで±{{n:var.target}}の精度を得るには、約{{n:var.need.hands.k}}kハンドが必要です"
  because: "推定誤差はハンド数の平方根に反比例して小さくなるからです：必要な100ハンドのブロック数 = ({{n:var.z95}} × SD ÷ 精度)²"
  level: math
  source: "計算：(1.96 × 80 ÷ 2)² ブロック；ドキュメント08の桁 (約61万5千ハンド) と一致"
  sources: [{ kind: math }]
- id: R-M12-004
  module: m12
  if: "ハンドの後で自分のプレイを評価する場合"
  then: "勝ったかどうかではなく、判断（値段、エクイティ、そのとき持っていた情報）について問います"
  because: "良い判断でも一定の割合で負けるからです：AAでKKに対してオールインしても約{{n:res.kk-wins}}は負けます。それでも人は、そうすべきでないとわかっていても、結果で判断を評価してしまいます"
  level: heuristic
  source: "Baron と Hershey (1988)、Outcome bias in decision evaluation、J Pers Soc Psychol 54(4)；Annie Duke の「resulting」について (Masters in Business、Ritholtz 2018)；AA–KKのエクイティ：正確な計算 (ドキュメント08)"
  sources: [{ kind: math }, { kind: book }, { kind: study }]
- id: R-M12-005
  module: m12
  if: "数{{t:session|セッション}}の結果を見て、戦略を変えたくなった場合"
  then: "結果だけで変えず、ハンドを見直してから変えます"
  because: "上位{{n:skill.pct}}のプレイヤーでさえ、下位{{n:skill.pct}}を約{{n:skill.ahead}}の確率で上回るのは約{{n:skill.hands}}ハンド後で、腕の差が小さければずっと多くのハンドが必要だからです"
  level: heuristic
  source: "van Loon、van den Assem、van Dolder (2015)、Beyond Chance? The Persistence of Performance in Online Poker、PLoS ONE 10(3)"
  sources: [{ kind: study }]
- id: R-M12-006
  module: m12
  if: "自分のプロファイルにあるティルトの最初のサイン（例：バッドビート後の怒り、相手を懲らしめたい気持ち）に気づいた場合"
  then: "すぐに対応します：深呼吸と、なぜこれが{{t:variance}}か学ぶべきミスなのかを思い出させる、用意しておいた一言です"
  because: "ティルトが大きくなると明晰に考えられなくなり、そうなるともうコントロールできないからです"
  level: heuristic
  source: "Tendler、ニュースサイトでのインタビュー (2014) (「When tilt becomes too intense, it shuts down your ability to think」、「you must begin correcting tilt when it's small」)；Tendler と Carter、The Mental Game of Poker (2011)、「injecting logic」のテクニック"
  sources: [{ kind: book }]
- id: R-M12-007
  module: m12
  if: "負けが続いた後、もう落ち着いて判断を評価できない場合（例：取り返すことしか考えない、ふだんは{{t:fold|フォールド}}するハンドをプレイする）"
  then: "{{t:session|セッション}}を終えます"
  because: "この状態でプレイを続けると最悪のレベル（Cゲーム）でプレイすることになり、目標は明晰に考える力を失う前に、早めにやめることだからです"
  level: heuristic
  source: "Tendler と Carter、The Mental Game of Poker (2011)、「Inchworm」の抜粋 (オンラインで公開された抜粋)：「quit sooner when it's no longer possible to recover a solid thought process」"
  sources: [{ kind: book }]
- id: R-M12-008
  module: m12
  if: "自分のゲームを改善しようとしている場合"
  then: "最高のプレイを磨くことからではなく、最悪のプレイ（Cゲーム）を直すことから始めます"
  because: "最悪のゲームを改善すると着実に進歩でき、新しいことを学ぶための注意力も空くからです"
  level: heuristic
  source: "Tendler と Carter、The Mental Game of Poker (2011)、「Inchworm」の抜粋 (オンラインで公開された抜粋)；Tendler、The Inchworm Concept (jaredtendler.com)"
  sources: [{ kind: book }]
- id: R-M12-009
  module: m12
  if: "{{t:risk-of-ruin|破産リスク}}、つまりバンクロール全体を失うリスクを計算する場合"
  then: "RoR = e^(−2 × ウィンレート × バンクロール ÷ SD²)の式を、バンクロールをbbで表して使います。これはウィンレートとSDが一定の場合の近似です"
  because: "{{n:var.wr.typical.high}}、SD {{n:var.sd}}なら、{{n:br.bi.base}}{{t:buy-in|バイイン}}のバンクロールでリスクは約{{n:ror.base}}、{{n:br.bi.move-down}}{{t:buy-in|バイイン}}ではもう約{{n:ror.half}}になるからです"
  level: math
  source: "ポーカー計算ツールのサイト、Risk of Ruin Formula for Poker Players (「RoR = e^(-2 x WR x BR / SD^2)」)；数値：計算 (numbers.yaml、キー ror.*)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-011
  module: m12
  if: "バンクロールが予定の{{t:buy-in|バイイン}}数の半分まで減った場合（{{n:br.bi.base}}なら{{n:br.bi.move-down}}まで）"
  then: "遅くともその時点で{{t:stakes|ステークス}}を1つ下げます。戻るのは早くても、上の{{t:stakes|ステークス}}の{{t:buy-in|バイイン}}で満額のバンクロールができたときです"
  because: "{{n:var.hands.k}}kハンドで{{n:dd.bi.small}}{{t:buy-in|バイイン}}の{{t:downswing|ダウンスウィング}}は、{{n:dd.wr-low}}から{{n:var.wr.ex}}で勝っているほぼすべてのプレイヤーに起こり（SD {{n:var.sd}}でのシミュレーション）、そうした負けの時点で下げるよう勧める情報源もあり、{{n:br.bi.move-down}}{{t:buy-in|バイイン}}では残りを失うリスクが約{{n:ror.base}}から約{{n:ror.half}}に上がるからです（ウィンレート{{n:var.wr.typical.high}}、SD {{n:var.sd}}の場合）"
  level: heuristic
  source: "トレーニングサイト、Bankroll Management (「half the roll, which is the point to move down a stake」)；トレーニングサイト、Poker Bankroll Management Strategy (3bb/100の場合は30バイインで下げる、つまり満額のバンクロールで)；ポーカー計算ツールのサイト、Risk of Ruin Formula for Poker Players (「Losing 10 should trigger a move down」)；破産リスクの計算とダウンスウィングのシミュレーション"
  sources: [{ kind: training }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M12-012
  module: m12
  if: "ポーカーの時間配分を計画する場合"
  then: "最初は時間の約{{n:study.beginner}}を勉強に充てます。自分の{{t:stakes|ステークス}}で勝てるようになったら約{{n:study.winner}}にしますが、決して{{n:study.min}}を下回らないようにします"
  because: "最初は追いつくべきことが最も多く、自分の{{t:stakes|ステークス}}で勝てるようになれば、もっとプレイできるからです"
  level: heuristic
  source: "トレーニングサイト、What should your study-to-play ratio be (Dara O'Kearney の記事)：「New players have so much catching up to do」；「Once you are beating the games you are in you can start to reduce the study and increase the grinding」"
  sources: [{ kind: training }]

# M11: turnieje i short stacki (moduł opcjonalny). Zakresy push/fold z własnego solvera (pushfold.json, heads-up mały
# blind kontra duży blind, zwalidowany z równowagą Nasha, dokument 10); progi i pojęcia z przeczytanych źródeł (raport M11).
- id: R-M11-001
  module: m11
  if: "{{t:tournament|トーナメント}}で約{{n:m11.thr.pushfold}}以下しかなく、前の全員が{{t:fold|フォールド}}した場合"
  then: "オールインか{{t:fold}}でプレイします（プッシュ/フォールド）。{{n:m11.thr.pushfold}}から{{n:m11.thr.upper}}の間では、プッシュ/フォールドが弱いハンドと中くらいのハンドの主な方法で、約{{n:m11.thr.raise}}を超えるとふつうは通常のレイズをします"
  because: "{{t:short-stack|ショートスタック}}では、レイズしてから相手の{{t:raise|レイズ}}に{{t:fold}}すると{{t:chips|チップ}}を失いすぎ、オールインなら相手から最も多くの{{t:fold|フォールド}}を引き出せるからです。これは単純化で、より多くのアクションを選べるソルバーは一部のハンドをリンプやミニマムレイズにします"
  level: heuristic
  source: "トレーニングサイト、Short Stack Strategy (https://pokercoaching.com/blog/short-stack-strategy-2/)：「At 10 big blinds or fewer, it is almost entirely push/fold」、「This approach simplifies decision-making and maximizes fold equity」、「At 15 big blinds, the landscape shifts significantly. Push/fold becomes your dominant framework for weak and medium holdings」；トレーニングサイト、Push/Fold Tournament Strategy (https://upswingpoker.com/push-fold-tournament-strategy-charts/)：「around 15 big blinds (bb) or fewer」、「larger than 20bb … Raising First In」；商用ソルバーのサイト、Short-Stacked Play in MTTs (https://blog.gtowizard.com/short-stacked-play-in-mtts/)：「The standard advice for a 10bb stack is to play an all-in or fold strategy」；単純化：トレーニングサイト (同じページ)：「the all-in or fold binary was grossly suboptimal」；ソルバー結果を公開しているスクール、ヘッズアップ10bb (https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments)：「61.1% limp, 28.8% all-in, 10.1% fold」"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/short-stack-strategy-2/" }, { kind: training, url: "https://upswingpoker.com/push-fold-tournament-strategy-charts/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/short-stacked-play-in-mtts/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments" }]
- id: R-M11-002
  module: m11
  if: "{{t:small-blind|スモールブラインド}}から{{t:big-blind|ビッグブラインド}}に対して、プッシュ/フォールドでプレイする場合"
  then: "スタックが短いほど、多くのハンドでオールインに{{t:shove|プッシュ}}します：{{n:m11.depth.15}}なら約{{n:m11.push.15}}のハンド、{{n:m11.depth.10}}なら約{{n:m11.push.10}}、{{n:m11.depth.5}}なら約{{n:m11.nash.push.5}}–{{n:m11.push.5}}"
  because: "スタックが短いと、相手が{{t:fold|フォールド}}したときに獲得するブラインドに対してリスクが小さくなり、相手もより広く{{t:call|コール}}しなければならないからです"
  level: gto
  source: "プロジェクトのプッシュ/フォールドソルバー (content/ranges/pushfold.json；ヘッズアップ、アンティなし、オールインかフォールドのゲームのナッシュ均衡、ドキュメント10で10bbにて検証；5bbでは独立に計算した均衡による範囲、docs/tresci/e1b-solver.md、D-153)；比較：トレーニングサイト、Push/Fold Play: Nash Ranges (https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/)、10bb：プッシュ「56.6%」"
  sources: [{ kind: training, url: "https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/" }, { kind: solver-app }]
- id: R-M11-003
  module: m11
  if: "{{t:pot|ポット}}にアンティがある場合"
  then: "アンティがないときより多くのハンドでオールインに{{t:shove|プッシュ}}します：{{n:m11.depth.10}}で{{t:bb-ante}}が{{n:m11.ante}}なら、{{n:m11.push.10}}ではなく約{{n:m11.nash.push.10-ante}}–{{n:m11.push.10-ante}}です"
  because: "アンティは、相手が{{t:fold|フォールド}}したときに獲得する{{t:pot|ポット}}を大きくしますが、オールインのリスクは変わらないからです"
  level: gto
  source: "プロジェクトのプッシュ/フォールドソルバー (pushfold.json、10bb-anteのバリアント：ヘッズアップ、ビッグブラインドアンティ1bb)；検証：docs/tresci/e1b-solver.md (D-153)、同じモデルでの計算 (フィクティシャスプレイによる均衡71.05%、thenの範囲の下限)；方向性は文献と一致：トレーニングサイト、Push Fold Charts (https://pokercoaching.com/push-fold-charts/)：「When antes are in play, your preflop shoving range should be wider」"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: solver-app }]
- id: R-M11-004
  module: m11
  if: "最初にオールインする場合"
  then: "勝ち方は2つあります：相手が{{t:fold|フォールド}}して{{t:pot|ポット}}を獲得するか、{{t:call|コール}}されてショーダウンで勝つかです。ただし勝ち目のないハンドだけなら、{{n:m11.push.10.alpha}}を超える頻度の{{t:fold|フォールド}}が必要です（{{n:m11.depth.10}}、アンティなし）"
  because: "{{n:m11.push.10.win}}のブラインドを獲得するために{{n:m11.push.10.risk}}をリスクにさらすからです。だから、フォールドエクイティと、{{t:call|コール}}されたときのハンドのエクイティの両方が重要です"
  level: math
  source: "計算：アルファ = リスク ÷ (ポット + リスク) (M6)；フォールドエクイティ：商用ソルバーのサイトの用語集 (https://gtowizard.com/en/glossary/)：「Fold equity The amount of value a player will win by making another player fold.」"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M11-005
  module: m11
  if: "M（スタック ÷ 1周のコスト：ブラインドとアンティ）が約{{n:m11.m.red}}以下に下がった場合"
  then: "オールインか{{t:fold}}だけでプレイし、最初に{{t:pot|ポット}}に入るようにします"
  because: "プレイしなければスタックは数周しかもたず、通常のレイズでは{{t:chips|チップ}}を失いすぎるからです"
  level: heuristic
  source: "Harrington (解説経由)：Wikipedia、M-ratio (https://en.wikipedia.org/wiki/M-ratio)：「The M-ratio is calculated by the formula」 (分数で表した式：スタック ÷ (スモールブラインド + ビッグブラインド + アンティ合計))、ゾーンの表で「Your only move is to move all-in or fold」；トレーニングサイト、Dan Harrington M-Factor (https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/)：「Red zone: 1 < = M < = 5」、「your only and best option in this phase is to be the first to push in the pot」；境界は約5の1つだけ (D-147)"
  sources: [{ kind: reference, url: "https://en.wikipedia.org/wiki/M-ratio" }, { kind: training, url: "https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/" }]
- id: R-M11-006
  module: m11
  if: "{{t:big-blind|ビッグブラインド}}から、スタックSで{{t:small-blind|スモールブラインド}}のオールインに{{t:call|コール}}する場合（アンティなし）"
  then: "必要なエクイティは (S − {{n:pf.blind.bb}}) ÷ 2S です：{{n:m11.depth.10}}なら{{n:m11.call.10.eq}}、{{n:m11.depth.5}}なら{{n:m11.call.5.eq}}、{{n:m11.depth.15}}なら{{n:m11.call.15.eq}}"
  because: "ブラインドはすでに{{t:pot|ポット}}に入っているので払うのはS − {{n:pf.blind.bb}}で、{{t:call|コール}}後の{{t:pot}}は2Sになるからです"
  level: math
  source: "計算：必要エクイティ = コール額 ÷ コール後のポット (M2)"
  sources: [{ kind: math }]
- id: R-M11-007
  module: m11
  if: "相手がオールインし、{{t:call|コール}}するかどうか決める場合"
  then: "自分がオールインに{{t:shove|プッシュ}}するときより狭い{{t:range|レンジ}}で{{t:call|コール}}します：{{n:m11.depth.10}}では{{t:big-blind|BB}}は約{{n:m11.call.10}}のハンドで{{t:call|コール}}し、{{t:small-blind|SB}}は約{{n:m11.push.10}}で{{t:shove|プッシュ}}します"
  because: "コールする側はショーダウンでしか勝てず、しかも相手はランダムより強い{{t:range|レンジ}}だからです。{{t:shove|プッシュ}}する側は、相手が{{t:fold|フォールド}}したときにも勝てます"
  level: gto
  source: "プロジェクトのプッシュ/フォールドソルバー (pushfold.json)；トレーニングサイト、Push Fold Charts (https://pokercoaching.com/push-fold-charts/)：「Calling ranges are tighter than shoving ranges」；トレーニングサイト、The Gap Concept (https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/)：「you need a better hand to call a raise with than you would need to open a pot with a raise」 (Sklansky)"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: training, url: "https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/" }, { kind: solver-app }]
- id: R-M11-008
  module: m11
  if: "トーナメントのスタックをお金に換算したい場合（{{t:icm}}）"
  then: "1位の確率 = あなたのスタック ÷ 全{{t:chips|チップ}}。2位の確率は、考えうる各優勝者について、残ったプレイヤーの中で同じように計算します。エクイティ = 確率 × {{t:payout|賞金}}の合計です"
  because: "このモデルはプレイヤーの腕が同じだと仮定しているので、順位を決めるのはスタックだけだからです"
  level: math
  source: "商用ソルバーのサイト、ICM Basics (https://blog.gtowizard.com/icm-basics/)：「The Independent Chip Model assumes all players are equally skilled, and therefore the probability of winning is purely a function of stack sizes」、セクション Limitations of ICM：「ICM doesn’t consider players’ positions.」、「ICM ignores blinds increasing.」 (2026-11-09閲覧)、「divide their chips by the total amount of chips in play」、「Assume one of the other players wins, remove their chips from play, and divide our chips by the remaining chips in play」；例のスタックでの計算 (E1 M9–M11レポート)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: math }]
- id: R-M11-009
  module: m11
  if: "{{t:icm}}のある{{t:tournament|トーナメント}}で、敗退しうるオールインに{{t:call|コール}}する場合"
  then: "必要なエクイティは BF ÷ (BF + 1) です。ここでバブルファクター BF = 負けたときに失うエクイティ ÷ 勝ったときに得るエクイティ。レッスンの例では、{{t:chips|チップ}}での{{n:m11.bf.req-chips}}ではなく{{n:m11.bf.req}}です"
  because: "{{t:payout|賞金}}のある{{t:tournament|トーナメント}}では、負けて失うお金が勝って増えるお金より大きいので、{{t:call}}は{{t:chips|チップ}}を賭けたゲームより高い頻度で勝つ必要があるからです"
  level: math
  source: "ICMの計算 (numbers.yaml、キー m11.bf.*)；商用ソルバーのサイト、What Is the Bubble Factor (https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/)：「$EV lost when you lose / $EV gained when you win = Bubble Factor」、「Required Equity = Bubble Factor / (Bubble Factor + 1)」"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/" }, { kind: math }]
- id: R-M11-010
  module: m11
  if: "{{t:bubble|バブル}}または{{t:final-table|ファイナルテーブル}}で、あなたが中くらいのスタックの場合"
  then: "{{t:chips|チップ}}を賭けたゲームよりはっきりタイトにオールインに{{t:call|コール}}し、あなたを{{t:cover|カバー}}している大きなスタックはより広く{{t:shove|プッシュ}}できます"
  because: "{{t:risk-premium}}があるからです：勝ち取る{{t:chips|チップ}}の価値は失うチップより小さく、大きなスタックはそのときあなたよりリスクが小さいのです"
  level: heuristic
  source: "商用ソルバーのサイト、ICM Basics (https://blog.gtowizard.com/icm-basics/)：「chips won are worth less than chips lost」 (色付けのマークアップを除いたテキスト)、「Big stacks can threaten smaller stacks as they take on less risk when stacking off」；トレーニングサイト、ICM at Final Tables (https://upswingpoker.com/icm-final-tables/)：「When it comes to calling versus shoves, you have to tighten up dramatically when big money is on the line」；トレーニングサイト、Big Stack Advantage (https://upswingpoker.com/big-stack-advantage-stone-bubble/)：「Risk premiums are the additional equity needed to play for stacks. This means responding ranges tighten up considerably」；Ganzfried と Sandholm、AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf)、表2：2人のオールインの後、ビッグブラインドはトーナメントでは「0.021」、単一ハンドでは「0.197」コールする"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: training, url: "https://upswingpoker.com/icm-final-tables/" }, { kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }]
- id: R-M11-011
  module: m11
  if: "プッシュ/フォールドでプレイしていて、後ろに{{t:call|コール}}できるプレイヤーがより多く残っている場合"
  then: "より狭くオールインに{{t:shove|プッシュ}}します：3人で{{n:m11.depth.3max}}なら、ボタンは約{{n:m11.3max.push.btn}}のハンド、ボタンがフォールドした後の{{t:small-blind}}は約{{n:m11.3max.push.sb}}です"
  because: "プレイヤーが1人増えるごとに誰かが強いハンドを持っている可能性が増すので、全員が{{t:fold|フォールド}}することは少なくなるからです"
  level: gto
  source: "プロジェクトのプッシュ/フォールドソルバー (content/ranges/pushfold.json、3人)；Ganzfried と Sandholm、AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf)、表2、single hand：「Button jam … 0.355」、「SB jam after fold … 0.633」と一致 (ノードの頻度は1.2pp以内で一致、M11レポート)"
  sources: [{ kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }, { kind: solver-app }]
- id: R-M11-012
  module: m11
  if: "オールインに{{t:call|コール}}するとき、後ろにまだプレイヤーがいる、または誰かがすでに{{t:call|コール}}している場合"
  then: "より狭く{{t:call|コール}}します：3人で{{n:m11.depth.3max}}なら、ボタンのオールインに{{t:small-blind}}は約{{n:m11.3max.call.sb}}のハンドで{{t:call|コール}}し、{{t:big-blind}}（{{t:small-blind|SB}}が{{t:fold|フォールド}}したとき）は約{{n:m11.3max.call.bb}}、すでに2人がオールインしているときは、値段が{{n:m11.3max.bb-two.eq}}まで下がっても約{{n:m11.3max.call.bb-two}}だけです"
  because: "後ろのプレイヤーが強いハンドを持っていて参加してくるかもしれず、2つの{{t:range|レンジ}}に対してはあなたのハンドのエクイティが急に下がるからです。{{t:small-blind|SB}}と{{t:big-blind|BB}}の値段の差は小さいので、差は主に後ろのプレイヤーから来ます"
  level: gto
  source: "プロジェクトのプッシュ/フォールドソルバー (pushfold.json、3人)；Ganzfried と Sandholm、AAMAS 2008、表2、single hand：「SB jam after jam … 0.234」、「BB jam after jam/fold … 0.308」、「BB jam after jam/jam … 0.197」と一致"
  sources: [{ kind: solver-app }, { kind: study }]

# M13: analiza własnej gry (dokument 14, sekcja 8; decyzje D-M13-12…15 w dokumencie „12 Weryfikacja źródeł — M10–M13”).
# „Decyzja, nie wynik” uczy R-M12-004 (jedna reguła na jedno pojęcie); mechanika powtórek z gry to opis aplikacji,
# więc jest w tekście lekcji, a nie w księdze reguł.
- id: R-M13-001
  module: m13
  if: "相手より大きい{{t:equity}}を持っていたのに、オールインで負けた場合"
  then: "このハンドを理由に戦略を変えません：{{t:equity}}がeなら、そのようなハンドのうち平均して1 − eの割合で負けます。たとえば{{n:m13.eq.example}}なら約{{n:m13.lose.example}}、つまり{{n:m13.ten}}回に{{n:m13.lose.of-ten}}回です"
  because: "{{t:equity}}は同じ状況を何度も繰り返したときの勝ちの割合で、負けもその計算の範囲内だからです"
  level: math
  source: "計算：P(負け) = 1 − エクイティ (スプリットポットの場合はその分少ない)"
  sources: [{ kind: math }]
- id: R-M13-002
  module: m13
  if: "ソルバーが、あるスポットであなたのハンドを2通りにプレイする場合（{{t:mixed-hand|ミックスハンド}}）"
  then: "どちらのプレイも正解です。レポートは、頻度の低いほうのプレイを、ソルバーが少なくとも{{n:range.mixed.min}}、ただし{{n:range.mixed.low}}未満の頻度でプレイする場合に、許容範囲として表示します"
  because: "均衡では、プレイヤーは{{t:expected-value|期待値}}が同じプレイ同士でしかミックスしないからです"
  level: gto
  source: "商用ソルバーのサイト、Principles of GTO (https://blog.gtowizard.com/principles-of-gto/)：「Unexploitable play mixes between two or more options only when these options have the same EV.」；まれな手のしきい値：商用ソルバーのサイト、Measure Performance (https://help.gtowizard.com/measure-performance/)：「Inaccuracy – Moves that are taken less than 3.5% of the time in GTO, but don’t lose significant EV.」 (ADR-26)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/principles-of-gto/" }]
- id: R-M13-003
  module: m13
  if: "すべてのカードのスートを1つの入れ替えで替えた場合（例：ハートをスペードに、スペードをハートに）"
  then: "正しい判断は変わりません"
  because: "ハンドや{{t:draw|ドロー}}の強さは、スートが一致しているかどうかで決まり、どのスートかでは決まらないからです。そのため、実戦の復習では同じ状況を別のスートで見せます"
  level: math
  source: "計算：役のランキングはスートを区別せず (テキサスホールデムのルール)、スートの置換はどのカードが同じスートかを保つ；poker-coreでプロパティテストにより確認 (ドキュメント02、ドキュメント14、5.6)"
  sources: [{ kind: math }]
- id: R-M13-004
  module: m13
  if: "1{{t:session|セッション}}の後に、自分の頻度（例：どれくらいの頻度でハンドに参加するか、3ベットに{{t:fold|フォールド}}するか）を評価したい場合"
  then: "結論は出しません。数えるのはハンドではなく機会です：スタッツを見るのは約{{n:hud.opps.look}}回の機会から、確信を持てるのは約{{n:hud.opps.sure}}回です"
  because: "{{t:vpip}}でさえ読めるのは約{{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}}ハンド後で（M10と同じ）、まれな状況は1{{t:session|セッション}}に数回しか起きないからです"
  level: heuristic
  source: "トレーニングブログを持つコーチ、Poker HUD Stats: The Sample Size You Need (https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html)：「For me personally I usually want at least 5 to even bother looking, and 10 to be sure.」；ハンドのサンプルはR-M10-003と同じ (トレーニングサイト、トレーニングサイト)"
  sources: [{ kind: training, url: "https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html" }, { kind: training }, { kind: training }]
- id: R-M13-005
  module: m13
  if: "プレイ中にどうすべきかわからない、またはハンドが変に感じた場合"
  then: "印をつけるだけにして、分析は{{t:session|セッション}}の後、数時間後か数日後に、頭がすっきりした状態で行います"
  because: "大きな負けの直後や疲れているときの分析は、感情に影響されるからです"
  level: heuristic
  source: "ハンド分析アプリのブログ、How to Review Your Poker Hands (https://blog.checkreplay.com/poker-hand-review/)：「Mark hands that felt interesting, confusing, or off. Don’t analyze them yet.」；「The best time to review is hours or days after the session, with a clear head.」；「What doesn’t work is reviewing while you’re still steaming or while you’re tired.」"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }]
- id: R-M13-006
  module: m13
  if: "大きな{{t:pot|ポット}}で負けた、またはハンド中にどうすべきかわからなかった場合"
  then: "そのハンドを見直します。クーラー（どちらも合理的には{{t:fold|フォールド}}できなかった強いハンド同士）やバッドビートには、あまり時間をかけません"
  because: "クーラーやバッドビートは誰にでも起こり、難しい判断のあったハンドは見直す価値のあるハンドに含まれるからです"
  level: heuristic
  source: "ハンド分析アプリのブログ、How to Review Your Poker Hands (https://blog.checkreplay.com/poker-hand-review/)：「Big pots, especially the ones you lost.」；「Hands where you weren’t sure what to do.」；トレーニングブログを持つコーチ、How to Effectively Conduct Poker Hand Reviews (https://www.blackrain79.com/2014/02/how-to-effectively-conduct-poker.html)：「Coolers and bad beats happen to everybody. Learn how to differentiate them from the hands that matter and don't spend much time on them」"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }, { kind: training, url: "https://www.blackrain79.com/2014/02/how-to-effectively-conduct-poker.html" }]
- id: R-M13-007
  module: m13
  if: "難しい判断を見直す場合"
  then: "まず最初の反応を書き留め（例：「これは簡単な{{t:call|コール}}だ」）、そのあとで計算します"
  because: "最初の反応と計算の差が、直感がどこで間違うかを示し、時間とともに直感を改善してくれるからです"
  level: heuristic
  source: "トレーニングサイト、6 Steps to Analyze a Poker Hand (https://upswingpoker.com/analyze-poker-hand-techniques/)：「Step 4: Take note of your gut reaction」；「be sure to take notes regarding the differences between your initial presumption––which is typically optimistic, in my experience––and the realistic result. This will help you improve your intuitive strategy over time.」"
  sources: [{ kind: training, url: "https://upswingpoker.com/analyze-poker-hand-techniques/" }]
- id: R-M13-008
  module: m13
  if: "相手のプレイスタイルがわからない状態で、相手の{{t:bet|ベット}}に対する判断を見直す場合"
  then: "相手の{{t:range|レンジ}}について、楽観的、悲観的、現実的な仮定でそれぞれ評価します。悲観的な仮定でも良い判断なら、それ以上計算する必要はありません"
  because: "両極端の仮定が現実の入る範囲を決めるので、その両方で良い判断は読み違いに強いからです"
  level: heuristic
