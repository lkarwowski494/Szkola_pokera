# sc-28: Japanese text of content/pl/scenarios/sc-28.yaml (role 06, session HA, 2026-11-13; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-28
module: m9
situation: "あなたは{{t:overpair|オーバーペア}}を持っています。フロップとターンで{{t:bet|ベット}}し、{{t:big-blind|ビッグブラインド}}は毎回{{t:call|コール}}しました。リバーでは{{t:check|チェック}}します。相手は{{t:raise|レイズ}}しないと仮定します：すべてのAK、AQ、AJ、KQ、KJ、QJで{{t:call|コール}}し、すべてのJTで{{t:fold|フォールド}}します。三つ目の{{t:street|ストリート}}の{{t:value|バリュー}}を取りにいきますか、それとも{{t:check|チェック}}しますか？"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { marginMin: 0.2, expected: ["bet"] }
decisions:
  - street: river
    kind: river-value
    rule: R-M8-001
    calls: [AKs, AKo, AQs, AQo, AJs, AJo, KQs, KQo, KJs, KJo, QJs, QJo]
    folds: [JTs, JTo]
    pairKind: [overpair]
    dryBoard: true
    actions:
      - action: "bet"
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手はリバーで{{t:check|チェック}}しています。三回目の{{t:bet|ベット}}をするのは、ここでは相手がより弱いハンドで払ってくれるからです：{{t:call|コール}}するハンドの中では、あなたより弱いハンドのほうが強いハンドより多くあります（引き分けは{{t:pot|ポット}}を分け合い、計算を変えません）。弱いハンドによる{{t:call|コール}}はそれぞれ{{t:bet|ベット}}一回分を勝ち、強いハンドによる{{t:call|コール}}はそれぞれ一回分を負けます。相手が弱いハンドで{{t:fold|フォールド}}したときは、{{t:check|チェック}}した場合に勝つのと同じ{{t:pot|ポット}}を勝ちます。"
      - action: "check"
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手はリバーで{{t:check|チェック}}しています。{{t:check|チェック}}はここでバリューを手放します：{{t:call|コール}}するハンドの中では、あなたより弱いハンドのほうが強いハンドより多いので（引き分けは{{t:pot|ポット}}を分け合い、計算を変えません）、{{t:bet|ベット}}はそれらのハンドから、強いハンドに負ける分より多くを勝ちます。{{t:overpair|オーバーペア}}で三つ目の{{t:street|ストリート}}の{{t:value|バリュー}}を取りにいくのは、相手がより弱いハンドで払ってくれるときで、ここはまさにそうです。"
