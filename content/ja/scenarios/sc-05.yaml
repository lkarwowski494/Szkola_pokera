# SC-05 (M3): Button otwiera, BB broni, niski połączony flop (range-spot rfi.btn, potem cbet-case R-M5-004). Rola 06, sesja EH, 2026-11-11.
# Struktura jak pl (content/pl/scenarios/sc-05.yaml).
id: sc-05
module: m3
situation: "あなたはボタンにいて、前の全員が{{t:fold|フォールド}}しました。"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [rainbow], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
  sredni:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [two-tone], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.btn
    rule: R-M3-003
    actions:
      - action: "raise 2.5"
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{w:stol}}、前の全員が{{t:fold|フォールド}}しました。{{t:open|オープン}}するのは、残りがブラインドだけで、フロップ後は{{t:position|ポジション}}を持てるからです。ボタンからはハンドの約{{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}}と広く{{t:open|オープン}}します。"
      - action: fold
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{w:stol}}、前の全員が{{t:fold|フォールド}}しました。{{t:fold|フォールド}}は慎重すぎます。ソルバーはこのハンドをたいてい{{t:open|オープン}}します。残りはブラインドだけで、フロップ後は{{t:position|ポジション}}を持てるので、ボタンからはハンドの約{{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}}と広く{{t:open|オープン}}します。"
  - street: flop
    kind: cbet-case
    rule: R-M5-004
    actions:
      - action: check
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}、{{t:big-blind|ビッグブラインド}}が{{t:check|チェック}}しています。{{t:check|チェック}}するのは、{{t:big-blind|ビッグブラインド}}が低いフロップに当たる{{t:connectors|コネクター}}や小さなカードのハンドを多く守っていて、{{t:pair|ペア}}も{{t:draw|ドロー}}もないあなたのハンドは外れているからです。こうしたフロップでは、高いフロップより{{t:c-bet|Cベット}}の頻度が下がります。"
      - action: bet-small
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}、{{t:big-blind|ビッグブラインド}}が{{t:check|チェック}}しています。小さな{{t:bet|ベット}}は許容範囲ですが、頻度は低めです。ローカードの{{t:connected|コネクテッド}}なフロップでは、{{t:big-blind|ビッグブラインド}}がこのフロップに当たる{{t:connectors|コネクター}}や小さなカードのハンドを多く守っているので、高いフロップより{{t:c-bet|Cベット}}の頻度が下がります。"
      - action: bet-big
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}、{{t:big-blind|ビッグブラインド}}が{{t:check|チェック}}しています。ここで大きな{{t:bet|ベット}}は不正確です。{{t:connected|コネクテッド}}なフロップでは{{t:big-blind|ビッグブラインド}}がすでに{{t:straight|ストレート}}を持っている可能性があるので、打つなら小さく打ちます。ローカードのフロップでは、高いフロップより{{t:c-bet|Cベット}}の頻度も下がります。{{t:big-blind|ビッグブラインド}}がこのフロップに当たる{{t:connectors|コネクター}}や小さなカードのハンドを多く守っているからです。"
