situation: "スタック全部を入れるサイズ。あなたはボタンで{{t:cutoff|CO}}の{{t:open|オープン}}に{{t:3-bet|3ベット}}し、相手は{{t:call|コール}}しました。フロップであなたは{{t:set|セット}}を持っていて、{{t:cutoff|CO}}は{{t:check|チェック}}します。あなたのハンドは三つのストリートで{{t:value|バリュー}}を取れるもので、フロップ、ターン、リバーで同じ大きさの{{t:bet|ベット}}をして、リバーまでにスタック全部を入れたいと仮定します。"
table: 6max
positions: { hero: BTN, villain: CO }
stackBb: 100
