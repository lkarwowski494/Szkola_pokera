  sredni: { expected: [bet-big], sprRange: [4, 8] }
decisions:
  - street: flop
    kind: geo-size
    rule: R-M9-009
    pots: [16.5, 20, 25]
    stacks: [92.5, 100, 130, 150]
    streets: 3
    small: 0.333333
    actions:
      - action: bet-big
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手が{{t:check|チェック}}しています。{{t:pot|ポット}}の約{{w:rozmiar}}を{{t:bet|ベット}}します。各{{t:street|ストリート}}で{{t:pot|ポット}}の同じ割合を賭けると、ちょうどリバーでスタック全部が入るからです。理論上、同じ大きさの{{t:bet|ベット}}は相手に最も広く守らせるので、相手は{{t:pot|ポット}}に最も多くを払い込みます。"
      - action: bet-small
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手が{{t:check|チェック}}しています。小さな{{t:bet|ベット}}ではスタックが入りきりません：{{t:pot|ポット}}の三分の一の{{t:bet|ベット}}を三回しても、入るのはスタックの一部だけです。たとえば{{t:3-bet|3ベット}}ポットで{{t:pot|ポット}}の後ろに{{n:spr.3bet-ip.stack}}のスタックがある場合、入るのは約{{n:g3b.third.total}}だけです。リバーで{{t:all-in|オールイン}}に到達するには、フロップからすでにジオメトリックサイズ、つまり{{t:pot|ポット}}の約{{w:rozmiar}}で{{t:bet|ベット}}します。"
