# sc-15: Japanese text of content/pl/scenarios/sc-15.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-15
module: m6
situation: "あなたは{{t:big-blind|ビッグブラインド}}にいて、ボタンの{{t:open|オープン}}に{{t:call|コール}}しました。フロップであなたは{{t:check|チェック}}し、ボタンが小さな{{t:c-bet|Cベット}}で{{t:bet|ベット}}します。"
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [call] }
decisions:
  - street: flop
    kind: defend
    rule: R-M6-006
    spot: vs-open.bb-vs-btn
    pots: [6, 9]
    fractions: [0.333333]
    actions:
      - action: call
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手が小さな{{t:c-bet|Cベット}}で{{t:bet|ベット}}しています。{{t:call|コール}}するのは、このハンドはすでに{{t:bluff|ブラフ}}に勝っているか、改善する可能性があり、小さな{{t:bet|ベット}}に必要なエクイティは少ないからです。{{t:pot|ポット}}の{{n:cbet.size.small}}の{{t:bet|ベット}}に対する{{t:mdf}}（{{t:range|レンジ}}の{{n:mdf.bet-third}}）は目安です：フロップで{{t:out-of-position|アウトオブポジション}}なら少し少なめに守ることもできますが、小さな{{t:c-bet|Cベット}}に大量に{{t:fold|フォールド}}はしません。"
      - action: fold
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手が小さな{{t:c-bet|Cベット}}で{{t:bet|ベット}}しています。{{t:fold|フォールド}}は、これほど小さな{{t:bet|ベット}}に対して十分なエクイティがあるハンドを手放します：すでに{{t:bluff|ブラフ}}に勝っているか、改善する可能性があります。フロップで{{t:out-of-position|アウトオブポジション}}なら{{t:mdf}}が示すより少し少なめに守ることもできますが、小さなCベットに大量に{{t:fold|フォールド}}はしません。"
