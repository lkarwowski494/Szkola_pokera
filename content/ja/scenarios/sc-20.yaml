# sc-20: Japanese text of content/pl/scenarios/sc-20.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-20
module: m7
situation: "ターンであなたは強いハンドを持っています：良い{{t:kicker|キッカー}}の{{t:top-pair|トップペア}}か、それ以上です。{{t:board|ボード}}には同じスートのカードが二枚あるので、相手は{{t:flush-draw|フラッシュドロー}}を持っている可能性があります。どのサイズで{{t:bet|ベット}}しますか？"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { draws: [flush], marginMin: 0.02, expected: ["bet-big"] }
decisions:
  - street: turn
    kind: turn-bet
    rule: R-M7-006
    pots: [8, 12, 16, 24]
    small: 0.25
    big: 0.75
    actions:
      - action: "bet-big"
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手は{{t:flush-draw|フラッシュドロー}}を持っている可能性があります。大きく{{t:bet|ベット}}します：{{t:pot|ポット}}の{{n:cbet.size.big}}の{{t:bet|ベット}}に対しては、{{t:draw|ドロー}}に必要なエクイティは{{n:eq.bet-three-quarters}}で、持っているのは約{{n:odds.flush.turn-river}}なので、良い価格を得られません。"
      - action: "bet-small"
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手は{{t:flush-draw|フラッシュドロー}}を持っている可能性があります。小さな{{t:bet|ベット}}は{{t:draw|ドロー}}に良い価格を与えます：{{t:pot|ポット}}の四分の一の{{t:bet|ベット}}なら、ドローにはエクイティ{{n:eq.bet-quarter}}で足り、持っているのは約{{n:odds.flush.turn-river}}です。{{t:draw|ドロー}}に対して強いハンドでは、大きく{{t:bet|ベット}}します。"
