    actions:
      - action: raise
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{w:stol}}、あなたの前に{{t:limp|リンパー}}が一人います。{{n:pf.iso.base}}に、リンパー一人につき{{n:pf.iso.per-limper}}を加えた額まで{{t:raise|レイズ}}します。それより小さい{{t:raise|レイズ}}はリンパーに良すぎる価格を与え、このハンドを降ろさせることもできないからです。"
