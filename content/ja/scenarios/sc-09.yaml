      - action: raise-big
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{w:stol}}、あなたの前に{{t:limp|リンパー}}が一人います。このサイズは標準から外れています：{{n:pf.iso.base}}に、リンパー一人につき{{n:pf.iso.per-limper}}を加えた額まで{{t:raise|レイズ}}し、{{t:out-of-position|アウトオブポジション}}ならさらに{{n:pf.iso.oop-extra}}多くします。"
