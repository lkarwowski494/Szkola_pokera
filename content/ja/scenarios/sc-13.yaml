# sc-13: Japanese text of content/pl/scenarios/sc-13.yaml (role 06, session HA, 2026-11-13; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-13
module: m5
situation: "あなたはボタンから{{t:open|オープン}}し、{{t:big-blind|ビッグブラインド}}が{{t:call|コール}}しました。フロップには同じスートのカードが二枚あり、あなたは強いハンドを持っています：良い{{t:kicker|キッカー}}の{{t:top-pair|トップペア}}か、それ以上です。相手は{{t:check|チェック}}し、{{t:flush-draw|フラッシュドロー}}を持っている可能性があります。どのサイズで{{t:bet|ベット}}しますか？"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { draws: [flush], marginMin: 0.02, expected: ["bet-big"], flop: { suits: [two-tone], ranks: [semi-connected, disconnected] } }
decisions:
  - street: flop
    kind: flop-size
    rule: R-M5-008
    pots: [12, 24, 36, 48]
    small: 0.25
    big: 0.6666666666666666
    actions:
      - action: "bet-big"
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手は{{t:flush-draw|フラッシュドロー}}を持っている可能性があります。大きく{{t:bet|ベット}}するのは、相手の{{t:draw|ドロー}}には多くのエクイティがあるので、大きな{{t:bet|ベット}}で次のカードに高い代価を払わせるためです。{{t:flush-draw|フラッシュドロー}}がターンで完成するのは約{{n:odds.flush.flop-turn}}で、{{t:pot|ポット}}の3分の2の{{t:bet|ベット}}に対しては、次のカードの価格（エクイティ{{n:eq.bet-two-thirds}}）が、ドローがそのカードで当たる確率より高くなります。"
      - action: "bet-small"
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手は{{t:flush-draw|フラッシュドロー}}を持っている可能性があります。小さな{{t:bet|ベット}}は{{t:draw|ドロー}}に良い価格を与えます：{{t:pot|ポット}}の4分の1の{{t:bet|ベット}}なら、ドローに必要なエクイティは{{n:eq.bet-quarter}}で済み、ターンでは約{{n:odds.flush.flop-turn}}で当たります。このようなフロップで{{t:draw|ドロー}}に対して強いハンドを持つときは、より大きなサイズで{{t:bet|ベット}}します。"
