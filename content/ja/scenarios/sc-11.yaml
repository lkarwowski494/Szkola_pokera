# sc-11: Japanese text of content/pl/scenarios/sc-11.yaml (role 06, session CO, 2026-11-11; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-11
module: m5
situation: "あなたはボタンから{{t:open|オープン}}し、{{t:big-blind|ビッグブラインド}}が{{t:call|コール}}して、ハイカードの{{t:dry|ドライ}}なフロップで{{t:check|チェック}}します。"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy:
    flop: { height: [high], suits: [rainbow], ranks: [disconnected], wetness: [dry] }
    holding: [air]
    expected: [bet-small]
  sredni:
    flop: { height: [high], suits: [rainbow], ranks: [semi-connected], oesdPossible: false }
    holding: [air]
    expected: [bet-small]
decisions:
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}、{{t:big-blind|ビッグブラインド}}が{{t:check|チェック}}しています。{{t:pot|ポット}}の約{{n:cbet.size.small}}の小さな{{t:bet|ベット}}をするのは、あなたに{{t:range-advantage|レンジアドバンテージ}}があり、相手の弱いハンドにはほとんど勝ち目がないからです。小さな{{t:bet|ベット}}で十分に{{t:fold|フォールド}}させられます。{{t:big-blind|ビッグブラインド}}はAA、KK、AKの多くをフロップ前に{{t:raise|レイズ}}するので、{{t:call|コール}}しただけの後ではそれらをあまり持っていません。"
      - action: check
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}、{{t:big-blind|ビッグブラインド}}が{{t:check|チェック}}しています。{{t:check|チェック}}は許容範囲ですが、頻度は低めです。ハイカードの{{t:dry|ドライ}}なフロップでは、{{t:range-advantage|レンジアドバンテージ}}があり、相手の弱いハンドは小さな{{t:bet|ベット}}でもう{{t:fold|フォールド}}するので、頻繁に小さく{{t:c-bet|Cベット}}します。{{t:check|チェック}}すると、相手にタダでカードを見せることになります。"
      - action: bet-big
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}、{{t:big-blind|ビッグブラインド}}が{{t:check|チェック}}しています。ここで大きな{{t:bet|ベット}}は不正確です。ハイカードの{{t:dry|ドライ}}なフロップでは、相手の弱いハンドはその程度の{{t:bet|ベット}}でもう{{t:fold|フォールド}}するので、ふつうは{{t:pot|ポット}}の約{{n:cbet.size.small}}の小さな{{t:c-bet|Cベット}}をします。"
