# sc-34: Japanese text of content/pl/scenarios/sc-34.yaml (role 06, session CO, 2026-11-11; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-34
module: m11
situation: "{{t:bubble|バブル}}で{{t:small-blind|スモールブラインド}}が{{t:all-in|オールイン}}し、あなたは{{t:big-blind|ビッグブラインド}}にいます。"
table: 6max
positions: { hero: BB, villain: SB }
stackBb: 10
levels: [latwy, sredni, trudny]
bounds:
  latwy: { marginMin: 0.1, expected: [fold] }
  sredni: { marginMin: 0.05, marginMax: 0.15, expected: [call] }
  trudny: { marginMin: 0.01, marginMax: 0.1, chipsDiffer: true, expected: [fold] }
decisions:
  - street: preflop
    kind: icm-call
    spot: push.sb-10
    rule: R-M11-009
    actions:
      - action: fold
        explanation: "あなたは{{t:bubble|バブル}}の{{w:pozycja}}で{{w:reka}}を持ち、{{w:stol}}、{{t:small-blind|スモールブラインド}}が{{t:all-in|オールイン}}しました。{{t:fold|フォールド}}するのは、{{t:payout|賞金}}のある{{t:tournament|トーナメント}}では負けで失うお金が勝って増えるお金より大きく、{{t:call|コール}}は{{t:chips|チップ}}だけのゲームより高い頻度で勝つ必要があるからです。このハンドは{{t:all-in|オールイン}}の{{t:range|レンジ}}に対する{{t:equity|エクイティ}}が足りず、{{t:icm|ICM}}のこの高いしきい値に届きません。"
      - action: call
        explanation: "あなたは{{t:bubble|バブル}}の{{w:pozycja}}で{{w:reka}}を持ち、{{w:stol}}、{{t:small-blind|スモールブラインド}}が{{t:all-in|オールイン}}しました。{{t:call|コール}}するのは、このハンドが{{t:all-in|オールイン}}の{{t:range|レンジ}}に対して、{{t:icm|ICM}}のしきい値が求めるより多くの{{t:equity|エクイティ}}を持っているからです。このしきい値が{{t:chips|チップ}}だけのゲームより高いのは、{{t:payout|賞金}}のある{{t:tournament|トーナメント}}では負けで失うお金が勝って増えるお金より大きいからです。"
