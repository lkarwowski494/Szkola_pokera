# Pomoc przy problemach z hazardem: jedno źródło prawdy (B-058). Decyzja właściciela D-158 (2026-11-04): bez numerów
# krajowych; jedno ogólne zdanie (lekarz albo specjalista zdrowia psychicznego; w nagłym zagrożeniu lokalny numer
# alarmowy, twierdzenie H-INT-2) i jeden link do międzynarodowej pomocy online (Gambling Therapy, H-INT-1). Zastępuje
# D-142 (numery 9 rynków) i D-150–D-152, D-155 (wybór według regionu); dawne wpisy krajów mają w rejestrze
# docs/tresci/rejestr/pomoc.json status „wycofane”. Pole `claim` = id twierdzenia; content-build przerywa budowanie,
# gdy twierdzenie nie ma w rejestrze statusu „potwierdzone”.
#
# Korzystają z niego: ramka „Odpowiedzialna gra” w lekcji M12-L4 (znacznik {{helplines}}) oraz ekran „Pomoc”
# (apps/mobile/src/data/content/helplines.generated.ts). Linki tylko do domen ze źródeł tego samego wpisu
# (content-build to sprawdza). Bez nazw pokoi pokerowych (ADR-13).
