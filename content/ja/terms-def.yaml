royal-flush: "ポーカーで最も強い役です。同じスートのエース、キング、クイーン、ジャック、10の5枚で、例：A♠ K♠ Q♠ J♠ T♠。"
straight-flush: "同じスートで連続する5枚のカードです。例：5♥ 6♥ 7♥ 8♥ 9♥。最も高いもの（エースから10まで）には別の名前があり、ゲームで最も強い役です。"
four-of-a-kind: "同じランクのカード4枚です。例：7が4枚。同じランクのフォーカード同士では、5枚目のカード（キッカー）が高いほうが勝ちます。"
full-house: "スリーカードとペアを組み合わせた役です。例：クイーン3枚と5が2枚。フルハウス同士では、スリーカードが高いほうが勝ちます。"
flush: "同じスート（♠、♥、♦、♣のいずれか）の5枚で、連続していないものです。フラッシュ同士では最も高いカードが高いほうが勝ち、同じなら次に高いカードで決まります。"
straight: "連続する5枚のカードで、すべてが同じスートではないものです。例：5-6-7-8-9。エースは最も高いカード（A-K-Q-J-T）にも、最も低いカード（A-2-3-4-5）にもなります。"
three-of-a-kind: "同じランクのカード3枚とほかのカード2枚です。ホールデムでは別の名前を持つ2種類があります。ペアが手札にあり3枚目がボードにあるときはセット、ペアがボードにあり3枚目が手札にあるときはトリップスです。"
set: "手札のペアとボードの1枚でできたスリーカードです。例：K-7-2のフロップで7♣ 7♦。"
two-pair: "異なる2組のペアと5枚目のカードです。例：K-K-8-8-3。同じ場合は、まず高いほうのペア、次に低いほうのペア、最後に5枚目のカードで決まります。"
pair: "同じランクのカード2枚とほかのカード3枚です。例：9が2枚。これより弱いのはハイカードだけです。"
high-card: "ペア以上の組み合わせがない役です。強さは最も高いカードで決まり、同じなら次のカードで決まります。"
kicker: "役に含まれないカードのうち最も高いもので、同じ役どうしの勝敗を決めます。例：エースのペアにキングがある手は、エースのペアにクイーンがある手に勝ちます。"
wheel: "最も低いストレートで、A-2-3-4-5です。エースは最も低いカードとして数えます。"
check: "チップを出さずにプレイを続けることです。追加で払う必要がないとき、つまりこのベッティングラウンドでまだ誰もベットしていないときだけできます（フロップ前は、誰もレイズしていなければビッグブラインドがチェックできます）。相手のベットに額を合わせるコールと混同しないでください。"
bet: "まだ誰もベットしていないベッティングラウンドで、最初にチップを出すことです（広い意味では、ポットにチップを入れることすべてをベットと呼びます）。"
call: "プレイを続けるために、相手のベットまたはレイズと同じ額をポットに入れることです。誰もベットしていないときにベットせずに続けるチェックと混同しないでください。"
raise: "相手のベットより額を引き上げることです。ほかのプレイヤーは差額を出すか、さらにレイズするか、フォールドしなければなりません。"
fold: "そのハンドを降りることです。カードを捨て、すでにポットに入れたチップは失います。"
check-raise: "まずチェックし、相手がベットしたら、同じベッティングラウンドでレイズすることです。"
all-in: "自分のチップをすべて賭けることです。各相手から勝てるのは最大で自分が入れた額までで、残りはサイドポットで争われます。"
pot: "現在のハンドで賭けられたチップすべてです。ショーダウンで最も強い役のプレイヤー（サイドポットがあればポットごとに別々に決まります）か、ほかの全員がフォールドしたときに残ったプレイヤーが獲得します。"
side-pot: "誰かがオールインしたときにできる別のポットです。オールインしたプレイヤーより多く入れたプレイヤーだけがこれを争うため、オールインしたプレイヤー自身は獲得できません。"
split-pot: "同じ強さの役を持つプレイヤーがポットを分け合う状況です。例：2人ともボード上の同じストレートでプレイしている場合。"
playing-the-board: "自分の最も強い5枚の役がコミュニティカードだけでできている状況です。ホールカードが何も加えないため、よくてもポットを分け合うことになります。"
board: "中央に表向きに置かれ、全プレイヤーが使うコミュニティカード（フロップ、ターン、リバー）です。プレイする卓（テーブル）ではなく、カードのことを指します。"
community-cards: "中央に表向きに配られ、どのプレイヤーも自分の役に使えるカードです。ホールデムでは5枚あります。"
hole-cards: "ホールデムでハンドの最初に配られる裏向きの2枚のカードです。見られるのは自分だけです。"
small-blind: "配る前に、ボタンの左隣のプレイヤー（2人のときはボタン自身）が出す小さいほうの強制ベットです。その席もこう呼びます。"
big-blind: "配る前に、ボタンから左に2番目のプレイヤー（2人のときはボタンの相手）が出す大きいほうの強制ベットです。その席もこう呼びます。スタックの大きさや成績の単位にも使われます。"
chips: "テーブルでプレイに使う円盤です。キャッシュゲームではお金を、トーナメントではトーナメントのポイントを表します。"
stack: "プレイヤーが目の前に持っているチップすべてです。通常はビッグブラインドの数で表します（例：100ビッグブラインド）。"
street: "ベッティングラウンドの俗称で、プリフロップ、フロップ、ターン、リバーが4つのストリートです。例：「3ストリートでバリュー」とは、フロップ、ターン、リバーでバリューのためにベットすることです。"
betting-round: "プレイヤーが順番にチェック、ベット、コール、レイズ、フォールドするハンドの段階です。ホールデムではプリフロップ、フロップ、ターン、リバーの4つがあります。"
preflop: "最初のベッティングラウンドです。ホールカードが配られた後、フロップが出る前に行います。"
flop: "プリフロップのベットの後にまとめて配られる最初の3枚のコミュニティカードです。2番目のベッティングラウンドもこう呼びます。"
turn: "4枚目のコミュニティカードで、3番目のベッティングラウンドでもあります。"
river: "5枚目で最後のコミュニティカードで、ショーダウン前の最後のベッティングラウンドでもあります。"
showdown: "最後のベットの後、2人以上のプレイヤーが残っているときにカードを公開することです。最も強い役がポットを獲得します。"
position: "ボタンを基準にしたテーブル上の席で、アクションの順番を決めます。後にアクションするプレイヤーほど、判断の前に相手のプレイを多く見られます。"
in-position: "フロップ後に最後にアクションするプレイヤーの状況です。判断の前に相手のプレイを見られます。"
out-of-position: "フロップ後に相手より先にアクションするプレイヤーの状況です。相手のプレイを知らずに判断します。"
early-position: "フロップ前に最初にアクションする席です（例：UTG）。後ろにまだ多くのプレイヤーがいます。"
late-position: "最後にアクションする席で、ボタンとそのすぐ前の席、特にカットオフです。"
utg: "フロップ前に最初にアクションするプレイヤーで、ビッグブラインドのすぐ左に座ります。"
hijack: "カットオフのすぐ前、つまりボタンから右に2番目の席です。"
cutoff: "ボタンのすぐ右の席で、ボタンの直前にアクションします。"
button: "「ディーラー」の円盤で示されるディーラーの席です。フロップ後はすべてのベッティングラウンドで最後にアクションします。"
outs: "まだデッキに残っていて、自分の手を強くするカードです。多くの場合、ドローを完成させます。例：フラッシュドローなら、自分のスートの残りのカードがアウツです。"
draw: "まだ強い役ではないものの、次のコミュニティカードで強い役になりうる手です。例：フラッシュやストレートにあと1枚足りないとき。"
flush-draw: "同じスートのカードが4枚（手札とボードを合わせて）ある状態です。フラッシュにはあと1枚必要です。"
straight-draw: "ストレートにあと1枚足りない4枚のカードです。種類はOESD（両端のどちらかのカードが足りない）とガットショット（中のカードが足りない）です。"
oesd: "open-ended straight drawの略です。連続する4枚のストレートドローで、両端どちらのカードでも完成します。例：5-6-7-8は4か9を待っています。"
gutshot: "中の特定の1ランクが足りないストレートドローです。例：5-6-8-9は7だけを待っています。"
backdoor: "ターンとリバーで続けて合うカードが2枚必要な、フロップでのドローです。例：フロップ後に同じスートが3枚ある場合。"
pot-odds: "出さなければならない額と、獲得できるポット（相手のベットを含む）の比率です。コールが得になるために、どのくらいの頻度で勝つ必要があるかがわかります。"
implied-odds: "役が完成したときに後のストリートで獲得できると見込めるチップを加えたポットオッズです。"
equity: "これ以上ベットせずに残りのカードをすべて配った場合に、ポットを獲得できる確率です。通常はパーセントで表します。"
equity-realization: "ベットが続く中で、手がエクイティをどの程度勝ちに変えられるかを示します（エクイティより少なくも多くも実現しえます）。ポジションや手のプレイしやすさなどで変わります。"
expected-value: "あるプレイを何度も繰り返したときの平均的な結果です。平均でプラスになるプレイは、今回負けたとしても長期的には利益を生みます。"
combo: "スートを含めた2枚のカードの具体的な組み合わせ1つです。例：A♠ K♥。これを数えると、ある手が実際にレンジにいくつあるかがわかります。"
range: "ある状況でプレイヤーが持ちうるすべての手、またはあるプレイをするときの手の集まりです。"
mixed-hand: "均衡戦略があるときは一方のプレイ、あるときは別のプレイを選ぶ手です（例：レイズするときもあれば、コールするときもある）。どちらのプレイも正しい選択です。こうした手は混合戦略でプレイすると言います。"
open: "前のプレイヤー全員がフォールドしたとき、フロップ前にレイズでポットに参加することです。"
suited: "同じスートの2枚のホールカードです。例：A♥ K♥（表記はAKs）。"
offsuit: "スートが異なる2枚のホールカードです。例：A♥ K♣（表記はAKo）。"
pocket-pair: "2枚のホールカードでできたペアです。例：フロップ前の8♣ 8♦。"
connectors: "ランクが隣り合うホールカードです。例：8-7や9-8。ストレートを作りやすい手です。"
3-bet: "フロップ前のオープンに対する最初のレイズです。ビッグブラインドを1回目、オープンを2回目のベットと数えるため、この名前になっています。"
4-bet: "3ベットに対するレイズで、ベッティングラウンドで4回目のベットにあたります。"
limp: "まだ誰もレイズしていないとき、フロップ前にビッグブラインドにコールするだけでポットに参加することです。"
isolation: "1人以上がリンプした後にするレイズで、リンプしたプレイヤー（弱いプレイヤーであることが多い）と1対1でプレイすることを狙います。"
texture: "コミュニティカードの性質です。スートがいくつあるか、カードのランクが近いか、ペアがあるかなどを指します。これによって、どの役やドローがありうるかが決まります。"
dry: "ありうるドローや強い役が少ないボードです。例：K♠ 7♦ 2♣。"
wet: "ありうるドローや強い役が多いボードです。例：J♥ T♥ 8♣。"
rainbow: "3枚がすべて異なるスートのフロップで、フロップの時点では誰もフラッシュドローを持っていません。"
two-tone: "2枚が同じスートのフロップで、フラッシュドローがありえます。"
monotone: "3枚がすべて同じスートのフロップで、すでにフラッシュができている可能性があります。"
paired: "ペア（同じランクのカード2枚）があるボードです。例：8-8-3。"
connected: "誰かがすでにストレートを作っている可能性があるボードです。例：9-8-7。"
disconnected: "カードのランクが離れていて、ストレートやストレートドローを作りにくいボードです。例：K-7-2。"
semi-connected: "ストレートドローはあるものの、まだストレートはできないボードです。例：T-8-3（このコースでの分類）。"
wetness: "ボードがドローや強い役をどれだけ生みやすいかの度合いで、ドライからウェットまであります。ボードがどれだけコーディネートしているか、とも表現します。"
top-pair: "ボードで最も高いカードとのペアです。例：K-7-2のフロップでK♠ Q♦。"
second-pair: "ボードで2番目に高いカードとのペアです。例：K-7-2のフロップで7♠ 6♠。"
overpair: "ボードのどのカードよりも高いポケットペアです。例：J-7-2のフロップでQ-Q。"
c-bet: "継続ベット（コンティニュエーションベット）です。前のラウンドでアグレッサーだったプレイヤーのベットで、例：プリフロップでオープンした後のフロップでのベット。"
aggressor: "前のベッティングラウンドで最後にベットまたはレイズしたプレイヤーです。"
initiative: "最後のアグレッサーが持つ役割で、通常は次のベットもそのプレイヤーがします。"
range-advantage: "あるボードで、一方のプレイヤーのレンジが全体として相手のレンジより高いエクイティを持つ状況です。"
nuts-advantage: "一方のプレイヤーのレンジに、相手より割合として多くの最も強い手が含まれる状況です。"
nuts: "そのボードでその時点でありうる最も強いハンドです。例：K♥ 9♥ 4♥ 2♣のボードでは、ハートのエースを使ったフラッシュがナッツです。"
polarized: "レンジについて：主にとても強い手とブラフでできていて、中くらいの手がほとんどない状態です。"
polarization: "両極端でレンジを組むことです。バリューのための強い手とブラフで構成し、中くらいの手は含めません。"
linear: "レンジについて：最も強い手から順に上から組まれ、ブラフの独立したグループがない状態です。関連する用語として「マージドレンジ」（ポラライズされていないレンジ）もあり、公開されたソルバー分析によれば、マージドはこのレンジとポラライズドレンジの中間の形です。"
condensed: "レンジについて：最も強い手がなく（上限があり）、主に中くらいの手でできている状態です。ポラライズドの反対です。"
value: "相手に弱い手でコールさせるために、強い手でベットすることです。"
value-bet: "バリューのための1回のベットです。弱い手にコールさせるために、強い手で行います。"
bluff: "ショーダウンでは勝てそうにない弱い手でベットし、相手に強い手をフォールドさせることです。"
semi-bluff: "まだ弱いものの強くなる可能性がある手（例：ドロー）でするベットです。相手がフォールドするか、カードが当たれば勝てます。"
blocker: "相手が特定の手を持つ可能性を下げる、自分の手札のカードです。例：自分がハートのエースを持っていれば、相手はハートのエースを使ったフラッシュを持てません。"
bluff-catcher: "相手のブラフにだけ勝ち、相手のバリューベットには負ける手です。"
barrel: "前のラウンドで自分がベットした後、次のベッティングラウンドでさらにするベットです。"
second-barrel: "2回連続のベットです。フロップでCベットした後、ターンでもう一度ベットします。"
probe-bet: "プリフロップのアグレッサーがフロップでCベットせずにチェックした後、アウトオブポジションのプレイヤーがターンでするベットです。"
donk-bet: "前のラウンドのアグレッサーがアクションする前に、ほかのプレイヤーがするベットです。"
overbet: "フロップ以降のベットで、ポット全体より大きいものです。"
effective-stack: "2人のハンドでは、2人のスタックのうち小さいほうで、実際に勝ったり負けたりできる最大額です。プレイヤーが3人以上いるときは、2人の組ごとに別々に計算します。"
spr: "エフェクティブスタックをストリート開始時のポットで割った値です（ハンドの計画にはフロップで計算します）。ポットに対してスタックがどれだけ深いかを示し、SPRが低いほど早くすべてがポットに入ります。"
mdf: "勝ち目のない手での相手のブラフが自動的に得にならないように、ベットに対して守る必要があるレンジの最小の割合です。"
alpha: "勝ち目のない手でのブラフが損益ゼロになるために、相手がフォールドしなければならない頻度です。ポットに対するベットの大きさで決まります。"
variance: "期待値を中心とした結果のばらつきです。よいプレイをしていても、短い期間では大きなマイナスやプラスになることがあります。"
buy-in: "トーナメント、またはキャッシュゲームのテーブルに参加するための金額です。"
bankroll: "ポーカーのプレイだけに充てる資金全体です。このアプリではお金ではなく、バイインの数で数えます。"
tilt: "感情（怒り、苛立ち、高揚感）のせいで、テーブルでの判断が悪くなる状態です。"
winrate: "長めのサンプルでのプレイヤーの平均的な成績です。キャッシュゲームでは通常bb/100、つまり100ハンドあたりのビッグブラインドで表します。"
downswing: "成績がはっきり悪い期間で、通常は実力から考えられるより大きな負けが続きます。アップスイングの反対です。"
session: "ポーカーのプレイ1回分で、始めてから終えるまでです。"
stakes: "キャッシュゲームのブラインドの額、またはトーナメントのバイインの額です。「マイクロステークス」は最も低いレベルです。"
standard-deviation: "結果のばらつきを示す尺度（分散の平方根）です。ポーカーでは通常bb/100で表します。"
risk-of-ruin: "同じステークスでプレイを続けた場合に、いつかバンクロールをすべて失う確率です。"
mental-game: "ポーカーの心理面で、ティルト、感情、テーブルでの集中への対処を指します。"
tournament: "一定時間ごとにブラインドが上がり、1人のプレイヤーがすべてのチップを集めるまで続く形式です。賞金は上位のプレイヤーが受け取ります。"
push-fold: "ショートスタック向けの単純化した戦略で、フロップ前はオールインかフォールドのどちらかだけを選びます。"
shove: "オールインするプレイで、通常はフロップ前のレイズとして行います。"
icm: "賞金構造と全プレイヤーのスタックを考慮して、トーナメントのチップを金銭的な価値に換算するモデルです。"
bubble: "トーナメントで入賞圏のすぐ手前の段階で、賞金圏に入るまであと数人の脱落が必要なときです。"
bubble-factor: "ICMから得られる指標で、トーナメントで同じ数のチップを失う痛手が、得る利益よりどれだけ大きいかを示します。"
cover: "相手と同じかそれ以上のチップを持っていることです。相手にカバーされているとき、その相手にオールインで負けるとトーナメントが終わります。"
risk-premium: "トーナメントでオールインのリスクを取るために、ポットオッズが求める以上に必要な追加のエクイティです。負けたときの損失が、勝ったときの利益より大きいためです。"
m-ratio: "スタックを1ハンドのブラインドとアンティの合計で割った値で、プレイしなくてもチップが何周（オービット）分もつかを示します。"
red-zone: "Mがとても低いゾーンで、主にオールインかフォールドしか残りません。"
green-zone: "Mが高いゾーンで、スタックに余裕があり、自由に、慎重にも積極的にもプレイできます。"
ante: "配る前に全プレイヤーがポットに入れる、少額の強制的な支払いです（主にトーナメント）。"
bb-ante: "全プレイヤーの代わりに、ビッグブラインドのプレイヤーがテーブル全体のアンティを払う形式です。"
fold-equity: "相手がフォールドする可能性から生まれる、プレイの価値の一部です。"
gap-concept: "オープンにコールするには、自分でオープンするより強い手が必要だという原則です。"
chip-ev: "お金に換算せずに（ICMなしで）チップで計算した、プレイの期待値です。"
tournament-equity: "その賞金構造とスタックのもとで期待できる、プライズプールの自分の取り分です。「$EV」とも呼ばれます。"
prize-pool: "トーナメントで賞金を得るプレイヤーの間で分けられるお金の合計です。"
payout: "トーナメントの特定の順位に対する賞金です。すべて合わせて賞金の配分になります。"
pay-jump: "トーナメントで隣り合う順位の間の賞金の差です。差が大きいほどリスクプレミアムが大きくなります。"
final-table: "トーナメントの最後のテーブルで、最も高い賞金を争います。"
short-stack: "ブラインドに比べて小さいスタックです。トーナメントでは通常、ビッグブラインドがわずかしか残っていない状態を指します。"
nash-equilibrium: "どのプレイヤーも自分の戦略だけを変えても得をしない、戦略の組み合わせです。"
overcall: "前のプレイヤーがすでにコールしたベットにコールすることです。"
heads-up: "1対1のプレイで、テーブルまたはハンドに2人のプレイヤーだけが残った状態です。"
dead-money: "もうポットを獲得できないプレイヤーがポットに入れたチップです。例：フォールドしたプレイヤーのチップ。"
stack-off: "1つのハンドでスタックをすべてポットに入れること、つまりオールインするか、オールインにコールすることです。"
exploit: "相手、またはプレイヤー層全体の特定のミスを突くために、基本の戦略から意図的に外れることです。"
hud: "オンラインプレイでテーブルに重ねて表示され、以前にプレイしたハンドから相手の統計を示すツールです。"
vpip: "HUDの統計で、フロップ前にプレイヤーが自分の意思でポットにお金を入れる（コールまたはレイズする）ハンドの割合です。"
pfr: "HUDの統計で、プレイヤーがフロップ前にレイズするハンドの割合です。"
wtsd: "HUDの統計で、フロップを見たプレイヤーがショーダウンまで行く頻度です。"
nit: "とてもタイトなプレイヤーで、ほぼ強い手だけでポットに参加します。"
regular: "そのステークスに常にいて、多くのハンドをプレイするプレイヤーです。このコースではレクリエーショナルプレイヤーと対比します。"
tag: "タイトアグレッシブなスタイルで、プレイする手は少ないものの、積極的に（ベットやレイズで）プレイします。"
lag: "ルースアグレッシブなスタイルで、多くの手を積極的にプレイします。"
recreational: "楽しみのためにプレイし、通常はレギュラーより弱いプレイヤーです。俗語では見下して「フィッシュ」と呼ばれます。"
calling-station: "弱い手やドローでも、とても頻繁にコールするプレイヤーを見下した呼び方です。"
maniac: "何でもベットやレイズする、とてもルースでアグレッシブなプレイヤーを見下した呼び方です。"
rake: "カジノやオンラインのポーカールームが、ゲーム運営の対価としてポットから取る手数料です。"
rake-cap: "ポーカールームが1つのハンドから取れるレーキの上限額です。"
