  groups: *g-bb-vs-sb

# M11: push/fold heads-up (mały blind kontra duży blind) z pliku pushfold.json, policzonego skryptem
# tools/preflop-solver/scripts/pushfold-ranges.ts na drzewie zwalidowanym z równowagą Nasha (dokument 10: 10bb bez ante).
# Gra tylko all-in albo pas (uproszczenie: pełne solvery przy tych stackach część rąk limpują albo podbijają minimalnie).
- id: push.sb-5
  title: "{{t:small-blind|スモールブラインド}}、スタック5bb、全員が{{t:fold|フォールド}}しました。オールインですか、{{t:fold}}ですか？"
  hero: SB
  solver: pushfold.json
  path: "5bb|"
  groups: { "オールイン": ["all-in"] }
- id: push.sb-10
  title: "{{t:small-blind|スモールブラインド}}、スタック10bb、全員が{{t:fold|フォールド}}しました。オールインですか、{{t:fold}}ですか？"
  hero: SB
  solver: pushfold.json
  path: "10bb|"
  groups: { "オールイン": ["all-in"] }
- id: push.sb-15
  title: "{{t:small-blind|スモールブラインド}}、スタック15bb、全員が{{t:fold|フォールド}}しました。オールインですか、{{t:fold}}ですか？"
  hero: SB
  solver: pushfold.json
  path: "15bb|"
  groups: { "オールイン": ["all-in"] }
- id: push.sb-10-ante
  title: "{{t:small-blind|スモールブラインド}}、スタック10bb、{{t:big-blind}}が1bbのアンティを支払い、全員が{{t:fold|フォールド}}しました。オールインですか、{{t:fold}}ですか？"
  hero: SB
  solver: pushfold.json
  path: "10bb-ante|"
  groups: { "オールイン": ["all-in"] }
- id: call.bb-5
  title: "{{t:big-blind|ビッグブラインド}}、スタック5bb。{{t:small-blind|スモールブラインド}}がオールインしました。{{t:call|コール}}しますか、{{t:fold|フォールド}}しますか？"
  hero: BB
  solver: pushfold.json
  path: "5bb|SB:allin"
  groups: { "{{t:call|コール}}": ["call"] }
- id: call.bb-10
  title: "{{t:big-blind|ビッグブラインド}}、スタック10bb。{{t:small-blind|スモールブラインド}}がオールインしました。{{t:call|コール}}しますか、{{t:fold|フォールド}}しますか？"
  hero: BB
  solver: pushfold.json
  path: "10bb|SB:allin"
  groups: { "{{t:call|コール}}": ["call"] }
- id: call.bb-15
  title: "{{t:big-blind|ビッグブラインド}}、スタック15bb。{{t:small-blind|スモールブラインド}}がオールインしました。{{t:call|コール}}しますか、{{t:fold|フォールド}}しますか？"
  hero: BB
  solver: pushfold.json
  path: "15bb|SB:allin"
  groups: { "{{t:call|コール}}": ["call"] }
- id: call.bb-10-ante
  title: "{{t:big-blind|ビッグブラインド}}、スタック10bb、あなたは1bbのアンティを支払いました。{{t:small-blind|スモールブラインド}}がオールインしました。{{t:call|コール}}しますか、{{t:fold|フォールド}}しますか？"
  hero: BB
  solver: pushfold.json
  path: "10bb-ante|SB:allin"
  groups: { "{{t:call|コール}}": ["call"] }

# M11, trzech graczy (Button, mały blind, duży blind), stacki po 7,5bb, bez ante, gra o żetony: z pliku pushfold.json
# (drzewo src/pushfold3.ts). Zwalidowane z opublikowaną równowagą: Ganzfried i Sandholm, AAMAS 2008, tabele 11–16
# („single hand”, stacki 4500 przy blindach 300/600); skrypt tools/preflop-solver/scripts/pushfold3-validate.ts.
# Częstości węzłów zgodne z artykułem w granicach 1,2 pp. Klasy niepewne: ręce, w których poprawna odpowiedź w zadaniu
# różni się od artykułu (nie pojawiają się w rangeDecision, w malowaniu liczą się jak ręce mieszane). Inne głębokości
# trzyosobowe nie mają celu walidacji, więc ich nie pokazujemy (ADR-24).
- id: push.btn-3max
  title: "ボタン、3人、スタックは各7.5bb。オールインしますか、{{t:fold|フォールド}}しますか？"
  hero: BTN
  solver: pushfold.json
  path: "3max-7.5bb|"
  groups: { "オールイン": ["all-in"] }
  uncertain: [T9o]
- id: push.sb-3max
  title: "{{t:small-blind|スモールブラインド}}、3人、スタックは各7.5bb、ボタンが{{t:fold|フォールド}}しました。オールインですか、{{t:fold}}ですか？"
  hero: SB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:fold"
  groups: { "オールイン": ["all-in"] }
  uncertain: [T3s, 63s, Q3o]
- id: call.sb-vs-btn-3max
  title: "{{t:small-blind|スモールブラインド}}、3人、スタックは各7.5bb。ボタンがオールインし、あなたの後ろにはまだ{{t:big-blind}}がいます。{{t:call|コール}}しますか、{{t:fold|フォールド}}しますか？"
  hero: SB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:allin"
  groups: { "{{t:call|コール}}": ["call"] }
  uncertain: [A4o]
- id: call.bb-vs-btn-3max
  title: "{{t:big-blind|ビッグブラインド}}、3人、スタックは各7.5bb。ボタンがオールインし、{{t:small-blind}}が{{t:fold|フォールド}}しました。{{t:call|コール}}しますか、{{t:fold|フォールド}}しますか？"
  hero: BB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:allin,SB:fold"
  groups: { "{{t:call|コール}}": ["call"] }
  uncertain: [Q5s]
- id: call.bb-vs-two-3max
  title: "{{t:big-blind|ビッグブラインド}}、3人、スタックは各7.5bb。ボタンがオールインし、{{t:small-blind}}が{{t:call|コール}}しました。{{t:call|コール}}しますか、{{t:fold|フォールド}}しますか？"
  hero: BB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:allin,SB:call"
  groups: { "{{t:call|コール}}": ["call"] }
  uncertain: [A4s, KTo]
