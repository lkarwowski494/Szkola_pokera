# Nazwane spoty zakresów do lekcji i zadań. Liczby pochodzą wyłącznie z preflop-6max-100bb.json (solver, ADR-20).
# path = ścieżka akcji w drzewie solvera; groups = akcje pokazywane w siatce (reszta to pas).
# Tylko spoty, które przeszły walidację (meta.summary w preflop-6max-100bb.json, dokument 10 na Drive). Gra wobec 3-betu wróci po poprawie modelu.
# CO vs UTG: częstość 3-betu zgodna od wersji 2 solvera, ale skład zakresu (liniowy, bez blefów, z wąskim sprawdzaniem)
# odbiega od publicznych solverów — czeka na decyzję. BB vs UTG i pule z dołączeniem BB czekają na cele walidacyjne.

# Klasy niepewne (audyt 4.10.2026, K6 opcja B; skrócone z 34 do 13 klas po przejściu na solver v3c 5.10.2026,
# dokument 10): w tych rękach kanon odbiega od publicznych tabel otwarć solvera. Nie pojawiają się w zadaniach
# rangeDecision, a w malowaniu zakresu liczą się jak ręce mieszane (zaliczone w obie strony). Jedna lista (kotwica
# &uncertain-rfi), spoty zakresów otwarć (M3) tylko się do niej odwołują.
- id: rfi.utg
  title: "{{t:utg}}、まだ誰もポットに参加していません"
  hero: UTG
  path: ""
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: &uncertain-rfi [
    # solver v3c (5.10.2026, dokument 10 „Pomiary v3c”): klasy, w których kanon w co najmniej jednej pozycji różni się
    # od opublikowanych tabel solvera o 50 pp lub więcej; ręce w kolorze z luką
    65s, 75s, T8s, 97s, 86s, 53s, 85s,
    # słabe ręce w różnych kolorach
    A8o, A4o, K8o, K7o, Q8o, 98o,
  ]
- id: rfi.hj
  title: "{{t:hijack|HJ}}、前の全員が{{t:fold|フォールド}}しました"
  hero: HJ
  path: "UTG:fold"
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: rfi.co
  title: "{{t:cutoff|CO}}、前の全員が{{t:fold|フォールド}}しました"
  hero: CO
  path: "UTG:fold,HJ:fold"
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: rfi.btn
  title: "ボタン、前の全員が{{t:fold|フォールド}}しました"
  hero: BTN
  path: "UTG:fold,HJ:fold,CO:fold"
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: rfi.sb
  title: "{{t:small-blind|スモールブラインド}}、全員が{{t:fold|フォールド}}し、{{t:big-blind|ビッグブラインド}}との対戦です"
  hero: SB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:fold"
  groups: { "3bbに{{t:raise|レイズ}}": ["raise 3"] }
  uncertain: *uncertain-rfi

- id: vs-open.btn-vs-co
  title: "ボタン、{{t:cutoff|CO}}が2.5bbに{{t:open|オープン}}しました"
  hero: BTN
  path: "UTG:fold,HJ:fold,CO:raise2.5"
  # jedna grupa „gram” (decyzja A2 koordynatora 5.10.2026, dokument 10): solver v3c prawie nie sprawdza w tym spocie
  # (sprawdzenie 0% wobec 5–9% w źródłach), więc podziału 3-bet / sprawdzenie nie oceniają ani siatka, ani tryb gry (M13);
  # lekcja uczy go regułą R-M4-005 z liczbami z dwóch opublikowanych rozwiązań solvera
  groups: &g-btn-vs-co { "プレイ（7.5bbに3ベットか{{t:call|コール}}）": ["raise 7.5", "call 2.5"] }
  # klasy niepewne: kanon różni się od opublikowanych tabel solvera (defense/btn-vs-co, NL500, 100bb) w „gram / pas” o 50 pp lub więcej
  # (dokument 10, „Pomiary v3c”); w zadaniach się nie pojawiają, w malowaniu są zaliczane w obie strony
  uncertain: &u-btn-vs-co [A9s, A8s, A7s, A6s, A3s, A2s, K9s, K8s, Q9s, T7s, 98s, 97s, 87s, 75s, 65s, AJo, ATo, "44", "33", "22"]
  # błędny rozmiar przy dobrej akcji = „niedokładność” (B-015, decyzja właściciela 3 października 2026)
  wrongSizes: &w-btn-vs-co
    "プレイ（7.5bbに3ベットか{{t:call|コール}}）":
      - { text: "{{n:pf.3bet.oop-total}}に3ベット", why: "これは{{t:out-of-position|アウトオブポジション}}でのサイズです。{{t:in-position|インポジション}}では{{t:open|オープン}}の約{{n:pf.3bet.size-ip}}に{{t:raise|レイズ}}します。つまり{{n:pf.3bet.ip-total}}までです。" }
- id: vs-open.sb-vs-btn
  title: "{{t:small-blind|スモールブラインド}}、ボタンが2.5bbに{{t:open|オープン}}しました"
  hero: SB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:raise2.5"
  # „3-bet / pas” (decyzja właściciela 4 października 2026, B-045): solvery grają tu 3-bet albo pas, a łączna częstość
  # i skład 3-betu kanonu zgadzają się z opublikowanym rozwiązaniem solvera (Crush 3-Bet Pots OOP, SB vs BTN 14%) poza rękami niżej.
  # Sprawdzenia kanonu (solver v3c: ok. 0,5%) liczą się w siatce jako pas.
  groups: &g-sb-vs-btn { "10bbに3ベット": ["raise 10"] }
  # Klasy niepewne tego spotu (przeliczone dla solvera v3c 5.10.2026, dokument 10 „Pomiary v3c”): częstość 3-betu
  # kanonu różni się od opublikowanych tabel solvera (defense/sb-vs-btn, NL500, 100bb) o 50 pp lub więcej. W zadaniach się nie
  # pojawiają, w malowaniu są zaliczane w obie strony.
  uncertain: &u-sb-vs-btn [A8s, A7s, A6s, A4s, A3s, K8s, Q9s, T9s, 98s, 75s, ATo]
- id: vs-open.bb-vs-btn
  title: "{{t:big-blind|ビッグブラインド}}、ボタンが2.5bbに{{t:open|オープン}}し、{{t:small-blind}}が{{t:fold|フォールド}}しました"
  hero: BB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:raise2.5,SB:fold"
  groups: &g-bb-vs-btn { "ディフェンス（{{t:call|コール}}か3ベット）": ["call 2.5", "raise 10"] }
- id: vs-open.bb-vs-sb
  title: "{{t:big-blind|ビッグブラインド}}、{{t:small-blind}}が3bbに{{t:open|オープン}}しました"
  hero: BB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:fold,SB:raise3"
  # jedna grupa „bronię”: podział 3-bet / sprawdzenie w tym spocie nie przeszedł walidacji (solver v3c: 3-bet 25,7%
  # wobec 15–19% w źródłach, odstępstwo od K1, dokument 10), więc ani siatka, ani ocena w trybie gry (M13) go nie oceniają
  groups: &g-bb-vs-sb { "ディフェンス（{{t:call|コール}}か3ベット）": ["call 3", "raise 9"] }

# Stół 9-osobowy, 100bb (tryb gry M13; dokument 10, „Pomiar N9a końcowy”): plik preflop-9max-100bb.json. Otwarcia UTG,
# UTG+1 i UTG+2 policzył solver 9-max (walidacja częściowa N1–N4: łączne częstości; składu nie walidowaliśmy, N5), więc
# każdy z tych spotów ma jedną grupę „przebicie” (gram / pas). Klasy niepewne: ręce, których częstość gry zmieniała się
# o 10 pp lub więcej między iteracjami 2820, 3300, 3820 i 3940 (skład jeszcze niestabilny). Po pasach UTG–UTG+2 gra jest
# dokładnie grą 6-max (LJ = UTG w 6-max), więc spoty LJ…BB mają te same grupy i klasy niepewne co spoty 6-max wyżej.
# Odpowiedzi na otwarcia z UTG–UTG+2 nie mają celów walidacji, więc spotów nie mają (boty grają tam heurystykami).
- id: nine.rfi.utg
  title: "9人テーブルの{{t:utg}}、まだ誰もポットに参加していません"
  hero: UTG
  solver: preflop-9max-100bb.json
  path: ""
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: [A4s, KTs, T9s]
- id: nine.rfi.utg1
  title: "9人テーブルの{{t:utg|UTG}}+1、{{t:utg}}が{{t:fold|フォールド}}しました"
  hero: UTG+1
  solver: preflop-9max-100bb.json
  path: "UTG:fold"
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: ["55", K9s]
- id: nine.rfi.utg2
  title: "9人テーブルの{{t:utg|UTG}}+2、前の全員が{{t:fold|フォールド}}しました"
  hero: UTG+2
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold"
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
- id: nine.rfi.lj
  title: "9人テーブルのLJ、前の全員が{{t:fold|フォールド}}しました"
  hero: LJ
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold"
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: nine.rfi.hj
  title: "9人テーブルの{{t:hijack|HJ}}、前の全員が{{t:fold|フォールド}}しました"
  hero: HJ
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold"
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: nine.rfi.co
  title: "9人テーブルの{{t:cutoff|CO}}、前の全員が{{t:fold|フォールド}}しました"
  hero: CO
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold"
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: nine.rfi.btn
  title: "9人テーブルのボタン、前の全員が{{t:fold|フォールド}}しました"
  hero: BTN
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold"
  groups: { "2.5bbに{{t:raise|レイズ}}": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: nine.rfi.sb
  title: "9人テーブルの{{t:small-blind|スモールブラインド}}、全員が{{t:fold|フォールド}}しました"
  hero: SB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:fold"
  groups: { "3bbに{{t:raise|レイズ}}": ["raise 3"] }
  uncertain: *uncertain-rfi
- id: nine.vs-open.btn-vs-co
  title: "9人テーブルのボタン、{{t:cutoff|CO}}が2.5bbに{{t:open|オープン}}しました"
  hero: BTN
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:raise2.5"
  groups: *g-btn-vs-co
  uncertain: *u-btn-vs-co
  wrongSizes: *w-btn-vs-co
- id: nine.vs-open.sb-vs-btn
  title: "9人テーブルの{{t:small-blind|スモールブラインド}}、ボタンが2.5bbに{{t:open|オープン}}しました"
  hero: SB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:raise2.5"
  groups: *g-sb-vs-btn
  uncertain: *u-sb-vs-btn
- id: nine.vs-open.bb-vs-btn
  title: "9人テーブルの{{t:big-blind|ビッグブラインド}}、ボタンが2.5bbに{{t:open|オープン}}し、{{t:small-blind}}が{{t:fold|フォールド}}しました"
  hero: BB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:raise2.5,SB:fold"
