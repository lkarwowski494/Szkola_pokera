royal-flush: "Tay bài cao nhất trong poker: A, K, Q, J và 10 cùng chất, ví dụ A♠ K♠ Q♠ J♠ T♠."
straight-flush: "Năm lá liên tiếp cùng chất, ví dụ 5♥ 6♥ 7♥ 8♥ 9♥. Dạng cao nhất (từ A xuống 10) có tên riêng và là tay bài mạnh nhất trong trò chơi."
four-of-a-kind: "Bốn lá cùng hạng, ví dụ bốn lá 7. Khi hai người có tứ quý cùng hạng, người có lá thứ năm (kicker) cao hơn thắng."
full-house: "Bộ ba và một đôi trong cùng một tay bài, ví dụ ba lá Q và hai lá 5. Giữa hai cù lũ, cù lũ có bộ ba cao hơn thắng."
flush: "Năm lá cùng chất (♠, ♥, ♦ hoặc ♣) không liên tiếp nhau. Giữa hai tay bài như vậy, tay có lá cao nhất lớn hơn thắng; nếu bằng nhau thì xét lá cao tiếp theo."
straight: "Năm lá liên tiếp, không phải cả năm cùng một chất, ví dụ 5-6-7-8-9. Lá A có thể là lá cao nhất (A-K-Q-J-T) hoặc thấp nhất (A-2-3-4-5)."
three-of-a-kind: "Ba lá cùng hạng và hai lá khác. Trong hold'em có hai dạng mang tên riêng: set, khi đôi nằm trên tay và lá thứ ba trên board, và trips, khi đôi nằm trên board và lá thứ ba trên tay."
set: "Bộ ba tạo từ một đôi trên tay và một lá trên board, ví dụ 7♣ 7♦ trên flop K-7-2."
two-pair: "Hai đôi khác nhau và một lá thứ năm, ví dụ K-K-8-8-3. Khi hòa, xét đôi cao hơn trước, rồi đến đôi thấp hơn, cuối cùng là lá thứ năm."
pair: "Hai lá cùng hạng và ba lá khác, ví dụ hai lá 9. Chỉ có mậu thầu là yếu hơn."
high-card: "Tay bài không có đôi hay tổ hợp nào tốt hơn; sức mạnh do lá cao nhất quyết định, nếu hòa thì xét các lá tiếp theo."
kicker: "Lá cao nhất nằm ngoài tổ hợp bài, dùng để phân định khi hòa. Ví dụ: đôi A kèm K thắng đôi A kèm Q."
wheel: "Sảnh thấp nhất: A-2-3-4-5, trong đó A được tính là lá thấp nhất."
check: "Tiếp tục chơi mà không bỏ thêm chip, chỉ được khi bạn không phải bù thêm gì: chưa ai cược trong vòng cược này (trước flop, big blind có thể check khi không ai tố). Đừng nhầm với theo (call), tức là bỏ chip để theo cược của đối thủ."
bet: "Lần bỏ chip đầu tiên trong một vòng cược mà chưa ai cược (theo nghĩa rộng, mọi lần bỏ chip vào pot đều gọi là cược)."
call: "Bỏ vào pot đúng bằng mức cược hoặc mức tố của đối thủ để tiếp tục chơi. Đừng nhầm với check, tức là tiếp tục chơi mà không cược khi chưa ai cược."
raise: "Nâng mức cược lên trên lần cược của đối thủ; những người còn lại phải bù phần chênh lệch, tố tiếp hoặc bỏ bài."
fold: "Bỏ ván bài: bạn trả bài và mất những gì đã bỏ vào pot."
check-raise: "Bạn check trước, rồi khi đối thủ cược thì bạn tố trong cùng vòng cược."
all-in: "Đặt toàn bộ chip của mình. Khi đó từ mỗi đối thủ bạn chỉ có thể thắng tối đa bằng số bạn đã bỏ vào; phần còn lại được tranh trong side pot."
pot: "Toàn bộ chip đã đặt trong ván bài hiện tại. Người có tay bài tốt nhất ở showdown nhận pot (khi có side pot thì từng pot được phân định riêng), hoặc người còn lại khi tất cả những người khác đã bỏ bài."
side-pot: "Pot riêng hình thành khi có người all-in: chỉ những người bỏ vào nhiều hơn người all-in mới tranh pot này, nên người all-in không thể thắng nó."
split-pot: "Tình huống những người có tay bài bằng nhau chia nhau pot, ví dụ khi cả hai cùng chơi một sảnh nằm sẵn trên board."
playing-the-board: "Tình huống tay bài năm lá tốt nhất của bạn chỉ gồm các lá bài chung; bài tẩy không thêm được gì, nên tốt nhất bạn chỉ chia pot."
board: "Các lá bài chung ngửa ở giữa bàn (flop, turn, river) mà mọi người chơi đều dùng. Board ở đây là các lá bài, không phải chiếc bàn bạn ngồi chơi."
community-cards: "Các lá bài được chia ngửa ở giữa bàn, mọi người chơi đều có thể dùng để tạo tay bài; trong hold'em có năm lá."
hole-cards: "Hai lá bài úp bạn nhận khi bắt đầu ván trong hold'em; chỉ mình bạn nhìn thấy chúng."
small-blind: "Khoản cược bắt buộc nhỏ hơn, do người ngồi bên trái button đặt trước khi chia bài (khi chỉ có hai người chơi thì do chính button đặt); vị trí này cũng mang tên đó."
big-blind: "Khoản cược bắt buộc lớn hơn, do người thứ hai bên trái button đặt trước khi chia bài (khi chỉ có hai người chơi thì do người đối diện button đặt); vị trí này cũng mang tên đó. Nó còn được dùng làm đơn vị đo stack và kết quả."
chips: "Những đĩa tròn nhỏ dùng để chơi tại bàn; trong cash game chúng đại diện cho tiền, trong giải đấu là điểm giải đấu."
stack: "Toàn bộ chip người chơi có trước mặt; thường tính bằng big blind (ví dụ 100 big blind)."
street: "Tên gọi lóng của vòng cược: preflop, flop, turn và river là bốn street. Ví dụ: “value ba street” là các lần cược lấy giá trị ở flop, turn và river."
betting-round: "Giai đoạn của ván bài trong đó người chơi lần lượt check, cược, theo, tố hoặc bỏ bài; trong hold'em có bốn vòng: preflop, flop, turn và river."
preflop: "Vòng cược đầu tiên: sau khi chia bài tẩy, trước khi flop được lật ra."
flop: "Ba lá bài chung đầu tiên, lật cùng lúc sau vòng cược preflop; vòng cược thứ hai cũng gọi là flop."
turn: "Lá bài chung thứ tư và vòng cược thứ ba."
river: "Lá bài chung thứ năm, cũng là lá cuối cùng, và vòng cược cuối cùng trước showdown."
showdown: "Lật bài sau vòng cược cuối khi còn ít nhất hai người trong ván; tay bài tốt nhất nhận pot."
position: "Chỗ ngồi tại bàn so với button, quyết định thứ tự hành động. Ai hành động sau thì thấy được nhiều hành động của đối thủ hơn trước khi quyết định."
in-position: "Tình huống của người chơi hành động cuối cùng sau flop, nên thấy hành động của đối thủ trước khi quyết định."
out-of-position: "Tình huống của người chơi hành động trước đối thủ sau flop, nên phải quyết định mà chưa biết đối thủ sẽ làm gì."
early-position: "Các vị trí hành động đầu tiên trước flop (ví dụ UTG); phía sau bạn còn nhiều người chơi."
late-position: "Các vị trí hành động cuối cùng: button và các vị trí ngay trước nó, nhất là cutoff."
utg: "Người hành động đầu tiên trước flop, ngồi ngay bên trái big blind."
hijack: "Vị trí ngay trước cutoff, tức là vị trí thứ hai bên phải button."
cutoff: "Vị trí ngay bên phải button, hành động ngay trước button."
button: "Vị trí của người chia bài, được đánh dấu bằng nút tròn “dealer”. Sau flop, vị trí này hành động cuối cùng trong mọi vòng cược."
outs: "Lá bài còn trong bộ bài sẽ cải thiện tay bài của bạn, thường là hoàn thành một bài chờ. Ví dụ: với bài chờ thùng, out là những lá còn lại cùng chất với bạn."
draw: "Tay bài chưa phải tổ hợp mạnh nhưng có thể thành tổ hợp mạnh với các lá bài chung tiếp theo, ví dụ khi còn thiếu một lá để có thùng hoặc sảnh."
flush-draw: "Bốn lá cùng chất (tính chung trên tay và trên board); còn thiếu một lá để có thùng."
straight-draw: "Bốn lá còn thiếu một lá để thành sảnh. Các dạng: OESD (thiếu một lá ở một trong hai đầu) và gutshot (thiếu một lá ở giữa)."
oesd: "Viết tắt của open-ended straight draw: bài chờ sảnh gồm bốn lá liên tiếp, được hoàn thành bởi lá ở một trong hai đầu, ví dụ 5-6-7-8 chờ lá 4 hoặc lá 9."
gutshot: "Bài chờ sảnh thiếu đúng một hạng cụ thể ở giữa, ví dụ 5-6-8-9 chỉ chờ lá 7."
backdoor: "Bài chờ ở flop cần hai lá phù hợp liên tiếp, ở turn và ở river, ví dụ ba lá cùng chất sau flop."
pot-odds: "Tỷ lệ giữa số chip bạn phải bỏ thêm và pot bạn có thể thắng (tính cả lần cược của đối thủ). Nó cho biết bạn cần thắng thường xuyên đến mức nào để việc theo có lời."
implied-odds: "Pot odds cộng thêm số chip bạn dự kiến thắng ở các street sau nếu bạn ra được tay bài của mình."
equity: "Cơ hội thắng pot của bạn nếu tất cả các lá còn lại được chia ra mà không cược thêm; thường tính bằng phần trăm."
equity-realization: "Mức độ một tay bài biến equity của nó thành tiền thắng khi việc cược còn tiếp diễn (có thể hiện thực hóa ít hơn hoặc nhiều hơn equity của nó); phụ thuộc vào vị trí, độ dễ chơi của tay bài và các yếu tố khác."
expected-value: "Kết quả trung bình của một nước đi nếu lặp lại nó nhiều lần. Nước đi có lời trung bình sẽ kiếm tiền về lâu dài, kể cả khi lần này thua."
combo: "Một tổ hợp cụ thể của hai lá bài kèm chất, ví dụ A♠ K♥. Đếm các tổ hợp này cho thấy thực sự có bao nhiêu tay bài nhất định trong range."
range: "Tập hợp tất cả các tay bài mà người chơi có thể có trong một tình huống, hoặc các tay bài mà họ sẽ dùng để thực hiện một nước đi nhất định."
mixed-hand: "Tay bài mà chiến lược cân bằng lúc chọn nước đi này, lúc chọn nước đi khác (ví dụ lúc tố, lúc theo); cả hai nước đi đều đúng. Người ta cũng nói tay bài đó được chơi bằng chiến lược hỗn hợp."
open: "Vào pot trước flop bằng một lần tố khi tất cả những người trước bạn đã bỏ bài."
suited: "Hai lá bài tẩy cùng chất, ví dụ A♥ K♥ (ký hiệu AKs)."
offsuit: "Hai lá bài tẩy khác chất, ví dụ A♥ K♣ (ký hiệu AKo)."
pocket-pair: "Đôi tạo từ hai lá bài tẩy, ví dụ 8♣ 8♦ trước flop."
connectors: "Bài tẩy có hai hạng liền kề, ví dụ 8-7 hoặc 9-8; dễ tạo sảnh hơn."
3-bet: "Lần tố đầu tiên lên trên một lần mở cược trước flop; tên gọi tính big blind là lần cược thứ nhất và lần mở cược là lần thứ hai."
4-bet: "Tố lên trên một 3-bet, tức là lần cược thứ tư trong vòng cược."
limp: "Vào pot trước flop chỉ bằng cách theo big blind khi chưa ai tố."
isolation: "Tố sau một hoặc vài lần limp, để chơi tay đôi với người limp (thường là người chơi yếu hơn)."
texture: "Đặc điểm của các lá bài chung: có bao nhiêu chất, các lá có gần nhau không, có đôi không. Điều này quyết định những tay bài và bài chờ nào có thể xảy ra."
dry: "Board trên đó có thể có ít bài chờ và ít tay bài mạnh, ví dụ K♠ 7♦ 2♣."
wet: "Board trên đó có thể có nhiều bài chờ và tay bài mạnh, ví dụ J♥ T♥ 8♣."
rainbow: "Flop có ba lá thuộc ba chất khác nhau, nên ở flop không ai có bài chờ thùng."
two-tone: "Flop có hai lá cùng chất, nên có thể có bài chờ thùng."
monotone: "Flop có ba lá cùng chất, nên thùng có thể đã thành."
paired: "Board có một đôi (hai lá cùng hạng), ví dụ 8-8-3."
connected: "Board mà trên đó ai đó có thể đã có sảnh, ví dụ 9-8-7."
disconnected: "Board có các lá cách xa nhau, khó tạo sảnh hoặc bài chờ sảnh, ví dụ K-7-2."
semi-connected: "Board có bài chờ sảnh nhưng chưa thể có sảnh, ví dụ T-8-3 (cách phân loại dùng trong khóa học)."
wetness: "Mức độ board thuận lợi cho bài chờ và tay bài mạnh: từ khô đến ướt. Người ta cũng mô tả nó là mức độ phối hợp của board."
top-pair: "Đôi với lá cao nhất trên board, ví dụ K♠ Q♦ trên flop K-7-2."
second-pair: "Đôi với lá cao thứ hai trên board, ví dụ 7♠ 6♠ trên flop K-7-2."
overpair: "Pocket pair cao hơn mọi lá trên board, ví dụ Q-Q trên flop J-7-2."
c-bet: "Continuation bet (cược tiếp tục): lần cược của người chơi là người tấn công ở vòng trước, ví dụ cược ở flop sau khi mở cược preflop."
aggressor: "Người chơi cược hoặc tố sau cùng ở vòng cược trước."
initiative: "Vai trò của người tấn công sau cùng: người này thường là người thực hiện lần cược tiếp theo."
range-advantage: "Tình huống range của một người chơi có tổng equity trên board đó lớn hơn range của đối thủ."
nuts-advantage: "Tình huống một người chơi có tỷ lệ tay bài mạnh nhất trong range nhiều hơn đối thủ."
nuts: "Tay bài mạnh nhất có thể có trên một board tại một thời điểm. Ví dụ: trên board K♥ 9♥ 4♥ 2♣, đó là thùng có A cơ."
polarized: "Nói về range: chủ yếu gồm các tay bài rất mạnh và bluff, gần như không có tay bài trung bình."
polarization: "Xây dựng range từ hai thái cực: tay bài mạnh để lấy giá trị và bluff, không có tay bài trung bình."
linear: "Nói về range: xây từ trên xuống, từ các tay bài mạnh nhất trở xuống, không có nhóm bluff riêng. Bạn cũng sẽ gặp thuật ngữ liên quan “merged range” (range không phân cực); theo các phân tích solver đã công bố, merged là dạng trung gian giữa range này và range phân cực."
condensed: "Nói về range: không có các tay bài mạnh nhất (bị giới hạn phía trên) và chủ yếu gồm tay bài trung bình; ngược lại với range phân cực."
value: "Cược với tay bài mạnh để đối thủ theo bằng tay bài yếu hơn."
value-bet: "Một lần cược để lấy giá trị: đặt với tay bài mạnh để các tay bài yếu hơn theo."
bluff: "Cược với tay bài yếu khó thắng ở showdown, nhằm khiến đối thủ bỏ tay bài tốt hơn."
semi-bluff: "Cược với tay bài còn yếu nhưng có cơ hội cải thiện (ví dụ có bài chờ): bạn thắng nếu đối thủ bỏ bài hoặc nếu bạn ra bài."
blocker: "Lá bài trên tay bạn làm giảm khả năng đối thủ có một số tay bài nhất định. Ví dụ: khi bạn cầm A cơ, đối thủ không thể có thùng cơ với A."
bluff-catcher: "Tay bài chỉ thắng được bluff của đối thủ, còn thua các lần cược lấy giá trị của họ."
barrel: "Thêm một lần cược ở vòng cược kế tiếp sau lần cược của chính bạn ở vòng trước."
second-barrel: "Lần cược thứ hai liên tiếp: sau c-bet ở flop, người chơi cược tiếp ở turn."
probe-bet: "Lần cược ở turn của người chơi không có vị trí sau khi người tấn công preflop check ở flop thay vì c-bet."
donk-bet: "Lần cược của người chơi đặt cược trước khi người tấn công của vòng trước kịp hành động."
overbet: "Lần cược sau flop lớn hơn toàn bộ pot."
effective-stack: "Trong ván giữa hai người: stack nhỏ hơn trong hai stack, tức là mức tối đa thực tế có thể thắng hoặc thua. Khi có nhiều người chơi, nó được tính riêng cho từng cặp."
spr: "Stack hiệu dụng chia cho pot ở đầu một street (để lên kế hoạch cho ván bài, người ta tính ở flop); cho biết stack sâu đến mức nào so với pot (SPR càng thấp, mọi thứ càng nhanh vào pot)."
mdf: "Phần nhỏ nhất của range phải phòng thủ trước một lần cược để bluff của đối thủ bằng tay bài không có cơ hội không tự động có lời."
alpha: "Tần suất đối thủ phải bỏ bài để bluff bằng tay bài không có cơ hội hòa vốn; phụ thuộc vào kích thước lần cược so với pot."
variance: "Độ phân tán kết quả quanh giá trị kỳ vọng: ngay cả khi chơi tốt, các chuỗi ngắn vẫn có thể lỗ nặng hoặc lãi lớn."
buy-in: "Số tiền để tham gia một giải đấu hoặc ngồi vào bàn cash game."
bankroll: "Toàn bộ khoản dự trữ dành riêng để chơi poker; trong ứng dụng này được tính bằng số buy-in, không phải bằng tiền."
tilt: "Trạng thái trong đó cảm xúc (giận dữ, bực bội, hưng phấn) làm các quyết định của bạn tại bàn tệ đi."
winrate: "Kết quả trung bình của người chơi trên một mẫu dài; trong cash game thường tính bằng bb/100, tức là số big blind trên một trăm ván."
downswing: "Giai đoạn kết quả kém rõ rệt, thường là thua lỗ nhiều hơn so với trình độ; ngược lại với upswing."
session: "Một lần ngồi chơi poker, từ khi bắt đầu đến khi kết thúc."
stakes: "Mức blind trong cash game hoặc mức buy-in trong giải đấu; “micro stakes” là các mức thấp nhất."
standard-deviation: "Thước đo độ phân tán kết quả (căn bậc hai của phương sai); trong poker thường tính bằng bb/100."
risk-of-ruin: "Xác suất bạn sẽ có lúc mất toàn bộ bankroll nếu tiếp tục chơi ở cùng mức cược."
mental-game: "Khía cạnh tâm lý của poker: đối phó với tilt, cảm xúc và sự tập trung tại bàn."
tournament: "Hình thức chơi trong đó blind tăng sau mỗi khoảng thời gian và trò chơi tiếp tục đến khi một người có toàn bộ chip; giải thưởng dành cho những người xếp hạng cao nhất."
push-fold: "Chiến lược đơn giản hóa cho short stack: trước flop chỉ chọn all-in hoặc bỏ bài."
shove: "Nước all-in, thường là một lần tố trước flop."
icm: "Mô hình quy đổi chip giải đấu thành giá trị tiền, có tính đến cơ cấu trả thưởng và stack của mọi người chơi."
bubble: "Giai đoạn của giải đấu ngay trước các vị trí có thưởng, khi còn vài người nữa phải bị loại thì mới có người vào vùng nhận thưởng."
bubble-factor: "Chỉ số từ ICM: trong giải đấu, thua một lượng chip đau hơn bao nhiêu so với lợi ích khi thắng cùng lượng chip đó."
cover: "Có ít nhất bằng số chip của đối thủ. Khi đối thủ cover bạn, thua họ một ván all-in sẽ kết thúc giải đấu của bạn."
risk-premium: "Phần equity cần thêm ngoài mức pot odds yêu cầu để mạo hiểm all-in trong giải đấu, vì thua mất nhiều hơn so với thắng được."
m-ratio: "Stack chia cho tổng blind và ante trong một ván: số vòng bàn trọn vẹn (orbit) mà chip của bạn đủ trụ nếu không chơi."
red-zone: "Vùng M rất thấp: chủ yếu chỉ còn all-in hoặc bỏ bài."
green-zone: "Vùng M cao: stack cho phép bạn chơi thoải mái, thận trọng hoặc hung hăng."
ante: "Khoản bắt buộc nhỏ mà mọi người chơi bỏ vào pot trước khi chia bài (chủ yếu trong giải đấu)."
bb-ante: "Hình thức ante trong đó, thay vì mọi người chơi, người ở big blind trả ante cho cả bàn."
fold-equity: "Phần giá trị của một nước đi đến từ khả năng đối thủ bỏ bài."
gap-concept: "Nguyên tắc rằng để theo một lần mở cược cần tay bài mạnh hơn so với tự mình mở cược."
chip-ev: "Giá trị kỳ vọng của một nước đi tính bằng chip, không quy đổi ra tiền (không dùng ICM)."
tournament-equity: "Phần kỳ vọng của bạn trong tổng giải thưởng, với cơ cấu trả thưởng và các stack hiện có. Nó còn được gọi là “$EV”."
prize-pool: "Tổng số tiền được chia cho những người chơi đạt giải trong giải đấu."
payout: "Giải thưởng cho một thứ hạng cụ thể trong giải đấu; tất cả cộng lại tạo thành cơ cấu phân chia giải thưởng."
pay-jump: "Chênh lệch tiền thưởng giữa hai thứ hạng liền kề trong giải đấu; bước nhảy lớn làm tăng risk premium."
final-table: "Bàn cuối cùng của giải đấu, nơi tranh các giải thưởng cao nhất."
short-stack: "Stack nhỏ so với blind; trong giải đấu thường là khi chỉ còn ít big blind."
nash-equilibrium: "Một bộ chiến lược trong đó không người chơi nào có lợi hơn khi chỉ tự thay đổi chiến lược của mình."
overcall: "Theo một lần cược mà người trước bạn đã theo."
heads-up: "Chơi tay đôi: tại bàn hoặc trong ván chỉ còn hai người chơi."
dead-money: "Chip trong pot của những người chơi không còn khả năng thắng pot, ví dụ những người đã bỏ bài."
stack-off: "Bỏ toàn bộ stack vào pot trong một ván, tức là all-in hoặc theo all-in."
exploit: "Cố ý rời khỏi chiến lược nền tảng để tận dụng một lỗi cụ thể của đối thủ hoặc của cả nhóm người chơi."
hud: "Lớp hiển thị trên bàn chơi online, cho thấy số liệu thống kê về đối thủ từ các ván đã chơi trước đó."
vpip: "Chỉ số HUD: tỷ lệ phần trăm số ván mà người chơi tự nguyện bỏ tiền vào pot trước flop (theo hoặc tố)."
pfr: "Chỉ số HUD: tỷ lệ phần trăm số ván mà người chơi tố trước flop."
wtsd: "Chỉ số HUD: người chơi đã xem flop đi đến showdown thường xuyên đến mức nào."
nit: "Người chơi rất chặt, gần như chỉ vào pot với tay bài mạnh."
regular: "Người chơi thường xuyên ở một mức cược, chơi rất nhiều ván; trong khóa học được đặt đối lập với người chơi giải trí."
tag: "Lối chơi chặt và hung hăng: ít tay bài nhưng chơi hung hăng (cược và tố)."
lag: "Lối chơi lỏng và hung hăng: nhiều tay bài, chơi hung hăng."
recreational: "Người chơi để giải trí, thường yếu hơn những người chơi thường xuyên; trong tiếng lóng bị gọi một cách miệt thị là “fish”."
calling-station: "Cách gọi miệt thị người chơi theo rất thường xuyên, kể cả với tay bài yếu hoặc bài chờ."
maniac: "Cách gọi miệt thị người chơi rất lỏng và hung hăng, cược và tố với bất cứ bài gì."
rake: "Phí mà sòng bài hoặc phòng chơi online thu từ pot để tổ chức trò chơi."
rake-cap: "Mức rake tối đa mà phòng chơi có thể thu từ một ván."
