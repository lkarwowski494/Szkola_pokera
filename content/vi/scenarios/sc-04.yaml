# SC-04 (M3): UTG otwiera albo pasuje (range-spot rfi.utg), potem c-bet na suchym wysokim flopie (cbet-case R-M5-007). Rola 06, sesja EH,
# 2026-11-11. Struktura jak pl (content/pl/scenarios/sc-04.yaml); jeden poziom (D-1165).
id: sc-04
module: m3
situation: "Bạn ở {{t:utg|UTG}}, chưa ai vào ván; nếu bạn {{t:open|mở cược}}, {{t:big-blind|big blind}} sẽ {{t:call|theo}} và {{t:check|check}} trên flop."
table: 6max
positions: { hero: UTG, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [high], suits: [rainbow], ranks: [disconnected, semi-connected], oesdPossible: false }
    holding: [air]
    expected: ["raise 2.5", bet-small]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.utg
    rule: R-M3-002
    actions:
      - action: "raise 2.5"
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{w:stol}}, và chưa ai vào ván. Bạn {{t:open|mở cược}}, vì tay này nằm trong {{t:range|range}} hẹp từ {{t:utg|UTG}}: sau bạn vẫn còn năm người chơi, nên thường xuyên hơn sẽ có ai đó cầm tay bài tốt hơn; vì vậy từ {{t:utg|UTG}} bạn chỉ {{t:open|mở cược}} khoảng {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} số tay bài."
      - action: fold
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{w:stol}}, và chưa ai vào ván. {{t:fold|Bỏ bài}} là quá thận trọng: solver thường {{t:open|mở cược}} tay này ngay cả từ {{t:utg|UTG}}. Sau bạn vẫn còn năm người chơi, nên {{t:range|range}} từ {{t:utg|UTG}} hẹp, khoảng {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} số tay bài, nhưng tay này nằm trong đó."
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{t:board|board}} là {{w:stol}}, còn {{t:big-blind|big blind}} {{t:check|check}}. Bạn {{t:bet|cược}} nhỏ, khoảng {{n:cbet.size.small}} {{t:pot|pot}}, vì bạn có {{t:range-advantage|lợi thế range}}, còn các tay yếu của đối thủ hầu như không có cơ hội: một khoản {{t:bet|cược}} nhỏ là đủ để họ {{t:fold|bỏ bài}}."
      - action: check
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{t:board|board}} là {{w:stol}}, còn {{t:big-blind|big blind}} {{t:check|check}}. {{t:check|Check}} là chấp nhận được nhưng ít gặp hơn: trên flop cao và {{t:dry|khô}} bạn {{t:c-bet|c-bet}} thường xuyên và nhỏ, vì bạn có {{t:range-advantage|lợi thế range}}, còn các tay yếu của đối thủ đã {{t:fold|bỏ bài}} trước một khoản {{t:bet|cược}} nhỏ. Khi {{t:check|check}}, bạn cho họ một lá bài miễn phí."
      - action: bet-big
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{t:board|board}} là {{w:stol}}, còn {{t:big-blind|big blind}} {{t:check|check}}. Một khoản {{t:bet|cược}} lớn ở đây là thiếu chính xác: trên flop cao và {{t:dry|khô}} bạn thường {{t:c-bet|c-bet}} nhỏ, khoảng {{n:cbet.size.small}} {{t:pot|pot}}, vì các tay yếu của đối thủ đã {{t:fold|bỏ bài}} trước khoản {{t:bet|cược}} như vậy."
