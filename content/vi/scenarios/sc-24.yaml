    bluffShares: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5]
    actions:
      - action: call
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{t:board|board}} là {{w:stol}}, còn đối thủ ở {{w:rywal}} {{t:bet|cược}} ở river. Equity của bạn là tỉ lệ {{t:bluff|bluff}} trong các lần {{t:bet|cược}} của họ: bạn thắng mọi {{t:bluff|bluff}} và thua mọi tay {{t:value|lấy giá trị}}. {{t:call|Theo}} chỉ có lãi khi số {{t:bluff|bluff}} nhiều hơn mức equity cần thiết với khoản {{t:bet|cược}} này; khi ít hơn thì lỗ."
      - action: fold
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{t:board|board}} là {{w:stol}}, còn đối thủ ở {{w:rywal}} {{t:bet|cược}} ở river. Equity của bạn là tỉ lệ {{t:bluff|bluff}} trong các lần {{t:bet|cược}} của họ. {{t:fold|Bỏ bài}} chỉ đúng khi số {{t:bluff|bluff}} ít hơn mức equity cần thiết với khoản {{t:bet|cược}} này; khi nhiều hơn, {{t:fold|bỏ bài}} là từ bỏ một {{t:pot|pot}} mà ở đó {{t:call|theo}} có lãi. Với khoản {{t:bet|cược}} bằng {{t:pot|pot}}, phải có khoảng {{n:eq.bet-pot}} {{t:bluff|bluff}} thì {{t:call|theo}} mới hòa vốn."
