# sc-24: Vietnamese text of content/pl/scenarios/sc-24.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-24
module: m8
situation: "Ở river bạn có một {{t:pair|đôi}} chỉ thắng được các {{t:bluff|bluff}} của đối thủ, và đối thủ {{t:bet|cược}}. Giả sử tỉ lệ {{t:bluff|bluff}} trong các lần {{t:bet|cược}} của họ đúng như ván bài cho biết."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni, trudny]
bounds:
  latwy: { marginMin: 0.1, expected: [call] }
  sredni: { marginMin: 0.03, marginMax: 0.1, expected: [fold] }
  trudny: { marginMin: 0.02, marginMax: 0.05, expected: [call] }
decisions:
  - street: river
    kind: river-catch
    rule: R-M8-010
    pots: [10, 14, 20, 30]
