# SC-06 (M3): mały blind przebija albo pasuje, potem rozmiar przebicia (F1 + F3: range-spot rfi.sb, size-spot open-size z sb). Rola 06, sesja DU,
# 2026-11-11. Ocena: rangeVerdict na solverze projektu (R-M3-009, gto) i rozmiar z parametru R-M3-007 (zły rozmiar = niedokładność).
# Węzeł solvera rfi.sb nie ma limpu (raise-or-fold), więc zamiast no-limp z planu jest rozmiar (D-1032). Jeden poziom (D-1034).
id: sc-06
module: m3
situation: "Bạn ở {{t:small-blind|small blind}}, và mọi người đã {{t:fold|bỏ bài}} đến lượt bạn."
table: 6max
positions: { hero: SB, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { freqs: [{ min: 0.97, max: 1 }, null], expected: ["raise 3", raise] }
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.sb
    rule: R-M3-009
    actions:
      - action: "raise 3"
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{w:stol}}, và mọi người đã {{t:fold|bỏ bài}} đến lượt bạn. Bạn {{t:raise|tố}}, vì giờ bạn chỉ còn đấu với {{t:big-blind|big blind}}; sau flop bạn hành động trước, nên bạn {{t:open|mở}} rộng gần bằng từ Button, khoảng {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}} số tay bài, và tay này nằm trong đó."
      - action: fold
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{w:stol}}, và mọi người đã {{t:fold|bỏ bài}} đến lượt bạn. {{t:fold|Bỏ bài}} là quá thận trọng: solver thường {{t:raise|tố}} tay này. Giờ bạn chỉ còn đấu với {{t:big-blind|big blind}}, nên từ {{t:small-blind|small blind}} bạn {{t:open|mở}} rộng, khoảng {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}} số tay bài."
  - street: preflop
    kind: size-spot
    check: open-size
    rule: R-M3-007
    sb: true
    actions:
      - action: raise
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{w:stol}}, và bạn {{t:raise|tố}}. Bạn {{t:raise|tố}} lên {{n:pf.open-size-sb}}, vì từ {{t:small-blind|small blind}} bạn chơi {{t:out-of-position|không có vị trí}}, nên bạn tố nhiều hơn một chút so với {{n:pf.open-size}} từ các {{t:position|vị trí}} khác; một mức cho mọi tay bài không để lộ sức mạnh tay bài của bạn."
      - action: raise-small
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{w:stol}}, và bạn {{t:raise|tố}}. Mức này là thiếu chính xác: từ {{t:small-blind|small blind}} bạn chơi {{t:out-of-position|không có vị trí}}, nên bạn {{t:raise|tố}} nhiều hơn một chút, lên {{n:pf.open-size-sb}}."
      - action: raise-big
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{w:stol}}, và bạn {{t:raise|tố}}. Mức này là thiếu chính xác: {{n:pf.open-size-sb}} là đủ; một mức cho mọi tay bài không để lộ sức mạnh tay bài của bạn."
