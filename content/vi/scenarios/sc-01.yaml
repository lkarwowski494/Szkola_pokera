  sredni: { draws: [flush], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
  trudny: { draws: [flush], marginMin: 0, marginMax: 0.02, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
decisions:
  - street: flop
    kind: draw-call
    pots: [18, 20, 22, 24]
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{t:board|board}} là {{w:stol}}, còn đối thủ ở {{w:rywal}} {{t:bet|cược}} nhỏ so với {{t:pot|pot}}. Bạn {{t:call|theo}}, vì bạn chỉ trả tiền cho một lá, và {{t:flush-draw|bài chờ thùng}} trúng ở lá đó thường xuyên hơn mức mà giá thấp như vậy đòi hỏi. Bạn có {{n:outs.flush}} out, nên {{t:flush|thùng}} ra ở turn trong khoảng {{n:odds.flush.flop-turn}} trường hợp, nghĩa là khoảng một lá trong năm lá. Đây là cách đơn giản hóa: bạn chỉ đếm out của bài chờ.{{jesli:nadkarty}} Mỗi lá của bạn cao hơn bài trên bàn còn thêm tối đa {{n:pair.outs.per-rank}} out không chắc chắn để thành {{t:pair|đôi}}, nhưng ở đây điều đó không đổi câu trả lời.{{/jesli}}"
      - action: fold
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{t:board|board}} là {{w:stol}}, còn đối thủ ở {{w:rywal}} {{t:bet|cược}} nhỏ so với {{t:pot|pot}}. {{t:fold|Bỏ bài}} là bỏ đi một {{t:pot|pot}} mà việc {{t:call|theo}} mang lại lợi nhuận: trước mức {{t:bet|cược}} nhỏ như vậy, {{t:flush-draw|bài chờ thùng}} trúng thường xuyên hơn mức giá đòi hỏi. Hãy bỏ bài khi giá cao hơn cơ hội trúng, chứ không phải vì bạn chưa có tay bài hoàn chỉnh. Đây là cách đơn giản hóa: bạn chỉ đếm out của bài chờ.{{jesli:nadkarty}} Mỗi lá của bạn cao hơn bài trên bàn còn thêm tối đa {{n:pair.outs.per-rank}} out không chắc chắn để thành {{t:pair|đôi}}, nhưng ở đây điều đó không đổi câu trả lời.{{/jesli}}"
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{t:board|board}} là {{w:stol}}: turn không mang lại {{t:flush|thùng}}, còn đối thủ ở {{w:rywal}} lại {{t:bet|cược}} nhỏ. Bạn {{t:call|theo}}, vì đến river chỉ còn một lá, và với giá thấp như vậy {{t:flush-draw|bài chờ thùng}} vẫn trúng đủ thường xuyên. {{t:flush|Thùng}} ra ở river trong khoảng {{n:odds.flush.turn-river}} trường hợp, nghĩa là khoảng một lá trong năm lá. Đây là cách đơn giản hóa: bạn chỉ đếm out của bài chờ.{{jesli:nadkarty}} Mỗi lá của bạn cao hơn bài trên bàn còn thêm tối đa {{n:pair.outs.per-rank}} out không chắc chắn để thành {{t:pair|đôi}}, nhưng ở đây điều đó không đổi câu trả lời.{{/jesli}}"
      - action: fold
        explanation: "Bạn có {{w:reka}} ở vị trí {{w:pozycja}}, {{t:board|board}} là {{w:stol}}: turn không mang lại {{t:flush|thùng}}, còn đối thủ ở {{w:rywal}} lại {{t:bet|cược}} nhỏ. {{t:fold|Bỏ bài}} là quá chặt: ở turn bạn tính cơ hội cho một lá, và trước mức {{t:bet|cược}} nhỏ như vậy lá đó trúng thường xuyên hơn mức giá đòi hỏi, nên bạn bỏ đi một {{t:pot|pot}} mà việc {{t:call|theo}} mang lại lợi nhuận. Đây là cách đơn giản hóa: bạn chỉ đếm out của bài chờ.{{jesli:nadkarty}} Mỗi lá của bạn cao hơn bài trên bàn còn thêm tối đa {{n:pair.outs.per-rank}} out không chắc chắn để thành {{t:pair|đôi}}, nhưng ở đây điều đó không đổi câu trả lời.{{/jesli}}"
