# sc-01: Vietnamese text of content/pl/scenarios/sc-01.yaml (role 06, session BS, 2026-11-10); machine translation in session, for review by role 09.
id: sc-01
module: m2
situation: "Sau một {{t:3-bet|3-bet}}, bạn có {{t:flush-draw|bài chờ thùng}}, còn đối thủ {{t:bet|cược}} nhỏ ở flop và ở turn."
table: 6max
positions: { hero: BTN, villain: BB }
