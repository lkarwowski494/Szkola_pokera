# Pula egzaminacyjna M4 (gra wobec akcji preflop): reguły lekcji m4.l1–m4.l4, inne pozycje, ręce i rozmiary.
# Bez pytań o podział 3-bet/sprawdzenie w spotach BB vs SB i BTN vs CO (tam uczymy tylko gram/pas, ADR-26).
module: m4
drills:
  - kind: choice
    id: m4.exam.q1
    family: m4.3bet.size
    rules: [R-M4-002, R-M4-003]
    prompt: "{{t:cutoff|CO}} {{t:open|mở cược}} bằng cách {{t:raise|tố}} lên {{n:pf.open-size}}, Button {{t:fold|bỏ bài}}. Bạn ở {{t:small-blind|small blind}} và muốn tố thêm lần nữa ({{t:3-bet|3-bet}}). Bạn {{t:raise|tố}} lên bao nhiêu?"
    table: { hand: "Ad Kd", position: SB }
    options:
      - { text: "Lên {{n:pf.3bet.oop-total}}", correct: true, why: "Sau flop bạn sẽ hành động trước, nên bạn {{t:raise|tố}} khoảng {{n:pf.3bet.size-oop}} mức {{t:open|mở cược}}. Mức lớn hơn khiến {{t:cutoff|CO}} không thể {{t:call}} rẻ khi {{t:in-position}}." }
      - { text: "Lên {{n:pf.3bet.ip-total}}", sizeError: true, why: "Hành động đúng, nhưng đó là mức dành cho người chơi {{t:in-position}} ({{n:pf.3bet.size-ip}} mức {{t:open|mở cược}}). Từ {{t:small-blind|small blind}}, bạn {{t:raise|tố}} lên {{n:pf.3bet.oop-total}}." }
      - { text: "Chỉ {{t:call|theo}}", why: "Từ {{t:small-blind|small blind}} trước {{t:cutoff|CO}}, bạn gần như không {{t:call|theo}}: bạn sẽ chơi {{t:out-of-position}}, còn {{t:big-blind}} phía sau vẫn có thể {{t:raise|tố}}." }
  - kind: choice
    id: m4.exam.q2
    family: m4.sb.vs-open
    rules: [R-M4-003]
    prompt: "Button {{t:open|mở cược}} {{n:pf.open-size}}. Bạn ở {{t:small-blind|small blind}}. Bạn làm gì?"
    table: { hand: "8c 8d", position: SB }
    options:
      - { text: "3-bet", correct: true, why: "Trước Button, từ {{t:small-blind|small blind}} bạn 3-bet phần trên của {{t:range|range}}, khoảng {{n:pf.3bet-freq.sb-vs-btn}} số tay bài, và các {{t:pair|đôi}} từ 77 trở lên thuộc phần này." }
      - { text: "{{t:call|Theo}}", why: "Từ {{t:small-blind|small blind}} trước Button, bạn gần như không {{t:call|theo}}: bạn sẽ chơi {{t:out-of-position}} với {{t:big-blind|big blind}} phía sau. 3-bet mang lại cho bạn {{t:initiative|thế chủ động}} và cơ hội thắng ngay." }
      - { text: "{{t:fold|Bỏ bài}}", why: "Quá chặt: 88 nằm ở phần trên của {{t:range|range}} mà bạn dùng để 3-bet trước lượt {{t:open|mở cược}} rộng của Button." }
  - kind: choice
    id: m4.exam.q3
    family: m4.3bet.shape
    rules: [R-M4-006]
    prompt: "Bạn ở {{t:big-blind|big blind}}, Button {{t:open|mở cược}}, {{t:small-blind}} {{t:fold|bỏ bài}}. Tay nào sau đây là một 3-bet {{t:value|lấy giá trị}} điển hình?"
    table: { position: BB }
    options:
      - { text: "JJ", correct: true, why: "Từ {{t:big-blind|big blind}}, bạn 3-bet các tay mạnh nhất (TT+, AQ+, AJs+). JJ muốn một {{t:pot|pot}} lớn." }
      - { text: "A9 khác chất", why: "Các tay A khác chất (AJo–A9o) ở {{t:big-blind|big blind}} bạn thường chỉ {{t:call|theo}}: bạn vào rẻ và khép lại hành động." }
      - { text: "66", why: "Các {{t:pair|đôi}} trung bình và nhỏ ở {{t:big-blind|big blind}} bạn thường {{t:call|theo}}. Chúng kiếm lời sau flop, còn 3-bet với chúng thì đối phó kém với 4-bet." }
  - kind: choice
    id: m4.exam.q4
    family: m4.bb.price
    rules: [R-M4-004]
    prompt: "{{t:cutoff|CO}} {{t:open|mở cược}} {{n:pf.open-size}}, Button và {{t:small-blind}} {{t:fold|bỏ bài}}. Ở {{t:big-blind|big blind}}, bạn cần bao nhiêu equity để {{t:call|theo}} (không tính lối chơi sau flop)?"
    table: { position: BB }
    options:
      - { text: "Khoảng {{n:eq.bb-vs-btn-open}}", correct: true, why: "Giá phụ thuộc vào số tiền, không phụ thuộc vào ai {{t:open|mở cược}}. Bạn bỏ thêm {{n:bb.call.vs-btn}} vào {{t:pot|pot}} mà sau khi bạn {{t:call|theo}} sẽ có {{n:bb.pot-after.vs-btn}}, giống hệt như trước Button." }
      - { text: "Khoảng một nửa", why: "Bạn sẽ cần một nửa nếu trong {{t:pot|pot}} chỉ có {{t:bet}} của đối thủ. Các blind trong {{t:pot|pot}} giúp giá của bạn tốt hơn." }
      - { text: "Khoảng {{n:eq.bb-vs-sb-open}}", why: "Đó là giá trước lượt {{t:open|mở cược}} {{n:pf.open-size-sb}} của {{t:small-blind|small blind}}. Ở đây {{t:open}} nhỏ hơn." }
  - kind: choice
    id: m4.exam.q5
    family: m4.bb.3bet-size
    rules: [R-M4-014]
    prompt: "{{t:small-blind|Small blind}} {{t:open|mở cược}} {{n:pf.open-size-sb}}. Bạn có AA ở {{t:big-blind|big blind}} và 3-bet. Lên bao nhiêu?"
    table: { hand: "Ah Ad", position: BB }
    options:
      - { text: "Lên {{n:exam.m4.bb-vs-sb.3bet}}", correct: true, why: "Trước {{t:small-blind|small blind}}, sau flop bạn có {{t:position|vị trí}}, nên 3-bet khoảng {{n:pf.3bet.size-ip}} mức {{t:open|mở cược}}, và với mức {{t:open|mở cược}} {{n:pf.open-size-sb}} thì đó là {{n:exam.m4.bb-vs-sb.3bet}}." }
      - { text: "Lên {{n:exam.m4.bb-vs-sb.3bet-oop-size}}", sizeError: true, why: "Hành động đúng, nhưng {{n:pf.3bet.size-oop}} mức {{t:open|mở cược}} là mức dành cho người chơi {{t:out-of-position}}. Trước {{t:small-blind|small blind}}, {{t:big-blind}} có {{t:position|vị trí}}, nên {{t:raise|tố}} ít hơn." }
      - { text: "Lên {{n:pf.3bet.ip-total}}", sizeError: true, why: "Hành động đúng, nhưng {{n:pf.3bet.ip-total}} là 3-bet trước {{t:open}} {{n:pf.open-size}}. {{t:small-blind|Small blind}} {{t:open|mở cược}} {{n:pf.open-size-sb}}, nên {{n:pf.3bet.size-ip}} mức {{t:open|mở cược}} là {{n:exam.m4.bb-vs-sb.3bet}}." }
  - kind: choice
    id: m4.exam.q6
    family: m4.vs3bet.math
    rules: [R-M4-007]
    prompt: "Bạn nhận 3-bet từ người chơi sẽ có {{t:position|vị trí}} sau flop. Bạn thường {{t:fold|bỏ bài}} với tỷ lệ bao nhiêu trong số các lượt {{t:open|mở cược}} của mình?"
    options:
      - { text: "Khoảng {{n:pf.vs3bet.fold.low}}–{{n:pf.vs3bet.fold.high}}", correct: true, why: "Các lời giải solver và bảng tra {{t:fold|bỏ bài}} với tần suất xấp xỉ như vậy; giới hạn trên nằm ngay dưới ngưỡng {{n:alpha.vs-3bet-ip-size}}: nếu bỏ bài thường hơn, 3-bet của đối thủ sẽ có lời với mọi tay bài." }
      - { text: "Gần như tất cả, trừ AA và KK", why: "Khi đó đối thủ có lời khi 3-bet với bất kỳ hai lá nào, vì bạn {{t:fold|bỏ bài}} thường hơn nhiều so với {{n:alpha.vs-3bet-ip-size}}." }
      - { text: "Dưới một phần tư", why: "Quá ít lần {{t:fold|bỏ bài}}: bạn sẽ trả tiền cho các 3-bet bằng những tay thua {{t:range|range}} của đối thủ và chơi kém sau flop." }
  - kind: choice
    id: m4.exam.q7
    family: m4.vs3bet.oop
    rules: [R-M4-008]
    prompt: "Bạn {{t:open|mở cược}} từ {{t:hijack|HJ}} {{n:pf.open-size}}, Button {{t:raise|tố}} lên {{n:pf.3bet.ip-total}}, những người còn lại {{t:fold|bỏ bài}}. Bạn làm gì?"
    table: { hand: "Ah Tc", position: HJ }
    options:
      - { text: "{{t:fold|Bỏ bài}}", correct: true, why: "AT khác chất khi {{t:out-of-position}} thường bị AJ, AQ và AK áp đảo, và sau flop {{t:equity-realization|hiện thực hóa equity}} kém. Trước 3-bet, bạn {{t:fold|bỏ}} những tay như vậy." }
      - { text: "{{t:call|Theo}}", why: "Lá A rất hấp dẫn, nhưng khi {{t:out-of-position}} bạn {{t:call|theo}} bằng các tay đồng chất và các {{t:pair|đôi}}. ATo quá thường ra đôi A với kicker yếu hơn." }
      - { text: "4-bet {{t:value|lấy giá trị}}", why: "Để 4-bet {{t:value|lấy giá trị}}, bạn thường chơi AA, KK và AK. ATo thua phần lớn các tay sẽ {{t:call|theo}} nó." }
  - kind: choice
    id: m4.exam.q8
    family: m4.vs3bet.ip
    rules: [R-M4-009]
    prompt: "Bạn {{t:open|mở cược}} từ Button {{n:pf.open-size}}, {{t:small-blind}} {{t:raise|tố}} lên {{n:pf.3bet.oop-total}}, {{t:big-blind}} {{t:fold|bỏ bài}}. Bạn làm gì?"
    table: { hand: "9s 9h", position: BTN }
    options:
      - { text: "{{t:call|Theo}}", correct: true, why: "{{t:in-position|Khi có vị trí}}, bạn {{t:call|theo}} rộng hơn, trong đó có các {{t:pair|đôi}} từ 66 đến TT. 99 chơi tốt sau flop và dễ {{t:equity-realization|hiện thực hóa equity}}." }
      - { text: "{{t:fold|Bỏ bài}}", why: "Quá chặt: bạn {{t:fold|bỏ}} các {{t:pair|đôi}} thấp nhất, còn 99 nằm trong {{t:range|range}} {{t:call|theo}} khi {{t:in-position}}." }
      - { text: "4-bet {{t:value|lấy giá trị}}", why: "Để 4-bet {{t:value|lấy giá trị}}, bạn thường chơi AA, KK và AK. 99 muốn xem flop hơn." }
  - kind: choice
    id: m4.exam.q9
    family: m4.vs3bet.value
    rules: [R-M4-010, R-M4-011]
    prompt: "Bạn {{t:open|mở cược}} từ {{t:hijack|HJ}} {{n:pf.open-size}}, {{t:cutoff|CO}} {{t:raise|tố}} lên {{n:pf.3bet.ip-total}}, những người còn lại {{t:fold|bỏ bài}}. Bạn làm gì?"
    table: { hand: "As Ac", position: HJ }
    options:
      - { text: "4-bet lên khoảng {{n:pf.4bet.oop-example.low}}–{{n:exam.m4.4bet.oop.high}}", correct: true, why: "Bạn 4-bet AA {{t:value|lấy giá trị}}. {{t:out-of-position|Khi không có vị trí}}, 4-bet khoảng {{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}} mức 3-bet: {{n:pf.3bet.ip-total}} × {{n:pf.4bet.size-oop.low}} ≈ {{n:pf.4bet.oop-example.low}}, × {{n:pf.4bet.size-oop.high}} ≈ {{n:exam.m4.4bet.oop.high}}." }
      - { text: "{{t:call|Theo}}", why: "AA muốn đưa cả stack vào. {{t:call|Theo}} khi {{t:out-of-position}} là bỏ phí giá trị và {{t:initiative|thế chủ động}}." }
      - { text: "All-in {{n:format.stack}}", why: "All-in đẩy đi những tay yếu hơn mà đối thủ lẽ ra sẽ trả một 4-bet thông thường. Sau 4-bet khoảng {{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}} mức 3-bet, bạn vẫn dễ dàng đưa phần còn lại của stack vào." }
  - kind: numeric
    id: m4.exam.n1
    family: m4.iso.size
    rules: [R-M4-012]
    prompt: "Hai người chơi limp, Button {{t:fold|bỏ bài}}. Bạn ở {{t:small-blind|small blind}} và muốn {{t:isolation|cô lập}}. Bạn {{t:raise|tố}} lên bao nhiêu bb? Hãy nhập một số."
    table: { hand: "Qs Qc", position: SB }
    answer: exam.m4.iso.two-oop
    explanation: "Mức cơ bản {{n:pf.iso.base}}, cộng {{n:pf.iso.per-limper}} cho mỗi người trong hai người limp, cộng {{n:pf.iso.oop-extra}} vì sau flop bạn hành động trước: tổng cộng {{n:exam.m4.iso.two-oop}}."
  - kind: choice
    id: m4.exam.q10
    family: m4.iso.many
    rules: [R-M4-013, R-M4-012]
    prompt: "Ba người chơi trước bạn chỉ bỏ vào bằng mức {{t:big-blind}}. Bạn ở {{t:cutoff|CO}}. Bạn làm gì?"
    table: { hand: "Ad Kh", position: CO }
    options:
      - { text: "{{t:raise|Tố}} lên {{n:exam.m4.iso.three}}", correct: true, why: "Trước nhiều người limp, bạn {{t:raise|tố}} chủ yếu {{t:value|lấy giá trị}}, và AK chính là loại tay như vậy. Mức tố: {{n:pf.iso.base}} cộng {{n:pf.iso.per-limper}} cho mỗi người trong ba người limp." }
      - { text: "{{t:raise|Tố}} lên {{n:pf.iso.one-limper}}", sizeError: true, why: "Hành động đúng, nhưng đó là mức trước một người limp. Mỗi người thêm vào cộng {{n:pf.iso.per-limper}}, nên ở đây là {{n:exam.m4.iso.three}}." }
      - { text: "Limp theo", why: "Limp theo hợp với các tay đầu cơ. AK muốn xây {{t:pot|pot}} và giảm số đối thủ." }
