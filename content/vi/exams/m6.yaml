# Pula pytań egzaminacyjnych modułu M6 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m6.*).
module: m6
drills:
  - kind: numeric
    id: m6.exam.q1
    family: m6.mdf
    rules: [R-M6-001, R-M6-005]
    prompt: "River. Trong {{t:pot}} có {{n:exam.m6.pot}}, đối thủ {{t:bet|cược}} {{n:exam.m6.bet.three-quarters}}. {{t:mdf}} là bao nhiêu, tức là bạn bảo vệ ít nhất bao nhiêu phần {{t:range}} của mình? Hãy nhập số theo phần trăm."
    answer: exam.m6.mdf.three-quarters
    explanation: "{{t:mdf}} = {{t:pot}} ÷ ({{t:pot}} + bet) = {{n:exam.m6.pot}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}}) = {{n:exam.m6.mdf.three-quarters}}. Nếu bạn {{t:fold|bỏ bài}} thường xuyên hơn, một {{t:bluff|cú tháu cáy}} không có cơ hội thắng sẽ tự động có lãi."
  - kind: choice
    id: m6.exam.q2
    family: m6.alpha
    rules: [R-M6-002]
    prompt: "River. Trong {{t:pot}} có {{n:exam.m6.pot}}. Bạn {{t:bluff|tháu cáy}} bằng một tay bài không có cơ hội thắng, cược {{n:exam.m6.bet.quarter}}. Đối thủ phải {{t:fold|bỏ bài}} thường xuyên đến mức nào để {{t:bluff|cú tháu cáy}} này hòa vốn?"
    options:
      - { text: "Hơn {{n:exam.m6.alpha.quarter}} số trường hợp", correct: true, why: "Đúng: alpha = bet ÷ ({{t:pot}} + bet) = {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}}) = {{n:exam.m6.alpha.quarter}}. Một {{t:bluff|cú tháu cáy}} nhỏ mạo hiểm ít, nên chỉ cần những lần {{t:fold|bỏ bài}} hiếm hoi là đủ." }
      - { text: "Hơn {{n:exam.m6.mdf.quarter}} số trường hợp", why: "Đó là {{t:mdf}}: phần {{t:range}} mà đối thủ nên bảo vệ. Alpha là phần còn lại: {{n:exam.m6.alpha.quarter}}." }
      - { text: "Hơn {{n:eq.bet-quarter}} số trường hợp", why: "Đó là equity mà đối thủ cần để {{t:call|theo}}; mẫu số còn có cả khoản {{t:call|theo}} của họ. Ngưỡng cho {{t:bluff|cú tháu cáy}} là bet ÷ ({{t:pot}} + bet) = {{n:exam.m6.alpha.quarter}}." }
  - kind: choice
    id: m6.exam.q3
    family: m6.mdf-concept
    rules: [R-M6-003]
    prompt: "Bạn bảo vệ {{t:big-blind}} trước {{t:open|lượt mở}} của Button. Trên flop, Button {{t:bet|cược}} c-bet 1/4 {{t:pot}}. Một người bạn {{t:fold|bỏ}} hơn một nửa số tay bài ở đây, vì “{{t:mdf}} chỉ là điểm tham chiếu”. Điều gì sai?"
    table: { position: BB }
    options:
      - { text: "Trên flop có thể bảo vệ ít hơn {{t:mdf}} một chút, nhưng không {{t:fold|bỏ bài}} hàng loạt trước các c-bet nhỏ", correct: true, why: "Đúng: với c-bet 1/4 {{t:pot}}, {{t:mdf}} là {{n:exam.m6.mdf.quarter}}. Trên flop khi {{t:out-of-position|không có vị trí}}, bạn được phép bảo vệ ít hơn một chút, vì các {{t:bluff|cú tháu cáy}} của Button vẫn còn equity, nhưng {{t:fold|bỏ}} hơn một nửa số tay bài là trao {{t:pot}} cho họ gần như miễn phí." }
      - { text: "Không có gì: trên flop {{t:mdf}} hoàn toàn không áp dụng", why: "Trên flop {{t:mdf}} là điểm tham chiếu: bạn có thể bảo vệ ít hơn một chút, chứ không phải ít hơn tùy ý. Trước một c-bet nhỏ, bạn vẫn có nhiều tay bài đủ equity." }
      - { text: "Trên flop phải bảo vệ nhiều hơn {{t:mdf}}", why: "Ngược lại: trên flop khi {{t:out-of-position|không có vị trí}}, bạn có thể bảo vệ ít hơn một chút, vì bạn sẽ không hiện thực hóa được toàn bộ equity của các tay yếu. Sai lầm của người bạn là {{t:fold|bỏ bài}} quá nhiều." }
  - kind: choice
    id: m6.exam.q4
    family: m6.exploit
    rules: [R-M6-004]
    prompt: "Micro stakes. Một {{t:recreational|người chơi giải trí}} thụ động, hiếm khi {{t:bluff|tháu cáy}}, {{t:bet|cược}} 3/4 {{t:pot}} ở river. Bạn có {{t:pair|đôi}} Q, còn trên {{t:board|bài chung}} có A và K. Bạn làm gì?"
    table: { hand: "Qd Qc", board: "Ah Jd 7c 4s Ks" }
    options:
      - { text: "{{t:fold|Bỏ bài}}", correct: true, why: "Đúng: {{t:pair|đôi}} của bạn thấp hơn A và K trên {{t:board|bài chung}}, nên chủ yếu chỉ thắng các {{t:bluff|cú tháu cáy}}. Người chơi này hiếm khi {{t:bluff|tháu cáy}}, nên trước họ bạn {{t:fold|bỏ bài}} thường xuyên hơn mức {{t:mdf}} gợi ý." }
      - { text: "{{t:call|Theo}}, vì {{t:mdf}} bảo phải bảo vệ khoảng {{n:exam.m6.mdf.three-quarters}}", why: "{{t:mdf}} giả định rằng đối thủ {{t:bluff|tháu cáy}} đủ thường xuyên. Người chơi này không làm vậy, nên {{t:call|theo}} chủ yếu là trả tiền cho các tay mạnh hơn." }
      - { text: "{{t:raise|Tố}}", why: "Sau khi bạn {{t:raise|tố}}, các tay yếu hơn sẽ {{t:fold|bỏ bài}}, còn các tay mạnh hơn sẽ trả tiền. Một {{t:pair|đôi}} thấp hơn hai lá trên {{t:board|bài chung}} không phải tay bài để {{t:raise|tố}}." }
  - kind: choice
    id: m6.exam.q5
    family: m6.flop.price
    rules: [R-M6-005]
    prompt: "Flop. Trong {{t:pot}} có {{n:exam.m6.pot}}. Một lần Button {{t:bet|cược}} {{n:exam.m6.bet.quarter}}, còn ở một ván khác là {{n:exam.m6.bet.three-quarters}}. Bạn cần bao nhiêu equity để {{t:call|theo}} trong mỗi trường hợp?"
    table: { position: BB }
    options:
      - { text: "Khoảng {{n:eq.bet-quarter}} và {{n:eq.bet-three-quarters}}", correct: true, why: "Đúng: bet ÷ ({{t:pot}} + 2·bet). {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}} + {{n:exam.m6.bet.quarter}}) = {{n:eq.bet-quarter}}, còn {{n:exam.m6.bet.three-quarters}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}} + {{n:exam.m6.bet.three-quarters}}) = {{n:eq.bet-three-quarters}}. Trước mức bet lớn hơn, bạn bảo vệ bằng {{t:range}} hẹp hơn." }
      - { text: "Khoảng {{n:exam.m6.alpha.quarter}} và {{n:eq.bet-three-quarters}}", why: "Số đầu tiên là alpha (bet ÷ ({{t:pot}} + bet)), tức ngưỡng cho {{t:bluff|cú tháu cáy}} của Button. Để tính giá {{t:call|theo}}, hãy cộng thêm khoản {{t:call|theo}} của bạn: {{n:eq.bet-quarter}}." }
      - { text: "Bằng nhau ở cả hai, vì cùng một {{t:pot}}", why: "Không: giá phụ thuộc vào kích thước bet. Bet lớn hơn nghĩa là giá tệ hơn: {{n:eq.bet-three-quarters}} thay vì {{n:eq.bet-quarter}}." }
  - kind: choice
    id: m6.exam.q6
    family: m6.flop.call
    rules: [R-M6-006]
    prompt: "Bạn bảo vệ {{t:big-blind}} trước {{t:open|lượt mở}} của Button. Trên flop bạn {{t:check}}, Button {{t:bet|cược}} c-bet 1/3 {{t:pot}}. Bạn có A là lá cao nhất, không có {{t:draw}}. Bạn làm gì?"
    table: { hand: "Ac 6h", board: "Js 8d 3d", position: BB }
    options:
      - { text: "{{t:call|Theo}}", correct: true, why: "Đúng: trước một c-bet nhỏ, bạn chỉ cần khoảng {{n:eq.bet-third}} equity. A là lá cao nhất thắng một phần các {{t:bluff|cú tháu cáy}} của Button và có thể ra {{t:pair|đôi}}, nên bạn thường bảo vệ nó. Bạn {{t:fold|bỏ}} những tay yếu nhất không có {{t:pair|đôi}} và không có {{t:draw}}." }
      - { text: "{{t:fold|Bỏ bài}}", why: "Quá chặt: trước một c-bet nhỏ, tay có A là lá cao nhất thường được bảo vệ. Bạn {{t:fold|bỏ}} các tay yếu hơn không có {{t:pair|đôi}} và không có {{t:draw}}." }
      - { text: "Check-raise", why: "Bạn check-raise chủ yếu với những tay mạnh nhất và các {{t:draw}}. Tay này không có giá trị, cũng không có {{t:draw}} nào mở ra con đường thắng thứ hai." }
  - kind: choice
    id: m6.exam.q7
    family: m6.flop.fold
    rules: [R-M6-007]
    prompt: "Bạn bảo vệ {{t:big-blind}} trước {{t:open|lượt mở}} của Button. Trên flop [[8c 4d 2h]] bạn {{t:check}}, còn Button {{t:bet|cược}} c-bet 3/4 {{t:pot}}. Với tay nào trong số này thì {{t:call|theo}} hợp lý hơn?"
    table: { board: "8c 4d 2h", position: BB }
    options:
      - { text: "[[Ad Jd]]", correct: true, why: "Đúng: cả hai tay đều là hai lá cao không có {{t:pair|đôi}}, nhưng AJ rô có thêm {{t:flush-draw}} (backdoor) đến {{t:flush|thùng}} cao nhất: với một lá rô trên {{t:board|bài chung}}, nó còn cần thêm hai lá rô nữa. Trước một c-bet lớn, bạn nên {{t:call|theo}} với chính kiểu tay bài này." }
      - { text: "[[Ks Qs]]", why: "KQ bích ở đây không có {{t:draw}} nào: trên {{t:board|bài chung}} không có lá bích, còn {{t:straight|sảnh}} thì quá xa. Trước một c-bet lớn, bạn thường {{t:fold|bỏ}} hai lá cao không có {{t:draw}}." }
  - kind: choice
    id: m6.exam.q8
    family: m6.xr.semibluff
    rules: [R-M6-008]
    prompt: "Bạn bảo vệ {{t:big-blind}} trước {{t:open|lượt mở}} của Button. Trên flop [[Jh 8c 4h]] bạn {{t:check}}, còn Button {{t:bet|cược}} c-bet 1/3 {{t:pot}}. Tay nào trong số này tốt nhất để check-raise?"
    table: { board: "Jh 8c 4h", position: BB }
    options:
      - { text: "[[Qh Th]]", correct: true, why: "Đúng: {{t:flush-draw}} cộng gutshot (lá 9) là một {{t:draw}} mạnh. Check-raise thắng khi Button {{t:fold|bỏ bài}}, còn nếu họ trả tiền, bạn vẫn có nhiều out." }
      - { text: "[[Jd 5d]]", why: "{{t:top-pair|Đôi cao nhất}} với kicker yếu là tay bài để {{t:call|theo}}. Sau một check-raise, các tay yếu hơn thường {{t:fold|bỏ bài}}, còn các tay mạnh hơn trả tiền." }
      - { text: "[[As 3c]]", why: "Tay có A là lá cao nhất mà không có {{t:draw}} thì không có con đường thắng thứ hai. Bạn check-raise như một {{t:bluff|cú tháu cáy}} chủ yếu với các {{t:draw}}." }
  - kind: numeric
    id: m6.exam.q9
    family: m6.xr.size
    rules: [R-M6-010]
    prompt: "Flop. Trong {{t:pot}} có {{n:exam.m6.pot}}, Button {{t:bet|cược}} c-bet nhỏ {{n:exam.m6.bet.quarter}}. Bạn check-raise lên mức {{n:xr.mult.example}} c-bet. Bạn {{t:raise|tố}} lên bao nhiêu? Hãy nhập số {{t:chips|chip}}."
    table: { position: BB }
    answer: exam.m6.xr
    explanation: "{{n:exam.m6.bet.quarter}} × {{n:xr.mult.example}} = {{n:exam.m6.xr}}. Trước một c-bet nhỏ, bạn {{t:raise|tố}} gần mức trên của khoảng {{n:xr.mult.low}}–{{n:xr.mult.example}}: check-raise tối thiểu sẽ cho Button một mức giá rất tốt."
  - kind: choice
    id: m6.exam.q10
    family: m6.xr.when
    rules: [R-M6-009]
    prompt: "Bạn bảo vệ {{t:big-blind}} trước {{t:open|lượt mở}} của Button. Trên flop nào bạn check-raise thường xuyên nhất?"
    table: { position: BB }
    options:
      - { text: "[[8d 6c 5h]]", correct: true, why: "Đúng: trên flop thấp, {{t:connected|liên kết}}, {{t:big-blind}} có nhiều tổ hợp mạnh nhất ({{t:two-pair|hai đôi}}, {{t:straight|sảnh}}) hơn Button, nên ở đây big blind check-raise thường xuyên hơn." }
      - { text: "[[Ks Qd Jh]]", why: "Flop cao với các lá gần nhau trúng tốt {{t:range}} của Button (AK, AQ, KQ, các {{t:pair|đôi}} cao). Ở đây bạn check-raise ít hơn." }
      - { text: "[[Ah Ad Qc]]", why: "Trên flop có {{t:pair|đôi}} A, Button, người đã {{t:open|mở}} với nhiều lá A, thường có các tay mạnh nhất hơn. Ở đây bạn hiếm khi check-raise." }
