  pl: check-raise
  en: check-raise
  area: actions
  source: "Robert's Rules of Poker, glosariusz (https://www.briggsoft.com/docs/pmavens/Rules_Roberts.htm): „CHECK-RAISE: To waive the right to bet until a bet has been made by an opponent, and then to increase the bet”"
