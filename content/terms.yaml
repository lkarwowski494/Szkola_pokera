  source: "Robert's Rules of Poker, glosariusz (https://www.briggsoft.com/docs/pmavens/Rules_Roberts.htm): „ALL-IN: When you have put all of your playable money and chips into the pot during the course of a hand, you are said to be all-in.”"

# ---------- Stół i przebieg rozdania (M1) ----------
