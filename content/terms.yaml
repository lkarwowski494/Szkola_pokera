  source: "Robert's Rules of Poker, glosariusz (https://www.briggsoft.com/docs/pmavens/Rules_Roberts.htm): „CHECK: To waive the right to initiate the betting in a round, but to retain the right to act if another player initiates the betting.”"
bet:
  pl: zakład
  en: bet
  area: actions
  forms: [zakład, zakładu, zakładzie, zakładem, zakłady, zakładów, zakładami, zakładach, zakładom, stawiasz, stawia, stawiam, stawiają, stawiać, postawił, postawiłeś, postawić, postawisz, postawi]
  source: "Robert's Rules of Poker, glosariusz (https://www.briggsoft.com/docs/pmavens/Rules_Roberts.htm): „BET: The act of placing a wager in turn into the pot on any betting round, or the chips put into the pot.”"
call:
  pl: sprawdzenie
  en: call
  area: actions
  forms: [sprawdzenie, sprawdzenia, sprawdzeniu, sprawdzeniem, sprawdzeń, sprawdzeniach, sprawdzeniami, sprawdzam, sprawdzasz, sprawdza, sprawdzają, sprawdzamy, sprawdzić, sprawdzał, sprawdzała, sprawdzałeś, sprawdzali, sprawdził, sprawdziła, sprawdziłeś, sprawdzili, sprawdzi, sprawdzą, sprawdzisz, sprawdzać, sprawdzanie, sprawdzania, sprawdzaniu, sprawdzając, sprawdzaj, sprawdzającego]
  skip: ["sprawdza, czy", "sprawdzić, czy", "sprawdzisz, czy", "sprawdzasz, czy", "sprawdzaj, czy", "sprawdzam, czy"]
  source: "Wikipedia, Glossary of poker terms (https://en.wikipedia.org/wiki/Glossary_of_poker_terms): „call: To match a bet or raise.”; GTO Wizard, Poker Glossary (https://gtowizard.com/en/glossary/): „Call: When a player matches the amount that has previously been bet, they have “called” the bet.”"
raise:
  pl: przebicie
  en: raise
  area: actions
  forms: [przebicie, przebicia, przebiciu, przebiciem, przebić, przebijam, przebijasz, przebija, przebijają, przebijać, przebił, przebiła, przebiłeś, przebili, przebijał, przebijałeś, przebije, przebijesz, przebij, przebiją, przebijając, przebiciami, przebiciach]
  source: "Robert's Rules of Poker, glosariusz (https://www.briggsoft.com/docs/pmavens/Rules_Roberts.htm): „RAISE: To increase the amount of a previous wager.”"
fold:
  pl: pas
  en: fold
  area: actions
  # „pasuje/pasują/pasować” bywa też „pasuje do”; te frazy wyłącza skip
  forms: [pas, pasu, pasem, pasy, pasów, pasach, pasom, pasuję, pasujesz, pasujemy, pasuje, pasują, pasować, pasował, pasowała, pasowałeś, pasowali, spasować, spasuje, spasują, spasujesz, spasował, spasowała, spasowałeś, spasowali, spasowały, spasuję, pasując]
  skip: [pasuje do, pasują do, pasować do, pasował do, pasowała do, pasuje tu, pasuje najlepiej, pasuje lepiej]
  source: "Robert's Rules of Poker, glosariusz (https://www.briggsoft.com/docs/pmavens/Rules_Roberts.htm): „FOLD: To throw a hand away and relinquish all interest in a pot.”"
