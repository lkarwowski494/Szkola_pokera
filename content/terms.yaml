  en_alt: [play the board]
  area: table
  forms: [gra stół]
  source: "Robert's Rules of Poker, glosariusz (https://www.briggsoft.com/docs/pmavens/Rules_Roberts.htm): „PLAY THE BOARD: Using all five community cards for your hand in hold'em.”; GTO Wizard, Poker Glossary (https://gtowizard.com/en/glossary/): „Playing the board: When, on the river, a player’s best five card hand is the five cards on the board.”"
