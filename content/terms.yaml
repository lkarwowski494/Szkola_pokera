# ---------- Pozycje (M3) ----------
position:
  pl: pozycja
  en: position
  area: positions
  forms: [pozycja, pozycji, pozycję, pozycją, pozycje, pozycjach, pozycjami]
  skip: [pozycję niżej, pozycję wyżej, pozycje niżej]
  source: "Robert's Rules of Poker, glosariusz (https://www.briggsoft.com/docs/pmavens/Rules_Roberts.htm): „POSITION: (1) The relation of a player's seat to the blinds or the button. (2) The order of acting on a betting round or deal.”"
in-position:
  pl: z pozycją
  en: in position
  abbr: IP
  area: positions
  forms: [z pozycją, w pozycji]
  source: "GTO Wizard, Poker Glossary (https://gtowizard.com/en/glossary/): „In position (IP): The player who acts last postflop is said to be in position.”"
out-of-position:
  pl: bez pozycji
  en: out of position
  abbr: OOP
  area: positions
  forms: [bez pozycji]
  source: "GTO Wizard, Poker Glossary (https://gtowizard.com/en/glossary/): „Out Of Position (OOP): Describes a player’s relative position at the table, always at least the person who is not last to act postflop.”"
early-position:
  pl: wczesna pozycja
  en: early position
  abbr: EP
  area: positions
  forms: [wczesna pozycja, wczesnej pozycji, wczesną pozycję, wczesne pozycje, wczesnych pozycji, wczesnych pozycjach]
  source: "GTO Wizard, Poker Glossary (https://gtowizard.com/en/glossary/): „Early Position: In a 6-handed game, refers to the first person to act postflop. In a 9-person game, several players after the first to act postflop can be referred to as Early Position (EP) +1, +2”"
late-position:
  pl: późna pozycja
  en: late position
  area: positions
  forms: [późna pozycja, późnej pozycji, późną pozycję, późne pozycje, późnych pozycji, późnych pozycjach]
  source: "GTO Wizard, Poker Glossary (https://gtowizard.com/en/glossary/): „Late Position: A term that generally refers to the Button and positions close to it”"
