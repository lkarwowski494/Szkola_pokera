# Nazwane spoty zakresów do lekcji i zadań. Liczby pochodzą wyłącznie z preflop-6max-100bb.json (solver, ADR-20).
# path = ścieżka akcji w drzewie solvera; groups = akcje pokazywane w siatce (reszta to pas).
# Tylko spoty, które przeszły walidację (meta.summary w preflop-6max-100bb.json, dokument 10 na Drive). Gra wobec 3-betu wróci po poprawie modelu.
# CO vs UTG: częstość 3-betu zgodna od wersji 2 solvera, ale skład zakresu (liniowy, bez blefów, z wąskim sprawdzaniem)
# odbiega od publicznych solverów — czeka na decyzję. BB vs UTG i pule z dołączeniem BB czekają na cele walidacyjne.

# Klasy niepewne (audyt 4.10.2026, K6 opcja B; skrócone z 34 do 13 klas po przejściu na solver v3c 5.10.2026,
# dokument 10): w tych rękach kanon odbiega od publicznych tabel otwarć (BeyondGTO). Nie pojawiają się w zadaniach
# rangeDecision, a w malowaniu zakresu liczą się jak ręce mieszane (zaliczone w obie strony). Jedna lista (kotwica
# &uncertain-rfi), spoty zakresów otwarć (M3) tylko się do niej odwołują.
- id: rfi.utg
  title: "{{t:utg}}, nikt jeszcze nie wszedł do gry"
  hero: UTG
  path: ""
  groups: { "{{t:raise|Przebicie}} do 2,5bb": ["raise 2.5"] }
  uncertain: &uncertain-rfi [
    # solver v3c (5.10.2026, dokument 10 „Pomiary v3c”): klasy, w których kanon w co najmniej jednej pozycji różni się
    # od BeyondGTO o 50 pp lub więcej; ręce w kolorze z luką
    65s, 75s, T8s, 97s, 86s, 53s, 85s,
    # słabe ręce w różnych kolorach
    A8o, A4o, K8o, K7o, Q8o, 98o,
  ]
- id: rfi.hj
  title: "{{t:hijack|HJ}}, wszyscy przed tobą {{t:fold|spasowali}}"
  hero: HJ
  path: "UTG:fold"
  groups: { "{{t:raise|Przebicie}} do 2,5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: rfi.co
  title: "{{t:cutoff|CO}}, wszyscy przed tobą {{t:fold|spasowali}}"
  hero: CO
  path: "UTG:fold,HJ:fold"
  groups: { "{{t:raise|Przebicie}} do 2,5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: rfi.btn
  title: "Button, wszyscy przed tobą {{t:fold|spasowali}}"
  hero: BTN
  path: "UTG:fold,HJ:fold,CO:fold"
  groups: { "{{t:raise|Przebicie}} do 2,5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: rfi.sb
  title: "{{t:small-blind|Mały blind}}, wszyscy {{t:fold|spasowali}}, gra toczy się przeciw {{t:big-blind|dużemu blindowi}}"
  hero: SB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:fold"
  groups: { "{{t:raise|Przebicie}} do 3bb": ["raise 3"] }
  uncertain: *uncertain-rfi

- id: vs-open.btn-vs-co
  title: "Button, {{t:cutoff|CO}} {{t:open|otworzył}} na 2,5bb"
  hero: BTN
  path: "UTG:fold,HJ:fold,CO:raise2.5"
  # jedna grupa „gram” (decyzja A2 koordynatora 5.10.2026, dokument 10): solver v3c prawie nie sprawdza w tym spocie
  # (sprawdzenie 0% wobec 5–9% w źródłach), więc podziału 3-bet / sprawdzenie nie oceniają ani siatka, ani tryb gry (M13);
  # lekcja uczy go regułą R-M4-005 z liczbami GTO Wizard i BeyondGTO
  groups: { "Gram (3-bet do 7,5bb albo {{t:call}})": ["raise 7.5", "call 2.5"] }
  # klasy niepewne: kanon różni się od BeyondGTO (defense/btn-vs-co, NL500, 100bb) w „gram / pas” o 50 pp lub więcej
  # (dokument 10, „Pomiary v3c”); w zadaniach się nie pojawiają, w malowaniu są zaliczane w obie strony
  uncertain: [A9s, A8s, A7s, A6s, A3s, A2s, K9s, K8s, Q9s, T7s, 98s, 97s, 87s, 75s, 65s, AJo, ATo, "44", "33", "22"]
  # błędny rozmiar przy dobrej akcji = „niedokładność” (B-015, decyzja właściciela 3 października 2026)
  wrongSizes:
    "Gram (3-bet do 7,5bb albo {{t:call}})":
      - { text: "3-bet do {{n:pf.3bet.oop-total}}", why: "To rozmiar {{t:out-of-position}}. {{t:in-position|Z pozycją}} {{t:raise|przebijasz}} ok. {{n:pf.3bet.size-ip}} {{t:open|otwarcia}}, czyli do {{n:pf.3bet.ip-total}}." }
- id: vs-open.sb-vs-btn
  title: "{{t:small-blind|Mały blind}}, Button {{t:open|otworzył}} na 2,5bb"
  hero: SB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:raise2.5"
  # „3-bet / pas” (decyzja właściciela 4 października 2026, B-045): solvery grają tu 3-bet albo pas, a łączna częstość
  # i skład 3-betu kanonu zgadzają się z GTO Wizard (Crush 3-Bet Pots OOP, SB vs BTN 14%) poza rękami niżej.
  # Sprawdzenia kanonu (solver v3c: ok. 0,5%) liczą się w siatce jako pas.
  groups: { "3-bet do 10bb": ["raise 10"] }
  # Klasy niepewne tego spotu (przeliczone dla solvera v3c 5.10.2026, dokument 10 „Pomiary v3c”): częstość 3-betu
  # kanonu różni się od BeyondGTO (defense/sb-vs-btn, NL500, 100bb) o 50 pp lub więcej. W zadaniach się nie
  # pojawiają, w malowaniu są zaliczane w obie strony.
  uncertain: [A8s, A7s, A6s, A4s, A3s, K8s, Q9s, T9s, 98s, 75s, ATo]
- id: vs-open.bb-vs-btn
  title: "{{t:big-blind|Duży blind}}, Button {{t:open|otworzył}} na 2,5bb, {{t:small-blind}} {{t:fold|spasował}}"
  hero: BB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:raise2.5,SB:fold"
  groups: { "Bronię ({{t:call}} albo 3-bet)": ["call 2.5", "raise 10"] }
- id: vs-open.bb-vs-sb
  title: "{{t:big-blind|Duży blind}}, {{t:small-blind}} {{t:open|otworzył}} na 3bb"
  hero: BB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:fold,SB:raise3"
  # jedna grupa „bronię”: podział 3-bet / sprawdzenie w tym spocie nie przeszedł walidacji (solver v3c: 3-bet 25,7%
  # wobec 15–19% w źródłach, odstępstwo od K1, dokument 10), więc ani siatka, ani ocena w trybie gry (M13) go nie oceniają
  groups: { "Bronię ({{t:call}} albo 3-bet)": ["call 3", "raise 9"] }

# M11: push/fold heads-up (mały blind kontra duży blind) z pliku pushfold.json, policzonego skryptem
# tools/preflop-solver/scripts/pushfold-ranges.ts na drzewie zwalidowanym z równowagą Nasha (dokument 10: 10bb bez ante).
# Gra tylko all-in albo pas (uproszczenie: pełne solvery przy tych stackach część rąk limpują albo podbijają minimalnie).
- id: push.sb-5
  title: "{{t:small-blind|Mały blind}}, stack 5bb, wszyscy {{t:fold|spasowali}}. All-in czy {{t:fold}}?"
  hero: SB
  solver: pushfold.json
  path: "5bb|"
  groups: { "All-in": ["all-in"] }
- id: push.sb-10
  title: "{{t:small-blind|Mały blind}}, stack 10bb, wszyscy {{t:fold|spasowali}}. All-in czy {{t:fold}}?"
  hero: SB
  solver: pushfold.json
  path: "10bb|"
  groups: { "All-in": ["all-in"] }
- id: push.sb-15
  title: "{{t:small-blind|Mały blind}}, stack 15bb, wszyscy {{t:fold|spasowali}}. All-in czy {{t:fold}}?"
  hero: SB
  solver: pushfold.json
  path: "15bb|"
  groups: { "All-in": ["all-in"] }
- id: push.sb-10-ante
  title: "{{t:small-blind|Mały blind}}, stack 10bb, {{t:big-blind}} wpłacił ante 1bb, wszyscy {{t:fold|spasowali}}. All-in czy {{t:fold}}?"
  hero: SB
  solver: pushfold.json
  path: "10bb-ante|"
  groups: { "All-in": ["all-in"] }
- id: call.bb-5
  title: "{{t:big-blind|Duży blind}}, stack 5bb. {{t:small-blind|Mały blind}} wszedł all-in. {{t:call|Sprawdzasz}} czy {{t:fold|pasujesz}}?"
  hero: BB
  solver: pushfold.json
  path: "5bb|SB:allin"
  groups: { "{{t:call|Sprawdzam}}": ["call"] }
- id: call.bb-10
  title: "{{t:big-blind|Duży blind}}, stack 10bb. {{t:small-blind|Mały blind}} wszedł all-in. {{t:call|Sprawdzasz}} czy {{t:fold|pasujesz}}?"
  hero: BB
  solver: pushfold.json
  path: "10bb|SB:allin"
  groups: { "{{t:call|Sprawdzam}}": ["call"] }
- id: call.bb-15
  title: "{{t:big-blind|Duży blind}}, stack 15bb. {{t:small-blind|Mały blind}} wszedł all-in. {{t:call|Sprawdzasz}} czy {{t:fold|pasujesz}}?"
  hero: BB
  solver: pushfold.json
  path: "15bb|SB:allin"
  groups: { "{{t:call|Sprawdzam}}": ["call"] }
- id: call.bb-10-ante
  title: "{{t:big-blind|Duży blind}}, stack 10bb, wpłaciłeś ante 1bb. {{t:small-blind|Mały blind}} wszedł all-in. {{t:call|Sprawdzasz}} czy {{t:fold|pasujesz}}?"
  hero: BB
  solver: pushfold.json
  path: "10bb-ante|SB:allin"
  groups: { "{{t:call|Sprawdzam}}": ["call"] }

# M11, trzech graczy (Button, mały blind, duży blind), stacki po 7,5bb, bez ante, gra o żetony: z pliku pushfold.json
# (drzewo src/pushfold3.ts). Zwalidowane z opublikowaną równowagą: Ganzfried i Sandholm, AAMAS 2008, tabele 11–16
# („single hand”, stacki 4500 przy blindach 300/600); skrypt tools/preflop-solver/scripts/pushfold3-validate.ts.
# Częstości węzłów zgodne z artykułem w granicach 1,2 pp. Klasy niepewne: ręce, w których poprawna odpowiedź w zadaniu
# różni się od artykułu (nie pojawiają się w rangeDecision, w malowaniu liczą się jak ręce mieszane). Inne głębokości
# trzyosobowe nie mają celu walidacji, więc ich nie pokazujemy (ADR-24).
- id: push.btn-3max
  title: "Button, trzech graczy, stacki po 7,5bb. Wchodzisz all-in czy {{t:fold|pasujesz}}?"
  hero: BTN
  solver: pushfold.json
  path: "3max-7.5bb|"
  groups: { "All-in": ["all-in"] }
  uncertain: [T9o]
- id: push.sb-3max
  title: "{{t:small-blind|Mały blind}}, trzech graczy, stacki po 7,5bb, Button {{t:fold|spasował}}. All-in czy {{t:fold}}?"
  hero: SB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:fold"
  groups: { "All-in": ["all-in"] }
  uncertain: [T3s, 63s, Q3o]
- id: call.sb-vs-btn-3max
  title: "{{t:small-blind|Mały blind}}, trzech graczy, stacki po 7,5bb. Button wszedł all-in, za tobą jest jeszcze {{t:big-blind}}. {{t:call|Sprawdzasz}} czy {{t:fold|pasujesz}}?"
  hero: SB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:allin"
  groups: { "{{t:call|Sprawdzam}}": ["call"] }
  uncertain: [A4o]
- id: call.bb-vs-btn-3max
  title: "{{t:big-blind|Duży blind}}, trzech graczy, stacki po 7,5bb. Button wszedł all-in, {{t:small-blind}} {{t:fold|spasował}}. {{t:call|Sprawdzasz}} czy {{t:fold|pasujesz}}?"
  hero: BB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:allin,SB:fold"
  groups: { "{{t:call|Sprawdzam}}": ["call"] }
  uncertain: [Q5s]
- id: call.bb-vs-two-3max
  title: "{{t:big-blind|Duży blind}}, trzech graczy, stacki po 7,5bb. Button wszedł all-in, {{t:small-blind}} {{t:call|sprawdził}}. {{t:call|Sprawdzasz}} czy {{t:fold|pasujesz}}?"
  hero: BB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:allin,SB:call"
  groups: { "{{t:call|Sprawdzam}}": ["call"] }
  uncertain: [A4s, KTo]
