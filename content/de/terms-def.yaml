royal-flush: "Die höchste Hand im Poker: Ass, König, Dame, Bube und Zehn in derselben Farbe, z. B. A♠ K♠ Q♠ J♠ T♠."
straight-flush: "Fünf aufeinanderfolgende Karten in derselben Farbe, z. B. 5♥ 6♥ 7♥ 8♥ 9♥. Die höchste Variante (vom Ass bis zur Zehn) hat einen eigenen Namen und ist die stärkste Hand im Spiel."
four-of-a-kind: "Vier Karten desselben Rangs, z. B. vier Siebenen. Haben zwei Spieler einen Vierling desselben Rangs, gewinnt die höhere fünfte Karte (der Kicker)."
full-house: "Ein Drilling und ein Paar in einer Hand, z. B. drei Damen und zwei Fünfen. Bei zwei Full Houses gewinnt der höhere Drilling."
flush: "Fünf Karten derselben Farbe (♠, ♥, ♦ oder ♣), die nicht aufeinanderfolgen. Bei zwei solchen Händen gewinnt die mit der höheren höchsten Karte, bei Gleichstand die mit der höheren nächsten Karte."
straight: "Fünf aufeinanderfolgende Karten, nicht alle in derselben Farbe, z. B. 5-6-7-8-9. Das Ass kann die höchste (A-K-Q-J-T) oder die niedrigste Karte (A-2-3-4-5) sein."
three-of-a-kind: "Drei Karten desselben Rangs und zwei andere. Im Hold'em gibt es zwei Varianten mit eigenen Namen: Set, wenn das Paar auf deiner Hand ist und die dritte Karte auf dem Board liegt, und Trips, wenn das Paar auf dem Board liegt und die dritte Karte auf deiner Hand ist."
set: "Ein Drilling aus einem Paar auf deiner Hand und einer Karte auf dem Board, z. B. 7♣ 7♦ auf einem Flop K-7-2."
two-pair: "Zwei verschiedene Paare und eine fünfte Karte, z. B. K-K-8-8-3. Bei Gleichstand entscheidet zuerst das höhere Paar, dann das niedrigere, zuletzt die fünfte Karte."
pair: "Zwei Karten desselben Rangs und drei andere, z. B. zwei Neunen. Schwächer ist nur High Card."
high-card: "Eine Hand ohne Paar oder bessere Kombination; über die Stärke entscheidet die höchste Karte, bei Gleichstand die nächsten."
kicker: "Die höchste Karte außerhalb der Kombination, die einen Gleichstand entscheidet. Beispiel: Ein Paar Asse mit König schlägt ein Paar Asse mit Dame."
wheel: "Die niedrigste Straße: A-2-3-4-5, bei der das Ass als niedrigste Karte zählt."
check: "Weiterspielen, ohne Chips zu setzen; nur möglich, wenn du nichts nachzahlen musst: In dieser Setzrunde hat noch niemand gesetzt (vor dem Flop kann das der Big Blind, wenn niemand erhöht hat). Nicht zu verwechseln mit Call, also dem Mitgehen beim Einsatz eines Gegners."
bet: "Das erste Setzen von Chips in einer Setzrunde, in der noch niemand gesetzt hat (im weiteren Sinn heißt jedes Setzen von Chips in den Pot Bet bzw. Einsatz)."
call: "So viele Chips in den Pot legen, wie die Bet oder der Raise des Gegners beträgt, um weiterzuspielen. Nicht zu verwechseln mit Check, also Weiterspielen ohne Einsatz, wenn niemand gesetzt hat."
raise: "Erhöhen über den Einsatz des Gegners hinaus; die anderen müssen die Differenz nachlegen, erneut erhöhen oder folden. Auch „Erhöhung“ genannt."
fold: "Aufgeben der Hand: Du gibst deine Karten ab und verlierst, was du schon in den Pot gelegt hast."
check-raise: "Du checkst zuerst und erhöhst, wenn der Gegner setzt, in derselben Setzrunde."
all-in: "Setzen aller deiner Chips. Von jedem Gegner kannst du dann höchstens so viel gewinnen, wie du selbst eingesetzt hast; um den Rest wird in einem Side Pot gespielt."
pot: "Alle Chips, die in der laufenden Hand gesetzt wurden. Sie gehen an den Spieler mit der besten Hand im Showdown (bei Side Pots wird um jeden Pot einzeln gespielt) oder an den Spieler, bei dem alle anderen gefoldet haben."
side-pot: "Ein separater Pot, der entsteht, wenn jemand all-in ist: Um ihn spielen nur Spieler, die mehr eingesetzt haben als der All-in-Spieler, deshalb kann dieser ihn nicht gewinnen."
split-pot: "Eine Situation, in der sich Spieler mit gleich starken Händen den Pot teilen, z. B. wenn beide dieselbe Straße spielen, die auf dem Board liegt."
playing-the-board: "Eine Situation, in der deine beste Fünf-Karten-Hand nur aus Gemeinschaftskarten besteht; deine Hole Cards bringen nichts, also teilst du den Pot bestenfalls."
board: "Die offenen Gemeinschaftskarten in der Mitte (Flop, Turn, River), die alle Spieler nutzen. Gemeint sind die Karten, nicht der Tisch, an dem gespielt wird (am Tisch, Finaltisch)."
community-cards: "Karten, die offen in die Mitte gelegt werden und die jeder Spieler für seine Hand nutzen kann; im Hold'em sind es fünf."
hole-cards: "Die zwei verdeckten Karten, die du im Hold'em zu Beginn einer Hand bekommst; nur du siehst sie."
small-blind: "Der kleinere Pflichteinsatz, den vor dem Austeilen der Spieler links vom Button zahlt (bei zwei Spielern der Button selbst); so heißt auch dieser Platz am Tisch."
big-blind: "Der größere Pflichteinsatz, den vor dem Austeilen der zweite Spieler links vom Button zahlt (bei zwei Spielern der Spieler gegenüber dem Button); so heißt auch dieser Platz. Er dient auch als Einheit für Stackgrößen und Ergebnisse."
chips: "Die Scheiben, mit denen am Tisch gespielt wird; im Cash Game stehen sie für Geld, im Turnier für Turnierpunkte."
stack: "Alle Chips, die ein Spieler vor sich hat; meist in Big Blinds angegeben (z. B. 100 Big Blinds)."
street: "Jargon für eine Setzrunde: Preflop, Flop, Turn und River sind die vier Streets. Beispiel: „Value auf drei Streets“ bedeutet Value Bets auf Flop, Turn und River."
betting-round: "Ein Abschnitt der Hand, in dem die Spieler nacheinander checken, setzen, callen, erhöhen oder folden; im Hold'em gibt es vier: Preflop, Flop, Turn und River."
preflop: "Die erste Setzrunde: nach dem Austeilen der Hole Cards, bevor der Flop kommt."
flop: "Die ersten drei Gemeinschaftskarten, die nach der Preflop-Setzrunde gleichzeitig aufgedeckt werden; so heißt auch die zweite Setzrunde."
turn: "Die vierte Gemeinschaftskarte und die dritte Setzrunde."
river: "Die fünfte und letzte Gemeinschaftskarte und die letzte Setzrunde vor dem Showdown."
showdown: "Das Aufdecken der Karten nach der letzten Setzrunde, wenn noch mindestens zwei Spieler in der Hand sind; die beste Hand gewinnt den Pot."
position: "Der Platz am Tisch relativ zum Button, der die Reihenfolge der Aktionen festlegt. Wer später handelt, sieht vor seiner Entscheidung mehr Aktionen der Gegner."
in-position: "Die Lage eines Spielers, der nach dem Flop als Letzter handelt und so vor seiner Entscheidung die Aktion des Gegners sieht."
out-of-position: "Die Lage eines Spielers, der nach dem Flop vor dem Gegner handelt und so entscheidet, ohne dessen Aktion zu kennen."
early-position: "Die ersten Plätze, die vor dem Flop handeln (z. B. UTG); nach dir kommen noch viele Spieler."
late-position: "Die Plätze, die als Letzte handeln: der Button und die Plätze direkt davor, vor allem der Cutoff."
utg: "Der erste Spieler, der vor dem Flop handelt; er sitzt direkt links vom Big Blind."
hijack: "Der Platz direkt vor dem Cutoff, also der zweite rechts vom Button."
cutoff: "Der Platz direkt rechts vom Button, der unmittelbar vor ihm handelt."
button: "Der Platz des Gebers, markiert mit einer „Dealer“-Scheibe. Nach dem Flop handelt er in jeder Setzrunde als Letzter."
outs: "Eine Karte, die noch im Deck ist und deine Hand verbessert, meist indem sie einen Draw vervollständigt. Beispiel: Bei einem Flush-Draw sind deine Outs die übrigen Karten deiner Farbe."
draw: "Eine Hand, die noch keine starke Kombination ist, aber mit den nächsten Gemeinschaftskarten eine werden kann, z. B. wenn dir eine Karte zum Flush oder zur Straße fehlt."
flush-draw: "Vier Karten einer Farbe (auf der Hand und auf dem Board zusammen); dir fehlt eine zum Flush."
straight-draw: "Vier Karten, denen eine zur Straße fehlt. Varianten: OESD (eine Karte fehlt an einem der beiden Enden) und Gutshot (eine Karte fehlt in der Mitte)."
oesd: "Abkürzung für open-ended straight draw: ein Straight-Draw aus vier aufeinanderfolgenden Karten, den eine Karte an einem der beiden Enden vervollständigt, z. B. 5-6-7-8 wartet auf eine Vier oder eine Neun."
gutshot: "Ein Straight-Draw, dem ein bestimmter Rang in der Mitte fehlt, z. B. 5-6-8-9 wartet nur auf eine Sieben."
backdoor: "Ein Draw auf dem Flop, der zwei passende Karten hintereinander braucht, auf Turn und River, z. B. drei Karten einer Farbe nach dem Flop."
pot-odds: "Das Verhältnis zwischen dem Betrag, den du zahlen musst, und dem Pot, den du gewinnen kannst (inklusive Einsatz des Gegners). Es zeigt, wie oft du gewinnen musst, damit sich ein Call lohnt."
implied-odds: "Pot Odds plus die Chips, die du auf späteren Streets zu gewinnen erwartest, wenn du deine Hand triffst."
equity: "Deine Chance, den Pot zu gewinnen, wenn alle restlichen Karten ohne weiteres Setzen ausgeteilt würden; meist in Prozent."
equity-realization: "Wie viel ihrer Equity eine Hand in Gewinn umwandelt, wenn weiter gesetzt wird (sie kann weniger oder mehr als ihre Equity realisieren); hängt u. a. von der Position ab und davon, wie leicht die Hand zu spielen ist."
expected-value: "Das durchschnittliche Ergebnis eines Spielzugs, wenn man ihn sehr oft wiederholen würde. Ein Spielzug, der im Schnitt ein Plus bringt, verdient langfristig, auch wenn er diesmal verliert."
combo: "Eine konkrete Zwei-Karten-Kombination mit Farben, z. B. A♠ K♥. Das Zählen solcher Kombinationen zeigt, wie viele Kombinationen einer bestimmten Hand wirklich in einer Range sind."
range: "Die Menge aller Hände, die ein Spieler in einer bestimmten Situation haben kann, oder der Hände, mit denen er einen bestimmten Spielzug machen würde."
mixed-hand: "Eine Hand, mit der die Gleichgewichtsstrategie mal den einen, mal den anderen Spielzug wählt (z. B. mal Raise, mal Call); beide Spielzüge sind korrekt. Man sagt auch, die Hand wird mit gemischter Strategie gespielt."
open: "Der erste Einstieg in den Pot vor dem Flop mit einem Raise, wenn alle vor dir gefoldet haben."
suited: "Zwei Hole Cards derselben Farbe, z. B. A♥ K♥ (Schreibweise AKs)."
offsuit: "Zwei Hole Cards unterschiedlicher Farbe, z. B. A♥ K♣ (Schreibweise AKo)."
pocket-pair: "Ein Paar aus deinen beiden Hole Cards, z. B. 8♣ 8♦ vor dem Flop."
connectors: "Hole Cards mit benachbarten Rängen, z. B. 8-7 oder 9-8; mit ihnen bildest du leichter eine Straße."
3-bet: "Die erste Erhöhung eines Opens vor dem Flop; der Name zählt den Big Blind als ersten Einsatz und das Open als zweiten."
4-bet: "Eine Erhöhung einer 3-Bet, also der vierte Einsatz in einer Setzrunde."
limp: "Einstieg in den Pot vor dem Flop, indem du nur den Big Blind callst, wenn noch niemand erhöht hat."
isolation: "Ein Raise nach einem oder mehreren Limps, um gegen den Limper (oft einen schwächeren Spieler) eins gegen eins zu spielen."
texture: "Der Charakter der Gemeinschaftskarten: wie viele Farben, ob die Karten nah beieinander liegen, ob ein Paar liegt. Davon hängt ab, welche Hände und Draws möglich sind."
dry: "Ein Board, auf dem wenige Draws und starke Hände möglich sind, z. B. K♠ 7♦ 2♣."
wet: "Ein Board, auf dem viele Draws und starke Hände möglich sind, z. B. J♥ T♥ 8♣."
rainbow: "Ein Flop mit drei Karten in drei verschiedenen Farben, sodass auf dem Flop niemand einen Flush-Draw hat."
two-tone: "Ein Flop, auf dem zwei Karten dieselbe Farbe haben, sodass Flush-Draws möglich sind."
monotone: "Ein Flop mit drei Karten derselben Farbe, sodass ein Flush schon fertig sein kann."
paired: "Ein Board, auf dem ein Paar liegt (zwei Karten desselben Rangs), z. B. 8-8-3."
connected: "Ein Board, auf dem jemand schon eine Straße haben kann, z. B. 9-8-7."
disconnected: "Ein Board mit weit auseinanderliegenden Karten, mit dem sich schwer eine Straße oder ein Straight-Draw bilden lässt, z. B. K-7-2."
semi-connected: "Ein Board mit Straight-Draws, auf dem aber noch keine Straße möglich ist, z. B. T-8-3 (Einteilung dieses Kurses)."
wetness: "Wie stark ein Board Draws und starke Hände begünstigt: von trocken bis nass. Man spricht auch davon, wie koordiniert das Board ist."
top-pair: "Ein Paar mit der höchsten Karte auf dem Board, z. B. K♠ Q♦ auf einem Flop K-7-2."
second-pair: "Ein Paar mit der zweithöchsten Karte auf dem Board, z. B. 7♠ 6♠ auf einem Flop K-7-2."
overpair: "Ein Pocket Pair, das höher ist als jede Karte auf dem Board, z. B. Q-Q auf einem Flop J-7-2."
c-bet: "Continuation Bet: ein Einsatz des Spielers, der in der vorherigen Runde der Aggressor war, z. B. ein Einsatz auf dem Flop nach einem Open preflop."
aggressor: "Der Spieler, der in der vorherigen Setzrunde als Letzter gesetzt oder erhöht hat."
initiative: "Die Rolle des letzten Aggressors: Er macht meist den nächsten Einsatz."
range-advantage: "Eine Situation, in der die Range eines Spielers auf einem bestimmten Board insgesamt mehr Equity hat als die Range des Gegners."
nuts-advantage: "Eine Situation, in der ein Spieler anteilig mehr der stärksten Hände in seiner Range hat als der Gegner."
nuts: "Die stärkste mögliche Hand auf einem bestimmten Board zu einem bestimmten Zeitpunkt. Beispiel: Auf K♥ 9♥ 4♥ 2♣ ist es der Flush mit dem Herz-Ass."
polarized: "Über eine Range: besteht vor allem aus sehr starken Händen und Bluffs, fast ohne mittlere Hände."
polarization: "Aufbau einer Range aus den Extremen: starke Hände für Value und Bluffs, ohne mittlere Hände."
linear: "Über eine Range: von oben aufgebaut, von den stärksten Händen abwärts, ohne eigene Gruppe von Bluffs. Verwandt ist der Begriff „merged range“ (eine nicht polarisierte Range); laut veröffentlichten Solver-Analysen ist merged eine Zwischenform zwischen dieser und einer polarisierten Range."
condensed: "Über eine Range: ohne die stärksten Hände (nach oben begrenzt) und vor allem aus mittleren Händen; das Gegenteil von polarisiert."
value: "Setzen mit einer starken Hand, damit der Gegner mit einer schwächeren Hand callt."
value-bet: "Ein einzelner Einsatz auf Value: mit einer starken Hand, damit schwächere Hände ihn callen."
bluff: "Ein Einsatz mit einer schwachen Hand, die im Showdown kaum gewinnt, damit der Gegner eine bessere Hand foldet."
semi-bluff: "Ein Einsatz mit einer noch schwachen Hand, die sich aber verbessern kann (z. B. mit einem Draw): Du gewinnst, wenn der Gegner foldet oder wenn du triffst."
blocker: "Eine Karte auf deiner Hand, die die Chance senkt, dass der Gegner bestimmte Hände hat. Beispiel: Mit dem Herz-Ass kann der Gegner keinen Flush mit dem Herz-Ass haben."
bluff-catcher: "Eine Hand, die nur die Bluffs des Gegners schlägt und gegen seine Value Bets verliert."
barrel: "Ein weiterer Einsatz in der nächsten Setzrunde nach deinem eigenen Einsatz in der vorherigen Runde."
second-barrel: "Der zweite Einsatz in Folge: Nach einer C-Bet auf dem Flop setzt der Spieler auf dem Turn erneut."
probe-bet: "Ein Einsatz auf dem Turn vom Spieler out of Position, nachdem der Preflop-Aggressor auf dem Flop gecheckt hat, statt eine C-Bet zu machen."
donk-bet: "Ein Einsatz eines Spielers, der setzt, bevor der Aggressor der vorherigen Runde handeln konnte."
overbet: "Ein Einsatz nach dem Flop, der größer ist als der ganze Pot."
effective-stack: "In einer Hand zwischen zwei Spielern: der kleinere ihrer Stacks, also das Meiste, was realistisch gewonnen oder verloren werden kann. Bei mehreren Spielern wird er für jedes Paar einzeln berechnet."
spr: "Der effektive Stack geteilt durch den Pot zu Beginn einer Street (für den Plan der Hand wird er auf dem Flop berechnet); er zeigt, wie tief die Stacks im Verhältnis zum Pot sind (je niedriger der SPR, desto schneller landet alles im Pot)."
mdf: "Der kleinste Teil deiner Range, den du gegen einen Einsatz verteidigen musst, damit ein Bluff des Gegners mit einer chancenlosen Hand nicht automatisch profitabel ist."
alpha: "Wie oft der Gegner folden muss, damit ein Bluff mit einer chancenlosen Hand auf null hinauskommt; hängt von der Einsatzgröße im Verhältnis zum Pot ab."
variance: "Die Streuung der Ergebnisse um den Erwartungswert: Selbst bei gutem Spiel können kurze Phasen deutlich im Minus oder im Plus liegen."
buy-in: "Der Betrag für den Einstieg in ein Turnier oder in ein Cash Game am Tisch."
bankroll: "Deine gesamte Reserve, die nur fürs Pokerspielen bestimmt ist; in dieser App in Buy-ins gezählt, nicht in Geld."
tilt: "Ein Zustand, in dem Emotionen (Wut, Frust, Euphorie) deine Entscheidungen am Tisch verschlechtern."
winrate: "Das durchschnittliche Ergebnis eines Spielers über eine längere Stichprobe; im Cash Game meist in bb/100, also Big Blinds pro hundert Hände."
downswing: "Eine Phase deutlich schlechterer Ergebnisse, meist größerer Verluste, als es dem Können entspräche; das Gegenteil eines Upswings."
session: "Eine Pokersitzung, vom Beginn bis zum Ende des Spiels."
stakes: "Die Höhe der Blinds im Cash Game oder des Buy-ins im Turnier; „Mikrolimits“ sind die niedrigsten Stufen."
standard-deviation: "Ein Maß für die Streuung der Ergebnisse (die Wurzel aus der Varianz); im Poker meist in bb/100 angegeben."
risk-of-ruin: "Die Wahrscheinlichkeit, dass du irgendwann deine ganze Bankroll verlierst, wenn du auf demselben Limit weiterspielst."
mental-game: "Die psychologische Seite des Pokers: der Umgang mit Tilt, Emotionen und Konzentration am Tisch."
tournament: "Eine Spielform, in der die Blinds in Abständen steigen und so lange gespielt wird, bis ein Spieler alle Chips hat; Preise bekommen die am besten Platzierten."
push-fold: "Eine vereinfachte Strategie für Short Stacks: Vor dem Flop gehst du entweder all-in oder foldest."
shove: "Ein All-in, meist als Raise vor dem Flop."
icm: "Ein Modell, das Turnierchips in Geldwert umrechnet und dabei die Auszahlungsstruktur und die Stacks aller Spieler berücksichtigt."
bubble: "Die Turnierphase kurz vor den bezahlten Plätzen, wenn bis zu den Preisen nur noch wenige Spieler ausscheiden müssen."
bubble-factor: "Eine Kennzahl aus dem ICM: wie viel mehr im Turnier der Verlust einer bestimmten Chipmenge schmerzt, als der Gewinn derselben Menge nützt."
cover: "Mindestens so viele Chips haben wie der Gegner. Wenn dich ein Gegner covert, beendet ein verlorenes All-in gegen ihn dein Turnier."
risk-premium: "Zusätzliche Equity über das hinaus, was die Pot Odds verlangen, die du im Turnier für ein All-in brauchst, weil ein Verlust mehr kostet, als ein Gewinn bringt."
m-ratio: "Dein Stack geteilt durch die Summe aus Blinds und Antes einer Hand: für wie viele volle Runden (Orbits) deine Chips ohne Spielen reichen."
red-zone: "Die Zone mit sehr niedrigem M: Es bleibt vor allem All-in oder Fold."
green-zone: "Die Zone mit hohem M: Dein Stack erlaubt freies Spiel, vorsichtig oder aggressiv."
ante: "Eine kleine Pflichtzahlung aller Spieler in den Pot vor dem Austeilen (vor allem in Turnieren)."
bb-ante: "Ein Ante-Format, bei dem statt aller Spieler der Spieler im Big Blind das Ante für den ganzen Tisch zahlt."
fold-equity: "Der Teil des Werts eines Spielzugs, der daher kommt, dass der Gegner folden kann."
gap-concept: "Das Prinzip, dass du zum Callen eines Opens eine stärkere Hand brauchst als zum Open selbst."
chip-ev: "Der Erwartungswert eines Spielzugs in Chips, ohne Umrechnung in Geld (ohne ICM)."
tournament-equity: "Dein erwarteter Anteil am Preispool bei gegebener Auszahlungsstruktur und gegebenen Stacks. Dasselbe nennt man auch „$EV“."
prize-pool: "Die Gesamtsumme an Geld, die unter den Preisträgern eines Turniers verteilt wird."
payout: "Der Preis für einen bestimmten Platz im Turnier; zusammen ergeben sie die Preisverteilung."
pay-jump: "Der Unterschied in der Auszahlung zwischen benachbarten Plätzen im Turnier; große Sprünge erhöhen die Risk Premium."
final-table: "Der letzte Tisch eines Turniers, an dem um die höchsten Preise gespielt wird."
short-stack: "Ein Stack, der im Verhältnis zu den Blinds klein ist; im Turnier meist einer mit nur noch wenigen Big Blinds."
nash-equilibrium: "Eine Kombination von Strategien, bei der sich kein Spieler verbessern kann, indem nur er allein seine Strategie ändert."
overcall: "Das Callen eines Einsatzes, den vor dir schon jemand gecallt hat."
heads-up: "Spiel eins gegen eins: Am Tisch oder in der Hand sind nur noch zwei Spieler."
dead-money: "Chips im Pot von Spielern, die ihn nicht mehr gewinnen können, z. B. von denen, die gefoldet haben."
stack-off: "Den ganzen Stack in einer Hand in den Pot bringen, also all-in gehen oder ein All-in callen."
exploit: "Ein bewusstes Abweichen von der Basisstrategie, um einen bestimmten Fehler eines Gegners oder des ganzen Spielerpools auszunutzen."
hud: "Eine Einblendung über dem Tisch im Online-Spiel, die Statistiken der Gegner aus früher gespielten Händen zeigt."
vpip: "HUD-Statistik: in welchem Anteil der Hände ein Spieler vor dem Flop freiwillig Geld in den Pot legt (callt oder erhöht)."
pfr: "HUD-Statistik: in welchem Anteil der Hände ein Spieler vor dem Flop erhöht."
wtsd: "HUD-Statistik: wie oft ein Spieler, der den Flop gesehen hat, zum Showdown kommt."
nit: "Ein sehr tighter Spieler, der fast nur mit starken Händen in den Pot geht."
regular: "Ein Stammspieler auf einem bestimmten Limit, der dort ein großes Volumen an Händen spielt; im Kurs dem Freizeitspieler gegenübergestellt."
tag: "Tight-aggressiver Stil: wenige Hände, aber aggressiv gespielt (Bets und Raises)."
lag: "Loose-aggressiver Stil: viele Hände, aggressiv gespielt."
recreational: "Ein Spieler, der zum Spaß spielt und meist schwächer ist als die Stammspieler; im Jargon abwertend „Fish“."
calling-station: "Abwertend für einen Spieler, der sehr oft callt, selbst mit schwachen Händen oder Draws."
maniac: "Abwertend für einen sehr loosen und aggressiven Spieler, der mit fast allem setzt und erhöht."
rake: "Die Gebühr, die ein Casino oder Online-Pokerraum für das Ausrichten des Spiels aus dem Pot nimmt."
rake-cap: "Der Höchstbetrag an Rake, den ein Pokerraum aus einer einzelnen Hand nehmen darf."
