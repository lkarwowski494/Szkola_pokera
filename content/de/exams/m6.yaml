# Pula pytań egzaminacyjnych modułu M6 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m6.*).
module: m6
drills:
  - kind: numeric
    id: m6.exam.q1
    family: m6.mdf
    rules: [R-M6-001, R-M6-005]
    prompt: "River. Im {{t:pot|Pot}} liegen {{n:exam.m6.pot}}, dein Gegner {{t:bet|setzt}} {{n:exam.m6.bet.three-quarters}}. Wie hoch ist die {{t:mdf}}, also welchen Anteil deiner {{t:range|Range}} verteidigst du mindestens? Gib die Zahl in Prozent ein."
    answer: exam.m6.mdf.three-quarters
    explanation: "{{t:mdf}} = {{t:pot}} ÷ ({{t:pot}} + Bet) = {{n:exam.m6.pot}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}}) = {{n:exam.m6.mdf.three-quarters}}. Wenn du öfter {{t:fold|foldest}}, macht ein {{t:bluff}} ohne Gewinnchance automatisch Gewinn."
  - kind: choice
    id: m6.exam.q2
    family: m6.alpha
    rules: [R-M6-002]
    prompt: "River. Im {{t:pot|Pot}} liegen {{n:exam.m6.pot}}. Du {{t:bluff|bluffst}} mit einer Hand ohne Chance und setzt {{n:exam.m6.bet.quarter}}. Wie oft muss dein Gegner {{t:fold|folden}}, damit dieser {{t:bluff}} bei null herauskommt?"
    options:
      - { text: "Öfter als in {{n:exam.m6.alpha.quarter}} der Fälle", correct: true, why: "Ja: Alpha = Bet ÷ ({{t:pot}} + Bet) = {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}}) = {{n:exam.m6.alpha.quarter}}. Ein kleiner {{t:bluff}} riskiert wenig, also reichen ihm seltene {{t:fold|Folds}}." }
      - { text: "Öfter als in {{n:exam.m6.mdf.quarter}} der Fälle", why: "Das ist die {{t:mdf}}: der Anteil der {{t:range|Range}}, den dein Gegner verteidigen sollte. Alpha ist der Rest zum Ganzen: {{n:exam.m6.alpha.quarter}}." }
      - { text: "Öfter als in {{n:eq.bet-quarter}} der Fälle", why: "Das ist die Equity, die dein Gegner zum {{t:call|Callen}} braucht; im Nenner steht zusätzlich sein {{t:call}}. Die Schwelle für einen {{t:bluff|Bluff}} ist Bet ÷ ({{t:pot}} + Bet) = {{n:exam.m6.alpha.quarter}}." }
  - kind: choice
    id: m6.exam.q3
    family: m6.mdf-concept
    rules: [R-M6-003]
    prompt: "Du verteidigst den {{t:big-blind}} gegen ein {{t:open|Open}} vom Button. Der Button {{t:bet|setzt}} am Flop einen C-Bet von 1/4 {{t:pot|Pot}}. Ein Freund {{t:fold|foldet}} hier über die Hälfte seiner Hände, weil „die {{t:mdf}} nur ein Richtwert ist“. Was stimmt daran nicht?"
    table: { position: BB }
    options:
      - { text: "Am Flop kann man etwas weniger als die {{t:mdf}} verteidigen, aber gegen kleine C-Bets {{t:fold|foldet}} man nicht massenhaft", correct: true, why: "Ja: Bei einem C-Bet von 1/4 {{t:pot|Pot}} beträgt die {{t:mdf}} {{n:exam.m6.mdf.quarter}}. Am Flop {{t:out-of-position|ohne Position}} darfst du etwas weniger verteidigen, weil die {{t:bluff|Bluffs}} des Buttons noch Equity haben, aber ein {{t:fold|Fold}} von über der Hälfte der Hände überlässt ihm den {{t:pot|Pot}} für nichts." }
      - { text: "Nichts: Am Flop gilt die {{t:mdf}} überhaupt nicht", why: "Die {{t:mdf}} ist am Flop ein Richtwert: Du kannst etwas weniger verteidigen, nicht beliebig weniger. Gegen einen kleinen C-Bet hast du ohnehin viele Hände mit genug Equity." }
      - { text: "Am Flop muss man mehr als die {{t:mdf}} verteidigen", why: "Umgekehrt: Am Flop {{t:out-of-position|ohne Position}} kannst du etwas weniger verteidigen, weil du nicht die ganze Equity schwacher Hände realisierst. Der Fehler deines Freundes ist, dass er viel zu viel {{t:fold|foldet}}." }
  - kind: choice
    id: m6.exam.q4
    family: m6.exploit
    rules: [R-M6-004]
    prompt: "Mikrolimits. Ein passiver {{t:recreational|Freizeitspieler}}, der selten {{t:bluff|blufft}}, {{t:bet|setzt}} am River 3/4 {{t:pot|Pot}}. Du hast ein {{t:pair|Paar}} Damen, und auf dem {{t:board|Board}} liegen ein Ass und ein König. Was tust du?"
    table: { hand: "Qd Qc", board: "Ah Jd 7c 4s Ks" }
    options:
      - { text: "Ich {{t:fold|folde}}", correct: true, why: "Ja: Dein {{t:pair|Paar}} ist niedriger als Ass und König auf dem {{t:board|Board}}, also schlägt es vor allem {{t:bluff|Bluffs}}. Dieser Spieler {{t:bluff|blufft}} selten, also {{t:fold|foldest}} du gegen ihn öfter, als die {{t:mdf}} angibt." }
      - { text: "Ich {{t:call|calle}}, weil die {{t:mdf}} verlangt, etwa {{n:exam.m6.mdf.three-quarters}} zu verteidigen", why: "Die {{t:mdf}} setzt voraus, dass dein Gegner oft genug {{t:bluff|blufft}}. Dieser Spieler tut das nicht, also bezahlt ein {{t:call}} vor allem bessere Hände." }
      - { text: "Ich {{t:raise|raise}}", why: "Nach einem {{t:raise}} {{t:fold|folden}} schlechtere Hände, und bessere zahlen. Ein {{t:pair|Paar}}, das niedriger ist als zwei Karten des {{t:board|Boards}}, ist keine Hand zum {{t:raise|Raisen}}." }
  - kind: choice
    id: m6.exam.q5
    family: m6.flop.price
    rules: [R-M6-005]
    prompt: "Flop. Im {{t:pot|Pot}} liegen {{n:exam.m6.pot}}. Der Button {{t:bet|setzt}} einmal {{n:exam.m6.bet.quarter}} und in einer anderen Hand {{n:exam.m6.bet.three-quarters}}. Wie viel Equity brauchst du jeweils zum {{t:call|Callen}}?"
    table: { position: BB }
    options:
      - { text: "Etwa {{n:eq.bet-quarter}} und {{n:eq.bet-three-quarters}}", correct: true, why: "Ja: Bet ÷ ({{t:pot}} + 2·Bet). {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}} + {{n:exam.m6.bet.quarter}}) = {{n:eq.bet-quarter}}, und {{n:exam.m6.bet.three-quarters}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}} + {{n:exam.m6.bet.three-quarters}}) = {{n:eq.bet-three-quarters}}. Gegen einen größeren Bet verteidigst du mit einer engeren {{t:range|Range}}." }
      - { text: "Etwa {{n:exam.m6.alpha.quarter}} und {{n:eq.bet-three-quarters}}", why: "Die erste Zahl ist Alpha (Bet ÷ ({{t:pot}} + Bet)), also die Schwelle für einen {{t:bluff|Bluff}} des Buttons. Für den Preis eines {{t:call|Calls}} rechne deinen eigenen {{t:call}} hinzu: {{n:eq.bet-quarter}}." }
      - { text: "In beiden Fällen gleich viel, weil es derselbe {{t:pot|Pot}} ist", why: "Nein: Der Preis hängt von der Bet-Größe ab. Ein größerer Bet bedeutet einen schlechteren Preis: {{n:eq.bet-three-quarters}} statt {{n:eq.bet-quarter}}." }
  - kind: choice
    id: m6.exam.q6
    family: m6.flop.call
    rules: [R-M6-006]
    prompt: "Du verteidigst den {{t:big-blind}} gegen ein {{t:open|Open}} vom Button. Am Flop {{t:check|checkst}} du, der Button {{t:bet|setzt}} einen C-Bet von 1/3 {{t:pot|Pot}}. Du hast ein Ass als höchste Karte, ohne {{t:draw}}. Was tust du?"
    table: { hand: "Ac 6h", board: "Js 8d 3d", position: BB }
    options:
      - { text: "Ich {{t:call|calle}}", correct: true, why: "Ja: Gegen einen kleinen C-Bet brauchst du nur etwa {{n:eq.bet-third}} Equity. Ass als höchste Karte schlägt einen Teil der {{t:bluff|Bluffs}} des Buttons und kann ein {{t:pair|Paar}} treffen, also verteidigst du es meist. Du {{t:fold|foldest}} die schwächsten Hände ohne {{t:pair|Paar}} und ohne {{t:draw}}." }
      - { text: "Ich {{t:fold|folde}}", why: "Zu tight: Gegen einen kleinen C-Bet wird Ass als höchste Karte meist verteidigt. Du {{t:fold|foldest}} schwächere Hände ohne {{t:pair|Paar}} und ohne {{t:draw}}." }
      - { text: "Check-Raise", why: "Einen Check-Raise machst du vor allem mit den stärksten Händen und {{t:draw|Draws}}. Diese Hand hat weder Value noch einen {{t:draw}}, der ihr einen zweiten Weg zum Gewinn gäbe." }
  - kind: choice
    id: m6.exam.q7
    family: m6.flop.fold
    rules: [R-M6-007]
    prompt: "Du verteidigst den {{t:big-blind}} gegen ein {{t:open|Open}} vom Button. Am Flop [[8c 4d 2h]] {{t:check|checkst}} du, und der Button {{t:bet|setzt}} einen C-Bet von 3/4 {{t:pot|Pot}}. Mit welcher dieser Hände ist ein {{t:call}} sinnvoller?"
    table: { board: "8c 4d 2h", position: BB }
    options:
      - { text: "[[Ad Jd]]", correct: true, why: "Ja: Beide Hände sind zwei hohe Karten ohne {{t:pair|Paar}}, aber AJ in Karo hat zusätzlich einen {{t:flush-draw}} (Backdoor) auf den höchsten {{t:flush}}: Mit einem Karo auf dem {{t:board|Board}} braucht sie noch zwei weitere Karos. Gegen einen großen C-Bet {{t:call|callst}} du eher genau mit so einer Hand." }
      - { text: "[[Ks Qs]]", why: "KQ in Pik hat hier keinen {{t:draw}}: Auf dem {{t:board|Board}} liegt kein Pik, und zur {{t:straight|Straße}} fehlt zu viel. Zwei hohe Karten ohne {{t:draw}} {{t:fold|foldest}} du gegen einen großen C-Bet meist." }
  - kind: choice
    id: m6.exam.q8
    family: m6.xr.semibluff
    rules: [R-M6-008]
    prompt: "Du verteidigst den {{t:big-blind}} gegen ein {{t:open|Open}} vom Button. Am Flop [[Jh 8c 4h]] {{t:check|checkst}} du, und der Button {{t:bet|setzt}} einen C-Bet von 1/3 {{t:pot|Pot}}. Welche dieser Hände spielst du am besten als Check-Raise?"
    table: { board: "Jh 8c 4h", position: BB }
    options:
      - { text: "[[Qh Th]]", correct: true, why: "Ja: {{t:flush-draw}} plus Gutshot (eine Neun) ist ein starker {{t:draw}}. Der Check-Raise gewinnt, wenn der Button {{t:fold|foldet}}, und wenn er zahlt, hast du noch viele Outs." }
      - { text: "[[Jd 5d]]", why: "{{t:top-pair|Top Pair}} mit schwachem Kicker ist eine Hand zum {{t:call|Callen}}. Nach einem Check-Raise {{t:fold|folden}} schlechtere Hände meist, und bessere zahlen." }
      - { text: "[[As 3c]]", why: "Ass als höchste Karte ohne {{t:draw}} hat keinen zweiten Weg zum Gewinn. Einen Check-Raise als {{t:bluff}} machst du vor allem mit {{t:draw|Draws}}." }
  - kind: numeric
    id: m6.exam.q9
    family: m6.xr.size
    rules: [R-M6-010]
    prompt: "Flop. Im {{t:pot|Pot}} liegen {{n:exam.m6.pot}}, der Button {{t:bet|setzt}} einen kleinen C-Bet von {{n:exam.m6.bet.quarter}}. Du machst einen Check-Raise auf {{n:xr.mult.example}} des C-Bets. Auf wie viel {{t:raise|raist}} du? Gib die Anzahl der {{t:chips}} ein."
    table: { position: BB }
    answer: exam.m6.xr
    explanation: "{{n:exam.m6.bet.quarter}} × {{n:xr.mult.example}} = {{n:exam.m6.xr}}. Gegen einen kleinen C-Bet {{t:raise|raist}} du näher an der Obergrenze des Bereichs {{n:xr.mult.low}}–{{n:xr.mult.example}}: Ein minimaler Check-Raise gäbe dem Button einen sehr guten Preis."
  - kind: choice
    id: m6.exam.q10
    family: m6.xr.when
    rules: [R-M6-009]
    prompt: "Du verteidigst den {{t:big-blind}} gegen ein {{t:open|Open}} vom Button. Auf welchem Flop machst du am häufigsten einen Check-Raise?"
    table: { position: BB }
    options:
      - { text: "[[8d 6c 5h]]", correct: true, why: "Ja: Auf einem niedrigen, {{t:connected|verbundenen}} Flop hat der {{t:big-blind}} mehr der stärksten Hände ({{t:two-pair}}, {{t:straight|Straßen}}) als der Button, also macht er hier öfter einen Check-Raise." }
      - { text: "[[Ks Qd Jh]]", why: "Ein hoher Flop mit nah beieinanderliegenden Karten trifft die {{t:range|Range}} des Buttons gut (AK, AQ, KQ, hohe {{t:pair|Paare}}). Hier machst du seltener einen Check-Raise." }
      - { text: "[[Ah Ad Qc]]", why: "Auf einem Flop mit einem {{t:pair|Paar}} Assen hat häufiger der Button die stärksten Hände, der mit vielen Assen {{t:open|eröffnet}} hat. Hier machst du selten einen Check-Raise." }
