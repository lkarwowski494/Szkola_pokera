# sc-07: German text of content/pl/scenarios/sc-07.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-07
module: m4
situation: "Du sitzt im {{t:big-blind}}. Der Button hat {{t:open|eröffnet}}, der {{t:small-blind}} hat {{t:fold|gefoldet}}, und du hast {{t:call|gecallt}}. Auf dem Flop {{t:check|checkst}} du, und der Button {{t:bet|setzt}} eine kleine {{t:c-bet}}."
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy: { expected: [call] }
  sredni: { expected: [fold], flop: { height: [high] } }
decisions:
  - street: flop
    kind: defend
    rule: R-M6-006
    spot: vs-open.bb-vs-btn
    pots: [6, 9]
    fractions: [0.333333]
    actions:
      - action: call
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} eine kleine {{t:c-bet}}. Du {{t:call|callst}}, weil du gegen eine {{t:bet}} von etwa {{n:cbet.size.small}} des {{t:pot|Pots}} nur etwa {{n:eq.bet-third}} Equity brauchst, und diese Hand schlägt entweder schon {{t:bluff|Bluffs}} oder kann sich verbessern. Du spielst mit fast jedem {{t:pair|Paar}}, jedem {{t:draw}}, einem zusätzlichen {{t:draw}} ({{t:backdoor}}), wenn du auch eine Karte hast, die höher ist als alle Karten auf dem {{t:board}}, und meist auch mit einem Ass als höchster Karte weiter."
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} eine kleine {{t:c-bet}}. Du {{t:fold|foldest}}, weil das eine der schwächsten Hände ist: ohne {{t:pair|Paar}}, ohne {{t:draw}}, selbst ohne zusätzlichen ({{t:backdoor}}), und ohne Ass. Gegen eine kleine {{t:c-bet}} verteidigst du breit, aber die schwächsten Hände ohne {{t:pair|Paar}} und ohne {{t:draw}} {{t:fold|foldest}} du."
