# SC-05 (M3): Button otwiera, BB broni, niski połączony flop (range-spot rfi.btn, potem cbet-case R-M5-004). Rola 06, sesja EH, 2026-11-11.
# Struktura jak pl (content/pl/scenarios/sc-05.yaml).
id: sc-05
module: m3
situation: "Du sitzt am Button, und alle vor dir haben {{t:fold|gefoldet}}."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [rainbow], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
  sredni:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [two-tone], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.btn
    rule: R-M3-003
    actions:
      - action: "raise 2.5"
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, {{w:stol}}, und alle vor dir haben {{t:fold|gefoldet}}. Du {{t:open|eröffnest}}, weil nur noch die Blinds übrig sind und du nach dem Flop {{t:position}} haben wirst; vom Button {{t:open|eröffnest}} du weit, etwa {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} der Hände."
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, {{w:stol}}, und alle vor dir haben {{t:fold|gefoldet}}. Ein {{t:fold}} ist zu vorsichtig: Der Solver {{t:open|eröffnet}} diese Hand meistens. Es sind nur noch die Blinds übrig, und nach dem Flop wirst du {{t:position}} haben, daher {{t:open|eröffnest}} du vom Button weit, etwa {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} der Hände."
  - street: flop
    kind: cbet-case
    rule: R-M5-004
    actions:
      - action: check
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und der {{t:big-blind}} {{t:check|checkt}}. Du {{t:check|checkst}}, weil der {{t:big-blind}} viele {{t:connectors}} und Hände mit kleinen Karten verteidigt, die einen niedrigen Flop treffen, und deine Hand ohne {{t:pair|Paar}} und ohne {{t:draw}} verfehlt hat. Auf so einem Flop {{t:c-bet|c-bettest}} du seltener als auf hohen Flops."
      - action: bet-small
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und der {{t:big-blind}} {{t:check|checkt}}. Ein kleiner {{t:bet}} ist zulässig, aber seltener: Auf einem niedrigen {{t:connected|verbundenen}} Flop {{t:c-bet|c-bettest}} du seltener als auf hohen, weil der {{t:big-blind}} viele {{t:connectors}} und Hände mit kleinen Karten verteidigt, die diesen Flop treffen."
      - action: bet-big
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und der {{t:big-blind}} {{t:check|checkt}}. Ein großer {{t:bet}} ist hier eine Ungenauigkeit: Auf einem {{t:connected|verbundenen}} Flop kann der {{t:big-blind}} schon eine {{t:straight|Straße}} haben, also setzt du, wenn überhaupt, klein. Auf einem niedrigen Flop {{t:c-bet|c-bettest}} du auch seltener als auf hohen, weil der {{t:big-blind}} viele {{t:connectors}} und Hände mit kleinen Karten verteidigt, die diesen Flop treffen."
