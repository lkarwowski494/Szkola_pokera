# sc-23: German text of content/pl/scenarios/sc-23.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-23
module: m8
situation: "Du sitzt am Button, und am River {{t:check|checkt}} der {{t:big-blind}}. Du überlegst einen {{t:bluff}} mit einer von zwei Händen, die beim {{t:showdown}} gegen keine Hand deines Gegners gewinnen. Nimm an, dass dein Gegner mit AA, KK, QQ, JJ, jedem AK und mit AQ {{t:suited}} {{t:call|callt}} und mit KQ, KJ, QJ, QT und JT {{t:fold|foldet}}, alle {{t:suited}}. Welche Hand wählst du für den {{t:bluff}}?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [best-hand] }
decisions:
  - street: river
    kind: pick-hand
    rule: R-M8-007
    mode: blockers
    calls: [AA, KK, QQ, JJ, AKs, AKo, AQs]
    folds: [KQs, KJs, QJs, QTs, JTs]
    actions:
      - action: best-hand
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}. Das ist der bessere {{t:bluff}}: Beide Hände verlieren beim {{t:showdown}}, aber diese lässt deinem Gegner weniger {{t:combo|Kombinationen}}, mit denen er {{t:call|callt}}, und nicht weniger von denen, die er {{t:fold|foldet}}. Wenn du eine Karte aus seinen starken Händen hältst, hat dein Gegner weniger {{t:combo|Kombinationen}} davon, also bleibt ihm öfter eine Hand, die er aufgibt."
      - action: other-hand
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}. Diese Hand ist der schwächere {{t:bluff}}: Beide verlieren beim {{t:showdown}}, aber die andere Hand lässt deinem Gegner weniger Hände, mit denen er {{t:call|callt}}, und nicht weniger Hände, die er {{t:fold|foldet}}. Für einen {{t:bluff}} wählst du eine Hand mit einem {{t:blocker}} gegen seine starken Hände, die nicht mehr Hände blockiert, die er aufgeben würde, als die andere."
