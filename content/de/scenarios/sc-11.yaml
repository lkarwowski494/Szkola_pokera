# sc-11: German text of content/pl/scenarios/sc-11.yaml (role 06, session CO, 2026-11-11; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-11
module: m5
situation: "Du hast vom Button {{t:open|eröffnet}}, der {{t:big-blind}} hat {{t:call|gecallt}} und {{t:check|checkt}} auf einem {{t:dry|trockenen}} hohen Flop."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy:
    flop: { height: [high], suits: [rainbow], ranks: [disconnected], wetness: [dry] }
    holding: [air]
    expected: [bet-small]
  sredni:
    flop: { height: [high], suits: [rainbow], ranks: [semi-connected], oesdPossible: false }
    holding: [air]
    expected: [bet-small]
decisions:
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und der {{t:big-blind}} {{t:check|checkt}}. Du {{t:bet|setzt}} klein, etwa {{n:cbet.size.small}} des {{t:pot|Pots}}, weil du den {{t:range-advantage}} hast und die schwachen Hände deines Gegners kaum Chancen haben: Eine kleine {{t:bet}} reicht, damit er sie {{t:fold|foldet}}. Der {{t:big-blind}} {{t:raise|raist}} die meisten AA, KK und AK vor dem Flop, also hat er nach einem bloßen {{t:call}} nur wenige davon."
      - action: check
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und der {{t:big-blind}} {{t:check|checkt}}. Ein {{t:check}} ist zulässig, aber seltener: Auf einem {{t:dry|trockenen}} hohen Flop {{t:c-bet|c-bettest}} du oft und klein, weil du den {{t:range-advantage}} hast und die schwachen Hände deines Gegners schon eine kleine {{t:bet}} {{t:fold|folden}} würden. Mit einem {{t:check}} gibst du ihnen eine freie Karte."
      - action: bet-big
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und der {{t:big-blind}} {{t:check|checkt}}. Eine große {{t:bet}} ist hier eine Ungenauigkeit: Auf einem {{t:dry|trockenen}} hohen Flop {{t:c-bet|c-bettest}} du meist klein, etwa {{n:cbet.size.small}} des {{t:pot|Pots}}, weil die schwachen Hände deines Gegners schon eine solche {{t:bet}} {{t:fold|folden}}."
