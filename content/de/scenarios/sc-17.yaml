# sc-17: German text of content/pl/scenarios/sc-17.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-17
module: m6
situation: "Du sitzt im {{t:big-blind}} und hast die {{t:open|Eröffnung}} des Buttons {{t:call|gecallt}}. Auf dem Flop {{t:check|checkst}} du, und der Button {{t:bet|setzt}} eine große {{t:c-bet}}."
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [fold] }
decisions:
  - street: flop
    kind: defend
    rule: R-M6-007
    spot: vs-open.bb-vs-btn
    pots: [8]
    fractions: [0.75]
    actions:
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} eine große {{t:c-bet}}. Du {{t:fold|foldest}}, weil du zwei hohe Karten ohne {{t:pair|Paar}} und ohne {{t:draw}} hast: {{t:out-of-position|Ohne Position}} kommt so eine Hand selten bis zum {{t:showdown}}, und ein {{t:pair|Paar}} mit einer hohen Karte verliert oft trotzdem. Gegen eine {{t:bet}} von etwa {{n:cbet.size.big}} des {{t:pot|Pots}} brauchst du schon etwa {{n:eq.bet-three-quarters}} Equity."
      - action: call
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} eine große {{t:c-bet}}. Ein {{t:call}} zahlt viel für eine Hand, die {{t:out-of-position|ohne Position}} selten bis zum {{t:showdown}} kommt: zwei hohe Karten ohne {{t:pair|Paar}} und ohne {{t:draw}}, und ein {{t:pair|Paar}} mit einer hohen Karte verliert oft trotzdem. Gegen eine große {{t:c-bet}} {{t:call|callst}} du eher dann, wenn du einen zusätzlichen {{t:draw}} hast, am besten zum höchsten {{t:flush}}."
