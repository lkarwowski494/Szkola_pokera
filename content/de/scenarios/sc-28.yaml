# sc-28: German text of content/pl/scenarios/sc-28.yaml (role 06, session HA, 2026-11-13; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-28
module: m9
situation: "Du hast ein {{t:overpair}}. Du hast auf dem Flop und am Turn {{t:bet|gesetzt}}, und der {{t:big-blind}} hat jedes Mal {{t:call|gecallt}}; am River {{t:check|checkt}} er. Nimm an, dass dein Gegner nicht {{t:raise|raist}}: Er {{t:call|callt}} mit jedem AK, AQ, AJ, KQ, KJ und QJ und {{t:fold|foldet}} jedes JT. Spielst du eine dritte {{t:street}} {{t:value|auf Value}} oder {{t:check|checkst}} du?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { marginMin: 0.2, expected: ["bet"] }
decisions:
  - street: river
    kind: river-value
    rule: R-M8-001
    calls: [AKs, AKo, AQs, AQo, AJs, AJo, KQs, KQo, KJs, KJo, QJs, QJo]
    folds: [JTs, JTo]
    pairKind: [overpair]
    dryBoard: true
    actions:
      - action: "bet"
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:check|checkt}} am River. Du {{t:bet|setzt}} ein drittes Mal, weil dein Gegner hier mit schwächeren Händen zahlt: Unter den Händen, die {{t:call|callen}} werden, gibt es mehr schlechtere als deine als bessere (ein Unentschieden teilt den {{t:pot}} und ändert die Rechnung nicht). Jeder {{t:call}} mit einer schlechteren Hand gewinnt eine {{t:bet}}, und jeder mit einer besseren verliert eine; wenn dein Gegner eine schlechtere Hand {{t:fold|foldet}}, gewinnst du denselben {{t:pot}}, den du nach einem {{t:check}} gewonnen hättest."
      - action: "check"
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:check|checkt}} am River. {{t:check|Checken}} verschenkt hier Wert: Unter den Händen, die {{t:call|callen}} werden, gibt es mehr schlechtere als deine als bessere (ein Unentschieden teilt den {{t:pot}} und ändert die Rechnung nicht), also gewinnt eine {{t:bet}} von ihnen mehr, als sie gegen die besseren verliert. Mit einem {{t:overpair}} spielst du eine dritte {{t:street}} {{t:value|auf Value}} dann, wenn dein Gegner mit schwächeren Händen zahlt, und hier ist das so."
