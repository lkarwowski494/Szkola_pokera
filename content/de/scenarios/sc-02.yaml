id: sc-02
module: m2
situation: "Mit kurzen Stacks hast du nach einer {{t:3-bet}} einen {{t:oesd}}; dein Gegner {{t:bet|setzt}} auf dem Flop wenig und am Turn viel."
table: 6max
positions: { hero: BTN, villain: BB }
