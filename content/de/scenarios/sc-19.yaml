    fractions: [0.1, 0.2, 0.25]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} im Verhältnis zum {{t:pot}} wenig. Du {{t:call|callst}}, weil du nur für eine Karte zahlst und dein {{t:flush-draw}} mit dieser Karte öfter trifft, als ein so niedriger Preis verlangt. Der {{t:flush}} kommt am Turn in etwa {{n:odds.flush.flop-turn}} der Fälle, ungefähr jede fünfte Karte. Das ist eine Vereinfachung: Du zählst nur die Outs des Draws. Jede deiner Karten, die höher als das Board ist, bringt noch höchstens {{n:pair.outs.per-rank}} unsichere Outs auf ein {{t:pair|Paar}}, aber hier ändert das die Antwort nicht."
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} im Verhältnis zum {{t:pot}} wenig. Ein {{t:fold}} gibt einen {{t:pot}} auf, an dem ein {{t:call}} verdient: Gegen einen so kleinen {{t:bet|Einsatz}} trifft dein {{t:flush-draw}} öfter, als der Preis verlangt. Das ist eine Vereinfachung: Du zählst nur die Outs des Draws. Jede deiner Karten, die höher als das Board ist, bringt noch höchstens {{n:pair.outs.per-rank}} unsichere Outs auf ein {{t:pair|Paar}}, aber hier ändert das die Antwort nicht."
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.6667, 0.75, 1]
    villain: bet
    rule: R-M7-008
    actions:
      - action: call
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}: Der Turn hat den {{t:flush}} nicht gebracht, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} viel. Ein {{t:call}} setzt auf {{t:implied-odds|Implied Odds}}, und hier gibt es keine: Bei niedriger {{t:spr}} sind so wenige {{t:chips}} hinter dem {{t:pot}} übrig, dass sie selbst dann, wenn du nach einem Treffer alle gewinnst, die verlorenen {{t:call|Calls}} nicht decken. Implied Odds zählen erst, wenn dein Gegner noch etwas hat, womit er dich bezahlen kann. Das ist eine Vereinfachung: Du zählst nur die Outs des Draws. Jede deiner Karten, die höher als das Board ist, bringt noch höchstens {{n:pair.outs.per-rank}} unsichere Outs auf ein {{t:pair|Paar}}, aber hier ändert das die Antwort nicht."
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}: Der Turn hat den {{t:flush}} nicht gebracht, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} viel. Du {{t:fold|foldest}}, weil die letzte Karte seltener trifft, als der Preis verlangt, und {{t:implied-odds|Implied Odds}} ändern daran nichts: Bei niedriger {{t:spr}} sind zu wenige {{t:chips}} hinter dem {{t:pot}} übrig, damit der Gewinn nach einem Treffer die verlorenen {{t:call|Calls}} ausgleicht. Der {{t:flush}} kommt am River in etwa {{n:odds.flush.turn-river}} der Fälle, ungefähr jede fünfte Karte. Das ist eine Vereinfachung: Du zählst nur die Outs des Draws. Jede deiner Karten, die höher als das Board ist, bringt noch höchstens {{n:pair.outs.per-rank}} unsichere Outs auf ein {{t:pair|Paar}}, aber hier ändert das die Antwort nicht."
