# sc-03: German text of content/pl/scenarios/sc-03.yaml (role 06, session CO, 2026-11-11; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-03
module: m2
situation: "Mit kurzen Stacks nach einer {{t:3-bet}} {{t:check|checkt}} ihr beide den Flop; am Turn hast du einen {{t:gutshot}}, und dein Gegner {{t:bet|setzt}}."
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 25
levels: [latwy, sredni]
bounds:
  latwy: { draws: [gutshot], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [fold] }
  sredni: { draws: [gutshot], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [fold] }
decisions:
  - street: turn
    kind: draw-call
    pots: [12, 14, 16]
    fractions: [0.25, 0.33, 0.5, 0.75, 1]
    villain: bet
    rule: R-M7-007
    actions:
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}}. Du {{t:fold|foldest}}, weil bis zum River eine Karte bleibt und nur ein Rang den {{t:gutshot}} vervollständigt: Du hast {{n:outs.gutshot}} {{t:outs}}, also trifft der River in etwa {{n:odds.gutshot.turn-river}} der Fälle, seltener, als der Preis verlangt. {{t:implied-odds|Implied Odds}} retten das nicht: Mit kurzen Stacks sind hinter dem {{t:pot}} zu wenige {{t:chips}} übrig, damit ein Gewinn nach einem Treffer die verlorenen {{t:call|Calls}} ausgleicht. Das ist eine Vereinfachung: Du zählst nur die Outs des Draws. Jede deiner Karten, die höher als das Board ist, bringt noch höchstens {{n:pair.outs.per-rank}} unsichere Outs auf ein {{t:pair|Paar}}, aber hier ändert das die Antwort nicht."
      - action: call
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}}. Ein {{t:call}} bezahlt eine Karte, die die {{t:straight}} nur in etwa {{n:odds.gutshot.turn-river}} der Fälle vervollständigt, seltener, als der Preis verlangt. Auch {{t:implied-odds|Implied Odds}} retten ihn nicht: Mit kurzen Stacks sind hinter dem {{t:pot}} zu wenige {{t:chips}} übrig, damit ein Gewinn nach einem Treffer die verlorenen {{t:call|Calls}} ausgleicht. Das ist eine Vereinfachung: Du zählst nur die Outs des Draws. Jede deiner Karten, die höher als das Board ist, bringt noch höchstens {{n:pair.outs.per-rank}} unsichere Outs auf ein {{t:pair|Paar}}, aber hier ändert das die Antwort nicht."
