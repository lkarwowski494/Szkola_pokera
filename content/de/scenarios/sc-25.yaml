id: sc-25
module: m8
situation: "Am River hast du {{t:second-pair|Second Pair}}, du sitzt am Button, und der {{t:big-blind}} {{t:check|checkt}}. Nimm an, dass dein Gegner nicht {{t:raise|raist}}: Er {{t:call|callt}} mit AA, KK und jedem AK, AQ und KQ und {{t:fold|foldet}} jedes QJ und JT. {{t:bet|Setzt}} du oder {{t:check|checkst}} du?"
table: 6max
