# sc-31: German text of content/pl/scenarios/sc-31.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-31
module: m10
situation: "Nimm an, dass dieser Gegner oft {{t:bet|setzt}} und {{t:raise|raist}}. Am River hast du ein {{t:pair|Paar}}, das nur gegen seine {{t:bluff|Bluffs}} gewinnt, und er {{t:bet|setzt}} viel. Nimm auch an, dass der Anteil der {{t:bluff|Bluffs}} an seinen {{t:bet|Bets}} so ist, wie die Hand angibt."
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [latwy, sredni, trudny]
bounds:
  latwy: { marginMin: 0.1, expected: [call] }
  sredni: { marginMin: 0.03, marginMax: 0.1, expected: [call] }
  trudny: { marginMin: 0.03, expected: [fold] }
decisions:
  - street: river
    kind: river-catch
    rule: R-M8-010
    pots: [10, 14, 20, 30]
    fractions: [0.75, 1, 1.5]
    bluffShares: [0.2, 0.25, 0.35, 0.4, 0.45, 0.5, 0.55]
    actions:
      - action: call
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} am River viel. Ein {{t:call}} verdient nur dann, wenn der Anteil der {{t:bluff|Bluffs}} an seinen {{t:bet|Bets}} größer ist als die nötige Equity bei dieser {{t:bet}}, weil deine Equity genau der Anteil der {{t:bluff|Bluffs}} ist. Die Beschreibung des Gegners ändert daran nichts: Du vergleichst die Zahlen aus der Hand. Eine größere {{t:bet}} erfordert mehr {{t:bluff|Bluffs}}: bei einer {{t:bet}} in Höhe des {{t:pot|Pots}} etwa {{n:eq.bet-pot}}."
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} am River viel. Ein {{t:fold}} ist nur dann gut, wenn der Anteil der {{t:bluff|Bluffs}} an seinen {{t:bet|Bets}} kleiner ist als die nötige Equity bei dieser {{t:bet}}: Dann verliert ein {{t:call}}, auch gegen einen Gegner, der oft {{t:bet|setzt}}. Wenn es mehr {{t:bluff|Bluffs}} gibt, gibt ein {{t:fold}} einen {{t:pot}} auf, an dem ein {{t:call}} verdient."
