# SC-04 (M3): UTG otwiera albo pasuje (range-spot rfi.utg), potem c-bet na suchym wysokim flopie (cbet-case R-M5-007). Rola 06, sesja EH,
# 2026-11-11. Struktura jak pl (content/pl/scenarios/sc-04.yaml); jeden poziom (D-1165).
id: sc-04
module: m3
situation: "Du sitzt {{t:utg|UTG}}, und noch niemand ist ins Spiel eingestiegen; wenn du {{t:open|eröffnest}}, wird der {{t:big-blind}} {{t:call|callen}} und auf dem Flop {{t:check|checken}}."
table: 6max
positions: { hero: UTG, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [high], suits: [rainbow], ranks: [disconnected, semi-connected], oesdPossible: false }
    holding: [air]
    expected: ["raise 2.5", bet-small]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.utg
    rule: R-M3-002
    actions:
      - action: "raise 2.5"
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, {{w:stol}}, und noch niemand ist ins Spiel eingestiegen. Du {{t:open|eröffnest}}, weil diese Hand in die enge {{t:range}} von {{t:utg|UTG}} passt: Hinter dir sitzen noch fünf Spieler, also hat öfter jemand eine bessere Hand, deshalb {{t:open|eröffnest}} du von {{t:utg|UTG}} nur etwa {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} der Hände."
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, {{w:stol}}, und noch niemand ist ins Spiel eingestiegen. Ein {{t:fold}} ist zu vorsichtig: Der Solver {{t:open|eröffnet}} diese Hand meistens auch von {{t:utg|UTG}}. Hinter dir sitzen noch fünf Spieler, daher ist die {{t:range}} von {{t:utg|UTG}} eng, etwa {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} der Hände, aber diese Hand passt hinein."
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und der {{t:big-blind}} {{t:check|checkt}}. Du {{t:bet|setzt}} klein, etwa {{n:cbet.size.small}} des {{t:pot|Pots}}, weil du den {{t:range-advantage}} hast und die schwachen Hände deines Gegners kaum Chancen haben: Eine kleine {{t:bet}} reicht, damit er sie {{t:fold|foldet}}."
      - action: check
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und der {{t:big-blind}} {{t:check|checkt}}. Ein {{t:check}} ist zulässig, aber seltener: Auf einem {{t:dry|trockenen}} hohen Flop {{t:c-bet|c-bettest}} du oft und klein, weil du den {{t:range-advantage}} hast und die schwachen Hände deines Gegners schon eine kleine {{t:bet}} {{t:fold|folden}} würden. Mit einem {{t:check}} gibst du ihnen eine freie Karte."
      - action: bet-big
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und der {{t:big-blind}} {{t:check|checkt}}. Eine große {{t:bet}} ist hier eine Ungenauigkeit: Auf einem {{t:dry|trockenen}} hohen Flop {{t:c-bet|c-bettest}} du meist klein, etwa {{n:cbet.size.small}} des {{t:pot|Pots}}, weil die schwachen Hände deines Gegners schon eine solche {{t:bet}} {{t:fold|folden}}."
