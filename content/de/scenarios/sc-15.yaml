# sc-15: German text of content/pl/scenarios/sc-15.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-15
module: m6
situation: "Du sitzt im {{t:big-blind}} und hast die {{t:open|Eröffnung}} des Buttons {{t:call|gecallt}}. Auf dem Flop {{t:check|checkst}} du, und der Button {{t:bet|setzt}} eine kleine {{t:c-bet}}."
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [call] }
decisions:
  - street: flop
    kind: defend
    rule: R-M6-006
    spot: vs-open.bb-vs-btn
    pots: [6, 9]
    fractions: [0.333333]
    actions:
      - action: call
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} eine kleine {{t:c-bet}}. Du {{t:call|callst}}, weil diese Hand entweder schon {{t:bluff|Bluffs}} schlägt oder sich verbessern kann, und eine kleine {{t:bet}} erfordert wenig Equity. Die {{t:mdf}} bei einer {{t:bet}} von {{n:cbet.size.small}} des {{t:pot|Pots}} ({{n:mdf.bet-third}} der {{t:range}}) ist ein Bezugspunkt: Auf dem Flop kannst du {{t:out-of-position|ohne Position}} etwas weniger verteidigen, aber gegen eine kleine {{t:c-bet}} {{t:fold|foldest}} du nicht massenhaft."
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:bet|setzt}} eine kleine {{t:c-bet}}. Ein {{t:fold}} gibt eine Hand auf, die gegen eine so kleine {{t:bet}} genug Equity hat: Sie schlägt entweder schon {{t:bluff|Bluffs}} oder kann sich verbessern. Auf dem Flop kannst du {{t:out-of-position|ohne Position}} etwas weniger verteidigen, als die {{t:mdf}} angibt, aber gegen kleine {{t:c-bet|C-Bets}} {{t:fold|foldest}} du nicht massenhaft."
