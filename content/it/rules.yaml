# Reguły odruchowe „Jeśli X, to Y, bo Z”. Poziom: rules (zasady gry), math, gto, heuristic, exploit.
# Kryteria poziomów (S-05, audyt 4.10):
#   math      – twierdzenie, które samo jest rachunkiem (outy, szanse, cena sprawdzenia, znak EV, dominacja jednej akcji nad drugą);
#   heuristic – zalecenie wyprowadzone z rachunku albo z literatury, bez wyniku solvera;
#   gto       – opublikowany wynik solvera albo rozwiązania równowagi;
#   exploit   – dostosowanie do typu gracza; musi podać populację;
#   rules     – zasady gry i definicje.
# Reguła eksploatacyjna musi podać populację źródłową (walidacja w content-build).
# Pole source: pełny opis źródeł z adresami i cytatami najwyżej 2 zdania, bez nazw serwisów i marek (decyzja właściciela
# z 9.10.2026); zostaje w repozytorium. Pole sources: jedno niezależne źródło (organizacja albo autor) = jedna pozycja
# { kind, url? }; kind: math, rules, solver-pub, solver-app, book, study, reference, training, population (SourceKind
# w content-schema). Aplikacja pokazuje tylko rodzaj i liczbę źródeł, np. „serwisy szkoleniowe (3)”; jedno źródło inne
# niż rachunek dostaje dopisek „jedno źródło”.
# Pole check (tryb gry M13, dokument 14, 4.4.3 i 6.2 A): warunek sprawdzalny automatycznie w silniku oceny
# (packages/poker-core/src/grading.ts). kind = rodzaj sprawdzenia, players/stackBb = konfiguracje stołu, których
# dotyczy źródło reguły (5.5; brak = każda, reguły rachunkowe), streets, spots (spoty solvera), drill (przypadki
# c-betu), params (liczby jako n:klucz). Reguły-zakazy (free-check-fold, no-limp) oceniają tylko naruszenie.

- id: R-M0-001
  module: m0
  if: "due giocatori hanno combinazioni diverse"
  then: "vince la combinazione più alta nella classifica, indipendentemente dal valore delle carte"
  because: "la classifica delle combinazioni decide prima del valore delle carte; un {{t:flush|colore}} batte sempre una {{t:straight|scala}}, un {{t:full-house|full}} batte sempre un {{t:flush|colore}}"
  level: rules
  source: "regole del Texas Hold'em: regolamento di un casinò approvato dal regolatore del gioco d'azzardo della California (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf), Card Values and Hand Rankings: «The ranking of hands for Texas Hold'em, in order from highest to lowest rank, shall be»; regolamento del poker di un casinò di Perth approvato dal regolatore (RAG/551) (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf), 10.1; a supporto: List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-002
  module: m0
  if: "entrambi i giocatori hanno lo stesso nucleo della combinazione: la stessa {{t:pair|coppia}}, lo stesso {{t:three-of-a-kind|tris}} o la stessa {{t:two-pair|doppia coppia}}"
  then: "decidono i kicker, confrontati uno per uno dal più alto, ma solo quelli che rientrano nelle 5 carte migliori; se le cinquine sono identiche, il {{t:split-pot|piatto viene diviso}}"
  because: "conta prima il rango della combinazione, poi la sua altezza, e i kicker solo a nucleo identico; conta solo la migliore cinquina tra le 7 carte"
  level: rules
  source: "regole del Texas Hold'em: regolamento del poker di un casinò di Perth approvato dal regolatore (RAG/551) (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf), 10.3–10.4: «all cards count, for example, Q:Q:7:7:9 shall lose to Q:Q:7:7:10»; Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), sezioni 3 e 5; a supporto, l'ordine del confronto: List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-003
  module: m0
  if: "le 5 carte migliori di entrambi i giocatori sono sul {{t:board|board}}"
  then: "il {{t:split-pot|piatto viene diviso}}"
  because: "entrambi giocano la stessa cinquina («{{t:playing-the-board|giocare il board}}»)"
  level: rules
  source: "regole del Texas Hold'em: Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), sezione 5 («play the board»); regolamento di un casinò approvato dal regolatore del gioco d'azzardo della California (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf): «the pot shall be split equally among all players with the winning hand»; a supporto: Texas hold 'em (https://en.wikipedia.org/wiki/Texas_hold_%27em) (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/Texas_hold_%27em" }]

- id: R-M1-001
  module: m1
  if: "nessuno prima di te ha {{t:bet|puntato}} in questo giro"
  then: "puoi fare {{t:check|check}} o {{t:bet|puntare}}"
  because: "puoi {{t:call|chiamare}} e {{t:raise|rilanciare}} solo una {{t:bet|puntata}} già esistente"
  level: rules
  source: "regole del Texas Hold'em: Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), sezione 3 («fold, check, bet, call, or raise») (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }]
- id: R-M1-002
  module: m1
  if: "puoi fare {{t:check|check}} gratis"
  then: "non {{t:fold|foldi}} mai"
  because: "il {{t:fold|fold}} cede il {{t:pot|piatto}} senza alcun vantaggio, mentre il {{t:check|check}} non costa nulla"
  level: math
  check: { kind: free-check-fold }
  source: "calcolo: il check costa 0 e conserva la possibilità di vincere il piatto, quindi non è mai peggiore del fold"
  sources: [{ kind: math }]
- id: R-M1-003
  module: m1
  if: "qualcuno ha {{t:bet|puntato}} e non vuoi continuare"
  then: "{{t:fold|foldi}}"
  because: "perdi solo ciò che hai già messo; ogni {{t:call|chiamata}} senza motivo è una perdita in più"
  level: math
  source: "calcolo: il fold chiude la partecipazione senza ulteriori versamenti, quindi la perdita è solo ciò che è già stato messo; chiamare con una mano con cui non continui aumenta la perdita dell'importo della chiamata"
  sources: [{ kind: math }]
- id: R-M1-004
  module: m1
  if: "la mano passa al {{t:betting-round|giro di puntate}} successivo"
  then: "il flop sono 3 {{t:community-cards|carte comuni}}, il turn e il river una ciascuno; dopo le puntate sul river, i giocatori rimasti (almeno due) scoprono le carte (showdown)"
  because: "sono le regole del Texas Hold'em: quattro {{t:betting-round|giri di puntate}}, e il river è l'ultimo"
  level: rules
  source: "regole del Texas Hold'em: Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), sezione 5 («Three boardcards are turned simultaneously … The next two boardcards are turned one at a time»); Wikipedia, Texas hold 'em (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules }]

- id: R-M2-001
  module: m2
  if: "sul flop hai {{n:draw.flush.seen}} carte per il {{t:flush|colore}}"
  then: "hai {{n:outs.flush}} out: circa {{n:odds.flush.flop-turn}} di probabilità di fare {{t:flush|colore}} al turn, e circa {{n:odds.flush.flop-river}} entro il river solo se vedi entrambe le carte senza altre {{t:bet|puntate}} (all-in)"
  because: "un seme ha {{n:cards.per-suit}} carte e ne vedi {{n:draw.flush.seen}}; la {{t:call|chiamata}} di una {{t:bet|puntata}} sul flop compra una sola carta"
  level: math
  source: "calcolo esatto"
  sources: [{ kind: math }]
- id: R-M2-002
  module: m2
  if: "hai contato gli out"
  then: "stimi la probabilità di chiudere: out × 2 con una carta, out × 4 con due; di fronte a una {{t:bet|puntata}} sul flop conti una carta (× 2), e × 4 solo se vedrai turn e river senza altre {{t:bet|puntate}} (all-in)"
  because: "per il river l'avversario può farti pagare a parte; la regola del 2 e del 4 sbaglia di circa {{n:rule24.error.max.pp}} punti percentuali con al massimo {{n:rule24.outs.max}} out"
  level: math
  source: "sito di formazione, Poker drawing odds & outs explained (https://upswingpoker.com/poker-drawing-odds-outs-explained/): «For anything 10 outs or less, however, its accurate within 2% for the turn and river calculation»; calcolo: errore massimo di 1,7 pp con 10 out (documento 12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/poker-drawing-odds-outs-explained/" }, { kind: math }]
- id: R-M2-003
  module: m2
  if: "l'avversario punta mezzo {{t:pot|piatto}}"
  then: "per {{t:call|chiamare}} ti serve {{n:eq.bet-half}} di equity"
  because: "paghi 1 parte, e il {{t:pot|piatto}} dopo la tua {{t:call|chiamata}} ha 4 parti ({{t:pot|piatto}} 2, puntata 1, la tua {{t:call|chiamata}} 1), quindi ti serve 1 parte su 4"
  level: math
  source: "calcolo: puntata/(piatto+2·puntata)"
  sources: [{ kind: math }]
- id: R-M2-004
  module: m2
  if: "l'avversario punta l'intero {{t:pot|piatto}}"
  then: "per {{t:call|chiamare}} ti serve {{n:eq.bet-pot}} di equity"
  because: "paghi 1 parte, e il {{t:pot|piatto}} dopo la tua {{t:call|chiamata}} ha 3 parti ({{t:pot|piatto}} 1, puntata 1, la tua {{t:call|chiamata}} 1), quindi ti serve 1 parte su 3"
  level: math
  source: "calcolo: puntata/(piatto+2·puntata)"
  sources: [{ kind: math }]
- id: R-M2-005
  module: m2
  if: "la tua equity è minore dell'equity necessaria (con un {{t:draw|progetto}}: la probabilità di chiudere sulle carte che vedrai a questo prezzo)"
  then: "{{t:fold|foldi}} (senza argomenti aggiuntivi, ad es. le implied odds)"
  because: "ogni {{t:call|chiamata}} del genere perde soldi nel lungo periodo"
  level: math
  check: { kind: draw-price, streets: [flop] }
  source: "calcolo: EV = equity × (piatto dopo la tua chiamata) − chiamata; negativo quando equity < chiamata ÷ piatto dopo la tua chiamata"
  sources: [{ kind: math }]

- id: R-M3-001
  module: m3
  if: "sei al Button e tutti prima di te hanno {{t:fold|foldato}}"
  then: "{{t:open|apri}} più largo che da tutte le altre {{t:position|posizioni}} prima dei blind; solo lo {{t:small-blind|small blind}} {{t:open|apre}} in modo altrettanto largo"
  because: "dal flop in poi parli per ultimo e dietro di te restano solo i blind"
  level: gto
  source: "sito con tabelle del solver, 6-max 100bb NL500 (https://beyondgto.com/ranges/btn-open-6max-100bb, https://beyondgto.com/ranges/sb-open-6max-100bb): BTN 42%, SB 44%; sito di formazione, Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/): SB leggermente più largo del Button, 40–50%; sito con tabelle preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): BTN 40–45%, SB 39–47% (documento 12, D2)"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-002
  module: m3
  if: "tutti hanno {{t:fold|foldato}} fino a te in {{t:utg|UTG}}"
  then: "{{t:open|apri}} circa {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} delle mani"
  because: "dietro di te ci sono ancora cinque giocatori, quindi più spesso qualcuno ha una mano migliore"
  level: gto
  check: { kind: solver-spot, players: [6], stackBb: [100], spots: [rfi.utg] }
  source: "sito di un solver commerciale, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/): UTG 17,6%; sito con tabelle del solver (NL500, https://beyondgto.com/ranges/lj-open-6max-100bb, …/hj-…, …/co-…, …/btn-open-6max-100bb): UTG 17%, HJ 22%, CO 28%, BTN 42%; sito con tabelle preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): 15–17 / 19–22 / 25–28 / 40–45% (documento 12 M0–M3, D6)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/lj-open-6max-100bb" }]
- id: R-M3-003
  module: m3
  if: "tutti hanno {{t:fold|foldato}} fino a te al Button"
  then: "{{t:open|apri}} circa {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} delle mani"
  because: "restano solo i blind, e dopo il flop avrai la {{t:position|posizione}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.btn, nine.rfi.btn] }
  source: "sito con tabelle del solver, BTN open 6-max 100bb (https://beyondgto.com/ranges/btn-open-6max-100bb, NL500): circa 42%; sito con tabelle preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): 40–45% (documento 12 M0–M3, D6)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-004
  module: m3
  if: "entri nella mano per primo"
  then: "{{t:raise|rilanci}} o {{t:fold|foldi}}, non completi solo il blind (limp); dallo {{t:small-blind|small blind}} è una semplificazione: alcune soluzioni dei solver limpano una parte delle mani"
  because: "il {{t:raise|rilancio}} può vincere subito i blind e ti dà l'{{t:initiative|iniziativa}}; il limp rinuncia a entrambe le cose"
  level: heuristic
  check: { kind: no-limp, players: [6, 9], stackBb: [100] }
  source: "sito di formazione, Why limping is bad (https://upswingpoker.com/why-limping-in-poker-is-bad/): «If you make everyone fold preflop, you win 100% of the pot … You can't ever do that in a pot you've limped into»; sito con tabelle del solver, open 6-max 100bb (https://beyondgto.com/ranges/lj-open-6max-100bb, lo stesso per HJ, CO, BTN): «raising rather than limping or jamming at this depth», SB (https://beyondgto.com/ranges/sb-open-6max-100bb): «At 100bb the whole range plays as raise-or-fold». Small blind: contraddizione al livello 2, sito di formazione con tabelle del solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics): «completes (limps) 20.5%»; il raise-or-fold dallo SB è una semplificazione dichiarata, perché l'albero del solver dell'app non ha limp (D-144; documento 12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/why-limping-in-poker-is-bad/" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]
- id: R-M3-005
  module: m3
  if: "puoi scegliere tra le stesse carte dello stesso seme e di semi diversi"
  then: "la mano dello stesso seme (suited) è più forte"
  because: "ti dà una strada in più per vincere con il {{t:flush|colore}}"
  level: math
  source: "calcolo dell'equity"
  sources: [{ kind: math }]
- id: R-M3-006
  module: m3
  if: "tutti hanno {{t:fold|foldato}} fino a te in {{t:hijack|HJ}} o in {{t:cutoff|CO}}"
  then: "{{t:open|apri}} più largo che da {{t:utg|UTG}} e più stretto che dal Button; dal {{t:cutoff|CO}} più largo che dall'{{t:hijack|HJ}}"
  because: "meno giocatori restano dietro di te, più raramente qualcuno ha una mano migliore e più spesso dopo il flop hai la {{t:position|posizione}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.hj, rfi.co, nine.rfi.hj, nine.rfi.co] }
  source: "sito di un solver commerciale, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/): UTG 17,6%; sito con tabelle del solver (NL500, https://beyondgto.com/ranges/hj-open-6max-100bb, https://beyondgto.com/ranges/co-open-6max-100bb): UTG 17%, HJ 22%, CO 28%, BTN 42%; sito con tabelle preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): 15–17 / 19–22 / 25–28 / 40–45% (documento 12 M0–M3, D6): il range di apertura cresce da UTG al Button"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/hj-open-6max-100bb" }]
- id: R-M3-007
  module: m3
  if: "entri nella mano per primo con un {{t:raise|rilancio}}"
  then: "{{t:raise|rilanci}} a {{n:pf.open-size}} da ogni {{t:position|posizione}}, e dallo {{t:small-blind|small blind}} a {{n:pf.open-size-sb}} (semplificazione)"
  because: "un'unica dimensione da ogni {{t:position|posizione}} è semplice e non rivela la forza della mano; dallo {{t:small-blind|small blind}} giochi {{t:out-of-position|fuori posizione}}, quindi {{t:raise|rilanci}} un po' di più"
  level: heuristic
  check: { kind: open-size, players: [6, 9], stackBb: [100], params: { open: "n:pf.open-size", openSb: "n:pf.open-size-sb" } }
  source: "sito con tabelle preflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): «the standard open size is 2.5bb from all positions … 3bb from the small blind»; sito di un solver commerciale, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/): UTG 2bb, CO 2,3bb, BTN 2,5bb, SB 3bb (semplificazione, documento 12, D8)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }]
- id: R-M3-008
  module: m3
  if: "hai una mano del gruppo delle più forti (AA, KK, QQ, AK) e qualcuno prima di te ha {{t:raise|rilanciato}}"
  then: "di solito {{t:raise|rilanci}} di nuovo (3-bet) per {{t:value|valore}}, invece di limitarti a {{t:call|chiamare}}"
  because: "queste mani sono favorite contro la maggior parte delle mani con cui l'avversario {{t:open|apre}}; il 3-bet fa crescere il {{t:pot|piatto}} e riduce il numero di avversari"
  level: heuristic
  source: "sito con tabelle di 3-bet, 3-bet ranges (https://pokerpro.tools/preflop/3-bet-ranges): QQ+ e AK nella parte di valore contro ogni posizione («Mostly 3-bet»); sito con tabelle preflop, UTG strategy (https://www.preflopwizard.app/blog/poker-utg-strategy): AA–JJ e AKs (documento 12, D9)"
  sources: [{ kind: training, url: "https://pokerpro.tools/preflop/3-bet-ranges" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-utg-strategy" }]
- id: R-M3-009
  module: m3
  if: "tutti hanno {{t:fold|foldato}} fino a te in {{t:small-blind|small blind}}"
  then: "{{t:open|apri}} largo, circa {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}} delle mani, con un {{t:raise|rilancio}} a {{n:pf.open-size-sb}} oppure con il {{t:fold|fold}} (semplificazione: alcune soluzioni dei solver limpano una parte delle mani dallo {{t:small-blind|small blind}})"
  because: "giochi ormai solo contro il {{t:big-blind|big blind}}; dopo il flop parli per primo, quindi {{t:open|apri}} più o meno largo come dal Button, non molto di più"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.sb, nine.rfi.sb] }
  source: "sito con tabelle del solver, SB open 6-max 100bb NL500 (https://beyondgto.com/ranges/sb-open-6max-100bb): circa 44%, raise-or-fold; sito di formazione, Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/): 40–50%; sito con tabelle preflop (https://www.preflopwizard.app/blog/6-max-preflop-charts): 39–47%; l'intervallo 40–45% è la parte comune delle strategie senza limp (documento 12, D3). Semplificazione raise-or-fold (D-144): sito di formazione con tabelle del solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics): «The small blind raises (3bb) 33.1% : completes (limps) 20.5%»"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]

- id: R-M3-010
  module: m3
  if: "giochi a un tavolo da 9 e tutti prima di te hanno {{t:fold|foldato}}"
  then: "da {{t:utg|UTG}}, {{t:utg|UTG}}+1 e {{t:utg|UTG}}+2 {{t:open|apri}} più stretto che da {{t:utg|UTG}} a un tavolo da 6; da LJ in poi giochi come a un tavolo da 6 (LJ come {{t:utg|UTG}})"
  because: "dietro di te siedono più giocatori che a un tavolo da 6, quindi più spesso qualcuno ha una mano migliore; quando i primi giocatori {{t:fold|foldano}}, dietro LJ restano tanti giocatori quanti dietro {{t:utg|UTG}} a un tavolo da 6"
  level: heuristic
  check: { kind: solver-spot, players: [9], stackBb: [100], spots: [nine.rfi.utg, nine.rfi.utg1, nine.rfi.utg2, nine.rfi.lj] }
  source: "solver preflop del progetto, tavolo da 9 100bb (ADR-20; documento 10, «Misurazione N9a finale»: validazione parziale N1–N4, NashConv 0,0094bb; composizione UTG–UTG+2 non verificata, e frequenze senza validazione di livello 2 (D-153), quindi la regola indica solo la direzione, senza numeri del solver; livello heuristic, D-144). Coerente con l'intervallo comune delle tabelle 9-max di livello 4: UTG circa 9–13%, UTG+1 circa 11–14% (sito con tabelle preflop, 9-Max Preflop Chart, https://preflopwizard.app/blog/9-max-preflop-chart; secondo sito con tabelle preflop, https://about-poker.com/preflop-gto/preflop-range-chart-cash-game; documento 10, «Configurazione 9-max 100bb»). Il gioco dopo i fold di UTG–UTG+2 è esattamente il gioco 6-max (test dell'albero)"
  sources: [{ kind: training, url: "https://preflopwizard.app/blog/9-max-preflop-chart" }, { kind: training, url: "https://about-poker.com/preflop-gto/preflop-range-chart-cash-game" }, { kind: solver-app }]
- id: R-M3-011
  module: m3
  if: "hai due carte diverse e controlli se insieme possono formare una {{t:straight|scala}}"
  then: "più sono vicine, più modi ci sono: carte adiacenti da 5-4 a J-T stanno in quattro {{t:straight|scale}} diverse, con un buco in tre, e a cinque o più ranghi di distanza (es. 7-2) in nessuna"
  because: "una {{t:straight|scala}} sono cinque ranghi consecutivi; più grande è il buco tra le carte, meno cinquine così le contengono entrambe (l'asso conta anche come uno)"
  level: math
  source: "calcolo: le dieci scale da A-2-3-4-5 a 10-J-Q-K-A verificate per ognuna delle 169 classi di mani; definizione: regolamento approvato dal regolatore californiano (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf)"
  sources: [{ kind: math }, { kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }]
- id: R-M3-012
  module: m3
  if: "hai una carta alta con una seconda carta più debole (es. K5 o A7), e un avversario può avere la stessa carta alta con un {{t:kicker}} migliore"
  then: "se fate entrambi {{t:pair|coppia}} con quella carta, l'avversario con il {{t:kicker}} migliore ti batte (la tua mano è dominata); due carte alte funzionano al contrario: un {{t:kicker}} alto batte le mani più deboli con la stessa carta"
  because: "con la stessa {{t:pair|coppia}} decide il {{t:kicker}}, quindi prima del flop una mano dominata vince meno spesso della mano che la domina; per questo è difficile da giocare (semplificazione: la fonte formativa lo dice sulla difesa contro un 3-bet)"
  level: heuristic
  source: "regole: il kicker decide a parità di nucleo della mano (R-M0-002); calcolo: equity della mano dominata sotto la metà in ogni accoppiamento; glossario di poker (https://www.pokerskill.com/poker-glossary/dominated-hand/); sito di formazione (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/)"
  sources: [{ kind: rules }, { kind: math }, { kind: reference, url: "https://www.pokerskill.com/poker-glossary/dominated-hand/" }, { kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }]
- id: R-M3-013
  module: m3
  if: "entrambe le tue carte sono basse (nove o meno), anche con una {{t:pair|coppia}} bassa"
  then: "sul flop di solito esce almeno una carta più alta di entrambe, e l'avversario che la prende ha una {{t:pair|coppia}} più alta di una coppia fatta con le tue carte"
  because: "il flop sono tre carte e nel mazzo ci sono molte carte più alte di una mano bassa: più è bassa la tua carta alta, più spesso ne esce una"
  level: math
  source: "calcolo: probabilità = 1 − C(m, 3) ÷ C(50, 3), m = carte non più alte della carta alta della mano, senza le due carte della mano; verificato su tutti i 19 600 flop per ognuna delle 169 classi"
  sources: [{ kind: math }]
- id: R-M3-014
  module: m3
  if: "hai una {{t:pair|coppia}} in mano prima del flop"
  then: "hai già una mano fatta: una mano senza {{t:pair|coppia}} ha bisogno delle {{t:community-cards}} per batterla"
  because: "la {{t:pair|coppia}} sta sopra la {{t:high-card}} nella classifica, e prima del flop una mano senza coppia ha solo una carta alta"
  level: rules
  source: "regole del Texas Hold'em: regolamento approvato dal regolatore californiano (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf), One Pair sopra High Card"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }]
# M4: gra wobec akcji preflop. Reguły „heuristic” pochodzą z literatury, nie z solvera aplikacji (dokument 11).
- id: R-M4-001
  module: m4
  if: "qualcuno ha {{t:open|aperto}} e tu vuoi {{t:raise|rilanciare}} (3-bet) {{t:in-position|in posizione}}"
  then: "{{t:raise|rilanci}} a circa {{n:pf.3bet.size-ip}} l'{{t:open|apertura}}; con un'{{t:open|apertura}} a {{n:pf.open-size}} sono {{n:pf.3bet.ip-total}}"
  because: "questa dimensione dà un buon rapporto stack/{{t:pot|piatto}} sul flop e non concede all'avversario un prezzo economico"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-ip", position: ip } }
  source: "sito di formazione, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide); albero del solver dell'app"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-002
  module: m4
  if: "{{t:raise|rilanci}} un'{{t:open|apertura}} (3-bet) {{t:out-of-position|fuori posizione}}, ad es. dai blind contro un'{{t:open|apertura}} dal {{t:cutoff|CO}} o dal Button"
  then: "{{t:raise|rilanci}} a circa {{n:pf.3bet.size-oop}} l'{{t:open|apertura}}; con un'{{t:open|apertura}} a {{n:pf.open-size}} sono {{n:pf.3bet.oop-total}}"
  because: "dopo il flop parlerai per primo, quindi con un {{t:raise|rilancio}} più grande togli all'avversario una {{t:call|chiamata}} economica {{t:in-position|in posizione}}"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-oop", position: oop } }
  source: "sito di formazione, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide); albero del solver dell'app"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-003
  module: m4
  if: "sei in {{t:small-blind|small blind}} e ha {{t:open|aperto}} il {{t:cutoff|CO}} o il Button"
  then: "non {{t:call|chiami}} quasi mai: fai 3-bet o {{t:fold|foldi}} (contro il {{t:cutoff|CO}} è una semplificazione: la soluzione pubblicata analizza lo spot contro il Button); contro il Button fai 3-bet con la parte alta del {{t:range|range}} (circa {{n:pf.3bet-freq.sb-vs-btn}} delle mani, tra cui 77+ (55 e 66 spesso), AJo+, KQo, A5s, A4s, T9s) e il resto lo {{t:fold|foldi}}"
  because: "dopo una {{t:call|chiamata}} dallo {{t:small-blind|small blind}} giochi {{t:out-of-position|fuori posizione}}, e il {{t:big-blind|big blind}} dietro di te può ancora {{t:raise|rilanciare}}; il 3-bet ti dà l'{{t:initiative|iniziativa}} e la possibilità di vincere subito il {{t:pot|piatto}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.sb-vs-btn, nine.vs-open.sb-vs-btn] }
  source: "sito con tabelle del solver, SB vs BTN (https://beyondgto.com/defense/sb-vs-btn), NL500, 100bb: «GTO defends the Small Blind with about 18% of hands - roughly 5% as a flat call and 13% as a 3-bet», 55 3-bet 57%, 66 62%; sito di un solver commerciale, Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/), NL500, SB vs BTN: «the SB barely calls anything. Instead, they almost exclusively 3-bet or fold», generalizzazione allo small blind: «As a simplification, don’t cold-call from the SB: Play a 3-bet or fold strategy.»; sito di formazione, 3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/): «3-bet-or-fold strategies from every position except the Big Blind» (documento 10, decisione B-045: il contenuto di R-M4-015 incorporato in R-M4-003; il numero 14% del grafico sostituito dal testo letto, E1)"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/sb-vs-btn" }, { kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-004
  module: m4
  if: "sei in {{t:big-blind|big blind}}, il Button ha {{t:open|aperto}} a {{n:pf.open-size}} e lo {{t:small-blind|small blind}} ha {{t:fold|foldato}}"
  then: "difendi largo, perché per {{t:call|chiamare}} ti serve solo circa {{n:eq.bb-vs-btn-open}} di equity"
  because: "aggiungi poco a un {{t:pot|piatto}} grande; le soluzioni dei solver pubblicate difendono qui circa {{n:pf.bb-def.vs-btn.pub.low}}–{{n:pf.bb-def.vs-btn.pub.high}} delle mani"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-btn, nine.vs-open.bb-vs-btn] }
  source: "calcolo del prezzo; sito con tabelle del solver, BB vs BTN (https://beyondgto.com/defense/bb-vs-btn), NL500: «GTO defends the Big Blind with about 45% of hands»; scuola che pubblica risultati di solver (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), NL200: «3-bets 11.5% to 11bb and calls 29.0%»; solver preflop del progetto (ADR-20) solo nella griglia e nella valutazione gioco/fold, la sua difesa complessiva senza validazione (D-153)"
  sources: [{ kind: math }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-app }]
- id: R-M4-005
  module: m4
  if: "con la {{t:position|posizione}} {{t:raise|rilanci}} un'{{t:open|apertura}} dal {{t:cutoff|CO}}"
  then: "fai 3-bet soprattutto con le mani migliori dall'alto e aggiungi qualche {{t:bluff|bluff}} con assi dello stesso seme (A5s, A4s); le mani medie (ad es. 77–99, AJs, ATs, {{t:connectors|connettori}} dello stesso seme) le giochi in modo misto: una parte in 3-bet, una parte in {{t:call|chiamata}}. Il Button contro il {{t:cutoff|CO}} di solito fa 3-bet con circa {{n:pf.3bet-freq.btn-vs-co.low}}–{{n:pf.3bet-freq.btn-vs-co.high}} delle mani e {{t:call|chiama}} con circa {{n:pf.call-freq.btn-vs-co.low}}–{{n:pf.call-freq.btn-vs-co.high}}"
  because: "l'avversario {{t:call|chiama}} spesso, quindi vuoi una mano che giochi bene nel {{t:pot|piatto}} dopo la {{t:call|chiamata}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.btn-vs-co, nine.vs-open.btn-vs-co] }
  source: "sito di un solver commerciale, Playing Calls From the Button in Cash Games (https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/), NL500, 100bb: «Against a CO open, BTN will 3-bet ~12% of hands, while calling only 5%.»; sito con tabelle del solver, BTN vs CO (https://beyondgto.com/defense/btn-vs-co), NL500, 100bb: «roughly 9% as a flat call and 10% as a 3-bet»; scuola che pubblica risultati di solver (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), NL200: «the solver 3-bets 12.5% of hands to 7.5bb and calls only 3.0%», «55–22 most of the time» fold; gli intervalli coprono tre fonti di livello 2, la composizione è la loro parte comune: parte alta in 3-bet, parte centrale mista (D-144; in precedenza decisione A2, documento 10). Il solver dell'app non riproduce questa divisione (non chiama quasi mai), quindi la griglia e la valutazione in modalità gioco controllano solo «gioco / fold»; sito di formazione, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide), tabella BTN vs CO: «QQ+, AKs, AKo, AQs (mixed), A5s, A4s…»; un sito di formazione (https://gtogecko.com/blog/gto-preflop-strategy) definisce il range lineare, e il sito con tabelle preflop polarizzato (documento 12 M4–M6, D-02)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/" }, { kind: solver-pub, url: "https://beyondgto.com/defense/btn-vs-co" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://gtogecko.com/blog/gto-preflop-strategy" }, { kind: training }]
- id: R-M4-006
  module: m4
  if: "dal {{t:big-blind|big blind}} {{t:raise|rilanci}} l'{{t:open|apertura}} del Button"
  then: "fai 3-bet con le mani più forti (TT+, AQ+, AJs+) più {{t:bluff|bluff}} dalla parte bassa del {{t:range|range}} di {{t:call|chiamata}}: A5s, a volte A4s, e {{t:connectors|connettori}} dello stesso seme; le {{t:pair|coppie}} medie e piccole, KQo e gli assi di semi diversi (AJo–A9o) di solito li {{t:call|chiami}}"
  because: "dal {{t:big-blind|big blind}} {{t:call|chiami}} a poco prezzo e chiudi l'azione, quindi le mani medie guadagnano di più dopo la {{t:call|chiamata}}, e il 3-bet lo riservi alle mani che vogliono un {{t:pot|piatto}} grande e ai {{t:bluff|bluff}} che giocano bene dopo una {{t:call|chiamata}} (gli assi dello stesso seme bloccano AA e AK)"
  level: gto
  source: "sito di un solver commerciale, Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/), NL500, BB vs BTN: «TT+, AJs+, and AQo+ are 3-bet purely», bluff «near the bottom of our calling range»; sito con tabelle del solver, BB vs BTN (https://beyondgto.com/defense/bb-vs-btn): «A5s · 3-bet 100%». La regola vale solo per l'apertura del Button (D-144): contro lo small blind le fonti di livello 2 non concordano sui bluff (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics: «A5s calls 96% of the time rather than turning into a three-bet bluff»; https://beyondgto.com/defense/bb-vs-sb: «A5s · 3-bet 4% · call 96%»; sito di un solver commerciale, Range Morphology, https://blog.gtowizard.com/preflop-range-morphology/: bluff dalla parte più bassa del range), quindi la lezione dice solo che contro lo small blind fai 3-bet soprattutto per valore, e A5s e i connettori dello stesso seme di solito li chiami; scuola che pubblica risultati di solver, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide) e Big blind defence (https://poker.academy/blog/post/big-blind-basics-explained-useful-tips-for-poker-players), NL200 e NL50 GG; sito di formazione, Blind vs Blind Without a Solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics), tabelle di questo sito; sito di formazione, 3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/), tabelle del solver di questo sito. Semplificazione: la composizione dipende dal rake e dalla dimensione del 3-bet; 99, KQo e AJo a volte sono misti (documento 10, decisione B-045)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-007
  module: m4
  if: "ricevi un 3-bet da un giocatore che dopo il flop avrà la {{t:position|posizione}}"
  then: "{{t:fold|foldi}} circa {{n:pf.vs3bet.fold.low}}–{{n:pf.vs3bet.fold.high}} delle {{t:open|aperture}}, {{t:call|chiami}} circa {{n:pf.vs3bet.call.low}}–{{n:pf.vs3bet.call.high}} e fai 4-bet con circa {{n:pf.vs3bet.4bet.low}}–{{n:pf.vs3bet.4bet.high}}"
  because: "se foldi più spesso di {{n:alpha.vs-3bet-ip-size}}, l'avversario guadagna facendo 3-bet con qualsiasi mano, quindi {{t:fold|foldi}} appena sotto questa soglia"
  level: heuristic
  source: "intervallo vicino alle fonti, con il limite superiore dei fold appena sotto la soglia calcolata (ADR-24): scuola che pubblica risultati di solver, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), solver NL200, CO contro un 3-bet del Button a 7,5bb: fold 63,7%, chiamata 17,2%, 4-bet 19,1%; sito con tabelle di formazione semplificate, tabelle di formazione semplificate (https://pailiku.com/charts/co-vs-btn-3bet), ricalcolate sul range di apertura del CO: circa 66/23/11; HUD circa 55% di fold; sito di formazione 50–55/30–40/5–8 (livello 4, si discosta); soglia dal calcolo (documento 12 M4–M6, D-04)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training }, { kind: math }]
- id: R-M4-008
  module: m4
  if: "ricevi un 3-bet e dopo il flop sarai {{t:out-of-position|fuori posizione}}"
  then: "{{t:call|chiami}} soprattutto con carte alte dello stesso seme, assi forti dello stesso seme, {{t:pair|coppie}} medie e alte e una parte dei {{t:connectors|connettori}} dello stesso seme; le mani più deboli di semi diversi (KJo, ATo, QTo) le {{t:fold|foldi}}"
  because: "le mani di semi diversi sono spesso dominate e {{t:equity-realization|realizzano l'equity}} male {{t:out-of-position|fuori posizione}}"
  level: heuristic
  source: "sito di formazione, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide), CO vs BTN 3-bet: «Call QQ, JJ, TT, 99, 88, AQs, AJs, KQs, KJs, QJs, JTs, T9s, 77, 66 Fold Marginal offsuit broadways»; sito con tabelle di formazione semplificate (https://pailiku.com/charts/co-vs-btn-3bet): «Call JJ-77, AQs-ATs, AKs, KQs-KJs, QJs, JTs, T9s, 98s, 87s, 76s, 65s»; sito di formazione, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/): «calling with fewer suited connectors, suited gappers and offsuit broadway hands»"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }]
- id: R-M4-009
  module: m4
  if: "ricevi un 3-bet e dopo il flop avrai la {{t:position|posizione}}"
  then: "{{t:call|chiami}} più largo: {{t:pair|coppie}} da 66 a TT, mani dello stesso seme con carte alte e {{t:connectors|connettori}} dello stesso seme; le {{t:pair|coppie}} più basse le {{t:fold|foldi}}"
  because: "{{t:in-position|in posizione}} è più facile realizzare l'equity e vincere un {{t:pot|piatto}} grande quando centri"
  level: heuristic
  source: "sito di formazione, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/): le coppie più basse fold «even with position»; un sito di formazione ammette di chiamare con coppie piccole in posizione (documento 12 M4–M6, D-05)"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training }]
- id: R-M4-010
  module: m4
  if: "ricevi un 3-bet con AA, KK o AK"
  then: "di solito fai 4-bet (per {{t:value|valore}}); AK a volte si gioca anche in {{t:call|chiamata}}"
  because: "queste mani vogliono mettere dentro tutto lo stack e dominano la maggior parte delle mani che {{t:call|chiameranno}} il 4-bet"
  level: heuristic
  source: "sito di formazione, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/): AK «should be 4-bet with 100% frequency» (Button vs BB); sito di formazione, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide): «4-bet value KK+, AKs (mixed), AKo (mixed)»; sito con tabelle di formazione semplificate (https://pailiku.com/charts/co-vs-btn-3bet): «4-bet QQ+, AKo, A5s-A4s Call JJ-77, AQs-ATs, AKs»"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }]
- id: R-M4-011
  module: m4
  if: "fai 4-bet"
  then: "{{t:raise|rilanci}} a circa {{n:pf.4bet.size-ip.low}}–{{n:pf.4bet.size-ip.high}} il 3-bet {{t:in-position|in posizione}} e {{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}} {{t:out-of-position|fuori posizione}}"
  because: "dopo la {{t:call|chiamata}} di un 4-bet così, negli stack restano circa {{n:spr.4bet.high}}–{{n:spr.4bet.oop}} volte quanto c'è nel {{t:pot|piatto}} ({{t:in-position|in posizione}}, ad es. 4-bet dal Button sul 3-bet dello {{t:small-blind|small blind}} a {{n:pf.3bet.oop-total}}: circa {{n:spr.4bet.high}}–{{n:spr.4bet}}; {{t:out-of-position|fuori posizione}}, ad es. 4-bet dal {{t:cutoff|CO}} sul 3-bet del Button a {{n:pf.3bet.ip-total}}: circa {{n:spr.4bet.oop}}), quindi le mani buone mettono facilmente dentro il resto"
  level: heuristic
  source: "scuola che pubblica risultati di solver, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), solver NL200: il CO fuori posizione fa 4-bet a 17,2bb, cioè 2,3 volte un 3-bet a 7,5bb; sito di formazione, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide): 2,2–2,5x in posizione, 2,5–3x fuori posizione (nel suo esempio 2,4x); SPR dal calcolo (documento 12 M4–M6, D-06)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: math }]
- id: R-M4-012
  module: m4
  if: "prima di te uno o più giocatori hanno solo pareggiato il {{t:big-blind|big blind}} (limp)"
  then: "{{t:raise|rilanci}} a {{n:pf.iso.base}} più {{n:pf.iso.per-limper}} per ogni limper, {{t:out-of-position|fuori posizione}} {{n:pf.iso.oop-extra}} in più"
  because: "un {{t:raise|rilancio}} più piccolo dà ai limper un prezzo troppo buono e non toglie loro la mano"
  level: heuristic
  check: { kind: iso-size, players: [6, 9], stackBb: [100], params: { base: "n:pf.iso.base", perLimper: "n:pf.iso.per-limper", oopExtra: "n:pf.iso.oop-extra" } }
  source: "sito di formazione, 10 Tips for Crushing Limpers (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm): «Raise to 3bb+1bb per limper when playing online, and 4bb+1bb per limper when playing live»; sito con tabelle preflop, ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy): «Base open size (3bb) + 1 big blind per limper», «Add 1bb more from OOP positions». La dimensione vale per il gioco online"
  sources: [{ kind: training, url: "https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }]
- id: R-M4-013
  module: m4
  if: "prima di te limpano più giocatori"
  then: "{{t:raise|rilanci}} con un {{t:range|range}} più stretto, soprattutto per {{t:value|valore}}; le mani speculative ({{t:pair|coppie}} piccole, {{t:connectors|connettori}} dello stesso seme) {{t:in-position|in posizione}} puoi anche solo completare"
  because: "ogni limper in più aumenta la probabilità che qualcuno {{t:call|chiami}}, quindi il {{t:bluff|bluff}} preflop perde valore"
  level: heuristic
  source: "sito con tabelle preflop, ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy): «Against multiple limpers, tighten each range by roughly one tier», sul limp dietro: «This is almost always wrong»; sito di formazione (https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm): «limp behind with those suited connectors, small pairs»; sito di formazione (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm): «over-limping, which can be fine». Contraddizione al livello 4: entrambe le giocate sono corrette (ADR-04, D-144)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }, { kind: training, url: "https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm" }]
- id: R-M4-014
  module: m4
  if: "sei in {{t:big-blind|big blind}} e lo {{t:small-blind|small blind}} ha {{t:open|aperto}} a {{n:pf.open-size-sb}}"
  then: "difendi largo, più di metà delle mani, anche se per {{t:call|chiamare}} ti serve circa {{n:eq.bb-vs-sb-open}} di equity; il 3-bet è di circa {{n:pf.3bet.size-ip}} l'{{t:open|apertura}}"
  because: "dopo il flop hai la {{t:position|posizione}}, quindi realizzi più equity; la soluzione del solver pubblicata difende qui circa {{n:pf.bb-def.vs-sb.pub}} delle mani"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-sb, nine.vs-open.bb-vs-sb] }
  source: "calcolo del prezzo; solver preflop del progetto (ADR-20); albero del solver (3-bet a 9bb); sito con tabelle del solver, BB vs SB (https://beyondgto.com/defense/bb-vs-sb), NL500, 100bb: «GTO defends the Big Blind with about 56% of hands»"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-sb" }, { kind: math }, { kind: solver-app }]

# M5: c-bet na flopie. Pula po otwarciu i jednym sprawdzeniu, 100bb. Definicje tekstur liczy poker-core (texture.ts),
# punkty i progi mokrości są w numbers.yaml (tex.*). Reguły strategiczne według rejestru decyzji D-01–D-21
# (dokument 12 M4–M6); bez częstotliwości w procentach.
- id: R-M5-001
  module: m5
  if: "il flop totalizza meno di {{n:tex.threshold.medium}} punti di {{t:wetness|bagnatura}}: una {{t:straight|scala}} possibile in più modi (con almeno due insiemi di due ranghi) vale {{n:tex.points.straight.made}} punti, una {{t:straight|scala}} possibile in un solo modo {{n:tex.points.straight.made-one}}, il solo {{t:straight-draw|progetto di scala}} {{n:tex.points.straight.draw}}, due carte dello stesso seme {{n:tex.points.suits.two-tone}}, tre dello stesso seme {{n:tex.points.suits.monotone}}"
  then: "è un flop {{t:dry|secco}}: i {{t:draw|progetti}} sono pochi e nessuno ha ancora una {{t:straight|scala}} o un {{t:flush|colore}} fatti"
  because: "le carte successive cambiano raramente chi è in testa, quindi la mano migliore sul flop di solito resta la migliore"
  level: rules
  source: "definizione della texture nell'app (poker-core, texture.ts: WETNESS_POINTS, WETNESS_THRESHOLDS); concetto di flop secco: sito di formazione, Sizing Your C-Bets; sito di formazione, What Is a Continuation Bet; esempi di flop secchi: sito di formazione (K72r, A94r), sito di formazione (AA6r); il confine secco/intermedio è una convenzione dell'app"
  sources: [{ kind: training }, { kind: training }]
- id: R-M5-002
  module: m5
  if: "il flop totalizza almeno {{n:tex.threshold.wet}} punti di {{t:wetness|bagnatura}} (punti come nella definizione di flop {{t:dry|secco}})"
  then: "è un flop {{t:wet|bagnato}}: l'avversario ha spesso {{t:draw|progetti}}, e a volte già una {{t:straight|scala}} o un {{t:flush|colore}}"
  because: "le carte successive cambiano spesso chi è in testa, quindi la mano migliore adesso è meno al sicuro"
  level: rules
  source: "definizione della texture nell'app (poker-core, texture.ts: WETNESS_POINTS, WETNESS_THRESHOLDS); concetto di flop bagnato: sito di formazione, Sizing Your C-Bets; sito di formazione, What Is a Continuation Bet; esempi di flop bagnati: sito di formazione (987, QJT), sito di formazione, Bet Sizing Strategy: 8 Rules (T954, https://upswingpoker.com/bet-size-strategy-tips-rules/); il confine intermedio/bagnato è una convenzione dell'app"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: training }]
- id: R-M5-003
  module: m5
  if: "hai {{t:open|aperto}} preflop, il {{t:big-blind|big blind}} ha {{t:call|chiamato}} e sul flop c'è un asso o un re"
  then: "hai il {{t:range-advantage|vantaggio di range}}: in media le tue mani sono più forti di quelle dell'avversario"
  because: "il {{t:big-blind|big blind}} {{t:raise|rilancia}} preflop la maggior parte di AA, KK e AK, quindi dopo una semplice {{t:call|chiamata}} ne ha poche, mentre tu le hai tutte"
  level: heuristic
  source: "sito di un solver commerciale, Range advantage (glossario); sito di un solver commerciale, The Turn Probe Bet («BB lacks the stronger Ace-highs because they would have 3-bet with them preflop»)"
  sources: [{ kind: solver-pub }]
- id: R-M5-004
  module: m5
  if: "hai {{t:open|aperto}} preflop e il flop è basso e {{t:connected|connesso}} o {{t:semi-connected|semi-connesso}}, ad es. 7-6-5"
  then: "fai c-bet meno spesso che sui flop alti, e molte mani fanno {{t:check|check}}"
  because: "il {{t:big-blind|big blind}} difende molti {{t:connectors|connettori}} e mani con carte piccole, che colpiscono il flop basso, e le tue carte alte hanno mancato il flop; su un flop {{t:connected|connesso}} ha anche {{t:straight|scale}} e {{t:two-pair|doppie coppie}}, quindi di solito non hai il {{t:nuts-advantage|vantaggio di nuts}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "sito di un solver commerciale, Flop Heuristics: IP C-Betting in Cash Games (https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/, BTN vs BB: «a large portion of their range consists of low-card holdings because of the preflop discount posed by the blinds. We connect better with high-card boards and get to bet more.»; «flopped straights often being in the BB’s range»; «Size down and bet less on flops that complete straights and flushes in your opponent’s range»); sito di un solver commerciale, Flop Heuristics: IP C-Betting in MTTs (https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-mtts/; altro spot: BTN vs SB, 40bb; sui flop connessi «the raiser generally does not have a nuts advantage»; semplificazione: trasferito in modo direzionale a BTN vs BB nel cash game, in linea con l'articolo sul cash game); sito di un solver commerciale, Bullying the Blinds (https://blog.gtowizard.com/bullying-the-blinds-with-continuation-bets/, 20bb, 654r: «BB’s advantage at the top end», il Button fa check con più di metà del range); sito di formazione, 3 Concepts That Should Shape Your Postflop Strategy («the Big Blind will often have the nut advantage», https://upswingpoker.com/nut-range-positional-advantage/)"
  sources: [{ kind: solver-pub }, { kind: training, url: "https://upswingpoker.com/nut-range-positional-advantage/" }]
- id: R-M5-005
  module: m5
  if: "nel tuo {{t:range|range}} ci sono molte più mani fortissime che in quello dell'avversario ({{t:nuts-advantage|vantaggio di nuts}})"
  then: "puoi puntare con una dimensione più grande; quando hai solo il {{t:range-advantage|vantaggio di range}}, punti piccolo"
  because: "una {{t:bet|puntata}} grande estrae di più dalle mani medie dell'avversario, e raramente incontrerai una mano migliore che ti {{t:raise|rilanci}}"
  level: heuristic
  source: "sito di un solver commerciale, The Mechanics of C-Bet Sizing; sito di un solver commerciale, Range advantage (glossario)"
  sources: [{ kind: solver-pub }]
- id: R-M5-006
  module: m5
  if: "l'avversario ha una mano senza {{t:pair|coppia}}"
  then: "il flop non accoppia nessuna delle sue carte in circa {{n:flop.miss.unpaired}} dei casi"
  because: "delle {{n:cards.unseen.preflop}} carte sconosciute solo {{n:pair.outs.unpaired}} accoppiano la sua mano, e il flop sono solo {{n:cards.board.flop}} carte"
  level: math
  source: "calcolo esatto (poker-core); coerente con un sito di calcolatori per il poker (28,96% + 2,02% + 1,45% = 32,4% di centro)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M5-007
  module: m5
  if: "come {{t:aggressor|aggressore}} preflop hai la {{t:position|posizione}} e il flop è {{t:dry|secco}} e alto, ad es. K-7-2 di tre semi diversi"
  then: "fai c-bet spesso e piccolo, circa {{n:cbet.size.small}} del {{t:pot|piatto}} (semplificazione: su questi flop il solver usa anche l'{{t:overbet|overbet}})"
  because: "hai il {{t:range-advantage|vantaggio di range}}, e le mani deboli dell'avversario non hanno quasi possibilità: basta una {{t:bet|puntata}} piccola per fargliele {{t:fold|foldare}}, mentre le {{t:pair|coppie}} peggiori la {{t:call|chiameranno}} comunque"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "sito di un solver commerciale, Flop Heuristics: IP C-Betting in Cash Games (33%); sito di formazione, Bet Sizing Strategy: 8 Rules («Bet small (25-35% pot) on dry, static board textures», https://upswingpoker.com/bet-size-strategy-tips-rules/); sito di formazione, What Is a Continuation Bet (K72r); sito di formazione, Picking the Proper C-Bet Sizing on Ace-High Boards (1/3 del piatto)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M5-008
  module: m5
  if: "come {{t:aggressor|aggressore}} preflop hai la {{t:position|posizione}} e il flop dà all'avversario molti {{t:draw|progetti}}, ma una {{t:straight|scala}} non è ancora possibile, ad es. K-J-7 {{t:two-tone|bicolore}}"
  then: "fai c-bet meno spesso ma con una dimensione più grande, ad es. {{n:cbet.size.big}} del {{t:pot|piatto}}; le mani medie senza {{t:draw|progetto}} fanno {{t:check|check}} più spesso; quando una {{t:straight|scala}} è già possibile, ad es. J-T-8, i solver puntano con una dimensione più piccola"
  because: "i {{t:draw|progetti}} dell'avversario hanno molta equity, quindi una {{t:bet|puntata}} grande li fa pagare cari per la carta successiva"
  level: heuristic
  source: "sito di un solver commerciale, Flop Heuristics: IP C-Betting in Cash Games («increased use of the 66% pot bet size, but decreased overall betting frequency»); sito di formazione, Bet Sizing Strategy: 8 Rules (55–80%, https://upswingpoker.com/bet-size-strategy-tips-rules/); sito di formazione, Picking the Proper C-Bet Sizing on Ace-High Boards (2/3 del piatto)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }]
- id: R-M5-009
  module: m5
  if: "come {{t:aggressor|aggressore}} preflop hai la {{t:position|posizione}} e il flop è {{t:paired|accoppiato}}, ad es. Q-Q-6"
  then: "fai c-bet spesso e piccolo"
  because: "hai il {{t:range-advantage|vantaggio di range}}, e su un flop {{t:paired|accoppiato}} è difficile avere un {{t:draw|progetto}}, quindi un avversario senza {{t:pair|coppia}} raramente può {{t:call|chiamare}} anche una {{t:bet|puntata}} piccola; una {{t:bet|puntata}} grande non conviene, perché il {{t:three-of-a-kind|tris}} può averlo ognuno di voi"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "sito di un solver commerciale, Flop Heuristics: IP C-Betting in Cash Games («Paired flops are bet significantly more often… only be bet for small sizing… reduced nut advantage from trips being in both player's ranges»; «On paired boards, it's also much harder to have a draw»)"
  sources: [{ kind: solver-pub }]
- id: R-M5-010
  module: m5
  if: "come {{t:aggressor|aggressore}} preflop hai la {{t:position|posizione}} e il flop è {{t:monotone|monocolore}} (tre carte dello stesso seme)"
  then: "fai c-bet meno spesso del solito e piccolo"
  because: "ogni giocatore può già avere un {{t:flush|colore}}, quindi il {{t:nuts-advantage|vantaggio di nuts}} dell'{{t:aggressor|aggressore}} si riduce, e in un {{t:pot|piatto}} grande il {{t:flush|colore}} dell'avversario costa molto"
  level: heuristic
  source: "sito di un solver commerciale, Flop Heuristics: IP C-Betting in Cash Games («Monotone boards see a drastic decrease in betting frequency and sizing», BTN vs BB, https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/); sito di un solver commerciale, The Mechanics of C-Bet Sizing («when a very wet board like Q♦8♦7♦ is dealt, the bet sizing comes down again», https://blog.gtowizard.com/the-mechanics-of-c-bet-sizing/): un flop bagnato non significa una puntata grande; sito di formazione, Monotone Flops (Kanu7, risultati del solver: «c-betting half the time for a 25-33% pot sizing», https://upswingpoker.com/monotone-flops-kanu7/); decisione D-39 (documento 12 M4–M6, rapporto 12a-22)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/monotone-flops-kanu7/" }]
- id: R-M5-011
  module: m5
  if: "fai c-bet senza alcuna mano, contando solo sul {{t:fold|fold}} dell'avversario"
  then: "con una {{t:bet|puntata}} di {{n:cbet.size.small}} del {{t:pot|piatto}} l'avversario deve {{t:fold|foldare}} con frequenza superiore a {{n:alpha.cbet.small}}, e con {{n:cbet.size.big}} del {{t:pot|piatto}} con frequenza superiore a {{n:alpha.cbet.big}}"
  because: "rischi la puntata per vincere il {{t:pot|piatto}}: la soglia è puntata ÷ ({{t:pot|piatto}} + puntata)"
  level: math
  source: "calcolo: alpha = puntata / (piatto + puntata)"
  sources: [{ kind: math }]
- id: R-M5-012
  module: m5
  if: "hai {{t:open|aperto}} preflop e l'avversario ha {{t:call|chiamato}} con la {{t:position|posizione}} (ad es. il Button contro la tua {{t:open|apertura}} dal {{t:cutoff|CO}})"
  then: "fai c-bet meno spesso che {{t:in-position|in posizione}} e fai {{t:check|check}} più spesso, anche con mani buone"
  because: "il {{t:range|range}} di chi {{t:call|chiama}} con la {{t:position|posizione}} è {{t:condensed|condensato}}: le mani deboli le ha {{t:fold|foldate}} e una parte delle più forti l'ha {{t:raise|rilanciata}}, quindi gli restano soprattutto mani medie e buone; in più, dopo il flop parli per primo su ogni {{t:street|street}}"
  level: heuristic
  source: "sito di un solver commerciale, C-Betting As the OOP Preflop Raiser (UTG vs BTN c-bet 28%; «Even a hand like top pair top kicker is preferred to be played as a check-call»); sito di formazione, C-Betting On Ace-High Boards (CO vs BTN, A94r: «we will check over 96% of the time»)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M5-013
  module: m5
  if: "sul flop hai due o più avversari"
  then: "fai c-bet molto meno spesso, soprattutto con mani forti e {{t:draw|progetti}} forti; {{t:bluff|bluffi}} poco, e quando punti, punti piccolo"
  because: "ogni avversario in più aumenta la probabilità che qualcuno abbia centrato: due mani senza {{t:pair|coppia}} mancano entrambe il flop solo in circa {{n:flop.miss.two}} dei casi"
  level: heuristic
  source: "sito di formazione, Multiway Pots in Poker; sito di formazione, C-Betting in Multiway Pots («Check even pocket kings… the solver checks its entire range»; «around a quarter to a third of pot»); calcolo esatto: C(36,3)/C(48,3)"
  sources: [{ kind: training }, { kind: training }, { kind: math }]

# M6: obrona na flopie. Matematyka z formuł (numbers.yaml); zalecenia według rejestru decyzji D-22–D-38 (dokument 12
# M4–M6) i D1 (dokument 12 M7–M9).
- id: R-M6-001
  module: m6
  if: "l'avversario punta sul river 1/3 del {{t:pot|piatto}}"
  then: "in teoria difendi ({{t:call|chiami}} o {{t:raise|rilanci}}) circa {{n:mdf.bet-third}} del {{t:range|range}}; questo è l'{{t:mdf|MDF}}"
  because: "un {{t:bluff|bluff}} senza possibilità rischia 1 parte per vincerne 3; se {{t:fold|foldi}} più spesso di {{n:alpha.bet-third}}, l'avversario guadagna {{t:bluff|bluffando}} con qualsiasi carta"
  level: math
  source: "calcolo: MDF = piatto/(piatto+puntata); sito di formazione, MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker: «The framework is a starting point, not a rule»)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }, { kind: math }]
- id: R-M6-002
  module: m6
  if: "{{t:bluff|bluffi}} con una mano senza possibilità di vincere"
  then: "il {{t:bluff|bluff}} è in attivo quando l'avversario {{t:fold|folda}} più spesso di alpha = puntata/({{t:pot|piatto}}+puntata); con una puntata di mezzo {{t:pot|piatto}} è {{n:alpha.bet-half}}"
  because: "rischi la puntata per vincere il {{t:pot|piatto}}; più grande è la puntata, più spesso l'avversario deve {{t:fold|foldare}}"
  level: math
  source: "calcolo: alpha = puntata/(piatto+puntata); sito di un solver commerciale, MDF & Alpha (https://blog.gtowizard.com/mdf-alpha)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: math }]
- id: R-M6-003
  module: m6
  if: "ricevi una puntata sul flop {{t:out-of-position|fuori posizione}}"
  then: "puoi difendere meno di quanto indica l'{{t:mdf|MDF}} (sui flop sfavorevoli a chi difende nettamente meno); consideri l'{{t:mdf|MDF}} un punto di riferimento, non un obbligo, ma contro i c-bet piccoli non {{t:fold|foldi}} in massa"
  because: "i {{t:bluff|bluff}} dell'avversario hanno ancora equity e possono migliorare, e {{t:out-of-position|fuori posizione}} non realizzerai tutta l'equity delle tue mani deboli"
  level: heuristic
  source: "sito di un solver commerciale, MDF & Alpha (https://blog.gtowizard.com/mdf-alpha: «On average, BB is consistently over-folding to all bet sizes on the flop»; in posizione «calls much closer to MDF on average»); in un esempio sul turn il solver difendeva in media vicino all'MDF: sito di formazione, What the Best Poker Pros Already Know About Playing vs. Double Barrels (https://upswingpoker.com/vs-double-barrels-turn/); difesa contro i c-bet piccoli: R-M6-006"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: training, url: "https://upswingpoker.com/vs-double-barrels-turn/" }]
- id: R-M6-004
  module: m6
  if: "un giocatore che, da quanto hai osservato, {{t:bluff|bluffa}} raramente {{t:bet|punta}} forte sul river"
  then: "{{t:fold|foldi}} più spesso di quanto indica l'{{t:mdf|MDF}}, anche con {{t:pair|coppie}} medie"
  because: "l'{{t:mdf|MDF}} presuppone che l'avversario {{t:bluff|bluffi}} abbastanza spesso; quando i {{t:bluff|bluff}} mancano, la {{t:call|chiamata}} con una mano più debole paga soprattutto le mani migliori"
  level: exploit
  population: "un giocatore specifico osservato al tavolo; nessun dato sulla popolazione (campione, limiti, sala), quindi la regola non presuppone che un intero gruppo di giocatori bluffi raramente; gli allenatori di due siti di formazione descrivono così i giocatori ricreativi passivi (che giocano per divertimento, di solito peggio dei regular) ai limiti bassi, senza numeri da un database di mani"
  source: "sito di formazione, Bluff Catching: When to Call and When to Let It Go (https://deepfold.co/en/blog/bluff-catching-principles: i giocatori ricreativi passivi non bluffano con puntate grandi sul river); sito di formazione, MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker: «In low-stakes games, most players will bluff way less»)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/bluff-catching-principles" }, { kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }]
- id: R-M6-005
  module: m6
  if: "l'avversario {{t:bet|punta}} di più"
  then: "difendi con un {{t:range|range}} più stretto: contro una puntata di 1/3 del {{t:pot|piatto}} l'{{t:mdf|MDF}} è {{n:mdf.bet-third}}, e contro una puntata pari al {{t:pot|piatto}} {{n:mdf.bet-pot}}"
  because: "una puntata più grande dà un prezzo peggiore: l'equity necessaria sale da {{n:eq.bet-third}} a {{n:eq.bet-pot}}"
  level: math
  source: "calcolo: MDF = piatto/(piatto+puntata), equity necessaria = puntata/(piatto+2·puntata)"
  sources: [{ kind: math }]
- id: R-M6-006
  module: m6
  if: "in {{t:big-blind|big blind}} ricevi un c-bet piccolo (circa 1/3 del {{t:pot|piatto}})"
  then: "continui con quasi ogni {{t:pair|coppia}}, con i {{t:draw|progetti}}, con le carte alte che hanno un {{t:draw|progetto}} aggiuntivo (backdoor) e di solito anche con l'asso come carta più alta; {{t:fold|foldi}} le mani più deboli senza {{t:pair|coppia}} e senza {{t:draw|progetto}}"
  because: "ti serve solo circa {{n:eq.bet-third}} di equity, e queste mani o battono già i {{t:bluff|bluff}} o possono migliorare"
  level: heuristic
  source: "sito di formazione, Defending the BB on High Card Boards (solver: «we will continue with pretty much all pairs including the underpairs and even A-high hands»)"
  sources: [{ kind: training }]
- id: R-M6-007
  module: m6
  if: "hai due carte alte senza {{t:pair|coppia}} e senza {{t:draw|progetto}}, e il c-bet è grande (3/4 del {{t:pot|piatto}} o più)"
  then: "di solito {{t:fold|foldi}} (sui flop {{t:dry|secchi}} con un re il solver però {{t:call|chiama}} con molte mani con l'asso)"
  because: "{{t:out-of-position|fuori posizione}} una mano così arriva raramente allo showdown, e una {{t:pair|coppia}} fatta con la carta alta spesso perde comunque; {{t:call|chiami}} piuttosto quando hai un {{t:draw|progetto}} aggiuntivo, meglio se al {{t:flush|colore}} massimo"
  level: heuristic
  source: "sito di formazione, When to Call With Ace-High (J42, 66%: «the solver does not call with any Ace-high hand that doesn't have a significant backdoor draw»); sito di formazione, Defending the BB on High Card Boards (K84: il solver chiama con una parte degli assi anche contro 2/3 del piatto)"
  sources: [{ kind: training }, { kind: training }]
- id: R-M6-008
  module: m6
  if: "vuoi fare check-raise sul flop"
  then: "lo fai soprattutto con le mani più forti ({{t:two-pair|doppia coppia}}, set) e con i {{t:draw|progetti}} ({{t:flush|colore}}, {{t:oesd|OESD}}); le {{t:pair|coppie}} medie di solito le {{t:call|chiami}} (semplificazione: contro i c-bet piccoli il solver {{t:raise|rilancia}} anche una parte delle {{t:top-pair|top pair}} e delle {{t:pair|coppie}} deboli per protezione)"
  because: "dopo il check-raise le mani peggiori di solito {{t:fold|foldano}} e quelle migliori pagano, quindi una {{t:pair|coppia}} media raramente ci guadagna; un {{t:draw|progetto}} ha due strade per vincere: il {{t:fold|fold}} dell'avversario o il centro"
  level: heuristic
  source: "sito di formazione, 5 Winning Check-Raising Strategies (i solver «check-raise all sorts of top pairs versus small bets»); sito di formazione (tabelle del solver) (set e progetti in check-raise; coppie deboli per protezione)"
  sources: [{ kind: training }]
- id: R-M6-009
  module: m6
  if: "il c-bet è piccolo o il flop è basso e {{t:connected|connesso}} (ad es. 7-6-5)"
  then: "fai check-raise più spesso; sui flop alti favorevoli a chi ha rilanciato preflop (ad es. K-J-T, A-A-K) e contro i c-bet grandi più raramente"
  because: "sui flop bassi e {{t:connected|connessi}} il {{t:big-blind|big blind}} ha nel suo {{t:range}} {{t:straight|scale}} e {{t:two-pair|doppie coppie}}, e il Button di solito non ha il {{t:nuts-advantage|vantaggio di nuts}}; un c-bet piccolo offre un'occasione economica per {{t:raise|rilanciare}}"
  level: heuristic
  source: "sito di formazione, How to Check-Raise Like a High Stakes Juggernaut (flop su cui non rilanciare: K♣J♥T♠, Q♥J♦T♠, A♥A♠K♥; check-raise 12,65% contro il 33% e 8,66% contro il 66% del piatto); sito di un solver commerciale («The larger the BTN bets, the less BB raises»); sito di un solver commerciale, Flop Heuristics: IP C-Betting in Cash Games («flopped straights often being in the BB’s range»)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M6-010
  module: m6
  if: "fai check-raise sul flop"
  then: "{{t:raise|rilanci}} a circa {{n:xr.mult.low}}–{{n:xr.mult.example}} il c-bet, tanto di più quanto più piccolo è il c-bet; non il minimo"
  because: "con un check-raise a {{n:xr.mult.example}} il c-bet, il Button per {{t:call|chiamare}} ha bisogno di circa {{n:eq.vs-xr.example}} di equity, mentre a {{n:xr.too-small.mult}} il c-bet solo di {{n:eq.vs-xr.too-small}}; a un prezzo così basso pagherà con qualsiasi {{t:draw|progetto}}"
  level: heuristic
  source: "calcolo del prezzo: chiamata/(piatto dopo il rilancio + chiamata); sito di formazione, Level-Up Podcast ep. 1 (Blackwood): 4,5x contro i c-bet piccoli, 3,2x contro quelli grandi (https://upswingpoker.com/podcast/ep1-check-raise/); direzione coerente con un sito di un solver commerciale: più piccola la puntata, più grande il multiplo"
  sources: [{ kind: training, url: "https://upswingpoker.com/podcast/ep1-check-raise/" }, { kind: solver-pub }, { kind: math }]
- id: R-M6-011
  module: m6
  if: "valuti un check-raise come {{t:bluff|bluff}} o {{t:semi-bluff|semi-bluff}}"
  then: "scegli per farlo soprattutto {{t:draw|progetti}} forti; più raramente l'avversario {{t:fold|folda}}, meno {{t:bluff|bluff}} del genere fai, e quando non {{t:fold|folda}} quasi mai, fai check-raise soprattutto per {{t:value|valore}}"
  because: "il {{t:bluff|bluff}} guadagna solo quando l'avversario {{t:fold|folda}} più spesso di alpha (R-M6-002); un {{t:draw|progetto}} forte vince anche quando chiude, quindi è quello che perde meno quando i {{t:fold|fold}} mancano"
  level: heuristic
  source: "conclusione da alpha (R-M6-002): il bluff ha bisogno dei fold dell'avversario; sito di formazione, 5 Winning Check-Raising Strategies («tighten your bluffing range to include only strong draws»)"
  sources: [{ kind: training }, { kind: math }]

# M7: turn. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 „Weryfikacja źródeł — M7–M9” (decyzje D1–D9).
- id: R-M7-001
  module: m7
  if: "hai fatto c-bet sul flop con la {{t:position|posizione}}, l'avversario ha {{t:call|chiamato}} e al turn arriva una carta alta (asso o re) su un {{t:board|board}} più basso"
  then: "{{t:bet|punti}} più spesso il {{t:second-barrel|second barrel}}, anche come {{t:bluff|bluff}}"
  because: "questa carta di solito colpisce più spesso il tuo {{t:range|range}} di {{t:open|apertura}} che il {{t:range|range}} di chi difende, e ogni {{t:pair|coppia}} dell'avversario scende di un posto"
  level: heuristic
  source: "sito di un solver commerciale, The Worst Turn Card; sito di formazione, When to Fire a Second Barrel; sito di formazione, When to Double Barrel the Turn as a Bluff"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-002
  module: m7
  if: "{{t:bluff|bluffi}} con un {{t:second-barrel|second barrel}} al turn"
  then: "di solito {{t:bluff|bluffi}} con mani che hanno out ({{t:flush-draw|progetto di colore}}, progetto di {{t:straight|scala}}, gutshot con una carta alta) quando l'avversario tende a {{t:fold|foldare}} o a {{t:call|chiamare}}; quando può {{t:raise|rilanciare}}, il solver {{t:bluff|bluffa}} anche con mani senza out (semplificazione: la scelta dipende da come risponderà l'avversario)"
  because: "il {{t:semi-bluff|semi-bluff}} vince in due modi: quando l'avversario {{t:fold|folda}} o quando chiudi al river; il {{t:bluff|bluff}} senza out ha solo la prima strada (stack di circa {{n:format.stack}})"
  level: heuristic
  source: "sito di un solver commerciale, From Gutshots to Airballs: Choosing Your Bluffs; allenatore con un sito di formazione, The Double Barrel Checklist; sito di formazione, When to Double Barrel the Turn as a Bluff (con circa 100bb)"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-003
  module: m7
  if: "al turn hai una mano media (ad es. {{t:second-pair|seconda coppia}} o {{t:top-pair|top pair}} con un kicker debole) e l'avversario ha già {{t:call|chiamato}} il c-bet"
  then: "fai {{t:check|check}} più spesso, invece di puntare una seconda volta"
  because: "dopo aver {{t:call|chiamato}} il flop l'avversario ha un {{t:range|range}} più forte di prima: alla puntata {{t:fold|folderà}} le mani peggiori e pagherà con quelle migliori; facendo {{t:check|check}} tieni il {{t:pot|piatto}} piccolo e arrivi allo showdown"
  level: heuristic
  source: "sito di un solver commerciale (Brokos), Principles of Turn Strategy; sito di formazione, Poker Basics: Polarised Ranges; sito di un solver commerciale, Poker: The Battle for Information"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M7-004
  module: m7
  if: "{{t:bluff|bluffi}} al turn con una mano che da sola non vincerà quasi mai"
  then: "con una puntata di 3/4 del {{t:pot|piatto}} l'avversario deve {{t:fold|foldare}} con frequenza superiore a {{n:alpha.bet-three-quarters}}, con una puntata di mezzo {{t:pot|piatto}} superiore a {{n:alpha.bet-half}}"
  because: "rischi la puntata per vincere il {{t:pot|piatto}}: la soglia è puntata ÷ ({{t:pot|piatto}} + puntata); gli out che hai abbassano questa soglia"
  level: math
  source: "calcolo: alpha = puntata/(piatto+puntata)"
  sources: [{ kind: math }]
- id: R-M7-005
  module: m7
  if: "punti al turn con un {{t:range|range}} {{t:polarized|polarizzato}} (mani molto forti e {{t:semi-bluff|semi-bluff}} con un {{t:draw|progetto}}, senza mani medie)"
  then: "scegli una dimensione grande, ad es. 3/4 del {{t:pot|piatto}}, e le mani medie fanno {{t:check|check}}"
  because: "le mani forti vogliono costruire il {{t:pot|piatto}} prima del river, i {{t:bluff|bluff}} hanno bisogno di {{t:fold|fold}}, e le mani medie non guadagnano da un {{t:pot|piatto}} grande"
  level: heuristic
  source: "sito di formazione, Polarized vs Merged Ranges (definizioni); sito di formazione, Polarised Ranges; sito di un solver commerciale, The Worst Turn Card"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-006
  module: m7
  if: "hai una mano forte al turn e l'avversario può avere un {{t:flush-draw|progetto di colore}}"
  then: "punti forte: contro una puntata di 3/4 del {{t:pot|piatto}} il {{t:draw|progetto}} ha bisogno di {{n:eq.bet-three-quarters}} di equity, e ne ha circa {{n:odds.flush.turn-river}}"
  because: "contro una puntata di 1/4 del {{t:pot|piatto}} gli basterebbe {{n:eq.bet-quarter}}, quindi una puntata piccola dà al {{t:draw|progetto}} un buon prezzo"
  level: math
  source: "calcolo: equity necessaria = puntata/(piatto+2·puntata), probabilità = out ÷ carte sconosciute; direzione (una mano forte e vulnerabile punta forte): sito di formazione, How Much Should You Bet on Connected Boards?"
  sources: [{ kind: training }, { kind: math }]
- id: R-M7-007
  module: m7
  if: "hai un {{t:draw|progetto}} al turn"
  then: "calcoli la probabilità per una sola carta: il {{t:flush|colore}} è circa {{n:odds.flush.turn-river}}, non {{n:odds.flush.flop-river}} come dal flop al river"
  because: "fino al river resta una carta, quindi la probabilità è circa la metà di quella calcolata dal flop su due carte"
  level: math
  check: { kind: draw-price, streets: [turn] }
  source: "calcolo esatto (poker-core)"
  sources: [{ kind: math }]
- id: R-M7-008
  module: m7
  if: "al turn il prezzo per il {{t:draw|progetto}} è troppo alto (hai meno equity di quella che ti serve)"
  then: "{{t:call|chiami}} solo se, quando chiudi, vincerai in totale almeno chiamata × (carte che non chiudono ÷ out); la differenza oltre il {{t:pot|piatto}} sono le implied odds"
  because: "così le vincite quando chiudi coprono le perdite quando manchi; con un progetto di colore e una puntata di {{n:io.flush.bet}} in un {{t:pot|piatto}} di {{n:ex.third.pot}} sono {{n:io.flush.extra}} oltre il {{t:pot|piatto}}"
  level: math
  check: { kind: implied-odds, streets: [flop, turn], params: { sprMin: "n:spr.zone.mid" } }
  source: "calcolo dell'EV: equity × (piatto + vincita aggiuntiva) = (1 − equity) × chiamata"
  sources: [{ kind: math }]
- id: R-M7-009
  module: m7
  if: "conti sulle implied odds"
  then: "ci credi solo quando all'avversario restano abbastanza {{t:chips|fiches}} ({{t:spr|SPR}} alto), il tuo {{t:draw|progetto}} è alla mano migliore e il centro non salta all'occhio"
  because: "le {{t:chips|fiches}} in più deve ancora pagartele l'avversario; con un {{t:spr|SPR}} basso non ci sono, e un centro evidente (ad es. la terza carta di cuori sul {{t:board|board}}) lo spaventa"
  level: heuristic
  source: "allenatore con un sito di formazione, Implied Odds Calculator; sito di formazione, Implied Odds"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-010
  module: m7
  if: "hai un {{t:draw|progetto}} a un {{t:flush|colore}} basso, oppure a una {{t:straight|scala}} quando sul {{t:board|board}} può arrivare un {{t:flush|colore}}"
  then: "{{t:call|chiami}} con più cautela e conti meno out"
  because: "quando chiudi, a volte perdi ancora contro una mano migliore, e proprio allora paghi di più (implied odds inverse)"
  level: heuristic
  source: "sito di formazione, Back to Basics (Part 2): Reverse Implied Odds; allenatore con un sito di formazione, Implied Odds Calculator"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-011
  module: m7
  if: "difendi il {{t:big-blind|big blind}} e il Button, dopo l'{{t:open|apertura}}, non ha fatto c-bet sul flop (ha fatto {{t:check|check}})"
  then: "al turn punti tu più spesso (probe bet), soprattutto sui board bassi; sui board con un asso o un re più raramente"
  because: "con molte mani forti il Button avrebbe puntato, quindi dopo il {{t:check|check}} ne ha meno; sui board alti però il {{t:range-advantage|vantaggio di range}} resta dalla sua parte"
  level: heuristic
  source: "sito di un solver commerciale, The Turn Probe Bet; sito di formazione, Turn Probe (Kanu7); sito di formazione, Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-012
  module: m7
  if: "{{t:bet|punti}} al turn con un probe bet"
  then: "punti con le {{t:pair|coppie}} che vogliono essere pagate e protette, e con i {{t:draw|progetti}} forti; le mani senza {{t:pair|coppia}} e senza out fanno {{t:check|check}}"
  because: "le {{t:pair|coppie}} guadagnano contro le mani peggiori del Button e non gli danno una carta gratis, i {{t:draw|progetti}} vincono in due modi, e le mani vuote non guadagnano nulla"
  level: heuristic
  source: "sito di un solver commerciale, The Turn Probe Bet; sito di formazione, Turn Probe (Kanu7); sito di formazione, Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-013
  module: m7
  if: "hai {{t:call|chiamato}} un c-bet sul flop e l'avversario punta una seconda volta al turn"
  then: "difendi più stretto che sul flop: i {{t:draw|progetti}} {{t:call|chiamano}} solo con un buon prezzo o con implied odds, e le mani senza out e le {{t:pair|coppie}} più deboli {{t:fold|foldano}}"
  because: "l'avversario {{t:bet|punta}} il {{t:second-barrel|second barrel}} con un {{t:range|range}} più stretto del c-bet e di solito con una dimensione più grande, e i {{t:draw|progetti}} hanno ormai una sola carta"
  level: heuristic
  source: "sito di formazione, What the Best Poker Pros Already Know About Playing vs. Double Barrels"
  sources: [{ kind: training }]

# M8: river. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D10–D17). Reguł eksploatacyjnych brak (R-M6-004: obserwacja konkretnego gracza, bez danych o populacji, D-149).
- id: R-M8-001
  module: m8
  if: "sul river {{t:in-position|in posizione}} vuoi puntare per {{t:value|valore}} e l'avversario può ormai solo {{t:call|chiamare}} o {{t:fold|foldare}}"
  then: "punti quando più di {{n:value.threshold}} delle mani che {{t:call|chiameranno}} sono peggiori della tua; conti solo le mani che pagheranno, non tutte le mani dell'avversario"
  because: "ogni {{t:call|chiamata}} di una mano peggiore vince una puntata, e ogni {{t:call|chiamata}} di una mano migliore perde una puntata; quando l'avversario {{t:fold|folda}} una mano peggiore, vinci lo stesso {{t:pot|piatto}} che avresti vinto dopo un {{t:check|check}}"
  level: math
  source: "calcolo: valore atteso della puntata rispetto al check (programma didattico M8: un value bet vince più della metà delle volte quando viene chiamato)"
  sources: [{ kind: math }]
- id: R-M8-002
  module: m8
  if: "sul river hai {{t:in-position|in posizione}} una mano media, e le mani peggiori dell'avversario non pagheranno una puntata"
  then: "fai {{t:check|check}} e vai allo showdown gratis"
  because: "dopo una puntata le mani peggiori {{t:fold|foldano}} e pagano (o {{t:raise|rilanciano}}) quelle migliori, quindi la puntata trasforma una mano con valore allo showdown in un {{t:bluff|bluff}}"
  level: heuristic
  source: "conclusione da R-M8-001; sito di un solver commerciale, Mastering Thin Value Bets in Checked-Down Pots; sito di formazione, River; sito di formazione, Polarized vs Merged Ranges"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M8-003
  module: m8
  if: "la tua mano sul river batte solo poco più della metà delle mani che possono {{t:call|chiamare}} (thin value)"
  then: "punti meno che con una mano forte, di solito circa 1/4–1/2 del {{t:pot|piatto}}, quando l'avversario {{t:raise|rilancia}} raramente (semplificazione: se c'è il rischio di un check-raise, con la {{t:position|posizione}} raramente scendi sotto 1/2 del {{t:pot|piatto}})"
  because: "una puntata piccola la {{t:call|chiamano}} anche le mani più deboli dell'avversario; una puntata grande la {{t:call|chiamano}} soprattutto quelle migliori, e allora le {{t:call|chiamate}} di mani peggiori smettono di essere più numerose di quelle di mani migliori"
  level: heuristic
  source: "sito di un solver commerciale, River Refinements; sito di un solver commerciale, Mastering Thin Value Bets in Checked-Down Pots; sito di formazione, Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-004
  module: m8
  if: "sul river punti l'intero {{t:pot|piatto}} con un {{t:range|range}} composto da mani molto forti e {{t:bluff|bluff}}"
  then: "in equilibrio circa {{n:bluff.share.bet-pot}} delle tue puntate sono {{t:bluff|bluff}}; in generale la quota di {{t:bluff|bluff}} = puntata ÷ ({{t:pot|piatto}} + 2·puntata)"
  because: "così la mano dell'avversario che batte solo i {{t:bluff|bluff}} ha esattamente l'equity necessaria ({{n:eq.bet-pot}}): non guadagna né {{t:call|chiamando}} né {{t:fold|foldando}}, quindi non puoi essere sfruttato"
  level: math
  source: "calcolo: condizione di indifferenza della mano che cattura i bluff (modello semplificato: range polarizzato contro un bluff-catcher); sito di un solver commerciale, How to Solve Toy Games"
  sources: [{ kind: solver-pub }, { kind: math }]
- id: R-M8-005
  module: m8
  if: "sul river cambi la dimensione della puntata con un {{t:range|range}} {{t:polarized|polarizzato}}"
  then: "con una puntata più grande ci metti più {{t:bluff|bluff}}, con una più piccola meno: a 1/3 del {{t:pot|piatto}} circa {{n:bluff.share.bet-third}}, con l'intero {{t:pot|piatto}} circa {{n:bluff.share.bet-pot}}"
  because: "una puntata più grande dà all'avversario un prezzo peggiore, quindi la sua {{t:call|chiamata}} ha bisogno di più {{t:bluff|bluff}} nel tuo {{t:range|range}} per essere conveniente"
  level: math
  source: "calcolo: quota di bluff = puntata/(piatto+2·puntata)"
  sources: [{ kind: math }]
- id: R-M8-006
  module: m8
  if: "scegli con quali mani {{t:bluff|bluffare}} sul river"
  then: "{{t:bluff|bluffi}} con le mani più deboli che non vinceranno allo showdown (ad es. {{t:draw|progetti}} di {{t:straight|scala}} mancati o carte alte senza possibilità); le mani con valore allo showdown fanno {{t:check|check}}"
  because: "un {{t:bluff|bluff}} con una mano che spesso vince dopo il {{t:check|check}} rinuncia a quella vincita; una mano senza possibilità non perde nulla quando il {{t:bluff|bluff}} non riesce"
  level: heuristic
  source: "sito di un solver commerciale, We're At The River. Our Hand Can't Win. Now What?; sito di formazione, Polarized vs Linear Ranges"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-007
  module: m8
  if: "scegli un {{t:bluff|bluff}} tra le mani senza valore allo showdown"
  then: "scegli una mano con una carta che blocca le mani forti dell'avversario, quelle con cui pagherà (ad es. l'asso del seme, quando sul {{t:board|board}} ci sono tre carte dello stesso seme)"
  because: "quando hai una carta delle sue mani più forti, l'avversario ne ha meno {{t:combo|combo}}, quindi più spesso gli resta una mano da foldare"
  level: heuristic
  source: "programma didattico M8; sito di un solver commerciale, Blockers & Unblockers: The Secret to Picking Great Bluffs; sito di formazione, What is Unblocking in Poker"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-008
  module: m8
  if: "il {{t:flush-draw|progetto di colore}} non è entrato e tu scegli un {{t:bluff|bluff}}"
  then: "quando puoi scegliere tra più {{t:bluff|bluff}}, preferisci un {{t:bluff|bluff}} senza carte di quel seme"
  because: "i {{t:draw|progetti}} mancati l'avversario li {{t:fold|folderà}}; una carta del loro seme nella tua mano riduce il numero di sue mani da foldare"
  level: heuristic
  source: "sito di formazione, What is Unblocking in Poker; sito di un solver commerciale, Blockers & Unblockers: The Secret to Picking Great Bluffs"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-009
  module: m8
  if: "hai una carta di un certo rango"
  then: "l'avversario ha meno {{t:combo|combo}} con quel rango: di AK invece di {{n:combos.unpaired}} ne ha {{n:combos.unpaired.one-blocked}}, e di {{t:pair|coppia}} d'assi invece di {{n:combos.pair}} solo {{n:combos.pair.one-blocked}}"
  because: "una carta nella tua mano non può essere nella mano dell'avversario: delle quattro carte di quel rango gliene restano {{n:pair.outs.per-rank}}"
  level: math
  source: "combinatoria"
  sources: [{ kind: math }]
- id: R-M8-010
  module: m8
  if: "sul river hai una mano che batte solo i {{t:bluff|bluff}} dell'avversario (bluff-catcher)"
  then: "{{t:call|chiami}} quando i {{t:bluff|bluff}} superano l'equity necessaria, ad es. più di {{n:eq.bet-pot}} delle puntate pari al {{t:pot|piatto}}; quando i {{t:bluff|bluff}} sono meno, {{t:fold|foldi}}"
  because: "la tua equity è la quota di {{t:bluff|bluff}} tra le sue puntate (vinci contro ogni {{t:bluff|bluff}}, perdi contro ogni mano per {{t:value|valore}}); quando l'avversario {{t:bluff|bluffa}} nella misura di puntata ÷ ({{t:pot|piatto}} + 2·puntata), la {{t:call|chiamata}} va in pari"
  level: math
  source: "calcolo: equity necessaria = puntata/(piatto+2·puntata)"
  sources: [{ kind: math }]
- id: R-M8-011
  module: m8
  if: "scegli con quali bluff-catcher {{t:call|chiamare}} una puntata sul river"
  then: "preferisci mani con carte che bloccano le mani forti dell'avversario e senza carte che bloccano i suoi {{t:bluff|bluff}} (ad es. senza carte del seme del {{t:draw|progetto}} mancato)"
  because: "quando blocchi il suo valore, nel {{t:range|range}} delle puntate restano più {{t:bluff|bluff}}; quando blocchi i suoi {{t:bluff|bluff}}, resta più valore"
  level: heuristic
  source: "sito di un solver commerciale, Understanding Blockers; sito di formazione; sito di formazione, Bluff Catching Strategy"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M8-012
  module: m8
  if: "ricevi una puntata sul river e difendi con un {{t:range|range}}"
  then: "{{t:call|chiami}} con i migliori bluff-catcher: tra mani di forza simile scegli quelle con {{t:blocker|blocker}} migliori; {{t:fold|foldi}} le mani che perdono anche contro i {{t:bluff|bluff}}"
  because: "una mano che perde contro tutte le puntate dell'avversario non guadagna con la {{t:call|chiamata}} nemmeno quando l'avversario {{t:bluff|bluffa}} molto"
  level: heuristic
  source: "conclusione dall'MDF (R-M6-001) e da R-M8-010; sito di un solver commerciale, Principles of River Play; sito di formazione, Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]

# M9: plan rozdania. Matematyka z liczb (numbers.yaml); progi stref SPR i liczba ulic wartości jako heurystyki
# (uproszczenia nazwane w lekcjach). Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D18–D22).
- id: R-M9-001
  module: m9
  if: "calcoli l'{{t:spr|SPR}} sul flop"
  then: "dividi lo {{t:effective-stack|stack effettivo}} (il minore dei due, senza ciò che è già nel {{t:pot|piatto}}) per il {{t:pot|piatto}}; dopo un'{{t:open|apertura}} e una {{t:call|chiamata}} è circa {{n:spr.srp}}, dopo un 3-bet {{t:in-position|in posizione}} circa {{n:spr.3bet-ip}}, dopo un 4-bet circa {{n:spr.4bet}}"
  because: "ogni {{t:raise|rilancio}} preflop moltiplica più volte il {{t:pot|piatto}}, mentre lo stack dietro diminuisce molto più lentamente"
  level: math
  source: "calcolo: SPR = stack effettivo ÷ piatto sul flop (stack e piatti dai numeri di M4)"
  sources: [{ kind: math }]
- id: R-M9-002
  module: m9
  if: "l'avversario va all-in sul flop per tutto lo stack"
  then: "per {{t:call|chiamare}} ti serve un'equity di stack ÷ ({{t:pot|piatto}} + 2·stack): con {{t:spr|SPR}} {{n:spr.commit}} è {{n:eq.jam.spr2}}, con {{t:spr|SPR}} {{n:spr.srp}} già {{n:eq.jam.srp}}"
  because: "metti tutto lo stack per vincere il {{t:pot|piatto}} e lo stack dell'avversario; più basso è l'{{t:spr|SPR}}, migliore è il prezzo che ottieni"
  level: math
  source: "calcolo: equity necessaria = chiamata/(piatto + 2·chiamata)"
  sources: [{ kind: math }]
- id: R-M9-003
  module: m9
  if: "l'{{t:spr|SPR}} sul flop è inferiore a circa {{n:spr.zone.low}} (ad es. {{n:spr.commit}}) e hai {{t:top-pair|top pair}} o una mano migliore"
  then: "giochi per tutto lo stack: punti o {{t:call|chiami}} con il piano di mettere dentro tutto e di solito non {{t:fold|foldi}} contro l'all-in"
  because: "con {{t:spr|SPR}} {{n:spr.commit}} contro l'all-in ti serve al massimo circa {{n:eq.jam.spr2}} di equity, e due {{t:bet|puntate}} da circa {{n:geo.spr2.2}} del {{t:pot|piatto}} mettono dentro tutto lo stack; la {{t:top-pair|top pair}} di solito regge due {{t:value|street di valore}}"
  level: heuristic
  source: "sito di un solver commerciale, Stack-to-Pot Ratio; allenatore con un sito di formazione, SPR Strategy; calcolo nella lezione m9.l2"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-004
  module: m9
  if: "dopo la tua {{t:bet|puntata}} ti resterebbe nello stack meno di quanto sarà il {{t:pot|piatto}} dopo la sua {{t:call|chiamata}}"
  then: "non pianifichi una {{t:bet|puntata}} seguita da un {{t:fold|fold}} contro l'all-in: o giochi per tutto lo stack, o fai {{t:check|check}}"
  because: "con {{t:spr|SPR}} {{n:spr.commit}}, dopo una {{t:bet|puntata}} pari al {{t:pot|piatto}} contro l'all-in ti serve solo {{n:eq.commit.after-pot}} di equity, quindi il {{t:fold|fold}} di solito non conviene"
  level: math
  source: "calcolo: chiamata/(piatto prima dell'eccedenza + 2·chiamata)"
  sources: [{ kind: math }]
- id: R-M9-005
  module: m9
  if: "giochi un {{t:pot|piatto}} con un solo rilancio a stack pieni ({{t:spr|SPR}} circa {{n:spr.srp}}) e hai solo una {{t:pair|coppia}}"
  then: "giochi per valore, ma di solito non pianifichi di mettere dentro tutto lo stack"
  because: "per mettere dentro tutto lo stack entro il river bisogna puntare più del {{t:pot|piatto}} su ogni {{t:street|street}}, e un avversario che mette dentro così tanti soldi raramente ha una mano peggiore di una sola {{t:pair|coppia}}"
  level: heuristic
  source: "calcolo della dimensione geometrica (m9.l3); sito di un solver commerciale, Stack-to-Pot Ratio; sito di formazione, When to Check Top Pair"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-006
  module: m9
  if: "vuoi mettere dentro tutto lo stack con {{t:bet|puntate}} uguali entro il river"
  then: "punti su ogni {{t:street|street}} la stessa frazione f del {{t:pot|piatto}}, tale che (1 + 2f) elevato al numero di {{t:street|street}} = 1 + 2·{{t:spr|SPR}}; in un {{t:pot|piatto}} con 3-bet {{t:in-position|in posizione}} è circa {{n:geo.3bet-ip.3}} del {{t:pot|piatto}}"
  because: "una {{t:bet|puntata}} f e una {{t:call|chiamata}} moltiplicano il {{t:pot|piatto}} per (1 + 2f), e l'all-in arriva quando il {{t:pot|piatto}} cresce fino a {{t:pot|piatto}} + 2·stack"
  level: math
  source: "calcolo: dimensione geometrica; sito di formazione, Geometric Bet Sizing; sito di un solver commerciale, Pot Geometry"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-007
  module: m9
  if: "in un {{t:pot|piatto}} con un solo rilancio e stack di {{n:format.stack}} punti su tre {{t:street|street}}"
  then: "ricordi che tre {{t:bet|puntate}} da mezzo {{t:pot|piatto}} mettono dentro solo {{n:srp.half.total}}, e tre {{t:bet|puntate}} pari al {{t:pot|piatto}} {{n:srp.potbet.total}} di uno stack di {{n:spr.srp.stack}}"
  because: "il {{t:pot|piatto}} sul flop è piccolo rispetto allo stack; tutto lo stack entra solo con {{t:bet|puntate}} di circa {{n:geo.srp.3}} del {{t:pot|piatto}} su ogni {{t:street|street}}"
  level: math
  source: "calcolo: puntata e chiamata moltiplicano il piatto per (1 + 2f)"
  sources: [{ kind: math }]
- id: R-M9-008
  module: m9
  if: "prima di una {{t:bet|puntata}} sul flop pianifichi la mano"
  then: "valuti quante {{t:value|street di valore}} regge la mano (il numero di {{t:street|street}} è una semplificazione): molto forte (set, {{t:straight|scala}}, {{t:two-pair|doppia coppia}} alta) tre, {{t:top-pair|top pair}} con buon kicker o {{t:overpair|overpair}} di solito due, la terza quando l'avversario paga con mani più deboli; una {{t:pair|coppia}} più debole una o nessuna"
  because: "a ogni {{t:street|street}} le mani peggiori dell'avversario {{t:fold|foldano}}, e nel {{t:pot|piatto}} restano soprattutto mani migliori della tua"
  level: heuristic
  source: "sintesi: sito di formazione, When to Check Top Pair (https://upswingpoker.com/when-to-check-top-pair/): «In single raised pots, the stack-to-pot ratio (SPR) is too high to comfortably get 3 streets of value with many top pair hands.»; sito di un solver commerciale, Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/): «All top pairs and all nut flush draws are now indifferent between calling and folding» (SPR 16); sito di un solver commerciale, Pot Geometry (https://blog.gtowizard.com/pot-geometry/): «Game theory optimal strategies typically use geometric bet sizes when they want to maximize value with a big nut advantage.»; numero di street per mano, inclusa la coppia più debole: semplificazione dell'app (D-149)"
  sources: [{ kind: training, url: "https://upswingpoker.com/when-to-check-top-pair/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }]
- id: R-M9-009
  module: m9
  if: "hai una mano da tre {{t:value|street di valore}}, la zona di {{t:spr|SPR}} ti permette di giocarla per tutto lo stack (R-M9-010) e vuoi mettere dentro tutto lo stack"
  then: "già sul flop punti con una dimensione geometrica, non piccola"
  because: "in un {{t:pot|piatto}} con 3-bet tre {{t:bet|puntate}} da 1/3 del {{t:pot|piatto}} mettono dentro solo circa {{n:g3b.third.total}} di uno stack di {{n:spr.3bet-ip.stack}}, quindi la maggior parte dello stack resta fuori; con circa {{n:geo.3bet-ip.3}} del {{t:pot|piatto}} su ogni {{t:street|street}} entra tutto"
  level: math
  source: "calcolo: catena di puntate e chiamate (numbers.yaml, chiavi g3b.third.* e geo.3bet-ip.*)"
  sources: [{ kind: math }]
- id: R-M9-010
  module: m9
  if: "stai decidendo se giocare per tutto lo stack con una certa mano"
  then: "guardi la zona di {{t:spr|SPR}} (semplificazione): sotto circa {{n:spr.zone.low}} di solito basta la {{t:top-pair|top pair}}, da {{n:spr.zone.low}} a {{n:spr.zone.mid}} la {{t:top-pair|top pair}} è una mano al limite, da {{n:spr.zone.mid}} a {{n:spr.zone.deep}} di solito ti serve una {{t:two-pair|doppia coppia}} alta o meglio, e sopra {{n:spr.zone.deep}} un set, una {{t:straight|scala}} o una mano migliore"
  because: "più alto è l'{{t:spr|SPR}}, più {{t:bet|puntate}} servono per mettere dentro tutto lo stack, e fino alla fine l'avversario paga soprattutto con mani forti; con {{t:spr|SPR}} {{n:spr.zone.deep}} tutto lo stack entra solo dopo tre {{t:bet|puntate}} pari al {{t:pot|piatto}}"
  level: heuristic
  source: "allenatore con un sito di formazione, SPR Strategy (https://www.splitsuit.com/spr-poker-strategy): «less than 3 is an auto-stack off with top pair or better, between 3-6 is situational and based upon villain/board texture, and more than 6 SPR isn't a default stack-off»; sito di un solver commerciale, Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/): «at this higher SPR, stacking off with top pair starts to get a bit dicey»; zona 6–13: parte comune di due siti di formazione: SPR (https://www.thepokerbank.com/strategy/concepts/spr/): «Medium SPR = 7 - 16», «Good hands for medium SPRs.», «Top two pair. Sets.»; Poker SPR (https://pokercoaching.com/blog/poker-spr/): «High SPR (8+): Deep stacks favor hands that make nutted combinations (sets, straights, flushes) over one-pair holdings.»; soglia 13: calcolo (1+2·1)^3 = 1+2·13 e Flynn, Mehta, Miller, Professional No-Limit Hold'em tramite un sito di informazione (https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm): «if you're heads-up and the stack-to-pot ratio is 13 going to the flop, you and your opponent can each make exactly three pot-sized bets»; confini delle zone: semplificazione dell'app (D-149)"
  sources: [{ kind: training, url: "https://www.splitsuit.com/spr-poker-strategy" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }, { kind: training, url: "https://www.thepokerbank.com/strategy/concepts/spr/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-spr/" }, { kind: math }, { kind: book, url: "https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm" }]

# M10: eksploatacja mikrostawek. Każde dostosowanie to odejście od bazy z M3–M9 (ADR-03). Definicje statystyk: rules;
# błąd próby, próg blefu i wpływ rake'u na cenę: math; progi typów graczy i próby z serwisów szkoleniowych: heuristic;
# wynik solvera: gto; dostosowanie do typu gracza: exploit z populacją (dane z analizy bazy rąk populacji albo odczyt HUD rywala z próbą).
# Decyzje D-M10-01…14 w raporcie M10 (do dokumentu 12 „Weryfikacja źródeł — M10–M13”).
- id: R-M10-001
  module: m10
  if: "leggi il {{t:vpip|VPIP}} e il {{t:pfr|PFR}} dell'avversario"
  then: "il {{t:vpip|VPIP}} è la percentuale di mani in cui mette volontariamente {{t:chips|fiches}} preflop ({{t:call|chiama}} o {{t:raise|rilancia}}; i blind non contano), e il {{t:pfr|PFR}} la percentuale di mani in cui {{t:raise|rilancia}} preflop ({{t:open|apertura}}, 3-bet, 4-bet); il {{t:pfr|PFR}} non supera mai il {{t:vpip|VPIP}}"
  because: "ogni {{t:raise|rilancio}} è anche un versamento volontario di {{t:chips|fiches}}, quindi la differenza {{t:vpip|VPIP}} − {{t:pfr|PFR}} sono le mani che l'avversario ha solo {{t:call|chiamato}} o limpato"
  level: rules
  source: "glossario di un sito di un solver commerciale (https://gtowizard.com/en/glossary/): «VPIP: … a statistic that measures the frequency with which a player voluntarily puts money into the pot preflop.»; sito di formazione, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «Anytime a player makes a call or a raise before the flop, their VPIP goes up», «a player’s PFR stat goes up anytime they make a raise before the flop, which includes all 3-bets and 4-bets as well as open raises»"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }]
- id: R-M10-002
  module: m10
  if: "la statistica dell'avversario si basa su n occasioni"
  then: "il suo errore standard è √(p × (1 − p) ÷ n): con un {{t:vpip|VPIP}} di {{n:hud.se.ex.p}} dopo {{n:hud.se.ex.n}} mani è circa {{n:hud.se.ex}}, quindi il vero {{t:vpip|VPIP}} si trova, con circa {{n:var.conf95}} di confidenza, tra {{n:hud.ci.ex.low}} e {{n:hud.ci.ex.high}}"
  because: "ogni mano è un campione casuale della sua strategia, e l'errore di una media del genere diminuisce solo con la radice quadrata del numero di occasioni, come l'errore del winrate nel modulo 12"
  level: math
  source: "calcolo: errore standard di una proporzione nella distribuzione binomiale, √(p(1 − p) ÷ n), e intervallo di ±1,96 errori (numbers.yaml, chiavi hud.se.*, hud.ci.*)"
  sources: [{ kind: math }]
- id: R-M10-003
  module: m10
  if: "valuti l'avversario in base alle statistiche dell'{{t:hud|HUD}}"
  then: "sotto circa {{n:hud.hands.random}} mani le consideri casuali e giochi contro di lui come contro uno sconosciuto; il tipo di giocatore si vede a grandi linee dopo circa {{n:hud.hands.random}}–{{n:hud.hands.rough.high}} mani, {{t:vpip|VPIP}} e {{t:pfr|PFR}} si stabilizzano dopo circa {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}}, il 3-bet dopo circa {{n:hud.hands.3bet.overall.low}}–{{n:hud.hands.3bet.high}}, e il fold to 3-bet dopo circa {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}}"
  because: "il {{t:vpip|VPIP}} aumenta di un'occasione a ogni mano, mentre il fold to 3-bet solo quando l'avversario ha {{t:open|aperto}} e ha ricevuto un 3-bet, quindi dallo stesso numero di mani ha molte meno occasioni e un errore maggiore"
  level: heuristic
  source: "sito di formazione, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «For VPIP and PFR, you need at least 100 to 200 hands before the numbers begin to stabilize.», «For 3-bet and fold to 3-bet, closer to 500 hands is the threshold.»; sito di formazione, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «Below 30 hands, treat the HUD numbers as random and use hand-observation reads only.», «VPIP / PFR 30-50 hands», «3-bet % (overall) 100+ hands», «Fold to 3-bet | 200+ hands»; per VPIP e PFR due soglie: tipo approssimativo dopo 30–50 mani e stabilizzazione dopo 100–200 (contraddizione allo stesso livello, docs/tresci/e1-m9-m11.md §3.1); per 3-bet e fold to 3-bet limiti inferiori distinti dalla stessa tabella (100+ e 200+), limite superiore comune (D-M10-04; E3 2026-11-04)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-004
  module: m10
  if: "il {{t:vpip|VPIP}} dell'avversario supera di oltre {{n:hud.gap.passive}} punti percentuali il suo {{t:pfr|PFR}}"
  then: "è un giocatore passivo: {{t:call|chiama}} e limpa molto, {{t:raise|rilancia}} poco"
  because: "la maggior parte delle mani che gioca la mette nel {{t:pot|piatto}} con una {{t:call|chiamata}}; nei {{t:regular|regular}} la differenza è piccola, perché iniziano quasi ogni mano con un {{t:raise|rilancio}}"
  level: heuristic
  source: "sito di formazione, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «When a player’s PFR is more than 10 points below their VPIP, I immediately flag them as a passive player who calls too much and raises too little.»; sito di formazione, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «Gap > 10 → Passive player. Lots of cold-calls and limps.»; dati di controllo da un'analisi del database di mani della popolazione, grande sala online NL25 6-max: giocatori ricreativi 42/18, regular 23/18 (mda.rec.*, mda.reg.*)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-005
  module: m10
  if: "assegni un tipo all'avversario in base a {{t:vpip|VPIP}} e {{t:pfr|PFR}} (6-max, almeno circa {{n:hud.hands.vpip.low}} mani)"
  then: "il {{t:nit|nit}} gioca fino a circa {{n:hud.vpip.nit-max}} delle mani; il {{t:regular|regular}} circa {{n:hud.vpip.reg.low}}–{{n:hud.vpip.reg.high}} con una piccola differenza {{t:vpip|VPIP}} − {{t:pfr|PFR}}; il giocatore loose da circa {{n:hud.vpip.loose}}: con una differenza di oltre {{n:hud.gap.passive}} punti è un {{t:recreational|giocatore ricreativo}} passivo ({{t:calling-station|calling station}}), con una differenza fino a circa {{n:hud.gap.aggressive}} punti è un {{t:maniac|maniac}}"
  because: "il tipo dice in che direzione l'avversario si discosta dalla base: gioca troppo poche mani, troppe mani, {{t:call|chiama}} troppo spesso o {{t:raise|rilancia}} troppo spesso"
  level: heuristic
  source: "sito di formazione, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/), tabella 6-max cash: «22 to 28», «35+», «14 or below»; «a player playing a 45 VPIP is either a maniac or a calling station»; «When the gap is less than 3 points, I flag them as highly aggressive»; sito di formazione, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «10-15% | Very tight (nit)», «18-22% | Tight-aggressive (TAG)», «25-30% | Loose-aggressive (LAG)», «35%+ | Loose (likely recreational)», profili «Nit (15/12/3%)», «Whale / Recreational (45/8/2%)», «Maniac (38/35/15%+)»; analisi del database di mani della popolazione: Regulars «VPIP = 18-32», Recreationals «VPIP > 40»; soglie come parte comune o come intervallo che copre le fonti (D-M10-03)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-006
  module: m10
  if: "giochi contro un {{t:recreational|giocatore ricreativo}} passivo ({{t:vpip|VPIP}} da circa {{n:hud.vpip.loose}}, differenza {{t:vpip|VPIP}} − {{t:pfr|PFR}} di oltre {{n:hud.gap.passive}} punti)"
  then: "punti per {{t:value|valore}} con più mani, anche più sottili, e {{t:bluff|bluffi}} meno spesso che nella base del modulo 8, soprattutto sul river"
  because: "un giocatore così arriva più spesso allo showdown e lì perde più spesso, cioè {{t:call|chiama}} con mani più deboli: più sue {{t:call|chiamate}} sono mani peggiori della tua (soglia del value bet del modulo 8), e il {{t:bluff|bluff}} guadagna solo quando l'avversario {{t:fold|folda}} più spesso dell'{{t:alpha|alpha}}"
  level: exploit
  population: "giocatori ricreativi in una grande sala online, NL25–NL100 6-max (secondo la definizione del database: VPIP > 40, risultato < −20bb/100): WTSD 32% contro 28% dei regular, showdown vinti 46% contro 57%, risultato −47bb/100; tutte le mani dei 12 mesi precedenti il 5.10.2026 (analisi del database di mani della popolazione, numero di mani non indicato)"
  source: "sito con un'analisi del database di mani della popolazione (https://bluffaces.com/calculators/mda/), filtri: grande sala online NL25/NL50/NL100 6-max, Recreationals e Regulars (mda.rec.*, mda.reg.*), numero di mani non indicato; sito di formazione, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): un WTSD alto «instantly tells you to bluff them less and value bet them more across all betting streets, especially on the river.»; sito di formazione, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «>30% → Calling station. Value bet thinly, never bluff river.» (questa soglia di WTSD non la insegniamo: il sito di formazione indica «In most cases, your WTSD% should be around 30», e nei dati dell'analisi del database i regular hanno 28%, i giocatori ricreativi 32%; D-M10-07); soglia del value bet R-M8-001 e alpha del modulo 6 invariate (D-M10-06)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-007
  module: m10
  if: "{{t:raise|rilancia}} o fa 3-bet un {{t:nit|nit}} ({{t:vpip|VPIP}} fino a circa {{n:hud.vpip.nit-max}} dopo almeno circa {{n:hud.hands.vpip.low}} mani)"
  then: "{{t:fold|foldi}} le mani della parte bassa del {{t:range|range}} di {{t:call|chiamata}} più spesso che nella base del modulo 4, e gli rubi i blind più spesso"
  because: "chi gioca così poche mani {{t:raise|rilancia}} soprattutto con le più forti, quindi le tue mani medie sono più spesso dominate; e se difende i blind in modo stretto, la tua {{t:open|apertura}} vince subito più spesso"
  level: exploit
  population: "un singolo avversario: lettura HUD da almeno circa 100 mani (VPIP fino al 14%); soglie del tipo da due siti di formazione (6-max cash online); nessun dato sull'intera popolazione, perché i nit sono una minoranza al tavolo (D-M10-02)"
  source: "sito di formazione, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «anyone significantly below is a nit whose raises you can nearly always fold to»; sito di formazione, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): nit «Plays only premium hands. Steal their blinds relentlessly, fold to their 3-bets without thought, bluff-catch sparingly.»; «10-15% | Very tight (nit) | Folds preflop too much; bluff their open ranges, fold to their 3-bets»"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-008
  module: m10
  if: "giochi contro un {{t:maniac|maniac}} ({{t:vpip|VPIP}} da circa {{n:hud.vpip.loose}}, {{t:pfr|PFR}} quasi uguale al {{t:vpip|VPIP}})"
  then: "non lo {{t:bluff|bluffi}}, {{t:call|chiami}} più largo con le mani che catturano i {{t:bluff|bluff}}, e con le mani molto forti lo lasci puntare"
  because: "le sue puntate e i suoi {{t:raise|rilanci}} contengono più {{t:bluff|bluff}} che nella base, quindi le mani che nella base sono al limite della {{t:call|chiamata}} guadagnano, e il {{t:bluff|bluff}} contro chi {{t:fold|folda}} raramente perde"
  level: exploit
  population: "un singolo avversario: lettura HUD da almeno circa 100 mani (VPIP dal 35%, VPIP − PFR sotto i 3 punti); soglie del tipo da due siti di formazione (6-max cash online); nessun dato sull'intera popolazione (D-M10-02)"
  source: "sito di formazione, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): maniac «Trap with premium hands by flat-calling preflop and letting them stack off. Don't try to out-bluff them; just let them hang themselves.»; sito di formazione, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «a player playing a 45 VPIP is either a maniac or a calling station»; principio delle mani miste: sito di un solver commerciale, Calling Down Over-Bluffed Lines in Lower Limits (R-M10-009)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: solver-pub }]
- id: R-M10-009
  module: m10
  if: "sai che in una certa linea l'avversario {{t:bluff|bluffa}} più o meno spesso che in equilibrio"
  then: "prima cambi decisione con le mani che nella base mescolano {{t:call|chiamata}} e {{t:fold|fold}}: con un eccesso di {{t:bluff|bluff}} le {{t:call|chiami}} sempre, con un difetto le {{t:fold|foldi}} sempre"
  because: "in equilibrio queste mani sono indifferenti, perché l'avversario ha esattamente tanti {{t:bluff|bluff}} quanti servono; già un piccolo eccesso o difetto le sposta da una parte, mentre il resto del {{t:range|range}} cambia solo con una differenza grande"
  level: gto
  source: "sito di un solver commerciale, Calling Down Over-Bluffed Lines in Lower Limits (https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/), analisi con nodelock: «Hands that mix calls and folds in theory do so because Villain’s bet size is strategically balanced, making them indifferent to calling and folding since no option is the best.»; «If they are bluffing just a single combo more than they should, all of our indifferent bluff catchers become profitable calls and vice versa (we always fold when they are under-bluffing even slightly).»; «I only changed Villain’s strategy to bluff ~31% instead of ~27% of the time for our strategy to shift completely to never folding.»"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/" }]
- id: R-M10-010
  module: m10
  if: "l'avversario {{t:fold|folda}} al c-bet più spesso di quanto vale l'{{t:alpha|alpha}} della tua dimensione"
  then: "il c-bet senza alcuna mano guadagna subito: con un c-bet di 1/3 del {{t:pot|piatto}} bastano più di {{n:alpha.cbet.small}} di {{t:fold|fold}}, con un c-bet di 3/4 del {{t:pot|piatto}} più di {{n:alpha.cbet.big}}"
  because: "il {{t:bluff|bluff}} rischia la puntata per vincere il {{t:pot|piatto}}; guadagna quando la percentuale di {{t:fold|fold}} supera puntata ÷ ({{t:pot|piatto}} + puntata); il fold to c-bet dell'{{t:hud|HUD}} unisce tutte le dimensioni e tutti i board, quindi è solo un'approssimazione"
  level: math
  source: "calcolo: EV del bluff puro = fold × piatto − (1 − fold) × puntata > 0 ⇔ fold > puntata ÷ (piatto + puntata) (alpha, modulo 6; numbers.yaml alpha.cbet.*); glossario di un sito di un solver commerciale (https://gtowizard.com/en/glossary/): «Alpha (α): The minimum frequency your opponent needs to fold to a bet, in order to break even with a pure (0% equity) bluff.»"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M10-011
  module: m10
  if: "l'avversario {{t:fold|folda}} raramente al 3-bet (fold to 3-bet sotto circa {{n:hud.f3b.low}}), ad es. un tipico {{t:recreational|giocatore ricreativo}}"
  then: "gli fai 3-bet con un {{t:range|range}} {{t:linear|lineare}}: più mani forti per {{t:value|valore}}, quasi senza {{t:bluff|bluff}}"
  because: "un 3-bet {{t:in-position|in posizione}} a {{n:pf.3bet.ip-total}} guadagna senza alcuna mano solo con più di {{n:alpha.vs-3bet-ip-size}} di {{t:fold|fold}}; quando l'avversario {{t:fold|folda}} raramente, i {{t:bluff|bluff}} giocano un {{t:pot|piatto}} grande con mani deboli, e le mani forti ricevono più {{t:call|chiamate}}"
  level: exploit
  population: "grande sala online, NL25–NL100 6-max (analisi del database di mani della popolazione, 12 mesi precedenti il 5.10.2026, numero di mani non indicato): fold to 3-bet dei giocatori ricreativi 31% (NL50 30%, NL100 32%), dei regular 55% (NL50 57%, NL100 55%)"
  source: "sito con un'analisi del database di mani della popolazione (https://bluffaces.com/calculators/mda/), Fold to 3bet (mda.rec.f3b, mda.reg.f3b), numero di mani non indicato; sito di formazione, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «if a player has a low Fold to 3-Bet, you will want to adjust your 3-betting range against them and play a more linear range made up of almost solely value hands and very few bluffs.»; sito di formazione, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «<50% → They call 3-bets wide. Drop bluff 3-bets; value-bet thinner and exploit postflop.»; soglia alpha del modulo 4 (alpha.vs-3bet-ip-size)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-012
  module: m10
  if: "sull'avversario hai solo un piccolo campione o solo una conoscenza generale della popolazione"
  then: "ti discosti dalla base solo nella direzione indicata dalle statistiche, e solo con le mani al limite; uno scostamento grande, con l'intero {{t:range|range}}, solo con un campione grande e un errore evidente dell'avversario"
  because: "con un piccolo campione l'errore della statistica è grande, e discostarsi dalla base (la strategia meno sfruttabile) è di per sé sfruttabile"
  level: heuristic
  source: "sito di formazione, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «The directional signal (very high VPIP, very low PFR) may still be useful even with small samples, but specific exploitation based on percentage points requires a much larger hand history.»; glossario di un sito di un solver commerciale (https://gtowizard.com/en/glossary/): «Exploit: To deviate from a baseline strategy in order to take advantage of a (future or prior) mistake in your opponent's strategy.», «Game Theory Optimal (GTO) The least exploitable fixed strategy»; errore del campione: R-M10-002"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://gtowizard.com/en/glossary/" }]
- id: R-M10-013
  module: m10
  if: "giochi cash 6-max ai microlimiti (NL2–NL25)"
  then: "calcoli il risultato al netto del {{t:rake|rake}}: le grandi sale online prelevano circa {{n:rake.micro.low}}–{{n:rake.micro.high}}, cioè diverse volte più del winrate di un tipico giocatore vincente ({{n:var.wr.typical.low}}–{{n:var.wr.typical.high}})"
  because: "il {{t:rake|rake}} lo pagano tutti i giocatori da ogni {{t:pot|piatto}} che arriva al flop; per vincere devi battere gli avversari di più di quanto vale il {{t:rake|rake}}"
  level: heuristic
  source: "sito di calcolatori per il poker, Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/), NLH 6-max, due grandi sale online NL2–NL25 (rake.micro.*); dati di controllo dalla popolazione: Tombos21, rake per giocatore NL10 9,1bb/100, NL100 7,3bb/100 (rake.pop.*); sito di informazione, How Many Winning Cash Games Players Are There? It Depends on Rake (https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players), Tombos21: «Reminder that your biggest villain is the house.», «Pre-rake winners 90% post-rake winners 53%»; allenatore con un blog di formazione (var.wr.typical.*, modulo 12)"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: population, url: "https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players" }, { kind: training }]
- id: R-M10-014
  module: m10
  if: "ricevi un'{{t:open|apertura}} in un gioco con {{t:rake|rake}} prelevato solo dai {{t:pot|piatti}} che arrivano al flop"
  then: "{{t:call|chiami}} meno spesso che in un gioco senza {{t:rake|rake}}; una parte delle mani che senza {{t:rake|rake}} {{t:call|chiameresti}} la giochi in 3-bet, e il resto lo {{t:fold|foldi}}"
  because: "il {{t:rake|rake}} prende una parte del {{t:pot|piatto}} dopo il flop, mentre un {{t:pot|piatto}} chiuso prima del flop ne è esente: la {{t:call|chiamata}} di solito porta al flop e paga il {{t:rake|rake}}, il 3-bet spesso chiude la mano prima del flop, senza {{t:rake|rake}}, e il {{t:fold|fold}} non costa nulla (alcune sale prelevano il {{t:rake|rake}} anche dai {{t:pot|piatti}} con 3-bet senza flop, quindi lì anche il 3-bet paga)"
  level: gto
  source: "sito di un solver commerciale, Preflop Raise Sizing: Examining 2 Key Factors (https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/), soluzioni 200bb 6-max con rake NL100: «Facing a LJ raise, the HJ, CO, and BTN all VPIP 25%-35% fewer hands in the raked game.», «Rake makes calling raises considerably less appealing, leading to much lower VPIPs and somewhat higher 3-betting frequencies in “no flop, no drop” games.», «BB calls a min-raise in the raked game barely 60% as often as in the unraked game»; semplificazione: risultato per 200bb, l'autore: «many of the principles will generalize»; strutture di rake delle sale: sito di calcolatori per il poker, API /network-rake-list, campo rule: seconda grande sala online «flop_drop», grande sala online «flop_or_3b_drop» (lettura del 5.10.2026)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/" }, { kind: training }]
- id: R-M10-015
  module: m10
  if: "calcoli l'equity necessaria in un gioco con {{t:rake|rake}}"
  then: "dividi l'importo da chiamare per il {{t:pot|piatto}} dopo la {{t:call|chiamata}} diminuito del {{t:rake|rake}}: con una puntata di mezzo {{t:pot|piatto}} e un {{t:rake|rake}} pari a {{n:rake.ex.pct}} ti serve {{n:eq.bet-half.rake}} invece di {{n:eq.bet-half}}"
  because: "vinci il {{t:pot|piatto}} al netto del {{t:rake|rake}}, ma chiami l'intero importo; ai microlimiti i {{t:pot|piatti}} raramente arrivano al {{t:rake-cap|tetto del rake}}, quindi conta la percentuale"
  level: math
  source: "calcolo: chiamata ÷ (piatto dopo la chiamata × (1 − rake)) (numbers.yaml eq.bet-half.rake); sito di calcolatori per il poker, Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/): «At microstakes, percentage drives the cost because pots rarely hit the cap.»"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: math }]

# M12: mental game i bankroll. Poziomy według ADR-24: rachunek = math, zalecenie oparte na rachunku lub literaturze = heuristic.
- id: R-M12-001
  module: m12
  if: "valuti il tuo risultato o il tuo winrate da un campione di mani"
  then: "calcoli un intervallo: winrate ± {{n:var.z95}} × SD ÷ √(numero di mani ÷ 100)"
  because: "con SD {{n:var.sd}} anche dopo {{n:var.hands.k}} mila mani l'intervallo al {{n:var.conf95}} è di circa ± {{n:var.ci.wr}}, quindi un risultato di {{n:var.wr.ex}} significa solo «tra circa {{n:var.wr.ci.low}} e {{n:var.wr.ci.high}}»"
  level: math
  source: "calcolo: errore standard della media (distribuzione normale); SD da un sito di calcolatori per il poker, Examples and Impacts of Variance in Cash Games e Poker Variance Calculator"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-002
  module: m12
  if: "entri in un {{t:downswing|downswing}} di {{n:dd.bi.small}} {{t:buy-in|buy-in}}"
  then: "non lo consideri una prova di gioco scadente, ma rivedi le decisioni nelle mani perse"
  because: "in {{n:var.hands.k}} mila mani un {{t:downswing|downswing}} del genere dal picco capita a circa {{n:dd.p.small.100k}} dei giocatori che vincono {{n:var.wr.ex}} (SD {{n:var.sd}})"
  level: heuristic
  source: "calcolo: simulazione Monte Carlo (numbers.yaml, chiavi dd.*); un sito di calcolatori per il poker, Examples and Impacts of Variance in Cash Games, indica per questo scenario un numero più basso (rapporto M12)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-003
  module: m12
  if: "vuoi sapere quanto vinci davvero"
  then: "raccogli centinaia di migliaia di mani: una precisione di ± {{n:var.target}} con {{n:var.conf95}} di confidenza richiede circa {{n:var.need.hands.k}} mila mani"
  because: "l'errore della stima diminuisce con la radice quadrata del numero di mani: blocchi da 100 mani necessari = ({{n:var.z95}} × SD ÷ precisione)²"
  level: math
  source: "calcolo: (1,96 × 80 ÷ 2)² blocchi; coerente con l'ordine di grandezza del documento 08 (circa 615 mila mani)"
  sources: [{ kind: math }]
- id: R-M12-004
  module: m12
  if: "valuti la tua giocata dopo la mano"
  then: "ti chiedi com'era la decisione (prezzo, equity, informazioni che avevi), non se hai vinto"
  because: "una buona decisione perde regolarmente: un all-in con AA contro KK perde in circa {{n:res.kk-wins}} dei casi, e le persone giudicano comunque le decisioni in base al risultato, anche quando sanno che non dovrebbero"
  level: heuristic
  source: "Baron e Hershey (1988), Outcome bias in decision evaluation, J Pers Soc Psychol 54(4); Annie Duke sul «resulting» (Masters in Business, Ritholtz 2018); equity AA–KK: calcolo esatto (documento 08)"
  sources: [{ kind: math }, { kind: book }, { kind: study }]
- id: R-M12-005
  module: m12
  if: "il risultato di qualche {{t:session|sessione}} ti spinge a cambiare strategia"
  then: "la cambi solo dopo aver rivisto le mani, non in base al solo risultato"
  because: "anche il miglior {{n:skill.pct}} dei giocatori supera il peggior {{n:skill.pct}} in circa {{n:skill.ahead}} dei casi solo dopo circa {{n:skill.hands}} mani, e differenze di abilità minori richiedono molte più mani"
  level: heuristic
  source: "van Loon, van den Assem e van Dolder (2015), Beyond Chance? The Persistence of Performance in Online Poker, PLoS ONE 10(3)"
  sources: [{ kind: study }]
- id: R-M12-006
  module: m12
  if: "noti i primi segnali di tilt del tuo profilo (ad es. rabbia dopo un bad beat, voglia di punire l'avversario)"
  then: "reagisci subito: un respiro e una frase preparata che ti ricorda perché questa è {{t:variance|varianza}} o un errore da cui imparare"
  because: "quando il tilt cresce smetti di pensare con lucidità, e a quel punto non è più possibile controllarlo"
  level: heuristic
  source: "Tendler, intervista su un sito di informazione (2014) («When tilt becomes too intense, it shuts down your ability to think», «you must begin correcting tilt when it's small»); Tendler e Carter, The Mental Game of Poker (2011), tecnica «injecting logic»"
  sources: [{ kind: book }]
- id: R-M12-007
  module: m12
  if: "dopo una serie di perdite non riesci più a valutare con calma le decisioni (ad es. pensi solo a rifarti o giochi mani che di solito {{t:fold|foldi}})"
  then: "chiudi la {{t:session|sessione}}"
  because: "continuare a giocare in questo stato significa giocare al tuo livello peggiore (C-game), e l'obiettivo è smettere prima, prima di perdere la capacità di pensare con lucidità"
  level: heuristic
  source: "Tendler e Carter, The Mental Game of Poker (2011), estratto «Inchworm» (estratto pubblicato online): «quit sooner when it's no longer possible to recover a solid thought process»"
  sources: [{ kind: book }]
- id: R-M12-008
  module: m12
  if: "lavori sul tuo gioco"
  then: "parti dal migliorare le giocate peggiori (C-game), non dal perfezionare le migliori"
  because: "migliorare il gioco peggiore dà un progresso costante e libera attenzione per imparare cose nuove"
  level: heuristic
  source: "Tendler e Carter, The Mental Game of Poker (2011), estratto «Inchworm» (estratto pubblicato online); Tendler, The Inchworm Concept (jaredtendler.com)"
  sources: [{ kind: book }]
- id: R-M12-009
  module: m12
  if: "calcoli il {{t:risk-of-ruin|rischio di rovina}}, cioè di perdere l'intero bankroll"
  then: "usi la formula RoR = e^(−2 × winrate × bankroll ÷ SD²), con il bankroll in bb; è un'approssimazione con winrate e SD costanti"
  because: "con {{n:var.wr.typical.high}} e SD {{n:var.sd}} un bankroll di {{n:br.bi.base}} {{t:buy-in|buy-in}} dà circa {{n:ror.base}} di rischio, e {{n:br.bi.move-down}} {{t:buy-in|buy-in}} già circa {{n:ror.half}}"
  level: math
  source: "sito di calcolatori per il poker, Risk of Ruin Formula for Poker Players («RoR = e^(-2 x WR x BR / SD^2)»); valori: calcolo (numbers.yaml, chiavi ror.*)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-011
  module: m12
  if: "il bankroll scende a metà del numero di {{t:buy-in|buy-in}} previsto (da {{n:br.bi.base}} a {{n:br.bi.move-down}})"
  then: "scendi di un {{t:stakes|limite}} al più tardi a quel punto e risali solo quando hai un bankroll completo in {{t:buy-in|buy-in}} del {{t:stakes|limite}} superiore, non prima"
  because: "i {{t:downswing|downswing}} di {{n:dd.bi.small}} {{t:buy-in|buy-in}} nell'arco di {{n:var.hands.k}} mila mani capitano a quasi ogni giocatore che vince da {{n:dd.wr-low}} a {{n:var.wr.ex}} (simulazione con SD {{n:var.sd}}), alcune fonti consigliano di scendere già dopo una perdita del genere, e con {{n:br.bi.move-down}} {{t:buy-in|buy-in}} il rischio di perdere il resto sale da circa {{n:ror.base}} a circa {{n:ror.half}} (con winrate {{n:var.wr.typical.high}} e SD {{n:var.sd}})"
  level: heuristic
  source: "sito di formazione, Bankroll Management («half the roll, which is the point to move down a stake»); sito di formazione, Poker Bankroll Management Strategy (con 3bb/100 discesa a 30 buy-in, cioè con il bankroll completo); sito di calcolatori per il poker, Risk of Ruin Formula for Poker Players («Losing 10 should trigger a move down»); calcolo del rischio di rovina e simulazione dei downswing"
  sources: [{ kind: training }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M12-012
  module: m12
  if: "pianifichi il tempo per il poker"
  then: "all'inizio dedichi allo studio circa {{n:study.beginner}} del tempo; quando vinci al tuo {{t:stakes|limite}}, circa {{n:study.winner}}, ma mai meno di {{n:study.min}}"
  because: "all'inizio hai più da recuperare, e quando vinci già al tuo {{t:stakes|limite}} puoi giocare di più"
  level: heuristic
  source: "sito di formazione, What should your study-to-play ratio be (articolo di Dara O'Kearney): «New players have so much catching up to do»; «Once you are beating the games you are in you can start to reduce the study and increase the grinding»"
  sources: [{ kind: training }]

# M11: turnieje i short stacki (moduł opcjonalny). Zakresy push/fold z własnego solvera (pushfold.json, heads-up mały
# blind kontra duży blind, zwalidowany z równowagą Nasha, dokument 10); progi i pojęcia z przeczytanych źródeł (raport M11).
- id: R-M11-001
  module: m11
  if: "in un {{t:tournament|torneo}} hai circa {{n:m11.thr.pushfold}} o meno, e tutti prima di te hanno {{t:fold|foldato}}"
  then: "giochi all-in o {{t:fold|fold}} (push/fold); tra {{n:m11.thr.pushfold}} e {{n:m11.thr.upper}} il push/fold è il metodo principale per le mani più deboli e medie, e sopra circa {{n:m11.thr.raise}} di solito fai un normale rilancio"
  because: "con uno {{t:short-stack|short stack}} rilanciare e poi {{t:fold|foldare}} a un {{t:raise|rilancio}} regala troppe {{t:chips|fiches}}, mentre l'all-in spreme dall'avversario il massimo dei {{t:fold|fold}}; è una semplificazione: i solver con più azioni a disposizione limpano o fanno min-raise con una parte delle mani"
  level: heuristic
  source: "sito di formazione, Short Stack Strategy (https://pokercoaching.com/blog/short-stack-strategy-2/): «At 10 big blinds or fewer, it is almost entirely push/fold», «This approach simplifies decision-making and maximizes fold equity», «At 15 big blinds, the landscape shifts significantly. Push/fold becomes your dominant framework for weak and medium holdings»; sito di formazione, Push/Fold Tournament Strategy (https://upswingpoker.com/push-fold-tournament-strategy-charts/): «around 15 big blinds (bb) or fewer», «larger than 20bb … Raising First In»; sito di un solver commerciale, Short-Stacked Play in MTTs (https://blog.gtowizard.com/short-stacked-play-in-mtts/): «The standard advice for a 10bb stack is to play an all-in or fold strategy»; semplificazione: sito di formazione (la stessa pagina): «the all-in or fold binary was grossly suboptimal»; scuola che pubblica risultati di solver, heads-up 10bb (https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments): «61.1% limp, 28.8% all-in, 10.1% fold»"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/short-stack-strategy-2/" }, { kind: training, url: "https://upswingpoker.com/push-fold-tournament-strategy-charts/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/short-stacked-play-in-mtts/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments" }]
- id: R-M11-002
  module: m11
  if: "giochi push/fold dallo {{t:small-blind|small blind}} contro il {{t:big-blind|big blind}}"
  then: "più corto è lo stack, più mani {{t:shove|pushi}} all-in: a {{n:m11.depth.15}} circa {{n:m11.push.15}} delle mani, a {{n:m11.depth.10}} circa {{n:m11.push.10}}, a {{n:m11.depth.5}} circa {{n:m11.nash.push.5}}–{{n:m11.push.5}}"
  because: "con uno stack più corto rischi meno rispetto ai blind che incassi quando l'avversario {{t:fold|folda}}, e l'avversario deve {{t:call|chiamare}} più largo"
  level: gto
  source: "solver push/fold del progetto (content/ranges/pushfold.json; heads-up, senza ante, equilibrio di Nash del gioco all-in o fold, validazione a 10bb nel documento 10; a 5bb intervallo da un equilibrio calcolato in modo indipendente, docs/tresci/e1b-solver.md, D-153); confronto: sito di formazione, Push/Fold Play: Nash Ranges (https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/), 10bb: «56.6%» di push"
  sources: [{ kind: training, url: "https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/" }, { kind: solver-app }]
- id: R-M11-003
  module: m11
  if: "nel {{t:pot|piatto}} c'è l'ante"
  then: "{{t:shove|pushi}} all-in con più mani che senza ante: a {{n:m11.depth.10}} con {{t:bb-ante|big blind ante}} di {{n:m11.ante}} circa {{n:m11.nash.push.10-ante}}–{{n:m11.push.10-ante}} invece di {{n:m11.push.10}}"
  because: "l'ante ingrandisce il {{t:pot|piatto}} che incassi quando l'avversario {{t:fold|folda}}, mentre il rischio dell'all-in resta lo stesso"
  level: gto
  source: "solver push/fold del progetto (pushfold.json, variante 10bb-ante: heads-up, big blind ante 1bb); validazione: docs/tresci/e1b-solver.md (D-153), calcolo nello stesso modello (equilibrio fictitious play 71,05%, limite inferiore dell'intervallo in then); direzione coerente con la letteratura: sito di formazione, Push Fold Charts (https://pokercoaching.com/push-fold-charts/): «When antes are in play, your preflop shoving range should be wider»"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: solver-app }]
- id: R-M11-004
  module: m11
  if: "vai all-in per primo"
  then: "vinci in due modi: l'avversario {{t:fold|folda}} e incassi il {{t:pot|piatto}}, oppure {{t:call|chiama}} e vinci allo showdown; una mano senza possibilità avrebbe però bisogno di {{t:fold|fold}} con frequenza superiore a {{n:m11.push.10.alpha}} (a {{n:m11.depth.10}} senza ante)"
  because: "rischi {{n:m11.push.10.risk}} per vincere {{n:m11.push.10.win}} di blind; per questo contano sia la fold equity sia l'equity della mano quando l'avversario {{t:call|chiama}}"
  level: math
  source: "calcolo: alpha = rischio ÷ (piatto + rischio) (M6); fold equity: glossario di un sito di un solver commerciale (https://gtowizard.com/en/glossary/): «Fold equity The amount of value a player will win by making another player fold.»"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M11-005
  module: m11
  if: "M (stack ÷ costo di un giro: blind e ante) scende a circa {{n:m11.m.red}} o meno"
  then: "giochi ormai solo all-in o {{t:fold|fold}} e cerchi di entrare nel {{t:pot|piatto}} per primo"
  because: "senza giocare, lo stack basta per pochi giri, e un normale rilancio regala troppe {{t:chips|fiches}}"
  level: heuristic
  source: "Harrington (tramite sintesi): Wikipedia, M-ratio (https://en.wikipedia.org/wiki/M-ratio): «The M-ratio is calculated by the formula» (formula come frazione: stack ÷ (small blind + big blind + ante totali)), nella tabella delle zone «Your only move is to move all-in or fold»; sito di formazione, Dan Harrington M-Factor (https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/): «Red zone: 1 < = M < = 5», «your only and best option in this phase is to be the first to push in the pot»; un unico confine a circa 5 (D-147)"
  sources: [{ kind: reference, url: "https://en.wikipedia.org/wiki/M-ratio" }, { kind: training, url: "https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/" }]
- id: R-M11-006
  module: m11
  if: "dal {{t:big-blind|big blind}} {{t:call|chiami}} l'all-in dello {{t:small-blind|small blind}} con uno stack S (senza ante)"
  then: "ti serve un'equity di (S − {{n:pf.blind.bb}}) ÷ 2S: a {{n:m11.depth.10}} {{n:m11.call.10.eq}}, a {{n:m11.depth.5}} {{n:m11.call.5.eq}}, a {{n:m11.depth.15}} {{n:m11.call.15.eq}}"
  because: "il blind è già nel {{t:pot|piatto}}, quindi aggiungi S − {{n:pf.blind.bb}}, e il {{t:pot|piatto}} dopo la {{t:call|chiamata}} è 2S"
  level: math
  source: "calcolo: equity necessaria = chiamata ÷ piatto dopo la chiamata (M2)"
  sources: [{ kind: math }]
- id: R-M11-007
  module: m11
  if: "l'avversario è andato all-in e tu decidi se {{t:call|chiamare}}"
  then: "{{t:call|chiami}} con un {{t:range|range}} più stretto di quello con cui {{t:shove|pusheresti}} tu all-in: a {{n:m11.depth.10}} il {{t:big-blind|BB}} {{t:call|chiama}} circa {{n:m11.call.10}} delle mani, mentre lo {{t:small-blind|SB}} {{t:shove|pusha}} circa {{n:m11.push.10}}"
  because: "chi chiama vince solo allo showdown, e contro un {{t:range|range}} già più forte di uno casuale; chi {{t:shove|pusha}} vince anche quando l'avversario {{t:fold|folda}}"
  level: gto
  source: "solver push/fold del progetto (pushfold.json); sito di formazione, Push Fold Charts (https://pokercoaching.com/push-fold-charts/): «Calling ranges are tighter than shoving ranges»; sito di formazione, The Gap Concept (https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/): «you need a better hand to call a raise with than you would need to open a pot with a raise» (Sklansky)"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: training, url: "https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/" }, { kind: solver-app }]
- id: R-M11-008
  module: m11
  if: "vuoi convertire gli stack del torneo in denaro ({{t:icm|ICM}})"
  then: "probabilità del 1° posto = il tuo stack ÷ tutte le {{t:chips|fiches}}; la probabilità del 2° posto la calcoli allo stesso modo tra i giocatori rimasti, per ogni possibile vincitore; equity = somma delle probabilità × {{t:payout|premi}}"
  because: "questo modello presuppone giocatori di pari abilità, quindi l'ordine dipende solo dagli stack"
  level: math
  source: "sito di un solver commerciale, ICM Basics (https://blog.gtowizard.com/icm-basics/): «The Independent Chip Model assumes all players are equally skilled, and therefore the probability of winning is purely a function of stack sizes», sezione Limitations of ICM: «ICM doesn’t consider players’ positions.», «ICM ignores blinds increasing.» (lettura del 2026-11-09), «divide their chips by the total amount of chips in play», «Assume one of the other players wins, remove their chips from play, and divide our chips by the remaining chips in play»; calcolo su un esempio di stack (rapporto E1 M9–M11)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: math }]
- id: R-M11-009
  module: m11
  if: "in un {{t:tournament|torneo}} con {{t:icm|ICM}} {{t:call|chiami}} un all-in che può eliminarti"
  then: "ti serve un'equity di BF ÷ (BF + 1), dove il bubble factor BF = equity persa in caso di sconfitta ÷ guadagno in caso di vittoria; nell'esempio della lezione {{n:m11.bf.req}} invece di {{n:m11.bf.req-chips}} in {{t:chips|fiches}}"
  because: "in un {{t:tournament|torneo}} con {{t:payout|premi}} la sconfitta costa più denaro di quanto ne aggiunga la vittoria, quindi la {{t:call|chiamata}} deve vincere più spesso che giocando per le {{t:chips|fiches}}"
  level: math
  source: "calcolo ICM (numbers.yaml, chiavi m11.bf.*); sito di un solver commerciale, What Is the Bubble Factor (https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/): «$EV lost when you lose / $EV gained when you win = Bubble Factor», «Required Equity = Bubble Factor / (Bubble Factor + 1)»"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/" }, { kind: math }]
- id: R-M11-010
  module: m11
  if: "c'è la {{t:bubble|bolla}} o il {{t:final-table|tavolo finale}}, e tu hai uno stack medio"
  then: "{{t:call|chiami}} gli all-in in modo nettamente più stretto che giocando per le {{t:chips|fiches}}, e uno stack grande che ti {{t:cover|copre}} può {{t:shove|pushare}} più largo"
  because: "{{t:risk-premium|risk premium}}: le {{t:chips|fiches}} vinte valgono meno di quelle perse, e lo stack grande rischia in questo meno di te"
  level: heuristic
  source: "sito di un solver commerciale, ICM Basics (https://blog.gtowizard.com/icm-basics/): «chips won are worth less than chips lost» (testo senza marcatori di colore), «Big stacks can threaten smaller stacks as they take on less risk when stacking off»; sito di formazione, ICM at Final Tables (https://upswingpoker.com/icm-final-tables/): «When it comes to calling versus shoves, you have to tighten up dramatically when big money is on the line»; sito di formazione, Big Stack Advantage (https://upswingpoker.com/big-stack-advantage-stone-bubble/): «Risk premiums are the additional equity needed to play for stacks. This means responding ranges tighten up considerably»; Ganzfried e Sandholm, AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf), tabella 2: il big blind dopo due all-in chiama nel torneo «0.021», e in una singola mano «0.197»"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: training, url: "https://upswingpoker.com/icm-final-tables/" }, { kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }]
- id: R-M11-011
  module: m11
  if: "giochi push/fold e dietro di te restano più giocatori che possono {{t:call|chiamare}}"
  then: "{{t:shove|pushi}} all-in più stretto: con tre giocatori e {{n:m11.depth.3max}} il Button circa {{n:m11.3max.push.btn}} delle mani, e lo {{t:small-blind|small blind}} dopo il fold del Button circa {{n:m11.3max.push.sb}}"
  because: "ogni giocatore in più è una possibilità in più che qualcuno si svegli con una mano forte, quindi che tutti {{t:fold|foldino}} succede più raramente"
  level: gto
  source: "solver push/fold del progetto (content/ranges/pushfold.json, tre giocatori); coerente con Ganzfried e Sandholm, AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf), tabella 2, single hand: «Button jam … 0.355», «SB jam after fold … 0.633» (frequenze dei nodi coerenti entro 1,2 pp, rapporto M11)"
  sources: [{ kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }, { kind: solver-app }]
- id: R-M11-012
  module: m11
  if: "{{t:call|chiami}} un all-in e dietro di te c'è ancora un giocatore oppure qualcuno ha già {{t:call|chiamato}}"
  then: "{{t:call|chiami}} più stretto: con tre giocatori e {{n:m11.depth.3max}} lo {{t:small-blind|small blind}} {{t:call|chiama}} l'all-in del Button con circa {{n:m11.3max.call.sb}} delle mani, il {{t:big-blind|big blind}} (quando lo {{t:small-blind|SB}} ha {{t:fold|foldato}}) con circa {{n:m11.3max.call.bb}}, e quando sono già all-in due giocatori, solo con circa {{n:m11.3max.call.bb-two}}, anche se il prezzo scende a {{n:m11.3max.bb-two.eq}}"
  because: "il giocatore dietro di te può avere una mano forte e unirsi, e contro due {{t:range|range}} l'equity della tua mano cala rapidamente; i prezzi di {{t:small-blind|SB}} e {{t:big-blind|BB}} differiscono poco, quindi la differenza deriva soprattutto dal giocatore dietro di te"
  level: gto
  source: "solver push/fold del progetto (pushfold.json, tre giocatori); coerente con Ganzfried e Sandholm, AAMAS 2008, tabella 2, single hand: «SB jam after jam … 0.234», «BB jam after jam/fold … 0.308», «BB jam after jam/jam … 0.197»"
  sources: [{ kind: solver-app }, { kind: study }]

- id: R-M11-013
  module: m11
  if: "tutti i giocatori nel {{t:pot|piatto}} sono all-in prima del flop"
  then: "non ci sono più {{t:bet|puntate}}: la mano si decide dopo le {{t:community-cards}}, e se nessuno ha {{t:pair|coppia}} o meglio, vince la carta più alta"
  because: "senza altre {{t:bet|puntate}} nessuno può più {{t:fold|foldare}}, quindi conta solo la classifica delle mani; con sole carte alte decide la più alta"
  level: rules
  source: "regole del Texas Hold'em: regolamento approvato dal regolatore californiano (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf), High Card"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }]
# M13: analiza własnej gry (dokument 14, sekcja 8; decyzje D-M13-12…15 w dokumencie „12 Weryfikacja źródeł — M10–M13”).
# „Decyzja, nie wynik” uczy R-M12-004 (jedna reguła na jedno pojęcie); mechanika powtórek z gry to opis aplikacji,
# więc jest w tekście lekcji, a nie w księdze reguł.
- id: R-M13-001
  module: m13
  if: "hai perso un all-in pur avendo più {{t:equity|equity}} dell'avversario"
  then: "non cambi strategia per questa mano: con {{t:equity|equity}} e perdi in media 1 − e di queste mani, ad es. con {{n:m13.eq.example}} circa {{n:m13.lose.example}}, cioè {{n:m13.lose.of-ten}} su {{n:m13.ten}}"
  because: "l'{{t:equity|equity}} è la quota di vittorie su molte ripetizioni della stessa situazione; la sconfitta rientra in questo calcolo"
  level: math
  source: "calcolo: P(sconfitta) = 1 − equity (con piatto diviso, corrispondentemente meno)"
  sources: [{ kind: math }]
- id: R-M13-002
  module: m13
  if: "il solver gioca la tua mano in un certo spot in due modi ({{t:mixed-hand|mano mista}})"
  then: "ciascuna di queste giocate è corretta; il report segna la più rara come accettabile quando il solver la gioca con una frequenza di almeno {{n:range.mixed.min}}, ma inferiore a {{n:range.mixed.low}}"
  because: "in equilibrio un giocatore mescola solo giocate con lo stesso {{t:expected-value|valore atteso}}"
  level: gto
  source: "sito di un solver commerciale, Principles of GTO (https://blog.gtowizard.com/principles-of-gto/): «Unexploitable play mixes between two or more options only when these options have the same EV.»; soglia della mossa rara: sito di un solver commerciale, Measure Performance (https://help.gtowizard.com/measure-performance/): «Inaccuracy – Moves that are taken less than 3.5% of the time in GTO, but don’t lose significant EV.» (ADR-26)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/principles-of-gto/" }]
- id: R-M13-003
  module: m13
  if: "scambi i semi di tutte le carte con un'unica permutazione (ad es. cuori in picche, picche in cuori)"
  then: "la decisione corretta non cambia"
  because: "la forza delle mani e dei {{t:draw|progetti}} dipende dal fatto che i semi coincidano, non da quali semi siano; per questo il ripasso dal gioco mostra la stessa situazione con semi diversi"
  level: math
  source: "calcolo: la classifica delle combinazioni non distingue i semi (regole del Texas Hold'em), e una permutazione dei semi conserva quali carte hanno lo stesso seme; verificato in poker-core con un test di proprietà (documento 02, documento 14, 5.6)"
  sources: [{ kind: math }]
- id: R-M13-004
  module: m13
  if: "dopo una sola {{t:session|sessione}} vuoi valutare le tue frequenze (ad es. quanto spesso entri in gioco o {{t:fold|foldi}} al 3-bet)"
  then: "non trai conclusioni: conti le occasioni, non le mani; guardi una statistica a partire da circa {{n:hud.opps.look}} occasioni, e acquisti sicurezza a circa {{n:hud.opps.sure}}"
  because: "persino il {{t:vpip|VPIP}} si legge dopo circa {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}} mani (come in M10), e una situazione rara capita poche volte in una {{t:session|sessione}}"
  level: heuristic
  source: "allenatore con un blog di formazione, Poker HUD Stats: The Sample Size You Need (https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html): «For me personally I usually want at least 5 to even bother looking, and 10 to be sure.»; campioni di mani come in R-M10-003 (sito di formazione, sito di formazione)"
  sources: [{ kind: training, url: "https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html" }, { kind: training }, { kind: training }]
- id: R-M13-005
  module: m13
  if: "durante il gioco non sai cosa fare, o una mano ti è sembrata strana"
  then: "la segni soltanto, e la analizzi dopo la {{t:session|sessione}}, a distanza di qualche ora o di qualche giorno, a mente lucida"
  because: "un'analisi subito dopo una grossa perdita o da stanco è condizionata dalle emozioni"
  level: heuristic
  source: "blog di un'app di analisi delle mani, How to Review Your Poker Hands (https://blog.checkreplay.com/poker-hand-review/): «Mark hands that felt interesting, confusing, or off. Don’t analyze them yet.»; «The best time to review is hours or days after the session, with a clear head.»; «What doesn’t work is reviewing while you’re still steaming or while you’re tired.»"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }]
- id: R-M13-006
  module: m13
  if: "hai perso un {{t:pot|piatto}} grande o in una mano non sapevi cosa fare"
  then: "rivedi quella mano; sul cooler (due mani forti, nessuna delle quali poteva ragionevolmente {{t:fold|foldare}}) e sul bad beat non passi molto tempo"
  because: "cooler e bad beat capitano a tutti, mentre le mani con una decisione difficile sono tra quelle che vale la pena rivedere"
  level: heuristic
  source: "blog di un'app di analisi delle mani, How to Review Your Poker Hands (https://blog.checkreplay.com/poker-hand-review/): «Big pots, especially the ones you lost.»; «Hands where you weren’t sure what to do.»; allenatore con un blog di formazione, How to Effectively Conduct Poker Hand Reviews (https://www.blackrain79.com/2014/02/how-to-effectively-conduct-poker.html): «Coolers and bad beats happen to everybody. Learn how to differentiate them from the hands that matter and don't spend much time on them»"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }, { kind: training, url: "https://www.blackrain79.com/2014/02/how-to-effectively-conduct-poker.html" }]
- id: R-M13-007
  module: m13
  if: "rivedi una decisione difficile"
  then: "prima annoti la tua prima reazione (ad es. «è una {{t:call|chiamata}} facile»), e solo dopo fai i conti"
  because: "la differenza tra la prima reazione e il calcolo mostra dove l'intuito ti inganna, e col tempo lo migliora"
  level: heuristic
  source: "sito di formazione, 6 Steps to Analyze a Poker Hand (https://upswingpoker.com/analyze-poker-hand-techniques/): «Step 4: Take note of your gut reaction»; «be sure to take notes regarding the differences between your initial presumption––which is typically optimistic, in my experience––and the realistic result. This will help you improve your intuitive strategy over time.»"
  sources: [{ kind: training, url: "https://upswingpoker.com/analyze-poker-hand-techniques/" }]
- id: R-M13-008
  module: m13
  if: "non sai come gioca l'avversario e rivedi una decisione contro la sua {{t:bet|puntata}}"
  then: "la valuti con un'ipotesi ottimistica, una pessimistica e una realistica sul suo {{t:range|range}}; se la decisione è buona anche con quella pessimistica, non devi calcolare oltre"
  because: "le ipotesi estreme delimitano l'intervallo in cui si trova la realtà, quindi una decisione buona con entrambe resiste a un errore di lettura"
  level: heuristic
  source: "sito di formazione, 6 Steps to Analyze a Poker Hand (https://upswingpoker.com/analyze-poker-hand-techniques/): «The Optimist The Pessimist The Realist»; «I pick the extremes first, because they shape the polar ends of the spectrum.»; «When the Pessimist gets such a favorable result, I don’t bother analyzing the hand through the Realist’s eyes, because it will also be favorable.»"
  sources: [{ kind: training, url: "https://upswingpoker.com/analyze-poker-hand-techniques/" }]
