royal-flush: "La combinazione più alta del poker: asso, re, donna, fante e dieci dello stesso seme, ad es. A♠ K♠ Q♠ J♠ T♠."
straight-flush: "Cinque carte consecutive dello stesso seme, ad es. 5♥ 6♥ 7♥ 8♥ 9♥. La versione più alta (dall'asso al dieci) ha un nome a parte ed è la combinazione più forte del gioco."
four-of-a-kind: "Quattro carte dello stesso valore, ad es. quattro sette. Se due giocatori hanno un poker dello stesso valore, vince la quinta carta più alta (il kicker)."
full-house: "Un tris e una coppia nella stessa combinazione, ad es. tre donne e due cinque. Tra due full vince quello con il tris più alto."
flush: "Cinque carte dello stesso seme (♠, ♥, ♦ o ♣) che non sono in sequenza. Tra due colori vince quello con la carta più alta; a parità, decide la carta successiva."
straight: "Cinque carte consecutive, non tutte dello stesso seme, ad es. 5-6-7-8-9. L'asso può essere la carta più alta (A-K-Q-J-T) o la più bassa (A-2-3-4-5)."
three-of-a-kind: "Tre carte dello stesso valore e due carte diverse. Nell'hold'em ha due varianti con un nome proprio: il set, quando la coppia è in mano e la terza carta è sul board, e i trips, quando la coppia è sul board e la terza carta è in mano."
set: "Tris formato da una coppia in mano e da una carta sul board, ad es. 7♣ 7♦ su un flop K-7-2."
two-pair: "Due coppie diverse e una quinta carta, ad es. K-K-8-8-3. In caso di parità decide prima la coppia più alta, poi quella più bassa e infine la quinta carta."
pair: "Due carte dello stesso valore e tre carte diverse, ad es. due nove. È più debole solo la carta alta."
high-card: "Combinazione senza coppia né niente di meglio; la forza dipende dalla carta più alta e, a parità, dalle successive."
kicker: "La carta più alta fuori dalla combinazione, che decide in caso di parità. Esempio: una coppia d'assi con il re batte una coppia d'assi con la donna."
wheel: "La scala più bassa: A-2-3-4-5, in cui l'asso conta come carta più bassa."
check: "Continuare senza mettere fiches, possibile solo quando non devi aggiungere nulla: in questo giro di puntate nessuno ha ancora puntato (prima del flop può farlo il big blind, se nessuno ha rilanciato). Da non confondere con il call, cioè aggiungere fiches per pareggiare la puntata dell'avversario."
bet: "Le prime fiches messe in un giro di puntate in cui nessuno ha ancora puntato (in senso più ampio si chiama puntata qualsiasi quantità di fiches messa nel piatto)."
call: "Mettere nel piatto l'importo della puntata o del rilancio dell'avversario per continuare a giocare. Da non confondere con il check, cioè continuare senza puntare quando nessuno ha puntato."
raise: "Alzare l'importo oltre la puntata dell'avversario; gli altri devono aggiungere la differenza, rilanciare ancora o fare fold."
fold: "Rinunciare alla mano: butti le carte e perdi ciò che hai già messo nel piatto."
check-raise: "Prima fai check e, quando l'avversario punta, lo rilanci nello stesso giro di puntate."
all-in: "Puntare tutte le tue fiches. Da ogni avversario puoi vincere al massimo quanto hai messo tu; per il resto si gioca nel piatto secondario."
pot: "Tutte le fiches puntate nella mano in corso. Le prende il giocatore con la combinazione migliore allo showdown (con piatti secondari, ogni piatto si assegna separatamente) oppure il giocatore rimasto quando tutti gli altri hanno fatto fold."
side-pot: "Un piatto separato che si crea quando qualcuno è all-in: se lo giocano solo i giocatori che hanno messo più del giocatore all-in, quindi lui non può vincerlo."
split-pot: "Situazione in cui i giocatori con combinazioni uguali si dividono il piatto, ad es. quando entrambi giocano la stessa scala presente sul board."
playing-the-board: "Situazione in cui la tua migliore combinazione di cinque carte è fatta solo di carte comuni; le tue carte personali non aggiungono nulla, quindi nel migliore dei casi dividi il piatto."
board: "Le carte comuni scoperte al centro (flop, turn, river) che usano tutti i giocatori. Indica le carte, non il tavolo da gioco."
community-cards: "Carte scoperte al centro che ogni giocatore può usare per la propria combinazione; nell'hold'em sono cinque."
hole-cards: "Le due carte coperte che ricevi all'inizio della mano nell'hold'em; le vedi solo tu."
small-blind: "La puntata obbligatoria più piccola, versata prima della distribuzione dal giocatore alla sinistra del Button (in due giocatori, dal Button stesso); si chiama così anche quel posto al tavolo."
big-blind: "La puntata obbligatoria più grande, versata prima della distribuzione dal secondo giocatore alla sinistra del Button (in due giocatori, dal giocatore di fronte al Button); si chiama così anche quel posto. Serve anche come unità di misura per stack e risultati."
chips: "I gettoni con cui si gioca al tavolo; nel cash game rappresentano denaro, nei tornei punti di torneo."
stack: "Tutte le fiches che un giocatore ha davanti a sé; di solito si indicano in big blind (ad es. 100 big blind)."
street: "Nome gergale del giro di puntate: preflop, flop, turn e river sono le quattro street. Esempio: «value su tre street» significa puntate per valore al flop, al turn e al river."
betting-round: "Fase della mano in cui i giocatori, a turno, fanno check, puntano, fanno call, rilanciano o fanno fold; nell'hold'em sono quattro: preflop, flop, turn e river."
preflop: "Il primo giro di puntate: dopo la distribuzione delle carte personali, prima che arrivi il flop."
flop: "Le prime tre carte comuni, scoperte insieme dopo le puntate preflop; si chiama così anche il secondo giro di puntate."
turn: "La quarta carta comune e il terzo giro di puntate."
river: "La quinta e ultima carta comune e l'ultimo giro di puntate prima dello showdown."
showdown: "La scoperta delle carte dopo l'ultimo giro di puntate, quando nella mano restano almeno due giocatori; il piatto va alla combinazione migliore."
position: "Il tuo posto al tavolo rispetto al Button, che stabilisce l'ordine di azione. Chi agisce più tardi vede più azioni degli avversari prima di decidere."
in-position: "Situazione del giocatore che dopo il flop agisce per ultimo, quindi vede l'azione dell'avversario prima di decidere."
out-of-position: "Situazione del giocatore che dopo il flop agisce prima dell'avversario, quindi decide senza conoscerne l'azione."
early-position: "I primi posti ad agire prima del flop (ad es. UTG); dopo di te devono ancora agire molti giocatori."
late-position: "I posti che agiscono per ultimi: il Button e i posti subito prima, soprattutto il Cutoff."
utg: "Il primo giocatore ad agire prima del flop, seduto subito alla sinistra del big blind."
hijack: "Il posto subito prima del Cutoff, cioè il secondo alla destra del Button."
cutoff: "Il posto subito alla destra del Button, che agisce appena prima di lui."
button: "Il posto del mazziere, segnato da un dischetto «dealer». Dopo il flop agisce per ultimo in ogni giro di puntate."
outs: "Una carta ancora nel mazzo che migliora la tua mano, di solito completando un progetto. Esempio: con un progetto di colore, i tuoi out sono le carte rimanenti del tuo seme."
draw: "Una mano che non è ancora una combinazione forte ma può diventarlo con le prossime carte comuni, ad es. quando ti manca una carta per il colore o la scala."
flush-draw: "Quattro carte dello stesso seme (in mano e sul board insieme); te ne manca una per fare colore."
straight-draw: "Quattro carte a cui ne manca una per fare scala. Varianti: OESD (manca una carta a una delle due estremità) e gutshot (manca una carta in mezzo)."
oesd: "Abbreviazione di open-ended straight draw: progetto di scala di quattro carte consecutive, completato da una carta a entrambe le estremità, ad es. 5-6-7-8 aspetta un quattro o un nove."
gutshot: "Progetto di scala a cui manca un solo valore preciso in mezzo, ad es. 5-6-8-9 aspetta solo un sette."
backdoor: "Progetto al flop che ha bisogno di due carte utili di fila, al turn e al river, ad es. tre carte dello stesso seme dopo il flop."
pot-odds: "Il rapporto tra l'importo che devi mettere e il piatto che puoi vincere (compresa la puntata dell'avversario). Ti dice quanto spesso devi vincere perché il call sia conveniente."
implied-odds: "Pot odds aumentate delle fiches che ti aspetti di vincere nelle street successive se chiudi la tua combinazione."
equity: "La tua probabilità di vincere il piatto se tutte le carte rimanenti venissero scoperte senza altre puntate; di solito in percentuale."
equity-realization: "Quanto una mano trasforma la sua equity in vincita quando le puntate continuano (può realizzare meno o più della sua equity); dipende tra l'altro dalla posizione e da quanto è facile giocare la mano."
expected-value: "Il risultato medio di una giocata se la ripetessi molte volte. Una giocata in positivo in media guadagna nel lungo periodo, anche se questa volta perde."
combo: "Una specifica combinazione di due carte con i semi, ad es. A♠ K♥. Contare queste combinazioni mostra quante mani di un certo tipo ci sono davvero in un range."
range: "L'insieme di tutte le mani che un giocatore può avere in una data situazione, oppure delle mani con cui farebbe una data giocata."
mixed-hand: "Una mano con cui la strategia di equilibrio sceglie a volte una giocata, a volte un'altra (ad es. a volte rilancio, a volte call); entrambe le giocate sono corrette. Si dice anche che la mano si gioca con una strategia mista."
open: "Entrare nel piatto prima del flop con un rilancio quando tutti prima di te hanno fatto fold."
suited: "Due carte personali dello stesso seme, ad es. A♥ K♥ (si scrive AKs)."
offsuit: "Due carte personali di semi diversi, ad es. A♥ K♣ (si scrive AKo)."
pocket-pair: "Una coppia formata dalle due carte personali, ad es. 8♣ 8♦ prima del flop."
connectors: "Carte personali di valori adiacenti, ad es. 8-7 o 9-8; con esse è più facile fare scala."
3-bet: "Il primo rilancio di un open prima del flop; il nome conta il big blind come prima puntata e l'open come seconda."
4-bet: "Il rilancio di un 3-bet, cioè la quarta puntata del giro di puntate."
limp: "Entrare nel piatto prima del flop solo pareggiando il big blind, quando nessuno ha ancora rilanciato."
isolation: "Un rilancio dopo uno o più limp, per giocare contro il limper (spesso un giocatore più debole) uno contro uno."
texture: "Il carattere delle carte comuni: quanti semi ci sono, se le carte sono vicine tra loro, se c'è una coppia. Da questo dipende quali combinazioni e progetti sono possibili."
dry: "Un board su cui sono possibili pochi progetti e poche combinazioni forti, ad es. K♠ 7♦ 2♣."
wet: "Un board su cui sono possibili molti progetti e molte combinazioni forti, ad es. J♥ T♥ 8♣."
rainbow: "Un flop con tre carte di tre semi diversi, quindi al flop nessuno ha un progetto di colore."
two-tone: "Un flop con due carte dello stesso seme, quindi sono possibili progetti di colore."
monotone: "Un flop con tre carte dello stesso seme, quindi il colore può essere già fatto."
paired: "Un board su cui c'è una coppia (due carte dello stesso valore), ad es. 8-8-3."
connected: "Un board su cui qualcuno può aver già fatto scala, ad es. 9-8-7."
disconnected: "Un board con carte lontane tra loro, con cui è difficile fare una scala o un progetto di scala, ad es. K-7-2."
semi-connected: "Un board con progetti di scala, ma su cui la scala non è ancora possibile, ad es. T-8-3 (classificazione adottata nel corso)."
wetness: "Quanto un board favorisce progetti e combinazioni forti: da secco a bagnato. Si parla anche di quanto il board è coordinato."
top-pair: "Una coppia con la carta più alta del board, ad es. K♠ Q♦ su un flop K-7-2."
second-pair: "Una coppia con la seconda carta più alta del board, ad es. 7♠ 6♠ su un flop K-7-2."
overpair: "Una coppia servita più alta di ogni carta del board, ad es. Q-Q su un flop J-7-2."
c-bet: "Puntata di continuazione: la puntata del giocatore che era l'aggressore nel giro precedente, ad es. una puntata al flop dopo un open preflop."
aggressor: "Il giocatore che per ultimo ha puntato o rilanciato nel giro di puntate precedente."
initiative: "Il ruolo dell'ultimo aggressore: di solito è lui a fare la puntata successiva."
range-advantage: "Situazione in cui il range di un giocatore ha, su un dato board, un'equity complessiva maggiore del range dell'avversario."
nuts-advantage: "Situazione in cui un giocatore ha nel range, in proporzione, più mani fortissime dell'avversario."
nuts: "La mano più forte possibile su un dato board in un dato momento. Esempio: sul board K♥ 9♥ 4♥ 2♣ è il colore all'asso di cuori."
polarized: "Detto di un range: composto soprattutto da mani molto forti e da bluff, quasi senza mani medie."
polarization: "Costruire un range dagli estremi: mani forti per valore e bluff, senza mani medie."
linear: "Detto di un range: costruito dall'alto, dalle mani più forti in giù, senza un gruppo separato di bluff. Si incontra anche il termine affine «merged range» (range non polarizzato); secondo le analisi pubblicate con i solver, merged è una forma intermedia tra questo range e quello polarizzato."
condensed: "Detto di un range: senza le mani più forti (limitato dall'alto) e composto soprattutto da mani medie; il contrario di polarizzato."
value: "Puntare con una mano forte perché l'avversario faccia call con una mano più debole."
value-bet: "Una singola puntata per valore: fatta con una mano forte perché la chiamino mani più deboli."
bluff: "Una puntata con una mano debole che difficilmente vincerà allo showdown, per far fare fold all'avversario con una mano migliore."
semi-bluff: "Una puntata con una mano ancora debole ma che può migliorare (ad es. con un progetto): vinci se l'avversario fa fold oppure se chiudi il progetto."
blocker: "Una carta nella tua mano che riduce la probabilità che l'avversario abbia certe mani. Esempio: se hai l'asso di cuori, l'avversario non può avere il colore all'asso di cuori."
bluff-catcher: "Una mano che batte solo i bluff dell'avversario e perde contro le sue puntate per valore."
barrel: "Un'altra puntata nel giro di puntate successivo, dopo la tua puntata nel giro precedente."
second-barrel: "La seconda puntata di fila: dopo una c-bet al flop, il giocatore punta di nuovo al turn."
probe-bet: "Una puntata al turn del giocatore fuori posizione dopo che l'aggressore preflop ha fatto check al flop invece di fare una c-bet."
donk-bet: "Una puntata di un giocatore che punta prima che l'aggressore del giro precedente abbia potuto agire."
overbet: "Una puntata dopo il flop più grande dell'intero piatto."
effective-stack: "In una mano tra due giocatori: il più piccolo dei loro stack, cioè il massimo che si può realmente vincere o perdere. Con più giocatori si calcola separatamente per ogni coppia."
spr: "Lo stack effettivo diviso per il piatto all'inizio di una street (per pianificare la mano si calcola al flop); indica quanto sono profondi gli stack rispetto al piatto (più basso è l'SPR, più in fretta tutto finisce nel piatto)."
mdf: "La parte più piccola del range che devi difendere contro una puntata perché il bluff dell'avversario con una mano senza possibilità non sia automaticamente conveniente."
alpha: "Quanto spesso l'avversario deve fare fold perché un bluff con una mano senza possibilità vada in pareggio; dipende dalla dimensione della puntata rispetto al piatto."
variance: "La dispersione dei risultati attorno al valore atteso: anche giocando bene, brevi serie possono essere molto in negativo o in positivo."
buy-in: "L'importo per entrare in un torneo o per sedersi a un tavolo cash."
bankroll: "Tutta la riserva destinata esclusivamente al poker; in questa app si conta in buy-in, non in denaro."
tilt: "Uno stato in cui le emozioni (rabbia, frustrazione, euforia) peggiorano le tue decisioni al tavolo."
winrate: "Il risultato medio di un giocatore su un campione lungo; nel cash game di solito in bb/100, cioè big blind ogni cento mani."
downswing: "Un periodo di risultati nettamente peggiori, di solito perdite più grandi di quanto farebbe pensare l'abilità; il contrario dell'upswing."
session: "Una singola seduta di poker, da quando inizi a giocare a quando smetti."
stakes: "L'entità dei blind nel cash game o del buy-in nei tornei; i «microlimiti» sono i livelli più bassi."
standard-deviation: "Misura della dispersione dei risultati (la radice quadrata della varianza); nel poker di solito si indica in bb/100."
risk-of-ruin: "La probabilità di perdere prima o poi tutto il bankroll, se continui a giocare allo stesso limite."
mental-game: "Il lato psicologico del poker: gestire il tilt, le emozioni e la concentrazione al tavolo."
tournament: "Formato di gioco in cui i blind aumentano a intervalli e si gioca finché un giocatore non ha tutte le fiches; i premi vanno ai meglio classificati."
push-fold: "Strategia semplificata per short stack: prima del flop si va all-in oppure si fa fold."
shove: "Una giocata all-in, di solito come rilancio prima del flop."
icm: "Un modello che converte le fiches del torneo in valore monetario, tenendo conto della struttura dei premi e degli stack di tutti i giocatori."
bubble: "La fase del torneo subito prima dei posti a premio, quando mancano poche eliminazioni per arrivare ai premi."
bubble-factor: "Un indicatore dell'ICM: quanto in un torneo perdere un certo numero di fiches fa più male di quanto faccia bene vincerne lo stesso numero."
cover: "Avere almeno tante fiches quante l'avversario. Se un avversario ti copre, perdere un all-in contro di lui chiude il tuo torneo."
risk-premium: "Equity extra oltre quella richiesta dalle pot odds, necessaria in un torneo per rischiare un all-in, perché perdere costa più di quanto vincere faccia guadagnare."
m-ratio: "Lo stack diviso per la somma di blind e ante di una mano: per quanti giri completi (orbite) bastano le fiches senza giocare."
red-zone: "La zona di M molto basso: restano soprattutto l'all-in o il fold."
green-zone: "La zona di M alto: lo stack ti permette di giocare liberamente, in modo prudente o aggressivo."
ante: "Un piccolo versamento obbligatorio nel piatto prima della distribuzione, da parte di tutti i giocatori (soprattutto nei tornei)."
bb-ante: "Un formato di ante in cui, invece di tutti i giocatori, è il giocatore di big blind a versare l'ante per tutto il tavolo."
fold-equity: "La parte del valore di una giocata che deriva dalla possibilità che l'avversario faccia fold."
gap-concept: "Il principio secondo cui per fare call contro un open serve una mano più forte che per fare open."
chip-ev: "Il valore atteso di una giocata calcolato in fiches, senza convertirle in denaro (senza ICM)."
tournament-equity: "La tua quota attesa del montepremi, data la struttura dei premi e gli stack. Si chiama anche «$EV»."
prize-pool: "La somma di denaro da dividere tra i giocatori premiati di un torneo."
payout: "Il premio per un determinato piazzamento in un torneo; tutti insieme formano la distribuzione dei premi."
pay-jump: "La differenza di premio tra piazzamenti consecutivi in un torneo; salti grandi aumentano il risk premium."
final-table: "L'ultimo tavolo di un torneo, dove si giocano i premi più alti."
short-stack: "Uno stack piccolo rispetto ai blind; nei tornei di solito uno con pochi big blind rimasti."
nash-equilibrium: "Un insieme di strategie in cui nessun giocatore guadagna cambiando soltanto la propria strategia."
overcall: "Fare call a una puntata che qualcuno prima di te ha già chiamato."
heads-up: "Gioco uno contro uno: al tavolo o nella mano sono rimasti solo due giocatori."
dead-money: "Fiches nel piatto di giocatori che non possono più vincerlo, ad es. di quelli che hanno fatto fold."
stack-off: "Mettere nel piatto tutto lo stack in una sola mano, cioè andare all-in o fare call a un all-in."
exploit: "Un allontanamento consapevole dalla strategia di base per sfruttare un errore specifico di un avversario o dell'intera popolazione di giocatori."
hud: "Un overlay sul tavolo nel gioco online che mostra le statistiche degli avversari dalle mani giocate in precedenza."
vpip: "Statistica dell'HUD: in quale percentuale di mani un giocatore mette volontariamente denaro nel piatto prima del flop (call o rilancio)."
pfr: "Statistica dell'HUD: in quale percentuale di mani un giocatore rilancia prima del flop."
wtsd: "Statistica dell'HUD: quanto spesso un giocatore che ha visto il flop arriva allo showdown."
nit: "Un giocatore molto tight, che entra nel piatto quasi solo con mani forti."
regular: "Un frequentatore abituale di un dato limite che gioca un grande volume di mani; nel corso è contrapposto al giocatore ricreativo."
tag: "Stile tight-aggressivo: poche mani, ma giocate in modo aggressivo (puntate e rilanci)."
lag: "Stile loose-aggressivo: molte mani, giocate in modo aggressivo."
recreational: "Un giocatore che gioca per divertimento ed è di solito più debole dei regular; nel gergo, in modo dispregiativo, «fish»."
calling-station: "Termine dispregiativo per un giocatore che fa call molto spesso, anche con mani deboli o progetti."
maniac: "Termine dispregiativo per un giocatore molto loose e aggressivo, che punta e rilancia con qualsiasi cosa."
rake: "La commissione che un casinò o una poker room online preleva dal piatto per gestire il gioco."
rake-cap: "L'importo massimo di rake che la poker room può prelevare da una singola mano."
