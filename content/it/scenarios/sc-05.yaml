# SC-05 (M3): Button otwiera, BB broni, niski połączony flop (range-spot rfi.btn, potem cbet-case R-M5-004). Rola 06, sesja EH, 2026-11-11.
# Struktura jak pl (content/pl/scenarios/sc-05.yaml).
id: sc-05
module: m3
situation: "Sei sul Button e tutti prima di te hanno {{t:fold|foldato}}."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [rainbow], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
  sredni:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [two-tone], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.btn
    rule: R-M3-003
    actions:
      - action: "raise 2.5"
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, {{w:stol}}, e tutti prima di te hanno {{t:fold|foldato}}. {{t:open|Apri}}, perché restano solo i blind e dopo il flop avrai la {{t:position}}; dal Button {{t:open|apri}} largo, circa {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} delle mani."
      - action: fold
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, {{w:stol}}, e tutti prima di te hanno {{t:fold|foldato}}. Il {{t:fold}} è troppo prudente: il solver di solito {{t:open|apre}} questa mano. Restano solo i blind e dopo il flop avrai la {{t:position}}, quindi dal Button {{t:open|apri}} largo, circa {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} delle mani."
  - street: flop
    kind: cbet-case
    rule: R-M5-004
    actions:
      - action: check
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il {{t:big-blind}} fa {{t:check}}. Fai {{t:check}}, perché il {{t:big-blind}} difende molti {{t:connectors}} e mani con carte basse che colpiscono un flop basso, e la tua mano senza {{t:pair|coppia}} né {{t:draw|progetto}} ha mancato. Su un flop così fai {{t:c-bet}} meno spesso che sui flop alti."
      - action: bet-small
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il {{t:big-blind}} fa {{t:check}}. Una {{t:bet|puntata}} piccola è accettabile, ma più rara: su un flop basso e {{t:connected|connesso}} fai {{t:c-bet}} meno spesso che su quelli alti, perché il {{t:big-blind}} difende molti {{t:connectors}} e mani con carte basse che colpiscono questo flop."
      - action: bet-big
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il {{t:big-blind}} fa {{t:check}}. Una {{t:bet|puntata}} grande qui è un'imprecisione: su un flop {{t:connected|connesso}} il {{t:big-blind}} può avere già una {{t:straight|scala}}, quindi quando punti, punta poco. Su un flop basso fai anche {{t:c-bet}} meno spesso che su quelli alti, perché il {{t:big-blind}} difende molti {{t:connectors}} e mani con carte basse che colpiscono questo flop."
