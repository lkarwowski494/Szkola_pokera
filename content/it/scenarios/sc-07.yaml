id: sc-07
module: m4
situation: "Sei in {{t:big-blind}}. Il Button ha {{t:open|aperto}}, lo {{t:small-blind}} ha {{t:fold|foldato}} e tu hai fatto {{t:call}}. Sul flop fai {{t:check}} e il Button {{t:bet|punta}} una {{t:c-bet}} piccola."
table: 6max
