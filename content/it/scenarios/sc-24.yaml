# sc-24: Italian text of content/pl/scenarios/sc-24.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-24
module: m8
situation: "Al river hai una {{t:pair|coppia}} che batte solo i {{t:bluff}} dell'avversario, e l'avversario {{t:bet|punta}}. Supponi che la quota di {{t:bluff}} nelle sue {{t:bet|puntate}} sia quella data da questo esercizio."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni, trudny]
bounds:
  latwy: { marginMin: 0.1, expected: [call] }
  sredni: { marginMin: 0.03, marginMax: 0.1, expected: [fold] }
  trudny: { marginMin: 0.02, marginMax: 0.05, expected: [call] }
decisions:
  - street: river
    kind: river-catch
    rule: R-M8-010
    pots: [10, 14, 20, 30]
    fractions: [0.5, 0.75, 1]
    bluffShares: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5]
    actions:
      - action: call
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} al river. La tua equity è la quota di {{t:bluff}} nelle sue {{t:bet|puntate}}: batti ogni {{t:bluff}} e perdi contro ogni mano {{t:value|di valore}}. Il {{t:call}} guadagna solo quando la quota di {{t:bluff}} è maggiore dell'equity necessaria contro questa {{t:bet|puntata}}; quando è minore, perde."
      - action: fold
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} al river. La tua equity è la quota di {{t:bluff}} nelle sue {{t:bet|puntate}}. Il {{t:fold}} è giusto solo quando la quota di {{t:bluff}} è minore dell'equity necessaria contro questa {{t:bet|puntata}}; quando è maggiore, il {{t:fold}} rinuncia a un {{t:pot}} su cui il {{t:call}} guadagna. Contro una {{t:bet|puntata}} pari al {{t:pot}}, il {{t:call}} va in pareggio solo quando la quota di {{t:bluff}} è circa il {{n:eq.bet-pot}}."
