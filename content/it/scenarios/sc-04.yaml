# SC-04 (M3): UTG otwiera albo pasuje (range-spot rfi.utg), potem c-bet na suchym wysokim flopie (cbet-case R-M5-007). Rola 06, sesja EH,
# 2026-11-11. Struktura jak pl (content/pl/scenarios/sc-04.yaml); jeden poziom (D-1165).
id: sc-04
module: m3
situation: "Sei in {{t:utg|UTG}} e nessuno è ancora entrato in gioco; se {{t:open|apri}}, il {{t:big-blind}} farà {{t:call}} e al flop farà {{t:check}}."
table: 6max
positions: { hero: UTG, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [high], suits: [rainbow], ranks: [disconnected, semi-connected], oesdPossible: false }
    holding: [air]
    expected: ["raise 2.5", bet-small]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.utg
    rule: R-M3-002
    actions:
      - action: "raise 2.5"
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, {{w:stol}}, e nessuno è ancora entrato in gioco. {{t:open|Apri}}, perché questa mano rientra nel {{t:range}} stretto di {{t:utg|UTG}}: dietro di te ci sono ancora cinque giocatori, quindi più spesso qualcuno ha una mano migliore; per questo da {{t:utg|UTG}} {{t:open|apri}} solo circa {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} delle mani."
      - action: fold
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, {{w:stol}}, e nessuno è ancora entrato in gioco. Il {{t:fold}} è troppo prudente: il solver di solito {{t:open|apre}} questa mano anche da {{t:utg|UTG}}. Dietro di te ci sono ancora cinque giocatori, quindi il {{t:range}} da {{t:utg|UTG}} è stretto, circa {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} delle mani, ma questa mano ci rientra."
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il {{t:big-blind}} fa {{t:check}}. {{t:bet|Punti}} poco, circa {{n:cbet.size.small}} del {{t:pot}}, perché hai il {{t:range-advantage}} e le mani deboli del tuo avversario non hanno quasi chance: una {{t:bet|puntata}} piccola basta perché le {{t:fold|foldi}}."
      - action: check
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il {{t:big-blind}} fa {{t:check}}. Il {{t:check}} è accettabile, ma più raro: su un flop alto e {{t:dry|secco}} fai spesso {{t:c-bet}} con una {{t:bet|puntata}} piccola, perché hai il {{t:range-advantage}} e le mani deboli del tuo avversario {{t:fold|folderebbero}} già a una {{t:bet|puntata}} piccola. Facendo {{t:check}}, dai loro una carta gratis."
      - action: bet-big
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il {{t:big-blind}} fa {{t:check}}. Una {{t:bet|puntata}} grande qui è un'imprecisione: su un flop alto e {{t:dry|secco}} di solito fai {{t:c-bet}} con una {{t:bet|puntata}} piccola, circa {{n:cbet.size.small}} del {{t:pot}}, perché le mani deboli del tuo avversario {{t:fold|foldano}} già a una tale {{t:bet|puntata}}."
