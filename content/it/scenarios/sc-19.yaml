        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}: il turn non ha portato il {{t:flush}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} molto. {{t:fold|Foldi}}, perché l'ultima carta chiude meno spesso di quanto richieda il prezzo, e le {{t:implied-odds}} non cambiano le cose: con un {{t:spr}} basso dietro al {{t:pot}} restano troppo poche {{t:chips}} perché la vincita dopo aver chiuso compensi le {{t:call|chiamate}} perse. Il {{t:flush}} arriva al river in circa il {{n:odds.flush.turn-river}} dei casi, più o meno una carta su cinque."
