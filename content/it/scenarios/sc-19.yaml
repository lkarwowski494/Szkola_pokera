    actions:
      - action: call
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} poco rispetto al {{t:pot}}. {{t:call|Chiami}}, perché paghi solo per una carta, e il tuo {{t:flush-draw}} chiude con questa carta più spesso di quanto richieda un prezzo così basso. Il {{t:flush}} arriva al turn in circa il {{n:odds.flush.flop-turn}} dei casi, più o meno una carta su cinque."
      - action: fold
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} poco rispetto al {{t:pot}}. Un {{t:fold}} rinuncia a un {{t:pot}} in cui una {{t:call|chiamata}} guadagna: contro una {{t:bet}} così piccola, il tuo {{t:flush-draw}} chiude più spesso di quanto richieda il prezzo."
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.6667, 0.75, 1]
    villain: bet
    rule: R-M7-008
    actions:
      - action: call
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}: il turn non ha portato il {{t:flush}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} molto. Una {{t:call|chiamata}} conta sulle {{t:implied-odds}}, e qui non ci sono: con un {{t:spr}} basso dietro al {{t:pot}} restano così poche {{t:chips}} che, anche se dopo aver chiuso le vinci tutte, non coprono le {{t:call|chiamate}} perse. Le implied odds contano solo quando il tuo avversario ha ancora qualcosa con cui pagarti."
