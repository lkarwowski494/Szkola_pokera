    actions:
      - action: call
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} poco rispetto al {{t:pot}}. {{t:call|Chiami}}, perché paghi solo per una carta, e il tuo {{t:oesd}} chiude con questa carta più spesso di quanto richieda un prezzo così basso. Hai {{n:outs.oesd}} out, quindi la {{t:straight}} arriva al turn in circa il {{n:odds.oesd.flop-turn}} dei casi, più o meno una carta su sei. È una semplificazione: conti solo gli out del progetto. Ogni tua carta più alta del board aggiunge altri {{n:pair.outs.per-rank}} out incerti per una {{t:pair|coppia}}, ma qui questo non cambia la risposta."
      - action: fold
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} poco rispetto al {{t:pot}}. Un {{t:fold}} rinuncia a un {{t:pot}} in cui una {{t:call|chiamata}} guadagna: contro una {{t:bet}} così piccola, il tuo {{t:oesd}} chiude più spesso di quanto richieda il prezzo. È una semplificazione: conti solo gli out del progetto. Ogni tua carta più alta del board aggiunge altri {{n:pair.outs.per-rank}} out incerti per una {{t:pair|coppia}}, ma qui questo non cambia la risposta."
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.5, 0.6667, 0.75, 1]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}: il turn non ha portato la {{t:straight}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} molto. Una {{t:call|chiamata}} perde: paghi per l'ultima carta, e questa chiude meno spesso di quanto richieda il prezzo. Le {{t:implied-odds}} non lo compensano, perché con stack corti dietro al {{t:pot}} restano troppo poche {{t:chips}}: anche se dopo aver chiuso le vinci tutte, non coprono le {{t:call|chiamate}} perse. È una semplificazione: conti solo gli out del progetto. Ogni tua carta più alta del board aggiunge altri {{n:pair.outs.per-rank}} out incerti per una {{t:pair|coppia}}, ma qui questo non cambia la risposta."
      - action: fold
        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}: il turn non ha portato la {{t:straight}}, e il tuo avversario in {{w:rywal}} {{t:bet|punta}} molto. {{t:fold|Foldi}}, perché paghi per l'ultima carta, questa chiude meno spesso di quanto richieda il prezzo, e dietro al {{t:pot}} restano troppo poche {{t:chips}} perché chiudere lo compensi. La {{t:straight}} arriva al river in circa il {{n:odds.oesd.turn-river}} dei casi, più o meno una carta su sei. È una semplificazione: conti solo gli out del progetto. Ogni tua carta più alta del board aggiunge altri {{n:pair.outs.per-rank}} out incerti per una {{t:pair|coppia}}, ma qui questo non cambia la risposta."
