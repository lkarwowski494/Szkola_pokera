# M8: river. Bez częstotliwości i rozmiarów z literatury (rozmiar thin value „ok. 1/4–1/2 puli” tylko słownie w R-M8-003,
# decyzja D13 w dokumencie 12): sama matematyka z formuł i przykłady do ćwiczeń. Udział blefów w betach to bet/(pula+2·bet), czyli ta sama formuła co potrzebne equity
# (requiredEquity) z tymi samymi refs co eq.bet-*: osobna nazwa mówi, co liczba oznacza, a wartości nie mogą się rozjechać.
value.threshold: { value: 0.5, unit: percent, source: "matematyka: bet dla wartości na riverze (rywal tylko sprawdza albo pasuje) zarabia, gdy wygrywasz z więcej niż połową rąk, które sprawdzą" }
