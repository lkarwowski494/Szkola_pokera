# M11, trzech graczy (Button, mały blind, duży blind), stacki po 7,5bb: nasz solver (pushfold.json, drzewo src/pushfold3.ts)
# i porównanie z opublikowaną równowagą (Ganzfried i Sandholm, AAMAS 2008, tabela 2, „single hand” i „tournament”)
m11.depth.3max: { value: 7.5, unit: bb, decimals: 1, source: "Ganzfried i Sandholm, Computing an Approximate Jam/Fold Equilibrium for 3-player No-Limit Texas Hold'em Tournaments, AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf): „even chip stacks s1 = s2 = s3 = 4500 and blinds at SB = 300, BB = 600”, czyli 7,5bb" }
m11.3max.push.btn: { formula: rangePlay, spot: push.btn-3max, unit: percent, decimals: 1, source: "solver push/fold projektu (pushfold.json, trzech graczy, 7,5bb); walidacja: Ganzfried i Sandholm, AAMAS 2008, tabela 11 (scripts/pushfold3-validate.ts)" }
m11.3max.push.sb: { formula: rangePlay, spot: push.sb-3max, unit: percent, decimals: 1, source: "solver push/fold projektu (pushfold.json, trzech graczy, 7,5bb, Button spasował); walidacja: tabela 13 artykułu" }
m11.3max.call.sb: { formula: rangePlay, spot: call.sb-vs-btn-3max, unit: percent, decimals: 1, source: "solver push/fold projektu (pushfold.json): mały blind wobec all-inu Buttona; walidacja: tabela 12 artykułu" }
m11.3max.call.bb: { formula: rangePlay, spot: call.bb-vs-btn-3max, unit: percent, decimals: 1, source: "solver push/fold projektu (pushfold.json): duży blind wobec all-inu Buttona, SB spasował; walidacja: tabela 14 artykułu" }
m11.3max.call.bb-two: { formula: rangePlay, spot: call.bb-vs-two-3max, unit: percent, decimals: 1, source: "solver push/fold projektu (pushfold.json): duży blind po all-inie Buttona i sprawdzeniu SB; walidacja: tabela 16 artykułu" }
m11.gs.btn: { value: 0.355, unit: percent, decimals: 1, source: "Ganzfried i Sandholm, AAMAS 2008, tabela 2, „Button jam”, „Single hand prob.”: „0.355”" }
m11.gs.overcall.single: { value: 0.197, unit: percent, decimals: 1, source: "Ganzfried i Sandholm, AAMAS 2008, tabela 2, „BB jam after jam/jam”, single hand: „0.197”" }
m11.gs.overcall.tourn: { value: 0.021, unit: percent, decimals: 1, source: "Ganzfried i Sandholm, AAMAS 2008, tabela 2, „BB jam after jam/jam”, tournament: „0.021”; „In a tournament, the big blind only calls with the four highest pocket pairs and AKs”" }
m11.3max.sb.cost: { formula: diff, refs: [m11.depth.3max, pf.blind.sb], unit: bb, decimals: 1, source: "obliczenie: dopłata SB do all-inu Buttona" }
m11.3max.sb.pot: { formula: sum, refs: [m11.depth.3max, m11.depth.3max, pf.blind.bb], unit: bb, source: "obliczenie: pula po sprawdzeniu SB, gdy BB spasuje" }
m11.3max.sb.eq: { formula: quotient, refs: [m11.3max.sb.cost, m11.3max.sb.pot], unit: percent, decimals: 1, source: "obliczenie: potrzebne equity SB wobec samego Buttona" }
m11.3max.bb.cost: { formula: diff, refs: [m11.depth.3max, pf.blind.bb], unit: bb, decimals: 1, source: "obliczenie: dopłata BB do all-inu" }
m11.3max.bb.pot: { formula: sum, refs: [m11.depth.3max, m11.depth.3max, pf.blind.sb], unit: bb, decimals: 1, source: "obliczenie: pula po sprawdzeniu BB (Button all-in, SB spasował)" }
m11.3max.bb.eq: { formula: quotient, refs: [m11.3max.bb.cost, m11.3max.bb.pot], unit: percent, decimals: 1, source: "obliczenie: potrzebne equity BB wobec Buttona" }
m11.3max.bb-two.pot: { formula: sum, refs: [m11.depth.3max, m11.depth.3max, m11.depth.3max], unit: bb, decimals: 1, source: "obliczenie: pula po sprawdzeniu BB, gdy all-in są już dwaj gracze" }
m11.3max.bb-two.eq: { formula: quotient, refs: [m11.3max.bb.cost, m11.3max.bb-two.pot], unit: percent, decimals: 1, source: "obliczenie: potrzebne equity BB wobec dwóch rywali" }

