m11.bf.eq.win: { formula: icm, refs: [m11.bf.s1, m11.bf.win, m11.bf.s4, m11.bf.p1, m11.bf.p2, m11.bf.p3], args: [3, 1], unit: percent, decimals: 1, source: "obliczenie: ICM po wygranej (rywal odpada, trzech graczy w nagrodach)" }
