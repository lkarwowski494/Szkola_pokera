# Błąd próby statystyki HUD: odsetek p z n okazji ma błąd standardowy √(p(1 − p) ÷ n) (rozkład dwumianowy).
hud.se.ex.p: { value: 0.25, unit: percent, source: "przykład w lekcji: VPIP 25%" }
hud.se.ex.n: { value: 100, unit: count, source: "przykład w lekcji: 100 rąk (każda ręka to okazja do VPIP)" }
hud.se.ex.q: { formula: diff, refs: [math.one, hud.se.ex.p], unit: percent, source: "obliczenie: 1 − p" }
hud.se.ex.pq: { formula: product, refs: [hud.se.ex.p, hud.se.ex.q], unit: ratio, decimals: 3, source: "obliczenie: p × (1 − p)" }
hud.se.ex.var: { formula: quotient, refs: [hud.se.ex.pq, hud.se.ex.n], unit: ratio, decimals: 3, source: "obliczenie: wariancja odsetka p(1 − p) ÷ n" }
hud.se.ex: { formula: sqrt, refs: [hud.se.ex.var], unit: percent, decimals: 1, source: "obliczenie: błąd standardowy odsetka √(p(1 − p) ÷ n)" }
hud.ci.ex: { formula: product, refs: [var.z95, hud.se.ex], unit: percent, decimals: 1, source: "obliczenie: połowa przedziału 95% (1,96 błędu standardowego)" }
hud.ci.ex.low: { formula: diff, refs: [hud.se.ex.p, hud.ci.ex], unit: percent, decimals: 1, source: "obliczenie: dolna granica przedziału 95%" }
hud.ci.ex.high: { formula: sum, refs: [hud.se.ex.p, hud.ci.ex], unit: percent, decimals: 1, source: "obliczenie: górna granica przedziału 95%" }
hud.se.f3b.p: { value: 0.50, unit: percent, source: "przykład w lekcji: fold to 3-bet 50%" }
hud.se.f3b.n: { value: 20, unit: count, source: "przykład w lekcji: 20 sytuacji, w których rywal dostał 3-bet" }
hud.se.f3b.q: { formula: diff, refs: [math.one, hud.se.f3b.p], unit: percent, source: "obliczenie: 1 − p" }
hud.se.f3b.pq: { formula: product, refs: [hud.se.f3b.p, hud.se.f3b.q], unit: ratio, decimals: 3, source: "obliczenie: p × (1 − p)" }
hud.se.f3b.var: { formula: quotient, refs: [hud.se.f3b.pq, hud.se.f3b.n], unit: ratio, decimals: 3, source: "obliczenie: p(1 − p) ÷ n" }
hud.se.f3b: { formula: sqrt, refs: [hud.se.f3b.var], unit: percent, decimals: 1, source: "obliczenie: błąd standardowy odsetka" }
hud.ci.f3b: { formula: product, refs: [var.z95, hud.se.f3b], unit: percent, decimals: 1, source: "obliczenie: połowa przedziału 95%" }
hud.ci.f3b.low: { formula: diff, refs: [hud.se.f3b.p, hud.ci.f3b], unit: percent, decimals: 1, source: "obliczenie: dolna granica przedziału 95%" }
hud.ci.f3b.high: { formula: sum, refs: [hud.se.f3b.p, hud.ci.f3b], unit: percent, decimals: 1, source: "obliczenie: górna granica przedziału 95%" }

