# M9: plan rozdania (SPR, zaangażowanie, rozmiar geometryczny). Pule i stacki liczone formułami z liczb M2 i M4.
# SPR (stack ÷ pula) liczy formuła quotient, ułamki geometryczne f = ((1 + 2·SPR)^(1/n) − 1) / 2 formuła geometric.
# Łańcuchy zakładów (flop, turn, river) liczone formułami potwierdzają, że ułamek geometryczny daje all-in.
spr.srp.stack: { formula: diff, refs: [format.stack, pf.open-size], unit: bb, decimals: 1, source: "obliczenie: stack minus otwarcie (stack za pulą na flopie po otwarciu Buttona i sprawdzeniu BB)" }
spr.srp: { formula: quotient, refs: [spr.srp.stack, bb.pot-after.vs-btn], unit: ratio, decimals: 1, source: "obliczenie: SPR = stack za pulą ÷ pula na flopie (97,5 ÷ 5,5)" }
spr.srp.wrong-full: { formula: quotient, refs: [format.stack, bb.pot-after.vs-btn], unit: ratio, decimals: 1, source: "przykład błędnego rachunku: pełny stack ÷ pula (pominięte otwarcie, które już jest w puli)" }
spr.3bet-ip.stack: { formula: diff, refs: [format.stack, pf.3bet.ip-total], unit: bb, decimals: 1, source: "obliczenie: stack minus 3-bet z pozycji" }
spr.3bet-ip: { formula: quotient, refs: [spr.3bet-ip.stack, vs3bet.pot-after], unit: ratio, decimals: 1, source: "obliczenie: SPR = stack za pulą ÷ pula na flopie (92,5 ÷ 16,5)" }
spr.3bet-ip.wrong-full: { formula: quotient, refs: [format.stack, vs3bet.pot-after], unit: ratio, decimals: 1, source: "przykład błędnego rachunku: pełny stack ÷ pula" }
spr.3bet-oop.pot: { formula: sum, refs: [pf.3bet.oop-total, pf.3bet.oop-total, pf.blind.sb], unit: bb, decimals: 1, source: "obliczenie: 3-bet BB wobec Buttona sprawdzony, SB spasował" }
spr.3bet-oop.stack: { formula: diff, refs: [format.stack, pf.3bet.oop-total], unit: bb, source: "obliczenie: stack minus 3-bet bez pozycji" }
spr.3bet-oop: { formula: quotient, refs: [spr.3bet-oop.stack, spr.3bet-oop.pot], unit: ratio, decimals: 1, source: "obliczenie: SPR = stack za pulą ÷ pula na flopie (90 ÷ 20,5)" }
