bluff.share.bet-three-quarters: { formula: requiredEquity, refs: [ex.pot, ex.bet.three-quarters], unit: percent, source: "obliczenie: udział blefów w betach = bet/(pula+2·bet), ta sama formuła i dane co eq.bet-three-quarters" }
bluff.share.bet-pot: { formula: requiredEquity, refs: [ex.pot, ex.bet.pot], unit: percent, source: "obliczenie: udział blefów w betach = bet/(pula+2·bet), ta sama formuła i dane co eq.bet-pot; program nauczania M8: przy becie całej puli 1/3 betów to blefy" }
bluff.share.bet-overbet: { formula: requiredEquity, refs: [ex.pot, ex.bet.overbet], unit: percent, decimals: 1, source: "obliczenie: udział blefów w betach = bet/(pula+2·bet), ta sama formuła i dane co eq.bet-overbet" }
