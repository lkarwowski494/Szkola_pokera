value.ex.calls: { formula: sum, refs: [value.ex.many, value.ex.few], unit: count, source: "obliczenie: wszystkie sprawdzenia w przykładzie" }
value.ex.net: { formula: diff, refs: [value.ex.many, value.ex.few], unit: count, source: "obliczenie: wygrane bety minus przegrane bety" }
