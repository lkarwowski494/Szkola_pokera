# M7: turn. Implied odds liczone z formuł: na trafieniach musisz wygrać łącznie dopłata × (karty nietrafiające ÷ outy),
# bo wtedy equity × (pula po zakładzie + dodatkowa wygrana) = (1 − equity) × dopłata. 1 ÷ outy liczy formuła quotient
# (math.one ÷ outy). Przykłady dobrane tak, żeby wyniki w żetonach były całkowite (zadania liczbowe w żetonach oceniane
# są dokładnie).
math.one: { value: 1, unit: count, source: "stała pomocnicza: jedynka do zapisu 1 ÷ outy formułą quotient" }
miss.flush.turn: { formula: diff, refs: [cards.unseen.turn, outs.flush], unit: count, source: "obliczenie: nieznane karty na turnie minus outy do koloru" }
miss.oesd.turn: { formula: diff, refs: [cards.unseen.turn, outs.oesd], unit: count, source: "obliczenie: nieznane karty na turnie minus outy do strita otwartego" }
miss.gutshot.turn: { formula: diff, refs: [cards.unseen.turn, outs.gutshot], unit: count, source: "obliczenie: nieznane karty na turnie minus outy do gutshota" }
inv.outs.flush: { formula: quotient, refs: [math.one, outs.flush], unit: ratio, decimals: 3, source: "obliczenie pomocnicze: 1 ÷ outy" }
inv.outs.oesd: { formula: quotient, refs: [math.one, outs.oesd], unit: ratio, decimals: 3, source: "obliczenie pomocnicze: 1 ÷ outy" }
inv.outs.gutshot: { formula: quotient, refs: [math.one, outs.gutshot], unit: ratio, decimals: 3, source: "obliczenie pomocnicze: 1 ÷ outy" }
io.flush.bet: { formula: product, refs: [ex.third.pot, ex.frac.half], unit: count, source: "obliczenie: zakład pół puli przy puli z przykładu M2" }
io.flush.pot-after-bet: { formula: sum, refs: [ex.third.pot, io.flush.bet], unit: count, source: "obliczenie: pula po zakładzie" }
io.flush.total: { formula: sum, refs: [ex.third.pot, io.flush.bet, io.flush.bet], unit: count, source: "obliczenie: pula po zakładzie i sprawdzeniu" }
io.flush.eq: { formula: requiredEquity, refs: [ex.third.pot, io.flush.bet], unit: percent, source: "obliczenie: bet/(pula+2·bet)" }
io.flush.need: { formula: product, refs: [io.flush.bet, miss.flush.turn, inv.outs.flush], unit: count, source: "obliczenie: dopłata × nietrafiające ÷ outy (łączna wygrana na trafieniach, przy której sprawdzenie wychodzi na zero)" }
io.flush.extra: { formula: diff, refs: [io.flush.need, io.flush.pot-after-bet], unit: count, source: "obliczenie: ile ponad pulę po zakładzie musisz wygrać na riverze po trafieniu (implied odds)" }
io.oesd.pot: { value: 80, unit: count, source: "przykład w lekcji (pula w żetonach)" }
io.oesd.bet: { formula: product, refs: [io.oesd.pot, ex.frac.half], unit: count, source: "obliczenie: zakład pół puli" }
io.oesd.pot-after-bet: { formula: sum, refs: [io.oesd.pot, io.oesd.bet], unit: count, source: "obliczenie: pula po zakładzie" }
io.oesd.need: { formula: product, refs: [io.oesd.bet, miss.oesd.turn, inv.outs.oesd], unit: count, source: "obliczenie: dopłata × nietrafiające ÷ outy" }
io.oesd.extra: { formula: diff, refs: [io.oesd.need, io.oesd.pot-after-bet], unit: count, source: "obliczenie: ile ponad pulę po zakładzie musisz wygrać po trafieniu (implied odds)" }
io.gut.need: { formula: product, refs: [ex.bet.half, miss.gutshot.turn, inv.outs.gutshot], unit: count, source: "obliczenie: dopłata × nietrafiające ÷ outy" }
io.gut.extra: { formula: diff, refs: [io.gut.need, ex.half.pot-after-bet], unit: count, source: "obliczenie: ile ponad pulę po zakładzie musisz wygrać po trafieniu (implied odds)" }
spr.low: { value: 1.5, unit: ratio, decimals: 1, source: "przykład niskiego SPR dobrany do ćwiczeń (bez źródła liczbowego)" }
spr.high: { value: 5, unit: ratio, source: "przykład SPR na turnie z kilkoma pulami za rywalem, dobrany do ćwiczeń (bez źródła liczbowego); w strefach SPR z M9 (liczonych na flopie) to strefa środkowa" }
