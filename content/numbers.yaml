# M7: turn. Implied odds liczone z formuł: na trafieniach musisz wygrać łącznie dopłata × (karty nietrafiające ÷ outy),
# bo wtedy equity × (pula po zakładzie + dodatkowa wygrana) = (1 − equity) × dopłata. 1 ÷ outy liczy formuła quotient
# (math.one ÷ outy). Przykłady dobrane tak, żeby wyniki w żetonach były całkowite (zadania liczbowe w żetonach oceniane
# są dokładnie).
math.one: { value: 1, unit: count, source: "stała pomocnicza: jedynka do zapisu 1 ÷ outy formułą quotient" }
