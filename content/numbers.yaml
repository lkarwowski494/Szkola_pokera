prob.certain: { value: 1, unit: percent, source: "definicja: zdarzenie pewne" }
flop.miss.unpaired: { formula: missProbability, refs: [pair.outs.unpaired, cards.unseen.preflop, cards.board.flop], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core): żadna z 3 kart flopu nie paruje ręki" }
flop.miss.two: { formula: product, refs: [flop.miss.unpaired, flop.miss.unpaired], unit: percent, source: "obliczenie przybliżone: chybienia dwóch rywali traktowane jako niezależne (pomija karty w ich rękach)" }
flop.hit.unpaired: { formula: diff, refs: [prob.certain, flop.miss.unpaired], unit: percent, decimals: 1, source: "obliczenie: 100% minus szansa chybienia" }
