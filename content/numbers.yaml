# D-19: dokładnie jedna karta flopu paruje rękę (PrimeDope: 28,96%) = 3 × (6/50) × szansa, że dwie pozostałe karty
# (z 49) nie trafią żadnej z 5 pozostałych kart parujących.
flop.one-pair.first: { formula: quotient, refs: [pair.outs.unpaired, cards.unseen.preflop], unit: ratio, decimals: 3, source: "obliczenie pomocnicze: pierwsza karta paruje rękę (6 z 50)" }
pair.outs.unpaired.rest: { formula: diff, refs: [pair.outs.unpaired, math.one], unit: count, source: "obliczenie pomocnicze: karty parujące, które zostają po jednej trafionej" }
cards.unseen.preflop.rest: { formula: diff, refs: [cards.unseen.preflop, math.one], unit: count, source: "obliczenie pomocnicze: nieznane karty po jednej karcie flopu" }
flop.cards.rest: { formula: diff, refs: [cards.board.flop, math.one], unit: count, source: "obliczenie pomocnicze: pozostałe karty flopu" }
flop.one-pair.rest: { formula: missProbability, refs: [pair.outs.unpaired.rest, cards.unseen.preflop.rest, flop.cards.rest], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core): dwie pozostałe karty flopu nie parują ręki" }
flop.hit.one-pair: { formula: product, refs: [cards.board.flop, flop.one-pair.first, flop.one-pair.rest], unit: percent, decimals: 0, source: "obliczenie dokładne: dokładnie jedna karta flopu paruje rękę, C(6,1)·C(44,2)/C(50,3); zgodne z PrimeDope (28,96%)" }

