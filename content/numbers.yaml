# którym trzy zakłady wielkości puli dają all-in (geo.ex.total ÷ ex.pot; (1+2·1)^3 = 1 + 2·13). Ta sama liczba służy
# za przykład w lekcji o rozmiarze geometrycznym (dawny klucz geo.ex.spr).
