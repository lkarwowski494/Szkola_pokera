# M7: turn. Implied odds liczone z formuł: na trafieniach musisz wygrać łącznie dopłata × (karty nietrafiające ÷ outy),
# bo wtedy equity × (pula po zakładzie + dodatkowa wygrana) = (1 − equity) × dopłata. Schemat nie ma formuły ilorazu,
# więc 1 ÷ outy zapisujemy jako mdf(1, outy − 1) (potrzeba kodu w raporcie M7). Przykłady dobrane tak, żeby wyniki
# w żetonach były całkowite (zadania liczbowe w żetonach oceniane są dokładnie).
math.one: { value: 1, unit: count, source: "stała pomocnicza: jedynka do zapisu 1 ÷ outy przez formułę mdf" }
