miss.gutshot.turn: { formula: diff, refs: [cards.unseen.turn, outs.gutshot], unit: count, source: "obliczenie: nieznane karty na turnie minus outy do gutshota" }
inv.outs.flush: { formula: quotient, refs: [math.one, outs.flush], unit: ratio, decimals: 3, source: "obliczenie pomocnicze: 1 ÷ outy" }
