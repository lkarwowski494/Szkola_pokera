# M2: outy i szanse. Wszystkie liczby w przykładach lekcji M2 też stąd, żeby tekst i obliczenia się nie rozjechały (B-038).
cards.deck: { value: 52, unit: count, source: "zasady: talia" }
cards.suits: { value: 4, unit: count, source: "zasady: 4 kolory" }
cards.per-suit: { value: 13, unit: count, source: "zasady: 13 rang w kolorze" }
cards.hole: { value: 2, unit: count, source: "zasady: 2 karty w ręce" }
cards.board.flop: { value: 3, unit: count, source: "zasady: 3 karty na flopie" }
cards.board.turn: { value: 4, unit: count, source: "zasady: 4 karty na stole na turnie" }
cards.unseen.flop: { formula: diff, refs: [cards.deck, cards.hole, cards.board.flop], unit: count, source: "obliczenie: talia minus twoje karty i flop" }
cards.unseen.turn: { formula: diff, refs: [cards.deck, cards.hole, cards.board.turn], unit: count, source: "obliczenie: talia minus twoje karty i stół na turnie" }
draw.flush.seen: { value: 4, unit: count, source: "definicja: dobieranie do koloru to 4 widoczne karty w kolorze" }
draw.oesd.ranks: { value: 2, unit: count, source: "definicja: strit otwarty z obu stron domyka każda z dwóch rang" }
draw.gutshot.ranks: { value: 1, unit: count, source: "definicja: gutshot domyka jedna ranga" }
outs.flush: { formula: diff, refs: [cards.per-suit, draw.flush.seen], unit: count, source: "obliczenie: 13 kart w kolorze minus 4 widoczne" }
outs.oesd: { formula: product, refs: [draw.oesd.ranks, cards.suits], unit: count, source: "obliczenie: 2 rangi × 4 kolory" }
outs.gutshot: { formula: product, refs: [draw.gutshot.ranks, cards.suits], unit: count, source: "obliczenie: 1 ranga × 4 kolory" }
streets.flop-river: { value: 2, unit: count, source: "zasady: z flopu do rivera odkrywasz 2 karty" }
streets.turn-river: { value: 1, unit: count, source: "zasady: z turnu do rivera odkrywasz 1 kartę" }
odds.flush.flop-river: { formula: hitProbability, refs: [outs.flush, cards.unseen.flop, streets.flop-river], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core)" }
odds.flush.turn-river: { formula: hitProbability, refs: [outs.flush, cards.unseen.turn, streets.turn-river], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core)" }
odds.oesd.flop-river: { formula: hitProbability, refs: [outs.oesd, cards.unseen.flop, streets.flop-river], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core)" }
odds.oesd.turn-river: { formula: hitProbability, refs: [outs.oesd, cards.unseen.turn, streets.turn-river], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core)" }
odds.gutshot.flop-river: { formula: hitProbability, refs: [outs.gutshot, cards.unseen.flop, streets.flop-river], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core)" }
odds.gutshot.turn-river: { formula: hitProbability, refs: [outs.gutshot, cards.unseen.turn, streets.turn-river], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core)" }
odds.flush.rule-turn: { formula: ruleOf2And4, refs: [outs.flush, streets.turn-river], unit: percent, source: "reguła 2 i 4" }
odds.gutshot.rule-flop: { formula: ruleOf2And4, refs: [outs.gutshot, streets.flop-river], unit: percent, source: "reguła 2 i 4" }
odds.gutshot.rule-turn: { formula: ruleOf2And4, refs: [outs.gutshot, streets.turn-river], unit: percent, source: "reguła 2 i 4" }
# K5 (audyt 4.10): zakład na flopie kupuje jedną kartę, więc cenę porównujesz z szansą na turnie, nie do rivera.
streets.next-card: { value: 1, unit: count, source: "zasady: sprawdzenie zakładu kupuje jedną następną kartę" }
odds.flush.flop-turn: { formula: hitProbability, refs: [outs.flush, cards.unseen.flop, streets.next-card], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core): 9 z 47" }
odds.oesd.flop-turn: { formula: hitProbability, refs: [outs.oesd, cards.unseen.flop, streets.next-card], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core): 8 z 47" }
odds.gutshot.flop-turn: { formula: hitProbability, refs: [outs.gutshot, cards.unseen.flop, streets.next-card], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core): 4 z 47" }
# D1 (dokument 12 M0–M3): w m2.l2.q2/q3 asy dają parę asów nad królem, więc liczą się jako dodatkowe (niepewne) outy.
outs.flush-ace: { formula: sum, refs: [outs.flush, pair.outs.per-rank], unit: count, source: "obliczenie: 9 kart do koloru + 3 asy (dokument 12, D1)" }
odds.flush-ace.turn-river: { formula: hitProbability, refs: [outs.flush-ace, cards.unseen.turn, streets.turn-river], unit: percent, decimals: 1, source: "obliczenie dokładne (poker-core): 12 z 46 (dokument 12, D1)" }

# Przykładowe pule i zakłady z lekcji M2 (B-038): tekst przykładu i wynik liczą się z tych samych liczb.
ex.pot: { value: 100, unit: count, source: "przykład w lekcji (pula w żetonach)" }
ex.bet.pot: { formula: product, refs: [ex.pot, ex.frac.pot], unit: count, source: "obliczenie: zakład wielkości puli" }
ex.bet.half: { formula: product, refs: [ex.pot, ex.frac.half], unit: count, source: "obliczenie: zakład pół puli" }
ex.bet.quarter: { formula: product, refs: [ex.pot, ex.frac.quarter], unit: count, source: "obliczenie: zakład ćwierć puli" }
ex.frac.pot: { value: 1, unit: ratio, source: "przykład: zakład = pula" }
ex.frac.half: { value: 0.5, unit: ratio, decimals: 1, source: "przykład: zakład = pół puli" }
ex.frac.quarter: { value: 0.25, unit: ratio, decimals: 2, source: "przykład: zakład = ćwierć puli" }
ex.half.pot-after-bet: { formula: sum, refs: [ex.pot, ex.bet.half], unit: count, source: "obliczenie: pula po zakładzie pół puli" }
ex.half.total: { formula: sum, refs: [ex.pot, ex.bet.half, ex.bet.half], unit: count, source: "obliczenie: pula po zakładzie i sprawdzeniu" }
ex.third.pot: { value: 90, unit: count, source: "przykład w lekcji (pula w żetonach)" }
ex.third.bet: { value: 30, unit: count, source: "przykład w lekcji (zakład 1/3 puli)" }
ex.third.pot-after-bet: { formula: sum, refs: [ex.third.pot, ex.third.bet], unit: count, source: "obliczenie: pula po zakładzie" }
ex.third.total: { formula: sum, refs: [ex.third.pot, ex.third.bet, ex.third.bet], unit: count, source: "obliczenie: pula po zakładzie i sprawdzeniu" }
eq.bet-pot: { formula: requiredEquity, refs: [ex.pot, ex.bet.pot], unit: percent, source: "obliczenie: bet/(pula+2·bet)" }
eq.bet-half: { formula: requiredEquity, refs: [ex.pot, ex.bet.half], unit: percent, source: "obliczenie: bet/(pula+2·bet)" }
eq.bet-quarter: { formula: requiredEquity, refs: [ex.pot, ex.bet.quarter], unit: percent, source: "obliczenie: bet/(pula+2·bet)" }
eq.bet-third: { formula: requiredEquity, refs: [ex.third.pot, ex.third.bet], unit: percent, source: "obliczenie: bet/(pula+2·bet)" }
eq.bet-third.no-call: { formula: quotient, refs: [ex.third.bet, ex.third.pot-after-bet], unit: percent, source: "przykład błędnego rachunku w m2.l2.q1: zakład ÷ pula po zakładzie, bez twojego sprawdzenia (30 ÷ 120)" }

