# sc-13: Portuguese text of content/pl/scenarios/sc-13.yaml (role 06, session HA, 2026-11-13; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-13
module: m5
situation: "Fez {{t:open|abertura}} do Button e o {{t:big-blind}} fez {{t:call}}. No flop há duas cartas do mesmo naipe, e tem uma mão forte: {{t:top-pair}} com um bom {{t:kicker}} ou melhor. O adversário faz {{t:check}} e pode ter um {{t:flush-draw}}. Que tamanho de {{t:bet|aposta}} escolhe?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { draws: [flush], marginMin: 0.02, expected: ["bet-big"], flop: { suits: [two-tone], ranks: [semi-connected, disconnected] } }
decisions:
  - street: flop
    kind: flop-size
    rule: R-M5-008
    pots: [12, 24, 36, 48]
    small: 0.25
    big: 0.6666666666666666
    actions:
      - action: "bet-big"
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, na {{t:board}} há {{w:stol}}, e o adversário no {{w:rywal}} pode ter um {{t:flush-draw}}. {{t:bet|Aposta}} alto, porque os {{t:draw|draws}} do adversário têm muita equity, por isso uma {{t:bet|aposta}} grande obriga-os a pagar caro pela carta seguinte. Um {{t:flush-draw}} acerta no turn em cerca de {{n:odds.flush.flop-turn}} dos casos, e perante uma {{t:bet|aposta}} de dois terços do {{t:pot}} o preço da carta seguinte ({{n:eq.bet-two-thirds}} de equity) é mais alto do que a probabilidade de o draw a acertar."
      - action: "bet-small"
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, na {{t:board}} há {{w:stol}}, e o adversário no {{w:rywal}} pode ter um {{t:flush-draw}}. Uma {{t:bet|aposta}} pequena dá ao {{t:draw}} um bom preço: perante uma {{t:bet|aposta}} de um quarto do {{t:pot}} bastar-lhe-ia {{n:eq.bet-quarter}} de equity, e no turn acerta em cerca de {{n:odds.flush.flop-turn}} dos casos. Com uma mão forte contra {{t:draw|draws}} num flop assim, {{t:bet|aposta}} com um tamanho maior."
