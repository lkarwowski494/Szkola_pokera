# sc-17: Portuguese text of content/pl/scenarios/sc-17.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-17
module: m6
situation: "Está no {{t:big-blind}} e fez {{t:call}} à {{t:open|abertura}} do Button. No flop faz {{t:check}} e o Button {{t:bet|aposta}} um {{t:c-bet}} grande."
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [fold] }
decisions:
  - street: flop
    kind: defend
    rule: R-M6-007
    spot: vs-open.bb-vs-btn
    pots: [8]
    fractions: [0.75]
    actions:
      - action: fold
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, na {{t:board}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} um {{t:c-bet}} grande. {{t:fold|Desiste}}, porque tem duas cartas altas sem {{t:pair|par}} e sem {{t:draw}}: {{t:out-of-position|fora de posição}}, uma mão assim raramente chega ao {{t:showdown}}, e um {{t:pair|par}} com uma carta alta muitas vezes perde de qualquer forma. Perante uma {{t:bet|aposta}} de cerca de {{n:cbet.size.big}} do {{t:pot}} já precisa de cerca de {{n:eq.bet-three-quarters}} de equity."
      - action: call
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, na {{t:board}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} um {{t:c-bet}} grande. Fazer {{t:call}} paga muito por uma mão que, {{t:out-of-position|fora de posição}}, raramente chega ao {{t:showdown}}: duas cartas altas sem {{t:pair|par}} e sem {{t:draw}}, e um {{t:pair|par}} com uma carta alta muitas vezes perde de qualquer forma. Perante um {{t:c-bet}} grande faz {{t:call}} sobretudo quando tem um {{t:draw}} adicional, de preferência para o {{t:flush}} mais alto."
