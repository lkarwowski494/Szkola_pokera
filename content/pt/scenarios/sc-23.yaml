# sc-23: Portuguese text of content/pl/scenarios/sc-23.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-23
module: m8
situation: "Está no Button e no river o {{t:big-blind}} faz {{t:check}}. Está a pensar num {{t:bluff}} com uma de duas mãos que no {{t:showdown}} não ganham a nenhuma mão do adversário. Suponha que o adversário {{t:call|pagará}} com AA, KK, QQ, JJ, todos os AK e AQ {{t:suited}}, e {{t:fold|desistirá}} com KQ, KJ, QJ, QT e JT, todos {{t:suited}}. Que mão escolhe para o {{t:bluff}}?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [best-hand] }
decisions:
  - street: river
    kind: pick-hand
    rule: R-M8-007
    mode: blockers
    calls: [AA, KK, QQ, JJ, AKs, AKo, AQs]
    folds: [KQs, KJs, QJs, QTs, JTs]
    actions:
      - action: best-hand
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, na {{t:board}} há {{w:stol}}. Este é o melhor {{t:bluff}}: as duas mãos perdem no {{t:showdown}}, mas esta deixa ao adversário menos {{t:combo|combinações}} com que vai {{t:call|pagar}}, e não menos daquelas com que vai {{t:fold|desistir}}. Quando tem uma carta das mãos fortes dele, o adversário tem menos {{t:combo|combinações}} delas, por isso fica mais vezes com uma mão com que vai desistir."
      - action: other-hand
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, na {{t:board}} há {{w:stol}}. Esta mão é o {{t:bluff}} mais fraco: as duas perdem no {{t:showdown}}, mas a outra mão deixa ao adversário menos mãos com que vai {{t:call|pagar}}, e não menos mãos com que vai {{t:fold|desistir}}. Para o {{t:bluff}} escolhe uma mão com um {{t:blocker|bloqueador}} das mãos fortes dele, que não bloqueie mais mãos com que ele desiste do que a outra."
