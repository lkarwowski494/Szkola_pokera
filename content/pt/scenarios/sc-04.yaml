# SC-04 (M3): UTG otwiera albo pasuje (range-spot rfi.utg), potem c-bet na suchym wysokim flopie (cbet-case R-M5-007). Rola 06, sesja EH,
# 2026-11-11. Struktura jak pl (content/pl/scenarios/sc-04.yaml); jeden poziom (D-1165).
id: sc-04
module: m3
situation: "Está em {{t:utg|UTG}} e ninguém entrou ainda no jogo; se fizer {{t:open|abertura}}, o {{t:big-blind}} fará {{t:call}} e, no flop, fará {{t:check}}."
table: 6max
positions: { hero: UTG, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [high], suits: [rainbow], ranks: [disconnected, semi-connected], oesdPossible: false }
    holding: [air]
    expected: ["raise 2.5", bet-small]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.utg
    rule: R-M3-002
    actions:
      - action: "raise 2.5"
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, {{w:stol}}, e ninguém entrou ainda no jogo. {{t:open|Abre}}, porque esta mão cabe no {{t:range}} estreito do {{t:utg|UTG}}: ainda há cinco jogadores atrás de si, por isso é mais frequente alguém ter uma mão melhor; é por isso que do {{t:utg|UTG}} só {{t:open|abre}} cerca de {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} das mãos."
      - action: fold
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, {{w:stol}}, e ninguém entrou ainda no jogo. {{t:fold|Desistir}} é demasiado cauteloso: o solver costuma {{t:open|abrir}} esta mão também do {{t:utg|UTG}}. Ainda há cinco jogadores atrás de si, por isso o {{t:range}} do {{t:utg|UTG}} é estreito, cerca de {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} das mãos, mas esta mão cabe nele."
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, na {{t:board}} há {{w:stol}}, e o {{t:big-blind}} faz {{t:check}}. {{t:bet|Aposta}} pouco, cerca de {{n:cbet.size.small}} do {{t:pot}}, porque tem a {{t:range-advantage}} e as mãos fracas do adversário quase não têm hipóteses: uma {{t:bet|aposta}} pequena chega para que as {{t:fold|largue}}."
      - action: check
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, na {{t:board}} há {{w:stol}}, e o {{t:big-blind}} faz {{t:check}}. O {{t:check}} é aceitável, mas mais raro: num flop alto e {{t:dry|seco}} faz {{t:c-bet}} muitas vezes e pequeno, porque tem a {{t:range-advantage}} e as mãos fracas do adversário já {{t:fold|largariam}} perante uma {{t:bet|aposta}} pequena. Ao fazer {{t:check}}, dá-lhes uma carta grátis."
      - action: bet-big
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, na {{t:board}} há {{w:stol}}, e o {{t:big-blind}} faz {{t:check}}. Uma {{t:bet|aposta}} grande é aqui uma imprecisão: num flop alto e {{t:dry|seco}} costuma fazer {{t:c-bet}} pequeno, cerca de {{n:cbet.size.small}} do {{t:pot}}, porque as mãos fracas do adversário já {{t:fold|largam}} perante essa {{t:bet|aposta}}."
