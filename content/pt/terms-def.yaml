royal-flush: "A mão mais alta do póquer: ás, rei, dama, valete e dez do mesmo naipe, por exemplo A♠ K♠ Q♠ J♠ T♠."
straight-flush: "Cinco cartas consecutivas do mesmo naipe, por exemplo 5♥ 6♥ 7♥ 8♥ 9♥. A variante mais alta (do ás ao dez) tem nome próprio e é a mão mais forte do jogo."
four-of-a-kind: "Quatro cartas do mesmo valor, por exemplo quatro setes. Entre duas quadras do mesmo valor, ganha a quinta carta mais alta (kicker)."
full-house: "Um trio e um par na mesma mão, por exemplo três damas e dois cincos. Entre dois full house, ganha o trio mais alto."
flush: "Cinco cartas do mesmo naipe (♠, ♥, ♦ ou ♣) que não são consecutivas. Entre duas destas mãos, ganha a que tiver a carta de topo mais alta; se esta for igual, ganha a que tiver a seguinte mais alta."
straight: "Cinco cartas consecutivas, nem todas do mesmo naipe, por exemplo 5-6-7-8-9. O ás pode ser a carta mais alta (A-K-Q-J-T) ou a mais baixa (A-2-3-4-5)."
three-of-a-kind: "Três cartas do mesmo valor e duas outras. No hold'em tem duas variantes com nome próprio: set, quando o par está na mão e a terceira carta na mesa, e trips, quando o par está na mesa e a terceira carta na mão."
set: "Trio formado por um par na mão e uma carta da mesa, por exemplo 7♣ 7♦ num flop K-7-2."
two-pair: "Dois pares diferentes e uma quinta carta, por exemplo K-K-8-8-3. Em caso de empate, decide primeiro o par mais alto, depois o mais baixo e, por fim, a quinta carta."
pair: "Duas cartas do mesmo valor e três outras, por exemplo dois noves. Só a carta alta é mais fraca."
high-card: "Mão sem par nem combinação melhor; a força é decidida pela carta mais alta e, em caso de empate, pelas seguintes."
kicker: "A carta mais alta fora da combinação, que decide o empate. Exemplo: um par de ases com rei ganha a um par de ases com dama."
wheel: "A sequência mais baixa: A-2-3-4-5, em que o ás conta como a carta mais baixa."
check: "Continuar no jogo sem pôr fichas, só possível quando não tem de pagar nada: nesta ronda de apostas ainda ninguém apostou (antes do flop, o big blind pode fazê-lo quando ninguém aumentou). Não confundir com pagar, que é igualar a aposta do adversário."
bet: "A primeira colocação de fichas numa ronda de apostas em que ainda ninguém apostou (em sentido lato, chama-se aposta a qualquer entrada de fichas no pote)."
call: "Pôr no pote o valor da aposta ou do aumento do adversário para continuar a jogar. Não confundir com passar, que é continuar sem apostar quando ninguém apostou."
raise: "Elevar o valor acima da aposta do adversário; os restantes têm de pôr a diferença, voltar a aumentar ou desistir. Também se diz «subir»."
fold: "Abandonar a mão: entrega as cartas e perde o que já pôs no pote."
check-raise: "Primeiro passa e, quando o adversário aposta, aumenta a aposta dele na mesma ronda de apostas."
all-in: "Apostar todas as suas fichas. De cada adversário pode então ganhar, no máximo, tanto quanto pôs; o resto é disputado num pote secundário."
pot: "Todas as fichas apostadas na mão em curso. Leva-as o jogador com a melhor mão no showdown (com potes secundários, cada pote é disputado à parte) ou o jogador perante o qual todos os outros desistiram."
side-pot: "Pote separado que se forma quando alguém joga all-in: só o disputam os jogadores que puseram mais do que o jogador all-in, por isso este não o pode ganhar."
split-pot: "Situação em que jogadores com mãos iguais dividem o pote, por exemplo quando ambos jogam a mesma sequência que está na mesa."
playing-the-board: "Situação em que a sua melhor mão de cinco cartas é formada só pelas cartas comunitárias; as suas cartas privadas não acrescentam nada, por isso, na melhor das hipóteses, divide o pote."
board: "As cartas comunitárias viradas para cima no centro (flop, turn, river), que todos os jogadores usam. Neste sentido, «mesa» são as cartas, não o local de jogo (à mesa, mesa final)."
community-cards: "Cartas colocadas viradas para cima no centro, que qualquer jogador pode usar para formar a sua mão; no hold'em são cinco."
hole-cards: "As duas cartas viradas para baixo que recebe no início da mão no hold'em; só o próprio as vê."
small-blind: "A aposta obrigatória menor, colocada antes da distribuição pelo jogador à esquerda do button (com dois jogadores, pelo próprio button); é também o nome desse lugar à mesa."
big-blind: "A aposta obrigatória maior, colocada antes da distribuição pelo segundo jogador à esquerda do button (com dois jogadores, pelo jogador em frente ao button); é também o nome desse lugar. Serve ainda de unidade para medir stacks e resultados."
chips: "Os discos com que se joga à mesa; nos jogos a dinheiro representam dinheiro, nos torneios pontos de torneio."
stack: "Todas as fichas que um jogador tem à sua frente; costuma indicar-se em big blinds (por exemplo, 100 big blinds)."
street: "Nome de gíria para uma ronda de apostas: preflop, flop, turn e river são as quatro streets. Exemplo: «value em três streets» são apostas de valor no flop, no turn e no river."
betting-round: "Fase da mão em que os jogadores, à vez, passam, apostam, pagam, aumentam ou desistem; no hold'em há quatro: preflop, flop, turn e river."
preflop: "A primeira ronda de apostas: depois de distribuídas as cartas privadas, antes de o flop chegar à mesa."
flop: "As três primeiras cartas comunitárias, colocadas de uma vez após as apostas preflop; é também o nome da segunda ronda de apostas."
turn: "A quarta carta comunitária e a terceira ronda de apostas."
river: "A quinta e última carta comunitária e a última ronda de apostas antes do showdown."
showdown: "Revelação das cartas após a última ronda de apostas, quando restam pelo menos dois jogadores na mão; a melhor mão leva o pote."
position: "O lugar à mesa em relação ao button, que define a ordem de ação. Quem age mais tarde vê mais ações dos adversários antes de decidir."
in-position: "Situação do jogador que, depois do flop, age em último lugar e, por isso, vê a ação do adversário antes de decidir."
out-of-position: "Situação do jogador que, depois do flop, age antes do adversário e, por isso, decide sem conhecer a ação dele."
early-position: "Os primeiros lugares a agir antes do flop (por exemplo, UTG); depois de si ainda há muitos jogadores por agir."
late-position: "Os lugares que agem em último: o button e os lugares imediatamente antes dele, sobretudo o cutoff."
utg: "O primeiro jogador a agir antes do flop, sentado imediatamente à esquerda do big blind."
hijack: "O lugar imediatamente antes do cutoff, ou seja, o segundo à direita do button."
cutoff: "O lugar imediatamente à direita do button, que age logo antes dele."
button: "O lugar de quem dá as cartas, marcado com o disco «dealer». Depois do flop, age em último lugar em todas as rondas de apostas."
outs: "Carta que ainda está no baralho e que melhora a sua mão, normalmente completando um draw. Exemplo: com um flush draw, os outs são as restantes cartas do seu naipe."
draw: "Mão que ainda não é uma combinação forte, mas que pode vir a sê-lo com as próximas cartas comunitárias, por exemplo quando falta uma carta para o flush ou para a sequência."
flush-draw: "Quatro cartas do mesmo naipe (na mão e na mesa, em conjunto); falta uma para ter flush."
straight-draw: "Quatro cartas a que falta uma para a sequência. Variantes: OESD (falta uma carta numa de duas pontas) e gutshot (falta uma carta no meio)."
oesd: "Abreviatura de open-ended straight draw: draw de sequência com quatro cartas consecutivas, completado por uma carta em qualquer das pontas; por exemplo, 5-6-7-8 espera um quatro ou um nove."
gutshot: "Draw de sequência a que falta um valor específico no meio; por exemplo, 5-6-8-9 só espera um sete."
backdoor: "Draw no flop que precisa de duas cartas favoráveis seguidas, no turn e no river; por exemplo, três cartas do mesmo naipe após o flop."
pot-odds: "Relação entre o valor que tem de pagar e o pote que pode ganhar (incluindo a aposta do adversário). Indica com que frequência tem de ganhar para que pagar compense."
implied-odds: "Pot odds acrescidas das fichas que espera ganhar nas rondas seguintes se completar a sua mão."
equity: "A sua probabilidade de ganhar o pote se todas as cartas restantes fossem dadas sem mais apostas; normalmente em percentagem."
equity-realization: "Em que medida uma mão converte a sua equity em ganhos quando as apostas continuam (pode realizar menos ou mais do que a sua equity); depende, entre outros fatores, da posição e da facilidade com que a mão se joga."
expected-value: "O resultado médio de uma jogada se fosse repetida muitas vezes. Uma jogada com resultado médio positivo dá lucro a longo prazo, mesmo que desta vez perca."
combo: "Uma disposição concreta de duas cartas com naipes, por exemplo A♠ K♥. Contar estas disposições mostra quantas combinações de determinada mão existem realmente num range."
range: "O conjunto de todas as mãos que um jogador pode ter numa dada situação, ou das mãos com que faria determinada jogada."
mixed-hand: "Mão com que a estratégia de equilíbrio escolhe ora uma jogada, ora outra (por exemplo, por vezes aumentar, por vezes pagar); ambas as jogadas são corretas. Diz-se também que a mão é jogada com uma estratégia mista."
open: "Primeira entrada no pote antes do flop com um aumento, quando todos antes de si desistiram."
suited: "Duas cartas privadas do mesmo naipe, por exemplo A♥ K♥ (notação AKs)."
offsuit: "Duas cartas privadas de naipes diferentes, por exemplo A♥ K♣ (notação AKo)."
pocket-pair: "Par formado pelas duas cartas privadas, por exemplo 8♣ 8♦ antes do flop."
connectors: "Cartas privadas de valores vizinhos, por exemplo 8-7 ou 9-8; com elas é mais fácil formar uma sequência."
3-bet: "O primeiro aumento sobre uma abertura antes do flop; o nome conta o big blind como primeira aposta e a abertura como segunda."
4-bet: "Aumento sobre um 3-bet, ou seja, a quarta aposta na ronda de apostas."
limp: "Entrada no pote antes do flop pagando apenas o big blind, quando ainda ninguém aumentou."
isolation: "Aumento após um ou mais limps, para jogar contra o limper (muitas vezes um jogador mais fraco) um contra um."
texture: "O carácter das cartas comunitárias: quantos naipes há, se as cartas estão próximas umas das outras, se há um par. Disso depende que mãos e draws são possíveis."
dry: "Mesa em que são possíveis poucos draws e poucas mãos fortes, por exemplo K♠ 7♦ 2♣."
wet: "Mesa em que são possíveis muitos draws e mãos fortes, por exemplo J♥ T♥ 8♣."
rainbow: "Flop com três cartas de três naipes diferentes, pelo que no flop ninguém tem flush draw."
two-tone: "Flop com duas cartas do mesmo naipe, pelo que são possíveis draws de flush."
monotone: "Flop com três cartas do mesmo naipe, pelo que o flush pode já estar feito."
paired: "Mesa com um par (duas cartas do mesmo valor), por exemplo 8-8-3."
connected: "Mesa em que alguém pode já ter feito uma sequência, por exemplo 9-8-7."
disconnected: "Mesa com cartas afastadas entre si, com a qual é difícil formar uma sequência ou um draw de sequência, por exemplo K-7-2."
semi-connected: "Mesa com draw de sequência, mas em que a sequência ainda não é possível, por exemplo T-8-3 (classificação adotada no curso)."
wetness: "O grau em que a mesa favorece draws e mãos fortes: de seca a molhada. Também se fala do grau de coordenação da mesa."
top-pair: "Par com a carta mais alta da mesa, por exemplo K♠ Q♦ num flop K-7-2."
second-pair: "Par com a segunda carta mais alta da mesa, por exemplo 7♠ 6♠ num flop K-7-2."
overpair: "Par de mão mais alto do que todas as cartas da mesa, por exemplo Q-Q num flop J-7-2."
c-bet: "Aposta de continuação: aposta do jogador que foi o agressor na ronda anterior, por exemplo uma aposta no flop depois de abrir preflop."
aggressor: "O jogador que apostou ou aumentou em último lugar na ronda de apostas anterior."
initiative: "O papel do último agressor: normalmente é ele que faz a aposta seguinte."
range-advantage: "Situação em que o range de um jogador tem, numa dada mesa, mais equity no total do que o range do adversário."
nuts-advantage: "Situação em que um jogador tem no range, proporcionalmente, mais das mãos mais fortes do que o adversário."
nuts: "A mão mais forte possível numa dada mesa, num dado momento. Exemplo: na mesa K♥ 9♥ 4♥ 2♣ é o flush com o ás de copas."
polarized: "Diz-se de um range: composto sobretudo por mãos muito fortes e bluffs, quase sem mãos médias."
polarization: "Construção do range a partir dos extremos: mãos fortes para valor e bluffs, sem mãos médias."
linear: "Diz-se de um range: construído de cima para baixo, das mãos mais fortes para as mais fracas, sem um grupo separado de bluffs. Encontra-se também o termo próximo «merged range» (range não polarizado); segundo análises publicadas de solvers, o merged é uma forma intermédia entre este range e o polarizado."
condensed: "Diz-se de um range: sem as mãos mais fortes (limitado por cima) e composto sobretudo por mãos médias; o oposto do polarizado."
value: "Apostar com uma mão forte para que o adversário pague com uma mão mais fraca."
value-bet: "Uma aposta individual de valor: feita com uma mão forte para que mãos mais fracas a paguem."
bluff: "Aposta com uma mão fraca, que dificilmente ganhará no showdown, para levar o adversário a desistir com uma mão melhor."
semi-bluff: "Aposta com uma mão ainda fraca, mas com hipóteses de melhorar (por exemplo, com um draw): ganha se o adversário desistir ou se completar a mão."
blocker: "Carta na sua mão que reduz a probabilidade de o adversário ter determinadas mãos. Exemplo: se tiver o ás de copas, o adversário não pode ter o flush de copas com ás."
bluff-catcher: "Mão que só bate os bluffs do adversário e perde para as apostas de valor dele."
barrel: "Nova aposta na ronda de apostas seguinte, depois de ter apostado na ronda anterior."
second-barrel: "A segunda aposta seguida: depois de um c-bet no flop, o jogador volta a apostar no turn."
probe-bet: "Aposta no turn do jogador fora de posição depois de o agressor preflop ter passado no flop em vez de fazer c-bet."
donk-bet: "Aposta de um jogador que aposta antes de o agressor da ronda anterior ter tido oportunidade de agir."
overbet: "Aposta depois do flop maior do que todo o pote."
effective-stack: "Numa mão entre dois jogadores: o menor dos dois stacks, ou seja, o máximo que se pode realmente ganhar ou perder. Com vários jogadores, calcula-se separadamente para cada par."
spr: "O stack efetivo dividido pelo pote no início de uma ronda (para planear a mão, calcula-se no flop); indica a profundidade dos stacks em relação ao pote (quanto mais baixo o SPR, mais depressa tudo vai para o pote)."
mdf: "A menor parte do range que é preciso defender contra uma aposta para que o bluff do adversário com uma mão sem hipóteses não seja automaticamente lucrativo."
alpha: "Com que frequência o adversário tem de desistir para que um bluff com uma mão sem hipóteses não ganhe nem perca; depende do tamanho da aposta em relação ao pote."
variance: "A dispersão dos resultados em torno do valor esperado: mesmo jogando bem, séries curtas podem ficar muito no negativo ou no positivo."
buy-in: "O valor de entrada num torneio ou num jogo a dinheiro à mesa."
bankroll: "Toda a reserva destinada exclusivamente a jogar póquer; nesta aplicação é contada em buy-ins, não em dinheiro."
tilt: "Estado em que as emoções (raiva, frustração, euforia) pioram as suas decisões à mesa."
winrate: "O resultado médio de um jogador numa amostra mais longa; nos jogos a dinheiro, normalmente em bb/100, ou seja, big blinds por cem mãos."
downswing: "Período de resultados claramente piores, normalmente perdas maiores do que a habilidade faria prever; o oposto de um upswing."
session: "Um período de jogo de póquer, desde o início até ao fim do jogo."
stakes: "O valor dos blinds num jogo a dinheiro ou do buy-in num torneio; os «micro stakes» são os níveis mais baixos."
standard-deviation: "Medida da dispersão dos resultados (raiz quadrada da variância); no póquer, normalmente indicada em bb/100."
risk-of-ruin: "Probabilidade de vir a perder todo o bankroll se continuar a jogar nos mesmos stakes."
mental-game: "O lado psicológico do póquer: lidar com o tilt, as emoções e a concentração à mesa."
tournament: "Formato em que os blinds sobem periodicamente e o jogo continua até um jogador reunir todas as fichas; os prémios vão para os mais bem classificados."
push-fold: "Estratégia simplificada para short stacks: antes do flop, joga-se all-in ou desiste-se."
shove: "Jogada all-in, normalmente como aumento antes do flop."
icm: "Modelo que converte as fichas de torneio em valor monetário, tendo em conta a estrutura de pagamentos e os stacks de todos os jogadores."
bubble: "Fase do torneio imediatamente antes dos lugares pagos, quando faltam poucas eliminações para chegar aos prémios."
bubble-factor: "Indicador do ICM: quanto mais dói, num torneio, perder um certo número de fichas do que compensa ganhar o mesmo número."
cover: "Ter pelo menos tantas fichas como o adversário. Quando o adversário o cobre, perder um all-in contra ele termina o seu torneio."
risk-premium: "Equity adicional, acima do que as pot odds exigem, necessária num torneio para arriscar um all-in, porque perder custa mais do que ganhar rende."
m-ratio: "O stack dividido pela soma dos blinds e dos antes de uma mão: para quantas voltas completas (órbitas) as fichas chegam sem jogar."
red-zone: "Zona de M muito baixo: resta sobretudo jogar all-in ou desistir."
green-zone: "Zona de M alto: o stack permite jogar livremente, de forma conservadora ou agressiva."
ante: "Pequena contribuição obrigatória para o pote, feita por todos os jogadores antes da distribuição (sobretudo em torneios)."
bb-ante: "Formato de ante em que, em vez de todos os jogadores, é o jogador no big blind que paga o ante por toda a mesa."
fold-equity: "A parte do valor de uma jogada que resulta de o adversário poder desistir."
gap-concept: "Princípio segundo o qual é preciso uma mão mais forte para pagar uma abertura do que para abrir."
chip-ev: "Valor esperado de uma jogada calculado em fichas, sem as converter em dinheiro (sem ICM)."
tournament-equity: "A sua parte esperada da bolsa de prémios, dada a estrutura de pagamentos e os stacks. O mesmo também se designa por «$EV»."
prize-pool: "Soma do dinheiro a repartir pelos jogadores premiados de um torneio."
payout: "O prémio por um lugar concreto no torneio; todos juntos formam a distribuição de prémios."
pay-jump: "Diferença de pagamento entre lugares vizinhos num torneio; saltos grandes aumentam o risk premium."
final-table: "A última mesa de um torneio, onde se disputam os prémios mais altos."
short-stack: "Stack pequeno em relação aos blinds; nos torneios, normalmente um com poucos big blinds."
nash-equilibrium: "Conjunto de estratégias em que nenhum jogador ganha ao alterar apenas a sua própria estratégia."
overcall: "Pagar uma aposta que alguém antes de si já pagou."
heads-up: "Jogo um contra um: à mesa ou na mão restam apenas dois jogadores."
dead-money: "Fichas no pote de jogadores que já não o podem ganhar, por exemplo dos que desistiram."
stack-off: "Pôr todo o stack no pote numa só mão, ou seja, jogar all-in ou pagar um all-in."
exploit: "Desvio deliberado da estratégia base para tirar partido de um erro concreto de um adversário ou de toda a população de jogadores."
hud: "Sobreposição na mesa, no jogo online, que mostra estatísticas dos adversários a partir de mãos jogadas anteriormente."
vpip: "Estatística do HUD: em que percentagem das mãos o jogador põe voluntariamente dinheiro no pote antes do flop (paga ou aumenta)."
pfr: "Estatística do HUD: em que percentagem das mãos o jogador aumenta antes do flop."
wtsd: "Estatística do HUD: com que frequência o jogador que viu o flop chega ao showdown."
nit: "Jogador muito apertado, que entra no pote quase só com mãos fortes."
regular: "Frequentador habitual de um dado nível de stakes, que joga muitas mãos; no curso, contrapõe-se ao jogador recreativo."
tag: "Estilo apertado e agressivo: poucas mãos, mas jogadas de forma agressiva (apostas e aumentos)."
lag: "Estilo solto e agressivo: muitas mãos, jogadas de forma agressiva."
recreational: "Jogador que joga por diversão e, em regra, pior do que os regulares; na gíria, pejorativamente, «fish»."
calling-station: "Termo pejorativo para um jogador que paga com muita frequência, mesmo com mãos fracas ou draws."
maniac: "Termo pejorativo para um jogador muito solto e agressivo, que aposta e aumenta com qualquer coisa."
rake: "Comissão que o casino ou a sala online cobra do pote pela organização do jogo."
rake-cap: "Valor máximo de rake que a sala pode cobrar numa única mão."
