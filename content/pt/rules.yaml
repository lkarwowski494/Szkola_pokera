# Reguły odruchowe „Jeśli X, to Y, bo Z”. Poziom: rules (zasady gry), math, gto, heuristic, exploit.
# Kryteria poziomów (S-05, audyt 4.10):
#   math      – twierdzenie, które samo jest rachunkiem (outy, szanse, cena sprawdzenia, znak EV, dominacja jednej akcji nad drugą);
#   heuristic – zalecenie wyprowadzone z rachunku albo z literatury, bez wyniku solvera;
#   gto       – opublikowany wynik solvera albo rozwiązania równowagi;
#   exploit   – dostosowanie do typu gracza; musi podać populację;
#   rules     – zasady gry i definicje.
# Reguła eksploatacyjna musi podać populację źródłową (walidacja w content-build).
# Pole source: pełny opis źródeł z adresami i cytatami najwyżej 2 zdania, bez nazw serwisów i marek (decyzja właściciela
# z 9.10.2026); zostaje w repozytorium. Pole sources: jedno niezależne źródło (organizacja albo autor) = jedna pozycja
# { kind, url? }; kind: math, rules, solver-pub, solver-app, book, study, reference, training, population (SourceKind
# w content-schema). Aplikacja pokazuje tylko rodzaj i liczbę źródeł, np. „serwisy szkoleniowe (3)”; jedno źródło inne
# niż rachunek dostaje dopisek „jedno źródło”.
# Pole check (tryb gry M13, dokument 14, 4.4.3 i 6.2 A): warunek sprawdzalny automatycznie w silniku oceny
# (packages/poker-core/src/grading.ts). kind = rodzaj sprawdzenia, players/stackBb = konfiguracje stołu, których
# dotyczy źródło reguły (5.5; brak = każda, reguły rachunkowe), streets, spots (spoty solvera), drill (przypadki
# c-betu), params (liczby jako n:klucz). Reguły-zakazy (free-check-fold, no-limp) oceniają tylko naruszenie.

- id: R-M0-001
  module: m0
  if: "dois jogadores têm mãos de categorias diferentes"
  then: "ganha a mão mais alta no ranking, independentemente do valor das cartas"
  because: "o ranking das mãos decide antes do valor das cartas; um {{t:flush|flush}} vence sempre uma {{t:straight|sequência}}, um {{t:full-house|full house}} vence sempre um {{t:flush|flush}}"
  level: rules
  source: "regras do Texas Hold'em: regulamento de casino aprovado pelo regulador do jogo da Califórnia (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf), Card Values and Hand Rankings: «The ranking of hands for Texas Hold'em, in order from highest to lowest rank, shall be»; regulamento de póquer de um casino de Perth aprovado pelo regulador (RAG/551) (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf), 10.1; complementar: List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-002
  module: m0
  if: "ambos os jogadores têm o mesmo núcleo da mão: o mesmo {{t:pair|par}}, o mesmo {{t:three-of-a-kind|trio}} ou os mesmos {{t:two-pair|dois pares}}"
  then: "decidem os kickers, comparados um a um a partir do mais alto, mas só os que cabem nas 5 melhores cartas; se as cinco cartas forem idênticas, {{t:split-pot|o pote é dividido}}"
  because: "conta primeiro a categoria da mão, depois o seu valor, e os kickers só com núcleo idêntico; contam apenas as cinco melhores das 7 cartas"
  level: rules
  source: "regras do Texas Hold'em: regulamento de póquer de um casino de Perth aprovado pelo regulador (RAG/551) (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf), 10.3–10.4: «all cards count, for example, Q:Q:7:7:9 shall lose to Q:Q:7:7:10»; Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), secções 3 e 5; complementar, ordem de comparação: List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-003
  module: m0
  if: "as 5 melhores cartas de ambos os jogadores estão na {{t:board|mesa}}"
  then: "{{t:split-pot|o pote é dividido}}"
  because: "ambos jogam as mesmas cinco cartas («{{t:playing-the-board|jogar a mesa}}»)"
  level: rules
  source: "regras do Texas Hold'em: Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), secção 5 («play the board»); regulamento de casino aprovado pelo regulador do jogo da Califórnia (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf): «the pot shall be split equally among all players with the winning hand»; complementar: Texas hold 'em (https://en.wikipedia.org/wiki/Texas_hold_%27em) (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/Texas_hold_%27em" }]

- id: R-M1-001
  module: m1
  if: "ninguém antes de si {{t:bet|apostou}} nesta ronda"
  then: "pode {{t:check|passar}} ou {{t:bet|apostar}}"
  because: "só se pode {{t:call|pagar}} ou {{t:raise|aumentar}} uma {{t:bet|aposta}} já existente"
  level: rules
  source: "regras do Texas Hold'em: Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), secção 3 («fold, check, bet, call, or raise») (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }]
- id: R-M1-002
  module: m1
  if: "pode {{t:check|passar}} sem custo"
  then: "nunca {{t:fold|desiste}}"
  because: "{{t:fold|desistir}} entrega o {{t:pot|pote}} sem qualquer benefício, e {{t:check|passar}} não custa nada"
  level: math
  check: { kind: free-check-fold }
  source: "cálculo: passar custa 0 e mantém a hipótese de ganhar o pote, por isso nunca é pior do que desistir"
  sources: [{ kind: math }]
- id: R-M1-003
  module: m1
  if: "alguém {{t:bet|apostou}} e não quer continuar"
  then: "{{t:fold|desiste}}"
  because: "perde apenas o que já colocou; cada vez que {{t:call|paga}} sem motivo é uma perda adicional"
  level: math
  source: "cálculo: desistir termina a participação sem mais pagamentos, por isso a perda é apenas o que já foi colocado; pagar com uma mão com que não vai continuar aumenta a perda no valor pago"
  sources: [{ kind: math }]
- id: R-M1-004
  module: m1
  if: "a mão passa para a {{t:betting-round|ronda de apostas}} seguinte"
  then: "o flop são 3 {{t:community-cards|cartas comunitárias}}, o turn e o river uma cada; depois das apostas no river, os jogadores que restam (pelo menos dois) mostram as cartas (showdown)"
  because: "são estas as regras do Texas Hold'em: quatro {{t:betting-round|rondas de apostas}}, e o river é a última"
  level: rules
  source: "regras do Texas Hold'em: Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), secção 5 («Three boardcards are turned simultaneously … The next two boardcards are turned one at a time»); Wikipedia, Texas hold 'em (documento 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules }]

- id: R-M2-001
  module: m2
  if: "no flop tem {{n:draw.flush.seen}} cartas para um {{t:flush|flush}}"
  then: "tem {{n:outs.flush}} outs: cerca de {{n:odds.flush.flop-turn}} de probabilidade de {{t:flush|flush}} no turn, e cerca de {{n:odds.flush.flop-river}} até ao river apenas se vir as duas cartas sem mais {{t:bet|apostas}} (all-in)"
  because: "um naipe tem {{n:cards.per-suit}} cartas e vê {{n:draw.flush.seen}}; {{t:call|pagar}} uma {{t:bet|aposta}} no flop compra apenas uma carta"
  level: math
  source: "cálculo exato"
  sources: [{ kind: math }]
- id: R-M2-002
  module: m2
  if: "já contou os outs"
  then: "estima a probabilidade de acertar: outs × 2 com uma carta, outs × 4 com duas; perante uma {{t:bet|aposta}} no flop conta uma carta (× 2), e × 4 apenas se vir o turn e o river sem mais {{t:bet|apostas}} (all-in)"
  because: "pelo river o adversário pode obrigá-lo a pagar à parte; a regra do 2 e do 4 erra em cerca de {{n:rule24.error.max.pp}} pontos percentuais com até {{n:rule24.outs.max}} outs"
  level: math
  source: "site de formação, Poker drawing odds & outs explained (https://upswingpoker.com/poker-drawing-odds-outs-explained/): «For anything 10 outs or less, however, its accurate within 2% for the turn and river calculation»; cálculo: erro máximo de 1,7 pp com 10 outs (documento 12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/poker-drawing-odds-outs-explained/" }, { kind: math }]
- id: R-M2-003
  module: m2
  if: "o adversário aposta meio {{t:pot|pote}}"
  then: "para {{t:call|pagar}} precisa de {{n:eq.bet-half}} de equity"
  because: "paga 1 parte, e o {{t:pot|pote}} depois de {{t:call|pagar}} tem 4 partes ({{t:pot|pote}} 2, aposta 1, o que {{t:call|paga}} 1), por isso precisa de 1 das 4 partes"
  level: math
  source: "cálculo: aposta/(pote+2·aposta)"
  sources: [{ kind: math }]
- id: R-M2-004
  module: m2
  if: "o adversário aposta o {{t:pot|pote}} inteiro"
  then: "para {{t:call|pagar}} precisa de {{n:eq.bet-pot}} de equity"
  because: "paga 1 parte, e o {{t:pot|pote}} depois de {{t:call|pagar}} tem 3 partes ({{t:pot|pote}} 1, aposta 1, o que {{t:call|paga}} 1), por isso precisa de 1 das 3 partes"
  level: math
  source: "cálculo: aposta/(pote+2·aposta)"
  sources: [{ kind: math }]
- id: R-M2-005
  module: m2
  if: "a sua equity é menor do que a equity necessária (com um {{t:draw|draw}}: a probabilidade de acertar nas cartas que vai ver por esse preço)"
  then: "{{t:fold|desiste}} (sem argumentos adicionais, p. ex. implied odds)"
  because: "cada vez que {{t:call|paga}} nestas condições perde dinheiro a longo prazo"
  level: math
  check: { kind: draw-price, streets: [flop] }
  source: "cálculo: EV = equity × (pote depois de pagar) − valor a pagar; negativo quando equity < valor a pagar ÷ pote depois de pagar"
  sources: [{ kind: math }]

- id: R-M3-001
  module: m3
  if: "está no Button e todos antes de si {{t:fold|desistiram}}"
  then: "{{t:open|abre}} mais largo do que em qualquer outra {{t:position|posição}} antes dos blinds; só o {{t:small-blind|small blind}} {{t:open|abre}} de forma igualmente larga"
  because: "a partir do flop fala em último lugar e atrás de si restam apenas os blinds"
  level: gto
  source: "site de tabelas de solver, 6-max 100bb NL500 (https://beyondgto.com/ranges/btn-open-6max-100bb, https://beyondgto.com/ranges/sb-open-6max-100bb): BTN 42%, SB 44%; site de formação, Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/): SB um pouco mais largo do que o Button, 40–50%; site de tabelas de pré-flop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): BTN 40–45%, SB 39–47% (documento 12, D2)"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-002
  module: m3
  if: "todos {{t:fold|desistiram}} até si em {{t:utg|UTG}}"
  then: "{{t:open|abre}} cerca de {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} das mãos"
  because: "atrás de si ainda há cinco jogadores, por isso é mais frequente alguém ter uma mão melhor"
  level: gto
  check: { kind: solver-spot, players: [6], stackBb: [100], spots: [rfi.utg] }
  source: "site de um solver comercial, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/): UTG 17,6%; site de tabelas de solver (NL500, https://beyondgto.com/ranges/lj-open-6max-100bb, …/hj-…, …/co-…, …/btn-open-6max-100bb): UTG 17%, HJ 22%, CO 28%, BTN 42%; site de tabelas de pré-flop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): 15–17 / 19–22 / 25–28 / 40–45% (documento 12 M0–M3, D6)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/lj-open-6max-100bb" }]
- id: R-M3-003
  module: m3
  if: "todos {{t:fold|desistiram}} até si no Button"
  then: "{{t:open|abre}} cerca de {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} das mãos"
  because: "restam apenas os blinds e, depois do flop, terá {{t:position|posição}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.btn, nine.rfi.btn] }
  source: "site de tabelas de solver, BTN open 6-max 100bb (https://beyondgto.com/ranges/btn-open-6max-100bb, NL500): cerca de 42%; site de tabelas de pré-flop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): 40–45% (documento 12 M0–M3, D6)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-004
  module: m3
  if: "é o primeiro a entrar na mão"
  then: "{{t:raise|aumenta}} ou {{t:fold|desiste}}; não se limita a completar o blind (limp); no {{t:small-blind|small blind}} isto é uma simplificação: algumas soluções de solver fazem limp com parte das mãos"
  because: "um {{t:raise|aumento}} pode ganhar os blinds de imediato e dá-lhe a {{t:initiative|iniciativa}}; o limp abdica de ambas as coisas"
  level: heuristic
  check: { kind: no-limp, players: [6, 9], stackBb: [100] }
  source: "site de formação, Why limping is bad (https://upswingpoker.com/why-limping-in-poker-is-bad/): «If you make everyone fold preflop, you win 100% of the pot … You can't ever do that in a pot you've limped into»; site de tabelas de solver, open 6-max 100bb (https://beyondgto.com/ranges/lj-open-6max-100bb, o mesmo para HJ, CO, BTN): «raising rather than limping or jamming at this depth», SB (https://beyondgto.com/ranges/sb-open-6max-100bb): «At 100bb the whole range plays as raise-or-fold». Small blind: contradição no nível 2, site de formação com tabelas de solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics): «completes (limps) 20.5%»; o raise-or-fold no SB é uma simplificação assumida, porque a árvore do solver da aplicação não tem limps (D-144; documento 12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/why-limping-in-poker-is-bad/" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]
- id: R-M3-005
  module: m3
  if: "pode escolher entre as mesmas cartas do mesmo naipe e de naipes diferentes"
  then: "a mão do mesmo naipe (suited) é mais forte"
  because: "dá uma via adicional para ganhar com um {{t:flush|flush}}"
  level: math
  source: "cálculo de equity"
  sources: [{ kind: math }]
- id: R-M3-006
  module: m3
  if: "todos {{t:fold|desistiram}} até si no {{t:hijack|HJ}} ou no {{t:cutoff|CO}}"
  then: "{{t:open|abre}} mais largo do que em {{t:utg|UTG}} e mais apertado do que no Button; no {{t:cutoff|CO}} mais largo do que no {{t:hijack|HJ}}"
  because: "quanto menos jogadores restam atrás de si, menos vezes alguém tem uma mão melhor e mais vezes tem {{t:position|posição}} depois do flop"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.hj, rfi.co, nine.rfi.hj, nine.rfi.co] }
  source: "site de um solver comercial, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/): UTG 17,6%; site de tabelas de solver (NL500, https://beyondgto.com/ranges/hj-open-6max-100bb, https://beyondgto.com/ranges/co-open-6max-100bb): UTG 17%, HJ 22%, CO 28%, BTN 42%; site de tabelas de pré-flop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): 15–17 / 19–22 / 25–28 / 40–45% (documento 12 M0–M3, D6): o range de abertura cresce de UTG até ao Button"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/hj-open-6max-100bb" }]
- id: R-M3-007
  module: m3
  if: "é o primeiro a entrar na mão com um {{t:raise|aumento}}"
  then: "{{t:raise|aumenta}} para {{n:pf.open-size}} em qualquer {{t:position|posição}}, e no {{t:small-blind|small blind}} para {{n:pf.open-size-sb}} (simplificação)"
  because: "um único tamanho em todas as {{t:position|posições}} é simples e não revela a força da mão; no {{t:small-blind|small blind}} joga {{t:out-of-position|fora de posição}}, por isso {{t:raise|aumenta}} um pouco mais"
  level: heuristic
  check: { kind: open-size, players: [6, 9], stackBb: [100], params: { open: "n:pf.open-size", openSb: "n:pf.open-size-sb" } }
  source: "site de tabelas de pré-flop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts): «the standard open size is 2.5bb from all positions … 3bb from the small blind»; site de um solver comercial, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/): UTG 2bb, CO 2,3bb, BTN 2,5bb, SB 3bb (simplificação, documento 12, D8)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }]
- id: R-M3-008
  module: m3
  if: "tem uma das mãos mais fortes (AA, KK, QQ, AK) e alguém antes de si {{t:raise|aumentou}}"
  then: "normalmente volta a {{t:raise|aumentar}} (3-bet) por {{t:value|valor}}, em vez de apenas {{t:call|pagar}}"
  because: "estas mãos são favoritas contra a maioria das mãos com que o adversário {{t:open|abre}}; o 3-bet constrói o {{t:pot|pote}} e reduz o número de adversários"
  level: heuristic
  source: "site de tabelas de 3-bet, 3-bet ranges (https://pokerpro.tools/preflop/3-bet-ranges): QQ+ e AK na parte de valor contra todas as posições («Mostly 3-bet»); site de tabelas de pré-flop, UTG strategy (https://www.preflopwizard.app/blog/poker-utg-strategy): AA–JJ e AKs (documento 12, D9)"
  sources: [{ kind: training, url: "https://pokerpro.tools/preflop/3-bet-ranges" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-utg-strategy" }]
- id: R-M3-009
  module: m3
  if: "todos {{t:fold|desistiram}} até si no {{t:small-blind|small blind}}"
  then: "{{t:open|abre}} largo, cerca de {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}} das mãos, com um {{t:raise|aumento}} para {{n:pf.open-size-sb}} ou {{t:fold|desistindo}} (simplificação: algumas soluções de solver fazem limp com parte das mãos do {{t:small-blind|small blind}})"
  because: "já só joga contra o {{t:big-blind|big blind}}; depois do flop fala primeiro, por isso {{t:open|abre}} mais ou menos tão largo como no Button, e não muito mais"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.sb, nine.rfi.sb] }
  source: "site de tabelas de solver, SB open 6-max 100bb NL500 (https://beyondgto.com/ranges/sb-open-6max-100bb): cerca de 44%, raise-or-fold; site de formação, Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/): 40–50%; site de tabelas de pré-flop (https://www.preflopwizard.app/blog/6-max-preflop-charts): 39–47%; o intervalo 40–45% é a parte comum das estratégias sem limps (documento 12, D3). Simplificação raise-or-fold (D-144): site de formação com tabelas de solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics): «The small blind raises (3bb) 33.1% : completes (limps) 20.5%»"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]

- id: R-M3-010
  module: m3
  if: "joga numa mesa de 9 jogadores e todos antes de si {{t:fold|desistiram}}"
  then: "em {{t:utg|UTG}}, {{t:utg|UTG}}+1 e {{t:utg|UTG}}+2 {{t:open|abre}} mais apertado do que em {{t:utg|UTG}} numa mesa de 6 jogadores; a partir de LJ joga como numa mesa de 6 jogadores (LJ como {{t:utg|UTG}})"
  because: "atrás de si estão sentados mais jogadores do que numa mesa de 6, por isso é mais frequente alguém ter uma mão melhor; quando os primeiros jogadores {{t:fold|desistem}}, atrás de LJ restam tantos jogadores como atrás de {{t:utg|UTG}} numa mesa de 6"
  level: heuristic
  check: { kind: solver-spot, players: [9], stackBb: [100], spots: [nine.rfi.utg, nine.rfi.utg1, nine.rfi.utg2, nine.rfi.lj] }
  source: "solver de pré-flop do projeto, mesa de 9 jogadores 100bb (ADR-20; documento 10, «Medição N9a final»: validação parcial N1–N4, NashConv 0,0094bb; composição de UTG–UTG+2 não verificada e frequências sem validação de nível 2 (D-153), por isso a regra indica apenas a direção, sem números do solver; nível heuristic, D-144). Consistente com o intervalo comum das tabelas 9-max de nível 4: UTG cerca de 9–13%, UTG+1 cerca de 11–14% (site de tabelas de pré-flop, 9-Max Preflop Chart, https://preflopwizard.app/blog/9-max-preflop-chart; segundo site de tabelas de pré-flop, https://about-poker.com/preflop-gto/preflop-range-chart-cash-game; documento 10, «Configuração 9-max 100bb»). O jogo depois de UTG–UTG+2 desistirem é exatamente o jogo 6-max (teste da árvore)"
  sources: [{ kind: training, url: "https://preflopwizard.app/blog/9-max-preflop-chart" }, { kind: training, url: "https://about-poker.com/preflop-gto/preflop-range-chart-cash-game" }, { kind: solver-app }]
# M4: gra wobec akcji preflop. Reguły „heuristic” pochodzą z literatury, nie z solvera aplikacji (dokument 11).
- id: R-M4-001
  module: m4
  if: "alguém {{t:open|abriu}} e quer {{t:raise|aumentar}} (3-bet) {{t:in-position|em posição}}"
  then: "{{t:raise|aumenta}} para cerca de {{n:pf.3bet.size-ip}} o valor da {{t:open|abertura}}; com uma {{t:open|abertura}} de {{n:pf.open-size}} são {{n:pf.3bet.ip-total}}"
  because: "este tamanho dá uma boa relação entre o stack e o {{t:pot|pote}} no flop e não dá ao adversário um preço barato"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-ip", position: ip } }
  source: "site de formação, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide); árvore do solver da aplicação"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-002
  module: m4
  if: "{{t:raise|aumenta}} uma {{t:open|abertura}} (3-bet) {{t:out-of-position|fora de posição}}, p. ex. dos blinds contra uma {{t:open|abertura}} do {{t:cutoff|CO}} ou do Button"
  then: "{{t:raise|aumenta}} para cerca de {{n:pf.3bet.size-oop}} o valor da {{t:open|abertura}}; com uma {{t:open|abertura}} de {{n:pf.open-size}} são {{n:pf.3bet.oop-total}}"
  because: "depois do flop falará primeiro, por isso, com um {{t:raise|aumento}} maior, tira ao adversário a possibilidade de {{t:call|pagar}} barato {{t:in-position|em posição}}"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-oop", position: oop } }
  source: "site de formação, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide); árvore do solver da aplicação"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-003
  module: m4
  if: "está no {{t:small-blind|small blind}} e o {{t:cutoff|CO}} ou o Button {{t:open|abriu}}"
  then: "quase nunca {{t:call|paga}}: faz 3-bet ou {{t:fold|desiste}} (contra o {{t:cutoff|CO}} é uma simplificação: a solução publicada calcula o spot contra o Button); contra o Button faz 3-bet com a parte de cima do {{t:range|range}} (cerca de {{n:pf.3bet-freq.sb-vs-btn}} das mãos, entre elas 77+ (55 e 66 com frequência), AJo+, KQo, A5s, A4s, T9s), e com o resto {{t:fold|desiste}}"
  because: "depois de {{t:call|pagar}} no {{t:small-blind|small blind}} joga {{t:out-of-position|fora de posição}}, e o {{t:big-blind|big blind}} atrás de si ainda pode {{t:raise|aumentar}}; o 3-bet dá a {{t:initiative|iniciativa}} e a hipótese de ganhar o {{t:pot|pote}} de imediato"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.sb-vs-btn, nine.vs-open.sb-vs-btn] }
  source: "site de tabelas de solver, SB vs BTN (https://beyondgto.com/defense/sb-vs-btn), NL500, 100bb: «GTO defends the Small Blind with about 18% of hands - roughly 5% as a flat call and 13% as a 3-bet», 55 3-bet 57%, 66 62%; site de um solver comercial, Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/), NL500, SB vs BTN: «the SB barely calls anything. Instead, they almost exclusively 3-bet or fold», generalização para o small blind: «As a simplification, don’t cold-call from the SB: Play a 3-bet or fold strategy.»; site de formação, 3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/): «3-bet-or-fold strategies from every position except the Big Blind» (documento 10, resolução B-045: o conteúdo de R-M4-015 integrado em R-M4-003; o número de 14% do gráfico substituído pelo texto lido, E1)"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/sb-vs-btn" }, { kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-004
  module: m4
  if: "está no {{t:big-blind|big blind}}, o Button {{t:open|abriu}} para {{n:pf.open-size}} e o {{t:small-blind|small blind}} {{t:fold|desistiu}}"
  then: "defende largo, porque para {{t:call|pagar}} precisa apenas de cerca de {{n:eq.bb-vs-btn-open}} de equity"
  because: "paga pouco para um {{t:pot|pote}} grande; as soluções de solver publicadas defendem aqui cerca de {{n:pf.bb-def.vs-btn.pub.low}}–{{n:pf.bb-def.vs-btn.pub.high}} das mãos"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-btn, nine.vs-open.bb-vs-btn] }
  source: "cálculo do preço; site de tabelas de solver, BB vs BTN (https://beyondgto.com/defense/bb-vs-btn), NL500: «GTO defends the Big Blind with about 45% of hands»; escola que publica resultados de solver (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), NL200: «3-bets 11.5% to 11bb and calls 29.0%»; solver de pré-flop do projeto (ADR-20) apenas na grelha e na avaliação jogar/desistir, a sua defesa total sem validação (D-153)"
  sources: [{ kind: math }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-app }]
- id: R-M4-005
  module: m4
  if: "com {{t:position|posição}}, {{t:raise|aumenta}} uma {{t:open|abertura}} do {{t:cutoff|CO}}"
  then: "faz 3-bet sobretudo com as melhores mãos do topo e junta alguns {{t:bluff|bluffs}} com ases do mesmo naipe (A5s, A4s); as mãos médias (p. ex. 77–99, AJs, ATs, {{t:connectors|conectores}} do mesmo naipe) joga de forma mista: com parte faz 3-bet, com parte {{t:call|paga}}. O Button contra o {{t:cutoff|CO}} costuma fazer 3-bet com cerca de {{n:pf.3bet-freq.btn-vs-co.low}}–{{n:pf.3bet-freq.btn-vs-co.high}} das mãos e {{t:call|pagar}} com cerca de {{n:pf.call-freq.btn-vs-co.low}}–{{n:pf.call-freq.btn-vs-co.high}}"
  because: "o adversário {{t:call|paga}} muitas vezes, por isso quer ter uma mão que jogue bem num {{t:pot|pote}} em que ele {{t:call|pagou}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.btn-vs-co, nine.vs-open.btn-vs-co] }
  source: "site de um solver comercial, Playing Calls From the Button in Cash Games (https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/), NL500, 100bb: «Against a CO open, BTN will 3-bet ~12% of hands, while calling only 5%.»; site de tabelas de solver, BTN vs CO (https://beyondgto.com/defense/btn-vs-co), NL500, 100bb: «roughly 9% as a flat call and 10% as a 3-bet»; escola que publica resultados de solver (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), NL200: «the solver 3-bets 12.5% of hands to 7.5bb and calls only 3.0%», «55–22 most of the time» desistência; os intervalos abrangem três fontes de nível 2, a composição é a sua parte comum: topo em 3-bet, meio misto (D-144; antes decisão A2, documento 10). O solver da aplicação não reproduz esta divisão (quase nunca paga), por isso a grelha e a avaliação no modo de jogo verificam apenas «jogar / desistir»; site de formação, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide), tabela BTN vs CO: «QQ+, AKs, AKo, AQs (mixed), A5s, A4s…»; um site de formação (https://gtogecko.com/blog/gto-preflop-strategy) chama ao range linear, e o site de tabelas de pré-flop polarizado (documento 12 M4–M6, D-02)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/" }, { kind: solver-pub, url: "https://beyondgto.com/defense/btn-vs-co" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://gtogecko.com/blog/gto-preflop-strategy" }, { kind: training }]
- id: R-M4-006
  module: m4
  if: "do {{t:big-blind|big blind}} {{t:raise|aumenta}} a {{t:open|abertura}} do Button"
  then: "faz 3-bet com as mãos mais fortes (TT+, AQ+, AJs+) mais {{t:bluff|bluffs}} da parte de baixo do {{t:range|range}} com que {{t:call|paga}}: A5s, por vezes A4s, e {{t:connectors|conectores}} do mesmo naipe; com os {{t:pair|pares}} médios e pequenos, KQo e ases de naipes diferentes (AJo–A9o) normalmente {{t:call|paga}}"
  because: "do {{t:big-blind|big blind}} {{t:call|paga}} barato e fecha a ação, por isso as mãos médias ganham mais ao {{t:call|pagar}}, e o 3-bet fica para as mãos que querem um {{t:pot|pote}} grande e para os {{t:bluff|bluffs}} que jogam bem quando lhes {{t:call|pagam}} (os ases do mesmo naipe bloqueiam AA e AK)"
  level: gto
  source: "site de um solver comercial, Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/), NL500, BB vs BTN: «TT+, AJs+, and AQo+ are 3-bet purely», bluffs «near the bottom of our calling range»; site de tabelas de solver, BB vs BTN (https://beyondgto.com/defense/bb-vs-btn): «A5s · 3-bet 100%». A regra aplica-se apenas à abertura do Button (D-144): contra o small blind, as fontes de nível 2 não concordam quanto aos bluffs (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics: «A5s calls 96% of the time rather than turning into a three-bet bluff»; https://beyondgto.com/defense/bb-vs-sb: «A5s · 3-bet 4% · call 96%»; site de um solver comercial, Range Morphology, https://blog.gtowizard.com/preflop-range-morphology/: bluffs do fundo do range), por isso a lição diz apenas que contra o small blind faz 3-bet sobretudo por valor e com A5s e conectores do mesmo naipe normalmente paga; escola que publica resultados de solver, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide) e Big blind defence (https://poker.academy/blog/post/big-blind-basics-explained-useful-tips-for-poker-players), NL200 e NL50 GG; site de formação, Blind vs Blind Without a Solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics), tabelas desse site; site de formação, 3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/), tabelas de solver desse site. Simplificação: a composição depende do rake e do tamanho do 3-bet; 99, KQo e AJo são por vezes mistos (documento 10, resolução B-045)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-007
  module: m4
  if: "recebe um 3-bet de um jogador que terá {{t:position|posição}} depois do flop"
  then: "{{t:fold|desiste}} com cerca de {{n:pf.vs3bet.fold.low}}–{{n:pf.vs3bet.fold.high}} das suas {{t:open|aberturas}}, {{t:call|paga}} com cerca de {{n:pf.vs3bet.call.low}}–{{n:pf.vs3bet.call.high}} e faz 4-bet com cerca de {{n:pf.vs3bet.4bet.low}}–{{n:pf.vs3bet.4bet.high}}"
  because: "se desistir mais vezes do que {{n:alpha.vs-3bet-ip-size}}, o adversário lucra fazendo 3-bet com qualquer mão, por isso {{t:fold|desiste}} logo abaixo desse limiar"
  level: heuristic
  source: "intervalo próximo das fontes, com o limite superior de desistências logo abaixo do limiar calculado (ADR-24): escola que publica resultados de solver, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), solver NL200, CO perante 3-bet do Button para 7,5bb: desistência 63,7%, pagamento 17,2%, 4-bet 19,1%; site de tabelas de formação simplificadas, tabelas de formação simplificadas (https://pailiku.com/charts/co-vs-btn-3bet), convertidas para o range de abertura do CO: cerca de 66/23/11; HUD cerca de 55% de desistências; site de formação 50–55/30–40/5–8 (nível 4, diverge); limiar por cálculo (documento 12 M4–M6, D-04)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training }, { kind: math }]
- id: R-M4-008
  module: m4
  if: "recebe um 3-bet e depois do flop estará {{t:out-of-position|fora de posição}}"
  then: "{{t:call|paga}} sobretudo com cartas altas do mesmo naipe, ases fortes do mesmo naipe, {{t:pair|pares}} médios e altos e parte dos {{t:connectors|conectores}} do mesmo naipe; com mãos mais fracas de naipes diferentes (KJo, ATo, QTo) {{t:fold|desiste}}"
  because: "as mãos de naipes diferentes estão muitas vezes dominadas e {{t:equity-realization|realizam mal a equity}} {{t:out-of-position|fora de posição}}"
  level: heuristic
  source: "site de formação, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide), CO vs BTN 3-bet: «Call QQ, JJ, TT, 99, 88, AQs, AJs, KQs, KJs, QJs, JTs, T9s, 77, 66 Fold Marginal offsuit broadways»; site de tabelas de formação simplificadas (https://pailiku.com/charts/co-vs-btn-3bet): «Call JJ-77, AQs-ATs, AKs, KQs-KJs, QJs, JTs, T9s, 98s, 87s, 76s, 65s»; site de formação, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/): «calling with fewer suited connectors, suited gappers and offsuit broadway hands»"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }]
- id: R-M4-009
  module: m4
  if: "recebe um 3-bet e depois do flop terá {{t:position|posição}}"
  then: "{{t:call|paga}} mais largo: {{t:pair|pares}} de 66 a TT, mãos do mesmo naipe com cartas altas e {{t:connectors|conectores}} do mesmo naipe; com os {{t:pair|pares}} mais baixos {{t:fold|desiste}}"
  because: "{{t:in-position|em posição}} é mais fácil realizar a equity e ganhar um {{t:pot|pote}} grande quando acerta"
  level: heuristic
  source: "site de formação, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/): com os pares mais baixos desiste-se «even with position»; um site de formação admite pagar com pares pequenos em posição (documento 12 M4–M6, D-05)"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training }]
- id: R-M4-010
  module: m4
  if: "recebe um 3-bet com AA, KK ou AK"
  then: "normalmente faz 4-bet (por {{t:value|valor}}); com AK por vezes também {{t:call|paga}}"
  because: "estas mãos querem colocar o stack inteiro e dominam a maioria das mãos que vão {{t:call|pagar}} o 4-bet"
  level: heuristic
  source: "site de formação, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/): AK «should be 4-bet with 100% frequency» (Button vs BB); site de formação, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide): «4-bet value KK+, AKs (mixed), AKo (mixed)»; site de tabelas de formação simplificadas (https://pailiku.com/charts/co-vs-btn-3bet): «4-bet QQ+, AKo, A5s-A4s Call JJ-77, AQs-ATs, AKs»"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }]
- id: R-M4-011
  module: m4
  if: "faz 4-bet"
  then: "{{t:raise|aumenta}} para cerca de {{n:pf.4bet.size-ip.low}}–{{n:pf.4bet.size-ip.high}} o valor do 3-bet {{t:in-position|em posição}} e {{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}} {{t:out-of-position|fora de posição}}"
  because: "depois de lhe {{t:call|pagarem}} um 4-bet destes, nos stacks restam cerca de {{n:spr.4bet.high}}–{{n:spr.4bet.oop}} vezes o que está no {{t:pot|pote}} ({{t:in-position|em posição}}, p. ex. 4-bet do Button contra um 3-bet do {{t:small-blind|small blind}} para {{n:pf.3bet.oop-total}}: cerca de {{n:spr.4bet.high}}–{{n:spr.4bet}}; {{t:out-of-position|fora de posição}}, p. ex. 4-bet do {{t:cutoff|CO}} contra um 3-bet do Button para {{n:pf.3bet.ip-total}}: cerca de {{n:spr.4bet.oop}}), por isso as boas mãos colocam facilmente o resto"
  level: heuristic
  source: "escola que publica resultados de solver, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), solver NL200: CO fora de posição faz 4-bet para 17,2bb, ou seja, 2,3 vezes um 3-bet para 7,5bb; site de formação, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide): 2,2–2,5x em posição, 2,5–3x fora de posição (no seu exemplo 2,4x); SPR por cálculo (documento 12 M4–M6, D-06)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: math }]
- id: R-M4-012
  module: m4
  if: "antes de si, um ou mais jogadores apenas igualaram o {{t:big-blind|big blind}} (limp)"
  then: "{{t:raise|aumenta}} para {{n:pf.iso.base}} mais {{n:pf.iso.per-limper}} por cada limper, e {{t:out-of-position|fora de posição}} mais {{n:pf.iso.oop-extra}}"
  because: "um {{t:raise|aumento}} menor dá aos limpers um preço demasiado bom e não lhes tira a mão"
  level: heuristic
  check: { kind: iso-size, players: [6, 9], stackBb: [100], params: { base: "n:pf.iso.base", perLimper: "n:pf.iso.per-limper", oopExtra: "n:pf.iso.oop-extra" } }
  source: "site de formação, 10 Tips for Crushing Limpers (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm): «Raise to 3bb+1bb per limper when playing online, and 4bb+1bb per limper when playing live»; site de tabelas de pré-flop, ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy): «Base open size (3bb) + 1 big blind per limper», «Add 1bb more from OOP positions». O tamanho aplica-se ao jogo online"
  sources: [{ kind: training, url: "https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }]
- id: R-M4-013
  module: m4
  if: "antes de si fazem limp vários jogadores"
  then: "{{t:raise|aumenta}} com um {{t:range|range}} mais apertado, sobretudo por {{t:value|valor}}; com mãos especulativas (pequenos {{t:pair|pares}}, {{t:connectors|conectores}} do mesmo naipe) {{t:in-position|em posição}} pode completar"
  because: "cada limper adicional aumenta a probabilidade de alguém {{t:call|pagar}}, por isso o {{t:bluff|bluff}} no pré-flop perde valor"
  level: heuristic
  source: "site de tabelas de pré-flop, ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy): «Against multiple limpers, tighten each range by roughly one tier», sobre completar: «This is almost always wrong»; site de formação (https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm): «limp behind with those suited connectors, small pairs»; site de formação (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm): «over-limping, which can be fine». Contradição no nível 4: ambas as jogadas são corretas (ADR-04, D-144)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }, { kind: training, url: "https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm" }]
- id: R-M4-014
  module: m4
  if: "está no {{t:big-blind|big blind}} e o {{t:small-blind|small blind}} {{t:open|abriu}} para {{n:pf.open-size-sb}}"
  then: "defende largo, mais de metade das mãos, embora para {{t:call|pagar}} precise de cerca de {{n:eq.bb-vs-sb-open}} de equity; o 3-bet é de cerca de {{n:pf.3bet.size-ip}} o valor da {{t:open|abertura}}"
  because: "depois do flop tem {{t:position|posição}}, por isso realiza mais equity; a solução de solver publicada defende aqui cerca de {{n:pf.bb-def.vs-sb.pub}} das mãos"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-sb, nine.vs-open.bb-vs-sb] }
  source: "cálculo do preço; solver de pré-flop do projeto (ADR-20); árvore do solver (3-bet para 9bb); site de tabelas de solver, BB vs SB (https://beyondgto.com/defense/bb-vs-sb), NL500, 100bb: «GTO defends the Big Blind with about 56% of hands»"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-sb" }, { kind: math }, { kind: solver-app }]

# M5: c-bet na flopie. Pula po otwarciu i jednym sprawdzeniu, 100bb. Definicje tekstur liczy poker-core (texture.ts),
# punkty i progi mokrości są w numbers.yaml (tex.*). Reguły strategiczne według rejestru decyzji D-01–D-21
# (dokument 12 M4–M6); bez częstotliwości w procentach.
- id: R-M5-001
  module: m5
  if: "o flop soma menos de {{n:tex.threshold.medium}} pontos de {{t:wetness|humidade}}: uma {{t:straight|sequência}} possível de várias formas (com pelo menos dois conjuntos de dois valores) dá {{n:tex.points.straight.made}} pts, uma {{t:straight|sequência}} possível de uma só forma {{n:tex.points.straight.made-one}}, só um {{t:straight-draw|draw de sequência}} {{n:tex.points.straight.draw}}, duas cartas do mesmo naipe {{n:tex.points.suits.two-tone}}, três do mesmo naipe {{n:tex.points.suits.monotone}}"
  then: "é um flop {{t:dry|seco}}: há poucos {{t:draw|draws}} e ninguém tem ainda uma {{t:straight|sequência}} nem um {{t:flush|flush}} feitos"
  because: "as cartas seguintes raramente mudam o líder, por isso a melhor mão no flop costuma continuar a ser a melhor"
  level: rules
  source: "definição de textura na aplicação (poker-core, texture.ts: WETNESS_POINTS, WETNESS_THRESHOLDS); conceito de flop seco: site de formação, Sizing Your C-Bets; site de formação, What Is a Continuation Bet; exemplos de flops secos: site de formação (K72r, A94r), site de formação (AA6r); a fronteira seco/intermédio é uma convenção da aplicação"
  sources: [{ kind: training }, { kind: training }]
- id: R-M5-002
  module: m5
  if: "o flop soma pelo menos {{n:tex.threshold.wet}} pontos de {{t:wetness|humidade}} (pontos como na definição de flop {{t:dry|seco}})"
  then: "é um flop {{t:wet|molhado}}: o adversário tem muitas vezes {{t:draw|draws}} e por vezes já uma {{t:straight|sequência}} ou um {{t:flush|flush}}"
  because: "as cartas seguintes mudam muitas vezes o líder, por isso a mão que agora é a melhor está menos segura"
  level: rules
  source: "definição de textura na aplicação (poker-core, texture.ts: WETNESS_POINTS, WETNESS_THRESHOLDS); conceito de flop molhado: site de formação, Sizing Your C-Bets; site de formação, What Is a Continuation Bet; exemplos de flops molhados: site de formação (987, QJT), site de formação, Bet Sizing Strategy: 8 Rules (T954, https://upswingpoker.com/bet-size-strategy-tips-rules/); a fronteira intermédio/molhado é uma convenção da aplicação"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: training }]
- id: R-M5-003
  module: m5
  if: "{{t:open|abriu}} antes do flop, o {{t:big-blind|big blind}} {{t:call|pagou}} e no flop há um ás ou um rei"
  then: "tem {{t:range-advantage|vantagem de range}}: em média, as suas mãos são mais fortes do que as do adversário"
  because: "o {{t:big-blind|big blind}} {{t:raise|aumenta}} antes do flop com a maioria dos AA, KK e AK, por isso, depois de apenas {{t:call|pagar}}, tem poucos, enquanto o seu range os tem todos"
  level: heuristic
  source: "site de um solver comercial, Range advantage (glossário); site de um solver comercial, The Turn Probe Bet («BB lacks the stronger Ace-highs because they would have 3-bet with them preflop»)"
  sources: [{ kind: solver-pub }]
- id: R-M5-004
  module: m5
  if: "{{t:open|abriu}} antes do flop e o flop é baixo e {{t:connected|conectado}} ou {{t:semi-connected|semiconectado}}, p. ex. 7-6-5"
  then: "faz c-bet menos vezes do que em flops altos, e muitas mãos {{t:check|passam}}"
  because: "o {{t:big-blind|big blind}} defende muitos {{t:connectors|conectores}} e mãos com cartas pequenas, que acertam no flop baixo, e as suas cartas altas falharam; num flop {{t:connected|conectado}}, ele também tem {{t:straight|sequências}} e {{t:two-pair|dois pares}}, por isso a si normalmente falta {{t:nuts-advantage|vantagem de nuts}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "site de um solver comercial, Flop Heuristics: IP C-Betting in Cash Games (https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/, BTN vs BB: «a large portion of their range consists of low-card holdings because of the preflop discount posed by the blinds. We connect better with high-card boards and get to bet more.»; «flopped straights often being in the BB’s range»; «Size down and bet less on flops that complete straights and flushes in your opponent’s range»); site de um solver comercial, Flop Heuristics: IP C-Betting in MTTs (https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-mtts/; outro spot: BTN vs SB, 40bb; em flops conectados «the raiser generally does not have a nuts advantage»; simplificação: transposto direcionalmente para BTN vs BB em cash game, de acordo com o artigo sobre cash game); site de um solver comercial, Bullying the Blinds (https://blog.gtowizard.com/bullying-the-blinds-with-continuation-bets/, 20bb, 654r: «BB’s advantage at the top end», o Button passa com mais de metade do range); site de formação, 3 Concepts That Should Shape Your Postflop Strategy («the Big Blind will often have the nut advantage», https://upswingpoker.com/nut-range-positional-advantage/)"
  sources: [{ kind: solver-pub }, { kind: training, url: "https://upswingpoker.com/nut-range-positional-advantage/" }]
- id: R-M5-005
  module: m5
  if: "o seu {{t:range|range}} tem muitas mais mãos fortíssimas do que o do adversário ({{t:nuts-advantage|vantagem de nuts}})"
  then: "pode apostar com um tamanho maior; quando tem apenas {{t:range-advantage|vantagem de range}}, aposta pouco"
  because: "uma {{t:bet|aposta}} grande extrai mais das mãos médias do adversário, e raramente encontra uma mão melhor que responda com um {{t:raise|aumento}}"
  level: heuristic
  source: "site de um solver comercial, The Mechanics of C-Bet Sizing; site de um solver comercial, Range advantage (glossário)"
  sources: [{ kind: solver-pub }]
- id: R-M5-006
  module: m5
  if: "o adversário tem uma mão sem {{t:pair|par}}"
  then: "o flop não emparelha nenhuma das cartas dele em cerca de {{n:flop.miss.unpaired}} dos casos"
  because: "das {{n:cards.unseen.preflop}} cartas desconhecidas, só {{n:pair.outs.unpaired}} emparelham a mão dele, e o flop são apenas {{n:cards.board.flop}} cartas"
  level: math
  source: "cálculo exato (poker-core); consistente com um site de calculadoras de póquer (28,96% + 2,02% + 1,45% = 32,4% de acerto)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M5-007
  module: m5
  if: "como {{t:aggressor|agressor}} no pré-flop tem {{t:position|posição}} e o flop é {{t:dry|seco}} e alto, p. ex. K-7-2 de três naipes"
  then: "faz c-bet com frequência e com um tamanho pequeno, cerca de {{n:cbet.size.small}} do {{t:pot|pote}} (simplificação: nestes flops o solver também usa {{t:overbet|overbet}})"
  because: "tem {{t:range-advantage|vantagem de range}}, e as mãos fracas do adversário quase não têm hipóteses: uma {{t:bet|aposta}} pequena basta para que ele {{t:fold|desista}}, e os {{t:pair|pares}} piores continuam a {{t:call|pagar}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "site de um solver comercial, Flop Heuristics: IP C-Betting in Cash Games (33%); site de formação, Bet Sizing Strategy: 8 Rules («Bet small (25-35% pot) on dry, static board textures», https://upswingpoker.com/bet-size-strategy-tips-rules/); site de formação, What Is a Continuation Bet (K72r); site de formação, Picking the Proper C-Bet Sizing on Ace-High Boards (1/3 do pote)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M5-008
  module: m5
  if: "como {{t:aggressor|agressor}} no pré-flop tem {{t:position|posição}} e o flop dá ao adversário muitos {{t:draw|draws}}, mas uma {{t:straight|sequência}} ainda não é possível, p. ex. K-J-7 {{t:two-tone|bicolor}}"
  then: "faz c-bet menos vezes, mas com um tamanho maior, p. ex. {{n:cbet.size.big}} do {{t:pot|pote}}; as mãos médias sem {{t:draw|draw}} {{t:check|passam}} com mais frequência; quando uma {{t:straight|sequência}} já é possível, p. ex. J-T-8, os solvers apostam com um tamanho menor"
  because: "os {{t:draw|draws}} do adversário têm muita equity, por isso uma {{t:bet|aposta}} grande obriga-os a pagar caro pela carta seguinte"
  level: heuristic
  source: "site de um solver comercial, Flop Heuristics: IP C-Betting in Cash Games («increased use of the 66% pot bet size, but decreased overall betting frequency»); site de formação, Bet Sizing Strategy: 8 Rules (55–80%, https://upswingpoker.com/bet-size-strategy-tips-rules/); site de formação, Picking the Proper C-Bet Sizing on Ace-High Boards (2/3 do pote)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }]
- id: R-M5-009
  module: m5
  if: "como {{t:aggressor|agressor}} no pré-flop tem {{t:position|posição}} e o flop é {{t:paired|emparelhado}}, p. ex. Q-Q-6"
  then: "faz c-bet com frequência e com um tamanho pequeno"
  because: "tem {{t:range-advantage|vantagem de range}}, e num flop {{t:paired|emparelhado}} é difícil ter um {{t:draw|draw}}, por isso um adversário sem {{t:pair|par}} raramente pode {{t:call|pagar}} sequer uma {{t:bet|aposta}} pequena; uma {{t:bet|aposta}} grande não compensa, porque qualquer um dos dois pode ter {{t:three-of-a-kind|trio}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "site de um solver comercial, Flop Heuristics: IP C-Betting in Cash Games («Paired flops are bet significantly more often… only be bet for small sizing… reduced nut advantage from trips being in both player's ranges»; «On paired boards, it's also much harder to have a draw»)"
  sources: [{ kind: solver-pub }]
- id: R-M5-010
  module: m5
  if: "como {{t:aggressor|agressor}} no pré-flop tem {{t:position|posição}} e o flop é {{t:monotone|monocolor}} (três cartas do mesmo naipe)"
  then: "faz c-bet menos vezes do que o habitual e com um tamanho pequeno"
  because: "qualquer jogador pode já ter um {{t:flush|flush}}, por isso a {{t:nuts-advantage|vantagem de nuts}} do {{t:aggressor|agressor}} diminui, e num {{t:pot|pote}} grande o {{t:flush|flush}} do adversário sai cara"
  level: heuristic
  source: "site de um solver comercial, Flop Heuristics: IP C-Betting in Cash Games («Monotone boards see a drastic decrease in betting frequency and sizing», BTN vs BB, https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/); site de um solver comercial, The Mechanics of C-Bet Sizing («when a very wet board like Q♦8♦7♦ is dealt, the bet sizing comes down again», https://blog.gtowizard.com/the-mechanics-of-c-bet-sizing/): um flop molhado não significa aposta grande; site de formação, Monotone Flops (Kanu7, resultados de solver: «c-betting half the time for a 25-33% pot sizing», https://upswingpoker.com/monotone-flops-kanu7/); decisão D-39 (documento 12 M4–M6, relatório 12a-22)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/monotone-flops-kanu7/" }]
- id: R-M5-011
  module: m5
  if: "faz c-bet sem mão nenhuma, contando apenas que o adversário {{t:fold|desista}}"
  then: "com uma {{t:bet|aposta}} de {{n:cbet.size.small}} do {{t:pot|pote}}, o adversário tem de {{t:fold|desistir}} em mais de {{n:alpha.cbet.small}} dos casos, e com {{n:cbet.size.big}} do {{t:pot|pote}} em mais de {{n:alpha.cbet.big}}"
  because: "arrisca a aposta para ganhar o {{t:pot|pote}}: o limiar é aposta ÷ ({{t:pot|pote}} + aposta)"
  level: math
  source: "cálculo: alpha = aposta / (pote + aposta)"
  sources: [{ kind: math }]
- id: R-M5-012
  module: m5
  if: "{{t:open|abriu}} antes do flop e o adversário {{t:call|pagou}} com {{t:position|posição}} (p. ex. o Button contra a sua {{t:open|abertura}} do {{t:cutoff|CO}})"
  then: "faz c-bet menos vezes do que {{t:in-position|em posição}} e {{t:check|passa}} mais vezes, também com boas mãos"
  because: "o {{t:range|range}} de quem {{t:call|paga}} com {{t:position|posição}} é {{t:condensed|condensado}}: com as mãos fracas {{t:fold|desistiu}} e com parte das mais fortes {{t:raise|aumentou}}, por isso ficou sobretudo com mãos médias e boas; além disso, depois do flop é a si que cabe falar primeiro em todas as {{t:street|rondas}}"
  level: heuristic
  source: "site de um solver comercial, C-Betting As the OOP Preflop Raiser (UTG vs BTN c-bet 28%; «Even a hand like top pair top kicker is preferred to be played as a check-call»); site de formação, C-Betting On Ace-High Boards (CO vs BTN, A94r: «we will check over 96% of the time»)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M5-013
  module: m5
  if: "no flop tem dois ou mais adversários"
  then: "faz c-bet muito menos vezes, sobretudo com mãos fortes e {{t:draw|draws}} fortes; faz pouco {{t:bluff|bluff}} e, quando aposta, aposta pouco"
  because: "cada adversário adicional aumenta a probabilidade de alguém ter acertado: duas mãos sem {{t:pair|par}} falham ao mesmo tempo apenas em cerca de {{n:flop.miss.two}} dos casos"
  level: heuristic
  source: "site de formação, Multiway Pots in Poker; site de formação, C-Betting in Multiway Pots («Check even pocket kings… the solver checks its entire range»; «around a quarter to a third of pot»); cálculo exato: C(36,3)/C(48,3)"
  sources: [{ kind: training }, { kind: training }, { kind: math }]

# M6: obrona na flopie. Matematyka z formuł (numbers.yaml); zalecenia według rejestru decyzji D-22–D-38 (dokument 12
# M4–M6) i D1 (dokument 12 M7–M9).
- id: R-M6-001
  module: m6
  if: "o adversário aposta no river 1/3 do {{t:pot|pote}}"
  then: "em teoria defende ({{t:call|paga}} ou {{t:raise|aumenta}}) com cerca de {{n:mdf.bet-third}} do {{t:range|range}}; é esse o {{t:mdf|MDF}}"
  because: "um {{t:bluff|bluff}} sem hipóteses arrisca 1 parte para ganhar 3; se {{t:fold|desistir}} mais vezes do que {{n:alpha.bet-third}}, o adversário lucra fazendo {{t:bluff|bluff}} com quaisquer cartas"
  level: math
  source: "cálculo: MDF = pote/(pote+aposta); site de formação, MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker: «The framework is a starting point, not a rule»)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }, { kind: math }]
- id: R-M6-002
  module: m6
  if: "faz {{t:bluff|bluff}} com uma mão sem hipóteses de ganhar"
  then: "o {{t:bluff|bluff}} é lucrativo quando o adversário {{t:fold|desiste}} mais vezes do que alpha = aposta/({{t:pot|pote}}+aposta); com uma aposta de meio {{t:pot|pote}} isso dá {{n:alpha.bet-half}}"
  because: "arrisca a aposta para ganhar o {{t:pot|pote}}; quanto maior a aposta, mais vezes o adversário tem de {{t:fold|desistir}}"
  level: math
  source: "cálculo: alpha = aposta/(pote+aposta); site de um solver comercial, MDF & Alpha (https://blog.gtowizard.com/mdf-alpha)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: math }]
- id: R-M6-003
  module: m6
  if: "recebe uma aposta no flop {{t:out-of-position|fora de posição}}"
  then: "pode defender menos do que indica o {{t:mdf|MDF}} (nos flops maus para quem defende, claramente menos); trata o {{t:mdf|MDF}} como ponto de referência, não como obrigação, mas contra c-bets pequenos não {{t:fold|desiste}} em massa"
  because: "os {{t:bluff|bluffs}} do adversário ainda têm equity e podem melhorar, e {{t:out-of-position|fora de posição}} não realiza toda a equity das suas mãos fracas"
  level: heuristic
  source: "site de um solver comercial, MDF & Alpha (https://blog.gtowizard.com/mdf-alpha: «On average, BB is consistently over-folding to all bet sizes on the flop»; em posição «calls much closer to MDF on average»); num exemplo do turn o solver defendeu, em média, perto do MDF: site de formação, What the Best Poker Pros Already Know About Playing vs. Double Barrels (https://upswingpoker.com/vs-double-barrels-turn/); defesa contra c-bets pequenos: R-M6-006"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: training, url: "https://upswingpoker.com/vs-double-barrels-turn/" }]
- id: R-M6-004
  module: m6
  if: "no river, faz uma {{t:bet|aposta}} grande um jogador que, pelo que observou, raramente faz {{t:bluff|bluff}}"
  then: "{{t:fold|desiste}} mais vezes do que indica o {{t:mdf|MDF}}, também com {{t:pair|pares}} médios"
  because: "o {{t:mdf|MDF}} pressupõe que o adversário faz {{t:bluff|bluff}} com frequência suficiente; quando faltam {{t:bluff|bluffs}}, {{t:call|pagar}} com uma mão mais fraca paga sobretudo a mãos melhores"
  level: exploit
  population: "um jogador concreto observado à mesa; sem dados sobre a população (amostra, níveis, sala), por isso a regra não pressupõe que todo um grupo de jogadores raramente faz bluff; treinadores de dois sites de formação descrevem assim os jogadores recreativos passivos (que jogam por diversão, normalmente mais fracos do que os habituais) em níveis baixos, sem números de uma base de mãos"
  source: "site de formação, Bluff Catching: When to Call and When to Let It Go (https://deepfold.co/en/blog/bluff-catching-principles: os jogadores recreativos passivos não fazem bluff com apostas grandes no river); site de formação, MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker: «In low-stakes games, most players will bluff way less»)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/bluff-catching-principles" }, { kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }]
- id: R-M6-005
  module: m6
  if: "o adversário {{t:bet|aposta}} mais alto"
  then: "defende com um {{t:range|range}} mais apertado: com uma aposta de 1/3 do {{t:pot|pote}} o {{t:mdf|MDF}} é {{n:mdf.bet-third}}, e com uma aposta do tamanho do {{t:pot|pote}} {{n:mdf.bet-pot}}"
  because: "uma aposta maior dá um preço pior: a equity necessária sobe de {{n:eq.bet-third}} para {{n:eq.bet-pot}}"
  level: math
  source: "cálculo: MDF = pote/(pote+aposta), equity necessária = aposta/(pote+2·aposta)"
  sources: [{ kind: math }]
- id: R-M6-006
  module: m6
  if: "no {{t:big-blind|big blind}} recebe um c-bet pequeno (cerca de 1/3 do {{t:pot|pote}})"
  then: "continua com quase todos os {{t:pair|pares}}, {{t:draw|draws}}, cartas altas com um {{t:draw|draw}} adicional (backdoor) e normalmente também com ás como carta mais alta; {{t:fold|desiste}} com as mãos mais fracas sem {{t:pair|par}} e sem {{t:draw|draw}}"
  because: "precisa apenas de cerca de {{n:eq.bet-third}} de equity, e estas mãos ou já ganham aos {{t:bluff|bluffs}} ou podem melhorar"
  level: heuristic
  source: "site de formação, Defending the BB on High Card Boards (solver: «we will continue with pretty much all pairs including the underpairs and even A-high hands»)"
  sources: [{ kind: training }]
- id: R-M6-007
  module: m6
  if: "tem duas cartas altas sem {{t:pair|par}} e sem {{t:draw|draw}}, e o c-bet é grande (3/4 do {{t:pot|pote}} ou mais)"
  then: "normalmente {{t:fold|desiste}} (nos flops {{t:dry|secos}} com rei, o solver, ainda assim, {{t:call|paga}} com muitas mãos com ás)"
  because: "{{t:out-of-position|fora de posição}} uma mão destas raramente chega ao showdown, e um {{t:pair|par}} com a carta alta muitas vezes perde na mesma; {{t:call|paga}} sobretudo quando tem um {{t:draw|draw}} adicional, de preferência para o {{t:flush|flush}} mais alto"
  level: heuristic
  source: "site de formação, When to Call With Ace-High (J42, 66%: «the solver does not call with any Ace-high hand that doesn't have a significant backdoor draw»); site de formação, Defending the BB on High Card Boards (K84: o solver paga com parte dos ases mesmo contra 2/3 do pote)"
  sources: [{ kind: training }, { kind: training }]
- id: R-M6-008
  module: m6
  if: "quer fazer check-raise no flop"
  then: "fá-lo sobretudo com as mãos mais fortes ({{t:two-pair|dois pares}}, sets) e com {{t:draw|draws}} ({{t:flush|flush}}, {{t:oesd|OESD}}); com {{t:pair|pares}} médios normalmente {{t:call|paga}} (simplificação: contra c-bets pequenos o solver também {{t:raise|aumenta}} com parte dos {{t:top-pair|top pairs}} e dos {{t:pair|pares}} fracos para proteção)"
  because: "depois de um check-raise, as mãos piores normalmente {{t:fold|desistem}} e as melhores pagam, por isso um {{t:pair|par}} médio raramente ganha com isso; um {{t:draw|draw}} tem duas formas de ganhar: o adversário {{t:fold|desistir}} ou acertar"
  level: heuristic
  source: "site de formação, 5 Winning Check-Raising Strategies (os solvers «check-raise all sorts of top pairs versus small bets»); site de formação (tabelas de solver) (sets e projetos como check-raise; pares fracos para proteção)"
  sources: [{ kind: training }]
- id: R-M6-009
  module: m6
  if: "o c-bet é pequeno ou o flop é baixo e {{t:connected|conectado}} (p. ex. 7-6-5)"
  then: "faz check-raise mais vezes; em flops altos bons para quem aumentou no pré-flop (p. ex. K-J-T, A-A-K) e contra c-bets grandes, menos vezes"
  because: "nos flops baixos e {{t:connected|conectados}} o {{t:big-blind|big blind}} tem no {{t:range|range}} {{t:straight|sequências}} e {{t:two-pair|dois pares}}, e o Button normalmente não tem {{t:nuts-advantage|vantagem de nuts}}; um c-bet pequeno dá uma oportunidade barata para {{t:raise|aumentar}}"
  level: heuristic
  source: "site de formação, How to Check-Raise Like a High Stakes Juggernaut (flops em que não se deve aumentar: K♣J♥T♠, Q♥J♦T♠, A♥A♠K♥; check-raise 12,65% contra 33% e 8,66% contra 66% do pote); site de um solver comercial («The larger the BTN bets, the less BB raises»); site de um solver comercial, Flop Heuristics: IP C-Betting in Cash Games («flopped straights often being in the BB’s range»)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M6-010
  module: m6
  if: "faz check-raise no flop"
  then: "{{t:raise|aumenta}} para cerca de {{n:xr.mult.low}}–{{n:xr.mult.example}} o valor do c-bet, tanto mais quanto menor for o c-bet; não pelo mínimo"
  because: "com um check-raise para {{n:xr.mult.example}} o c-bet, o Button precisa de cerca de {{n:eq.vs-xr.example}} de equity para {{t:call|pagar}}, e com {{n:xr.too-small.mult}} o c-bet apenas {{n:eq.vs-xr.too-small}}; a um preço tão barato paga com qualquer {{t:draw|draw}}"
  level: heuristic
  source: "cálculo do preço: valor a pagar/(pote depois do aumento + valor a pagar); site de formação, Level-Up Podcast ep. 1 (Blackwood): 4,5x contra c-bets pequenos, 3,2x contra grandes (https://upswingpoker.com/podcast/ep1-check-raise/); direção consistente com um site de um solver comercial: quanto menor a aposta, maior o múltiplo"
  sources: [{ kind: training, url: "https://upswingpoker.com/podcast/ep1-check-raise/" }, { kind: solver-pub }, { kind: math }]
- id: R-M6-011
  module: m6
  if: "pondera um check-raise como {{t:bluff|bluff}} ou {{t:semi-bluff|semi-bluff}}"
  then: "escolhe para isso sobretudo {{t:draw|draws}} fortes; quanto menos vezes o adversário {{t:fold|desiste}}, menos {{t:bluff|bluffs}} destes, e quando quase nunca {{t:fold|desiste}}, faz check-raise sobretudo por {{t:value|valor}}"
  because: "o {{t:bluff|bluff}} só lucra quando o adversário {{t:fold|desiste}} mais vezes do que alpha (R-M6-002); um {{t:draw|draw}} forte também ganha quando acerta, por isso perde menos quando faltam {{t:fold|desistências}}"
  level: heuristic
  source: "conclusão a partir de alpha (R-M6-002): o bluff precisa de que o adversário desista; site de formação, 5 Winning Check-Raising Strategies («tighten your bluffing range to include only strong draws»)"
  sources: [{ kind: training }, { kind: math }]

# M7: turn. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 „Weryfikacja źródeł — M7–M9” (decyzje D1–D9).
- id: R-M7-001
  module: m7
  if: "fez c-bet no flop com {{t:position|posição}}, o adversário {{t:call|pagou}} e no turn sai uma carta alta (ás ou rei) numa {{t:board|mesa}} mais baixa"
  then: "{{t:bet|aposta}} um {{t:second-barrel|second barrel}} mais vezes, também como {{t:bluff|bluff}}"
  because: "esta carta costuma acertar mais vezes no seu {{t:range|range}} de {{t:open|abertura}} do que no {{t:range|range}} de quem defende, e cada {{t:pair|par}} do adversário desce um lugar"
  level: heuristic
  source: "site de um solver comercial, The Worst Turn Card; site de formação, When to Fire a Second Barrel; site de formação, When to Double Barrel the Turn as a Bluff"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-002
  module: m7
  if: "faz {{t:bluff|bluff}} com um {{t:second-barrel|second barrel}} no turn"
  then: "normalmente faz {{t:bluff|bluff}} com mãos com outs ({{t:flush-draw|flush draw}}, draw de {{t:straight|sequência}}, gutshot com carta alta) quando o adversário tende a {{t:fold|desistir}} ou {{t:call|pagar}}; quando ele pode {{t:raise|aumentar}}, o solver também faz {{t:bluff|bluff}} com mãos sem outs (simplificação: a escolha depende de como o adversário vai responder)"
  because: "um {{t:semi-bluff|semi-bluff}} ganha de duas formas: quando o adversário {{t:fold|desiste}} ou quando acerta no river; um {{t:bluff|bluff}} sem outs tem apenas a primeira (stacks de cerca de {{n:format.stack}})"
  level: heuristic
  source: "site de um solver comercial, From Gutshots to Airballs: Choosing Your Bluffs; treinador com site de formação, The Double Barrel Checklist; site de formação, When to Double Barrel the Turn as a Bluff (com cerca de 100bb)"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-003
  module: m7
  if: "no turn tem uma mão média (p. ex. {{t:second-pair|segundo par}} ou {{t:top-pair|top pair}} com kicker fraco) e o adversário já {{t:call|pagou}} um c-bet"
  then: "{{t:check|passa}} mais vezes, em vez de apostar uma segunda vez"
  because: "depois de {{t:call|pagar}} no flop, o adversário tem um {{t:range|range}} mais forte do que antes: perante uma aposta {{t:fold|desiste}} com as mãos piores e paga com as melhores; ao {{t:check|passar}}, mantém o {{t:pot|pote}} pequeno e chega ao showdown"
  level: heuristic
  source: "site de um solver comercial (Brokos), Principles of Turn Strategy; site de formação, Poker Basics: Polarised Ranges; site de um solver comercial, Poker: The Battle for Information"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M7-004
  module: m7
  if: "faz {{t:bluff|bluff}} no turn com uma mão que por si só quase nunca ganha"
  then: "com uma aposta de 3/4 do {{t:pot|pote}}, o adversário tem de {{t:fold|desistir}} em mais de {{n:alpha.bet-three-quarters}} dos casos, com uma aposta de meio {{t:pot|pote}} em mais de {{n:alpha.bet-half}}"
  because: "arrisca a aposta para ganhar o {{t:pot|pote}}: o limiar é aposta ÷ ({{t:pot|pote}} + aposta); os outs que tiver baixam este limiar"
  level: math
  source: "cálculo: alpha = aposta/(pote+aposta)"
  sources: [{ kind: math }]
- id: R-M7-005
  module: m7
  if: "aposta no turn com um {{t:range|range}} {{t:polarized|polarizado}} (mãos muito fortes e {{t:semi-bluff|semi-bluffs}} com {{t:draw|draw}}, sem mãos médias)"
  then: "escolhe um tamanho grande, p. ex. 3/4 do {{t:pot|pote}}, e as mãos médias {{t:check|passam}}"
  because: "as mãos fortes querem construir o {{t:pot|pote}} antes do river, os {{t:bluff|bluffs}} precisam de que o adversário {{t:fold|desista}}, e as mãos médias não ganham nada com um {{t:pot|pote}} grande"
  level: heuristic
  source: "site de formação, Polarized vs Merged Ranges (definições); site de formação, Polarised Ranges; site de um solver comercial, The Worst Turn Card"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-006
  module: m7
  if: "tem uma mão forte no turn e o adversário pode ter um {{t:flush-draw|flush draw}}"
  then: "aposta alto: com uma aposta de 3/4 do {{t:pot|pote}}, o {{t:draw|draw}} precisa de {{n:eq.bet-three-quarters}} de equity, e tem cerca de {{n:odds.flush.turn-river}}"
  because: "com uma aposta de 1/4 do {{t:pot|pote}} bastar-lhe-ia {{n:eq.bet-quarter}}, por isso uma aposta pequena dá ao {{t:draw|draw}} um bom preço"
  level: math
  source: "cálculo: equity necessária = aposta/(pote+2·aposta), probabilidade = outs ÷ cartas desconhecidas; direção (uma mão forte e vulnerável aposta alto): site de formação, How Much Should You Bet on Connected Boards?"
  sources: [{ kind: training }, { kind: math }]
- id: R-M7-007
  module: m7
  if: "tem um {{t:draw|draw}} no turn"
  then: "calcula a probabilidade para uma só carta: o {{t:flush|flush}} é cerca de {{n:odds.flush.turn-river}}, e não {{n:odds.flush.flop-river}} como do flop ao river"
  because: "até ao river resta uma carta, por isso a probabilidade é mais ou menos metade da calculada no flop para duas cartas"
  level: math
  check: { kind: draw-price, streets: [turn] }
  source: "cálculo exato (poker-core)"
  sources: [{ kind: math }]
- id: R-M7-008
  module: m7
  if: "no turn o preço do {{t:draw|draw}} é demasiado alto (tem menos equity do que precisa)"
  then: "só {{t:call|paga}} se, ao acertar, vier a ganhar no total pelo menos o valor a pagar × (cartas que falham ÷ outs); a diferença acima do {{t:pot|pote}} são as implied odds"
  because: "assim, os ganhos quando acerta cobrem as perdas quando falha; com flush draw e uma aposta de {{n:io.flush.bet}} para um {{t:pot|pote}} de {{n:ex.third.pot}} são {{n:io.flush.extra}} acima do {{t:pot|pote}}"
  level: math
  check: { kind: implied-odds, streets: [flop, turn], params: { sprMin: "n:spr.zone.mid" } }
  source: "cálculo de EV: equity × (pote + ganho adicional) = (1 − equity) × valor a pagar"
  sources: [{ kind: math }]
- id: R-M7-009
  module: m7
  if: "conta com implied odds"
  then: "só confia nelas quando o adversário ainda tem {{t:chips|fichas}} suficientes atrás ({{t:spr|SPR}} alto), o seu {{t:draw|draw}} é para a melhor mão e o acerto não salta à vista"
  because: "as {{t:chips|fichas}} adicionais ainda têm de lhe ser pagas pelo adversário; com {{t:spr|SPR}} baixo não há de onde as tirar, e um acerto visível (p. ex. a terceira copa na {{t:board|mesa}}) assusta-o"
  level: heuristic
  source: "treinador com site de formação, Implied Odds Calculator; site de formação, Implied Odds"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-010
  module: m7
  if: "tem um {{t:draw|draw}} para um {{t:flush|flush}} baixo, ou para uma {{t:straight|sequência}} quando na {{t:board|mesa}} pode sair um {{t:flush|flush}}"
  then: "{{t:call|paga}} com mais cautela e conta menos outs"
  because: "ao acertar, por vezes continua a perder contra uma mão melhor e é aí que paga mais (implied odds inversas)"
  level: heuristic
  source: "site de formação, Back to Basics (Part 2): Reverse Implied Odds; treinador com site de formação, Implied Odds Calculator"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-011
  module: m7
  if: "defende o {{t:big-blind|big blind}} e o Button, depois de {{t:open|abrir}}, não fez c-bet no flop ({{t:check|passou}})"
  then: "no turn aposta mais vezes por iniciativa própria (probe bet), sobretudo em mesas baixas; em mesas com ás ou rei, menos vezes"
  because: "o Button apostaria com muitas mãos fortes, por isso, depois de {{t:check|passar}}, tem menos; nas mesas altas, porém, a {{t:range-advantage|vantagem de range}} continua do lado dele"
  level: heuristic
  source: "site de um solver comercial, The Turn Probe Bet; site de formação, Turn Probe (Kanu7); site de formação, Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-012
  module: m7
  if: "{{t:bet|aposta}} uma probe bet no turn"
  then: "aposta com {{t:pair|pares}} que querem ser pagos e protegidos e com {{t:draw|draws}} fortes; as mãos sem {{t:pair|par}} e sem outs {{t:check|passam}}"
  because: "os {{t:pair|pares}} ganham com as mãos piores do Button e não lhe dão uma carta grátis, os {{t:draw|draws}} ganham de duas formas, e as mãos vazias não ganham nada"
  level: heuristic
  source: "site de um solver comercial, The Turn Probe Bet; site de formação, Turn Probe (Kanu7); site de formação, Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-013
  module: m7
  if: "{{t:call|pagou}} um c-bet no flop e o adversário aposta pela segunda vez no turn"
  then: "defende mais apertado do que no flop: os {{t:draw|draws}} só {{t:call|pagam}} com um bom preço ou implied odds, e as mãos sem outs e os {{t:pair|pares}} mais fracos {{t:fold|desistem}}"
  because: "o adversário {{t:bet|aposta}} o {{t:second-barrel|second barrel}} com um {{t:range|range}} mais estreito do que o do c-bet e normalmente com um tamanho maior, e os {{t:draw|draws}} já só têm uma carta"
  level: heuristic
  source: "site de formação, What the Best Poker Pros Already Know About Playing vs. Double Barrels"
  sources: [{ kind: training }]

# M8: river. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D10–D17). Reguł eksploatacyjnych brak (R-M6-004: obserwacja konkretnego gracza, bez danych o populacji, D-149).
- id: R-M8-001
  module: m8
  if: "no river {{t:in-position|em posição}} quer apostar por {{t:value|valor}} e o adversário só pode {{t:call|pagar}} ou {{t:fold|desistir}}"
  then: "aposta quando mais de {{n:value.threshold}} das mãos que vão {{t:call|pagar}} são piores do que a sua; conta apenas as mãos que vão pagar, e não todas as mãos do adversário"
  because: "cada vez que uma mão pior {{t:call|paga}}, ganha uma aposta, e cada vez que uma melhor {{t:call|paga}}, perde uma aposta; quando o adversário {{t:fold|desiste}} com uma mão pior, ganha o mesmo {{t:pot|pote}} que ganharia depois de {{t:check|passar}}"
  level: math
  source: "cálculo: valor esperado de apostar face a passar (programa de ensino M8: value bet é ganhar mais de metade das vezes quando pagam)"
  sources: [{ kind: math }]
- id: R-M8-002
  module: m8
  if: "no river tem {{t:in-position|em posição}} uma mão média, e as mãos piores do adversário não vão pagar uma aposta"
  then: "{{t:check|passa}} e vai ao showdown de graça"
  because: "depois de uma aposta, as mãos piores {{t:fold|desistem}} e pagam (ou {{t:raise|aumentam}}) as melhores, por isso a aposta transforma uma mão com valor de showdown num {{t:bluff|bluff}}"
  level: heuristic
  source: "conclusão de R-M8-001; site de um solver comercial, Mastering Thin Value Bets in Checked-Down Pots; site de formação, River; site de formação, Polarized vs Merged Ranges"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M8-003
  module: m8
  if: "a sua mão no river ganha a pouco mais de metade das mãos que podem {{t:call|pagar}} (thin value)"
  then: "aposta menos do que com uma mão forte, normalmente cerca de 1/4–1/2 do {{t:pot|pote}}, quando o adversário raramente {{t:raise|aumenta}} (simplificação: com risco de check-raise, com {{t:position|posição}}, raramente desce abaixo de 1/2 do {{t:pot|pote}})"
  because: "uma aposta pequena também é {{t:call|paga}} por mãos mais fracas do adversário; uma aposta grande é {{t:call|paga}} sobretudo pelas melhores, e então as mãos piores que {{t:call|pagam}} deixam de ser mais do que as melhores"
  level: heuristic
  source: "site de um solver comercial, River Refinements; site de um solver comercial, Mastering Thin Value Bets in Checked-Down Pots; site de formação, Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-004
  module: m8
  if: "no river aposta o {{t:pot|pote}} inteiro com um {{t:range|range}} composto por mãos muito fortes e {{t:bluff|bluffs}}"
  then: "em equilíbrio, cerca de {{n:bluff.share.bet-pot}} das suas apostas são {{t:bluff|bluffs}}; em geral, a proporção de {{t:bluff|bluffs}} = aposta ÷ ({{t:pot|pote}} + 2·aposta)"
  because: "assim, a mão do adversário que só ganha aos {{t:bluff|bluffs}} tem exatamente a equity necessária ({{n:eq.bet-pot}}): não ganha nada nem ao {{t:call|pagar}} nem ao {{t:fold|desistir}}, por isso não pode ser explorado"
  level: math
  source: "cálculo: condição de indiferença da mão que apanha bluffs (modelo simplificado: range polarizado contra bluff-catcher); site de um solver comercial, How to Solve Toy Games"
  sources: [{ kind: solver-pub }, { kind: math }]
- id: R-M8-005
  module: m8
  if: "no river muda o tamanho da aposta com um {{t:range|range}} {{t:polarized|polarizado}}"
  then: "com uma aposta maior tem nele mais {{t:bluff|bluffs}}, com uma menor menos: com 1/3 do {{t:pot|pote}} cerca de {{n:bluff.share.bet-third}}, com o {{t:pot|pote}} inteiro cerca de {{n:bluff.share.bet-pot}}"
  because: "uma aposta maior dá ao adversário um preço pior, por isso, para que {{t:call|pagar}} compense, ele precisa de mais {{t:bluff|bluffs}} no {{t:range|range}} de quem aposta"
  level: math
  source: "cálculo: proporção de bluffs = aposta/(pote+2·aposta)"
  sources: [{ kind: math }]
- id: R-M8-006
  module: m8
  if: "escolhe com que mãos fazer {{t:bluff|bluff}} no river"
  then: "faz {{t:bluff|bluff}} com as mãos mais fracas, que não ganham no showdown (p. ex. {{t:draw|draws}} de {{t:straight|sequência}} falhados ou cartas altas sem hipóteses); as mãos com valor de showdown {{t:check|passam}}"
  because: "um {{t:bluff|bluff}} com uma mão que muitas vezes ganha depois de {{t:check|passar}} abdica dessa vitória; uma mão sem hipóteses não perde nada quando o {{t:bluff|bluff}} não resulta"
  level: heuristic
  source: "site de um solver comercial, We're At The River. Our Hand Can't Win. Now What?; site de formação, Polarized vs Linear Ranges"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-007
  module: m8
  if: "escolhe um {{t:bluff|bluff}} entre as mãos sem valor de showdown"
  then: "escolhe uma mão com uma carta que bloqueia as mãos fortes do adversário, ou seja, aquelas com que ele vai pagar (p. ex. o ás do naipe quando há três cartas do mesmo naipe na {{t:board|mesa}})"
  because: "quando tem uma carta das mãos mais fortes dele, o adversário tem menos {{t:combo|combinações}} dessas mãos, por isso fica mais vezes com uma mão para largar"
  level: heuristic
  source: "programa de ensino M8; site de um solver comercial, Blockers & Unblockers: The Secret to Picking Great Bluffs; site de formação, What is Unblocking in Poker"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-008
  module: m8
  if: "o {{t:flush-draw|flush draw}} não entrou e está a escolher um {{t:bluff|bluff}}"
  then: "quando pode escolher entre {{t:bluff|bluffs}}, prefere um {{t:bluff|bluff}} sem cartas desse naipe"
  because: "o adversário vai {{t:fold|desistir}} com os {{t:draw|draws}} falhados; uma carta desse naipe na sua mão reduz o número de mãos dele que vai largar"
  level: heuristic
  source: "site de formação, What is Unblocking in Poker; site de um solver comercial, Blockers & Unblockers: The Secret to Picking Great Bluffs"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-009
  module: m8
  if: "tem uma carta de determinado valor"
  then: "o adversário tem menos {{t:combo|combinações}} com esse valor: AK tem {{n:combos.unpaired.one-blocked}} em vez de {{n:combos.unpaired}}, e um {{t:pair|par}} de ases apenas {{n:combos.pair.one-blocked}} em vez de {{n:combos.pair}}"
  because: "uma carta na sua mão não pode estar na mão do adversário: das quatro cartas desse valor restam-lhe {{n:pair.outs.per-rank}}"
  level: math
  source: "combinatória"
  sources: [{ kind: math }]
- id: R-M8-010
  module: m8
  if: "no river tem uma mão que só ganha aos {{t:bluff|bluffs}} do adversário (bluff-catcher)"
  then: "{{t:call|paga}} quando os {{t:bluff|bluffs}} são mais do que a equity necessária, p. ex. mais de {{n:eq.bet-pot}} das apostas do tamanho do {{t:pot|pote}}; quando há menos {{t:bluff|bluffs}}, {{t:fold|desiste}}"
  because: "a sua equity é a proporção de {{t:bluff|bluffs}} nas apostas dele (ganha a cada {{t:bluff|bluff}} e perde para cada mão de {{t:value|valor}}); quando o adversário faz {{t:bluff|bluff}} na proporção aposta ÷ ({{t:pot|pote}} + 2·aposta), {{t:call|pagar}} fica a zero"
  level: math
  source: "cálculo: equity necessária = aposta/(pote+2·aposta)"
  sources: [{ kind: math }]
- id: R-M8-011
  module: m8
  if: "escolhe com que bluff-catchers {{t:call|pagar}} uma aposta no river"
  then: "prefere mãos com cartas que bloqueiam as mãos fortes do adversário e sem cartas que bloqueiem os {{t:bluff|bluffs}} dele (p. ex. sem cartas do naipe do {{t:draw|draw}} falhado)"
  because: "quando bloqueia o valor dele, no {{t:range|range}} de apostas ficam mais {{t:bluff|bluffs}}; quando bloqueia os {{t:bluff|bluffs}} dele, fica mais valor"
  level: heuristic
  source: "site de um solver comercial, Understanding Blockers; site de formação; site de formação, Bluff Catching Strategy"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M8-012
  module: m8
  if: "recebe uma aposta no river e defende com um {{t:range|range}}"
  then: "{{t:call|paga}} com os melhores bluff-catchers: entre mãos de força semelhante, escolhe as que têm melhores {{t:blocker|bloqueadores}}; {{t:fold|desiste}} com as mãos que perdem até para os {{t:bluff|bluffs}}"
  because: "uma mão que perde para todas as apostas do adversário não ganha nada ao {{t:call|pagar}}, mesmo quando o adversário faz muito {{t:bluff|bluff}}"
  level: heuristic
  source: "conclusão a partir do MDF (R-M6-001) e de R-M8-010; site de um solver comercial, Principles of River Play; site de formação, Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]

# M9: plan rozdania. Matematyka z liczb (numbers.yaml); progi stref SPR i liczba ulic wartości jako heurystyki
# (uproszczenia nazwane w lekcjach). Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D18–D22).
- id: R-M9-001
  module: m9
  if: "calcula o {{t:spr|SPR}} no flop"
  then: "divide o {{t:effective-stack|stack efetivo}} (o menor dos dois, sem o que já está no {{t:pot|pote}}) pelo {{t:pot|pote}}; depois de uma {{t:open|abertura}} e de alguém {{t:call|pagar}} é cerca de {{n:spr.srp}}, depois de um 3-bet {{t:in-position|em posição}} cerca de {{n:spr.3bet-ip}}, depois de um 4-bet cerca de {{n:spr.4bet}}"
  because: "cada {{t:raise|aumento}} antes do flop multiplica várias vezes o {{t:pot|pote}}, enquanto o stack atrás diminui muito mais devagar"
  level: math
  source: "cálculo: SPR = stack efetivo ÷ pote no flop (stacks e potes dos números do M4)"
  sources: [{ kind: math }]
- id: R-M9-002
  module: m9
  if: "o adversário vai all-in no flop com o stack inteiro"
  then: "para {{t:call|pagar}} precisa de uma equity de stack ÷ ({{t:pot|pote}} + 2·stack): com {{t:spr|SPR}} {{n:spr.commit}} é {{n:eq.jam.spr2}}, com {{t:spr|SPR}} {{n:spr.srp}} já {{n:eq.jam.srp}}"
  because: "paga o stack inteiro para ganhar o {{t:pot|pote}} e o stack do adversário; quanto mais baixo o {{t:spr|SPR}}, melhor o preço que obtém"
  level: math
  source: "cálculo: equity necessária = valor a pagar/(pote + 2·valor a pagar)"
  sources: [{ kind: math }]
- id: R-M9-003
  module: m9
  if: "o {{t:spr|SPR}} no flop é inferior a cerca de {{n:spr.zone.low}} (p. ex. {{n:spr.commit}}) e tem {{t:top-pair|top pair}} ou uma mão melhor"
  then: "joga pelo stack inteiro: aposta ou {{t:call|paga}} com o plano de colocar tudo e normalmente não {{t:fold|desiste}} perante um all-in"
  because: "com {{t:spr|SPR}} {{n:spr.commit}}, perante um all-in precisa no máximo de cerca de {{n:eq.jam.spr2}} de equity, e duas {{t:bet|apostas}} de cerca de {{n:geo.spr2.2}} do {{t:pot|pote}} colocam o stack inteiro; um {{t:top-pair|top pair}} costuma aguentar duas {{t:value|rondas de valor}}"
  level: heuristic
  source: "site de um solver comercial, Stack-to-Pot Ratio; treinador com site de formação, SPR Strategy; cálculo na lição m9.l2"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-004
  module: m9
  if: "depois da sua {{t:bet|aposta}} ficaria com menos no stack do que o {{t:pot|pote}} depois de o adversário {{t:call|pagar}}"
  then: "não planeia {{t:bet|apostar}} e depois {{t:fold|desistir}} perante um all-in: ou joga pelo stack inteiro, ou {{t:check|passa}}"
  because: "com {{t:spr|SPR}} {{n:spr.commit}}, depois de uma {{t:bet|aposta}} do tamanho do {{t:pot|pote}}, perante o all-in precisa de apenas {{n:eq.commit.after-pot}} de equity, por isso {{t:fold|desistir}} normalmente não compensa"
  level: math
  source: "cálculo: valor a pagar/(pote antes do excedente + 2·valor a pagar)"
  sources: [{ kind: math }]
- id: R-M9-005
  module: m9
  if: "joga um {{t:pot|pote}} com um único aumento e stacks completos ({{t:spr|SPR}} cerca de {{n:spr.srp}}) e tem apenas um {{t:pair|par}}"
  then: "joga por valor, mas normalmente não planeia colocar o stack inteiro"
  because: "para colocar o stack inteiro até ao river é preciso apostar mais do que o {{t:pot|pote}} em cada {{t:street|ronda}}, e um adversário que coloca esse dinheiro todo raramente tem uma mão pior do que um {{t:pair|par}}"
  level: heuristic
  source: "cálculo do tamanho geométrico (m9.l3); site de um solver comercial, Stack-to-Pot Ratio; site de formação, When to Check Top Pair"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-006
  module: m9
  if: "quer colocar o stack inteiro com {{t:bet|apostas}} iguais até ao river"
  then: "aposta em cada {{t:street|ronda}} a mesma fração f do {{t:pot|pote}}, tal que (1 + 2f) elevado ao número de {{t:street|rondas}} = 1 + 2·{{t:spr|SPR}}; num {{t:pot|pote}} de 3-bet {{t:in-position|em posição}} isso dá cerca de {{n:geo.3bet-ip.3}} do {{t:pot|pote}}"
  because: "uma {{t:bet|aposta}} de f, quando o adversário {{t:call|paga}}, multiplica o {{t:pot|pote}} por (1 + 2f), e o all-in acontece quando o {{t:pot|pote}} cresce até {{t:pot|pote}} + 2·stack"
  level: math
  source: "cálculo: tamanho geométrico; site de formação, Geometric Bet Sizing; site de um solver comercial, Pot Geometry"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-007
  module: m9
  if: "num {{t:pot|pote}} com um único aumento e stacks de {{n:format.stack}}, aposta em três {{t:street|rondas}}"
  then: "lembra-se de que três {{t:bet|apostas}} de meio {{t:pot|pote}} colocam apenas {{n:srp.half.total}}, e três {{t:bet|apostas}} do tamanho do {{t:pot|pote}} {{n:srp.potbet.total}} de um stack de {{n:spr.srp.stack}}"
  because: "o {{t:pot|pote}} no flop é pequeno em relação ao stack; o stack inteiro só entra com {{t:bet|apostas}} de cerca de {{n:geo.srp.3}} do {{t:pot|pote}} em cada {{t:street|ronda}}"
  level: math
  source: "cálculo: a aposta e o respetivo pagamento multiplicam o pote por (1 + 2f)"
  sources: [{ kind: math }]
- id: R-M9-008
  module: m9
  if: "antes de {{t:bet|apostar}} no flop, planeia a mão"
  then: "avalia quantas {{t:value|rondas de valor}} a mão aguenta (o número de {{t:street|rondas}} é uma simplificação): muito forte (set, {{t:straight|sequência}}, {{t:two-pair|dois pares}} altos) três; {{t:top-pair|top pair}} com bom kicker ou {{t:overpair|overpair}} normalmente duas, e a terceira quando o adversário paga com mãos mais fracas; um {{t:pair|par}} mais fraco uma ou nenhuma"
  because: "a cada {{t:street|ronda}} as mãos piores do adversário {{t:fold|desistem}}, e no {{t:pot|pote}} ficam sobretudo mãos melhores do que a sua"
  level: heuristic
  source: "síntese: site de formação, When to Check Top Pair (https://upswingpoker.com/when-to-check-top-pair/): «In single raised pots, the stack-to-pot ratio (SPR) is too high to comfortably get 3 streets of value with many top pair hands.»; site de um solver comercial, Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/): «All top pairs and all nut flush draws are now indifferent between calling and folding» (SPR 16); site de um solver comercial, Pot Geometry (https://blog.gtowizard.com/pot-geometry/): «Game theory optimal strategies typically use geometric bet sizes when they want to maximize value with a big nut advantage.»; número de streets por mão, incluindo o par mais fraco: simplificação da aplicação (D-149)"
  sources: [{ kind: training, url: "https://upswingpoker.com/when-to-check-top-pair/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }]
- id: R-M9-009
  module: m9
  if: "tem uma mão para três {{t:value|rondas de valor}}, a zona de {{t:spr|SPR}} permite jogá-la pelo stack inteiro (R-M9-010) e quer colocar o stack inteiro"
  then: "já no flop aposta com o tamanho geométrico, e não com um pequeno"
  because: "num {{t:pot|pote}} de 3-bet, três {{t:bet|apostas}} de 1/3 do {{t:pot|pote}} colocam apenas cerca de {{n:g3b.third.total}} de um stack de {{n:spr.3bet-ip.stack}}, por isso a maior parte do stack fica por colocar; com cerca de {{n:geo.3bet-ip.3}} do {{t:pot|pote}} em cada {{t:street|ronda}}, entra todo"
  level: math
  source: "cálculo: cadeia de apostas e pagamentos (numbers.yaml, chaves g3b.third.* e geo.3bet-ip.*)"
  sources: [{ kind: math }]
- id: R-M9-010
  module: m9
  if: "está a planear se joga pelo stack inteiro com uma determinada mão"
  then: "olha para a zona de {{t:spr|SPR}} (simplificação): abaixo de cerca de {{n:spr.zone.low}} normalmente basta {{t:top-pair|top pair}}; de {{n:spr.zone.low}} a {{n:spr.zone.mid}} o {{t:top-pair|top pair}} é uma mão no limite; de {{n:spr.zone.mid}} a {{n:spr.zone.deep}} precisa normalmente de {{t:two-pair|dois pares}} altos ou melhor; e acima de {{n:spr.zone.deep}} de um set, uma {{t:straight|sequência}} ou uma mão melhor"
  because: "quanto mais alto o {{t:spr|SPR}}, mais {{t:bet|apostas}} são precisas para colocar o stack inteiro, e até ao fim o adversário paga sobretudo com mãos fortes; com {{t:spr|SPR}} {{n:spr.zone.deep}} o stack inteiro só entra depois de três {{t:bet|apostas}} do tamanho do {{t:pot|pote}}"
  level: heuristic
  source: "treinador com site de formação, SPR Strategy (https://www.splitsuit.com/spr-poker-strategy): «less than 3 is an auto-stack off with top pair or better, between 3-6 is situational and based upon villain/board texture, and more than 6 SPR isn't a default stack-off»; site de um solver comercial, Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/): «at this higher SPR, stacking off with top pair starts to get a bit dicey»; zona 6–13: parte comum de dois sites de formação: SPR (https://www.thepokerbank.com/strategy/concepts/spr/): «Medium SPR = 7 - 16», «Good hands for medium SPRs.», «Top two pair. Sets.»; Poker SPR (https://pokercoaching.com/blog/poker-spr/): «High SPR (8+): Deep stacks favor hands that make nutted combinations (sets, straights, flushes) over one-pair holdings.»; limiar 13: cálculo (1+2·1)^3 = 1+2·13 e Flynn, Mehta, Miller, Professional No-Limit Hold'em, através de um site de notícias (https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm): «if you're heads-up and the stack-to-pot ratio is 13 going to the flop, you and your opponent can each make exactly three pot-sized bets»; limites das zonas: simplificação da aplicação (D-149)"
  sources: [{ kind: training, url: "https://www.splitsuit.com/spr-poker-strategy" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }, { kind: training, url: "https://www.thepokerbank.com/strategy/concepts/spr/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-spr/" }, { kind: math }, { kind: book, url: "https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm" }]

# M10: eksploatacja mikrostawek. Każde dostosowanie to odejście od bazy z M3–M9 (ADR-03). Definicje statystyk: rules;
# błąd próby, próg blefu i wpływ rake'u na cenę: math; progi typów graczy i próby z serwisów szkoleniowych: heuristic;
# wynik solvera: gto; dostosowanie do typu gracza: exploit z populacją (dane z analizy bazy rąk populacji albo odczyt HUD rywala z próbą).
# Decyzje D-M10-01…14 w raporcie M10 (do dokumentu 12 „Weryfikacja źródeł — M10–M13”).
- id: R-M10-001
  module: m10
  if: "lê o {{t:vpip|VPIP}} e o {{t:pfr|PFR}} do adversário"
  then: "o {{t:vpip|VPIP}} é a percentagem de mãos em que ele coloca voluntariamente {{t:chips|fichas}} antes do flop ({{t:call|paga}} ou {{t:raise|aumenta}}; os blinds não contam), e o {{t:pfr|PFR}} a percentagem de mãos em que {{t:raise|aumenta}} antes do flop ({{t:open|abertura}}, 3-bet, 4-bet); o {{t:pfr|PFR}} nunca ultrapassa o {{t:vpip|VPIP}}"
  because: "cada {{t:raise|aumento}} é também uma colocação voluntária de {{t:chips|fichas}}, por isso a diferença {{t:vpip|VPIP}} − {{t:pfr|PFR}} são as mãos em que o adversário apenas {{t:call|pagou}} ou fez limp"
  level: rules
  source: "glossário de um site de um solver comercial (https://gtowizard.com/en/glossary/): «VPIP: … a statistic that measures the frequency with which a player voluntarily puts money into the pot preflop.»; site de formação, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «Anytime a player makes a call or a raise before the flop, their VPIP goes up», «a player’s PFR stat goes up anytime they make a raise before the flop, which includes all 3-bets and 4-bets as well as open raises»"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }]
- id: R-M10-002
  module: m10
  if: "a estatística do adversário baseia-se em n oportunidades"
  then: "o seu erro padrão é √(p × (1 − p) ÷ n): com {{t:vpip|VPIP}} de {{n:hud.se.ex.p}} após {{n:hud.se.ex.n}} mãos, cerca de {{n:hud.se.ex}}, por isso o verdadeiro {{t:vpip|VPIP}} está, com cerca de {{n:var.conf95}} de confiança, entre {{n:hud.ci.ex.low}} e {{n:hud.ci.ex.high}}"
  because: "cada mão é uma amostra aleatória da estratégia dele, e o erro de uma média destas só diminui com a raiz quadrada do número de oportunidades, tal como o erro do winrate no módulo 12"
  level: math
  source: "cálculo: erro padrão de uma proporção na distribuição binomial, √(p(1 − p) ÷ n), e intervalo de ±1,96 erros (numbers.yaml, chaves hud.se.*, hud.ci.*)"
  sources: [{ kind: math }]
- id: R-M10-003
  module: m10
  if: "avalia o adversário pelas estatísticas do {{t:hud|HUD}}"
  then: "abaixo de cerca de {{n:hud.hands.random}} mãos trata-as como aleatórias e joga contra ele como contra um desconhecido; o tipo de jogador vê-se aproximadamente após cerca de {{n:hud.hands.random}}–{{n:hud.hands.rough.high}} mãos, o {{t:vpip|VPIP}} e o {{t:pfr|PFR}} estabilizam após cerca de {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}}, o 3-bet após cerca de {{n:hud.hands.3bet.overall.low}}–{{n:hud.hands.3bet.high}}, e o fold to 3-bet após cerca de {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}}"
  because: "o {{t:vpip|VPIP}} ganha uma oportunidade em cada mão, e o fold to 3-bet só quando o adversário {{t:open|abriu}} e recebeu um 3-bet, por isso, com o mesmo número de mãos, tem muitas vezes menos oportunidades e um erro maior"
  level: heuristic
  source: "site de formação, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «For VPIP and PFR, you need at least 100 to 200 hands before the numbers begin to stabilize.», «For 3-bet and fold to 3-bet, closer to 500 hands is the threshold.»; site de formação, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «Below 30 hands, treat the HUD numbers as random and use hand-observation reads only.», «VPIP / PFR 30-50 hands», «3-bet % (overall) 100+ hands», «Fold to 3-bet | 200+ hands»; para VPIP e PFR, dois limiares: tipo aproximado após 30–50 mãos e estabilização após 100–200 (contradição no mesmo nível, docs/tresci/e1-m9-m11.md §3.1); para 3-bet e fold to 3-bet, limites inferiores distintos da mesma tabela (100+ e 200+), limite superior comum (D-M10-04; E3 2026-11-04)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-004
  module: m10
  if: "o {{t:vpip|VPIP}} do adversário é mais de {{n:hud.gap.passive}} pontos percentuais superior ao seu {{t:pfr|PFR}}"
  then: "é um jogador passivo: {{t:call|paga}} e faz limp muitas vezes, {{t:raise|aumenta}} pouco"
  because: "na maioria das mãos que joga, entra no {{t:pot|pote}} ao {{t:call|pagar}}; nos {{t:regular|regulares}} a diferença é pequena, porque começam quase todas as mãos com um {{t:raise|aumento}}"
  level: heuristic
  source: "site de formação, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «When a player’s PFR is more than 10 points below their VPIP, I immediately flag them as a passive player who calls too much and raises too little.»; site de formação, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «Gap > 10 → Passive player. Lots of cold-calls and limps.»; dados de controlo da análise da base de mãos da população, grande sala online NL25 6-max: jogadores recreativos 42/18, regulares 23/18 (mda.rec.*, mda.reg.*)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-005
  module: m10
  if: "atribui um tipo ao adversário pelo {{t:vpip|VPIP}} e pelo {{t:pfr|PFR}} (6-max, pelo menos cerca de {{n:hud.hands.vpip.low}} mãos)"
  then: "um {{t:nit|nit}} joga até cerca de {{n:hud.vpip.nit-max}} das mãos; um {{t:regular|regular}} cerca de {{n:hud.vpip.reg.low}}–{{n:hud.vpip.reg.high}}, com uma diferença {{t:vpip|VPIP}} − {{t:pfr|PFR}} pequena; um jogador solto a partir de cerca de {{n:hud.vpip.loose}}: com uma diferença de mais de {{n:hud.gap.passive}} pontos é um {{t:recreational|jogador recreativo}} passivo ({{t:calling-station|calling station}}), com uma diferença até cerca de {{n:hud.gap.aggressive}} pontos é um {{t:maniac|maníaco}}"
  because: "o tipo diz em que sentido o adversário se afasta da base: joga mãos a menos, mãos a mais, {{t:call|paga}} demasiadas vezes ou {{t:raise|aumenta}} demasiadas vezes"
  level: heuristic
  source: "site de formação, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/), tabela 6-max cash: «22 to 28», «35+», «14 or below»; «a player playing a 45 VPIP is either a maniac or a calling station»; «When the gap is less than 3 points, I flag them as highly aggressive»; site de formação, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «10-15% | Very tight (nit)», «18-22% | Tight-aggressive (TAG)», «25-30% | Loose-aggressive (LAG)», «35%+ | Loose (likely recreational)», perfis «Nit (15/12/3%)», «Whale / Recreational (45/8/2%)», «Maniac (38/35/15%+)»; análise da base de mãos da população: Regulars «VPIP = 18-32», Recreationals «VPIP > 40»; limiares como parte comum ou intervalo que abrange as fontes (D-M10-03)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-006
  module: m10
  if: "joga contra um {{t:recreational|jogador recreativo}} passivo ({{t:vpip|VPIP}} a partir de cerca de {{n:hud.vpip.loose}}, diferença {{t:vpip|VPIP}} − {{t:pfr|PFR}} superior a {{n:hud.gap.passive}} pontos)"
  then: "aposta por {{t:value|valor}} com mais mãos, também mais finas, e faz {{t:bluff|bluff}} menos vezes do que na base do módulo 8, sobretudo no river"
  because: "um jogador destes chega mais vezes ao showdown e perde lá mais vezes, ou seja, {{t:call|paga}} com mãos mais fracas: uma maior parte das vezes em que {{t:call|paga}} é com mãos piores do que a sua (limiar do value bet do módulo 8), e um {{t:bluff|bluff}} só lucra quando o adversário {{t:fold|desiste}} mais vezes do que o {{t:alpha|alpha}}"
  level: exploit
  population: "jogadores recreativos numa grande sala online, NL25–NL100 6-max (segundo a definição da base: VPIP > 40, resultado < −20bb/100): WTSD 32% contra 28% dos regulares, showdowns ganhos 46% contra 57%, resultado −47bb/100; todas as mãos dos 12 meses anteriores a 5.10.2026 (análise da base de mãos da população, número de mãos não indicado)"
  source: "site com análise da base de mãos da população (https://bluffaces.com/calculators/mda/), filtros: grande sala online NL25/NL50/NL100 6-max, Recreationals e Regulars (mda.rec.*, mda.reg.*), número de mãos não indicado; site de formação, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): um WTSD alto «instantly tells you to bluff them less and value bet them more across all betting streets, especially on the river.»; site de formação, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «>30% → Calling station. Value bet thinly, never bluff river.» (este limiar de WTSD não é ensinado: o site de formação indica «In most cases, your WTSD% should be around 30», e nos dados da análise da base de mãos os regulares têm 28% e os jogadores recreativos 32%; D-M10-07); limiar do value bet R-M8-001 e alpha do módulo 6 sem alterações (D-M10-06)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-007
  module: m10
  if: "um {{t:nit|nit}} ({{t:vpip|VPIP}} até cerca de {{n:hud.vpip.nit-max}} após pelo menos cerca de {{n:hud.hands.vpip.low}} mãos) {{t:raise|aumenta}} ou faz 3-bet"
  then: "{{t:fold|desiste}} mais vezes do que na base do módulo 4 com as mãos da parte de baixo do {{t:range|range}} com que {{t:call|paga}}, e rouba-lhe os blinds mais vezes"
  because: "quem joga tão poucas mãos {{t:raise|aumenta}} sobretudo com as mais fortes, por isso as suas mãos médias estão mais vezes dominadas; e, quando ele próprio defende os blinds de forma estreita, a sua {{t:open|abertura}} ganha mais vezes de imediato"
  level: exploit
  population: "um único adversário: leitura do HUD com pelo menos cerca de 100 mãos (VPIP até 14%); limiares de tipo de dois sites de formação (cash 6-max online); sem dados sobre toda a população, porque os nits são uma minoria na mesa (D-M10-02)"
  source: "site de formação, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «anyone significantly below is a nit whose raises you can nearly always fold to»; site de formação, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): nit «Plays only premium hands. Steal their blinds relentlessly, fold to their 3-bets without thought, bluff-catch sparingly.»; «10-15% | Very tight (nit) | Folds preflop too much; bluff their open ranges, fold to their 3-bets»"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-008
  module: m10
  if: "joga contra um {{t:maniac|maníaco}} ({{t:vpip|VPIP}} a partir de cerca de {{n:hud.vpip.loose}}, {{t:pfr|PFR}} quase igual ao {{t:vpip|VPIP}})"
  then: "não lhe faz {{t:bluff|bluff}}, {{t:call|paga}} mais largo com mãos que apanham {{t:bluff|bluffs}} e, com mãos muito fortes, deixa-o apostar"
  because: "as apostas e os {{t:raise|aumentos}} dele contêm mais {{t:bluff|bluffs}} do que na base, por isso as mãos que na base estão no limite para {{t:call|pagar}} passam a lucrar, e um {{t:bluff|bluff}} contra quem raramente {{t:fold|desiste}} perde"
  level: exploit
  population: "um único adversário: leitura do HUD com pelo menos cerca de 100 mãos (VPIP a partir de 35%, VPIP − PFR abaixo de 3 pontos); limiares de tipo de dois sites de formação (cash 6-max online); sem dados sobre toda a população (D-M10-02)"
  source: "site de formação, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): maníaco «Trap with premium hands by flat-calling preflop and letting them stack off. Don't try to out-bluff them; just let them hang themselves.»; site de formação, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «a player playing a 45 VPIP is either a maniac or a calling station»; princípio das mãos mistas: site de um solver comercial, Calling Down Over-Bluffed Lines in Lower Limits (R-M10-009)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: solver-pub }]
- id: R-M10-009
  module: m10
  if: "sabe que o adversário, numa determinada linha, faz {{t:bluff|bluff}} mais ou menos vezes do que em equilíbrio"
  then: "primeiro muda a decisão com as mãos que na base misturam {{t:call|pagar}} e {{t:fold|desistir}}: com excesso de {{t:bluff|bluffs}} {{t:call|paga}} sempre com elas, com falta deles {{t:fold|desiste}} sempre"
  because: "em equilíbrio estas mãos são indiferentes, porque o adversário tem exatamente os {{t:bluff|bluffs}} necessários; basta um pequeno excesso ou falta para as empurrar para um dos lados, enquanto o resto do {{t:range|range}} só muda com uma diferença grande"
  level: gto
  source: "site de um solver comercial, Calling Down Over-Bluffed Lines in Lower Limits (https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/), análise com nodelock: «Hands that mix calls and folds in theory do so because Villain’s bet size is strategically balanced, making them indifferent to calling and folding since no option is the best.»; «If they are bluffing just a single combo more than they should, all of our indifferent bluff catchers become profitable calls and vice versa (we always fold when they are under-bluffing even slightly).»; «I only changed Villain’s strategy to bluff ~31% instead of ~27% of the time for our strategy to shift completely to never folding.»"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/" }]
- id: R-M10-010
  module: m10
  if: "o adversário {{t:fold|desiste}} perante o c-bet mais vezes do que o {{t:alpha|alpha}} do seu tamanho de aposta"
  then: "um c-bet sem mão nenhuma lucra de imediato: com um c-bet de 1/3 do {{t:pot|pote}} basta mais de {{n:alpha.cbet.small}} de {{t:fold|desistências}}, com um c-bet de 3/4 do {{t:pot|pote}} mais de {{n:alpha.cbet.big}}"
  because: "um {{t:bluff|bluff}} arrisca a aposta para ganhar o {{t:pot|pote}}; lucra quando a percentagem de {{t:fold|desistências}} ultrapassa aposta ÷ ({{t:pot|pote}} + aposta); o fold to c-bet do {{t:hud|HUD}} junta todos os tamanhos e todas as mesas, por isso é apenas uma aproximação"
  level: math
  source: "cálculo: EV de um bluff puro = desistência × pote − (1 − desistência) × aposta > 0 ⇔ desistência > aposta ÷ (pote + aposta) (alpha, módulo 6; numbers.yaml alpha.cbet.*); glossário de um site de um solver comercial (https://gtowizard.com/en/glossary/): «Alpha (α): The minimum frequency your opponent needs to fold to a bet, in order to break even with a pure (0% equity) bluff.»"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M10-011
  module: m10
  if: "o adversário raramente {{t:fold|desiste}} perante um 3-bet (fold to 3-bet abaixo de cerca de {{n:hud.f3b.low}}), p. ex. um {{t:recreational|jogador recreativo}} típico"
  then: "faz-lhe 3-bet com um {{t:range|range}} {{t:linear|linear}}: mais mãos fortes por {{t:value|valor}}, quase sem {{t:bluff|bluffs}}"
  because: "um 3-bet {{t:in-position|em posição}} para {{n:pf.3bet.ip-total}} sem mão nenhuma só lucra com mais de {{n:alpha.vs-3bet-ip-size}} de {{t:fold|desistências}}; quando o adversário raramente {{t:fold|desiste}}, os {{t:bluff|bluffs}} jogam um {{t:pot|pote}} grande com mãos fracas, e as mãos fortes são {{t:call|pagas}} mais vezes"
  level: exploit
  population: "grande sala online, NL25–NL100 6-max (análise da base de mãos da população, 12 meses anteriores a 5.10.2026, número de mãos não indicado): fold to 3-bet dos jogadores recreativos 31% (NL50 30%, NL100 32%), dos regulares 55% (NL50 57%, NL100 55%)"
  source: "site com análise da base de mãos da população (https://bluffaces.com/calculators/mda/), Fold to 3bet (mda.rec.f3b, mda.reg.f3b), número de mãos não indicado; site de formação, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «if a player has a low Fold to 3-Bet, you will want to adjust your 3-betting range against them and play a more linear range made up of almost solely value hands and very few bluffs.»; site de formação, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide): «<50% → They call 3-bets wide. Drop bluff 3-bets; value-bet thinner and exploit postflop.»; limiar alpha do módulo 4 (alpha.vs-3bet-ip-size)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-012
  module: m10
  if: "tem apenas uma amostra pequena sobre o adversário ou apenas um conhecimento geral da população"
  then: "afasta-se da base apenas no sentido que as estatísticas indicam, e apenas com mãos no limite; um afastamento grande, com todo o {{t:range|range}}, só com uma amostra grande e um erro claro do adversário"
  because: "com uma amostra pequena o erro da estatística é grande, e afastar-se da base (a estratégia menos explorável) torna-o, por si só, explorável"
  level: heuristic
  source: "site de formação, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/): «The directional signal (very high VPIP, very low PFR) may still be useful even with small samples, but specific exploitation based on percentage points requires a much larger hand history.»; glossário de um site de um solver comercial (https://gtowizard.com/en/glossary/): «Exploit: To deviate from a baseline strategy in order to take advantage of a (future or prior) mistake in your opponent's strategy.», «Game Theory Optimal (GTO) The least exploitable fixed strategy»; erro da amostra: R-M10-002"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://gtowizard.com/en/glossary/" }]
- id: R-M10-013
  module: m10
  if: "joga cash 6-max nos níveis micro (NL2–NL25)"
  then: "conta o resultado depois do {{t:rake|rake}}: as grandes salas online cobram cerca de {{n:rake.micro.low}}–{{n:rake.micro.high}}, ou seja, várias vezes mais do que o winrate de um jogador vencedor típico ({{n:var.wr.typical.low}}–{{n:var.wr.typical.high}})"
  because: "o {{t:rake|rake}} é pago por todos os jogadores, de cada {{t:pot|pote}} que chega ao flop; para ganhar, tem de superar os adversários por mais do que o {{t:rake|rake}}"
  level: heuristic
  source: "site de calculadoras de póquer, Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/), NLH 6-max, duas grandes salas online NL2–NL25 (rake.micro.*); dados de controlo da população: Tombos21, rake por jogador NL10 9,1bb/100, NL100 7,3bb/100 (rake.pop.*); site de notícias, How Many Winning Cash Games Players Are There? It Depends on Rake (https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players), Tombos21: «Reminder that your biggest villain is the house.», «Pre-rake winners 90% post-rake winners 53%»; treinador com blogue de formação (var.wr.typical.*, módulo 12)"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: population, url: "https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players" }, { kind: training }]
- id: R-M10-014
  module: m10
  if: "enfrenta uma {{t:open|abertura}} num jogo com {{t:rake|rake}} cobrado apenas nos {{t:pot|potes}} que chegam ao flop"
  then: "{{t:call|paga}} menos vezes do que num jogo sem {{t:rake|rake}}; com parte das mãos com que sem {{t:rake|rake}} {{t:call|pagaria}} passa a fazer 3-bet, e com o resto {{t:fold|desiste}}"
  because: "o {{t:rake|rake}} leva parte do {{t:pot|pote}} depois do flop, e um {{t:pot|pote}} que termina antes do flop está isento: {{t:call|pagar}} normalmente leva ao flop e paga {{t:rake|rake}}, o 3-bet termina muitas vezes a mão antes do flop, sem {{t:rake|rake}}, e {{t:fold|desistir}} não custa nada (algumas salas cobram {{t:rake|rake}} também nos {{t:pot|potes}} com 3-bet sem flop, por isso aí o 3-bet também paga)"
  level: gto
  source: "site de um solver comercial, Preflop Raise Sizing: Examining 2 Key Factors (https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/), soluções 200bb 6-max com rake de NL100: «Facing a LJ raise, the HJ, CO, and BTN all VPIP 25%-35% fewer hands in the raked game.», «Rake makes calling raises considerably less appealing, leading to much lower VPIPs and somewhat higher 3-betting frequencies in “no flop, no drop” games.», «BB calls a min-raise in the raked game barely 60% as often as in the unraked game»; simplificação: resultado para 200bb, o autor: «many of the principles will generalize»; estruturas de rake das salas: site de calculadoras de póquer, API /network-rake-list, campo rule: segunda grande sala online «flop_drop», grande sala online «flop_or_3b_drop» (leitura de 5.10.2026)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/" }, { kind: training }]
- id: R-M10-015
  module: m10
  if: "calcula a equity necessária num jogo com {{t:rake|rake}}"
  then: "divide o valor a pagar pelo {{t:pot|pote}} depois de {{t:call|pagar}}, descontado o {{t:rake|rake}}: com uma aposta de meio {{t:pot|pote}} e {{t:rake|rake}} de {{n:rake.ex.pct}} precisa de {{n:eq.bet-half.rake}} em vez de {{n:eq.bet-half}}"
  because: "ganha o {{t:pot|pote}} sem o {{t:rake|rake}}, mas paga o valor inteiro; nos níveis micro os {{t:pot|potes}} raramente chegam ao {{t:rake-cap|limite de rake}}, por isso o que conta é a percentagem"
  level: math
  source: "cálculo: valor a pagar ÷ (pote depois de pagar × (1 − rake)) (numbers.yaml eq.bet-half.rake); site de calculadoras de póquer, Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/): «At microstakes, percentage drives the cost because pots rarely hit the cap.»"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: math }]

# M12: mental game i bankroll. Poziomy według ADR-24: rachunek = math, zalecenie oparte na rachunku lub literaturze = heuristic.
- id: R-M12-001
  module: m12
  if: "avalia o seu resultado ou winrate a partir de uma amostra de mãos"
  then: "calcula um intervalo: winrate ± {{n:var.z95}} × SD ÷ √(número de mãos ÷ 100)"
  because: "com SD {{n:var.sd}}, mesmo após {{n:var.hands.k}} mil mãos o intervalo de {{n:var.conf95}} tem cerca de ± {{n:var.ci.wr}}, por isso um resultado de {{n:var.wr.ex}} significa apenas «entre cerca de {{n:var.wr.ci.low}} e {{n:var.wr.ci.high}}»"
  level: math
  source: "cálculo: erro padrão da média (distribuição normal); SD de um site de calculadoras de póquer, Examples and Impacts of Variance in Cash Games e Poker Variance Calculator"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-002
  module: m12
  if: "entra num {{t:downswing|downswing}} de {{n:dd.bi.small}} {{t:buy-in|buy-ins}}"
  then: "não o trata como prova de mau jogo; em vez disso, revê as decisões nas mãos perdidas"
  because: "em {{n:var.hands.k}} mil mãos, um {{t:downswing|downswing}} destes desde o pico acontece a cerca de {{n:dd.p.small.100k}} dos jogadores que ganham {{n:var.wr.ex}} (SD {{n:var.sd}})"
  level: heuristic
  source: "cálculo: simulação de Monte Carlo (numbers.yaml, chaves dd.*); um site de calculadoras de póquer, Examples and Impacts of Variance in Cash Games, indica para este cenário um número mais baixo (relatório M12)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-003
  module: m12
  if: "quer saber quanto ganha realmente"
  then: "recolhe centenas de milhares de mãos: uma precisão de ± {{n:var.target}} com {{n:var.conf95}} de confiança exige cerca de {{n:var.need.hands.k}} mil mãos"
  because: "o erro da estimativa diminui com a raiz quadrada do número de mãos: blocos de 100 mãos necessários = ({{n:var.z95}} × SD ÷ precisão)²"
  level: math
  source: "cálculo: (1,96 × 80 ÷ 2)² blocos; consistente com a ordem de grandeza do documento 08 (cerca de 615 mil mãos)"
  sources: [{ kind: math }]
- id: R-M12-004
  module: m12
  if: "avalia a sua jogada depois de uma mão"
  then: "pergunta-se sobre a decisão (o preço, a equity, a informação que tinha), e não sobre se ganhou"
  because: "uma boa decisão perde com regularidade: um all-in com AA contra KK perde em cerca de {{n:res.kk-wins}} dos casos, e as pessoas avaliam as decisões pelo resultado mesmo assim, ainda que saibam que não deviam"
  level: heuristic
  source: "Baron e Hershey (1988), Outcome bias in decision evaluation, J Pers Soc Psychol 54(4); Annie Duke sobre o «resulting» (Masters in Business, Ritholtz 2018); equity AA–KK: cálculo exato (documento 08)"
  sources: [{ kind: math }, { kind: book }, { kind: study }]
- id: R-M12-005
  module: m12
  if: "o resultado de algumas {{t:session|sessões}} leva-o a querer mudar de estratégia"
  then: "só a muda depois de rever as mãos, e não com base apenas no resultado"
  because: "mesmo os melhores {{n:skill.pct}} dos jogadores só ao fim de cerca de {{n:skill.hands}} mãos ficam à frente dos piores {{n:skill.pct}} em cerca de {{n:skill.ahead}} dos casos, e diferenças menores de habilidade precisam de muito mais mãos"
  level: heuristic
  source: "van Loon, van den Assem e van Dolder (2015), Beyond Chance? The Persistence of Performance in Online Poker, PLoS ONE 10(3)"
  sources: [{ kind: study }]
- id: R-M12-006
  module: m12
  if: "nota os primeiros sinais de tilt do seu perfil (p. ex. raiva depois de um bad beat, vontade de castigar o adversário)"
  then: "reage de imediato: uma respiração e uma frase preparada que lembra porque é que aquilo é {{t:variance|variância}} ou um erro com que aprender"
  because: "quando o tilt cresce, deixa de pensar com clareza, e aí já não é possível controlá-lo"
  level: heuristic
  source: "Tendler, entrevista num site de notícias (2014) («When tilt becomes too intense, it shuts down your ability to think», «you must begin correcting tilt when it's small»); Tendler e Carter, The Mental Game of Poker (2011), técnica «injecting logic»"
  sources: [{ kind: book }]
- id: R-M12-007
  module: m12
  if: "depois de uma série de perdas já não consegue avaliar as decisões com calma (p. ex. só pensa em recuperar ou joga mãos com que normalmente {{t:fold|desiste}})"
  then: "termina a {{t:session|sessão}}"
  because: "continuar a jogar neste estado é jogar ao seu pior nível (C-game), e o objetivo é parar mais cedo, antes de perder a capacidade de pensar com clareza"
  level: heuristic
  source: "Tendler e Carter, The Mental Game of Poker (2011), excerto «Inchworm» (excerto publicado online): «quit sooner when it's no longer possible to recover a solid thought process»"
  sources: [{ kind: book }]
- id: R-M12-008
  module: m12
  if: "trabalha no seu jogo"
  then: "começa por melhorar as piores jogadas (C-game), e não por aperfeiçoar as melhores"
  because: "melhorar o pior jogo dá um progresso constante e liberta atenção para aprender coisas novas"
  level: heuristic
  source: "Tendler e Carter, The Mental Game of Poker (2011), excerto «Inchworm» (excerto publicado online); Tendler, The Inchworm Concept (jaredtendler.com)"
  sources: [{ kind: book }]
- id: R-M12-009
  module: m12
  if: "calcula o {{t:risk-of-ruin|risco de ruína}}, ou seja, de perder todo o bankroll"
  then: "usa a fórmula RoR = e^(−2 × winrate × bankroll ÷ SD²), com o bankroll em bb; é uma aproximação que pressupõe winrate e SD constantes"
  because: "com {{n:var.wr.typical.high}} e SD {{n:var.sd}}, um bankroll de {{n:br.bi.base}} {{t:buy-in|buy-ins}} dá cerca de {{n:ror.base}} de risco, e {{n:br.bi.move-down}} {{t:buy-in|buy-ins}} já cerca de {{n:ror.half}}"
  level: math
  source: "site de calculadoras de póquer, Risk of Ruin Formula for Poker Players («RoR = e^(-2 x WR x BR / SD^2)»); valores: cálculo (numbers.yaml, chaves ror.*)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-011
  module: m12
  if: "o bankroll cai para metade do número de {{t:buy-in|buy-ins}} previsto (com {{n:br.bi.base}}, para {{n:br.bi.move-down}})"
  then: "desce um {{t:stakes|limite}} o mais tardar nesse momento, e só volta a subir quando tiver o bankroll completo em {{t:buy-in|buy-ins}} do {{t:stakes|limite}} superior"
  because: "{{t:downswing|downswings}} de {{n:dd.bi.small}} {{t:buy-in|buy-ins}} em {{n:var.hands.k}} mil mãos acontecem a quase todos os jogadores que ganham de {{n:dd.wr-low}} a {{n:var.wr.ex}} (simulação com SD {{n:var.sd}}), algumas fontes aconselham descer logo depois de uma perda destas, e com {{n:br.bi.move-down}} {{t:buy-in|buy-ins}} o risco de perder o resto sobe de cerca de {{n:ror.base}} para cerca de {{n:ror.half}} (com winrate {{n:var.wr.typical.high}} e SD {{n:var.sd}})"
  level: heuristic
  source: "site de formação, Bankroll Management («half the roll, which is the point to move down a stake»); site de formação, Poker Bankroll Management Strategy (com 3bb/100, descer aos 30 buy-ins, ou seja, com o bankroll completo); site de calculadoras de póquer, Risk of Ruin Formula for Poker Players («Losing 10 should trigger a move down»); cálculo do risco de ruína e simulação de downswings"
  sources: [{ kind: training }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M12-012
  module: m12
  if: "planeia o tempo dedicado ao póquer"
  then: "no início dedica cerca de {{n:study.beginner}} do tempo ao estudo; quando já ganha no seu {{t:stakes|limite}}, cerca de {{n:study.winner}}, mas nunca menos de {{n:study.min}}"
  because: "no início é quando tem mais terreno a recuperar, e quando já ganha no seu {{t:stakes|limite}} pode jogar mais"
  level: heuristic
  source: "site de formação, What should your study-to-play ratio be (artigo de Dara O'Kearney): «New players have so much catching up to do»; «Once you are beating the games you are in you can start to reduce the study and increase the grinding»"
  sources: [{ kind: training }]

# M11: turnieje i short stacki (moduł opcjonalny). Zakresy push/fold z własnego solvera (pushfold.json, heads-up mały
# blind kontra duży blind, zwalidowany z równowagą Nasha, dokument 10); progi i pojęcia z przeczytanych źródeł (raport M11).
- id: R-M11-001
  module: m11
  if: "num {{t:tournament|torneio}} tem cerca de {{n:m11.thr.pushfold}} ou menos e todos antes de si {{t:fold|desistiram}}"
  then: "joga all-in ou {{t:fold|desiste}} (push/fold); entre {{n:m11.thr.pushfold}} e {{n:m11.thr.upper}} o push/fold é o método principal para mãos mais fracas e médias, e acima de cerca de {{n:m11.thr.raise}} normalmente faz um aumento normal"
  because: "com {{t:short-stack|short stack}}, aumentar e depois {{t:fold|desistir}} perante um {{t:raise|aumento}} entrega demasiadas {{t:chips|fichas}}, e o all-in arranca o máximo de {{t:fold|desistências}} ao adversário; é uma simplificação: solvers com mais opções de ação fazem limp ou aumento mínimo com parte das mãos"
  level: heuristic
  source: "site de formação, Short Stack Strategy (https://pokercoaching.com/blog/short-stack-strategy-2/): «At 10 big blinds or fewer, it is almost entirely push/fold», «This approach simplifies decision-making and maximizes fold equity», «At 15 big blinds, the landscape shifts significantly. Push/fold becomes your dominant framework for weak and medium holdings»; site de formação, Push/Fold Tournament Strategy (https://upswingpoker.com/push-fold-tournament-strategy-charts/): «around 15 big blinds (bb) or fewer», «larger than 20bb … Raising First In»; site de um solver comercial, Short-Stacked Play in MTTs (https://blog.gtowizard.com/short-stacked-play-in-mtts/): «The standard advice for a 10bb stack is to play an all-in or fold strategy»; simplificação: site de formação (mesma página): «the all-in or fold binary was grossly suboptimal»; escola que publica resultados de solver, heads-up 10bb (https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments): «61.1% limp, 28.8% all-in, 10.1% fold»"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/short-stack-strategy-2/" }, { kind: training, url: "https://upswingpoker.com/push-fold-tournament-strategy-charts/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/short-stacked-play-in-mtts/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments" }]
- id: R-M11-002
  module: m11
  if: "joga push/fold do {{t:small-blind|small blind}} contra o {{t:big-blind|big blind}}"
  then: "quanto mais curto o stack, com mais mãos faz {{t:shove|shove}} all-in: com {{n:m11.depth.15}} cerca de {{n:m11.push.15}} das mãos, com {{n:m11.depth.10}} cerca de {{n:m11.push.10}}, com {{n:m11.depth.5}} cerca de {{n:m11.nash.push.5}}–{{n:m11.push.5}}"
  because: "com um stack mais curto arrisca menos em relação aos blinds que recolhe quando o adversário {{t:fold|desiste}}, e o adversário tem de {{t:call|pagar}} mais largo"
  level: gto
  source: "solver push/fold do projeto (content/ranges/pushfold.json; heads-up, sem ante, equilíbrio de Nash do jogo all-in ou desistir, validação com 10bb no documento 10; com 5bb, intervalo a partir de um equilíbrio calculado de forma independente, docs/tresci/e1b-solver.md, D-153); comparação: site de formação, Push/Fold Play: Nash Ranges (https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/), 10bb: «56.6%» de push"
  sources: [{ kind: training, url: "https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/" }, { kind: solver-app }]
- id: R-M11-003
  module: m11
  if: "há ante no {{t:pot|pote}}"
  then: "faz {{t:shove|shove}} all-in com mais mãos do que sem ante: com {{n:m11.depth.10}} e {{t:bb-ante|big blind ante}} de {{n:m11.ante}}, cerca de {{n:m11.nash.push.10-ante}}–{{n:m11.push.10-ante}} em vez de {{n:m11.push.10}}"
  because: "o ante aumenta o {{t:pot|pote}} que recolhe quando o adversário {{t:fold|desiste}}, e o risco do all-in mantém-se igual"
  level: gto
  source: "solver push/fold do projeto (pushfold.json, variante 10bb-ante: heads-up, big blind ante 1bb); validação: docs/tresci/e1b-solver.md (D-153), cálculo no mesmo modelo (equilíbrio por fictitious play 71,05%, limite inferior do intervalo em then); direção consistente com a literatura: site de formação, Push Fold Charts (https://pokercoaching.com/push-fold-charts/): «When antes are in play, your preflop shoving range should be wider»"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: solver-app }]
- id: R-M11-004
  module: m11
  if: "vai all-in em primeiro lugar"
  then: "ganha de duas formas: o adversário {{t:fold|desiste}} e recolhe o {{t:pot|pote}}, ou ele {{t:call|paga}} e ganha no showdown; uma mão sem hipóteses, no entanto, precisaria de que o adversário {{t:fold|desistisse}} em mais de {{n:m11.push.10.alpha}} dos casos (com {{n:m11.depth.10}} sem ante)"
  because: "arrisca {{n:m11.push.10.risk}} para ganhar {{n:m11.push.10.win}} de blinds; por isso contam tanto a fold equity como a equity da mão quando o adversário {{t:call|paga}}"
  level: math
  source: "cálculo: alpha = risco ÷ (pote + risco) (M6); fold equity: glossário de um site de um solver comercial (https://gtowizard.com/en/glossary/): «Fold equity The amount of value a player will win by making another player fold.»"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M11-005
  module: m11
  if: "o M (stack ÷ custo de uma volta: blinds e antes) desce para cerca de {{n:m11.m.red}} ou menos"
  then: "joga apenas all-in ou {{t:fold|desiste}} e procura ser o primeiro a entrar no {{t:pot|pote}}"
  because: "sem jogar, o stack dura poucas voltas, e um aumento normal entrega demasiadas {{t:chips|fichas}}"
  level: heuristic
  source: "Harrington (através de resumos): Wikipedia, M-ratio (https://en.wikipedia.org/wiki/M-ratio): «The M-ratio is calculated by the formula» (fórmula como fração: stack ÷ (small blind + big blind + total de antes)), na tabela de zonas «Your only move is to move all-in or fold»; site de formação, Dan Harrington M-Factor (https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/): «Red zone: 1 < = M < = 5», «your only and best option in this phase is to be the first to push in the pot»; um único limite de cerca de 5 (D-147)"
  sources: [{ kind: reference, url: "https://en.wikipedia.org/wiki/M-ratio" }, { kind: training, url: "https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/" }]
- id: R-M11-006
  module: m11
  if: "do {{t:big-blind|big blind}} {{t:call|paga}} o all-in do {{t:small-blind|small blind}} com um stack S (sem ante)"
  then: "precisa de uma equity de (S − {{n:pf.blind.bb}}) ÷ 2S: com {{n:m11.depth.10}} {{n:m11.call.10.eq}}, com {{n:m11.depth.5}} {{n:m11.call.5.eq}}, com {{n:m11.depth.15}} {{n:m11.call.15.eq}}"
  because: "o blind já está no {{t:pot|pote}}, por isso paga S − {{n:pf.blind.bb}}, e o {{t:pot|pote}} depois de {{t:call|pagar}} tem 2S"
  level: math
  source: "cálculo: equity necessária = valor a pagar ÷ pote depois de pagar (M2)"
  sources: [{ kind: math }]
- id: R-M11-007
  module: m11
  if: "o adversário foi all-in e está a decidir se {{t:call|paga}}"
  then: "{{t:call|paga}} com um {{t:range|range}} mais apertado do que aquele com que faria {{t:shove|shove}} all-in: com {{n:m11.depth.10}} o {{t:big-blind|BB}} {{t:call|paga}} com cerca de {{n:m11.call.10}} das mãos, e o {{t:small-blind|SB}} faz {{t:shove|shove}} com cerca de {{n:m11.push.10}}"
  because: "quem paga só ganha no showdown, e contra um {{t:range|range}} já mais forte do que um aleatório; quem faz {{t:shove|shove}} também ganha quando o adversário {{t:fold|desiste}}"
  level: gto
  source: "solver push/fold do projeto (pushfold.json); site de formação, Push Fold Charts (https://pokercoaching.com/push-fold-charts/): «Calling ranges are tighter than shoving ranges»; site de formação, The Gap Concept (https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/): «you need a better hand to call a raise with than you would need to open a pot with a raise» (Sklansky)"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: training, url: "https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/" }, { kind: solver-app }]
- id: R-M11-008
  module: m11
  if: "quer converter os stacks de torneio em dinheiro ({{t:icm|ICM}})"
  then: "probabilidade do 1.º lugar = o seu stack ÷ todas as {{t:chips|fichas}}; a probabilidade do 2.º lugar calcula-se da mesma forma entre os jogadores que restam, para cada vencedor possível; equity = soma das probabilidades × {{t:payout|prémios}}"
  because: "este modelo pressupõe que os jogadores têm a mesma habilidade, por isso só os stacks decidem a ordem"
  level: math
  source: "site de um solver comercial, ICM Basics (https://blog.gtowizard.com/icm-basics/): «The Independent Chip Model assumes all players are equally skilled, and therefore the probability of winning is purely a function of stack sizes», secção Limitations of ICM: «ICM doesn’t consider players’ positions.», «ICM ignores blinds increasing.» (leitura de 2026-11-09), «divide their chips by the total amount of chips in play», «Assume one of the other players wins, remove their chips from play, and divide our chips by the remaining chips in play»; cálculo com stacks de exemplo (relatório E1 M9–M11)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: math }]
- id: R-M11-009
  module: m11
  if: "num {{t:tournament|torneio}} com {{t:icm|ICM}} {{t:call|paga}} um all-in que o pode eliminar"
  then: "precisa de uma equity de BF ÷ (BF + 1), em que o bubble factor BF = equity perdida quando perde ÷ equity ganha quando ganha; no exemplo da lição, {{n:m11.bf.req}} em vez de {{n:m11.bf.req-chips}} em {{t:chips|fichas}}"
  because: "num {{t:tournament|torneio}} com {{t:payout|prémios}}, perder custa mais dinheiro do que ganhar acrescenta, por isso {{t:call|pagar}} tem de ganhar mais vezes do que num jogo a {{t:chips|fichas}}"
  level: math
  source: "cálculo de ICM (numbers.yaml, chaves m11.bf.*); site de um solver comercial, What Is the Bubble Factor (https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/): «$EV lost when you lose / $EV gained when you win = Bubble Factor», «Required Equity = Bubble Factor / (Bubble Factor + 1)»"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/" }, { kind: math }]
- id: R-M11-010
  module: m11
  if: "é a {{t:bubble|bubble}} ou a {{t:final-table|mesa final}}, e tem um stack médio"
  then: "{{t:call|paga}} all-ins de forma claramente mais apertada do que num jogo a {{t:chips|fichas}}, e um stack grande que o {{t:cover|cobre}} pode fazer {{t:shove|shove}} mais largo"
  because: "{{t:risk-premium|prémio de risco}}: as {{t:chips|fichas}} ganhas valem menos do que as perdidas, e, ao fazê-lo, o risco para o stack grande é menor do que para si"
  level: heuristic
  source: "site de um solver comercial, ICM Basics (https://blog.gtowizard.com/icm-basics/): «chips won are worth less than chips lost» (texto sem marcação de cores), «Big stacks can threaten smaller stacks as they take on less risk when stacking off»; site de formação, ICM at Final Tables (https://upswingpoker.com/icm-final-tables/): «When it comes to calling versus shoves, you have to tighten up dramatically when big money is on the line»; site de formação, Big Stack Advantage (https://upswingpoker.com/big-stack-advantage-stone-bubble/): «Risk premiums are the additional equity needed to play for stacks. This means responding ranges tighten up considerably»; Ganzfried e Sandholm, AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf), tabela 2: o big blind, depois de dois all-ins, paga no torneio «0.021» e numa mão isolada «0.197»"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: training, url: "https://upswingpoker.com/icm-final-tables/" }, { kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }]
- id: R-M11-011
  module: m11
  if: "joga push/fold e atrás de si ficaram mais jogadores que podem {{t:call|pagar}}"
  then: "faz {{t:shove|shove}} all-in mais apertado: com três jogadores e {{n:m11.depth.3max}}, o Button com cerca de {{n:m11.3max.push.btn}} das mãos, e o {{t:small-blind|small blind}}, depois de o Button desistir, com cerca de {{n:m11.3max.push.sb}}"
  because: "cada jogador adicional é mais uma hipótese de alguém acordar com uma mão forte, por isso é mais raro todos {{t:fold|desistirem}}"
  level: gto
  source: "solver push/fold do projeto (content/ranges/pushfold.json, três jogadores); consistente com Ganzfried e Sandholm, AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf), tabela 2, mão isolada: «Button jam … 0.355», «SB jam after fold … 0.633» (frequências dos nós coincidentes dentro de 1,2 pp, relatório M11)"
  sources: [{ kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }, { kind: solver-app }]
- id: R-M11-012
  module: m11
  if: "{{t:call|paga}} um all-in e atrás de si ainda há um jogador, ou alguém já {{t:call|pagou}}"
  then: "{{t:call|paga}} mais apertado: com três jogadores e {{n:m11.depth.3max}}, o {{t:small-blind|small blind}} {{t:call|paga}} o all-in do Button com cerca de {{n:m11.3max.call.sb}} das mãos, o {{t:big-blind|big blind}} (quando o {{t:small-blind|SB}} {{t:fold|desistiu}}) com cerca de {{n:m11.3max.call.bb}}, e, quando já há dois jogadores all-in, apenas com cerca de {{n:m11.3max.call.bb-two}}, embora o preço desça para {{n:m11.3max.bb-two.eq}}"
  because: "o jogador atrás de si pode ter uma mão forte e entrar, e contra dois {{t:range|ranges}} a equity da sua mão diminui depressa; os preços do {{t:small-blind|SB}} e do {{t:big-blind|BB}} diferem pouco, por isso a diferença vem sobretudo do jogador atrás de si"
  level: gto
  source: "solver push/fold do projeto (pushfold.json, três jogadores); consistente com Ganzfried e Sandholm, AAMAS 2008, tabela 2, mão isolada: «SB jam after jam … 0.234», «BB jam after jam/fold … 0.308», «BB jam after jam/jam … 0.197»"
  sources: [{ kind: solver-app }, { kind: study }]

# M13: analiza własnej gry (dokument 14, sekcja 8; decyzje D-M13-12…15 w dokumencie „12 Weryfikacja źródeł — M10–M13”).
# „Decyzja, nie wynik” uczy R-M12-004 (jedna reguła na jedno pojęcie); mechanika powtórek z gry to opis aplikacji,
# więc jest w tekście lekcji, a nie w księdze reguł.
- id: R-M13-001
  module: m13
  if: "perdeu um all-in tendo mais {{t:equity|equity}} do que o adversário"
  then: "não muda de estratégia por causa desta mão: com {{t:equity|equity}} e, perde em média 1 − e destas mãos, p. ex. com {{n:m13.eq.example}} em cerca de {{n:m13.lose.example}}, ou seja, {{n:m13.lose.of-ten}} em cada {{n:m13.ten}}"
  because: "a {{t:equity|equity}} é a proporção de vitórias em muitas repetições da mesma situação; a derrota cabe nesse cálculo"
  level: math
  source: "cálculo: P(derrota) = 1 − equity (com divisão do pote, correspondentemente menos)"
  sources: [{ kind: math }]
- id: R-M13-002
  module: m13
  if: "o solver joga a sua mão num determinado spot de duas formas ({{t:mixed-hand|mão mista}})"
  then: "cada uma destas jogadas é correta; o relatório marca a menos frequente como aceitável quando o solver a joga em pelo menos {{n:range.mixed.min}}, mas em menos de {{n:range.mixed.low}} dos casos"
  because: "em equilíbrio, um jogador só mistura jogadas com o mesmo {{t:expected-value|valor esperado}}"
  level: gto
  source: "site de um solver comercial, Principles of GTO (https://blog.gtowizard.com/principles-of-gto/): «Unexploitable play mixes between two or more options only when these options have the same EV.»; limiar de jogada rara: site de um solver comercial, Measure Performance (https://help.gtowizard.com/measure-performance/): «Inaccuracy – Moves that are taken less than 3.5% of the time in GTO, but don’t lose significant EV.» (ADR-26)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/principles-of-gto/" }]
- id: R-M13-003
  module: m13
  if: "troca os naipes de todas as cartas com uma única permutação (p. ex. copas por espadas, espadas por copas)"
  then: "a decisão correta não muda"
  because: "a força das mãos e dos {{t:draw|draws}} depende de os naipes coincidirem, e não de quais são esses naipes; por isso a revisão do jogo mostra a mesma situação com outros naipes"
  level: math
  source: "cálculo: o ranking das mãos não distingue naipes (regras do Texas Hold'em), e uma permutação de naipes preserva quais as cartas que partilham o mesmo naipe; verificado no poker-core com um teste de propriedades (documento 02, documento 14, 5.6)"
  sources: [{ kind: math }]
- id: R-M13-004
  module: m13
  if: "depois de uma {{t:session|sessão}} quer avaliar as suas frequências (p. ex. com que frequência entra no jogo ou {{t:fold|desiste}} perante um 3-bet)"
  then: "não tira conclusões: conta oportunidades, e não mãos; olha para uma estatística a partir de cerca de {{n:hud.opps.look}} oportunidades, e ganha confiança por volta de {{n:hud.opps.sure}}"
  because: "até o {{t:vpip|VPIP}} só se lê após cerca de {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}} mãos (como no M10), e uma situação rara surge poucas vezes numa {{t:session|sessão}}"
  level: heuristic
  source: "treinador com blogue de formação, Poker HUD Stats: The Sample Size You Need (https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html): «For me personally I usually want at least 5 to even bother looking, and 10 to be sure.»; amostras de mãos como em R-M10-003 (site de formação, site de formação)"
  sources: [{ kind: training, url: "https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html" }, { kind: training }, { kind: training }]
- id: R-M13-005
  module: m13
  if: "durante o jogo não sabe o que fazer, ou uma mão lhe pareceu estranha"
  then: "apenas a marca, e analisa-a depois da {{t:session|sessão}}, algumas horas ou dias depois, de cabeça fria"
  because: "uma análise logo após uma grande perda ou com cansaço está marcada pelas emoções"
  level: heuristic
  source: "blogue de uma aplicação de análise de mãos, How to Review Your Poker Hands (https://blog.checkreplay.com/poker-hand-review/): «Mark hands that felt interesting, confusing, or off. Don’t analyze them yet.»; «The best time to review is hours or days after the session, with a clear head.»; «What doesn’t work is reviewing while you’re still steaming or while you’re tired.»"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }]
- id: R-M13-006
  module: m13
  if: "perdeu um {{t:pot|pote}} grande ou, numa mão, não soube o que fazer"
  then: "revê essa mão; não dedica muito tempo a um cooler (duas mãos fortes, nenhuma das quais podia razoavelmente {{t:fold|desistir}}) nem a um bad beat"
  because: "coolers e bad beats acontecem a todos, e as mãos com uma decisão difícil estão entre as que vale a pena rever"
  level: heuristic
  source: "blogue de uma aplicação de análise de mãos, How to Review Your Poker Hands (https://blog.checkreplay.com/poker-hand-review/): «Big pots, especially the ones you lost.»; «Hands where you weren’t sure what to do.»; treinador com blogue de formação, How to Effectively Conduct Poker Hand Reviews (https://www.blackrain79.com/2014/02/how-to-effectively-conduct-poker.html): «Coolers and bad beats happen to everybody. Learn how to differentiate them from the hands that matter and don't spend much time on them»"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }, { kind: training, url: "https://www.blackrain79.com/2014/02/how-to-effectively-conduct-poker.html" }]
- id: R-M13-007
  module: m13
  if: "revê uma decisão difícil"
  then: "primeiro anota a primeira reação (p. ex. «aqui é fácil {{t:call|pagar}}»), e só depois faz as contas"
  because: "a diferença entre a primeira reação e o cálculo mostra onde a intuição o engana e, com o tempo, melhora-a"
  level: heuristic
  source: "site de formação, 6 Steps to Analyze a Poker Hand (https://upswingpoker.com/analyze-poker-hand-techniques/): «Step 4: Take note of your gut reaction»; «be sure to take notes regarding the differences between your initial presumption––which is typically optimistic, in my experience––and the realistic result. This will help you improve your intuitive strategy over time.»"
  sources: [{ kind: training, url: "https://upswingpoker.com/analyze-poker-hand-techniques/" }]
- id: R-M13-008
  module: m13
  if: "não sabe como o adversário joga e está a rever uma decisão perante uma {{t:bet|aposta}} dele"
  then: "avalia-a com um pressuposto otimista, um pessimista e um realista sobre o {{t:range|range}} dele; se a decisão for boa mesmo com o pessimista, não precisa de calcular mais"
  because: "os pressupostos extremos delimitam o intervalo em que se encontra a realidade, por isso uma decisão boa em ambos resiste a um erro de leitura"
  level: heuristic
  source: "site de formação, 6 Steps to Analyze a Poker Hand (https://upswingpoker.com/analyze-poker-hand-techniques/): «The Optimist The Pessimist The Realist»; «I pick the extremes first, because they shape the polar ends of the spectrum.»; «When the Pessimist gets such a favorable result, I don’t bother analyzing the hand through the Realist’s eyes, because it will also be favorable.»"
  sources: [{ kind: training, url: "https://upswingpoker.com/analyze-poker-hand-techniques/" }]
