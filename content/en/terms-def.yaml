royal-flush: "The highest hand in poker: ace, king, queen, jack and ten of the same suit, e.g. A♠ K♠ Q♠ J♠ T♠."
straight-flush: "Five consecutive cards of the same suit, e.g. 5♥ 6♥ 7♥ 8♥ 9♥. The highest version (ace down to ten) has its own name and is the strongest hand in the game."
four-of-a-kind: "Four cards of the same rank, e.g. four sevens. If two players have four of a kind of the same rank, the higher fifth card (the kicker) wins."
full-house: "Three of a kind plus a pair in one hand, e.g. three queens and two fives. Between two full houses, the higher three of a kind wins."
flush: "Five cards of the same suit (♠, ♥, ♦ or ♣) that are not in sequence. Between two such hands, the one with the higher top card wins; if those are equal, the next card decides."
straight: "Five consecutive cards, not all of the same suit, e.g. 5-6-7-8-9. The ace can be the highest card (A-K-Q-J-T) or the lowest (A-2-3-4-5)."
three-of-a-kind: "Three cards of the same rank and two other cards. In hold'em it has two versions with their own names: a set, when the pair is in your hand and the third card is on the board, and trips, when the pair is on the board and the third card is in your hand."
set: "Three of a kind made from a pair in your hand and one card on the board, e.g. 7♣ 7♦ on a K-7-2 flop."
two-pair: "Two different pairs and a fifth card, e.g. K-K-8-8-3. Ties are decided first by the higher pair, then the lower pair, and finally the fifth card."
pair: "Two cards of the same rank and three other cards, e.g. two nines. Only high card is weaker."
high-card: "A hand with no pair or better combination; its strength is set by the highest card, and on a tie by the next ones."
kicker: "The highest card outside the made hand, used to break a tie. Example: a pair of aces with a king beats a pair of aces with a queen."
wheel: "The lowest straight: A-2-3-4-5, where the ace counts as the lowest card."
check: "Continuing without putting in chips, possible only when you don't have to add anything: nobody has bet yet in this betting round (before the flop, the big blind can do this when nobody has raised). Not to be confused with call, which means adding chips to match an opponent's bet."
bet: "The first chips put in during a betting round in which nobody has bet yet (in a broader sense, any chips put into the pot are called a bet)."
call: "Putting into the pot the amount of an opponent's bet or raise so you can keep playing. Not to be confused with check, which means continuing without betting when nobody has bet."
raise: "Increasing the amount above an opponent's bet; the other players must add the difference, raise again or fold."
fold: "Giving up the hand: you throw away your cards and lose whatever you have already put into the pot."
check-raise: "You check first, and when an opponent bets, you raise them in the same betting round."
all-in: "Betting all of your chips. From each opponent you can then win at most as much as you put in yourself; the rest is played for in a side pot."
pot: "All the chips bet in the current hand. They go to the player with the best hand at showdown (with side pots, each pot is decided separately) or to the player left when everyone else folds."
side-pot: "A separate pot created when someone is all-in: only players who put in more than the all-in player compete for it, so the all-in player cannot win it."
split-pot: "A situation where players with equal hands share the pot, e.g. when both are playing the same straight on the board."
playing-the-board: "A situation where your best five-card hand is made only of community cards; your hole cards add nothing, so at best you split the pot."
board: "The face-up community cards in the middle (flop, turn, river) that all players use. It means the cards, not the table you play at."
community-cards: "Cards dealt face up in the middle that every player can use to make a hand; in hold'em there are five."
hole-cards: "The two face-down cards you get at the start of a hand in hold'em; only you can see them."
small-blind: "The smaller forced bet posted before the deal by the player to the left of the button (heads up, by the button itself); the seat is also called this."
big-blind: "The larger forced bet posted before the deal by the second player to the left of the button (heads up, by the player opposite the button); the seat is also called this. It is also used as the unit for stack sizes and results."
chips: "The discs used to play at the table; in cash games they represent money, in tournaments tournament points."
stack: "All the chips a player has in front of them; usually given in big blinds (e.g. 100 big blinds)."
street: "A slang name for a betting round: preflop, flop, turn and river are the four streets. Example: “value on three streets” means value bets on the flop, turn and river."
betting-round: "A stage of the hand in which players take turns to check, bet, call, raise or fold; in hold'em there are four: preflop, flop, turn and river."
preflop: "The first betting round: after the hole cards are dealt, before the flop comes."
flop: "The first three community cards, dealt together after preflop betting; the second betting round is also called this."
turn: "The fourth community card and the third betting round."
river: "The fifth and last community card, and the last betting round before showdown."
showdown: "Revealing the cards after the last betting round when at least two players are still in the hand; the best hand takes the pot."
position: "Your seat at the table relative to the button, which sets the order of action. Whoever acts later sees more of the opponents' actions before deciding."
in-position: "The situation of a player who acts last after the flop, so they see the opponent's action before deciding."
out-of-position: "The situation of a player who acts before the opponent after the flop, so they decide without knowing the opponent's action."
early-position: "The first seats to act before the flop (e.g. UTG); many players are still to act after you."
late-position: "The seats that act last: the button and the seats just before it, especially the cutoff."
utg: "The first player to act before the flop, sitting directly to the left of the big blind."
hijack: "The seat directly before the cutoff, i.e. the second seat to the right of the button."
cutoff: "The seat directly to the right of the button, acting just before it."
button: "The dealer's seat, marked with a “dealer” disc. After the flop it acts last in every betting round."
outs: "A card still in the deck that will improve your hand, usually by completing a draw. Example: with a flush draw, your outs are the remaining cards of your suit."
draw: "A hand that is not yet a strong made hand but can become one with the next community cards, e.g. when you are one card short of a flush or a straight."
flush-draw: "Four cards of the same suit (in your hand and on the board together); you need one more to make a flush."
straight-draw: "Four cards that need one more to make a straight. Types: OESD (a card is missing at either of two ends) and gutshot (a card is missing in the middle)."
oesd: "OESD is short for open-ended straight draw: a straight draw of four consecutive cards completed by a card at either end, e.g. 5-6-7-8 needs a four or a nine."
gutshot: "A straight draw missing one specific rank in the middle, e.g. 5-6-8-9 needs only a seven."
backdoor: "A draw on the flop that needs two matching cards in a row, on the turn and on the river, e.g. three cards of one suit after the flop."
pot-odds: "The ratio of the amount you have to put in to the pot you can win (including the opponent's bet). It tells you how often you need to win for a call to be profitable."
implied-odds: "Pot odds increased by the chips you expect to win on later streets if you hit your hand."
equity: "Your chance of winning the pot if all remaining cards were dealt with no more betting; usually given as a percentage."
equity-realization: "How much of its equity a hand turns into winnings when betting continues (it can realize less or more than its equity); it depends on things like position and how easy the hand is to play."
expected-value: "The average result of a play if you repeated it many times. A play that is positive on average makes money in the long run, even if it loses this time."
combo: "One specific two-card holding with suits, e.g. A♠ K♥. Counting these holdings shows how many of a given hand are really in a range."
range: "The set of all hands a player can have in a given situation, or the hands they would make a given play with."
mixed-hand: "A hand with which the equilibrium strategy sometimes chooses one play and sometimes another (e.g. sometimes a raise, sometimes a call); both plays are correct. Such a hand is also said to be played with a mixed strategy."
open: "Entering the pot before the flop with a raise when everyone before you has folded."
suited: "Two hole cards of the same suit, e.g. A♥ K♥ (written AKs)."
offsuit: "Two hole cards of different suits, e.g. A♥ K♣ (written AKo)."
pocket-pair: "A pair made of your two hole cards, e.g. 8♣ 8♦ before the flop."
connectors: "Hole cards of adjacent ranks, e.g. 8-7 or 9-8; they make straights more easily."
3-bet: "The first raise of an open before the flop; the name counts the big blind as the first bet and the open as the second."
4-bet: "A raise of a 3-bet, i.e. the fourth bet in a betting round."
limp: "Entering the pot before the flop by just calling the big blind when nobody has raised yet."
isolation: "A raise after one or more limps, to play the limper (often a weaker player) one on one."
texture: "The character of the community cards: how many suits there are, whether the cards are close together, whether there is a pair. It determines which hands and draws are possible."
dry: "A board on which few draws and strong hands are possible, e.g. K♠ 7♦ 2♣."
wet: "A board on which many draws and strong hands are possible, e.g. J♥ T♥ 8♣."
rainbow: "A flop with three cards of three different suits, so nobody has a flush draw on the flop."
two-tone: "A flop with two cards of the same suit, so flush draws are possible."
monotone: "A flop with three cards of the same suit, so a flush may already be made."
paired: "A board with a pair on it (two cards of the same rank), e.g. 8-8-3."
connected: "A board on which someone may already have made a straight, e.g. 9-8-7."
disconnected: "A board with cards far apart, making it hard to build a straight or a straight draw, e.g. K-7-2."
semi-connected: "A board with straight draws but no straight possible yet, e.g. T-8-3 (the classification used in this course)."
wetness: "How much a board favors draws and strong hands: from dry to wet. It is also described as how coordinated the board is."
top-pair: "A pair with the highest card on the board, e.g. K♠ Q♦ on a K-7-2 flop."
second-pair: "A pair with the second-highest card on the board, e.g. 7♠ 6♠ on a K-7-2 flop."
overpair: "A pocket pair higher than every card on the board, e.g. Q-Q on a J-7-2 flop."
c-bet: "Continuation bet: a bet by the player who was the aggressor in the previous round, e.g. a bet on the flop after opening preflop."
aggressor: "The player who last bet or raised in the previous betting round."
initiative: "The role of the last aggressor: they usually make the next bet."
range-advantage: "A situation where one player's range has more total equity on a given board than the opponent's range."
nuts-advantage: "A situation where one player has proportionally more of the strongest hands in their range than the opponent."
nuts: "The strongest possible hand on a given board at a given moment. Example: on K♥ 9♥ 4♥ 2♣ it is the ace-high flush (with the ace of hearts)."
polarized: "Of a range: made up mainly of very strong hands and bluffs, with almost no medium hands."
polarization: "Building a range from the extremes: strong hands for value and bluffs, without medium hands."
linear: "Of a range: built from the top down, from the strongest hands, with no separate group of bluffs. You will also see the related term “merged range” (a non-polarized range); according to published solver analyses, merged is an intermediate shape between this range and a polarized one."
condensed: "Of a range: without the strongest hands (capped) and made up mainly of medium hands; the opposite of polarized."
value: "Betting with a strong hand so that the opponent calls with a weaker hand."
value-bet: "A single bet for value: made with a strong hand so that weaker hands call it."
bluff: "A bet with a weak hand that is unlikely to win at showdown, to make the opponent fold a better hand."
semi-bluff: "A bet with a hand that is still weak but can improve (e.g. with a draw): you win if the opponent folds or if you hit."
blocker: "A card in your hand that lowers the chance that the opponent has certain hands. Example: if you hold the ace of hearts, the opponent cannot have the ace-high heart flush."
bluff-catcher: "A hand that beats only the opponent's bluffs and loses to their value bets."
barrel: "Another bet in the next betting round after your own bet in the previous round."
second-barrel: "A second bet in a row: after a c-bet on the flop, the player bets again on the turn."
probe-bet: "A turn bet by the out-of-position player after the preflop aggressor checked the flop instead of making a c-bet."
donk-bet: "A bet by a player who bets before the aggressor from the previous round has had a chance to act."
overbet: "A bet after the flop that is larger than the whole pot."
effective-stack: "In a hand between two players: the smaller of their stacks, i.e. the most that can realistically be won or lost. With several players, it is calculated separately for each pair."
spr: "The effective stack divided by the pot at the start of a street (for planning the hand, it is calculated on the flop); it shows how deep the stacks are relative to the pot (the lower the SPR, the faster everything goes into the pot)."
mdf: "The smallest part of your range you must defend against a bet so that an opponent's bluff with a hand that has no chance is not automatically profitable."
alpha: "How often the opponent must fold for a bluff with a hand that has no chance to break even; it depends on the bet size relative to the pot."
variance: "The spread of results around expected value: even with good play, short stretches can show big losses or big wins."
buy-in: "The amount it costs to enter a tournament or to sit in a cash game."
bankroll: "Your whole reserve set aside only for playing poker; in this app it is counted in buy-ins, not money."
tilt: "A state in which emotions (anger, frustration, euphoria) make your decisions at the table worse."
winrate: "A player's average result over a longer sample; in cash games usually in bb/100, i.e. big blinds per hundred hands."
downswing: "A period of clearly worse results, usually bigger losses than skill would suggest; the opposite of an upswing."
session: "One sitting of poker, from when you start playing to when you stop."
stakes: "The size of the blinds in a cash game or the buy-in in a tournament; “micro stakes” are the lowest levels."
standard-deviation: "A measure of the spread of results (the square root of variance); in poker usually given in bb/100."
risk-of-ruin: "The probability that you will ever lose your whole bankroll if you keep playing at the same stakes."
mental-game: "The psychological side of poker: dealing with tilt, emotions and focus at the table."
tournament: "A format in which the blinds go up at intervals and play continues until one player has all the chips; prizes go to the highest finishers."
push-fold: "A simplified strategy for short stacks: before the flop you either go all-in or fold."
shove: "An all-in play, usually as a raise before the flop."
icm: "A model that converts tournament chips into money value, taking into account the payout structure and all players' stacks."
bubble: "The stage of a tournament just before the paid places, when a few more players need to bust before anyone is in the money."
bubble-factor: "An ICM measure: how much more losing a given number of chips hurts in a tournament than winning the same number helps."
cover: "To have at least as many chips as the opponent. When an opponent covers you, losing an all-in to them ends your tournament."
risk-premium: "Extra equity beyond what pot odds require, needed in a tournament to risk an all-in, because losing costs more than winning gains."
m-ratio: "Your stack divided by the total of blinds and antes in one hand: how many full orbits your chips will last without playing."
red-zone: "The zone of very low M: you are left mainly with all-in or fold."
green-zone: "The zone of high M: your stack lets you play freely, cautiously or aggressively."
ante: "A small forced payment into the pot before the deal from every player (mainly in tournaments)."
bb-ante: "An ante format in which, instead of every player, the player in the big blind pays the ante for the whole table."
fold-equity: "The part of a play's value that comes from the chance that the opponent folds."
gap-concept: "The principle that you need a stronger hand to call an open than to open yourself."
chip-ev: "The expected value of a play counted in chips, without converting them into money (without ICM)."
tournament-equity: "Your expected share of the prize pool given the payout structure and stacks. It is also called “$EV”."
prize-pool: "The total money to be shared among the players who win prizes in a tournament."
payout: "The prize for a specific finishing place in a tournament; together they make up the prize distribution."
pay-jump: "The difference in payout between adjacent places in a tournament; big jumps increase the risk premium."
final-table: "The last table of a tournament, where the top prizes are played for."
short-stack: "A stack that is small relative to the blinds; in tournaments usually one with only a few big blinds left."
nash-equilibrium: "A set of strategies in which no player can gain by changing only their own strategy."
overcall: "Calling a bet that someone before you has already called."
heads-up: "Playing one on one: only two players are left at the table or in the hand."
dead-money: "Chips in the pot from players who can no longer win it, e.g. from those who folded."
stack-off: "To put your whole stack into the pot in one hand, i.e. to go all-in or call an all-in."
exploit: "A deliberate departure from the baseline strategy to take advantage of a specific mistake by an opponent or by the whole player pool."
hud: "An overlay on the table in online play that shows opponents' statistics from previously played hands."
vpip: "A HUD statistic: the percentage of hands in which a player voluntarily puts money into the pot before the flop (calls or raises)."
pfr: "A HUD statistic: the percentage of hands in which a player raises before the flop."
wtsd: "A HUD statistic: how often a player who saw the flop gets to showdown."
nit: "A very tight player who enters the pot almost only with strong hands."
regular: "A frequent player at a given stakes level who plays a lot of hands; in this course contrasted with the recreational player."
tag: "A tight aggressive style: few hands, but played aggressively (bets and raises)."
lag: "A loose aggressive style: many hands, played aggressively."
recreational: "A player who plays for fun and is usually weaker than the regulars; in slang, derogatorily called a “fish”."
calling-station: "A derogatory term for a player who calls very often, even with weak hands or draws."
maniac: "A derogatory term for a very loose and aggressive player who bets and raises with almost anything."
rake: "The fee a casino or online poker room takes from the pot for running the game."
rake-cap: "The maximum amount of rake a poker room can take from a single hand."
