# sc-02: English text of content/pl/scenarios/sc-02.yaml (role 06, session BS, 2026-11-10); structure must match pl (test szablony-bs).
id: sc-02
module: m2
situation: "With short stacks after a {{t:3-bet}} you have an {{t:oesd}}; your opponent {{t:bet|bets}} small on the flop and big on the turn."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 35
levels: [latwy, sredni]
bounds:
  latwy: { draws: [oesd], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
  sredni: { draws: [oesd], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
decisions:
  - street: flop
    kind: draw-call
    pots: [16, 18, 20, 22]
    fractions: [0.05, 0.1, 0.2, 0.25]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}, and your opponent in the {{w:rywal}} {{t:bet|bets}} small compared with the {{t:pot}}. You {{t:call}}, because you pay for one card only, and your {{t:oesd}} hits on it more often than such a low price requires. You have {{n:outs.oesd}} outs, so the {{t:straight}} comes on the turn about {{n:odds.oesd.flop-turn}} of the time, roughly one card in six. This is a simplification: you count only the draw's outs. Each of your cards higher than the board adds at most {{n:pair.outs.per-rank}} uncertain outs to a {{t:pair}}, but here that doesn't change the answer."
      - action: fold
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}, and your opponent in the {{w:rywal}} {{t:bet|bets}} small compared with the {{t:pot}}. A {{t:fold}} gives up a {{t:pot}} where a {{t:call}} makes money: against such a small {{t:bet}} your {{t:oesd}} hits more often than the price requires. This is a simplification: you count only the draw's outs. Each of your cards higher than the board adds at most {{n:pair.outs.per-rank}} uncertain outs to a {{t:pair}}, but here that doesn't change the answer."
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.5, 0.6667, 0.75, 1]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}: the turn did not bring the {{t:straight}}, and your opponent in the {{w:rywal}} {{t:bet|bets}} big. A {{t:call}} loses: you pay for the last card, and it hits less often than the price requires. {{t:implied-odds|Implied odds}} will not make up for it, because with short stacks too few {{t:chips}} are left behind the {{t:pot}}: even if you win all of them when you hit, they do not cover the {{t:call|calls}} you lose. This is a simplification: you count only the draw's outs. Each of your cards higher than the board adds at most {{n:pair.outs.per-rank}} uncertain outs to a {{t:pair}}, but here that doesn't change the answer."
      - action: fold
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}: the turn did not bring the {{t:straight}}, and your opponent in the {{w:rywal}} {{t:bet|bets}} big. You {{t:fold}}, because you pay for the last card, it hits less often than the price requires, and too few {{t:chips}} are left behind the {{t:pot}} for a hit to make up for it. The {{t:straight}} comes on the river about {{n:odds.oesd.turn-river}} of the time, roughly one card in six. This is a simplification: you count only the draw's outs. Each of your cards higher than the board adds at most {{n:pair.outs.per-rank}} uncertain outs to a {{t:pair}}, but here that doesn't change the answer."
