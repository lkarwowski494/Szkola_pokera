# sc-19: English text of content/pl/scenarios/sc-19.yaml (role 06, session BS, 2026-11-10); structure must match pl (test szablony-bs).
id: sc-19
module: m7
situation: "With short stacks after a {{t:3-bet}} you have a {{t:flush-draw}}; your opponent {{t:bet|bets}} small on the flop and big on the turn."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 35
levels: [latwy, sredni]
bounds:
  latwy: { draws: [flush], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
  sredni: { draws: [flush], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
decisions:
  - street: flop
    kind: draw-call
    pots: [16, 18, 20, 22]
    fractions: [0.1, 0.2, 0.25]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}, and your opponent in the {{w:rywal}} {{t:bet|bets}} small compared with the {{t:pot}}. You {{t:call}}, because you pay for one card only, and your {{t:flush-draw}} hits on it more often than such a low price requires. The {{t:flush}} comes on the turn about {{n:odds.flush.flop-turn}} of the time, roughly one card in five."
      - action: fold
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}, and your opponent in the {{w:rywal}} {{t:bet|bets}} small compared with the {{t:pot}}. A {{t:fold}} gives up a {{t:pot}} where a {{t:call}} makes money: against such a small {{t:bet}} your {{t:flush-draw}} hits more often than the price requires."
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.6667, 0.75, 1]
    villain: bet
    rule: R-M7-008
    actions:
      - action: call
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}: the turn did not bring the {{t:flush}}, and your opponent in the {{w:rywal}} {{t:bet|bets}} big. A {{t:call}} counts on {{t:implied-odds}}, and there are none here: with a low {{t:spr}} so few {{t:chips}} are left behind the {{t:pot}} that even if you win all of them when you hit, they do not cover the {{t:call|calls}} you lose. Implied odds only count when your opponent still has something to pay you with."
      - action: fold
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}: the turn did not bring the {{t:flush}}, and your opponent in the {{w:rywal}} {{t:bet|bets}} big. You {{t:fold}}, because the last card hits less often than the price requires, and {{t:implied-odds}} do not change that: with a low {{t:spr}} too few {{t:chips}} are left behind the {{t:pot}} for your winnings after a hit to make up for the {{t:call|calls}} you lose. The {{t:flush}} comes on the river about {{n:odds.flush.turn-river}} of the time, roughly one card in five."
