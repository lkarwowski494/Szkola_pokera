# SC-34 (M11): bańka, duży blind wobec all-inu małego blinda przy 10 bb (F4, punkt icm-call). Ocena: rachunek R-M11-009 (equity z kart
# wobec zakresu push.sb-10 i próg ICM z blindem gracza). Poziomy łatwy i średni (D-1036, sesja DU); poziom trudny czeka na 06-tresci-002
# i zostaje w szkicu docs/tresci/szablony-robocze/sc-34.yaml (bramka scenariusze.ts odrzuca icm-call z poziomem trudnym). Rola 06, sesje CO i DU.
id: sc-34
module: m11
situation: "On the {{t:bubble}} the {{t:small-blind}} goes {{t:all-in}}, and you are in the {{t:big-blind}}."
table: 6max
positions: { hero: BB, villain: SB }
stackBb: 10
levels: [latwy, sredni]
bounds:
  latwy: { marginMin: 0.1, expected: [fold] }
  sredni: { marginMin: 0.05, marginMax: 0.15, expected: [call] }
decisions:
  - street: preflop
    kind: icm-call
    spot: push.sb-10
    rule: R-M11-009
    actions:
      - action: fold
        explanation: "You have {{w:reka}} on the {{w:pozycja}} on the {{t:bubble}}, {{w:stol}}, and the {{t:small-blind}} went {{t:all-in}}. You {{t:fold}}, because against the {{t:all-in}} {{t:range}} this hand has less {{t:equity}} than the {{t:icm}} threshold requires. That threshold is higher than in a game for {{t:chips}}, because in a {{t:tournament}} with {{t:payout|payouts}} a loss costs more money than a win adds, so a {{t:call}} must win more often."
      - action: call
        explanation: "You have {{w:reka}} on the {{w:pozycja}} on the {{t:bubble}}, {{w:stol}}, and the {{t:small-blind}} went {{t:all-in}}. You {{t:call}}, because against the {{t:all-in}} {{t:range}} this hand has more {{t:equity}} than the {{t:icm}} threshold requires. That threshold is higher than in a game for {{t:chips}}, because in a {{t:tournament}} with {{t:payout|payouts}} a loss costs more money than a win adds."
