# sc-34: English text of content/pl/scenarios/sc-34.yaml (role 06, session CO, 2026-11-11; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-34
module: m11
situation: "On the {{t:bubble}} the {{t:small-blind}} goes {{t:all-in}}, and you are in the {{t:big-blind}}."
table: 6max
positions: { hero: BB, villain: SB }
stackBb: 10
levels: [latwy, sredni, trudny]
bounds:
  latwy: { marginMin: 0.1, expected: [fold] }
  sredni: { marginMin: 0.05, marginMax: 0.15, expected: [call] }
  trudny: { marginMin: 0.01, marginMax: 0.1, chipsDiffer: true, expected: [fold] }
decisions:
  - street: preflop
    kind: icm-call
    spot: push.sb-10
    rule: R-M11-009
    actions:
      - action: fold
        explanation: "You have {{w:reka}} on the {{w:pozycja}} on the {{t:bubble}}, {{w:stol}}, and the {{t:small-blind}} went {{t:all-in}}. You {{t:fold}}, because in a {{t:tournament}} with {{t:payout|payouts}} a loss costs more money than a win adds, so a {{t:call}} must win more often than in a game for {{t:chips}}. Against the {{t:all-in}} {{t:range}} this hand has too little {{t:equity}} to clear this higher {{t:icm}} threshold."
      - action: call
        explanation: "You have {{w:reka}} on the {{w:pozycja}} on the {{t:bubble}}, {{w:stol}}, and the {{t:small-blind}} went {{t:all-in}}. You {{t:call}}, because against the {{t:all-in}} {{t:range}} this hand has more {{t:equity}} than the {{t:icm}} threshold requires. That threshold is higher than in a game for {{t:chips}}, because in a {{t:tournament}} with {{t:payout|payouts}} a loss costs more money than a win adds."
