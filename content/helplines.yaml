# Telefony i miejsca pomocy przy problemach z hazardem: jedno źródło prawdy (B-058), rynki aplikacji (D-142):
# US, GB, CA, JP, BR, FR, TW, VN, DE oraz pomoc międzynarodowa online. Źródła i cytaty: docs/tresci/e1-pomoc.md (§6)
# i rejestr docs/tresci/rejestr/pomoc.json (pole `claim` = id twierdzenia; content-build przerywa budowanie, gdy
# twierdzenie nie ma w rejestrze statusu „potwierdzone”). Decyzje: D-150 (FR godziny 8.00–23.00; US „bez opłat za
# usługę”; Irlandia Płn. bez linku do dunlewey.net), D-151 (TW: 1925 i ośrodki; VN: numer alarmowy i pomoc online, bez
# linii hazardowej), D-152 (GB i CA: numer ogólnokrajowy, pod nim lista regionów z własnymi numerami).
#
# Korzystają z niego: ramka „Odpowiedzialna gra” w lekcji M12-L4 (znacznik {{helplines}}; lekcje nie są per kraj, więc
# ramka pokazuje tylko pomoc międzynarodową online i odsyła do ekranu „Pomoc”) oraz ekran „Pomoc”
# (apps/mobile/src/data/content/helplines.generated.ts). Numerów z tego pliku nie wpisuj ręcznie w lekcjach.
#
# kind: gambling (problem z hazardem), support (poradnictwo psychologiczne), crisis (kryzys psychiczny), emergency
# (zagrożenie życia); jeden rodzaj na wpis. regions: kody ISO 3166-2 regionów, w których wpis obowiązuje (brak = cały
# kraj); national: wpis regionalny pokazywany także bez wybranego regionu (numer ogólnokrajowy, D-152). country '*':
# pomoc międzynarodowa online. Linki tylko do domen ze źródeł tego samego wpisu (content-build to sprawdza).
# Pominięte (brak potwierdzenia w źródłach szczebla 1–3): linia hazardowa TW, VN i Nowej Szkocji (H-CA-10), terytoria
# Kanady (H-CA-14), linia kryzysowa VN (H-VN-2); numery bez cytatu w rejestrze: SMS 988 (US), SMS ConnexOntario,
# 112 z komórki (TW). Bez nazw pokoi pokerowych (ADR-13). Bez wpisów polskich (brak storefrontu PL, decyzja
# właściciela 2026-11-03; wpisy PL nie mają twierdzeń w rejestrze E1).
checked: '2026-11-04'
review_by: '2027-11-04'
pointer: 'Telefony pomocy dla Twojego kraju znajdziesz w aplikacji, w ekranie „Pomoc”.'
fallback:
  text: 'W zagrożeniu życia dzwoń na lokalny numer alarmowy.'
  online: [int-gambling-therapy]
regions_label: 'Numery w regionach: wybierz swój region'
