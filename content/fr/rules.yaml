# Reguły odruchowe „Jeśli X, to Y, bo Z”. Poziom: rules (zasady gry), math, gto, heuristic, exploit.
# Kryteria poziomów (S-05, audyt 4.10):
#   math      – twierdzenie, które samo jest rachunkiem (outy, szanse, cena sprawdzenia, znak EV, dominacja jednej akcji nad drugą);
#   heuristic – zalecenie wyprowadzone z rachunku albo z literatury, bez wyniku solvera;
#   gto       – opublikowany wynik solvera albo rozwiązania równowagi;
#   exploit   – dostosowanie do typu gracza; musi podać populację;
#   rules     – zasady gry i definicje.
# Reguła eksploatacyjna musi podać populację źródłową (walidacja w content-build).
# Pole source: pełny opis źródeł z adresami i cytatami najwyżej 2 zdania, bez nazw serwisów i marek (decyzja właściciela
# z 9.10.2026); zostaje w repozytorium. Pole sources: jedno niezależne źródło (organizacja albo autor) = jedna pozycja
# { kind, url? }; kind: math, rules, solver-pub, solver-app, book, study, reference, training, population (SourceKind
# w content-schema). Aplikacja pokazuje tylko rodzaj i liczbę źródeł, np. „serwisy szkoleniowe (3)”; jedno źródło inne
# niż rachunek dostaje dopisek „jedno źródło”.
# Pole check (tryb gry M13, dokument 14, 4.4.3 i 6.2 A): warunek sprawdzalny automatycznie w silniku oceny
# (packages/poker-core/src/grading.ts). kind = rodzaj sprawdzenia, players/stackBb = konfiguracje stołu, których
# dotyczy źródło reguły (5.5; brak = każda, reguły rachunkowe), streets, spots (spoty solvera), drill (przypadki
# c-betu), params (liczby jako n:klucz). Reguły-zakazy (free-check-fold, no-limp) oceniają tylko naruszenie.

- id: R-M0-001
  module: m0
  if: "deux joueurs ont des types de main différents"
  then: "c'est la main la mieux classée qui gagne, quelle que soit la hauteur des cartes"
  because: "le classement des mains passe avant la hauteur des cartes ; une {{t:flush|couleur}} bat toujours une {{t:straight|quinte}}, un {{t:full-house|full}} bat toujours une {{t:flush|couleur}}"
  level: rules
  source: "règles du Texas Hold'em : règlement de casino approuvé par le régulateur des jeux de Californie (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf), Card Values and Hand Rankings : « The ranking of hands for Texas Hold'em, in order from highest to lowest rank, shall be » ; règlement de poker d'un casino de Perth approuvé par le régulateur (RAG/551) (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf), 10.1 ; en complément : List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (document 12 M0–M3)"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-002
  module: m0
  if: "les deux joueurs ont le même cœur de main : la même {{t:pair|paire}}, le même {{t:three-of-a-kind|brelan}} ou la même {{t:two-pair|double paire}}"
  then: "les kickers décident, comparés un à un en partant du plus haut, mais seulement ceux qui entrent dans les 5 meilleures cartes ; si les mains de cinq cartes sont identiques, {{t:split-pot|le pot est partagé}}"
  because: "on regarde d'abord le rang de la main, puis sa hauteur, et les kickers seulement si le cœur est identique ; seules comptent les cinq meilleures cartes parmi les 7"
  level: rules
  source: "règles du Texas Hold'em : règlement de poker d'un casino de Perth approuvé par le régulateur (RAG/551) (https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf), 10.3–10.4 : « all cards count, for example, Q:Q:7:7:9 shall lose to Q:Q:7:7:10 » ; Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), sections 3 et 5 ; en complément, ordre de comparaison : List of poker hands (https://en.wikipedia.org/wiki/List_of_poker_hands) (document 12 M0–M3)"
  sources: [{ kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-003
  module: m0
  if: "les 5 meilleures cartes des deux joueurs sont sur le {{t:board|board}}"
  then: "{{t:split-pot|le pot est partagé}}"
  because: "les deux jouent les mêmes cinq cartes (« {{t:playing-the-board|jouer le board}} »)"
  level: rules
  source: "règles du Texas Hold'em : Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), section 5 (« play the board ») ; règlement de casino approuvé par le régulateur des jeux de Californie (https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf) : « the pot shall be split equally among all players with the winning hand » ; en complément : Texas hold 'em (https://en.wikipedia.org/wiki/Texas_hold_%27em) (document 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/Texas_hold_%27em" }]

- id: R-M1-001
  module: m1
  if: "personne avant vous n'a {{t:bet|misé}} dans ce tour"
  then: "vous pouvez {{t:check|checker}} ou {{t:bet|miser}}"
  because: "on ne peut {{t:call|suivre}} ou {{t:raise|relancer}} qu'une {{t:bet|mise}} existante"
  level: rules
  source: "règles du Texas Hold'em : Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), section 3 (« fold, check, bet, call, or raise ») (document 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }]
- id: R-M1-002
  module: m1
  if: "vous pouvez {{t:check|checker}} gratuitement"
  then: "vous ne vous {{t:fold|couchez}} jamais"
  because: "un {{t:fold|abandon}} cède le {{t:pot|pot}} sans aucun bénéfice, alors qu'un {{t:check|check}} ne coûte rien"
  level: math
  check: { kind: free-check-fold }
  source: "calcul : checker coûte 0 et préserve vos chances de remporter le pot, donc ce n'est jamais pire que se coucher"
  sources: [{ kind: math }]
- id: R-M1-003
  module: m1
  if: "quelqu'un a {{t:bet|misé}}, et vous ne voulez pas continuer"
  then: "vous vous {{t:fold|couchez}}"
  because: "vous ne perdez que ce que vous avez déjà mis ; chaque {{t:call|call}} sans raison est une perte supplémentaire"
  level: math
  source: "calcul : se coucher met fin à la participation sans autre paiement, donc la perte se limite à ce qui a déjà été mis ; suivre avec une main avec laquelle vous n'irez pas plus loin augmente la perte du montant suivi"
  sources: [{ kind: math }]
- id: R-M1-004
  module: m1
  if: "le coup passe au {{t:betting-round|tour d'enchères}} suivant"
  then: "le flop, ce sont 3 {{t:community-cards|cartes communes}}, le turn et la river une chacun ; après les enchères de la river, les joueurs restants (au moins deux) dévoilent leurs cartes (abattage)"
  because: "ce sont les règles du Texas Hold'em : quatre {{t:betting-round|tours d'enchères}}, et la river est le dernier"
  level: rules
  source: "règles du Texas Hold'em : Robert's Rules of Poker (https://briggsoft.com/docs/pmavens/Rules_Roberts.htm), section 5 (« Three boardcards are turned simultaneously … The next two boardcards are turned one at a time ») ; Wikipédia, Texas hold 'em (document 12 M0–M3)"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules }]

- id: R-M2-001
  module: m2
  if: "au flop, vous avez {{n:draw.flush.seen}} cartes pour une {{t:flush|couleur}}"
  then: "vous avez {{n:outs.flush}} outs : environ {{n:odds.flush.flop-turn}} de chances de {{t:flush|couleur}} au turn, et environ {{n:odds.flush.flop-river}} d'ici la river seulement si vous voyez les deux cartes sans autres {{t:bet|mises}} (all-in)"
  because: "une couleur compte {{n:cards.per-suit}} cartes, vous en voyez {{n:draw.flush.seen}} ; {{t:call|suivre}} une {{t:bet|mise}} au flop n'achète qu'une seule carte"
  level: math
  source: "calcul exact"
  sources: [{ kind: math }]
- id: R-M2-002
  module: m2
  if: "vous avez compté vos outs"
  then: "vous estimez vos chances de toucher : outs × 2 avec une carte, outs × 4 avec deux ; face à une {{t:bet|mise}} au flop, vous comptez une carte (× 2), et × 4 seulement si vous voyez le turn et la river sans autres {{t:bet|mises}} (all-in)"
  because: "pour la river, l'adversaire peut vous faire payer séparément ; la règle du 2 et du 4 se trompe d'environ {{n:rule24.error.max.pp}} points de pourcentage avec au plus {{n:rule24.outs.max}} outs"
  level: math
  source: "site de formation, Poker drawing odds & outs explained (https://upswingpoker.com/poker-drawing-odds-outs-explained/) : « For anything 10 outs or less, however, its accurate within 2% for the turn and river calculation » ; calcul : erreur maximale de 1,7 pp avec 10 outs (document 12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/poker-drawing-odds-outs-explained/" }, { kind: math }]
- id: R-M2-003
  module: m2
  if: "l'adversaire mise la moitié du {{t:pot|pot}}"
  then: "pour {{t:call|suivre}}, il vous faut {{n:eq.bet-half}} d'équité"
  because: "vous payez 1 part, et le {{t:pot|pot}} après votre {{t:call|call}} compte 4 parts ({{t:pot|pot}} 2, mise 1, votre {{t:call|call}} 1), il vous faut donc 1 part sur 4"
  level: math
  source: "calcul : mise/(pot+2·mise)"
  sources: [{ kind: math }]
- id: R-M2-004
  module: m2
  if: "l'adversaire mise la totalité du {{t:pot|pot}}"
  then: "pour {{t:call|suivre}}, il vous faut {{n:eq.bet-pot}} d'équité"
  because: "vous payez 1 part, et le {{t:pot|pot}} après votre {{t:call|call}} compte 3 parts ({{t:pot|pot}} 1, mise 1, votre {{t:call|call}} 1), il vous faut donc 1 part sur 3"
  level: math
  source: "calcul : mise/(pot+2·mise)"
  sources: [{ kind: math }]
- id: R-M2-005
  module: m2
  if: "votre équité est inférieure à l'équité requise (avec un {{t:draw|tirage}} : la probabilité de toucher sur les cartes que vous verrez pour ce prix)"
  then: "vous vous {{t:fold|couchez}} (sans arguments supplémentaires, p. ex. les implied odds)"
  because: "chaque {{t:call|call}} de ce type perd de l'argent sur le long terme"
  level: math
  check: { kind: draw-price, streets: [flop] }
  source: "calcul : EV = équité × (pot après votre call) − call ; négative quand équité < call ÷ pot après votre call"
  sources: [{ kind: math }]

- id: R-M3-001
  module: m3
  if: "vous êtes au Bouton et tous les joueurs avant vous se sont {{t:fold|couchés}}"
  then: "vous {{t:open|ouvrez}} le plus large de toutes les {{t:position|positions}} avant les blindes ; seule la {{t:small-blind|petite blinde}} {{t:open|ouvre}} à peu près aussi large"
  because: "à partir du flop, vous parlez en dernier, et il ne reste derrière vous que les blindes"
  level: gto
  source: "site de tableaux de solveur, 6-max 100bb NL500 (https://beyondgto.com/ranges/btn-open-6max-100bb, https://beyondgto.com/ranges/sb-open-6max-100bb) : BTN 42%, SB 44% ; site de formation, Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/) : SB un peu plus large que le Bouton, 40–50% ; site de tableaux préflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts) : BTN 40–45%, SB 39–47% (document 12, D2)"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-002
  module: m3
  if: "tout le monde s'est {{t:fold|couché}} jusqu'à vous, en {{t:utg|UTG}}"
  then: "vous {{t:open|ouvrez}} environ {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} des mains"
  because: "il reste encore cinq joueurs derrière vous, donc quelqu'un a plus souvent une meilleure main"
  level: gto
  check: { kind: solver-spot, players: [6], stackBb: [100], spots: [rfi.utg] }
  source: "site de solveur commercial, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/) : UTG 17,6% ; site de tableaux de solveur (NL500, https://beyondgto.com/ranges/lj-open-6max-100bb, …/hj-…, …/co-…, …/btn-open-6max-100bb) : UTG 17%, HJ 22%, CO 28%, BTN 42% ; site de tableaux préflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts) : 15–17 / 19–22 / 25–28 / 40–45% (document 12 M0–M3, D6)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/lj-open-6max-100bb" }]
- id: R-M3-003
  module: m3
  if: "tout le monde s'est {{t:fold|couché}} jusqu'à vous, au Bouton"
  then: "vous {{t:open|ouvrez}} environ {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} des mains"
  because: "il ne reste que les blindes, et après le flop vous aurez la {{t:position|position}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.btn, nine.rfi.btn] }
  source: "site de tableaux de solveur, BTN open 6-max 100bb (https://beyondgto.com/ranges/btn-open-6max-100bb, NL500) : environ 42% ; site de tableaux préflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts) : 40–45% (document 12 M0–M3, D6)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-004
  module: m3
  if: "vous êtes le premier à entrer dans le coup"
  then: "vous {{t:raise|relancez}} ou vous vous {{t:fold|couchez}}, sans vous contenter de compléter la blinde (limp) ; depuis la {{t:small-blind|petite blinde}}, c'est une simplification : certaines solutions de solveurs limpent une partie des mains"
  because: "une {{t:raise|relance}} peut remporter les blindes immédiatement et donne l'{{t:initiative|initiative}} ; un limp renonce à ces deux avantages"
  level: heuristic
  check: { kind: no-limp, players: [6, 9], stackBb: [100] }
  source: "site de formation, Why limping is bad (https://upswingpoker.com/why-limping-in-poker-is-bad/) : « If you make everyone fold preflop, you win 100% of the pot … You can't ever do that in a pot you've limped into » ; site de tableaux de solveur, open 6-max 100bb (https://beyondgto.com/ranges/lj-open-6max-100bb, de même HJ, CO, BTN) : « raising rather than limping or jamming at this depth », SB (https://beyondgto.com/ranges/sb-open-6max-100bb) : « At 100bb the whole range plays as raise-or-fold ». Petite blinde : contradiction au niveau 2, site de formation avec tableaux de solveur (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics) : « completes (limps) 20.5% » ; le raise-or-fold depuis la SB est une simplification signalée, car l'arbre de solveur de l'application ne contient pas de limps (D-144 ; document 12 M0–M3)"
  sources: [{ kind: training, url: "https://upswingpoker.com/why-limping-in-poker-is-bad/" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]
- id: R-M3-005
  module: m3
  if: "vous pouvez choisir entre les mêmes cartes assorties et dépareillées"
  then: "la main assortie (suited) est plus forte"
  because: "elle offre une façon supplémentaire de gagner, par la {{t:flush|couleur}}"
  level: math
  source: "calcul d'équité"
  sources: [{ kind: math }]
- id: R-M3-006
  module: m3
  if: "tout le monde s'est {{t:fold|couché}} jusqu'à vous, en {{t:hijack|HJ}} ou au {{t:cutoff|CO}}"
  then: "vous {{t:open|ouvrez}} plus large qu'en {{t:utg|UTG}} et plus serré qu'au Bouton ; plus large au {{t:cutoff|CO}} qu'en {{t:hijack|HJ}}"
  because: "moins il reste de joueurs derrière vous, plus rarement quelqu'un a une meilleure main et plus souvent vous avez la {{t:position|position}} après le flop"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.hj, rfi.co, nine.rfi.hj, nine.rfi.co] }
  source: "site de solveur commercial, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/) : UTG 17,6% ; site de tableaux de solveur (NL500, https://beyondgto.com/ranges/hj-open-6max-100bb, https://beyondgto.com/ranges/co-open-6max-100bb) : UTG 17%, HJ 22%, CO 28%, BTN 42% ; site de tableaux préflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts) : 15–17 / 19–22 / 25–28 / 40–45% (document 12 M0–M3, D6) : la range d'ouverture s'élargit d'UTG au Bouton"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/hj-open-6max-100bb" }]
- id: R-M3-007
  module: m3
  if: "vous êtes le premier à entrer dans le coup, par une {{t:raise|relance}}"
  then: "vous {{t:raise|relancez}} à {{n:pf.open-size}} depuis toutes les {{t:position|positions}}, et à {{n:pf.open-size-sb}} depuis la {{t:small-blind|petite blinde}} (simplification)"
  because: "une taille unique pour toutes les {{t:position|positions}} est simple et ne trahit pas la force de votre main ; depuis la {{t:small-blind|petite blinde}}, vous jouez {{t:out-of-position|hors de position}}, donc vous {{t:raise|relancez}} un peu plus"
  level: heuristic
  check: { kind: open-size, players: [6, 9], stackBb: [100], params: { open: "n:pf.open-size", openSb: "n:pf.open-size-sb" } }
  source: "site de tableaux préflop, 6-max charts (https://www.preflopwizard.app/blog/6-max-preflop-charts) : « the standard open size is 2.5bb from all positions … 3bb from the small blind » ; site de solveur commercial, Range Morphology (https://blog.gtowizard.com/preflop-range-morphology/) : UTG 2bb, CO 2,3bb, BTN 2,5bb, SB 3bb (simplification, document 12, D8)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }]
- id: R-M3-008
  module: m3
  if: "vous avez l'une des mains les plus fortes (AA, KK, QQ, AK), et quelqu'un avant vous a {{t:raise|relancé}}"
  then: "vous {{t:raise|relancez}} généralement à nouveau (3-bet) {{t:value|pour la valeur}}, plutôt que de simplement {{t:call|suivre}}"
  because: "ces mains sont favorites face à la plupart des mains avec lesquelles l'adversaire {{t:open|ouvre}} ; le 3-bet fait grossir le {{t:pot|pot}} et réduit le nombre d'adversaires"
  level: heuristic
  source: "site de tableaux de 3-bet, 3-bet ranges (https://pokerpro.tools/preflop/3-bet-ranges) : QQ+ et AK dans la partie valeur face à toutes les positions (« Mostly 3-bet ») ; site de tableaux préflop, UTG strategy (https://www.preflopwizard.app/blog/poker-utg-strategy) : AA–JJ et AKs (document 12, D9)"
  sources: [{ kind: training, url: "https://pokerpro.tools/preflop/3-bet-ranges" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-utg-strategy" }]
- id: R-M3-009
  module: m3
  if: "tout le monde s'est {{t:fold|couché}} jusqu'à vous, en {{t:small-blind|petite blinde}}"
  then: "vous {{t:open|ouvrez}} large, environ {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}} des mains, par une {{t:raise|relance}} à {{n:pf.open-size-sb}} ou un {{t:fold|abandon}} (simplification : certaines solutions de solveurs limpent une partie des mains depuis la {{t:small-blind|petite blinde}})"
  because: "vous ne jouez plus que contre la {{t:big-blind|grosse blinde}} ; après le flop, vous parlez en premier, donc vous {{t:open|ouvrez}} à peu près aussi large qu'au Bouton, et pas beaucoup plus"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.sb, nine.rfi.sb] }
  source: "site de tableaux de solveur, SB open 6-max 100bb NL500 (https://beyondgto.com/ranges/sb-open-6max-100bb) : environ 44%, raise-or-fold ; site de formation, Small Blind strategy (https://upswingpoker.com/small-blind-poker-strategy-tips/) : 40–50% ; site de tableaux préflop (https://www.preflopwizard.app/blog/6-max-preflop-charts) : 39–47% ; l'intervalle 40–45% est la partie commune des stratégies sans limp (document 12, D3). Simplification raise-or-fold (D-144) : site de formation avec tableaux de solveur (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics) : « The small blind raises (3bb) 33.1% : completes (limps) 20.5% »"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]

- id: R-M3-010
  module: m3
  if: "vous jouez à une table de 9 et tous les joueurs avant vous se sont {{t:fold|couchés}}"
  then: "en {{t:utg|UTG}}, {{t:utg|UTG}}+1 et {{t:utg|UTG}}+2, vous {{t:open|ouvrez}} plus serré qu'en {{t:utg|UTG}} à une table de 6 ; à partir du LJ, vous jouez comme à une table de 6 (le LJ comme {{t:utg|UTG}})"
  because: "plus de joueurs sont assis derrière vous qu'à une table de 6, donc quelqu'un a plus souvent une meilleure main ; quand les premiers joueurs se {{t:fold|couchent}}, il reste derrière le LJ autant de joueurs que derrière {{t:utg|UTG}} à une table de 6"
  level: heuristic
  check: { kind: solver-spot, players: [9], stackBb: [100], spots: [nine.rfi.utg, nine.rfi.utg1, nine.rfi.utg2, nine.rfi.lj] }
  source: "solveur préflop du projet, table de 9 joueurs 100bb (ADR-20 ; document 10, « Mesure N9a finale » : validation partielle N1–N4, NashConv 0,0094bb ; composition UTG–UTG+2 non vérifiée, et fréquences sans validation de niveau 2 (D-153), donc la règle n'indique que la direction, sans chiffres du solveur ; niveau heuristic, D-144). Cohérent avec l'intervalle commun des tableaux 9-max de niveau 4 : UTG environ 9–13%, UTG+1 environ 11–14% (site de tableaux préflop, 9-Max Preflop Chart, https://preflopwizard.app/blog/9-max-preflop-chart ; second site de tableaux préflop, https://about-poker.com/preflop-gto/preflop-range-chart-cash-game ; document 10, « Configuration 9-max 100bb »). Le jeu après l'abandon d'UTG–UTG+2 est exactement le jeu 6-max (test de l'arbre)"
  sources: [{ kind: training, url: "https://preflopwizard.app/blog/9-max-preflop-chart" }, { kind: training, url: "https://about-poker.com/preflop-gto/preflop-range-chart-cash-game" }, { kind: solver-app }]
# M4: gra wobec akcji preflop. Reguły „heuristic” pochodzą z literatury, nie z solvera aplikacji (dokument 11).
- id: R-M4-001
  module: m4
  if: "quelqu'un a {{t:open|ouvert}}, et vous voulez {{t:raise|relancer}} (3-bet) {{t:in-position|en position}}"
  then: "vous {{t:raise|relancez}} à environ {{n:pf.3bet.size-ip}} l'{{t:open|ouverture}} ; face à une {{t:open|ouverture}} à {{n:pf.open-size}}, cela fait {{n:pf.3bet.ip-total}}"
  because: "cette taille donne un bon rapport entre stack et {{t:pot|pot}} au flop et n'offre pas un prix bon marché à l'adversaire"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-ip", position: ip } }
  source: "site de formation, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide) ; arbre de solveur de l'application"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-002
  module: m4
  if: "vous {{t:raise|relancez}} une {{t:open|ouverture}} (3-bet) {{t:out-of-position|hors de position}}, p. ex. depuis les blindes face à une {{t:open|ouverture}} du {{t:cutoff|CO}} ou du Bouton"
  then: "vous {{t:raise|relancez}} à environ {{n:pf.3bet.size-oop}} l'{{t:open|ouverture}} ; face à une {{t:open|ouverture}} à {{n:pf.open-size}}, cela fait {{n:pf.3bet.oop-total}}"
  because: "après le flop, vous parlerez en premier, donc une {{t:raise|relance}} plus grosse prive l'adversaire d'un {{t:call|call}} bon marché {{t:in-position|en position}}"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-oop", position: oop } }
  source: "site de formation, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide) ; arbre de solveur de l'application"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-003
  module: m4
  if: "vous êtes en {{t:small-blind|petite blinde}}, et le {{t:cutoff|CO}} ou le Bouton a {{t:open|ouvert}}"
  then: "vous ne {{t:call|suivez}} presque jamais : vous 3-bettez ou vous vous {{t:fold|couchez}} (face au {{t:cutoff|CO}}, c'est une simplification : la solution publiée calcule le spot face au Bouton) ; face au Bouton, vous 3-bettez le haut de votre {{t:range|range}} (environ {{n:pf.3bet-freq.sb-vs-btn}} des mains, notamment 77+ (55 et 66 souvent), AJo+, KQo, A5s, A4s, T9s), et vous vous {{t:fold|couchez}} avec le reste"
  because: "après un {{t:call|call}} depuis la {{t:small-blind|petite blinde}}, vous jouez {{t:out-of-position|hors de position}}, et la {{t:big-blind|grosse blinde}} derrière vous peut encore {{t:raise|relancer}} ; le 3-bet donne l'{{t:initiative|initiative}} et une chance de remporter le {{t:pot|pot}} immédiatement"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.sb-vs-btn, nine.vs-open.sb-vs-btn] }
  source: "site de tableaux de solveur, SB vs BTN (https://beyondgto.com/defense/sb-vs-btn), NL500, 100bb : « GTO defends the Small Blind with about 18% of hands - roughly 5% as a flat call and 13% as a 3-bet », 55 3-bet 57%, 66 62% ; site de solveur commercial, Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/), NL500, SB vs BTN : « the SB barely calls anything. Instead, they almost exclusively 3-bet or fold », généralisation à la petite blinde : « As a simplification, don’t cold-call from the SB: Play a 3-bet or fold strategy. » ; site de formation, 3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/) : « 3-bet-or-fold strategies from every position except the Big Blind » (document 10, arbitrage B-045 : le contenu de R-M4-015 intégré à R-M4-003 ; le chiffre de 14% tiré du graphique remplacé par le texte lu, E1)"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/sb-vs-btn" }, { kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-004
  module: m4
  if: "vous êtes en {{t:big-blind|grosse blinde}}, le Bouton a {{t:open|ouvert}} à {{n:pf.open-size}}, et la {{t:small-blind|petite blinde}} s'est {{t:fold|couchée}}"
  then: "vous défendez large, car pour {{t:call|suivre}} il ne vous faut qu'environ {{n:eq.bb-vs-btn-open}} d'équité"
  because: "vous ajoutez peu à un gros {{t:pot|pot}} ; les solutions de solveurs publiées défendent ici environ {{n:pf.bb-def.vs-btn.pub.low}}–{{n:pf.bb-def.vs-btn.pub.high}} des mains"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-btn, nine.vs-open.bb-vs-btn] }
  source: "calcul du prix ; site de tableaux de solveur, BB vs BTN (https://beyondgto.com/defense/bb-vs-btn), NL500 : « GTO defends the Big Blind with about 45% of hands » ; école publiant des résultats de solveur (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), NL200 : « 3-bets 11.5% to 11bb and calls 29.0% » ; solveur préflop du projet (ADR-20) uniquement dans la grille et l'évaluation joue/se couche, sa défense totale n'est pas validée (D-153)"
  sources: [{ kind: math }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-app }]
- id: R-M4-005
  module: m4
  if: "en {{t:position|position}}, vous {{t:raise|relancez}} une {{t:open|ouverture}} du {{t:cutoff|CO}}"
  then: "vous 3-bettez surtout les meilleures mains du haut et ajoutez quelques {{t:bluff|bluffs}} avec des as assortis (A5s, A4s) ; les mains moyennes (p. ex. 77–99, AJs, ATs, {{t:connectors|connecteurs}} assortis) se jouent en mixte : une partie en 3-bet, une partie en {{t:call|call}}. Le Bouton face au {{t:cutoff|CO}} 3-bette généralement environ {{n:pf.3bet-freq.btn-vs-co.low}}–{{n:pf.3bet-freq.btn-vs-co.high}} des mains, et {{t:call|suit}} environ {{n:pf.call-freq.btn-vs-co.low}}–{{n:pf.call-freq.btn-vs-co.high}}"
  because: "l'adversaire {{t:call|suit}} souvent, donc vous voulez une main qui se joue bien dans un {{t:pot|pot}} après un {{t:call|call}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.btn-vs-co, nine.vs-open.btn-vs-co] }
  source: "site de solveur commercial, Playing Calls From the Button in Cash Games (https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/), NL500, 100bb : « Against a CO open, BTN will 3-bet ~12% of hands, while calling only 5%. » ; site de tableaux de solveur, BTN vs CO (https://beyondgto.com/defense/btn-vs-co), NL500, 100bb : « roughly 9% as a flat call and 10% as a 3-bet » ; école publiant des résultats de solveur (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), NL200 : « the solver 3-bets 12.5% of hands to 7.5bb and calls only 3.0% », « 55–22 most of the time » abandon ; les intervalles couvrent trois sources de niveau 2, la composition est leur partie commune : haut en 3-bet, milieu mixte (D-144 ; auparavant décision A2, document 10). Le solveur de l'application ne reproduit pas cette répartition (il ne suit presque jamais), donc la grille et l'évaluation en mode jeu ne vérifient que « joue / se couche » ; site de formation, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide), tableau BTN vs CO : « QQ+, AKs, AKo, AQs (mixed), A5s, A4s… » ; un site de formation (https://gtogecko.com/blog/gto-preflop-strategy) qualifie la range de linéaire, et le site de tableaux préflop de polarisée (document 12 M4–M6, D-02)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/" }, { kind: solver-pub, url: "https://beyondgto.com/defense/btn-vs-co" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://gtogecko.com/blog/gto-preflop-strategy" }, { kind: training }]
- id: R-M4-006
  module: m4
  if: "depuis la {{t:big-blind|grosse blinde}}, vous {{t:raise|relancez}} l'{{t:open|ouverture}} du Bouton"
  then: "vous 3-bettez les mains les plus fortes (TT+, AQ+, AJs+) plus des {{t:bluff|bluffs}} pris dans le bas de votre {{t:range|range}} de {{t:call|call}} : A5s, parfois A4s, et des {{t:connectors|connecteurs}} assortis ; avec les {{t:pair|paires}} moyennes et petites, KQo et les as dépareillés (AJo–A9o), vous {{t:call|suivez}} généralement"
  because: "depuis la {{t:big-blind|grosse blinde}}, vous {{t:call|suivez}} à bas prix et fermez l'action, donc les mains moyennes gagnent plus après un {{t:call|call}}, et vous réservez le 3-bet aux mains qui veulent un gros {{t:pot|pot}} et aux {{t:bluff|bluffs}} qui se jouent bien après un {{t:call|call}} (les as assortis bloquent AA et AK)"
  level: gto
  source: "site de solveur commercial, Crush 3-Bet Pots OOP in Cash Games (https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/), NL500, BB vs BTN : « TT+, AJs+, and AQo+ are 3-bet purely », bluffs « near the bottom of our calling range » ; site de tableaux de solveur, BB vs BTN (https://beyondgto.com/defense/bb-vs-btn) : « A5s · 3-bet 100% ». La règle ne concerne que l'ouverture du Bouton (D-144) : face à la petite blinde, les sources de niveau 2 ne s'accordent pas sur les bluffs (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics : « A5s calls 96% of the time rather than turning into a three-bet bluff » ; https://beyondgto.com/defense/bb-vs-sb : « A5s · 3-bet 4% · call 96% » ; site de solveur commercial, Range Morphology, https://blog.gtowizard.com/preflop-range-morphology/ : bluffs tout en bas de la range), donc la leçon dit seulement que face à la petite blinde vous 3-bettez surtout pour la valeur, et que vous suivez généralement avec A5s et les connecteurs assortis ; école publiant des résultats de solveur, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide) et Big blind defence (https://poker.academy/blog/post/big-blind-basics-explained-useful-tips-for-poker-players), NL200 et NL50 GG ; site de formation, Blind vs Blind Without a Solver (https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics), tableaux de ce site ; site de formation, 3-Bet Preflop Strategy (https://upswingpoker.com/3-bet-strategy-aggressive-preflop/), tableaux de solveur de ce site. Simplification : la composition dépend du rake et de la taille du 3-bet ; 99, KQo et AJo sont parfois mixtes (document 10, arbitrage B-045)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-007
  module: m4
  if: "vous recevez un 3-bet d'un joueur qui aura la {{t:position|position}} après le flop"
  then: "vous vous {{t:fold|couchez}} avec environ {{n:pf.vs3bet.fold.low}}–{{n:pf.vs3bet.fold.high}} de vos {{t:open|ouvertures}}, vous {{t:call|suivez}} avec environ {{n:pf.vs3bet.call.low}}–{{n:pf.vs3bet.call.high}}, et vous 4-bettez avec environ {{n:pf.vs3bet.4bet.low}}–{{n:pf.vs3bet.4bet.high}}"
  because: "si vous vous couchez plus souvent que {{n:alpha.vs-3bet-ip-size}}, l'adversaire gagne de l'argent en 3-bettant n'importe quelle main, donc vous vous {{t:fold|couchez}} juste en dessous de ce seuil"
  level: heuristic
  source: "intervalle proche des sources, avec la borne supérieure des abandons juste sous le seuil calculé (ADR-24) : école publiant des résultats de solveur, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), solveur NL200, CO face au 3-bet du Bouton à 7,5bb : abandon 63,7%, call 17,2%, 4-bet 19,1% ; site de tableaux de formation simplifiés, tableaux de formation simplifiés (https://pailiku.com/charts/co-vs-btn-3bet), rapportés à la range d'ouverture du CO : environ 66/23/11 ; HUD environ 55% d'abandons ; site de formation 50–55/30–40/5–8 (niveau 4, s'en écarte) ; seuil issu du calcul (document 12 M4–M6, D-04)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training }, { kind: math }]
- id: R-M4-008
  module: m4
  if: "vous recevez un 3-bet et serez {{t:out-of-position|hors de position}} après le flop"
  then: "vous {{t:call|suivez}} surtout avec des hautes cartes assorties, des as assortis forts, des {{t:pair|paires}} moyennes et hautes et une partie des {{t:connectors|connecteurs}} assortis ; avec les mains dépareillées plus faibles (KJo, ATo, QTo), vous vous {{t:fold|couchez}}"
  because: "les mains dépareillées sont souvent dominées et {{t:equity-realization|réalisent mal leur équité}} {{t:out-of-position|hors de position}}"
  level: heuristic
  source: "site de formation, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide), CO vs BTN 3-bet : « Call QQ, JJ, TT, 99, 88, AQs, AJs, KQs, KJs, QJs, JTs, T9s, 77, 66 Fold Marginal offsuit broadways » ; site de tableaux de formation simplifiés (https://pailiku.com/charts/co-vs-btn-3bet) : « Call JJ-77, AQs-ATs, AKs, KQs-KJs, QJs, JTs, T9s, 98s, 87s, 76s, 65s » ; site de formation, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/) : « calling with fewer suited connectors, suited gappers and offsuit broadway hands »"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }]
- id: R-M4-009
  module: m4
  if: "vous recevez un 3-bet et aurez la {{t:position|position}} après le flop"
  then: "vous {{t:call|suivez}} plus large : les {{t:pair|paires}} de 66 à TT, les mains assorties avec des hautes cartes et les {{t:connectors|connecteurs}} assortis ; avec les plus petites {{t:pair|paires}}, vous vous {{t:fold|couchez}}"
  because: "{{t:in-position|en position}}, il est plus facile de réaliser son équité et de remporter un gros {{t:pot|pot}} quand on touche"
  level: heuristic
  source: "site de formation, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/) : les plus petites paires se couchent « even with position » ; un site de formation admet de suivre avec les petites paires en position (document 12 M4–M6, D-05)"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training }]
- id: R-M4-010
  module: m4
  if: "vous recevez un 3-bet avec AA, KK ou AK"
  then: "vous 4-bettez généralement ({{t:value|pour la valeur}}) ; AK se joue parfois aussi en {{t:call|call}}"
  because: "ces mains veulent engager tout le stack et dominent la plupart des mains qui {{t:call|suivront}} un 4-bet"
  level: heuristic
  source: "site de formation, How to Play vs 3-Bets (https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/) : AK « should be 4-bet with 100% frequency » (Bouton vs BB) ; site de formation, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide) : « 4-bet value KK+, AKs (mixed), AKo (mixed) » ; site de tableaux de formation simplifiés (https://pailiku.com/charts/co-vs-btn-3bet) : « 4-bet QQ+, AKo, A5s-A4s Call JJ-77, AQs-ATs, AKs »"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }]
- id: R-M4-011
  module: m4
  if: "vous 4-bettez"
  then: "vous {{t:raise|relancez}} à environ {{n:pf.4bet.size-ip.low}}–{{n:pf.4bet.size-ip.high}} le 3-bet {{t:in-position|en position}} et {{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}} {{t:out-of-position|hors de position}}"
  because: "après le {{t:call|call}} d'un tel 4-bet, il reste dans les stacks environ {{n:spr.4bet.high}}–{{n:spr.4bet.oop}} fois ce qu'il y a dans le {{t:pot|pot}} ({{t:in-position|en position}}, p. ex. 4-bet du Bouton sur le 3-bet de la {{t:small-blind|petite blinde}} à {{n:pf.3bet.oop-total}} : environ {{n:spr.4bet.high}}–{{n:spr.4bet}} ; {{t:out-of-position|hors de position}}, p. ex. 4-bet du {{t:cutoff|CO}} sur le 3-bet du Bouton à {{n:pf.3bet.ip-total}} : environ {{n:spr.4bet.oop}}), donc les bonnes mains engageront facilement le reste"
  level: heuristic
  source: "école publiant des résultats de solveur, What is a 3-bet in poker (https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide), solveur NL200 : le CO hors de position 4-bette à 17,2bb, soit 2,3 fois un 3-bet à 7,5bb ; site de formation, The Complete 3-Bet Strategy (https://deepfold.co/en/blog/three-bet-strategy-guide) : 2,2–2,5x en position, 2,5–3x hors de position (2,4x dans son exemple) ; SPR issu du calcul (document 12 M4–M6, D-06)"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: math }]
- id: R-M4-012
  module: m4
  if: "avant vous, un ou plusieurs joueurs ont seulement complété la {{t:big-blind|grosse blinde}} (limp)"
  then: "vous {{t:raise|relancez}} à {{n:pf.iso.base}} plus {{n:pf.iso.per-limper}} par limpeur, {{n:pf.iso.oop-extra}} de plus {{t:out-of-position|hors de position}}"
  because: "une {{t:raise|relance}} plus petite offre aux limpeurs un trop bon prix et ne leur enlève pas le coup"
  level: heuristic
  check: { kind: iso-size, players: [6, 9], stackBb: [100], params: { base: "n:pf.iso.base", perLimper: "n:pf.iso.per-limper", oopExtra: "n:pf.iso.oop-extra" } }
  source: "site de formation, 10 Tips for Crushing Limpers (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm) : « Raise to 3bb+1bb per limper when playing online, and 4bb+1bb per limper when playing live » ; site de tableaux préflop, ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy) : « Base open size (3bb) + 1 big blind per limper », « Add 1bb more from OOP positions ». La taille concerne le jeu en ligne"
  sources: [{ kind: training, url: "https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }]
- id: R-M4-013
  module: m4
  if: "avant vous, plusieurs joueurs limpent"
  then: "vous {{t:raise|relancez}} avec une {{t:range|range}} plus serrée, surtout {{t:value|pour la valeur}} ; les mains spéculatives (petites {{t:pair|paires}}, {{t:connectors|connecteurs}} assortis) peuvent compléter {{t:in-position|en position}}"
  because: "chaque limpeur supplémentaire augmente la probabilité que quelqu'un {{t:call|suive}}, donc un {{t:bluff|bluff}} préflop perd de sa valeur"
  level: heuristic
  source: "site de tableaux préflop, ISO Raise Strategy (https://www.preflopwizard.app/blog/poker-iso-raise-strategy) : « Against multiple limpers, tighten each range by roughly one tier », sur le fait de compléter : « This is almost always wrong » ; site de formation (https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm) : « limp behind with those suited connectors, small pairs » ; site de formation (https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm) : « over-limping, which can be fine ». Contradiction au niveau 4 : les deux jeux sont corrects (ADR-04, D-144)"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }, { kind: training, url: "https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm" }]
- id: R-M4-014
  module: m4
  if: "vous êtes en {{t:big-blind|grosse blinde}}, et la {{t:small-blind|petite blinde}} a {{t:open|ouvert}} à {{n:pf.open-size-sb}}"
  then: "vous défendez large, plus de la moitié des mains, même si pour {{t:call|suivre}} il vous faut environ {{n:eq.bb-vs-sb-open}} d'équité ; le 3-bet fait environ {{n:pf.3bet.size-ip}} l'{{t:open|ouverture}}"
  because: "après le flop, vous avez la {{t:position|position}}, donc vous réalisez davantage d'équité ; la solution de solveur publiée défend ici environ {{n:pf.bb-def.vs-sb.pub}} des mains"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-sb, nine.vs-open.bb-vs-sb] }
  source: "calcul du prix ; solveur préflop du projet (ADR-20) ; arbre du solveur (3-bet à 9bb) ; site de tableaux de solveur, BB vs SB (https://beyondgto.com/defense/bb-vs-sb), NL500, 100bb : « GTO defends the Big Blind with about 56% of hands »"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-sb" }, { kind: math }, { kind: solver-app }]

# M5: c-bet na flopie. Pula po otwarciu i jednym sprawdzeniu, 100bb. Definicje tekstur liczy poker-core (texture.ts),
# punkty i progi mokrości są w numbers.yaml (tex.*). Reguły strategiczne według rejestru decyzji D-01–D-21
# (dokument 12 M4–M6); bez częstotliwości w procentach.
- id: R-M5-001
  module: m5
  if: "le flop totalise moins de {{n:tex.threshold.medium}} points d'{{t:wetness|humidité}} : une {{t:straight|quinte}} possible de plusieurs façons (avec au moins deux jeux de deux rangs) donne {{n:tex.points.straight.made}} pts, une {{t:straight|quinte}} possible d'une seule façon {{n:tex.points.straight.made-one}}, un simple {{t:straight-draw|tirage quinte}} {{n:tex.points.straight.draw}}, deux cartes d'une même couleur {{n:tex.points.suits.two-tone}}, trois d'une même couleur {{n:tex.points.suits.monotone}}"
  then: "c'est un flop {{t:dry|sec}} : il y a peu de {{t:draw|tirages}}, et personne n'a encore de {{t:straight|quinte}} ni de {{t:flush|couleur}} faite"
  because: "les cartes suivantes changent rarement le leader, donc la meilleure main au flop le reste généralement"
  level: rules
  source: "définition de la texture dans l'application (poker-core, texture.ts : WETNESS_POINTS, WETNESS_THRESHOLDS) ; notion de flop sec : site de formation, Sizing Your C-Bets ; site de formation, What Is a Continuation Bet ; exemples de flops secs : site de formation (K72r, A94r), site de formation (AA6r) ; la limite sec/intermédiaire est une convention de l'application"
  sources: [{ kind: training }, { kind: training }]
- id: R-M5-002
  module: m5
  if: "le flop totalise au moins {{n:tex.threshold.wet}} points d'{{t:wetness|humidité}} (points comme dans la définition du flop {{t:dry|sec}})"
  then: "c'est un flop {{t:wet|wet}} : l'adversaire a souvent des {{t:draw|tirages}}, et parfois déjà une {{t:straight|quinte}} ou une {{t:flush|couleur}}"
  because: "les cartes suivantes changent souvent le leader, donc la main qui est la meilleure maintenant est moins sûre"
  level: rules
  source: "définition de la texture dans l'application (poker-core, texture.ts : WETNESS_POINTS, WETNESS_THRESHOLDS) ; notion de flop humide : site de formation, Sizing Your C-Bets ; site de formation, What Is a Continuation Bet ; exemples de flops humides : site de formation (987, QJT), site de formation, Bet Sizing Strategy: 8 Rules (T954, https://upswingpoker.com/bet-size-strategy-tips-rules/) ; la limite intermédiaire/humide est une convention de l'application"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: training }]
- id: R-M5-003
  module: m5
  if: "vous avez {{t:open|ouvert}} avant le flop, la {{t:big-blind|grosse blinde}} a {{t:call|suivi}}, et il y a un as ou un roi au flop"
  then: "vous avez l'{{t:range-advantage|avantage de range}} : en moyenne, vos mains sont plus fortes que celles de l'adversaire"
  because: "la {{t:big-blind|grosse blinde}} {{t:raise|relance}} la plupart de ses AA, KK et AK avant le flop, donc après un simple {{t:call|call}} elle en a peu, alors que vous les avez toutes"
  level: heuristic
  source: "site de solveur commercial, Range advantage (glossaire) ; site de solveur commercial, The Turn Probe Bet (« BB lacks the stronger Ace-highs because they would have 3-bet with them preflop »)"
  sources: [{ kind: solver-pub }]
- id: R-M5-004
  module: m5
  if: "vous avez {{t:open|ouvert}} avant le flop, et le flop est bas et {{t:connected|connecté}} ou {{t:semi-connected|semi-connecté}}, p. ex. 7-6-5"
  then: "vous c-bettez moins souvent que sur les flops hauts, et beaucoup de mains {{t:check|checkent}}"
  because: "la {{t:big-blind|grosse blinde}} défend beaucoup de {{t:connectors|connecteurs}} assortis et de petites {{t:pair|paires}}, donc elle a plus souvent une {{t:two-pair|double paire}} ou une {{t:straight|quinte}} : c'est elle qui a l'{{t:nuts-advantage|avantage de nuts}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "combinatoire : le Bouton ouvre toutes les paires 55–77, et la grosse blinde les suit, donc les deux ont à peu près autant de sets ; site de solveur commercial, Bullying the Blinds (sur 654r, le Bouton checke plus de la moitié de sa range ; « Even on 654r… BB has less than 52% equity »)"
  sources: [{ kind: solver-pub }, { kind: math }]
- id: R-M5-005
  module: m5
  if: "votre {{t:range|range}} contient beaucoup plus de mains très fortes que celle de l'adversaire ({{t:nuts-advantage|avantage de nuts}})"
  then: "vous pouvez miser plus gros ; quand vous n'avez que l'{{t:range-advantage|avantage de range}}, vous misez petit"
  because: "une grosse {{t:bet|mise}} tire davantage des mains moyennes de l'adversaire, et vous tomberez rarement sur une meilleure main qui vous {{t:raise|relancera}}"
  level: heuristic
  source: "site de solveur commercial, The Mechanics of C-Bet Sizing ; site de solveur commercial, Range advantage (glossaire)"
  sources: [{ kind: solver-pub }]
- id: R-M5-006
  module: m5
  if: "l'adversaire a une main sans {{t:pair|paire}}"
  then: "le flop n'apparie aucune de ses cartes dans environ {{n:flop.miss.unpaired}} des cas"
  because: "sur les {{n:cards.unseen.preflop}} cartes inconnues, seules {{n:pair.outs.unpaired}} apparient sa main, et le flop ne compte que {{n:cards.board.flop}} cartes"
  level: math
  source: "calcul exact (poker-core) ; cohérent avec un site de calculateurs de poker (28,96% + 2,02% + 1,45% = 32,4% de touche)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M5-007
  module: m5
  if: "en tant qu'{{t:aggressor|agresseur}} préflop, vous avez la {{t:position|position}}, et le flop est {{t:dry|sec}} et haut, p. ex. K-7-2 en trois couleurs"
  then: "vous c-bettez souvent et petit, environ {{n:cbet.size.small}} du {{t:pot|pot}} (simplification : sur ces flops, le solveur utilise aussi l'{{t:overbet|overbet}})"
  because: "vous avez l'{{t:range-advantage|avantage de range}}, et les mains faibles de l'adversaire n'ont presque aucune chance : une petite {{t:bet|mise}} suffit pour qu'il se {{t:fold|couche}}, et les {{t:pair|paires}} inférieures la {{t:call|suivront}} quand même"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "site de solveur commercial, Flop Heuristics: IP C-Betting in Cash Games (33%) ; site de formation, Bet Sizing Strategy: 8 Rules (« Bet small (25-35% pot) on dry, static board textures », https://upswingpoker.com/bet-size-strategy-tips-rules/) ; site de formation, What Is a Continuation Bet (K72r) ; site de formation, Picking the Proper C-Bet Sizing on Ace-High Boards (1/3 du pot)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M5-008
  module: m5
  if: "en tant qu'{{t:aggressor|agresseur}} préflop, vous avez la {{t:position|position}}, et le flop donne à l'adversaire de nombreux {{t:draw|tirages}}, mais aucune {{t:straight|quinte}} n'est encore possible, p. ex. K-J-7 {{t:two-tone|bicolore}}"
  then: "vous c-bettez moins souvent, mais plus gros, p. ex. {{n:cbet.size.big}} du {{t:pot|pot}} ; les mains moyennes sans {{t:draw|tirage}} {{t:check|checkent}} plus souvent ; quand une {{t:straight|quinte}} est déjà possible, p. ex. J-T-8, les solveurs misent plus petit"
  because: "les {{t:draw|tirages}} de l'adversaire ont beaucoup d'équité, donc une grosse {{t:bet|mise}} leur fait payer cher la carte suivante"
  level: heuristic
  source: "site de solveur commercial, Flop Heuristics: IP C-Betting in Cash Games (« increased use of the 66% pot bet size, but decreased overall betting frequency ») ; site de formation, Bet Sizing Strategy: 8 Rules (55–80%, https://upswingpoker.com/bet-size-strategy-tips-rules/) ; site de formation, Picking the Proper C-Bet Sizing on Ace-High Boards (2/3 du pot)"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }]
- id: R-M5-009
  module: m5
  if: "en tant qu'{{t:aggressor|agresseur}} préflop, vous avez la {{t:position|position}}, et le flop est {{t:paired|pairé}}, p. ex. Q-Q-6"
  then: "vous c-bettez souvent et petit"
  because: "vous avez l'{{t:range-advantage|avantage de range}}, et sur un flop {{t:paired|pairé}} les {{t:draw|tirages}} sont rares, donc un adversaire sans {{t:pair|paire}} peut rarement {{t:call|suivre}} même une petite {{t:bet|mise}} ; une grosse {{t:bet|mise}} n'est pas rentable, car chacun de vous peut avoir un {{t:three-of-a-kind|brelan}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "site de solveur commercial, Flop Heuristics: IP C-Betting in Cash Games (« Paired flops are bet significantly more often… only be bet for small sizing… reduced nut advantage from trips being in both player's ranges » ; « On paired boards, it's also much harder to have a draw »)"
  sources: [{ kind: solver-pub }]
- id: R-M5-010
  module: m5
  if: "en tant qu'{{t:aggressor|agresseur}} préflop, vous avez la {{t:position|position}}, et le flop est {{t:monotone|monocolore}} (trois cartes de la même couleur)"
  then: "vous c-bettez moins souvent que d'habitude et petit"
  because: "n'importe quel joueur peut déjà avoir une {{t:flush|couleur}}, donc l'{{t:nuts-advantage|avantage de nuts}} de l'{{t:aggressor|agresseur}} diminue, et dans un gros {{t:pot|pot}} la {{t:flush|couleur}} de l'adversaire coûte cher"
  level: heuristic
  source: "site de solveur commercial, Flop Heuristics: IP C-Betting in Cash Games (« Monotone boards see a drastic decrease in betting frequency and sizing », BTN vs BB, https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/) ; site de solveur commercial, The Mechanics of C-Bet Sizing (« when a very wet board like Q♦8♦7♦ is dealt, the bet sizing comes down again », https://blog.gtowizard.com/the-mechanics-of-c-bet-sizing/) : un flop humide ne signifie pas une grosse mise ; site de formation, Monotone Flops (Kanu7, résultats de solveur : « c-betting half the time for a 25-33% pot sizing », https://upswingpoker.com/monotone-flops-kanu7/) ; décision D-39 (document 12 M4–M6, rapport 12a-22)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/monotone-flops-kanu7/" }]
- id: R-M5-011
  module: m5
  if: "vous c-bettez sans aucune main, en comptant uniquement sur l'{{t:fold|abandon}} de l'adversaire"
  then: "avec une {{t:bet|mise}} de {{n:cbet.size.small}} du {{t:pot|pot}}, l'adversaire doit se {{t:fold|coucher}} plus souvent que dans {{n:alpha.cbet.small}} des cas, et avec {{n:cbet.size.big}} du {{t:pot|pot}}, plus souvent que dans {{n:alpha.cbet.big}}"
  because: "vous risquez la mise pour gagner le {{t:pot|pot}} : le seuil est mise ÷ ({{t:pot|pot}} + mise)"
  level: math
  source: "calcul : alpha = mise / (pot + mise)"
  sources: [{ kind: math }]
- id: R-M5-012
  module: m5
  if: "vous avez {{t:open|ouvert}} avant le flop, et l'adversaire a {{t:call|suivi}} en {{t:position|position}} (p. ex. le Bouton face à votre {{t:open|ouverture}} du {{t:cutoff|CO}})"
  then: "vous c-bettez moins souvent qu'{{t:in-position|en position}} et {{t:check|checkez}} plus souvent, même avec de bonnes mains"
  because: "la {{t:range|range}} d'un joueur qui {{t:call|suit}} en {{t:position|position}} est {{t:condensed|condensée}} : il s'est {{t:fold|couché}} avec les mains faibles et a {{t:raise|relancé}} une partie des plus fortes, donc il lui reste surtout des mains moyennes et bonnes ; de plus, après le flop, vous parlez en premier à chaque {{t:street|street}}"
  level: heuristic
  source: "site de solveur commercial, C-Betting As the OOP Preflop Raiser (UTG vs BTN c-bet 28% ; « Even a hand like top pair top kicker is preferred to be played as a check-call ») ; site de formation, C-Betting On Ace-High Boards (CO vs BTN, A94r : « we will check over 96% of the time »)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M5-013
  module: m5
  if: "au flop, vous avez deux adversaires ou plus"
  then: "vous c-bettez beaucoup moins souvent, surtout avec des mains fortes et de bons {{t:draw|tirages}} ; vous {{t:bluff|bluffez}} peu, et quand vous misez, vous misez petit"
  because: "chaque adversaire supplémentaire augmente la probabilité que quelqu'un ait touché : deux mains sans {{t:pair|paire}} ratent ensemble seulement dans environ {{n:flop.miss.two}} des cas"
  level: heuristic
  source: "site de formation, Multiway Pots in Poker ; site de formation, C-Betting in Multiway Pots (« Check even pocket kings… the solver checks its entire range » ; « around a quarter to a third of pot ») ; calcul exact : C(36,3)/C(48,3)"
  sources: [{ kind: training }, { kind: training }, { kind: math }]

# M6: obrona na flopie. Matematyka z formuł (numbers.yaml); zalecenia według rejestru decyzji D-22–D-38 (dokument 12
# M4–M6) i D1 (dokument 12 M7–M9).
- id: R-M6-001
  module: m6
  if: "l'adversaire mise 1/3 du {{t:pot|pot}} à la river"
  then: "en théorie, vous défendez ({{t:call|suivez}} ou {{t:raise|relancez}}) environ {{n:mdf.bet-third}} de votre {{t:range|range}} ; c'est la {{t:mdf|MDF}}"
  because: "un {{t:bluff|bluff}} sans chance risque 1 part pour en gagner 3 ; si vous vous {{t:fold|couchez}} plus souvent que {{n:alpha.bet-third}}, l'adversaire gagne de l'argent en {{t:bluff|bluffant}} avec n'importe quelles cartes"
  level: math
  source: "calcul : MDF = pot/(pot+mise) ; site de formation, MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker : « The framework is a starting point, not a rule »)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }, { kind: math }]
- id: R-M6-002
  module: m6
  if: "vous {{t:bluff|bluffez}} avec une main sans aucune chance de gagner"
  then: "le {{t:bluff|bluff}} est rentable quand l'adversaire se {{t:fold|couche}} plus souvent qu'alpha = mise/({{t:pot|pot}}+mise) ; avec une mise de la moitié du {{t:pot|pot}}, c'est {{n:alpha.bet-half}}"
  because: "vous risquez la mise pour gagner le {{t:pot|pot}} ; plus la mise est grosse, plus souvent l'adversaire doit se {{t:fold|coucher}}"
  level: math
  source: "calcul : alpha = mise/(pot+mise) ; site de solveur commercial, MDF & Alpha (https://blog.gtowizard.com/mdf-alpha)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: math }]
- id: R-M6-003
  module: m6
  if: "vous recevez une mise au flop {{t:out-of-position|hors de position}}"
  then: "vous pouvez défendre moins que ce qu'indique la {{t:mdf|MDF}} (nettement moins sur les flops défavorables au défenseur) ; vous traitez la {{t:mdf|MDF}} comme un point de repère, pas comme une obligation, mais vous ne vous {{t:fold|couchez}} pas en masse face aux petits c-bets"
  because: "les {{t:bluff|bluffs}} de l'adversaire ont encore de l'équité et peuvent s'améliorer, et {{t:out-of-position|hors de position}}, vous ne réaliserez pas toute l'équité de vos mains faibles"
  level: heuristic
  source: "site de solveur commercial, MDF & Alpha (https://blog.gtowizard.com/mdf-alpha : « On average, BB is consistently over-folding to all bet sizes on the flop » ; en position, il « calls much closer to MDF on average ») ; dans un exemple au turn, le solveur défendait en moyenne près de la MDF : site de formation, What the Best Poker Pros Already Know About Playing vs. Double Barrels (https://upswingpoker.com/vs-double-barrels-turn/) ; défense face aux petits c-bets : R-M6-006"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: training, url: "https://upswingpoker.com/vs-double-barrels-turn/" }]
- id: R-M6-004
  module: m6
  if: "un joueur dont vous savez, par observation, qu'il {{t:bluff|bluffe}} rarement {{t:bet|mise}} gros à la river"
  then: "vous vous {{t:fold|couchez}} plus souvent que ne l'indique la {{t:mdf|MDF}}, y compris avec des {{t:pair|paires}} moyennes"
  because: "la {{t:mdf|MDF}} suppose que l'adversaire {{t:bluff|bluffe}} assez souvent ; quand les {{t:bluff|bluffs}} manquent, un {{t:call|call}} avec une main plus faible paie surtout des mains meilleures"
  level: exploit
  population: "un joueur précis observé à la table ; aucune donnée sur la population (échantillon, limites, site), donc la règle ne suppose pas qu'un groupe entier de joueurs bluffe rarement ; les coachs de deux sites de formation décrivent ainsi les joueurs récréatifs passifs (qui jouent pour le plaisir, généralement moins bien que les habitués) aux petites limites, sans chiffres tirés d'une base de mains"
  source: "site de formation, Bluff Catching: When to Call and When to Let It Go (https://deepfold.co/en/blog/bluff-catching-principles : les joueurs récréatifs passifs ne bluffent pas avec de grosses mises à la river) ; site de formation, MDF in Poker: Why Most Players Misuse It (https://pokercoaching.com/blog/mdf-poker : « In low-stakes games, most players will bluff way less »)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/bluff-catching-principles" }, { kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }]
- id: R-M6-005
  module: m6
  if: "l'adversaire {{t:bet|mise}} plus gros"
  then: "vous défendez avec une {{t:range|range}} plus serrée : face à une mise de 1/3 du {{t:pot|pot}}, la {{t:mdf|MDF}} est de {{n:mdf.bet-third}}, et face à une mise de la taille du {{t:pot|pot}}, de {{n:mdf.bet-pot}}"
  because: "une mise plus grosse donne un moins bon prix : l'équité requise passe de {{n:eq.bet-third}} à {{n:eq.bet-pot}}"
  level: math
  source: "calcul : MDF = pot/(pot+mise), équité requise = mise/(pot+2·mise)"
  sources: [{ kind: math }]
- id: R-M6-006
  module: m6
  if: "en {{t:big-blind|grosse blinde}}, vous recevez un petit c-bet (environ 1/3 du {{t:pot|pot}})"
  then: "vous continuez avec presque toutes les {{t:pair|paires}}, les {{t:draw|tirages}}, les hautes cartes avec un {{t:draw|tirage}} supplémentaire (backdoor) et généralement aussi as hauteur ; vous vous {{t:fold|couchez}} avec les mains les plus faibles sans {{t:pair|paire}} et sans {{t:draw|tirage}}"
  because: "il ne vous faut qu'environ {{n:eq.bet-third}} d'équité, et ces mains soit battent déjà les {{t:bluff|bluffs}}, soit peuvent s'améliorer"
  level: heuristic
  source: "site de formation, Defending the BB on High Card Boards (solveur : « we will continue with pretty much all pairs including the underpairs and even A-high hands »)"
  sources: [{ kind: training }]
- id: R-M6-007
  module: m6
  if: "vous avez deux hautes cartes sans {{t:pair|paire}} et sans {{t:draw|tirage}}, et le c-bet est gros (3/4 du {{t:pot|pot}} ou plus)"
  then: "vous vous {{t:fold|couchez}} généralement (sur les flops {{t:dry|secs}} avec un roi, le solveur {{t:call|suit}} toutefois avec beaucoup de mains contenant un as)"
  because: "{{t:out-of-position|hors de position}}, une telle main arrive rarement à l'abattage, et une {{t:pair|paire}} faite avec une haute carte perd souvent malgré tout ; vous {{t:call|suivez}} plutôt quand vous avez un {{t:draw|tirage}} supplémentaire, idéalement à la {{t:flush|couleur}} max"
  level: heuristic
  source: "site de formation, When to Call With Ace-High (J42, 66% : « the solver does not call with any Ace-high hand that doesn't have a significant backdoor draw ») ; site de formation, Defending the BB on High Card Boards (K84 : le solveur suit avec une partie des as, même face à 2/3 du pot)"
  sources: [{ kind: training }, { kind: training }]
- id: R-M6-008
  module: m6
  if: "vous voulez faire un check-raise au flop"
  then: "vous le faites surtout avec les mains les plus fortes ({{t:two-pair|doubles paires}}, sets) et des {{t:draw|tirages}} ({{t:flush|couleur}}, {{t:oesd|OESD}}) ; avec les {{t:pair|paires}} moyennes, vous {{t:call|suivez}} généralement (simplification : face aux petits c-bets, le solveur {{t:raise|relance}} aussi une partie des {{t:top-pair|top paires}} et des {{t:pair|paires}} faibles pour se protéger)"
  because: "après un check-raise, les mains plus faibles se {{t:fold|couchent}} généralement et les meilleures paient, donc une {{t:pair|paire}} moyenne y gagne rarement ; un {{t:draw|tirage}} a deux façons de gagner : l'{{t:fold|abandon}} de l'adversaire ou la touche"
  level: heuristic
  source: "site de formation, 5 Winning Check-Raising Strategies (les solveurs « check-raise all sorts of top pairs versus small bets ») ; site de formation (tableaux de solveur) (sets et tirages en check-raise ; paires faibles pour se protéger)"
  sources: [{ kind: training }]
- id: R-M6-009
  module: m6
  if: "le c-bet est petit, ou le flop est bas et {{t:connected|connecté}} (p. ex. 7-6-5)"
  then: "vous faites check-raise plus souvent ; sur les flops hauts favorables au relanceur (p. ex. K-J-T, A-A-K) et face aux gros c-bets, moins souvent"
  because: "sur les flops bas, la {{t:big-blind|grosse blinde}} a davantage de mains très fortes ({{t:nuts-advantage|avantage de nuts}}), et un petit c-bet offre une occasion bon marché de {{t:raise|relancer}}"
  level: heuristic
  source: "site de formation, How to Check-Raise Like a High Stakes Juggernaut (flops sur lesquels ne pas relancer : K♣J♥T♠, Q♥J♦T♠, A♥A♠K♥ ; check-raise 12,65% face à 33% et 8,66% face à 66% du pot) ; site de solveur commercial (« The larger the BTN bets, the less BB raises »)"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M6-010
  module: m6
  if: "vous faites check-raise au flop"
  then: "vous {{t:raise|relancez}} à environ {{n:xr.mult.low}}–{{n:xr.mult.example}} le c-bet, d'autant plus que le c-bet est petit ; pas au minimum"
  because: "avec un check-raise à {{n:xr.mult.example}} le c-bet, le Bouton a besoin d'environ {{n:eq.vs-xr.example}} d'équité pour {{t:call|suivre}}, et à {{n:xr.too-small.mult}} le c-bet, seulement {{n:eq.vs-xr.too-small}} ; à ce prix-là, il paiera avec n'importe quel {{t:draw|tirage}}"
  level: heuristic
  source: "calcul du prix : montant à payer/(pot après la relance + montant à payer) ; site de formation, Level-Up Podcast ep. 1 (Blackwood) : 4,5x face aux petits c-bets, 3,2x face aux gros (https://upswingpoker.com/podcast/ep1-check-raise/) ; direction cohérente avec un site de solveur commercial : plus la mise est petite, plus le multiple est grand"
  sources: [{ kind: training, url: "https://upswingpoker.com/podcast/ep1-check-raise/" }, { kind: solver-pub }, { kind: math }]
- id: R-M6-011
  module: m6
  if: "vous envisagez un check-raise en {{t:bluff|bluff}} ou en {{t:semi-bluff|semi-bluff}}"
  then: "vous y mettez surtout de bons {{t:draw|tirages}} ; moins l'adversaire se {{t:fold|couche}}, moins vous faites de tels {{t:bluff|bluffs}}, et quand il ne se {{t:fold|couche}} presque jamais, vous faites check-raise surtout {{t:value|pour la valeur}}"
  because: "un {{t:bluff|bluff}} ne rapporte que si l'adversaire se {{t:fold|couche}} plus souvent qu'alpha (R-M6-002) ; un bon {{t:draw|tirage}} gagne aussi quand il touche, donc il perd le moins quand les {{t:fold|abandons}} manquent"
  level: heuristic
  source: "conclusion tirée d'alpha (R-M6-002) : un bluff a besoin des abandons de l'adversaire ; site de formation, 5 Winning Check-Raising Strategies (« tighten your bluffing range to include only strong draws »)"
  sources: [{ kind: training }, { kind: math }]

# M7: turn. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 „Weryfikacja źródeł — M7–M9” (decyzje D1–D9).
- id: R-M7-001
  module: m7
  if: "vous avez c-betté le flop en {{t:position|position}}, l'adversaire a {{t:call|suivi}}, et au turn tombe une haute carte (un as ou un roi) sur un {{t:board|board}} plus bas"
  then: "vous {{t:bet|misez}} plus souvent un {{t:second-barrel|second barrel}}, y compris en {{t:bluff|bluff}}"
  because: "cette carte touche généralement plus souvent votre {{t:range|range}} d'{{t:open|ouverture}} que la {{t:range|range}} du défenseur, et chaque {{t:pair|paire}} de l'adversaire recule d'un rang"
  level: heuristic
  source: "site de solveur commercial, The Worst Turn Card ; site de formation, When to Fire a Second Barrel ; site de formation, When to Double Barrel the Turn as a Bluff"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-002
  module: m7
  if: "vous {{t:bluff|bluffez}} au turn avec un {{t:second-barrel|second barrel}}"
  then: "vous {{t:bluff|bluffez}} généralement avec des mains qui ont des outs ({{t:flush-draw|tirage couleur}}, tirage {{t:straight|quinte}}, gutshot avec une haute carte), quand l'adversaire tend plutôt à se {{t:fold|coucher}} ou à {{t:call|suivre}} ; quand il peut {{t:raise|relancer}}, le solveur {{t:bluff|bluffe}} aussi avec des mains sans outs (simplification : le choix dépend de la réponse de l'adversaire)"
  because: "un {{t:semi-bluff|semi-bluff}} gagne de deux façons : quand l'adversaire se {{t:fold|couche}} ou quand vous touchez à la river ; un {{t:bluff|bluff}} sans outs n'a que la première (stacks d'environ {{n:format.stack}})"
  level: heuristic
  source: "site de solveur commercial, From Gutshots to Airballs: Choosing Your Bluffs ; coach avec un site de formation, The Double Barrel Checklist ; site de formation, When to Double Barrel the Turn as a Bluff (à environ 100bb)"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-003
  module: m7
  if: "au turn, vous avez une main moyenne (p. ex. une {{t:second-pair|deuxième paire}} ou une {{t:top-pair|top paire}} avec un kicker faible), et l'adversaire a déjà {{t:call|suivi}} un c-bet"
  then: "vous {{t:check|checkez}} plus souvent au lieu de miser une deuxième fois"
  because: "après avoir {{t:call|suivi}} au flop, l'adversaire a une {{t:range|range}} plus forte qu'avant : face à une mise, il se {{t:fold|couchera}} avec les mains plus faibles et paiera avec les meilleures ; en {{t:check|checkant}}, vous gardez le {{t:pot|pot}} petit et allez à l'abattage"
  level: heuristic
  source: "site de solveur commercial (Brokos), Principles of Turn Strategy ; site de formation, Poker Basics: Polarised Ranges ; site de solveur commercial, Poker: The Battle for Information"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M7-004
  module: m7
  if: "vous {{t:bluff|bluffez}} au turn avec une main qui ne gagnera presque jamais seule"
  then: "avec une mise de 3/4 du {{t:pot|pot}}, l'adversaire doit se {{t:fold|coucher}} plus souvent que dans {{n:alpha.bet-three-quarters}} des cas, avec une mise de la moitié du {{t:pot|pot}}, plus souvent que dans {{n:alpha.bet-half}}"
  because: "vous risquez la mise pour gagner le {{t:pot|pot}} : le seuil est mise ÷ ({{t:pot|pot}} + mise) ; les outs que vous avez abaissent ce seuil"
  level: math
  source: "calcul : alpha = mise/(pot+mise)"
  sources: [{ kind: math }]
- id: R-M7-005
  module: m7
  if: "vous misez au turn avec une {{t:range|range}} {{t:polarized|polarisée}} (mains très fortes et {{t:semi-bluff|semi-bluffs}} avec {{t:draw|tirage}}, sans mains moyennes)"
  then: "vous choisissez une grosse taille, p. ex. 3/4 du {{t:pot|pot}}, et les mains moyennes {{t:check|checkent}}"
  because: "les mains fortes veulent faire grossir le {{t:pot|pot}} avant la river, les {{t:bluff|bluffs}} ont besoin d'{{t:fold|abandons}}, et les mains moyennes ne gagnent rien à un gros {{t:pot|pot}}"
  level: heuristic
  source: "site de formation, Polarized vs Merged Ranges (définitions) ; site de formation, Polarised Ranges ; site de solveur commercial, The Worst Turn Card"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-006
  module: m7
  if: "vous avez une main forte au turn, et l'adversaire peut avoir un {{t:flush-draw|tirage couleur}}"
  then: "vous misez gros : face à une mise de 3/4 du {{t:pot|pot}}, le {{t:draw|tirage}} a besoin de {{n:eq.bet-three-quarters}} d'équité, et il en a environ {{n:odds.flush.turn-river}}"
  because: "face à une mise de 1/4 du {{t:pot|pot}}, {{n:eq.bet-quarter}} lui suffirait, donc une petite mise offre au {{t:draw|tirage}} un bon prix"
  level: math
  source: "calcul : équité requise = mise/(pot+2·mise), probabilité = outs ÷ cartes inconnues ; direction (une main forte et vulnérable mise gros) : site de formation, How Much Should You Bet on Connected Boards?"
  sources: [{ kind: training }, { kind: math }]
- id: R-M7-007
  module: m7
  if: "vous avez un {{t:draw|tirage}} au turn"
  then: "vous comptez la probabilité pour une seule carte : une {{t:flush|couleur}}, c'est environ {{n:odds.flush.turn-river}}, et non {{n:odds.flush.flop-river}} comme du flop à la river"
  because: "il ne reste qu'une carte jusqu'à la river, donc la probabilité est à peu près deux fois plus faible que celle calculée au flop pour deux cartes"
  level: math
  check: { kind: draw-price, streets: [turn] }
  source: "calcul exact (poker-core)"
  sources: [{ kind: math }]
- id: R-M7-008
  module: m7
  if: "au turn, le prix d'un {{t:draw|tirage}} est trop élevé (vous avez moins d'équité qu'il ne vous en faut)"
  then: "vous ne {{t:call|suivez}} que si, quand vous touchez, vous gagnerez au total au moins le montant à payer × (cartes qui ratent ÷ outs) ; ce qui dépasse le {{t:pot|pot}}, ce sont les implied odds"
  because: "alors les gains quand vous touchez couvrent les pertes quand vous ratez ; avec un tirage couleur et une mise de {{n:io.flush.bet}} dans un {{t:pot|pot}} de {{n:ex.third.pot}}, cela fait {{n:io.flush.extra}} au-delà du {{t:pot|pot}}"
  level: math
  check: { kind: implied-odds, streets: [flop, turn], params: { sprMin: "n:spr.zone.mid" } }
  source: "calcul de l'EV : équité × (pot + gain supplémentaire) = (1 − équité) × montant à payer"
  sources: [{ kind: math }]
- id: R-M7-009
  module: m7
  if: "vous comptez sur les implied odds"
  then: "vous n'y croyez que si l'adversaire a encore assez de {{t:chips|jetons}} derrière (un {{t:spr|SPR}} élevé), si votre {{t:draw|tirage}} vise la meilleure main et si la touche ne saute pas aux yeux"
  because: "les {{t:chips|jetons}} supplémentaires, c'est encore l'adversaire qui doit vous les payer ; avec un {{t:spr|SPR}} faible, il n'a pas de quoi, et une touche visible (p. ex. un troisième cœur sur le {{t:board|board}}) le fait fuir"
  level: heuristic
  source: "coach avec un site de formation, Implied Odds Calculator ; site de formation, Implied Odds"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-010
  module: m7
  if: "vous avez un {{t:draw|tirage}} à une petite {{t:flush|couleur}}, ou à une {{t:straight|quinte}} alors qu'une {{t:flush|couleur}} peut arriver sur le {{t:board|board}}"
  then: "vous {{t:call|suivez}} plus prudemment et comptez moins d'outs"
  because: "même en touchant, vous perdez parfois encore contre une meilleure main, et c'est alors que vous payez le plus (implied odds inversées)"
  level: heuristic
  source: "site de formation, Back to Basics (Part 2): Reverse Implied Odds ; coach avec un site de formation, Implied Odds Calculator"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-011
  module: m7
  if: "vous défendez la {{t:big-blind|grosse blinde}}, et le Bouton, après son {{t:open|ouverture}}, n'a pas fait de c-bet au flop (il a {{t:check|checké}})"
  then: "au turn, vous misez vous-même plus souvent (probe bet), surtout sur les boards bas ; sur les boards avec un as ou un roi, moins souvent"
  because: "le Bouton aurait misé avec beaucoup de mains fortes, donc après son {{t:check|check}} il en a moins ; sur les boards hauts, l'{{t:range-advantage|avantage de range}} reste toutefois de son côté"
  level: heuristic
  source: "site de solveur commercial, The Turn Probe Bet ; site de formation, Turn Probe (Kanu7) ; site de formation, Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-012
  module: m7
  if: "vous {{t:bet|misez}} en probe bet au turn"
  then: "vous misez avec les {{t:pair|paires}} qui veulent être payées et se protéger, et avec de bons {{t:draw|tirages}} ; les mains sans {{t:pair|paire}} et sans outs {{t:check|checkent}}"
  because: "les {{t:pair|paires}} gagnent de l'argent contre les mains plus faibles du Bouton et ne lui donnent pas de carte gratuite, les {{t:draw|tirages}} gagnent de deux façons, et les mains vides n'y gagnent rien"
  level: heuristic
  source: "site de solveur commercial, The Turn Probe Bet ; site de formation, Turn Probe (Kanu7) ; site de formation, Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-013
  module: m7
  if: "vous avez {{t:call|suivi}} un c-bet au flop, et l'adversaire mise une deuxième fois au turn"
  then: "vous défendez plus serré qu'au flop : les {{t:draw|tirages}} ne {{t:call|suivent}} qu'avec un bon prix ou des implied odds, et les mains sans outs ainsi que les {{t:pair|paires}} les plus faibles se {{t:fold|couchent}}"
  because: "l'adversaire {{t:bet|mise}} le {{t:second-barrel|second barrel}} avec une {{t:range|range}} plus étroite que celle du c-bet et généralement plus gros, et les {{t:draw|tirages}} n'ont plus qu'une carte"
  level: heuristic
  source: "site de formation, What the Best Poker Pros Already Know About Playing vs. Double Barrels"
  sources: [{ kind: training }]

# M8: river. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D10–D17). Reguł eksploatacyjnych brak (R-M6-004: obserwacja konkretnego gracza, bez danych o populacji, D-149).
- id: R-M8-001
  module: m8
  if: "à la river, {{t:in-position|en position}}, vous voulez miser {{t:value|pour la valeur}}, et l'adversaire ne peut plus que {{t:call|suivre}} ou se {{t:fold|coucher}}"
  then: "vous misez quand plus de {{n:value.threshold}} des mains qui {{t:call|suivront}} sont plus faibles que la vôtre ; vous ne comptez que les mains qui paieront, pas toutes les mains de l'adversaire"
  because: "chaque {{t:call|call}} d'une main plus faible gagne une mise, et chaque {{t:call|call}} d'une main meilleure en perd une ; quand l'adversaire se {{t:fold|couche}} avec une main plus faible, vous remportez le même {{t:pot|pot}} que vous auriez remporté après un {{t:check|check}}"
  level: math
  source: "calcul : espérance de la mise par rapport au check (programme M8 : une value bet gagne plus de la moitié des fois où elle est suivie)"
  sources: [{ kind: math }]
- id: R-M8-002
  module: m8
  if: "à la river, {{t:in-position|en position}}, vous avez une main moyenne, et les mains plus faibles de l'adversaire ne paieront pas une mise"
  then: "vous {{t:check|checkez}} et allez à l'abattage gratuitement"
  because: "après une mise, les mains plus faibles se {{t:fold|couchent}}, et les meilleures paient (ou {{t:raise|relancent}}), donc la mise transforme une main qui a de la valeur à l'abattage en {{t:bluff|bluff}}"
  level: heuristic
  source: "conclusion tirée de R-M8-001 ; site de solveur commercial, Mastering Thin Value Bets in Checked-Down Pots ; site de formation, River ; site de formation, Polarized vs Merged Ranges"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M8-003
  module: m8
  if: "votre main à la river bat à peine plus de la moitié des mains qui peuvent {{t:call|suivre}} (thin value)"
  then: "vous misez moins qu'avec une main forte, généralement environ 1/4–1/2 du {{t:pot|pot}}, quand l'adversaire {{t:raise|relance}} rarement (simplification : en {{t:position|position}}, face au risque d'un check-raise, vous descendez rarement sous 1/2 du {{t:pot|pot}})"
  because: "une petite mise sera {{t:call|suivie}} aussi par les mains plus faibles de l'adversaire ; une grosse mise sera {{t:call|suivie}} surtout par les meilleures, et alors les {{t:call|calls}} de mains plus faibles cessent d'être plus nombreux que ceux de mains meilleures"
  level: heuristic
  source: "site de solveur commercial, River Refinements ; site de solveur commercial, Mastering Thin Value Bets in Checked-Down Pots ; site de formation, Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-004
  module: m8
  if: "à la river, vous misez la totalité du {{t:pot|pot}} avec une {{t:range|range}} composée de mains très fortes et de {{t:bluff|bluffs}}"
  then: "à l'équilibre, environ {{n:bluff.share.bet-pot}} de vos mises sont des {{t:bluff|bluffs}} ; en général, la part de {{t:bluff|bluffs}} = mise ÷ ({{t:pot|pot}} + 2·mise)"
  because: "alors la main de l'adversaire qui ne bat que les {{t:bluff|bluffs}} a exactement l'équité requise ({{n:eq.bet-pot}}) : elle ne gagne rien ni en {{t:call|suivant}} ni en se {{t:fold|couchant}}, donc on ne peut pas vous exploiter"
  level: math
  source: "calcul : condition d'indifférence d'une main qui attrape les bluffs (modèle simplifié : range polarisée contre bluff-catcher) ; site de solveur commercial, How to Solve Toy Games"
  sources: [{ kind: solver-pub }, { kind: math }]
- id: R-M8-005
  module: m8
  if: "à la river, vous changez de taille de mise avec une {{t:range|range}} {{t:polarized|polarisée}}"
  then: "avec une mise plus grosse, vous y mettez plus de {{t:bluff|bluffs}}, avec une plus petite, moins : à 1/3 du {{t:pot|pot}} environ {{n:bluff.share.bet-third}}, à la totalité du {{t:pot|pot}} environ {{n:bluff.share.bet-pot}}"
  because: "une mise plus grosse donne à l'adversaire un moins bon prix, donc son {{t:call|call}} a besoin de plus de {{t:bluff|bluffs}} dans votre {{t:range|range}} pour être rentable"
  level: math
  source: "calcul : part de bluffs = mise/(pot+2·mise)"
  sources: [{ kind: math }]
- id: R-M8-006
  module: m8
  if: "vous choisissez avec quelles mains {{t:bluff|bluffer}} à la river"
  then: "vous {{t:bluff|bluffez}} avec les mains les plus faibles, qui ne gagneront pas à l'abattage (p. ex. des {{t:draw|tirages}} à la {{t:straight|quinte}} ratés ou des hautes cartes sans chance) ; les mains qui ont de la valeur à l'abattage {{t:check|checkent}}"
  because: "un {{t:bluff|bluff}} avec une main qui gagne souvent après un {{t:check|check}} sacrifie ce gain ; une main sans chance ne perd rien quand le {{t:bluff|bluff}} échoue"
  level: heuristic
  source: "site de solveur commercial, We're At The River. Our Hand Can't Win. Now What? ; site de formation, Polarized vs Linear Ranges"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-007
  module: m8
  if: "vous choisissez un {{t:bluff|bluff}} parmi les mains sans valeur à l'abattage"
  then: "vous choisissez une main avec une carte qui bloque les mains fortes de l'adversaire, celles avec lesquelles il paiera (p. ex. l'as de la couleur quand il y a trois cartes d'une même couleur sur le {{t:board|board}})"
  because: "quand vous tenez une carte de ses mains les plus fortes, l'adversaire en a moins de {{t:combo|combinaisons}}, donc il lui reste plus souvent une main à jeter"
  level: heuristic
  source: "programme M8 ; site de solveur commercial, Blockers & Unblockers: The Secret to Picking Great Bluffs ; site de formation, What is Unblocking in Poker"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-008
  module: m8
  if: "le {{t:flush-draw|tirage couleur}} n'est pas rentré, et vous choisissez un {{t:bluff|bluff}}"
  then: "quand vous avez le choix entre plusieurs {{t:bluff|bluffs}}, vous préférez un {{t:bluff|bluff}} sans carte de cette couleur"
  because: "l'adversaire se {{t:fold|couchera}} avec ses {{t:draw|tirages}} ratés ; une carte de leur couleur dans votre main réduit le nombre de ses mains à jeter"
  level: heuristic
  source: "site de formation, What is Unblocking in Poker ; site de solveur commercial, Blockers & Unblockers: The Secret to Picking Great Bluffs"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-009
  module: m8
  if: "vous tenez une carte d'un rang donné"
  then: "l'adversaire a moins de {{t:combo|combinaisons}} avec ce rang : AK en a {{n:combos.unpaired.one-blocked}} au lieu de {{n:combos.unpaired}}, et une {{t:pair|paire}} d'as seulement {{n:combos.pair.one-blocked}} au lieu de {{n:combos.pair}}"
  because: "une carte dans votre main ne peut pas être dans celle de l'adversaire : sur les quatre cartes de ce rang, il lui en reste {{n:pair.outs.per-rank}}"
  level: math
  source: "combinatoire"
  sources: [{ kind: math }]
- id: R-M8-010
  module: m8
  if: "à la river, vous avez une main qui ne bat que les {{t:bluff|bluffs}} de l'adversaire (bluff-catcher)"
  then: "vous {{t:call|suivez}} quand les {{t:bluff|bluffs}} représentent plus que l'équité requise, p. ex. plus de {{n:eq.bet-pot}} des mises de la taille du {{t:pot|pot}} ; quand il y a moins de {{t:bluff|bluffs}}, vous vous {{t:fold|couchez}}"
  because: "votre équité est la part de {{t:bluff|bluffs}} dans ses mises (vous battez chaque {{t:bluff|bluff}}, vous perdez contre chaque main {{t:value|de valeur}}) ; quand l'adversaire {{t:bluff|bluffe}} dans la proportion mise ÷ ({{t:pot|pot}} + 2·mise), le {{t:call|call}} rapporte zéro"
  level: math
  source: "calcul : équité requise = mise/(pot+2·mise)"
  sources: [{ kind: math }]
- id: R-M8-011
  module: m8
  if: "vous choisissez avec quels bluff-catchers {{t:call|suivre}} une mise à la river"
  then: "vous préférez les mains avec des cartes qui bloquent les mains fortes de l'adversaire, et sans cartes qui bloquent ses {{t:bluff|bluffs}} (p. ex. sans cartes de la couleur du {{t:draw|tirage}} raté)"
  because: "quand vous bloquez sa valeur, il reste plus de {{t:bluff|bluffs}} dans sa {{t:range|range}} de mises ; quand vous bloquez ses {{t:bluff|bluffs}}, il reste plus de valeur"
  level: heuristic
  source: "site de solveur commercial, Understanding Blockers ; site de formation ; site de formation, Bluff Catching Strategy"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M8-012
  module: m8
  if: "vous recevez une mise à la river et défendez avec une {{t:range|range}}"
  then: "vous {{t:call|suivez}} avec les meilleurs bluff-catchers : parmi des mains de force semblable, vous choisissez celles qui ont de meilleurs {{t:blocker|bloqueurs}} ; vous vous {{t:fold|couchez}} avec les mains qui perdent même contre les {{t:bluff|bluffs}}"
  because: "une main qui perd contre toutes les mises de l'adversaire ne gagne rien à {{t:call|suivre}}, même quand l'adversaire {{t:bluff|bluffe}} beaucoup"
  level: heuristic
  source: "conclusion tirée de la MDF (R-M6-001) et de R-M8-010 ; site de solveur commercial, Principles of River Play ; site de formation, Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]

# M9: plan rozdania. Matematyka z liczb (numbers.yaml); progi stref SPR i liczba ulic wartości jako heurystyki
# (uproszczenia nazwane w lekcjach). Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D18–D22).
- id: R-M9-001
  module: m9
  if: "vous calculez le {{t:spr|SPR}} au flop"
  then: "vous divisez le {{t:effective-stack|stack effectif}} (le plus petit des deux, sans ce qui est déjà dans le {{t:pot|pot}}) par le {{t:pot|pot}} ; après une {{t:open|ouverture}} et un {{t:call|call}}, c'est environ {{n:spr.srp}}, après un 3-bet {{t:in-position|en position}} environ {{n:spr.3bet-ip}}, après un 4-bet environ {{n:spr.4bet}}"
  because: "chaque {{t:raise|relance}} avant le flop multiplie le {{t:pot|pot}} plusieurs fois, alors que le stack derrière diminue beaucoup plus lentement"
  level: math
  source: "calcul : SPR = stack effectif ÷ pot au flop (stacks et pots tirés des chiffres de M4)"
  sources: [{ kind: math }]
- id: R-M9-002
  module: m9
  if: "l'adversaire part all-in au flop pour tout son stack"
  then: "pour {{t:call|suivre}}, il vous faut stack ÷ ({{t:pot|pot}} + 2·stack) d'équité : avec un {{t:spr|SPR}} de {{n:spr.commit}}, c'est {{n:eq.jam.spr2}}, avec un {{t:spr|SPR}} de {{n:spr.srp}}, déjà {{n:eq.jam.srp}}"
  because: "vous payez tout le stack pour gagner le {{t:pot|pot}} et le stack de l'adversaire ; plus le {{t:spr|SPR}} est bas, meilleur est le prix que vous obtenez"
  level: math
  source: "calcul : équité requise = montant à payer/(pot + 2·montant à payer)"
  sources: [{ kind: math }]
- id: R-M9-003
  module: m9
  if: "le {{t:spr|SPR}} au flop est inférieur à environ {{n:spr.zone.low}} (p. ex. {{n:spr.commit}}), et vous avez une {{t:top-pair|top paire}} ou mieux"
  then: "vous jouez pour tout le stack : vous misez ou {{t:call|suivez}} avec l'intention de tout engager, et en général vous ne vous {{t:fold|couchez}} pas face à un all-in"
  because: "avec un {{t:spr|SPR}} de {{n:spr.commit}}, face à un all-in, il vous faut au plus environ {{n:eq.jam.spr2}} d'équité, et deux {{t:bet|mises}} d'environ {{n:geo.spr2.2}} du {{t:pot|pot}} engagent tout le stack ; une {{t:top-pair|top paire}} supporte généralement deux {{t:value|streets de valeur}}"
  level: heuristic
  source: "site de solveur commercial, Stack-to-Pot Ratio ; coach avec un site de formation, SPR Strategy ; calcul dans la leçon m9.l2"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-004
  module: m9
  if: "après votre {{t:bet|mise}}, il vous resterait dans votre stack moins que ce que contiendra le {{t:pot|pot}} après son {{t:call|call}}"
  then: "vous ne prévoyez pas de {{t:bet|miser}} puis de vous {{t:fold|coucher}} face à un all-in : soit vous jouez pour tout le stack, soit vous {{t:check|checkez}}"
  because: "avec un {{t:spr|SPR}} de {{n:spr.commit}}, après une {{t:bet|mise}} de la taille du {{t:pot|pot}}, il ne vous faut face à l'all-in que {{n:eq.commit.after-pot}} d'équité, donc un {{t:fold|abandon}} n'est généralement pas rentable"
  level: math
  source: "calcul : montant à payer/(pot avant l'excédent + 2·montant à payer)"
  sources: [{ kind: math }]
- id: R-M9-005
  module: m9
  if: "vous jouez un {{t:pot|pot}} à une seule relance avec des stacks pleins ({{t:spr|SPR}} d'environ {{n:spr.srp}}) et vous n'avez qu'une {{t:pair|paire}}"
  then: "vous jouez pour la valeur, mais en général sans prévoir d'engager tout le stack"
  because: "pour engager tout le stack d'ici la river, il faut miser plus que le {{t:pot|pot}} à chaque {{t:street|street}}, et un adversaire qui met autant d'argent a rarement une main plus faible qu'une {{t:pair|paire}}"
  level: heuristic
  source: "calcul de la taille géométrique (m9.l3) ; site de solveur commercial, Stack-to-Pot Ratio ; site de formation, When to Check Top Pair"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-006
  module: m9
  if: "vous voulez engager tout le stack par des {{t:bet|mises}} égales d'ici la river"
  then: "vous misez à chaque {{t:street|street}} la même fraction f du {{t:pot|pot}}, telle que (1 + 2f) à la puissance du nombre de {{t:street|streets}} = 1 + 2·{{t:spr|SPR}} ; dans un {{t:pot|pot}} 3-betté {{t:in-position|en position}}, cela fait environ {{n:geo.3bet-ip.3}} du {{t:pot|pot}}"
  because: "une {{t:bet|mise}} f et un {{t:call|call}} multiplient le {{t:pot|pot}} par (1 + 2f), et l'all-in survient quand le {{t:pot|pot}} atteint {{t:pot|pot}} + 2·stack"
  level: math
  source: "calcul : taille géométrique ; site de formation, Geometric Bet Sizing ; site de solveur commercial, Pot Geometry"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-007
  module: m9
  if: "dans un {{t:pot|pot}} à une seule relance avec des stacks de {{n:format.stack}}, vous misez sur trois {{t:street|streets}}"
  then: "vous vous rappelez que trois {{t:bet|mises}} de la moitié du {{t:pot|pot}} n'engagent que {{n:srp.half.total}}, et trois {{t:bet|mises}} de la taille du {{t:pot|pot}} {{n:srp.potbet.total}}, sur un stack de {{n:spr.srp.stack}}"
  because: "le {{t:pot|pot}} au flop est petit par rapport au stack ; tout le stack n'entre qu'avec des {{t:bet|mises}} d'environ {{n:geo.srp.3}} du {{t:pot|pot}} à chaque {{t:street|street}}"
  level: math
  source: "calcul : une mise et un call multiplient le pot par (1 + 2f)"
  sources: [{ kind: math }]
- id: R-M9-008
  module: m9
  if: "avant de {{t:bet|miser}} au flop, vous planifiez le coup"
  then: "vous évaluez combien de {{t:value|streets de valeur}} la main supporte (le nombre de {{t:street|streets}} est une simplification) : très forte (set, {{t:straight|quinte}}, {{t:two-pair|double paire}} haute) trois, {{t:top-pair|top paire}} avec un bon kicker ou {{t:overpair|overpaire}} généralement deux, une troisième quand l'adversaire paie avec des mains plus faibles ; une {{t:pair|paire}} plus faible une ou aucune"
  because: "à chaque {{t:street|street}}, les mains plus faibles de l'adversaire se {{t:fold|couchent}}, et il reste dans le {{t:pot|pot}} surtout des mains meilleures que la vôtre"
  level: heuristic
  source: "synthèse : site de formation, When to Check Top Pair (https://upswingpoker.com/when-to-check-top-pair/) : « In single raised pots, the stack-to-pot ratio (SPR) is too high to comfortably get 3 streets of value with many top pair hands. » ; site de solveur commercial, Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/) : « All top pairs and all nut flush draws are now indifferent between calling and folding » (SPR 16) ; site de solveur commercial, Pot Geometry (https://blog.gtowizard.com/pot-geometry/) : « Game theory optimal strategies typically use geometric bet sizes when they want to maximize value with a big nut advantage. » ; nombre de streets par main, y compris la paire plus faible : simplification de l'application (D-149)"
  sources: [{ kind: training, url: "https://upswingpoker.com/when-to-check-top-pair/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }]
- id: R-M9-009
  module: m9
  if: "vous avez une main pour trois {{t:value|streets de valeur}}, la zone de {{t:spr|SPR}} permet de la jouer pour tout le stack (R-M9-010), et vous voulez engager tout le stack"
  then: "dès le flop, vous misez une taille géométrique, et non une petite"
  because: "dans un {{t:pot|pot}} 3-betté, trois {{t:bet|mises}} de 1/3 du {{t:pot|pot}} n'engagent qu'environ {{n:g3b.third.total}} d'un stack de {{n:spr.3bet-ip.stack}}, donc la majeure partie du stack reste derrière ; avec environ {{n:geo.3bet-ip.3}} du {{t:pot|pot}} à chaque {{t:street|street}}, tout entre"
  level: math
  source: "calcul : enchaînement de mises et de calls (numbers.yaml, clés g3b.third.* et geo.3bet-ip.*)"
  sources: [{ kind: math }]
- id: R-M9-010
  module: m9
  if: "vous décidez si vous jouez pour tout le stack avec une main donnée"
  then: "vous regardez la zone de {{t:spr|SPR}} (simplification) : en dessous d'environ {{n:spr.zone.low}}, une {{t:top-pair|top paire}} suffit généralement, de {{n:spr.zone.low}} à {{n:spr.zone.mid}}, la {{t:top-pair|top paire}} est une main limite, de {{n:spr.zone.mid}} à {{n:spr.zone.deep}}, il vous faut généralement une {{t:two-pair|double paire}} haute ou mieux, et au-delà de {{n:spr.zone.deep}}, un set, une {{t:straight|quinte}} ou une main meilleure"
  because: "plus le {{t:spr|SPR}} est élevé, plus il faut de {{t:bet|mises}} pour engager tout le stack, et jusqu'au bout l'adversaire paie surtout avec des mains fortes ; avec un {{t:spr|SPR}} de {{n:spr.zone.deep}}, tout le stack n'entre qu'après trois {{t:bet|mises}} de la taille du {{t:pot|pot}}"
  level: heuristic
  source: "coach avec un site de formation, SPR Strategy (https://www.splitsuit.com/spr-poker-strategy) : « less than 3 is an auto-stack off with top pair or better, between 3-6 is situational and based upon villain/board texture, and more than 6 SPR isn't a default stack-off » ; site de solveur commercial, Stack-to-Pot Ratio (https://blog.gtowizard.com/stack-to-pot-ratio/) : « at this higher SPR, stacking off with top pair starts to get a bit dicey » ; zone 6–13 : partie commune de deux sites de formation : SPR (https://www.thepokerbank.com/strategy/concepts/spr/) : « Medium SPR = 7 - 16 », « Good hands for medium SPRs. », « Top two pair. Sets. » ; Poker SPR (https://pokercoaching.com/blog/poker-spr/) : « High SPR (8+): Deep stacks favor hands that make nutted combinations (sets, straights, flushes) over one-pair holdings. » ; seuil 13 : calcul (1+2·1)^3 = 1+2·13 et Flynn, Mehta, Miller, Professional No-Limit Hold'em via un site d'information (https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm) : « if you're heads-up and the stack-to-pot ratio is 13 going to the flop, you and your opponent can each make exactly three pot-sized bets » ; limites des zones : simplification de l'application (D-149)"
  sources: [{ kind: training, url: "https://www.splitsuit.com/spr-poker-strategy" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }, { kind: training, url: "https://www.thepokerbank.com/strategy/concepts/spr/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-spr/" }, { kind: math }, { kind: book, url: "https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm" }]

# M10: eksploatacja mikrostawek. Każde dostosowanie to odejście od bazy z M3–M9 (ADR-03). Definicje statystyk: rules;
# błąd próby, próg blefu i wpływ rake'u na cenę: math; progi typów graczy i próby z serwisów szkoleniowych: heuristic;
# wynik solvera: gto; dostosowanie do typu gracza: exploit z populacją (dane z analizy bazy rąk populacji albo odczyt HUD rywala z próbą).
# Decyzje D-M10-01…14 w raporcie M10 (do dokumentu 12 „Weryfikacja źródeł — M10–M13”).
- id: R-M10-001
  module: m10
  if: "vous lisez le {{t:vpip|VPIP}} et le {{t:pfr|PFR}} de l'adversaire"
  then: "le {{t:vpip|VPIP}} est le pourcentage de mains dans lesquelles il met volontairement des {{t:chips|jetons}} avant le flop (il {{t:call|suit}} ou {{t:raise|relance}} ; les blindes ne comptent pas), et le {{t:pfr|PFR}} le pourcentage de mains dans lesquelles il {{t:raise|relance}} avant le flop ({{t:open|ouverture}}, 3-bet, 4-bet) ; le {{t:pfr|PFR}} ne dépasse jamais le {{t:vpip|VPIP}}"
  because: "chaque {{t:raise|relance}} est aussi une mise volontaire de {{t:chips|jetons}}, donc l'écart {{t:vpip|VPIP}} − {{t:pfr|PFR}} correspond aux mains que l'adversaire a seulement {{t:call|suivies}} ou limpées"
  level: rules
  source: "glossaire d'un site de solveur commercial (https://gtowizard.com/en/glossary/) : « VPIP: … a statistic that measures the frequency with which a player voluntarily puts money into the pot preflop. » ; site de formation, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/) : « Anytime a player makes a call or a raise before the flop, their VPIP goes up », « a player’s PFR stat goes up anytime they make a raise before the flop, which includes all 3-bets and 4-bets as well as open raises »"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }]
- id: R-M10-002
  module: m10
  if: "la statistique de l'adversaire repose sur n occasions"
  then: "son erreur type est √(p × (1 − p) ÷ n) : pour un {{t:vpip|VPIP}} de {{n:hud.se.ex.p}} après {{n:hud.se.ex.n}} mains, environ {{n:hud.se.ex}}, donc le vrai {{t:vpip|VPIP}} se situe, avec environ {{n:var.conf95}} de certitude, entre {{n:hud.ci.ex.low}} et {{n:hud.ci.ex.high}}"
  because: "chaque main est un échantillon aléatoire de sa stratégie, et l'erreur d'une telle moyenne ne diminue qu'avec la racine carrée du nombre d'occasions, comme l'erreur sur le winrate au module 12"
  level: math
  source: "calcul : erreur type d'une proportion dans la loi binomiale, √(p(1 − p) ÷ n), et intervalle de ±1,96 erreur type (numbers.yaml, clés hud.se.*, hud.ci.*)"
  sources: [{ kind: math }]
- id: R-M10-003
  module: m10
  if: "vous jugez un adversaire d'après les statistiques du {{t:hud|HUD}}"
  then: "en dessous d'environ {{n:hud.hands.random}} mains, vous les considérez comme aléatoires et jouez contre lui comme contre un inconnu ; le type de joueur apparaît grossièrement après environ {{n:hud.hands.random}}–{{n:hud.hands.rough.high}} mains, le {{t:vpip|VPIP}} et le {{t:pfr|PFR}} se stabilisent après environ {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}}, le 3-bet après environ {{n:hud.hands.3bet.overall.low}}–{{n:hud.hands.3bet.high}}, et le fold to 3-bet après environ {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}}"
  because: "le {{t:vpip|VPIP}} gagne une occasion à chaque main, alors que le fold to 3-bet n'en gagne une que lorsque l'adversaire a {{t:open|ouvert}} et reçu un 3-bet, donc sur le même nombre de mains, il a beaucoup moins d'occasions et une erreur plus grande"
  level: heuristic
  source: "site de formation, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/) : « For VPIP and PFR, you need at least 100 to 200 hands before the numbers begin to stabilize. », « For 3-bet and fold to 3-bet, closer to 500 hands is the threshold. » ; site de formation, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide) : « Below 30 hands, treat the HUD numbers as random and use hand-observation reads only. », « VPIP / PFR 30-50 hands », « 3-bet % (overall) 100+ hands », « Fold to 3-bet | 200+ hands » ; pour le VPIP et le PFR, deux seuils : type grossier après 30–50 mains et stabilisation après 100–200 (contradiction au même niveau, docs/tresci/e1-m9-m11.md §3.1) ; pour le 3-bet et le fold to 3-bet, des bornes inférieures distinctes tirées du même tableau (100+ et 200+), une borne supérieure commune (D-M10-04 ; E3 2026-11-04)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-004
  module: m10
  if: "le {{t:vpip|VPIP}} de l'adversaire dépasse son {{t:pfr|PFR}} de plus de {{n:hud.gap.passive}} points de pourcentage"
  then: "c'est un joueur passif : il {{t:call|suit}} et limpe beaucoup, et {{t:raise|relance}} peu"
  because: "la plupart des mains qu'il joue entrent dans le {{t:pot|pot}} par un {{t:call|call}} ; chez les {{t:regular|réguliers}}, l'écart est faible, car ils commencent presque chaque main par une {{t:raise|relance}}"
  level: heuristic
  source: "site de formation, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/) : « When a player’s PFR is more than 10 points below their VPIP, I immediately flag them as a passive player who calls too much and raises too little. » ; site de formation, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide) : « Gap > 10 → Passive player. Lots of cold-calls and limps. » ; données de contrôle issues de l'analyse d'une base de mains de la population, grand site en ligne NL25 6-max : joueurs récréatifs 42/18, réguliers 23/18 (mda.rec.*, mda.reg.*)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-005
  module: m10
  if: "vous attribuez un type à l'adversaire d'après le {{t:vpip|VPIP}} et le {{t:pfr|PFR}} (6-max, au moins environ {{n:hud.hands.vpip.low}} mains)"
  then: "un {{t:nit|nit}} joue jusqu'à environ {{n:hud.vpip.nit-max}} des mains ; un {{t:regular|régulier}} environ {{n:hud.vpip.reg.low}}–{{n:hud.vpip.reg.high}}, avec un faible écart {{t:vpip|VPIP}} − {{t:pfr|PFR}} ; un joueur loose à partir d'environ {{n:hud.vpip.loose}} : avec un écart de plus de {{n:hud.gap.passive}} points, c'est un {{t:recreational|joueur récréatif}} passif ({{t:calling-station|calling station}}), avec un écart d'au plus environ {{n:hud.gap.aggressive}} points, c'est un {{t:maniac|maniaque}}"
  because: "le type indique dans quel sens l'adversaire s'écarte de la base : il joue trop peu de mains, trop de mains, {{t:call|suit}} trop souvent ou {{t:raise|relance}} trop souvent"
  level: heuristic
  source: "site de formation, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/), tableau 6-max cash : « 22 to 28 », « 35+ », « 14 or below » ; « a player playing a 45 VPIP is either a maniac or a calling station » ; « When the gap is less than 3 points, I flag them as highly aggressive » ; site de formation, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide) : « 10-15% | Very tight (nit) », « 18-22% | Tight-aggressive (TAG) », « 25-30% | Loose-aggressive (LAG) », « 35%+ | Loose (likely recreational) », profils « Nit (15/12/3%) », « Whale / Recreational (45/8/2%) », « Maniac (38/35/15%+) » ; analyse d'une base de mains de la population : Regulars « VPIP = 18-32 », Recreationals « VPIP > 40 » ; seuils retenus comme partie commune ou comme intervalle couvrant les sources (D-M10-03)"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-006
  module: m10
  if: "vous jouez contre un {{t:recreational|joueur récréatif}} passif ({{t:vpip|VPIP}} à partir d'environ {{n:hud.vpip.loose}}, écart {{t:vpip|VPIP}} − {{t:pfr|PFR}} de plus de {{n:hud.gap.passive}} points)"
  then: "vous misez {{t:value|pour la valeur}} avec plus de mains, y compris plus fines, et vous {{t:bluff|bluffez}} moins souvent que dans la base du module 8, surtout à la river"
  because: "un tel joueur va plus souvent à l'abattage et y perd plus souvent, c'est-à-dire qu'il {{t:call|suit}} avec des mains plus faibles : une plus grande part de ses {{t:call|calls}} sont des mains plus faibles que la vôtre (seuil de value bet du module 8), et un {{t:bluff|bluff}} ne rapporte que si l'adversaire se {{t:fold|couche}} plus souvent que l'{{t:alpha|alpha}}"
  level: exploit
  population: "joueurs récréatifs sur un grand site en ligne, NL25–NL100 6-max (selon la définition de la base : VPIP > 40, résultat < −20bb/100) : WTSD 32% contre 28% chez les réguliers, abattages gagnés 46% contre 57%, résultat −47bb/100 ; toutes les mains des 12 mois précédant le 5 octobre 2026 (analyse d'une base de mains de la population, nombre de mains non indiqué)"
  source: "site d'analyse d'une base de mains de la population (https://bluffaces.com/calculators/mda/), filtres : grand site en ligne NL25/NL50/NL100 6-max, Recreationals et Regulars (mda.rec.*, mda.reg.*), nombre de mains non indiqué ; site de formation, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/) : un WTSD élevé « instantly tells you to bluff them less and value bet them more across all betting streets, especially on the river. » ; site de formation, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide) : « >30% → Calling station. Value bet thinly, never bluff river. » (nous n'enseignons pas ce seuil de WTSD : le site de formation indique « In most cases, your WTSD% should be around 30 », et dans les données de l'analyse de la base de mains, les réguliers ont 28% et les joueurs récréatifs 32% ; D-M10-07) ; seuil de value bet R-M8-001 et alpha du module 6 inchangés (D-M10-06)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-007
  module: m10
  if: "un {{t:nit|nit}} ({{t:vpip|VPIP}} jusqu'à environ {{n:hud.vpip.nit-max}} après au moins environ {{n:hud.hands.vpip.low}} mains) {{t:raise|relance}} ou 3-bette"
  then: "vous vous {{t:fold|couchez}} plus souvent que dans la base du module 4 avec les mains du bas de votre {{t:range|range}} de {{t:call|call}}, et vous volez ses blindes plus souvent"
  because: "quelqu'un qui joue si peu de mains {{t:raise|relance}} surtout avec les plus fortes, donc vos mains moyennes sont plus souvent dominées ; et comme il défend lui-même ses blindes de façon serrée, votre {{t:open|ouverture}} gagne plus souvent immédiatement"
  level: exploit
  population: "un adversaire isolé : lecture HUD sur au moins environ 100 mains (VPIP jusqu'à 14%) ; seuils de type tirés de deux sites de formation (cash 6-max en ligne) ; sans données sur l'ensemble de la population, car les nits sont minoritaires à la table (D-M10-02)"
  source: "site de formation, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/) : « anyone significantly below is a nit whose raises you can nearly always fold to » ; site de formation, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide) : nit « Plays only premium hands. Steal their blinds relentlessly, fold to their 3-bets without thought, bluff-catch sparingly. » ; « 10-15% | Very tight (nit) | Folds preflop too much; bluff their open ranges, fold to their 3-bets »"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-008
  module: m10
  if: "vous jouez contre un {{t:maniac|maniaque}} ({{t:vpip|VPIP}} à partir d'environ {{n:hud.vpip.loose}}, {{t:pfr|PFR}} presque égal au {{t:vpip|VPIP}})"
  then: "vous ne le {{t:bluff|bluffez}} pas, vous {{t:call|suivez}} plus large avec les mains qui attrapent les {{t:bluff|bluffs}}, et avec les mains très fortes, vous le laissez miser"
  because: "ses mises et ses {{t:raise|relances}} contiennent plus de {{t:bluff|bluffs}} que dans la base, donc les mains qui, dans la base, sont à la limite du {{t:call|call}} deviennent rentables, et un {{t:bluff|bluff}} contre quelqu'un qui se {{t:fold|couche}} rarement perd de l'argent"
  level: exploit
  population: "un adversaire isolé : lecture HUD sur au moins environ 100 mains (VPIP à partir de 35%, VPIP − PFR inférieur à 3 points) ; seuils de type tirés de deux sites de formation (cash 6-max en ligne) ; sans données sur l'ensemble de la population (D-M10-02)"
  source: "site de formation, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide) : maniaque « Trap with premium hands by flat-calling preflop and letting them stack off. Don't try to out-bluff them; just let them hang themselves. » ; site de formation, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/) : « a player playing a 45 VPIP is either a maniac or a calling station » ; principe des mains mixtes : site de solveur commercial, Calling Down Over-Bluffed Lines in Lower Limits (R-M10-009)"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: solver-pub }]
- id: R-M10-009
  module: m10
  if: "vous savez que, dans une ligne donnée, l'adversaire {{t:bluff|bluffe}} plus ou moins souvent qu'à l'équilibre"
  then: "vous modifiez d'abord votre décision avec les mains qui, dans la base, mélangent {{t:call|call}} et {{t:fold|abandon}} : en cas d'excès de {{t:bluff|bluffs}}, vous {{t:call|suivez}} toujours avec elles, en cas de manque, vous vous {{t:fold|couchez}} toujours"
  because: "à l'équilibre, ces mains sont indifférentes, car l'adversaire a exactement autant de {{t:bluff|bluffs}} qu'il le faut ; un léger excès ou manque suffit à les faire basculer d'un côté, alors que le reste de la {{t:range|range}} ne change qu'avec un grand écart"
  level: gto
  source: "site de solveur commercial, Calling Down Over-Bluffed Lines in Lower Limits (https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/), analyse avec nodelock : « Hands that mix calls and folds in theory do so because Villain’s bet size is strategically balanced, making them indifferent to calling and folding since no option is the best. » ; « If they are bluffing just a single combo more than they should, all of our indifferent bluff catchers become profitable calls and vice versa (we always fold when they are under-bluffing even slightly). » ; « I only changed Villain’s strategy to bluff ~31% instead of ~27% of the time for our strategy to shift completely to never folding. »"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/" }]
- id: R-M10-010
  module: m10
  if: "l'adversaire se {{t:fold|couche}} face au c-bet plus souvent que l'{{t:alpha|alpha}} de votre taille de mise"
  then: "un c-bet sans aucune main rapporte immédiatement : avec un c-bet de 1/3 du {{t:pot|pot}}, plus de {{n:alpha.cbet.small}} d'{{t:fold|abandons}} suffit, avec un c-bet de 3/4 du {{t:pot|pot}}, plus de {{n:alpha.cbet.big}}"
  because: "un {{t:bluff|bluff}} risque la mise pour gagner le {{t:pot|pot}} ; il rapporte quand la proportion d'{{t:fold|abandons}} dépasse mise ÷ ({{t:pot|pot}} + mise) ; le fold to c-bet du {{t:hud|HUD}} regroupe toutes les tailles et tous les boards, donc ce n'est qu'une approximation"
  level: math
  source: "calcul : EV d'un bluff pur = abandon × pot − (1 − abandon) × mise > 0 ⇔ abandon > mise ÷ (pot + mise) (alpha, module 6 ; numbers.yaml alpha.cbet.*) ; glossaire d'un site de solveur commercial (https://gtowizard.com/en/glossary/) : « Alpha (α): The minimum frequency your opponent needs to fold to a bet, in order to break even with a pure (0% equity) bluff. »"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M10-011
  module: m10
  if: "l'adversaire se {{t:fold|couche}} rarement face au 3-bet (fold to 3-bet inférieur à environ {{n:hud.f3b.low}}), p. ex. un {{t:recreational|joueur récréatif}} typique"
  then: "vous le 3-bettez avec une {{t:range|range}} {{t:linear|linéaire}} : davantage de mains fortes {{t:value|pour la valeur}}, presque sans {{t:bluff|bluffs}}"
  because: "un 3-bet {{t:in-position|en position}} à {{n:pf.3bet.ip-total}} ne rapporte sans aucune main qu'au-delà de {{n:alpha.vs-3bet-ip-size}} d'{{t:fold|abandons}} ; quand l'adversaire se {{t:fold|couche}} rarement, les {{t:bluff|bluffs}} jouent un gros {{t:pot|pot}} avec des mains faibles, et les mains fortes obtiennent plus de {{t:call|calls}}"
  level: exploit
  population: "grand site en ligne, NL25–NL100 6-max (analyse d'une base de mains de la population, 12 mois précédant le 5 octobre 2026, nombre de mains non indiqué) : fold to 3-bet des joueurs récréatifs 31% (NL50 30%, NL100 32%), des réguliers 55% (NL50 57%, NL100 55%)"
  source: "site d'analyse d'une base de mains de la population (https://bluffaces.com/calculators/mda/), Fold to 3bet (mda.rec.f3b, mda.reg.f3b), nombre de mains non indiqué ; site de formation, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/) : « if a player has a low Fold to 3-Bet, you will want to adjust your 3-betting range against them and play a more linear range made up of almost solely value hands and very few bluffs. » ; site de formation, Essential HUD Stats Guide (https://deepfold.co/en/blog/hud-stats-guide) : « <50% → They call 3-bets wide. Drop bluff 3-bets; value-bet thinner and exploit postflop. » ; seuil alpha du module 4 (alpha.vs-3bet-ip-size)"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-012
  module: m10
  if: "vous n'avez sur l'adversaire qu'un petit échantillon ou seulement une connaissance générale de la population"
  then: "vous vous écartez de la base uniquement dans la direction que montrent les statistiques, et uniquement avec les mains limites ; un écart important, avec toute votre {{t:range|range}}, seulement avec un grand échantillon et une erreur nette de l'adversaire"
  because: "avec un petit échantillon, l'erreur de la statistique est grande, et s'écarter de la base (la stratégie la moins exploitable) est en soi exploitable"
  level: heuristic
  source: "site de formation, How to Use Poker HUD Stats (https://pokercoaching.com/blog/poker-stats/) : « The directional signal (very high VPIP, very low PFR) may still be useful even with small samples, but specific exploitation based on percentage points requires a much larger hand history. » ; glossaire d'un site de solveur commercial (https://gtowizard.com/en/glossary/) : « Exploit: To deviate from a baseline strategy in order to take advantage of a (future or prior) mistake in your opponent's strategy. », « Game Theory Optimal (GTO) The least exploitable fixed strategy » ; erreur d'échantillon : R-M10-002"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://gtowizard.com/en/glossary/" }]
- id: R-M10-013
  module: m10
  if: "vous jouez en cash 6-max aux micro-limites (NL2–NL25)"
  then: "vous calculez votre résultat après {{t:rake|rake}} : les grands sites en ligne prélèvent environ {{n:rake.micro.low}}–{{n:rake.micro.high}}, soit plusieurs fois plus que le winrate d'un joueur gagnant typique ({{n:var.wr.typical.low}}–{{n:var.wr.typical.high}})"
  because: "tous les joueurs paient le {{t:rake|rake}} sur chaque {{t:pot|pot}} qui atteint le flop ; pour gagner, vous devez battre vos adversaires de plus que le montant du {{t:rake|rake}}"
  level: heuristic
  source: "site de calculateurs de poker, Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/), NLH 6-max, deux grands sites en ligne NL2–NL25 (rake.micro.*) ; données de contrôle sur la population : Tombos21, rake par joueur NL10 9,1bb/100, NL100 7,3bb/100 (rake.pop.*) ; site d'information, How Many Winning Cash Games Players Are There? It Depends on Rake (https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players), Tombos21 : « Reminder that your biggest villain is the house. », « Pre-rake winners 90% post-rake winners 53% » ; coach avec un blog de formation (var.wr.typical.*, module 12)"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: population, url: "https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players" }, { kind: training }]
- id: R-M10-014
  module: m10
  if: "vous faites face à une {{t:open|ouverture}} dans une partie où le {{t:rake|rake}} n'est prélevé que sur les {{t:pot|pots}} qui atteignent le flop"
  then: "vous {{t:call|suivez}} moins souvent que dans une partie sans {{t:rake|rake}} ; une partie des mains qui {{t:call|suivraient}} sans {{t:rake|rake}} passent en 3-bet, et avec le reste vous vous {{t:fold|couchez}}"
  because: "le {{t:rake|rake}} prend une partie du {{t:pot|pot}} après le flop, alors qu'un {{t:pot|pot}} terminé avant le flop en est exempt : un {{t:call|call}} mène généralement au flop et paie le {{t:rake|rake}}, un 3-bet termine souvent le coup avant le flop, sans {{t:rake|rake}}, et un {{t:fold|abandon}} ne coûte rien (certains sites prélèvent aussi le {{t:rake|rake}} sur les {{t:pot|pots}} 3-bettés sans flop, donc là le 3-bet paie aussi)"
  level: gto
  source: "site de solveur commercial, Preflop Raise Sizing: Examining 2 Key Factors (https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/), solutions 200bb 6-max avec le rake NL100 : « Facing a LJ raise, the HJ, CO, and BTN all VPIP 25%-35% fewer hands in the raked game. », « Rake makes calling raises considerably less appealing, leading to much lower VPIPs and somewhat higher 3-betting frequencies in “no flop, no drop” games. », « BB calls a min-raise in the raked game barely 60% as often as in the unraked game » ; simplification : résultat pour 200bb, l'auteur : « many of the principles will generalize » ; structures de rake des sites : site de calculateurs de poker, API /network-rake-list, champ rule : second grand site en ligne « flop_drop », grand site en ligne « flop_or_3b_drop » (lecture du 5 octobre 2026)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/" }, { kind: training }]
- id: R-M10-015
  module: m10
  if: "vous calculez l'équité requise dans une partie avec {{t:rake|rake}}"
  then: "vous divisez le montant à payer par le {{t:pot|pot}} après le {{t:call|call}}, diminué du {{t:rake|rake}} : avec une mise de la moitié du {{t:pot|pot}} et un {{t:rake|rake}} de {{n:rake.ex.pct}}, il vous faut {{n:eq.bet-half.rake}} au lieu de {{n:eq.bet-half}}"
  because: "vous gagnez le {{t:pot|pot}} sans le {{t:rake|rake}}, mais vous payez le montant entier ; aux micro-limites, les {{t:pot|pots}} atteignent rarement le {{t:rake-cap|plafond de rake}}, donc c'est le pourcentage qui compte"
  level: math
  source: "calcul : montant à payer ÷ (pot après le call × (1 − rake)) (numbers.yaml eq.bet-half.rake) ; site de calculateurs de poker, Online Poker Rake Comparison 2026 (https://www.primedope.com/online-poker-rake-comparison-rake-calculator/) : « At microstakes, percentage drives the cost because pots rarely hit the cap. »"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: math }]

# M12: mental game i bankroll. Poziomy według ADR-24: rachunek = math, zalecenie oparte na rachunku lub literaturze = heuristic.
- id: R-M12-001
  module: m12
  if: "vous évaluez votre résultat ou votre winrate à partir d'un échantillon de mains"
  then: "vous calculez un intervalle : winrate ± {{n:var.z95}} × SD ÷ √(nombre de mains ÷ 100)"
  because: "avec un SD de {{n:var.sd}}, même après {{n:var.hands.k}} mille mains, l'intervalle à {{n:var.conf95}} est d'environ ± {{n:var.ci.wr}}, donc un résultat de {{n:var.wr.ex}} signifie seulement « entre environ {{n:var.wr.ci.low}} et {{n:var.wr.ci.high}} »"
  level: math
  source: "calcul : erreur type de la moyenne (loi normale) ; SD tiré d'un site de calculateurs de poker, Examples and Impacts of Variance in Cash Games et Poker Variance Calculator"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-002
  module: m12
  if: "vous subissez un {{t:downswing|downswing}} de {{n:dd.bi.small}} {{t:buy-in|buy-ins}}"
  then: "vous ne le considérez pas comme la preuve d'un mauvais jeu ; vous vérifiez plutôt les décisions prises dans les coups perdus"
  because: "sur {{n:var.hands.k}} mille mains, un tel {{t:downswing|downswing}} depuis le pic arrive à environ {{n:dd.p.small.100k}} des joueurs qui gagnent {{n:var.wr.ex}} (SD {{n:var.sd}})"
  level: heuristic
  source: "calcul : simulation de Monte-Carlo (numbers.yaml, clés dd.*) ; un site de calculateurs de poker, Examples and Impacts of Variance in Cash Games, donne pour ce scénario un chiffre plus bas (rapport M12)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-003
  module: m12
  if: "vous voulez savoir combien vous gagnez vraiment"
  then: "vous accumulez des centaines de milliers de mains : une précision de ± {{n:var.target}} avec {{n:var.conf95}} de certitude exige environ {{n:var.need.hands.k}} mille mains"
  because: "l'erreur d'estimation diminue avec la racine carrée du nombre de mains : nombre de blocs de 100 mains nécessaires = ({{n:var.z95}} × SD ÷ précision)²"
  level: math
  source: "calcul : (1,96 × 80 ÷ 2)² blocs ; cohérent avec l'ordre de grandeur du document 08 (environ 615 mille mains)"
  sources: [{ kind: math }]
- id: R-M12-004
  module: m12
  if: "vous évaluez votre jeu après un coup"
  then: "vous vous interrogez sur la décision (le prix, l'équité, les informations dont vous disposiez), et non sur le fait d'avoir gagné"
  because: "une bonne décision perd régulièrement : un all-in avec AA contre KK perd dans environ {{n:res.kk-wins}} des cas, et pourtant les gens jugent les décisions sur le résultat, même quand ils savent qu'ils ne devraient pas"
  level: heuristic
  source: "Baron et Hershey (1988), Outcome bias in decision evaluation, J Pers Soc Psychol 54(4) ; Annie Duke sur le « resulting » (Masters in Business, Ritholtz 2018) ; équité AA–KK : calcul exact (document 08)"
  sources: [{ kind: math }, { kind: book }, { kind: study }]
- id: R-M12-005
  module: m12
  if: "le résultat de quelques {{t:session|sessions}} vous pousse à changer de stratégie"
  then: "vous ne la changez qu'après avoir revu vos mains, et non sur la seule base du résultat"
  because: "même les {{n:skill.pct}} meilleurs joueurs ne devancent les {{n:skill.pct}} plus faibles dans environ {{n:skill.ahead}} des cas qu'après environ {{n:skill.hands}} mains, et des écarts de niveau plus petits demandent beaucoup plus de mains"
  level: heuristic
  source: "van Loon, van den Assem et van Dolder (2015), Beyond Chance? The Persistence of Performance in Online Poker, PLoS ONE 10(3)"
  sources: [{ kind: study }]
- id: R-M12-006
  module: m12
  if: "vous remarquez les premiers signes de tilt de votre profil (p. ex. la colère après un bad beat, l'envie de punir un adversaire)"
  then: "vous réagissez tout de suite : une respiration et une phrase préparée qui vous rappelle pourquoi c'est de la {{t:variance|variance}} ou une erreur dont tirer une leçon"
  because: "quand le tilt grandit, vous cessez de penser clairement, et il n'est alors plus possible de le contrôler"
  level: heuristic
  source: "Tendler, entretien sur un site d'information (2014) (« When tilt becomes too intense, it shuts down your ability to think », « you must begin correcting tilt when it's small ») ; Tendler et Carter, The Mental Game of Poker (2011), technique « injecting logic »"
  sources: [{ kind: book }]
- id: R-M12-007
  module: m12
  if: "après une série de pertes, vous ne parvenez plus à juger calmement vos décisions (p. ex. vous ne pensez qu'à vous refaire ou vous jouez des mains avec lesquelles vous vous {{t:fold|couchez}} d'habitude)"
  then: "vous mettez fin à la {{t:session|session}}"
  because: "continuer dans cet état, c'est jouer à votre pire niveau (C-game), et le but est d'arrêter plus tôt, avant de perdre la capacité de penser clairement"
  level: heuristic
  source: "Tendler et Carter, The Mental Game of Poker (2011), extrait « Inchworm » (extrait publié en ligne) : « quit sooner when it's no longer possible to recover a solid thought process »"
  sources: [{ kind: book }]
- id: R-M12-008
  module: m12
  if: "vous travaillez votre jeu"
  then: "vous commencez par corriger vos pires jeux (C-game), et non par peaufiner les meilleurs"
  because: "améliorer votre pire jeu apporte une progression régulière et libère de l'attention pour apprendre de nouvelles choses"
  level: heuristic
  source: "Tendler et Carter, The Mental Game of Poker (2011), extrait « Inchworm » (extrait publié en ligne) ; Tendler, The Inchworm Concept (jaredtendler.com)"
  sources: [{ kind: book }]
- id: R-M12-009
  module: m12
  if: "vous calculez le {{t:risk-of-ruin|risque de ruine}}, c'est-à-dire le risque de perdre toute votre bankroll"
  then: "vous utilisez la formule RoR = e^(−2 × winrate × bankroll ÷ SD²), avec la bankroll en bb ; c'est une approximation qui suppose un winrate et un SD constants"
  because: "à {{n:var.wr.typical.high}} et SD {{n:var.sd}}, une bankroll de {{n:br.bi.base}} {{t:buy-in|buy-ins}} donne environ {{n:ror.base}} de risque, et {{n:br.bi.move-down}} {{t:buy-in|buy-ins}} déjà environ {{n:ror.half}}"
  level: math
  source: "site de calculateurs de poker, Risk of Ruin Formula for Poker Players (« RoR = e^(-2 x WR x BR / SD^2) ») ; valeurs : calcul (numbers.yaml, clés ror.*)"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-011
  module: m12
  if: "votre bankroll tombe à la moitié du nombre de {{t:buy-in|buy-ins}} prévu (avec {{n:br.bi.base}}, à {{n:br.bi.move-down}})"
  then: "vous descendez d'une {{t:stakes|limite}} au plus tard à ce moment-là, et vous ne remontez qu'une fois que vous avez une bankroll complète en {{t:buy-in|buy-ins}} de la {{t:stakes|limite}} supérieure"
  because: "les {{t:downswing|downswings}} de {{n:dd.bi.small}} {{t:buy-in|buy-ins}} sur {{n:var.hands.k}} mille mains arrivent à presque tous les joueurs qui gagnent de {{n:dd.wr-low}} à {{n:var.wr.ex}} (simulation avec SD {{n:var.sd}}), certaines sources conseillent de descendre dès une telle perte, et à {{n:br.bi.move-down}} {{t:buy-in|buy-ins}}, le risque de perdre le reste passe d'environ {{n:ror.base}} à environ {{n:ror.half}} (avec un winrate de {{n:var.wr.typical.high}} et SD {{n:var.sd}})"
  level: heuristic
  source: "site de formation, Bankroll Management (« half the roll, which is the point to move down a stake ») ; site de formation, Poker Bankroll Management Strategy (à 3bb/100, descente à 30 buy-ins, soit à bankroll complète) ; site de calculateurs de poker, Risk of Ruin Formula for Poker Players (« Losing 10 should trigger a move down ») ; calcul du risque de ruine et simulation des downswings"
  sources: [{ kind: training }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M12-012
  module: m12
  if: "vous planifiez votre temps de poker"
  then: "au début, vous consacrez environ {{n:study.beginner}} de votre temps à l'étude ; quand vous gagnez à votre {{t:stakes|limite}}, environ {{n:study.winner}}, mais jamais moins de {{n:study.min}}"
  because: "au début, vous avez le plus de retard à rattraper, et quand vous gagnez déjà à votre {{t:stakes|limite}}, vous pouvez jouer davantage"
  level: heuristic
  source: "site de formation, What should your study-to-play ratio be (article de Dara O'Kearney) : « New players have so much catching up to do » ; « Once you are beating the games you are in you can start to reduce the study and increase the grinding »"
  sources: [{ kind: training }]

# M11: turnieje i short stacki (moduł opcjonalny). Zakresy push/fold z własnego solvera (pushfold.json, heads-up mały
# blind kontra duży blind, zwalidowany z równowagą Nasha, dokument 10); progi i pojęcia z przeczytanych źródeł (raport M11).
- id: R-M11-001
  module: m11
  if: "en {{t:tournament|tournoi}}, vous avez environ {{n:m11.thr.pushfold}} ou moins, et tous les joueurs avant vous se sont {{t:fold|couchés}}"
  then: "vous jouez all-in ou vous vous {{t:fold|couchez}} (push/fold) ; entre {{n:m11.thr.pushfold}} et {{n:m11.thr.upper}}, le push/fold est la méthode principale pour les mains faibles et moyennes, et au-delà d'environ {{n:m11.thr.raise}}, vous faites généralement une relance classique"
  because: "avec un {{t:short-stack|short stack}}, relancer puis se {{t:fold|coucher}} face à une {{t:raise|relance}} cède trop de {{t:chips|jetons}}, alors que l'all-in arrache le plus d'{{t:fold|abandons}} à l'adversaire ; c'est une simplification : les solveurs disposant de plus d'options limpent ou font une min-relance avec une partie des mains"
  level: heuristic
  source: "site de formation, Short Stack Strategy (https://pokercoaching.com/blog/short-stack-strategy-2/) : « At 10 big blinds or fewer, it is almost entirely push/fold », « This approach simplifies decision-making and maximizes fold equity », « At 15 big blinds, the landscape shifts significantly. Push/fold becomes your dominant framework for weak and medium holdings » ; site de formation, Push/Fold Tournament Strategy (https://upswingpoker.com/push-fold-tournament-strategy-charts/) : « around 15 big blinds (bb) or fewer », « larger than 20bb … Raising First In » ; site de solveur commercial, Short-Stacked Play in MTTs (https://blog.gtowizard.com/short-stacked-play-in-mtts/) : « The standard advice for a 10bb stack is to play an all-in or fold strategy » ; simplification : site de formation (même page) : « the all-in or fold binary was grossly suboptimal » ; école publiant des résultats de solveur, heads-up 10bb (https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments) : « 61.1% limp, 28.8% all-in, 10.1% fold »"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/short-stack-strategy-2/" }, { kind: training, url: "https://upswingpoker.com/push-fold-tournament-strategy-charts/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/short-stacked-play-in-mtts/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments" }]
- id: R-M11-002
  module: m11
  if: "vous jouez en push/fold depuis la {{t:small-blind|petite blinde}} contre la {{t:big-blind|grosse blinde}}"
  then: "plus le stack est court, plus vous {{t:shove|pushez}} de mains all-in : à {{n:m11.depth.15}}, environ {{n:m11.push.15}} des mains, à {{n:m11.depth.10}}, environ {{n:m11.push.10}}, à {{n:m11.depth.5}}, environ {{n:m11.nash.push.5}}–{{n:m11.push.5}}"
  because: "avec un stack plus court, vous risquez moins par rapport aux blindes que vous ramassez quand l'adversaire se {{t:fold|couche}}, et l'adversaire doit {{t:call|suivre}} plus large"
  level: gto
  source: "solveur push/fold du projet (content/ranges/pushfold.json ; heads-up, sans ante, équilibre de Nash du jeu all-in ou abandon, validé à 10bb dans le document 10 ; à 5bb, intervalle issu d'un équilibre calculé indépendamment, docs/tresci/e1b-solver.md, D-153) ; comparaison : site de formation, Push/Fold Play: Nash Ranges (https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/), 10bb : « 56.6% » de push"
  sources: [{ kind: training, url: "https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/" }, { kind: solver-app }]
- id: R-M11-003
  module: m11
  if: "il y a une ante dans le {{t:pot|pot}}"
  then: "vous {{t:shove|pushez}} all-in plus de mains que sans ante : à {{n:m11.depth.10}} avec une {{t:bb-ante|ante de grosse blinde}} de {{n:m11.ante}}, environ {{n:m11.nash.push.10-ante}}–{{n:m11.push.10-ante}} au lieu de {{n:m11.push.10}}"
  because: "l'ante fait grossir le {{t:pot|pot}} que vous ramassez quand l'adversaire se {{t:fold|couche}}, alors que le risque de l'all-in reste le même"
  level: gto
  source: "solveur push/fold du projet (pushfold.json, variante 10bb-ante : heads-up, big blind ante 1bb) ; validation : docs/tresci/e1b-solver.md (D-153), calcul dans le même modèle (équilibre par fictitious play 71,05%, borne inférieure de l'intervalle dans then) ; direction cohérente avec la littérature : site de formation, Push Fold Charts (https://pokercoaching.com/push-fold-charts/) : « When antes are in play, your preflop shoving range should be wider »"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: solver-app }]
- id: R-M11-004
  module: m11
  if: "vous partez all-in en premier"
  then: "vous gagnez de deux façons : l'adversaire se {{t:fold|couche}} et vous ramassez le {{t:pot|pot}}, ou il {{t:call|suit}} et vous gagnez à l'abattage ; une main sans aucune chance aurait toutefois besoin d'{{t:fold|abandons}} dans plus de {{n:m11.push.10.alpha}} des cas (à {{n:m11.depth.10}}, sans ante)"
  because: "vous risquez {{n:m11.push.10.risk}} pour gagner {{n:m11.push.10.win}} de blindes ; c'est pourquoi comptent à la fois la fold equity et l'équité de votre main quand l'adversaire {{t:call|suit}}"
  level: math
  source: "calcul : alpha = risque ÷ (pot + risque) (M6) ; fold equity : glossaire d'un site de solveur commercial (https://gtowizard.com/en/glossary/) : « Fold equity The amount of value a player will win by making another player fold. »"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M11-005
  module: m11
  if: "le M (stack ÷ coût d'un tour de table : blindes et antes) tombe à environ {{n:m11.m.red}} ou moins"
  then: "vous ne jouez plus qu'en all-in ou vous vous {{t:fold|couchez}}, et vous essayez d'entrer dans le {{t:pot|pot}} en premier"
  because: "sans jouer, le stack ne tient que quelques tours, et une relance classique cède trop de {{t:chips|jetons}}"
  level: heuristic
  source: "Harrington (d'après des synthèses) : Wikipédia, M-ratio (https://en.wikipedia.org/wiki/M-ratio) : « The M-ratio is calculated by the formula » (formule sous forme de fraction : stack ÷ (petite blinde + grosse blinde + total des antes)), dans le tableau des zones « Your only move is to move all-in or fold » ; site de formation, Dan Harrington M-Factor (https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/) : « Red zone: 1 < = M < = 5 », « your only and best option in this phase is to be the first to push in the pot » ; une seule limite, à environ 5 (D-147)"
  sources: [{ kind: reference, url: "https://en.wikipedia.org/wiki/M-ratio" }, { kind: training, url: "https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/" }]
- id: R-M11-006
  module: m11
  if: "depuis la {{t:big-blind|grosse blinde}}, vous {{t:call|suivez}} l'all-in de la {{t:small-blind|petite blinde}} avec un stack S (sans ante)"
  then: "il vous faut une équité de (S − {{n:pf.blind.bb}}) ÷ 2S : à {{n:m11.depth.10}}, {{n:m11.call.10.eq}}, à {{n:m11.depth.5}}, {{n:m11.call.5.eq}}, à {{n:m11.depth.15}}, {{n:m11.call.15.eq}}"
  because: "la blinde est déjà dans le {{t:pot|pot}}, donc vous payez S − {{n:pf.blind.bb}}, et le {{t:pot|pot}} après le {{t:call|call}} vaut 2S"
  level: math
  source: "calcul : équité requise = montant à payer ÷ pot après le call (M2)"
  sources: [{ kind: math }]
- id: R-M11-007
  module: m11
  if: "l'adversaire a fait all-in, et vous décidez si vous {{t:call|suivez}}"
  then: "vous {{t:call|suivez}} avec une {{t:range|range}} plus serrée que celle avec laquelle vous {{t:shove|pusheriez}} vous-même : à {{n:m11.depth.10}}, la {{t:big-blind|BB}} {{t:call|suit}} avec environ {{n:m11.call.10}} des mains, alors que la {{t:small-blind|SB}} {{t:shove|pushe}} environ {{n:m11.push.10}}"
  because: "celui qui suit ne gagne qu'à l'abattage, et contre une {{t:range|range}} déjà plus forte qu'une main aléatoire ; celui qui {{t:shove|pushe}} gagne aussi quand l'adversaire se {{t:fold|couche}}"
  level: gto
  source: "solveur push/fold du projet (pushfold.json) ; site de formation, Push Fold Charts (https://pokercoaching.com/push-fold-charts/) : « Calling ranges are tighter than shoving ranges » ; site de formation, The Gap Concept (https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/) : « you need a better hand to call a raise with than you would need to open a pot with a raise » (Sklansky)"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: training, url: "https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/" }, { kind: solver-app }]
- id: R-M11-008
  module: m11
  if: "vous voulez convertir des stacks de tournoi en argent ({{t:icm|ICM}})"
  then: "probabilité de 1re place = votre stack ÷ l'ensemble des {{t:chips|jetons}} ; la probabilité de 2e place se calcule de la même façon parmi les joueurs restants, pour chaque vainqueur possible ; équité = somme des probabilités × {{t:payout|gains}}"
  because: "ce modèle suppose que les joueurs ont le même niveau, donc seuls les stacks décident de l'ordre"
  level: math
  source: "site de solveur commercial, ICM Basics (https://blog.gtowizard.com/icm-basics/) : « The Independent Chip Model assumes all players are equally skilled, and therefore the probability of winning is purely a function of stack sizes », section Limitations of ICM : « ICM doesn’t consider players’ positions. », « ICM ignores blinds increasing. » (lu le 2026-11-09), « divide their chips by the total amount of chips in play », « Assume one of the other players wins, remove their chips from play, and divide our chips by the remaining chips in play » ; calcul sur un exemple de stacks (rapport E1 M9–M11)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: math }]
- id: R-M11-009
  module: m11
  if: "dans un {{t:tournament|tournoi}} avec {{t:icm|ICM}}, vous {{t:call|suivez}} un all-in qui peut vous éliminer"
  then: "il vous faut une équité de BF ÷ (BF + 1), où le bubble factor BF = perte d'équité en cas de défaite ÷ gain en cas de victoire ; dans l'exemple de la leçon, {{n:m11.bf.req}} au lieu de {{n:m11.bf.req-chips}} en {{t:chips|jetons}}"
  because: "dans un {{t:tournament|tournoi}} avec des {{t:payout|gains}}, une défaite coûte plus d'argent qu'une victoire n'en rapporte, donc un {{t:call|call}} doit gagner plus souvent que dans une partie où l'on joue des {{t:chips|jetons}}"
  level: math
  source: "calcul ICM (numbers.yaml, clés m11.bf.*) ; site de solveur commercial, What Is the Bubble Factor (https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/) : « $EV lost when you lose / $EV gained when you win = Bubble Factor », « Required Equity = Bubble Factor / (Bubble Factor + 1) »"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/" }, { kind: math }]
- id: R-M11-010
  module: m11
  if: "c'est la {{t:bubble|bulle}} ou la {{t:final-table|table finale}}, et vous avez un stack moyen"
  then: "vous {{t:call|suivez}} les all-ins nettement plus serré que dans une partie où l'on joue des {{t:chips|jetons}}, et un gros stack qui vous {{t:cover|couvre}} peut {{t:shove|pusher}} plus large"
  because: "{{t:risk-premium|prime de risque}} : les {{t:chips|jetons}} gagnés valent moins que les jetons perdus, et le gros stack risque moins que vous ce faisant"
  level: heuristic
  source: "site de solveur commercial, ICM Basics (https://blog.gtowizard.com/icm-basics/) : « chips won are worth less than chips lost » (texte sans balises de couleur), « Big stacks can threaten smaller stacks as they take on less risk when stacking off » ; site de formation, ICM at Final Tables (https://upswingpoker.com/icm-final-tables/) : « When it comes to calling versus shoves, you have to tighten up dramatically when big money is on the line » ; site de formation, Big Stack Advantage (https://upswingpoker.com/big-stack-advantage-stone-bubble/) : « Risk premiums are the additional equity needed to play for stacks. This means responding ranges tighten up considerably » ; Ganzfried et Sandholm, AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf), tableau 2 : la grosse blinde, après deux all-ins, suit en tournoi « 0.021 », et dans un coup isolé « 0.197 »"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: training, url: "https://upswingpoker.com/icm-final-tables/" }, { kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }]
- id: R-M11-011
  module: m11
  if: "vous jouez en push/fold, et il reste derrière vous davantage de joueurs qui peuvent {{t:call|suivre}}"
  then: "vous {{t:shove|pushez}} all-in plus serré : à trois joueurs et {{n:m11.depth.3max}}, le Bouton environ {{n:m11.3max.push.btn}} des mains, et la {{t:small-blind|petite blinde}}, après l'abandon du Bouton, environ {{n:m11.3max.push.sb}}"
  because: "chaque joueur supplémentaire est une chance de plus que quelqu'un se réveille avec une main forte, donc il est plus rare que tout le monde se {{t:fold|couche}}"
  level: gto
  source: "solveur push/fold du projet (content/ranges/pushfold.json, trois joueurs) ; cohérent avec Ganzfried et Sandholm, AAMAS 2008 (https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf), tableau 2, single hand : « Button jam … 0.355 », « SB jam after fold … 0.633 » (fréquences des nœuds concordantes à 1,2 pp près, rapport M11)"
  sources: [{ kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }, { kind: solver-app }]
- id: R-M11-012
  module: m11
  if: "vous {{t:call|suivez}} un all-in, et il reste encore un joueur derrière vous ou quelqu'un a déjà {{t:call|suivi}}"
  then: "vous {{t:call|suivez}} plus serré : à trois joueurs et {{n:m11.depth.3max}}, la {{t:small-blind|petite blinde}} {{t:call|suit}} l'all-in du Bouton avec environ {{n:m11.3max.call.sb}} des mains, la {{t:big-blind|grosse blinde}} (quand la {{t:small-blind|SB}} s'est {{t:fold|couchée}}) environ {{n:m11.3max.call.bb}}, et quand deux joueurs sont déjà all-in, seulement environ {{n:m11.3max.call.bb-two}}, même si le prix tombe à {{n:m11.3max.bb-two.eq}}"
  because: "un joueur derrière vous peut avoir une main forte et entrer dans le coup, et contre deux {{t:range|ranges}}, l'équité de votre main baisse vite ; les prix de la {{t:small-blind|SB}} et de la {{t:big-blind|BB}} diffèrent peu, donc l'écart vient surtout du joueur derrière vous"
  level: gto
  source: "solveur push/fold du projet (pushfold.json, trois joueurs) ; cohérent avec Ganzfried et Sandholm, AAMAS 2008, tableau 2, single hand : « SB jam after jam … 0.234 », « BB jam after jam/fold … 0.308 », « BB jam after jam/jam … 0.197 »"
  sources: [{ kind: solver-app }, { kind: study }]

# M13: analiza własnej gry (dokument 14, sekcja 8; decyzje D-M13-12…15 w dokumencie „12 Weryfikacja źródeł — M10–M13”).
# „Decyzja, nie wynik” uczy R-M12-004 (jedna reguła na jedno pojęcie); mechanika powtórek z gry to opis aplikacji,
# więc jest w tekście lekcji, a nie w księdze reguł.
- id: R-M13-001
  module: m13
  if: "vous avez perdu un all-in alors que vous aviez plus d'{{t:equity|équité}} que l'adversaire"
  then: "vous ne changez pas de stratégie à cause de ce coup : avec une {{t:equity|équité}} e, vous perdez en moyenne 1 − e de ces coups, p. ex. à {{n:m13.eq.example}}, environ {{n:m13.lose.example}}, soit {{n:m13.lose.of-ten}} sur {{n:m13.ten}}"
  because: "l'{{t:equity|équité}} est la part de victoires sur de nombreuses répétitions de la même situation ; la défaite fait partie de ce calcul"
  level: math
  source: "calcul : P(défaite) = 1 − équité (moins en cas de partage du pot)"
  sources: [{ kind: math }]
- id: R-M13-002
  module: m13
  if: "le solveur joue votre main dans un spot donné de deux façons ({{t:mixed-hand|main mixte}})"
  then: "chacun de ces jeux est correct ; le rapport marque le plus rare comme acceptable quand le solveur le joue dans au moins {{n:range.mixed.min}} des cas, mais moins souvent que dans {{n:range.mixed.low}}"
  because: "à l'équilibre, un joueur ne mélange que des jeux de même {{t:expected-value|espérance de gain}}"
  level: gto
  source: "site de solveur commercial, Principles of GTO (https://blog.gtowizard.com/principles-of-gto/) : « Unexploitable play mixes between two or more options only when these options have the same EV. » ; seuil de coup rare : site de solveur commercial, Measure Performance (https://help.gtowizard.com/measure-performance/) : « Inaccuracy – Moves that are taken less than 3.5% of the time in GTO, but don’t lose significant EV. » (ADR-26)"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/principles-of-gto/" }]
- id: R-M13-003
  module: m13
  if: "vous échangez les couleurs de toutes les cartes selon une même permutation (p. ex. les cœurs en piques, les piques en cœurs)"
  then: "la bonne décision ne change pas"
  because: "la force des mains et des {{t:draw|tirages}} dépend du fait que les couleurs concordent, et non de quelles couleurs il s'agit ; c'est pourquoi la reprise d'un coup joué montre la même situation avec d'autres couleurs"
  level: math
  source: "calcul : le classement des mains ne distingue pas les couleurs (règles du Texas Hold'em), et une permutation des couleurs préserve le fait que certaines cartes partagent une couleur ; vérifié dans poker-core par un test de propriété (document 02, document 14, 5.6)"
  sources: [{ kind: math }]
- id: R-M13-004
  module: m13
  if: "après une seule {{t:session|session}}, vous voulez évaluer vos fréquences (p. ex. à quelle fréquence vous entrez dans le coup ou vous vous {{t:fold|couchez}} face au 3-bet)"
  then: "vous ne tirez pas de conclusion : vous comptez les occasions, pas les mains ; vous regardez une statistique à partir d'environ {{n:hud.opps.look}} occasions, et vous gagnez en certitude vers environ {{n:hud.opps.sure}}"
  because: "même le {{t:vpip|VPIP}} ne se lit qu'après environ {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}} mains (comme en M10), et une situation rare ne se présente que quelques fois par {{t:session|session}}"
  level: heuristic
  source: "coach avec un blog de formation, Poker HUD Stats: The Sample Size You Need (https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html) : « For me personally I usually want at least 5 to even bother looking, and 10 to be sure. » ; échantillons de mains comme dans R-M10-003 (site de formation, site de formation)"
  sources: [{ kind: training, url: "https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html" }, { kind: training }, { kind: training }]
- id: R-M13-005
  module: m13
  if: "en cours de jeu, vous ne savez pas quoi faire, ou un coup vous a semblé bizarre"
  then: "vous vous contentez de le marquer, et vous l'analysez après la {{t:session|session}}, quelques heures ou quelques jours plus tard, à tête reposée"
  because: "une analyse faite juste après une grosse perte ou dans la fatigue est teintée d'émotions"
  level: heuristic
  source: "blog d'une application d'analyse de mains, How to Review Your Poker Hands (https://blog.checkreplay.com/poker-hand-review/) : « Mark hands that felt interesting, confusing, or off. Don’t analyze them yet. » ; « The best time to review is hours or days after the session, with a clear head. » ; « What doesn’t work is reviewing while you’re still steaming or while you’re tired. »"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }]
- id: R-M13-006
  module: m13
  if: "vous avez perdu un gros {{t:pot|pot}} ou, dans un coup, vous ne saviez pas quoi faire"
  then: "vous revoyez ce coup ; vous ne passez pas beaucoup de temps sur un cooler (deux mains fortes dont aucune ne pouvait raisonnablement se {{t:fold|coucher}}) ni sur un bad beat"
  because: "les coolers et les bad beats arrivent à tout le monde, et les coups avec une décision difficile font partie de ceux qui méritent d'être revus"
  level: heuristic
