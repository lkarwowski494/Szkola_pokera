# Pula pytań egzaminacyjnych modułu M8 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m8.*).
module: m8
drills:
  - kind: choice
    id: m8.exam.q1
    family: m8.value.threshold
    rules: [R-M8-001]
    prompt: "River, l'adversaire {{t:check|checke}} et ne peut pas vous {{t:raise|relancer}}. Sa {{t:range|range}} contient {{n:exam.m8.range.worse}} mains moins bonnes que la vôtre, mais seules {{n:exam.m8.call.worse}} d'entre elles {{t:call|suivront}} votre mise. Il paiera aussi {{n:exam.m8.call.better}} fois avec une meilleure main. Misez-vous ?"
    options:
      - { text: "Non, je {{t:check|checke}}", correct: true, why: "Oui : ne comptez que les mains qui paieront. La mise gagne {{n:exam.m8.call.worse}} fois et perd {{n:exam.m8.call.better}} fois, soit une perte nette de {{n:exam.m8.net.loss}} mise. Les mains moins bonnes qui {{t:fold|se coucheront}} auraient de toute façon perdu contre vous après un {{t:check|check}}." }
      - { text: "Oui, car il y a plus de mains moins bonnes que de meilleures", why: "L'adversaire a {{n:exam.m8.range.worse}} mains moins bonnes, mais la plupart d'entre elles {{t:fold|se coucheront}} face à une mise. Parmi les mains qui paieront, les meilleures sont plus nombreuses ({{n:exam.m8.call.better}} contre {{n:exam.m8.call.worse}})." }
      - { text: "Oui, pour savoir où j'en suis", why: "Une mise « pour l'information » paie les meilleures mains, tandis que les moins bonnes {{t:fold|se couchent}}. Vous obtenez la même information gratuitement après un {{t:check|check}}, au showdown." }
  - kind: choice
    id: m8.exam.q2
    family: m8.value.size
    rules: [R-M8-003]
    prompt: "Vous avez {{t:open|ouvert}} depuis le Button, la {{t:big-blind}} a {{t:call|suivi}}. Au flop, c-bet et {{t:call}} ; au turn, vous avez tous les deux {{t:check|checké}}. À la river, la {{t:big-blind}} {{t:check|checke}}. Vous avez une {{t:top-pair|top paire}} avec un neuf et estimez battre un peu plus de la moitié des mains qui paieront. Que faites-vous ?"
    table: { hand: "Jh 9h", board: "Jc 7s 4d 2h 2c", position: BTN }
    options:
      - { text: "Miser env. 1/3 du {{t:pot|pot}}", correct: true, why: "Oui : c'est de la thin value. Les sept, les quatre et les valets plus faibles {{t:call|suivront}} aussi une petite mise, donc parmi les {{t:call|calls}} il reste plus de mains moins bonnes que de meilleures." }
      - { text: "Miser tout le {{t:pot|pot}}", sizeError: true, why: "Bonne action, mauvaise taille : face à une mise de la taille du {{t:pot|pot}}, les sept et les quatre {{t:fold|se coucheront}}, et ce sont surtout les meilleurs valets et les mains plus fortes qui paieront. Misez la thin value plus petit, généralement env. 1/4–1/2 du {{t:pot|pot}}." }
      - { text: "Je {{t:check|checke}}, car la main est trop faible pour miser", why: "Vous perdez de la value : vous battez plus de la moitié des mains qui paieront une petite mise. Il suffit de choisir une taille plus petite." }
  - kind: numeric
    id: m8.exam.q3
    family: m8.bluff.share
    rules: [R-M8-004, R-M8-005]
    prompt: "River. Le {{t:pot|pot}} contient {{n:exam.m8.pot}}, vous misez {{n:exam.m8.bet}} avec une {{t:range|range}} composée de mains très fortes et de {{t:bluff|bluffs}}. À l'équilibre, quelle part de vos mises représentent les {{t:bluff|bluffs}} ? Saisissez le nombre en pourcentage."
    answer: exam.m8.share
    explanation: "Part des {{t:bluff|bluffs}} = mise ÷ ({{t:pot}} + 2·mise) = {{n:exam.m8.bet}} ÷ ({{n:exam.m8.pot}} + {{n:exam.m8.bet}} + {{n:exam.m8.bet}}) = {{n:exam.m8.share}}. La main de l'adversaire qui attrape les {{t:bluff|bluffs}} a besoin d'autant d'équité, donc elle ne gagne rien, qu'elle {{t:call|suive}} ou qu'elle {{t:fold|se couche}}."
  - kind: choice
    id: m8.exam.q4
    family: m8.bluff.combos
    rules: [R-M8-004]
    prompt: "River. Le {{t:pot|pot}} contient {{n:exam.m8.pot}}, vous misez {{n:exam.m8.bet}} avec une {{t:range|range}} de {{n:exam.m8.range}} {{t:combo|combinaisons}} : mains de value et {{t:bluff|bluffs}}. La part de {{t:bluff|bluffs}} à l'équilibre est de {{n:exam.m8.share}}. Combien de {{t:combo|combinaisons}} sont des {{t:bluff|bluffs}} ?"
    options:
      - { text: "{{n:exam.m8.bluffs}}", correct: true, why: "Oui : {{n:exam.m8.range}} × {{n:exam.m8.share}} = {{n:exam.m8.bluffs}} {{t:bluff|bluffs}} et {{n:exam.m8.value-combos}} {{t:combo|combinaisons}} {{t:value|de value}}." }
      - { text: "{{n:exam.m8.bluffs.wrong-pot}}", why: "C'est ce qu'il y aurait avec une mise de tout le {{t:pot|pot}} (part de {{n:bluff.share.bet-pot}}). Avec une mise plus petite, il y a moins de {{t:bluff|bluffs}} : {{n:exam.m8.share}}." }
      - { text: "{{n:exam.m8.value-combos}}", why: "C'est le nombre de {{t:combo|combinaisons}} {{t:value|de value}}. Les {{t:bluff|bluffs}} en sont la plus petite partie : {{n:exam.m8.range}} × {{n:exam.m8.share}} = {{n:exam.m8.bluffs}}." }
  - kind: choice
    id: m8.exam.q5
    family: m8.bluff.hands
    rules: [R-M8-006]
    prompt: "Vous avez {{t:open|ouvert}} depuis le Button, la {{t:big-blind}} a {{t:call|suivi}} et {{t:check|checke}} à la river. Avec laquelle de ces mains vaut-il mieux {{t:bluff|bluffer}} ?"
    table: { board: "Qs Tc 6d 3h 2s", position: BTN }
    options:
      - { text: "[[Kc Jc]]", correct: true, why: "Oui : le {{t:oesd|tirage par les deux bouts}} n'est pas rentré, et le roi seul comme carte haute ne gagne presque jamais au showdown. Une main sans chance ne perd rien quand le {{t:bluff}} échoue." }
      - { text: "[[Ts 9s]]", why: "La {{t:second-pair|deuxième paire}} gagne après un {{t:check|check}} contre les {{t:draw|tirages}} manqués et les mains plus faibles. En {{t:bluff|bluffant}}, vous renonceriez à ce gain." }
      - { text: "[[Qd 8d]]", why: "La {{t:top-pair|top paire}} a de la valeur au showdown. Vous ne {{t:bluff|bluffez}} pas avec une main qui gagne souvent après un {{t:check|check}}." }
  - kind: choice
    id: m8.exam.q6
    family: m8.blockers.bluff
    rules: [R-M8-007]
    prompt: "River. La {{t:big-blind|grosse blinde}} {{t:check|checke}}. Sur ce {{t:board|board}}, KT et T8 ont une {{t:straight}}. Aucune des deux mains ci-dessous n'a de {{t:pair|paire}} ni de chance au showdown. Avec laquelle vaut-il mieux {{t:bluff|bluffer}} ?"
    table: { board: "Qd Jc 4s 2h 9d", position: BTN }
    options:
      - { text: "[[Ts 7s]]", correct: true, why: "Oui : le dix bloque les deux {{t:straight|quintes}} (KT et T8), c'est-à-dire les mains avec lesquelles l'adversaire paiera à coup sûr. Il en a moins de {{t:combo|combinaisons}}, donc il lui reste plus souvent une main à coucher." }
      - { text: "[[6s 5s]]", why: "Cette main ne bloque aucune main forte de l'adversaire. Pour choisir entre des {{t:bluff|bluffs}} sans chance, préférez celui qui bloque sa value." }
  - kind: numeric
    id: m8.exam.q7
    family: m8.blockers.combos
    rules: [R-M8-009]
    prompt: "Sans aucune information, KQ compte {{n:combos.unpaired}} {{t:combo|combinaisons}}. Vous avez [[Ad Qc]]. Combien de {{t:combo|combinaisons}} de KQ l'adversaire peut-il avoir ? Saisissez le nombre."
    table: { hand: "Ad Qc" }
    answer: combos.unpaired.one-blocked
    explanation: "Vous avez une dame, il reste donc à l'adversaire {{n:pair.outs.per-rank}} dames et les {{n:cards.suits}} rois : {{n:pair.outs.per-rank}} × {{n:cards.suits}} = {{n:combos.unpaired.one-blocked}}. L'as n'influe pas sur le nombre de KQ."
  - kind: choice
    id: m8.exam.q8
    family: m8.catch.math
    rules: [R-M8-010]
    prompt: "River. Le {{t:pot|pot}} contient {{n:exam.m8.pot}}, l'adversaire {{t:bet|mise}} {{n:exam.m8.bet}}. Vous avez un bluff-catcher et estimez que les {{t:bluff|bluffs}} représentent env. {{n:exam.m8.bluffs.est}} de ses mises. Que faites-vous ?"
    options:
      - { text: "Je {{t:fold|me couche}}", correct: true, why: "Oui : il vous faut {{n:exam.m8.bet}} ÷ ({{n:exam.m8.pot}} + {{n:exam.m8.bet}} + {{n:exam.m8.bet}}) = {{n:exam.m8.share}} d'équité, et un bluff-catcher ne bat que les {{t:bluff|bluffs}}, soit env. {{n:exam.m8.bluffs.est}} des cas. Le {{t:call|call}} est perdant." }
      - { text: "Je {{t:call|suis}}", why: "Votre équité est la part de {{t:bluff|bluffs}} dans ses mises : {{n:exam.m8.bluffs.est}}. C'est moins que les {{n:exam.m8.share}} nécessaires, donc le {{t:call}} est perdant." }
      - { text: "Je {{t:raise|relance}}", why: "Après une {{t:raise|relance}}, les {{t:bluff|bluffs}} {{t:fold|se coucheront}} et seules les meilleures mains paieront. Vous ne {{t:raise|relancez}} pas avec un bluff-catcher." }
  - kind: choice
    id: m8.exam.q9
    family: m8.catch.blockers
    rules: [R-M8-011]
    prompt: "Vous défendez la {{t:big-blind}}. Les cœurs ne sont pas rentrés, et la river a donné une {{t:straight}} aux mains T7 et 75. Vous {{t:check|checkez}}, et le Button {{t:bet|mise}} tout le {{t:pot|pot}}. Vous avez une {{t:top-pair|top paire}} avec un kicker faible. Avec laquelle de ces mains le {{t:call}} est-il meilleur ?"
    table: { board: "Kh 9h 6c 2s 8d", position: BB }
    options:
      - { text: "[[Kc 7c]]", correct: true, why: "Oui : le sept bloque les deux nouvelles {{t:straight|quintes}} (T7 et 75), soit une partie de la value du Button, et sans cœur vous ne bloquez pas les {{t:flush-draw|tirages couleur}} manqués, ses principaux {{t:bluff|bluffs}}. Il reste plus de {{t:bluff|bluffs}} dans ses mises." }
      - { text: "[[Ks 3h]]", why: "La carte [[3h]] bloque une partie des {{t:flush-draw|tirages couleur}} manqués, c'est-à-dire des {{t:bluff|bluffs}} du Button, et cette main ne bloque aucune {{t:straight|quinte}}. Il reste plus de value dans ses mises." }
  - kind: choice
    id: m8.exam.q10
    family: m8.value.check
    rules: [R-M8-002]
    prompt: "Vous avez {{t:open|ouvert}} depuis le Button, la {{t:big-blind}} a {{t:call|suivi}}. Au flop, c-bet et {{t:call}} ; au turn, vous avez tous les deux {{t:check|checké}}. À la river, la {{t:big-blind}} {{t:check|checke}}. Vous avez une {{t:pair|paire}} de six. Que faites-vous ?"
    table: { hand: "6d 6s", board: "Jc 8h 4d 3s Kc", position: BTN }
    options:
      - { text: "Je {{t:check|checke}}", correct: true, why: "Oui : la {{t:pair|paire}} de six bat les {{t:draw|tirages}} manqués et les cartes hautes, mais ces mains {{t:fold|se coucheront}} face à une mise. Ce sont surtout les valets, les huit et les rois qui paieront. En {{t:check|checkant}}, vous allez au showdown gratuitement." }
      - { text: "Je mise petit {{t:value|pour la value}}", why: "Une petite mise sera elle aussi {{t:call|suivie}} surtout par de meilleures {{t:pair|paires}}. Les mains moins bonnes de l'adversaire sont ici surtout des mains sans {{t:pair|paire}} et les {{t:pair|paires}} les plus faibles, et elles paient rarement." }
      - { text: "Je mise gros pour que l'adversaire {{t:fold|couche}} une meilleure {{t:pair|paire}}", why: "La mise transforme une main avec de la valeur au showdown en {{t:bluff}}. Vous {{t:bluff|bluffez}} avec des mains sans chance, et cette main gagne souvent après un {{t:check|check}}." }
