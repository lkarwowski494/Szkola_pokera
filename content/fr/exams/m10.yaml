module: m10
drills:
  - kind: choice
    id: m10.exam.q1
    family: m10.hud.stats
    rules: [R-M10-001]
    prompt: "Tout le monde s'est {{t:fold|couché}} jusqu'à l'adversaire en {{t:small-blind|petite blinde}}. L'adversaire complète la {{t:big-blind|grosse blinde}}, et quand la {{t:big-blind}} {{t:raise|relance}}, il se {{t:fold|couche}}. Comment cette main modifie-t-elle ses statistiques ?"
    options:
      - { text: "Elle augmente le {{t:vpip}}, mais pas le {{t:pfr}}", correct: true, why: "Compléter la {{t:big-blind|grosse blinde}}, c'est mettre volontairement des {{t:chips|jetons}} au-delà de la blinde obligatoire, donc cela compte dans le {{t:vpip}}. L'adversaire n'a pas {{t:raise|relancé}}, donc le {{t:pfr}} n'augmente pas." }
      - { text: "Elle n'en modifie aucune, car la {{t:small-blind|petite blinde}} est un paiement obligatoire", why: "Seule la blinde elle-même est obligatoire. Compléter jusqu'à la {{t:big-blind|grosse blinde}} entière est déjà une décision de l'adversaire, donc un paiement volontaire, qui augmente le {{t:vpip}}." }
      - { text: "Elle augmente le {{t:vpip}} et le {{t:pfr}}", why: "Le {{t:pfr}} n'augmente que lorsque l'adversaire {{t:raise|relance}} lui-même avant le flop. Ici, c'est la {{t:big-blind}} qui a {{t:raise|relancé}}, et l'adversaire a seulement complété puis s'est {{t:fold|couché}}." }
      - { text: "Elle n'augmente pas le {{t:vpip}}, car l'adversaire s'est de toute façon {{t:fold|couché}} avant le flop", why: "Le {{t:vpip}} compte les paiements volontaires, pas le fait que la main soit allée jusqu'au flop. L'adversaire a complété de son plein gré, donc la main compte dans le {{t:vpip}}." }
  - kind: numeric
    id: m10.exam.q2
    family: m10.hud.sample
    rules: [R-M10-002]
    prompt: "L'adversaire a reçu un c-bet {{n:exam.m10.se.n}} fois et s'est {{t:fold|couché}} dans {{n:exam.m10.se.p}} des cas. Quelle est l'erreur standard de son fold to c-bet en points de pourcentage ? Saisissez un nombre."
    answer: exam.m10.se
    explanation: "√(p × (1 − p) ÷ n) = √({{n:exam.m10.se.p}} × {{n:exam.m10.se.q}} ÷ {{n:exam.m10.se.n}}) ≈ {{n:exam.m10.se}}. Vous comptez les occasions (les c-bets qu'il a reçus), pas les mains. Avec environ {{n:var.conf95}} de certitude, le vrai fold to c-bet se situe dans l'intervalle ± {{n:var.z95}} × {{n:exam.m10.se}} ≈ ± {{n:exam.m10.ci}}, soit entre environ {{n:exam.m10.ci.low}} et {{n:exam.m10.ci.high}}."
  - kind: choice
    id: m10.exam.q3
    family: m10.hud.sample
    rules: [R-M10-003]
    prompt: "Après {{n:exam.m10.mid.hands}} mains, l'adversaire a un {{t:vpip}} de {{n:exam.m10.mid.vpip}}, un {{t:pfr}} de {{n:exam.m10.mid.pfr}} et un fold to 3-bet de {{n:exam.m10.mid.f3b}}. Sur lesquels de ces chiffres pouvez-vous déjà fonder vos décisions ?"
    options:
      - { text: "Sur le {{t:vpip}} et le {{t:pfr}} ; le fold to 3-bet relève encore du hasard", correct: true, why: "Le {{t:vpip}} et le {{t:pfr}} se lisent après environ {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}} mains, mais le fold to 3-bet seulement après environ {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}}, car l'occasion ne se présente qu'après une {{t:open|ouverture}} et un 3-bet. Sur {{n:exam.m10.mid.hands}} mains, cela ne fait que quelques occasions." }
      - { text: "Sur les trois, car l'échantillon dépasse {{n:hud.hands.vpip.low}} mains", why: "Le seuil d'environ {{n:hud.hands.vpip.low}} mains concerne les statistiques qui ont une occasion à chaque main. Le fold to 3-bet en a plusieurs fois moins et demande environ {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}} mains." }
      - { text: "Sur aucun : avant mille mains, les statistiques sont aléatoires", why: "Elles le sont en dessous d'environ {{n:hud.hands.random}} mains. Après {{n:exam.m10.mid.hands}} mains, le {{t:vpip}} et le {{t:pfr}} disent déjà quelque chose." }
      - { text: "Seulement sur le fold to 3-bet, car c'est le plus extrême", why: "Un chiffre extrême issu d'un petit échantillon relève plus souvent du hasard que d'une vraie lecture. La fiabilité dépend du nombre d'occasions, et le fold to 3-bet en a ici le moins." }
  - kind: choice
    id: m10.exam.q4
    family: m10.types.adjust
    rules: [R-M10-007]
    prompt: "Un {{t:nit|nit}} ({{t:vpip}} {{n:exam.m10.nit.vpip}}, {{t:pfr}} {{n:exam.m10.nit.pfr}}, {{n:exam.m10.nit.hands}} mains) {{t:open|ouvre}} depuis {{t:utg|UTG}}. Vous êtes au Bouton avec une main du bas de la {{t:range|range}} que vous utilisez, dans la base du module 4, pour {{t:call|suivre}} une telle {{t:open|ouverture}}. Que faites-vous ?"
    options:
      - { text: "Je me {{t:fold|couche}}", correct: true, why: "Un joueur qui joue si peu de mains {{t:raise|relance}} surtout avec les plus fortes. Les mains du bas de votre {{t:range|range}} de {{t:call|call}} sont plus souvent dominées face à lui, donc vous vous {{t:fold|couchez}} avec elles plus souvent que dans la base." }
      - { text: "Je {{t:call|suis}} comme dans la base, car j'ai la {{t:position|position}}", why: "La {{t:position|position}} ne répare pas une main dominée. La base suppose une {{t:range|range}} d'{{t:open|ouverture}} typique, et la {{t:range|range}} de ce joueur est bien plus forte." }
      - { text: "Je fais un 3-bet en {{t:bluff}}, car un {{t:nit}} ne joue que des mains fortes et va se {{t:fold|coucher}}", why: "Sa {{t:range|range}} d'{{t:open|ouverture}} se compose surtout des mains les plus fortes, et celles-ci se {{t:fold|couchent}} rarement face à un 3-bet. Ici, le {{t:bluff|bluff}} tombe sur la partie la plus forte de son jeu." }
  - kind: choice
    id: m10.exam.q5
    family: m10.types.adjust
    rules: [R-M10-008]
    prompt: "L'adversaire est un {{t:maniac|maniaque}} : {{t:vpip}} {{n:exam.m10.maniac.vpip}}, {{t:pfr}} {{n:exam.m10.maniac.pfr}}, {{n:exam.m10.long.hands}} mains. Vous avez touché un {{t:set|set}} au flop, et l'adversaire {{t:bet|mise}}. Que faites-vous ?"
    options:
      - { text: "Je {{t:call|suis}} et je le laisse continuer à miser", correct: true, why: "Avec une main très forte, vous laissez le {{t:maniac|maniaque}} miser : ses mises contiennent beaucoup de {{t:bluff|bluffs}} et de mains faibles, et un {{t:call}} les maintient en jeu pour les {{t:street|streets}} suivantes." }
      - { text: "Je {{t:raise|relance}} tout de suite le plus gros possible", why: "Une {{t:raise|relance}} pousse ses {{t:bluff|bluffs}} et ses mains faibles à se {{t:fold|coucher}} avant qu'ils ne mettent davantage. Face à un joueur qui mise de lui-même, vous gagnez plus en le laissant faire." }
      - { text: "Je me {{t:fold|couche}}, car un {{t:pfr}} élevé signifie des mains fortes", why: "Un {{t:pfr}} élevé avec un {{t:vpip}} aussi élevé signifie qu'il {{t:raise|relance}} avec presque n'importe quelle main, pas qu'il a des mains fortes. Un {{t:set}} est ici l'une des meilleures mains." }
  - kind: choice
    id: m10.exam.q6
    family: m10.types.adjust
    rules: [R-M10-006]
    prompt: "River. L'adversaire est un {{t:recreational|joueur récréatif}} passif : {{t:vpip}} {{n:exam.m10.rec.vpip}}, {{t:pfr}} {{n:exam.m10.rec.pfr}}, {{n:exam.m10.long.hands}} mains. Il {{t:check|checke}}. Vous avez une main que, dans la base du module 8, vous misez ici parfois {{t:value|pour la valeur}} et avec laquelle vous {{t:check|checkez}} parfois. Que faites-vous ?"
    options:
      - { text: "Je mise {{t:value|pour la valeur}}", correct: true, why: "Ce type de joueur {{t:call|suit}} jusqu'au bout avec plus de mains faibles que l'adversaire de la base, donc une plus grande part de ses {{t:call|calls}} sont des mains moins bonnes que la vôtre. Face à lui, vous misez aussi des mains plus fines {{t:value|pour la valeur}}." }
      - { text: "Je {{t:check|checke}}, car un joueur passif ne {{t:call|suit}} qu'avec de bonnes mains", why: "C'est l'inverse : un joueur avec un grand écart {{t:vpip}} − {{t:pfr}} joue beaucoup de mains et {{t:call|suit}} avec elles jusqu'au bout. C'est justement une raison de miser plus, pas moins." }
      - { text: "Je fais comme dans la base : parfois une mise, parfois un {{t:check}}", why: "La base suppose un adversaire qui se défend correctement. Cet adversaire {{t:call|suit}} trop souvent, donc une main limite bascule vers une mise {{t:value|pour la valeur}}." }
  - kind: choice
    id: m10.exam.q7
    family: m10.base.alpha
    rules: [R-M10-010]
    prompt: "L'adversaire a un fold to c-bet de {{n:exam.m10.fcb}} après {{n:exam.m10.long.hands}} mains. Vous avez raté le flop et n'avez pas de {{t:draw|tirage}}. Quel c-bet sans main est immédiatement rentable ?"
    options:
      - { text: "Seulement le petit, 1/3 du {{t:pot|pot}}", correct: true, why: "Un c-bet de 1/3 du {{t:pot|pot}} est à l'équilibre avec {{n:alpha.cbet.small}} de {{t:fold|folds}}, et un c-bet de 3/4 du {{t:pot|pot}} seulement avec {{n:alpha.cbet.big}}. {{n:exam.m10.fcb}} ne suffit que pour le petit. Le fold to c-bet regroupe toutes les tailles et toutes les tables, c'est donc une approximation." }
      - { text: "Les deux, car l'adversaire se {{t:fold|couche}} souvent", why: "Un gros c-bet risque davantage et demande plus de {{n:alpha.cbet.big}} de {{t:fold|folds}}. L'adversaire se {{t:fold|couche}} dans {{n:exam.m10.fcb}} des cas, c'est-à-dire trop rarement." }
      - { text: "Seulement le gros, car il pousse davantage au {{t:fold|fold}}", why: "Le fold to c-bet du {{t:hud|HUD}} n'indique pas que l'adversaire se {{t:fold|couche}} plus souvent face à une grosse mise. Avec {{n:exam.m10.fcb}} de {{t:fold|folds}}, un gros c-bet sans main perd, car il lui faut {{n:alpha.cbet.big}}." }
      - { text: "Aucun, car l'adversaire se {{t:fold|couche}} moins d'une fois sur deux", why: "Le seuil n'est pas la moitié, mais mise ÷ ({{t:pot}} + mise). Pour un c-bet de 1/3 du {{t:pot|pot}}, il est de {{n:alpha.cbet.small}}, donc {{n:exam.m10.fcb}} suffit." }
  - kind: choice
    id: m10.exam.q8
    family: m10.base.3bet
    rules: [R-M10-011]
    prompt: "L'adversaire a un fold to 3-bet de {{n:exam.m10.f3b.low}} après {{n:exam.m10.long.hands}} mains. Il {{t:open|ouvre}} depuis le {{t:cutoff|CO}}, et vous êtes au Bouton avec une main avec laquelle, dans la base, vous faites un 3-bet en {{t:bluff}}. Que changez-vous ?"
    options:
      - { text: "Je renonce au 3-bet avec cette main ; contre lui, je fais surtout des 3-bets avec des mains fortes", correct: true, why: "Un 3-bet à {{n:pf.3bet.ip-total}} n'est rentable sans main qu'au-delà de {{n:alpha.vs-3bet-ip-size}} de {{t:fold|folds}}, et cet adversaire se {{t:fold|couche}} dans {{n:exam.m10.f3b.low}} des cas. Un {{t:bluff|bluff}} jouerait un gros {{t:pot|pot}} avec une main faible, alors que les mains fortes obtiennent de lui plus de {{t:call|calls}} : une {{t:range}} {{t:linear|linéaire}}." }
      - { text: "Je fais des 3-bets avec cette main plus souvent, car l'adversaire est faible", why: "Ici, la faiblesse de l'adversaire, c'est qu'il se {{t:fold|couche}} rarement. Un {{t:bluff|bluff}} vit des {{t:fold|folds}}, donc contre lui, il perd." }
      - { text: "Rien : le fold to 3-bet n'est pas encore fiable", why: "Après {{n:exam.m10.long.hands}} mains, il l'est : le fold to 3-bet se lit après environ {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}} mains." }
  - kind: numeric
    id: m10.exam.q9
    family: m10.rake.math
    rules: [R-M10-015]
    prompt: "Le {{t:pot|pot}} contient {{n:ex.pot}}, et l'adversaire {{t:bet|mise}} la totalité du {{t:pot|pot}} : {{n:ex.bet.pot}}. La salle prélève {{n:rake.ex.pct}} du {{t:pot|pot}}, et le {{t:rake-cap|plafond}} est hors d'atteinte. De combien d'equity avez-vous besoin pour {{t:call|suivre}} ? Saisissez un pourcentage."
    answer: exam.m10.rake.eq
    explanation: "Le {{t:pot|pot}} après le {{t:call|call}} est de {{n:exam.m10.rake.total}}, et de {{n:exam.m10.rake.after}} après déduction du {{t:rake|rake}}. Vous ajoutez {{n:ex.bet.pot}} : {{n:ex.bet.pot}} ÷ {{n:exam.m10.rake.after}} ≈ {{n:exam.m10.rake.eq}} au lieu de {{n:eq.bet-pot}} sans {{t:rake|rake}}."
