# Pula pytań egzaminacyjnych modułu M6 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m6.*).
module: m6
drills:
  - kind: numeric
    id: m6.exam.q1
    family: m6.mdf
    rules: [R-M6-001, R-M6-005]
    prompt: "River. Le {{t:pot|pot}} est de {{n:exam.m6.pot}}, et votre adversaire {{t:bet|mise}} {{n:exam.m6.bet.three-quarters}}. Quelle est la {{t:mdf}}, c’est-à-dire quelle part minimale de votre {{t:range|range}} défendez-vous ? Saisissez le nombre en pourcentage."
    answer: exam.m6.mdf.three-quarters
    explanation: "{{t:mdf}} = {{t:pot|pot}} ÷ ({{t:pot|pot}} + mise) = {{n:exam.m6.pot}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}}) = {{n:exam.m6.mdf.three-quarters}}. Si vous vous {{t:fold|couchez}} plus souvent, un {{t:bluff|bluff}} sans aucune chance devient automatiquement rentable."
  - kind: choice
    id: m6.exam.q2
    family: m6.alpha
    rules: [R-M6-002]
    prompt: "River. Le {{t:pot|pot}} est de {{n:exam.m6.pot}}. Vous {{t:bluff|bluffez}} avec une main sans aucune chance en misant {{n:exam.m6.bet.quarter}}. À quelle fréquence votre adversaire doit-il se {{t:fold|coucher}} pour que ce {{t:bluff|bluff}} atteigne le seuil de rentabilité ?"
    options:
      - { text: "Plus souvent que dans {{n:exam.m6.alpha.quarter}} des cas", correct: true, why: "Oui : alpha = mise ÷ ({{t:pot|pot}} + mise) = {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}}) = {{n:exam.m6.alpha.quarter}}. Un petit {{t:bluff|bluff}} risque peu, il lui suffit donc que l’adversaire se {{t:fold|couche}} rarement." }
      - { text: "Plus souvent que dans {{n:exam.m6.mdf.quarter}} des cas", why: "Ça, c’est la {{t:mdf}} : la part de la {{t:range|range}} que l’adversaire devrait défendre. L’alpha en est le complément : {{n:exam.m6.alpha.quarter}}." }
      - { text: "Plus souvent que dans {{n:eq.bet-quarter}} des cas", why: "Ça, c’est l’équité dont l’adversaire a besoin pour {{t:call|suivre}} ; le dénominateur contient aussi son {{t:call|call}}. Le seuil pour un {{t:bluff|bluff}} est mise ÷ ({{t:pot|pot}} + mise) = {{n:exam.m6.alpha.quarter}}." }
  - kind: choice
    id: m6.exam.q3
    family: m6.mdf-concept
    rules: [R-M6-003]
    prompt: "Vous défendez la {{t:big-blind|grosse blinde}} contre une {{t:open|ouverture}} du Bouton. Au flop, le Bouton {{t:bet|mise}} 1/4 du {{t:pot|pot}} en c-bet. Un ami se {{t:fold|couche}} ici avec plus de la moitié de ses mains, car « la {{t:mdf}} n’est qu’un point de repère ». Qu’est-ce qui ne va pas ?"
    table: { position: BB }
    options:
      - { text: "Au flop, vous pouvez défendre un peu moins que la {{t:mdf}}, mais vous ne vous {{t:fold|couchez}} pas massivement face aux petits c-bets", correct: true, why: "Oui : face à un c-bet de 1/4 du {{t:pot|pot}}, la {{t:mdf}} est de {{n:exam.m6.mdf.quarter}}. Au flop, {{t:out-of-position|hors position}}, vous pouvez défendre un peu moins, car les {{t:bluff|bluffs}} du Bouton ont encore de l’équité, mais se {{t:fold|coucher}} avec plus de la moitié des mains lui offre le {{t:pot|pot}} pour presque rien." }
      - { text: "Rien : au flop, la {{t:mdf}} ne s’applique pas du tout", why: "Au flop, la {{t:mdf}} est un point de repère : vous pouvez défendre un peu moins, mais pas aussi peu que vous le voulez. Face à un petit c-bet, vous avez de toute façon beaucoup de mains avec assez d’équité." }
      - { text: "Au flop, il faut défendre plus que la {{t:mdf}}", why: "C’est l’inverse : au flop, {{t:out-of-position|hors position}}, vous pouvez défendre un peu moins, car vous ne réaliserez pas toute l’équité des mains faibles. L’erreur de votre ami, c’est qu’il se {{t:fold|couche}} beaucoup trop." }
  - kind: choice
    id: m6.exam.q4
    family: m6.exploit
    rules: [R-M6-004]
    prompt: "Micro-limites. Un {{t:recreational|joueur récréatif}} passif, qui {{t:bluff|bluffe}} rarement, {{t:bet|mise}} 3/4 du {{t:pot|pot}} à la river. Vous avez une {{t:pair|paire}} de dames, et le {{t:board|board}} contient un as et un roi. Que faites-vous ?"
    table: { hand: "Qd Qc", board: "Ah Jd 7c 4s Ks" }
    options:
      - { text: "Je me {{t:fold|couche}}", correct: true, why: "Oui : votre {{t:pair|paire}} est plus basse que l’as et le roi du {{t:board|board}}, elle bat donc surtout des {{t:bluff|bluffs}}. Ce joueur {{t:bluff|bluffe}} rarement, donc face à lui vous vous {{t:fold|couchez}} plus souvent que ne l’indique la {{t:mdf}}." }
      - { text: "Je {{t:call|suis}}, car la {{t:mdf}} demande de défendre env. {{n:exam.m6.mdf.three-quarters}}", why: "La {{t:mdf}} suppose que l’adversaire {{t:bluff|bluffe}} assez souvent. Ce joueur ne le fait pas, donc un {{t:call|call}} paie surtout des mains meilleures." }
      - { text: "Je {{t:raise|relance}}", why: "Après une {{t:raise|relance}}, les mains moins bonnes se {{t:fold|couchent}} et les meilleures paient. Une {{t:pair|paire}} plus basse que deux cartes du {{t:board|board}} n’est pas une main pour {{t:raise|relancer}}." }
  - kind: choice
    id: m6.exam.q5
    family: m6.flop.price
    rules: [R-M6-005]
    prompt: "Flop. Le {{t:pot|pot}} est de {{n:exam.m6.pot}}. Le Bouton {{t:bet|mise}} une fois {{n:exam.m6.bet.quarter}}, et dans une autre main {{n:exam.m6.bet.three-quarters}}. De combien d’équité avez-vous besoin pour {{t:call|suivre}} dans chacun de ces cas ?"
    table: { position: BB }
    options:
      - { text: "Env. {{n:eq.bet-quarter}} et {{n:eq.bet-three-quarters}}", correct: true, why: "Oui : mise ÷ ({{t:pot|pot}} + 2·mise). {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}} + {{n:exam.m6.bet.quarter}}) = {{n:eq.bet-quarter}}, et {{n:exam.m6.bet.three-quarters}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}} + {{n:exam.m6.bet.three-quarters}}) = {{n:eq.bet-three-quarters}}. Face à une mise plus grosse, vous défendez avec une {{t:range|range}} plus étroite." }
      - { text: "Env. {{n:exam.m6.alpha.quarter}} et {{n:eq.bet-three-quarters}}", why: "Le premier nombre est l’alpha (mise ÷ ({{t:pot|pot}} + mise)), c’est-à-dire le seuil pour le {{t:bluff|bluff}} du Bouton. Dans le prix pour {{t:call|suivre}}, ajoutez aussi votre propre {{t:call|call}} : {{n:eq.bet-quarter}}." }
      - { text: "Autant dans les deux cas, car c’est le même {{t:pot|pot}}", why: "Non : le prix dépend de la taille de la mise. Une mise plus grosse, c’est un prix moins bon : {{n:eq.bet-three-quarters}} au lieu de {{n:eq.bet-quarter}}." }
  - kind: choice
    id: m6.exam.q6
    family: m6.flop.call
    rules: [R-M6-006]
    prompt: "Vous défendez la {{t:big-blind|grosse blinde}} contre une {{t:open|ouverture}} du Bouton. Au flop, vous {{t:check|checkez}}, et le Bouton {{t:bet|mise}} 1/3 du {{t:pot|pot}} en c-bet. Vous avez une hauteur As, sans {{t:draw|tirage}}. Que faites-vous ?"
    table: { hand: "Ac 6h", board: "Js 8d 3d", position: BB }
    options:
      - { text: "Je {{t:call|suis}}", correct: true, why: "Oui : face à un petit c-bet, il vous faut seulement env. {{n:eq.bet-third}} d’équité. Une hauteur As bat une partie des {{t:bluff|bluffs}} du Bouton et peut toucher une {{t:pair|paire}}, donc vous la défendez généralement. Vous vous {{t:fold|couchez}} avec les mains les plus faibles, sans {{t:pair|paire}} ni {{t:draw|tirage}}." }
      - { text: "Je me {{t:fold|couche}}", why: "Trop serré : face à un petit c-bet, une hauteur As se défend généralement. Vous vous {{t:fold|couchez}} avec des mains plus faibles, sans {{t:pair|paire}} ni {{t:draw|tirage}}." }
      - { text: "Check-raise", why: "Vous faites un check-raise surtout avec vos mains les plus fortes et vos {{t:draw|tirages}}. Cette main n’a ni valeur, ni {{t:draw|tirage}} qui lui donnerait une deuxième façon de gagner." }
  - kind: choice
    id: m6.exam.q7
    family: m6.flop.fold
    rules: [R-M6-007]
    prompt: "Vous défendez la {{t:big-blind|grosse blinde}} contre une {{t:open|ouverture}} du Bouton. Sur le flop [[8c 4d 2h]], vous {{t:check|checkez}}, et le Bouton {{t:bet|mise}} 3/4 du {{t:pot|pot}} en c-bet. Avec laquelle de ces mains un {{t:call|call}} a-t-il plus de sens ?"
    table: { board: "8c 4d 2h", position: BB }
    options:
      - { text: "[[Ad Jd]]", correct: true, why: "Oui : les deux mains sont deux cartes hautes sans {{t:pair|paire}}, mais AJ à carreau a en plus un {{t:flush-draw|tirage couleur}} (backdoor) vers la {{t:flush|couleur}} la plus haute : avec un carreau sur le {{t:board|board}}, il lui faut encore deux carreaux. Face à un gros c-bet, c’est plutôt avec ce genre de main que vous {{t:call|suivez}}." }
      - { text: "[[Ks Qs]]", why: "KQ à pique n’a ici aucun {{t:draw|tirage}} : il n’y a pas de pique sur le {{t:board|board}}, et la {{t:straight|quinte}} est trop loin. Face à un gros c-bet, vous vous {{t:fold|couchez}} généralement avec deux cartes hautes sans {{t:draw|tirage}}." }
  - kind: choice
    id: m6.exam.q8
    family: m6.xr.semibluff
    rules: [R-M6-008]
    prompt: "Vous défendez la {{t:big-blind|grosse blinde}} contre une {{t:open|ouverture}} du Bouton. Sur le flop [[Jh 8c 4h]], vous {{t:check|checkez}}, et le Bouton {{t:bet|mise}} 1/3 du {{t:pot|pot}} en c-bet. Avec laquelle de ces mains vaut-il mieux faire un check-raise ?"
    table: { board: "Jh 8c 4h", position: BB }
    options:
      - { text: "[[Qh Th]]", correct: true, why: "Oui : un {{t:flush-draw|tirage couleur}} plus un gutshot (le neuf), c’est un {{t:draw|tirage}} fort. Le check-raise gagne quand le Bouton se {{t:fold|couche}}, et s’il paie, vous avez encore de nombreux outs." }
      - { text: "[[Jd 5d]]", why: "Une {{t:top-pair|top paire}} avec un kicker faible est une main pour {{t:call|suivre}}. Après un check-raise, les mains moins bonnes se {{t:fold|couchent}} généralement et les meilleures paient." }
      - { text: "[[As 3c]]", why: "Une hauteur As sans {{t:draw|tirage}} n’a pas de deuxième façon de gagner. Vous faites un check-raise en {{t:bluff|bluff}} surtout avec des {{t:draw|tirages}}." }
  - kind: numeric
    id: m6.exam.q9
    family: m6.xr.size
    rules: [R-M6-010]
    prompt: "Flop. Le {{t:pot|pot}} est de {{n:exam.m6.pot}}, et le Bouton {{t:bet|mise}} {{n:exam.m6.bet.quarter}} en petit c-bet. Vous faites un check-raise à {{n:xr.mult.example}} le montant du c-bet. À combien {{t:raise|relancez}}-vous ? Saisissez le nombre de {{t:chips|jetons}}."
    table: { position: BB }
    answer: exam.m6.xr
    explanation: "{{n:exam.m6.bet.quarter}} × {{n:xr.mult.example}} = {{n:exam.m6.xr}}. Face à un petit c-bet, vous {{t:raise|relancez}} plus près de la limite haute de l’intervalle {{n:xr.mult.low}}–{{n:xr.mult.example}} : un check-raise minimum donnerait au Bouton un très bon prix."
  - kind: choice
    id: m6.exam.q10
    family: m6.xr.when
    rules: [R-M6-009]
    prompt: "Vous défendez la {{t:big-blind|grosse blinde}} contre une {{t:open|ouverture}} du Bouton. Sur quel flop faites-vous le plus souvent un check-raise ?"
    table: { position: BB }
    options:
      - { text: "[[8d 6c 5h]]", correct: true, why: "Oui : sur un flop bas et {{t:connected|connecté}}, la {{t:big-blind|grosse blinde}} a plus de mains très fortes ({{t:two-pair|doubles paires}}, {{t:straight|quintes}}) que le Bouton, donc elle y fait plus souvent un check-raise." }
      - { text: "[[Ks Qd Jh]]", why: "Un flop haut avec des cartes proches les unes des autres touche bien la {{t:range|range}} du Bouton (AK, AQ, KQ, {{t:pair|paires}} hautes). Ici, vous faites moins souvent un check-raise." }
      - { text: "[[Ah Ad Qc]]", why: "Sur un flop avec une {{t:pair|paire}} d’as, c’est plus souvent le Bouton, qui a {{t:open|ouvert}} avec beaucoup d’as, qui a les mains les plus fortes. Vous faites rarement un check-raise ici." }
