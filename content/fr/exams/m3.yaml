# Pula egzaminacyjna M3 (pozycja, ręce startowe, zakresy otwarć): reguły lekcji m3.l1–m3.l3, inne ręce i pozycje.
# Decyzje otwarcia zgodne ze spotami solvera aplikacji (rfi.*): ręce poza listą klas niepewnych, częstość 0 albo ≥ 0,94.
module: m3
drills:
  - kind: choice
    id: m3.exam.q1
    family: m3.position
    rules: [R-M3-001]
    prompt: "Le Button {{t:open|a ouvert}}, la {{t:small-blind}} {{t:fold|s'est couchée}} et la {{t:big-blind}} {{t:call|a suivi}}. Qui parle en premier au flop ?"
    options:
      - { text: "{{t:big-blind|La grosse blind}}", correct: true, why: "À partir du flop, les blinds parlent en premier et le Button en dernier. C'est pourquoi le Button a ici la {{t:position}}, et la {{t:big-blind}} joue {{t:out-of-position}}." }
      - { text: "Le Button, car il {{t:open|a ouvert}}", why: "L'ordre de parole dépend de la place à la table, et non de celui qui {{t:open|a ouvert}}. À partir du flop, le Button parle toujours en dernier." }
      - { text: "Celui qui a parlé en dernier préflop", why: "Préflop, les blinds parlent en dernier, mais à partir du flop, en premier. C'est pour cela que la {{t:position}} du Button est la meilleure." }
  - kind: choice
    id: m3.exam.q2
    family: m3.open-early
    rules: [R-M3-002]
    prompt: "Vous parlez en premier préflop, personne n'est encore entré dans le coup. Que faites-vous ?"
    table: { hand: "Ac Td", position: UTG }
    options:
      - { text: "{{t:raise|Je relance}}", correct: true, why: "AT dépareillé fait partie de la {{t:range}} d'{{t:open|ouverture}} depuis {{t:utg}} (env. {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} mains). Le solver de l'application la joue toujours ici." }
      - { text: "{{t:fold|Je me couche}}", why: "Trop serré. Depuis {{t:utg}}, vous jouez étroit, mais AT est encore dans la {{t:range}}." }
      - { text: "Je complète la {{t:big-blind|grosse blind}}", why: "En premier, vous {{t:raise|relancez}} ou vous {{t:fold|vous couchez}}. Le limp cède l'{{t:initiative}} et la chance de remporter les blinds tout de suite." }
  - kind: choice
    id: m3.exam.q3
    family: m3.rfi.early
    rules: [R-M3-006]
    prompt: "{{t:utg}} {{t:fold|s'est couché}}, vous êtes le suivant. Que faites-vous ?"
    table: { hand: "Ah 9d", position: HJ }
    options:
      - { text: "{{t:fold|Je me couche}}", correct: true, why: "Il reste encore quatre joueurs derrière vous. A9 dépareillé touche souvent un as avec un kicker plus faible que les AT, AJ ou AQ adverses. Avec cette main, le solver de l'application {{t:fold|se couche}} toujours depuis le {{t:hijack|HJ}}." }
      - { text: "{{t:raise|Je relance}}", why: "L'as est tentant, mais depuis le {{t:hijack|HJ}}, vous {{t:open|ouvrez}} plus étroit que depuis le {{t:cutoff|CO}} et le Button. A9o n'entre que dans la {{t:range}} du {{t:cutoff|CO}}." }
  - kind: choice
    id: m3.exam.q4
    family: m3.rfi.late
    rules: [R-M3-006]
    prompt: "Tous les joueurs avant vous {{t:fold|se sont couchés}}. Que faites-vous ?"
    table: { hand: "Ah 9d", position: CO }
    options:
      - { text: "{{t:raise|Je relance}}", correct: true, why: "Il ne reste derrière vous que le Button et les blinds, donc vous {{t:open|ouvrez}} plus large que depuis le {{t:hijack|HJ}}. Le solver de l'application joue ici A9o presque toujours." }
      - { text: "{{t:fold|Je me couche}}", why: "C'est ainsi que vous jouez cette main depuis le {{t:hijack|HJ}}. Depuis le {{t:cutoff|CO}}, il y a un joueur de moins derrière vous et la {{t:range}} est plus large." }
  - kind: choice
    id: m3.exam.q5
    family: m3.open-late
    rules: [R-M3-003]
    prompt: "Tout le monde {{t:fold|s'est couché}} jusqu'à vous. Que faites-vous ?"
    table: { hand: "Jd 9c", position: BTN }
    options:
      - { text: "{{t:raise|Je relance}}", correct: true, why: "Au Button, vous {{t:open|ouvrez}} env. {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} mains. Il ne reste que les blinds, et après le flop vous avez la {{t:position}}, donc J9 dépareillé passe." }
      - { text: "{{t:fold|Je me couche}}", why: "Depuis le {{t:cutoff|CO}}, le solver joue rarement cette main, mais au Button, toujours. Face aux seules blinds, c'est trop serré." }
      - { text: "Je complète la {{t:big-blind|grosse blind}}", why: "Le limp cède l'{{t:initiative}}. Une {{t:raise|relance}} remporte souvent les blinds tout de suite." }
  - kind: choice
    id: m3.exam.q6
    family: m3.rfi.sb
    rules: [R-M3-004, R-M3-007, R-M3-009]
    prompt: "Tout le monde {{t:fold|s'est couché}} jusqu'à vous, en {{t:small-blind|petite blind}}. Que faites-vous ?"
    table: { hand: "Td 8c", position: SB }
    options:
      - { text: "{{t:raise|Je relance}} à {{n:pf.open-size-sb}}", correct: true, why: "Vous ne jouez plus que contre la {{t:big-blind|grosse blind}}, donc vous {{t:open|ouvrez}} large, env. {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}} mains. Après le flop, vous parlez en premier, c'est pourquoi depuis la {{t:small-blind|petite blind}} vous {{t:raise|relancez}} un peu plus gros que depuis les autres {{t:position|positions}}." }
      - { text: "{{t:raise|Je relance}} à {{n:pf.open-size}}", sizeError: true, why: "Bonne action, mauvaise taille : {{n:pf.open-size}} correspond à l'{{t:open}} depuis les autres {{t:position|positions}}. Depuis la {{t:small-blind|petite blind}}, vous jouez {{t:out-of-position}}, donc vous {{t:raise|relancez}} à {{n:pf.open-size-sb}}." }
      - { text: "Je complète la {{t:big-blind|grosse blind}}", why: "En entrant en premier, vous {{t:raise|relancez}} ou vous {{t:fold|vous couchez}} (depuis la {{t:small-blind|petite blind}}, c'est une simplification : certaines solutions de solvers complètent ici avec une partie des mains). Compléter cède l'{{t:initiative}} et la chance de remporter les blinds tout de suite." }
      - { text: "{{t:fold|Je me couche}}", why: "Trop serré : face à un seul adversaire, le solver de l'application joue toujours T8o depuis la {{t:small-blind|petite blind}}." }
  - kind: numeric
    id: m3.exam.n1
    family: m3.open-early
    rules: [R-M3-007]
    prompt: "Tous les joueurs avant vous {{t:fold|se sont couchés}}, vous êtes au {{t:hijack|HJ}} et vous {{t:open|ouvrez}}. À combien de bb {{t:raise|relancez-vous}} ? Saisissez un nombre."
    table: { hand: "Kh Qh", position: HJ }
    answer: pf.open-size
    explanation: "Vous {{t:open|ouvrez}} à {{n:pf.open-size}} depuis toutes les {{t:position|positions}} sauf la {{t:small-blind|petite blind}} (là, {{n:pf.open-size-sb}}). Une taille unique est simple et ne trahit pas la force de votre main. C'est une simplification : depuis les {{t:early-position|premières positions}}, les solvers {{t:open|ouvrent}} un peu plus petit."
  - kind: choice
    id: m3.exam.q7
    family: m3.suited
    rules: [R-M3-005]
    prompt: "Pourquoi T9 assorti joue-t-il mieux que T9 dépareillé ?"
    options:
      - { text: "Il a un moyen supplémentaire de gagner : la {{t:flush|couleur}}", correct: true, why: "Les rangs sont les mêmes, donc vous touchez les {{t:pair|paires}} et les {{t:straight|quintes}} aussi souvent. Une main assortie y ajoute la chance d'une {{t:flush|couleur}}." }
      - { text: "Il touche plus souvent une {{t:pair|paire}}", why: "La chance de toucher une {{t:pair|paire}} dépend des rangs, et ils sont identiques." }
      - { text: "Il touche plus souvent une {{t:straight|quinte}}", why: "Les {{t:straight|quintes}} dépendent des rangs des cartes, et non du fait que les cartes soient assorties." }
  - kind: choice
    id: m3.exam.q8
    family: m3.premium
    rules: [R-M3-008]
    prompt: "{{t:utg}} {{t:raise|a relancé}}, les autres {{t:fold|se sont couchés}} jusqu'à vous. Que faites-vous ?"
    table: { hand: "Ks Kd", position: BTN }
    options:
      - { text: "{{t:raise|Je relance}} à nouveau (3-bet)", correct: true, why: "KK est l'une des mains les plus fortes et favorite face à la plupart des mains avec lesquelles {{t:utg}} {{t:open|ouvre}}. Le 3-bet fait grossir le {{t:pot}} et vous laisse généralement face à un seul adversaire." }
      - { text: "Je {{t:call|suis}} seulement", why: "Cela se joue parfois pour brouiller les pistes, mais en règle générale, vous perdez de la valeur et laissez entrer les blinds à bas prix." }
      - { text: "{{t:fold|Je me couche}}, car {{t:utg}} a une {{t:range}} forte", why: "La {{t:range}} de {{t:utg}} est étroite, mais KK reste nettement favori face à elle." }
  - kind: paint
    id: m3.exam.p-co
    family: m3.paint.late
    rules: [R-M3-006]
    spot: rfi.co
    prompt: "Tous les joueurs avant vous {{t:fold|se sont couchés}}, vous êtes au {{t:cutoff|CO}}. Coloriez les mains avec lesquelles vous {{t:open|ouvrez}}."
