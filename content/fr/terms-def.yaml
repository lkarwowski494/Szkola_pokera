royal-flush: "La combinaison la plus forte au poker : as, roi, dame, valet et dix de la même couleur, p. ex. A♠ K♠ Q♠ J♠ T♠."
straight-flush: "Cinq cartes consécutives de la même couleur, p. ex. 5♥ 6♥ 7♥ 8♥ 9♥. La version la plus haute (de l'as au dix) porte un nom à part et c'est la combinaison la plus forte du jeu."
four-of-a-kind: "Quatre cartes de même valeur, p. ex. quatre sept. Entre deux carrés de même valeur, c'est la cinquième carte la plus haute (le kicker) qui l'emporte."
full-house: "Un brelan et une paire dans la même main, p. ex. trois dames et deux cinq. Entre deux fulls, le brelan le plus haut l'emporte."
flush: "Cinq cartes du même symbole (♠, ♥, ♦ ou ♣) qui ne se suivent pas. Entre deux mains de ce type, celle qui a la carte la plus haute l'emporte ; à égalité, c'est la carte suivante qui décide."
straight: "Cinq cartes consécutives, pas toutes de la même couleur, p. ex. 5-6-7-8-9. L'as peut être la carte la plus haute (A-K-Q-J-T) ou la plus basse (A-2-3-4-5)."
three-of-a-kind: "Trois cartes de même valeur et deux autres cartes. Au hold'em, il en existe deux variantes qui ont leur propre nom : le set, quand la paire est dans votre main et la troisième carte sur le board, et les trips, quand la paire est sur le board et la troisième carte dans votre main."
set: "Brelan formé d'une paire en main et d'une carte du board, p. ex. 7♣ 7♦ sur un flop K-7-2."
two-pair: "Deux paires différentes et une cinquième carte, p. ex. K-K-8-8-3. En cas d'égalité, on compare d'abord la paire la plus haute, puis la plus basse, et enfin la cinquième carte."
pair: "Deux cartes de même valeur et trois autres cartes, p. ex. deux neuf. Seule la carte haute est plus faible."
high-card: "Main sans paire ni meilleure combinaison ; sa force dépend de la carte la plus haute, puis des suivantes en cas d'égalité."
kicker: "La carte la plus haute en dehors de la combinaison, qui départage une égalité. Exemple : une paire d'as avec un roi bat une paire d'as avec une dame."
wheel: "La quinte la plus basse : A-2-3-4-5, où l'as compte comme la carte la plus basse."
check: "Continuer sans mettre de jetons, ce qui n'est possible que si vous n'avez rien à ajouter : personne n'a encore misé dans ce tour d'enchères (avant le flop, la grosse blinde peut le faire si personne n'a relancé). À ne pas confondre avec « suivre » (call), qui consiste à ajouter des jetons pour égaler la mise d'un adversaire."
bet: "Premiers jetons mis dans un tour d'enchères où personne n'a encore misé (au sens large, on appelle mise tous les jetons placés dans le pot)."
call: "Mettre dans le pot le montant de la mise ou de la relance d'un adversaire pour continuer à jouer. À ne pas confondre avec le check, qui consiste à continuer sans miser quand personne n'a misé."
raise: "Augmenter le montant au-delà de la mise d'un adversaire ; les autres joueurs doivent ajouter la différence, relancer à leur tour ou se coucher. On dit aussi « raise »."
fold: "Abandonner la main : vous jetez vos cartes et perdez ce que vous avez déjà mis dans le pot."
check-raise: "Vous checkez d'abord, puis, quand un adversaire mise, vous le relancez dans le même tour d'enchères."
all-in: "Miser tous vos jetons. Vous ne pouvez alors gagner contre chaque adversaire qu'au maximum ce que vous avez vous-même mis ; le reste se joue dans un pot secondaire."
pot: "Tous les jetons misés dans la main en cours. Ils reviennent au joueur qui a la meilleure main au showdown (avec des pots secondaires, chaque pot est attribué séparément) ou au joueur qui reste quand tous les autres se sont couchés."
side-pot: "Pot séparé créé quand un joueur est all-in : seuls les joueurs qui ont mis plus que lui le disputent, donc le joueur all-in ne peut pas le gagner."
split-pot: "Situation où des joueurs ayant des mains égales se partagent le pot, p. ex. quand tous deux jouent la même quinte présente sur le board."
playing-the-board: "Situation où votre meilleure main de cinq cartes n'est composée que de cartes communes ; vos cartes privatives n'apportent rien, donc au mieux vous partagez le pot."
board: "Les cartes communes visibles au centre (flop, turn, river), utilisées par tous les joueurs. Le terme désigne les cartes, pas la table où l'on joue (s'asseoir à la table, table finale)."
community-cards: "Cartes posées face visible au centre, que chaque joueur peut utiliser pour former sa main ; au hold'em, il y en a cinq."
hole-cards: "Les deux cartes face cachée que vous recevez au début d'une main au hold'em ; vous seul les voyez."
small-blind: "La plus petite mise obligatoire, posée avant la donne par le joueur à gauche du bouton (à deux joueurs, par le bouton lui-même) ; c'est aussi le nom de cette place à la table."
big-blind: "La plus grosse mise obligatoire, posée avant la donne par le deuxième joueur à gauche du bouton (à deux joueurs, par le joueur face au bouton) ; c'est aussi le nom de cette place. Elle sert aussi d'unité pour mesurer les stacks et les résultats."
chips: "Les disques avec lesquels on joue à la table ; en cash game, ils représentent de l'argent, en tournoi, des points de tournoi."
stack: "Tous les jetons qu'un joueur a devant lui ; on l'exprime généralement en grosses blindes (p. ex. 100 grosses blindes)."
street: "Nom familier d'un tour d'enchères : le preflop, le flop, le turn et la river sont les quatre streets. Exemple : « de la value sur trois streets » désigne des mises de value au flop, au turn et à la river."
betting-round: "Étape de la main où les joueurs, chacun leur tour, checkent, misent, suivent, relancent ou se couchent ; au hold'em, il y en a quatre : preflop, flop, turn et river."
preflop: "Le premier tour d'enchères : après la distribution des cartes privatives, avant l'arrivée du flop."
flop: "Les trois premières cartes communes, posées ensemble après les enchères du preflop ; c'est aussi le nom du deuxième tour d'enchères."
turn: "La quatrième carte commune et le troisième tour d'enchères."
river: "La cinquième et dernière carte commune, et le dernier tour d'enchères avant le showdown."
showdown: "Le moment où l'on dévoile les cartes après le dernier tour d'enchères, quand au moins deux joueurs sont encore dans la main ; la meilleure main remporte le pot."
position: "Votre place à la table par rapport au bouton, qui fixe l'ordre de parole. Celui qui parle plus tard voit davantage d'actions adverses avant de décider."
in-position: "Situation du joueur qui parle en dernier après le flop et voit donc l'action de l'adversaire avant de décider."
out-of-position: "Situation du joueur qui parle avant l'adversaire après le flop et décide donc sans connaître son action."
early-position: "Les premières places à parler avant le flop (p. ex. UTG) ; beaucoup de joueurs doivent encore parler après vous."
late-position: "Les places qui parlent en dernier : le bouton et les places juste avant lui, surtout le cutoff."
utg: "Le premier joueur à parler avant le flop, assis juste à gauche de la grosse blinde."
hijack: "La place juste avant le cutoff, c'est-à-dire la deuxième à droite du bouton."
cutoff: "La place juste à droite du bouton, qui parle juste avant lui."
button: "La place du donneur, marquée par un disque « dealer ». Après le flop, elle parle en dernier à chaque tour d'enchères."
outs: "Carte encore dans le paquet qui améliorera votre main, généralement en complétant un tirage. Exemple : avec un tirage couleur, vos outs sont les cartes restantes de votre couleur."
draw: "Main qui n'est pas encore une combinaison forte mais peut le devenir avec les prochaines cartes communes, p. ex. quand il vous manque une carte pour une couleur ou une quinte."
flush-draw: "Quatre cartes de la même couleur (en main et sur le board réunis) ; il en manque une pour avoir une couleur."
straight-draw: "Quatre cartes auxquelles il en manque une pour faire une quinte. Variantes : OESD (la carte manquante peut être à l'un des deux bouts) et gutshot (la carte manque au milieu)."
oesd: "Abréviation de open-ended straight draw : tirage quinte formé de quatre cartes consécutives, complété par une carte à l'un ou l'autre bout, p. ex. 5-6-7-8 attend un quatre ou un neuf."
gutshot: "Tirage quinte auquel il manque une valeur précise au milieu, p. ex. 5-6-8-9 n'attend qu'un sept."
backdoor: "Tirage au flop qui a besoin de deux cartes favorables d'affilée, au turn et à la river, p. ex. trois cartes de la même couleur après le flop."
pot-odds: "Rapport entre le montant que vous devez payer et le pot que vous pouvez gagner (mise adverse comprise). Il indique à quelle fréquence vous devez gagner pour que suivre soit rentable."
implied-odds: "La cote du pot augmentée des jetons que vous comptez gagner sur les streets suivantes si vous touchez votre main."
equity: "Votre chance de remporter le pot si toutes les cartes restantes étaient distribuées sans autres enchères ; généralement exprimée en pourcentage."
equity-realization: "La mesure dans laquelle une main transforme son équité en gains quand les enchères continuent (elle peut en réaliser moins ou plus que son équité) ; cela dépend notamment de la position et de la facilité à jouer la main."
expected-value: "Le résultat moyen d'une action si on la répétait de nombreuses fois. Une action positive en moyenne rapporte sur le long terme, même si elle perd cette fois-ci."
combo: "Une combinaison précise de deux cartes avec leurs couleurs, p. ex. A♠ K♥. Compter ces combinaisons montre combien de mains d'un type donné figurent réellement dans une range."
range: "L'ensemble des mains qu'un joueur peut avoir dans une situation donnée, ou des mains avec lesquelles il ferait une action donnée."
mixed-hand: "Main avec laquelle la stratégie d'équilibre choisit tantôt une action, tantôt une autre (p. ex. parfois une relance, parfois un call) ; les deux actions sont correctes. On dit aussi qu'une telle main se joue en stratégie mixte."
open: "Entrer dans le pot avant le flop par une relance quand tous les joueurs avant vous se sont couchés."
suited: "Deux cartes privatives de la même couleur, p. ex. A♥ K♥ (notation AKs)."
offsuit: "Deux cartes privatives de couleurs différentes, p. ex. A♥ K♣ (notation AKo)."
pocket-pair: "Paire formée par vos deux cartes privatives, p. ex. 8♣ 8♦ avant le flop."
connectors: "Cartes privatives de valeurs voisines, p. ex. 8-7 ou 9-8 ; elles forment plus facilement une quinte."
3-bet: "La première relance d'une ouverture avant le flop ; le nom compte la grosse blinde comme première mise et l'ouverture comme deuxième."
4-bet: "Relance d'un 3-bet, c'est-à-dire la quatrième mise du tour d'enchères."
limp: "Entrer dans le pot avant le flop en se contentant de suivre la grosse blinde, quand personne n'a encore relancé."
isolation: "Relance après un ou plusieurs limps, pour jouer contre le limpeur (souvent un joueur plus faible) en tête-à-tête."
texture: "Le caractère des cartes communes : combien de couleurs il y a, si les cartes sont proches les unes des autres, s'il y a une paire. Cela détermine les mains et les tirages possibles."
dry: "Board sur lequel peu de tirages et de mains fortes sont possibles, p. ex. K♠ 7♦ 2♣."
wet: "Board sur lequel de nombreux tirages et mains fortes sont possibles, p. ex. J♥ T♥ 8♣."
rainbow: "Flop dont les trois cartes sont de trois couleurs différentes, si bien que personne n'a de tirage couleur au flop."
two-tone: "Flop dont deux cartes sont de la même couleur, si bien que des tirages couleur sont possibles."
monotone: "Flop dont les trois cartes sont de la même couleur, si bien qu'une couleur peut déjà être faite."
paired: "Board sur lequel il y a une paire (deux cartes de même valeur), p. ex. 8-8-3."
connected: "Board sur lequel quelqu'un a déjà pu faire une quinte, p. ex. 9-8-7."
disconnected: "Board aux cartes éloignées les unes des autres, avec lequel il est difficile de former une quinte ou un tirage quinte, p. ex. K-7-2."
semi-connected: "Board sur lequel il existe des tirages quinte, mais où aucune quinte n'est encore possible, p. ex. T-8-3 (classification adoptée dans ce cours)."
wetness: "Le degré auquel un board favorise les tirages et les mains fortes : de sec à humide. On parle aussi du degré de coordination du board."
top-pair: "Paire formée avec la carte la plus haute du board, p. ex. K♠ Q♦ sur un flop K-7-2."
second-pair: "Paire formée avec la deuxième carte la plus haute du board, p. ex. 7♠ 6♠ sur un flop K-7-2."
overpair: "Paire servie supérieure à toutes les cartes du board, p. ex. Q-Q sur un flop J-7-2."
c-bet: "Mise de continuation : mise du joueur qui était l'agresseur au tour précédent, p. ex. une mise au flop après avoir ouvert au preflop."
aggressor: "Le joueur qui a misé ou relancé en dernier au tour d'enchères précédent."
initiative: "Le rôle du dernier agresseur : c'est généralement lui qui fait la mise suivante."
range-advantage: "Situation où la range d'un joueur a, sur un board donné, une équité totale supérieure à celle de la range adverse."
nuts-advantage: "Situation où un joueur a proportionnellement plus de mains parmi les plus fortes dans sa range que l'adversaire."
nuts: "La main la plus forte possible sur un board donné à un moment donné. Exemple : sur le board K♥ 9♥ 4♥ 2♣, c'est la couleur à l'as de cœur."
polarized: "Se dit d'une range composée surtout de mains très fortes et de bluffs, presque sans mains moyennes."
polarization: "Construire une range à partir des extrêmes : mains fortes pour la value et bluffs, sans mains moyennes."
linear: "Se dit d'une range construite par le haut, des mains les plus fortes vers le bas, sans groupe de bluffs à part. On rencontre aussi le terme apparenté « merged range » (range non polarisée) ; selon les analyses de solveur publiées, merged est une forme intermédiaire entre cette range et une range polarisée."
condensed: "Se dit d'une range sans les mains les plus fortes (plafonnée) et composée surtout de mains moyennes ; le contraire d'une range polarisée."
value: "Miser avec une main forte pour que l'adversaire suive avec une main plus faible."
value-bet: "Une mise isolée pour la value : faite avec une main forte pour que des mains plus faibles la suivent."
bluff: "Mise avec une main faible qui a peu de chances de gagner au showdown, pour que l'adversaire couche une meilleure main."
semi-bluff: "Mise avec une main encore faible mais qui peut s'améliorer (p. ex. avec un tirage) : vous gagnez si l'adversaire se couche ou si vous touchez."
blocker: "Carte de votre main qui réduit la probabilité que l'adversaire ait certaines mains. Exemple : si vous avez l'as de cœur, l'adversaire ne peut pas avoir la couleur à l'as de cœur."
bluff-catcher: "Main qui ne bat que les bluffs de l'adversaire et perd contre ses mises de value."
barrel: "Nouvelle mise au tour d'enchères suivant, après votre propre mise au tour précédent."
second-barrel: "Deuxième mise d'affilée : après un c-bet au flop, le joueur mise de nouveau au turn."
probe-bet: "Mise au turn du joueur hors de position après que l'agresseur preflop a checké le flop au lieu de faire un c-bet."
donk-bet: "Mise d'un joueur qui mise avant que l'agresseur du tour précédent ait pu agir."
overbet: "Mise après le flop supérieure à la totalité du pot."
effective-stack: "Dans une main entre deux joueurs : le plus petit de leurs deux stacks, c'est-à-dire le maximum qui peut réellement être gagné ou perdu. Avec plusieurs joueurs, on le calcule séparément pour chaque paire."
spr: "Le stack effectif divisé par le pot au début d'une street (pour planifier la main, on le calcule au flop) ; il indique la profondeur des stacks par rapport au pot (plus le SPR est bas, plus vite tout finit dans le pot)."
mdf: "La plus petite part de la range qu'il faut défendre face à une mise pour qu'un bluff adverse avec une main sans chance ne soit pas automatiquement rentable."
alpha: "La fréquence à laquelle l'adversaire doit se coucher pour qu'un bluff avec une main sans chance soit à l'équilibre ; elle dépend de la taille de la mise par rapport au pot."
variance: "La dispersion des résultats autour de l'espérance de gain : même en jouant bien, les courtes séries peuvent être fortement négatives ou positives."
buy-in: "Le montant à payer pour entrer dans un tournoi ou s'asseoir à une table de cash game."
bankroll: "Toute la réserve consacrée uniquement au poker ; dans cette application, elle se compte en buy-ins, pas en argent."
tilt: "État dans lequel les émotions (colère, frustration, euphorie) dégradent vos décisions à la table."
winrate: "Résultat moyen d'un joueur sur un long échantillon ; en cash game, généralement en bb/100, c'est-à-dire en grosses blindes pour cent mains."
downswing: "Période de résultats nettement moins bons, généralement des pertes plus fortes que ce que justifierait le niveau de jeu ; le contraire d'un upswing."
session: "Une séance de poker, du début à la fin du jeu."
stakes: "Le niveau des blindes en cash game ou du buy-in en tournoi ; les « micro-limites » sont les niveaux les plus bas."
standard-deviation: "Mesure de la dispersion des résultats (racine carrée de la variance) ; au poker, généralement exprimée en bb/100."
risk-of-ruin: "Probabilité de perdre un jour toute votre bankroll si vous continuez à jouer à la même limite."
mental-game: "Le côté psychologique du poker : gérer le tilt, les émotions et la concentration à la table."
tournament: "Format de jeu où les blindes augmentent à intervalles réguliers et où la partie dure jusqu'à ce qu'un joueur ait tous les jetons ; les mieux classés reçoivent des prix."
push-fold: "Stratégie simplifiée pour les short stacks : avant le flop, on part soit all-in, soit on se couche."
shove: "Le fait de partir all-in, généralement sous forme de relance avant le flop."
icm: "Modèle qui convertit les jetons de tournoi en valeur monétaire en tenant compte de la structure des gains et des stacks de tous les joueurs."
bubble: "Phase d'un tournoi juste avant les places payées, quand il ne reste que quelques joueurs à éliminer avant d'atteindre les prix."
bubble-factor: "Indicateur issu de l'ICM : à quel point, en tournoi, perdre un nombre de jetons fait plus mal que gagner le même nombre ne fait du bien."
cover: "Avoir au moins autant de jetons que l'adversaire. Quand un adversaire vous couvre, perdre un all-in contre lui met fin à votre tournoi."
risk-premium: "Équité supplémentaire, au-delà de ce qu'exige la cote du pot, nécessaire en tournoi pour risquer un all-in, car perdre coûte plus que gagner ne rapporte."
m-ratio: "Le stack divisé par la somme des blindes et des antes d'une main : le nombre de tours de table complets (orbites) que vos jetons permettent de tenir sans jouer."
red-zone: "Zone de M très bas : il ne reste guère que le choix entre all-in et se coucher."
green-zone: "Zone de M élevé : le stack permet de jouer librement, de façon prudente ou agressive."
ante: "Petite contribution obligatoire au pot versée avant la donne par tous les joueurs (surtout en tournoi)."
bb-ante: "Format d'ante dans lequel, au lieu de tous les joueurs, c'est le joueur en grosse blinde qui paie l'ante pour toute la table."
fold-equity: "Part de la valeur d'une action qui vient de la possibilité que l'adversaire se couche."
gap-concept: "Principe selon lequel il faut une main plus forte pour suivre une ouverture que pour ouvrir soi-même."
chip-ev: "Espérance de gain d'une action comptée en jetons, sans les convertir en argent (sans ICM)."
tournament-equity: "Votre part attendue du prize pool compte tenu de la structure des gains et des stacks. On l'appelle aussi « $EV »."
prize-pool: "Somme d'argent à répartir entre les joueurs primés d'un tournoi."
payout: "Le prix attribué à une place précise dans un tournoi ; l'ensemble forme la répartition des prix."
pay-jump: "Différence de gains entre deux places voisines d'un tournoi ; les gros sauts augmentent la prime de risque."
final-table: "La dernière table d'un tournoi, où se jouent les plus gros prix."
short-stack: "Stack petit par rapport aux blindes ; en tournoi, généralement un stack qui ne représente plus que peu de grosses blindes."
nash-equilibrium: "Ensemble de stratégies dans lequel aucun joueur ne peut gagner en modifiant uniquement sa propre stratégie."
overcall: "Suivre une mise qu'un joueur avant vous a déjà suivie."
heads-up: "Jeu en tête-à-tête : il ne reste que deux joueurs à la table ou dans la main."
dead-money: "Jetons du pot provenant de joueurs qui ne peuvent plus le gagner, p. ex. de ceux qui se sont couchés."
stack-off: "Mettre tout son stack dans le pot au cours d'une main, c'est-à-dire partir all-in ou suivre un all-in."
exploit: "Écart volontaire par rapport à la stratégie de base pour profiter d'une erreur précise d'un adversaire ou de l'ensemble des joueurs."
hud: "Affichage superposé à la table en ligne, qui montre les statistiques des adversaires sur les mains jouées précédemment."
vpip: "Statistique du HUD : le pourcentage de mains où un joueur met volontairement de l'argent dans le pot avant le flop (en suivant ou en relançant)."
pfr: "Statistique du HUD : le pourcentage de mains où un joueur relance avant le flop."
wtsd: "Statistique du HUD : la fréquence à laquelle un joueur qui a vu le flop va jusqu'au showdown."
nit: "Joueur très serré qui n'entre dans le pot presque qu'avec des mains fortes."
regular: "Habitué d'une limite donnée, qui joue beaucoup de mains ; dans ce cours, il est opposé au joueur récréatif."
tag: "Style serré-agressif : peu de mains, mais jouées agressivement (mises et relances)."
lag: "Style large-agressif : beaucoup de mains, jouées agressivement."
recreational: "Joueur qui joue pour le plaisir et généralement moins bien que les habitués ; en argot, péjorativement, « fish »."
calling-station: "Terme péjoratif pour un joueur qui suit très souvent, même avec des mains faibles ou des tirages."
maniac: "Terme péjoratif pour un joueur très large et agressif, qui mise et relance avec n'importe quoi."
rake: "Commission que le casino ou la salle en ligne prélève sur le pot pour organiser la partie."
rake-cap: "Montant maximal de rake qu'une salle peut prélever sur une seule main."
