# sc-23: French text of content/pl/scenarios/sc-23.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-23
module: m8
situation: "Vous êtes au Bouton, et à la river la {{t:big-blind}} fait {{t:check}}. Vous envisagez un {{t:bluff}} avec l'une de deux mains qui, au {{t:showdown}}, ne battent aucune main de votre adversaire. Supposez que votre adversaire {{t:call|suivra}} avec AA, KK, QQ, JJ, tous les AK et AQ {{t:suited|assorti}}, et se {{t:fold|couchera}} avec KQ, KJ, QJ, QT et JT, tous {{t:suited|assortis}}. Quelle main choisissez-vous pour le {{t:bluff}} ?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [best-hand] }
decisions:
  - street: river
    kind: pick-hand
    rule: R-M8-007
    mode: blockers
    calls: [AA, KK, QQ, JJ, AKs, AKo, AQs]
    folds: [KQs, KJs, QJs, QTs, JTs]
    actions:
      - action: best-hand
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}. C'est le meilleur {{t:bluff}} : les deux mains perdent au {{t:showdown}}, mais celle-ci laisse à votre adversaire moins de {{t:combo|combinaisons}} avec lesquelles il va {{t:call|suivre}}, et pas moins de celles avec lesquelles il va se {{t:fold|coucher}}. Quand vous tenez une carte de ses mains fortes, votre adversaire a moins de {{t:combo|combinaisons}} de ces mains, donc il lui reste plus souvent une main à jeter."
      - action: other-hand
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}. Cette main est le {{t:bluff}} le plus faible : les deux perdent au {{t:showdown}}, mais l'autre main laisse à votre adversaire moins de mains avec lesquelles il va {{t:call|suivre}}, et pas moins de mains avec lesquelles il va se {{t:fold|coucher}}. Pour {{t:bluff|bluffer}}, vous choisissez une main avec un {{t:blocker|bloqueur}} de ses mains fortes, qui ne bloque pas plus de mains à jeter que l'autre."
