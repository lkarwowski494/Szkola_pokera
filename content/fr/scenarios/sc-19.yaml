# sc-19: French text of content/pl/scenarios/sc-19.yaml (role 06, session BS, 2026-11-10); machine translation in session, for review by role 09.
id: sc-19
module: m7
situation: "Avec des stacks courts, après un {{t:3-bet}}, vous avez un {{t:flush-draw}} ; votre adversaire {{t:bet|mise}} petit au flop et gros au turn."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 35
levels: [latwy, sredni]
bounds:
  latwy: { draws: [flush], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
  sredni: { draws: [flush], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
decisions:
  - street: flop
    kind: draw-call
    pots: [16, 18, 20, 22]
    fractions: [0.1, 0.2, 0.25]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} petit par rapport au {{t:pot}}. Vous {{t:call|suivez}}, car vous ne payez que pour une carte, et votre {{t:flush-draw}} touche sur cette carte plus souvent qu'un prix aussi bas ne l'exige. La {{t:flush}} arrive au turn dans environ {{n:odds.flush.flop-turn}} des cas, à peu près une carte sur cinq. C'est une simplification : vous ne comptez que les outs du tirage. Chacune de vos cartes plus hautes que le board ajoute encore au plus {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse."
      - action: fold
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} petit par rapport au {{t:pot}}. {{t:fold|Se coucher}}, c'est abandonner un {{t:pot}} où un {{t:call}} rapporte : contre une {{t:bet}} aussi petite, votre {{t:flush-draw}} touche plus souvent que le prix ne l'exige. C'est une simplification : vous ne comptez que les outs du tirage. Chacune de vos cartes plus hautes que le board ajoute encore au plus {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse."
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.6667, 0.75, 1]
    villain: bet
    rule: R-M7-008
    actions:
      - action: call
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}} : le turn n'a pas apporté la {{t:flush}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} gros. Un {{t:call}} compte sur les {{t:implied-odds|cotes implicites}}, et ici il n'y en a pas : avec un {{t:spr}} bas, il reste si peu de {{t:chips}} derrière le {{t:pot}} que, même si vous les gagnez tous après avoir touché, ils ne couvrent pas les {{t:call|calls}} perdus. Les cotes implicites ne comptent que lorsque votre adversaire a encore de quoi vous payer. C'est une simplification : vous ne comptez que les outs du tirage. Chacune de vos cartes plus hautes que le board ajoute encore au plus {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse."
      - action: fold
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}} : le turn n'a pas apporté la {{t:flush}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} gros. Vous vous {{t:fold|couchez}}, car la dernière carte touche moins souvent que le prix ne l'exige, et les {{t:implied-odds|cotes implicites}} n'y changent rien : avec un {{t:spr}} bas, il reste trop peu de {{t:chips}} derrière le {{t:pot}} pour que le gain après avoir touché compense les {{t:call|calls}} perdus. La {{t:flush}} arrive à la river dans environ {{n:odds.flush.turn-river}} des cas, à peu près une carte sur cinq. C'est une simplification : vous ne comptez que les outs du tirage. Chacune de vos cartes plus hautes que le board ajoute encore au plus {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse."
