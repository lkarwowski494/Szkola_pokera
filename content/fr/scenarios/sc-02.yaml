# sc-02: French text of content/pl/scenarios/sc-02.yaml (role 06, session BS, 2026-11-10); machine translation in session, for review by role 09.
id: sc-02
module: m2
situation: "Avec des stacks courts, après un {{t:3-bet}}, vous avez un {{t:oesd|tirage quinte bilatéral}} ; votre adversaire {{t:bet|mise}} petit au flop et gros au turn."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 35
levels: [latwy, sredni]
bounds:
  latwy: { draws: [oesd], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
  sredni: { draws: [oesd], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
decisions:
  - street: flop
    kind: draw-call
    pots: [16, 18, 20, 22]
    fractions: [0.05, 0.1, 0.2, 0.25]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} petit par rapport au {{t:pot}}. Vous {{t:call|suivez}}, car vous ne payez que pour une carte, et votre {{t:oesd|tirage quinte bilatéral}} touche sur cette carte plus souvent qu'un prix aussi bas ne l'exige. Vous avez {{n:outs.oesd}} outs, donc la {{t:straight}} arrive au turn dans environ {{n:odds.oesd.flop-turn}} des cas, à peu près une carte sur six. C'est une simplification : vous ne comptez que les outs du tirage.{{jesli:nadkarty}} Chacune de vos cartes plus hautes que le board ajoute encore au plus {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse.{{/jesli}}"
      - action: fold
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} petit par rapport au {{t:pot}}. {{t:fold|Se coucher}}, c'est abandonner un {{t:pot}} où un {{t:call}} rapporte : contre une {{t:bet}} aussi petite, votre {{t:oesd|tirage quinte bilatéral}} touche plus souvent que le prix ne l'exige. C'est une simplification : vous ne comptez que les outs du tirage.{{jesli:nadkarty}} Chacune de vos cartes plus hautes que le board ajoute encore au plus {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse.{{/jesli}}"
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.5, 0.6667, 0.75, 1]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}} : le turn n'a pas apporté la {{t:straight}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} gros. Un {{t:call}} perd : vous payez pour la dernière carte, et elle touche moins souvent que le prix ne l'exige. Les {{t:implied-odds|cotes implicites}} ne compensent pas cela, car avec des stacks courts il reste trop peu de {{t:chips}} derrière le {{t:pot}} : même si vous les gagnez tous après avoir touché, ils ne couvrent pas les {{t:call|calls}} perdus. C'est une simplification : vous ne comptez que les outs du tirage.{{jesli:nadkarty}} Chacune de vos cartes plus hautes que le board ajoute encore au plus {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse.{{/jesli}}"
      - action: fold
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}} : le turn n'a pas apporté la {{t:straight}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} gros. Vous vous {{t:fold|couchez}}, car vous payez pour la dernière carte, elle touche moins souvent que le prix ne l'exige, et il reste trop peu de {{t:chips}} derrière le {{t:pot}} pour que le fait de toucher compense cela. La {{t:straight}} arrive à la river dans environ {{n:odds.oesd.turn-river}} des cas, à peu près une carte sur six. C'est une simplification : vous ne comptez que les outs du tirage.{{jesli:nadkarty}} Chacune de vos cartes plus hautes que le board ajoute encore au plus {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse.{{/jesli}}"
