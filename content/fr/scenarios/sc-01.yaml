# sc-01: French text of content/pl/scenarios/sc-01.yaml (role 06, session BS, 2026-11-10); machine translation in session, for review by role 09.
id: sc-01
module: m2
situation: "Après un {{t:3-bet}}, vous avez un {{t:flush-draw}}, et votre adversaire {{t:bet|mise}} petit au flop et au turn."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni, trudny]
bounds:
  latwy: { draws: [flush], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
  sredni: { draws: [flush], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
  trudny: { draws: [flush], marginMin: 0, marginMax: 0.02, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
decisions:
  - street: flop
    kind: draw-call
    pots: [18, 20, 22, 24]
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} petit par rapport au {{t:pot}}. Vous {{t:call|suivez}}, car vous ne payez que pour une carte, et votre {{t:flush-draw}} touche sur cette carte plus souvent qu'un prix aussi bas ne l'exige. Vous avez {{n:outs.flush}} outs, donc la {{t:flush}} arrive au turn dans environ {{n:odds.flush.flop-turn}} des cas, à peu près une carte sur cinq. C'est une simplification : vous ne comptez que les outs du tirage. Chacune de vos cartes plus hautes que le board ajoute encore {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse."
      - action: fold
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} petit par rapport au {{t:pot}}. {{t:fold|Se coucher}}, c'est abandonner un {{t:pot}} où un {{t:call}} rapporte : contre une {{t:bet}} aussi petite, votre {{t:flush-draw}} touche plus souvent que le prix ne l'exige. Couchez-vous quand le prix est plus élevé que votre chance de toucher, et non parce que vous n'avez pas encore de main faite. C'est une simplification : vous ne comptez que les outs du tirage. Chacune de vos cartes plus hautes que le board ajoute encore {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse."
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}} : le turn n'a pas apporté la {{t:flush}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} de nouveau petit. Vous {{t:call|suivez}}, car il reste une carte avant la river, et à un prix aussi bas votre {{t:flush-draw}} touche encore assez souvent. La {{t:flush}} arrive à la river dans environ {{n:odds.flush.turn-river}} des cas, à peu près une carte sur cinq. C'est une simplification : vous ne comptez que les outs du tirage. Chacune de vos cartes plus hautes que le board ajoute encore {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse."
      - action: fold
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}} : le turn n'a pas apporté la {{t:flush}}, et votre adversaire en {{w:rywal}} {{t:bet|mise}} de nouveau petit. {{t:fold|Se coucher}} est trop serré : au turn, vous comptez la chance pour une carte, et contre une {{t:bet}} aussi petite cette carte touche plus souvent que le prix ne l'exige, donc vous abandonnez un {{t:pot}} où un {{t:call}} rapporte. C'est une simplification : vous ne comptez que les outs du tirage. Chacune de vos cartes plus hautes que le board ajoute encore {{n:pair.outs.per-rank}} outs incertains pour une {{t:pair|paire}}, mais ici cela ne change pas la réponse."
