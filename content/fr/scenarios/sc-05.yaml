# SC-05 (M3): Button otwiera, BB broni, niski połączony flop (range-spot rfi.btn, potem cbet-case R-M5-004). Rola 06, sesja EH, 2026-11-11.
# Struktura jak pl (content/pl/scenarios/sc-05.yaml).
id: sc-05
module: m3
situation: "Vous êtes au Bouton, et tout le monde avant vous s'est {{t:fold|couché}}."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [rainbow], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
  sredni:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [two-tone], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.btn
    rule: R-M3-003
    actions:
      - action: "raise 2.5"
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, {{w:stol}}, et tout le monde avant vous s'est {{t:fold|couché}}. Vous {{t:open|ouvrez}}, car il ne reste que les blindes et après le flop vous aurez la {{t:position}} ; depuis le Bouton, vous {{t:open|ouvrez}} large, environ {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} des mains."
      - action: fold
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, {{w:stol}}, et tout le monde avant vous s'est {{t:fold|couché}}. Se {{t:fold|coucher}} est trop prudent : le solver {{t:open|ouvre}} généralement cette main. Il ne reste que les blindes et après le flop vous aurez la {{t:position}}, donc depuis le Bouton vous {{t:open|ouvrez}} large, environ {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} des mains."
  - street: flop
    kind: cbet-case
    rule: R-M5-004
    actions:
      - action: check
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et la {{t:big-blind}} fait {{t:check}}. Vous faites {{t:check}}, car la {{t:big-blind}} défend beaucoup de {{t:connectors}} et de mains à petites cartes qui touchent un flop bas, et votre main sans {{t:pair|paire}} ni {{t:draw|tirage}} a manqué. Sur un tel flop, vous faites un {{t:c-bet}} moins souvent que sur les flops hauts."
      - action: bet-small
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et la {{t:big-blind}} fait {{t:check}}. Une petite {{t:bet|mise}} est acceptable, mais plus rare : sur un flop bas et {{t:connected|connecté}}, vous faites un {{t:c-bet}} moins souvent que sur les flops hauts, car la {{t:big-blind}} défend beaucoup de {{t:connectors}} et de mains à petites cartes qui touchent ce flop."
      - action: bet-big
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et la {{t:big-blind}} fait {{t:check}}. Une grosse {{t:bet|mise}} est ici une imprécision : sur un flop {{t:connected|connecté}}, la {{t:big-blind}} peut déjà avoir une {{t:straight|quinte}}, donc quand vous misez, misez petit. Sur un flop bas, vous faites aussi un {{t:c-bet}} moins souvent que sur les flops hauts, car la {{t:big-blind}} défend beaucoup de {{t:connectors}} et de mains à petites cartes qui touchent ce flop."
