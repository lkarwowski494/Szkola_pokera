  sredni:
    flop: { height: [low], suits: [two-tone], ranks: [connected] }
    holding: [air]
    expected: [check]
decisions:
  - street: flop
    kind: cbet-case
    rule: R-M5-004
    actions:
      - action: check
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et la {{t:big-blind}} fait {{t:check}}. Vous faites {{t:check}}, car la {{t:big-blind}} défend beaucoup de {{t:connectors}} et de mains à petites cartes qui touchent un flop bas, et votre main sans {{t:pair|paire}} ni {{t:draw|tirage}} a manqué. Sur un tel flop, vous faites un {{t:c-bet}} moins souvent que sur les flops hauts."
      - action: bet-small
        explanation: "Vous avez {{w:reka}} en {{w:pozycja}}, le {{t:board}} est {{w:stol}}, et la {{t:big-blind}} fait {{t:check}}. Une petite {{t:bet|mise}} est acceptable, mais plus rare : sur un flop bas et {{t:connected|connecté}}, vous faites un {{t:c-bet}} moins souvent que sur les flops hauts, car la {{t:big-blind}} défend beaucoup de {{t:connectors}} et de mains à petites cartes qui touchent ce flop."
