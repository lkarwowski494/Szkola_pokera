# sc-12: French text of content/pl/scenarios/sc-12.yaml (role 06, session CO, 2026-11-11; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-12
module: m5
situation: "Vous avez {{t:open|ouvert}} depuis le Button, la {{t:big-blind}} a {{t:call|payé}} et fait {{t:check}} sur un flop bas et {{t:connected|connecté}}."
table: 6max
positions: { hero: BTN, villain: BB }
