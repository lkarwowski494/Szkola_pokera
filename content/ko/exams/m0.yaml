# Pula egzaminacyjna M0 (układy kart): te same reguły co lekcja m0.l1, inne rozdania i sformułowania.
module: m0
drills:
  - kind: choice
    id: m0.exam.q1
    family: m0.ranking
    rules: [R-M0-001]
    prompt: "상대는 에이스 {{t:three-of-a-kind|트리플}}, 당신은 잭 하이 {{t:straight|스트레이트}}입니다. 누가 이깁니까?"
    table: { hand: "Th 9h", opp: "Ac Ad", board: "As 8c 7d Jh 2s" }
    options:
      - { text: "당신", correct: true, why: "당신의 다섯 장은 J-10-9-8-7, 즉 {{t:straight}}입니다. {{t:straight|스트레이트}}는 랭킹에서 {{t:three-of-a-kind|트리플}}보다 위이므로 상대 카드의 높이는 상관없습니다." }
      - { text: "상대, 에이스가 있기 때문에", why: "에이스는 같은 족보일 때만 의미가 있습니다. 여기서는 족보가 다릅니다: {{t:straight}}가 {{t:three-of-a-kind|트리플}}을 이깁니다." }
      - { text: "{{t:split-pot|스플릿 팟}}", why: "서로 다른 족보는 비기지 않습니다. 랭킹이 더 높은 쪽이 이깁니다." }
  - kind: choice
    id: m0.exam.q2
    family: m0.ranking
    rules: [R-M0-001]
    prompt: "당신은 9 {{t:four-of-a-kind|포카드}}, 상대는 킹 {{t:full-house|풀하우스}}입니다. 누가 이깁니까?"
    table: { hand: "9c 9d", opp: "Kh 2c", board: "9h 9s Kd Kc 3h" }
    options:
      - { text: "당신", correct: true, why: "{{t:four-of-a-kind|포카드}}는 랭킹 3위, {{t:full-house}}는 4위입니다. 족보가 다르므로 상대의 킹은 도움이 되지 않습니다." }
      - { text: "상대, 킹이 9보다 높기 때문에", why: "카드의 높이는 같은 족보일 때만 비교합니다. {{t:four-of-a-kind|포카드}}는 항상 {{t:full-house|풀하우스}}를 이깁니다." }
      - { text: "{{t:split-pot|스플릿 팟}}, 둘 다 {{t:board|보드}}를 쓰기 때문에", why: "둘 다 {{t:community-cards|커뮤니티 카드}}를 쓰지만 각자 다른 다섯 장을 만듭니다: 당신은 {{t:four-of-a-kind|포카드}}, 상대는 {{t:full-house|풀하우스}}." }
  - kind: choice
    id: m0.exam.q3
    family: m0.ranking
    rules: [R-M0-001]
    prompt: "상대는 에이스 {{t:pair|페어}}, 당신은 {{t:two-pair}}(7과 2)입니다. 누가 이깁니까?"
    options:
      - { text: "당신", correct: true, why: "{{t:two-pair|투 페어}}는 낮더라도 랭킹에서 {{t:pair|페어}}보다 위입니다. 먼저 족보의 순위를 비교합니다." }
      - { text: "상대, 에이스가 가장 높기 때문에", why: "에이스 {{t:pair|페어}}도 여전히 {{t:pair}}일 뿐입니다. 높이는 같은 족보일 때만 승부를 가릅니다." }
      - { text: "키커에 따라 다름", why: "키커는 족보의 핵심이 똑같을 때만 의미가 있습니다. 여기서는 족보가 다릅니다." }
  - kind: choice
    id: m0.exam.q4
    family: m0.kicker
    rules: [R-M0-002]
    prompt: "둘 다 {{t:board|보드}}의 퀸과 8로 {{t:two-pair}}입니다. 누가 이깁니까?"
    table: { hand: "Ah 3c", opp: "Kd 4s", board: "Qs Qd 8h 8c 2s" }
    options:
      - { text: "당신", correct: true, why: "족보의 핵심(퀸과 8)이 같으므로 다섯 번째 카드가 승부를 가릅니다. 당신의 에이스가 상대의 킹을 이깁니다." }
      - { text: "상대", why: "상대의 다섯 번째 카드는 킹이고 당신은 에이스입니다. 에이스가 더 높습니다." }
      - { text: "{{t:split-pot|스플릿 팟}}", why: "다섯 장이 똑같을 때만 스플릿이 됩니다. 여기서는 다섯 번째 카드가 다릅니다: 에이스 대 킹." }
  - kind: choice
    id: m0.exam.q5
    family: m0.kicker
    rules: [R-M0-002]
    prompt: "둘 다 킹 {{t:pair|페어}}와 에이스를 가지고 있습니다. 당신의 두 번째 카드(4)는 상대의 두 번째 카드(3)보다 높습니다. 누가 이깁니까?"
    table: { hand: "Ac 4d", opp: "As 3h", board: "Kh Kd Qc Js 9h" }
    options:
      - { text: "{{t:split-pot|스플릿 팟}}", correct: true, why: "두 사람의 최고의 다섯 장은 K-K-A-Q-J입니다. 4와 3은 다섯 장에 들어가지 않으므로 아무것도 바꾸지 않습니다." }
      - { text: "당신, 4가 3보다 높기 때문에", why: "키커는 최고의 5장에 들어갈 때만 의미가 있습니다. 여기서는 퀸과 잭을 {{t:board}}가 주므로 당신의 4는 여섯 번째 카드입니다." }
      - { text: "상대", why: "상대는 당신과 같은 다섯 장입니다: K-K-A-Q-J." }
  - kind: choice
    id: m0.exam.q6
    family: m0.kicker
    rules: [R-M0-002]
    prompt: "둘 다 {{t:straight|스트레이트}}입니다. 누가 이깁니까?"
    table: { hand: "Ah 2c", opp: "6d 7s", board: "3s 4d 5h Kc 9d" }
    options:
      - { text: "상대", correct: true, why: "당신의 {{t:straight}}는 A-2-3-4-5, 즉 {{t:wheel}}로 가장 낮은 {{t:straight}}입니다: 여기서 에이스는 1로 계산됩니다. 상대는 3-4-5-6-7이므로 상대의 {{t:straight}}가 더 높습니다." }
      - { text: "당신, 에이스가 있기 때문에", why: "에이스부터 5까지의 {{t:straight|스트레이트}}에서는 에이스가 가장 낮은 카드입니다. 같은 족보라면 더 높은 {{t:straight}}가 이깁니다: 7이 5를 이깁니다." }
      - { text: "{{t:split-pot|스플릿 팟}}", why: "둘 다 {{t:straight|스트레이트}}지만 높이가 다릅니다. 다섯 장이 똑같을 때만 스플릿이 됩니다." }
  - kind: choice
    id: m0.exam.q7
    family: m0.kicker
    rules: [R-M0-002]
    prompt: "둘 다 {{t:board|보드}}의 에이스를 포함한 하트 {{t:flush|플러시}}입니다. 누가 이깁니까?"
    table: { hand: "Kh 4h", opp: "Qh Jh", board: "Ah 9h 3h 7c 2d" }
    options:
      - { text: "당신", correct: true, why: "{{t:flush|플러시}}끼리는 가장 높은 카드부터 비교합니다. 에이스는 공통이고, 두 번째 카드는 당신의 킹 대 상대의 퀸입니다." }
      - { text: "상대, 높은 카드가 두 장이기 때문에", why: "높은 카드부터 차례로, 처음으로 다른 카드가 승부를 가릅니다. 당신의 킹이 퀸을 이기므로 나머지 카드는 상관없습니다." }
      - { text: "{{t:split-pot|스플릿 팟}}", why: "다섯 장이 다릅니다: A-K-9-4-3과 A-Q-J-9-3." }
  - kind: choice
    id: m0.exam.q8
    family: m0.board-plays
    rules: [R-M0-003]
    prompt: "{{t:board|보드}}에 {{t:full-house}}가 깔려 있습니다: 에이스 세 장과 킹 두 장. 당신은 퀸 {{t:pair|페어}}입니다. 누가 이깁니까?"
    table: { hand: "Qc Qd", opp: "7s 2c", board: "Ah Ad Ac Ks Kh" }
    options:
      - { text: "{{t:split-pot|스플릿 팟}}", correct: true, why: "두 사람의 최고의 다섯 장은 {{t:board|보드}}의 A-A-A-K-K입니다. 당신의 퀸은 더 약한 {{t:full-house|풀하우스}}(에이스와 퀸)를 만들므로 다섯 장에 들어가지 않습니다." }
      - { text: "당신, 퀸 {{t:pair|페어}}가 있기 때문에", why: "에이스와 퀸 조합은 {{t:board|보드}}에 깔린 에이스와 킹 조합보다 약합니다. 따라서 당신은 상대와 똑같이 {{t:board|보드}}로 플레이합니다." }
      - { text: "상대", why: "상대도 {{t:board|보드}}의 다섯 장으로 플레이합니다. 당신의 카드와 마찬가지로 상대의 카드도 아무것도 더하지 않습니다." }
  - kind: choice
    id: m0.exam.q9
    family: m0.board-plays
    rules: [R-M0-003]
    prompt: "{{t:board|보드}}에 9부터 킹까지의 {{t:straight}}가 깔려 있습니다. 누가 이깁니까?"
    table: { hand: "Ac 2d", opp: "3c 3d", board: "Ts Jd Qc Kh 9s" }
    options:
      - { text: "당신", correct: true, why: "당신의 에이스가 {{t:straight|스트레이트}}를 A-K-Q-J-10으로 늘립니다. 상대는 {{t:board|보드}}의 다섯 장(K-Q-J-10-9)으로 플레이하고, 당신의 다섯 장이 더 높습니다." }
      - { text: "{{t:split-pot|스플릿 팟}}", why: "두 사람의 최고의 다섯 장이 {{t:board|보드}}에 있을 때만 스플릿이 됩니다. 당신은 에이스 덕분에 더 좋은 다섯 장을 가지고 있습니다." }
      - { text: "상대, {{t:pair|페어}}가 있기 때문에", why: "3 {{t:pair|페어}}는 {{t:board|보드}}의 {{t:straight}}보다 약하므로 상대는 {{t:board|보드}}로 플레이합니다." }
