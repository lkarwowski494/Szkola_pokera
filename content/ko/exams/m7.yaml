# Pula pytań egzaminacyjnych modułu M7 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m7.*).
module: m7
drills:
  - kind: choice
    id: m7.exam.q1
    family: m7.barrel.card
    rules: [R-M7-001]
    prompt: "버튼에서 {{t:open|오픈}}했고 {{t:big-blind|빅 블라인드}}가 {{t:call|콜}}했습니다. [[9s 6d 2c]] 플롭에서 c-bet으로 {{t:bet|벳}}했고, 상대가 {{t:call|콜}}했습니다. 턴에 어떤 카드가 나왔을 때 {{t:second-barrel|세컨드 배럴}}을 더 자주 {{t:bet|벳}}합니까?"
    table: { position: BTN, board: "9s 6d 2c" }
    options:
      - { text: "[[Kh]]", correct: true, why: "맞습니다. 낮은 {{t:board|보드}}에 나온 킹은 수비하는 쪽의 {{t:range|레인지}}보다 당신의 {{t:open|오픈}} {{t:range|레인지}}(KQ, KJ, KT, AK)에 더 자주 맞고, {{t:big-blind|빅 블라인드}}가 플롭에서 {{t:call|콜}}한 모든 {{t:pair|페어}}는 한 단계 아래로 내려갑니다." }
      - { text: "[[8c]]", why: "9와 6이 있는 보드에서 8은 T7과 75에 {{t:straight|스트레이트}}를, 98과 86에 {{t:two-pair|투 페어}}를 만들어 줍니다. 모두 {{t:big-blind|빅 블라인드}}가 수비하는 핸드입니다. 이 카드는 오히려 상대에게 도움이 됩니다." }
      - { text: "[[5s]]", why: "9, 6, 2가 있는 보드에서 5는 87과 43에 {{t:straight|스트레이트}}를 만들어 주고, {{t:big-blind|빅 블라인드}}는 작은 카드를 많이 수비합니다. 당신의 {{t:range|레인지}}에 유리한 카드가 아닙니다." }
  - kind: choice
    id: m7.exam.q2
    family: m7.barrel.bluff
    rules: [R-M7-002]
    prompt: "버튼에서 {{t:open|오픈}}했고, {{t:big-blind|빅 블라인드}}가 플롭 c-bet을 {{t:call|콜}}했습니다. 턴은 2이고, 상대가 {{t:check|체크}}합니다. {{t:pair|페어}}가 없는 두 핸드 중 하나를 가지고 있습니다. 어느 핸드로 {{t:second-barrel|세컨드 배럴}} {{t:bluff|블러프}}를 하는 것이 더 좋습니까?"
    table: { position: BTN, board: "Kc 9h 4h 2s" }
    options:
      - { text: "[[Qh Jh]]", correct: true, why: "맞습니다. {{t:flush-draw|플러시 드로우}}와 거트샷(10)이 있습니다. 이것은 {{t:semi-bluff|세미 블러프}}입니다. 상대가 {{t:fold|폴드}}하거나 리버에서 맞으면 이깁니다." }
      - { text: "[[8c 7c]]", why: "이 핸드에는 아웃이 없습니다. 리버에 어떤 카드가 나와도 {{t:straight|스트레이트}}나 {{t:flush|플러시}}가 되지 않습니다. 아웃 없는 {{t:bluff|블러프}}는 이기는 길이 하나뿐이므로 더 자주 포기합니다." }
  - kind: choice
    id: m7.exam.q3
    family: m7.barrel.value
    rules: [R-M7-003]
    prompt: "버튼에서 {{t:open|오픈}}했고, {{t:big-blind|빅 블라인드}}가 플롭 c-bet을 {{t:call|콜}}했습니다. 턴은 5이고, 상대가 {{t:check|체크}}합니다. 에이스와 함께 {{t:second-pair|세컨드 페어}}를 가지고 있습니다. 어떻게 하시겠습니까?"
    table: { hand: "Ad 7d", position: BTN, board: "Ts 7c 3d 5h" }
    options:
      - { text: "{{t:check|체크}}합니다", correct: true, why: "맞습니다. {{t:second-pair|세컨드 페어}}는 중간 강도의 핸드입니다. 플롭을 {{t:call|콜}}한 뒤 상대의 {{t:range|레인지}}는 더 강합니다. 두 번째 벳에 더 약한 핸드는 {{t:fold|폴드}}하고, 10 이상의 핸드는 돈을 냅니다. {{t:check|체크}}하면 {{t:pot|팟}}을 작게 유지하며 쇼다운까지 갈 수 있습니다." }
      - { text: "{{t:value|밸류}}를 위해 벳합니다", why: "중간 강도 핸드의 벳은 더 약한 핸드가 돈을 낼 때 이익을 내는데, 플롭을 {{t:call|콜}}한 상대에게는 그런 핸드가 적습니다. 주로 당신을 이기는 핸드가 돈을 냅니다." }
      - { text: "핸드를 보호하려고 크게 벳합니다", why: "중간 {{t:pair|페어}}로 크게 벳하면 더 약한 핸드는 밀어내고 더 강한 핸드는 남깁니다. 주로 이미 이기고 있는 핸드가 돈을 낼 때는 보호가 도움이 되지 않습니다." }
  - kind: numeric
    id: m7.exam.q4
    family: m7.barrel.math
    rules: [R-M7-004]
    prompt: "턴입니다. {{t:pot|팟}}은 {{n:exam.m7.pot}}입니다. 거의 이기지 못할 핸드로 {{t:bluff|블러프}}하며 {{n:exam.m7.bet.half}}만큼 {{t:bet|벳}}합니다. 이 {{t:bluff|블러프}}가 본전이 되려면 상대가 얼마나 자주 {{t:fold|폴드}}해야 합니까? 숫자를 퍼센트로 입력하세요."
    answer: exam.m7.alpha.half
    explanation: "기준점은 벳 ÷ ({{t:pot|팟}} + 벳) = {{n:exam.m7.bet.half}} ÷ ({{n:exam.m7.pot}} + {{n:exam.m7.bet.half}}) = {{n:exam.m7.alpha.half}}입니다. 아웃이 있으면 이 기준점은 낮아집니다. {{t:call|콜}}을 받은 뒤에도 가끔 이기기 때문입니다."
  - kind: choice
    id: m7.exam.q5
    family: m7.polar.concept
    rules: [R-M7-005]
    prompt: "턴에서 {{t:polarized|폴라라이즈드}} {{t:range|레인지}}로 {{t:pot|팟}}의 3/4를 벳합니다. 이때 당신의 {{t:range|레인지}}에서 어떤 핸드가 {{t:check|체크}}합니까?"
    options:
      - { text: "중간 강도 핸드(예: {{t:second-pair|세컨드 페어}})", correct: true, why: "맞습니다. {{t:polarized|폴라라이즈드}} {{t:range|레인지}}는 매우 강한 핸드와 {{t:semi-bluff|세미 블러프}}로 이루어집니다. 중간 강도 핸드는 큰 {{t:pot|팟}}에서 얻는 것이 없으므로 {{t:check|체크}}하고 쇼다운까지 가려고 합니다." }
      - { text: "셋과 {{t:two-pair|투 페어}}", why: "{{t:range|레인지}}의 위쪽 끝입니다. 리버 전에 {{t:pot|팟}}을 키우고 싶어 하므로 큰 사이즈로 벳합니다." }
      - { text: "{{t:flush-draw|플러시 드로우}}", why: "아래쪽 끝입니다. {{t:semi-bluff|세미 블러프}}는 상대의 {{t:fold|폴드}}가 필요하므로 강한 핸드와 같은 큰 사이즈로 벳합니다." }
  - kind: choice
    id: m7.exam.q6
    family: m7.polar.price
    rules: [R-M7-006]
    prompt: "턴입니다. {{t:two-pair|투 페어}}를 가지고 있고, 상대는 {{t:flush-draw|플러시 드로우}}일 수 있습니다(리버에서 약 {{n:odds.flush.turn-river}}). {{t:pot|팟}}은 {{n:exam.m7.pot}}이고, 상대가 {{t:check|체크}}합니다. 어떻게 하시겠습니까?"
    table: { hand: "Jc 8c", position: BTN, board: "Jh 8h 4s 2d" }
    options:
      - { text: "{{n:exam.m7.bet.three-quarters}} 벳합니다", correct: true, why: "맞습니다. {{t:pot|팟}}의 3/4 벳에 맞서 {{t:draw|드로우}}는 {{n:eq.bet-three-quarters}}의 에퀴티가 필요하지만, 가진 것은 약 {{n:odds.flush.turn-river}}입니다. 너무 비싸게 값을 치르는 것이고, 당신은 강한 핸드로 {{t:pot|팟}}을 키웁니다." }
      - { text: "{{n:exam.m7.bet.quarter}} 벳합니다", sizeError: true, why: "액션은 좋지만 사이즈가 틀렸습니다. {{t:pot|팟}}의 1/4 벳에서는 {{t:draw|드로우}}에 {{n:eq.bet-quarter}}만 필요하며, 이는 약 {{n:odds.flush.turn-river}}보다 적습니다. 작은 벳은 상대에게 좋은 가격을 줍니다. 크게 벳하세요." }
      - { text: "{{t:check|체크}}합니다", why: "공짜 카드는 {{t:flush-draw|플러시 드로우}}에게 주는 선물이고, 당신은 강한 핸드의 가치를 잃습니다. {{t:two-pair|투 페어}}라면 벳합니다." }
  - kind: numeric
    id: m7.exam.q7
    family: m7.implied.math
    rules: [R-M7-008]
    prompt: "턴입니다. {{t:pot|팟}}은 {{n:exam.m7.pot}}이고, 상대가 {{n:exam.m7.bet.half}}만큼 {{t:bet|벳}}합니다. {{t:oesd|오픈엔디드 스트레이트 드로우}}가 있습니다. 아웃 {{n:outs.oesd}}장, 빗나가는 카드 {{n:miss.oesd.turn}}장입니다. {{t:call|콜}}이 본전이 되려면, 맞힌 뒤 리버에서 ({{t:bet|벳}} 이후의 {{t:pot|팟}} 외에) {{t:chips|칩}}을 추가로 얼마나 더 따야 합니까? 숫자를 입력하세요."
    answer: exam.m7.io.extra
    explanation: "맞혔을 때 총 {{n:exam.m7.bet.half}} × {{n:miss.oesd.turn}} ÷ {{n:outs.oesd}} = {{n:exam.m7.io.need}}만큼 따야 합니다. {{t:bet|벳}} 이후 {{t:pot|팟}}은 {{n:exam.m7.io.pot-after-bet}}이므로 {{n:exam.m7.io.extra}}만큼 부족합니다. 이것이 임플라이드 오즈입니다. 상대가 앞으로 더 지불해야 하는 금액입니다."
  - kind: choice
    id: m7.exam.q8
    family: m7.implied.when
    rules: [R-M7-010]
    prompt: "턴입니다. {{t:oesd|오픈엔디드 스트레이트 드로우}}(J 또는 6)가 있고, {{t:board|보드}}에는 다이아몬드가 두 장 있습니다. 보수적으로 아웃을 몇 장으로 셉니까?"
    table: { hand: "9s 8s", board: "Td 7d 2c 3h" }
    options:
      - { text: "{{n:exam.m7.oesd.clean}}", correct: true, why: "맞습니다. {{n:outs.oesd}}장의 아웃 중 두 장([[Jd]]와 [[6d]])은 {{t:board|보드}}에 세 번째 다이아몬드를 깝니다. 그러면 다이아몬드 두 장을 가진 상대는 {{t:flush|플러시}}가 되고, 당신은 맞히고도 지면서 가장 많은 돈을 냅니다. 깨끗한 아웃은 {{n:exam.m7.oesd.clean}}장 남습니다." }
      - { text: "{{n:outs.oesd}}", why: "{{t:straight|스트레이트}}로 가는 모든 아웃이지만, 그중 두 장은 {{t:flush|플러시}}를 가능하게 합니다. {{t:board|보드}}에서 {{t:flush|플러시}}가 나올 수 있으면 아웃을 더 적게 셉니다." }
      - { text: "{{n:outs.gutshot}}", why: "거트샷의 아웃 수입니다. 당신은 양쪽이 열린 {{t:straight-draw|스트레이트 드로우}}를 가지고 있고, 다이아몬드 두 장만 빼면 됩니다." }
  - kind: choice
    id: m7.exam.q9
    family: m7.probe.play
    rules: [R-M7-011, R-M7-012]
    prompt: "버튼의 {{t:open|오픈}}에 맞서 {{t:big-blind|빅 블라인드}}를 수비합니다. 플롭에서 둘 다 {{t:check|체크}}했습니다. 턴은 2입니다. 먼저 액션합니다. {{t:second-pair|세컨드 페어}}와 거트샷(4)을 가지고 있습니다. 어떻게 하시겠습니까?"
    table: { hand: "6c 5d", position: BB, board: "9h 6s 3d 2c" }
    options:
      - { text: "벳합니다(프로브 벳)", correct: true, why: "맞습니다. 플롭에서 {{t:check|체크}}한 버튼에게는 강한 핸드가 적고, 낮은 {{t:board|보드}}는 당신의 {{t:range|레인지}}에 잘 맞습니다. {{t:pair|페어}}는 더 약한 핸드에게서 돈을 받고 공짜 카드를 막아야 하며, 거트샷은 추가 아웃을 줍니다." }
      - { text: "버튼이 어떻게 하는지 보려고 {{t:check|체크}}합니다", why: "버튼에게 공짜 카드를 주게 됩니다. 플롭에서 {{t:check|체크}}한 버튼은 하이 카드만 가진 경우가 많습니다. 낮은 {{t:board|보드}}에서는 {{t:pair|페어}}로 직접 벳합니다." }
      - { text: "체크레이즈를 계획하고 {{t:check|체크}}합니다", why: "플롭에서 {{t:check|체크}}한 버튼은 다시 {{t:check|체크}}하는 경우가 많고, 그러면 아무것도 얻지 못합니다. 프로브 벳은 상대의 더 약한 핸드에게서 바로 밸류를 얻습니다." }
  - kind: choice
    id: m7.exam.q10
    family: m7.defend.turn
    rules: [R-M7-013]
    prompt: "{{t:big-blind|빅 블라인드}}를 수비합니다. 플롭에서 버튼의 c-bet을 {{t:call|콜}}했습니다. 턴은 6이고, {{t:check|체크}}하자 버튼이 {{t:pot|팟}}의 3/4를 {{t:bet|벳}}합니다. 4 {{t:pair|페어}}를 가지고 있습니다. 어떻게 하시겠습니까?"
    table: { hand: "4h 4d", position: BB, board: "Ks Jd 8c 6h" }
    options:
      - { text: "{{t:fold|폴드}}합니다", correct: true, why: "맞습니다. 버튼은 c-bet보다 더 좁은 {{t:range|레인지}}와 더 큰 사이즈로 {{t:second-barrel|세컨드 배럴}}을 {{t:bet|벳}}합니다. {{t:board|보드}}의 모든 카드보다 낮고, 남은 4 두 장 외에는 아웃이 없는 가장 약한 {{t:pair|페어}}는 상대 벳 대부분에 집니다." }
      - { text: "이미 플롭을 {{t:call|콜}}했으니 {{t:call|콜}}합니다", why: "플롭에서 넣은 것은 돌아오지 않습니다. 턴에서는 핸드를 새로 평가합니다. {{t:second-barrel|세컨드 배럴}}에 맞서 가장 약한 {{t:pair|페어}}는 {{t:fold|폴드}}합니다." }
      - { text: "{{t:raise|레이즈}}합니다", why: "{{t:raise|레이즈}}하면 더 약한 핸드는 {{t:fold|폴드}}하고 더 강한 핸드가 돈을 냅니다. 4 {{t:pair|페어}}는 {{t:value|밸류}} 핸드도, 좋은 {{t:bluff|블러프}}도 아닙니다." }
