# Pula pytań egzaminacyjnych modułu M8 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m8.*).
module: m8
drills:
  - kind: choice
    id: m8.exam.q1
    family: m8.value.threshold
    rules: [R-M8-001]
    prompt: "리버, 마지막 {{t:betting-round|베팅 라운드}}입니다. 상대가 {{t:check|체크합니다}}. 당신의 {{t:bet|베팅}}에 상대는 {{t:call|콜}}이나 {{t:fold|폴드}}만 할 수 있다고 가정하세요. 상대의 {{t:range|레인지}}(상대가 가질 수 있는 핸드)에는 당신보다 약한 핸드가 {{n:exam.m8.range.worse}}개 있지만, 당신의 베팅에 콜하는 핸드는 그중 {{n:exam.m8.call.worse}}개뿐입니다. 당신보다 강한 핸드 {{n:exam.m8.call.better}}개도 콜합니다. 베팅하시겠습니까?"
    options:
      - { text: "아니요, {{t:check|체크합니다}}", correct: true, why: "맞습니다. 지불할 핸드만 세세요. 베팅은 {{n:exam.m8.call.worse}}번 이기고 {{n:exam.m8.call.better}}번 지므로, 순손실은 베팅 {{n:exam.m8.net.loss}}개입니다. {{t:fold|폴드하는}} 약한 핸드는 {{t:check|체크한}} 뒤에도 어차피 당신에게 졌을 것입니다." }
      - { text: "네, 약한 핸드가 강한 핸드보다 많기 때문입니다", why: "상대에게 약한 핸드가 {{n:exam.m8.range.worse}}개 있지만, 대부분은 베팅에 {{t:fold|폴드합니다}}. 지불할 핸드 중에서는 강한 핸드가 더 많습니다({{n:exam.m8.call.better}} 대 {{n:exam.m8.call.worse}})." }
      - { text: "네, 내 핸드가 어느 정도인지 알기 위해서입니다", why: "‘정보를 위한’ 베팅은 강한 핸드에게 돈을 내주고, 약한 핸드는 {{t:fold|폴드합니다}}. 같은 정보는 {{t:check|체크한}} 뒤 쇼다운에서 무료로 얻을 수 있습니다." }
  - kind: choice
    id: m8.exam.q2
    family: m8.value.size
    rules: [R-M8-003]
    prompt: "버튼에서 {{t:open|오픈했고}} {{t:big-blind}}가 {{t:call|콜했습니다}}. 플롭에서는 C벳과 {{t:call}}, 턴에서는 둘 다 {{t:check|체크했습니다}}. 리버에서 {{t:big-blind}}가 {{t:check|체크합니다}}. 9와 함께 {{t:top-pair|탑 페어를}} 가지고 있고, 지불할 핸드 중 절반을 조금 넘는 핸드를 이긴다고 추정합니다. 어떻게 하시겠습니까?"
    table: { hand: "Jh 9h", board: "Jc 7s 4d 2h 2c", position: BTN }
    options:
      - { text: "{{t:pot|팟의}} 약 1/3 베팅", correct: true, why: "맞습니다. 이것은 씬 밸류입니다. 작은 베팅에는 7, 4, 더 약한 잭도 {{t:call|콜하므로}}, {{t:call|콜}} 중에는 강한 핸드보다 약한 핸드가 더 많이 남습니다." }
      - { text: "{{t:pot|팟}} 전체 베팅", sizeError: true, why: "액션은 맞지만 사이즈가 틀렸습니다. {{t:pot|팟}} 크기 베팅에는 7과 4가 {{t:fold|폴드하고}}, 주로 더 강한 잭과 더 강한 핸드가 지불합니다. 씬 밸류는 더 작게, 보통 {{t:pot|팟의}} 약 1/4–1/2로 베팅합니다." }
      - { text: "{{t:check|체크합니다}}. 베팅하기에는 핸드가 너무 약하기 때문입니다", why: "밸류를 잃습니다. 작은 베팅을 지불할 핸드의 절반 이상을 이기기 때문입니다. 더 작은 사이즈를 고르기만 하면 됩니다." }
  - kind: numeric
    id: m8.exam.q3
    family: m8.bluff.share
    rules: [R-M8-004, R-M8-005]
    prompt: "리버. {{t:pot|팟에}} {{n:exam.m8.pot}}만큼 있고, 아주 강한 핸드와 {{t:bluff|블러프로}} 구성된 {{t:range|레인지로}} {{n:exam.m8.bet}}만큼 베팅합니다. 균형 상태에서 당신의 베팅 중 {{t:bluff|블러프가}} 차지하는 비율은 얼마입니까? 퍼센트로 숫자를 입력하세요."
    answer: exam.m8.share
    explanation: "{{t:bluff|블러프}} 비율 = 베팅 ÷ ({{t:pot}} + 2·베팅) = {{n:exam.m8.bet}} ÷ ({{n:exam.m8.pot}} + {{n:exam.m8.bet}} + {{n:exam.m8.bet}}) = {{n:exam.m8.share}}. {{t:bluff|블러프를}} 잡는 상대 핸드도 같은 에퀴티가 필요하므로, {{t:call|콜로도}} {{t:fold|폴드로도}} 이익을 내지 못합니다."
  - kind: choice
    id: m8.exam.q4
    family: m8.bluff.combos
    rules: [R-M8-004]
    prompt: "리버. {{t:pot|팟에}} {{n:exam.m8.pot}}만큼 있고, 밸류와 {{t:bluff|블러프로}} 이루어진 {{n:exam.m8.range}}개 {{t:combo|콤보의}} {{t:range|레인지로}} {{n:exam.m8.bet}}만큼 베팅합니다. 균형 상태의 {{t:bluff|블러프}} 비율은 {{n:exam.m8.share}}입니다. {{t:bluff|블러프는}} 몇 {{t:combo|콤보입니까}}?"
    options:
      - { text: "{{n:exam.m8.bluffs}}", correct: true, why: "맞습니다. {{n:exam.m8.range}} × {{n:exam.m8.share}} = {{n:exam.m8.bluffs}}개의 {{t:bluff|블러프와}} {{n:exam.m8.value-combos}}개의 {{t:value|밸류}} {{t:combo|콤보입니다}}." }
      - { text: "{{n:exam.m8.bluffs.wrong-pot}}", why: "{{t:pot|팟}} 전체를 베팅할 때의 수입니다(비율 {{n:bluff.share.bet-pot}}). 베팅이 더 작으면 {{t:bluff|블러프도}} 더 적습니다: {{n:exam.m8.share}}." }
      - { text: "{{n:exam.m8.value-combos}}", why: "이것은 {{t:value|밸류}} {{t:combo|콤보의}} 수입니다. {{t:bluff|블러프는}} 더 작은 부분입니다: {{n:exam.m8.range}} × {{n:exam.m8.share}} = {{n:exam.m8.bluffs}}." }
  - kind: choice
    id: m8.exam.q5
    family: m8.bluff.hands
    rules: [R-M8-006]
    prompt: "버튼에서 {{t:open|오픈했고}}, {{t:big-blind}}가 {{t:call|콜한}} 뒤 리버에서 {{t:check|체크합니다}}. 다음 중 어떤 핸드로 {{t:bluff|블러프하는}} 것이 가장 좋습니까?"
    table: { board: "Qs Tc 6d 3h 2s", position: BTN }
    options:
      - { text: "[[Kc Jc]]", correct: true, why: "맞습니다. {{t:oesd|OESD가}} 완성되지 않았고, K 하이만으로는 쇼다운에서 거의 이기지 못합니다. 이길 가능성이 없는 핸드는 {{t:bluff}}가 실패해도 잃을 것이 없습니다." }
      - { text: "[[Ts 9s]]", why: "{{t:second-pair|세컨드 페어는}} {{t:check|체크한}} 뒤 빗나간 {{t:draw|드로우와}} 더 약한 핸드를 이깁니다. {{t:bluff|블러프하면}} 그 승리를 포기하게 됩니다." }
      - { text: "[[Qd 8d]]", why: "{{t:top-pair|탑 페어는}} 쇼다운 밸류가 있습니다. {{t:check|체크한}} 뒤 자주 이기는 핸드로는 {{t:bluff|블러프하지}} 않습니다." }
  - kind: choice
    id: m8.exam.q6
    family: m8.blockers.bluff
    rules: [R-M8-007]
    prompt: "리버. {{t:big-blind|빅 블라인드가}} {{t:check|체크합니다}}. 이 {{t:board|보드에서}} KT와 T8은 {{t:straight}}입니다. 아래 두 핸드 모두 {{t:pair|페어도}} 쇼다운 가능성도 없습니다. 어느 핸드로 {{t:bluff|블러프하는}} 것이 더 좋습니까?"
    table: { board: "Qd Jc 4s 2h 9d", position: BTN }
    options:
      - { text: "[[Ts 7s]]", correct: true, why: "맞습니다. 10이 두 {{t:straight|스트레이트}}(KT와 T8), 즉 상대가 확실히 지불할 핸드를 모두 막습니다. 상대가 가진 그런 핸드의 {{t:combo|콤보가}} 줄어들므로, 상대에게 폴드할 핸드가 남는 경우가 더 많아집니다." }
      - { text: "[[6s 5s]]", why: "이 핸드는 상대의 강한 핸드를 하나도 막지 않습니다. 가능성 없는 {{t:bluff|블러프}} 중에서 고를 때는 상대의 밸류를 막는 쪽이 낫습니다." }
  - kind: numeric
    id: m8.exam.q7
    family: m8.blockers.combos
    rules: [R-M8-009]
    prompt: "아무 정보가 없을 때 KQ는 {{n:combos.unpaired}}개 {{t:combo|콤보입니다}}. 당신은 [[Ad Qc]]를 들고 있습니다. 상대가 가질 수 있는 KQ {{t:combo|콤보는}} 몇 개입니까? 숫자를 입력하세요."
    table: { hand: "Ad Qc" }
    answer: combos.unpaired.one-blocked
    explanation: "당신이 Q 한 장을 들고 있으므로 상대에게는 Q {{n:pair.outs.per-rank}}장과 K {{n:cards.suits}}장 전부가 남습니다: {{n:pair.outs.per-rank}} × {{n:cards.suits}} = {{n:combos.unpaired.one-blocked}}. A는 KQ의 수에 영향을 주지 않습니다."
  - kind: choice
    id: m8.exam.q8
    family: m8.catch.math
    rules: [R-M8-010]
    prompt: "리버. {{t:pot|팟에}} {{n:exam.m8.pot}}만큼 있고, 상대가 {{n:exam.m8.bet}}만큼 {{t:bet|베팅합니다}}. 당신은 블러프 캐처를 가지고 있고, 상대 베팅 중 약 {{n:exam.m8.bluffs.est}}가 {{t:bluff|블러프라고}} 추정합니다. 어떻게 하시겠습니까?"
    options:
      - { text: "{{t:fold|폴드합니다}}", correct: true, why: "맞습니다. {{n:exam.m8.bet}} ÷ ({{n:exam.m8.pot}} + {{n:exam.m8.bet}} + {{n:exam.m8.bet}}) = {{n:exam.m8.share}}의 에퀴티가 필요한데, 블러프 캐처는 {{t:bluff|블러프만}} 이기므로 약 {{n:exam.m8.bluffs.est}}의 경우에만 이깁니다. {{t:call|콜은}} 손해입니다." }
      - { text: "{{t:call|콜합니다}}", why: "당신의 에퀴티는 상대 베팅 중 {{t:bluff|블러프가}} 차지하는 비율인 {{n:exam.m8.bluffs.est}}입니다. 필요한 {{n:exam.m8.share}}보다 적으므로 {{t:call}}은 손해입니다." }
      - { text: "{{t:raise|레이즈합니다}}", why: "{{t:raise|레이즈하면}} {{t:bluff|블러프는}} {{t:fold|폴드하고}}, 더 강한 핸드만 지불합니다. 블러프 캐처로는 {{t:raise|레이즈하지}} 않습니다." }
  - kind: choice
    id: m8.exam.q9
    family: m8.catch.blockers
    rules: [R-M8-011]
    prompt: "{{t:big-blind}}를 방어하고 있습니다. 하트는 완성되지 않았고, 리버에서 T7과 75가 {{t:straight}}가 되었습니다. 당신이 {{t:check|체크하자}} 버튼이 {{t:pot|팟}} 전체를 {{t:bet|베팅합니다}}. 약한 키커의 {{t:top-pair|탑 페어를}} 가지고 있습니다. 다음 중 어떤 핸드에서 {{t:call}}이 더 좋습니까?"
    table: { board: "Kh 9h 6c 2s 8d", position: BB }
    options:
      - { text: "[[Kc 7c]]", correct: true, why: "맞습니다. 7이 새로 생긴 두 {{t:straight|스트레이트}}(T7과 75), 즉 버튼 밸류의 일부를 막고, 하트가 없으므로 버튼의 주요 {{t:bluff|블러프인}} 빗나간 {{t:flush-draw|플러시 드로우를}} 막지 않습니다. 상대 베팅에 {{t:bluff|블러프가}} 더 많이 남습니다." }
      - { text: "[[Ks 3h]]", why: "[[3h]] 카드는 빗나간 {{t:flush-draw|플러시 드로우}}, 즉 버튼의 {{t:bluff|블러프}} 일부를 막고, 이 핸드는 {{t:straight|스트레이트를}} 하나도 막지 않습니다. 상대 베팅에 밸류가 더 많이 남습니다." }
  - kind: choice
    id: m8.exam.q10
    family: m8.value.check
    rules: [R-M8-002]
    prompt: "버튼에서 {{t:open|오픈했고}} {{t:big-blind}}가 {{t:call|콜했습니다}}. 플롭에서는 C벳과 {{t:call}}, 턴에서는 둘 다 {{t:check|체크했습니다}}. 리버에서 {{t:big-blind}}가 {{t:check|체크합니다}}. 6 {{t:pair|페어를}} 가지고 있습니다. 어떻게 하시겠습니까?"
    table: { hand: "6d 6s", board: "Jc 8h 4d 3s Kc", position: BTN }
    options:
      - { text: "{{t:check|체크합니다}}", correct: true, why: "맞습니다. 6 {{t:pair|페어는}} 빗나간 {{t:draw|드로우와}} 하이 카드를 이기지만, 그런 핸드는 베팅에 {{t:fold|폴드합니다}}. 주로 잭, 8, 킹이 지불합니다. {{t:check|체크하면}} 무료로 쇼다운에 갑니다." }
      - { text: "{{t:value|밸류로}} 작게 베팅합니다", why: "작은 베팅에도 주로 더 강한 {{t:pair|페어가}} {{t:call|콜합니다}}. 여기서 상대의 약한 핸드는 주로 {{t:pair|페어가}} 없는 핸드와 가장 약한 {{t:pair|페어이며}}, 이런 핸드는 거의 지불하지 않습니다." }
      - { text: "상대가 더 강한 {{t:pair|페어를}} {{t:fold|폴드하도록}} 크게 베팅합니다", why: "베팅은 쇼다운 밸류가 있는 핸드를 {{t:bluff}}로 바꿉니다. {{t:bluff|블러프는}} 가능성이 없는 핸드로 하며, 이 핸드는 {{t:check|체크한}} 뒤 자주 이깁니다." }
