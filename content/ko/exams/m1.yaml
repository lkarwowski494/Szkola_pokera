# Pula egzaminacyjna M1 (przebieg rozdania): te same reguły co lekcja m1.l1, inne sytuacje i sformułowania.
module: m1
drills:
  - kind: choice
    id: m1.exam.q1
    family: m1.actions
    rules: [R-M1-001]
    prompt: "플롭에서 상대가 {{t:bet|베팅}}했고, 당신은 {{t:call|콜}}했습니다. 턴에서는 당신이 먼저 행동합니다. 무엇을 할 수 있습니까?"
    options:
      - { text: "{{t:check|체크}} 또는 {{t:bet|베팅}}", correct: true, why: "턴은 새로운 {{t:betting-round}}입니다. 이 라운드에서는 아직 아무도 아무것도 넣지 않았으므로, 모든 라운드를 시작할 때와 같은 두 가지 선택지가 있습니다." }
      - { text: "{{t:call|콜}} 또는 {{t:fold|폴드}}만 가능", why: "플롭의 {{t:bet|베팅}}은 이미 맞춰졌습니다. 턴에서는 {{t:call|콜}}할 것이 없습니다." }
      - { text: "플롭의 {{t:bet|베팅}}에 {{t:raise|레이즈}}", why: "{{t:raise|레이즈}}는 현재 라운드의 {{t:bet}}에만 할 수 있습니다. 플롭의 베팅은 이미 마감되었습니다." }
  - kind: choice
    id: m1.exam.q2
    family: m1.actions
    rules: [R-M1-001]
    prompt: "당신보다 먼저 행동한 상대가 {{t:bet|베팅}}했습니다. 지금 할 수 없는 행동은 무엇입니까?"
    options:
      - { text: "{{t:check|체크}}", correct: true, why: "{{t:check|체크}}는 이번 라운드에서 당신보다 앞서 아무도 {{t:bet|베팅}}하거나 {{t:raise|레이즈}}하지 않았을 때만 할 수 있습니다. 지금은 {{t:fold|폴드}}, {{t:call|콜}}, {{t:raise|레이즈}} 중 하나를 해야 합니다." }
      - { text: "{{t:raise|레이즈}}", why: "{{t:raise|레이즈}}가 가능한 것은 바로 올릴 {{t:bet}}이 있기 때문입니다." }
      - { text: "{{t:fold|폴드}}", why: "더 넣어야 할 때 {{t:fold|폴드}}는 언제나 할 수 있습니다." }
  - kind: choice
    id: m1.exam.q3
    family: m1.actions
    rules: [R-M1-002]
    prompt: "리버입니다. 상대가 {{t:check|체크}}했고, 당신의 핸드는 거의 확실히 지고 있습니다. 어떻게 하시겠습니까?"
    options:
      - { text: "{{t:check|체크}}", correct: true, why: "{{t:check|체크}}는 비용이 들지 않고, 상대도 맞히지 못했을 수 있습니다. {{t:fold|폴드}}하면 싸워 보지도 않고 {{t:pot|팟}}을 내주게 됩니다." }
      - { text: "{{t:fold|폴드}}", why: "무료로 {{t:check|체크}}할 수 있을 때 {{t:fold}}는 {{t:pot|팟}}을 가져갈 기회를 포기하는 것일 뿐입니다. 얻는 것은 없습니다." }
      - { text: "{{t:call|콜}}", why: "상대가 아무것도 {{t:bet|베팅}}하지 않았으므로 {{t:call|콜}}할 것이 없습니다." }
  - kind: choice
    id: m1.exam.q4
    family: m1.actions
    rules: [R-M1-003]
    prompt: "플롭에서 {{t:bet|베팅}}했는데 상대가 {{t:raise|레이즈}}했습니다. 더 이상 플레이하고 싶지 않습니다. 어떻게 하시겠습니까?"
    options:
      - { text: "{{t:fold|폴드}}", correct: true, why: "맞춰야 할 {{t:raise}}가 있고, 당신은 더 내고 싶지 않습니다. 이미 넣은 만큼만 잃습니다." }
      - { text: "{{t:check|체크}}", why: "상대가 {{t:raise|레이즈}}한 뒤에는 {{t:check|체크}}할 수 없습니다: 더 넣거나 {{t:fold|폴드}}해야 합니다." }
      - { text: "턴을 보려고 {{t:call|콜}}", why: "더 이상 플레이하고 싶지 않다면, 추가로 넣는 것은 모두 추가 손실입니다." }
  - kind: choice
    id: m1.exam.q5
    family: m1.streets
    rules: [R-M1-004]
    prompt: "턴에서 베팅이 진행되는 동안 {{t:board|보드}}에는 {{t:community-cards|커뮤니티 카드}}가 몇 장 있습니까?"
    options:
      - { text: "4", correct: true, why: "플롭에서 세 장이 나왔고, 턴에서 네 번째 카드가 추가됩니다. 다섯 번째 카드는 리버에서야 나옵니다." }
      - { text: "3", why: "플롭에는 세 장이 있습니다. 턴에서 한 장이 추가됩니다." }
      - { text: "5", why: "다섯 장은 리버에서야 모두 깔립니다." }
  - kind: choice
    id: m1.exam.q6
    family: m1.streets
    rules: [R-M1-004]
    prompt: "리버 베팅이 끝난 뒤, 당신과 상대 한 명이 남았습니다. 다음에는 무엇을 합니까?"
    options:
      - { text: "서로 카드를 공개합니다 (쇼다운)", correct: true, why: "리버는 마지막 {{t:betting-round|베팅 라운드}}입니다. 두 명 이상 남아 있으면 카드를 보여 주고, 가장 좋은 패가 {{t:pot|팟}}을 가져갑니다." }
      - { text: "카드가 한 장 더 나옵니다", why: "{{t:board|보드}}에는 카드가 최대 다섯 장입니다. 리버 이후에는 더 나오지 않습니다." }
      - { text: "{{t:pot|팟}}은 항상 똑같이 나눕니다", why: "패가 같을 때만 나눕니다. 보통은 더 좋은 핸드가 이깁니다." }
  - kind: choice
    id: m1.exam.q7
    family: m1.streets
    rules: [R-M1-004]
    prompt: "플롭에서 {{t:bet|베팅}}했고 나머지 모두가 {{t:fold|폴드}}했습니다. 어떻게 됩니까?"
    options:
      - { text: "카드를 보여 주지 않고 {{t:pot|팟}}을 가져갑니다", correct: true, why: "쇼다운은 리버 이후 두 명 이상 남아 있을 때만 합니다. 혼자 남으면 핸드가 끝납니다." }
      - { text: "턴과 리버가 나온 뒤 카드를 보여 줍니다", why: "더 플레이할 상대가 없으므로 다음 카드는 나오지 않습니다." }
      - { text: "{{t:pot|팟}}을 가져가려면 카드를 보여 줘야 합니다", why: "카드는 쇼다운에서 보여 주는데, 이번에는 쇼다운까지 가지 않았습니다." }
  - kind: choice
    id: m1.exam.q8
    family: m1.streets
    rules: [R-M1-004]
    prompt: "핸드가 쇼다운까지 갔습니다. 프리플롭을 포함하면 {{t:betting-round|베팅 라운드}}는 몇 번 진행되었습니까?"
    options:
      - { text: "4", correct: true, why: "프리플롭, 플롭, 턴, 리버입니다. 쇼다운은 마지막 라운드인 리버 다음에 합니다." }
      - { text: "3", why: "플롭, 턴, 리버는 세 라운드이지만, 그 앞에 프리플롭이 더 있습니다." }
      - { text: "5", why: "{{t:community-cards|커뮤니티 카드}}는 다섯 장이지만 {{t:betting-round|베팅 라운드}}는 네 번입니다: 플롭에서 카드 세 장이 한꺼번에 깔립니다." }
