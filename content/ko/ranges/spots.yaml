- id: nine.vs-open.sb-vs-btn
  title: "9인 테이블의 {{t:small-blind|스몰 블라인드}}, 버튼이 2.5bb로 {{t:open|오픈}}했습니다"
  hero: SB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:raise2.5"
  groups: *g-sb-vs-btn
  uncertain: *u-sb-vs-btn
- id: nine.vs-open.bb-vs-btn
  title: "9인 테이블의 {{t:big-blind|빅 블라인드}}, 버튼이 2.5bb로 {{t:open|오픈}}했고 {{t:small-blind}}는 {{t:fold|폴드}}했습니다"
  hero: BB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:raise2.5,SB:fold"
  groups: *g-bb-vs-btn
- id: nine.vs-open.bb-vs-sb
  title: "9인 테이블의 {{t:big-blind|빅 블라인드}}, {{t:small-blind}}가 3bb로 {{t:open|오픈}}했습니다"
  hero: BB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:fold,SB:raise3"
  groups: *g-bb-vs-sb

