      - action: bet-small
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{t:big-blind|빅 블라인드}}가 {{t:check|체크}}합니다. 작은 {{t:bet|베팅}}도 허용되지만 더 드문 선택입니다. 낮은 {{t:connected|커넥티드}} 플롭에서는 {{t:big-blind|빅 블라인드}}가 이 플롭에 맞는 {{t:connectors|커넥터}}와 작은 카드 핸드를 많이 디펜드하므로, 높은 플롭보다 {{t:c-bet|C벳}}을 덜 자주 합니다."
