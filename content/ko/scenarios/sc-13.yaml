# sc-13: Korean text of content/pl/scenarios/sc-13.yaml (role 06, session HA, 2026-11-13; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-13
module: m5
situation: "당신은 버튼에서 {{t:open|오픈}}했고, {{t:big-blind|빅 블라인드}}가 {{t:call|콜}}했습니다. 플롭에는 같은 무늬의 카드가 두 장 있고, 당신은 강한 핸드를 들고 있습니다: 좋은 {{t:kicker|키커}}를 가진 {{t:top-pair|탑 페어}} 또는 그보다 좋은 핸드입니다. 상대는 {{t:check|체크}}하며 {{t:flush-draw|플러시 드로우}}를 가지고 있을 수 있습니다. 어떤 크기로 {{t:bet|베팅}}하겠습니까?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { draws: [flush], marginMin: 0.02, expected: ["bet-big"], flop: { suits: [two-tone], ranks: [semi-connected, disconnected] } }
decisions:
  - street: flop
    kind: flop-size
    rule: R-M5-008
    pots: [12, 24, 36, 48]
    small: 0.25
    big: 0.6666666666666666
    actions:
      - action: "bet-big"
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대는 {{t:flush-draw|플러시 드로우}}를 가지고 있을 수 있습니다. 크게 {{t:bet|베팅}}하는 이유는 상대의 {{t:draw|드로우}}가 에퀴티가 많아서, 큰 {{t:bet|베팅}}으로 다음 카드에 비싼 값을 치르게 하기 때문입니다. {{t:flush-draw|플러시 드로우}}가 턴에서 완성될 확률은 약 {{n:odds.flush.flop-turn}}입니다. {{t:pot|팟}}의 3분의 2 크기 {{t:bet|베팅}}에 대해서는 다음 카드의 가격(에퀴티 {{n:eq.bet-two-thirds}})이 드로우가 그 카드에서 적중할 확률보다 높습니다."
      - action: "bet-small"
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대는 {{t:flush-draw|플러시 드로우}}를 가지고 있을 수 있습니다. 작은 {{t:bet|베팅}}은 {{t:draw|드로우}}에게 좋은 가격을 줍니다: {{t:pot|팟}}의 4분의 1 크기 {{t:bet|베팅}}이라면 에퀴티 {{n:eq.bet-quarter}}만 있으면 충분하고, 턴에서 적중할 확률은 약 {{n:odds.flush.flop-turn}}입니다. 이런 플롭에서 {{t:draw|드로우}}를 상대로 강한 핸드를 가졌다면 더 큰 크기로 {{t:bet|베팅}}합니다."
