    actions:
      - action: call
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대가 리버에서 크게 {{t:bet|베팅}}합니다. {{t:call|콜}}은 상대의 {{t:bet|베팅}} 중 {{t:bluff|블러프}}의 비율이 이 {{t:bet|베팅}}에서 필요한 에퀴티보다 클 때만 이익이 됩니다. 당신의 에퀴티가 바로 그 {{t:bluff|블러프}}의 비율이기 때문입니다. 상대에 대한 묘사는 이것을 바꾸지 않습니다: 핸드의 숫자를 비교합니다. 더 큰 {{t:bet|베팅}}일수록 더 많은 {{t:bluff|블러프}}가 필요합니다: {{t:pot|팟}} 크기의 {{t:bet|베팅}}에서는 약 {{n:eq.bet-pot}}입니다."
      - action: fold
