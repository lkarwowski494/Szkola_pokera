id: sc-31
module: m10
situation: "이 상대가 자주 {{t:bet|베팅}}하고 {{t:raise|레이즈}}한다고 가정하세요. 리버에서 당신은 상대의 {{t:bluff|블러프}}만 이길 수 있는 {{t:pair|페어}} 하나를 들고 있고, 상대가 크게 {{t:bet|베팅}}합니다. 또한 상대의 {{t:bet|베팅}} 중 {{t:bluff|블러프}}의 비율은 핸드에 주어진 대로라고 가정하세요."
