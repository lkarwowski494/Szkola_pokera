# SC-05 (M3): Button otwiera, BB broni, niski połączony flop (range-spot rfi.btn, potem cbet-case R-M5-004). Rola 06, sesja EH, 2026-11-11.
# Struktura jak pl (content/pl/scenarios/sc-05.yaml).
id: sc-05
module: m3
situation: "당신은 버튼에 있고, 앞의 모든 플레이어가 {{t:fold|폴드}}했습니다."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [rainbow], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
  sredni:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [low], suits: [two-tone], ranks: [connected] }
    holding: [air]
    expected: ["raise 2.5", check]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.btn
    rule: R-M3-003
    actions:
      - action: "raise 2.5"
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{w:stol}}, 앞의 모든 플레이어가 {{t:fold|폴드}}했습니다. {{t:open|오픈}}하는 이유는 블라인드만 남았고 플롭 이후에는 당신이 {{t:position|포지션}}을 가지기 때문입니다. 버튼에서는 핸드의 약 {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}}로 넓게 {{t:open|오픈}}합니다."
      - action: fold
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{w:stol}}, 앞의 모든 플레이어가 {{t:fold|폴드}}했습니다. {{t:fold|폴드}}는 너무 신중합니다. 솔버는 이 핸드를 대개 {{t:open|오픈}}합니다. 블라인드만 남았고 플롭 이후에는 당신이 {{t:position|포지션}}을 가지므로, 버튼에서는 핸드의 약 {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}}로 넓게 {{t:open|오픈}}합니다."
  - street: flop
    kind: cbet-case
    rule: R-M5-004
    actions:
      - action: check
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{t:big-blind|빅 블라인드}}가 {{t:check|체크}}합니다. {{t:check|체크}}하는 이유는 {{t:big-blind|빅 블라인드}}가 낮은 플롭에 맞는 {{t:connectors|커넥터}}와 작은 카드 핸드를 많이 디펜드하고, {{t:pair|페어}}도 {{t:draw|드로우}}도 없는 당신의 핸드는 빗나갔기 때문입니다. 이런 플롭에서는 높은 플롭보다 {{t:c-bet|C벳}}을 덜 자주 합니다."
      - action: bet-small
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{t:big-blind|빅 블라인드}}가 {{t:check|체크}}합니다. 작은 {{t:bet|베팅}}도 허용되지만 더 드문 선택입니다. 낮은 {{t:connected|커넥티드}} 플롭에서는 {{t:big-blind|빅 블라인드}}가 이 플롭에 맞는 {{t:connectors|커넥터}}와 작은 카드 핸드를 많이 디펜드하므로, 높은 플롭보다 {{t:c-bet|C벳}}을 덜 자주 합니다."
      - action: bet-big
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{t:big-blind|빅 블라인드}}가 {{t:check|체크}}합니다. 여기서 큰 {{t:bet|베팅}}은 부정확한 선택입니다. {{t:connected|커넥티드}} 플롭에서는 {{t:big-blind|빅 블라인드}}가 이미 {{t:straight|스트레이트}}를 가지고 있을 수 있으므로, 베팅한다면 작게 합니다. 낮은 플롭에서는 높은 플롭보다 {{t:c-bet|C벳}}도 덜 자주 합니다. {{t:big-blind|빅 블라인드}}가 이 플롭에 맞는 {{t:connectors|커넥터}}와 작은 카드 핸드를 많이 디펜드하기 때문입니다."
