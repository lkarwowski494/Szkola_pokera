# SC-06 (M3): mały blind przebija albo pasuje, potem rozmiar przebicia (F1 + F3: range-spot rfi.sb, size-spot open-size z sb). Rola 06, sesja DU,
# 2026-11-11. Ocena: rangeVerdict na solverze projektu (R-M3-009, gto) i rozmiar z parametru R-M3-007 (zły rozmiar = niedokładność).
# Węzeł solvera rfi.sb nie ma limpu (raise-or-fold), więc zamiast no-limp z planu jest rozmiar (D-1032). Jeden poziom (D-1034).
id: sc-06
module: m3
situation: "당신은 {{t:small-blind|스몰 블라인드}}에 있고, 모두 당신까지 {{t:fold|폴드}}했습니다."
table: 6max
positions: { hero: SB, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { freqs: [{ min: 0.97, max: 1 }, null], expected: ["raise 3", raise] }
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.sb
    rule: R-M3-009
    actions:
      - action: "raise 3"
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{w:stol}}, 모두 당신까지 {{t:fold|폴드}}했습니다. {{t:raise|레이즈}}하는 이유는 이제 {{t:big-blind|빅 블라인드}}하고만 겨루기 때문입니다. 플롭 이후에는 먼저 행동하므로 버튼과 비슷하게 넓게, 핸드의 약 {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}}로 {{t:open|오픈}}하며, 이 핸드는 그 안에 들어갑니다."
      - action: fold
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{w:stol}}, 모두 당신까지 {{t:fold|폴드}}했습니다. {{t:fold|폴드}}는 너무 신중합니다. 솔버는 이 핸드를 대개 {{t:raise|레이즈}}합니다. 이제 {{t:big-blind|빅 블라인드}}하고만 겨루므로 {{t:small-blind|스몰 블라인드}}에서는 핸드의 약 {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}}로 넓게 {{t:open|오픈}}합니다."
  - street: preflop
    kind: size-spot
    check: open-size
    rule: R-M3-007
    sb: true
    actions:
      - action: raise
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{w:stol}}, {{t:raise|레이즈}}합니다. {{n:pf.open-size-sb}}까지 {{t:raise|레이즈}}하는 이유는 {{t:small-blind|스몰 블라인드}}에서는 {{t:out-of-position|아웃 오브 포지션}}으로 플레이하므로 다른 {{t:position|포지션}}의 {{n:pf.open-size}}보다 조금 더 크게 하기 때문입니다. 모든 핸드에 같은 크기를 쓰면 핸드의 강도가 드러나지 않습니다."
      - action: raise-small
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{w:stol}}, {{t:raise|레이즈}}합니다. 이 크기는 부정확합니다. {{t:small-blind|스몰 블라인드}}에서는 {{t:out-of-position|아웃 오브 포지션}}으로 플레이하므로 조금 더 크게, {{n:pf.open-size-sb}}까지 {{t:raise|레이즈}}합니다."
      - action: raise-big
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{w:stol}}, {{t:raise|레이즈}}합니다. 이 크기는 부정확합니다. {{n:pf.open-size-sb}}면 충분합니다. 모든 핸드에 같은 크기를 쓰면 핸드의 강도가 드러나지 않습니다."
