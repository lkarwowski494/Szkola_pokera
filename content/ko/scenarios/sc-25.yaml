levels: [latwy]
bounds:
  latwy: { marginMin: 0.1, expected: ["check"], flop: { height: [high] } }
decisions:
  - street: river
    kind: river-value
    rule: R-M8-002
    calls: [AA, KK, AKs, AKo, AQs, AQo, KQs, KQo]
    folds: [QJs, QJo, JTs, JTo]
    pairKind: [second]
    actions:
      - action: "check"
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대가 리버에서 {{t:check|체크}}합니다. {{t:check|체크}}하고 무료로 {{t:showdown|쇼다운}}까지 가는 이유는 {{t:call|콜}}할 핸드 대부분이 당신보다 강한 핸드이기 때문입니다: 강한 핸드의 {{t:call|콜}}은 매번 {{t:bet|베팅}} 하나를 잃고, 약한 핸드의 {{t:call|콜}}은 하나만 땁니다. {{t:check|체크}}하면 상대의 모든 약한 핸드에 대해 {{t:pot|팟}}을 이깁니다."
      - action: "bet"
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대가 리버에서 {{t:check|체크}}합니다. {{t:bet|베팅}}은 손해입니다: {{t:call|콜}}할 핸드 대부분은 당신보다 강한 핸드이고, {{t:fold|폴드}}할 핸드는 어차피 {{t:showdown|쇼다운}}에서 당신을 이기지 못했을 핸드입니다. 이렇게 {{t:bet|베팅}}하면 {{t:showdown|쇼다운}}에서 가치가 있는 핸드가 {{t:bluff|블러프}}로 바뀝니다."
