id: sc-25
module: m8
situation: "리버에서 당신은 {{t:second-pair|세컨드 페어}}를 들고 버튼에 있고, {{t:big-blind|빅 블라인드}}가 {{t:check|체크}}합니다. 상대가 {{t:raise|레이즈}}하지 않는다고 가정하세요: AA, KK와 모든 AK, AQ, KQ로는 {{t:call|콜}}하고, 모든 QJ, JT로는 {{t:fold|폴드}}합니다. {{t:bet|베팅}}하겠습니까, {{t:check|체크}}하겠습니까?"
table: 6max
positions: { hero: BTN, villain: BB }
