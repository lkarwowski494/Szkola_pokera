# sc-11: Korean text of content/pl/scenarios/sc-11.yaml (role 06, session CO, 2026-11-11; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-11
module: m5
situation: "당신은 버튼에서 {{t:open|오픈}}했고, {{t:big-blind|빅 블라인드}}가 {{t:call|콜}}한 뒤 높은 {{t:dry|드라이}} 플롭에서 {{t:check|체크}}합니다."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy:
    flop: { height: [high], suits: [rainbow], ranks: [disconnected], wetness: [dry] }
    holding: [air]
    expected: [bet-small]
  sredni:
    flop: { height: [high], suits: [rainbow], ranks: [semi-connected] }
    holding: [air]
    expected: [bet-small]
decisions:
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{t:big-blind|빅 블라인드}}가 {{t:check|체크}}합니다. {{t:pot|팟}}의 약 {{n:cbet.size.small}}로 작게 {{t:bet|베팅}}하는 이유는 당신에게 {{t:range-advantage|레인지 우위}}가 있고 상대의 약한 핸드는 거의 승산이 없기 때문입니다. 작은 {{t:bet|베팅}}만으로도 {{t:fold|폴드}}시킬 수 있습니다. {{t:big-blind|빅 블라인드}}는 AA, KK, AK 대부분을 플롭 전에 {{t:raise|레이즈}}하므로, {{t:call|콜}}만 한 뒤에는 그런 핸드가 적습니다."
      - action: check
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{t:big-blind|빅 블라인드}}가 {{t:check|체크}}합니다. {{t:check|체크}}도 허용되지만 더 드문 선택입니다. 높은 {{t:dry|드라이}} 플롭에서는 {{t:range-advantage|레인지 우위}}가 있고 상대의 약한 핸드는 작은 {{t:bet|베팅}}에도 이미 {{t:fold|폴드}}하므로 자주, 작게 {{t:c-bet|C벳}}합니다. {{t:check|체크}}하면 상대에게 공짜 카드를 주게 됩니다."
      - action: bet-big
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{t:big-blind|빅 블라인드}}가 {{t:check|체크}}합니다. 여기서 큰 {{t:bet|베팅}}은 부정확한 선택입니다. 높은 {{t:dry|드라이}} 플롭에서는 상대의 약한 핸드가 그 정도 {{t:bet|베팅}}에도 이미 {{t:fold|폴드}}하므로, 보통 {{t:pot|팟}}의 약 {{n:cbet.size.small}}로 작게 {{t:c-bet|C벳}}합니다."
