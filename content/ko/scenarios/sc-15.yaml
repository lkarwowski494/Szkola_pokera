    actions:
      - action: call
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대가 작은 {{t:c-bet|C벳}}으로 {{t:bet|베팅}}합니다. {{t:call|콜}}하는 이유는 이 핸드가 이미 {{t:bluff|블러프}}를 이기거나 좋아질 수 있고, 작은 {{t:bet|베팅}}에는 에퀴티가 조금만 필요하기 때문입니다. {{t:pot|팟}}의 {{n:cbet.size.small}} 크기 {{t:bet|베팅}}에 대한 {{t:mdf|MDF}}({{t:range|레인지}}의 {{n:mdf.bet-third}})는 기준점입니다: 플롭에서 {{t:out-of-position|아웃 오브 포지션}}이라면 조금 덜 디펜드해도 되지만, 작은 {{t:c-bet|C벳}}에 대량으로 {{t:fold|폴드}}하지는 않습니다."
      - action: fold
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대가 작은 {{t:c-bet|C벳}}으로 {{t:bet|베팅}}합니다. {{t:fold|폴드}}는 이렇게 작은 {{t:bet|베팅}}에 맞서 에퀴티가 충분한 핸드를 포기하는 것입니다: 이 핸드는 이미 {{t:bluff|블러프}}를 이기거나 좋아질 수 있습니다. 플롭에서 {{t:out-of-position|아웃 오브 포지션}}이라면 {{t:mdf|MDF}}가 가리키는 것보다 조금 덜 디펜드해도 되지만, 작은 {{t:c-bet|C벳}}에 대량으로 {{t:fold|폴드}}하지는 않습니다."
