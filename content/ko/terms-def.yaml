royal-flush: "포커에서 가장 높은 족보입니다. 같은 무늬의 에이스, 킹, 퀸, 잭, 10으로 이루어집니다(예: A♠ K♠ Q♠ J♠ T♠)."
straight-flush: "같은 무늬로 된 연속된 카드 다섯 장입니다(예: 5♥ 6♥ 7♥ 8♥ 9♥). 가장 높은 형태(에이스부터 10까지)는 따로 부르는 이름이 있으며, 게임에서 가장 강한 족보입니다."
four-of-a-kind: "같은 숫자의 카드 네 장입니다(예: 7 네 장). 같은 숫자의 포카드끼리 맞붙으면 다섯 번째 카드(키커)가 높은 쪽이 이깁니다."
full-house: "트리플과 페어가 한 족보에 함께 있는 것입니다(예: 퀸 세 장과 5 두 장). 풀하우스끼리는 트리플이 높은 쪽이 이깁니다."
flush: "같은 무늬(♠, ♥, ♦ 또는 ♣)의 카드 다섯 장으로, 숫자가 연속되지 않습니다. 플러시끼리는 가장 높은 카드가 높은 쪽이 이기고, 같으면 그다음 카드로 가립니다."
straight: "연속된 카드 다섯 장으로, 모두 같은 무늬는 아닙니다(예: 5-6-7-8-9). 에이스는 가장 높은 카드(A-K-Q-J-T)도, 가장 낮은 카드(A-2-3-4-5)도 될 수 있습니다."
three-of-a-kind: "같은 숫자의 카드 세 장과 다른 카드 두 장입니다. 홀덤에서는 따로 부르는 이름이 있는 두 가지 형태가 있습니다. 페어가 손에 있고 세 번째 카드가 보드에 있으면 셋, 페어가 보드에 있고 세 번째 카드가 손에 있으면 트립스입니다."
set: "손에 든 페어와 보드의 카드 한 장으로 만든 트리플입니다(예: K-7-2 플롭에서 7♣ 7♦)."
two-pair: "서로 다른 페어 두 개와 다섯 번째 카드입니다(예: K-K-8-8-3). 동점이면 먼저 높은 페어, 다음으로 낮은 페어, 마지막으로 다섯 번째 카드로 가립니다."
pair: "같은 숫자의 카드 두 장과 다른 카드 세 장입니다(예: 9 두 장). 이보다 약한 족보는 하이카드뿐입니다."
high-card: "페어나 그보다 좋은 조합이 없는 족보입니다. 가장 높은 카드로 강도가 정해지고, 같으면 그다음 카드들로 가립니다."
kicker: "족보에 포함되지 않은 카드 중 가장 높은 카드로, 동점을 가립니다. 예: 킹을 곁들인 에이스 페어는 퀸을 곁들인 에이스 페어를 이깁니다."
wheel: "가장 낮은 스트레이트인 A-2-3-4-5로, 에이스가 가장 낮은 카드로 계산됩니다."
check: "칩을 더 내지 않고 계속 진행하는 것으로, 더 낼 금액이 없을 때만 할 수 있습니다. 즉 이번 베팅 라운드에서 아직 아무도 베팅하지 않았을 때입니다(프리플롭에서는 아무도 레이즈하지 않았을 때 빅 블라인드가 할 수 있습니다). 상대의 베팅에 맞춰 칩을 더 내는 콜과 혼동하지 마세요."
bet: "아직 아무도 베팅하지 않은 베팅 라운드에서 처음으로 칩을 거는 것입니다(넓은 의미로는 팟에 칩을 넣는 모든 행위를 베팅이라고 합니다)."
call: "계속 플레이하기 위해 상대의 베팅이나 레이즈 금액만큼 팟에 넣는 것입니다. 아무도 베팅하지 않았을 때 베팅 없이 계속 진행하는 체크와 혼동하지 마세요."
raise: "상대의 베팅보다 금액을 올리는 것입니다. 다른 플레이어는 차액을 넣거나, 다시 레이즈하거나, 폴드해야 합니다."
fold: "핸드를 포기하는 것입니다. 카드를 내려놓고 이미 팟에 넣은 칩을 잃습니다."
check-raise: "먼저 체크한 뒤 상대가 베팅하면 같은 베팅 라운드에서 레이즈하는 것입니다."
all-in: "가진 칩을 모두 거는 것입니다. 이때 각 상대에게서 최대 자신이 넣은 만큼만 이길 수 있으며, 나머지는 사이드 팟에서 겨룹니다."
pot: "현재 핸드에 걸린 모든 칩입니다. 쇼다운에서 가장 좋은 족보를 가진 플레이어(사이드 팟이 있으면 팟마다 따로)나, 나머지가 모두 폴드해 혼자 남은 플레이어가 가져갑니다."
side-pot: "누군가 올인했을 때 생기는 별도의 팟입니다. 올인한 플레이어보다 더 많이 넣은 플레이어들만 이 팟을 두고 겨루므로, 올인한 플레이어는 이 팟을 이길 수 없습니다."
split-pot: "족보가 같은 플레이어들이 팟을 나누는 상황입니다. 예를 들어 두 사람 모두 보드에 깔린 같은 스트레이트를 쓰는 경우입니다."
playing-the-board: "가장 좋은 다섯 장 족보가 커뮤니티 카드로만 이루어진 상황입니다. 홀 카드가 아무것도 더해 주지 않으므로, 잘해야 팟을 나눕니다."
board: "가운데에 공개된 커뮤니티 카드(플롭, 턴, 리버)로, 모든 플레이어가 사용합니다. 게임하는 테이블이 아니라 카드를 뜻합니다."
community-cards: "가운데에 앞면이 보이게 놓이는 카드로, 모든 플레이어가 자기 족보를 만드는 데 쓸 수 있습니다. 홀덤에서는 다섯 장입니다."
hole-cards: "홀덤에서 핸드를 시작할 때 엎어서 받는 카드 두 장입니다. 본인만 볼 수 있습니다."
small-blind: "카드를 나누기 전에 버튼 왼쪽 플레이어(두 명일 때는 버튼 자신)가 내는 더 작은 의무 베팅입니다. 그 자리도 이렇게 부릅니다."
big-blind: "카드를 나누기 전에 버튼 왼쪽 두 번째 플레이어(두 명일 때는 버튼 맞은편 플레이어)가 내는 더 큰 의무 베팅입니다. 그 자리도 이렇게 부릅니다. 스택 크기와 결과를 나타내는 단위로도 쓰입니다."
chips: "테이블에서 게임할 때 쓰는 원판입니다. 캐시 게임에서는 돈을, 토너먼트에서는 토너먼트 점수를 나타냅니다."
stack: "플레이어가 앞에 가진 모든 칩입니다. 보통 빅 블라인드 단위로 나타냅니다(예: 빅 블라인드 100개)."
street: "베팅 라운드를 가리키는 은어입니다. 프리플롭, 플롭, 턴, 리버가 네 개의 스트리트입니다. 예: “세 스트리트 밸류”는 플롭, 턴, 리버에서 밸류를 위해 베팅하는 것입니다."
betting-round: "플레이어들이 차례로 체크, 베팅, 콜, 레이즈 또는 폴드하는 핸드의 단계입니다. 홀덤에는 프리플롭, 플롭, 턴, 리버의 네 라운드가 있습니다."
preflop: "첫 번째 베팅 라운드로, 홀 카드를 나눈 뒤 보드에 플롭이 깔리기 전입니다."
flop: "프리플롭 베팅 후 한꺼번에 깔리는 첫 세 장의 커뮤니티 카드입니다. 두 번째 베팅 라운드도 이렇게 부릅니다."
turn: "네 번째 커뮤니티 카드이자 세 번째 베팅 라운드입니다."
river: "다섯 번째이자 마지막 커뮤니티 카드이며, 쇼다운 전 마지막 베팅 라운드입니다."
showdown: "마지막 베팅이 끝난 뒤 두 명 이상의 플레이어가 남아 있을 때 카드를 공개하는 것입니다. 가장 좋은 족보가 팟을 가져갑니다."
position: "버튼을 기준으로 한 테이블에서의 자리로, 행동 순서를 정합니다. 나중에 행동하는 사람일수록 결정하기 전에 상대의 행동을 더 많이 봅니다."
in-position: "플롭 이후 마지막으로 행동하는 플레이어의 상황으로, 결정하기 전에 상대의 행동을 봅니다."
out-of-position: "플롭 이후 상대보다 먼저 행동하는 플레이어의 상황으로, 상대의 행동을 모른 채 결정합니다."
early-position: "프리플롭에서 가장 먼저 행동하는 자리들입니다(예: UTG). 뒤에 아직 행동할 플레이어가 많습니다."
late-position: "마지막으로 행동하는 자리들입니다. 버튼과 바로 앞 자리들, 특히 컷오프가 해당합니다."
utg: "프리플롭에서 가장 먼저 행동하는 플레이어로, 빅 블라인드 바로 왼쪽에 앉습니다."
hijack: "컷오프 바로 앞 자리, 즉 버튼 오른쪽 두 번째 자리입니다."
cutoff: "버튼 바로 오른쪽 자리로, 버튼 바로 앞에 행동합니다."
button: "딜러 자리로, “딜러” 원판으로 표시합니다. 플롭 이후 모든 베팅 라운드에서 마지막으로 행동합니다."
outs: "덱에 아직 남아 있으며 핸드를 개선해 주는 카드로, 보통 드로우를 완성해 줍니다. 예: 플러시 드로우라면 내 무늬의 남은 카드들이 아웃입니다."
draw: "아직 강한 족보는 아니지만 다음 커뮤니티 카드에 따라 강한 족보가 될 수 있는 핸드입니다. 예를 들어 플러시나 스트레이트까지 카드 한 장이 부족한 경우입니다."
flush-draw: "같은 무늬의 카드 네 장(손과 보드를 합쳐서)으로, 한 장만 더 오면 플러시가 됩니다."
straight-draw: "스트레이트까지 한 장이 부족한 카드 네 장입니다. 종류: OESD(양쪽 끝 중 어느 한쪽 카드가 부족한 경우)와 거트샷(가운데 카드가 부족한 경우)."
oesd: "OESD는 open-ended straight draw의 약자로, 연속된 카드 네 장으로 된 스트레이트 드로우이며 양쪽 끝 어느 카드로든 완성됩니다. 예: 5-6-7-8은 4나 9를 기다립니다."
gutshot: "가운데 특정 숫자 하나가 빠진 스트레이트 드로우입니다. 예: 5-6-8-9는 7만 기다립니다."
backdoor: "플롭에서 턴과 리버에 연달아 맞는 카드 두 장이 필요한 드로우입니다. 예: 플롭 이후 같은 무늬 카드 세 장."
pot-odds: "내야 할 금액과 이길 수 있는 팟(상대 베팅 포함)의 비율입니다. 콜이 이득이 되려면 얼마나 자주 이겨야 하는지 알려 줍니다."
implied-odds: "족보를 맞혔을 때 이후 스트리트에서 더 얻을 것으로 예상되는 칩까지 더한 팟 오즈입니다."
equity: "더 이상 베팅 없이 남은 카드를 모두 깔았을 때 팟을 이길 확률입니다. 보통 백분율로 나타냅니다."
equity-realization: "베팅이 계속될 때 핸드가 자신의 에퀴티를 실제 승리로 얼마나 바꾸는지를 뜻합니다(에퀴티보다 적게도, 많게도 실현할 수 있습니다). 포지션, 핸드를 플레이하기 쉬운 정도 등에 따라 달라집니다."
expected-value: "같은 플레이를 여러 번 반복했을 때의 평균 결과입니다. 평균적으로 플러스인 플레이는 이번에 지더라도 장기적으로 돈을 법니다."
combo: "무늬까지 정해진 구체적인 두 장 조합 하나입니다(예: A♠ K♥). 이런 조합을 세면 특정 핸드가 레인지에 실제로 몇 개 있는지 알 수 있습니다."
range: "특정 상황에서 플레이어가 가질 수 있는 모든 핸드의 집합, 또는 특정 플레이를 할 핸드의 집합입니다."
mixed-hand: "균형 전략이 어떤 때는 한 플레이를, 어떤 때는 다른 플레이를 선택하는 핸드입니다(예: 때로는 레이즈, 때로는 콜). 두 플레이 모두 올바릅니다. 이런 핸드는 혼합 전략으로 플레이한다고도 합니다."
open: "앞의 모든 플레이어가 폴드했을 때 프리플롭에서 레이즈로 팟에 처음 들어가는 것입니다."
suited: "같은 무늬의 홀 카드 두 장입니다(예: A♥ K♥, 표기 AKs)."
offsuit: "서로 다른 무늬의 홀 카드 두 장입니다(예: A♥ K♣, 표기 AKo)."
pocket-pair: "홀 카드 두 장으로 된 페어입니다(예: 프리플롭의 8♣ 8♦)."
connectors: "숫자가 이웃한 홀 카드입니다(예: 8-7, 9-8). 스트레이트를 만들기 쉽습니다."
3-bet: "프리플롭에서 오픈에 대한 첫 레이즈입니다. 이 이름은 빅 블라인드를 첫 번째 베팅, 오픈을 두 번째 베팅으로 셉니다."
4-bet: "3벳에 대한 레이즈, 즉 베팅 라운드의 네 번째 베팅입니다."
limp: "아직 아무도 레이즈하지 않았을 때 프리플롭에서 빅 블라인드를 콜만 해서 팟에 들어가는 것입니다."
isolation: "한 명 이상이 림프한 뒤 림퍼(종종 약한 플레이어)와 일대일로 플레이하기 위해 하는 레이즈입니다."
texture: "커뮤니티 카드의 특성입니다. 무늬가 몇 가지인지, 카드 숫자가 서로 가까운지, 페어가 있는지를 봅니다. 이에 따라 가능한 족보와 드로우가 정해집니다."
dry: "가능한 드로우와 강한 족보가 적은 보드입니다(예: K♠ 7♦ 2♣)."
wet: "가능한 드로우와 강한 족보가 많은 보드입니다(예: J♥ T♥ 8♣)."
rainbow: "세 장이 모두 다른 무늬인 플롭으로, 플롭에서는 아무도 플러시 드로우를 갖지 못합니다."
two-tone: "두 장이 같은 무늬인 플롭으로, 플러시 드로우가 가능합니다."
monotone: "세 장이 모두 같은 무늬인 플롭으로, 이미 플러시가 완성되었을 수 있습니다."
paired: "페어(같은 숫자의 카드 두 장)가 깔린 보드입니다(예: 8-8-3)."
connected: "누군가 이미 스트레이트를 완성했을 수 있는 보드입니다(예: 9-8-7)."
disconnected: "카드 숫자가 서로 멀어서 스트레이트나 스트레이트 드로우를 만들기 어려운 보드입니다(예: K-7-2)."
semi-connected: "스트레이트 드로우는 있지만 아직 스트레이트는 불가능한 보드입니다(예: T-8-3, 이 과정에서 쓰는 분류)."
wetness: "보드가 드로우와 강한 족보에 얼마나 유리한지를 나타내는 정도로, 드라이부터 웻까지입니다. 보드가 얼마나 서로 맞물려 있는지(코디네이션)로 표현하기도 합니다."
top-pair: "보드에서 가장 높은 카드로 만든 페어입니다(예: K-7-2 플롭에서 K♠ Q♦)."
second-pair: "보드에서 두 번째로 높은 카드로 만든 페어입니다(예: K-7-2 플롭에서 7♠ 6♠)."
overpair: "보드의 모든 카드보다 높은 포켓 페어입니다(예: J-7-2 플롭에서 Q-Q)."
c-bet: "컨티뉴에이션 베팅으로, 이전 라운드에서 어그레서였던 플레이어의 베팅입니다. 예: 프리플롭에서 오픈한 뒤 플롭에서 하는 베팅."
aggressor: "이전 베팅 라운드에서 마지막으로 베팅하거나 레이즈한 플레이어입니다."
initiative: "마지막 어그레서의 역할로, 보통 이 플레이어가 다음 베팅을 합니다."
range-advantage: "특정 보드에서 한 플레이어의 레인지가 상대 레인지보다 전체 에퀴티가 더 큰 상황입니다."
nuts-advantage: "한 플레이어의 레인지에 가장 강한 핸드가 상대보다 비율상 더 많은 상황입니다."
nuts: "특정 순간에 해당 보드에서 가능한 가장 강한 핸드입니다. 예: K♥ 9♥ 4♥ 2♣ 보드에서는 하트 에이스가 포함된 플러시입니다."
polarized: "레인지에 대해: 주로 매우 강한 핸드와 블러프로 이루어지고, 중간 핸드가 거의 없는 상태입니다."
polarization: "양극단으로 레인지를 구성하는 것입니다. 밸류용 강한 핸드와 블러프로 채우고, 중간 핸드는 넣지 않습니다."
linear: "레인지에 대해: 위에서부터, 즉 가장 강한 핸드부터 아래로 구성하며 별도의 블러프 그룹이 없는 상태입니다. 관련 용어로 “머지드 레인지”(폴라라이즈드가 아닌 레인지)도 볼 수 있으며, 공개된 솔버 분석에 따르면 머지드는 이 레인지와 폴라라이즈드 레인지의 중간 형태입니다."
condensed: "레인지에 대해: 가장 강한 핸드가 없고(위쪽이 막혀 있고) 주로 중간 핸드로 이루어진 상태로, 폴라라이즈드의 반대입니다."
value: "상대가 더 약한 핸드로 콜하도록 강한 핸드로 베팅하는 것입니다."
value-bet: "밸류를 위한 한 번의 베팅으로, 더 약한 핸드가 콜하도록 강한 핸드로 합니다."
bluff: "쇼다운에서 이기기 어려운 약한 핸드로, 상대가 더 좋은 핸드를 폴드하도록 하는 베팅입니다."
semi-bluff: "아직 약하지만 좋아질 가능성이 있는 핸드(예: 드로우)로 하는 베팅입니다. 상대가 폴드하거나 카드가 맞으면 이깁니다."
blocker: "내 손에 있어 상대가 특정 핸드를 가질 확률을 낮추는 카드입니다. 예: 내가 하트 에이스를 들고 있으면 상대는 하트 에이스가 포함된 플러시를 가질 수 없습니다."
bluff-catcher: "상대의 블러프만 이기고 상대의 밸류 베팅에는 지는 핸드입니다."
barrel: "이전 라운드에서 직접 베팅한 뒤 다음 베팅 라운드에서 다시 하는 베팅입니다."
second-barrel: "연속된 두 번째 베팅입니다. 플롭에서 C벳을 한 뒤 턴에서 다시 베팅하는 것입니다."
probe-bet: "프리플롭 어그레서가 플롭에서 C벳 대신 체크한 뒤, 아웃 오브 포지션 플레이어가 턴에서 하는 베팅입니다."
donk-bet: "이전 라운드의 어그레서가 행동하기 전에 먼저 하는 베팅입니다."
overbet: "플롭 이후 팟 전체보다 큰 베팅입니다."
effective-stack: "두 플레이어 간 핸드에서 두 스택 중 작은 쪽으로, 실제로 이기거나 잃을 수 있는 최대 금액입니다. 여러 명일 때는 각 쌍마다 따로 계산합니다."
spr: "스트리트 시작 시점의 유효 스택을 팟으로 나눈 값입니다(핸드 계획에는 플롭 기준으로 계산합니다). 팟에 비해 스택이 얼마나 깊은지 보여 줍니다(SPR이 낮을수록 모든 칩이 더 빨리 팟에 들어갑니다)."
mdf: "승산이 없는 핸드로 하는 상대의 블러프가 자동으로 이득이 되지 않도록, 베팅에 맞서 지켜야 하는 레인지의 최소 비율입니다."
alpha: "승산이 없는 핸드로 하는 블러프가 본전이 되려면 상대가 얼마나 자주 폴드해야 하는지를 나타냅니다. 팟 대비 베팅 크기에 따라 달라집니다."
variance: "기댓값을 중심으로 한 결과의 흩어짐입니다. 잘 플레이해도 짧은 기간에는 크게 지거나 크게 이길 수 있습니다."
buy-in: "토너먼트에 참가하거나 캐시 게임 테이블에 앉기 위한 금액입니다."
bankroll: "포커에만 쓰기로 따로 떼어 둔 자금 전체입니다. 이 앱에서는 돈이 아니라 바이인 단위로 셉니다."
tilt: "감정(분노, 좌절, 들뜸)이 테이블에서의 결정을 나쁘게 만드는 상태입니다."
winrate: "긴 표본에서의 플레이어 평균 결과입니다. 캐시 게임에서는 보통 bb/100, 즉 100핸드당 빅 블라인드로 나타냅니다."
downswing: "결과가 눈에 띄게 나빠지는 기간으로, 보통 실력에 비해 손실이 더 큽니다. 업스윙의 반대입니다."
session: "게임을 시작해서 끝낼 때까지 한 번 앉아서 하는 포커입니다."
stakes: "캐시 게임의 블라인드 크기나 토너먼트의 바이인 크기입니다. “마이크로 스테이크”는 가장 낮은 단계입니다."
standard-deviation: "결과의 흩어짐을 나타내는 척도(분산의 제곱근)로, 포커에서는 보통 bb/100으로 나타냅니다."
risk-of-ruin: "같은 스테이크에서 계속 플레이할 때 언젠가 뱅크롤 전체를 잃을 확률입니다."
mental-game: "포커의 심리적 측면으로, 테이블에서 틸트, 감정, 집중력을 다루는 것입니다."
tournament: "일정 시간마다 블라인드가 오르고, 한 플레이어가 모든 칩을 모을 때까지 계속되는 게임 형식입니다. 상위 순위 플레이어가 상금을 받습니다."
push-fold: "숏 스택을 위한 단순화된 전략으로, 프리플롭에서 올인하거나 폴드만 합니다."
shove: "올인하는 플레이로, 보통 프리플롭 레이즈로 합니다."
icm: "상금 구조와 모든 플레이어의 스택을 고려해 토너먼트 칩을 금전 가치로 환산하는 모델입니다."
bubble: "상금권 직전의 토너먼트 단계로, 몇 명만 더 탈락하면 상금권에 들어갑니다."
bubble-factor: "ICM에서 나온 지표로, 토너먼트에서 같은 수의 칩을 잃는 고통이 얻는 기쁨보다 얼마나 더 큰지를 나타냅니다."
cover: "상대보다 칩이 같거나 많은 것입니다. 상대가 나를 커버하면, 그 상대와의 올인에서 지는 순간 토너먼트가 끝납니다."
risk-premium: "토너먼트에서 올인 위험을 감수하려면 팟 오즈가 요구하는 것보다 더 필요한 추가 에퀴티입니다. 지면 잃는 것이 이기면 얻는 것보다 크기 때문입니다."
m-ratio: "스택을 한 핸드의 블라인드와 앤티 합계로 나눈 값으로, 플레이하지 않고 칩이 몇 바퀴(오빗) 버틸 수 있는지를 나타냅니다."
red-zone: "M이 매우 낮은 구간으로, 주로 올인 아니면 폴드만 남습니다."
green-zone: "M이 높은 구간으로, 스택이 넉넉해 자유롭게, 신중하게 또는 공격적으로 플레이할 수 있습니다."
ante: "카드를 나누기 전에 모든 플레이어가 팟에 내는 작은 의무 금액입니다(주로 토너먼트)."
bb-ante: "모든 플레이어 대신 빅 블라인드 자리의 플레이어가 테이블 전체의 앤티를 내는 앤티 방식입니다."
fold-equity: "상대가 폴드할 수 있다는 점에서 나오는 플레이 가치의 일부입니다."
gap-concept: "오픈을 콜하려면 직접 오픈할 때보다 더 강한 핸드가 필요하다는 원칙입니다."
chip-ev: "칩을 돈으로 환산하지 않고(ICM 없이) 칩 단위로 계산한 플레이의 기댓값입니다."
tournament-equity: "주어진 상금 구조와 스택에서 기대되는 상금 풀의 내 몫입니다. “$EV”라고도 합니다."
prize-pool: "토너먼트에서 상금을 받는 플레이어들이 나눠 가질 돈의 합계입니다."
payout: "토너먼트의 특정 순위에 주어지는 상금으로, 이를 모두 합치면 상금 분배가 됩니다."
pay-jump: "토너먼트에서 이웃한 순위 간 상금 차이입니다. 차이가 크면 리스크 프리미엄이 커집니다."
final-table: "토너먼트의 마지막 테이블로, 가장 큰 상금을 놓고 겨룹니다."
short-stack: "블라인드에 비해 작은 스택입니다. 토너먼트에서는 보통 빅 블라인드가 몇 개 남지 않은 스택입니다."
nash-equilibrium: "어떤 플레이어도 자기 전략만 바꿔서는 이득을 볼 수 없는 전략의 조합입니다."
overcall: "앞의 누군가가 이미 콜한 베팅을 콜하는 것입니다."
heads-up: "일대일 게임으로, 테이블이나 핸드에 플레이어가 두 명만 남은 상황입니다."
dead-money: "더 이상 팟을 이길 수 없는 플레이어들이 넣은 칩입니다(예: 폴드한 플레이어의 칩)."
stack-off: "한 핸드에서 스택 전체를 팟에 넣는 것, 즉 올인하거나 올인을 콜하는 것입니다."
exploit: "상대 또는 플레이어 풀 전체의 특정 실수를 이용하기 위해 기본 전략에서 의도적으로 벗어나는 것입니다."
hud: "온라인 게임에서 테이블 위에 표시되어, 이전에 플레이한 핸드를 바탕으로 상대의 통계를 보여 주는 오버레이입니다."
vpip: "HUD 통계로, 플레이어가 프리플롭에서 자발적으로 팟에 돈을 넣는(콜이나 레이즈) 핸드의 비율입니다."
pfr: "HUD 통계로, 플레이어가 프리플롭에서 레이즈하는 핸드의 비율입니다."
wtsd: "HUD 통계로, 플롭을 본 플레이어가 쇼다운까지 가는 빈도입니다."
nit: "거의 강한 핸드로만 팟에 들어가는 매우 타이트한 플레이어입니다."
regular: "해당 스테이크에서 꾸준히 많은 핸드를 소화하는 단골 플레이어입니다. 이 과정에서는 레크리에이션 플레이어와 대비됩니다."
tag: "타이트하고 공격적인 스타일로, 적은 핸드를 공격적으로(베팅과 레이즈로) 플레이합니다."
lag: "루즈하고 공격적인 스타일로, 많은 핸드를 공격적으로 플레이합니다."
recreational: "재미로 플레이하며 보통 레귤러보다 약한 플레이어입니다. 은어로는 낮춰서 “피시”라고 부릅니다."
calling-station: "약한 핸드나 드로우로도 매우 자주 콜하는 플레이어를 낮춰 부르는 말입니다."
maniac: "아무 핸드로나 베팅하고 레이즈하는 매우 루즈하고 공격적인 플레이어를 낮춰 부르는 말입니다."
rake: "카지노나 온라인 포커룸이 게임 운영 대가로 팟에서 떼어 가는 수수료입니다."
rake-cap: "포커룸이 한 핸드에서 가져갈 수 있는 레이크의 최대 금액입니다."
