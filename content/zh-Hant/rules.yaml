# Reguły odruchowe „Jeśli X, to Y, bo Z”. Poziom: rules (zasady gry), math, gto, heuristic, exploit.
# Kryteria poziomów (S-05, audyt 4.10):
#   math      – twierdzenie, które samo jest rachunkiem (outy, szanse, cena sprawdzenia, znak EV, dominacja jednej akcji nad drugą);
#   heuristic – zalecenie wyprowadzone z rachunku albo z literatury, bez wyniku solvera;
#   gto       – opublikowany wynik solvera albo rozwiązania równowagi;
#   exploit   – dostosowanie do typu gracza; musi podać populację;
#   rules     – zasady gry i definicje.
# Reguła eksploatacyjna musi podać populację źródłową (walidacja w content-build).
# Pole source: pełny opis źródeł z adresami i cytatami najwyżej 2 zdania, bez nazw serwisów i marek (decyzja właściciela
# z 9.10.2026); zostaje w repozytorium. Pole sources: jedno niezależne źródło (organizacja albo autor) = jedna pozycja
# { kind, url? }; kind: math, rules, solver-pub, solver-app, book, study, reference, training, population (SourceKind
# w content-schema). Aplikacja pokazuje tylko rodzaj i liczbę źródeł, np. „serwisy szkoleniowe (3)”; jedno źródło inne
# niż rachunek dostaje dopisek „jedno źródło”.
# Pole check (tryb gry M13, dokument 14, 4.4.3 i 6.2 A): warunek sprawdzalny automatycznie w silniku oceny
# (packages/poker-core/src/grading.ts). kind = rodzaj sprawdzenia, players/stackBb = konfiguracje stołu, których
# dotyczy źródło reguły (5.5; brak = każda, reguły rachunkowe), streets, spots (spoty solvera), drill (przypadki
# c-betu), params (liczby jako n:klucz). Reguły-zakazy (free-check-fold, no-limp) oceniają tylko naruszenie.

- id: R-M0-001
  module: m0
  if: "兩位玩家的牌型不同"
  then: "牌型排名較高者獲勝，與牌點大小無關"
  because: "牌型排名優先於牌點大小；{{t:flush|同花}}一定贏{{t:straight|順子}}，{{t:full-house|葫蘆}}一定贏{{t:flush|同花}}"
  level: rules
  source: "德州撲克規則：經加州博弈監管機關核准的賭場規則（https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf），Card Values and Hand Rankings：「The ranking of hands for Texas Hold'em, in order from highest to lowest rank, shall be」；經監管機關核准的伯斯賭場撲克規則（RAG/551）（https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf），10.1；輔助：List of poker hands（https://en.wikipedia.org/wiki/List_of_poker_hands）（文件 12 M0–M3）"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-002
  module: m0
  if: "兩位玩家的牌型核心相同：同樣的{{t:pair|對子}}、{{t:three-of-a-kind|三條}}，或同樣的{{t:two-pair|兩對}}"
  then: "由踢腳牌決定，從最大的開始依序比較，但只比最佳 5 張牌之內的踢腳牌；如果五張牌完全相同，就{{t:split-pot|平分底池}}"
  because: "先看牌型等級，再看牌型大小，核心完全相同時才看踢腳牌；只算 7 張牌中最好的五張"
  level: rules
  source: "德州撲克規則：經監管機關核准的伯斯賭場撲克規則（RAG/551）（https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf），10.3–10.4：「all cards count, for example, Q:Q:7:7:9 shall lose to Q:Q:7:7:10」；Robert's Rules of Poker（https://briggsoft.com/docs/pmavens/Rules_Roberts.htm），第 3 節與第 5 節；輔助，比較順序：List of poker hands（https://en.wikipedia.org/wiki/List_of_poker_hands）（文件 12 M0–M3）"
  sources: [{ kind: rules, url: "https://crownperth.com.au/getmedia/33f9b1ae-834f-4fdd-a74c-81ccc7411326/crown-perth-gaming-poker-rules.pdf" }, { kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: reference, url: "https://en.wikipedia.org/wiki/List_of_poker_hands" }]
- id: R-M0-003
  module: m0
  if: "雙方最佳的 5 張牌都在{{t:board|公共牌面}}上"
  then: "{{t:split-pot|平分底池}}"
  because: "雙方打的是同樣的五張牌（「{{t:playing-the-board|打公牌}}」）"
  level: rules
  source: "德州撲克規則：Robert's Rules of Poker（https://briggsoft.com/docs/pmavens/Rules_Roberts.htm），第 5 節（「play the board」）；經加州博弈監管機關核准的賭場規則（https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf）：「the pot shall be split equally among all players with the winning hand」；輔助：Texas hold 'em（https://en.wikipedia.org/wiki/Texas_hold_%27em）（文件 12 M0–M3）"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }, { kind: reference, url: "https://en.wikipedia.org/wiki/Texas_hold_%27em" }]

- id: R-M1-001
  module: m1
  if: "這一輪在你之前沒有人{{t:bet|下注}}"
  then: "你可以{{t:check|過牌}}或{{t:bet|下注}}"
  because: "只有已經存在的{{t:bet|下注}}才能{{t:call|跟注}}或{{t:raise|加注}}"
  level: rules
  source: "德州撲克規則：Robert's Rules of Poker（https://briggsoft.com/docs/pmavens/Rules_Roberts.htm），第 3 節（「fold, check, bet, call, or raise」）（文件 12 M0–M3）"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }]
- id: R-M1-002
  module: m1
  if: "你可以免費{{t:check|過牌}}"
  then: "你永遠不{{t:fold|棄牌}}"
  because: "{{t:fold|棄牌}}會白白放棄{{t:pot|底池}}，而{{t:check|過牌}}不花任何成本"
  level: math
  check: { kind: free-check-fold }
  source: "計算：過牌的成本是 0，而且保留贏得底池的機會，所以永遠不比棄牌差"
  sources: [{ kind: math }]
- id: R-M1-003
  module: m1
  if: "有人{{t:bet|下注}}了，而你不想繼續玩"
  then: "你{{t:fold|棄牌}}"
  because: "你只會輸掉已經投入的部分；每一次沒有理由的{{t:call|跟注}}都是額外損失"
  level: math
  source: "計算：棄牌就退出這手牌、不再投入，所以損失只有已經投入的部分；用不打算繼續的手牌跟注，會讓損失增加跟注的金額"
  sources: [{ kind: math }]
- id: R-M1-004
  module: m1
  if: "這手牌進入下一個{{t:betting-round|下注輪}}"
  then: "翻牌是 3 張{{t:community-cards|公共牌}}，轉牌和河牌各一張；河牌下注結束後，還留在牌局中的玩家（至少兩位）亮牌（攤牌）"
  because: "這是德州撲克的規則：共有四個{{t:betting-round|下注輪}}，河牌是最後一輪"
  level: rules
  source: "德州撲克規則：Robert's Rules of Poker（https://briggsoft.com/docs/pmavens/Rules_Roberts.htm），第 5 節（「Three boardcards are turned simultaneously … The next two boardcards are turned one at a time」）；Wikipedia，Texas hold 'em（文件 12 M0–M3）"
  sources: [{ kind: rules, url: "https://briggsoft.com/docs/pmavens/Rules_Roberts.htm" }, { kind: rules }]

- id: R-M2-001
  module: m2
  if: "翻牌時你有 {{n:draw.flush.seen}} 張{{t:flush|同花}}的牌"
  then: "你有 {{n:outs.flush}} 張補牌：轉牌成{{t:flush|同花}}的機率約 {{n:odds.flush.flop-turn}}；只有在不必再面對{{t:bet|下注}}就能看到兩張牌時（全下），到河牌的機率才約 {{n:odds.flush.flop-river}}"
  because: "一個花色有 {{n:cards.per-suit}} 張牌，你看到了 {{n:draw.flush.seen}} 張；在翻牌{{t:call|跟注}}一次{{t:bet|下注}}只能買到一張牌"
  level: math
  source: "精確計算"
  sources: [{ kind: math }]
- id: R-M2-002
  module: m2
  if: "你已經算好補牌數"
  then: "你估算命中機率：看一張牌時補牌數 × 2，看兩張牌時補牌數 × 4；翻牌面對{{t:bet|下注}}時只算一張牌（× 2），只有在不必再面對{{t:bet|下注}}就能看到轉牌和河牌時（全下）才用 × 4"
  because: "對手可以讓你為河牌另外付錢；補牌最多 {{n:rule24.outs.max}} 張時，2 與 4 法則的誤差約 {{n:rule24.error.max.pp}} 個百分點"
  level: math
  source: "訓練網站，Poker drawing odds & outs explained（https://upswingpoker.com/poker-drawing-odds-outs-explained/）：「For anything 10 outs or less, however, its accurate within 2% for the turn and river calculation」；計算：最大誤差為 10 張補牌時的 1.7 個百分點（文件 12 M0–M3）"
  sources: [{ kind: training, url: "https://upswingpoker.com/poker-drawing-odds-outs-explained/" }, { kind: math }]
- id: R-M2-003
  module: m2
  if: "對手下注半個{{t:pot|底池}}"
  then: "要{{t:call|跟注}}，你需要 {{n:eq.bet-half}} 的權益"
  because: "你付 1 份，而你{{t:call|跟注}}後的{{t:pot|底池}}共有 4 份（{{t:pot|底池}} 2、下注 1、你的{{t:call|跟注}} 1），所以你需要 4 份中的 1 份"
  level: math
  source: "計算：下注/(底池+2·下注)"
  sources: [{ kind: math }]
- id: R-M2-004
  module: m2
  if: "對手下注整個{{t:pot|底池}}"
  then: "要{{t:call|跟注}}，你需要 {{n:eq.bet-pot}} 的權益"
  because: "你付 1 份，而你{{t:call|跟注}}後的{{t:pot|底池}}共有 3 份（{{t:pot|底池}} 1、下注 1、你的{{t:call|跟注}} 1），所以你需要 3 份中的 1 份"
  level: math
  source: "計算：下注/(底池+2·下注)"
  sources: [{ kind: math }]
- id: R-M2-005
  module: m2
  if: "你的權益低於所需權益（若是{{t:draw|聽牌}}：以這個價格能看到的牌中命中的機率）"
  then: "你{{t:fold|棄牌}}（不考慮其他理由，例如隱含賠率）"
  because: "長期來看，每一次這樣的{{t:call|跟注}}都會虧錢"
  level: math
  check: { kind: draw-price, streets: [flop] }
  source: "計算：EV = 權益 × （你跟注後的底池）− 跟注額；當權益 < 跟注額 ÷ 你跟注後的底池時為負"
  sources: [{ kind: math }]

- id: R-M3-001
  module: m3
  if: "你在按鈕位，前面所有人都{{t:fold|棄牌}}了"
  then: "你{{t:open|開池}}的範圍是盲注之前所有{{t:position|位置}}中最寬的；只有{{t:small-blind|小盲}}的{{t:open|開池}}範圍差不多一樣寬"
  because: "從翻牌開始你最後行動，而且你後面只剩盲注"
  level: gto
  source: "求解器圖表網站，6-max 100bb NL500（https://beyondgto.com/ranges/btn-open-6max-100bb, https://beyondgto.com/ranges/sb-open-6max-100bb）：BTN 42%、SB 44%；訓練網站，Small Blind strategy（https://upswingpoker.com/small-blind-poker-strategy-tips/）：SB 比按鈕位稍寬，40–50%；翻前圖表網站，6-max charts（https://www.preflopwizard.app/blog/6-max-preflop-charts）：BTN 40–45%、SB 39–47%（文件 12，D2）"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-002
  module: m3
  if: "前面所有人都{{t:fold|棄牌}}，輪到你在{{t:utg|UTG}}"
  then: "你{{t:open|開池}}約 {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} 的手牌"
  because: "你後面還有五位玩家，所以更常有人拿到比你好的牌"
  level: gto
  check: { kind: solver-spot, players: [6], stackBb: [100], spots: [rfi.utg] }
  source: "商業求解器網站，Range Morphology（https://blog.gtowizard.com/preflop-range-morphology/）：UTG 17.6%；求解器圖表網站（NL500, https://beyondgto.com/ranges/lj-open-6max-100bb, …/hj-…, …/co-…, …/btn-open-6max-100bb）：UTG 17%、HJ 22%、CO 28%、BTN 42%；翻前圖表網站，6-max charts（https://www.preflopwizard.app/blog/6-max-preflop-charts）：15–17 / 19–22 / 25–28 / 40–45%（文件 12 M0–M3，D6）"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/lj-open-6max-100bb" }]
- id: R-M3-003
  module: m3
  if: "前面所有人都{{t:fold|棄牌}}，輪到你在按鈕位"
  then: "你{{t:open|開池}}約 {{n:pf.rfi.btn.low}}–{{n:pf.rfi.btn.high}} 的手牌"
  because: "只剩盲注，而且翻牌後你會擁有{{t:position|位置}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.btn, nine.rfi.btn] }
  source: "求解器圖表網站，BTN open 6-max 100bb（https://beyondgto.com/ranges/btn-open-6max-100bb，NL500）：約 42%；翻前圖表網站，6-max charts（https://www.preflopwizard.app/blog/6-max-preflop-charts）：40–45%（文件 12 M0–M3，D6）"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/btn-open-6max-100bb" }]
- id: R-M3-004
  module: m3
  if: "你是第一個入池的人"
  then: "你{{t:raise|加注}}或{{t:fold|棄牌}}，而不是只補齊盲注（溜入，limp）；在{{t:small-blind|小盲}}這是簡化：部分求解器解法會用一部分手牌溜入"
  because: "{{t:raise|加注}}可能直接贏下盲注，並給你{{t:initiative|主動權}}；溜入則兩者都放棄"
  level: heuristic
  check: { kind: no-limp, players: [6, 9], stackBb: [100] }
  source: "訓練網站，Why limping is bad（https://upswingpoker.com/why-limping-in-poker-is-bad/）：「If you make everyone fold preflop, you win 100% of the pot … You can't ever do that in a pot you've limped into」；求解器圖表網站，open 6-max 100bb（https://beyondgto.com/ranges/lj-open-6max-100bb，HJ、CO、BTN 亦同）：「raising rather than limping or jamming at this depth」，SB（https://beyondgto.com/ranges/sb-open-6max-100bb）：「At 100bb the whole range plays as raise-or-fold」。小盲：第 2 層級來源互相矛盾，附求解器圖表的訓練網站（https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics）：「completes (limps) 20.5%」；SB 加注或棄牌是明確標示的簡化，因為本應用的求解器樹沒有溜入（D-144；文件 12 M0–M3）"
  sources: [{ kind: training, url: "https://upswingpoker.com/why-limping-in-poker-is-bad/" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]
- id: R-M3-005
  module: m3
  if: "你可以在同樣兩張牌的同花色版本和不同花色版本之間選擇"
  then: "同花色（suited）的手牌更強"
  because: "它多了一條靠{{t:flush|同花}}獲勝的路"
  level: math
  source: "權益計算"
  sources: [{ kind: math }]
- id: R-M3-006
  module: m3
  if: "前面所有人都{{t:fold|棄牌}}，輪到你在{{t:hijack|HJ}}或{{t:cutoff|CO}}"
  then: "你{{t:open|開池}}比{{t:utg|UTG}}寬、比按鈕位窄；{{t:cutoff|CO}}比{{t:hijack|HJ}}寬"
  because: "你後面剩下的玩家越少，就越少有人拿到更好的牌，翻牌後你也越常擁有{{t:position|位置}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.hj, rfi.co, nine.rfi.hj, nine.rfi.co] }
  source: "商業求解器網站，Range Morphology（https://blog.gtowizard.com/preflop-range-morphology/）：UTG 17.6%；求解器圖表網站（NL500, https://beyondgto.com/ranges/hj-open-6max-100bb, https://beyondgto.com/ranges/co-open-6max-100bb）：UTG 17%、HJ 22%、CO 28%、BTN 42%；翻前圖表網站，6-max charts（https://www.preflopwizard.app/blog/6-max-preflop-charts）：15–17 / 19–22 / 25–28 / 40–45%（文件 12 M0–M3，D6）：開池範圍從 UTG 到按鈕位逐漸變寬"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/hj-open-6max-100bb" }]
- id: R-M3-007
  module: m3
  if: "你以{{t:raise|加注}}第一個入池"
  then: "你在每個{{t:position|位置}}都{{t:raise|加注}}到 {{n:pf.open-size}}，在{{t:small-blind|小盲}}則到 {{n:pf.open-size-sb}}（簡化）"
  because: "每個{{t:position|位置}}用同一個尺寸，簡單又不會透露手牌強度；在{{t:small-blind|小盲}}你打牌時{{t:out-of-position|無位置}}，所以{{t:raise|加注}}多一點"
  level: heuristic
  check: { kind: open-size, players: [6, 9], stackBb: [100], params: { open: "n:pf.open-size", openSb: "n:pf.open-size-sb" } }
  source: "翻前圖表網站，6-max charts（https://www.preflopwizard.app/blog/6-max-preflop-charts）：「the standard open size is 2.5bb from all positions … 3bb from the small blind」；商業求解器網站，Range Morphology（https://blog.gtowizard.com/preflop-range-morphology/）：UTG 2bb、CO 2.3bb、BTN 2.5bb、SB 3bb（簡化，文件 12，D8）"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://blog.gtowizard.com/preflop-range-morphology/" }]
- id: R-M3-008
  module: m3
  if: "你拿到最強的一組手牌（AA、KK、QQ、AK），而你前面有人{{t:raise|加注}}"
  then: "你通常為了{{t:value|價值}}再{{t:raise|加注}}（3-bet），而不是只{{t:call|跟注}}"
  because: "這些手牌對上對手用來{{t:open|開池}}的大多數手牌都是領先的；3-bet 能做大{{t:pot|底池}}並減少對手人數"
  level: heuristic
  source: "3-bet 圖表網站，3-bet ranges（https://pokerpro.tools/preflop/3-bet-ranges）：QQ+ 和 AK 對每個位置都屬於價值部分（「Mostly 3-bet」）；翻前圖表網站，UTG strategy（https://www.preflopwizard.app/blog/poker-utg-strategy）：AA–JJ 和 AKs（文件 12，D9）"
  sources: [{ kind: training, url: "https://pokerpro.tools/preflop/3-bet-ranges" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-utg-strategy" }]
- id: R-M3-009
  module: m3
  if: "前面所有人都{{t:fold|棄牌}}，輪到你在{{t:small-blind|小盲}}"
  then: "你以寬範圍{{t:open|開池}}，約 {{n:pf.rfi.sb.low}}–{{n:pf.rfi.sb.high}} 的手牌，打法是{{t:raise|加注}}到 {{n:pf.open-size-sb}}或{{t:fold|棄牌}}（簡化：部分求解器解法會用{{t:small-blind|小盲}}的一部分手牌溜入）"
  because: "你只剩對上{{t:big-blind|大盲}}；翻牌後你先行動，所以你{{t:open|開池}}大約和按鈕位一樣寬，而不是寬很多"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [rfi.sb, nine.rfi.sb] }
  source: "求解器圖表網站，SB open 6-max 100bb NL500（https://beyondgto.com/ranges/sb-open-6max-100bb）：約 44%，加注或棄牌；訓練網站，Small Blind strategy（https://upswingpoker.com/small-blind-poker-strategy-tips/）：40–50%；翻前圖表網站（https://www.preflopwizard.app/blog/6-max-preflop-charts）：39–47%；40–45% 的區間是不溜入策略的交集（文件 12，D3）。加注或棄牌的簡化（D-144）：附求解器圖表的訓練網站（https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics）：「The small blind raises (3bb) 33.1% : completes (limps) 20.5%」"
  sources: [{ kind: training, url: "https://upswingpoker.com/small-blind-poker-strategy-tips/" }, { kind: training, url: "https://www.preflopwizard.app/blog/6-max-preflop-charts" }, { kind: solver-pub, url: "https://beyondgto.com/ranges/sb-open-6max-100bb" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }]

- id: R-M3-010
  module: m3
  if: "你在 9 人桌，而你前面所有人都{{t:fold|棄牌}}了"
  then: "在{{t:utg|UTG}}、{{t:utg|UTG}}+1 和{{t:utg|UTG}}+2，你{{t:open|開池}}比 6 人桌的{{t:utg|UTG}}更窄；從 LJ 開始，你就像在 6 人桌一樣打（LJ 等同{{t:utg|UTG}}）"
  because: "你後面坐的玩家比 6 人桌多，所以更常有人拿到更好的牌；前面的玩家{{t:fold|棄牌}}後，LJ 後面剩下的玩家數和 6 人桌{{t:utg|UTG}}後面一樣多"
  level: heuristic
  check: { kind: solver-spot, players: [9], stackBb: [100], spots: [nine.rfi.utg, nine.rfi.utg1, nine.rfi.utg2, nine.rfi.lj] }
  source: "本專案的翻前求解器，9 人桌 100bb（ADR-20；文件 10，「N9a 最終測量」：部分驗證 N1–N4，NashConv 0.0094bb；UTG–UTG+2 的組成未經驗證，頻率也未經第 2 層級驗證（D-153），所以本規則只給方向，不給求解器數字；heuristic 層級，D-144）。與第 4 層級 9-max 圖表的交集一致：UTG 約 9–13%，UTG+1 約 11–14%（翻前圖表網站，9-Max Preflop Chart，https://preflopwizard.app/blog/9-max-preflop-chart；第二個翻前圖表網站，https://about-poker.com/preflop-gto/preflop-range-chart-cash-game；文件 10，「9-max 100bb 配置」）。UTG–UTG+2 棄牌後的打法與 6-max 完全相同（樹測試）"
  sources: [{ kind: training, url: "https://preflopwizard.app/blog/9-max-preflop-chart" }, { kind: training, url: "https://about-poker.com/preflop-gto/preflop-range-chart-cash-game" }, { kind: solver-app }]
- id: R-M3-011
  module: m3
  if: "你有兩張不同的牌，想知道它們能否一起組成{{t:straight|順子}}"
  then: "離得越近，方式越多：從 5-4 到 J-T 的相鄰牌在四種不同的{{t:straight|順子}}裡，隔一張的在三種，相差五個點數以上的（例如 7-2）一種也沒有"
  because: "{{t:straight|順子}}是五個連續點數；兩張牌差得越遠，同時包含兩張的五張組合越少（A 也可當作 1）"
  level: math
  source: "計算：對 169 種手牌逐一檢查從 A-2-3-4-5 到 10-J-Q-K-A 的十種順子；定義：加州監管機構核准的牌室規則（https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf）"
  sources: [{ kind: math }, { kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }]
- id: R-M3-012
  module: m3
  if: "你有一張大牌和一張較弱的第二張牌（例如 K5 或 A7），而對手可能有同一張大牌和更好的{{t:kicker}}"
  then: "兩人都用這張牌中{{t:pair|對子}}時，{{t:kicker}}較好的對手會贏你（你的手牌被壓制）；兩張大牌則相反：大的{{t:kicker}}能贏同一張牌的較弱手牌"
  because: "對子相同時由{{t:kicker}}決定，所以翻牌前被壓制的手牌贏的次數比壓制它的手牌少，因此很難打（簡化：訓練資料是在談防守 3-bet 時這樣說的）"
  level: heuristic
  source: "規則：牌型核心相同時由踢腳決定（R-M0-002）；計算：被壓制手牌在每種對戰中的權益都低於一半；撲克詞彙表（https://www.pokerskill.com/poker-glossary/dominated-hand/）；訓練網站（https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/）"
  sources: [{ kind: rules }, { kind: math }, { kind: reference, url: "https://www.pokerskill.com/poker-glossary/dominated-hand/" }, { kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }]
- id: R-M3-013
  module: m3
  if: "你的兩張牌都很小（9 或更小），小{{t:pair|對子}}也算"
  then: "翻牌通常至少會出現一張比兩張都大的牌，中了這張牌的對手會有比你的牌所組成對子更大的{{t:pair|對子}}"
  because: "翻牌有三張，而牌堆裡比小手牌大的牌很多：你較大的那張牌越小，就越常出現其中一張"
  level: math
  source: "計算：機率 = 1 − C(m, 3) ÷ C(50, 3)，m = 不大於手牌較大那張的牌（不含手上兩張）；對 169 種手牌逐一與全部 19,600 種翻牌核對"
  sources: [{ kind: math }]
- id: R-M3-014
  module: m3
  if: "翻牌前你手上有一{{t:pair|對子}}"
  then: "你已經有成牌：沒有{{t:pair|對子}}的手牌要靠{{t:community-cards}}幫忙才能贏你"
  because: "{{t:pair|對子}}在牌型排名中高於{{t:high-card}}，而翻牌前沒有對子的手牌只有高牌"
  level: rules
  source: "德州撲克規則：加州監管機構核准的牌室規則（https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf），One Pair 高於 High Card"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }]
# M4: gra wobec akcji preflop. Reguły „heuristic” pochodzą z literatury, nie z solvera aplikacji (dokument 11).
- id: R-M4-001
  module: m4
  if: "有人{{t:open|開池}}，而你想在{{t:in-position|有位置}}時{{t:raise|加注}}（3-bet）"
  then: "你{{t:raise|加注}}到{{t:open|開池}}的約 {{n:pf.3bet.size-ip}}；面對 {{n:pf.open-size}} 的{{t:open|開池}}就是 {{n:pf.3bet.ip-total}}"
  because: "這個尺寸讓翻牌時的籌碼與{{t:pot|底池}}比例合適，也不會給對手便宜的價格"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-ip", position: ip } }
  source: "訓練網站，The Complete 3-Bet Strategy（https://deepfold.co/en/blog/three-bet-strategy-guide）；本應用的求解器樹"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-002
  module: m4
  if: "你在{{t:out-of-position|無位置}}時{{t:raise|加注}}{{t:open|開池}}（3-bet），例如在盲注位對上{{t:cutoff|CO}}或按鈕位的{{t:open|開池}}"
  then: "你{{t:raise|加注}}到{{t:open|開池}}的約 {{n:pf.3bet.size-oop}}；面對 {{n:pf.open-size}} 的{{t:open|開池}}就是 {{n:pf.3bet.oop-total}}"
  because: "翻牌後你會先行動，所以用更大的{{t:raise|加注}}，讓對手無法在{{t:in-position|有位置}}時便宜地{{t:call|跟注}}"
  level: heuristic
  check: { kind: three-bet-size, players: [6, 9], stackBb: [100], params: { mult: "n:pf.3bet.size-oop", position: oop } }
  source: "訓練網站，The Complete 3-Bet Strategy（https://deepfold.co/en/blog/three-bet-strategy-guide）；本應用的求解器樹"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: solver-app }]
- id: R-M4-003
  module: m4
  if: "你在{{t:small-blind|小盲}}，而{{t:cutoff|CO}}或按鈕位{{t:open|開池}}"
  then: "你幾乎不{{t:call|跟注}}：要嘛 3-bet，要嘛{{t:fold|棄牌}}（對上{{t:cutoff|CO}}這是簡化：已發表的解法計算的是對上按鈕位的情境）；對上按鈕位，你 3-bet {{t:range|範圍}}頂端的手牌（約 {{n:pf.3bet-freq.sb-vs-btn}} 的手牌，包括 77+（55 和 66 常常 3-bet）、AJo+、KQo、A5s、A4s、T9s），其餘{{t:fold|棄牌}}"
  because: "在{{t:small-blind|小盲}}{{t:call|跟注}}後，你打牌時{{t:out-of-position|無位置}}，而你後面的{{t:big-blind|大盲}}還能{{t:raise|加注}}；3-bet 給你{{t:initiative|主動權}}，也有機會直接贏下{{t:pot|底池}}"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.sb-vs-btn, nine.vs-open.sb-vs-btn] }
  source: "求解器圖表網站，SB vs BTN（https://beyondgto.com/defense/sb-vs-btn），NL500，100bb：「GTO defends the Small Blind with about 18% of hands - roughly 5% as a flat call and 13% as a 3-bet」，55 3-bet 57%、66 62%；商業求解器網站，Crush 3-Bet Pots OOP in Cash Games（https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/），NL500，SB vs BTN：「the SB barely calls anything. Instead, they almost exclusively 3-bet or fold」，推廣到小盲：「As a simplification, don’t cold-call from the SB: Play a 3-bet or fold strategy.」；訓練網站，3-Bet Preflop Strategy（https://upswingpoker.com/3-bet-strategy-aggressive-preflop/）：「3-bet-or-fold strategies from every position except the Big Blind」（文件 10，裁定 B-045：R-M4-015 的內容併入 R-M4-003；圖片中的 14% 改為讀取到的文字，E1）"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/sb-vs-btn" }, { kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-004
  module: m4
  if: "你在{{t:big-blind|大盲}}，按鈕位{{t:open|開池}}到 {{n:pf.open-size}}，而{{t:small-blind|小盲}}{{t:fold|棄牌}}"
  then: "你以寬範圍防守，因為{{t:call|跟注}}只需要約 {{n:eq.bb-vs-btn-open}} 的權益"
  because: "你只要補一點錢就能爭奪很大的{{t:pot|底池}}；已發表的求解器解法在這裡防守約 {{n:pf.bb-def.vs-btn.pub.low}}–{{n:pf.bb-def.vs-btn.pub.high}} 的手牌"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-btn, nine.vs-open.bb-vs-btn] }
  source: "價格計算；求解器圖表網站，BB vs BTN（https://beyondgto.com/defense/bb-vs-btn），NL500：「GTO defends the Big Blind with about 45% of hands」；發表求解器結果的學校（https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide），NL200：「3-bets 11.5% to 11bb and calls 29.0%」；本專案的翻前求解器（ADR-20）只用於圖格和玩／棄評分，其總防守頻率未經驗證（D-153）"
  sources: [{ kind: math }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-app }]
- id: R-M4-005
  module: m4
  if: "你擁有{{t:position|位置}}，要{{t:raise|加注}}{{t:cutoff|CO}}的{{t:open|開池}}"
  then: "你主要 3-bet 頂端最好的手牌，再加幾手同花色 A（A5s、A4s）作為{{t:bluff|詐唬}}；中等手牌（例如 77–99、AJs、ATs、同花色{{t:connectors|連張}}）採混合打法：一部分 3-bet，一部分{{t:call|跟注}}。按鈕位對上{{t:cutoff|CO}}通常 3-bet 約 {{n:pf.3bet-freq.btn-vs-co.low}}–{{n:pf.3bet-freq.btn-vs-co.high}} 的手牌，{{t:call|跟注}}約 {{n:pf.call-freq.btn-vs-co.low}}–{{n:pf.call-freq.btn-vs-co.high}}"
  because: "對手常會{{t:call|跟注}}，所以你希望手牌在{{t:call|跟注}}後的{{t:pot|底池}}中打得好"
  level: gto
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.btn-vs-co, nine.vs-open.btn-vs-co] }
  source: "商業求解器網站，Playing Calls From the Button in Cash Games（https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/），NL500，100bb：「Against a CO open, BTN will 3-bet ~12% of hands, while calling only 5%.」；求解器圖表網站，BTN vs CO（https://beyondgto.com/defense/btn-vs-co），NL500，100bb：「roughly 9% as a flat call and 10% as a 3-bet」；發表求解器結果的學校（https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide），NL200：「the solver 3-bets 12.5% of hands to 7.5bb and calls only 3.0%」，「55–22 most of the time」棄牌；這些區間涵蓋三個第 2 層級來源，組成取其交集：頂端 3-bet，中段混合（D-144；先前為決定 A2，文件 10）。本應用的求解器無法重現這種分配（幾乎不跟注），所以圖格和遊戲模式的評分只檢查「玩／棄」；訓練網站，The Complete 3-Bet Strategy（https://deepfold.co/en/blog/three-bet-strategy-guide），BTN vs CO 表：「QQ+, AKs, AKo, AQs (mixed), A5s, A4s…」；某訓練網站（https://gtogecko.com/blog/gto-preflop-strategy）稱此範圍為線性，翻前圖表網站則稱為兩極化（文件 12 M4–M6，D-02）"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/playing-calls-from-the-button-in-cash-games/" }, { kind: solver-pub, url: "https://beyondgto.com/defense/btn-vs-co" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://gtogecko.com/blog/gto-preflop-strategy" }, { kind: training }]
- id: R-M4-006
  module: m4
  if: "你在{{t:big-blind|大盲}}{{t:raise|加注}}按鈕位的{{t:open|開池}}"
  then: "你 3-bet 最強的手牌（TT+、AQ+、AJs+），再加上{{t:call|跟注}}{{t:range|範圍}}底部的{{t:bluff|詐唬}}牌：A5s、有時 A4s，以及同花色{{t:connectors|連張}}；中小{{t:pair|對子}}、KQo 和不同花色的 A（AJo–A9o）通常{{t:call|跟注}}"
  because: "在{{t:big-blind|大盲}}你能便宜{{t:call|跟注}}並結束行動，所以中等手牌{{t:call|跟注}}後賺得更多；3-bet 就留給想打大{{t:pot|底池}}的手牌，以及{{t:call|跟注}}後也打得好的{{t:bluff|詐唬}}牌（同花色 A 能阻擋 AA 和 AK）"
  level: gto
  source: "商業求解器網站，Crush 3-Bet Pots OOP in Cash Games（https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/），NL500，BB vs BTN：「TT+, AJs+, and AQo+ are 3-bet purely」，詐唬牌「near the bottom of our calling range」；求解器圖表網站，BB vs BTN（https://beyondgto.com/defense/bb-vs-btn）：「A5s · 3-bet 100%」。本規則只適用於按鈕位的開池（D-144）：對上小盲時，第 2 層級來源對詐唬牌意見不一（https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics：「A5s calls 96% of the time rather than turning into a three-bet bluff」；https://beyondgto.com/defense/bb-vs-sb：「A5s · 3-bet 4% · call 96%」；商業求解器網站，Range Morphology，https://blog.gtowizard.com/preflop-range-morphology/：詐唬牌來自範圍最底部），所以課程只說對上小盲時你主要為了價值 3-bet，而 A5s 和同花色連張通常跟注；發表求解器結果的學校，What is a 3-bet in poker（https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide）和 Big blind defence（https://poker.academy/blog/post/big-blind-basics-explained-useful-tips-for-poker-players），NL200 與 NL50 GG；訓練網站，Blind vs Blind Without a Solver（https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics），該網站的圖表；訓練網站，3-Bet Preflop Strategy（https://upswingpoker.com/3-bet-strategy-aggressive-preflop/），該網站的求解器圖表。簡化：組成取決於抽水和 3-bet 尺寸；99、KQo 和 AJo 有時是混合的（文件 10，裁定 B-045）"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/crush-3-bet-pots-oop-in-cash-games/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-btn" }, { kind: training, url: "https://thinkgto.com/blog/blind-vs-blind-without-a-solver-heuristics" }, { kind: training, url: "https://upswingpoker.com/3-bet-strategy-aggressive-preflop/" }]
- id: R-M4-007
  module: m4
  if: "翻牌後將擁有{{t:position|位置}}的玩家對你 3-bet"
  then: "你的{{t:open|開池}}手牌中，約 {{n:pf.vs3bet.fold.low}}–{{n:pf.vs3bet.fold.high}} {{t:fold|棄牌}}，約 {{n:pf.vs3bet.call.low}}–{{n:pf.vs3bet.call.high}} {{t:call|跟注}}，約 {{n:pf.vs3bet.4bet.low}}–{{n:pf.vs3bet.4bet.high}} 4-bet"
  because: "如果你棄牌的比例高於 {{n:alpha.vs-3bet-ip-size}}，對手用任何手牌 3-bet 都能獲利，所以你{{t:fold|棄牌}}的比例要略低於這個門檻"
  level: heuristic
  source: "接近各來源的區間，棄牌上限略低於計算出的門檻（ADR-24）：發表求解器結果的學校，What is a 3-bet in poker（https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide），求解器 NL200，CO 面對按鈕位 3-bet 到 7.5bb：棄牌 63.7%、跟注 17.2%、4-bet 19.1%；簡化訓練圖表網站，簡化訓練圖表（https://pailiku.com/charts/co-vs-btn-3bet），換算為 CO 開池範圍：約 66/23/11；HUD 約 55% 棄牌；訓練網站 50–55/30–40/5–8（第 4 層級，有偏差）；門檻來自計算（文件 12 M4–M6，D-04）"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training }, { kind: math }]
- id: R-M4-008
  module: m4
  if: "你遭到 3-bet，而翻牌後你將{{t:out-of-position|無位置}}"
  then: "你主要用同花色大牌、強的同花色 A、中高{{t:pair|對子}}以及一部分同花色{{t:connectors|連張}}{{t:call|跟注}}；較弱的不同花色手牌（KJo、ATo、QTo）{{t:fold|棄牌}}"
  because: "不同花色的手牌常被壓制，而且在{{t:out-of-position|無位置}}時{{t:equity-realization|權益實現}}很差"
  level: heuristic
  source: "訓練網站，The Complete 3-Bet Strategy（https://deepfold.co/en/blog/three-bet-strategy-guide），CO vs BTN 3-bet：「Call QQ, JJ, TT, 99, 88, AQs, AJs, KQs, KJs, QJs, JTs, T9s, 77, 66 Fold Marginal offsuit broadways」；簡化訓練圖表網站（https://pailiku.com/charts/co-vs-btn-3bet）：「Call JJ-77, AQs-ATs, AKs, KQs-KJs, QJs, JTs, T9s, 98s, 87s, 76s, 65s」；訓練網站，How to Play vs 3-Bets（https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/）：「calling with fewer suited connectors, suited gappers and offsuit broadway hands」"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }, { kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }]
- id: R-M4-009
  module: m4
  if: "你遭到 3-bet，而翻牌後你將擁有{{t:position|位置}}"
  then: "你{{t:call|跟注}}得更寬：66 到 TT 的{{t:pair|對子}}、帶大牌的同花色手牌，以及同花色{{t:connectors|連張}}；最小的{{t:pair|對子}}{{t:fold|棄牌}}"
  because: "{{t:in-position|有位置}}時更容易實現權益，命中時也更容易贏下大{{t:pot|底池}}"
  level: heuristic
  source: "訓練網站，How to Play vs 3-Bets（https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/）：最小的對子「even with position」也棄牌；某訓練網站允許有位置時跟注小對子（文件 12 M4–M6，D-05）"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training }]
- id: R-M4-010
  module: m4
  if: "你拿 AA、KK 或 AK 遭到 3-bet"
  then: "你通常 4-bet（為了{{t:value|價值}}）；AK 有時也會{{t:call|跟注}}"
  because: "這些手牌想把整個籌碼投入，而且壓制大多數會{{t:call|跟注}} 4-bet 的手牌"
  level: heuristic
  source: "訓練網站，How to Play vs 3-Bets（https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/）：AK「should be 4-bet with 100% frequency」（按鈕位 vs BB）；訓練網站，The Complete 3-Bet Strategy（https://deepfold.co/en/blog/three-bet-strategy-guide）：「4-bet value KK+, AKs (mixed), AKo (mixed)」；簡化訓練圖表網站（https://pailiku.com/charts/co-vs-btn-3bet）：「4-bet QQ+, AKo, A5s-A4s Call JJ-77, AQs-ATs, AKs」"
  sources: [{ kind: training, url: "https://upswingpoker.com/vs-3-bet-pre-flop-position-strategy-revealed/" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: training, url: "https://pailiku.com/charts/co-vs-btn-3bet" }]
- id: R-M4-011
  module: m4
  if: "你 4-bet"
  then: "{{t:in-position|有位置}}時你{{t:raise|加注}}到 3-bet 的約 {{n:pf.4bet.size-ip.low}}–{{n:pf.4bet.size-ip.high}}，{{t:out-of-position|無位置}}時約 {{n:pf.4bet.size-oop.low}}–{{n:pf.4bet.size-oop.high}}"
  because: "這樣的 4-bet 被{{t:call|跟注}}後，籌碼中還剩約{{t:pot|底池}}的 {{n:spr.4bet.high}}–{{n:spr.4bet.oop}} 倍（{{t:in-position|有位置}}，例如按鈕位對{{t:small-blind|小盲}}到 {{n:pf.3bet.oop-total}} 的 3-bet 做 4-bet：約 {{n:spr.4bet.high}}–{{n:spr.4bet}}；{{t:out-of-position|無位置}}，例如{{t:cutoff|CO}}對按鈕位到 {{n:pf.3bet.ip-total}} 的 3-bet 做 4-bet：約 {{n:spr.4bet.oop}}），所以好牌很容易把剩下的籌碼投入"
  level: heuristic
  source: "發表求解器結果的學校，What is a 3-bet in poker（https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide），求解器 NL200：CO 無位置 4-bet 到 17.2bb，也就是 7.5bb 3-bet 的 2.3 倍；訓練網站，The Complete 3-Bet Strategy（https://deepfold.co/en/blog/three-bet-strategy-guide）：有位置 2.2–2.5x，無位置 2.5–3x（其範例中為 2.4x）；SPR 來自計算（文件 12 M4–M6，D-06）"
  sources: [{ kind: solver-pub, url: "https://poker.academy/blog/post/what-is-a-3-bet-in-poker-a-theoretical-and-strategic-guide" }, { kind: training, url: "https://deepfold.co/en/blog/three-bet-strategy-guide" }, { kind: math }]
- id: R-M4-012
  module: m4
  if: "你前面有一位或多位玩家只補齊{{t:big-blind|大盲}}（溜入）"
  then: "你{{t:raise|加注}}到 {{n:pf.iso.base}}，每位溜入者再加 {{n:pf.iso.per-limper}}，{{t:out-of-position|無位置}}時再多 {{n:pf.iso.oop-extra}}"
  because: "較小的{{t:raise|加注}}給溜入者太好的價格，也無法把這手牌從他們手上搶過來"
  level: heuristic
  check: { kind: iso-size, players: [6, 9], stackBb: [100], params: { base: "n:pf.iso.base", perLimper: "n:pf.iso.per-limper", oopExtra: "n:pf.iso.oop-extra" } }
  source: "訓練網站，10 Tips for Crushing Limpers（https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm）：「Raise to 3bb+1bb per limper when playing online, and 4bb+1bb per limper when playing live」；翻前圖表網站，ISO Raise Strategy（https://www.preflopwizard.app/blog/poker-iso-raise-strategy）：「Base open size (3bb) + 1 big blind per limper」，「Add 1bb more from OOP positions」。此尺寸適用於線上牌局"
  sources: [{ kind: training, url: "https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm" }, { kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }]
- id: R-M4-013
  module: m4
  if: "你前面有多位玩家溜入"
  then: "你用更窄的{{t:range|範圍}}{{t:raise|加注}}，主要為了{{t:value|價值}}；投機型手牌（小{{t:pair|對子}}、同花色{{t:connectors|連張}}）在{{t:in-position|有位置}}時可以跟著溜入"
  because: "每多一位溜入者，就更有可能有人{{t:call|跟注}}，所以翻前{{t:bluff|詐唬}}的價值降低"
  level: heuristic
  source: "翻前圖表網站，ISO Raise Strategy（https://www.preflopwizard.app/blog/poker-iso-raise-strategy）：「Against multiple limpers, tighten each range by roughly one tier」，關於跟著溜入：「This is almost always wrong」；訓練網站（https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm）：「limp behind with those suited connectors, small pairs」；訓練網站（https://www.pokernews.com/strategy/10-tips-that-will-help-you-destroy-limpers-32206.htm）：「over-limping, which can be fine」。第 4 層級來源互相矛盾：兩種打法都正確（ADR-04，D-144）"
  sources: [{ kind: training, url: "https://www.preflopwizard.app/blog/poker-iso-raise-strategy" }, { kind: training, url: "https://www.pokernews.com/strategy/three-ways-to-respond-versus-a-table-full-of-limpers-26839.htm" }]
- id: R-M4-014
  module: m4
  if: "你在{{t:big-blind|大盲}}，而{{t:small-blind|小盲}}{{t:open|開池}}到 {{n:pf.open-size-sb}}"
  then: "你以寬範圍防守，超過一半的手牌，雖然{{t:call|跟注}}需要約 {{n:eq.bb-vs-sb-open}} 的權益；3-bet 約為{{t:open|開池}}的 {{n:pf.3bet.size-ip}}"
  because: "翻牌後你擁有{{t:position|位置}}，所以能實現更多權益；已發表的求解器解法在這裡防守約 {{n:pf.bb-def.vs-sb.pub}} 的手牌"
  level: heuristic
  check: { kind: solver-spot, players: [6, 9], stackBb: [100], spots: [vs-open.bb-vs-sb, nine.vs-open.bb-vs-sb] }
  source: "價格計算；本專案的翻前求解器（ADR-20）；求解器樹（3-bet 到 9bb）；求解器圖表網站，BB vs SB（https://beyondgto.com/defense/bb-vs-sb），NL500，100bb：「GTO defends the Big Blind with about 56% of hands」"
  sources: [{ kind: solver-pub, url: "https://beyondgto.com/defense/bb-vs-sb" }, { kind: math }, { kind: solver-app }]

# M5: c-bet na flopie. Pula po otwarciu i jednym sprawdzeniu, 100bb. Definicje tekstur liczy poker-core (texture.ts),
# punkty i progi mokrości są w numbers.yaml (tex.*). Reguły strategiczne według rejestru decyzji D-01–D-21
# (dokument 12 M4–M6); bez częstotliwości w procentach.
- id: R-M5-001
  module: m5
  if: "翻牌的{{t:wetness|濕潤度}}得分低於 {{n:tex.threshold.medium}} 分：有多種方式可成{{t:straight|順子}}（至少有兩組兩個點數）得 {{n:tex.points.straight.made}} 分，只有一種方式可成{{t:straight|順子}}得 {{n:tex.points.straight.made-one}} 分，只有{{t:straight-draw|順子聽牌}}得 {{n:tex.points.straight.draw}} 分，兩張同花色得 {{n:tex.points.suits.two-tone}} 分，三張同花色得 {{n:tex.points.suits.monotone}} 分"
  then: "這是{{t:dry|乾燥}}翻牌：{{t:draw|聽牌}}很少，也還沒有人做成{{t:straight|順子}}或{{t:flush|同花}}"
  because: "後續的牌很少改變領先者，所以翻牌上最好的牌通常會一直保持最好"
  level: rules
  source: "本應用的牌面結構定義（poker-core，texture.ts：WETNESS_POINTS、WETNESS_THRESHOLDS）；乾燥翻牌的概念：訓練網站，Sizing Your C-Bets；訓練網站，What Is a Continuation Bet；乾燥翻牌範例：訓練網站（K72r、A94r）、訓練網站（AA6r）；乾燥／中等的界線是本應用的約定"
  sources: [{ kind: training }, { kind: training }]
- id: R-M5-002
  module: m5
  if: "翻牌的{{t:wetness|濕潤度}}得分至少 {{n:tex.threshold.wet}} 分（計分方式同{{t:dry|乾燥}}翻牌的定義）"
  then: "這是{{t:wet|濕潤}}翻牌：對手常有{{t:draw|聽牌}}，有時已經有{{t:straight|順子}}或{{t:flush|同花}}"
  because: "後續的牌常會改變領先者，所以現在最好的牌也比較不安全"
  level: rules
  source: "本應用的牌面結構定義（poker-core，texture.ts：WETNESS_POINTS、WETNESS_THRESHOLDS）；濕潤翻牌的概念：訓練網站，Sizing Your C-Bets；訓練網站，What Is a Continuation Bet；濕潤翻牌範例：訓練網站（987、QJT）、訓練網站，Bet Sizing Strategy: 8 Rules（T954，https://upswingpoker.com/bet-size-strategy-tips-rules/）；中等／濕潤的界線是本應用的約定"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: training }]
- id: R-M5-003
  module: m5
  if: "你翻前{{t:open|開池}}，{{t:big-blind|大盲}}{{t:call|跟注}}，而翻牌出現 A 或 K"
  then: "你擁有{{t:range-advantage|範圍優勢}}：平均來說，你的手牌比對手的強"
  because: "{{t:big-blind|大盲}}翻前會用大部分的 AA、KK 和 AK {{t:raise|加注}}，所以只{{t:call|跟注}}時這些牌很少，而你全都有"
  level: heuristic
  source: "商業求解器網站，Range advantage（詞彙表）；商業求解器網站，The Turn Probe Bet（「BB lacks the stronger Ace-highs because they would have 3-bet with them preflop」）"
  sources: [{ kind: solver-pub }]
- id: R-M5-004
  module: m5
  if: "你翻前{{t:open|開池}}，而翻牌是低牌且{{t:connected|連張}}或{{t:semi-connected|半連張}}，例如 7-6-5"
  then: "你 c-bet 的頻率比在高牌翻牌時低，很多手牌{{t:check|過牌}}"
  because: "{{t:big-blind|大盲}}會防守很多{{t:connectors|連張}}和小牌手牌，這些牌會擊中低牌翻牌，而你的高牌沒中；在{{t:connected|連張}}翻牌上他還有{{t:straight|順子}}和{{t:two-pair|兩對}}，所以你通常沒有{{t:nuts-advantage|堅果優勢}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "商業求解器網站，Flop Heuristics: IP C-Betting in Cash Games（https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/，BTN vs BB：「a large portion of their range consists of low-card holdings because of the preflop discount posed by the blinds. We connect better with high-card boards and get to bet more.」；「flopped straights often being in the BB’s range」；「Size down and bet less on flops that complete straights and flushes in your opponent’s range」）；商業求解器網站，Flop Heuristics: IP C-Betting in MTTs（https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-mtts/；不同的情境：BTN vs SB，40bb；在連張翻牌上「the raiser generally does not have a nuts advantage」；簡化：依照現金局那篇文章，按方向套用到現金局的 BTN vs BB）；商業求解器網站，Bullying the Blinds（https://blog.gtowizard.com/bullying-the-blinds-with-continuation-bets/，20bb，654r：「BB’s advantage at the top end」，按鈕位過牌超過一半的範圍）；訓練網站，3 Concepts That Should Shape Your Postflop Strategy（「the Big Blind will often have the nut advantage」，https://upswingpoker.com/nut-range-positional-advantage/）"
  sources: [{ kind: solver-pub }, { kind: training, url: "https://upswingpoker.com/nut-range-positional-advantage/" }]
- id: R-M5-005
  module: m5
  if: "你的{{t:range|範圍}}中最強的手牌比對手多很多（{{t:nuts-advantage|堅果優勢}}）"
  then: "你可以用較大的尺寸下注；只有{{t:range-advantage|範圍優勢}}時，則小額下注"
  because: "大額{{t:bet|下注}}能從對手的中等手牌榨取更多，而你很少碰到會對你{{t:raise|加注}}的更好手牌"
  level: heuristic
  source: "商業求解器網站，The Mechanics of C-Bet Sizing；商業求解器網站，Range advantage（詞彙表）"
  sources: [{ kind: solver-pub }]
- id: R-M5-006
  module: m5
  if: "對手的手牌不是{{t:pair|對子}}"
  then: "翻牌約有 {{n:flop.miss.unpaired}} 的機率完全沒和他的任何一張牌配成對"
  because: "在 {{n:cards.unseen.preflop}} 張未知的牌中，只有 {{n:pair.outs.unpaired}} 張能讓他配成對，而翻牌只有 {{n:cards.board.flop}} 張"
  level: math
  source: "精確計算（poker-core）；與撲克計算器網站一致（28.96% + 2.02% + 1.45% = 32.4% 命中）"
  sources: [{ kind: training }, { kind: math }]
- id: R-M5-007
  module: m5
  if: "你身為翻前{{t:aggressor|進攻者}}並擁有{{t:position|位置}}，而翻牌{{t:dry|乾燥}}且偏高，例如三種花色的 K-7-2"
  then: "你經常小額 c-bet，約{{t:pot|底池}}的 {{n:cbet.size.small}}（簡化：在這類翻牌上，求解器也會使用{{t:overbet|超池下注}}）"
  because: "你擁有{{t:range-advantage|範圍優勢}}，而對手的弱牌幾乎沒有機會：小額{{t:bet|下注}}就足以讓這些牌{{t:fold|棄牌}}，而較差的{{t:pair|對子}}仍會{{t:call|跟注}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "商業求解器網站，Flop Heuristics: IP C-Betting in Cash Games（33%）；訓練網站，Bet Sizing Strategy: 8 Rules（「Bet small (25-35% pot) on dry, static board textures」，https://upswingpoker.com/bet-size-strategy-tips-rules/）；訓練網站，What Is a Continuation Bet（K72r）；訓練網站，Picking the Proper C-Bet Sizing on Ace-High Boards（1/3 底池）"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M5-008
  module: m5
  if: "你身為翻前{{t:aggressor|進攻者}}並擁有{{t:position|位置}}，翻牌給對手很多{{t:draw|聽牌}}，但還不可能成{{t:straight|順子}}，例如{{t:two-tone|雙色}}的 K-J-7"
  then: "你 c-bet 較少，但尺寸較大，例如{{t:pot|底池}}的 {{n:cbet.size.big}}；沒有{{t:draw|聽牌}}的中等手牌更常{{t:check|過牌}}；當已經可能成{{t:straight|順子}}時，例如 J-T-8，求解器會用較小的尺寸下注"
  because: "對手的{{t:draw|聽牌}}有很多權益，所以大額{{t:bet|下注}}讓他們為下一張牌付出高價"
  level: heuristic
  source: "商業求解器網站，Flop Heuristics: IP C-Betting in Cash Games（「increased use of the 66% pot bet size, but decreased overall betting frequency」）；訓練網站，Bet Sizing Strategy: 8 Rules（55–80%，https://upswingpoker.com/bet-size-strategy-tips-rules/）；訓練網站，Picking the Proper C-Bet Sizing on Ace-High Boards（2/3 底池）"
  sources: [{ kind: training, url: "https://upswingpoker.com/bet-size-strategy-tips-rules/" }, { kind: solver-pub }, { kind: training }]
- id: R-M5-009
  module: m5
  if: "你身為翻前{{t:aggressor|進攻者}}並擁有{{t:position|位置}}，而翻牌{{t:paired|成對}}，例如 Q-Q-6"
  then: "你經常小額 c-bet"
  because: "你擁有{{t:range-advantage|範圍優勢}}，而在{{t:paired|成對}}的翻牌上很難有{{t:draw|聽牌}}，所以沒有{{t:pair|對子}}的對手連小額{{t:bet|下注}}都很少能{{t:call|跟注}}；大額{{t:bet|下注}}不划算，因為你們任一方都可能有{{t:three-of-a-kind|三條}}"
  level: heuristic
  check: { kind: cbet-case, players: [6, 9], stackBb: [100], drill: m5.l3.c-btn }
  source: "商業求解器網站，Flop Heuristics: IP C-Betting in Cash Games（「Paired flops are bet significantly more often… only be bet for small sizing… reduced nut advantage from trips being in both player's ranges」；「On paired boards, it's also much harder to have a draw」）"
  sources: [{ kind: solver-pub }]
- id: R-M5-010
  module: m5
  if: "你身為翻前{{t:aggressor|進攻者}}並擁有{{t:position|位置}}，而翻牌是{{t:monotone|單色}}（三張同花色）"
  then: "你 c-bet 比平常少，而且小額"
  because: "每位玩家都可能已經有{{t:flush|同花}}，所以{{t:aggressor|進攻者}}的{{t:nuts-advantage|堅果優勢}}縮小，而在大{{t:pot|底池}}中，對手的{{t:flush|同花}}會讓你損失很多"
  level: heuristic
  source: "商業求解器網站，Flop Heuristics: IP C-Betting in Cash Games（「Monotone boards see a drastic decrease in betting frequency and sizing」，BTN vs BB，https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/）；商業求解器網站，The Mechanics of C-Bet Sizing（「when a very wet board like Q♦8♦7♦ is dealt, the bet sizing comes down again」，https://blog.gtowizard.com/the-mechanics-of-c-bet-sizing/）：濕潤翻牌不代表要大額下注；訓練網站，Monotone Flops（Kanu7，求解器結果：「c-betting half the time for a 25-33% pot sizing」，https://upswingpoker.com/monotone-flops-kanu7/）；決定 D-39（文件 12 M4–M6，報告 12a-22）"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/flop-heuristics-ip-c-betting-in-cash-games/" }, { kind: training, url: "https://upswingpoker.com/monotone-flops-kanu7/" }]
- id: R-M5-011
  module: m5
  if: "你手上什麼都沒有就 c-bet，只指望對手{{t:fold|棄牌}}"
  then: "{{t:bet|下注}}{{t:pot|底池}}的 {{n:cbet.size.small}} 時，對手{{t:fold|棄牌}}的頻率必須高於 {{n:alpha.cbet.small}}；下注{{t:pot|底池}}的 {{n:cbet.size.big}} 時，則必須高於 {{n:alpha.cbet.big}}"
  because: "你拿下注額冒險去贏{{t:pot|底池}}：門檻是 下注 ÷ （{{t:pot|底池}} + 下注）"
  level: math
  source: "計算：alpha = 下注 / （底池 + 下注）"
  sources: [{ kind: math }]
- id: R-M5-012
  module: m5
  if: "你翻前{{t:open|開池}}，而對手在擁有{{t:position|位置}}的情況下{{t:call|跟注}}（例如按鈕位跟注你在{{t:cutoff|CO}}的{{t:open|開池}}）"
  then: "你 c-bet 比{{t:in-position|有位置}}時少，更常{{t:check|過牌}}，好牌也一樣"
  because: "擁有{{t:position|位置}}的{{t:call|跟注}}者，其{{t:range|範圍}}是{{t:condensed|壓縮}}的：弱牌他已經{{t:fold|棄牌}}，最強的一部分他已經{{t:raise|加注}}，所以剩下的主要是中等和好牌；再加上翻牌後每一{{t:street|街}}都是你先行動"
  level: heuristic
  source: "商業求解器網站，C-Betting As the OOP Preflop Raiser（UTG vs BTN c-bet 28%；「Even a hand like top pair top kicker is preferred to be played as a check-call」）；訓練網站，C-Betting On Ace-High Boards（CO vs BTN，A94r：「we will check over 96% of the time」）"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M5-013
  module: m5
  if: "翻牌時你有兩位以上的對手"
  then: "你 c-bet 少很多，主要用強牌和強{{t:draw|聽牌}}；你很少{{t:bluff|詐唬}}，下注時也是小額"
  because: "每多一位對手，就更可能有人命中：兩手不是{{t:pair|對子}}的牌同時落空的機率只有約 {{n:flop.miss.two}}"
  level: heuristic
  source: "訓練網站，Multiway Pots in Poker；訓練網站，C-Betting in Multiway Pots（「Check even pocket kings… the solver checks its entire range」；「around a quarter to a third of pot」）；精確計算：C(36,3)/C(48,3)"
  sources: [{ kind: training }, { kind: training }, { kind: math }]

# M6: obrona na flopie. Matematyka z formuł (numbers.yaml); zalecenia według rejestru decyzji D-22–D-38 (dokument 12
# M4–M6) i D1 (dokument 12 M7–M9).
- id: R-M6-001
  module: m6
  if: "對手在河牌下注{{t:pot|底池}}的 1/3"
  then: "理論上你要用約 {{n:mdf.bet-third}} 的{{t:range|範圍}}防守（{{t:call|跟注}}或{{t:raise|加注}}）；這就是{{t:mdf|MDF}}"
  because: "毫無勝算的{{t:bluff|詐唬}}是拿 1 份去贏 3 份；如果你{{t:fold|棄牌}}的頻率高於 {{n:alpha.bet-third}}，對手用任何牌{{t:bluff|詐唬}}都能獲利"
  level: math
  source: "計算：MDF = 底池/(底池+下注)；訓練網站，MDF in Poker: Why Most Players Misuse It（https://pokercoaching.com/blog/mdf-poker：「The framework is a starting point, not a rule」）"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }, { kind: math }]
- id: R-M6-002
  module: m6
  if: "你用沒有勝算的手牌{{t:bluff|詐唬}}"
  then: "當對手{{t:fold|棄牌}}的頻率高於 alpha = 下注/（{{t:pot|底池}}+下注）時，{{t:bluff|詐唬}}就有利可圖；下注半個{{t:pot|底池}}時是 {{n:alpha.bet-half}}"
  because: "你拿下注額冒險去贏{{t:pot|底池}}；下注越大，對手就必須越常{{t:fold|棄牌}}"
  level: math
  source: "計算：alpha = 下注/(底池+下注)；商業求解器網站，MDF & Alpha（https://blog.gtowizard.com/mdf-alpha）"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: math }]
- id: R-M6-003
  module: m6
  if: "翻牌時你在{{t:out-of-position|無位置}}的情況下面對下注"
  then: "你可以防守得比{{t:mdf|MDF}}所示更少（在對防守方不利的翻牌上明顯更少）；你把{{t:mdf|MDF}}當作參考點而不是義務，但面對小額 c-bet 不會大量{{t:fold|棄牌}}"
  because: "對手的{{t:bluff|詐唬}}牌還有權益、可能變強，而你在{{t:out-of-position|無位置}}時無法實現弱牌的全部權益"
  level: heuristic
  source: "商業求解器網站，MDF & Alpha（https://blog.gtowizard.com/mdf-alpha：「On average, BB is consistently over-folding to all bet sizes on the flop」；有位置時「calls much closer to MDF on average」）；在一個轉牌範例中，求解器平均防守接近 MDF：訓練網站，What the Best Poker Pros Already Know About Playing vs. Double Barrels（https://upswingpoker.com/vs-double-barrels-turn/）；面對小額 c-bet 的防守：R-M6-006"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/mdf-alpha" }, { kind: training, url: "https://upswingpoker.com/vs-double-barrels-turn/" }]
- id: R-M6-004
  module: m6
  if: "根據你的觀察很少{{t:bluff|詐唬}}的玩家，在河牌大額{{t:bet|下注}}"
  then: "你{{t:fold|棄牌}}的頻率高於{{t:mdf|MDF}}所示，中等{{t:pair|對子}}也一樣"
  because: "{{t:mdf|MDF}}假設對手{{t:bluff|詐唬}}得夠多；缺少{{t:bluff|詐唬}}時，用較弱的手牌{{t:call|跟注}}主要是在付錢給更好的手牌"
  level: exploit
  population: "牌桌上觀察到的特定玩家；沒有族群資料（樣本、級別、平台），所以本規則不假設整群玩家都很少詐唬；兩個訓練網站的教練如此描述低級別的被動型娛樂玩家（為了娛樂而玩，通常比常規玩家弱），但沒有手牌資料庫的數據"
  source: "訓練網站，Bluff Catching: When to Call and When to Let It Go（https://deepfold.co/en/blog/bluff-catching-principles：被動型娛樂玩家不會在河牌用大額下注詐唬）；訓練網站，MDF in Poker: Why Most Players Misuse It（https://pokercoaching.com/blog/mdf-poker：「In low-stakes games, most players will bluff way less」）"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/bluff-catching-principles" }, { kind: training, url: "https://pokercoaching.com/blog/mdf-poker" }]
- id: R-M6-005
  module: m6
  if: "對手{{t:bet|下注}}較大"
  then: "你用更窄的{{t:range|範圍}}防守：面對{{t:pot|底池}} 1/3 的下注，{{t:mdf|MDF}}是 {{n:mdf.bet-third}}；面對{{t:pot|底池}}大小的下注，則是 {{n:mdf.bet-pot}}"
  because: "下注越大，價格越差：所需權益從 {{n:eq.bet-third}} 升到 {{n:eq.bet-pot}}"
  level: math
  source: "計算：MDF = 底池/(底池+下注)，所需權益 = 下注/(底池+2·下注)"
  sources: [{ kind: math }]
- id: R-M6-006
  module: m6
  if: "你在{{t:big-blind|大盲}}面對小額 c-bet（約{{t:pot|底池}}的 1/3）"
  then: "你幾乎用所有{{t:pair|對子}}、{{t:draw|聽牌}}、帶額外{{t:draw|聽牌}}（後門）的大牌繼續，通常也包括 A 高牌；沒有{{t:pair|對子}}也沒有{{t:draw|聽牌}}的最弱手牌{{t:fold|棄牌}}"
  because: "你只需要約 {{n:eq.bet-third}} 的權益，而這些手牌要嘛已經能贏{{t:bluff|詐唬}}牌，要嘛還能變強"
  level: heuristic
  source: "訓練網站，Defending the BB on High Card Boards（求解器：「we will continue with pretty much all pairs including the underpairs and even A-high hands」）"
  sources: [{ kind: training }]
- id: R-M6-007
  module: m6
  if: "你有兩張大牌，沒有{{t:pair|對子}}也沒有{{t:draw|聽牌}}，而 c-bet 很大（{{t:pot|底池}}的 3/4 以上）"
  then: "你通常{{t:fold|棄牌}}（不過在 K 高的{{t:dry|乾燥}}翻牌上，求解器會用很多帶 A 的手牌{{t:call|跟注}}）"
  because: "在{{t:out-of-position|無位置}}時，這種手牌很少能打到攤牌，就算用大牌配成{{t:pair|對子}}也常會輸；比較適合在你有額外{{t:draw|聽牌}}時{{t:call|跟注}}，最好是最大{{t:flush|同花}}的聽牌"
  level: heuristic
  source: "訓練網站，When to Call With Ace-High（J42，66%：「the solver does not call with any Ace-high hand that doesn't have a significant backdoor draw」）；訓練網站，Defending the BB on High Card Boards（K84：面對 2/3 底池，求解器也會跟注一部分 A）"
  sources: [{ kind: training }, { kind: training }]
- id: R-M6-008
  module: m6
  if: "你想在翻牌過牌加注（check-raise）"
  then: "你主要用最強的手牌（{{t:two-pair|兩對}}、暗三條）和{{t:draw|聽牌}}（{{t:flush|同花}}、{{t:oesd|兩頭順聽牌}}）來做；中等{{t:pair|對子}}通常{{t:call|跟注}}（簡化：面對小額 c-bet，求解器也會為了保護，用一部分{{t:top-pair|頂對}}和弱{{t:pair|對子}}{{t:raise|加注}}）"
  because: "過牌加注後，較差的手牌通常會{{t:fold|棄牌}}，較好的則會付錢，所以中等{{t:pair|對子}}很少從中獲利；{{t:draw|聽牌}}有兩種贏法：對手{{t:fold|棄牌}}或命中"
  level: heuristic
  source: "訓練網站，5 Winning Check-Raising Strategies（求解器「check-raise all sorts of top pairs versus small bets」）；訓練網站（求解器圖表）（用暗三和聽牌過牌加注；弱對子為了保護）"
  sources: [{ kind: training }]
- id: R-M6-009
  module: m6
  if: "c-bet 很小，或翻牌是低牌且{{t:connected|連張}}（例如 7-6-5）"
  then: "你更常過牌加注；在對加注者有利的高牌翻牌（例如 K-J-T、A-A-K）上，以及面對大額 c-bet 時，則較少"
  because: "在低張、{{t:connected|連張}}的翻牌上，{{t:big-blind|大盲}}的{{t:range|範圍}}裡有{{t:straight|順子}}和{{t:two-pair|兩對}}，而按鈕位通常沒有{{t:nuts-advantage|堅果優勢}}；小額 c-bet 提供便宜的{{t:raise|加注}}機會"
  level: heuristic
  source: "訓練網站，How to Check-Raise Like a High Stakes Juggernaut（不該加注的翻牌：K♣J♥T♠、Q♥J♦T♠、A♥A♠K♥；面對 33% 底池過牌加注 12.65%，面對 66% 底池 8.66%）；商業求解器網站（「The larger the BTN bets, the less BB raises」）；商業求解器網站，Flop Heuristics: IP C-Betting in Cash Games（「flopped straights often being in the BB’s range」）"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M6-010
  module: m6
  if: "你在翻牌過牌加注"
  then: "你{{t:raise|加注}}到 c-bet 的約 {{n:xr.mult.low}}–{{n:xr.mult.example}}，c-bet 越小，倍數越大；不要最小加注"
  because: "過牌加注到 c-bet 的 {{n:xr.mult.example}} 時，按鈕位{{t:call|跟注}}需要約 {{n:eq.vs-xr.example}} 的權益，而只加到 c-bet 的 {{n:xr.too-small.mult}} 時只需要 {{n:eq.vs-xr.too-small}}；這麼便宜，他用任何{{t:draw|聽牌}}都會付錢"
  level: heuristic
  source: "價格計算：補注額/(加注後的底池 + 補注額)；訓練網站，Level-Up Podcast ep. 1（Blackwood）：面對小額 c-bet 4.5x，面對大額 c-bet 3.2x（https://upswingpoker.com/podcast/ep1-check-raise/）；方向與商業求解器網站一致：下注越小，倍數越大"
  sources: [{ kind: training, url: "https://upswingpoker.com/podcast/ep1-check-raise/" }, { kind: solver-pub }, { kind: math }]
- id: R-M6-011
  module: m6
  if: "你考慮用過牌加注作為{{t:bluff|詐唬}}或{{t:semi-bluff|半詐唬}}"
  then: "你主要挑選強{{t:draw|聽牌}}來做；對手越少{{t:fold|棄牌}}，這種{{t:bluff|詐唬}}就越少，而當他幾乎不{{t:fold|棄牌}}時，你過牌加注主要是為了{{t:value|價值}}"
  because: "只有當對手{{t:fold|棄牌}}的頻率高於 alpha（R-M6-002）時，{{t:bluff|詐唬}}才能獲利；強{{t:draw|聽牌}}命中時也能贏，所以在對手{{t:fold|棄牌}}不夠時損失最小"
  level: heuristic
  source: "由 alpha（R-M6-002）推論：詐唬需要對手棄牌；訓練網站，5 Winning Check-Raising Strategies（「tighten your bluffing range to include only strong draws」）"
  sources: [{ kind: training }, { kind: math }]

# M7: turn. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 „Weryfikacja źródeł — M7–M9” (decyzje D1–D9).
- id: R-M7-001
  module: m7
  if: "你在擁有{{t:position|位置}}時於翻牌 c-bet，對手{{t:call|跟注}}，而轉牌在較低的{{t:board|牌面}}上發出大牌（A 或 K）"
  then: "你更常開出{{t:second-barrel|第二槍}}，也包括作為{{t:bluff|詐唬}}"
  because: "這張牌通常比較常擊中你的{{t:open|開池}}{{t:range|範圍}}，而不是防守方的{{t:range|範圍}}，而且對手的每一個{{t:pair|對子}}都往下降一級"
  level: heuristic
  source: "商業求解器網站，The Worst Turn Card；訓練網站，When to Fire a Second Barrel；訓練網站，When to Double Barrel the Turn as a Bluff"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-002
  module: m7
  if: "你在轉牌用{{t:second-barrel|第二槍}}{{t:bluff|詐唬}}"
  then: "當對手傾向{{t:fold|棄牌}}或{{t:call|跟注}}時，你通常用有補牌的手牌{{t:bluff|詐唬}}（{{t:flush-draw|同花聽牌}}、{{t:straight|順子}}聽牌、帶大牌的卡順聽牌）；當他可能{{t:raise|加注}}時，求解器也會用沒有補牌的手牌{{t:bluff|詐唬}}（簡化：選擇取決於對手會如何回應）"
  because: "{{t:semi-bluff|半詐唬}}有兩種贏法：對手{{t:fold|棄牌}}，或你在河牌命中；沒有補牌的{{t:bluff|詐唬}}只有第一種（籌碼約 {{n:format.stack}}）"
  level: heuristic
  source: "商業求解器網站，From Gutshots to Airballs: Choosing Your Bluffs；有訓練網站的教練，The Double Barrel Checklist；訓練網站，When to Double Barrel the Turn as a Bluff（約 100bb 時）"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-003
  module: m7
  if: "轉牌你有中等手牌（例如{{t:second-pair|第二對}}，或踢腳牌弱的{{t:top-pair|頂對}}），而對手已經{{t:call|跟注}}過 c-bet"
  then: "你更常{{t:check|過牌}}，而不是再下注一次"
  because: "對手{{t:call|跟注}}翻牌後，他的{{t:range|範圍}}比之前更強：面對下注，他會用較差的牌{{t:fold|棄牌}}、用較好的牌付錢；{{t:check|過牌}}能讓{{t:pot|底池}}保持小，並打到攤牌"
  level: heuristic
  source: "商業求解器網站（Brokos），Principles of Turn Strategy；訓練網站，Poker Basics: Polarised Ranges；商業求解器網站，Poker: The Battle for Information"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M7-004
  module: m7
  if: "你在轉牌用一手自己幾乎贏不了的牌{{t:bluff|詐唬}}"
  then: "下注{{t:pot|底池}}的 3/4 時，對手{{t:fold|棄牌}}的頻率必須高於 {{n:alpha.bet-three-quarters}}；下注半個{{t:pot|底池}}時，則必須高於 {{n:alpha.bet-half}}"
  because: "你拿下注額冒險去贏{{t:pot|底池}}：門檻是 下注 ÷ （{{t:pot|底池}} + 下注）；你擁有的補牌會降低這個門檻"
  level: math
  source: "計算：alpha = 下注/(底池+下注)"
  sources: [{ kind: math }]
- id: R-M7-005
  module: m7
  if: "你在轉牌用{{t:polarized|極化}}的{{t:range|範圍}}下注（非常強的牌和帶{{t:draw|聽牌}}的{{t:semi-bluff|半詐唬}}，沒有中等手牌）"
  then: "你選擇大尺寸，例如{{t:pot|底池}}的 3/4，而中等手牌{{t:check|過牌}}"
  because: "強牌想在河牌前做大{{t:pot|底池}}，{{t:bluff|詐唬}}牌需要對手{{t:fold|棄牌}}，而中等手牌無法從大{{t:pot|底池}}中獲益"
  level: heuristic
  source: "訓練網站，Polarized vs Merged Ranges（定義）；訓練網站，Polarised Ranges；商業求解器網站，The Worst Turn Card"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-006
  module: m7
  if: "轉牌你有強牌，而對手可能有{{t:flush-draw|同花聽牌}}"
  then: "你大額下注：面對{{t:pot|底池}} 3/4 的下注，{{t:draw|聽牌}}需要 {{n:eq.bet-three-quarters}} 的權益，而它只有約 {{n:odds.flush.turn-river}}"
  because: "面對{{t:pot|底池}} 1/4 的下注，他只需要 {{n:eq.bet-quarter}}，所以小額下注給了{{t:draw|聽牌}}好價格"
  level: math
  source: "計算：所需權益 = 下注/(底池+2·下注)，機率 = 補牌數 ÷ 未知牌數；方向（強但容易被追上的手牌大額下注）：訓練網站，How Much Should You Bet on Connected Boards?"
  sources: [{ kind: training }, { kind: math }]
- id: R-M7-007
  module: m7
  if: "轉牌你有{{t:draw|聽牌}}"
  then: "你只算一張牌的機率：{{t:flush|同花}}約 {{n:odds.flush.turn-river}}，而不是像從翻牌到河牌那樣的 {{n:odds.flush.flop-river}}"
  because: "到河牌只剩一張牌，所以機率大約是在翻牌時算兩張牌的一半"
  level: math
  check: { kind: draw-price, streets: [turn] }
  source: "精確計算（poker-core）"
  sources: [{ kind: math }]
- id: R-M7-008
  module: m7
  if: "轉牌時{{t:draw|聽牌}}的價格太高（你的權益低於所需）"
  then: "只有在命中後總共至少能贏到 補注額 × （不中的牌數 ÷ 補牌數）時，你才{{t:call|跟注}}；超過{{t:pot|底池}}的部分就是隱含賠率"
  because: "這樣命中時贏的錢能彌補落空時的損失；以同花聽牌、對 {{n:ex.third.pot}} 的{{t:pot|底池}}下注 {{n:io.flush.bet}} 為例，超過{{t:pot|底池}}的部分是 {{n:io.flush.extra}}"
  level: math
  check: { kind: implied-odds, streets: [flop, turn], params: { sprMin: "n:spr.zone.mid" } }
  source: "EV 計算：權益 × （底池 + 額外贏得）=（1 − 權益）× 補注額"
  sources: [{ kind: math }]
- id: R-M7-009
  module: m7
  if: "你指望隱含賠率"
  then: "只有在對手身後還有足夠的{{t:chips|籌碼}}（{{t:spr|SPR}}高）、你的{{t:draw|聽牌}}能成最好的牌，而且命中不明顯時，你才相信它"
  because: "額外的{{t:chips|籌碼}}還得由對手付給你；{{t:spr|SPR}}低時根本沒有這些籌碼可拿，而明顯的命中（例如{{t:board|牌面}}上出現第三張紅心）會把他嚇跑"
  level: heuristic
  source: "有訓練網站的教練，Implied Odds Calculator；訓練網站，Implied Odds"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-010
  module: m7
  if: "你有小{{t:flush|同花}}的{{t:draw|聽牌}}，或在{{t:board|牌面}}可能出現{{t:flush|同花}}時聽{{t:straight|順子}}"
  then: "你更謹慎地{{t:call|跟注}}，並少算一些補牌"
  because: "就算命中，有時仍會輸給更好的牌，而那時你付的錢最多（反向隱含賠率）"
  level: heuristic
  source: "訓練網站，Back to Basics (Part 2): Reverse Implied Odds；有訓練網站的教練，Implied Odds Calculator"
  sources: [{ kind: training }, { kind: training }]
- id: R-M7-011
  module: m7
  if: "你防守{{t:big-blind|大盲}}，而按鈕位{{t:open|開池}}後在翻牌沒有 c-bet（{{t:check|過牌}}）"
  then: "轉牌你更常自己下注（探測下注，probe bet），尤其在低牌面；在有 A 或 K 的牌面則較少"
  because: "按鈕位的很多強牌本來會下注，所以{{t:check|過牌}}後他的強牌較少；不過在高牌面上，{{t:range-advantage|範圍優勢}}仍在他那邊"
  level: heuristic
  source: "商業求解器網站，The Turn Probe Bet；訓練網站，Turn Probe（Kanu7）；訓練網站，Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-012
  module: m7
  if: "你在轉牌做探測下注"
  then: "你用想被付錢、也需要保護的{{t:pair|對子}}，以及強{{t:draw|聽牌}}下注；沒有{{t:pair|對子}}也沒有補牌的手牌{{t:check|過牌}}"
  because: "{{t:pair|對子}}能從按鈕位較差的牌上賺錢，也不給他免費牌；{{t:draw|聽牌}}有兩種贏法；空氣牌則毫無收穫"
  level: heuristic
  source: "商業求解器網站，The Turn Probe Bet；訓練網站，Turn Probe（Kanu7）；訓練網站，Probe Betting Explained"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M7-013
  module: m7
  if: "你在翻牌{{t:call|跟注}}了 c-bet，而對手在轉牌再次下注"
  then: "你防守得比翻牌時窄：{{t:draw|聽牌}}只在價格好或有隱含賠率時才{{t:call|跟注}}，沒有補牌的手牌和最弱的{{t:pair|對子}}{{t:fold|棄牌}}"
  because: "對手開{{t:second-barrel|第二槍}}的{{t:range|範圍}}比 c-bet 窄，尺寸通常也更大，而{{t:draw|聽牌}}只剩一張牌"
  level: heuristic
  source: "訓練網站，What the Best Poker Pros Already Know About Playing vs. Double Barrels"
  sources: [{ kind: training }]

# M8: river. Matematyka z formuł (numbers.yaml); zalecenia z literatury jako heurystyki, bez częstotliwości.
# Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D10–D17). Reguł eksploatacyjnych brak (R-M6-004: obserwacja konkretnego gracza, bez danych o populacji, D-149).
- id: R-M8-001
  module: m8
  if: "河牌你{{t:in-position|有位置}}，想為了{{t:value|價值}}下注，而對手只能{{t:call|跟注}}或{{t:fold|棄牌}}"
  then: "當會{{t:call|跟注}}的手牌中超過 {{n:value.threshold}} 比你差時，你就下注；只計算會付錢的手牌，而不是對手所有的手牌"
  because: "每一次較差手牌的{{t:call|跟注}}會贏一個下注，每一次較好手牌的{{t:call|跟注}}會輸一個下注；對手用較差的牌{{t:fold|棄牌}}時，你贏到的{{t:pot|底池}}和{{t:check|過牌}}後會贏的一樣"
  level: math
  source: "計算：下注相對於過牌的期望值（M8 課程大綱：價值下注是在被跟注時贏超過一半）"
  sources: [{ kind: math }]
- id: R-M8-002
  module: m8
  if: "河牌你{{t:in-position|有位置}}拿著中等手牌，而對手較差的牌不會付下注"
  then: "你{{t:check|過牌}}，免費進入攤牌"
  because: "下注後，較差的牌會{{t:fold|棄牌}}，付錢（或{{t:raise|加注}}）的是較好的牌，所以下注會把有攤牌價值的手牌變成{{t:bluff|詐唬}}"
  level: heuristic
  source: "由 R-M8-001 推論；商業求解器網站，Mastering Thin Value Bets in Checked-Down Pots；訓練網站，River；訓練網站，Polarized vs Merged Ranges"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M8-003
  module: m8
  if: "你的河牌手牌只贏可能{{t:call|跟注}}的手牌中稍多於一半的牌（薄價值）"
  then: "當對手很少{{t:raise|加注}}時，你下注得比強牌小，通常約{{t:pot|底池}}的 1/4–1/2（簡化：擁有{{t:position|位置}}而有被過牌加注的風險時，你很少下注低於{{t:pot|底池}}的 1/2）"
  because: "小額下注連對手較弱的手牌也會{{t:call|跟注}}；大額下注主要只有較好的牌會{{t:call|跟注}}，這時較差手牌的{{t:call|跟注}}就不再多於較好手牌的"
  level: heuristic
  source: "商業求解器網站，River Refinements；商業求解器網站，Mastering Thin Value Bets in Checked-Down Pots；訓練網站，Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-004
  module: m8
  if: "河牌你用由非常強的牌和{{t:bluff|詐唬}}組成的{{t:range|範圍}}下注整個{{t:pot|底池}}"
  then: "在均衡中，你的下注約有 {{n:bluff.share.bet-pot}} 是{{t:bluff|詐唬}}；一般來說，{{t:bluff|詐唬}}比例 = 下注 ÷ （{{t:pot|底池}} + 2·下注）"
  because: "這時對手只能贏{{t:bluff|詐唬}}的手牌剛好擁有所需權益（{{n:eq.bet-pot}}）：{{t:call|跟注}}或{{t:fold|棄牌}}都賺不到，所以你無法被剝削"
  level: math
  source: "計算：抓詐唬手牌的無差異條件（簡化模型：極化範圍對上抓詐唬牌）；商業求解器網站，How to Solve Toy Games"
  sources: [{ kind: solver-pub }, { kind: math }]
- id: R-M8-005
  module: m8
  if: "河牌你用{{t:polarized|極化}}的{{t:range|範圍}}改變下注尺寸"
  then: "下注越大，其中的{{t:bluff|詐唬}}越多；下注越小則越少：{{t:pot|底池}} 1/3 時約 {{n:bluff.share.bet-third}}，整個{{t:pot|底池}}時約 {{n:bluff.share.bet-pot}}"
  because: "下注越大，給對手的價格越差，所以他的{{t:call|跟注}}需要你的{{t:range|範圍}}中有更多{{t:bluff|詐唬}}才划算"
  level: math
  source: "計算：詐唬比例 = 下注/(底池+2·下注)"
  sources: [{ kind: math }]
- id: R-M8-006
  module: m8
  if: "你在選擇河牌要用哪些手牌{{t:bluff|詐唬}}"
  then: "你用攤牌時贏不了的最弱手牌{{t:bluff|詐唬}}（例如沒中的{{t:straight|順子}}{{t:draw|聽牌}}，或毫無勝算的高牌）；有攤牌價值的手牌{{t:check|過牌}}"
  because: "用{{t:check|過牌}}後常常能贏的牌{{t:bluff|詐唬}}，等於放棄那份勝利；毫無勝算的牌在{{t:bluff|詐唬}}失敗時沒有任何損失"
  level: heuristic
  source: "商業求解器網站，We're At The River. Our Hand Can't Win. Now What?；訓練網站，Polarized vs Linear Ranges"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-007
  module: m8
  if: "你在沒有攤牌價值的手牌中挑選{{t:bluff|詐唬}}牌"
  then: "你挑的手牌要有一張能阻擋對手強牌（也就是他會用來付錢的牌）的牌（例如{{t:board|牌面}}上有三張同花色時，拿著該花色的 A）"
  because: "當你拿著他最強手牌中的一張，對手這些牌的{{t:combo|組合}}就變少，所以他更常剩下要棄掉的牌"
  level: heuristic
  source: "M8 課程大綱；商業求解器網站，Blockers & Unblockers: The Secret to Picking Great Bluffs；訓練網站，What is Unblocking in Poker"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-008
  module: m8
  if: "{{t:flush-draw|同花聽牌}}沒中，而你在挑選{{t:bluff|詐唬}}牌"
  then: "可以選擇{{t:bluff|詐唬}}牌時，你偏好沒有該花色牌的{{t:bluff|詐唬}}"
  because: "對手會{{t:fold|棄掉}}沒中的{{t:draw|聽牌}}；你手上有該花色的牌，會減少他會棄掉的手牌數量"
  level: heuristic
  source: "訓練網站，What is Unblocking in Poker；商業求解器網站，Blockers & Unblockers: The Secret to Picking Great Bluffs"
  sources: [{ kind: solver-pub }, { kind: training }]
- id: R-M8-009
  module: m8
  if: "你拿著某個點數的一張牌"
  then: "對手帶有這個點數的{{t:combo|組合}}變少：AK 從 {{n:combos.unpaired}} 變成 {{n:combos.unpaired.one-blocked}}，一{{t:pair|對}} A 則從 {{n:combos.pair}} 只剩 {{n:combos.pair.one-blocked}}"
  because: "你手上的牌不可能在對手手上：這個點數的四張牌只剩 {{n:pair.outs.per-rank}} 張可能在他手上"
  level: math
  source: "組合計算"
  sources: [{ kind: math }]
- id: R-M8-010
  module: m8
  if: "河牌你的手牌只能贏對手的{{t:bluff|詐唬}}（抓詐唬牌，bluff-catcher）"
  then: "當{{t:bluff|詐唬}}所佔比例高於所需權益時，你{{t:call|跟注}}，例如在{{t:pot|底池}}大小的下注中超過 {{n:eq.bet-pot}} 是詐唬；{{t:bluff|詐唬}}較少時，你{{t:fold|棄牌}}"
  because: "你的權益就是他的下注中{{t:bluff|詐唬}}所佔的比例（你贏每一手{{t:bluff|詐唬}}，輸給每一手{{t:value|價值}}牌）；當對手{{t:bluff|詐唬}}的比例等於 下注 ÷ （{{t:pot|底池}} + 2·下注）時，{{t:call|跟注}}剛好打平"
  level: math
  source: "計算：所需權益 = 下注/(底池+2·下注)"
  sources: [{ kind: math }]
- id: R-M8-011
  module: m8
  if: "你在選擇用哪些抓詐唬牌{{t:call|跟注}}河牌下注"
  then: "你偏好帶有能阻擋對手強牌的牌、且不帶會阻擋他{{t:bluff|詐唬}}的牌的手牌（例如沒有沒中{{t:draw|聽牌}}那個花色的牌）"
  because: "當你阻擋他的價值牌，他的下注{{t:range|範圍}}中就剩下更多{{t:bluff|詐唬}}；當你阻擋他的{{t:bluff|詐唬}}，剩下的價值牌就更多"
  level: heuristic
  source: "商業求解器網站，Understanding Blockers；訓練網站；訓練網站，Bluff Catching Strategy"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: training }]
- id: R-M8-012
  module: m8
  if: "你在河牌面對下注，用{{t:range|範圍}}防守"
  then: "你用最好的抓詐唬牌{{t:call|跟注}}：在強度相近的手牌中，選擇{{t:blocker|阻擋牌}}較好的；連{{t:bluff|詐唬}}都輸的手牌{{t:fold|棄牌}}"
  because: "輸給對手所有下注的手牌，就算對手{{t:bluff|詐唬}}很多，{{t:call|跟注}}也賺不到錢"
  level: heuristic
  source: "由 MDF（R-M6-001）和 R-M8-010 推論；商業求解器網站，Principles of River Play；訓練網站，Bluff Catching Principles"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]

# M9: plan rozdania. Matematyka z liczb (numbers.yaml); progi stref SPR i liczba ulic wartości jako heurystyki
# (uproszczenia nazwane w lekcjach). Źródła przeczytane i potwierdzone w dokumencie 12 (decyzje D18–D22).
- id: R-M9-001
  module: m9
  if: "你計算翻牌的{{t:spr|SPR}}"
  then: "你把{{t:effective-stack|有效籌碼}}（兩者中較小的，不含已在{{t:pot|底池}}中的部分）除以{{t:pot|底池}}；{{t:open|開池}}並被{{t:call|跟注}}後約 {{n:spr.srp}}，{{t:in-position|有位置}}的 3-bet 後約 {{n:spr.3bet-ip}}，4-bet 後約 {{n:spr.4bet}}"
  because: "翻前每一次{{t:raise|加注}}都會讓{{t:pot|底池}}變大好幾倍，而身後的籌碼減少得慢得多"
  level: math
  source: "計算：SPR = 有效籌碼 ÷ 翻牌底池（籌碼與底池來自 M4 的數字）"
  sources: [{ kind: math }]
- id: R-M9-002
  module: m9
  if: "對手在翻牌用全部籌碼全下"
  then: "要{{t:call|跟注}}，你需要 籌碼 ÷ （{{t:pot|底池}} + 2·籌碼）的權益：{{t:spr|SPR}} {{n:spr.commit}} 時是 {{n:eq.jam.spr2}}，{{t:spr|SPR}} {{n:spr.srp}} 時已經是 {{n:eq.jam.srp}}"
  because: "你補上全部籌碼，去贏{{t:pot|底池}}和對手的籌碼；{{t:spr|SPR}}越低，你拿到的價格越好"
  level: math
  source: "計算：所需權益 = 補注額/(底池 + 2·補注額)"
  sources: [{ kind: math }]
- id: R-M9-003
  module: m9
  if: "翻牌的{{t:spr|SPR}}低於約 {{n:spr.zone.low}}（例如 {{n:spr.commit}}），而你有{{t:top-pair|頂對}}或更好的牌"
  then: "你打全部籌碼：下注或{{t:call|跟注}}時就打算全部投入，面對全下通常不{{t:fold|棄牌}}"
  because: "{{t:spr|SPR}} {{n:spr.commit}} 時，面對全下你最多只需要約 {{n:eq.jam.spr2}} 的權益，而兩次各約{{t:pot|底池}} {{n:geo.spr2.2}} 的{{t:bet|下注}}就能投入全部籌碼；{{t:top-pair|頂對}}通常能打兩條{{t:value|價值}}街"
  level: heuristic
  source: "商業求解器網站，Stack-to-Pot Ratio；有訓練網站的教練，SPR Strategy；課程 m9.l2 中的計算"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-004
  module: m9
  if: "你{{t:bet|下注}}後剩下的籌碼，會少於他{{t:call|跟注}}後的{{t:pot|底池}}"
  then: "你不打算先{{t:bet|下注}}再面對全下{{t:fold|棄牌}}：要嘛打全部籌碼，要嘛{{t:check|過牌}}"
  because: "{{t:spr|SPR}} {{n:spr.commit}} 時，下注{{t:pot|底池}}大小的{{t:bet|下注}}後，面對全下你只需要 {{n:eq.commit.after-pot}} 的權益，所以{{t:fold|棄牌}}通常不划算"
  level: math
  source: "計算：補注額/(超出部分之前的底池 + 2·補注額)"
  sources: [{ kind: math }]
- id: R-M9-005
  module: m9
  if: "你在滿籌碼的單次加注{{t:pot|底池}}中（{{t:spr|SPR}}約 {{n:spr.srp}}），只有一{{t:pair|對}}"
  then: "你打價值，但通常不打算投入全部籌碼"
  because: "要到河牌為止投入全部籌碼，每一{{t:street|街}}都得下注超過{{t:pot|底池}}，而肯投入這麼多錢的對手，很少拿著比一{{t:pair|對}}還差的牌"
  level: heuristic
  source: "幾何尺寸計算（m9.l3）；商業求解器網站，Stack-to-Pot Ratio；訓練網站，When to Check Top Pair"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-006
  module: m9
  if: "你想到河牌為止用相同比例的{{t:bet|下注}}投入全部籌碼"
  then: "你在每一{{t:street|街}}都下注{{t:pot|底池}}的同一比例 f，使 (1 + 2f) 的「{{t:street|街}}數」次方 = 1 + 2·{{t:spr|SPR}}；在{{t:in-position|有位置}}的 3-bet {{t:pot|底池}}中，約為{{t:pot|底池}}的 {{n:geo.3bet-ip.3}}"
  because: "一次{{t:bet|下注}} f 加上一次{{t:call|跟注}}，會讓{{t:pot|底池}}乘以 (1 + 2f)，而當{{t:pot|底池}}長到{{t:pot|底池}} + 2·籌碼時就是全下"
  level: math
  source: "計算：幾何下注尺寸；訓練網站，Geometric Bet Sizing；商業求解器網站，Pot Geometry"
  sources: [{ kind: solver-pub }, { kind: training }, { kind: math }]
- id: R-M9-007
  module: m9
  if: "在籌碼 {{n:format.stack}} 的單次加注{{t:pot|底池}}中，你三{{t:street|街}}都下注"
  then: "你要記得，在 {{n:spr.srp.stack}} 的籌碼中，三次半{{t:pot|底池}}的{{t:bet|下注}}只投入 {{n:srp.half.total}}，三次{{t:pot|底池}}大小的{{t:bet|下注}}則投入 {{n:srp.potbet.total}}"
  because: "翻牌的{{t:pot|底池}}相對於籌碼很小；每一{{t:street|街}}{{t:bet|下注}}約{{t:pot|底池}}的 {{n:geo.srp.3}} 時，才會投入全部籌碼"
  level: math
  source: "計算：下注加跟注讓底池乘以 (1 + 2f)"
  sources: [{ kind: math }]
- id: R-M9-008
  module: m9
  if: "翻牌{{t:bet|下注}}前，你在規劃這手牌"
  then: "你評估這手牌能打幾條{{t:value|價值}}街（{{t:street|街}}數是簡化）：非常強的牌（暗三條、{{t:straight|順子}}、大{{t:two-pair|兩對}}）三條，踢腳好的{{t:top-pair|頂對}}或{{t:overpair|超對}}通常兩條，對手會用較弱的牌付錢時才打第三條；較弱的{{t:pair|對子}}一條或零條"
  because: "每多一{{t:street|街}}，對手較差的手牌就會{{t:fold|棄牌}}，留在{{t:pot|底池}}裡的主要是比你好的手牌"
  level: heuristic
  source: "綜合：訓練網站，When to Check Top Pair（https://upswingpoker.com/when-to-check-top-pair/）：「In single raised pots, the stack-to-pot ratio (SPR) is too high to comfortably get 3 streets of value with many top pair hands.」；商業求解器網站，Stack-to-Pot Ratio（https://blog.gtowizard.com/stack-to-pot-ratio/）：「All top pairs and all nut flush draws are now indifferent between calling and folding」（SPR 16）；商業求解器網站，Pot Geometry（https://blog.gtowizard.com/pot-geometry/）：「Game theory optimal strategies typically use geometric bet sizes when they want to maximize value with a big nut advantage.」；各手牌的街數，包括較弱的對子：本應用的簡化（D-149）"
  sources: [{ kind: training, url: "https://upswingpoker.com/when-to-check-top-pair/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }]
- id: R-M9-009
  module: m9
  if: "你有能打三條{{t:value|價值}}街的手牌，{{t:spr|SPR}}區間允許你用它打全部籌碼（R-M9-010），而你想投入全部籌碼"
  then: "你在翻牌就用幾何尺寸下注，而不是小額下注"
  because: "在 3-bet {{t:pot|底池}}中，三次各{{t:pot|底池}} 1/3 的{{t:bet|下注}}，在 {{n:spr.3bet-ip.stack}} 的籌碼中只投入約 {{n:g3b.third.total}}，所以大部分籌碼都沒投入；每一{{t:street|街}}下注約{{t:pot|底池}}的 {{n:geo.3bet-ip.3}}，才會全部投入"
  level: math
  source: "計算：下注與跟注的連鎖（numbers.yaml，鍵 g3b.third.* 和 geo.3bet-ip.*）"
  sources: [{ kind: math }]
- id: R-M9-010
  module: m9
  if: "你在規劃是否要用某手牌打全部籌碼"
  then: "你看{{t:spr|SPR}}區間（簡化）：低於約 {{n:spr.zone.low}} 時通常{{t:top-pair|頂對}}就夠，{{n:spr.zone.low}} 到 {{n:spr.zone.mid}} 時{{t:top-pair|頂對}}是邊緣牌，{{n:spr.zone.mid}} 到 {{n:spr.zone.deep}} 時你通常需要大{{t:two-pair|兩對}}或更好，高於 {{n:spr.zone.deep}} 時則需要暗三條、{{t:straight|順子}}或更好的牌"
  because: "{{t:spr|SPR}}越高，投入全部籌碼所需的{{t:bet|下注}}次數越多，而到最後對手主要用強牌付錢；{{t:spr|SPR}} {{n:spr.zone.deep}} 時，要三次{{t:pot|底池}}大小的{{t:bet|下注}}才會投入全部籌碼"
  level: heuristic
  source: "有訓練網站的教練，SPR Strategy（https://www.splitsuit.com/spr-poker-strategy）：「less than 3 is an auto-stack off with top pair or better, between 3-6 is situational and based upon villain/board texture, and more than 6 SPR isn't a default stack-off」；商業求解器網站，Stack-to-Pot Ratio（https://blog.gtowizard.com/stack-to-pot-ratio/）：「at this higher SPR, stacking off with top pair starts to get a bit dicey」；6–13 區間：兩個訓練網站的交集：SPR（https://www.thepokerbank.com/strategy/concepts/spr/）：「Medium SPR = 7 - 16」、「Good hands for medium SPRs.」、「Top two pair. Sets.」；Poker SPR（https://pokercoaching.com/blog/poker-spr/）：「High SPR (8+): Deep stacks favor hands that make nutted combinations (sets, straights, flushes) over one-pair holdings.」；門檻 13：計算 (1+2·1)^3 = 1+2·13，以及 Flynn、Mehta、Miller，Professional No-Limit Hold'em，經由新聞網站（https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm）：「if you're heads-up and the stack-to-pot ratio is 13 going to the flop, you and your opponent can each make exactly three pot-sized bets」；區間界線：本應用的簡化（D-149）"
  sources: [{ kind: training, url: "https://www.splitsuit.com/spr-poker-strategy" }, { kind: solver-pub, url: "https://blog.gtowizard.com/stack-to-pot-ratio/" }, { kind: training, url: "https://www.thepokerbank.com/strategy/concepts/spr/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-spr/" }, { kind: math }, { kind: book, url: "https://www.pokernews.com/strategy/building-big-pots-with-big-hands-stack-to-pot-ratio-24847.htm" }]

# M10: eksploatacja mikrostawek. Każde dostosowanie to odejście od bazy z M3–M9 (ADR-03). Definicje statystyk: rules;
# błąd próby, próg blefu i wpływ rake'u na cenę: math; progi typów graczy i próby z serwisów szkoleniowych: heuristic;
# wynik solvera: gto; dostosowanie do typu gracza: exploit z populacją (dane z analizy bazy rąk populacji albo odczyt HUD rywala z próbą).
# Decyzje D-M10-01…14 w raporcie M10 (do dokumentu 12 „Weryfikacja źródeł — M10–M13”).
- id: R-M10-001
  module: m10
  if: "你在讀對手的{{t:vpip|VPIP}}和{{t:pfr|PFR}}"
  then: "{{t:vpip|VPIP}}是他翻前自願投入{{t:chips|籌碼}}的手牌比例（{{t:call|跟注}}或{{t:raise|加注}}；盲注不算），{{t:pfr|PFR}}是他翻前{{t:raise|加注}}的手牌比例（{{t:open|開池}}、3-bet、4-bet）；{{t:pfr|PFR}}永遠不會超過{{t:vpip|VPIP}}"
  because: "每一次{{t:raise|加注}}也都是自願投入{{t:chips|籌碼}}，所以 {{t:vpip|VPIP}} − {{t:pfr|PFR}} 的差，就是對手只{{t:call|跟注}}或溜入的手牌"
  level: rules
  source: "商業求解器網站的詞彙表（https://gtowizard.com/en/glossary/）：「VPIP: … a statistic that measures the frequency with which a player voluntarily puts money into the pot preflop.」；訓練網站，How to Use Poker HUD Stats（https://pokercoaching.com/blog/poker-stats/）：「Anytime a player makes a call or a raise before the flop, their VPIP goes up」，「a player’s PFR stat goes up anytime they make a raise before the flop, which includes all 3-bets and 4-bets as well as open raises」"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }]
- id: R-M10-002
  module: m10
  if: "對手的某項數據是根據 n 次機會"
  then: "它的標準誤是 √(p × (1 − p) ÷ n)：{{t:vpip|VPIP}} {{n:hud.se.ex.p}}、經過 {{n:hud.se.ex.n}} 手牌時約為 {{n:hud.se.ex}}，所以真正的{{t:vpip|VPIP}}有約 {{n:var.conf95}} 的把握落在 {{n:hud.ci.ex.low}} 到 {{n:hud.ci.ex.high}} 之間"
  because: "每一手牌都是他策略的一次隨機樣本，而這種平均值的誤差只會隨機會次數的平方根縮小，就像第 12 單元中贏率的誤差一樣"
  level: math
  source: "計算：二項分布中比例的標準誤 √(p(1 − p) ÷ n)，以及 ±1.96 倍誤差的區間（numbers.yaml，鍵 hud.se.*、hud.ci.*）"
  sources: [{ kind: math }]
- id: R-M10-003
  module: m10
  if: "你根據{{t:hud|HUD}}數據評估對手"
  then: "少於約 {{n:hud.hands.random}} 手牌時，你把數據當作隨機，把他當成未知的玩家來打；約 {{n:hud.hands.random}}–{{n:hud.hands.rough.high}} 手牌後可以粗略看出玩家類型，{{t:vpip|VPIP}}和{{t:pfr|PFR}}約 {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}} 手後穩定，3-bet 約 {{n:hud.hands.3bet.overall.low}}–{{n:hud.hands.3bet.high}} 手後，面對 3-bet 的棄牌率（fold to 3-bet）約 {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}} 手後"
  because: "{{t:vpip|VPIP}}每一手牌都增加一次機會，而面對 3-bet 的棄牌率只有在對手{{t:open|開池}}又遭到 3-bet 時才增加，所以同樣的手牌數下，它的機會少很多倍，誤差也更大"
  level: heuristic
  source: "訓練網站，How to Use Poker HUD Stats（https://pokercoaching.com/blog/poker-stats/）：「For VPIP and PFR, you need at least 100 to 200 hands before the numbers begin to stabilize.」，「For 3-bet and fold to 3-bet, closer to 500 hands is the threshold.」；訓練網站，Essential HUD Stats Guide（https://deepfold.co/en/blog/hud-stats-guide）：「Below 30 hands, treat the HUD numbers as random and use hand-observation reads only.」，「VPIP / PFR 30-50 hands」，「3-bet % (overall) 100+ hands」，「Fold to 3-bet | 200+ hands」；VPIP 和 PFR 有兩個門檻：30–50 手可粗略判斷類型，100–200 手後穩定（同一層級來源的矛盾，docs/tresci/e1-m9-m11.md §3.1）；3-bet 和 fold to 3-bet 的下限分別取自同一張表（100+ 和 200+），上限共用（D-M10-04；E3 2026-11-04）"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-004
  module: m10
  if: "對手的{{t:vpip|VPIP}}比他的{{t:pfr|PFR}}高出超過 {{n:hud.gap.passive}} 個百分點"
  then: "這是被動型玩家：常{{t:call|跟注}}和溜入，很少{{t:raise|加注}}"
  because: "他玩的大部分手牌都是用{{t:call|跟注}}投入{{t:pot|底池}}；{{t:regular|常規玩家}}的差距很小，因為他們幾乎每手牌都以{{t:raise|加注}}開始"
  level: heuristic
  source: "訓練網站，How to Use Poker HUD Stats（https://pokercoaching.com/blog/poker-stats/）：「When a player’s PFR is more than 10 points below their VPIP, I immediately flag them as a passive player who calls too much and raises too little.」；訓練網站，Essential HUD Stats Guide（https://deepfold.co/en/blog/hud-stats-guide）：「Gap > 10 → Passive player. Lots of cold-calls and limps.」；族群手牌資料庫分析的對照數據，大型線上平台 NL25 6-max：娛樂玩家 42/18，常規玩家 23/18（mda.rec.*、mda.reg.*）"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-005
  module: m10
  if: "你根據{{t:vpip|VPIP}}和{{t:pfr|PFR}}判斷對手的類型（6-max，至少約 {{n:hud.hands.vpip.low}} 手牌）"
  then: "{{t:nit|岩石型玩家}}最多玩約 {{n:hud.vpip.nit-max}} 的手牌；{{t:regular|常規玩家}}約 {{n:hud.vpip.reg.low}}–{{n:hud.vpip.reg.high}}，{{t:vpip|VPIP}} − {{t:pfr|PFR}} 的差距小；鬆型玩家從約 {{n:hud.vpip.loose}} 起：差距超過 {{n:hud.gap.passive}} 個百分點的是被動的{{t:recreational|娛樂玩家}}（{{t:calling-station|跟注站}}），差距在約 {{n:hud.gap.aggressive}} 個百分點以內的是{{t:maniac|瘋子}}"
  because: "類型告訴你對手往哪個方向偏離基準：玩太少手牌、玩太多手牌、太常{{t:call|跟注}}，或太常{{t:raise|加注}}"
  level: heuristic
  source: "訓練網站，How to Use Poker HUD Stats（https://pokercoaching.com/blog/poker-stats/），6-max 現金局表格：「22 to 28」、「35+」、「14 or below」；「a player playing a 45 VPIP is either a maniac or a calling station」；「When the gap is less than 3 points, I flag them as highly aggressive」；訓練網站，Essential HUD Stats Guide（https://deepfold.co/en/blog/hud-stats-guide）：「10-15% | Very tight (nit)」、「18-22% | Tight-aggressive (TAG)」、「25-30% | Loose-aggressive (LAG)」、「35%+ | Loose (likely recreational)」，玩家輪廓「Nit (15/12/3%)」、「Whale / Recreational (45/8/2%)」、「Maniac (38/35/15%+)」；族群手牌資料庫分析：Regulars「VPIP = 18-32」，Recreationals「VPIP > 40」；門檻取交集，或取涵蓋各來源的區間（D-M10-03）"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: population }]
- id: R-M10-006
  module: m10
  if: "你對上被動的{{t:recreational|娛樂玩家}}（{{t:vpip|VPIP}}約 {{n:hud.vpip.loose}} 以上，{{t:vpip|VPIP}} − {{t:pfr|PFR}} 差距超過 {{n:hud.gap.passive}} 個百分點）"
  then: "你用更多手牌為了{{t:value|價值}}下注，包括更薄的價值，並比第 8 單元的基準更少{{t:bluff|詐唬}}，尤其在河牌"
  because: "這種玩家更常打到攤牌，也更常在攤牌時輸，也就是他用較弱的牌{{t:call|跟注}}：他的{{t:call|跟注}}中有更多比你差的牌（第 8 單元的價值下注門檻），而只有當對手{{t:fold|棄牌}}的頻率高於{{t:alpha|alpha}}時，{{t:bluff|詐唬}}才賺錢"
  level: exploit
  population: "大型線上平台的娛樂玩家，NL25–NL100 6-max（依資料庫定義：VPIP > 40，結果 < −20bb/100）：WTSD 32%，常規玩家為 28%；攤牌勝率 46%，常規玩家為 57%；結果 −47bb/100；2026年10月5日前 12 個月的所有牌局（族群手牌資料庫分析，未提供手牌數）"
  source: "提供族群手牌資料庫分析的網站（https://bluffaces.com/calculators/mda/），篩選條件：大型線上平台 NL25/NL50/NL100 6-max，Recreationals 與 Regulars（mda.rec.*、mda.reg.*），未提供手牌數；訓練網站，How to Use Poker HUD Stats（https://pokercoaching.com/blog/poker-stats/）：高 WTSD「instantly tells you to bluff them less and value bet them more across all betting streets, especially on the river.」；訓練網站，Essential HUD Stats Guide（https://deepfold.co/en/blog/hud-stats-guide）：「>30% → Calling station. Value bet thinly, never bluff river.」（我們不教這個 WTSD 門檻：該訓練網站說「In most cases, your WTSD% should be around 30」，而在手牌資料庫的數據中，常規玩家為 28%，娛樂玩家為 32%；D-M10-07）；價值下注門檻 R-M8-001 和第 6 單元的 alpha 不變（D-M10-06）"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-007
  module: m10
  if: "{{t:nit|岩石型玩家}}（至少約 {{n:hud.hands.vpip.low}} 手牌後{{t:vpip|VPIP}}最多約 {{n:hud.vpip.nit-max}}）{{t:raise|加注}}或 3-bet"
  then: "你用{{t:call|跟注}}{{t:range|範圍}}底部的手牌{{t:fold|棄牌}}的頻率，比第 4 單元的基準更高，也更常偷他的盲注"
  because: "玩這麼少手牌的人，主要用最強的牌{{t:raise|加注}}，所以你的中等手牌更常被壓制；而他防守盲注很窄時，你的{{t:open|開池}}也更常直接獲勝"
  level: exploit
  population: "單一對手：至少約 100 手牌的 HUD 讀數（VPIP 最多 14%）；類型門檻來自兩個訓練網站（6-max 線上現金局）；沒有整體族群的資料，因為岩石型玩家在牌桌上是少數（D-M10-02）"
  source: "訓練網站，How to Use Poker HUD Stats（https://pokercoaching.com/blog/poker-stats/）：「anyone significantly below is a nit whose raises you can nearly always fold to」；訓練網站，Essential HUD Stats Guide（https://deepfold.co/en/blog/hud-stats-guide）：岩石型玩家「Plays only premium hands. Steal their blinds relentlessly, fold to their 3-bets without thought, bluff-catch sparingly.」；「10-15% | Very tight (nit) | Folds preflop too much; bluff their open ranges, fold to their 3-bets」"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-008
  module: m10
  if: "你對上{{t:maniac|瘋子}}（{{t:vpip|VPIP}}約 {{n:hud.vpip.loose}} 以上，{{t:pfr|PFR}}幾乎等於{{t:vpip|VPIP}}）"
  then: "你不對他{{t:bluff|詐唬}}，用抓{{t:bluff|詐唬}}的手牌{{t:call|跟注}}得更寬，拿著非常強的牌時就讓他下注"
  because: "他的下注和{{t:raise|加注}}中含有的{{t:bluff|詐唬}}比基準多，所以在基準中處於{{t:call|跟注}}邊緣的手牌會賺錢，而對很少{{t:fold|棄牌}}的人{{t:bluff|詐唬}}則會虧錢"
  level: exploit
  population: "單一對手：至少約 100 手牌的 HUD 讀數（VPIP 35% 以上，VPIP − PFR 低於 3 個百分點）；類型門檻來自兩個訓練網站（6-max 線上現金局）；沒有整體族群的資料（D-M10-02）"
  source: "訓練網站，Essential HUD Stats Guide（https://deepfold.co/en/blog/hud-stats-guide）：瘋子「Trap with premium hands by flat-calling preflop and letting them stack off. Don't try to out-bluff them; just let them hang themselves.」；訓練網站，How to Use Poker HUD Stats（https://pokercoaching.com/blog/poker-stats/）：「a player playing a 45 VPIP is either a maniac or a calling station」；混合手牌原則：商業求解器網站，Calling Down Over-Bluffed Lines in Lower Limits（R-M10-009）"
  sources: [{ kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: solver-pub }]
- id: R-M10-009
  module: m10
  if: "你知道對手在某條路線上{{t:bluff|詐唬}}得比均衡多或少"
  then: "你先改變基準中混合{{t:call|跟注}}與{{t:fold|棄牌}}的那些手牌的決定：{{t:bluff|詐唬}}過多時，一律用它們{{t:call|跟注}}；詐唬不足時，一律{{t:fold|棄牌}}"
  because: "在均衡中，這些手牌是無差異的，因為對手的{{t:bluff|詐唬}}剛好是所需的數量；只要稍微多一點或少一點，它們就會倒向一邊，而{{t:range|範圍}}的其餘部分只有在差異很大時才會改變"
  level: gto
  source: "商業求解器網站，Calling Down Over-Bluffed Lines in Lower Limits（https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/），節點鎖定（nodelock）分析：「Hands that mix calls and folds in theory do so because Villain’s bet size is strategically balanced, making them indifferent to calling and folding since no option is the best.」；「If they are bluffing just a single combo more than they should, all of our indifferent bluff catchers become profitable calls and vice versa (we always fold when they are under-bluffing even slightly).」；「I only changed Villain’s strategy to bluff ~31% instead of ~27% of the time for our strategy to shift completely to never folding.」"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/calling-down-the-over-bluffed-lines-in-lower-limits/" }]
- id: R-M10-010
  module: m10
  if: "對手面對 c-bet {{t:fold|棄牌}}的頻率，高於你下注尺寸的{{t:alpha|alpha}}"
  then: "什麼牌都沒有的 c-bet 立即就能獲利：c-bet {{t:pot|底池}}的 1/3 時，超過 {{n:alpha.cbet.small}} 的{{t:fold|棄牌}}就夠了；c-bet {{t:pot|底池}}的 3/4 時，則要超過 {{n:alpha.cbet.big}}"
  because: "{{t:bluff|詐唬}}是拿下注額冒險去贏{{t:pot|底池}}；當{{t:fold|棄牌}}的比例超過 下注 ÷ （{{t:pot|底池}} + 下注）時就賺錢；{{t:hud|HUD}}上的面對 c-bet 棄牌率合併了所有尺寸和牌面，所以只是近似值"
  level: math
  source: "計算：純詐唬的 EV = 棄牌率 × 底池 −（1 − 棄牌率）× 下注 > 0 ⇔ 棄牌率 > 下注 ÷ （底池 + 下注）（alpha，第 6 單元；numbers.yaml alpha.cbet.*）；商業求解器網站的詞彙表（https://gtowizard.com/en/glossary/）：「Alpha (α): The minimum frequency your opponent needs to fold to a bet, in order to break even with a pure (0% equity) bluff.」"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M10-011
  module: m10
  if: "對手很少對 3-bet {{t:fold|棄牌}}（面對 3-bet 的棄牌率低於約 {{n:hud.f3b.low}}），例如典型的{{t:recreational|娛樂玩家}}"
  then: "你用{{t:linear|線性}}{{t:range|範圍}}對他 3-bet：更多強牌為了{{t:value|價值}}，幾乎沒有{{t:bluff|詐唬}}"
  because: "{{t:in-position|有位置}}時 3-bet 到 {{n:pf.3bet.ip-total}}，在什麼牌都沒有的情況下，要超過 {{n:alpha.vs-3bet-ip-size}} 的{{t:fold|棄牌}}才能賺錢；對手很少{{t:fold|棄牌}}時，{{t:bluff|詐唬}}牌會拿著弱牌打大{{t:pot|底池}}，而強牌會得到更多{{t:call|跟注}}"
  level: exploit
  population: "大型線上平台，NL25–NL100 6-max（族群手牌資料庫分析，2026年10月5日前 12 個月，未提供手牌數）：娛樂玩家面對 3-bet 的棄牌率 31%（NL50 30%、NL100 32%），常規玩家 55%（NL50 57%、NL100 55%）"
  source: "提供族群手牌資料庫分析的網站（https://bluffaces.com/calculators/mda/），Fold to 3bet（mda.rec.f3b、mda.reg.f3b），未提供手牌數；訓練網站，How to Use Poker HUD Stats（https://pokercoaching.com/blog/poker-stats/）：「if a player has a low Fold to 3-Bet, you will want to adjust your 3-betting range against them and play a more linear range made up of almost solely value hands and very few bluffs.」；訓練網站，Essential HUD Stats Guide（https://deepfold.co/en/blog/hud-stats-guide）：「<50% → They call 3-bets wide. Drop bluff 3-bets; value-bet thinner and exploit postflop.」；第 4 單元的 alpha 門檻（alpha.vs-3bet-ip-size）"
  sources: [{ kind: population, url: "https://bluffaces.com/calculators/mda/" }, { kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://deepfold.co/en/blog/hud-stats-guide" }]
- id: R-M10-012
  module: m10
  if: "你對對手只有很小的樣本，或只有對族群的一般認識"
  then: "你只朝數據顯示的方向偏離基準，而且只用邊緣手牌；用整個{{t:range|範圍}}大幅偏離，要等到樣本夠大、對手的錯誤也很明顯時才做"
  because: "樣本小時，數據的誤差大，而偏離基準（最不容易被剝削的策略）本身就會被剝削"
  level: heuristic
  source: "訓練網站，How to Use Poker HUD Stats（https://pokercoaching.com/blog/poker-stats/）：「The directional signal (very high VPIP, very low PFR) may still be useful even with small samples, but specific exploitation based on percentage points requires a much larger hand history.」；商業求解器網站的詞彙表（https://gtowizard.com/en/glossary/）：「Exploit: To deviate from a baseline strategy in order to take advantage of a (future or prior) mistake in your opponent's strategy.」，「Game Theory Optimal (GTO) The least exploitable fixed strategy」；樣本誤差：R-M10-002"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/poker-stats/" }, { kind: training, url: "https://gtowizard.com/en/glossary/" }]
- id: R-M10-013
  module: m10
  if: "你在微級別（NL2–NL25）打 6-max 現金局"
  then: "你計算扣除{{t:rake|抽水}}後的結果：大型線上平台抽約 {{n:rake.micro.low}}–{{n:rake.micro.high}}，是典型贏家贏率（{{n:var.wr.typical.low}}–{{n:var.wr.typical.high}}）的好幾倍"
  because: "每一個進入翻牌的{{t:pot|底池}}，所有玩家都要付{{t:rake|抽水}}；要贏錢，你贏對手的幅度必須超過{{t:rake|抽水}}"
  level: heuristic
  source: "撲克計算器網站，Online Poker Rake Comparison 2026（https://www.primedope.com/online-poker-rake-comparison-rake-calculator/），NLH 6-max，兩個大型線上平台 NL2–NL25（rake.micro.*）；族群對照數據：Tombos21，每位玩家的抽水 NL10 9.1bb/100、NL100 7.3bb/100（rake.pop.*）；新聞網站，How Many Winning Cash Games Players Are There? It Depends on Rake（https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players），Tombos21：「Reminder that your biggest villain is the house.」、「Pre-rake winners 90% post-rake winners 53%」；有訓練部落格的教練（var.wr.typical.*，第 12 單元）"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: population, url: "https://www.gipsyteam.com/news/12-12-2025/number-of-winning-cash-game-players" }, { kind: training }]
- id: R-M10-014
  module: m10
  if: "在只對進入翻牌的{{t:pot|底池}}收{{t:rake|抽水}}的牌局中，你面對{{t:open|開池}}"
  then: "你{{t:call|跟注}}得比沒有{{t:rake|抽水}}的牌局少；一部分在沒有{{t:rake|抽水}}時會{{t:call|跟注}}的手牌改成 3-bet，其餘{{t:fold|棄牌}}"
  because: "{{t:rake|抽水}}會拿走翻牌後{{t:pot|底池}}的一部分，而翻前就結束的{{t:pot|底池}}不會被抽：{{t:call|跟注}}通常會進入翻牌並付{{t:rake|抽水}}，3-bet 常在翻前結束這手牌、不付{{t:rake|抽水}}，{{t:fold|棄牌}}則沒有任何成本（有些平台對沒進翻牌的 3-bet {{t:pot|底池}}也收{{t:rake|抽水}}，所以在那裡 3-bet 也要付）"
  level: gto
  source: "商業求解器網站，Preflop Raise Sizing: Examining 2 Key Factors（https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/），含 NL100 抽水的 200bb 6-max 解法：「Facing a LJ raise, the HJ, CO, and BTN all VPIP 25%-35% fewer hands in the raked game.」，「Rake makes calling raises considerably less appealing, leading to much lower VPIPs and somewhat higher 3-betting frequencies in “no flop, no drop” games.」，「BB calls a min-raise in the raked game barely 60% as often as in the unraked game」；簡化：這是 200bb 的結果，作者表示：「many of the principles will generalize」；各平台的抽水結構：撲克計算器網站，API /network-rake-list，rule 欄位：第二個大型線上平台「flop_drop」，大型線上平台「flop_or_3b_drop」（2026年10月5日讀取）"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/preflop-raise-sizing-examining-2-key-factors/" }, { kind: training }]
- id: R-M10-015
  module: m10
  if: "你在有{{t:rake|抽水}}的牌局中計算所需權益"
  then: "你把補注額除以扣掉{{t:rake|抽水}}後的{{t:call|跟注}}後{{t:pot|底池}}：下注半個{{t:pot|底池}}、{{t:rake|抽水}} {{n:rake.ex.pct}} 時，你需要 {{n:eq.bet-half.rake}}，而不是 {{n:eq.bet-half}}"
  because: "你贏到的是扣掉{{t:rake|抽水}}的{{t:pot|底池}}，補注卻要付全額；在微級別，{{t:pot|底池}}很少達到{{t:rake-cap|抽水上限}}，所以重要的是百分比"
  level: math
  source: "計算：補注額 ÷ （跟注後的底池 ×（1 − 抽水））（numbers.yaml eq.bet-half.rake）；撲克計算器網站，Online Poker Rake Comparison 2026（https://www.primedope.com/online-poker-rake-comparison-rake-calculator/）：「At microstakes, percentage drives the cost because pots rarely hit the cap.」"
  sources: [{ kind: training, url: "https://www.primedope.com/online-poker-rake-comparison-rake-calculator/" }, { kind: math }]

# M12: mental game i bankroll. Poziomy według ADR-24: rachunek = math, zalecenie oparte na rachunku lub literaturze = heuristic.
- id: R-M12-001
  module: m12
  if: "你根據一段手牌樣本評估自己的結果或贏率"
  then: "你計算區間：贏率 ± {{n:var.z95}} × SD ÷ √(手牌數 ÷ 100)"
  because: "SD 為 {{n:var.sd}} 時，即使打了 {{n:var.hands.k}} 千手牌，{{n:var.conf95}} 區間仍約為 ± {{n:var.ci.wr}}，所以結果 {{n:var.wr.ex}} 只代表「約在 {{n:var.wr.ci.low}} 到 {{n:var.wr.ci.high}} 之間」"
  level: math
  source: "計算：平均值的標準誤（常態分布）；SD 來自撲克計算器網站，Examples and Impacts of Variance in Cash Games 和 Poker Variance Calculator"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-002
  module: m12
  if: "你遭遇 {{n:dd.bi.small}} 個{{t:buy-in|買入}}的{{t:downswing|下風期}}"
  then: "你不把它當成打得差的證據，而是檢視輸掉的那些手牌中的決策"
  because: "在 {{n:var.hands.k}} 千手牌中，贏率 {{n:var.wr.ex}}（SD {{n:var.sd}}）的玩家，約有 {{n:dd.p.small.100k}} 會遭遇從高點下滑這麼多的{{t:downswing|下風期}}"
  level: heuristic
  source: "計算：蒙地卡羅模擬（numbers.yaml，鍵 dd.*）；撲克計算器網站，Examples and Impacts of Variance in Cash Games，對此情境給出的數字較低（M12 報告）"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-003
  module: m12
  if: "你想知道自己實際上贏多少"
  then: "你要累積數十萬手牌：在 {{n:var.conf95}} 的信心水準下要達到 ± {{n:var.target}} 的準確度，需要約 {{n:var.need.hands.k}} 千手牌"
  because: "估計誤差會隨手牌數的平方根縮小：所需的 100 手區塊數 =（{{n:var.z95}} × SD ÷ 準確度）²"
  level: math
  source: "計算：(1.96 × 80 ÷ 2)² 個區塊；與文件 08 中的數量級一致（約 61.5 萬手牌）"
  sources: [{ kind: math }]
- id: R-M12-004
  module: m12
  if: "你在一手牌結束後評估自己的打法"
  then: "你問的是決策（價格、權益、你當時掌握的資訊），而不是你有沒有贏"
  because: "好的決策也經常會輸：AA 對 KK 全下約有 {{n:res.kk-wins}} 會輸，而人們即使知道不應該，仍然會以結果評判決策"
  level: heuristic
  source: "Baron 與 Hershey（1988），Outcome bias in decision evaluation，J Pers Soc Psychol 54(4)；Annie Duke 談「resulting」（Masters in Business，Ritholtz 2018）；AA–KK 的權益：精確計算（文件 08）"
  sources: [{ kind: math }, { kind: book }, { kind: study }]
- id: R-M12-005
  module: m12
  if: "幾個{{t:session|場次}}的結果讓你想改變策略"
  then: "你在檢討過手牌之後才改，而不是只根據結果"
  because: "即使是最強的 {{n:skill.pct}} 玩家，也要約 {{n:skill.hands}} 手牌之後，才會在約 {{n:skill.ahead}} 的情況下領先最弱的 {{n:skill.pct}}，而技術差距更小時，需要的手牌多得多"
  level: heuristic
  source: "van Loon、van den Assem 與 van Dolder（2015），Beyond Chance? The Persistence of Performance in Online Poker，PLoS ONE 10(3)"
  sources: [{ kind: study }]
- id: R-M12-006
  module: m12
  if: "你注意到自己上頭側寫中的最初訊號（例如被爆冷後生氣、想懲罰對手）"
  then: "你立刻反應：深呼吸，再加上一句事先準備好的話，提醒自己為什麼這是{{t:variance|變異數}}，或是可以學習的錯誤"
  because: "上頭一旦加劇，你就無法清楚思考，這時就再也控制不住了"
  level: heuristic
  source: "Tendler，新聞網站訪談（2014）（「When tilt becomes too intense, it shuts down your ability to think」，「you must begin correcting tilt when it's small」）；Tendler 與 Carter，The Mental Game of Poker（2011），「injecting logic」技巧"
  sources: [{ kind: book }]
- id: R-M12-007
  module: m12
  if: "一連串輸牌後，你已經無法冷靜評估決策（例如只想著扳回來，或玩平常會{{t:fold|棄牌}}的手牌）"
  then: "你結束這個{{t:session|場次}}"
  because: "在這種狀態下繼續打，就是用你最差的水準（C-game）在打，而目標是在失去清楚思考的能力之前提早結束"
  level: heuristic
  source: "Tendler 與 Carter，The Mental Game of Poker（2011），「Inchworm」段落（線上發表的節錄）：「quit sooner when it's no longer possible to recover a solid thought process」"
  sources: [{ kind: book }]
- id: R-M12-008
  module: m12
  if: "你在提升自己的牌技"
  then: "你先改善最差的打法（C-game），而不是打磨最好的打法"
  because: "改善最差的打法能帶來穩定的進步，也能騰出注意力學習新東西"
  level: heuristic
  source: "Tendler 與 Carter，The Mental Game of Poker（2011），「Inchworm」段落（線上發表的節錄）；Tendler，The Inchworm Concept（jaredtendler.com）"
  sources: [{ kind: book }]
- id: R-M12-009
  module: m12
  if: "你計算{{t:risk-of-ruin|破產風險}}，也就是輸光整個資金（bankroll）的風險"
  then: "你使用公式 RoR = e^(−2 × 贏率 × 資金 ÷ SD²)，資金以 bb 計算；這是假設贏率和 SD 固定的近似值"
  because: "贏率 {{n:var.wr.typical.high}}、SD {{n:var.sd}} 時，{{n:br.bi.base}} 個{{t:buy-in|買入}}的資金約有 {{n:ror.base}} 的風險，而 {{n:br.bi.move-down}} 個{{t:buy-in|買入}}時已經約 {{n:ror.half}}"
  level: math
  source: "撲克計算器網站，Risk of Ruin Formula for Poker Players（「RoR = e^(-2 x WR x BR / SD^2)」）；數值：計算（numbers.yaml，鍵 ror.*）"
  sources: [{ kind: training }, { kind: math }]
- id: R-M12-011
  module: m12
  if: "資金降到預定{{t:buy-in|買入}}數的一半（{{n:br.bi.base}} 時，降到 {{n:br.bi.move-down}}）"
  then: "最晚在那時，你就降一個{{t:stakes|級別}}；最早要等你擁有較高{{t:stakes|級別}}的完整{{t:buy-in|買入}}資金時，才回去"
  because: "在 {{n:var.hands.k}} 千手牌中，幾乎每個贏率在 {{n:dd.wr-low}} 到 {{n:var.wr.ex}} 的贏家，都會遇到 {{n:dd.bi.small}} 個{{t:buy-in|買入}}的{{t:downswing|下風期}}（SD {{n:var.sd}} 的模擬），部分來源建議遇到這樣的損失就降級，而在 {{n:br.bi.move-down}} 個{{t:buy-in|買入}}時，輸光剩餘資金的風險會從約 {{n:ror.base}} 升到約 {{n:ror.half}}（贏率 {{n:var.wr.typical.high}}、SD {{n:var.sd}}）"
  level: heuristic
  source: "訓練網站，Bankroll Management（「half the roll, which is the point to move down a stake」）；訓練網站，Poker Bankroll Management Strategy（3bb/100 時在 30 個買入降級，也就是完整資金時）；撲克計算器網站，Risk of Ruin Formula for Poker Players（「Losing 10 should trigger a move down」）；破產風險計算與下風期模擬"
  sources: [{ kind: training }, { kind: training }, { kind: training }, { kind: math }]
- id: R-M12-012
  module: m12
  if: "你在規劃打牌的時間"
  then: "剛開始時，把約 {{n:study.beginner}} 的時間用來學習；當你在自己的{{t:stakes|級別}}能贏錢時，約 {{n:study.winner}}，但絕不少於 {{n:study.min}}"
  because: "剛開始時你要補的東西最多，而當你在自己的{{t:stakes|級別}}已經能贏，就可以多打一點"
  level: heuristic
  source: "訓練網站，What should your study-to-play ratio be（Dara O'Kearney 的文章）：「New players have so much catching up to do」；「Once you are beating the games you are in you can start to reduce the study and increase the grinding」"
  sources: [{ kind: training }]

# M11: turnieje i short stacki (moduł opcjonalny). Zakresy push/fold z własnego solvera (pushfold.json, heads-up mały
# blind kontra duży blind, zwalidowany z równowagą Nasha, dokument 10); progi i pojęcia z przeczytanych źródeł (raport M11).
- id: R-M11-001
  module: m11
  if: "你在{{t:tournament|錦標賽}}中有約 {{n:m11.thr.pushfold}} 或更少，而你前面所有人都{{t:fold|棄牌}}"
  then: "你只打全下或{{t:fold|棄牌}}（push/fold）；在 {{n:m11.thr.pushfold}} 到 {{n:m11.thr.upper}} 之間，push/fold 是較弱與中等手牌的主要打法；約 {{n:m11.thr.raise}} 以上，通常就一般加注"
  because: "{{t:short-stack|短籌碼}}時，加注後再面對{{t:raise|加注}}{{t:fold|棄牌}}會損失太多{{t:chips|籌碼}}，而全下能從對手身上逼出最多的{{t:fold|棄牌}}；這是簡化：行動選項更多的求解器會用一部分手牌溜入或最小加注"
  level: heuristic
  source: "訓練網站，Short Stack Strategy（https://pokercoaching.com/blog/short-stack-strategy-2/）：「At 10 big blinds or fewer, it is almost entirely push/fold」，「This approach simplifies decision-making and maximizes fold equity」，「At 15 big blinds, the landscape shifts significantly. Push/fold becomes your dominant framework for weak and medium holdings」；訓練網站，Push/Fold Tournament Strategy（https://upswingpoker.com/push-fold-tournament-strategy-charts/）：「around 15 big blinds (bb) or fewer」，「larger than 20bb … Raising First In」；商業求解器網站，Short-Stacked Play in MTTs（https://blog.gtowizard.com/short-stacked-play-in-mtts/）：「The standard advice for a 10bb stack is to play an all-in or fold strategy」；簡化：訓練網站（同一頁面）：「the all-in or fold binary was grossly suboptimal」；發表求解器結果的學校，單挑 10bb（https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments）：「61.1% limp, 28.8% all-in, 10.1% fold」"
  sources: [{ kind: training, url: "https://pokercoaching.com/blog/short-stack-strategy-2/" }, { kind: training, url: "https://upswingpoker.com/push-fold-tournament-strategy-charts/" }, { kind: solver-pub, url: "https://blog.gtowizard.com/short-stacked-play-in-mtts/" }, { kind: solver-pub, url: "https://poker.academy/blog/post/how-to-play-heads-up-poker-in-tournaments" }]
- id: R-M11-002
  module: m11
  if: "你在{{t:small-blind|小盲}}對上{{t:big-blind|大盲}}打 push/fold"
  then: "籌碼越短，你{{t:shove|推全下}}的手牌越多：{{n:m11.depth.15}} 時約 {{n:m11.push.15}} 的手牌，{{n:m11.depth.10}} 時約 {{n:m11.push.10}}，{{n:m11.depth.5}} 時約 {{n:m11.nash.push.5}}–{{n:m11.push.5}}"
  because: "籌碼越短，相對於對手{{t:fold|棄牌}}時你能拿下的盲注，你冒的風險越小，而對手必須{{t:call|跟注}}得更寬"
  level: gto
  source: "本專案的 push/fold 求解器（content/ranges/pushfold.json；單挑，無前注，全下或棄牌賽局的納許均衡，於文件 10 以 10bb 驗證；5bb 的區間來自獨立計算的均衡，docs/tresci/e1b-solver.md，D-153）；比較：訓練網站，Push/Fold Play: Nash Ranges（https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/），10bb：推全下「56.6%」"
  sources: [{ kind: training, url: "https://www.pokerstrategy.com/strategy/sit-and-go/push-fold-play-nash-ranges/" }, { kind: solver-app }]
- id: R-M11-003
  module: m11
  if: "{{t:pot|底池}}中有前注"
  then: "你{{t:shove|推全下}}的手牌比沒有前注時多：{{n:m11.depth.10}}、{{t:bb-ante|大盲前注}} {{n:m11.ante}} 時約 {{n:m11.nash.push.10-ante}}–{{n:m11.push.10-ante}}，而不是 {{n:m11.push.10}}"
  because: "前注讓對手{{t:fold|棄牌}}時你拿下的{{t:pot|底池}}變大，而全下的風險不變"
  level: gto
  source: "本專案的 push/fold 求解器（pushfold.json，10bb-ante 變體：單挑，大盲前注 1bb）；驗證：docs/tresci/e1b-solver.md（D-153），同一模型中的計算（虛擬對局均衡 71.05%，即 then 中區間的下限）；方向與文獻一致：訓練網站，Push Fold Charts（https://pokercoaching.com/push-fold-charts/）：「When antes are in play, your preflop shoving range should be wider」"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: solver-app }]
- id: R-M11-004
  module: m11
  if: "你第一個全下"
  then: "你有兩種贏法：對手{{t:fold|棄牌}}，你拿下{{t:pot|底池}}；或他{{t:call|跟注}}，你在攤牌時獲勝；不過，毫無勝算的手牌需要對手{{t:fold|棄牌}}的機率超過 {{n:m11.push.10.alpha}}（{{n:m11.depth.10}}、無前注時）"
  because: "你冒 {{n:m11.push.10.risk}} 的風險去贏 {{n:m11.push.10.win}} 的盲注；所以棄牌權益和被{{t:call|跟注}}時手牌的權益都很重要"
  level: math
  source: "計算：alpha = 風險 ÷ （底池 + 風險）（M6）；棄牌權益：商業求解器網站的詞彙表（https://gtowizard.com/en/glossary/）：「Fold equity The amount of value a player will win by making another player fold.」"
  sources: [{ kind: training, url: "https://gtowizard.com/en/glossary/" }, { kind: math }]
- id: R-M11-005
  module: m11
  if: "M 值（籌碼 ÷ 一圈的成本：盲注和前注）降到約 {{n:m11.m.red}} 或更低"
  then: "你只打全下或{{t:fold|棄牌}}，並盡量第一個進入{{t:pot|底池}}"
  because: "不打的話，籌碼只夠撐幾圈，而一般加注會損失太多{{t:chips|籌碼}}"
  level: heuristic
  source: "Harrington（經由相關介紹）：Wikipedia，M-ratio（https://en.wikipedia.org/wiki/M-ratio）：「The M-ratio is calculated by the formula」（以分數表示的公式：籌碼 ÷ （小盲 + 大盲 + 全部前注）），區間表中：「Your only move is to move all-in or fold」；訓練網站，Dan Harrington M-Factor（https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/）：「Red zone: 1 < = M < = 5」，「your only and best option in this phase is to be the first to push in the pot」；單一界線約為 5（D-147）"
  sources: [{ kind: reference, url: "https://en.wikipedia.org/wiki/M-ratio" }, { kind: training, url: "https://www.pokerstrategy.com/strategy/mtt/dan-harrington-m-factor/" }]
- id: R-M11-006
  module: m11
  if: "你在{{t:big-blind|大盲}}以籌碼 S（無前注）{{t:call|跟注}}{{t:small-blind|小盲}}的全下"
  then: "你需要的權益是 (S − {{n:pf.blind.bb}}) ÷ 2S：{{n:m11.depth.10}} 時 {{n:m11.call.10.eq}}，{{n:m11.depth.5}} 時 {{n:m11.call.5.eq}}，{{n:m11.depth.15}} 時 {{n:m11.call.15.eq}}"
  because: "你的盲注已經在{{t:pot|底池}}中，所以你補 S − {{n:pf.blind.bb}}，而{{t:call|跟注}}後的{{t:pot|底池}}是 2S"
  level: math
  source: "計算：所需權益 = 補注額 ÷ 跟注後的底池（M2）"
  sources: [{ kind: math }]
- id: R-M11-007
  module: m11
  if: "對手已經全下，你在決定要不要{{t:call|跟注}}"
  then: "你{{t:call|跟注}}的{{t:range|範圍}}比你自己{{t:shove|推全下}}的範圍窄：{{n:m11.depth.10}} 時，{{t:big-blind|BB}}{{t:call|跟注}}約 {{n:m11.call.10}} 的手牌，而{{t:small-blind|SB}}{{t:shove|推全下}}約 {{n:m11.push.10}}"
  because: "跟注者只能在攤牌時贏，而且對上的是已經比隨機手牌更強的{{t:range|範圍}}；{{t:shove|推全下}}的人在對手{{t:fold|棄牌}}時也能贏"
  level: gto
  source: "本專案的 push/fold 求解器（pushfold.json）；訓練網站，Push Fold Charts（https://pokercoaching.com/push-fold-charts/）：「Calling ranges are tighter than shoving ranges」；訓練網站，The Gap Concept（https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/）：「you need a better hand to call a raise with than you would need to open a pot with a raise」（Sklansky）"
  sources: [{ kind: training, url: "https://pokercoaching.com/push-fold-charts/" }, { kind: training, url: "https://www.pokerstrategy.com/news/content/Poker-Basics-The-Gap-Concept_116890/" }, { kind: solver-app }]
- id: R-M11-008
  module: m11
  if: "你想把錦標賽的籌碼換算成金錢（{{t:icm|ICM}}）"
  then: "得到第 1 名的機率 = 你的籌碼 ÷ 全部{{t:chips|籌碼}}；第 2 名的機率用同樣的方式，針對每一個可能的冠軍，在剩下的玩家中計算；權益 = 各名次機率 × {{t:payout|獎金}}的總和"
  because: "這個模型假設玩家技術相同，所以名次只由籌碼決定"
  level: math
  source: "商業求解器網站，ICM Basics（https://blog.gtowizard.com/icm-basics/）：「The Independent Chip Model assumes all players are equally skilled, and therefore the probability of winning is purely a function of stack sizes」，Limitations of ICM 一節：「ICM doesn’t consider players’ positions.」，「ICM ignores blinds increasing.」（2026-11-09 讀取），「divide their chips by the total amount of chips in play」，「Assume one of the other players wins, remove their chips from play, and divide our chips by the remaining chips in play」；以範例籌碼計算（E1 M9–M11 報告）"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: math }]
- id: R-M11-009
  module: m11
  if: "在有{{t:icm|ICM}}的{{t:tournament|錦標賽}}中，你{{t:call|跟注}}一個可能淘汰你的全下"
  then: "你需要的權益是 BF ÷ （BF + 1），其中泡沫因子 BF = 輸時損失的權益 ÷ 贏時增加的權益；在課程的範例中是 {{n:m11.bf.req}}，而以{{t:chips|籌碼}}計算時是 {{n:m11.bf.req-chips}}"
  because: "在有{{t:payout|獎金}}的{{t:tournament|錦標賽}}中，輸掉時損失的錢比贏的時候增加的多，所以{{t:call|跟注}}必須比在以{{t:chips|籌碼}}計價的遊戲中更常贏"
  level: math
  source: "ICM 計算（numbers.yaml，鍵 m11.bf.*）；商業求解器網站，What Is the Bubble Factor（https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/）：「$EV lost when you lose / $EV gained when you win = Bubble Factor」，「Required Equity = Bubble Factor / (Bubble Factor + 1)」"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/what-is-the-bubble-factor-in-poker-tournaments/" }, { kind: math }]
- id: R-M11-010
  module: m11
  if: "現在是{{t:bubble|泡沫期}}或{{t:final-table|決賽桌}}，而你是中等籌碼"
  then: "你{{t:call|跟注}}全下的範圍比在以{{t:chips|籌碼}}計價的遊戲中緊很多，而{{t:cover|覆蓋}}你的大籌碼可以{{t:shove|推全下}}得更寬"
  because: "{{t:risk-premium|風險溢價}}：贏到的{{t:chips|籌碼}}價值低於輸掉的，而大籌碼在這過程中冒的風險比你小"
  level: heuristic
  source: "商業求解器網站，ICM Basics（https://blog.gtowizard.com/icm-basics/）：「chips won are worth less than chips lost」（不含顏色標記的文字），「Big stacks can threaten smaller stacks as they take on less risk when stacking off」；訓練網站，ICM at Final Tables（https://upswingpoker.com/icm-final-tables/）：「When it comes to calling versus shoves, you have to tighten up dramatically when big money is on the line」；訓練網站，Big Stack Advantage（https://upswingpoker.com/big-stack-advantage-stone-bubble/）：「Risk premiums are the additional equity needed to play for stacks. This means responding ranges tighten up considerably」；Ganzfried 與 Sandholm，AAMAS 2008（https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf），表 2：兩次全下後，大盲在錦標賽中跟注「0.021」，在單手牌中則是「0.197」"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/icm-basics/" }, { kind: training, url: "https://upswingpoker.com/icm-final-tables/" }, { kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }]
- id: R-M11-011
  module: m11
  if: "你打 push/fold，而你身後還有更多可能{{t:call|跟注}}的玩家"
  then: "你{{t:shove|推全下}}得更窄：三人、{{n:m11.depth.3max}} 時，按鈕位約 {{n:m11.3max.push.btn}} 的手牌，按鈕位棄牌後的{{t:small-blind|小盲}}約 {{n:m11.3max.push.sb}}"
  because: "每多一位玩家，就多一次有人拿到強牌的機會，所以所有人都{{t:fold|棄牌}}的情況更少見"
  level: gto
  source: "本專案的 push/fold 求解器（content/ranges/pushfold.json，三人）；與 Ganzfried 與 Sandholm，AAMAS 2008（https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf），表 2，single hand 一致：「Button jam … 0.355」、「SB jam after fold … 0.633」（節點頻率相差在 1.2 個百分點以內，M11 報告）"
  sources: [{ kind: study, url: "https://www.cs.cmu.edu/~sandholm/3-player%20jam-fold.AAMAS08.pdf" }, { kind: solver-app }]
- id: R-M11-012
  module: m11
  if: "你{{t:call|跟注}}全下，而你身後還有玩家，或已經有人{{t:call|跟注}}"
  then: "你{{t:call|跟注}}得更窄：三人、{{n:m11.depth.3max}} 時，{{t:small-blind|小盲}}用約 {{n:m11.3max.call.sb}} 的手牌{{t:call|跟注}}按鈕位的全下，{{t:big-blind|大盲}}（{{t:small-blind|SB}}{{t:fold|棄牌}}時）約 {{n:m11.3max.call.bb}}，而已經有兩位玩家全下時只有約 {{n:m11.3max.call.bb-two}}，儘管價格降到 {{n:m11.3max.bb-two.eq}}"
  because: "你身後的玩家可能有強牌並加入，而對上兩個{{t:range|範圍}}時，你手牌的權益會迅速下降；{{t:small-blind|SB}}和{{t:big-blind|BB}}的價格差別不大，所以差異主要來自你身後的玩家"
  level: gto
  source: "本專案的 push/fold 求解器（pushfold.json，三人）；與 Ganzfried 與 Sandholm，AAMAS 2008，表 2，single hand 一致：「SB jam after jam … 0.234」、「BB jam after jam/fold … 0.308」、「BB jam after jam/jam … 0.197」"
  sources: [{ kind: solver-app }, { kind: study }]

- id: R-M11-013
  module: m11
  if: "翻牌前{{t:pot|底池}}裡所有玩家都已全下"
  then: "已經沒有{{t:bet|下注}}了：發完{{t:community-cards}}後由牌型決定，如果沒人有{{t:pair|對子}}或更好的牌，大牌獲勝"
  because: "沒有更多{{t:bet|下注}}，誰也不能再{{t:fold|棄牌}}，只看牌型排名；只有高牌時由最大的牌決定"
  level: rules
  source: "德州撲克規則：加州監管機構核准的牌室規則（https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf），High Card"
  sources: [{ kind: rules, url: "https://www.oag.ca.gov/sites/all/files/agweb/pdfs/gambling/oasis_cardroom.pdf" }]
# M13: analiza własnej gry (dokument 14, sekcja 8; decyzje D-M13-12…15 w dokumencie „12 Weryfikacja źródeł — M10–M13”).
# „Decyzja, nie wynik” uczy R-M12-004 (jedna reguła na jedno pojęcie); mechanika powtórek z gry to opis aplikacji,
# więc jest w tekście lekcji, a nie w księdze reguł.
- id: R-M13-001
  module: m13
  if: "你在{{t:equity|權益}}比對手大的情況下全下輸了"
  then: "你不因為這手牌而改變策略：{{t:equity|權益}}為 e 時，這類牌局平均會輸掉其中的 1 − e，例如 {{n:m13.eq.example}} 時約 {{n:m13.lose.example}}，也就是每 {{n:m13.ten}} 次輸 {{n:m13.lose.of-ten}} 次"
  because: "{{t:equity|權益}}是同一情境重複很多次時獲勝的比例；這次輸也包含在這個計算之內"
  level: math
  source: "計算：P（輸）= 1 − 權益（平分底池時相應較少）"
  sources: [{ kind: math }]
- id: R-M13-002
  module: m13
  if: "求解器在某個情境中用兩種方式打你的手牌（{{t:mixed-hand|混合手牌}}）"
  then: "這兩種打法都正確；當求解器採用較少用的那種打法的頻率至少 {{n:range.mixed.min}}、但低於 {{n:range.mixed.low}} 時，報告會將它標為可接受"
  because: "在均衡中，玩家只會混合{{t:expected-value|期望值}}相同的打法"
  level: gto
  source: "商業求解器網站，Principles of GTO（https://blog.gtowizard.com/principles-of-gto/）：「Unexploitable play mixes between two or more options only when these options have the same EV.」；罕見行動的門檻：商業求解器網站，Measure Performance（https://help.gtowizard.com/measure-performance/）：「Inaccuracy – Moves that are taken less than 3.5% of the time in GTO, but don’t lose significant EV.」（ADR-26）"
  sources: [{ kind: solver-pub, url: "https://blog.gtowizard.com/principles-of-gto/" }]
- id: R-M13-003
  module: m13
  if: "你用同一套對換方式替換所有牌的花色（例如紅心換成黑桃，黑桃換成紅心）"
  then: "正確的決策不會改變"
  because: "手牌和{{t:draw|聽牌}}的強度取決於花色是否相同，而不是是哪些花色；所以對局複習會用不同的花色呈現同一個情境"
  level: math
  source: "計算：牌型排名不區分花色（德州撲克規則），而花色置換會保留哪些牌同花色；在 poker-core 中以性質測試檢查（文件 02，文件 14，5.6）"
  sources: [{ kind: math }]
- id: R-M13-004
  module: m13
  if: "打完一個{{t:session|場次}}後，你想評估自己的頻率（例如你多常入池，或多常面對 3-bet {{t:fold|棄牌}}）"
  then: "你不下結論：要計算的是機會次數，而不是手牌數；從約 {{n:hud.opps.look}} 次機會開始才看這項數據，約 {{n:hud.opps.sure}} 次時才比較有把握"
  because: "連{{t:vpip|VPIP}}都要約 {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}} 手牌才看得出來（如同 M10），而罕見的情境在一個{{t:session|場次}}中只會出現幾次"
  level: heuristic
  source: "有訓練部落格的教練，Poker HUD Stats: The Sample Size You Need（https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html）：「For me personally I usually want at least 5 to even bother looking, and 10 to be sure.」；手牌樣本同 R-M10-003（訓練網站、訓練網站）"
  sources: [{ kind: training, url: "https://www.blackrain79.com/2017/11/poker-hud-stat-sample-size.html" }, { kind: training }, { kind: training }]
- id: R-M13-005
  module: m13
  if: "打牌時你不知道該怎麼做，或某手牌讓你覺得奇怪"
  then: "你只先做標記，等到{{t:session|場次}}結束後，幾小時或幾天後，頭腦清楚時再分析"
  because: "剛輸了一大手牌之後，或疲累時的分析，會被情緒影響"
  level: heuristic
  source: "手牌分析應用程式的部落格，How to Review Your Poker Hands（https://blog.checkreplay.com/poker-hand-review/）：「Mark hands that felt interesting, confusing, or off. Don’t analyze them yet.」；「The best time to review is hours or days after the session, with a clear head.」；「What doesn’t work is reviewing while you’re still steaming or while you’re tired.」"
  sources: [{ kind: training, url: "https://blog.checkreplay.com/poker-hand-review/" }]
- id: R-M13-006
  module: m13
  if: "你輸了一個大{{t:pot|底池}}，或在某手牌中不知道該怎麼做"
  then: "你檢討那手牌；冤家牌（cooler，兩手強牌，任何一方都不可能合理地{{t:fold|棄牌}}）和爆冷（bad beat）則不花太多時間"
  because: "冤家牌和爆冷每個人都會遇到，而有困難決策的牌局，屬於值得檢討的那類"
  level: heuristic
  source: "手牌分析應用程式的部落格，How to Review Your Poker Hands（https://blog.checkreplay.com/poker-hand-review/）：「Big pots, especially the ones you lost.」；「Hands where you weren’t sure what to do.」；有訓練部落格的教練，How to Effectively Conduct Poker Hand Reviews（https://www.blackrain79.com/2014/02/how-to-effectively-conduct-poker.html）：「Coolers and bad beats happen to everybody. Learn how to differentiate them from the hands that matter and don't spend much time on them」"
