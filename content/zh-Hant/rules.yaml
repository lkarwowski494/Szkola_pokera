  level: heuristic
  source: "訓練網站，6 Steps to Analyze a Poker Hand（https://upswingpoker.com/analyze-poker-hand-techniques/）：「Step 4: Take note of your gut reaction」；「be sure to take notes regarding the differences between your initial presumption––which is typically optimistic, in my experience––and the realistic result. This will help you improve your intuitive strategy over time.」"
