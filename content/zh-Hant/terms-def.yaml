royal-flush: "撲克中最大的牌型：同一花色的 A、K、Q、J、10，例如 A♠ K♠ Q♠ J♠ T♠。"
straight-flush: "同一花色的五張連續牌，例如 5♥ 6♥ 7♥ 8♥ 9♥。其中最大的一種（A 到 10）有自己的名稱，是遊戲中最強的牌型。"
four-of-a-kind: "四張點數相同的牌，例如四張 7。若兩手四條點數相同，第五張牌（踢腳）較大者獲勝。"
full-house: "同一手牌中有三條加一對，例如三張 Q 和兩張 5。兩手葫蘆相比時，三條較大者獲勝。"
flush: "五張同花色（♠、♥、♦ 或 ♣）但不連續的牌。兩手同花相比時，最大的牌較大者獲勝；若相同，則比下一張。"
straight: "五張連續的牌，但不全是同一花色，例如 5-6-7-8-9。A 可以當最大的牌（A-K-Q-J-T），也可以當最小的牌（A-2-3-4-5）。"
three-of-a-kind: "三張點數相同的牌加另外兩張牌。在德州撲克中分成兩種，各有名稱：暗三條（對子在手上，第三張在牌面上）和明三條（對子在牌面上，第三張在手上）。"
set: "由手上的一對加牌面上一張牌組成的三條，例如在 K-7-2 的翻牌拿著 7♣ 7♦。"
two-pair: "兩個不同的對子加第五張牌，例如 K-K-8-8-3。平手時先比較大的對子，再比較小的對子，最後比第五張牌。"
pair: "兩張點數相同的牌加另外三張牌，例如兩張 9。只有高牌比它弱。"
high-card: "沒有對子或更好組合的牌；強弱由最大的牌決定，平手時再依序比下一張。"
kicker: "牌型以外最大的一張牌，用來分出平手。例如：一對 A 帶 K，贏一對 A 帶 Q。"
wheel: "最小的順子：A-2-3-4-5，其中 A 當作最小的牌。"
check: "不投入籌碼繼續玩，只有在你不需要補任何籌碼時才能這麼做：這個下注輪還沒有人下注（翻牌前，若沒人加注，大盲可以過牌）。不要和跟注搞混：跟注是補上對手的下注。"
bet: "在還沒有人下注的下注輪中第一個投入籌碼（廣義來說，任何投入底池的籌碼都可以叫下注）。"
call: "投入與對手下注或加注相同的金額到底池，以便繼續玩。不要和過牌搞混：過牌是在沒人下注時不下注繼續玩。"
raise: "把金額提高到對手的下注之上；其他玩家必須補上差額、再加注或棄牌。中文也稱「加碼」。"
fold: "放棄這手牌：你交出手牌，並失去已經投入底池的籌碼。"
check-raise: "你先過牌，等對手下注後，在同一個下注輪中對他加注。"
all-in: "投入你所有的籌碼。這時你從每位對手身上最多只能贏到你自己投入的數量；其餘部分在邊池中另行爭奪。"
pot: "目前這手牌中所有下注的籌碼。由攤牌時牌型最好的玩家拿走（有邊池時每個底池分開決定），或由其他人都棄牌後剩下的玩家拿走。"
side-pot: "有人全下時形成的另一個底池：只有投入比全下玩家更多的玩家能爭奪它，所以全下玩家本人無法贏得它。"
split-pot: "牌型相同的玩家平分底池的情況，例如雙方都用牌面上的同一個順子。"
playing-the-board: "你最好的五張牌型完全由公共牌組成的情況；你的底牌沒有任何幫助，所以最好的結果是平分底池。"
board: "中間翻開的公共牌（翻牌、轉牌、河牌），所有玩家都可以使用。這裡指的是牌，不是你坐的牌桌。"
community-cards: "翻開放在中間、每位玩家都能用來組成牌型的牌；德州撲克中共有五張。"
hole-cards: "德州撲克中每手牌開始時你拿到的兩張蓋著的牌；只有你看得到。"
small-blind: "發牌前由按鈕位左邊玩家投入的較小強制下注（兩人對局時由按鈕位本人投入）；這個座位也叫這個名稱。"
big-blind: "發牌前由按鈕位左邊第二位玩家投入的較大強制下注（兩人對局時由按鈕位對面的玩家投入）；這個座位也叫這個名稱。它也被當作籌碼量和成績的單位。"
chips: "在牌桌上用來玩牌的圓片；現金桌中代表金錢，錦標賽中代表比賽積分。"
stack: "玩家面前所有的籌碼；通常以大盲數表示（例如 100 個大盲）。"
street: "下注輪的行話稱呼：翻牌前、翻牌、轉牌和河牌是四條街。例如：「三條街拿價值」指在翻牌、轉牌和河牌都做價值下注。"
betting-round: "一手牌中玩家輪流過牌、下注、跟注、加注或棄牌的階段；德州撲克有四個：翻牌前、翻牌、轉牌和河牌。"
preflop: "第一個下注輪：發完底牌之後，翻牌出現之前。"
flop: "翻牌前下注結束後一次發出的前三張公共牌；第二個下注輪也叫這個名稱。"
turn: "第四張公共牌，也是第三個下注輪。"
river: "第五張、也是最後一張公共牌，以及攤牌前的最後一個下注輪。"
showdown: "最後一輪下注後，至少還有兩位玩家在局中時亮出手牌；牌型最好的人拿走底池。"
position: "你在牌桌上相對於按鈕位的座位，決定行動順序。越晚行動的人，在做決定前能看到越多對手的動作。"
in-position: "翻牌後最後行動的玩家所處的情況，所以他在決定前能看到對手的動作。"
out-of-position: "翻牌後比對手先行動的玩家所處的情況，所以他必須在不知道對手動作的情況下做決定。"
early-position: "翻牌前最先行動的座位（例如 UTG）；你後面還有很多玩家要行動。"
late-position: "最後行動的座位：按鈕位以及緊鄰它之前的座位，尤其是 CO。"
utg: "翻牌前第一個行動的玩家，坐在大盲的正左邊。"
hijack: "緊鄰 CO 之前的座位，也就是按鈕位右邊第二個座位。"
cutoff: "按鈕位正右邊的座位，緊接在按鈕位之前行動。"
button: "發牌者的座位，用寫著「dealer」的圓片標示。翻牌後，它在每個下注輪都最後行動。"
outs: "還在牌堆中、能改進你手牌的牌，通常是能完成聽牌的牌。例如：同花聽牌時，你的補牌就是剩下的同花色牌。"
draw: "還不是強牌型、但之後的公共牌可能讓它變成強牌型的手牌，例如還差一張就成同花或順子。"
flush-draw: "四張同花色的牌（手牌和牌面合計）；再一張就成同花。"
straight-draw: "還差一張就成順子的四張牌。種類：兩頭順（缺的牌在兩端任一端）和卡順（缺的牌在中間）。"
oesd: "兩頭順，英文 open-ended straight draw（縮寫 OESD）：由四張連續牌組成的順子聽牌，兩端的牌都能完成，例如 5-6-7-8 等 4 或 9。"
gutshot: "中間缺一個特定點數的順子聽牌，例如 5-6-8-9 只等 7。"
backdoor: "翻牌時需要轉牌和河牌連續兩張都中的聽牌，例如翻牌後有三張同花色的牌。"
pot-odds: "你需要投入的金額與你可以贏得的底池（包含對手的下注）之間的比例。它告訴你需要多常贏，跟注才有利可圖。"
implied-odds: "底池賠率加上你成牌後預期在後面幾條街能贏到的籌碼。"
equity: "如果剩下的牌全部發完、不再下注，你贏得底池的機率；通常以百分比表示。"
equity-realization: "下注繼續進行時，一手牌能把多少權益轉成實際贏得的籌碼（可能少於或多於它的權益）；取決於位置以及這手牌好不好打等因素。"
expected-value: "某個打法重複很多次後的平均結果。平均為正的打法長期會賺錢，即使這一次輸了。"
combo: "一種特定、含花色的兩張牌組合，例如 A♠ K♥。計算這些組合可以看出某種手牌在範圍中實際有多少種。"
range: "玩家在某個情況下可能持有的所有手牌，或他會用來採取某個打法的手牌。"
mixed-hand: "均衡策略有時選一種打法、有時選另一種打法的手牌（例如有時加注、有時跟注）；兩種打法都正確。也可以說這手牌是用混合策略來打。"
open: "前面的人都棄牌時，你在翻牌前以加注第一個進入底池。"
suited: "兩張底牌同一花色，例如 A♥ K♥（寫作 AKs）。"
offsuit: "兩張底牌花色不同，例如 A♥ K♣（寫作 AKo）。"
pocket-pair: "由兩張底牌組成的對子，例如翻牌前的 8♣ 8♦。"
connectors: "點數相鄰的底牌，例如 8-7 或 9-8；比較容易組成順子。"
3-bet: "翻牌前對開池的第一次加注；這個名稱把大盲算作第一注，開池算作第二注。"
4-bet: "對 3-bet 的加注，也就是一個下注輪中的第四注。"
limp: "還沒有人加注時，翻牌前只跟注大盲進入底池。"
isolation: "在一個或多個溜入之後加注，目的是和溜入者（通常是較弱的玩家）單挑。"
texture: "公共牌的特性：有幾種花色、牌之間是否接近、是否有對子。它決定了哪些牌型和聽牌是可能的。"
dry: "可能的聽牌和強牌型很少的牌面，例如 K♠ 7♦ 2♣。"
wet: "可能的聽牌和強牌型很多的牌面，例如 J♥ T♥ 8♣。"
rainbow: "三張牌分屬三種不同花色的翻牌，所以翻牌時沒有人有同花聽牌。"
two-tone: "有兩張牌同花色的翻牌，所以可能有同花聽牌。"
monotone: "三張牌都同花色的翻牌，所以可能已經有人成同花。"
paired: "有對子（兩張點數相同的牌）的牌面，例如 8-8-3。"
connected: "可能已經有人組成順子的牌面，例如 9-8-7。"
disconnected: "牌與牌距離很遠、很難組成順子或順子聽牌的牌面，例如 K-7-2。"
semi-connected: "有順子聽牌、但還不可能組成順子的牌面，例如 T-8-3（本課程採用的分類）。"
wetness: "牌面有利於聽牌和強牌型的程度：從乾燥到濕潤。也可以用牌面的協調程度來描述。"
top-pair: "用牌面上最大的牌組成的對子，例如在 K-7-2 的翻牌拿著 K♠ Q♦。"
second-pair: "用牌面上第二大的牌組成的對子，例如在 K-7-2 的翻牌拿著 7♠ 6♠。"
overpair: "比牌面上每一張牌都大的口袋對，例如在 J-7-2 的翻牌拿著 Q-Q。"
c-bet: "持續下注：上一輪身為進攻者的玩家所做的下注，例如翻牌前開池後在翻牌下注。"
aggressor: "在上一個下注輪中最後下注或加注的玩家。"
initiative: "最後進攻者的角色：通常由他做下一次下注。"
range-advantage: "在某個牌面上，一位玩家的範圍整體權益高於對手範圍的情況。"
nuts-advantage: "一位玩家範圍中最強手牌的比例高於對手的情況。"
nuts: "在某個牌面、某個時刻可能的最強手牌。例如：牌面 K♥ 9♥ 4♥ 2♣ 時，堅果牌是帶紅心 A 的同花。"
polarized: "形容範圍：主要由非常強的牌和詐唬組成，幾乎沒有中等牌。"
polarization: "用兩個極端建構範圍：拿價值的強牌和詐唬，沒有中等牌。"
linear: "形容範圍：從最強的牌往下建構，沒有單獨的一組詐唬。你也會看到相關的說法「merged range」（非極化範圍）；根據已發表的求解器分析，merged 是介於這種範圍和極化範圍之間的形態。"
condensed: "形容範圍：沒有最強的牌（上限受限），主要由中等牌組成；與極化相反。"
value: "用強牌下注，讓對手用較弱的牌跟注。"
value-bet: "單次的價值下注：用強牌下注，讓較弱的牌跟注。"
bluff: "用在攤牌時不太可能贏的弱牌下注，讓對手棄掉更好的牌。"
semi-bluff: "用目前仍弱、但有機會改進的牌下注（例如聽牌）：對手棄牌或你中牌，你都能贏。"
blocker: "你手上的一張牌，能降低對手持有某些手牌的機率。例如：你拿著紅心 A，對手就不可能有帶紅心 A 的同花。"
bluff-catcher: "只能贏對手的詐唬、會輸給他價值下注的手牌。"
barrel: "在上一輪自己下注之後，下一個下注輪再次下注。"
second-barrel: "連續第二次下注：在翻牌持續下注後，玩家在轉牌再次下注。"
probe-bet: "翻牌前進攻者在翻牌過牌、沒有持續下注後，無位置玩家在轉牌的下注。"
donk-bet: "在上一輪的進攻者還沒來得及行動前，就先下注的玩家所做的下注。"
overbet: "翻牌後大於整個底池的下注。"
effective-stack: "兩位玩家的牌局中：兩人籌碼量中較小的那一個，也就是實際上最多能贏或輸的數量。多位玩家時，每兩人分別計算。"
spr: "有效籌碼除以某條街開始時的底池（規劃整手牌時以翻牌來計算）；表示籌碼量相對於底池有多深（SPR 越低，所有籌碼越快進入底池）。"
mdf: "面對下注時必須防守的最小範圍比例，讓對手用毫無勝算的牌詐唬時不會自動獲利。"
alpha: "對手要多常棄牌，用毫無勝算的牌詐唬才能打平；取決於下注大小相對於底池的比例。"
variance: "結果圍繞期望值的波動程度：即使打得好，短期內也可能大輸或大贏。"
buy-in: "參加錦標賽或在現金桌入座的金額。"
bankroll: "專門留給打撲克的全部資金；在這個 App 中以買入數計算，而不是金額。"
tilt: "情緒（憤怒、挫折、狂喜）讓你在牌桌上的決定變差的狀態。"
winrate: "玩家在較長樣本中的平均成績；現金桌通常以 bb/100 表示，也就是每一百手牌贏多少大盲。"
downswing: "成績明顯變差的時期，通常虧損比實力應有的更大；與上風期相反。"
session: "一次打撲克，從開始玩到停止。"
stakes: "現金桌的盲注大小或錦標賽的買入金額；「微級別」是最低的級別。"
standard-deviation: "衡量結果波動的指標（變異數的平方根）；撲克中通常以 bb/100 表示。"
risk-of-ruin: "如果你繼續在同一級別打下去，最終輸光全部資金的機率。"
mental-game: "撲克的心理層面：處理上頭、情緒和牌桌上的專注力。"
tournament: "盲注每隔一段時間上升、一直打到一位玩家拿到所有籌碼為止的賽制；名次最高的玩家獲得獎金。"
push-fold: "給短籌碼用的簡化策略：翻牌前只選擇全下或棄牌。"
shove: "全下的打法，通常是翻牌前的加注。"
icm: "把錦標賽籌碼換算成金錢價值的模型，考慮獎金結構和所有玩家的籌碼量。"
bubble: "錦標賽中剛好在獎金圈之前的階段，還要再淘汰幾位玩家才有人進入獎金圈。"
bubble-factor: "ICM 的指標：在錦標賽中，輸掉一定數量的籌碼帶來的傷害，比贏得同樣數量的籌碼帶來的好處大多少。"
cover: "擁有至少和對手一樣多的籌碼。當對手覆蓋你時，全下輸給他就會讓你出局。"
risk-premium: "在錦標賽中冒全下風險時，超出底池賠率要求所需的額外權益，因為輸的代價比贏的收益更大。"
m-ratio: "你的籌碼量除以一手牌中盲注和前注的總和：不玩牌的話，你的籌碼能撐幾整圈。"
red-zone: "M 值非常低的區域：主要只剩全下或棄牌。"
green-zone: "M 值高的區域：籌碼量讓你可以自由地打，保守或積極都可以。"
ante: "發牌前每位玩家投入底池的小額強制下注（主要在錦標賽）。"
bb-ante: "一種前注形式：不是每位玩家都付，而是由大盲位玩家替全桌支付前注。"
fold-equity: "打法價值中，來自對手可能棄牌的那一部分。"
gap-concept: "原則：跟注別人的開池需要比自己開池更強的牌。"
chip-ev: "以籌碼計算的打法期望值，不換算成金錢（不考慮 ICM）。"
tournament-equity: "在既定獎金結構和籌碼量下，你預期能分到的獎金池份額。也稱為「$EV」。"
prize-pool: "錦標賽中要分給獲獎玩家的總金額。"
payout: "錦標賽中某個名次的獎金；全部加起來構成獎金分配。"
pay-jump: "錦標賽中相鄰名次之間的獎金差距；大的獎金跳躍會提高風險溢價。"
final-table: "錦標賽的最後一桌，爭奪最高額的獎金。"
short-stack: "相對於盲注很少的籌碼量；在錦標賽中通常指只剩不多大盲的籌碼量。"
nash-equilibrium: "一組策略，在其中任何玩家只改變自己的策略都無法獲利。"
overcall: "跟注一個前面已經有人跟注的下注。"
heads-up: "一對一對戰：牌桌上或這手牌中只剩兩位玩家。"
dead-money: "底池中來自已經不可能贏得它的玩家的籌碼，例如已棄牌的玩家。"
stack-off: "在一手牌中把全部籌碼投入底池，也就是全下或跟注全下。"
exploit: "刻意偏離基礎策略，以利用某位對手或整個玩家群體的特定錯誤。"
hud: "線上遊戲中疊在牌桌上的介面，顯示對手在先前牌局中的統計數據。"
vpip: "HUD 統計數據：玩家在翻牌前自願把錢投入底池（跟注或加注）的手牌比例。"
pfr: "HUD 統計數據：玩家在翻牌前加注的手牌比例。"
wtsd: "HUD 統計數據：看到翻牌的玩家走到攤牌的頻率。"
nit: "非常緊的玩家，幾乎只用強牌進入底池。"
regular: "某個級別的固定玩家，打很多手牌；本課程中與娛樂玩家相對。"
tag: "緊兇風格：玩的牌少，但打得積極（下注和加注）。"
lag: "鬆兇風格：玩的牌多，打得積極。"
recreational: "為了娛樂而打牌的玩家，通常比常規玩家弱；行話中貶稱為「魚」。"
calling-station: "貶義說法，指非常常跟注的玩家，連弱牌或聽牌也跟。"
maniac: "貶義說法，指非常鬆又兇、拿什麼牌都下注和加注的玩家。"
rake: "賭場或線上撲克室為了經營牌局，從底池中抽取的費用。"
rake-cap: "撲克室從單手牌中最多能抽取的抽水金額。"
