# Nazwane spoty zakresów do lekcji i zadań. Liczby pochodzą wyłącznie z preflop-6max-100bb.json (solver, ADR-20).
# path = ścieżka akcji w drzewie solvera; groups = akcje pokazywane w siatce (reszta to pas).
# Tylko spoty, które przeszły walidację (meta.summary w preflop-6max-100bb.json, dokument 10 na Drive). Gra wobec 3-betu wróci po poprawie modelu.
# CO vs UTG: częstość 3-betu zgodna od wersji 2 solvera, ale skład zakresu (liniowy, bez blefów, z wąskim sprawdzaniem)
# odbiega od publicznych solverów — czeka na decyzję. BB vs UTG i pule z dołączeniem BB czekają na cele walidacyjne.

# Klasy niepewne (audyt 4.10.2026, K6 opcja B; skrócone z 34 do 13 klas po przejściu na solver v3c 5.10.2026,
# dokument 10): w tych rękach kanon odbiega od publicznych tabel otwarć solvera. Nie pojawiają się w zadaniach
# rangeDecision, a w malowaniu zakresu liczą się jak ręce mieszane (zaliczone w obie strony). Jedna lista (kotwica
# &uncertain-rfi), spoty zakresów otwarć (M3) tylko się do niej odwołują.
- id: rfi.utg
  title: "{{t:utg|UTG}}，還沒有人入池"
  hero: UTG
  path: ""
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: &uncertain-rfi [
    # solver v3c (5.10.2026, dokument 10 „Pomiary v3c”): klasy, w których kanon w co najmniej jednej pozycji różni się
    # od opublikowanych tabel solvera o 50 pp lub więcej; ręce w kolorze z luką
    65s, 75s, T8s, 97s, 86s, 53s, 85s,
    # słabe ręce w różnych kolorach
    A8o, A4o, K8o, K7o, Q8o, 98o,
  ]
- id: rfi.hj
  title: "{{t:hijack|HJ}}，你前面的人都{{t:fold|棄牌}}了"
  hero: HJ
  path: "UTG:fold"
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: rfi.co
  title: "{{t:cutoff|CO}}，你前面的人都{{t:fold|棄牌}}了"
  hero: CO
  path: "UTG:fold,HJ:fold"
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: rfi.btn
  title: "按鈕位，你前面的人都{{t:fold|棄牌}}了"
  hero: BTN
  path: "UTG:fold,HJ:fold,CO:fold"
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: rfi.sb
  title: "{{t:small-blind|小盲}}，所有人都{{t:fold|棄牌}}了，與{{t:big-blind|大盲}}對戰"
  hero: SB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:fold"
  groups: { "{{t:raise|加注}}到 3bb": ["raise 3"] }
  uncertain: *uncertain-rfi

- id: vs-open.btn-vs-co
  title: "按鈕位，{{t:cutoff|CO}}以 2.5bb {{t:open|開池}}"
  hero: BTN
  path: "UTG:fold,HJ:fold,CO:raise2.5"
  # jedna grupa „gram” (decyzja A2 koordynatora 5.10.2026, dokument 10): solver v3c prawie nie sprawdza w tym spocie
  # (sprawdzenie 0% wobec 5–9% w źródłach), więc podziału 3-bet / sprawdzenie nie oceniają ani siatka, ani tryb gry (M13);
  # lekcja uczy go regułą R-M4-005 z liczbami z dwóch opublikowanych rozwiązań solvera
  groups: &g-btn-vs-co { "玩這手（3-bet 到 7.5bb 或{{t:call|跟注}}）": ["raise 7.5", "call 2.5"] }
  # klasy niepewne: kanon różni się od opublikowanych tabel solvera (defense/btn-vs-co, NL500, 100bb) w „gram / pas” o 50 pp lub więcej
  # (dokument 10, „Pomiary v3c”); w zadaniach się nie pojawiają, w malowaniu są zaliczane w obie strony
  uncertain: &u-btn-vs-co [A9s, A8s, A7s, A6s, A3s, A2s, K9s, K8s, Q9s, T7s, 98s, 97s, 87s, 75s, 65s, AJo, ATo, "44", "33", "22"]
  # błędny rozmiar przy dobrej akcji = „niedokładność” (B-015, decyzja właściciela 3 października 2026)
  wrongSizes: &w-btn-vs-co
    "玩這手（3-bet 到 7.5bb 或{{t:call|跟注}}）":
      - { text: "3-bet 到 {{n:pf.3bet.oop-total}}", why: "這是{{t:out-of-position|無位置}}時用的尺寸。{{t:in-position|有位置}}時，你{{t:raise|加注}}到約{{t:open|開池}}的 {{n:pf.3bet.size-ip}}，也就是到 {{n:pf.3bet.ip-total}}。" }
- id: vs-open.sb-vs-btn
  title: "{{t:small-blind|小盲}}，按鈕位以 2.5bb {{t:open|開池}}"
  hero: SB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:raise2.5"
  # „3-bet / pas” (decyzja właściciela 4 października 2026, B-045): solvery grają tu 3-bet albo pas, a łączna częstość
  # i skład 3-betu kanonu zgadzają się z opublikowanym rozwiązaniem solvera (Crush 3-Bet Pots OOP, SB vs BTN 14%) poza rękami niżej.
  # Sprawdzenia kanonu (solver v3c: ok. 0,5%) liczą się w siatce jako pas.
  groups: &g-sb-vs-btn { "3-bet 到 10bb": ["raise 10"] }
  # Klasy niepewne tego spotu (przeliczone dla solvera v3c 5.10.2026, dokument 10 „Pomiary v3c”): częstość 3-betu
  # kanonu różni się od opublikowanych tabel solvera (defense/sb-vs-btn, NL500, 100bb) o 50 pp lub więcej. W zadaniach się nie
  # pojawiają, w malowaniu są zaliczane w obie strony.
  uncertain: &u-sb-vs-btn [A8s, A7s, A6s, A4s, A3s, K8s, Q9s, T9s, 98s, 75s, ATo]
- id: vs-open.bb-vs-btn
  title: "{{t:big-blind|大盲}}，按鈕位以 2.5bb {{t:open|開池}}，{{t:small-blind|小盲}}{{t:fold|棄牌}}"
  hero: BB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:raise2.5,SB:fold"
  groups: &g-bb-vs-btn { "防守（{{t:call|跟注}}或 3-bet）": ["call 2.5", "raise 10"] }
- id: vs-open.bb-vs-sb
  title: "{{t:big-blind|大盲}}，{{t:small-blind|小盲}}以 3bb {{t:open|開池}}"
  hero: BB
  path: "UTG:fold,HJ:fold,CO:fold,BTN:fold,SB:raise3"
  # jedna grupa „bronię”: podział 3-bet / sprawdzenie w tym spocie nie przeszedł walidacji (solver v3c: 3-bet 25,7%
  # wobec 15–19% w źródłach, odstępstwo od K1, dokument 10), więc ani siatka, ani ocena w trybie gry (M13) go nie oceniają
  groups: &g-bb-vs-sb { "防守（{{t:call|跟注}}或 3-bet）": ["call 3", "raise 9"] }

# Stół 9-osobowy, 100bb (tryb gry M13; dokument 10, „Pomiar N9a końcowy”): plik preflop-9max-100bb.json. Otwarcia UTG,
# UTG+1 i UTG+2 policzył solver 9-max (walidacja częściowa N1–N4: łączne częstości; składu nie walidowaliśmy, N5), więc
# każdy z tych spotów ma jedną grupę „przebicie” (gram / pas). Klasy niepewne: ręce, których częstość gry zmieniała się
# o 10 pp lub więcej między iteracjami 2820, 3300, 3820 i 3940 (skład jeszcze niestabilny). Po pasach UTG–UTG+2 gra jest
# dokładnie grą 6-max (LJ = UTG w 6-max), więc spoty LJ…BB mają te same grupy i klasy niepewne co spoty 6-max wyżej.
# Odpowiedzi na otwarcia z UTG–UTG+2 nie mają celów walidacji, więc spotów nie mają (boty grają tam heurystykami).
- id: nine.rfi.utg
  title: "9 人桌的{{t:utg|UTG}}，還沒有人入池"
  hero: UTG
  solver: preflop-9max-100bb.json
  path: ""
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: [A4s, KTs, T9s]
- id: nine.rfi.utg1
  title: "9 人桌的{{t:utg|UTG}}+1，{{t:utg|UTG}}{{t:fold|棄牌}}了"
  hero: UTG+1
  solver: preflop-9max-100bb.json
  path: "UTG:fold"
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: ["55", K9s]
- id: nine.rfi.utg2
  title: "9 人桌的{{t:utg|UTG}}+2，你前面的人都{{t:fold|棄牌}}了"
  hero: UTG+2
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold"
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
- id: nine.rfi.lj
  title: "9 人桌的 LJ，你前面的人都{{t:fold|棄牌}}了"
  hero: LJ
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold"
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: nine.rfi.hj
  title: "9 人桌的{{t:hijack|HJ}}，你前面的人都{{t:fold|棄牌}}了"
  hero: HJ
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold"
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: nine.rfi.co
  title: "9 人桌的{{t:cutoff|CO}}，你前面的人都{{t:fold|棄牌}}了"
  hero: CO
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold"
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: nine.rfi.btn
  title: "9 人桌的按鈕位，你前面的人都{{t:fold|棄牌}}了"
  hero: BTN
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold"
  groups: { "{{t:raise|加注}}到 2.5bb": ["raise 2.5"] }
  uncertain: *uncertain-rfi
- id: nine.rfi.sb
  title: "9 人桌的{{t:small-blind|小盲}}，所有人都{{t:fold|棄牌}}了"
  hero: SB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:fold"
  groups: { "{{t:raise|加注}}到 3bb": ["raise 3"] }
  uncertain: *uncertain-rfi
- id: nine.vs-open.btn-vs-co
  title: "9 人桌的按鈕位，{{t:cutoff|CO}}以 2.5bb {{t:open|開池}}"
  hero: BTN
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:raise2.5"
  groups: *g-btn-vs-co
  uncertain: *u-btn-vs-co
  wrongSizes: *w-btn-vs-co
- id: nine.vs-open.sb-vs-btn
  title: "9 人桌的{{t:small-blind|小盲}}，按鈕位以 2.5bb {{t:open|開池}}"
  hero: SB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:raise2.5"
  groups: *g-sb-vs-btn
  uncertain: *u-sb-vs-btn
- id: nine.vs-open.bb-vs-btn
  title: "9 人桌的{{t:big-blind|大盲}}，按鈕位以 2.5bb {{t:open|開池}}，{{t:small-blind|小盲}}{{t:fold|棄牌}}"
  hero: BB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:raise2.5,SB:fold"
  groups: *g-bb-vs-btn
- id: nine.vs-open.bb-vs-sb
  title: "9 人桌的{{t:big-blind|大盲}}，{{t:small-blind|小盲}}以 3bb {{t:open|開池}}"
  hero: BB
  solver: preflop-9max-100bb.json
  path: "UTG:fold,UTG+1:fold,UTG+2:fold,LJ:fold,HJ:fold,CO:fold,BTN:fold,SB:raise3"
  groups: *g-bb-vs-sb

# M11: push/fold heads-up (mały blind kontra duży blind) z pliku pushfold.json, policzonego skryptem
# tools/preflop-solver/scripts/pushfold-ranges.ts na drzewie zwalidowanym z równowagą Nasha (dokument 10: 10bb bez ante).
# Gra tylko all-in albo pas (uproszczenie: pełne solvery przy tych stackach część rąk limpują albo podbijają minimalnie).
- id: push.sb-5
  title: "{{t:small-blind|小盲}}，籌碼量 5bb，所有人都{{t:fold|棄牌}}了。全下還是{{t:fold|棄牌}}？"
  hero: SB
  solver: pushfold.json
  path: "5bb|"
  groups: { "全下": ["all-in"] }
- id: push.sb-10
  title: "{{t:small-blind|小盲}}，籌碼量 10bb，所有人都{{t:fold|棄牌}}了。全下還是{{t:fold|棄牌}}？"
  hero: SB
  solver: pushfold.json
  path: "10bb|"
  groups: { "全下": ["all-in"] }
- id: push.sb-15
  title: "{{t:small-blind|小盲}}，籌碼量 15bb，所有人都{{t:fold|棄牌}}了。全下還是{{t:fold|棄牌}}？"
  hero: SB
  solver: pushfold.json
  path: "15bb|"
  groups: { "全下": ["all-in"] }
- id: push.sb-10-ante
  title: "{{t:small-blind|小盲}}，籌碼量 10bb，{{t:big-blind|大盲}}下了 1bb 前注，所有人都{{t:fold|棄牌}}了。全下還是{{t:fold|棄牌}}？"
  hero: SB
  solver: pushfold.json
  path: "10bb-ante|"
  groups: { "全下": ["all-in"] }
- id: call.bb-5
  title: "{{t:big-blind|大盲}}，籌碼量 5bb。{{t:small-blind|小盲}}全下了。你要{{t:call|跟注}}還是{{t:fold|棄牌}}？"
  hero: BB
  solver: pushfold.json
  path: "5bb|SB:allin"
  groups: { "{{t:call|跟注}}": ["call"] }
- id: call.bb-10
  title: "{{t:big-blind|大盲}}，籌碼量 10bb。{{t:small-blind|小盲}}全下了。你要{{t:call|跟注}}還是{{t:fold|棄牌}}？"
  hero: BB
  solver: pushfold.json
  path: "10bb|SB:allin"
  groups: { "{{t:call|跟注}}": ["call"] }
- id: call.bb-15
  title: "{{t:big-blind|大盲}}，籌碼量 15bb。{{t:small-blind|小盲}}全下了。你要{{t:call|跟注}}還是{{t:fold|棄牌}}？"
  hero: BB
  solver: pushfold.json
  path: "15bb|SB:allin"
  groups: { "{{t:call|跟注}}": ["call"] }
- id: call.bb-10-ante
  title: "{{t:big-blind|大盲}}，籌碼量 10bb，你已下了 1bb 前注。{{t:small-blind|小盲}}全下了。你要{{t:call|跟注}}還是{{t:fold|棄牌}}？"
  hero: BB
  solver: pushfold.json
  path: "10bb-ante|SB:allin"
  groups: { "{{t:call|跟注}}": ["call"] }

# M11, trzech graczy (Button, mały blind, duży blind), stacki po 7,5bb, bez ante, gra o żetony: z pliku pushfold.json
# (drzewo src/pushfold3.ts). Zwalidowane z opublikowaną równowagą: Ganzfried i Sandholm, AAMAS 2008, tabele 11–16
# („single hand”, stacki 4500 przy blindach 300/600); skrypt tools/preflop-solver/scripts/pushfold3-validate.ts.
# Częstości węzłów zgodne z artykułem w granicach 1,2 pp. Klasy niepewne: ręce, w których poprawna odpowiedź w zadaniu
# różni się od artykułu (nie pojawiają się w rangeDecision, w malowaniu liczą się jak ręce mieszane). Inne głębokości
# trzyosobowe nie mają celu walidacji, więc ich nie pokazujemy (ADR-24).
- id: push.btn-3max
  title: "按鈕位，三名玩家，每人籌碼 7.5bb。你要全下還是{{t:fold|棄牌}}？"
  hero: BTN
  solver: pushfold.json
  path: "3max-7.5bb|"
  groups: { "全下": ["all-in"] }
  uncertain: [T9o]
- id: push.sb-3max
  title: "{{t:small-blind|小盲}}，三名玩家，每人籌碼 7.5bb，按鈕位{{t:fold|棄牌}}了。全下還是{{t:fold|棄牌}}？"
  hero: SB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:fold"
  groups: { "全下": ["all-in"] }
  uncertain: [T3s, 63s, Q3o]
- id: call.sb-vs-btn-3max
  title: "{{t:small-blind|小盲}}，三名玩家，每人籌碼 7.5bb。按鈕位全下了，你後面還有{{t:big-blind|大盲}}。你要{{t:call|跟注}}還是{{t:fold|棄牌}}？"
  hero: SB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:allin"
  groups: { "{{t:call|跟注}}": ["call"] }
  uncertain: [A4o]
- id: call.bb-vs-btn-3max
  title: "{{t:big-blind|大盲}}，三名玩家，每人籌碼 7.5bb。按鈕位全下了，{{t:small-blind|小盲}}{{t:fold|棄牌}}了。你要{{t:call|跟注}}還是{{t:fold|棄牌}}？"
  hero: BB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:allin,SB:fold"
  groups: { "{{t:call|跟注}}": ["call"] }
  uncertain: [Q5s]
- id: call.bb-vs-two-3max
  title: "{{t:big-blind|大盲}}，三名玩家，每人籌碼 7.5bb。按鈕位全下了，{{t:small-blind|小盲}}{{t:call|跟注}}了。你要{{t:call|跟注}}還是{{t:fold|棄牌}}？"
  hero: BB
  solver: pushfold.json
  path: "3max-7.5bb|BTN:allin,SB:call"
  groups: { "{{t:call|跟注}}": ["call"] }
  uncertain: [A4s, KTo]
