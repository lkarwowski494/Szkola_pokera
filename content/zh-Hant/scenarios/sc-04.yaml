# SC-04 (M3): UTG otwiera albo pasuje (range-spot rfi.utg), potem c-bet na suchym wysokim flopie (cbet-case R-M5-007). Rola 06, sesja EH,
# 2026-11-11. Struktura jak pl (content/pl/scenarios/sc-04.yaml); jeden poziom (D-1165).
id: sc-04
module: m3
situation: "你在 {{t:utg|UTG}}，還沒有人入池；如果你{{t:open|開池}}，{{t:big-blind|大盲}}會{{t:call|跟注}}，並在翻牌上{{t:check|過牌}}。"
table: 6max
positions: { hero: UTG, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [high], suits: [rainbow], ranks: [disconnected, semi-connected], oesdPossible: false }
    holding: [air]
    expected: ["raise 2.5", bet-small]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.utg
    rule: R-M3-002
    actions:
      - action: "raise 2.5"
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{w:stol}}，還沒有人入池。你{{t:open|開池}}，因為這手牌在 {{t:utg|UTG}} 很窄的{{t:range|範圍}}之內：你後面還有五位玩家，所以更常會有人拿著更好的牌，因此從 {{t:utg|UTG}} 你只{{t:open|開池}}約 {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} 的手牌。"
      - action: fold
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{w:stol}}，還沒有人入池。{{t:fold|棄牌}}太保守：求解器通常即使在 {{t:utg|UTG}} 也會{{t:open|開池}}這手牌。你後面還有五位玩家，所以 {{t:utg|UTG}} 的{{t:range|範圍}}很窄，約 {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} 的手牌，但這手牌在其中。"
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，{{t:big-blind|大盲}}{{t:check|過牌}}。你小額{{t:bet|下注}}，約{{t:pot|底池}}的 {{n:cbet.size.small}}，因為你有{{t:range-advantage|範圍優勢}}，而對手的弱牌幾乎沒有機會：小額{{t:bet|下注}}就足以讓這些牌{{t:fold|棄牌}}。"
      - action: check
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，{{t:big-blind|大盲}}{{t:check|過牌}}。{{t:check|過牌}}可以接受，但比較少見：在{{t:dry|乾燥}}的高牌翻牌上，你常常小額{{t:c-bet|持續下注}}，因為你有{{t:range-advantage|範圍優勢}}，而對手的弱牌面對小額{{t:bet|下注}}就會{{t:fold|棄牌}}。{{t:check|過牌}}等於免費讓它們看下一張牌。"
      - action: bet-big
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，{{t:big-blind|大盲}}{{t:check|過牌}}。這裡大額{{t:bet|下注}}不夠精確：在{{t:dry|乾燥}}的高牌翻牌上，你通常小額{{t:c-bet|持續下注}}，約{{t:pot|底池}}的 {{n:cbet.size.small}}，因為對手的弱牌面對這樣的{{t:bet|下注}}就會{{t:fold|棄牌}}。"
