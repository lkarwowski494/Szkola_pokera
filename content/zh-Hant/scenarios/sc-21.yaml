id: sc-21
module: m7
situation: "轉牌上的中等{{t:pair|對子}}。你從按鈕位{{t:open|開池}}，{{t:big-blind|大盲}}{{t:call|跟注}}。翻牌你{{t:bet|下注}}了小額的{{t:c-bet|持續下注}}，他又{{t:call|跟注}}。轉牌{{t:big-blind|大盲}}{{t:check|過牌}}，而你有{{t:second-pair|第二對}}或更弱的{{t:pair|對子}}。"
table: 6max
