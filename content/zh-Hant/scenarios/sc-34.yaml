# SC-34 (M11): bańka, duży blind wobec all-inu małego blinda przy 10 bb (F4, punkt icm-call). Ocena: rachunek R-M11-009 (equity z kart
# wobec zakresu push.sb-10 i próg ICM z blindem gracza). Poziomy łatwy i średni (D-1036, sesja DU); poziom trudny czeka na 06-tresci-002
# i zostaje w szkicu docs/tresci/szablony-robocze/sc-34.yaml (bramka scenariusze.ts odrzuca icm-call z poziomem trudnym). Rola 06, sesje CO i DU.
id: sc-34
module: m11
situation: "{{t:bubble|泡沫}}期，{{t:small-blind|小盲}}{{t:all-in|全下}}，而你在{{t:big-blind|大盲}}。"
table: 6max
positions: { hero: BB, villain: SB }
stackBb: 10
levels: [latwy, sredni]
bounds:
  latwy: { marginMin: 0.1, expected: [fold] }
  sredni: { marginMin: 0.05, marginMax: 0.15, expected: [call] }
decisions:
  - street: preflop
    kind: icm-call
    spot: push.sb-10
    rule: R-M11-009
    actions:
      - action: fold
        explanation: "你在{{t:bubble|泡沫}}期的 {{w:pozycja}} 拿著 {{w:reka}}，{{w:stol}}，{{t:small-blind|小盲}}已經{{t:all-in|全下}}。你{{t:fold|棄牌}}，因為在有{{t:payout|獎金}}的{{t:tournament|錦標賽}}裡，輸掉損失的錢比贏得增加的錢多，所以{{t:call|跟注}}必須比只算{{t:chips|籌碼}}時贏得更頻繁。這手牌對{{t:all-in|全下}}{{t:range|範圍}}的{{t:equity|權益}}不夠，達不到這個更高的 {{t:icm|ICM}} 門檻。"
      - action: call
        explanation: "你在{{t:bubble|泡沫}}期的 {{w:pozycja}} 拿著 {{w:reka}}，{{w:stol}}，{{t:small-blind|小盲}}已經{{t:all-in|全下}}。你{{t:call|跟注}}，因為這手牌對{{t:all-in|全下}}{{t:range|範圍}}的{{t:equity|權益}}高於 {{t:icm|ICM}} 門檻的要求。這個門檻比只算{{t:chips|籌碼}}時高，因為在有{{t:payout|獎金}}的{{t:tournament|錦標賽}}裡，輸掉損失的錢比贏得增加的錢多。"
