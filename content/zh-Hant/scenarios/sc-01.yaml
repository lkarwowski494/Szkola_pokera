# sc-01: Traditional Chinese text of content/pl/scenarios/sc-01.yaml (role 06, session BS, 2026-11-10); machine translation in session, for review by role 09.
id: sc-01
module: m2
situation: "{{t:3-bet|3-bet}}之後你拿到{{t:flush-draw|同花聽牌}}，對手在翻牌和轉牌都小額{{t:bet|下注}}。"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni, trudny]
bounds:
  latwy: { draws: [flush], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
  sredni: { draws: [flush], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
  trudny: { draws: [flush], marginMin: 0, marginMax: 0.02, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, call] }
decisions:
  - street: flop
    kind: draw-call
    pots: [18, 20, 22, 24]
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手相對於{{t:pot|底池}}小額{{t:bet|下注}}。你{{t:call|跟注}}，因為你只為一張牌付錢，而{{t:flush-draw|同花聽牌}}在這張牌上命中的頻率，高於這麼低的價格所要求的。你有 {{n:outs.flush}} 張補牌，所以轉牌出{{t:flush|同花}}的機率約 {{n:odds.flush.flop-turn}}，大約每五張一張。"
      - action: fold
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手相對於{{t:pot|底池}}小額{{t:bet|下注}}。{{t:fold|棄牌}}等於放棄一個{{t:call|跟注}}能賺錢的{{t:pot|底池}}：面對這麼小的{{t:bet|下注}}，{{t:flush-draw|同花聽牌}}命中的頻率高於價格所要求的。價格高於命中機率時才棄牌，而不是因為你還沒成牌就棄牌。"
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.1, 0.2, 0.25, 0.3]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}：轉牌沒有帶來{{t:flush|同花}}，位於 {{w:rywal}} 的對手又小額{{t:bet|下注}}。你{{t:call|跟注}}，因為到河牌只剩一張牌，而在這麼低的價格下，{{t:flush-draw|同花聽牌}}命中的頻率仍然足夠。河牌出{{t:flush|同花}}的機率約 {{n:odds.flush.turn-river}}，大約每五張一張。"
      - action: fold
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}：轉牌沒有帶來{{t:flush|同花}}，位於 {{w:rywal}} 的對手又小額{{t:bet|下注}}。{{t:fold|棄牌}}太緊了：在轉牌你算的是一張牌的機率，而面對這麼小的{{t:bet|下注}}，這張牌命中的頻率高於價格所要求的，所以你放棄了一個{{t:call|跟注}}能賺錢的{{t:pot|底池}}。"
