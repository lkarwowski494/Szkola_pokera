# sc-23: Traditional Chinese text of content/pl/scenarios/sc-23.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-23
module: m8
situation: "你在按鈕位，河牌{{t:big-blind|大盲}}{{t:check|過牌}}。你考慮用兩手牌之一{{t:bluff|詐唬}}，這兩手牌在{{t:showdown|攤牌}}時都贏不了對手的任何一手牌。假設對手會用 AA、KK、QQ、JJ、任何 AK 以及{{t:suited|同花色}}的 AQ {{t:call|跟注}}，會用 KQ、KJ、QJ、QT 和 JT（全都是{{t:suited|同花色}}）{{t:fold|棄牌}}。你選哪一手牌來{{t:bluff|詐唬}}？"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [best-hand] }
decisions:
  - street: river
    kind: pick-hand
    rule: R-M8-007
    mode: blockers
    calls: [AA, KK, QQ, JJ, AKs, AKo, AQs]
    folds: [KQs, KJs, QJs, QTs, JTs]
    actions:
      - action: best-hand
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}。這是較好的{{t:bluff|詐唬}}：兩手牌在{{t:showdown|攤牌}}時都會輸，但這一手讓對手會{{t:call|跟注}}的{{t:combo|組合}}更少，而會{{t:fold|棄牌}}的組合不會更少。當你拿著一張出現在他強牌裡的牌，對手這些牌的{{t:combo|組合}}就更少，所以他更常只剩下要棄掉的牌。"
      - action: other-hand
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}。這手牌是較差的{{t:bluff|詐唬}}：兩手牌在{{t:showdown|攤牌}}時都會輸，但另一手牌讓對手會{{t:call|跟注}}的手牌更少，而會{{t:fold|棄牌}}的手牌不會更少。{{t:bluff|詐唬}}時，你選擇對他的強牌有{{t:blocker|阻擋牌}}、且擋住的棄牌手牌不比另一手多的牌。"
