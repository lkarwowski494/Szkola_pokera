# sc-18: Traditional Chinese text of content/pl/scenarios/sc-18.yaml (role 06, session HZ, 2026-11-16; agent translation, for review by role 09); structure must match pl.
id: sc-18
module: m7
situation: "高張轉牌上的{{t:second-barrel|第二槍}}。你從按鈕位{{t:open|開池}}，{{t:big-blind|大盲}}{{t:call|跟注}}。翻牌你{{t:bet|下注}}了小額的{{t:c-bet|持續下注}}，他又{{t:call|跟注}}。轉牌發出一張比翻牌所有牌都大的牌，讓你拿到{{t:top-pair|頂對}}，而{{t:big-blind|大盲}}{{t:check|過牌}}。"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [bet-big], turnClass: overcard, flopMiss: true, pairKind: [top], flop: { suits: [rainbow] }, reject: [stol-sparowany] }
decisions:
  - street: turn
    kind: turn-action
    rule: R-M7-001
    actions:
      - action: bet-big
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手在轉牌{{t:check|過牌}}。你大額{{t:bet|下注}}打出{{t:second-barrel|第二槍}}，因為比翻牌大的牌通常對{{t:open|開池}}者{{t:range|範圍}}的幫助比對防守方稍多一些：你許多在翻牌沒中的手牌現在有了{{t:top-pair|頂對}}，而對手的每一個{{t:pair|對子}}都往下降了一位。在這樣的牌上，{{t:open|開池}}者更常{{t:bet|下注}}，而你的{{t:pair|對子}}能贏過那些較差的{{t:pair|對子}}。"
      - action: check
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手在轉牌{{t:check|過牌}}。{{t:check|過牌}}可以接受，但會錯失機會：在比翻牌大的牌上，{{t:open|開池}}者更常{{t:bet|下注}}，因為這張牌通常稍微更符合他的{{t:range|範圍}}。你的{{t:top-pair|頂對}}能贏過對手那些因這張牌而降級的較差{{t:pair|對子}}。"
