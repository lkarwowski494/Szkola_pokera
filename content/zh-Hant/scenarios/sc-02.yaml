# sc-02: Traditional Chinese text of content/pl/scenarios/sc-02.yaml (role 06, session BS, 2026-11-10); machine translation in session, for review by role 09.
id: sc-02
module: m2
situation: "籌碼量較短時，{{t:3-bet|3-bet}}之後你拿到{{t:oesd|兩頭順子聽牌}}；對手在翻牌小額{{t:bet|下注}}，在轉牌大額下注。"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 35
levels: [latwy, sredni]
bounds:
  latwy: { draws: [oesd], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
  sredni: { draws: [oesd], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
decisions:
  - street: flop
    kind: draw-call
    pots: [16, 18, 20, 22]
    fractions: [0.05, 0.1, 0.2, 0.25]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手相對於{{t:pot|底池}}小額{{t:bet|下注}}。你{{t:call|跟注}}，因為你只為一張牌付錢，而{{t:oesd|兩頭順子聽牌}}在這張牌上命中的頻率，高於這麼低的價格所要求的。你有 {{n:outs.oesd}} 張補牌，所以轉牌出{{t:straight|順子}}的機率約 {{n:odds.oesd.flop-turn}}，大約每六張一張。"
      - action: fold
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手相對於{{t:pot|底池}}小額{{t:bet|下注}}。{{t:fold|棄牌}}等於放棄一個{{t:call|跟注}}能賺錢的{{t:pot|底池}}：面對這麼小的{{t:bet|下注}}，{{t:oesd|兩頭順子聽牌}}命中的頻率高於價格所要求的。"
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.5, 0.6667, 0.75, 1]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}：轉牌沒有帶來{{t:straight|順子}}，位於 {{w:rywal}} 的對手大額{{t:bet|下注}}。{{t:call|跟注}}會虧損：你為最後一張牌付錢，而它命中的頻率低於價格所要求的。{{t:implied-odds|隱含賠率}}也補不回來，因為籌碼量較短時，{{t:pot|底池}}之外剩下的{{t:chips|籌碼}}太少：即使命中後你把它們全部贏下，也彌補不了輸掉的那些{{t:call|跟注}}。"
      - action: fold
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}：轉牌沒有帶來{{t:straight|順子}}，位於 {{w:rywal}} 的對手大額{{t:bet|下注}}。你{{t:fold|棄牌}}，因為你為最後一張牌付錢，它命中的頻率低於價格所要求的，而且{{t:pot|底池}}之外剩下的{{t:chips|籌碼}}太少，命中也補不回來。河牌出{{t:straight|順子}}的機率約 {{n:odds.oesd.turn-river}}，大約每六張一張。"
