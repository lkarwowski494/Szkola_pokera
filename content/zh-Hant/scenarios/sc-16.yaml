# sc-16: Traditional Chinese text of content/pl/scenarios/sc-16.yaml (role 06, session HZ, 2026-11-16; agent translation, for review by role 09); structure must match pl.
id: sc-16
module: m6
situation: "面對小額{{t:c-bet|持續下注}}，你有強{{t:draw|聽牌}}。你在{{t:big-blind|大盲}}，{{t:call|跟注}}了按鈕位的{{t:open|開池}}。翻牌你{{t:check|過牌}}，按鈕位{{t:bet|下注}}，是小額的{{t:c-bet|持續下注}}。"
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [raise-big], draws: [flush, oesd], flopBroadwayMax: 2, flop: { suits: [two-tone, rainbow], ranks: [disconnected, semi-connected] }, reject: [stol-sparowany] }
decisions:
  - street: flop
    kind: check-raise
    rule: R-M6-008
    spot: vs-open.bb-vs-btn
    pots: [6, 9]
    cbet: 0.333333
    multipliers: { big: 4.5, small: 1.5 }
    actions:
      - action: raise-big
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手{{t:bet|下注}}，是小額的{{t:c-bet|持續下注}}。你{{t:check-raise|過牌加注}}到他{{t:bet|下注}}的約 {{n:xr.mult.example}}，因為{{t:draw|聽牌}}有兩條贏的路：對手可能立刻{{t:fold|棄牌}}，而他{{t:call|跟注}}時，你仍然可能補成你的{{t:draw|聽牌}}。根據一個訓練網站，{{t:flush-draw|同花聽牌}}和{{t:oesd|兩頭順聽牌}}都是適合{{t:check-raise|過牌加注}}的牌，而面對小額{{t:c-bet|持續下注}}，你{{t:raise|加注}}到約 {{n:xr.mult.example}}，而不是最小加注。"
      - action: call
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手{{t:bet|下注}}，是小額的{{t:c-bet|持續下注}}。{{t:call|跟注}}也很好：面對小額{{t:c-bet|持續下注}}，你只需要約 {{n:eq.bet-third}} 的權益，而這手牌可能變好。根據一個訓練網站，不是每個強{{t:draw|聽牌}}都要{{t:raise|加注}}，但{{t:check-raise|過牌加注}}多了對手立刻{{t:fold|棄牌}}的機會。"
      - action: fold
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手{{t:bet|下注}}，是小額的{{t:c-bet|持續下注}}。{{t:fold|棄牌}}放棄得太多：面對小額{{t:c-bet|持續下注}}，你只需要約 {{n:eq.bet-third}} 的權益，而{{t:draw|聽牌}}還可能變好。面對小額{{t:c-bet|持續下注}}，你會用{{t:draw|聽牌}}繼續：{{t:call|跟注}}或{{t:check-raise|過牌加注}}。"
      - action: raise-small
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{t:board|牌面}}是 {{w:stol}}，位於 {{w:rywal}} 的對手{{t:bet|下注}}，是小額的{{t:c-bet|持續下注}}。{{t:check-raise|過牌加注}}是好主意，但只加到{{t:c-bet|持續下注}}的約 {{n:xr.too-small.mult}} 太小了：這時按鈕位只需要約 {{n:eq.vs-xr.too-small}} 的權益就能{{t:call|跟注}}，會用每一個{{t:draw|聽牌}}便宜地付錢。你{{t:raise|加注}}到{{t:c-bet|持續下注}}的約 {{n:xr.mult.low}}–{{n:xr.mult.example}}，{{t:c-bet|持續下注}}越小，加得越多。"
