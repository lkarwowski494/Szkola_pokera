# sc-10: Traditional Chinese text of content/pl/scenarios/sc-10.yaml (role 06, session HN, 2026-11-16; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-10
module: m4
situation: "你從{{t:cutoff|CO}}{{t:open|開池}}，按鈕位做了{{t:3-bet}}，盲注{{t:fold|棄牌}}。你怎麼做？"
table: 6max
positions: { hero: CO, villain: BTN }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: ["4bet"] }
decisions:
  - street: preflop
    kind: list-hand
    rule: R-M4-010
    entries:
      - { hands: [AA, KK], correct: "4bet" }
      - { hands: [AKs, AKo], correct: "4bet", acceptable: [call] }
    actions:
      - action: "4bet"
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{w:stol}}，按鈕位做了{{t:3-bet}}。你為了{{t:value|價值}}做{{t:4-bet}}，因為這手牌想投入全部籌碼，而且壓制大多數會{{t:call|跟注}}{{t:4-bet}}的手牌。"
      - action: call
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{w:stol}}，按鈕位做了{{t:3-bet}}。拿 AA、KK 和 AK 時，你通常為了{{t:value|價值}}做{{t:4-bet}}，因為這些手牌想投入全部籌碼，而且壓制大多數會{{t:call|跟注}}{{t:4-bet}}的手牌；拿 AK 有時也會{{t:call|跟注}}。"
      - action: fold
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，{{w:stol}}，按鈕位做了{{t:3-bet}}。{{t:fold|棄牌}}會放掉最強的手牌之一：拿 AA、KK 和 AK 時，你通常為了{{t:value|價值}}做{{t:4-bet}}，因為這些手牌想投入全部籌碼，而且壓制大多數會{{t:call|跟注}}{{t:4-bet}}的手牌。"
