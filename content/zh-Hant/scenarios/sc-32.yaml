# SC-32 (M11): push/fold z małego blinda przy 10 bb (F1, range-spot push.sb-10). Rola 06, sesja DU, 2026-11-11. Ocena: rangeVerdict
# na solverze push/fold projektu (pushfold.json, walidacja przy 10 bb, dokument 10), reguła R-M11-002 (gto). Jeden poziom (D-1034).
id: sc-32
module: m11
situation: "{{t:tournament|錦標賽}}：你在{{t:small-blind|小盲}}，有 {{n:m11.depth.10}}，所有人都{{t:fold|棄牌}}到你。"
table: 6max
positions: { hero: SB, villain: BB }
stackBb: 10
levels: [latwy]
bounds:
  latwy: { equityMarginMin: 0.02, freqs: [{ min: 0.97, max: 1 }], expected: [all-in] }
decisions:
  - street: preflop
    kind: range-spot
    spot: push.sb-10
    rule: R-M11-002
    actions:
      - action: all-in
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，有 {{n:m11.depth.10}}，{{w:stol}}，所有人都{{t:fold|棄牌}}了。你{{t:all-in|全下}}，因為籌碼越短，和對手{{t:fold|棄牌}}時贏到的盲注相比，你冒的風險越小；在 {{n:m11.depth.10}} 時你{{t:shove|推全下}}約 {{n:m11.push.10}} 的手牌，而這手牌在其中。"
      - action: fold
        explanation: "你在 {{w:pozycja}} 拿著 {{w:reka}}，有 {{n:m11.depth.10}}，{{w:stol}}，所有人都{{t:fold|棄牌}}了。{{t:fold|棄牌}}太保守：在 {{n:m11.depth.10}} 時你{{t:shove|推全下}}約 {{n:m11.push.10}} 的手牌，而這手牌在其中。籌碼越短，和對手{{t:fold|棄牌}}時贏到的盲注相比，你冒的風險越小。"
