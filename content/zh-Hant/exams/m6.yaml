# Pula pytań egzaminacyjnych modułu M6 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m6.*).
module: m6
drills:
  - kind: numeric
    id: m6.exam.q1
    family: m6.mdf
    rules: [R-M6-001, R-M6-005]
    prompt: "河牌圈。{{t:pot|底池}}有 {{n:exam.m6.pot}}，對手{{t:bet|下注}} {{n:exam.m6.bet.three-quarters}}。{{t:mdf}}是多少，也就是你至少要防守{{t:range|範圍}}中的多少比例？請輸入百分比數字。"
    answer: exam.m6.mdf.three-quarters
    explanation: "{{t:mdf}} = {{t:pot}} ÷ ({{t:pot}} + 下注額) = {{n:exam.m6.pot}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}}) = {{n:exam.m6.mdf.three-quarters}}。如果你更常{{t:fold|棄牌}}，毫無勝算的{{t:bluff}}就會自動獲利。"
  - kind: choice
    id: m6.exam.q2
    family: m6.alpha
    rules: [R-M6-002]
    prompt: "河牌圈。{{t:pot|底池}}有 {{n:exam.m6.pot}}。你用毫無勝算的牌{{t:bluff|詐唬}}，下注 {{n:exam.m6.bet.quarter}}。對手要多常{{t:fold|棄牌}}，這次{{t:bluff}}才能打平？"
    options:
      - { text: "棄牌頻率高於 {{n:exam.m6.alpha.quarter}}", correct: true, why: "對：alpha = 下注額 ÷ ({{t:pot}} + 下注額) = {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}}) = {{n:exam.m6.alpha.quarter}}。小額{{t:bluff}}風險小，所以偶爾的{{t:fold|棄牌}}就夠了。" }
      - { text: "棄牌頻率高於 {{n:exam.m6.mdf.quarter}}", why: "這是{{t:mdf}}：對手應該防守的{{t:range|範圍}}比例。alpha 是剩下的部分：{{n:exam.m6.alpha.quarter}}。" }
      - { text: "棄牌頻率高於 {{n:eq.bet-quarter}}", why: "這是對手{{t:call|跟注}}所需的權益；分母還要加上他的{{t:call}}。{{t:bluff|詐唬}}的門檻是 下注額 ÷ ({{t:pot}} + 下注額) = {{n:exam.m6.alpha.quarter}}。" }
  - kind: choice
    id: m6.exam.q3
    family: m6.mdf-concept
    rules: [R-M6-003]
    prompt: "你在{{t:big-blind}}防守按鈕位的{{t:open|開池}}。按鈕位在翻牌圈{{t:bet|下注}} 1/4 {{t:pot|底池}}的 c-bet。你的朋友在這裡{{t:fold|棄掉}}超過一半的牌，理由是「{{t:mdf}}只是參考點」。哪裡有問題？"
    table: { position: BB }
    options:
      - { text: "翻牌圈可以防守得比{{t:mdf}}稍微少一點，但面對小額 c-bet 不會大量{{t:fold|棄牌}}", correct: true, why: "對：面對 1/4 {{t:pot|底池}}的 c-bet，{{t:mdf}}是 {{n:exam.m6.mdf.quarter}}。在翻牌圈{{t:out-of-position}}時可以防守得稍微少一點，因為按鈕位的{{t:bluff|詐唬}}牌還有權益，但{{t:fold|棄掉}}超過一半的牌等於把{{t:pot|底池}}白白送給他。" }
      - { text: "沒問題：翻牌圈完全不適用{{t:mdf}}", why: "翻牌圈的{{t:mdf}}是參考點：你可以防守得稍微少一點，而不是想少多少就少多少。面對小額 c-bet，你本來就有很多權益足夠的牌。" }
      - { text: "翻牌圈必須防守得比{{t:mdf}}更多", why: "正好相反：在翻牌圈{{t:out-of-position}}時，你可以防守得稍微少一點，因為你無法實現弱牌的全部權益。朋友的錯誤在於{{t:fold|棄牌}}棄得太多了。" }
  - kind: choice
    id: m6.exam.q4
    family: m6.exploit
    rules: [R-M6-004]
    prompt: "微級別。一位很少{{t:bluff|詐唬}}的被動{{t:recreational|娛樂玩家}}在河牌圈{{t:bet|下注}} 3/4 {{t:pot|底池}}。你拿著{{t:pair|一對}} Q，{{t:board|公共牌}}上有 A 和 K。你怎麼做？"
    table: { hand: "Qd Qc", board: "Ah Jd 7c 4s Ks" }
    options:
      - { text: "{{t:fold|棄牌}}", correct: true, why: "對：你的{{t:pair|對子}}比{{t:board|公共牌}}上的 A 和 K 小，所以主要只能贏{{t:bluff|詐唬}}。這位玩家很少{{t:bluff|詐唬}}，所以面對他，你要比{{t:mdf}}建議的更常{{t:fold|棄牌}}。" }
      - { text: "{{t:call|跟注}}，因為{{t:mdf}}要求防守約 {{n:exam.m6.mdf.three-quarters}}", why: "{{t:mdf}}的前提是對手{{t:bluff|詐唬}}得夠頻繁。這位玩家不會，所以{{t:call}}主要是在付錢給比你好的牌。" }
      - { text: "{{t:raise|加注}}", why: "{{t:raise|加注}}後，比你差的牌會{{t:fold|棄牌}}，比你好的牌會付錢。比兩張{{t:board|公共牌}}還小的{{t:pair|對子}}不是該{{t:raise|加注}}的牌。" }
  - kind: choice
    id: m6.exam.q5
    family: m6.flop.price
    rules: [R-M6-005]
    prompt: "翻牌圈。{{t:pot|底池}}有 {{n:exam.m6.pot}}。按鈕位在一手牌中{{t:bet|下注}} {{n:exam.m6.bet.quarter}}，在另一手牌中下注 {{n:exam.m6.bet.three-quarters}}。這兩種情況下，你各需要多少權益才能{{t:call|跟注}}？"
    table: { position: BB }
    options:
      - { text: "約 {{n:eq.bet-quarter}} 和 {{n:eq.bet-three-quarters}}", correct: true, why: "對：下注額 ÷ ({{t:pot}} + 2·下注額)。{{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}} + {{n:exam.m6.bet.quarter}}) = {{n:eq.bet-quarter}}，而 {{n:exam.m6.bet.three-quarters}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}} + {{n:exam.m6.bet.three-quarters}}) = {{n:eq.bet-three-quarters}}。面對較大的下注，你用較窄的{{t:range|範圍}}防守。" }
      - { text: "約 {{n:exam.m6.alpha.quarter}} 和 {{n:eq.bet-three-quarters}}", why: "第一個數字是 alpha（下注額 ÷ ({{t:pot}} + 下注額)），也就是按鈕位{{t:bluff|詐唬}}的門檻。計算{{t:call|跟注}}的價格時，要加上你自己的{{t:call}}：{{n:eq.bet-quarter}}。" }
      - { text: "兩者一樣，因為是同一個{{t:pot}}", why: "不對：價格取決於下注大小。下注越大，價格越差：{{n:eq.bet-three-quarters}} 而不是 {{n:eq.bet-quarter}}。" }
  - kind: choice
    id: m6.exam.q6
    family: m6.flop.call
    rules: [R-M6-006]
    prompt: "你在{{t:big-blind}}防守按鈕位的{{t:open|開池}}。翻牌圈你{{t:check|過牌}}，按鈕位{{t:bet|下注}} 1/3 {{t:pot|底池}}的 c-bet。你的最大牌是 A，沒有{{t:draw|聽牌}}。你怎麼做？"
    table: { hand: "Ac 6h", board: "Js 8d 3d", position: BB }
    options:
      - { text: "{{t:call|跟注}}", correct: true, why: "對：面對小額 c-bet，你只需要約 {{n:eq.bet-third}} 的權益。A 高牌能贏按鈕位的一部分{{t:bluff|詐唬}}，也可能中{{t:pair|對子}}，所以通常要防守。你{{t:fold|棄掉}}的是沒有{{t:pair|對子}}也沒有{{t:draw|聽牌}}的最弱牌。" }
      - { text: "{{t:fold|棄牌}}", why: "太緊了：面對小額 c-bet，A 高牌通常要防守。你{{t:fold|棄掉}}的是沒有{{t:pair|對子}}也沒有{{t:draw|聽牌}}的更弱的牌。" }
      - { text: "過牌加注", why: "過牌加注主要用最強的牌和{{t:draw|聽牌}}來打。這手牌既沒有價值，也沒有能提供第二條獲勝途徑的{{t:draw|聽牌}}。" }
  - kind: choice
    id: m6.exam.q7
    family: m6.flop.fold
    rules: [R-M6-007]
    prompt: "你在{{t:big-blind}}防守按鈕位的{{t:open|開池}}。翻牌 [[8c 4d 2h]] 你{{t:check|過牌}}，按鈕位{{t:bet|下注}} 3/4 {{t:pot|底池}}的 c-bet。以下哪手牌{{t:call}}比較合理？"
    table: { board: "8c 4d 2h", position: BB }
    options:
      - { text: "[[Ad Jd]]", correct: true, why: "對：兩手牌都是沒有{{t:pair|對子}}的兩張高牌，但方塊 AJ 多了一個通往最大{{t:flush|同花}}的{{t:flush-draw}}（後門）：{{t:board|公共牌}}上有一張方塊，還需要再來兩張方塊。面對大額 c-bet，你比較會用這種牌{{t:call|跟注}}。" }
      - { text: "[[Ks Qs]]", why: "黑桃 KQ 在這裡沒有任何{{t:draw|聽牌}}：{{t:board|公共牌}}上沒有黑桃，離{{t:straight|順子}}也太遠。面對大額 c-bet，沒有{{t:draw|聽牌}}的兩張高牌你通常會{{t:fold|棄掉}}。" }
  - kind: choice
    id: m6.exam.q8
    family: m6.xr.semibluff
    rules: [R-M6-008]
    prompt: "你在{{t:big-blind}}防守按鈕位的{{t:open|開池}}。翻牌 [[Jh 8c 4h]] 你{{t:check|過牌}}，按鈕位{{t:bet|下注}} 1/3 {{t:pot|底池}}的 c-bet。以下哪手牌最適合過牌加注？"
    table: { board: "Jh 8c 4h", position: BB }
    options:
      - { text: "[[Qh Th]]", correct: true, why: "對：{{t:flush-draw}}加上卡順聽牌（9）是很強的{{t:draw}}。按鈕位{{t:fold|棄牌}}時，過牌加注直接獲勝；如果他付錢，你仍然有很多 outs。" }
      - { text: "[[Jd 5d]]", why: "踢腳弱的{{t:top-pair|頂對}}是該{{t:call|跟注}}的牌。過牌加注後，比你差的牌通常會{{t:fold|棄牌}}，比你好的牌會付錢。" }
      - { text: "[[As 3c]]", why: "沒有{{t:draw|聽牌}}的 A 高牌沒有第二條獲勝途徑。作為{{t:bluff}}的過牌加注主要用{{t:draw|聽牌}}來打。" }
  - kind: numeric
    id: m6.exam.q9
    family: m6.xr.size
    rules: [R-M6-010]
    prompt: "翻牌圈。{{t:pot|底池}}有 {{n:exam.m6.pot}}，按鈕位{{t:bet|下注}} {{n:exam.m6.bet.quarter}} 的小額 c-bet。你過牌加注到 c-bet 的 {{n:xr.mult.example}}。你要{{t:raise|加注}}到多少？請輸入{{t:chips|籌碼}}數。"
    table: { position: BB }
    answer: exam.m6.xr
    explanation: "{{n:exam.m6.bet.quarter}} × {{n:xr.mult.example}} = {{n:exam.m6.xr}}。面對小額 c-bet，你的{{t:raise|加注}}要接近 {{n:xr.mult.low}}–{{n:xr.mult.example}} 區間的上限：最小過牌加注會給按鈕位非常好的價格。"
  - kind: choice
    id: m6.exam.q10
    family: m6.xr.when
    rules: [R-M6-009]
    prompt: "你在{{t:big-blind}}防守按鈕位的{{t:open|開池}}。你在哪個翻牌最常過牌加注？"
    table: { position: BB }
    options:
      - { text: "[[8d 6c 5h]]", correct: true, why: "對：在低張、{{t:connected|連張}}的翻牌上，{{t:big-blind}}比按鈕位擁有更多最強牌型（{{t:two-pair}}、{{t:straight|順子}}），所以這裡更常過牌加注。" }
      - { text: "[[Ks Qd Jh]]", why: "牌面高且牌張彼此相近的翻牌，很容易擊中按鈕位的{{t:range}}（AK、AQ、KQ、高{{t:pair|對子}}）。這裡你較少過牌加注。" }
      - { text: "[[Ah Ad Qc]]", why: "在有{{t:pair|一對}} A 的翻牌上，用很多 A {{t:open|開池}}的按鈕位更常握有最強的牌。這裡你很少過牌加注。" }
