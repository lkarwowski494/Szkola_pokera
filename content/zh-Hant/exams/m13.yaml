module: m13
drills:
  - kind: numeric
    id: m13.exam.q1
    family: m13.equity-loss
    rules: [R-M13-001]
    prompt: "你以 {{n:exam.m13.eq}} 的{{t:equity|權益}}全下 {{n:exam.m13.n}} 次。平均來說，這些牌局中你會輸掉幾手？請輸入數字。"
    answer: exam.m13.lose.of-n
    explanation: "以 {{n:exam.m13.eq}} 的{{t:equity|權益}}，這類牌你會輸掉 1 − {{n:exam.m13.eq}} = {{n:exam.m13.lose}}：{{n:exam.m13.n}} × {{n:exam.m13.lose}} = {{n:exam.m13.lose.of-n}}。每一次這樣的輸牌都在計算之內，不是改變策略的理由。"
  - kind: choice
    id: m13.exam.q2
    family: m13.equity-loss
    rules: [R-M13-001]
    prompt: "在同一個{{t:session|場次}}中，你兩次在擁有 {{n:exam.m13.eq.big}} {{t:equity|權益}}時全下落敗。這對你的策略代表什麼？"
    options:
      - { text: "什麼都不代表：有這麼多{{t:equity|權益}}，你仍會輸掉約 {{n:exam.m13.lose.big}} 的牌，而這兩手正好在其中", correct: true, why: "{{t:equity|權益}}是同一情境重複多次時的獲勝比例。約 {{n:exam.m13.lose.big}} 情況下的輸牌是其中一部分，即使它們接連出現也一樣。" }
      - { text: "代表在這些局面中要打得更謹慎", why: "以 {{n:exam.m13.eq.big}} {{t:equity|權益}}做出的決策是好的。因為結果而改變策略，等於放棄約 {{n:exam.m13.eq.big}} 情況下都會贏的打法。" }
      - { text: "代表對手更能看穿你的打法", why: "全下時只有{{t:equity|權益}}重要：對手的判讀不會改變接下來發出的牌。每次都有 {{n:exam.m13.lose.big}} 機率輸，兩次落敗就是{{t:variance|變異數}}。" }
  - kind: choice
    id: m13.exam.q3
    family: m13.verdicts
    rules: [R-M13-002]
    prompt: "求解器在 {{n:exam.m13.solver.main}} 的情況下以{{t:raise|加注}}打你這手牌，在 {{n:exam.m13.solver.rare}} 的情況下{{t:fold|棄牌}}。你{{t:fold|棄牌}}了。報告會怎麼評價？"
    options:
      - { text: "可接受", correct: true, why: "求解器在 {{n:exam.m13.solver.rare}} 的情況下{{t:fold|棄牌}}：至少 {{n:range.mixed.min}}，但低於 {{n:range.mixed.low}}。這是{{t:mixed-hand|混合手牌}}中較少採用的打法，所以不是錯誤，而是可接受的決策。" }
      - { text: "吻合", why: "求解器在至少 {{n:range.mixed.low}} 的情況下採用的行動才算吻合。{{n:exam.m13.solver.rare}} 的{{t:fold|棄牌}}頻率較低。" }
      - { text: "錯誤", why: "錯誤是求解器完全不採用的行動。{{n:exam.m13.solver.rare}} 的{{t:fold|棄牌}}是{{t:mixed-hand|混合手牌}}中較少採用的打法，所以兩種打法都正確。" }
  - kind: choice
    id: m13.exam.q4
    family: m13.verdicts
    rules: [R-M13-002]
    prompt: "求解器在 {{n:exam.m13.solver.main2}} 的情況下以你這手牌{{t:fold|棄牌}}，在 {{n:exam.m13.solver.tiny}} 的情況下{{t:call|跟注}}。你{{t:call|跟注}}了。評價是什麼？"
    options:
      - { text: "不精確", correct: true, why: "在 {{n:exam.m13.solver.tiny}} 的情況下{{t:call|跟注}}，低於 {{n:range.mixed.min}}。報告把低於門檻的行動算作不精確，等同錯誤：這是 App 的門檻，不是理論。" }
      - { text: "錯誤", why: "錯誤是求解器完全不採用的行動。這裡求解器在 {{n:exam.m13.solver.tiny}} 的情況下會{{t:call|跟注}}。" }
      - { text: "可接受，因為求解器有時也會{{t:call|跟注}}", why: "至少在 {{n:range.mixed.min}} 的情況下採用的行動才算可接受。{{n:exam.m13.solver.tiny}} 太低了。" }
      - { text: "未評分", why: "當 App 既沒有規則也沒有求解器結果時，決策才會得到「未評分」。這裡有求解器結果。" }
  - kind: choice
    id: m13.exam.q5
    family: m13.suit-swap
    rules: [R-M13-003]
    prompt: "在牌局中，你在 9♣ 8♦ 2♣ 的{{t:board|公共牌}}上拿著 J♣ T♣。以下哪一種牌面是相同的情境，也就是有相同的正確決策？"
    options:
      - { text: "J♦ T♦，{{t:board|公共牌}}為 9♦ 8♣ 2♦", correct: true, why: "梅花換成方塊、方塊換成梅花，而且所有地方同時更換。你仍然有{{t:flush-draw|同花聽牌}}和{{t:oesd|兩頭順子聽牌}}，所以決策不變。" }
      - { text: "J♣ T♣，{{t:board|公共牌}}為 9♦ 8♣ 2♦", why: "只在{{t:board|公共牌}}上換了花色：你的梅花不再與{{t:board|公共牌}}相配，{{t:flush-draw|同花聽牌}}也消失了。這是不同的情境。" }
      - { text: "J♥ T♥，{{t:board|公共牌}}為 9♣ 8♦ 2♣", why: "只在你的手牌換了花色：紅心與{{t:board|公共牌}}上的梅花不相配，所以已經沒有{{t:flush-draw|同花聽牌}}。" }
  - kind: choice
    id: m13.exam.q6
    family: m13.sample
    rules: [R-M13-004]
    prompt: "一週內，你有 {{n:exam.m13.opps}} 次機會在{{t:big-blind|大盲}}面對按鈕位的{{t:open|開池}}時防守。關於你的防守頻率，你能說什麼？"
    options:
      - { text: "我已經可以看看它，但還不能確定", correct: true, why: "你計算的是機會，而不是手數。統計數據約從 {{n:hud.opps.look}} 次機會開始值得看，約到 {{n:hud.opps.sure}} 次才有把握。{{n:exam.m13.opps}} 次是初步訊號，不是結論。" }
      - { text: "我已經知道自己多常防守", why: "{{n:exam.m13.opps}} 次機會仍少於約 {{n:hud.opps.sure}} 次，也就是你開始有把握的次數。" }
      - { text: "什麼都不能說，因為統計需要數千手牌", why: "重要的是這個特定決策的機會次數。約從 {{n:hud.opps.look}} 次機會起，你就可以看看這項統計。" }
  - kind: choice
    id: m13.exam.q7
    family: m13.review-when
    rules: [R-M13-005]
    prompt: "你剛結束一個很長的{{t:session|場次}}，覺得很累，還標記了幾手牌。你什麼時候分析它們？"
    options:
      - { text: "幾小時後或明天，頭腦清醒的時候", correct: true, why: "在疲累時或剛大輸之後分析，會受到情緒影響。標記的牌不會跑掉。" }
      - { text: "馬上，趁我還記得所有細節", why: "複盤只需要一份簡短的牌局紀錄。疲勞會影響判斷，所以最好晚點、頭腦清醒時再看。" }
      - { text: "在下一個{{t:session|場次}}的手與手之間", why: "打牌時你只需要標記牌局。在牌桌上分析會分散你對接下來決策的注意力。" }
  - kind: choice
    id: m13.exam.q8
    family: m13.review-which
    rules: [R-M13-006]
    prompt: "上一個{{t:session|場次}}的以下哪手牌最值得複盤？"
    options:
      - { text: "一個大{{t:pot|底池}}，你在河牌猶豫了很久才{{t:call|跟注}}", correct: true, why: "有困難決策的牌屬於值得複盤的牌，而大{{t:pot|底池}}影響最大。猶豫說明你不知道該怎麼做。" }
      - { text: "翻牌前用一{{t:pair|對}} A 對上一{{t:pair|對}} K 全下，在河牌輸掉", why: "這是 bad beat：決策很明顯，輸牌是{{t:variance|變異數}}。這類牌不需要花太多時間。" }
      - { text: "持續下注後沒攤牌就贏下的小{{t:pot|底池}}", why: "沒有困難決策的小{{t:pot|底池}}能學到的不多。複盤時間最好用在大{{t:pot|底池}}和讓你猶豫的決策上。" }
  - kind: choice
    id: m13.exam.q9
    family: m13.review-how
    rules: [R-M13-008]
    prompt: "你正在複盤一次河牌{{t:call|跟注}}。如果對對手的{{t:range|範圍}}做樂觀假設（很多{{t:bluff|詐唬}}），這個{{t:call|跟注}}會賺錢；做悲觀假設則會虧損。接下來呢？"
    options:
      - { text: "我估計一個實際的{{t:range|範圍}}：評價取決於它", correct: true, why: "極端假設劃出了真實情況所在的區間。當決策在一種假設下好、在另一種下差時，由實際的假設決定。" }
      - { text: "我判定這個{{t:call|跟注}}是好的，因為在樂觀假設下是好的", why: "樂觀假設只是區間的一端。既然在悲觀假設下{{t:call|跟注}}會虧損，評價就取決於對手實際怎麼打。" }
      - { text: "我判定這個{{t:call|跟注}}是錯誤，因為在悲觀假設下會虧損", why: "在悲觀假設下仍然好的決策，能承受判讀錯誤；但在悲觀假設下差的決策，不一定是錯誤。由實際的假設決定。" }
  - kind: choice
    id: m13.exam.q10
    family: m13.review-how
    rules: [R-M13-007]
    prompt: "一位朋友複盤時會直接計算權益和價格，不先記下自己的第一反應。他錯失了什麼？"
    options:
      - { text: "他看不出直覺在哪些決策上誤導了他", correct: true, why: "第一反應與計算結果之間的差距，能顯示直覺在哪裡出錯，並隨時間改善直覺。沒有記下反應，就看不到這個差距。" }
      - { text: "什麼都沒錯失：只有計算結果重要", why: "計算只評價單一決策。把第一反應和計算結果比較，才能看出直覺在哪裡誤導你，並隨時間改善直覺。" }
      - { text: "計算的準確度，因為第一反應能讓計算更準", why: "第一反應不會改變計算結果。它的價值在於與計算結果比較，從中看出直覺在哪裡誤導你。" }
