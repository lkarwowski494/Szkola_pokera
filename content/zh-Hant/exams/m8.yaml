# Pula pytań egzaminacyjnych modułu M8 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m8.*).
module: m8
drills:
  - kind: choice
    id: m8.exam.q1
    family: m8.value.threshold
    rules: [R-M8-001]
    prompt: "河牌，對手{{t:check|過牌}}，而且無法{{t:raise|加注}}你。他的{{t:range|範圍}}中有{{n:exam.m8.range.worse}}手比你差的牌，但其中只有{{n:exam.m8.call.worse}}手會{{t:call|跟注}}你的下注。他也會有{{n:exam.m8.call.better}}次用比你好的牌付錢。你要下注嗎？"
    options:
      - { text: "不，{{t:check|過牌}}", correct: true, why: "對：只計算會付錢的牌。下注會贏{{n:exam.m8.call.worse}}次、輸{{n:exam.m8.call.better}}次，也就是淨虧{{n:exam.m8.net.loss}}個下注。會{{t:fold|棄牌}}的較差牌，在你{{t:check|過牌}}後本來就會輸給你。" }
      - { text: "要，因為較差的牌比較好的牌多", why: "對手有{{n:exam.m8.range.worse}}手較差的牌，但其中多數面對下注會{{t:fold|棄牌}}。在會付錢的牌中，較好的牌比較多（{{n:exam.m8.call.better}}對{{n:exam.m8.call.worse}}）。" }
      - { text: "要，為了弄清楚我的處境", why: "「為了資訊」而下注，是付錢給較好的牌，而較差的牌會{{t:fold|棄牌}}。{{t:check|過牌}}後到攤牌時，你就能免費得到同樣的資訊。" }
  - kind: choice
    id: m8.exam.q2
    family: m8.value.size
    rules: [R-M8-003]
    prompt: "你在按鈕位{{t:open|開池}}，{{t:big-blind}}{{t:call|跟注}}。翻牌持續下注與{{t:call}}，轉牌你們都{{t:check|過牌}}。河牌，{{t:big-blind}}{{t:check|過牌}}。你拿著帶9的{{t:top-pair|頂對}}，估計自己贏過會付錢的牌中略多於一半。你怎麼做？"
    table: { hand: "Jh 9h", board: "Jc 7s 4d 2h 2c", position: BTN }
    options:
      - { text: "下注約1/3{{t:pot|底池}}", correct: true, why: "對：這是薄價值。小額下注連7、4和較弱的J也會{{t:call|跟注}}，所以在{{t:call|跟注}}的牌中，較差的牌多於較好的牌。" }
      - { text: "下注整個{{t:pot|底池}}", sizeError: true, why: "動作對，尺寸錯：面對{{t:pot|底池}}大小的下注，7和4會{{t:fold|棄牌}}，付錢的主要是較好的J和更強的牌。薄價值要下得小一點，通常約1/4–1/2{{t:pot|底池}}。" }
      - { text: "{{t:check|過牌}}，因為這手牌太弱，不適合下注", why: "你會損失價值：會為小額下注付錢的牌中，你贏過超過一半。只要選擇較小的尺寸就好。" }
  - kind: numeric
    id: m8.exam.q3
    family: m8.bluff.share
    rules: [R-M8-004, R-M8-005]
    prompt: "河牌。{{t:pot|底池}}中有{{n:exam.m8.pot}}，你用由非常強的牌和{{t:bluff|詐唬}}組成的{{t:range|範圍}}下注{{n:exam.m8.bet}}。在均衡下，你的下注中{{t:bluff|詐唬}}佔多少比例？請以百分比輸入數字。"
    answer: exam.m8.share
    explanation: "{{t:bluff|詐唬}}比例 = 下注 ÷ ({{t:pot}} + 2·下注) = {{n:exam.m8.bet}} ÷ ({{n:exam.m8.pot}} + {{n:exam.m8.bet}} + {{n:exam.m8.bet}}) = {{n:exam.m8.share}}。對手用來抓{{t:bluff|詐唬}}的牌也需要同樣多的權益，所以無論{{t:call|跟注}}還是{{t:fold|棄牌}}都無法獲利。"
  - kind: choice
    id: m8.exam.q4
    family: m8.bluff.combos
    rules: [R-M8-004]
    prompt: "河牌。{{t:pot|底池}}中有{{n:exam.m8.pot}}，你用{{n:exam.m8.range}}個{{t:combo|組合}}的{{t:range|範圍}}下注{{n:exam.m8.bet}}：包含價值牌和{{t:bluff|詐唬}}。均衡下{{t:bluff|詐唬}}的比例是{{n:exam.m8.share}}。有多少個{{t:combo|組合}}是{{t:bluff|詐唬}}？"
    options:
      - { text: "{{n:exam.m8.bluffs}}", correct: true, why: "對：{{n:exam.m8.range}} × {{n:exam.m8.share}} = {{n:exam.m8.bluffs}}個{{t:bluff|詐唬}}，以及{{n:exam.m8.value-combos}}個{{t:value|價值}}{{t:combo|組合}}。" }
      - { text: "{{n:exam.m8.bluffs.wrong-pot}}", why: "這是下注整個{{t:pot|底池}}時的數量（比例{{n:bluff.share.bet-pot}}）。下注較小時，{{t:bluff|詐唬}}較少：{{n:exam.m8.share}}。" }
      - { text: "{{n:exam.m8.value-combos}}", why: "這是{{t:value|價值}}{{t:combo|組合}}的數量。{{t:bluff|詐唬}}是較少的部分：{{n:exam.m8.range}} × {{n:exam.m8.share}} = {{n:exam.m8.bluffs}}。" }
  - kind: choice
    id: m8.exam.q5
    family: m8.bluff.hands
    rules: [R-M8-006]
    prompt: "你在按鈕位{{t:open|開池}}，{{t:big-blind}}{{t:call|跟注}}，並在河牌{{t:check|過牌}}。以下哪手牌最適合{{t:bluff|詐唬}}？"
    table: { board: "Qs Tc 6d 3h 2s", position: BTN }
    options:
      - { text: "[[Kc Jc]]", correct: true, why: "對：{{t:oesd|兩頭順聽牌}}沒中，只靠K當最大牌幾乎不可能在攤牌時獲勝。毫無勝算的牌在{{t:bluff}}失敗時不會損失什麼。" }
      - { text: "[[Ts 9s]]", why: "{{t:second-pair|第二對}}在{{t:check|過牌}}後能贏過沒中的{{t:draw|聽牌}}和較弱的牌。用它{{t:bluff|詐唬}}，你就放棄了這份勝利。" }
      - { text: "[[Qd 8d]]", why: "{{t:top-pair|頂對}}有攤牌價值。你不會用經常在{{t:check|過牌}}後獲勝的牌{{t:bluff|詐唬}}。" }
  - kind: choice
    id: m8.exam.q6
    family: m8.blockers.bluff
    rules: [R-M8-007]
    prompt: "河牌。{{t:big-blind|大盲}}{{t:check|過牌}}。在這個{{t:board|牌面}}上，KT和T8組成{{t:straight}}。下面兩手牌都沒有{{t:pair|對子}}，也沒有攤牌勝算。哪一手更適合{{t:bluff|詐唬}}？"
    table: { board: "Qd Jc 4s 2h 9d", position: BTN }
    options:
      - { text: "[[Ts 7s]]", correct: true, why: "對：10擋住了兩種{{t:straight|順子}}（KT和T8），也就是對手一定會付錢的牌。他這類牌的{{t:combo|組合}}變少，所以更常拿著必須棄掉的牌。" }
      - { text: "[[6s 5s]]", why: "這手牌沒有擋住對手任何強牌。在毫無勝算的{{t:bluff|詐唬}}之間選擇時，你會偏好擋住他價值牌的那一手。" }
  - kind: numeric
    id: m8.exam.q7
    family: m8.blockers.combos
    rules: [R-M8-009]
    prompt: "在沒有任何資訊時，KQ有{{n:combos.unpaired}}個{{t:combo|組合}}。你拿著[[Ad Qc]]。對手可能有多少個KQ{{t:combo|組合}}？請輸入數字。"
    table: { hand: "Ad Qc" }
    answer: combos.unpaired.one-blocked
    explanation: "你拿著一張Q，所以對手剩下{{n:pair.outs.per-rank}}張Q和全部{{n:cards.suits}}張K：{{n:pair.outs.per-rank}} × {{n:cards.suits}} = {{n:combos.unpaired.one-blocked}}。A不影響KQ的數量。"
  - kind: choice
    id: m8.exam.q8
    family: m8.catch.math
    rules: [R-M8-010]
    prompt: "河牌。{{t:pot|底池}}中有{{n:exam.m8.pot}}，對手{{t:bet|下注}}{{n:exam.m8.bet}}。你拿著抓詐唬牌，估計他的下注中約{{n:exam.m8.bluffs.est}}是{{t:bluff|詐唬}}。你怎麼做？"
    options:
      - { text: "{{t:fold|棄牌}}", correct: true, why: "對：你需要{{n:exam.m8.bet}} ÷ ({{n:exam.m8.pot}} + {{n:exam.m8.bet}} + {{n:exam.m8.bet}}) = {{n:exam.m8.share}}的權益，而抓詐唬牌只贏得了{{t:bluff|詐唬}}，也就是約{{n:exam.m8.bluffs.est}}的情況。{{t:call|跟注}}會虧損。" }
      - { text: "{{t:call|跟注}}", why: "你的權益就是他下注中{{t:bluff|詐唬}}的比例：{{n:exam.m8.bluffs.est}}。這低於所需的{{n:exam.m8.share}}，所以{{t:call}}會虧損。" }
      - { text: "{{t:raise|加注}}", why: "{{t:raise|加注}}後，{{t:bluff|詐唬}}會{{t:fold|棄牌}}，只有較好的牌會付錢。你不會用抓詐唬牌{{t:raise|加注}}。" }
  - kind: choice
    id: m8.exam.q9
    family: m8.catch.blockers
    rules: [R-M8-011]
    prompt: "你在{{t:big-blind}}防守。紅心沒中，而河牌讓T7和75成了{{t:straight}}。你{{t:check|過牌}}，按鈕位{{t:bet|下注}}整個{{t:pot|底池}}。你有踢腳很弱的{{t:top-pair|頂對}}。拿以下哪手牌{{t:call}}比較好？"
    table: { board: "Kh 9h 6c 2s 8d", position: BB }
    options:
      - { text: "[[Kc 7c]]", correct: true, why: "對：7擋住了兩種新的{{t:straight|順子}}（T7和75），也就是按鈕位的部分價值牌；而沒有紅心，你就不會擋住沒中的{{t:flush-draw|同花聽牌}}，也就是他的主要{{t:bluff|詐唬}}。他的下注中會剩下更多{{t:bluff|詐唬}}。" }
      - { text: "[[Ks 3h]]", why: "[[3h]]擋住了部分沒中的{{t:flush-draw|同花聽牌}}，也就是按鈕位的{{t:bluff|詐唬}}，而這手牌沒有擋住任何{{t:straight|順子}}。他的下注中會剩下更多價值牌。" }
  - kind: choice
    id: m8.exam.q10
    family: m8.value.check
    rules: [R-M8-002]
    prompt: "你在按鈕位{{t:open|開池}}，{{t:big-blind}}{{t:call|跟注}}。翻牌持續下注與{{t:call}}，轉牌你們都{{t:check|過牌}}。河牌，{{t:big-blind}}{{t:check|過牌}}。你拿著{{t:pair|一對}}6。你怎麼做？"
    table: { hand: "6d 6s", board: "Jc 8h 4d 3s Kc", position: BTN }
    options:
      - { text: "{{t:check|過牌}}", correct: true, why: "對：{{t:pair|一對}}6贏過沒中的{{t:draw|聽牌}}和高牌，但這些牌面對下注會{{t:fold|棄牌}}。付錢的主要是J、8和K。{{t:check|過牌}}的話，你就能免費進入攤牌。" }
      - { text: "小額{{t:value|價值}}下注", why: "小額下注也主要會被較好的{{t:pair|對子}}{{t:call|跟注}}。這裡對手較差的牌主要是沒有{{t:pair|對子}}的牌和最弱的{{t:pair|對子}}，而它們很少付錢。" }
      - { text: "大額下注，讓對手{{t:fold|棄掉}}較好的{{t:pair|對子}}", why: "下注會把有攤牌價值的牌變成{{t:bluff}}。你要用毫無勝算的牌{{t:bluff|詐唬}}，而這手牌經常在{{t:check|過牌}}後獲勝。" }
