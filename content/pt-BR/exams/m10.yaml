module: m10
drills:
  - kind: choice
    id: m10.exam.q1
    family: m10.hud.stats
    rules: [R-M10-001]
    prompt: "Todos {{t:fold|desistiram}} até o adversário no {{t:small-blind|small blind}}. O adversário completa o {{t:big-blind|big blind}} e, quando o {{t:big-blind}} {{t:raise|aumenta}}, ele {{t:fold|desiste}}. Como esta mão muda as estatísticas dele?"
    options:
      - { text: "Eleva o {{t:vpip}}, mas não o {{t:pfr}}", correct: true, why: "Completar o {{t:big-blind|big blind}} é colocar {{t:chips|fichas}} voluntariamente além do blind obrigatório, por isso conta para o {{t:vpip}}. O adversário não {{t:raise|aumentou}}, então o {{t:pfr}} não sobe." }
      - { text: "Não muda nenhuma, porque o {{t:small-blind|small blind}} é uma contribuição obrigatória", why: "Obrigatório é só o próprio blind. Completar até o {{t:big-blind|big blind}} inteiro já é uma decisão do adversário, ou seja, uma contribuição voluntária, que eleva o {{t:vpip}}." }
      - { text: "Eleva o {{t:vpip}} e o {{t:pfr}}", why: "O {{t:pfr}} só sobe quando o próprio adversário {{t:raise|aumenta}} antes do flop. Aqui quem {{t:raise|aumentou}} foi o {{t:big-blind}}, e o adversário apenas completou e {{t:fold|desistiu}}." }
      - { text: "Não eleva o {{t:vpip}}, porque o adversário {{t:fold|desistiu}} antes do flop de qualquer forma", why: "O {{t:vpip}} conta contribuições voluntárias, e não se a mão chegou ao flop. O adversário completou por vontade própria, então a mão conta para o {{t:vpip}}." }
  - kind: numeric
    id: m10.exam.q2
    family: m10.hud.sample
    rules: [R-M10-002]
    prompt: "O adversário enfrentou um c-bet {{n:exam.m10.se.n}} vezes e {{t:fold|desistiu}} em {{n:exam.m10.se.p}} delas. Qual é o erro padrão do fold to c-bet dele em pontos percentuais? Digite um número."
    answer: exam.m10.se
    explanation: "√(p × (1 − p) ÷ n) = √({{n:exam.m10.se.p}} × {{n:exam.m10.se.q}} ÷ {{n:exam.m10.se.n}}) ≈ {{n:exam.m10.se}}. Você conta oportunidades (os c-bets que ele enfrentou), e não mãos. Com cerca de {{n:var.conf95}} de confiança, o fold to c-bet real fica dentro de ± {{n:var.z95}} × {{n:exam.m10.se}} ≈ ± {{n:exam.m10.ci}}, ou seja, entre cerca de {{n:exam.m10.ci.low}} e {{n:exam.m10.ci.high}}."
  - kind: choice
    id: m10.exam.q3
    family: m10.hud.sample
    rules: [R-M10-003]
    prompt: "Depois de {{n:exam.m10.mid.hands}} mãos, o adversário tem {{t:vpip}} {{n:exam.m10.mid.vpip}}, {{t:pfr}} {{n:exam.m10.mid.pfr}} e fold to 3-bet {{n:exam.m10.mid.f3b}}. Em quais desses números você já pode basear decisões?"
    options:
      - { text: "No {{t:vpip}} e no {{t:pfr}}; o fold to 3-bet ainda é acaso", correct: true, why: "Você lê o {{t:vpip}} e o {{t:pfr}} depois de cerca de {{n:hud.hands.vpip.low}}–{{n:hud.hands.vpip.high}} mãos, e o fold to 3-bet só depois de cerca de {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}}, porque a oportunidade para ele só surge após uma {{t:open|abertura}} e um 3-bet. Em {{n:exam.m10.mid.hands}} mãos, são apenas algumas oportunidades." }
      - { text: "Em todos os três, porque a amostra passa de {{n:hud.hands.vpip.low}} mãos", why: "O limiar de cerca de {{n:hud.hands.vpip.low}} mãos vale para estatísticas que têm oportunidade em toda mão. O fold to 3-bet tem muitas vezes menos oportunidades e precisa de cerca de {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}} mãos." }
      - { text: "Em nenhum: antes de mil mãos, as estatísticas são aleatórias", why: "Elas são aleatórias abaixo de cerca de {{n:hud.hands.random}} mãos. Depois de {{n:exam.m10.mid.hands}} mãos, o {{t:vpip}} e o {{t:pfr}} já dizem algo." }
      - { text: "Só no fold to 3-bet, porque é o mais extremo", why: "Um número extremo de uma amostra pequena é mais vezes acaso do que leitura. O que decide a confiabilidade é o número de oportunidades, e o fold to 3-bet tem o menor número delas aqui." }
  - kind: choice
    id: m10.exam.q4
    family: m10.types.adjust
    rules: [R-M10-007]
    prompt: "Um {{t:nit|nit}} ({{t:vpip}} {{n:exam.m10.nit.vpip}}, {{t:pfr}} {{n:exam.m10.nit.pfr}}, {{n:exam.m10.nit.hands}} mãos) {{t:open|abre}} do {{t:utg|UTG}}. Você está no Button com uma mão da parte de baixo do {{t:range|range}} com que, na base do módulo 4, você {{t:call|paga}} essa {{t:open|abertura}}. O que você faz?"
    options:
      - { text: "{{t:fold|Desisto}}", correct: true, why: "Um jogador que joga tão poucas mãos {{t:raise|aumenta}} principalmente com as mais fortes. As mãos da parte de baixo do seu {{t:range|range}} de {{t:call|pagamento}} ficam dominadas com mais frequência contra ele, então você {{t:fold|desiste}} delas com mais frequência do que na base." }
      - { text: "{{t:call|Pago}} como na base, porque tenho {{t:position|posição}}", why: "A {{t:position|posição}} não conserta uma mão dominada. A base pressupõe um {{t:range|range}} de {{t:open|abertura}} típico, e o {{t:range|range}} deste jogador é muito mais forte." }
      - { text: "Dou 3-bet como {{t:bluff}}, porque o {{t:nit}} só joga mãos fortes e vai {{t:fold|desistir}}", why: "O {{t:range|range}} de {{t:open|abertura}} dele são principalmente as mãos mais fortes, e essas raramente {{t:fold|desistem}} contra um 3-bet. O {{t:bluff|blefe}} aqui esbarra na parte mais forte do jogo dele." }
  - kind: choice
    id: m10.exam.q5
    family: m10.types.adjust
    rules: [R-M10-008]
    prompt: "O adversário é um {{t:maniac|maníaco}}: {{t:vpip}} {{n:exam.m10.maniac.vpip}}, {{t:pfr}} {{n:exam.m10.maniac.pfr}}, {{n:exam.m10.long.hands}} mãos. Você acertou um {{t:set|set}} no flop, e o adversário {{t:bet|aposta}}. O que você faz?"
    options:
      - { text: "{{t:call|Pago}} e deixo que ele continue apostando", correct: true, why: "Com uma mão muito forte, você deixa o {{t:maniac|maníaco}} apostar: as apostas dele incluem muitos {{t:bluff|blefes}} e mãos fracas, e o {{t:call}} as mantém em jogo para as próximas {{t:street|streets}}." }
      - { text: "{{t:raise|Aumento}} o máximo possível logo de cara", why: "O {{t:raise|aumento}} faz os {{t:bluff|blefes}} e as mãos fracas dele {{t:fold|desistirem}} antes de colocarem mais. Contra um jogador que aposta por conta própria, você ganha mais deixando que ele faça isso." }
      - { text: "{{t:fold|Desisto}}, porque um {{t:pfr}} alto significa mãos fortes", why: "Um {{t:pfr}} alto com um {{t:vpip}} tão alto significa que ele {{t:raise|aumenta}} com quase qualquer mão, e não que tem mãos fortes. Um {{t:set}} é aqui uma das melhores mãos." }
  - kind: choice
    id: m10.exam.q6
    family: m10.types.adjust
    rules: [R-M10-006]
    prompt: "River. O adversário é um {{t:recreational|jogador recreativo}} passivo: {{t:vpip}} {{n:exam.m10.rec.vpip}}, {{t:pfr}} {{n:exam.m10.rec.pfr}}, {{n:exam.m10.long.hands}} mãos. Ele {{t:check|passa}}. Você tem uma mão que, na base do módulo 8, às vezes aposta aqui por {{t:value|valor}} e às vezes {{t:check|passa}}. O que você faz?"
    options:
      - { text: "Aposto por {{t:value|valor}}", correct: true, why: "Esse tipo de jogador {{t:call|paga}} até o fim com mais mãos fracas do que o adversário da base, então mais dos {{t:call|pagamentos}} dele são mãos piores que a sua. Contra ele, você aposta por {{t:value|valor}} também com mãos mais finas." }
      - { text: "{{t:check|Passo}}, porque o jogador passivo só {{t:call|paga}} com mãos boas", why: "É o contrário: um jogador com uma grande diferença {{t:vpip}} − {{t:pfr}} joga muitas mãos e {{t:call|paga}} com elas até o fim. É justamente o motivo para apostar mais, e não menos." }
      - { text: "Faço o mesmo que na base: ora aposta, ora {{t:check}}", why: "A base pressupõe um adversário que se defende corretamente. Este adversário {{t:call|paga}} demais, então uma mão no limite se desloca para uma aposta por {{t:value|valor}}." }
  - kind: choice
    id: m10.exam.q7
    family: m10.base.alpha
    rules: [R-M10-010]
    prompt: "O adversário tem fold to c-bet {{n:exam.m10.fcb}} depois de {{n:exam.m10.long.hands}} mãos. Você errou o flop e não tem {{t:draw|projeto}}. Qual c-bet sem mão dá lucro imediato?"
    options:
      - { text: "Só o pequeno, de 1/3 do {{t:pot|pote}}", correct: true, why: "Um c-bet de 1/3 do {{t:pot|pote}} empata com {{n:alpha.cbet.small}} de {{t:fold|desistências}}, e um de 3/4 do {{t:pot|pote}} só com {{n:alpha.cbet.big}}. {{n:exam.m10.fcb}} só basta para o pequeno. O fold to c-bet junta todos os tamanhos e mesas, então isto é uma aproximação." }
      - { text: "Os dois, porque o adversário {{t:fold|desiste}} com frequência", why: "Um c-bet grande arrisca mais e precisa de mais de {{n:alpha.cbet.big}} de {{t:fold|desistências}}. O adversário {{t:fold|desiste}} em {{n:exam.m10.fcb}}, ou seja, raramente demais." }
      - { text: "Só o grande, porque força mais a {{t:fold|desistência}}", why: "O fold to c-bet do {{t:hud|HUD}} não diz que o adversário {{t:fold|desiste}} com mais frequência contra uma aposta grande. Com {{n:exam.m10.fcb}} de {{t:fold|desistências}}, um c-bet grande sem mão perde, porque precisa de {{n:alpha.cbet.big}}." }
      - { text: "Nenhum, porque o adversário {{t:fold|desiste}} em menos da metade das vezes", why: "O limiar não é a metade, e sim aposta ÷ ({{t:pot}} + aposta). Para um c-bet de 1/3 do {{t:pot|pote}}, ele é {{n:alpha.cbet.small}}, então {{n:exam.m10.fcb}} basta." }
  - kind: choice
    id: m10.exam.q8
    family: m10.base.3bet
    rules: [R-M10-011]
    prompt: "O adversário tem fold to 3-bet {{n:exam.m10.f3b.low}} depois de {{n:exam.m10.long.hands}} mãos. Ele {{t:open|abre}} do {{t:cutoff|CO}}, e você está no Button com uma mão com que, na base, você dá 3-bet como {{t:bluff}}. O que você muda?"
    options:
      - { text: "Deixo de dar 3-bet com esta mão; contra ele, dou 3-bet principalmente com mãos fortes", correct: true, why: "Um 3-bet para {{n:pf.3bet.ip-total}} só dá lucro sem mão com mais de {{n:alpha.vs-3bet-ip-size}} de {{t:fold|desistências}}, e este adversário {{t:fold|desiste}} em {{n:exam.m10.f3b.low}}. O {{t:bluff|blefe}} jogaria um {{t:pot|pote}} grande com uma mão fraca, e as mãos fortes recebem mais {{t:call|pagamentos}} dele: {{t:range}} {{t:linear|linear}}." }
      - { text: "Dou 3-bet com esta mão com mais frequência, porque o adversário é fraco", why: "A fraqueza do adversário aqui é que ele raramente {{t:fold|desiste}}. O {{t:bluff|blefe}} vive de {{t:fold|desistências}}, então perde contra ele." }
      - { text: "Nada: o fold to 3-bet ainda não é confiável", why: "Depois de {{n:exam.m10.long.hands}} mãos, é: você lê o fold to 3-bet depois de cerca de {{n:hud.hands.3bet.low}}–{{n:hud.hands.3bet.high}} mãos." }
  - kind: numeric
    id: m10.exam.q9
    family: m10.rake.math
    rules: [R-M10-015]
    prompt: "Há {{n:ex.pot}} no {{t:pot|pote}}, e o adversário {{t:bet|aposta}} o {{t:pot|pote}} inteiro: {{n:ex.bet.pot}}. A sala cobra {{n:rake.ex.pct}} do {{t:pot|pote}}, e o {{t:rake-cap|limite}} está fora de alcance. Quanta equity você precisa para {{t:call|pagar}}? Digite uma porcentagem."
    answer: exam.m10.rake.eq
    explanation: "O {{t:pot|pote}} depois do {{t:call|pagamento}} é {{n:exam.m10.rake.total}} e, descontado o {{t:rake|rake}}, {{n:exam.m10.rake.after}}. Você coloca {{n:ex.bet.pot}}: {{n:ex.bet.pot}} ÷ {{n:exam.m10.rake.after}} ≈ {{n:exam.m10.rake.eq}} em vez de {{n:eq.bet-pot}} sem {{t:rake|rake}}."
