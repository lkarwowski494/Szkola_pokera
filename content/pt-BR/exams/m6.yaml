# Pula pytań egzaminacyjnych modułu M6 (te same reguły co lekcje, inne sytuacje i inne liczby: exam.m6.*).
module: m6
drills:
  - kind: numeric
    id: m6.exam.q1
    family: m6.mdf
    rules: [R-M6-001, R-M6-005]
    prompt: "River. No {{t:pot|pote}} há {{n:exam.m6.pot}}, e o rival {{t:bet|aposta}} {{n:exam.m6.bet.three-quarters}}. Qual é o {{t:mdf}}, ou seja, no mínimo que parte do seu {{t:range|range}} você defende? Digite o número em porcentagem."
    answer: exam.m6.mdf.three-quarters
    explanation: "{{t:mdf}} = {{t:pot}} ÷ ({{t:pot}} + aposta) = {{n:exam.m6.pot}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}}) = {{n:exam.m6.mdf.three-quarters}}. Se você {{t:fold|desistir}} com mais frequência, um {{t:bluff}} sem chances lucra automaticamente."
  - kind: choice
    id: m6.exam.q2
    family: m6.alpha
    rules: [R-M6-002]
    prompt: "River. No {{t:pot|pote}} há {{n:exam.m6.pot}}. Você {{t:bluff|blefa}} com uma mão sem chances, apostando {{n:exam.m6.bet.quarter}}. Com que frequência o rival precisa {{t:fold|desistir}} para que esse {{t:bluff}} fique no zero a zero?"
    options:
      - { text: "Em mais de {{n:exam.m6.alpha.quarter}} dos casos", correct: true, why: "Sim: alpha = aposta ÷ ({{t:pot}} + aposta) = {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}}) = {{n:exam.m6.alpha.quarter}}. Um {{t:bluff}} pequeno arrisca pouco, então bastam {{t:fold|desistências}} raras." }
      - { text: "Em mais de {{n:exam.m6.mdf.quarter}} dos casos", why: "Isso é o {{t:mdf}}: a parte do {{t:range|range}} que o rival deveria defender. Alpha é o que falta para completar o todo: {{n:exam.m6.alpha.quarter}}." }
      - { text: "Em mais de {{n:eq.bet-quarter}} dos casos", why: "Essa é a equity de que o rival precisa para {{t:call|pagar}}; no denominador entra também o {{t:call}} dele. O limiar para o {{t:bluff|blefe}} é aposta ÷ ({{t:pot}} + aposta) = {{n:exam.m6.alpha.quarter}}." }
  - kind: choice
    id: m6.exam.q3
    family: m6.mdf-concept
    rules: [R-M6-003]
    prompt: "Você defende o {{t:big-blind}} contra uma {{t:open|abertura}} do Button. No flop, o Button {{t:bet|aposta}} um c-bet de 1/4 do {{t:pot|pote}}. Um colega {{t:fold|desiste}} aqui de mais da metade das mãos, porque “o {{t:mdf}} é só um ponto de referência”. O que está errado?"
    table: { position: BB }
    options:
      - { text: "No flop dá para defender um pouco menos que o {{t:mdf}}, mas contra c-bets pequenos não se {{t:fold|desiste}} em massa", correct: true, why: "Sim: contra um c-bet de 1/4 do {{t:pot|pote}}, o {{t:mdf}} é de {{n:exam.m6.mdf.quarter}}. No flop, {{t:out-of-position}}, você pode defender um pouco menos, porque os {{t:bluff|blefes}} do Button ainda têm equity, mas {{t:fold|desistir}} de mais da metade das mãos entrega o {{t:pot|pote}} a ele de graça." }
      - { text: "Nada: no flop o {{t:mdf}} simplesmente não vale", why: "No flop, o {{t:mdf}} é um ponto de referência: você pode defender um pouco menos, não quanto quiser a menos. Contra um c-bet pequeno, você ainda tem muitas mãos com equity suficiente." }
      - { text: "No flop é preciso defender mais que o {{t:mdf}}", why: "Ao contrário: no flop, {{t:out-of-position}}, você pode defender um pouco menos, porque não vai realizar toda a equity das mãos fracas. O erro do colega é {{t:fold|desistir}} muito mais do que deveria." }
  - kind: choice
    id: m6.exam.q4
    family: m6.exploit
    rules: [R-M6-004]
    prompt: "Microlimites. Um {{t:recreational|jogador recreativo}} passivo, que raramente {{t:bluff|blefa}}, {{t:bet|aposta}} 3/4 do {{t:pot|pote}} no river. Você tem um {{t:pair|par}} de damas, e na {{t:board|mesa}} há um ás e um rei. O que você faz?"
    table: { hand: "Qd Qc", board: "Ah Jd 7c 4s Ks" }
    options:
      - { text: "{{t:fold|Desisto}}", correct: true, why: "Sim: o seu {{t:pair}} é mais baixo que o ás e o rei da {{t:board|mesa}}, então ganha principalmente de {{t:bluff|blefes}}. Esse jogador raramente {{t:bluff|blefa}}, então contra ele você {{t:fold|desiste}} com mais frequência do que o {{t:mdf}} indica." }
      - { text: "{{t:call|Pago}}, porque o {{t:mdf}} manda defender cerca de {{n:exam.m6.mdf.three-quarters}}", why: "O {{t:mdf}} supõe que o rival {{t:bluff|blefa}} com frequência suficiente. Esse jogador não faz isso, então, ao {{t:call|pagar}}, você paga principalmente mãos melhores." }
      - { text: "{{t:raise|Aumento}}", why: "Depois de um {{t:raise|aumento}}, as mãos piores {{t:fold|desistem}} e as melhores pagam. Um {{t:pair|par}} mais baixo que duas cartas da {{t:board|mesa}} não é mão para {{t:raise|aumentar}}." }
  - kind: choice
    id: m6.exam.q5
    family: m6.flop.price
    rules: [R-M6-005]
    prompt: "Você está no {{t:big-blind|big blind}} e é o flop. Antes da {{t:bet|aposta}}, há {{n:exam.m6.pot}} {{t:chips|fichas}} no {{t:pot|pote}}. O Button {{t:bet|aposta}} {{n:exam.m6.bet.quarter}} em uma mão e {{n:exam.m6.bet.three-quarters}} em outra. De qual chance mínima de ganhar o {{t:pot|pote}} ({{t:equity|equity}}) você precisa para {{t:call|pagar}} em cada uma dessas mãos?"
    table: { position: BB }
    options:
      - { text: "Cerca de {{n:eq.bet-quarter}} e {{n:eq.bet-three-quarters}}", correct: true, why: "Sim: aposta ÷ ({{t:pot}} + 2·aposta). {{n:exam.m6.bet.quarter}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.quarter}} + {{n:exam.m6.bet.quarter}}) = {{n:eq.bet-quarter}}, e {{n:exam.m6.bet.three-quarters}} ÷ ({{n:exam.m6.pot}} + {{n:exam.m6.bet.three-quarters}} + {{n:exam.m6.bet.three-quarters}}) = {{n:eq.bet-three-quarters}}. Contra uma aposta maior, você defende com um {{t:range|range}} mais estreito." }
      - { text: "Cerca de {{n:exam.m6.alpha.quarter}} e {{n:eq.bet-three-quarters}}", why: "O primeiro número é o alpha (aposta ÷ ({{t:pot}} + aposta)), ou seja, o limiar para o {{t:bluff|blefe}} do Button. No preço do {{t:call|pagamento}}, some o seu próprio {{t:call}}: {{n:eq.bet-quarter}}." }
      - { text: "O mesmo nos dois, porque é o mesmo {{t:pot}}", why: "Não: o preço depende do tamanho da aposta. Uma aposta maior significa um preço pior: {{n:eq.bet-three-quarters}} em vez de {{n:eq.bet-quarter}}." }
  - kind: choice
    id: m6.exam.q6
    family: m6.flop.call
    rules: [R-M6-006]
    prompt: "Você defende o {{t:big-blind}} contra uma {{t:open|abertura}} do Button. No flop, você {{t:check|passa}}, e o Button {{t:bet|aposta}} um c-bet de 1/3 do {{t:pot|pote}}. Você tem ás como carta mais alta, sem {{t:draw|projeto}}. O que você faz?"
    table: { hand: "Ac 6h", board: "Js 8d 3d", position: BB }
    options:
      - { text: "{{t:call|Pago}}", correct: true, why: "Sim: contra um c-bet pequeno, você precisa de apenas cerca de {{n:eq.bet-third}} de equity. Ás como carta mais alta ganha de parte dos {{t:bluff|blefes}} do Button e pode formar um {{t:pair|par}}, então normalmente você defende essa mão. Você {{t:fold|desiste}} das mãos mais fracas sem {{t:pair|par}} e sem {{t:draw|projeto}}." }
      - { text: "{{t:fold|Desisto}}", why: "Apertado demais: contra um c-bet pequeno, ás como carta mais alta normalmente se defende. Você {{t:fold|desiste}} das mãos mais fracas sem {{t:pair|par}} e sem {{t:draw|projeto}}." }
      - { text: "Check-raise", why: "Você faz check-raise principalmente com as mãos mais fortes e com {{t:draw|projetos}}. Esta mão não tem nem valor nem um {{t:draw|projeto}} que daria uma segunda forma de ganhar." }
  - kind: choice
    id: m6.exam.q7
    family: m6.flop.fold
    rules: [R-M6-007]
    prompt: "Você defende o {{t:big-blind}} contra uma {{t:open|abertura}} do Button. No flop [[8c 4d 2h]], você {{t:check|passa}}, e o Button {{t:bet|aposta}} um c-bet de 3/4 do {{t:pot|pote}}. Com qual destas mãos {{t:call|pagar}} faz mais sentido?"
    table: { board: "8c 4d 2h", position: BB }
    options:
      - { text: "[[Ad Jd]]", correct: true, why: "Sim: as duas mãos são duas cartas altas sem {{t:pair|par}}, mas AJ de ouros tem um {{t:flush-draw|projeto de flush}} extra (backdoor) para o {{t:flush}} mais alto: com uma carta de ouros na {{t:board|mesa}}, ainda precisa de mais duas de ouros. Contra um c-bet grande, é justamente com uma mão assim que você tende a {{t:call|pagar}}." }
      - { text: "[[Ks Qs]]", why: "KQ de espadas não tem nenhum {{t:draw|projeto}} aqui: não há espadas na {{t:board|mesa}}, e a {{t:straight|sequência}} está longe demais. Contra um c-bet grande, você normalmente {{t:fold|desiste}} de duas cartas altas sem {{t:draw|projeto}}." }
  - kind: choice
    id: m6.exam.q8
    family: m6.xr.semibluff
    rules: [R-M6-008]
    prompt: "Você defende o {{t:big-blind}} contra uma {{t:open|abertura}} do Button. No flop [[Jh 8c 4h]], você {{t:check|passa}}, e o Button {{t:bet|aposta}} um c-bet de 1/3 do {{t:pot|pote}}. Qual destas mãos é a melhor para fazer check-raise?"
    table: { board: "Jh 8c 4h", position: BB }
    options:
      - { text: "[[Qh Th]]", correct: true, why: "Sim: um {{t:flush-draw|projeto de flush}} mais um gutshot (o nove) é um {{t:draw|projeto}} forte. O check-raise ganha quando o Button {{t:fold|desiste}}, e, quando ele paga, você ainda tem muitos outs." }
      - { text: "[[Jd 5d]]", why: "{{t:top-pair|Top pair}} com kicker fraco é mão para {{t:call|pagar}}. Depois de um check-raise, as mãos piores normalmente {{t:fold|desistem}} e as melhores pagam." }
      - { text: "[[As 3c]]", why: "Ás como carta mais alta sem {{t:draw|projeto}} não tem uma segunda forma de ganhar. O check-raise como {{t:bluff}} você faz principalmente com {{t:draw|projetos}}." }
  - kind: numeric
    id: m6.exam.q9
    family: m6.xr.size
    rules: [R-M6-010]
    prompt: "Flop. No {{t:pot|pote}} há {{n:exam.m6.pot}}, e o Button {{t:bet|aposta}} um c-bet pequeno de {{n:exam.m6.bet.quarter}}. Você faz check-raise para {{n:xr.mult.example}} o c-bet. Para quanto você {{t:raise|aumenta}}? Digite o número de {{t:chips|fichas}}."
    table: { position: BB }
    answer: exam.m6.xr
    explanation: "{{n:exam.m6.bet.quarter}} × {{n:xr.mult.example}} = {{n:exam.m6.xr}}. Contra um c-bet pequeno, você {{t:raise|aumenta}} mais perto do limite superior do intervalo {{n:xr.mult.low}}–{{n:xr.mult.example}}: um check-raise mínimo daria ao Button um preço muito bom."
  - kind: choice
    id: m6.exam.q10
    family: m6.xr.when
    rules: [R-M6-009]
    prompt: "Você defende o {{t:big-blind}} contra uma {{t:open|abertura}} do Button. Em qual flop você faz check-raise com mais frequência?"
    table: { position: BB }
    options:
      - { text: "[[8d 6c 5h]]", correct: true, why: "Sim: num flop baixo e {{t:connected|conectado}}, o {{t:big-blind}} tem no {{t:range|range}} {{t:straight|sequências}} e {{t:two-pair|dois pares}}, e o Button não tem {{t:nuts-advantage|vantagem de nuts}}, então você faz check-raise aqui com mais frequência." }
      - { text: "[[Ks Qd Jh]]", why: "Um flop alto com cartas próximas entre si acerta bem o {{t:range}} do Button (AK, AQ, KQ, {{t:pair|pares}} altos). Aqui você faz check-raise com menos frequência." }
      - { text: "[[Ah Ad Qc]]", why: "Num flop com um {{t:pair|par}} de ases, quem tem as mãos mais fortes com mais frequência é o Button, que {{t:open|abriu}} com muitos ases. Aqui você raramente faz check-raise." }
