# sc-11: Brazilian Portuguese text of content/pl/scenarios/sc-11.yaml (role 06, session CO, 2026-11-11; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-11
module: m5
situation: "Você fez {{t:open|abertura}} do Button, o {{t:big-blind}} fez {{t:call}} e faz {{t:check}} em um flop alto e {{t:dry|seco}}."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy, sredni]
bounds:
  latwy:
    flop: { height: [high], suits: [rainbow], ranks: [disconnected], wetness: [dry] }
    holding: [air]
    expected: [bet-small]
  sredni:
    flop: { height: [high], suits: [rainbow], ranks: [semi-connected] }
    holding: [air]
    expected: [bet-small]
decisions:
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o {{t:big-blind}} faz {{t:check}}. Você {{t:bet|aposta}} pouco, cerca de {{n:cbet.size.small}} do {{t:pot}}, porque você tem a {{t:range-advantage}} e as mãos fracas do adversário quase não têm chance: uma {{t:bet|aposta}} pequena basta para que ele as {{t:fold|largue}}. O {{t:big-blind}} faz {{t:raise|aumento}} com a maioria de AA, KK e AK antes do flop, por isso depois de só fazer {{t:call}} tem poucas."
      - action: check
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o {{t:big-blind}} faz {{t:check}}. O {{t:check}} é aceitável, mas mais raro: em um flop alto e {{t:dry|seco}} você faz {{t:c-bet}} muitas vezes e pequeno, porque você tem a {{t:range-advantage}} e as mãos fracas do adversário já {{t:fold|largariam}} diante de uma {{t:bet|aposta}} pequena. Ao fazer {{t:check}}, você dá a elas uma carta grátis."
      - action: bet-big
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o {{t:big-blind}} faz {{t:check}}. Uma {{t:bet|aposta}} grande é aqui uma imprecisão: em um flop alto e {{t:dry|seco}} você costuma fazer {{t:c-bet}} pequeno, cerca de {{n:cbet.size.small}} do {{t:pot}}, porque as mãos fracas do adversário já {{t:fold|largam}} diante dessa {{t:bet|aposta}}."
