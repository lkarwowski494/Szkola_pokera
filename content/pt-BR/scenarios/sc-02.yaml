# sc-02: Brazilian Portuguese text of content/pl/scenarios/sc-02.yaml (role 06, session BS, 2026-11-10); machine translation in session, for review by role 09.
id: sc-02
module: m2
situation: "Com stacks curtos, depois de um {{t:3-bet}} você tem um {{t:oesd}}; o adversário {{t:bet|aposta}} pouco no flop e muito no turn."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 35
levels: [latwy, sredni]
bounds:
  latwy: { draws: [oesd], marginMin: 0.1, marginMax: null, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
  sredni: { draws: [oesd], marginMin: 0.02, marginMax: 0.1, reject: [rywal-ma-out-gracza, stol-sparowany], expected: [call, fold] }
decisions:
  - street: flop
    kind: draw-call
    pots: [16, 18, 20, 22]
    fractions: [0.05, 0.1, 0.2, 0.25]
    villain: bet
    rule: R-M2-005
    actions:
      - action: call
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} pouco em relação ao {{t:pot}}. Você {{t:call|paga}}, porque está pagando só por uma carta, e seu {{t:oesd}} acerta nela mais vezes do que um preço tão baixo exige. Você tem {{n:outs.oesd}} outs, então a {{t:straight}} sai no turn em cerca de {{n:odds.oesd.flop-turn}} dos casos, mais ou menos uma carta a cada seis. Isso é uma simplificação: você conta só os outs do projeto. Cada carta sua mais alta que a mesa soma mais, no máximo, {{n:pair.outs.per-rank}} outs incertos para um {{t:pair|par}}, mas aqui isso não muda a resposta."
      - action: fold
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} pouco em relação ao {{t:pot}}. {{t:fold|Desistir}} entrega um {{t:pot}} em que {{t:call|pagar}} dá lucro: contra uma {{t:bet}} tão pequena, seu {{t:oesd}} acerta mais vezes do que o preço exige. Isso é uma simplificação: você conta só os outs do projeto. Cada carta sua mais alta que a mesa soma mais, no máximo, {{n:pair.outs.per-rank}} outs incertos para um {{t:pair|par}}, mas aqui isso não muda a resposta."
  - street: turn
    kind: draw-call
    pots: []
    fractions: [0.5, 0.6667, 0.75, 1]
    villain: bet
    rule: R-M7-007
    actions:
      - action: call
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}: o turn não trouxe a {{t:straight}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} muito. {{t:call|Pagar}} perde: você paga pela última carta, e ela acerta menos vezes do que o preço exige. As {{t:implied-odds}} não compensam isso, porque com stacks curtos sobram poucas demais {{t:chips}} atrás do {{t:pot}}: mesmo que você ganhe todas ao acertar, elas não cobrem os {{t:call|pagamentos}} perdidos. Isso é uma simplificação: você conta só os outs do projeto. Cada carta sua mais alta que a mesa soma mais, no máximo, {{n:pair.outs.per-rank}} outs incertos para um {{t:pair|par}}, mas aqui isso não muda a resposta."
      - action: fold
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}: o turn não trouxe a {{t:straight}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} muito. Você {{t:fold|desiste}}, porque paga pela última carta, ela acerta menos vezes do que o preço exige, e sobram poucas demais {{t:chips}} atrás do {{t:pot}} para que acertar compense isso. A {{t:straight}} sai no river em cerca de {{n:odds.oesd.turn-river}} dos casos, mais ou menos uma carta a cada seis. Isso é uma simplificação: você conta só os outs do projeto. Cada carta sua mais alta que a mesa soma mais, no máximo, {{n:pair.outs.per-rank}} outs incertos para um {{t:pair|par}}, mas aqui isso não muda a resposta."
