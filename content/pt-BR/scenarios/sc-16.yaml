# sc-16: Brazilian Portuguese text of content/pl/scenarios/sc-16.yaml (role 06, session HZ, 2026-11-16; agent translation, for review by role 09); structure must match pl.
id: sc-16
module: m6
situation: "Você tem um {{t:draw|projeto}} forte diante de um {{t:c-bet}} pequeno. Você está no {{t:big-blind}} e {{t:call|pagou}} a {{t:open|abertura}} do Button. No flop você faz {{t:check}}, e o Button {{t:bet|aposta}} um {{t:c-bet}} pequeno."
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [raise-big], draws: [flush, oesd], flopBroadwayMax: 2, flop: { suits: [two-tone, rainbow], ranks: [disconnected, semi-connected] }, reject: [stol-sparowany] }
decisions:
  - street: flop
    kind: check-raise
    rule: R-M6-008
    spot: vs-open.bb-vs-btn
    pots: [6, 9]
    cbet: 0.333333
    multipliers: { big: 4.5, small: 1.5 }
    actions:
      - action: raise-big
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} um {{t:c-bet}} pequeno. Você faz {{t:check-raise}} para cerca de {{n:xr.mult.example}} a {{t:bet|aposta}} dele, porque um {{t:draw|projeto}} tem duas formas de ganhar: o adversário pode {{t:fold|desistir}} na hora e, quando ele {{t:call|paga}}, você ainda pode completar seu {{t:draw|projeto}}. Segundo um site de treinamento, {{t:flush-draw|projetos de flush}} e {{t:oesd|OESDs}} são boas mãos para {{t:check-raise}}, e diante de um {{t:c-bet}} pequeno você {{t:raise|aumenta}} para cerca de {{n:xr.mult.example}}, não para o mínimo."
      - action: call
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} um {{t:c-bet}} pequeno. {{t:call|Pagar}} também é bom: diante de um {{t:c-bet}} pequeno você só precisa de cerca de {{n:eq.bet-third}} de equity, e esta mão pode melhorar. Segundo um site de treinamento, você não precisa {{t:raise|aumentar}} com todo {{t:draw|projeto}} forte, mas o {{t:check-raise}} acrescenta a chance de o adversário {{t:fold|desistir}} na hora."
      - action: fold
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} um {{t:c-bet}} pequeno. {{t:fold|Desistir}} entrega demais: diante de um {{t:c-bet}} pequeno você só precisa de cerca de {{n:eq.bet-third}} de equity, e o {{t:draw|projeto}} ainda pode melhorar. Diante de um {{t:c-bet}} pequeno você continua com {{t:draw|projetos}}: {{t:call|paga}} ou faz {{t:check-raise}}."
      - action: raise-small
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} um {{t:c-bet}} pequeno. O {{t:check-raise}} é uma boa ideia, mas para cerca de {{n:xr.too-small.mult}} o {{t:c-bet}} ele é pequeno demais: o Button então precisa de só cerca de {{n:eq.vs-xr.too-small}} de equity para {{t:call|pagar}} e assim paga barato com qualquer {{t:draw|projeto}}. Você {{t:raise|aumenta}} para cerca de {{n:xr.mult.low}}–{{n:xr.mult.example}} o {{t:c-bet}}, tanto mais quanto menor for o {{t:c-bet}}."
