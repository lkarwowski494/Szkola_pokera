id: sc-15
module: m6
situation: "Você está no {{t:big-blind}} e {{t:call|pagou}} a {{t:open|abertura}} do Button. No flop você faz {{t:check}}, e o Button {{t:bet|aposta}} um {{t:c-bet}} pequeno."
table: 6max
