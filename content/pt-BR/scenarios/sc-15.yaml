  latwy: { expected: [call] }
decisions:
  - street: flop
    kind: defend
    rule: R-M6-006
    spot: vs-open.bb-vs-btn
    pots: [6, 9]
    fractions: [0.333333]
    actions:
      - action: call
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} um {{t:c-bet}} pequeno. Você {{t:call|paga}}, porque esta mão ou já ganha dos {{t:bluff|blefes}}, ou pode melhorar, e uma {{t:bet|aposta}} pequena exige pouca equity. O {{t:mdf}} diante de uma {{t:bet|aposta}} de {{n:cbet.size.small}} do {{t:pot}} ({{n:mdf.bet-third}} do {{t:range}}) é um ponto de referência: no flop {{t:out-of-position}} você pode defender um pouco menos, mas não {{t:fold|desiste}} em massa diante de um {{t:c-bet}} pequeno."
      - action: fold
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} um {{t:c-bet}} pequeno. {{t:fold|Desistir}} entrega uma mão que tem equity suficiente contra uma {{t:bet|aposta}} tão pequena: ou já ganha dos {{t:bluff|blefes}}, ou pode melhorar. No flop {{t:out-of-position}} você pode defender um pouco menos do que indica o {{t:mdf}}, mas não {{t:fold|desiste}} em massa diante de c-bets pequenos."
