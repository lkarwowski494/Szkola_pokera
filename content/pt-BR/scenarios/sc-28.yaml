# sc-28: Brazilian Portuguese text of content/pl/scenarios/sc-28.yaml (role 06, session HA, 2026-11-13; translated in session, for review by role 09); structure must match pl (test szablony-bs).
id: sc-28
module: m9
situation: "Você tem um {{t:overpair}}. Você {{t:bet|apostou}} no flop e no turn, e o {{t:big-blind}} {{t:call|pagou}} toda vez; no river ele faz {{t:check}}. Suponha que o adversário não {{t:raise|aumenta}}: ele vai {{t:call|pagar}} com todos os AK, AQ, AJ, KQ, KJ e QJ e vai {{t:fold|largar}} todos os JT. Você joga uma terceira {{t:street}} {{t:value|de valor}} ou faz {{t:check}}?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { marginMin: 0.2, expected: ["bet"] }
decisions:
  - street: river
    kind: river-value
    rule: R-M8-001
    calls: [AKs, AKo, AQs, AQo, AJs, AJo, KQs, KQo, KJs, KJo, QJs, QJo]
    folds: [JTs, JTo]
    pairKind: [overpair]
    dryBoard: true
    actions:
      - action: "bet"
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} faz {{t:check}} no river. Você {{t:bet|aposta}} pela terceira vez, porque aqui o adversário paga com mãos mais fracas: entre as mãos que vão {{t:call|pagar}}, as piores que a sua são mais numerosas que as melhores (um empate divide o {{t:pot}} e não muda o cálculo). Cada {{t:call|pagamento}} com uma mão pior ganha uma {{t:bet|aposta}}, e cada um com uma mão melhor perde uma; quando o adversário {{t:fold|larga}} uma mão pior, você ganha o mesmo {{t:pot}} que ganharia depois de fazer {{t:check}}."
      - action: "check"
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} faz {{t:check}} no river. Fazer {{t:check}} aqui desperdiça valor: entre as mãos que vão {{t:call|pagar}}, as piores que a sua são mais numerosas que as melhores (um empate divide o {{t:pot}} e não muda o cálculo), então uma {{t:bet|aposta}} ganha mais delas do que perde para as melhores. Com um {{t:overpair}}, você joga uma terceira {{t:street}} {{t:value|de valor}} quando o adversário paga com mãos mais fracas, e aqui é o caso."
