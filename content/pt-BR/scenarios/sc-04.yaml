# SC-04 (M3): UTG otwiera albo pasuje (range-spot rfi.utg), potem c-bet na suchym wysokim flopie (cbet-case R-M5-007). Rola 06, sesja EH,
# 2026-11-11. Struktura jak pl (content/pl/scenarios/sc-04.yaml); jeden poziom (D-1165).
id: sc-04
module: m3
situation: "Você está no {{t:utg|UTG}} e ninguém entrou no jogo ainda; se você fizer {{t:open|abertura}}, o {{t:big-blind}} vai fazer {{t:call}} e, no flop, vai fazer {{t:check}}."
table: 6max
positions: { hero: UTG, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy:
    freqs: [{ min: 0.97, max: 1 }, null]
    flop: { height: [high], suits: [rainbow], ranks: [disconnected, semi-connected], oesdPossible: false }
    holding: [air]
    expected: ["raise 2.5", bet-small]
decisions:
  - street: preflop
    kind: range-spot
    spot: rfi.utg
    rule: R-M3-002
    actions:
      - action: "raise 2.5"
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, {{w:stol}}, e ninguém entrou no jogo ainda. Você {{t:open|abre}}, porque esta mão cabe no {{t:range}} estreito do {{t:utg|UTG}}: ainda há cinco jogadores atrás de você, então é mais frequente alguém ter uma mão melhor; por isso, do {{t:utg|UTG}} você só {{t:open|abre}} cerca de {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} das mãos."
      - action: fold
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, {{w:stol}}, e ninguém entrou no jogo ainda. {{t:fold|Desistir}} é cauteloso demais: o solver costuma {{t:open|abrir}} esta mão também do {{t:utg|UTG}}. Ainda há cinco jogadores atrás de você, então o {{t:range}} do {{t:utg|UTG}} é estreito, cerca de {{n:pf.rfi.utg.low}}–{{n:pf.rfi.utg.high}} das mãos, mas esta mão cabe nele."
  - street: flop
    kind: cbet-case
    rule: R-M5-007
    actions:
      - action: bet-small
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o {{t:big-blind}} faz {{t:check}}. Você {{t:bet|aposta}} pouco, cerca de {{n:cbet.size.small}} do {{t:pot}}, porque você tem a {{t:range-advantage}} e as mãos fracas do adversário quase não têm chance: uma {{t:bet|aposta}} pequena basta para que ele as {{t:fold|largue}}."
      - action: check
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o {{t:big-blind}} faz {{t:check}}. O {{t:check}} é aceitável, mas mais raro: em um flop alto e {{t:dry|seco}} você faz {{t:c-bet}} muitas vezes e pequeno, porque você tem a {{t:range-advantage}} e as mãos fracas do adversário já {{t:fold|largariam}} diante de uma {{t:bet|aposta}} pequena. Ao fazer {{t:check}}, você dá a elas uma carta grátis."
      - action: bet-big
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o {{t:big-blind}} faz {{t:check}}. Uma {{t:bet|aposta}} grande é aqui uma imprecisão: em um flop alto e {{t:dry|seco}} você costuma fazer {{t:c-bet}} pequeno, cerca de {{n:cbet.size.small}} do {{t:pot}}, porque as mãos fracas do adversário já {{t:fold|largam}} diante dessa {{t:bet|aposta}}."
