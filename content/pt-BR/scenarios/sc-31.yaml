    actions:
      - action: call
        explanation: "Você tem {{w:reka}} no {{w:pozycja}}, na {{t:board|mesa}} há {{w:stol}}, e o adversário no {{w:rywal}} {{t:bet|aposta}} alto no river. {{t:call|Pagar}} dá lucro só quando a proporção de {{t:bluff|blefes}} nas {{t:bet|apostas}} dele é maior que a equity necessária diante desta {{t:bet|aposta}}, porque a sua equity é justamente a proporção de {{t:bluff|blefes}}. A descrição do adversário não muda isso: você compara os números da mão. Uma {{t:bet|aposta}} maior exige mais {{t:bluff|blefes}}: diante de uma {{t:bet|aposta}} do tamanho do {{t:pot}}, cerca de {{n:eq.bet-pot}}."
