royal-flush: "A mão mais alta do pôquer: ás, rei, dama, valete e dez do mesmo naipe, por exemplo, A♠ K♠ Q♠ J♠ T♠."
straight-flush: "Cinco cartas em sequência do mesmo naipe, por exemplo, 5♥ 6♥ 7♥ 8♥ 9♥. A versão mais alta (do ás ao dez) tem nome próprio e é a mão mais forte do jogo."
four-of-a-kind: "Quatro cartas do mesmo valor, por exemplo, quatro setes. Entre duas quadras do mesmo valor, vence a quinta carta (o kicker) mais alta."
full-house: "Uma trinca e um par na mesma mão, por exemplo, três damas e dois cincos. Entre dois full houses, vence a trinca mais alta."
flush: "Cinco cartas do mesmo naipe (♠, ♥, ♦ ou ♣) que não estão em sequência. Entre duas mãos assim, vence a que tem a carta mais alta; se elas forem iguais, decide a carta seguinte."
straight: "Cinco cartas em sequência, nem todas do mesmo naipe, por exemplo, 5-6-7-8-9. O ás pode ser a carta mais alta (A-K-Q-J-T) ou a mais baixa (A-2-3-4-5)."
three-of-a-kind: "Três cartas do mesmo valor e duas outras. No hold'em, há duas variantes com nomes próprios: set, quando o par está na sua mão e a terceira carta no board, e trips, quando o par está no board e a terceira carta na sua mão."
set: "Trinca formada por um par na sua mão e uma carta do board, por exemplo, 7♣ 7♦ num flop K-7-2."
two-pair: "Dois pares diferentes e uma quinta carta, por exemplo, K-K-8-8-3. O empate é decidido primeiro pelo par mais alto, depois pelo mais baixo e, por fim, pela quinta carta."
pair: "Duas cartas do mesmo valor e três outras, por exemplo, dois noves. Só a carta alta é mais fraca."
high-card: "Mão sem par nem combinação melhor; a força é definida pela carta mais alta e, em caso de empate, pelas seguintes."
kicker: "A carta mais alta fora da combinação, que desempata. Exemplo: um par de ases com rei vence um par de ases com dama."
wheel: "A sequência mais baixa: A-2-3-4-5, em que o ás conta como a carta mais baixa."
check: "Continuar sem colocar fichas, possível só quando você não precisa pagar nada: ninguém apostou ainda nesta rodada de apostas (antes do flop, o big blind pode fazer isso quando ninguém aumentou). Não confunda com call, que é colocar fichas para igualar a aposta do adversário."
bet: "As primeiras fichas colocadas numa rodada de apostas em que ninguém apostou ainda (em sentido mais amplo, chama-se aposta qualquer colocação de fichas no pote)."
call: "Colocar no pote o valor da aposta ou do aumento do adversário para continuar jogando. Não confunda com check, que é continuar sem apostar quando ninguém apostou."
raise: "Aumentar o valor acima da aposta do adversário; os outros jogadores precisam completar a diferença, aumentar de novo ou dar fold."
fold: "Desistir da mão: você descarta as cartas e perde o que já colocou no pote."
check-raise: "Primeiro você dá check e, quando o adversário aposta, aumenta na mesma rodada de apostas."
all-in: "Apostar todas as suas fichas. Assim, de cada adversário você pode ganhar no máximo o que você mesmo colocou; o restante é disputado num pote paralelo."
pot: "Todas as fichas apostadas na mão atual. Elas vão para o jogador com a melhor mão no showdown (com potes paralelos, cada pote é decidido separadamente) ou para o jogador que sobra quando todos os outros dão fold."
side-pot: "Pote separado criado quando alguém está all-in: só disputam esse pote os jogadores que colocaram mais que o jogador all-in, por isso ele não pode ganhá-lo."
split-pot: "Situação em que jogadores com mãos iguais dividem o pote, por exemplo, quando ambos jogam a mesma sequência que está no board."
playing-the-board: "Situação em que sua melhor mão de cinco cartas é formada só pelas cartas comunitárias; suas cartas fechadas não acrescentam nada, então, na melhor das hipóteses, você divide o pote."
board: "As cartas comunitárias abertas no centro (flop, turn, river), usadas por todos os jogadores. O termo se refere às cartas, não à mesa onde se joga."
community-cards: "Cartas colocadas abertas no centro, que qualquer jogador pode usar para formar sua mão; no hold'em são cinco."
hole-cards: "As duas cartas fechadas que você recebe no início da mão no hold'em; só você as vê."
small-blind: "A aposta obrigatória menor, feita antes da distribuição pelo jogador à esquerda do button (no heads-up, pelo próprio button); esse lugar na mesa também tem esse nome."
big-blind: "A aposta obrigatória maior, feita antes da distribuição pelo segundo jogador à esquerda do button (no heads-up, pelo jogador oposto ao button); esse lugar também tem esse nome. Também serve de unidade para o tamanho dos stacks e para os resultados."
chips: "Os discos usados para jogar na mesa; nos cash games representam dinheiro e, nos torneios, pontos do torneio."
stack: "Todas as fichas que um jogador tem à sua frente; geralmente indicadas em big blinds (por exemplo, 100 big blinds)."
street: "Nome informal de uma rodada de apostas: preflop, flop, turn e river são as quatro streets. Exemplo: “value em três streets” significa apostas de valor no flop, no turn e no river."
betting-round: "Etapa da mão em que os jogadores, cada um na sua vez, dão check, apostam, dão call, aumentam ou dão fold; no hold'em são quatro: preflop, flop, turn e river."
preflop: "A primeira rodada de apostas: depois que as cartas fechadas são distribuídas e antes de o flop ir para a mesa."
flop: "As três primeiras cartas comunitárias, abertas juntas após as apostas do preflop; a segunda rodada de apostas também tem esse nome."
turn: "A quarta carta comunitária e a terceira rodada de apostas."
river: "A quinta e última carta comunitária e a última rodada de apostas antes do showdown."
showdown: "A revelação das cartas depois da última rodada de apostas, quando pelo menos dois jogadores continuam na mão; a melhor mão leva o pote."
position: "Seu lugar na mesa em relação ao button, que define a ordem de ação. Quem age depois vê mais ações dos adversários antes de decidir."
in-position: "Situação do jogador que age por último depois do flop e, por isso, vê a ação do adversário antes de decidir."
out-of-position: "Situação do jogador que age antes do adversário depois do flop e, por isso, decide sem conhecer a ação dele."
early-position: "Os primeiros lugares a agir antes do flop (por exemplo, UTG); ainda há muitos jogadores para agir depois de você."
late-position: "Os lugares que agem por último: o button e os lugares logo antes dele, principalmente o cutoff."
utg: "O primeiro jogador a agir antes do flop, sentado imediatamente à esquerda do big blind."
hijack: "O lugar imediatamente antes do cutoff, ou seja, o segundo à direita do button."
cutoff: "O lugar imediatamente à direita do button, que age logo antes dele."
button: "O lugar do dealer, marcado com um disco “dealer”. Depois do flop, age por último em todas as rodadas de apostas."
outs: "Carta que ainda está no baralho e vai melhorar sua mão, geralmente completando um draw. Exemplo: com um flush draw, seus outs são as cartas restantes do seu naipe."
draw: "Mão que ainda não é forte, mas pode se tornar forte com as próximas cartas comunitárias, por exemplo, quando falta uma carta para um flush ou uma sequência."
flush-draw: "Quatro cartas do mesmo naipe (somando a mão e o board); falta uma para completar o flush."
straight-draw: "Quatro cartas às quais falta uma para formar uma sequência. Tipos: OESD (falta uma carta em uma das duas pontas) e gutshot (falta uma carta no meio)."
oesd: "Sigla de open-ended straight draw: straight draw de quatro cartas em sequência, completado por uma carta em qualquer das duas pontas, por exemplo, 5-6-7-8 espera um quatro ou um nove."
gutshot: "Straight draw ao qual falta um valor específico no meio, por exemplo, 5-6-8-9 espera só um sete."
backdoor: "Draw no flop que precisa de duas cartas favoráveis seguidas, no turn e no river, por exemplo, três cartas do mesmo naipe depois do flop."
pot-odds: "A relação entre o valor que você precisa colocar e o pote que pode ganhar (incluindo a aposta do adversário). Mostra com que frequência você precisa ganhar para que o call valha a pena."
implied-odds: "Pot odds acrescidas das fichas que você espera ganhar nas streets seguintes se acertar sua mão."
equity: "Sua chance de ganhar o pote se todas as cartas restantes fossem abertas sem mais apostas; geralmente em porcentagem."
equity-realization: "Quanto da sua equity uma mão transforma em ganho quando as apostas continuam (pode realizar menos ou mais do que sua equity); depende, entre outras coisas, da posição e da facilidade de jogar a mão."
expected-value: "O resultado médio de uma jogada se ela fosse repetida muitas vezes. Uma jogada positiva na média dá lucro no longo prazo, mesmo que perca desta vez."
combo: "Uma combinação específica de duas cartas com naipes, por exemplo, A♠ K♥. Contar essas combinações mostra quantas mãos de um tipo há de fato num range."
range: "O conjunto de todas as mãos que um jogador pode ter numa situação, ou das mãos com as quais ele faria determinada jogada."
mixed-hand: "Mão com a qual a estratégia de equilíbrio escolhe ora uma jogada, ora outra (por exemplo, às vezes aumento, às vezes call); as duas jogadas são corretas. Também se diz que essa mão é jogada com estratégia mista."
open: "Entrar no pote antes do flop com um aumento quando todos antes de você deram fold."
suited: "Duas cartas fechadas do mesmo naipe, por exemplo, A♥ K♥ (notação AKs)."
offsuit: "Duas cartas fechadas de naipes diferentes, por exemplo, A♥ K♣ (notação AKo)."
pocket-pair: "Par formado pelas duas cartas fechadas, por exemplo, 8♣ 8♦ antes do flop."
connectors: "Cartas fechadas de valores vizinhos, por exemplo, 8-7 ou 9-8; com elas é mais fácil formar uma sequência."
3-bet: "O primeiro aumento sobre uma abertura antes do flop; o nome conta o big blind como a primeira aposta e a abertura como a segunda."
4-bet: "Um aumento sobre um 3-bet, ou seja, a quarta aposta na rodada de apostas."
limp: "Entrar no pote antes do flop apenas pagando o big blind, quando ninguém aumentou ainda."
isolation: "Aumento depois de um ou mais limps, para jogar contra o limper (muitas vezes um jogador mais fraco) no mano a mano."
texture: "As características das cartas comunitárias: quantos naipes há, se as cartas são próximas entre si, se há um par. Isso define quais mãos e draws são possíveis."
dry: "Board em que poucos draws e mãos fortes são possíveis, por exemplo, K♠ 7♦ 2♣."
wet: "Board em que muitos draws e mãos fortes são possíveis, por exemplo, J♥ T♥ 8♣."
rainbow: "Flop com três cartas de três naipes diferentes, então ninguém tem flush draw no flop."
two-tone: "Flop com duas cartas do mesmo naipe, então flush draws são possíveis."
monotone: "Flop com três cartas do mesmo naipe, então um flush pode já estar formado."
paired: "Board com um par (duas cartas do mesmo valor), por exemplo, 8-8-3."
connected: "Board em que alguém pode já ter formado uma sequência, por exemplo, 9-8-7."
disconnected: "Board com cartas distantes entre si, em que é difícil formar uma sequência ou um straight draw, por exemplo, K-7-2."
semi-connected: "Board com straight draws possíveis, mas ainda sem sequência possível, por exemplo, T-8-3 (classificação adotada neste curso)."
wetness: "O quanto um board favorece draws e mãos fortes: de seco a molhado. Também se descreve como o grau de coordenação do board."
top-pair: "Par com a carta mais alta do board, por exemplo, K♠ Q♦ num flop K-7-2."
second-pair: "Par com a segunda carta mais alta do board, por exemplo, 7♠ 6♠ num flop K-7-2."
overpair: "Par de mão mais alto que todas as cartas do board, por exemplo, Q-Q num flop J-7-2."
c-bet: "Aposta de continuação: aposta do jogador que foi o agressor na rodada anterior, por exemplo, uma aposta no flop depois de abrir no preflop."
aggressor: "O jogador que apostou ou aumentou por último na rodada de apostas anterior."
initiative: "O papel do último agressor: geralmente é ele quem faz a próxima aposta."
range-advantage: "Situação em que o range de um jogador tem, no total, mais equity num determinado board do que o range do adversário."
nuts-advantage: "Situação em que um jogador tem no range, proporcionalmente, mais das mãos mais fortes do que o adversário."
nuts: "A mão mais forte possível num determinado board naquele momento. Exemplo: no board K♥ 9♥ 4♥ 2♣, é o flush com o ás de copas."
polarized: "Sobre um range: formado principalmente por mãos muito fortes e por blefes, quase sem mãos médias."
polarization: "Montar um range com os extremos: mãos fortes para valor e blefes, sem mãos médias."
linear: "Sobre um range: montado de cima para baixo, das mãos mais fortes em diante, sem um grupo separado de blefes. Você também verá o termo relacionado “merged range” (range não polarizado); segundo análises de solver publicadas, o merged é um formato intermediário entre este range e o polarizado."
condensed: "Sobre um range: sem as mãos mais fortes (limitado por cima) e formado principalmente por mãos médias; o oposto do polarizado."
value: "Apostar com uma mão forte para que o adversário pague com uma mão mais fraca."
value-bet: "Uma aposta única por valor: feita com uma mão forte para que mãos mais fracas paguem."
bluff: "Aposta com uma mão fraca, que dificilmente vence no showdown, para que o adversário dê fold com uma mão melhor."
semi-bluff: "Aposta com uma mão ainda fraca, mas com chance de melhorar (por exemplo, com um draw): você ganha se o adversário der fold ou se acertar."
blocker: "Carta na sua mão que reduz a chance de o adversário ter certas mãos. Exemplo: com o ás de copas, o adversário não pode ter o flush de copas com ás."
bluff-catcher: "Mão que vence apenas os blefes do adversário e perde para as apostas de valor dele."
barrel: "Mais uma aposta na rodada de apostas seguinte, depois da sua própria aposta na rodada anterior."
second-barrel: "Segunda aposta seguida: depois de um c-bet no flop, o jogador aposta de novo no turn."
probe-bet: "Aposta no turn do jogador fora de posição depois que o agressor do preflop deu check no flop em vez de fazer c-bet."
donk-bet: "Aposta de um jogador que aposta antes de o agressor da rodada anterior ter tido a chance de agir."
overbet: "Aposta depois do flop maior que o pote inteiro."
effective-stack: "Numa mão entre dois jogadores: o menor dos dois stacks, ou seja, o máximo que se pode realmente ganhar ou perder. Com vários jogadores, é calculado separadamente para cada par."
spr: "O stack efetivo dividido pelo pote no início de uma street (para planejar a mão, é calculado no flop); mostra quão profundos são os stacks em relação ao pote (quanto menor o SPR, mais rápido tudo vai para o pote)."
mdf: "A menor parte do range que você precisa defender contra uma aposta para que o blefe do adversário com uma mão sem chances não seja automaticamente lucrativo."
alpha: "Com que frequência o adversário precisa dar fold para que um blefe com uma mão sem chances fique no zero a zero; depende do tamanho da aposta em relação ao pote."
variance: "A dispersão dos resultados em torno do valor esperado: mesmo jogando bem, sequências curtas podem ter grandes perdas ou grandes ganhos."
buy-in: "O valor de entrada num torneio ou para sentar num cash game."
bankroll: "Toda a reserva destinada exclusivamente a jogar pôquer; neste app, é contada em buy-ins, não em dinheiro."
tilt: "Estado em que as emoções (raiva, frustração, euforia) pioram suas decisões na mesa."
winrate: "O resultado médio de um jogador numa amostra maior; nos cash games, geralmente em bb/100, ou seja, big blinds por cem mãos."
downswing: "Período de resultados claramente piores, geralmente perdas maiores do que a habilidade justificaria; o oposto de um upswing."
session: "Uma sentada de pôquer, do início ao fim do jogo."
stakes: "O valor dos blinds num cash game ou do buy-in num torneio; “microlimites” são os níveis mais baixos."
standard-deviation: "Medida da dispersão dos resultados (a raiz quadrada da variância); no pôquer, geralmente em bb/100."
risk-of-ruin: "A probabilidade de você um dia perder todo o seu bankroll se continuar jogando no mesmo limite."
mental-game: "O lado psicológico do pôquer: lidar com o tilt, as emoções e a concentração na mesa."
tournament: "Formato em que os blinds sobem de tempos em tempos e o jogo continua até um jogador ficar com todas as fichas; os prêmios vão para os mais bem colocados."
push-fold: "Estratégia simplificada para short stacks: antes do flop, você ou vai all-in, ou dá fold."
shove: "Jogada all-in, geralmente como aumento antes do flop."
icm: "Modelo que converte fichas de torneio em valor em dinheiro, considerando a estrutura de premiação e os stacks de todos os jogadores."
bubble: "Fase do torneio logo antes das posições premiadas, quando ainda faltam algumas eliminações para chegar aos prêmios."
bubble-factor: "Indicador do ICM: quanto, num torneio, perder uma certa quantidade de fichas dói mais do que ganhar a mesma quantidade ajuda."
cover: "Ter pelo menos tantas fichas quanto o adversário. Quando um adversário cobre você, perder um all-in contra ele encerra seu torneio."
risk-premium: "Equity extra, além do que as pot odds exigem, necessária num torneio para arriscar um all-in, porque perder custa mais do que ganhar rende."
m-ratio: "Seu stack dividido pela soma dos blinds e dos antes de uma mão: quantas voltas completas (órbitas) suas fichas aguentam sem jogar."
red-zone: "Zona de M muito baixo: sobra principalmente ir all-in ou dar fold."
green-zone: "Zona de M alto: o stack permite jogar livremente, de forma conservadora ou agressiva."
ante: "Pequena contribuição obrigatória ao pote antes da distribuição, feita por todos os jogadores (principalmente em torneios)."
bb-ante: "Formato de ante em que, em vez de todos os jogadores, o jogador no big blind paga o ante da mesa inteira."
fold-equity: "A parte do valor de uma jogada que vem da possibilidade de o adversário dar fold."
gap-concept: "O princípio de que é preciso uma mão mais forte para pagar uma abertura do que para abrir."
chip-ev: "O valor esperado de uma jogada calculado em fichas, sem convertê-las em dinheiro (sem ICM)."
tournament-equity: "Sua parte esperada da premiação total, dadas a estrutura de premiação e os stacks. Também é chamada de “$EV”."
prize-pool: "O total de dinheiro a ser dividido entre os jogadores premiados de um torneio."
payout: "O prêmio por uma colocação específica no torneio; juntos, eles formam a distribuição dos prêmios."
pay-jump: "A diferença de prêmio entre colocações vizinhas num torneio; saltos grandes aumentam o prêmio de risco."
final-table: "A última mesa de um torneio, onde se disputam os maiores prêmios."
short-stack: "Stack pequeno em relação aos blinds; nos torneios, geralmente um com poucos big blinds restantes."
nash-equilibrium: "Conjunto de estratégias em que nenhum jogador ganha nada mudando apenas a própria estratégia."
overcall: "Pagar uma aposta que alguém antes de você já pagou."
heads-up: "Jogo mano a mano: só restam dois jogadores na mesa ou na mão."
dead-money: "Fichas no pote de jogadores que já não podem ganhá-lo, por exemplo, dos que deram fold."
stack-off: "Colocar o stack inteiro no pote numa única mão, ou seja, ir all-in ou pagar um all-in."
exploit: "Desvio deliberado da estratégia base para aproveitar um erro específico de um adversário ou de toda a população de jogadores."
hud: "Sobreposição na mesa do jogo online que mostra estatísticas dos adversários a partir de mãos jogadas anteriormente."
vpip: "Estatística do HUD: em que porcentagem das mãos o jogador coloca dinheiro voluntariamente no pote antes do flop (dá call ou aumenta)."
pfr: "Estatística do HUD: em que porcentagem das mãos o jogador aumenta antes do flop."
wtsd: "Estatística do HUD: com que frequência um jogador que viu o flop chega ao showdown."
nit: "Jogador muito tight, que entra no pote quase só com mãos fortes."
regular: "Jogador frequente num determinado limite, que joga um grande volume de mãos; no curso, é contraposto ao jogador recreativo."
tag: "Estilo tight agressivo: poucas mãos, mas jogadas de forma agressiva (apostas e aumentos)."
lag: "Estilo loose agressivo: muitas mãos, jogadas de forma agressiva."
recreational: "Jogador que joga por diversão e geralmente é mais fraco que os regulares; no jargão, de forma pejorativa, “fish”."
calling-station: "Termo pejorativo para um jogador que paga com muita frequência, mesmo com mãos fracas ou draws."
maniac: "Termo pejorativo para um jogador muito loose e agressivo, que aposta e aumenta com qualquer coisa."
rake: "A taxa que o cassino ou a sala online cobra do pote para organizar o jogo."
rake-cap: "O valor máximo de rake que a sala pode cobrar de uma única mão."
