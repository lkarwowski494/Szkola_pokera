# Start → mapa nauki → lekcja → zadanie → odpowiedź (PU-003).
# D-1780/IA: znacznik ekranu = testID korzenia trasy (`ekran:<trasa>`, apps/mobile/src/components/ZnacznikEkranu.tsx); id w Maestro to regex, więc nawiasy trasy są z ukośnikiem.
# `# powrót: <trasa>` stoi tuż przed krokiem wstecz Z tej trasy; dla zakładki (korzenia) przed asercją, która potwierdza powrót na nią (D-1831).
appId: pl.lkarwowski.szkolapokera
name: Lekcja i pierwsze zadanie
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: '(pl)'
# pierwsze uruchomienie (cz. 5b krok 3): powitanie → „Zacznij od początku” → „Dziś” (BR-ONB-001, D-475)
- runFlow: wspolne/za-powitaniem.yaml
# lista lekcji jest w zakładce „Lekcje” (D-542, KO-045; wcześniej na „Dziś”); asercja wstępu ta sama, zmiana ścieżki dotarcia
- tapOn:
    id: 'zakladka-lekcje'
- extendedWaitUntil:
    visible: 'No-Limit Hold’em od zera.*'
    timeout: 30000
- assertVisible:
    id: 'ekran:\(tabs\)/lessons'
- scrollUntilVisible:
    element:
      id: 'lesson-m0.l1'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'lesson-m0.l1'
- assertVisible: 'Układy kart'
- assertVisible:
    id: 'ekran:lesson/\[id\]'
- scrollUntilVisible:
    element: 'Ćwiczenia'
    direction: DOWN
    timeout: 30000
- tapOn: 'Ćwiczenia'
- assertVisible: '1 z \d+'
- assertVisible:
    id: 'ekran:session'
- tapOn:
    id: 'option-0'
# każda odpowiedź daje ocenę; sprawdzamy, że zadanie przyjęło odpowiedź i pokazało wyjaśnienie
- assertVisible: '(Dobrze|Tym razem nie)'
# „Dalej” pod wyjaśnieniem (ze stołem) bywa pod krawędzią ekranu
- scrollUntilVisible:
    element: 'Dalej'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: 'Dalej'
- assertVisible: '2 z \d+'
# „Zakończ” zamiast „Zamknij” w sesji (słownik interakcji design-spec.md:53; cz. 5b krok 4, D-267)
# powrót: session
- tapOn: 'Zakończ'
- assertVisible: 'Układy kart'
- assertVisible:
    id: 'ekran:lesson/\[id\]'
# powrót: lesson/[id]
- tapOn: 'Wróć'
# powrót: (tabs)/lessons
- assertVisible:
    id: 'ekran:\(tabs\)/lessons'
