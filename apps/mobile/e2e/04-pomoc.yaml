# Postęp → Pomoc. Numery i teksty przychodzą z content/helplines.yaml przez helplines-env.mjs (maestro test -e …),
# więc flow ich nie powiela. Nie dzwonimy: symulator nie ma aplikacji Telefon. (PU-006)
# D-1780/IA: znacznik ekranu = testID korzenia trasy (`ekran:<trasa>`, apps/mobile/src/components/ZnacznikEkranu.tsx); id w Maestro to regex, więc nawiasy trasy są z ukośnikiem.
# `# powrót: <trasa>` stoi tuż przed krokiem wstecz Z tej trasy; dla zakładki (korzenia) przed asercją, która potwierdza powrót na nią (D-1831).
appId: pl.lkarwowski.szkolapokera
name: Pomoc
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: '(pl)'
# pierwsze uruchomienie (cz. 5b krok 3): powitanie → „Zacznij od początku” → „Dziś” (BR-ONB-001, D-475)
- runFlow: wspolne/za-powitaniem.yaml
# „Dziś” po powitaniu: czekamy na element tego ekranu (blok lekcji); wstęp listy lekcji jest w zakładce „Lekcje” (D-542)
- extendedWaitUntil:
    visible:
      id: 'dzis-lekcja'
    timeout: 30000
- tapOn: 'Postęp'
- assertVisible:
    id: 'ekran:\(tabs\)/progress'
- scrollUntilVisible:
    element: 'Pomoc: gdy granie wymyka się spod kontroli'
    direction: DOWN
- tapOn: 'Pomoc: gdy granie wymyka się spod kontroli'
- assertVisible:
    id: 'ekran:help'
# D-158: bez numerów; zdanie ogólne, pomoc międzynarodowa online (link) i data sprawdzenia
- assertVisible: '${HELP_ABROAD}'
- assertVisible: '${HELP_LINK}'
- scrollUntilVisible:
    element: '${HELP_CHECKED}'
    direction: DOWN
- assertNotVisible: 'Zadzwoń pod numer.*'
# powrót: help
- tapOn: 'Wróć'
# powrót: (tabs)/progress
- assertVisible:
    id: 'ekran:\(tabs\)/progress'
# drugie wejście (PU-006): „Dziś” → ustawienia → „Pomoc” (settings.help)
- tapOn:
    id: 'zakladka-dzis'
- tapOn:
    id: 'ustawienia'
- assertVisible:
    id: 'ekran:settings'
- tapOn: 'Pomoc'
- assertVisible:
    id: 'ekran:help'
- assertVisible: '${HELP_ABROAD}'
# powrót: help
- tapOn: 'Wróć'
# powrót: settings
- assertVisible:
    id: 'ekran:settings'
