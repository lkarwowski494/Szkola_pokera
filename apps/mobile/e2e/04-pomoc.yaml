# Postęp → Pomoc. Numery i teksty przychodzą z content/helplines.yaml przez helplines-env.mjs (maestro test -e …),
# więc flow ich nie powiela. Nie dzwonimy: symulator nie ma aplikacji Telefon.
appId: pl.lkarwowski.szkolapokera
name: Pomoc
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: '(pl)'
# pierwsze uruchomienie (cz. 5b krok 3): powitanie → „Pomiń” w ocenie poziomu → „Dziś” (BR-ONB-001-b)
- runFlow: wspolne/za-powitaniem.yaml
- extendedWaitUntil:
    visible: 'No-Limit Hold’em od zera.*'
    timeout: 30000
- tapOn: 'Postęp'
- scrollUntilVisible:
    element: 'Pomoc: gdy granie wymyka się spod kontroli'
    direction: DOWN
- tapOn: 'Pomoc: gdy granie wymyka się spod kontroli'
# D-158: bez numerów; zdanie ogólne, pomoc międzynarodowa online (link) i data sprawdzenia
- assertVisible: '${HELP_ABROAD}'
- assertVisible: '${HELP_LINK}'
- scrollUntilVisible:
    element: '${HELP_CHECKED}'
    direction: DOWN
- assertNotVisible: 'Zadzwoń pod numer.*'
