# Podprzepływ: pierwsze uruchomienie → powitanie (wybór na starcie) → „Zacznij od początku” → „Dziś” (BR-ONB-001, D-475).
# Warunkowy: bez powitania na ekranie nic nie robi, więc działa też w flowach bez clearState.
appId: pl.lkarwowski.szkolapokera
---
- runFlow:
    when:
      visible: '.*bez gry na pieniądze.*'
    commands:
      - tapOn: 'Zacznij od początku'
- extendedWaitUntil:
    visible: '${LEKCJA_START_TYTUL}'
    timeout: 30000
