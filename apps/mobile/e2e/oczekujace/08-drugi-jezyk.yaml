# R-52, R-57, BR-JEZ-001: zmiana języka w aplikacji bez restartu; lekcja i zadanie z treścią w tym języku
# (plik tresc-<wersja>-en.db, ADR 0005). Tytuł lekcji en z content/en przez helplines-env.mjs; bez content/en zmienna
# jest pusta i flow pada na pierwszej asercji (oczekiwane do czasu przekładu, rola 09).
appId: pl.lkarwowski.szkolapokera
name: Drugi język
---
- launchApp:
    clearState: true
- runFlow: ../wspolne/za-powitaniem.yaml
- tapOn:
    id: 'ustawienia'
- tapOn:
    id: 'ustawienia-jezyk'
- tapOn:
    id: 'jezyk-en'
- extendedWaitUntil:
    visible: '${LEKCJA_START_TYTUL_EN}'
    timeout: 30000
- tapOn:
    id: 'lesson-m0.l1'
- assertVisible: '${LEKCJA_START_TYTUL_EN}'
- assertNotVisible: '${LEKCJA_START_TYTUL}'
- takeScreenshot: 08-lekcja-en
