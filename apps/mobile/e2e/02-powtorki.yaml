# Zakładka Powtórki: świeża instalacja nie ma nic do powtórki.
appId: pl.lkarwowski.szkolapokera
name: Powtórki
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: '(pl)'
# pierwsze uruchomienie (cz. 5b krok 3): powitanie → „Zacznij od początku” → „Dziś” (BR-ONB-001, D-475)
- runFlow: wspolne/za-powitaniem.yaml
- extendedWaitUntil:
    visible: 'No-Limit Hold’em od zera.*'
    timeout: 30000
# D-541/KO-045: zakładki „Powtórki” nie ma; kolejka powtórek otwiera się z kafelka `dzis-powtorki`, przez ekran startu
# („Zacznij”) do stanu pustej kolejki. Asercja ta sama, zmiana ścieżki dotarcia.
- tapOn:
    id: 'dzis-powtorki'
- tapOn: 'Zacznij.*'
- assertVisible: 'Nic nie czeka na powtórkę.*'
