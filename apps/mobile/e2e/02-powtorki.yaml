# Zakładka Powtórki: świeża instalacja nie ma nic do powtórki.
appId: pl.lkarwowski.szkolapokera
name: Powtórki
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: '(pl)'
# pierwsze uruchomienie (cz. 5b krok 3): powitanie → „Zacznij od początku” → „Dziś” (BR-ONB-001, D-475)
- runFlow: wspolne/za-powitaniem.yaml
- extendedWaitUntil:
    visible: 'No-Limit Hold’em od zera.*'
    timeout: 30000
# zakładka po id: tekst „Powtórki” ma też wiersz na „Dziś” (`dzis-powtorki`), a stuknięcie po tekście trafiło
# w wiersz i otworzyło sesję powtórek (przebieg 42508961244; 08-F24 → 04). Asercja bez zmian.
- tapOn:
    id: 'zakladka-powtorki'
- assertVisible: 'Nic nie czeka na powtórkę.*'
