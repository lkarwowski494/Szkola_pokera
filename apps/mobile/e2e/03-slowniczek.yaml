# Postęp → Słowniczek → wyszukiwanie po angielsku.
appId: pl.lkarwowski.szkolapokera
name: Słowniczek
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: '(pl)'
# pierwsze uruchomienie (cz. 5b krok 3): powitanie → „Zacznij od początku” → „Dziś” (BR-ONB-001, D-475)
- runFlow: wspolne/za-powitaniem.yaml
- extendedWaitUntil:
    visible: 'No-Limit Hold’em od zera.*'
    timeout: 30000
- tapOn: 'Postęp'
- scrollUntilVisible:
    element: 'Słowniczek PL–EN'
    direction: DOWN
- tapOn: 'Słowniczek PL–EN'
- tapOn: 'Szukaj po polsku albo po angielsku'
- inputText: '${GLOSS_QUERY}'
# nazwa polska z content/terms.yaml (helplines-env.mjs), nie wpisana tutaj (JAK-E0-01).
# Czekanie zamiast assertVisible (D-195): przebieg 42386642585 — pierwszy flow po instalacji padł na tej asercji
# po 3 min 28 s, w ponowieniu przeszedł (1 min 18 s); wynik wyszukiwania na zimnej aplikacji pojawia się później.
- extendedWaitUntil:
    visible: '${GLOSS_PL}'
    timeout: 20000
