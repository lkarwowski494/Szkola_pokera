# Postęp → Słowniczek → wyszukiwanie po angielsku (PU-005).
# D-1780/IA: znacznik ekranu = testID korzenia trasy (`ekran:<trasa>`, apps/mobile/src/components/ZnacznikEkranu.tsx); id w Maestro to regex, więc nawiasy trasy są z ukośnikiem.
# `# powrót: <trasa>` stoi tuż przed krokiem wstecz Z tej trasy; dla zakładki (korzenia) przed asercją, która potwierdza powrót na nią (D-1831).
appId: pl.lkarwowski.szkolapokera
name: Słowniczek
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: '(pl)'
# pierwsze uruchomienie (cz. 5b krok 3): powitanie → „Zacznij od początku” → „Dziś” (BR-ONB-001, D-475)
- runFlow: wspolne/za-powitaniem.yaml
# „Dziś” po powitaniu: czekamy na element tego ekranu (blok lekcji); wstęp listy lekcji jest w zakładce „Lekcje” (D-542)
- extendedWaitUntil:
    visible:
      id: 'dzis-lekcja'
    timeout: 30000
- tapOn: 'Postęp'
- assertVisible:
    id: 'ekran:\(tabs\)/progress'
- scrollUntilVisible:
    element: 'Słowniczek PL–EN'
    direction: DOWN
- tapOn: 'Słowniczek PL–EN'
- assertVisible:
    id: 'ekran:glossary'
- tapOn: 'Szukaj po polsku albo po angielsku'
- inputText: '${GLOSS_QUERY}'
# nazwa polska z content/terms.yaml (helplines-env.mjs), nie wpisana tutaj (JAK-E0-01).
# Czekanie zamiast assertVisible (D-195): przebieg 42386642585 — pierwszy flow po instalacji padł na tej asercji
# po 3 min 28 s, w ponowieniu przeszedł (1 min 18 s); wynik wyszukiwania na zimnej aplikacji pojawia się później.
- extendedWaitUntil:
    visible: '${GLOSS_PL}'
    timeout: 20000
# powrót: glossary
- tapOn: 'Wróć'
# powrót: (tabs)/progress
- assertVisible:
    id: 'ekran:\(tabs\)/progress'
