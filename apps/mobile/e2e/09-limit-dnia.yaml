# PR-03, R-40, R-42: pierwsza aktywność dnia zużywa limit (D-107); druga (inny rodzaj, wspólny limit) → przed startem
# stan zakupu z godziną odnowienia i „Wróć do lekcji”; lekcja działa bez licznika (BR-LIM-001-b, -c, BR-LIM-003-a).
# Zakup tylko do ekranu: bez StoreKit (sandbox — lista „tylko telefon” T-05). (PU-009)
# D-1780/IA: znacznik ekranu = testID korzenia trasy (`ekran:<trasa>`, apps/mobile/src/components/ZnacznikEkranu.tsx); id w Maestro to regex, więc nawiasy trasy są z ukośnikiem.
# `# powrót: <trasa>` stoi tuż przed krokiem wstecz Z tej trasy; dla zakładki (korzenia) przed asercją, która potwierdza powrót na nią (D-1831).
# Stan zakupu po limicie to stan trasy `session` (session.tsx, stan 'zakup'), nie trasa `purchase`: asercja `ekran:session` (D-1835).
appId: pl.lkarwowski.szkolapokera
name: Limit dnia
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: '(pl)'
- runFlow: wspolne/za-powitaniem.yaml
- assertVisible:
    id: 'ekran:\(tabs\)/index'
- tapOn:
    id: 'dzis-cwiczenia'
- assertVisible: '.*1.*darmow.*'
- assertVisible:
    id: 'ekran:session'
- tapOn: 'Zacznij.*'
- tapOn:
    id: 'option-0'
# powrót: session
- tapOn: 'Zakończ'
# powrót: (tabs)/index
- assertVisible:
    id: 'ekran:\(tabs\)/index'
- tapOn:
    id: 'dzis-powtorki'
- assertVisible: '.*0.*darmow.*'
- assertVisible:
    id: 'ekran:session'
- assertVisible: '.*odnowi.*'
- takeScreenshot: 09-limit-wyczerpany
# powrót: session
- tapOn: 'Wróć do lekcji'
# lista lekcji jest w zakładce „Lekcje” (D-542, KO-045)
- tapOn:
    id: 'zakladka-lekcje'
- assertVisible:
    id: 'ekran:\(tabs\)/lessons'
- scrollUntilVisible:
    element:
      id: 'lesson-m0.l1'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'lesson-m0.l1'
- assertVisible: '${LEKCJA_START_TYTUL}'
- assertVisible:
    id: 'ekran:lesson/\[id\]'
- assertNotVisible: '.*darmow.*'
- takeScreenshot: 09-lekcja-bez-licznika
# powrót: lesson/[id]
- tapOn: 'Wróć'
# powrót: (tabs)/lessons
- assertVisible:
    id: 'ekran:\(tabs\)/lessons'
