# PR-01, R-36, R-35: powitanie z wyborem na starcie (D-475), „Zacznij od początku” (start z pierwszej lekcji M0, bez
# ekranu zakupu) i ocena przerwana (po ponownym uruchomieniu ekran wyboru, postęp pusty). „Nie wiem” zamiast „Pomiń”
# na ekranie pytania. BR-ONB-001, BR-ONB-004.
appId: pl.lkarwowski.szkolapokera
name: Ocena poziomu
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: '(pl)'
- extendedWaitUntil:
    visible: '.*bez gry na pieniądze.*'
    timeout: 30000
- takeScreenshot: 05-powitanie-wybor
- assertNotVisible: '.*(wygr|online|kasyn).*'
- assertVisible: 'Przejdź test poziomujący'
- assertVisible: 'Zacznij od początku'
- tapOn: 'Przejdź test poziomujący'
# pytanie ze stołem 3-rzędowym jest wysokie: „Nie wiem” leży pod ekranem (E2E 42800500800), więc przewijamy do niego
- scrollUntilVisible:
    element: 'Nie wiem'
    direction: DOWN
    timeout: 30000
- assertVisible: 'Nie wiem'
- assertNotVisible: 'Pomiń'
- takeScreenshot: 05-pytanie-ze-stolem
# po przewinięciu odpowiedź 0 może być nad ekranem: wracamy do niej przed tapnięciem
- scrollUntilVisible:
    element:
      id: 'option-0'
    direction: UP
    timeout: 30000
- tapOn:
    id: 'option-0'
- scrollUntilVisible:
    element: 'Nie wiem'
    direction: DOWN
    timeout: 30000
- assertVisible: 'Nie wiem'
# przerwanie po pierwszej odpowiedzi: po ponownym uruchomieniu ekran wyboru, nie pytanie
- stopApp
- launchApp:
    clearState: false
    arguments:
      AppleLanguages: '(pl)'
- extendedWaitUntil:
    visible: 'Przejdź test poziomujący'
    timeout: 30000
- assertNotVisible: 'Nie wiem'
- takeScreenshot: 05-po-przerwaniu-wybor
- tapOn: 'Zacznij od początku'
- extendedWaitUntil:
    visible: '${LEKCJA_START_TYTUL}'
    timeout: 30000
- assertNotVisible: '.*(\$|€|zł|Przywróć zakupy).*'
- takeScreenshot: 05-dzis-po-rozpoczeciu-od-poczatku
