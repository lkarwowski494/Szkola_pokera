# sc-21: Japanese text of docs/tresci/szablony-robocze/hz/pl/sc-21.yaml (role 06, session HZ, 2026-11-16; agent translation, for review by role 09); structure must match pl.
id: sc-21
module: m7
situation: "ターンで中程度の{{t:pair|ペア}}。あなたはボタンから{{t:open|オープン}}し、{{t:big-blind|ビッグブラインド}}が{{t:call|コール}}しました。フロップであなたは小さな{{t:c-bet|Cベット}}で{{t:bet|ベット}}し、相手はまた{{t:call|コール}}しました。ターンで{{t:big-blind|ビッグブラインド}}が{{t:check|チェック}}し、あなたは{{t:second-pair|セカンドペア}}かそれより弱い{{t:pair|ペア}}を持っています。"
