  - street: turn
    kind: turn-action
    rule: R-M7-003
    actions:
      - action: check
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手がターンで{{t:check|チェック}}しています。{{t:check|チェック}}するのは、フロップで{{t:call|コール}}した後の相手は通常フロップのときより強い{{t:range|レンジ}}を持っているので、もう安心して{{t:bet|ベット}}できないからです。リバーまで残りのカードは一枚なので、このハンドがプロテクションで得るものは少なく、{{t:check|チェック}}すれば{{t:pot|ポット}}を小さく保ち、安く{{t:showdown|ショーダウン}}にたどり着けます。"
      - action: bet-big
        explanation: "あなたは{{w:pozycja}}で{{w:reka}}を持ち、{{t:board|ボード}}は{{w:stol}}で、{{w:rywal}}の相手がターンで{{t:check|チェック}}しています。このハンドでの{{t:bet|ベット}}は得るものが少ないです：フロップで{{t:call|コール}}した後の相手は通常フロップのときより強い{{t:range|レンジ}}を持っており、リバーまで残りのカードは一枚なので、プロテクションの効果もわずかです。ターンでは中程度のハンドは通常、安く{{t:showdown|ショーダウン}}にたどり着くために{{t:check|チェック}}し、強いハンドと一部の{{t:draw|ドロー}}が{{t:bet|ベット}}します。"
