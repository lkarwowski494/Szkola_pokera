# sc-16: Korean text of docs/tresci/szablony-robocze/hz/pl/sc-16.yaml (role 06, session HZ, 2026-11-16; agent translation, for review by role 09); structure must match pl.
id: sc-16
module: m6
situation: "작은 {{t:c-bet|C벳}}에 맞서 강한 {{t:draw|드로우}}를 들고 있습니다. 당신은 {{t:big-blind|빅 블라인드}}에 있고 버튼의 {{t:open|오픈}}에 {{t:call|콜}}했습니다. 플롭에서 당신은 {{t:check|체크}}하고, 버튼이 작은 {{t:c-bet|C벳}}으로 {{t:bet|베팅}}합니다."
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [raise-big], draws: [flush, oesd], flopBroadwayMax: 2, flop: { suits: [two-tone, rainbow], ranks: [disconnected, semi-connected] }, reject: [stol-sparowany] }
decisions:
  - street: flop
    kind: check-raise
    rule: R-M6-008
    spot: vs-open.bb-vs-btn
    pots: [6, 9]
    cbet: 0.333333
    multipliers: { big: 4.5, small: 1.5 }
    actions:
      - action: raise-big
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대가 작은 {{t:c-bet|C벳}}으로 {{t:bet|베팅}}합니다. 상대 {{t:bet|베팅}}의 약 {{n:xr.mult.example}} 크기로 {{t:check-raise|체크레이즈}}합니다. {{t:draw|드로우}}에는 이기는 길이 두 가지 있기 때문입니다: 상대가 바로 {{t:fold|폴드}}할 수 있고, 상대가 {{t:call|콜}}해도 여전히 {{t:draw|드로우}}를 완성할 수 있습니다. 한 트레이닝 사이트에 따르면 {{t:flush-draw|플러시 드로우}}와 양방향 {{t:straight|스트레이트}} 드로우는 {{t:check-raise|체크레이즈}}하기 좋은 핸드이며, 작은 {{t:c-bet|C벳}}에 대해서는 최소 크기가 아니라 약 {{n:xr.mult.example}} 크기로 {{t:raise|레이즈}}합니다."
      - action: call
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대가 작은 {{t:c-bet|C벳}}으로 {{t:bet|베팅}}합니다. {{t:call|콜}}도 좋습니다: 작은 {{t:c-bet|C벳}}에 대해서는 약 {{n:eq.bet-third}}의 에퀴티만 있으면 되고, 이 핸드는 좋아질 수 있습니다. 한 트레이닝 사이트에 따르면 모든 강한 {{t:draw|드로우}}를 {{t:raise|레이즈}}할 필요는 없지만, {{t:check-raise|체크레이즈}}는 상대가 바로 {{t:fold|폴드}}할 가능성을 더해 줍니다."
      - action: fold
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대가 작은 {{t:c-bet|C벳}}으로 {{t:bet|베팅}}합니다. {{t:fold|폴드}}는 너무 많은 것을 포기합니다: 작은 {{t:c-bet|C벳}}에 대해서는 약 {{n:eq.bet-third}}의 에퀴티만 있으면 되고, {{t:draw|드로우}}는 아직 좋아질 수 있습니다. 작은 {{t:c-bet|C벳}}에 대해서는 {{t:draw|드로우}}로 계속합니다: {{t:call|콜}}하거나 {{t:check-raise|체크레이즈}}합니다."
      - action: raise-small
        explanation: "당신은 {{w:pozycja}} 위치에서 {{w:reka}} 핸드를 들고 있고, {{t:board|보드}}는 {{w:stol}}이며, {{w:rywal}} 위치의 상대가 작은 {{t:c-bet|C벳}}으로 {{t:bet|베팅}}합니다. {{t:check-raise|체크레이즈}}는 좋은 생각이지만, {{t:c-bet|C벳}}의 약 {{n:xr.too-small.mult}} 크기는 너무 작습니다: 그러면 버튼은 {{t:call|콜}}하는 데 약 {{n:eq.vs-xr.too-small}}의 에퀴티만 필요하고, 모든 {{t:draw|드로우}}로 싸게 지불할 것입니다. {{t:c-bet|C벳}}의 약 {{n:xr.mult.low}}–{{n:xr.mult.example}} 크기로 {{t:raise|레이즈}}하며, {{t:c-bet|C벳}}이 작을수록 더 크게 {{t:raise|레이즈}}합니다."
