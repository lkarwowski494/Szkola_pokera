        explanation: "Hai {{w:reka}} in {{w:pozycja}}, il {{t:board}} è {{w:stol}}, e il tuo avversario in {{w:rywal}} fa {{t:check}} al turn. {{t:bet|Punti}} un {{t:second-barrel}} grande, perché una carta più alta del flop di solito aiuta un po' di più il {{t:range}} di chi {{t:open|apre}} che quello di chi difende: molte tue mani che hanno mancato il flop ora hanno una {{t:top-pair}}, e ogni {{t:pair|coppia}} dell'avversario è scesa di un posto. Su una carta così chi {{t:open|apre}} {{t:bet|punta}} più spesso, e la tua {{t:pair|coppia}} batte quelle {{t:pair|coppie}} peggiori."
