situation: "Un {{t:second-barrel}} sur une carte haute. Vous avez {{t:open|ouvert}} depuis le Bouton, et la {{t:big-blind}} a {{t:call|payé}}. Au flop, vous avez {{t:bet|misé}} petit avec un {{t:c-bet}}, et elle a de nouveau {{t:call|suivi}}. Au turn tombe une carte plus haute que les cartes du flop, qui vous donne une {{t:top-pair|top paire}}, et la {{t:big-blind}} fait {{t:check}}."
