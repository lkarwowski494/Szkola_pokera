id: sc-30
module: m10
situation: "Ein sehr enger Gegner macht eine {{t:3-bet}}. Du hast vom Button {{t:open|eröffnet}}, und der {{t:big-blind}} macht eine {{t:3-bet}}. Nimm an, dass dieser Gegner über mindestens etwa {{n:hud.hands.vpip.low}} Hände einen {{t:vpip}} von {{n:hud.ex.nit3bet.vpip.low}} bis {{n:hud.ex.nit3bet.vpip.high}} hat und dass seine {{t:3-bet}} innerhalb dieser Hände liegt."
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { expected: [fold], marginMin: 0.04 }
decisions:
  - street: preflop
    kind: nit-3bet
    rule: R-M2-005
    open: 2.5
    threeBet: 10
    vpips: [0.1]
    actions:
      - action: fold
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, {{w:stol}}, und dein Gegner im {{w:rywal}} macht eine {{t:3-bet}}. Du {{t:fold|foldest}}, denn wenn er etwa die stärksten {{n:hud.ex.nit3bet.vpip.low}}–{{n:hud.ex.nit3bet.vpip.high}} der Hände spielt, sind das vor allem {{t:pair|Paare}} und die besten Asse, und gegen sie hat deine Hand weniger Equity, als der Preis für einen {{t:call}} verlangt (vereinfacht, ohne das Spiel nach dem Flop). Nach der Annahme liegt seine {{t:3-bet}} innerhalb dieser Hände, also schneidet deine Hand gegen die {{t:3-bet}} selbst nicht besser ab."
      - action: call
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, {{w:stol}}, und dein Gegner im {{w:rywal}} macht eine {{t:3-bet}}. Vereinfacht, ohne das Spiel nach dem Flop, verliert ein {{t:call}}: Selbst gegen alle Hände, die dieser Gegner spielt, hat deine Hand weniger Equity, als der Preis für einen {{t:call}} verlangt, und nach der Annahme liegt seine {{t:3-bet}} innerhalb dieser Hände."
