    actions:
      - action: bet-big
        explanation: "Du hast {{w:reka}} am {{w:pozycja}}, das {{t:board}} ist {{w:stol}}, und dein Gegner im {{w:rywal}} {{t:check|checkt}}. Du {{t:bet|setzt}} etwa {{w:rozmiar}} des {{t:pot|Pots}}, weil derselbe Anteil des {{t:pot|Pots}} auf jeder {{t:street}} den ganzen Stack genau am River einzahlt. Gleich große {{t:bet|Bets}} sorgen in der Theorie dafür, dass dein Gegner am breitesten verteidigt und so am meisten in den {{t:pot}} einzahlt."
