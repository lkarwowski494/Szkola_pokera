    actions:
      - action: fold
        explanation: "Tem {{w:reka}} no {{w:pozycja}}, {{w:stol}}, e o adversário no {{w:rywal}} faz {{t:3-bet}}. {{t:fold|Desiste}}, porque, se ele joga só as mãos mais fortes, cerca de {{n:hud.ex.nit3bet.vpip.low}}–{{n:hud.ex.nit3bet.vpip.high}}, são sobretudo {{t:pair|pares}} e os melhores ases, e contra elas a sua mão tem menos equity do que o preço do {{t:call}} exige (de forma simplificada, sem o jogo depois do flop). Por pressuposto, o {{t:3-bet}} dele cabe dentro dessas mãos, por isso, contra o próprio {{t:3-bet}}, a sua mão não se sai melhor."
