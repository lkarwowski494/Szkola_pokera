# SC-29 (M10, KO-071): rywal pasywny — value bet najwyższą parą wobec szerokiego zakresu sprawdzenia (punkt river-value, 08-FD-4,
# D-1302, D-1417). Ocena: rachunek R-M8-001 (math), bet ⇔ w ≥ 0,5 + δ. Typ rywala podany w sytuacji progami R-M10-004 i R-M10-005
# ({{n:hud.vpip.loose}}, {{n:hud.gap.passive}}), więc warunek R-M10-006 (exploit, źródła z populacją w rejestrze) jest spełniony
# w treści zadania; zakres sprawdzenia to dana zadania (D-1300), wyjaśnienie mówi „tu”, a regułę typu cytuje tylko z R-M10-006.
# Szkic sesji FQ (D-1463). ZALEŻNOŚĆ: river-value bez widoku (D-1420, rola 04).
id: sc-29
module: m10
situation: "Na riverze masz {{t:top-pair|najwyższą parę}}, jesteś na Buttonie, a {{t:big-blind}} {{t:check|czeka}}. Rywal to pasywny {{t:recreational|gracz rekreacyjny}}: {{t:vpip}} od ok. {{n:hud.vpip.loose}}, a {{t:pfr}} niższy o ponad {{n:hud.gap.passive}} punktów. Załóż, że nie {{t:raise|przebija}}: {{t:call|sprawdzi}} z JJ, TT i z każdym AK, AQ, AJ, AT, KQ, KJ, QJ i JT, a {{t:fold|spasuje}} z każdym KT i QT. {{t:bet|Stawiasz}} czy {{t:check|czekasz}}?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { marginMin: 0.1, expected: ["bet"], flop: { height: [high] } }
decisions:
  - street: river
    kind: river-value
    rule: R-M10-006
    calls: [JJ, TT, AKs, AKo, AQs, AQo, AJs, AJo, ATs, ATo, KQs, KQo, KJs, KJo, QJs, QJo, JTs, JTo]
    folds: [KTs, KTo, QTs, QTo]
    pairKind: [top]
    actions:
      - action: "bet"
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:check|czeka}} na riverze. {{t:bet|Stawiasz}} {{t:value|dla wartości}}, bo ten rywal {{t:call|sprawdza}} tu także słabszymi rękami: ponad {{n:value.threshold}} rąk, które {{t:call|sprawdzą}}, to ręce gorsze od twojej. Przeciw pasywnemu {{t:recreational|graczowi rekreacyjnemu}} betujesz {{t:value|dla wartości}} więcej rąk, także cieńszych."
      - action: "check"
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:check|czeka}} na riverze. {{t:check|Czekanie}} oddaje tu wartość: ponad {{n:value.threshold}} rąk, które {{t:call|sprawdzą}}, to ręce gorsze od twojej, więc {{t:bet|zakład}} wygrywa od nich więcej, niż traci na lepszych. Przeciw pasywnemu {{t:recreational|graczowi rekreacyjnemu}} betujesz {{t:value|dla wartości}} więcej rąk, także cieńszych."
