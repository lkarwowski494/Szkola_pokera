# SC-22 (M8): wersja en szkicu pl (struktura identyczna). Nagłówek i zależności: `../pl/sc-22.yaml`.
id: sc-22
module: m8
situation: "On the river you have {{t:top-pair}}, you're on the Button, and the {{t:big-blind}} {{t:check|checks}}. Assume your opponent doesn't {{t:raise}}: they {{t:call}} with every AK, AQ, AJ and KQ, and {{t:fold}} every KJ, QJ and JT. Do you {{t:bet}} or {{t:check}}?"
table: 6max
positions: { hero: BTN, villain: BB }
stackBb: 100
levels: [latwy]
bounds:
  latwy: { marginMin: 0.05, expected: ["bet"], flop: { height: [high] } }
decisions:
  - street: river
    kind: river-value
    rule: R-M8-001
    calls: [AKs, AKo, AQs, AQo, AJs, AJo, KQs, KQo]
    folds: [KJs, KJo, QJs, QJo, JTs, JTo]
    pairKind: [top]
    actions:
      - action: "bet"
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}, and your opponent in the {{w:rywal}} {{t:check|checks}} the river. You {{t:bet}} for {{t:value}} because among the hands that will {{t:call}}, more are worse than yours than better (a tie splits the {{t:pot}} and doesn't change the math). Every {{t:call}} with a worse hand wins one {{t:bet}}, and every {{t:call}} with a better hand loses one. You count only the hands that will pay: when your opponent {{t:fold|folds}} a worse hand, you win the same {{t:pot}} you would have won by {{t:check|checking}}."
      - action: "check"
        explanation: "You have {{w:reka}} on the {{w:pozycja}}, the {{t:board}} is {{w:stol}}, and your opponent in the {{w:rywal}} {{t:check|checks}} the river. {{t:check|Checking}} gives up value here: among the hands that will {{t:call}}, more are worse than yours than better (a tie splits the {{t:pot}} and doesn't change the math), so a {{t:bet}} wins more from them than it loses to better ones. The hands that will {{t:fold}} don't change the math: after a {{t:check}} you would also win only the {{t:pot}} from them."
