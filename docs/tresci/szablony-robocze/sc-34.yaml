# SC-34 (M11): SZKIC, wrócił z content/ do szkiców (CS, D-825; icm-call poza ekranem, D-807/D-817).
# Warunki powrotu: (1) projekt widoku ICM roli 04 + wdrożenie 08 (bramka RODZAJE_NA_EKRANIE); (2) 06-tresci-002 (CQ): poziom trudny wymaga
# odpowiedzi odpornej na zakres all-inu SB z równowagi ICM albo nazwanego założenia. Wersje językowe: git show ad62a2d:content/<język>/scenarios/sc-34.yaml
# (11 języków, do przeglądu roli 09 przy powrocie).
# SC-34 (M11): bańka, duży blind wobec all-inu małego blinda przy 10 bb (F4, punkt icm-call). Ocena: rachunek R-M11-009
# (equity z kart wobec zakresu push.sb-10 i próg ICM z blindem gracza, CJ WYS-001); generator dopuszcza tylko parę SB–BB
# (bez martwych blindów trzecich graczy). Struktury wypłat: 3 graczy 60/40 i 4 graczy 50/30/20 (zawsze bańka).
# Poziom trudny: akcja ICM inna niż w grze o żetony (chipsDiffer). Rola 06, sesja CO, 2026-11-11.
id: sc-34
module: m11
situation: "Na {{t:bubble|bańce}} {{t:small-blind}} wchodzi {{t:all-in}}, a ty jesteś na {{t:big-blind|dużym blindzie}}."
table: 6max
positions: { hero: BB, villain: SB }
stackBb: 10
levels: [latwy, sredni, trudny]
bounds:
  latwy: { marginMin: 0.1, expected: [fold] }
  sredni: { marginMin: 0.05, marginMax: 0.15, expected: [call] }
  trudny: { marginMin: 0.01, marginMax: 0.1, chipsDiffer: true, expected: [fold] }
decisions:
  - street: preflop
    kind: icm-call
    spot: push.sb-10
    rule: R-M11-009
    actions:
      - action: fold
        explanation: "Masz {{w:reka}} na {{w:pozycja}} na {{t:bubble|bańce}}, {{w:stol}}, a {{t:small-blind}} wszedł {{t:all-in}}. {{t:fold|Pasujesz}}, bo w {{t:tournament|turnieju}} z {{t:payout|wypłatami}} przegrana kosztuje więcej pieniędzy, niż wygrana dodaje, więc {{t:call|sprawdzenie}} musi wygrywać częściej niż w grze o {{t:chips|żetony}}. Ta ręka ma wobec {{t:range|zakresu}} {{t:all-in|all-inu}} za mało {{t:equity}}, żeby przejść ten wyższy próg z {{t:icm}}."
      - action: call
        explanation: "Masz {{w:reka}} na {{w:pozycja}} na {{t:bubble|bańce}}, {{w:stol}}, a {{t:small-blind}} wszedł {{t:all-in}}. {{t:call|Sprawdzasz}}, bo ta ręka ma wobec {{t:range|zakresu}} {{t:all-in|all-inu}} więcej {{t:equity}}, niż wymaga próg z {{t:icm}}. Ten próg jest wyższy niż w grze o {{t:chips|żetony}}, bo w {{t:tournament|turnieju}} z {{t:payout|wypłatami}} przegrana kosztuje więcej pieniędzy, niż wygrana dodaje."
