# SC-27 (M9): pula 3-betowana in position, ręka na trzy ulice wartości: rozmiar geometryczny na flopie. SZKIC DY (2026-11-11).
# Czeka na: 08-N11 (punkt rozmiaru na flopie: bet-geo = geo.3bet-ip.3 puli wobec bet-small = cbet.size.small; ręka: set, strit,
# dwie najwyższe pary, R-M9-008). Warunek zrodla-krok-e.md §2 SC-27; R-M9-006 (math), R-M9-009 (math): bet-geo `compliant`, bet-small `inaccuracy`.
# Linia stała (SPR = spr.3bet-ip, stack 100 bb): CO otwiera, BTN (gracz) 3-betuje, CO sprawdza i na flopie czeka.
# Test akceptacji: ręka z evaluatora (set, strit, dwie pary z dwiema najwyższymi kartami stołu); rozmiar geo liczony formułą
# geometric(spr.3bet-ip, 3) niezależnie; 10 000 losowań, expected bet-geo w 100%.
id: sc-27
module: m9
situation: "{{t:3-bet|3-betowałeś}} z {{t:button|Buttona}} {{t:open|otwarcie}} z {{t:cutoff|CO}}, rywal {{t:call|sprawdził}}. Na flopie {{t:check|czeka}}, a ty masz bardzo silną rękę."
table: 6max
positions: { hero: BTN, villain: CO }
stackBb: 100
levels: [sredni, trudny]
bounds:
  sredni: { holding: [set, straight], expected: [bet-geo] }
  trudny: { holding: [top-two-pair], expected: [bet-geo] }
decisions:
  - street: flop
    kind: flop-size              # 08-N11 (propozycja nazwy)
    rule: R-M9-009
    actions:
      - action: bet-geo
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:check|czeka}}. {{t:bet|Stawiasz}} ok. {{n:geo.3bet-ip.3}} {{t:pot|puli}}, bo przy takim rozmiarze na każdej {{t:street|ulicy}} wchodzi cały stack, a trzy {{t:bet|zakłady}} po 1/3 {{t:pot|puli}} wpłacają tylko ok. {{n:g3b.third.total}} ze stacku {{n:spr.3bet-ip.stack}}."
      - action: bet-small
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:check|czeka}}. Mały {{t:bet}} to niedokładność: trzy {{t:bet|zakłady}} po 1/3 {{t:pot|puli}} wpłacają tylko ok. {{n:g3b.third.total}} ze stacku {{n:spr.3bet-ip.stack}}, więc większość stacku zostaje niewpłacona. Przy ok. {{n:geo.3bet-ip.3}} {{t:pot|puli}} na każdej {{t:street|ulicy}} wchodzi cały."
