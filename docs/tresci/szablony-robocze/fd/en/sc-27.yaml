id: sc-27
module: m9
situation: "A size that gets the whole stack in. On the Button you {{t:3-bet}} the open from the CO, and they {{t:call|called}}. On the flop you have a {{t:set}}, and the CO {{t:check|checks}}. Assume you want to get the whole stack in by the river with equal {{t:bet|bets}} on the flop, turn and river."
table: 6max
