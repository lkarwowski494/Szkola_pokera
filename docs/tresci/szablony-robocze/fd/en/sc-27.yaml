  sredni: { expected: [bet-big] }
  trudny: { expected: [bet-big], sprRange: [4, 8] }
decisions:
  - street: flop
    kind: flop-size
    mode: geometric
    rule: R-M9-009
    streets: 3
    small: 0.33
    actions:
      - action: bet-big
        explanation: "You have {{w:reka}} in the {{w:pozycja}}, the {{t:board}} is {{w:stol}}, and your opponent on the {{w:rywal}} {{t:check|checks}}. You {{t:bet}} about {{w:rozmiar}} of the {{t:pot}}, because the same fraction of the {{t:pot}} on every {{t:street}} gets the whole stack in exactly on the river. You have a hand for three {{t:street|streets}} of {{t:value}}, and in theory equal {{t:bet|bets}} make your opponent defend widest, so they put the most into the {{t:pot}}."
      - action: bet-small
        explanation: "You have {{w:reka}} in the {{w:pozycja}}, the {{t:board}} is {{w:stol}}, and your opponent on the {{w:rywal}} {{t:check|checks}}. A small {{t:bet}} won't get the stack in: three {{t:bet|bets}} of a third of the {{t:pot}} put in only part of it, for example in a {{t:3-bet}} {{t:pot}} with {{n:spr.3bet-ip.stack}} behind, only about {{n:g3b.third.total}}. To reach {{t:all-in}} on the river, you already {{t:bet}} the geometric size on the flop, about {{w:rozmiar}} of the {{t:pot}}."
