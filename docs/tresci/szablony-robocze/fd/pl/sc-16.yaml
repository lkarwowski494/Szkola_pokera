# SC-16 (M6): check-raise mocnym drawem wobec małego c-betu (proponowany punkt check-raise, 08-EX-7; warunki: ../warunki-hp.md).
# Ocena: raise-big compliant (R-M6-008, UP szczebel 4 → atrybucja w tekście), call acceptable (UP ep1, ręka mieszana), fold inaccuracy
# (R-M6-006, D-1301: nie draw-price), raise-small inaccuracy (rachunek R-M6-010). Ś bez raise-small, T z nim (D-1717). Szkic sesji HP.
id: sc-16
module: m6
situation: "Masz mocny {{t:draw}} wobec małego {{t:c-bet|c-betu}}. Jesteś na {{t:big-blind|dużym blindzie}} i {{t:call|sprawdziłeś}} {{t:open|otwarcie}} Buttona. Na flopie {{t:check|czekasz}}, a Button {{t:bet|stawia}} mały {{t:c-bet}}."
table: 6max
positions: { hero: BB, villain: BTN }
stackBb: 100
levels: [sredni, trudny]
bounds:
  sredni: { expected: [raise-big], actions: [fold, call, raise-big] }
  trudny: { expected: [raise-big], actions: [fold, call, raise-small, raise-big] }
decisions:
  - street: flop
    kind: check-raise
    rule: R-M6-008
    spot: vs-open.bb-vs-btn
    pots: [6, 9]
    fractions: [0.33]
    multipliers: { raise-small: 1.5, raise-big: 4.5 }
    actions:
      - action: raise-big
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:bet|stawia}} mały {{t:c-bet}}. Robisz {{t:check-raise}} do ok. {{n:xr.mult.example}} jego {{t:bet|zakładu}}, bo {{t:draw}} ma dwie drogi do wygranej: rywal może od razu {{t:fold|spasować}}, a gdy {{t:call|sprawdzi}}, nadal możesz trafić swój {{t:draw}}. Według serwisu szkoleniowego drawy do koloru i strity otwarte to dobre ręce do {{t:check-raise|check-raise'u}}, a wobec małego {{t:c-bet|c-betu}} przebijasz o ok. {{n:xr.mult.example}}, nie minimalnie."
      - action: call
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:bet|stawia}} mały {{t:c-bet}}. {{t:call|Sprawdzenie}} też jest dobre: wobec małego {{t:c-bet|c-betu}} potrzebujesz tylko ok. {{n:eq.bet-third}} equity, a ta ręka może się poprawić. Według serwisu szkoleniowego nie każdy mocny {{t:draw}} trzeba przebijać, ale {{t:check-raise}} dodaje szansę, że rywal od razu {{t:fold|spasuje}}."
      - action: fold
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:bet|stawia}} mały {{t:c-bet}}. {{t:fold|Pas}} oddaje za dużo: wobec małego {{t:c-bet|c-betu}} potrzebujesz tylko ok. {{n:eq.bet-third}} equity, a {{t:draw}} może się jeszcze poprawić. Wobec małego {{t:c-bet|c-betu}} kontynuujesz {{t:draw|drawami}}: {{t:call|sprawdzasz}} albo robisz {{t:check-raise}}."
      - action: raise-small
        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:bet|stawia}} mały {{t:c-bet}}. {{t:check-raise|Check-raise}} jest dobrym pomysłem, ale do ok. {{n:xr.too-small.mult}} {{t:c-bet|c-betu}} jest za mały: Button potrzebuje wtedy do {{t:call|sprawdzenia}} tylko ok. {{n:eq.vs-xr.too-small}} equity i tak tanio zapłaci każdym {{t:draw|drawem}}. Przebijasz ok. {{n:xr.mult.low}}–{{n:xr.mult.example}} {{t:c-bet|c-betu}}, tym więcej, im mniejszy {{t:c-bet}}."
