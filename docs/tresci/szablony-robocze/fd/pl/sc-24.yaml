        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:bet|stawia}} na riverze. {{t:fold|Pasujesz}}, bo twoje equity to udział {{t:bluff|blefów}} w jego {{t:bet|zakładach}}, a tu jest ich mniej, niż wynosi potrzebne equity przy tym {{t:bet|zakładzie}}. Przy {{t:bet|zakładzie}} wielkości {{t:pot|puli}} {{t:call|sprawdzenie}} wychodzi na zero dopiero przy ok. {{n:eq.bet-pot}} {{t:bluff|blefów}}."
