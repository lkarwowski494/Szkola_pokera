        explanation: "Masz {{w:reka}} na {{w:pozycja}}, na {{t:board|stole}} {{w:stol}}, a rywal z {{w:rywal}} {{t:bet|stawia}} na riverze. {{t:call|Sprawdzasz}}, bo twoje equity to udział {{t:bluff|blefów}} w jego {{t:bet|zakładach}}: wygrywasz z każdym {{t:bluff|blefem}}, przegrywasz z każdą ręką {{t:value|dla wartości}}. Tu {{t:bluff|blefów}} jest więcej, niż wynosi potrzebne equity przy tym {{t:bet|zakładzie}}, więc {{t:call|sprawdzenie}} zarabia."
