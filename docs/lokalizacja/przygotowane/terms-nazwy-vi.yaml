# Szkic K-05 (rola 09, przegląd V2, 2026-11-09): nazwa terminu w vi („bạn”) dla znacznika {{t:klucz}} bez formy.
# Źródło kandydatów: k05-kand-vi.tsv (najczęstsze formy {{t:klucz|forma}} w przekładzie vi); nazwy rozstrzygnięte na przeczytanych źródłach (V2-terminy.md, [A]–[E], [G]).
# NIE jest to jeszcze plik treści: sesja kodu przenosi go do content/vi/terms-nazwy.yaml po weryfikacji (D-367).
# Format wiersza: klucz: "nazwa"  # en; bez formy N; formy: forma×liczba …; źr.; [WIELE FORM] = tłumacz używa kilku form; [DO USTALENIA] = nazwa bez przeczytanego źródła (zostaje propozycja zgodna z przekładem/UI) albo źródło tylko częściowe
# Nazwy małą literą (jak es/de); znacznik bez formy na początku zdania renderuje się małą literą — pomiar w V2-terminy.md.
# Źródła (odczyt 2026-11-09): A = vi.wikipedia.org/wiki/Texas_hold_%27em; B = vi.wikipedia.org/wiki/Poker (→ „Xì tố”); C:<hasło> = ggpoker.com/vi/poker-basics/poker-terms/ (glosariusz, hasło angielskie + definicja wietnamska);
