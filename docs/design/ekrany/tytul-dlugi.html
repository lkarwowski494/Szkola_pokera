<!-- Sesja HQ (rola 04, 2026-11-16): reguła stylu długiego tytułu ekranu startu scenariusza (08-programista-503, decyzja właściciela „A”, D-1730).
     Teksty sytuacji: bazy treści apps/mobile/assets/content/tresc-595ef75ad5-{pl,de,ja}.db, tabela scenarios, pole situation (odczyt 2026-11-16);
     podział na tytuł i resztę jak podzielSytuacje (apps/mobile/src/features/scenariusz/zdanie.ts). Treść jest prawdziwa (z bazy), nie [PRZYKŁAD].
     Pozostałe teksty ekranu: klucze scenario.start.* z apps/mobile/src/i18n/locales/pl.json; „Moduł N”, poziomy i licznik jak w aplikacji.
     Rozmiary tytułu liczone jak sufitTytulu (apps/mobile/src/theme/skalowanie.ts:22): min(rozmiar × skala, max(maxW × szerokość, rozmiar)).
     Duży tekst: --dt-tytul i --dt-tresc = 3.12 (fontScale AX5 jak w aplikacji, D-1680), nie 1.8 z zrzuty.mjs: tytuły w aplikacji mnoży ten sam fontScale co treść. -->
<link rel="stylesheet" href="e3.css">
<link rel="stylesheet" href="scenariusz.css">
<style>
  /* tytuł: 28/34, sufit 10% szerokości; tytulDlugi: 20/25 (iOS title3), ten sam sufit (D-1731) */
  .sc-opis h1 { font-size: min(calc(1.75rem * var(--dt-tytul)), max(calc(var(--w) * 0.10), 1.75rem)); line-height: 1.2142; margin: 4px 0 8px; }
  .sc-opis h1.dlugi { font-size: min(calc(1.25rem * var(--dt-tytul)), max(calc(var(--w) * 0.10), 1.25rem)); line-height: 1.25; }
  .sc-opis p.reszta { font-size: var(--t-tresc); color: var(--ink); line-height: 1.41; margin: 0 0 8px; }
  .sc-opis p.modul { color: var(--muted); }
  /* jak aplikacja: Screen paddingHorizontal = odstep.l 16 pt (components/ui.tsx:23), bez dzielenia wyrazów (iOS RN) */
  .sc-opis { padding-left: 16px; padding-right: 16px; hyphens: manual; }
  @container style(--dt-tresc: 3.12) { .sc-opis { margin-left: 0; margin-right: 0; } }
  /* od AX1 tytuły krojem systemowym (D-122); tu AX5 = 3.12 */
  @container style(--dt-tytul: 3.12) { .sc-opis h1 { font-family: var(--tresc); } }
  :lang(ja) .sc-opis h1, :lang(ja) .sc-opis p { font-family: 'IPAGothic', sans-serif; }
  .podpis { width: var(--w); font: 13px/1.35 var(--tresc); color: #3a3f4a; margin: 0 0 6px; }
  .podpis b { color: #11141a; }
  figure { margin: 0; }
</style>
</head>
